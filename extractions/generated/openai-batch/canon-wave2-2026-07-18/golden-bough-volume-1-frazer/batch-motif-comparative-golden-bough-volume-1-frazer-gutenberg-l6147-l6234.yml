canonical_text:
  quote: ''
  summary: Frazer compares Adonis and Thammuz rites with Indian, Alexandrian, and
    European seasonal ceremonies. The passage describes Adonis as born from a myrrh-tree,
    alternating between lower and upper worlds, represented by rapidly withering planted
    gardens, and mourned in effigy. It also describes a Harran festival for Tâ-uz/Thammuz
    in which women mourn a slain god whose bones are ground in a mill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Alexandrian, Indian, and European ceremonies resemble
    one another and may admit a common explanation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the compared ceremonies, the marriage of two divinities is celebrated in
    effigy; the figures are associated with fresh plants, mourned over, and thrown
    into water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author identifies the death and resurrection of Adonis as a representation
    of the decay and revival of vegetation.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:4
  text: Adonis is said to be born from a myrrh-tree after the bark bursts following
    ten months of gestation; in one version a boar opens the bark with its tusk, and
    in another his mother Myrrh has been turned into the tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Adonis is said to spend half, or in another version one third, of the year
    in the lower world and the rest in the upper world.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage contrasts the vegetation interpretation with a solar interpretation,
    arguing that the sun's annual course does not fit a half-year or third-year death
    except in arctic regions not connected with Adonis worship in the passage.
  category: other
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Harran festival of el-Bûgât or Tâ-uz is held in the middle of Thammuz/July,
    and women bewail Tâ-uz because his lord is said to have slain him, ground his
    bones in a mill, and scattered them to the wind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: During the Tâ-uz festival the women avoid foods ground in a mill and eat items
    such as steeped wheat, sweet vetches, dates, and raisins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gardens of Adonis are baskets or pots of earth planted with wheat, barley,
    lettuces, fennel, and flowers, tended for eight days chiefly or exclusively by
    women; the plants grow quickly and then wither quickly because they have no root.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the end of eight days the gardens are carried out with images of the dead
    Adonis and flung into the sea or into springs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Athens, Adonis rites at midsummer are described with coffins, corpse-like
    effigies, and women wailing for the dead Adonis while a fleet sailed for Syracuse.
  category: setting
  evidence_refs:
  - ev:7
