canonical_text:
  quote: ''
  summary: The passage surveys Whitsuntide May-tree, May King, Grass King, and related
    village ceremonies in German and Bohemian localities. It describes spring processions,
    leafy disguises, ritual kings, begging or receiving food and drink, fertility
    actions involving branches placed in flax fields, and frog hanging or beheading
    interpreted by Frazer and Mannhardt as rain-charms, with comparison to Orinoco
    and German frog rain rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near Salzwedel, a May-tree is set up at Whitsuntide; boys race to it, and
    the first to arrive is made king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Salzwedel king wears a flower garland, carries a May-bush, sweeps away
    dew during the procession, sings good-luck wishes at houses, and asks for gifts
    such as eggs and bacon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Brunswick and Thüringen variants, a May King is enclosed in a May-bush
    or in a birch-covered wooden frame with a birch-and-flower crown and bell, then
    found, led back, and subjected to guessing by local authorities and others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Bohemian Whit-Monday rite, young men wear birch-bark caps with flowers;
    one is dressed as king and dragged on a sledge, which is overturned into a pool
    if one is passed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Bohemian village green, a crier lampoons households; afterward bark
    disguises are removed, and the group carries a May-tree through the village while
    begging gifts such as cakes, eggs, and corn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Grossvargula, a Grass King is encased in a poplar-branch pyramid with a
    branch-and-flower crown and rides in procession on horseback.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Grossvargula, the Grass King's green casing is stripped under seven lindens,
    the crown is given to the Mayor, and branches are placed in flax fields in order
    to make the flax grow tall.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near Pilsen, a doorless conical hut of green branches is built in the village,
    and a troop led by a king rides to it with a judge, a crier, and a Frog-flayer
    or Hangman.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near Pilsen, the crier circles the doorless hut, calls it possibly an enchanted
    castle, cuts a way into it with a sword, sits inside, and criticizes local people
    in rhyme.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near Pilsen, the Frog-flayer displays frogs in a cage, sets up a gallows,
    and hangs the frogs in a row.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near Plas, a king and soldiers are clad in bark with flowers and ribbons,
    carry swords, and ride horses decorated with green branches and flowers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Near Plas, a frog is secretly pinched until it quacks, sentenced to death
    by the king, beheaded by the hangman, and its body is thrown among the spectators;
    afterward the king is driven from the hut and pursued by soldiers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage reports Mannhardt's view that the frog pinching and beheading
    are a rain-charm, and compares this with Orinoco frog-beating for rain and with
    a German frog-killing rain-charm.
  category: other
  evidence_refs:
  - ev:7
