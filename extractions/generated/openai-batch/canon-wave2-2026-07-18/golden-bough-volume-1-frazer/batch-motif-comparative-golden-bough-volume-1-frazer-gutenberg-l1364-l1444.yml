canonical_text:
  quote: ''
  summary: Frazer surveys examples of sacred or divine kingship in Peru, Mexico, China,
    Parthia, and Egypt, then compares these patterns with the King of the Wood at
    Nemi, the Sacrificial King at Rome, and the King Archon at Athens. He argues that
    the King of the Wood is unlikely to have originated as an ordinary city king stripped
    of political power, because his abode and title connect him instead with the woods
    and with a possible class of departmental kings of nature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that claims to divine and supernatural powers by monarchs
    of Egypt, Mexico, and Peru are treated as survivals and extensions of an older
    apotheosis of living kings.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Incas of Peru are described as children of the Sun, revered like gods,
    and protected from offense against their persons, honour, property, or royal race.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inca sickness is described as a messenger from the father Sun calling his
    son to rest with him in heaven, and the Incas are said not to offer sacrifice
    for recovery in such cases.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mexican kings are said to swear at accession that they will make the sun shine,
    clouds give rain, rivers flow, and the earth produce abundant fruits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Chinese emperor is described as responsible for severe drought and, in
    extreme cases, as personally offering prayers and sacrifices to heaven as a high
    priest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Parthian Arsacid monarchs are said to style themselves brothers of the sun
    and moon, to be worshipped as deities, and to belong to a family whose members
    it was sacrilege to strike.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Egyptian kings are described as deified during life, worshipped in special
    temples by special priests, and sometimes honoured so highly that the worship
    of kings overshadowed that of gods.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Egyptian king is said to share blame for crop failure and to receive titles
    associating him with heaven, earth, the sun, life, time, harvest, breath, and
    corn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports Tiele's view that Egyptian ideas about becoming Osiris
    after death and assuming divine form by magic help explain why the living king
    could be placed on a level with deity.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the union of sacred functions with a royal title occurs
    in the King of the Wood at Nemi, the Sacrificial King at Rome, the King Archon
    at Athens, and frequently outside classical antiquity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage considers whether the King of the Wood could descend from a line
    of kings stripped of political power by a republican revolution, but says there
    are reasons to answer negatively.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The priest of Nemi is described as residing in a forest sanctuary by the lake
    shore, three miles from Aricia, rather than in the city.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The title King of the Wood is said to suggest a king of nature, specifically
    of the woods, and the passage proposes departmental kings of nature as a closer
    analogy than general divine kings.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
