  summary: The passage opens Frazer's chapter on killing the god. It presents examples
    of gods or creators thought to be mortal, dead, buried, or repeatedly revived,
    then develops a theory that a divine king or man-god may be killed before his
    strength fails so that his soul can be transferred to a vigorous successor and
    communal or cosmic decay avoided.
  language: English
  quote_policy: summarized
