  quote: ''
  summary: Frazer reviews and questions identifications of Osiris with the sun. He
    cites Diodorus's sun-and-moon account, Macrobius's broad solarizing interpretation
    of gods and eye-symbol argument, and Lepsius's evidence for Osiris-Ra, then explains
    such identifications within a wider account of Egyptian local cults and religious
    unification.
  language: English
  quote_policy: summarized
