canonical_text:
  quote: ''
  summary: Footnotes discuss arguments for identifying Osiris with the moon rather
    than the sun, including his twenty-eight-year reign, fourteen-piece dismemberment,
    lunar hymnic language, new- and full-moon rites, Apis, and pig sacrifice. The
    notes also state an author's view of Osiris as a vegetation god connected with
    popular beliefs about lunar effects on plant growth, report Macrobius's solar
    and lunar interpretations of several deities, and cite evidence for tree-associated
    Dionysus.
  language: English
  quote_policy: summarized
