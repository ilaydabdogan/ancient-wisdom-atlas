canonical_text:
  quote: ''
  summary: Frazer interprets Attis as originally a tree-spirit and vegetation deity,
    linking his pine-tree ritual, effigy, death and revival, corn imagery, food abstentions,
    and priestly representation to seasonal renewal and possible earlier sacrifice.
    The passage then introduces Osiris as another possible vegetation personification
    whose annual death and resurrection may be analogous to Adonis and Attis, while
    noting uncertainty and complexity.
  language: English
  quote_policy: summarized
