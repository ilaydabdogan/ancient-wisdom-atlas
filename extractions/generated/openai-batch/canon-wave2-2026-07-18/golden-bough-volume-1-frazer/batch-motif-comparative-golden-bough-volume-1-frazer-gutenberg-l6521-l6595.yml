  text: The passage says Attis’s character as a tree-spirit is shown by the pine-tree
    in his legend and ritual.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports stories that Attis was transformed into a pine-tree and
    that he was born of a virgin who conceived by placing a ripe almond or pomegranate
    in her bosom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pine-tree is described as brought in from the wood, decorated with violets
    and woollen bands, and associated with an effigy of Attis or the tree-spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage interprets attaching the effigy to the tree after mimic death
    and burial as a representation of Attis coming to life again in tree-form; the
    effigy is then kept for a year and burned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bathing of Cybele’s image is interpreted as probably a rain-charm and
    compared with throwing effigies of Death and Adonis into water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Attis is described as exercising power over corn or being identified with
    corn, and his suffering, death, and resurrection are interpreted as the cycle
    of ripe grain being reaped, stored, and sown again.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says Attis’s worshippers abstained from eating seeds and vegetable
    roots, and interprets this as avoiding sacrilegious consumption of the god’s life
    or body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Inscriptions are said to show that the high priest of Cybele at Pessinus and
    Rome was regularly called Attis; the author conjectures that the priest played
    Attis at the annual festival and drew blood from his arms on the Day of Blood.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage conjectures that a mimic killing of the priest, with real bloodshed,
    may have replaced an earlier human sacrifice, and cites an opinion that the god’s
    representative was probably slain each year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage introduces Osiris as a possible vegetation personification whose
    annual death and resurrection were celebrated, while warning that his character
    and rites are complex and difficult to sort out.
  category: attribute
  evidence_refs:
  - ev:9
