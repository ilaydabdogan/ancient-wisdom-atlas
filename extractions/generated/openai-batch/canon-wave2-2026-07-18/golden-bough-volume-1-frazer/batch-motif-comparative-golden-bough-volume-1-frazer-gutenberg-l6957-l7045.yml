  text: The passage says some recent writers identified Osiris with the sun because
    they thought his death fitted solar phenomena.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage allows that daily appearance and disappearance of the sun could
    be expressed as death and resurrection, but objects that Osiris's death was celebrated
    annually and that the sun is not naturally described as torn in pieces.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies annual growth and decay of vegetation as another natural
    phenomenon to which death and resurrection may be applied.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that ancient opinion grouped the worship and myths of Osiris,
    Adonis, Attis, Dionysus, and Demeter as religions of essentially the same type.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that some people of Byblus maintained that their mourning
    rites concerned Osiris rather than Adonis because the rites were so similar.
  category: speech
  evidence_refs:
  - ev:4
