canonical_text:
  quote: ''
  summary: Frazer rejects a solar interpretation of Osiris's death and resurrection
    in favor of an annual vegetation-cycle interpretation, citing ancient testimony
    that the rites of Osiris resembled those of Adonis, Attis, Dionysus, and Demeter.
    He then introduces Dionysus as a god of the vine, trees, cultivated fruit, and
    tree-associated cult images and titles.
  language: English
  quote_policy: summarized
