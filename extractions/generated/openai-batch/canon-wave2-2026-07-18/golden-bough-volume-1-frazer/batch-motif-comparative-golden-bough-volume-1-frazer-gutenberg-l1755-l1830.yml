    of the earth.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not describe the details of the sacrificial offerings.
- id: motif:7
  label: Plant companion necessary for rice growth
  taxonomy_refs:
  - seasonal_cycle
  basis: Some Dyaks preserve and replant roots of a flowering plant because rice is
