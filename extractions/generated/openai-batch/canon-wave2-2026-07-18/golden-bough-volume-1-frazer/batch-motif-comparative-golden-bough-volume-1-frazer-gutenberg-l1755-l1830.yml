canonical_text:
  quote: ''
  summary: Frazer describes a theoretical shift from viewing each tree as the body
    of a tree-spirit to viewing trees as dwellings of a movable supernatural being
    or forest god. He then surveys examples in which sacred trees, groves, branches,
    and preserved plants are credited with producing rain, sunshine, crop fertility,
    and harvest abundance through sacrifice, water-charms, procession, preservation,
    and replanting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a tree being viewed not as the body of a tree-spirit
    but as the spirit's dwelling-place, which the spirit can leave at will.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that this change marks animism passing into polytheism.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tree-spirit is described as able to pass from tree to tree, exercise lordship
    over trees, become a forest god, and assume a human body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Classical sylvan deities are described as depicted in human shape, with woodland
    character indicated by a branch or similar symbol.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Trees or tree-spirits are said to be credited with powers including rain,
    sunshine, animal multiplication, and easy childbirth; the passage then discusses
    rain, sunshine, and crops in detail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Lithuanian women are described as asking the Prince of Lithuania to stop Jerome
    of Prague from felling sacred groves, saying that the woods were the house of
    god from which they obtained rain and sunshine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among the Mundaris in Assam, felling a sacred-grove tree is said to anger
    sylvan gods, who then withhold rain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Cambodia, each village or province is said to have a sacred tree as the
    abode of a spirit, and people sacrifice to the tree if rains are late.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A branch is sometimes dipped in water to extort rain from the tree-spirit,
    and the passage interprets this as sympathetic magic involving a spirit immanent
    in the branch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: European customs of drenching festival trees at midsummer, Whitsuntide, and
    harvest are cited as rain-charms in Mannhardt's explanation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Tree-spirits and grove deities are described as making crops grow, being responsible
    for crops, or preserving the fruits of the earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Swedish peasants are described as placing a leafy branch in each furrow to
    ensure an abundant crop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The German and French Harvest-May is described as a decorated branch or tree
    with ears of corn, brought from the harvest-field and kept on a farmhouse or barn
    for a year.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The ancient Greek eiresione is described as an olive or laurel branch with
    ribbons and fruits, carried in harvest procession and fastened over a house door
    for a year.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The preservation of the Harvest-May or eiresione for a year is explained as
    maintaining the life-giving virtue of the bough for crop growth until the bough
    is replaced.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Some Dyaks of Sarawak are described as preserving roots of a bulbous flowering
    plant with rice and replanting them with seed-rice because rice is believed not
    to grow without such a plant in the field.
  category: action
  evidence_refs:
  - ev:8
