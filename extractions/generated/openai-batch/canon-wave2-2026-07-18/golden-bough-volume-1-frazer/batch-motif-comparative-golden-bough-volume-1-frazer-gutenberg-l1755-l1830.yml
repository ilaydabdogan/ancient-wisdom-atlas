comparison_claims:
- id: claim:1
  claim: The passage presents dipping a branch in water to obtain rain from a tree-spirit
    as functionally comparable to New Caledonian rain-makers pouring water on a skeleton
    so that a deceased soul may convert it into rain.
  claim_level: same_function
  target: New Caledonian rain-making with skeleton and deceased soul
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports functional analogy only; it does not claim historical
    contact, common inheritance, or identical ritual objects.
- id: claim:2
  claim: The passage reports Mannhardt's explanation that drenching European festival
    trees at midsummer, Whitsuntide, and harvest is a rain-charm comparable in function
    to water applied to a spirit-bearing branch.
  claim_level: same_function
  target: European festival-tree drenching customs
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim depends on the cited interpretation and does not establish
    origin or transmission.
- id: claim:3
  claim: 'The passage explicitly identifies the German Harvest-May and the ancient
    Greek eiresione as counterparts: decorated branches or trees associated with harvest
    and preserved for a year for crop growth.'
  claim_level: same_motif
  target: Ancient Greek eiresione compared with German Harvest-May
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage asserts counterpart status but does not claim historical
    contact or common inheritance.
- id: claim:4
  claim: The passage says the Dyak preservation and replanting of a flowering plant's
    roots follows a similar train of thought to preserving the Harvest-May or eiresione
    for crop growth.
  claim_level: same_function
  target: Dyak rice-harvest preservation of bulbous flowering plant roots
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and analogical; the plant is not described
    as a tree or as a named spirit.
