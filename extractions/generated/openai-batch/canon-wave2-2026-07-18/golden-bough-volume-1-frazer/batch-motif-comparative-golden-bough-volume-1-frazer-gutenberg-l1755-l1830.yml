candidate_motifs:
- id: motif:1
  label: Tree or grove as dwelling of a spirit or god
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage repeatedly frames trees, sacred trees, or groves as dwellings,
    abodes, or the house of a supernatural being.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The available taxonomy label includes an axis component not explicitly
    developed in the passage; the evidence supports the sacred-tree dwelling aspect.
- id: motif:2
  label: Tree-spirit becomes anthropomorphic forest god
  taxonomy_refs:
  - shapeshifter
  basis: The tree-spirit is described as disengaging from individual trees, changing
    shape, and assuming a human body while retaining tree-soul powers.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a scholarly explanatory model rather than a narrated mythic episode.
- id: motif:3
  label: Rain obtained through tree-spirit ritual
  taxonomy_refs:
  - sacred_exchange
  - sacred_tree_axis
  basis: Sacred groves and trees are treated as sources of rain and sunshine; rain
    may be withheld by sylvan gods, obtained through sacrifice, or elicited by dipping
    a branch in water.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage combines examples from multiple cultures in a comparative
    argument.
- id: motif:4
  label: Tree or branch embodies vegetation fertility
  taxonomy_refs:
  - seasonal_cycle
  - sacred_tree_axis
  basis: Grove deities, tall trees, leafy branches, Harvest-May, and eiresione are
    described as ensuring crops, fruits, or the growth of corn through a life-giving
    virtue.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The interpretation of embodiment is explicitly attributed to Mannhardt
    for the Harvest-May.
- id: motif:5
  label: Annual renewal of the life-giving harvest bough
  taxonomy_refs:
  - seasonal_cycle
  basis: The Harvest-May and eiresione are preserved for one year to foster crops
    and replaced when their virtue is exhausted.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents this as a comparative interpretation of harvest customs.
- id: motif:6
  label: Sacrifice at sacred tree for rain or crop preservation
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Cambodian people sacrifice to a sacred tree if rains are late, and people
