canonical_text:
  quote: ''
  summary: Frazer surveys beliefs that eating and drinking endanger the soul through
    the mouth, listing precautions that conceal meals, close houses, avoid hostile
    viewers, or prevent food remnants from being used magically. He then gives examples
    of royal eating and drinking taboos, followed by face- and mouth-veiling customs
    interpreted as protection against evil influences entering the body or the soul
    being harmed or escaping.
  language: English
  quote_policy: summarized
