canonical_text:
  quote: ''
  summary: Frazer compares Greek Demeter and Proserpine with European harvest figures
    such as the Corn-mother and harvest Maiden, argues that Greek mother-daughter
    divinities may derive from sheaf-doll and corn-spirit customs, compares the Demeter-Iasion-Plutus
    story with a West Prussian harvest mock birth, and interprets Proserpine’s descent
    and return as an agricultural image of seed-corn sown in autumn and sprouting
    in spring.
  language: English
  quote_policy: summarized
