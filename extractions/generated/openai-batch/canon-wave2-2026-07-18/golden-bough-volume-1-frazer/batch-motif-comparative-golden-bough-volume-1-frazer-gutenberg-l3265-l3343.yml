canonical_text:
  quote: ''
  summary: The passage compiles reports of beliefs that the soul may leave the body
    involuntarily or be taken by ghosts, demons, sorcerers, dead persons, or ancestors.
    It describes protective and healing rites among several communities, including
    tethering children during funerals, using bamboos and hooks to guide souls away
    from graves, recovering a baby’s “butterfly” soul with a mirror and cotton down,
    appeasing ancestors with food offerings, and restoring lost souls by dolls, cloths,
    puppets, music, procession, or a bonnet brought from a tomb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a soul’s departure may be involuntary and may be caused
    by ghosts, demons, or sorcerers extracting it from the body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a funeral passes a house, the Karens of Burma tie children with a special
    string to part of the house until the corpse is out of sight, to prevent the children’s
    souls from leaving their bodies and entering the corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a Karen grave, mourners use split bamboos and sticks to show their souls
    a way to climb out of the grave, keep the bamboos clear while earth is filled
    in, and carry the bamboos away while asking their souls to come with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On returning from the grave, a Karen calls his spirit to follow, makes a hooking
    motion with hooks made of branches, and thrusts the hooks into the ground to prevent
    the living soul from remaining with the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a Burmese rite after a mother’s death, a wise woman tries to recover a
    baby’s “butterfly” or soul by placing cotton down on a mirror, entreating the
    dead mother not to take the child’s soul, catching the slipping down in a cloth,
    and placing it on the baby’s breast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The same Burmese ceremony is said sometimes to be used when a dead playmate
    is thought to lure away a living child’s soul, and sometimes for a bereaved husband
    or wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Keisar it is considered unsafe to approach a grave at night because ghosts
    may catch and keep the passer-by’s soul.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Key Islanders are said to believe that ancestors who have not received
    food can make people sick by detaining their souls; food offerings are laid on
    the grave and the ancestors are asked to release or send home the soul of the
    sick person.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Bolang Mongondo, sickness is ascribed to ancestral spirits carrying off
    a patient’s soul, and the ritual aim is to bring the soul back and restore it
    to the sufferer.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Bolang Mongondo cure for a sick boy, priestesses make a cloth doll
    on a spear, dance and utter charms, suppose the boy’s soul has entered the doll,
    catch the soul in coloured cloths, place the cloth on the boy’s head, then chase
    and recapture the soul after it is said to escape.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: An Australian medicine-man is said sometimes to bring a sick man’s lost soul
    into a puppet and restore it by pressing the puppet to the patient’s breast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Uea, a soul-doctor with men and women goes to the graveyard; flutes and
    whistling lure the soul home, a procession leads and gently drives it along with
    open palms, and the soul is commanded to enter the patient’s body.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: In Madagascar, friends of a sick man go to the family tomb, ask the patient’s
    father’s soul to provide a soul, cover a hole with a bonnet, fold the soul into
    the bonnet, bring it to the patient, and have him wear it to receive a soul.
  category: action
  evidence_refs:
  - ev:11
