- id: motif:4
  label: Objects used as temporary soul containers or conduits
  taxonomy_refs: []
  basis: The passage describes cotton down, cloths, dolls, puppets, bamboos, hooks,
    and a bonnet as objects through which the soul is caught, guided, carried, or
    restored.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The precise ontological status of each object differs by reported rite;
    some guide the soul while others contain it.
- id: motif:5
  label: Food offering to ancestors for release of a soul
  taxonomy_refs:
  - sacred_exchange
  basis: Key Islanders lay food on a grave and ask ancestors to allow or drive home
    the soul of a sick person.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage reports an offering and plea, but does not spell out a formal
    exchange agreement.
- id: motif:6
  label: Grave as a danger zone for the living soul
  taxonomy_refs: []
  basis: The passage repeatedly locates soul danger or retrieval at graves, graveyards,
    corpses, or tombs, especially around funerals, nighttime grave visits, and ancestor
    rites.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not present all grave-related rites as identical; some
    are protective, some healing, and some supplicatory.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the Bolang Mongondo cloth-doll rite and the
    Australian puppet rite as similar ways of using an effigy-like object to receive
    and restore a sick person’s lost soul.
  claim_level: same_function
  target: Bolang Mongondo cloth doll on spear and Australian medicine-man puppet soul-restoration
    rite
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states functional similarity but gives no evidence of historical
    contact or common inheritance.
- id: claim:2
  claim: Across the cited examples, the passage presents a recurring pattern in which
    the living soul is vulnerable near death, graves, or ancestors and must be protected,
    retrieved, guided home, or restored to the body.
  claim_level: same_motif
  target: Cross-tradition soul-loss and soul-retrieval pattern in the passage
