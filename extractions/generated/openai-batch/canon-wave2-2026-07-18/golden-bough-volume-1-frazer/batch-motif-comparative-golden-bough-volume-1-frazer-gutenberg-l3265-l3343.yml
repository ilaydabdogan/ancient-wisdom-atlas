candidate_motifs:
- id: motif:1
  label: Involuntary departure of the soul
  taxonomy_refs:
  - departure
  basis: The passage explicitly frames the examples by saying the soul may depart
    involuntarily and be extracted from the body.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The taxonomy reference is applied to literal soul departure, not to a
    complete hero-departure narrative.
- id: motif:2
  label: Soul captured, detained, or lured by the dead or spirits
  taxonomy_refs: []
  basis: Several examples describe ghosts, dead mothers, dead playmates, ancestors,
    ancestral spirits, or souls of the dead as catching, keeping, detaining, stealing,
    luring, or carrying off living souls.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage groups heterogeneous reports from different communities; it
    does not establish a single historical origin.
