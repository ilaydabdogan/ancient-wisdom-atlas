canonical_text:
  quote: ''
  summary: Frazer describes beliefs that portraits, photographs, likenesses, or silhouettes
    may contain or carry away a person's soul, making the portrayed person vulnerable
    to death, illness, or control by the image's possessor. He gives examples from
    South America, Eastern Africa, North America, and Europe, then argues that similar
    concerns about protecting the soul help explain royal and priestly taboos as safeguards
    for kings whose lives were thought to affect the welfare of their people.
  language: English
  quote_policy: summarized
