canonical_text:
  quote: ''
  summary: 'Phaedrus and Socrates discuss Lysias, speech writing, political authorship,
    and whether writing is honorable or disgraceful. Socrates then invokes the midday
    grasshoppers: if he and Phaedrus sleep instead of converse, the grasshoppers might
    laugh, but if they keep talking like Odysseus resisting siren voices, the grasshoppers
    may grant divine gifts. Socrates recounts that grasshoppers were once humans who,
    after the Muses and song appeared, sang without eating or drinking until they
    died; they now live as grasshoppers, always singing, without hunger or thirst,
    and report to the Muses in heaven who honors them on earth.'
  language: English
  quote_policy: summarized
