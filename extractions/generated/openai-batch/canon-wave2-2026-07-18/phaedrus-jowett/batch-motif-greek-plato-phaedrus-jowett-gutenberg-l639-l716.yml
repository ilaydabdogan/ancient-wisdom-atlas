canonical_text:
  quote: ''
  summary: The passage describes true love of the mind as requiring purification,
    trial, and a kind of rebirth; imagines two souls united by duty and God, living
    in holy friendship or marriage, serving God and humanity, growing alike, gaining
    dove-like wings, dying in sequence, and being reunited in another state where
    they contemplate justice, holiness, truth, blessed souls, and creation. It then
    frames Plato’s discourse as adaptable to later religious feeling, explains Socrates’
    condemnation of earlier speeches as blasphemous toward the god Love, contrasts
    worldly interested love with divine eternal love, and introduces the following
    myth as a parable or partly true credible mythus.
  language: English
  quote_policy: summarized
