canonical_text:
  quote: ''
  summary: The passage describes the soul's long cycle of return, wing-growth, judgment,
    correction or heavenly reward, lot-drawing, and choice of new lives. It presents
    the philosopher or philosophical lover as one who recollects true being and beauty,
    is initiated into divine mysteries, is judged mad by ordinary people, and remembers
    a former vision with gods before embodiment in the body, described as a tomb or
    shell-like prison.
  language: English
  quote_policy: summarized
