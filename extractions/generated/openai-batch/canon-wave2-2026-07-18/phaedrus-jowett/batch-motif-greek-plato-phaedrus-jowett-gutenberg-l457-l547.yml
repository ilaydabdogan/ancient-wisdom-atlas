canonical_text:
  quote: ''
  summary: The passage is an introductory critical discussion of Plato's Phaedrus.
    It argues that the dialogue is not governed by a single idea, but loosely weaves
    together rhetoric, love, dialectic, true knowledge, and the superiority of speech
    over writing. It contrasts false and true rhetoric, describes love and dialectic
    as forms of inspired pursuit of knowledge, evaluates the first and second speeches
    attributed to Lysias and Socrates, and treats some attributed speeches or stories
    as Platonic literary inventions.
  language: English
  quote_policy: summarized
