canonical_text:
  quote: As wolves love lambs so lovers love their loves.
  summary: The passage closes a speech portraying the lover as faithless and predatory
    after passion fades. Socrates refuses to continue with praise of the non-lover,
    tries to leave across the river, is delayed by Phaedrus, and then reports that
    his usual divine sign or voice forbade departure until he atones for impious speeches
    about Eros. He affirms Eros as a god and son of Aphrodite, and cites Stesichorus'
    recantation after blindness for reviling Helen as a model of purgation.
  language: English
  quote_policy: quoted
