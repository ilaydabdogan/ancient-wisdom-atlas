canonical_text:
  quote: ''
  summary: 'The passage is introductory commentary on Plato''s Phaedrus. It argues
    for a comparatively late date, notes the story of Theuth and Thamus, and then
    highlights two passages: a discussion of mythology and the tale of the grasshoppers.
    The commentary says Plato rejects hidden allegorical interpretations of myth,
    values self-knowledge, and can still use poetry and mythology as vehicles of thought
    and feeling. It also notes an allusion to the serpent Typho and describes grasshoppers
    as lively chirruping figures who represent Athenians as children of the soil and
    report to the Muses in heaven about those who honor them on earth.'
  language: English
  quote_policy: summarized
