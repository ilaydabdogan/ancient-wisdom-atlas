canonical_text:
  quote: ''
  summary: The passage describes lovers as followers or attendants of different gods.
    Such lovers imitate the god they follow, choose a beloved according to their own
    divine model, and try to educate the beloved into likeness with that god. Zeus-followers
    seek a philosophical and imperial beloved; Ares-followers may become violent if
    wronged. The process is described as inspired love and as an initiation into the
    mysteries of true love.
  language: English
  quote_policy: summarized
