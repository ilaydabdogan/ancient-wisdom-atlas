canonical_text:
  quote: ''
  summary: Socrates resolves to make a recantation for reviling Love, invoking Stesichorus'
    recantation and restored sight. He criticizes earlier speeches against lovers,
    asks to cleanse his ears with spring water, and urges a new discourse preferring
    the lover over the non-lover. He then begins a defense of divine madness, giving
    examples from prophecy, etymology, ritual purification from inherited guilt, and
    poetic inspiration by the Muses.
  language: English
  quote_policy: summarized
