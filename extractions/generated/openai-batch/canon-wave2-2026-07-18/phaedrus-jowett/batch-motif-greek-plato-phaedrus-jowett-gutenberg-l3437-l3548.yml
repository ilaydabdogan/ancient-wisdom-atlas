canonical_text:
  quote: ''
  summary: Socrates and Phaedrus discuss rhetoric, probability, truth, and the difficulty
    of acquiring a true art of speaking. Socrates reports and critiques a probability-centered
    forensic method associated with Tisias, argues that knowledge of truth is needed
    to recognize likenesses of truth, and says the good speaker should aim to act
    and speak acceptably to God. The passage ends with Socrates introducing an ancient
    tradition about writing.
  language: English
  quote_policy: summarized
