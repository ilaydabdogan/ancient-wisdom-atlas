canonical_text:
  quote: ''
  summary: The passage describes a decline in Greek literature as an age of darkness,
    ignorance, scholasticism, commentary, and loss of classical works. It then considers
    whether modern literary decline might recur, personifies literature through a
    migrating Muse, asks whether an elixir could restore life and youth to national
    literature, and proposes broader, continuing education as a possible source of
    renewed intelligence, growth, and future gifts.
  language: English
  quote_policy: summarized
