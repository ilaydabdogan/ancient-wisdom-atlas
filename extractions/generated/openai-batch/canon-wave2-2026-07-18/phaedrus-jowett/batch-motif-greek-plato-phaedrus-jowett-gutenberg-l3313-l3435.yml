canonical_text:
  quote: Rhetoric is like medicine.
  summary: 'In dialogue with Phaedrus, Socrates argues that true rhetoric must be
    grounded in knowledge of nature, especially the nature of the soul. He compares
    rhetoric to medicine: as medicine studies the body to produce health, rhetoric
    must study the soul to produce conviction or virtue by suitable words and training.
    He outlines an analytical method for discerning whether a subject is simple or
    multiform, identifying its powers of acting and being acted upon, classifying
    souls and speeches, and applying arguments at the right time.'
  language: English
  quote_policy: quoted
