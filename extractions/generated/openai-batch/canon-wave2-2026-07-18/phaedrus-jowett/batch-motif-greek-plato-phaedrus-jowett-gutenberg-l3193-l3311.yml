canonical_text:
  quote: "“you only know the preliminaries of harmony and not harmony itself.”"
  summary: Socrates and Phaedrus discuss rhetoric. Socrates criticizes teachers who
    present rhetorical terminology, emotional effects, and formal devices as if these
    were the whole art. He compares this mistake to a would-be physician, tragedian,
    or harmonist who knows isolated techniques but lacks knowledge of proper use and
    arrangement. The passage concludes that true rhetoric requires natural ability
    assisted by art, knowledge, and practice, with Pericles named as an accomplished
    rhetorician.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Socrates names Polus as possessing rhetorical categories and says related
