  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Phaedrus says tragedy requires arranging its elements suitably to one another
    and to the whole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Socrates presents a would-be harmonist who knows the highest and lowest note;
    the corrective answer is that this knowledge is preliminary and not harmony itself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Socrates says Sophocles and Acumenus would identify the would-be tragedian’s
    and physician’s knowledge as preliminaries rather than the arts themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Socrates imagines Adrastus or Pericles saying that some teachers, lacking
