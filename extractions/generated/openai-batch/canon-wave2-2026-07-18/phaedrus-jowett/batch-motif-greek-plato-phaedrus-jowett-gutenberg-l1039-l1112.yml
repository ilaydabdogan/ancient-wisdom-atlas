  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts speech and writing through the image of the living and
    dead word; speech is described as more transitory, diffuse, elastic, and adaptable,
    while writing is more permanent, concentrated, and addressed to all the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Politicus comparison, the mind or will of the king is preferred to
    written law, and the king is described as Law personified and the ideal made Life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that what is truly written is written in the soul, and that
    what is truly taught grows up in the soul from within rather than being forced
    from without.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A little seed planted in congenial soil becomes a tree, and birds build nests
    in its branches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cited prayer asks for beauty in the inward soul and for the inward and
    outward man to be at one.
  category: speech
  evidence_refs:
