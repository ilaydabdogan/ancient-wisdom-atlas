- id: obs:7
  text: The passage compares Plato's language with St. Paul's statements about writing
    on fleshly tables of the heart and about epistles known and read by all men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says writing may preserve against old-age forgetfulness, but living
    as the book, epistle, embodied truth, or Word made flesh is higher.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes some later people as desiring closer communion, speaking
