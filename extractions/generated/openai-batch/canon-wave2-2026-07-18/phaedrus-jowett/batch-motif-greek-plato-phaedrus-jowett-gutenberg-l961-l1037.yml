canonical_text:
  quote: ''
  summary: Introductory commentary applies Socratic standards of truth, dialectic,
    and rhetoric to modern literature, art, law, politics, medicine, newspapers, theology,
    and the Church. It repeatedly contrasts truth and reality with appearances, popular
    opinion, mere persuasion, and unverified belief, using images such as a maze,
    chaos without Mind or Order, an organized body, returning master artists, and
    artistic birth.
  language: English
  quote_policy: summarized
