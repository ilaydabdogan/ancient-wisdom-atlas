canonical_text:
  quote: ''
  summary: Socrates tells Phaedrus an Egyptian account in which the god Theuth presents
    letters and other inventions to Thamus/Ammon, who judges writing to produce forgetfulness
    and only the appearance of wisdom. Socrates then cites Dodona oaks as prophetic
    speakers, compares writing to silent painting, contrasts written words with a
    living word in the soul, and develops an agricultural analogy for serious teaching
    versus recreational writing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Socrates describes Theuth as an old god of Naucratis, associated with the
    sacred Ibis, and as inventor of arts including arithmetic, calculation, geometry,
    astronomy, draughts, dice, and letters.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Theuth comes to Thamus/Ammon, king and god in Egypt, shows his inventions,
    and wants Egyptians to benefit from them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Theuth says letters will make Egyptians wiser and improve memory; Thamus replies
    that letters will cause forgetfulness, reliance on external written characters,
    and only the semblance of truth and wisdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Socrates cites a Dodona temple tradition in which oaks first gave prophetic
    utterances, and says earlier people accepted truth even from oak or rock.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Socrates says writing is like painting: both appear alive or intelligent,
    but remain silent or give only one answer when questioned.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Socrates says written speeches circulate among people who may or may not understand
    them, do not know to whom to reply, and cannot defend themselves without a parent.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Socrates contrasts written speech with an intelligent word graven in the learner’s
    soul, able to defend itself and know when to speak or be silent.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Socrates compares serious cultivation of knowledge to a husbandman sowing
    valued seeds in fitting soil and waiting eight months, not planting them in a
    garden of Adonis for quick beauty and amusement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Socrates says a knower of justice, goodness, and honour will not seriously
    write thoughts in water with pen and ink or sow words unable to speak for themselves
    or teach truth adequately.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Socrates says the garden of letters may be used for recreation and as memorials
    against old-age forgetfulness; Phaedrus calls serious talk about justice a noble
    pastime.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
