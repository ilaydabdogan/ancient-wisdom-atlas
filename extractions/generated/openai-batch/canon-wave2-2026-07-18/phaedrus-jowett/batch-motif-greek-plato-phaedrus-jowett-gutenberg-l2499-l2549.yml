canonical_text:
  quote: I divided each soul into three--two horses and a charioteer
  summary: The passage explains a soul as a charioteer with two horses, one obedient
    and one unruly. When the soul encounters the beloved, the unruly horse drives
    toward desire while the obedient horse and charioteer resist. The charioteer remembers
    true beauty with Modesty, pulls the horses back, repeatedly restrains and punishes
    the wild horse, and the lover’s soul thereafter follows the beloved in modesty
    and holy fear.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'Each soul is divided into three parts: two horses and a charioteer.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The right-hand horse is described as white, upright, cleanly made, honorable,
    modest, temperate, and guided by word and admonition rather than by the whip.
