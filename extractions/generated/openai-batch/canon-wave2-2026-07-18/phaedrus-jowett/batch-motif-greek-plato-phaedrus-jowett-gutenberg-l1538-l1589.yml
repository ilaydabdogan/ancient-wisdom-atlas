canonical_text:
  quote: ''
  summary: Socrates discusses a rationalizing account and variant locality for Orithyia
    being carried away by Boreas, rejects spending time on allegorical explanations
    of mythic monsters, turns instead to Delphic self-knowledge, and then describes
    a shaded, watery resting place sacred to Achelous and the Nymphs. Phaedrus identifies
    him as city-bound, and Socrates says books can draw him out into the country and
    around the world.
  language: English
