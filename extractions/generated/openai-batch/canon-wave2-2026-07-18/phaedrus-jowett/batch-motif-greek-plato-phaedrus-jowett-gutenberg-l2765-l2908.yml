canonical_text:
  quote: ''
  summary: Socrates and Phaedrus discuss whether rhetoric can be an art if it is separated
    from truth. Socrates uses a horse-and-ass analogy to show how persuasion based
    on ignorance can substitute appearances for reality and even confuse good with
    evil. Rhetoric is briefly personified as defending itself, while opposing arguments
    and a Spartan voice insist that true speaking requires truth and philosophy. The
    passage broadens rhetoric into an art of enchanting minds by arguments, making
    the same things appear opposite ways, and manipulating likenesses and differences;
    Socrates concludes that one who would deceive or avoid deception must know the
    true nature, likenesses, and differences of things.
  language: English
  quote_policy: summarized
