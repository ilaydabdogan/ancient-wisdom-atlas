canonical_text:
  quote: ''
  summary: An embedded speech argues that favours and friendship should not be governed
    by erotic passion alone, but by worth, reciprocity, discretion, and lasting benefit.
    Phaedrus praises the discourse and asks Socrates for judgment. Socrates admires
    the style but criticizes repetition, invokes earlier Greek authorities on love,
    describes himself as filled by another's wisdom like a pitcher with water, and
    discusses the commonplaces of speeches contrasting lovers and non-lovers.
  language: English
  quote_policy: summarized
