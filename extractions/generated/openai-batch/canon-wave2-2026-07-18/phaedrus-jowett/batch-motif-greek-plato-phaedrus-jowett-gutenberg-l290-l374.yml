  text: The charioteer repeatedly forces the bit from the unruly steed's clenched
    teeth, pulls the reins, causes blood and pain, and eventually the steed is tamed
    and humbled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the steed is tamed, the lover's soul follows the beloved in modesty
