  quote: ''
  summary: The passage summarizes Socrates' account of the soul as a charioteer with
    two steeds approaching the beloved, the struggle to restrain the unruly steed,
    the lovers' self-control, departure from the body, and acquisition of wings. It
    then shifts to Socrates' recantation, discussion of Lysias, good and bad rhetoric,
    the grasshoppers and Muses, truth in speech, and dialectical division and synthesis.
  language: English
  quote_policy: summarized
