canonical_text:
  quote: ''
  summary: Phaedrus presses Socrates to give a better speech than Lysias on whether
    a lover or non-lover should be preferred. Phaedrus swears by a plane-tree that
    he will withhold future discourses unless Socrates speaks. Socrates says he is
    conquered, plans to veil his face, invokes the Muses, and begins a tale of a fair
    youth courted by a cunning lover who claims to be a non-lover. The speech argues
    that good counsel requires defining love, then defines love as an irrational desire
    that overcomes reasoned opinion and is drawn toward beauty.
  language: English
  quote_policy: summarized
