canonical_text:
  quote: ''
  summary: The passage argues that great ancient and modern writers will continue
    to educate future generations. It presents expanding communication among nations
    as widening human thought, enabling reciprocal cultural exchange between East
    and West, and making world religions and literatures available to readers. It
    anticipates greater leisure, intellectual improvement, broader thoughts inspired
    by nature, love of mankind, reduced prejudice, better truth-seeking, and future
    revival or renaissance through remembrance of the past, denying that literature
    will die out.
