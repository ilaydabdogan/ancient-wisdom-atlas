canonical_text:
  quote: ''
  summary: The passage summarizes arguments about true rhetoric, truth, and the superiority
    of living speech to writing. It recounts an Egyptian tale in which Theuth presents
    writing to Thamus, who criticizes it as harmful to memory and understanding. It
    then uses images of pictures, illegitimate and legitimate offspring, and sowing
    seed in the soul to contrast written words with spoken philosophical teaching.
    The passage closes with messages to Lysias and Isocrates, prayer to Pan and the
    nymphs, departure, and a later discussion of the dialogue’s unity and date.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rhetoric is described as powerful in public assemblies, but its true art is
    said to require natural power aided by art and to be nearer to philosophy than
    to school-taught rhetorical technique.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'True rhetoric is compared to medicine: the rhetorician must consider the
    natures of souls as the physician considers bodies, and must know appropriate
    times and seasons for speech.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some professors are said to maintain that probability is stronger than truth,
    while the passage asserts that probability depends on likeness to truth and that
    the good man should please the gods rather than fellow-servants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old Egyptian tale is summarized in which Theuth, inventor of writing, shows
    his invention to the god Thamus, who says it will spoil human memory and understanding.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Writing is described as inferior to speech and is compared to a picture that
    cannot answer questions, uses the same words for all, and is called a bastard
    lacking a defender.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: An agricultural analogy contrasts sowing seed in a hot-bed or garden of Adonis
    with sowing in the natural soil of the human soul, where inner growth and fruit
    in minds are expected.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The conclusion states that a good orator must know truth and adapt it to others,
    and that the living spoken word is better than the written word.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Principles of justice and truth delivered by word of mouth are described as
    legitimate offspring of a man's bosom, with lawful descendants dwelling in others.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Phaedrus is to carry a message to Lysias from the local deities, Socrates
    will carry a similar message to Isocrates, and after a prayer to Pan and the nymphs
    Socrates and Phaedrus depart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The final part of the passage introduces controversies about the Phaedrus,
    especially its subject, date, and the question of literary unity in Platonic dialogues.
  category: other
  evidence_refs:
  - ev:8
