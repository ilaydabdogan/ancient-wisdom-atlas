canonical_text:
  quote: ''
  summary: Socrates and Phaedrus conclude their discussion of rhetoric, writing, and
    dialectic. Socrates contrasts written compositions with orally taught principles
    implanted in the soul, describes true discourse as living seed, sends a message
    from the Nymphs' fountain to writers and lawmakers, distinguishes philosophers
    from mere speech-makers, and begins to speak about Isocrates.
  language: English
  quote_policy: summarized
