canonical_text:
  quote: ''
  summary: 'The passage interprets Plato''s treatment of love in the Phaedrus, contrasting
    Lysias and Socrates, then develops a hypothetical modern Socratic argument against
    passionate marriage and in favor of friendship. It ends by correcting the anti-marriage
    argument through a palinode-like turn toward two kinds of love: higher and lower,
    holy and unholy, of mind and body.'
  language: English
  quote_policy: summarized
