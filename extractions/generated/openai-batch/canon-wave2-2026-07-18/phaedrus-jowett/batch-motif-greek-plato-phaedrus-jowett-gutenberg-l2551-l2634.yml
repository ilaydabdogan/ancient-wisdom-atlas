canonical_text:
  quote: ''
  summary: The passage describes a beloved who receives a loyal lover into communion,
    experiences reciprocal love through an overflowing stream of Desire associated
    with Zeus and Ganymede, and then faces contrasting outcomes depending on whether
    philosophy and self-control or lower ambition prevail. Disciplined love leads
    to harmony, wings, light, and a heavenward pilgrimage; worldly non-love leads
    to long earthly wandering and foolishness below. The speaker then addresses Eros
    in a recantation, asking forgiveness and renewed devotion to love and philosophical
    discourse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The beloved, after earlier turning away because of slander and fear of disgrace,
    is led at the appointed age and time to receive the lover into communion and intimacy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that fate ordains no friendship among the evil and enduring
