  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: If self-control and philosophy prevail, the pair live in happiness and harmony,
    master themselves, enslave vicious elements of the soul, and emancipate virtuous
    elements.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the disciplined outcome, when the end comes the pair are light and winged
    for flight and have conquered in a heavenly or Olympian victory.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the pair leave philosophy for the lower life of ambition, the wanton animals
    take the two souls when they are off guard and bring them together to fulfill
    desire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The less disciplined pair still regard themselves as having exchanged sacred
    pledges, avoid enmity, and pass out of the body unwinged but eager to soar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Those who have begun the heavenward pilgrimage do not go down again to darkness
    and the journey beneath the earth; they live in light and later receive matching
    wings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The attachment of the non-lover is said to breed vulgar qualities, send the
