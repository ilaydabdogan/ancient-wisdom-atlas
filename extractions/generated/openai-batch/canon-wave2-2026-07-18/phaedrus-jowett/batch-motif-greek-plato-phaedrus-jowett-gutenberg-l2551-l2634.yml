  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fountain or stream named Desire by Zeus when he loved Ganymede overflows
    upon the lover, enters his soul, flows out again, and returns to the beloved through
    the eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The returning stream of beauty quickens and waters the passages of the wings
    and fills the beloved's soul with love.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The beloved has love's image, Anteros, in his breast, calls the condition
    friendship rather than love, and desires to see, touch, kiss, and embrace the
    lover.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wanton steed of the lover asks the charioteer for pleasure, while the
