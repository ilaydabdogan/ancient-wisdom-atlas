canonical_text:
  quote: ''
  summary: 'Opening of the dialogue: Socrates meets Phaedrus, who has come from hearing
    Lysias. They discuss Lysias'' discourse on love and the hidden roll containing
    it, then choose a shaded place by the Ilissus. Phaedrus asks whether this is the
    place where Boreas was said to have carried off Orithyia; Socrates confirms the
    tradition and locates the spot lower down near a temple of Artemis and an altar
    of Boreas.'
  language: English
  quote_policy: summarized
