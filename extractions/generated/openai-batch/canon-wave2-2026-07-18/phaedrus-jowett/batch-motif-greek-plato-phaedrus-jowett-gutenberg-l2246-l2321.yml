canonical_text:
  quote: ''
  summary: The passage describes the wing of the soul as akin to the divine and nourished
    by beauty, wisdom, goodness, and truth. Zeus leads a heavenly procession of gods
    and demi-gods in winged chariots, while other souls struggle to follow, behold
    true being, and retain or lose their wings. Souls that fail to see truth fall
    to earth and enter human births ranked according to the degree of truth previously
    seen, with life treated as probation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wing is described as the corporeal element most akin to the divine and
    as naturally tending to lift what gravitates downward into the upper region, the
    habitation of the gods.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wing of the soul is nourished and grows by beauty, wisdom, goodness, and
    similar divine qualities, but wastes and falls away when fed by evil, foulness,
    and the opposite of good.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zeus holds the reins of a winged chariot, leads the way in heaven, orders
    and cares for all, and is followed by gods and demi-gods in eleven bands; Hestia
    alone remains at home in the house of heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods go to banquet and festival by moving up a steep path to the top of
    the vault of heaven; the divine chariots glide easily, while other chariots labor
    because a vicious steed weighs the charioteer earthward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The immortals, at the end of their course, stand outside heaven and behold
    what lies beyond; the passage identifies this realm with true being and realities
    visible only to mind.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The soul or intelligence capable of receiving proper nourishment rejoices
    in beholding reality and truth, sees justice, temperance, and absolute knowledge,
    feeds upon true existences, then returns into the heavens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the return, the charioteer puts up the horses at the stall and gives
    them ambrosia to eat and nectar to drink.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Other souls attempt to follow God, but with different degrees of success:
    some behold true being with difficulty, some rise and fall, and others remain
    below the surface in confusion, collision, sweat, and effort.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Many souls are lamed or have their wings broken through poor driving, fail
    to attain the mysteries of true being, and depart to feed upon opinion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The plain of truth contains pasturage suited to the highest part of the soul,
    and this pasturage nourishes the wing by which the soul soars.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A law of Destiny states that a soul attaining any vision of truth in company
    with a god is preserved from harm until the next period, while a soul that fails
    to follow and behold truth sinks under forgetfulness and vice, loses its wings,
    drops to the ground, and first enters human birth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Human births are ranked by how much truth the soul has seen, from philosopher
    or artistic and loving nature through king, warrior, politician, physician, prophet,
    poet, artisan, sophist, demagogue, and tyrant; these lives are called states of
    probation in which righteous action improves one's lot and unrighteous action
    worsens it.
  category: sequence
  evidence_refs:
  - ev:8
