canonical_text:
  quote: ''
  summary: In dialogue with Phaedrus, Socrates frames the place and his speech as
    holy and inspired, then argues that a passion-driven lover harms the beloved by
    fostering ignorance, weakness, social isolation, property loss, dependence, disgust,
    and surveillance.
