literal_observations:
- id: obs:1
  text: Socrates asks Phaedrus to listen in silence, says the place is holy, and says
    he may appear to be in a divine fury and dithyrambic style.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Socrates says responsibility rests with Phaedrus, that the fit may be averted,
    and that all is in the hands of powers above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Socrates states that he will inquire into the advantage or disadvantage that
    may come from the lover or non-lover to the one who accepts their advances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lover is described as ruled by passions and pleasure, wanting the beloved
    to be agreeable to himself and reducing him to inferiority.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The lover is said to encourage or implant mental defects, become jealous,
    keep the beloved from society that would give wisdom, banish divine philosophy,
    and make the beloved ignorant and dependent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The lover is described as choosing and training a delicate, soft, luxurious,
    and physically untested beloved rather than a sturdy and strong one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Such a physically untrained beloved is said to become an anxiety to friends
    and lover in war or great crises, rather than a terror to enemies.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The lover is said to wish to deprive the beloved of father, mother, kindred,
    friends, gold, silver, property, wife, children, and home, because these hinder
    possession or management of the beloved.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Flatterers and courtesans are mentioned as hurtful but temporarily pleasant
    figures, while the lover is described as both hurtful and disagreeable.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A proverb about birds of a feather is used to support the idea that equality
    of years and similarity beget friendship.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The lover is described as old and unlike the young beloved, forcing himself
    on him day and night under necessity and the sting of desire.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The beloved is described as disgusted by daily contact with the old lover,
    jealous watching, misplaced praise, and inappropriate censure, especially when
    made public by the lover’s drunkenness.
  category: attribute
  evidence_refs:
  - ev:12
