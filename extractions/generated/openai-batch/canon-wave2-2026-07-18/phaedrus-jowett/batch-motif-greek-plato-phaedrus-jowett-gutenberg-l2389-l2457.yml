canonical_text:
  quote: ''
  summary: The passage describes beauty as visible through sight, contrasts the corrupted
    or uninitiated person with the recently initiated spectator of heavenly beauty,
    and explains erotic love as the soul’s painful and joyful regrowth of wings when
    it sees a beloved who reflects divine beauty. The lover reveres the beloved, seeks
    nearness to him, and the state is identified as love, with a cited divine name
    connecting love to wings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beauty is described as having been seen among celestial forms and as appearing
    on earth through sight, the clearest bodily sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wisdom is said not to be seen by bodily sight, unlike beauty, which is called
    palpable to sight.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who is not newly initiated or has become corrupted does not easily
    rise from this world to the sight of true beauty, and instead pursues bodily pleasure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A recently initiated person who has seen glories in the other world is amazed
    by a godlike face or form expressing divine beauty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The recently initiated lover shudders, feels awe, reveres the beloved as godlike,
    and would sacrifice to the beloved as to an image of a god if not afraid of seeming
    mad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: While gazing, the lover receives an effluence of beauty through the eyes,
    causing heat, perspiration, moistening of the wing, and growth of the wing in
    the soul.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The whole soul is said once to have been winged, and the renewed wing growth
    is compared to the discomfort of cutting teeth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the beloved’s beauty meets the soul’s eye, warm moving particles flow
    toward the soul, producing what the passage calls emotion, and the soul is refreshed
    and joyful.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When separated from the beloved, the soul’s moisture fails, the wing passages
