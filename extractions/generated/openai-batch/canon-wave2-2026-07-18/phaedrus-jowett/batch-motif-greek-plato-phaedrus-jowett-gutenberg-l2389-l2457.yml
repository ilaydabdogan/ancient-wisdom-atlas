    sleepless, and restless.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The soul runs wherever it thinks it will behold the beautiful one.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the soul sees the beloved and bathes in the waters of beauty, its constraint
    is loosened and its pains cease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The lover will not forsake the beautiful one, esteems him above all, neglects
    family, companions, property, and proprieties, and seeks to sleep near him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The desired one is called the object of the lover’s worship and the physician
