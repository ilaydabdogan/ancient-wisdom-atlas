canonical_text:
  quote: Beloved Pan, and all ye other gods who haunt this place
  summary: Socrates praises Isocrates as surpassing Lysias and as possessing divine
    inspiration toward higher philosophical things. After Phaedrus suggests departing,
    Socrates proposes a prayer to the local deities, addresses Pan and the other gods
    of the place, asks for inward beauty, unity of outward and inward self, wisdom
    as wealth, and only as much gold as a temperate person can bear. Phaedrus asks
    for the same prayer, and Socrates says they should go.
  language: English
  quote_policy: quoted
