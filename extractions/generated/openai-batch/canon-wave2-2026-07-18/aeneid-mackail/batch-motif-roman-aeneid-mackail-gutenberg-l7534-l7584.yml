canonical_text:
  quote: ''
  summary: 'Latona''s daughter recounts Camilla''s origin to Opis: Metabus fled with
    the infant Camilla, dedicated her to the woodland goddess, sent her across a flooded
    river bound to a spear, raised her in the wild as a hunter-warrior, and now asks
    Opis to avenge any wound to Camilla and promises burial for her body and arms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the heavenly dwellings, Latona's daughter addresses Opis, one of her maiden
    sacred band, and speaks sadly about Camilla going to fierce war.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says Camilla is especially dear to her and that Camilla's love
    of Diana is long-standing rather than sudden.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Metabus, driven from his kingdom, leaves ancient Privernum with his infant
    daughter during flight through war and battle, naming her Camilla after her mother
    Casmilla with a slight change.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While pursued near a lonely woodland ridge, Metabus reaches the swollen Amasenus
    river, whose banks are full after heavy rain.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Metabus ties the infant Camilla, wrapped in cork-tree bark, to the middle
    of his oak spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Metabus prays to the maiden daughter of Latona, devoting the child to her
