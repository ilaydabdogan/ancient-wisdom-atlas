canonical_text:
  quote: ''
  summary: Aeneas and allied Teucrian and Tyrrhene forces approach by the Tiber, throwing
    the Latin town into alarm. Turnus orders military preparations, while Latinus
    regrets not having welcomed Aeneas. The city is fortified and women pray to Pallas
    for divine aid. Turnus arms himself, Camilla offers to engage the enemy cavalry,
    and Turnus assigns her command while he takes position for an ambush in a wooded
    gorge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas moves from his camp to battle as a messenger reports that Teucrian
    and Tyrrhene forces are marching by the Tiber and filling the plain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The report causes confusion and alarm in the royal house and town, and the
    crowd reaches for arms while older men weep and mutter.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Turnus rebukes the citizens for sitting in council and praising peace, then
    orders Volusus, Messapus, Coras and his brother, and other divisions to arm, ride
    out, defend gates and towers, and attack under his command.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Latinus leaves the council during the emergency and reproaches himself for
    not having welcomed Aeneas and made him a son and bulwark of the city.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some defenders entrench gates and bring stones and poles, a war clarion sounds,
    and boys and matrons form a ring around the walls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The queen, a crowd of mothers, and Lavinia ascend to Pallas' temple with gifts
    and incense and pray that the goddess break the enemy spear and cast the foe beneath
    the gates.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Turnus arms himself with breastplate, greaves, and sword and runs down from
    the fortress height, with his movement compared to a horse freed from its tether.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Camilla meets Turnus at the gateway with the Volscian array, dismounts, and
    offers to engage Aeneas' cavalry and the Tyrrhene horse while Turnus guards the
    city on foot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Turnus praises Camilla, says Aeneas has divided his forces, and assigns Camilla
    to fight the Tyrrhene cavalry with Messapus, the Latin squadrons, and Tiburtus'
    division.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Turnus advances to a curved glen with thick foliage, a narrow gorge, a hidden
    level on the hilltop, and positions suitable for attack or rolling down stones,
    and occupies the woods.
  category: setting
  evidence_refs:
  - ev:6
