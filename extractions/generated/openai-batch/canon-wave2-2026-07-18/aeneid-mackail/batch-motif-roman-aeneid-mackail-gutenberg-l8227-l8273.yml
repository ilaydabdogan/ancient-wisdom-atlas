canonical_text:
  quote: ''
  summary: Aeneas leads his forces from the camp, causing fear among the opposing
    Latins and Rutulians. His army advances in destructive battle order and named
    warriors fall. Aeneas seeks Turnus rather than fugitives. Juturna removes Turnus'
    charioteer, takes Metiscus' appearance and place, and drives Turnus' chariot away
    from Aeneas. Messapus hurls a spear that knocks the crest from Aeneas' helmet.
    Aeneas invokes Jove and the altars of the violated treaty, then enters the enemy
    lines in anger.
  language: English
  quote_policy: summarized
