canonical_text:
  quote: ''
  summary: Juno, angry that Aeneas and the Trojans have survived Troy, the sea, and
    divine opposition, resolves to stir up Acheron if heaven cannot stop him. She
    accepts that Aeneas is destined for Latium and Lavinia, but plans delay, bloodshed,
    and war. She summons the Fury Allecto from the underworld and orders her to break
    the peace and seed armed conflict. Allecto goes to the Laurentine royal house,
    infects Amata with a snake from her hair, and Amata begins arguing tearfully against
    Lavinia’s marriage to the Trojan stranger, invoking Turnus and the precedent of
    Paris and Helen.
  language: English
  quote_policy: summarized
