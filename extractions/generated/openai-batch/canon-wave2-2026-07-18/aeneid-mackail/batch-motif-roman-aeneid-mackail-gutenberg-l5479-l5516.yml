canonical_text:
  quote: ''
  summary: Evander laments lost youth, recalls slaying the triple-lived Erulus, prays
    that Pallas may return safely, and is carried within after swooning at the final
    parting. Aeneas, Achates, Pallas, and the cavalry depart, watched by fearful mothers;
    they travel through brushwood toward a revered grove by the river of Caere, consecrated
    to Silvanus, near the camp of Tarchon and the Tyrrhenians.
  language: English
  quote_policy: summarized
