canonical_text:
  quote: ''
  summary: Aeneas begins recounting the sack of Troy. He describes the Greeks building
    a vast wooden horse, hiding armed men inside, pretending it is a votive object,
    and withdrawing to Tenedos. The Trojans debate whether to admit, destroy, or inspect
    it. Laocoön warns against trusting Greek gifts and strikes the horse, revealing
    its hollow interior, but his warning is not acted upon. A bound Greek, Sinon,
    is then brought before the king and begins a deceptive lament and story that changes
    the Trojans’ response.
  language: English
  quote_policy: summarized
