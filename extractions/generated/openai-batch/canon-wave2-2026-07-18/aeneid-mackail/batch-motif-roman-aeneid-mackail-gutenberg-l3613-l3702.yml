canonical_text:
  quote: ''
  summary: Aeneas and Achates leave the cavern and find Misenus dead on the shore.
    The Trojans prepare wood, Aeneas seeks the golden bough, and twin doves lead him
    to the shining branch, which he breaks off. The Trojans perform Misenus' funeral
    rites and raise a tomb. Aeneas then follows the Sibyl's ordinance at the cave
    of Avernus, where chthonic sacrifices are made; ominous signs appear, the Sibyl
    commands the unsanctified to withdraw, and Aeneas follows her into the cavern.
    The narrator invokes the powers of the underworld before recounting what lies
    beneath the earth.
  language: English
  quote_policy: summarized
