canonical_text:
  quote: ''
  summary: 'Aeneas proceeds through the underworld fields of warriors, where Trojan
    and allied dead gather around him while Greek enemies flee. He meets the mutilated
    shade of Deiphobus, who recounts his betrayal and death during Troy’s fall. The
    Sibyl interrupts to guide Aeneas at a fork: the right road leads toward Elysium
    under Dis’ city, while the left leads to punishment in hell. Deiphobus withdraws
    back into darkness.'
  language: English
  quote_policy: summarized
