canonical_text:
  quote: ''
  summary: Aeneas prepares for a treaty-bound combat and instructs his companions.
    At dawn, Rutulian, Teucrian, and allied forces prepare a ritual field with altars,
    fire, water, and spectators. From the Alban mountain, Juno warns Juturna that
    Turnus faces doom and urges her to save him or disrupt the treaty. Latinus, Turnus,
    Aeneas, and Ascanius enter the ritual space; sacrificial animals and offerings
    are set at the altars. Aeneas and Latinus swear treaty terms before divine and
    cosmic witnesses, including terms for withdrawal, equal law, worship, command,
    foundation, and enduring peace.
  language: English
  quote_policy: summarized
