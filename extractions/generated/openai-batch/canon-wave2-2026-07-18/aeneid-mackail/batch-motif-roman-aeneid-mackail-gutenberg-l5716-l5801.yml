canonical_text:
  quote: "“You, go free; go, goddesses of the sea; the Mother bids it.”"
  summary: A divine sign and voice protect the Trojan ships from Turnus by sending
    them into the sea, where they rise as maiden-faced sea goddesses. Turnus interprets
    the portent as a loss for the Trojans and urges an open assault on their camp.
    Night watches and defenses are arranged. Nisus and Euryalus, bound companions
    on gate duty, discuss a dangerous mission to reach Aeneas.
  language: English
  quote_policy: quoted
