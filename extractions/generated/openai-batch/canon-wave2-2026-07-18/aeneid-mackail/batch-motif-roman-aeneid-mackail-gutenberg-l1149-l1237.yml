    and toppled onto Greek ranks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Pyrrhus appears at the front doorway in gleaming arms and is compared to a
    snake emerging into daylight after winter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Periphas, Automedon, and Scyrian men accompany Pyrrhus; some climb the roof
