candidate_motifs:
- id: motif:1
  label: captive woman dragged from sanctuary and attempted rescue
  taxonomy_refs: []
  basis: Cassandra is removed from Minerva's sanctuary in bonds, and Coroebus rushes
    into combat after seeing her.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage shows captivity and rescue attempt, but does not state a romantic
    relation or successful rescue.
- id: motif:2
  label: fatal misrecognition through disguise in battle
  taxonomy_refs: []
  basis: Trojan fighters using Greek-looking arms and crests are struck by their own
    people and later recognized by Greeks through shields, weapons, and speech.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a battle stratagem and misrecognition pattern; no broader taxonomy
    reference is assigned.
- id: motif:3
  label: last defense of a besieged royal house
  taxonomy_refs: []
  basis: Priam's house becomes the focus of battle; defenders use parts of the house
    as weapons while attackers press doors, walls, and thresholds.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The motif is local to the palace siege within the sack of Troy.
- id: motif:4
  label: serpentine image of the attacking warrior
  taxonomy_refs:
  - serpent
  basis: Pyrrhus is explicitly compared to a snake emerging after winter, shining
    in youth, with upraised breast and flickering tongue.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The serpent element is a simile applied to Pyrrhus rather than an actual
    serpent episode.
- id: motif:5
  label: fire and armed occupation in city ruin
  taxonomy_refs: []
  basis: The passage invokes the death flames of Ilium, flames hurled on the palace
    roof, and Greek possession of what fire does not take.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage presents urban and palace destruction by fire, not a cosmic
    or world-ending fire.
- id: motif:6
  label: inundating army compared to a river breaking banks
  taxonomy_refs: []
  basis: The Greek entry after the gate's fall is compared to a foaming river bursting
    its banks and sweeping across the plains.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The flood-like image is a simile for military force; the passage does
    not present a literal flood or renewal episode.
- id: motif:7
  label: royal blood at consecrated altar fires
  taxonomy_refs: []
  basis: Aeneas sees Priam polluting the altar fires of his own consecration with
    his blood during the palace's fall.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives altar blood imagery but does not frame the death as
    a formal sacrifice in this excerpt.
