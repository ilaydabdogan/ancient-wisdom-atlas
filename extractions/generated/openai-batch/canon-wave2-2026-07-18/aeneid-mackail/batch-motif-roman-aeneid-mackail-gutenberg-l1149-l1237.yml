canonical_text:
  quote: '"where the fire fails the Greeks are in possession."'
  summary: During the sack of Troy, Cassandra is dragged from Minerva's sanctuary,
    Trojan fighters are overwhelmed amid misrecognition and battle, and Aeneas moves
    toward Priam's besieged house. The palace is attacked with ladders, flames, and
    a battering ram; Pyrrhus breaks through the doors, the Greeks pour in, and Aeneas
    witnesses the ruin of Priam's household, including Priam's blood at the altar
    fires and the destruction of the bridal chambers.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Cassandra, daughter of Priam, is dragged from the temple and sanctuary of
    Minerva with disordered hair, upward-straining eyes, and fettered hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coroebus reacts to Cassandra's capture by rushing into the enemy columns,
    and the Trojans follow him in a massed charge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Trojan fighters are struck from a high temple roof by their own people because
    their armor and Greek crests cause mistaken recognition.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Greek forces gather in response to the attempted rescue, recognize the false
    shields and alien speech, and overwhelm the Trojans by numbers.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Coroebus is killed by Peneleus at the altar of the goddess; Rhipeus falls;
    Hypanis and Dymas are pierced by friendly hands; Panthus also falls despite his
    goodness and Apollo's fillet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Aeneas, Iphitus, and Pelias withdraw from the fighting and are called by the
    clamor toward Priam's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Priam's house, Greek attackers use ladders, shields, and a columned assault
    against the beleaguered threshold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dardanian defenders tear down turrets, roof covering, and gilded beams of
    the ancestral house to use as weapons in a last defense.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A blind doorway and solitary postern in Priam's halls is described as a route
    formerly used by Andromache when bringing Astyanax to Priam.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Aeneas reaches a ridge where Trojan hands hurl ineffectual weapons, and a
