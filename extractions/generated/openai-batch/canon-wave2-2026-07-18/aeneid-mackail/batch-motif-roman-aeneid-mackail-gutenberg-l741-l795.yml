canonical_text:
  quote: ''
  summary: Cupid obeys Venus, sets aside his wings, and takes on Iulus' manner while
    Venus lulls Ascanius and removes him to her Idalian groves. At Dido's feast, the
    disguised Cupid arrives with gifts, fascinates the Tyrians and Dido, and instills
    new love in her. Dido performs a wine libation invoking Jupiter, Bacchus, and
    Juno. Iopas sings cosmological songs taught by Atlas, and Dido asks Aeneas to
    recount Trojan events and his wanderings.
  language: English
  quote_policy: summarized
