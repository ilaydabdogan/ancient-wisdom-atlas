canonical_text:
  quote: ''
  summary: 'A catalogue of Italian leaders and peoples assembling for war: twin brothers
    from Tibur, Caeculus of Praeneste, Messapus, Clausus, Halaesus, Oebalus, Ufens,
    and Umbro are described with genealogies, divine or supernatural parentage, regional
    contingents, weapons, animal and nature similes, and Umbro''s serpent-charming
    powers that fail against a Dardanian spear wound.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twin brothers Catillus and Coras leave Tibur and advance in the forefront
    of battle among spears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The twin warriors are compared to two cloud-born Centaurs descending from
    a lofty mountain peak, Homole, or snowy Othrys, while forests and thickets give
    way before them.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Caeculus is identified as founder of Praeneste and as one believed to have
    been born of Vulcan among herds and found beside the hearth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Caeculus is attended by a rustic battalion with mixed equipment, including
    lead bullets, darts, tawny wolfskin caps, one bare foot, and one rawhide boot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Messapus is called a tamer of horses and seed of Neptune, and is described
    as unable to be struck down by steel or fire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Messapus summons long-unstirred peoples to arms; they march in even time while
    singing their king and are compared to swans and a cloud of birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Clausus of ancient Sabine blood leads a great host and is presented as the
    ancestor from whom the Claudian tribe and family spread.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Clausus's forces are described through a long list of places and are compared
    in number to sea waves and ripening grain; their shields clatter and their feet
    shake the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Halaesus, called Agamemnonian and a foe of the Trojan name, yokes chariot
    horses and draws a thousand warlike peoples to Turnus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Oebalus is reported to have been borne by the nymph Sebethis to Telon, and
    to have extended rule beyond his ancestral fields over several peoples and territories.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ufens comes from mountainous Nersae; his Aequiculan people are described as
    rough, accustomed to hunting, tilling the soil while armed, seeking spoils, and
    living on plunder.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Umbro, priest of the Marruvian people and sent by King Archippus, wears olive
    leaves over his helmet and can use charm and touch to make vipers and water-snakes
    sleep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Umbro's charms and Massic herbs do not heal the wound made by a Dardanian
    spear-point, and local woodland, wave, and pools are said to weep for him.
  category: sequence
  evidence_refs:
  - ev:8
