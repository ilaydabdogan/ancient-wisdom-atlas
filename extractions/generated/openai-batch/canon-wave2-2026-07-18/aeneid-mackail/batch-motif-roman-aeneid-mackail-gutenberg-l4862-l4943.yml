candidate_motifs:
- id: motif:1
  label: twin warrior brothers entering battle
  taxonomy_refs:
  - sibling_pair
  basis: Catillus and Coras are explicitly described as twin brothers who advance
    in the forefront of battle.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage identifies twins and brothers but does not mark them as sacred
    twins.
- id: motif:2
  label: divine birth of a city founder at the hearth
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  - royal_legitimacy
  basis: Caeculus is founder of Praeneste and is said to have been born of Vulcan
    and found beside the hearth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The birth tradition is reported briefly as a belief held by every age;
    no extended birth episode is given.
- id: motif:3
  label: divine-descended invulnerable war leader
  taxonomy_refs:
  - divine_parent_child
  basis: Messapus is called seed of Neptune, a horse-tamer, and one whom steel or
    fire cannot strike down while he summons peoples to war.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain whether the invulnerability comes from his
    divine descent.
- id: motif:4
  label: ancestral legitimation of a Roman family through a heroic Sabine leader
  taxonomy_refs:
  - royal_legitimacy
  basis: Clausus is identified as of ancient Sabine blood and as the source from whom
    the Claudian tribe and family spread after Rome was shared with the Sabines.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a genealogical claim, not a full foundation narrative.
- id: motif:5
  label: nymph-born ruler extending ancestral power
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: Oebalus is said to have been borne by the nymph Sebethis to Telon and to
    have ruled widely over named peoples and territories.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The supernatural birth is brief, and the passage does not elaborate on
    ritual or dynastic consequences.
- id: motif:6
  label: serpent-charmer priest whose healing fails against a heroic wound
  taxonomy_refs:
  - serpent
  basis: Umbro can make vipers and water-snakes sleep by charm and touch, but his
    charms and herbs do not heal the Dardanian spear wound.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage supports serpent-charming and failed healing specifically;
    broader serpent-cult interpretation is not stated.
- id: motif:7
  label: epic muster of allied peoples and regional war bands
  taxonomy_refs: []
  basis: The passage repeatedly names leaders, their origins, their followers, and
    their distinctive arms as contingents assemble for war.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a literary catalogue pattern; no supplied taxonomy family directly
    names it.
- id: motif:8
  label: army and heroes described through animal and nature similes
  taxonomy_refs: []
  basis: The passage compares warriors or hosts to Centaurs, swans, a cloud of birds,
    sea waves, and ripening grain.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: These are explicit poetic similes and should not be treated as independent
    mythic episodes.
