canonical_text:
  quote: ''
  summary: Turnus, urged onward by his sister, challenges Pallas alone. Pallas answers
    bravely, invokes Alcides by a bond of hospitality, and enters combat. Alcides
    hears and weeps, while a fatherly divine speaker states that every life has an
    appointed limit and cites fallen sons of gods. Pallas wounds Turnus, but Turnus
    pierces Pallas through shield and breast. Turnus strips Pallas of a richly wrought
    sword-belt depicting a bridal-night slaughter, sends a message to Evander, and
    rejoices in the spoil, while the narrator foretells that he will one day curse
    this fatal prize. Pallas' comrades bear his body away on his shield.
  language: English
  quote_policy: summarized
