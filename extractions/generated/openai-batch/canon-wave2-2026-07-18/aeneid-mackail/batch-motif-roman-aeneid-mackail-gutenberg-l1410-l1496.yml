canonical_text:
  quote: ''
  summary: During the sack of Troy, a thunderclap and shooting star persuade Anchises
    to leave with Aeneas. Aeneas carries his father, leads Iülus, orders his wife
    Creüsa to follow, and appoints a gathering place near Ceres' mound and an ancient
    cypress. In the flight Creüsa is lost. Aeneas returns through the burning, occupied
    city to search for her. Her ghost appears, says her loss is divinely ordained,
    foretells Aeneas' exile, sea journey, arrival in Hesperia, kingship, and new marriage,
    then vanishes when he tries to embrace her.
  language: English
  quote_policy: summarized
