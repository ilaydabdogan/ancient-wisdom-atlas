canonical_text:
  quote: ''
  summary: Jupiter confronts Juno over her continuing interference in the war, declares
    Aeneas destined for divine honor, and forbids further obstruction. Juno accepts
    the end of her opposition but asks that the Latins keep their name, language,
    clothing, and future identity. Jupiter grants this, saying the Trojans will mingle
    into Latin blood and contribute sacred law and ritual, producing a pious Roman
    race. Jupiter then sends one of the Dirae, chthonic winged monsters, as a sign
    to Juturna. The Dira descends, assumes the shape of a nocturnal tomb-bird, terrifies
    Turnus, and causes Juturna to abandon the field in grief, lamenting her immortality
    before sinking into the river.
  language: English
  quote_policy: summarized
