canonical_text:
  quote: ''
  summary: Juno drives Latium toward war after local deaths inflame the town. Turnus,
    Bacchic matrons, and others press Latinus to fight the Trojans, while Latinus
    resists, warns of blood-payment, and withdraws from rule. A Roman-style rite of
    opening the gates of War is described; Latinus refuses to perform it, so Juno
    opens the iron-bound doors herself. Ausonia arms for battle. The narrator invokes
    the goddesses of Helicon and begins the catalogue of Italian leaders, including
    Mezentius and Lausus, and Aventinus, a son of Hercules marked by Hydra and lion-skin
    imagery.
  language: English
  quote_policy: summarized
