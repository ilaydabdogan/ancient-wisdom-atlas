canonical_text:
  quote: ''
  summary: Aeneas is carried wounded into camp while Turnus continues killing on the
    plain. Iapix, a healer beloved of Apollo, attempts unsuccessfully to remove the
    arrow and treat the wound. Venus, moved by her son's pain, secretly prepares healing
    river-water with dittamy, ambrosia, and balm. Iapix washes the wound without knowing
    the divine intervention; the pain ceases, blood is stanched, the arrow falls out,
    and Aeneas regains strength. Iapix declares that a higher god, not human art,
    has saved Aeneas. Aeneas arms himself, embraces Ascanius, and instructs him to
    learn valor and toil and remember the pattern of his father Aeneas and uncle Hector.
  language: English
  quote_policy: summarized
