canonical_text:
  quote: ''
  summary: A roll-call passage names Virbius, son of Hippolytus, and recounts Hippolytus's
    death by horses, restoration to life through Diana and the Healer, divine punishment
    of the Healer, concealment under an altered name, and a resulting horse taboo
    at Trivia's groves. Turnus is described with imposing armor, a fiery Chimaera
    on his helmet, and mythic figures on his shield, followed by infantry from named
    peoples and regions. Camilla the Volscian arrives as a cavalry-leading warrior
    maiden of exceptional speed, admired by the people for her royal adornment and
    weapons.
  language: English
  quote_policy: summarized
