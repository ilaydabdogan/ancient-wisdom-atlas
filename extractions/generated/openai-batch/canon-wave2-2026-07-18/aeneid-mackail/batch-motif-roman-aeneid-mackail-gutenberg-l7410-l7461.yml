canonical_text:
  quote: ''
  summary: Turnus answers Drances in the Latin council, contrasting Drances's fluent
    speech with the need for action in war. He rejects being called conquered by citing
    earlier slaughter of Trojan and allied enemies, addresses Latinus about the options
    of peace or renewed resistance, names remaining allies including Camilla, and
    offers to face Aeneas alone, consecrating his life to Latinus and his father while
    invoking possible heavenly wrath.
  language: English
  quote_policy: summarized
