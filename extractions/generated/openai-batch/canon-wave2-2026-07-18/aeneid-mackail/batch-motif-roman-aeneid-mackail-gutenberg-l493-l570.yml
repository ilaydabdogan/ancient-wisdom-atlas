canonical_text:
  quote: ''
  summary: Venus reveals her divine nature and departs; Aeneas recognizes her as his
    mother and laments her disguised appearances. Venus hides Aeneas and Achates in
    a divine cloud as they enter Carthage. Aeneas sees the Tyrians building the city,
    then enters Juno's grove and temple, where he views painted scenes of the Trojan
    War and weeps at the sight of familiar sufferings and figures.
  language: English
  quote_policy: summarized
