canonical_text:
  quote: ''
  summary: At dawn Turnus arms his men and the attackers display the heads of Euryalus
    and Nisus. The Aeneadae hold the wall, trenches, and towers. Rumour carries the
    news to Euryalus' mother, who drops her weaving, runs to the walls, laments her
    son, mourns the lack of funeral care, and asks either the Rutulians or the lord
    of heaven to end her life. Her grief weakens the defenders until she is carried
    home. The assault resumes with trumpet, shield-roof advance, trench filling, ladder
    attacks, missiles, stones, firebrands, and tearing of the palisade. The narrator
    invokes Calliope to sing the destruction done by Turnus and the warriors sent
    to the underworld.
  language: English
  quote_policy: summarized
