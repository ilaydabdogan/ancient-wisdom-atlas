canonical_text:
  quote: ''
  summary: Aeneas leaves his hidden fleet to explore the unknown Libyan coast with
    Achates. Venus, his mother, meets him in a huntress-maiden disguise and explains
    the Tyrian realm and Dido’s flight from Pygmalion after Sychaeus’s murder. Aeneas
    identifies himself as the Trojan exile carrying household gods and seeking Italy.
    Venus reassures him that his comrades and fleet are safe, using an augury of twelve
    swans harried by the bird of Jove as an image for the ships entering harbor.
  language: English
  quote_policy: summarized
