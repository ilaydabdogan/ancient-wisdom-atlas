canonical_text:
  quote: Jupiter himself holds up the two scales in even balance
  summary: Aeneas and Turnus enter single combat before the armies. Jupiter weighs
    their fates; Turnus' borrowed sword breaks against Aeneas' divine armour, and
    Turnus flees. Aeneas pursues while wounded. At a sacred olive of Faunus, Aeneas'
    spear is held in the root after Turnus prays to Faunus and Earth. A Daunian goddess
    in Metiscus' likeness returns Turnus' sword, while Venus frees Aeneas' spear,
    leaving both combatants rearmed.
  language: English
  quote_policy: quoted
