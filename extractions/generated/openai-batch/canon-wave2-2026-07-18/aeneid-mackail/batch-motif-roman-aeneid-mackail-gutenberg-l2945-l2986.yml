canonical_text:
  quote: ''
  summary: 'During the fleet games, Cloanthus prays to sea gods and vows offerings;
    sea divinities hear, and Portunus pushes his ship to victory. Aeneas declares
    him winner and distributes prizes. The first prize is a gold and purple scarf
    depicting a royal boy on Ida seized by Jove''s winged armour-bearer while guardians
    reach upward. Other prizes include armor, cauldrons, and silver bowls. Sergestus
    later brings in his damaged ship, compared to a wounded serpent, and receives
    a promised reward: Pholoë the Cretan, a slave woman with twin boys at her breast.'
  language: English
  quote_policy: summarized
