canonical_text:
  quote: ''
  summary: Dido confronts Aeneas over his planned departure, invoking their union,
    her losses, and the danger left to her. Aeneas answers that fate, oracles, Jove's
    messenger, his father's phantom, and Ascanius's destiny require him to seek Italy.
    Dido denounces him, curses his voyage, vows posthumous haunting, and collapses
    as her attendants carry her away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dido accuses Aeneas of trying to conceal his departure and slip away silently
    from her land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dido invokes love, Aeneas's pledged hand, their union, and marriage rites
    while asking him to pity her house and delay his purpose.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:3
  text: Dido says Libyan tribes, Nomad kings, and her own Tyrians have become hostile
    or estranged because of Aeneas, and she fears death, overthrow by Pygmalion, or
    captivity by Iarbas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dido imagines that a child of Aeneas, a tiny Aeneas playing in her hall, would
    make her feel less utterly deserted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aeneas keeps his gaze steady by counsel of Jove and suppresses his distress
    before answering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aeneas says he did not hope to leave by stealth and denies that he held out
    the marriage torch or entered such an alliance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aeneas says fate, Apollo, Lycian oracles, Anchises's phantom, Ascanius's destined
    kingdom, and a messenger from Jove direct him toward Italy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dido answers by denying Aeneas's divine and Dardanian lineage in insult, saying
    Caucasus and Hyrcanian tigresses produced him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dido says Aeneas showed no tears or pity in response to her grief.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dido recalls that she welcomed Aeneas when he was cast ashore and destitute,
    gave him a place in her kingdom, recovered his fleet, and saved his crews from
    death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dido tells Aeneas to follow Italy, hopes he will suffer vengeance on the rocks,
    and vows that her ghost will haunt him after death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Dido breaks off her speech, leaves sick at heart, and is carried swooning
