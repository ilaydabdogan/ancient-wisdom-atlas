canonical_text:
  quote: ''
  summary: Venus brings Aeneas divine armour made by her husband. Aeneas examines
    the armour and especially the shield, whose crafted images show episodes of Roman
    origins, wars, rites, underworld judgment, the battle of Actium, the flight of
    the Egyptian queen, the Nile, and Caesar's triple triumph and offering to the
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Venus approaches through the clouds carrying gifts and finds her son withdrawn
    in a valley by a cold river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Venus says the gifts are the completed craftsmanship promised by her husband
    and encourages her son to challenge the Laurentines or Turnus in battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Venus embraces her son and places the glittering armour under an oak opposite
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aeneas rejoices in the divine gift, looks over it piece by piece, and handles
    the helmet, greaves, spear, and shield.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shield's design contains the story of Italy, Roman triumphs, the future
    seed of Ascanius, and their wars.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: One shield image shows a she-wolf in the green cave of Mars nursing and licking
    twin boys.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The shield depicts Rome, the seizure of the Sabine women, a sudden war between
    Romulus' people and Tatius' Cures, and then a treaty at Jove's altar over a slain
    sow.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The shield shows Mettus torn apart by chariots, Tullus punishing him, Porsena's
    blockade for the exiled Tarquin, Roman resistance, Cocles destroying the bridge,
    Cloelia swimming the river, and Manlius guarding the Capitoline.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: A silver goose cries out that the Gauls are at the threshold while the Gauls
    approach the fortress in darkness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The shield shows ritual groups and objects, including the dancing Salii, the
    naked Luperci, wool-wreathed crests, sacred shields fallen from heaven, and matrons
    conducting rites in cushioned cars.
  category: object
  evidence_refs:
  - ev:7
