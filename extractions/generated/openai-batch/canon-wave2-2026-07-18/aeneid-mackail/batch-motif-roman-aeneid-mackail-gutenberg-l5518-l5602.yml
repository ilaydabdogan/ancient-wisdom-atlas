  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A golden and blue sea with silver dolphins encircles the central image of
    the war-fleets of Actium.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Caesar Augustus leads Italy, the Fathers and People, and household and state
