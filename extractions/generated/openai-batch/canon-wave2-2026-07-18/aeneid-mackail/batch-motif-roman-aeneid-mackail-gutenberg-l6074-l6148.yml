canonical_text:
  quote: ''
  summary: During the siege of the Trojan camp, Italians attack a tower defended by
    Trojans. Turnus sets it on fire, the tower collapses, Helenor charges to his death,
    and Lycus is seized while trying to flee. A catalogue of killings follows, including
    Mezentius killing the son of Arcens. Ascanius makes his first war-shot and kills
    the taunting Numanian Remulus, who contrasts Italian hardship and martial discipline
    with Trojan luxury and invokes the music of the Mother of Ida.
  language: English
  quote_policy: summarized
