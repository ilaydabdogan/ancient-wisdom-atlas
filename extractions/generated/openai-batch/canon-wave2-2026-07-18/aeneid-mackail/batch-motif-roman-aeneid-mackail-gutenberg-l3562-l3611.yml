canonical_text:
  quote: easy is the descent into hell; all night and day the gate of dark Dis stands
    open; but to recall thy steps and issue to upper air, this is the task and burden.
  summary: 'At the Cumaean shrine, the Sibyl speaks under Apollo''s influence. Aeneas
    asks to pass into the underworld to see his father. He cites earlier figures who
    reached or affected the dead. The Sibyl explains that descent is easy but return
    is difficult, and she gives conditions: Aeneas must obtain a golden bough destined
    for Proserpine and first perform burial and expiatory rites for an unburied companion.'
  language: English
  quote_policy: quoted
