  text: Aeneas identifies himself as Aeneas of Troy, says he was snatched from the
    Libyan waves, and thanks Dido for sharing her city and home with the Trojan remnant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas prays that the gods reward Dido and says her honour, name, and praises
    will endure; he then extends his right hand to Ilioneus and his left to Serestus
    before greeting others.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Dido is astonished at Aeneas' appearance and fortunes, calls him goddess-born,
    and asks whether he is the Aeneas born from Venus and Anchises.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dido recalls Teucer coming to Sidon as an exile seeking Belus' aid for new
    realms, and says she already knew the fall of Troy and Aeneas' name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dido invites the men into her house and states that her own similar fortune
