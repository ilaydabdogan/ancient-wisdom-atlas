canonical_text:
  quote: ''
  summary: Aeneas reveals himself to Dido, thanks her for aiding the Trojan survivors,
    and greets his companions. Dido recognizes his lineage and welcomes him, orders
    sacrifices, and prepares royal hospitality. Aeneas sends Achates to fetch Ascanius
    and Trojan heirloom gifts. Venus then plans for Cupid to take Ascanius' form,
    while Ascanius is hidden asleep, so that Dido may be inflamed with love for Aeneas.
  language: English
  quote_policy: summarized
literal_observations:
