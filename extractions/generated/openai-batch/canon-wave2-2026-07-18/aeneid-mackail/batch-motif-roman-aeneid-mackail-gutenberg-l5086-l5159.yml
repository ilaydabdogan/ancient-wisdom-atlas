canonical_text:
  quote: ''
  summary: Evander and the Arcadians are performing annual sacrifice in a grove when
    Aeneas arrives by ship. Pallas challenges the strangers, Aeneas displays an olive
    bough and asks for alliance. Aeneas argues kinship through shared descent from
    Atlas and common enmity with the Latins/Daunians. Evander recalls Anchises, accepts
    the alliance, promises aid, and includes the Trojans in the sacrificial feast.
  language: English
  quote_policy: summarized
