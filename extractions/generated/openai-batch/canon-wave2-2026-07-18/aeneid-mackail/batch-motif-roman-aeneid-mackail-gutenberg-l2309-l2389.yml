canonical_text:
  quote: ''
  summary: A petitioner appeals to Jupiter against Dido's union with Aeneas. Jupiter
    hears, looks on Carthage and the lovers, and commands Mercury to tell Aeneas to
    leave Carthage for his destined Italian and Roman future. Mercury equips his winged
    shoes and rod, flies by Atlas and the Libyan shore, confronts Aeneas, and vanishes.
    Aeneas, shaken, secretly orders the fleet prepared while considering how to tell
    Dido. Dido senses the plan through signs and Rumour and rages through the city,
    compared to a Bacchic Thyiad.
  language: English
  quote_policy: summarized
