canonical_text:
  quote: Ha! Are we eating our tables too?
  summary: Aeneas and the Trojans eat beside a tree in Latium; Iülus' joke about eating
    their tables triggers Aeneas' recognition of Anchises' prophecy that this shore
    is their destined home. Aeneas prays to gods and ancestors, Jove sends thunder
    and a luminous cloud, and the Trojans begin founding a settlement and sending
    envoys to King Latinus. Latinus receives them in an ancestral sacred palace, recalls
    shared origins through Dardanus, and welcomes them.
  language: English
  quote_policy: quoted
