canonical_text:
  quote: ''
  summary: Evander tells Aeneas that Etruria is ready to revolt against Mezentius
    but must be led by a foreigner; he offers Aeneas leadership and sends Pallas with
    cavalry. A heavenly omen of Vulcan-made armor confirms Venus's promised aid to
    Aeneas. Aeneas performs sacrifice, chooses companions, prepares to depart for
    Tyrrhenia, and Evander tearfully clasps his son Pallas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Evander says his own strength is limited by the Tuscan river on one side and
    Rutulian pressure near the walls on the other, but he intends to unite Aeneas
    with powerful peoples and a wealthy camp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Evander recounts that King Mezentius ruled Agylla with terror and tortured
    living people by fastening them to dead bodies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The citizens attack Mezentius and his house, kill his comrades, set fire to
    his roof, and Mezentius escapes to Rutulian land under Turnus's protection.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evander says all Etruria has risen in anger and demands Mezentius for punishment
    in battle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An aged diviner warns the Etruscan forces that no Italian may control their
    nation and that they must choose foreigners to lead them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tarchon sends ambassadors to Evander with the crown, sceptre, and royal attire,
    but Evander declines rule because of age and diminished strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Evander tells Aeneas to enter as a supreme leader over Teucrians and Italians,
    and he sends Pallas with Arcadian cavalry to learn warfare under Aeneas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A flash, peal, repeated crash, and red gleaming armor clashing through a cloud
    appear in the clear sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Aeneas identifies the sky sign as the promised signal of his goddess mother
    and says armor from Vulcan's hands will come to his aid.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Aeneas predicts slaughter for the Laurentines and addresses Tiber as carrying
    shields, helmets, and bodies beneath its waves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Aeneas rekindles the altars of Hercules, approaches his tutelary and household
    gods, and he, Evander, and the Trojans offer choice two-year-old sheep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Aeneas selects the bravest from his crew to accompany him to war, while the
    rest travel by water to bring Ascanius news of his father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Horses are given to the Teucrians, a specially adorned horse is brought for
    Aeneas, rumor spreads through the town, mothers pray in fear, and Evander weeps
    while clasping the hand of his departing son.
  category: sequence
  evidence_refs:
  - ev:7
