canonical_text:
  quote: ''
  summary: Sinon tells the Trojans that storms and Apollo's oracle forced the Greeks
    to seek a human sacrifice for their return, that Calchas named him as the victim,
    and that he escaped. Priam releases him and asks about the wooden horse. Sinon
    swears by sacred objects and claims that Diomedes and Ulysses stole the Palladium,
    estranging Pallas/Minerva from the Greeks; omens from the image and Calchas' interpretation
    supposedly explain the Greeks' withdrawal and the horse as an expiatory offering.
    The narrator concludes that the Trojans believed Sinon because of wiles, craft,
    perjury, and forced tears.
  language: English
  quote_policy: summarized
