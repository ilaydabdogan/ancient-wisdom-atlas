canonical_text:
  quote: ''
  summary: Aeneas gathers Trojans and Sicilians in a natural amphitheatre for a footrace,
    announces gifts and ranked prizes, and oversees the contest. Nisus leads but slips
    on sacrificial blood; he then obstructs Salius to aid Euryalus, who wins. Salius
    protests, Diores supports Euryalus, and Aeneas gives compensatory prizes to Salius
    and Nisus, including a lion-skin and a shield taken from Neptune's temple gates.
  language: English
  quote_policy: summarized
