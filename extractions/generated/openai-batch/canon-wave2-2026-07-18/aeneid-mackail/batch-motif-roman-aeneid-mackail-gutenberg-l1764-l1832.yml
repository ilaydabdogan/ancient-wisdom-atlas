canonical_text:
  quote: ''
  summary: Aeneas hears that Helenus rules Greek towns and that Andromache is with
    him. He finds Andromache making offerings at a named but empty tomb of Hector
    beside a recreated Simois. She reacts as if Aeneas may be a vision, recounts her
    captivity under Pyrrhus and transfer to Helenus, and describes Pyrrhus' killing
    by Orestes. Helenus welcomes the Trojans into a settlement built as a small copy
    of Troy. After hospitality and libations, Aeneas asks Helenus, a prophet of Phoebus,
    for guidance toward Italy and protection from foretold dangers; Helenus performs
    sacrifice and begins to prophesy.
  language: English
  quote_policy: summarized
