  text: Sacred contests and rites at Anchises' tomb are underway when the episode
    begins.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juno, described as daughter of Saturn and still not satiated of an old pain,
    sends Iris down from the sky toward the Ilian fleet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Trojan women stand apart by the sea, weep for Anchises, look at the flood,
    complain of further sea travel, and pray for a city.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Iris sets aside the face and clothing of a goddess and assumes the form of
    Beroë, aged wife of Doryclus, before speaking to the Dardanian matrons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the borrowed identity, Iris tells the women that seven summers have passed
    since Troy's fall, urges them to build a city there, and commands them to burn
    the ships.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The disguised Iris claims that a phantom of Cassandra appeared in sleep with
    blazing brands and declared that the present place should be their Troy and home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The disguised Iris points to four altars of Neptune and says the god lends
    the firebrand and strength for the act.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Iris seizes a fiery weapon, whirls it upward, and throws it, startling the
    women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pyrgo tells the women that the speaker is not Beroë and points to divine grace,
    gleaming eyes, breath, countenance, voice, and gait; she also says the real Beroë
    is sick and absent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Iris rises through the sky on poised wings and draws a vast bow beneath the
    clouds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After seeing the tokens, the women raise a cry, seize fire from hearths, plunder
    altars, and cast brushwood, boughs, and brands onto the ships.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Fire-god is described as raging over thwarts, oars, and painted fir hulls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Eumelus carries news of the burning ships to the grave of Anchises and the
    theatre.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ascanius rides to the disordered camp, asks what madness is taking place,
    tells the women they are burning their own hopes, and throws down his empty helmet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The women scatter in fear, seek woods and hollow rocks, loathe their deed,
    recognize their people, and Juno is said to be startled out of their breast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The flames continue despite the heroes' strength and the water poured on them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Aeneas tears his garment from his shoulders, stretches his hands, and prays
    to Jupiter either to save the fleet or to destroy the Trojan remnant with a thunderbolt
    if he deserves it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: A black tempest, rain, thunder, darkness, and south winds follow; the ships
