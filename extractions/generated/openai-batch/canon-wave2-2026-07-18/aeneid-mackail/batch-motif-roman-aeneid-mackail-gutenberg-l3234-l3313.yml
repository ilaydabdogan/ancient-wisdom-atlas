canonical_text:
  quote: ''
  summary: During rites and games for Anchises, Juno sends Iris to the unattended
    Trojan fleet. Iris disguises herself as Beroë and urges the Trojan women, weary
    of the sea journey, to burn the ships and settle where they are. Pyrgo recognizes
    divine signs in the impostor, but Iris reveals herself in flight and the women,
    driven by madness, seize fire and ignite the fleet. Ascanius rebukes them, the
    women recover and flee, and Aeneas prays to Jupiter. A storm and heavy rain quench
    the flames, saving all but four ships.
  language: English
  quote_policy: summarized
literal_observations:
