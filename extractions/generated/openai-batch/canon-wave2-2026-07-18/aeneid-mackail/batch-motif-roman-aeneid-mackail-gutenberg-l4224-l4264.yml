canonical_text:
  quote: "“There are twin portals of Sleep...”"
  summary: Aeneas notices a beautiful but sorrow-shadowed armed youth and asks Anchises
    about him. Anchises weeps, laments the short-lived Marcellus, and asks to strew
    flowers for his descendant’s soul. Anchises then guides Aeneas through the vaporous
    plains, instructs him about future wars and peoples, and sends Aeneas and the
    Sibyl out through the ivory gate of Sleep. Aeneas returns to his ships and reaches
    Caieta’s haven.
  language: English
  quote_policy: quoted
