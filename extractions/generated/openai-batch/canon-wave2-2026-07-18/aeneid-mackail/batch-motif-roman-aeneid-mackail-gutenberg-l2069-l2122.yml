canonical_text:
  quote: ''
  summary: Aeneas recounts seeing the blinded Polyphemus on Sicily, fleeing by ship
    with the rescued suppliant Achemenides, and escaping as the Cyclopes gather on
    the shore. He then narrates a Sicilian coastal route shaped by prophetic warnings,
    local sacred geography, and finally the death of his father Anchises at Drepanum
    before ending his account.
  language: English
  quote_policy: summarized
