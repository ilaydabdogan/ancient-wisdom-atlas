canonical_text:
  quote: "“In war is no safety; peace we all implore of thee, O Turnus...”"
  summary: In a Latin council during wartime, the king proposes treaty terms for the
    Teucrians, including land, ships, ambassadors, peace boughs, and royal gifts.
    Drances then criticizes Turnus, urges a marriage alliance involving the king’s
    daughter to make peace secure, and challenges Turnus either to yield or face the
    foe himself. Turnus reacts with anger.
  language: English
  quote_policy: quoted
