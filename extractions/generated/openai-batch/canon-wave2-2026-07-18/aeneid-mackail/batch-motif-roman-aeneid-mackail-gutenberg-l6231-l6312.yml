canonical_text:
  quote: ''
  summary: Mars increases Latin courage and spreads fear among the Teucrians. Pandarus
    closes the gate of the Trojan camp, unintentionally trapping Turnus inside. Turnus
    resists Pandarus, is aided by Juno, kills Pandarus, and then attacks many Trojans.
    Mnestheus and Serestus rally the defenders. Jupiter sends Iris with orders that
    Juno cease supporting Turnus and that Turnus withdraw. Pressed by the Trojans,
    Turnus leaps fully armed into the river, whose waters bear him back to his comrades.
  language: English
  quote_policy: summarized
