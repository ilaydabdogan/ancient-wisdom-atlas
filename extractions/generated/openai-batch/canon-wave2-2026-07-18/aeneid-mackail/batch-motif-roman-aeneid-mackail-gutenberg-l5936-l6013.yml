canonical_text:
  quote: ''
  summary: Volscens' cavalry detects Nisus and Euryalus near the camp when Euryalus'
    helmet glitters in the dark. The pair flee into a tangled forest; Euryalus is
    delayed by darkness, branches, and spoils, while Nisus escapes, returns, prays
    to the Latonian goddess, and kills Sulmo and Tagus with spears. Volscens kills
    Euryalus despite Nisus' attempt to take the blame. Nisus then kills Volscens and
    dies over Euryalus. The narrator promises lasting memory for the pair, and the
    Rutulians return to camp with recovered spoils and mourning.
  language: English
  quote_policy: summarized
