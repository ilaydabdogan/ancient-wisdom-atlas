canonical_text:
  quote: ''
  summary: Aeneas and the Trojan fleet sail away, see the distant blaze of Elissa's
    funeral fire, meet storm at sea, and divert to Sicily. Acestes welcomes them.
    Aeneas announces anniversary rites for Anchises, sacrifices, prayers, and funeral
    games. At Anchises' tomb he pours libations and invokes his father. A serpent
    emerges from beneath the sanctuary, circles the grave and altars, tastes the offering,
    and returns beneath the tomb. Aeneas then gives further sacrifices and the Trojans
    feast.
  language: English
  quote_policy: summarized
