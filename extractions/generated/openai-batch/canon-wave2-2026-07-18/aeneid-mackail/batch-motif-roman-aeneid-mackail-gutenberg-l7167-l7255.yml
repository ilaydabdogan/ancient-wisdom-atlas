canonical_text:
  quote: ''
  summary: Latin envoys ask Aeneas for leave to bury their dead. Aeneas grants the
    request, blames the Latin king's broken covenant and Turnus' arms for the war,
    and a twelve-day truce follows. Rumour carries news of Pallas' death to Evander,
    who laments over his son and calls Turnus a debt owed to father and son. Aeneas
    and Tarchon build funeral pyres on the shore; armed mourners circle the pyres,
    cast spoils and gifts into the fire, sacrifice animals, and keep watch by the
    embers until night.
  language: English
  quote_policy: summarized
