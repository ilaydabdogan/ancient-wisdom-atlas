canonical_text:
  quote: ''
  summary: Juno petitions Jupiter for Turnus, and Jupiter permits only a temporary
    removal from imminent death, not a change in the war. Juno then creates a hollow
    mist-phantom in the likeness of Aeneas, uses it to draw Turnus onto a ship, snaps
    the ship’s hawser, and has him carried away over the sea. Turnus laments his apparent
    flight and abandonment of his men, considers death by sword or water, but Juno
    restrains him and he is borne toward Daunus’ city.
  language: English
  quote_policy: summarized
