canonical_text:
  quote: ''
  summary: Nisus and Euryalus commit to a dangerous night mission to reach Aeneas.
    In the Trojan camp, Nisus explains the opportunity created by the sleeping Rutulians
    and an open route. Aletes and Ascanius approve, invoke divine powers, promise
    rewards, and respond with tears. Euryalus asks Ascanius to care for his mother.
    The youths receive arms and tokens and are sent toward the gates with vows and
    messages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nisus says that if chance or deity brings him to adverse doom, he wants Euryalus
    to survive and see that funeral rites or a tomb are provided; he also worries
    about causing pain to Euryalus's mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Euryalus refuses to change his purpose, urges haste, and he and Nisus leave
    their post to seek the prince.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While other living creatures sleep, the foremost Trojan captains hold council
    in the camp about what to do and who might serve as messenger to Aeneas.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nisus and Euryalus request an audience, and Iülus orders Nisus to speak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nisus reports that the Rutulians are silent with sleep and wine, that there
    is open ground near the sea gate, and that the fires are broken with dark smoke
    rising; he offers that he and Euryalus seek Aeneas in Pallanteum.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aletes praises the ancestral gods for not wholly destroying the Trojan race
    when they have produced youths of such courage; he embraces Nisus and Euryalus
    with tears.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ascanius invokes household gods, the spirit of Assaracus, and Vesta's sanctuary
    while asking Nisus and Euryalus to bring back Aeneas; he promises treasures, war
    spoils, captives, land, and lasting companionship as rewards.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Euryalus asks Ascanius to support his mother and relieve her loneliness, explaining
    that he left without farewell because he could not bear a parent's tears.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Dardanians weep, and Iülus promises that Euryalus's mother shall be as
    a mother to him, swearing by the head by which his father used to swear.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Iülus gives Euryalus a gold-inlaid sword in an ivory sheath; Mnestheus gives
    Nisus a lion hide; Aletes exchanges his helmet; the captains send the pair to
    the gates with vows, and Iülus gives messages for his father that the breezes
    carry away.
  category: sequence
  evidence_refs:
  - ev:8
