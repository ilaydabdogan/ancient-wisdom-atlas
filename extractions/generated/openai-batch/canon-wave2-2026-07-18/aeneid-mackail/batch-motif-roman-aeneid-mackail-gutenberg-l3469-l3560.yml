canonical_text:
  quote: ''
  summary: 'Aeneas lands at Cumae, seeks Apollo''s shrine and the Sibyl''s cavern,
    views the temple associated with Daedalus and its Cretan myth scenes, performs
    sacrifices as instructed by Deiphobe, and prays for a destined settlement in Latium.
    The Sibyl becomes possessed by Apollo and delivers a prophecy: the Trojans will
    reach Lavinium, but future wars, Juno''s hostility, another Achilles, and trouble
    from a foreign bride await them.'
  language: English
  quote_policy: summarized
