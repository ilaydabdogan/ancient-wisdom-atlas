canonical_text:
  quote: "“Seek out your ancient mother; hence shall the house of Aeneas sway all
    regions”"
  summary: An oracle tells the Trojan wanderers to seek their ancient mother and promises
    future rule for Aeneas' descendants. Anchises interprets the command as Crete,
    where the Trojans found Pergamea, but pestilence ruins the settlement. At night
    the household gods tell Aeneas that Crete is not the destined land and direct
    him to Hesperia/Italy. Anchises recalls Cassandra's earlier prophecy, and the
    Trojans abandon the Cretan settlement and sail on.
  language: English
  quote_policy: quoted
