  summary: Aeneas' company shelters near volcanic Aetna, where a rumour links the
    eruptions and tremors to Enceladus buried beneath the mountain. At dawn a starving
    Greek, Achemenides, begs the Trojans for rescue. He says he was a companion of
    Ulysses, abandoned in the Cyclops' cave, where Polyphemus ate men before Ulysses
    and others blinded his single eye. Achemenides warns that many other Cyclopes
    live nearby and asks the Trojans to take him away or kill him.
