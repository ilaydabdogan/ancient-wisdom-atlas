canonical_text:
  quote: ''
  summary: The passage moves from Caieta’s burial and Aeneas’s departure by sea to
    the Trojans’ passage near Circe’s shore, Neptune’s protection, and their arrival
    at the Tiber in Latium. It then introduces the Latian royal house, Lavinia’s marriage
    situation, ominous signs involving a sacred laurel and fire, and Latinus’s consultation
    of Faunus’s oracle, which foretells foreign sons-in-law and world-ruling descendants.
  language: English
  quote_policy: summarized
