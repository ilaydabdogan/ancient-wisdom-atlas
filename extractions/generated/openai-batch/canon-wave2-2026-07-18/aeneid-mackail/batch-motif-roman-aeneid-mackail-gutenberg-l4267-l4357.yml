  text: After the funeral rites and smoothing of the grave mound, Aeneas sails away
    from the haven at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The voyagers pass the shores of Circe’s land, where groves echo with song
    and her house glows at night while she works at a web.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lions, bears, swine, and wolves are heard or described near Circe’s shore;
    the passage says Circe used potent herbs to change men from human likeness into
    wild beasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Neptune gives the Trojans favorable winds so that they avoid Circe’s haven
    and pass the seething shallows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At dawn Aeneas sees a forest and the Tiber flowing to the sea; he orders the
    crew to turn toward land and enters the shady river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator invokes Erato before recounting kings, circumstances in ancient
    Latium, and the beginnings of war.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Latinus is described as an old king ruling peacefully; his ancestry is traced
    through Faunus, Marica, Picus, and Saturn.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Latinus has no surviving male heir; one daughter, Lavinia, remains in the
    royal household and is of marriageable age.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Many men court Lavinia, with Turnus named as foremost, but signs from heaven
    obstruct the marriage path.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A sacred laurel in the palace, dedicated by Latinus to Phoebus, is suddenly
