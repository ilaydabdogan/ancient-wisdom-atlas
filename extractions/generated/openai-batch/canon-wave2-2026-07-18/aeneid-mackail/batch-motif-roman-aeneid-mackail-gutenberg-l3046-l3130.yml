canonical_text:
  quote: ''
  summary: After the races, Aeneas announces a gauntlet contest with prizes. Dares
    first stands unopposed, but Acestes urges aged Entellus to compete. Entellus displays
    Eryx's heavy old gloves and recalls their heroic associations, then agrees to
    equal gloves. In the fight Entellus falls, recovers in anger, overwhelms Dares,
    and Aeneas stops the contest, attributing the changed outcome to Heaven. Dares
    is led away bleeding and Entellus receives the victory prizes.
  language: English
  quote_policy: summarized
