canonical_text:
  quote: The city I establish is yours; draw your ships ashore; Trojan and Tyrian
    shall be held by me in even balance.
  summary: Dido enters the temple precinct like Diana among attendants, sits enthroned,
    and administers law. Shipwrecked Trojans approach as supplicants while Aeneas
    and Achates remain hidden in a cloud. Ilioneus asks Dido for mercy, safe beaching,
    and materials to repair the fleet. Dido offers escort, supplies, equal welcome
    in her city, and a search for Aeneas. Achates urges Aeneas to emerge; the cloud
    parts and Aeneas appears with godlike radiance enhanced by his mother.
  language: English
  quote_policy: quoted
