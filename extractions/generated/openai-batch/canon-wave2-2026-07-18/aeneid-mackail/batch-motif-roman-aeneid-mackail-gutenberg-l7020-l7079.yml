canonical_text:
  quote: ''
  summary: A wounded father, identified in the passage as Mezentius, rests beside
    the Tiber and asks for his son Lausus. Lausus is brought dead, and Mezentius laments
    that his son died in his place. Despite his wound, he mounts Rhoebus to face Aeneas,
    seeking either vengeance or death. After an exchange of weapons, Aeneas brings
    down the horse and confronts Mezentius. Mezentius asks for burial and union with
    his son in the tomb, then dies by the sword.
  language: English
  quote_policy: summarized
