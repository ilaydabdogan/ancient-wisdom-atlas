canonical_text:
  quote: ''
  summary: Book Tenth opens with Jupiter convening the gods in the heavenly house
    to address the Italian war against the Trojans. Venus appeals for the endangered
    Trojans, Ascanius, and Aeneas, recalling hostile divine actions and the recurring
    fate of Troy. Juno counters by blaming Aeneas and the Trojans for provoking war
    and recalling Venus' prior interventions. The gods murmur until Jupiter begins
    to speak and the divine house, earth, sky, winds, and ocean fall silent.
  language: English
