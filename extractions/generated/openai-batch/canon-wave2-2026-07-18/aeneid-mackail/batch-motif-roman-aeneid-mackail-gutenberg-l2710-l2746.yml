canonical_text:
  quote: ''
  summary: The dying woman is found fallen on a sword, causing city-wide lament. Her
    sister rushes to her, laments that she was not called to share the death, tries
    to tend the wound, and embraces her. The dying woman repeatedly tries and fails
    to rise. Juno, pitying her prolonged death, sends Iris because Proserpine has
    not yet taken the lock of hair required for the underworld. Iris cuts the sacred
    hair, and the woman’s life leaves her body.
  language: English
  quote_policy: summarized
