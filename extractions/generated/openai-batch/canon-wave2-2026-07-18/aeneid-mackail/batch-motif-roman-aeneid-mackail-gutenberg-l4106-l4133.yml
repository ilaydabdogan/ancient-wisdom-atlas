canonical_text:
  quote: ''
  summary: Anchises explains that an indwelling spirit or soul sustains the cosmos
    and generates living beings; embodied souls are dulled by mortal bodies, retain
    ingrained faults after death, undergo punishments and purifications, reach Elysium,
    and after a thousand-year cycle are summoned to Lethe so they may forget and desire
    return to the body. He then leads his son and the Sibyl among the throng and climbs
    a hillock to view the ranks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit and a soul are said to sustain heaven, earth, the liquid fields,
    the moon, and the Titanian star, mingling within the mighty frame.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The generation of humans, beasts, winged things, and ocean-bred forms is said
    to come from this source.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The seeds of life are described as having fiery force and divine birth, but
    they are clogged and dulled by bodily taint, earthy frames, and mortal limbs.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Embodied beings fear, desire, sorrow, and rejoice, and cannot pierce the air
    while barred in the blind darkness of their prison-house.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the last ray of life is gone, bodily woes and deeply rooted evils do
    not wholly leave the dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Ghosts are schooled in punishment: some are stretched to viewless winds,
    some have guilt washed beneath the deep, and some have it burned away in fire.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After punishment, some are sent to Elysium and the happy fields until time
    removes ingrained soilure and leaves pure spiritual flame.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a thousand-year wheel has come fully round, a God summons souls to the
    river of Lethe so they may regain forgetfulness and desire to return into the
    body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anchises ceases speaking, leads his son and the Sibyl among a murmurous throng,
    and mounts a hillock to scan the long ranks and their countenances.
  category: action
  evidence_refs:
  - ev:7
