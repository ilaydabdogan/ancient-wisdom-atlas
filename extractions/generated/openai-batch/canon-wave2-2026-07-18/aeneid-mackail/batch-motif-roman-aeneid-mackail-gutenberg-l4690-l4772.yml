canonical_text:
  quote: ''
  summary: Allecto inflames a hunting accident involving Iülus, Ascanius, and a tame
    stag into armed conflict between Trojans and local rustics. After blood is shed
    and Almo and Galaesus die, Allecto reports success to Juno, who dismisses her.
    The Fury returns through the Vale of Amsanctus and a chasm opening toward Acheron
    and Cocytus.
  language: English
  quote_policy: summarized
