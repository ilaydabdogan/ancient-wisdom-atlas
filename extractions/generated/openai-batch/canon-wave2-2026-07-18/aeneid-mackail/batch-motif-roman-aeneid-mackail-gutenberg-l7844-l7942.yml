canonical_text:
  quote: ''
  summary: Turnus, seeing the Latins weakened and the duel-agreement pressed upon
    him, insists on single combat with Aeneas. Latinus counsels him to avoid the fight
    and recalls the broken marriage arrangement and war losses. Turnus refuses, Amata
    pleads with him, Lavinia blushes, and Turnus sends a challenge for the next dawn
    that Teucrian and Rutulian armies rest while the two rivals decide the war and
    Lavinia's marriage by blood. He then prepares his horses and arms, including divinely
    associated weapons, and brandishes his spear in battle fury.
  language: English
  quote_policy: summarized
