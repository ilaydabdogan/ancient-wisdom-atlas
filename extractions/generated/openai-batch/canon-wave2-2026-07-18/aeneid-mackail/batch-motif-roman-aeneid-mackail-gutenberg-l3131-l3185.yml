  quote: ''
  summary: A combatant kills an ox with a gauntlet and dedicates its life to Eryx
    in place of Dares' death. Aeneas then stages an archery contest using a pigeon
    tied to a mast as the target. Hippocoön strikes the mast, Mnestheus cuts the cord,
    Eurytion kills the bird, and Acestes' upward arrow becomes a fiery omen. Aeneas
    accepts the omen as divine and awards Acestes first honor and an ancestral bowl.
  language: English
