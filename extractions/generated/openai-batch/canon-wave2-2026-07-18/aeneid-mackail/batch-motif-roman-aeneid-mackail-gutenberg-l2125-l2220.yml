canonical_text:
  quote: "“the Queen... feeds the wound... and catches the fire unseen”"
  summary: The opening of Book Four describes Dido’s inward distress and attraction
    to Aeneas. She confides in Anna, recalls her dead husband Sychaeus, and resists
    remarriage. Anna argues that union with Aeneas would bring political safety and
    glory, and urges offerings and delay. Dido performs sacrifices and divination,
    but her passion increases; she wanders the city, hears Aeneas’ stories, mourns
    alone, holds Ascanius, and neglects public works. Juno then addresses Venus and
    proposes a bridal compact involving Dido and Aeneas.
  language: English
  quote_policy: quoted
