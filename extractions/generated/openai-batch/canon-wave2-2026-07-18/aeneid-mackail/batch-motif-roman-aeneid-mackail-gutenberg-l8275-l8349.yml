canonical_text:
  quote: ''
  summary: The passage describes Aeneas and Turnus alternately killing warriors in
    a battle, with their violence compared to forest fires and rushing rivers. Aeneas'
    mother inspires him to turn against the Latin city. Aeneas summons captains, addresses
    the Teucrian army from a mound, invokes Jupiter, threatens to raze the city with
    fire unless it yields, and says the treaty must be reclaimed in fire. The Teucrians
    attack the walls, while Aeneas reproaches Latinus and calls the gods to witness
    that the Italians have broken a second treaty. Inside the city, citizens are divided
    between opening the gates and defending the walls, and their alarm is compared
    to bees smoked inside a recessed rock.
  language: English
  quote_policy: summarized
