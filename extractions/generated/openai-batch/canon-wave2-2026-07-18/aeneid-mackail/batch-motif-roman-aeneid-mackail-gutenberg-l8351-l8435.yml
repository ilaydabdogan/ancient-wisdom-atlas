canonical_text:
  quote: ''
  summary: The Latin city is shaken by Aeneas' assault. The queen, believing Turnus
    destroyed, hangs herself; Lavinia and the Latin women lament, and Latinus mourns.
    Turnus, away from the city, hears the tumult while his divine sister, disguised
    as his charioteer, urges him to keep fighting elsewhere. Turnus recognizes her
    and speaks of death, shame, fallen companions, and the estrangement of heaven.
    The wounded messenger Saces reports the city in danger, the queen dead, and all
    Latins looking to Turnus. Seeing flames on a turret, Turnus accepts fate, leaves
    his chariot and sister, rushes to the city walls, and calls for the armies to
    stand aside so that he alone may expiate the broken treaty and decide the matter
    by the sword.
  language: English
  quote_policy: summarized
