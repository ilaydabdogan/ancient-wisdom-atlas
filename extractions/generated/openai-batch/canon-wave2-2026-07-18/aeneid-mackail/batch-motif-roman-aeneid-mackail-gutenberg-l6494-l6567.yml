canonical_text:
  quote: ''
  summary: A catalogue names allied leaders and ships moving to aid Troy. At night
    Aeneas pilots his ship and is met by sea nymphs who had once been his fleet, transformed
    by Cybele. Cymodocea warns him that Ascanius is besieged, tells him of Turnus'
    plan, urges preparation for battle, and points to the divine shield. Aeneas prays
    to the mother of gods, dawn arrives, he signals with the blazing shield, the Trojans
    take heart, and Turnus exhorts his men to oppose the landing at the shore.
  language: English
  quote_policy: summarized
