  quote: ''
  summary: Aeneas views the guarded and fiery city of Tartarus. The priestess explains
    the divine judgment and punishments of hidden crimes, names mythic offenders and
    their torments, then leads Aeneas onward to a gateway where he performs a water-sprinkling
    and plants a bough.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas looks back and sees, under a cliff on the left, a wide city with a
    triple wall and a racing river of boiling flame called Tartarean Phlegethon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The city has a huge adamant-pillared gate, an iron tower, and Tisiphone keeps
    sleepless watch at the entry in a bloodstained pall.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moans, lashes, iron clanking, and dragging chains are heard from the place.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aeneas stops, is dismayed, and asks the priestess what crimes and punishments
    are present there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priestess says no pure foot may tread the guilty courts, and says Hecate
    taught her how the gods punish and guided her through the realm.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rhadamanthus holds sway there, chastises secret crime, reveals guilt, and
    exacts confession from those who hid wrongdoing until death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tisiphone tramples shivering sinners, menaces them with snakes and a scourge,
    and summons her sisters before the gates open.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A monstrous Hydra with fifty black yawning throats sits within and guards
    the threshold.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Tartarus gapes into gloom at a depth described as twice the upward distance
    to Olympus and heaven.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Titans' brood lies in the abyss after being hurled down by the thunderbolt;
    the twin Aloids are also seen, described as having tried to pull down heaven and
    displace Jove.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Salmoneus is described as punished for imitating Jove's flame and thunder,
    claiming divine worship, and being dashed down by Jove's shaft in a whirlwind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Tityos stretches over nine acres while a vulture eats his liver and entrails,
    which continually grow again without rest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage mentions the Lapithae, Ixion, and Pirithous, and describes punishments
    involving a nearly falling stone, an unreachable feast, and a Fury guarding tables
    with a torch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Groups of condemned people include those who hated brothers, struck a parent,
