canonical_text:
  quote: Arise out of our dust, O unnamed avenger, to pursue the Dardanian settlement
    with firebrand and steel.
  summary: Dido sees Aeneas' fleet leaving at dawn, calls for pursuit, curses Aeneas
    and his descendants through invoked deities, commands enduring enmity between
    Tyrians and the Dardanian line, prepares rites through Barce and Anna, ascends
    the funeral pyre, takes the Dardanian sword, and speaks of death, the underworld,
    and fire as an omen for the departing Aeneas.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At dawn the Queen watches from a tower and sees first light, the fleet under
    sail, and the shore and haven empty of oarsmen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Queen strikes her breast, tears her hair, and calls for armed pursuit,
    fire, weapons, and oars.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Dido reproaches herself and describes the departing man as one who carries
    household ancestral gods and once carried his aged father on his shoulders.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dido imagines violent acts against Aeneas, his comrades, Ascanius, his father,
    son, and race, and imagines burning his camp and ships before throwing herself
    atop the destruction.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dido invokes the Sun, Juno, Hecate, avenging sisters, and gods of dying Elissa,
    then prays that Aeneas suffer war, exile, separation from Iülus, deaths among
    his people, early death, and lack of burial.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dido orders the Tyrians to pursue Aeneas' seed with hatred through future
    ages and invokes an unnamed avenger from her dust to pursue the Dardanian settlement
    with firebrand and steel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dido seeks to leave the hateful light and instructs Barce to summon Anna with
    river water, expiatory beasts, and a veiled chaplet for rites of Stygian Jove
    and for the funeral pyre.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dido enters the inner courts, mounts the high funeral pyre, unsheathes the
    sword of Dardania, sees Ilian raiment and the known bed, and sinks on the pillow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dido speaks to the raiment, asks it to receive her spirit, says her allotted
    life is fulfilled, and says she will go as a queenly phantom under the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dido recalls founding a renowned city, seeing her walls rise, and avenging
    her husband, then says death will come and asks that the departing Dardanian see
    the fire at sea as an omen.
  category: speech
  evidence_refs:
  - ev:7
