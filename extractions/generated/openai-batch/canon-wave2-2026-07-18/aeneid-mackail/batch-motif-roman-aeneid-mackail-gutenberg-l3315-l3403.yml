canonical_text:
  quote: ''
  summary: Aeneas, troubled after the loss of ships, receives counsel from Nautes
    to leave the weary in Sicily under Acestes and proceed toward Italy with chosen
    companions. The apparition of Anchises confirms the counsel and instructs Aeneas
    to seek him later in the underworld with the Sibyl’s guidance. Aeneas organizes
    a new settlement, makes ritual offerings, departs by sea, and Venus petitions
    Neptune for safe passage for the Trojan remnant against Juno’s hostility.
  language: English
  quote_policy: summarized
