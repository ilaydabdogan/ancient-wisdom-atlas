canonical_text:
  quote: one life shall be given for many
  summary: Neptune reassures the Cytherean goddess that Aeneas will safely reach Avernus,
    though one life will be lost on the sea. Neptune calms the ocean as Aeneas' fleet
    sails by night. Sleep, disguised in Phorbas' likeness, tries to persuade Palinurus
    to rest; when Palinurus refuses to abandon the helm, Sleep uses a Lethean and
    Stygian bough to overcome him and throws him into the sea. The fleet continues
    safely, and Aeneas takes the helm near the Siren cliffs while mourning Palinurus.
  language: English
  quote_policy: quoted
