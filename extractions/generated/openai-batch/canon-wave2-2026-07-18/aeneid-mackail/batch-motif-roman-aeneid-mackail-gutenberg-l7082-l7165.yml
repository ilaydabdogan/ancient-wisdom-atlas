canonical_text:
  quote: ''
  summary: At dawn Aeneas erects an oak trophy from Mezentius’ captured arms and dedicates
    it to Mars, then urges his men toward the Latin city while ordering proper burial
    rites for the dead. He mourns Pallas, sends an escort and funeral gifts to Evander,
    arranges Pallas on a bier with garments, spoils, horses, captives, and named trophies,
    and then returns to the camp as war calls him onward.
  language: English
  quote_policy: summarized
