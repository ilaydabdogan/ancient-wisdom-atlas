canonical_text:
  quote: ''
  summary: The opening of Book 1 presents Aeneas as a fated exile from Troy journeying
    toward Italy to found a city and bring his gods into Latium. Juno, favoring Carthage
    and fearing the future Trojan-descended people, recalls past grievances and seeks
    to obstruct the Trojans. She goes to Aeolia, where Aeolus restrains the winds
    in a cavern under a mountain, and asks him to unleash a storm against the Trojan
    fleet, promising the nymph Deïopea as a bride. Aeolus complies by striking the
    hollow hill, releasing winds that darken the sea and terrify the Trojans; Aeneas
    laments that he did not die at Troy.
  language: English
  quote_policy: summarized
