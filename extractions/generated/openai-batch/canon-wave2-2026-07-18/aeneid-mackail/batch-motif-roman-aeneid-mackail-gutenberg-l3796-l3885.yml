canonical_text:
  quote: This is the land of Shadows, of Sleep, and slumberous Night; no living body
    may the Stygian hull convey.
  summary: 'A prophetess consoles Palinurus with a prophecy of burial rites and a
    named place. Aeneas and the prophetess approach the Stygian river, where the ferryman
    challenges them and bars living bodies until the prophetess reveals the fated
    bough. They cross, pacify Cerberus with a drugged cake, and enter regions of the
    dead: infants, the falsely condemned, suicides, and those wasted by love. Aeneas
    encounters Dido, speaks remorsefully, but she remains silent and withdraws to
    Sychaeus.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The soothsayer tells Palinurus that heaven’s decrees cannot be bent by prayer,
    but that bordering cities will appease his dust, raise a tomb, make yearly offerings,
    and preserve his name in the place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas and the prophetess complete the beginning of their journey and approach
    the Stygian river through silent woodland.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Stygian waterman challenges the armed visitor, describes the region as
    the land of Shadows, Sleep, and Night, and says that no living body may be carried
    in the Stygian hull.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The waterman recalls earlier underworld intrusions by Alcides, Theseus, and
    Pirithoüs, including violence toward the warder of Tartarus and an attempted abduction
    from Dis’s bridal chamber.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prophetess replies that no violent plot is intended; Aeneas of Troy descends
    to meet his father in Erebus, and she reveals a hidden bough.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After seeing the bough, the waterman’s anger subsides; he clears his vessel,
    takes Aeneas aboard, and lands the prophetess and prince on ooze and sedge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cerberus bays with three throats from a cavern, with serpents bristling on
    his neck.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The prophetess throws Cerberus a honey and drugged grain cake; he devours
    it and collapses asleep, allowing Aeneas to enter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The first underworld groups include crying infant souls, those condemned on
    false accusation, and dwellings assigned through lot and judgment under Minos.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those who killed themselves are separated from the upper air by the gloomy
    pool and Styx’s ninefold barrier.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Wailing Fields contain those wasted by pitiless love, hidden among myrtle
    thickets; several named mythic figures are seen there.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Aeneas sees Dido in the vast forest, speaks remorsefully and asks her not
    to withdraw; she remains silent, turns away, and flees to Sychaeus while Aeneas
    follows with pitying tears.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
