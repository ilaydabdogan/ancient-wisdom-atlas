canonical_text:
  quote: ''
  summary: Juno sends Iris to Turnus, informing him that Aeneas is absent and urging
    an attack on the Trojan camp. Turnus receives the sign, prays with water, advances
    with his army, and attacks the fortified camp and fleet with fire. The narrator
    then recounts how the Mother of gods had asked Jove to protect the ships made
    from her sacred grove on Ida, and how Jove promised that, after reaching Ausonian
    haven, the ships would lose their mortal bodies and become sea goddesses.
  language: English
  quote_policy: summarized
