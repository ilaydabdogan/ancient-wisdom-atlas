canonical_text:
  quote: whosoever hath sullied thy body with a wound shall pay death for due.
  summary: After Camilla's death, Opis, sentinel of Trivia/Diana, laments from the
    hilltops and says Camilla's death will be remembered and avenged. Opis descends
    to the tomb mound of Dercennus, marks Arruns, and kills him with an arrow from
    Diana's weapons. Camilla's forces and the Rutulians retreat toward the city, where
    slaughter occurs at the gates and mothers on the walls use improvised weapons.
    Acca reports Camilla's fall to Turnus; Turnus leaves the hills by Jove's will
    as Aeneas advances, but sunset and night prevent immediate battle.
  language: English
  quote_policy: quoted
