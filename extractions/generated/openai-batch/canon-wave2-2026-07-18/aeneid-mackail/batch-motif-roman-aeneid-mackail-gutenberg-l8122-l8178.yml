canonical_text:
  quote: ''
  summary: Aeneas tries to halt renewed fighting by invoking the truce and his right
    to single combat with Turnus. An arrow of unknown source wounds him. Turnus, seeing
    Aeneas withdraw, mounts his chariot and launches a violent battlefield assault,
    compared to Mavors and to the North Wind. He kills or wounds multiple named opponents,
    taunts Eumedes as a failed Trojan claimant to Italian land, and finally kills
    Phegeus after Phegeus tries to stop his horses.
  language: English
  quote_policy: summarized
