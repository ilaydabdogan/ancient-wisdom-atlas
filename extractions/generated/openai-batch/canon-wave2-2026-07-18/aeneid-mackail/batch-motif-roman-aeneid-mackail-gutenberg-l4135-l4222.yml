canonical_text:
  quote: ''
  summary: Anchises, in the underworld vision, instructs Aeneas about future Dardanian,
    Italian, Alban, and Roman descendants. He points out souls who will become kings,
    founders, lawgivers, conquerors, and statesmen, including Silvius, Romulus, Caesar
    Augustus, Brutus, and Marcellus. The speech frames Roman destiny through ancestry,
    divine parentage, city founding, lawgiving, imperial expansion, civil war warning,
    and the Roman charge to govern nations, impose peace, spare the conquered, and
    defeat the proud.
  language: English
  quote_policy: summarized
