canonical_text:
  quote: ''
  summary: Aeneas lands allied forces from ships onto the beach. Tarchon drives his
    vessel toward shore, but his galley breaks on a shoal. Turnus arrays Latin forces
    against the landing. Aeneas leads a violent charge, killing several opponents,
    while Venus turns aside some darts. Other warriors join the fighting, which is
    compared to opposing winds locked in balance. Elsewhere Pallas sees Arcadians
    retreating on rough ground and exhorts them to stand and cut through the enemy
    because the sea blocks retreat.
  language: English
  quote_policy: summarized
