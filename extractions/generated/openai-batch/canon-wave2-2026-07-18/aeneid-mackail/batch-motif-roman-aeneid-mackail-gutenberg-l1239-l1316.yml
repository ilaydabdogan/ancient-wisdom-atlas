canonical_text:
  quote: ''
  summary: During the sack of Troy, Priam arms himself despite his age. Hecuba and
    her daughters gather at a palace altar beneath an ancient bay tree. Pyrrhus pursues
    and kills Polites before his parents, then kills Priam at the altar while Troy
    burns. Aeneas, terrified, thinks of his own family, sees the daughter of Tyndarus
    hiding at Vesta's shrine, and moves toward vengeance until his divine mother appears
    and restrains him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Priam sees his captured city and invaded house, puts on long-disused armour,
    girds on an unavailing sword, and moves toward the enemy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the palace under the open sky there is a massive altar, with an ancient
    bay tree leaning near it and shading the household gods.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hecuba and her daughters crowd around the altar-stones and clasp the gods'
    images; Hecuba urges Priam to come to the altar, saying it will protect them all
    or they will share death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Polites, one of Priam's children, flees wounded through the palace while Pyrrhus
    pursues him with a spear; Polites falls and dies before his parents in a pool
    of blood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Priam rebukes Pyrrhus, asks the gods to repay the deed, contrasts him with
