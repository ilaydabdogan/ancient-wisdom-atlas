canonical_text:
  quote: Pallas it is, Pallas who now strikes the sacrifice, and exacts vengeance
    in thy guilty blood.
  summary: Aeneas challenges Turnus. Turnus attempts to hurl a great landmark stone
    but is divinely weakened and fails. Aeneas wounds Turnus with a spear. Turnus
    begs for mercy, invoking his father Daunus and yielding Lavinia. Aeneas hesitates,
    then sees Pallas's belt on Turnus, becomes enraged, and kills him, declaring the
    death vengeance for Pallas.
  language: English
  quote_policy: quoted
