canonical_text:
  quote: ''
  summary: Venus and Juno discuss a planned union of Dido and Aeneas. Juno arranges
    a hunt, storm, and shared cave refuge where the pair are joined under divine signs.
    Rumour then spreads the report through Libya and to King Iarbas, who angrily prays
    to Jove before his many temples and altars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Venus recognizes the hidden purpose of Juno''s proposal: to divert the Trojan
    realm toward Libya, and she expresses uncertainty about Jove''s will regarding
    Tyrians and Trojans becoming one people under a treaty.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juno proposes that Dido and Aeneas go hunting, that she will send a storm
    of rain, hail, and thunder, and that the pair will take shelter in the same cavern
    where she will unite them in wedlock with Hymen present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Venus assents to Juno's request and laughs at the invention described as wily.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn a chosen hunting company leaves with nets, toils, hunting spears,
    horsemen, and hounds; Dido appears richly adorned, and Aeneas joins her company
    with Iulus and the Trojan train.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aeneas is compared in a simile to Apollo visiting Delos, with emphasis on
    beauty, hair bound with gold, and arrows on the shoulder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hunt reaches mountain heights and pathless coverts; goats and stags flee,
    while Ascanius rides in the valleys hoping for a boar or lion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sky darkens and roars; rain, hail, thunder, and streams from the hills
    scatter the Tyrian and Trojan companies and Ascanius.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dido and Aeneas take refuge in the same cavern; Primeval Earth and Juno give
    a sign, fires flash in the air, and Nymphs cry from the mountaintop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator states that this day opened the gate of death and the springs
    of ill, and that Dido calls the union marriage rather than keeping love secret.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rumour is personified as swift, vast, winged, many-eyed, many-tongued, many-lipped,
    and many-eared; she is said to move by night and keep watch by day over cities.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rumour spreads reports about Aeneas and Dido through Libya and carries them
    to King Iarbas, inflaming his anger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Iarbas is described as the son of Ammon and a Garamantian Nymph; he has built
