canonical_text:
  quote: ''
  summary: Aeneas marks an offshore rock as the turning goal for a rowing race. The
    crews prepare, start at a trumpet signal, and compete fiercely while spectators
    cheer. Gyas loses the lead when his cautious steersman Menoetes turns wide of
    the rocks; Gyas throws him overboard and takes the helm. Sergestus later strikes
    a reef, while Mnestheus exhorts his men, invokes Neptune as giver of victory,
    accelerates, overtakes damaged or wavering rivals, and pursues Cloanthus near
    the finish.
  language: English
  quote_policy: summarized
