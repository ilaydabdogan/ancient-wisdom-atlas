- id: obs:3
  text: The serpents first coil around Laocoön's two young children and bite them,
    then seize Laocoön as he comes armed to help, wrapping his waist and neck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After killing Laocoön, the two serpents glide to the high sanctuary of the
    fierce Tritonian and take shelter beneath the goddess's shield.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Trojans are terrified and say Laocoön has suffered the deserved result
    of piercing the consecrated wood with his spear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Trojans break open the walls, fit rolling wheels and hempen ropes to the
    wooden horse, and draw it into the city while boys and unmarried girls chant hymns
    and pull the rope.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The horse halts four times in the gateway, and armor sounds four times inside
    its body, but the Trojans continue and place it in the citadel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cassandra speaks of the coming doom, but the Trojans do not believe her; the
    city decorates divine shrines with festal boughs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: At night, while the Trojans sleep, the Argive fleet returns from Tenedos;
    a flame is sent up from the royal galley, and Sinon secretly releases the Greeks
    enclosed in the wooden horse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Greek warriors emerge from the hollow horse, kill watchmen, open the gates,
