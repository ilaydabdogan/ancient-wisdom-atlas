canonical_text:
  quote: ''
  summary: Aeneas recounts the death of Laocoön and his children by two sea-serpents,
    the Trojans' decision to bring the wooden horse into Troy despite omens and Cassandra's
    warning, the release of Greek warriors from the horse at night, and a dream in
    which the wounded Hector tells Aeneas to flee with Troy's holy things and household
    gods and seek a future city.
  language: English
  quote_policy: summarized
