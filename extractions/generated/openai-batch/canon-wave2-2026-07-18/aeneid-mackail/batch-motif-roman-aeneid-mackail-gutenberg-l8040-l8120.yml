canonical_text:
  quote: ''
  summary: A treaty is ritually sealed with animal sacrifice at altars. As the Rutulians
    waver, Juturna, disguised as Camertus, stirs them against the agreement and shows
    an avian omen. Tolumnius interprets the omen as divine approval for renewed battle,
    throws a spear, and kills an enemy. The treaty collapses; altars are broken, sacred
    implements are carried off, Latinus withdraws with the offended gods, and several
    warriors kill one another near or with objects from the ritual setting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mutual treaty is sealed in sight of princes, followed by the killing of
    consecrated animals over flames and the placing of offerings on altars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rutulians judge the proposed combat unequal and become unsettled, especially
    when they see Turnus worshipping at the altar with downcast eyes and a pale, wasted
    appearance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Juturna, identified as Turnus' sister, enters the ranks in the feigned form
    of Camertus and spreads arguments against letting one life stand for many.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Juturna's speech claims that Turnus devotes himself for the altars and that
    the people will lose their country if they remain inactive.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The soldiers, including Laurentines and Latins, are moved to desire arms and
    wish the treaty undone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'A heavenly bird-sign appears: Jove''s tawny bird seizes a swan, is harried
    by other birds, drops the prey into the river, and flies into the clouds.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tolumnius the augur welcomes the omen as a sign of deity and urges the people
    to seize the sword and follow him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tolumnius hurls a spear at the enemy, and it kills one of nine brothers, a
    son of Gylippus the Arcadian and a Tyrrhene mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Both sides rush back into battle; altars are pulled apart, weapons fill the
    air, sacred vessels and hearth-fires are removed, and Latinus retreats with the
    gods of the broken treaty.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Messapus rides against Aulestes near the altars and kills him with a spear
    while saying the high gods receive a better victim.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Corynaeus takes a charred brand from the altar, throws flame into Ebysus'
    face, then forces him down and kills him with a sword.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Podalirius pursues Alsus with a sword, and Alsus strikes back with an axe,
    killing him by cutting through brow and chin.
  category: action
  evidence_refs:
  - ev:11
