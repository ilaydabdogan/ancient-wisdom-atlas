canonical_text:
  quote: ''
  summary: Aeneas hears that the Trojan camp is near disaster and enters the battle
    in fury, remembering Pallas, Evander, Anchises, and Iulus. He takes captives for
    sacrifice, rejects pleas from Magus, Tarquitus, and Liger, kills several opponents
    including a priest, and is compared to a many-armed fiery giant, a torrent, and
    a black whirlwind. Ascanius breaks out from the camp, and Jupiter tells Juno that
    Venus sustains the Trojan forces.
  language: English
  quote_policy: summarized
