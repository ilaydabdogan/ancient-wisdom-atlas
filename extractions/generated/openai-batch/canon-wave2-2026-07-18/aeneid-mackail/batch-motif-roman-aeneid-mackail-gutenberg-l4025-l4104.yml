canonical_text:
  quote: ''
  summary: Aeneas and the Sibyl enter the blessed Fortunate Woodlands of the underworld,
    where heroic and virtuous souls dwell among meadows, groves, music, games, and
    rivers. The Sibyl asks Musaeus where Anchises is, and he directs them onward.
    Aeneas meets Anchises, tries unsuccessfully to embrace his phantom, and then sees
    souls gathered by Lethe. Anchises explains that these souls are destined for second
    bodies and drink Lethe’s water of forgetfulness before returning to bodily life.
  language: English
  quote_policy: summarized
