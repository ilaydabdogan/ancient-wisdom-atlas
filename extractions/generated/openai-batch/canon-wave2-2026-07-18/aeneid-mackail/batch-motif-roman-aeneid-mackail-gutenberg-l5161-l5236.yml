canonical_text:
  quote: ''
  summary: King Evander explains to a Trojan guest that the local feast, altar, and
    rites honor a rescue from Cacus. He recounts how Cacus, a half-human fire-breathing
    son of Vulcan, lived in a gruesome cave and stole part of Alcides' cattle by dragging
    the animals backward. A heifer's lowing reveals the theft; Alcides opens the blocked
    cavern, enters through smoke and flames, strangles Cacus, displays the recovered
    cattle, and the community perpetuates sacrifice and libation to Hercules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Evander states that the rites, feast, and altar are not idle superstition
    but are due because the people were saved from bitter perils.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The place Evander indicates includes an overhanging cliff, shattered stones,
    a desolate mountain dwelling, and rocks rent away in ruin.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cacus' hold is a deep cavern impenetrable to sunbeams, with slaughter on the
    ground and human faces nailed on the doors.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cacus is described as a monstrous half-human, son of Vulcan, of giant bulk,
    who emits black fires from his mouth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Alcides arrives as an avenger and conqueror with bulls and oxen after the
    slaying of triple Geryon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cacus steals four bulls and four heifers and drags them by the tail into his
    cavern so that their tracks are reversed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A heifer lows from the cave and reveals the hidden imprisonment of the stolen
    cattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Alcides takes a heavy knotted oak club and pursues Cacus; Cacus flees into
    his cavern and blocks the doorway with a vast rock.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Alcides circles Mount Aventine three times, attacks the rocky portals three
    times without success, then tears loose a high rock and opens the cave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The opened cavern is described through a comparison to earth being torn apart
    to disclose an infernal house, pallid realms, a monstrous gulf, and ghosts in
    daylight.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cacus emits smoke and fire to darken the cave; Alcides leaps into the flames
    and strangles him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Cacus' death, the doors are opened, the stolen oxen and plunder are
    shown, and Cacus' corpse is dragged out by the feet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says that the sacrifice is thereafter solemnized, the altar is
    established in the grove, and participants wear leafy sprays, hold cups, pour
    wine, and supplicate the gods.
  category: action
  evidence_refs:
  - ev:8
