canonical_text:
  quote: ''
  summary: Mezentius, prompted by Jove, enters the battle against the Teucrians with
    Tyrrhene support. He defeats or kills several warriors, gives spoils to Lausus,
    is described through cliff, boar, and lion similes, kills Acron, duels Orodes,
    hears Orodes foretell his own near death, and the passage closes with a chain
    of additional battlefield slayings.
  language: English
  quote_policy: summarized
