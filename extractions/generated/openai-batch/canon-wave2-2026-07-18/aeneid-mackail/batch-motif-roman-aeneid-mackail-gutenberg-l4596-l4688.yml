canonical_text:
  quote: ''
  summary: Allecto first drives Queen Amata into serpent-poisoned Bacchic frenzy,
    leading her to hide her daughter and summon the Latin matrons. Allecto then flies
    to Ardea, disguises herself as the aged priestess Calybe, urges Turnus to war
    in Juno's name, reveals her Fury form when he rejects her, and hurls a fiery brand
    into him. Turnus wakes terrified and commands his warriors to prepare for battle.
  language: English
  quote_policy: summarized
