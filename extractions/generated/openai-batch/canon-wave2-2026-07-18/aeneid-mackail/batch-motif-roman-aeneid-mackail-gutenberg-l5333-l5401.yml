canonical_text:
  quote: ''
  summary: A goddess embraces her consort, the Lord of Fire, and he consents to undertake
    martial craft for her. After sleeping, he rises before dawn, descends to Vulcan's
    volcanic caverns, and commands the Cyclopes to abandon other divine weapon-work
    and forge a warrior's armour, including a sevenfold shield. The scene then shifts
    to Evander, who rises at dawn, equips himself, and meets Aeneas with their companions
    for private conversation.
  language: English
  quote_policy: summarized
