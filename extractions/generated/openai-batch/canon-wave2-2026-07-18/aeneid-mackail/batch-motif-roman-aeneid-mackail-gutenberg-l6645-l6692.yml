canonical_text:
  quote: ''
  summary: Pallas enters the enemy ranks, kills several opponents, and rallies the
    Arcadians. The passage dwells on the deaths of twin warriors, compares the gathering
    fighters to fire spreading over a plain, recounts Halesus's slaughter of opponents
    and fate, then presents Pallas praying to Tiber for a successful spear-cast and
    promising spoils to the god's oak. Halesus dies, Lausus counters by killing Abas,
    and Pallas and Lausus are shown as matched young warriors whose return home and
    direct duel are denied by fortune and Olympian authority.
  language: English
  quote_policy: summarized
