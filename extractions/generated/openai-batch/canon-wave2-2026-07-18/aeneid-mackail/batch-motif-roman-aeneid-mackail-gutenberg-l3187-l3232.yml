canonical_text:
  quote: ''
  summary: Aeneas orders Epytides to summon Ascanius and the boys for an equestrian
    armed display in honor of Ascanius's grandsire. The Trojan boys enter on horses
    with garlands, spears, quivers, and gold ornaments, arranged in three divisions
    under named youths. At Epytides' signal they perform wheeling formations, charges,
    retreats, mock combat, and peaceful riding. Their interlaced movement is compared
    to the Cretan labyrinth and to dolphins at sea. The passage then gives an etiological
    account of this riding-game as revived by Ascanius at Alba, taught to the Old
    Latins, preserved by Rome, and called Troy or the Trojan troop.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas calls Epytides, described as guardian and attendant of ungrown Iülus,
    and tells him to instruct Ascanius to bring out the boys and their horses for
    a display in honor of his grandsire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas orders the crowd to withdraw from the racecourse and leave the lists
    free.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys enter before their parents on bitted horses, and the people of Troy
    and Trinacria admire them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys wear trimmed garlands; each carries two steel-tipped cornel spear-shafts;
    some carry quivers; each has a flexible circlet of twisted gold around the breast
    and neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The riders are organized into three troops with three captains, and each captain
    is followed by a division of twelve boys.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Little Priam, Atys, and Iülus are named among the leading riders; Iülus rides
    a Sidonian horse given by Dido, while the rest ride Sicilian horses of Acestes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Epytides gives the signal and sounds his whip; the boys separate in equal
    numbers, deploy in threes, wheel about, and charge with levelled arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boys perform alternating charges and retreats, interlink circles, simulate
    armed battle, show flight, turn lances to charge, and then ride side by side in
    peace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The riders' movement is compared to the tangled path of the Cretan labyrinth
    and to dolphins swimming through wet seas.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The passage states that Ascanius later revived this riding-fashion at Alba
    the Long, taught it to the Old Latins, that the Albans passed it to their children,
    and that Rome preserved it as an ancestral observance called Troy, with the boys
    called the Trojan troop.
  category: sequence
  evidence_refs:
  - ev:7
