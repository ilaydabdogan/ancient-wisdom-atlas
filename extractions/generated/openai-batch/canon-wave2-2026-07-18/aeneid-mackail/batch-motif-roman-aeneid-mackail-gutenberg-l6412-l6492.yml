canonical_text:
  quote: ''
  summary: Jupiter declares that he will hold the fortunes of Trojans and Rutulians
    in balance and allow fate to proceed, sealing the declaration with an oath and
    a nod that shakes Olympus. The Rutulians besiege the Trojan camp, while the Aeneadae
    defend the walls. Aeneas, having secured Etruscan alliance, sails with allied
    leaders toward the conflict. The catalogue includes diviners, commanders, symbolic
    ship ornaments, and the story of Cupavo’s swan-plumed crest, traced to Cycnus’s
    mourning for Phaethon and transformation into a white-plumed flying being.
  language: English
  quote_policy: summarized
