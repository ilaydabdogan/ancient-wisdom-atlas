canonical_text:
  quote: ''
  summary: The Latins bury and burn their dead after battle, mourn in Latinus’ city,
    and blame the war and Turnus’ marriage claim. Envoys return from Diomede with
    news that he refuses alliance and advises peace with Aeneas. Venulus reports Diomede’s
    warning that the Greek victors at Troy have suffered divine punishment and exile,
    and that Aeneas should not be opposed in arms. The Ausonian council murmurs before
    Latinus prepares to speak.
  language: English
  quote_policy: summarized
