canonical_text:
  quote: ''
  summary: Ilioneus addresses King Latinus, explaining that the Trojans have come
    deliberately, claiming descent from Jove and guidance from Apollo, asking for
    land, landing, air, and water, and offering relics from Troy. Latinus reflects
    on an oracle concerning his daughter's foreign marriage, grants peace, asks Aeneas
    to come, and sends horses and a chariot as gifts. Juno then sees the Trojans rejoicing
    and settling in the land and reacts with pain.
  language: English
  quote_policy: summarized
