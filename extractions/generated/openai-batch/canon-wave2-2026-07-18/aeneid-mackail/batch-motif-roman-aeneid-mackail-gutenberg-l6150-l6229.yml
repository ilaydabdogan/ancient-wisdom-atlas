canonical_text:
  quote: ''
  summary: Ascanius prays to Jupiter before shooting Remulus and receives a thunder
    sign. Apollo praises Iülus, assumes the form of aged Butes, and restrains him
    from further battle. Fighting continues at the Trojan camp. Pandarus and Bitias
    open the gates to the enemy; Turnus rushes to the gate and kills several opponents,
    including Bitias, whose fall is described through a large sea-stone simile.
  language: English
  quote_policy: summarized
