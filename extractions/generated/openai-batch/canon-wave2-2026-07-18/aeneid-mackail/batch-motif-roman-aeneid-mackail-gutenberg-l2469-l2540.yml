canonical_text:
  quote: ''
  summary: Aeneas, though emotionally moved by Dido, obeys divine commands and returns
    to the fleet, where the Trojans prepare to sail. Dido sees the departure preparations,
    sends Anna to plead for delay, and is refused. Fate keeps Aeneas unmoved, compared
    to a rooted oak resisting winds. Dido prays for death, sees ominous ritual signs,
    hears and dreams troubling presages, is compared to Pentheus and Orestes in frenzy,
    and secretly resolves how to die.
  language: English
  quote_policy: summarized
