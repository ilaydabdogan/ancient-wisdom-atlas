canonical_text:
  quote: ''
  summary: An Olympian creator watches battle and incites Tarchon, who rallies retreating
    troops and seizes an enemy in combat, an action compared to an eagle carrying
    a serpent. Arruns stalks Camilla while she pursues the richly armed Chloreus for
    spoils. Arruns prays to Apollo of Soracte for permission to strike Camilla; Phoebus
    grants Camilla's death but not Arruns' safe return. Camilla is wounded by the
    spear, gives Acca a final message for Turnus, dies, and the battle intensifies.
  language: English
  quote_policy: summarized
