canonical_text:
  quote: ''
  summary: A Trojan-allied cavalry force with Etruscan captains approaches the walls
    and is met by Latin, Rutulian, and Camilla-led forces. The mounted lines charge,
    exchange weapons, suffer first losses, alternate pursuit and retreat near the
    gates, then lock into a fierce third encounter. Named warriors fall or are unhorsed,
    and the passage ends with bloodshed and the pursuit of noble death by wounds.
  language: English
  quote_policy: summarized
