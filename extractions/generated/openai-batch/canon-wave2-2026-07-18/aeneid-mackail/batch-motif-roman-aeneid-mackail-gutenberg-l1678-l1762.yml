  summary: Aeneas narrates a storm-driven sea passage, a landing on the Strophades,
    conflict with the Harpies after the Trojans slaughter livestock and feast, Celaeno's
    prophecy that they will reach Italy but suffer hunger before founding their city,
    Anchises' prayers and sacrifices, and the fleet's onward movement past Greek islands
    to Actium and Buthrotum.
