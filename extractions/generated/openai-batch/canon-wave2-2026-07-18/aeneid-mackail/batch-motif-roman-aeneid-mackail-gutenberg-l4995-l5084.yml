canonical_text:
  quote: ''
  summary: Turnus raises war in Latium, and Latian leaders seek allies against Aeneas.
    Aeneas, troubled by the threat, sleeps by the Tiber. The river god appears, reassures
    him that Latium is his destined home, gives a sign of a white sow with thirty
    white young, foretells Ascanius' future founding of Alba, and directs Aeneas to
    seek alliance with Evander's Arcadians. Aeneas wakes, prays to the river powers,
    sees the promised sow, sacrifices it to Juno, and travels upstream by boat toward
    Evander's settlement at the future site of Rome.
  language: English
  quote_policy: summarized
