canonical_text:
  quote: ''
  summary: In a balanced and destructive battle, the gods look on while Mezentius
    confronts Aeneas. Mezentius throws at Aeneas but kills Antores instead. Aeneas
    wounds Mezentius, and Lausus, moved by love for his father, intervenes to shield
    him. Aeneas warns Lausus, then kills him. Seeing the dying youth, Aeneas pities
    him, thinks of filial affection, lets him keep his armor, and returns his body
    toward his parents' ghosts and ashes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: War brings equal loss to both sides; conquerors and conquered kill and fall,
    and neither side retreats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods in Jove's house pity mortal agony; Venus and Juno watch from opposite
    sides, and Tisiphone rages among the combatants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mezentius advances over the plain, brandishing a huge spear and being described
    as vast like Orion in ocean and cloud imagery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aeneas sees Mezentius and moves to meet him; Mezentius waits and measures
    the range for a spear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mezentius invokes his right hand and weapon, vows Lausus as a living trophy
    in Aeneas' spoils, and throws a spear that deflects from the shield and kills
    Antores.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Antores is identified as a companion of Hercules from Argos who had stayed
    with Evander and settled in an Italian town; dying, he remembers Argos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aeneas throws his spear through Mezentius' armor into his groin, then draws
    his sword and presses upon the struggling enemy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lausus sees his father's danger, weeps from love for him, enters the fight,
    and delays Aeneas' raised blow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lausus' comrades support the intervention with cries and missiles so that
    Mezentius can withdraw under his son's shield; Aeneas shelters under the missile
    storm.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aeneas warns Lausus that he is running toward death and that affection has
    led him into rashness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Aeneas kills Lausus with a sword-thrust through his shield and the tunic sewn
    by his mother; blood fills his breast and his life passes to the underworld.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Aeneas sees Lausus' dying face, pities him, recalls his own filial affection,
    allows him to keep his armor, says he restores him to his parents' ghosts and
    ashes, and lifts him from the ground.
  category: action
  evidence_refs:
  - ev:8
