canonical_text:
  quote: ''
  summary: A storm scatters and damages Aeneas' fleet until Neptune perceives the
    disorder, rebukes the winds, and calms the sea. The surviving Trojans reach a
    sheltered Libyan harbor with cliffs, groves, a cavern, and springs. Achates kindles
    a fire and the company prepares salvaged grain. Aeneas searches for missing ships,
    hunts seven stags for the seven surviving ships, distributes meat and wine, and
    urges his companions to endure until destiny brings them to Latium, where Troy
    may rise again.
  language: English
  quote_policy: summarized
