canonical_text:
  quote: ''
  summary: A divine mother addresses her son during Troy's fall, directs him away
    from wrath toward care for his family, reveals that gods are destroying the city,
    and promises to guide him safely home. The narrator sees Troy burning and reaches
    his ancestral house, where Anchises refuses exile. The family pleads; the narrator
    prepares to return to battle rather than abandon his father. Creüsa pleads with
    him while holding Iülus, after which a harmless flame appears around the child's
    head. Anchises prays to Jupiter to confirm the omen.
  language: English
  quote_policy: summarized
