- id: claim:2
  claim: Wên Wang's dream functions as political authorization for appointing the
    old man, while the later comment frames it as satisfying public perception rather
    than proving supernatural necessity.
  claim_level: same_function
  target: royal_legitimacy / dream authorization pattern
