- id: motif:2
  label: hidden sage as reluctant or withdrawn counselor
  taxonomy_refs:
  - wisdom
  basis: The old man of Tsang is first encountered in non-instrumental fishing, governs
    effectively without intrusive changes, is elevated to Grand Tutor, and then disappears
    when asked about broader rule.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents him as an effective administrator but does not explicitly
    call him a sage.
- id: motif:3
  label: dream authorization for political appointment
  taxonomy_refs:
  - royal_legitimacy
  basis: Wên Wang reports a dream commanding the old man's appointment, and the ministers
    accept it as a command from his late father; Confucius later says the dream satisfied
    the vulgar mind.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage itself limits a supernatural reading by saying the dream served
    public acceptance; a commentarial note also calls the episode spurious.
