canonical_text:
  quote: ''
  summary: A sequence of anecdotes contrasts technical compliance with unforced mastery,
    political appointment through a legitimating dream, archery skill tested by fear
    at a precipice, and equanimity toward office, danger, life, death, and rank. Figures
    praised as perfected or sage-like remain untroubled by external circumstances
    and may withdraw from office or transcend ordinary limits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Yüan of Sung wants a map drawn, and the department officials assemble
    after obeisance with brushes and ink ready.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One official arrives late, does not remain waiting, returns home, removes
    his clothes, and squats bare-backed; the Prince declares him a true artist.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wên Wang sees an old man fishing, but the passage says the old man fishes
    for amusement rather than to catch fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wên Wang wants to employ the old man but fears objection from ministers and
    kin, so he reports a dream in which a black Sage with a large beard on a parti-coloured
    horse instructs him to appoint the old man.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The ministers treat Wên Wang's dream as a command from his late father and
    say divination is unnecessary.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After being entrusted with administration, the old man changes no statutes
    and issues no unjust regulations; after three years, disorder is reported as resolved
    and public and official interests are unified.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Wên Wang asks whether such government can be extended over the empire,
    the old man remains silent, leaves abruptly, and disappears by evening.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Confucius tells Yen Yüan not to criticize Wên Wang and says the dream was
    used to satisfy the vulgar mind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Lieh Yü K'ou demonstrates archery by drawing the bow fully, placing a cup
    of water on his elbow, shooting arrows rapidly, and standing like a statue.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Po Hun Wu Jên distinguishes ordinary shooting from extraordinary shooting
    and brings Lieh Yü K'ou to a high mountain precipice.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: At the precipice, Po Hun Wu Jên stands with part of his feet over the chasm,
    while Lieh Yü K'ou falls prostrate with sweat pouring down.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Po Hun Wu Jên says the perfect man can soar to the sky, dive to the yellow
    springs, or fly to compass extremes without change of countenance, and judges
    Lieh Yü K'ou terrified and internally defective.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Chien Wu says Sun Shu Ao has been appointed to office three times and dismissed
    three times without visible elation or chagrin, and observes that his breathing
    is regular.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Sun Shu Ao says office, whether gained or lost, is outside his own self and
    therefore does not cause chagrin.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: Confucius praises perfect Sages of old as unmoved by danger, life and death,
    rank, and power.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: Confucius says the souls of such men pierced through mountains, descended
    into the abyss without getting wet, occupied low stations without chagrin, filled
    the universe, and increased by giving.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: Commentarial notes in the passage label the Prince Yüan episode as called
    a forgery and the Wên Wang dream episode as spurious.
  category: other
  evidence_refs:
  - ev:16
