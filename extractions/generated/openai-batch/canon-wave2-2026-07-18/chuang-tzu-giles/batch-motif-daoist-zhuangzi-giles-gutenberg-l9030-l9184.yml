candidate_motifs:
- id: motif:1
  label: unforced mastery over compliant technique
  taxonomy_refs:
  - wisdom
  basis: The Prince selects the non-waiting bare-backed official as the true artist,
    the old man fishes without aiming to catch fish, and Lieh Yü K'ou's technical
    archery is treated as insufficient under extraordinary conditions.
  evidence_refs:
