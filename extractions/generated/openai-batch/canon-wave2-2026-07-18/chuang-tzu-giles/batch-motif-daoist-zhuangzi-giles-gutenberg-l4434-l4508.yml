canonical_text:
  quote: Extremes meet.
  summary: The passage attributes an opening maxim to Lao Tzŭ, urges restraint of
    prominent moralists and disputants, and says that keeping sight, hearing, knowledge,
    and virtue inward prevents confusion. It contrasts a Golden Age of ancient rulers,
    knotted cords, contentment, and non-visiting neighboring districts with later
    excitement over reports of a Sage. It argues that rulerly pursuit of knowledge,
    hunting and trapping devices, and schoolmen's disputation bring disorder to animals,
    society, natural processes, and the world.
  language: English
  quote_policy: quoted
