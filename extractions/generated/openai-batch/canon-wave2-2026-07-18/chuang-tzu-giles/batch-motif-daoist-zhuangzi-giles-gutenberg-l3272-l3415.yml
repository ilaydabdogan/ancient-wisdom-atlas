  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Four men agree that whoever can make Inaction the head, Life the backbone,
    and Death the tail of existence may be their friend; they smile and become friends.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Tzŭ Yü becomes ill and physically distorted, but says his mental equilibrium
    is not disturbed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Tzŭ Yü says he is not afraid and imagines decomposition in which his left
