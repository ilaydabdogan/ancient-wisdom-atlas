- id: motif:2
  label: Supernatural longevity or timeless dwelling after obtaining Tao
  taxonomy_refs: []
  basis: Hsi Wang Mu's settlement has unknown beginning and end, and P'êng Tsu lives
    from the time of Shun to the Five Princes after obtaining it.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy supplied has no direct longevity category; the motif is retained
    as a local candidate rather than mapped.
- id: motif:3
  label: Wisdom transmission culminating in void and infinity
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Nü Yü explains Tao knowledge through a chain from books and learning through
    the unknown, the great void, and infinity.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage frames this as explanation rather than a plotted quest.
- id: motif:4
  label: Loss of world, self, and time before entering beyond life and death
  taxonomy_refs:
  - annihilation_union
  - wisdom
  basis: Pu Liang I's progression includes cessation of the sublunary state, cessation
    of the external world, unconsciousness of his own existence, becoming without
    past or present, and entering where life and death are no more.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: "“Annihilation” is interpretive shorthand for loss of ordinary self/world
    distinctions; the passage presents it as Taoist realization."
- id: motif:5
  label: Friendship founded on acceptance of Inaction, Life, and Death
  taxonomy_refs:
  - duality
  - wisdom
  basis: The four men become friends after accepting the condition that Inaction be
    the head, Life the backbone, and Death the tail of existence.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The motif is philosophical and relational, not a mythic adventure sequence.
- id: motif:6
  label: Death as bodily transformation into animals, tools, and vehicle parts
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: Tzŭ Yü imagines decomposition transforming his shoulders into a cock and
    cross-bow, his buttocks into wheels, and his soul into a horse; Tzŭ Li speculates
    Tzŭ Lai may be made into a rat's liver or snake shoulders.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage speaks of decomposition and remaking, not a reversible or
    voluntary shapeshift; taxonomy mapping to shapeshifter is approximate.
- id: motif:7
  label: Fearless acceptance of illness and death as natural or divine sequence
  taxonomy_refs:
  - wisdom
  basis: Tzŭ Yü says he is not afraid, treats life and parting from life as timely
    states, and says joy and sorrow do not touch him; Tzŭ Li treats Tzŭ Lai's dying
    as decomposition not to be obstructed.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: This is an ethical-philosophical pattern rather than a discrete tale type.
