candidate_motifs:
- id: motif:1
  label: Tao attainment followed by ascent or celestial placement
  taxonomy_refs:
  - ascent
  - wisdom
  basis: The Yellow Emperor obtains it and soars on clouds to heaven, while Fu Yüeh
    is charioted by constellations and enrolled among the stars after obtaining it.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage uses “it” in context as Tao but does not present a single
