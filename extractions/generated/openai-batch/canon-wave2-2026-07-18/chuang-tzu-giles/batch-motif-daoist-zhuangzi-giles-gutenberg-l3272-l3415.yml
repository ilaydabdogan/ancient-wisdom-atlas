canonical_text:
  quote: ''
  summary: The passage lists legendary and semi-legendary figures who obtained Tao
    and gained heavenly ascent, remote dwelling, cosmic station, unknown duration,
    long life, or stellar status. It then presents Nü Yü explaining how Tao cannot
    simply be studied, describing Pu Liang I's staged loss of ordinary distinctions,
    external world, and self before entering a state beyond life and death. A group
    of four friends accept Inaction, Life, and Death as the structure of existence;
    two illness scenes show Tzŭ Yü and Tzŭ Lai facing bodily deformation and decomposition
    without fear, with transformations of the body imagined as animals, tools, vehicle
    parts, or other forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named figures are said to have obtained “it,” with resulting conditions
    including ascent to heaven, dwelling in a Dark Palace, station at the North Pole,
    settlement at Shao Kuang, very long life, and enrollment among the stars.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Nan Po Tzŭ K'uei asks Nü Yü why Nü Yü is old but has a countenance like a
    child; Nü Yü replies that he has learned Tao.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: Nü Yü says Pu Liang I had sage-like qualifications without Tao, while Nü Yü
    had Tao without those qualifications, and describes imparting Tao as though withholding
    it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:4
  text: 'Nü Yü describes Pu Liang I''s progression: after three days the sublunary
    state ceased for him, after seven more days the external world ceased, and after
    another nine days he became unconscious of his own existence, then etherealised,
    wise, without past or present, and able to enter where life and death are no more.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Nü Yü traces his own acquisition of Tao through a chain from books to learning,
    investigation, coordination, application, desire to know, the unknown, the great
