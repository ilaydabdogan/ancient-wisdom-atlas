canonical_text:
  quote: ''
  summary: Aubrey Moore introduces a note on the philosophy of Chuang Tzŭ chapters
    i-vii, framing East-West philosophical parallels while warning against unsupported
    derivation claims. He compares doctrines such as the mean, discusses Chuang Tzŭ’s
    use of relativity through examples of vast birds, small creatures, long-lived
    beings, trees, wind travel, and eternal realms, and characterizes Chuang Tzŭ as
    an idealist and mystic who values inward reality over reputation, action, and
    ordinary judgment.
  language: English
  quote_policy: summarized
