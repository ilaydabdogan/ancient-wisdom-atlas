canonical_text:
  quote: ''
  summary: The passage contains a brief statement on negation and spirituality; an
    exchange in which Yao asks Hsü Yu about Yeh Ch'üeh as a possible emperor; Yao's
    encounter with the border-warden of Hua, who rejects ordinary blessings and describes
    the true Sage's trace-less life and ascent on white clouds; an episode in which
    Poh Ch'êng Tzŭ Kao abandons office for farming and criticizes reward and punishment;
    a cosmogonic sequence from nonexistence to the Nameless, ONE, virtue, destiny,
    life, form, nature, and unconditioned unity; and the start of Confucius asking
    Lao Tzŭ about rule-bound cultivation of TAO.
  language: English
  quote_policy: summarized
