  evidence_refs:
  - ev:3
- id: obs:9
  text: The proposed treaty granted emoluments and rank, and it was to be sealed with
    blood and buried.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Po I and Shu Ch'i looked at each other, smiled, and said the treaty was strange
