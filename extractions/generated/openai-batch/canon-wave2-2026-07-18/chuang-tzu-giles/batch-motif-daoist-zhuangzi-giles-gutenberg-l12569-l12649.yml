canonical_text:
  quote: ''
  summary: A sequence of anecdotes describes people refusing political authority,
    rank, or reward because they regard conquest, killing, and corrupt government
    as incompatible with Tao. Pien Sui and Wu Kuang reject T'ang's offers and die
    in rivers; Po I and Shu Ch'i reject a Chou treaty, praise Shên Nung as an older
    model of rule, condemn the Chous, withdraw to Mount Shou-yang, and starve.
  language: English
  quote_policy: summarized
