  text: T'ang offered to resign the throne in favour of Wu Kuang and invoked the Tao
    of the ancients.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wu Kuang declined, saying that deposing a ruler, slaying people, and enjoying
    profits from others' suffering were not right conduct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wu Kuang took a stone on his back and jumped into the river Lu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
