canonical_text:
  quote: "“Above ground I shall be food for kites; below I shall be food for mole-crickets
    and ants. Why rob one to feed the other?”"
  summary: The passage gives teachings on virtue, outward senses, success, weakness,
    wisdom, and destiny; recounts Chuang Tzu warning a man who received chariots from
    the prince of Sung by means of a pearl-and-dragon story; presents Chuang Tzu declining
    service through the image of a sacrificial ox; and gives his deathbed rejection
    of elaborate burial, including acceptance that his body will feed creatures above
    or below ground. Translator notes include a comparison with Diogenes and a comment
    on the textual ending.
  language: English
  quote_policy: quoted
