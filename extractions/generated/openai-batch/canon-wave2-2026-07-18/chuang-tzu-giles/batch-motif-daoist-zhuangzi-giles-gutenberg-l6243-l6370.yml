canonical_text:
  quote: Listening you cannot hear its sound; gazing you cannot see its form.
  summary: The passage first describes a music aligned with Yin and Yang, sun and
    moon, cosmic order, spontaneity, void, and Taoic absorption. It then presents
    a dialogue in which Yen Yüan asks Shih Chin about Confucius, and Shih Chin criticizes
    Confucius for clinging to ancient models through analogies of a used straw dog,
    a boat on land, a well-sweep, differing fruits, changing seasons, and a monkey
    dressed in ancient robes.
