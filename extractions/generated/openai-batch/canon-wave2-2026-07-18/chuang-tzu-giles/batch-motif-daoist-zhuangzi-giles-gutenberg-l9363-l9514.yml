canonical_text:
  quote: ''
  summary: 'The passage presents several dialogues and teachings about TAO: P''i I
    instructs Yeh Ch''üeh in bodily control, concentration on ONE, and non-striving
    knowledge; Ch''êng tells Shun that body, life, individuality, and posterity are
    not personally owned but delegated by God; Lao Tzŭ instructs Confucius on purifying
    the heart, discarding knowledge, emergence from darkness and formlessness, the
    order of birth, spontaneous TAO, sagehood, return to the Cause, and death as a
    brief passage followed by the soul''s flight home.'
  language: English
  quote_policy: summarized
