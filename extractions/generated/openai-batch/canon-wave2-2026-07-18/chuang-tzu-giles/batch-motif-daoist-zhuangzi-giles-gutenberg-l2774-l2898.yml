literal_observations:
- id: obs:1
  text: Shên T'u Chia says that people with toes used to anger him by laughing at
    his lack of toes, but after studying under his Master for nineteen years he no
    longer troubles himself about the loss and says he and Tzŭ Ch'an are studying
    the internal rather than the external.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tzŭ Ch'an fidgets, changes countenance, and asks Shên T'u Chia to stop speaking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shu Shan No-toes, a mutilated man of Lu, walks on his heels to see Confucius;
    Confucius first rebukes him, No-toes replies that he came with something more
    precious than toes, Confucius apologizes, and No-toes leaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Confucius tells his disciples that the toe-less criminal seeks to learn in
    order to atone and that those without misdeeds have even more reason to learn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: No-toes asks Lao Tzŭ whether Confucius is a sage; Lao Tzŭ suggests meeting
    Confucius with the continuity of life and death and the identity of can and cannot,
    while No-toes says Confucius cannot be released.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Duke Ai describes Ai T'ai T'o as a loathsome leper in Wei whom men and women
    gather around; he says Ai T'ai T'o does not preach, wield protective power, or
    distribute appointments, yet gains trust, is offered the post of Prime Minister,
    and soon leaves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius tells Duke Ai that young pigs sucking their dead mother leave the
    body after seeing that she no longer looks at them or seems of their kind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confucius says weapons are not buried with a man killed in battle and that
    a man without toes does not value boots, because the function of those things
    is gone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Confucius gives examples of imperial concubines avoiding nail-cutting and
    ear-piercing and of a marriageable daughter being kept from menial work to preserve
    the person or beauty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Confucius says Ai T'ai T'o says nothing and is trusted, does nothing and is
    sought after, and causes a ruler to offer him government; Confucius describes
    his talents as perfect and his virtue as without outward form.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Confucius lists paired conditions such as life and death, existence and non-existence,
    poverty and wealth, and warmth and cold as revolving on the changing wheel of
    Destiny, and advises that they should not disturb bodily harmony or enter the
    soul's domain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Confucius uses a water-level as a model, saying water in repose remains quietly
    within and does not overflow, and that harmony cultivated in this way produces
    virtue without outward form.
  category: speech
  evidence_refs:
  - ev:8
