canonical_text:
  quote: The birth of the Sage is the will of God; his death is but a modification
    of existence.
  summary: The passage rejects self-conscious ascetic, moralizing, political, idle,
    and hygienic programs as affected practices. It then describes the true Sage through
    tranquillity, passivity, non-action, purity, and preservation of spirituality.
    The Sage is said to be unharmed by calamity or spirits, to pass through life into
    death as a change of existence, and to become one with preserved spirituality.
    Pure water, Yin and Yang, and carefully kept blades appear as images in the teaching.
  language: English
  quote_policy: quoted
