canonical_text:
  quote: ''
  summary: The passage contrasts spontaneous sympathy with forced adaptation, describes
    the human will and heart as sources of injury, discusses Tao, separation, birth,
    death, time, space, non-existence, and the unity of opposites. It ranks kinds
    of ancient knowledge, criticizes subjective standards of right and wrong, gives
    examples involving ritual parts, a house, and toe-treading relations, and lists
    social, emotional, and cognitive disturbances to discard in order to remove obstructions
    to Tao.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that natural sympathy with humanity draws people, while forced
    adaptation leaves no room for oneself or others and results in having no ties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares the human will to a deadly weapon and says injury comes
    from the human heart rather than from Nature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tao is described as informing its own subdivisions; separation from the parent
    stock of Tao is treated as dangerous because it leads to further separation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that issuing forth without return, issuing forth and attaining
    the goal, being annihilated while still existing, and making formed things appear
    formless are related stages or formulations of supernatural development and convergence
    into one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Birth is described as not a beginning and death as not an end; existence without
    limitation is called Space, and continuity without a starting-point is called
    Time.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: A formless passage through which one passes in and out is called the Portal
    of God, and the Portal of God is identified with Non-Existence; all things are
    said to spring from Non-Existence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The highest ancient knowledge is said to reach the time before anything existed;
    later views begin from existence or from nothing and arrange Nothing, Life, and
    Death in a body-like sequence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Life is compared to soot on a kettle, and the subjective point of view is
    presented as difficult or impossible to secure as a final standard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage uses separated ritual parts and the parts of a house, including
    ancestral hall and latrines, to argue that parts cannot be fully separated from
    a whole in establishing a point of view.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The subjective point of view is said to originate with life and knowledge,
    drift into right and wrong, and make one’s own standard the standard to which
    others must adapt.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The present generation is compared to the cicada and young dove, which see
    things only from their own standpoint.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Different responses to a stranger, elder brother, or parent treading on one’s
