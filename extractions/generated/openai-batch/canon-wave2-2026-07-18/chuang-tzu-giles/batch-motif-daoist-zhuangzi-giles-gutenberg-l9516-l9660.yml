canonical_text:
  quote: '"There is nowhere," replied Chuang Tzŭ, "where it is not."'
  summary: The passage presents several dialogues and anecdotes about TAO as formless,
    all-pervasive, inaudible, invisible, unnameable, and not adequately reached by
    discussion, question, answer, or ordinary perception. It includes Chuang Tzŭ placing
    TAO in lowly things, Shên Nung reacting to the death of Lao Lung Chi, personified
    figures debating knowledge and non-knowledge, and Light failing to perceive Nothing.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening statement contrasts the reality of the formless with the unreality
    of what has form and says silence is better than argument about TAO.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tung Kuo Tzŭ asks Chuang Tzŭ where TAO is, and Chuang Tzŭ answers that there
    is nowhere it is not.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chuang Tzŭ names an ant, a tare, a potsherd, and ordure as places where TAO
    is present.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chuang Tzŭ uses a market analogy about testing the fatness of pigs in the
    least likely parts and says nothing escapes TAO.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chuang Tzŭ invites his interlocutor to reach the palace of Nowhere, practice
    inaction, and move through the realms of Infinity without awareness of goals or
    stoppages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says TAO causes fulness and emptiness, renovation and decay, beginning
    and end, and accumulation and dispersion, but is not identical with any of these
    pairs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: O Ho Kan is described as studying with Shên Nung under Lao Lung Chi, while
    Shên Nung remains shut up and absorbed in day-dreams.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: O Ho Kan reports that Lao Lung is dead; Shên Nung rises with his staff, throws
    the staff down, smiles, addresses his dead master, and says that he too will die
    because he has no scope for vain talk.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yen Kang Tiao comments that those who exemplify TAO are sought by the best
    men, that TAO is formless and noiseless, and that discussing TAO makes it not
    TAO.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Empyrean asks Without-end and Inaction whether they know TAO; Without-end
    says he does not, while Inaction says he does and gives a method involving honouring,
    dishonouring, binding, and loosing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: No-beginning says not knowing is profound and internal, while knowing is shallow
    and external.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: No-beginning says TAO cannot be heard, seen, spoken, or named, because what
    gives form to forms is itself formless.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: No-beginning says asking and answering about TAO are vain or unreal and that
    a person who does so is unfit to roam over K'un-lun peak or soar into the Supreme
    Void.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Light asks Nothing whether it exists; Nothing gives no answer, and Light cannot
    see, hear, or seize it despite watching for it.
  category: action
  evidence_refs:
  - ev:10
