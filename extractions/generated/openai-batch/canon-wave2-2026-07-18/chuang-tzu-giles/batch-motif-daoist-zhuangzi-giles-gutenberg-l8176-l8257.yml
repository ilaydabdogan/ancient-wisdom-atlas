canonical_text:
  quote: But always following a natural course.
  summary: The passage describes Ch'ui's effortless artisan skill, explains ease as
    unconscious natural functioning, and presents a dialogue in which Sun Hsiu complains
    of misfortune to Pien Ch'ing Tzŭ. Pien answers with teachings about the perfect
    man, later worries that the teaching may have startled Sun Hsiu, and illustrates
    the problem with a story about a bird treated according to human rather than birdly
    needs.
  language: English
  quote_policy: quoted
