canonical_text:
  quote: Let knowledge stop at the unknowable. That is perfection.
  summary: 'Nan Yung asks Lao Tzŭ how to escape dilemmas in which knowing, charity,
    and duty all seem to injure either himself or others. Lao Tzŭ diagnoses confusion
    and teaches self-cultivation: closing mental channels against disturbances, preserving
    life by keeping all in one, knowing when to stop, becoming like a child, cultivating
    repose, and letting knowledge stop at the unknowable. The passage also contrasts
    internal cultivation with public reputation and describes divine or human punishment
    for wrongdoing.'
  language: English
  quote_policy: quoted
