  quote: ''
  summary: The passage describes the sage as one who abandons reputation, action,
    and individual selfhood, sees all distinctions as one from the standpoint of Tao,
    and remains unmoved by cosmic upheaval. It then compares Chuang Tzu’s doctrine
    of the identity of contraries with Heracleitus and, more cautiously, with Eleaticism
    and Parmenides.
