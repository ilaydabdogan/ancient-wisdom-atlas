canonical_text:
  quote: ''
  summary: Chuang Tzu explains to a prince the contrast between the sword of Princes,
    described through virtues and cosmic harmony, and the sword of the People, described
    through violent appearance and short-lived combat. He rebukes the prince for favoring
    the latter. The prince honors Chuang Tzu with food, and afterward remains in his
    palace while the swordsmen submit to the new order and die in their homes. A note
    reports a commentator's alternative reading that they killed themselves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chuang Tzu describes the sword of Princes as having the wise and brave for
    its point, the incorruptible for its edge, the virtuous for its back, the loyal
    for its hilt, and the heroic for its sheath.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chuang Tzu says this sword does not advance when pushed, does not go up when
    raised, does not go down when lowered, and does not change position when whirled.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chuang Tzu says the sword of Princes models itself on round heaven and square
    earth, harmonizes with the sun, moon, stars, and four seasons, adapts to the people's
    wishes, and diffuses peace.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chuang Tzu says one flash of this blade is like thunder and that within the
    state's boundaries all yield and obey the prince's command.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince asks Chuang Tzu about the sword of the People.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chuang Tzu describes the sword of the People as having dishevelled hair, a
