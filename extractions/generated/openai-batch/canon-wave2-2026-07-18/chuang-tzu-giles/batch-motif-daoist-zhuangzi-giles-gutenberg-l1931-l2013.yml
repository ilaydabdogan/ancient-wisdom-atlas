canonical_text:
  quote: ''
  summary: The passage uses examples of changed perspective, dreaming, argument, shadows,
    and the butterfly dream to question fixed distinctions between life and death,
    waking and dreaming, right and wrong, cause and dependence, and human and nonhuman
    identity. It also states that contraries are merged in an all-embracing unity
    called God, the Infinite Absolute, or ONE.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed woman first weeps when the Duke of Chin obtains her, but later
    lives at the royal residence, eats rich food, and regrets having wept.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks whether the dead might repent of having previously clung
    to life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says people may dream of banquets and wake to sorrow, or dream
    of sorrow and wake to join the hunt, and that dreamers do not know they are dreaming
    until they awake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes a future Great Awakening in which life is found to be
    a great dream, and the speaker says Confucius, the interlocutor, and the speaker
    himself are dreams.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker argues that victory in debate does not prove rightness, and that
    any proposed arbiter is unable to decide impartially between opposing views.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that one must depend upon Another, described as God, the
    Infinite Absolute, and ONE, in whom contraries blend and distinctions are obliterated.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A quoted comparison from Herbert Spencer states that the antithesis of subject
    and object prevents knowledge of the Ultimate Reality in which they are united.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Penumbra asks the Umbra why it alternates between movement and rest, sitting
    and rising; the Umbra replies that it depends on another cause, which in turn
    depends on something else.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Umbra compares its dependence to a snake's scales or a cicada's wings,
    which do not move by their own accord.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chuang Tzŭ dreams he is a butterfly, wakes as himself, and then says he does
    not know whether he was a man dreaming of being a butterfly or is now a butterfly
    dreaming of being a man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says there is a barrier between a man and a butterfly, and calls
    the transition Metempsychosis.
  category: attribute
  evidence_refs:
  - ev:7
