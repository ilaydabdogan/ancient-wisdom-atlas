canonical_text:
  quote: ''
  summary: The passage evaluates Hui Tzŭ as a learned but paradoxical dialectician.
    It lists many theses attributed to him, including claims about infinite greatness
    and smallness, relative spatial and temporal opposites, naming paradoxes, animal
    and object paradoxes, fire, mountains, shadows, arrows, and endless division of
    a stick. It then groups Huan T'uan and Kung Sun Lung with sophists, recounts Huang
    Liao questioning Hui Tzŭ about cosmic phenomena, and concludes that Hui Tzŭ's
    inquiries do not end in Tao, using insect, echo, and shadow imagery. The supplied
    range also includes a paratextual note on the genuineness of the concluding chapter
    and the start of the index.
  language: English
  quote_policy: summarized
