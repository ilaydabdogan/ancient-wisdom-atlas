canonical_text:
  quote: ''
  summary: An old fisherman rebukes Confucius, tells a parable about a man who dies
    while trying to flee his shadow and footsteps, teaches that original purity and
    truth are superior to external ceremony, then departs by boat. Confucius shows
    reverence and later tells Tzŭ Lu that respect for an elder or Sage and humility
    before others are required for original purity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius prostrates himself twice, reports four persecutions, and says he
    does not know his fault.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man answers in a vexed tone that Confucius is slow of perception.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man tells of a man who feared his shadow and disliked his footsteps,
    ran from them, made more footsteps, failed to escape the shadow, exhausted himself,
    and died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Within the parable, going into shade would have removed the shadow, and keeping
    still would have ended the footsteps.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man says Confucius occupies himself with charity, duty, distinctions,
    motion and rest, giving and receiving, emotions, and restraint, yet does not avoid
    calamities.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man advises reverent care for the body, preservation of natural purity,
    and leaving externals to others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fisherman defines original purity as the perfection of truth unalloyed
    and says that without it one cannot influence others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fisherman contrasts affected mourning, anger, and friendship with real
    mourning, anger, and friendship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The fisherman says ceremonial is invented by humans, original purity is given
    from God, and the true Sage models himself upon God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Confucius again prostrates twice and asks to follow the old man as a servant
    in order to learn the great doctrine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man says one may travel with a fit companion into the uttermost depths
    of TAO, but should avoid an unfit companion; then he departs by boat among the
    reeds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Yen Yüan brings up the chariot, Tzŭ Lu offers the hand-cord, and Confucius
    waits until the water ripples smooth and the punt-pole sound dies away before
    rising.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tzŭ Lu asks why Confucius bows and prostrates before an old fisherman when
    he acts haughtily before rulers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Confucius tells Tzŭ Lu that failing to respect an elder and honor a Sage prevents
    charity with man, humility, and attainment of original purity.
  category: speech
  evidence_refs:
  - ev:9
