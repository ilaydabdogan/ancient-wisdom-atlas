canonical_text:
  quote: ''
  summary: 'In Chapter XXX, Wên Wang of Chao is obsessed with sword-play, causing
    many deaths and contributing to political decline. The Heir Apparent Li seeks
    Chuang Tzŭ''s help, offering silver, which Chuang Tzŭ refuses. Chuang Tzŭ adopts
    the dress of a swordsman to gain access to the prince, claims exceptional skill,
    and is summoned for a trial. Instead of selecting an ordinary weapon, he speaks
    of three swords: the sword of the Son of Heaven, the sword of the Princes, and
    the sword of the People. He begins by describing the sword of the Son of Heaven
    as a vast cosmic and imperial image made from territories, seasons, elements,
    Yin and Yang, ocean, clouds, and earth.'
  language: English
  quote_policy: summarized
