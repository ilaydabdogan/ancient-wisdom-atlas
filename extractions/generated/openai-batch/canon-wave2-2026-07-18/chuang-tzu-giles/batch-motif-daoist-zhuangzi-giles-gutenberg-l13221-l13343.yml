candidate_motifs:
- id: motif:1
  label: Sage redirects a ruler's violent obsession through discourse
  taxonomy_refs:
  - wisdom
  basis: A ruler's love of sword-play causes casualties and political danger; Chuang
    Tzŭ, identified as a sage, enters the court and begins addressing the issue through
    speech about swords rather than by combat in the supplied passage.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:14
  - ev:15
  - ev:16
  confidence: medium
  cautions: The supplied passage ends before the outcome of Chuang Tzŭ's persuasion
    is shown, so the full redirection is only partially evidenced here.
- id: motif:2
  label: Weapon transformed into cosmic-political image
  taxonomy_refs:
  - royal_legitimacy
  basis: Chuang Tzŭ's sword of the Son of Heaven is described with territories, seasons,
    elements, Yin and Yang, ocean, clouds, and earth, and its flash makes the princes
    of the empire submit.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage presents this as a rhetorical description inside a court dialogue;
    it does not explicitly state a doctrine of royal legitimacy.
- id: motif:3
  label: Disguise or role-adaptation to gain royal audience
  taxonomy_refs: []
  basis: The Heir Apparent warns that the prince will only receive swordsmen; Chuang
    Tzŭ agrees to adopt their dress and is then brought into the prince's presence.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The text describes a change of dress and presentation, not a hidden identity
    or explicit deception.
- id: motif:4
  label: Refusal of material reward before risky counsel
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzŭ refuses the thousand ounces of silver and reasons that if he fails
    he may die, while if he succeeds greater resources would be available.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage frames the refusal pragmatically as well as ethically; it
    should not be overread as purely ascetic.
