literal_observations:
- id: obs:1
  text: Confucius is entertained at a banquet by the prince of Ch'u, while Sun Shu
    Ao stands with a goblet and I Liao of Shih-nan pours a libation asking for an
    utterance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius replies that his doctrine is one of wordless utterances and asks
    whether one who makes no utterances should speak now.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius cites I Liao playing with a ball and Sun Shu Ao remaining in repose
    as cases where trouble was settled or arms were thrown down without ordinary speech
    or force.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Confucius identifies these examples with the TAO of inaction, the argument
    of silence, and speech stopping at the unknowable.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares the sea that does not reject eastward streams with the
    true Sage who folds the universe in his bosom and benefits all without seeking
    rank, titles, credit, or name.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage defines true greatness as seeking nothing, losing nothing, rejecting
    nothing, being unharmed from without, and finding safety by according with one's
    nature.
  category: attribute
  evidence_refs:
  - ev:3
