  quote: ''
  summary: 'The passage presents three linked philosophical anecdotes: Confucius praises
    wordless efficacy, inaction, and the greatness of the sage; Tzŭ Chi asks a physiognomist
    which son is fortunate, but K''un''s foretold princely food is fulfilled through
    capture, mutilation, and service; Hsü Yu says he is going away from Yao and criticizes
    charity, profit, praise, and dogmatic attempts to benefit the empire.'
  language: English
