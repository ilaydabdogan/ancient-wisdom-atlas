canonical_text:
  quote: ''
  summary: 'The passage gathers several brief anecdotes and comments: Chuang Tzu criticizes
    Hui Tzu through analogies of misplaced value, restricted searching, and quarrels;
    later, at Hui Tzu''s grave, he laments the loss of a worthy interlocutor through
    the story of a stone-mason and his vanished material. Kuan Chung advises Duke
    Huan on a successor. The prince of Wu kills a monkey that flaunts its skill and
    warns Yen Pu I against displaying superiority. Tzu Chi describes cave reclusion,
    recognition by T''ien Ho, and the spiritual danger of reputation and manifestation.'
  language: English
  quote_policy: summarized
