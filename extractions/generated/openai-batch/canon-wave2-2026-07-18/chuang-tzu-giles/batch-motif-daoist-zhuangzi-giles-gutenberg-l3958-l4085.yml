canonical_text:
  quote: Joined toes and extra fingers are an addition to nature, though, functionally
    speaking, superfluous.
  summary: The passage argues that virtues and practices should arise naturally rather
    than be imposed artificially. It compares intentional charity, duty, ritual, music,
    argument, sensory refinement, and ambition to physical additions or tools that
    interfere with intrinsic nature. Named figures and brief anecdotes illustrate
    loss, suffering, or self-sacrifice caused by external pursuits such as fame, gain,
    or moral reputation.
  language: English
  quote_policy: quoted
