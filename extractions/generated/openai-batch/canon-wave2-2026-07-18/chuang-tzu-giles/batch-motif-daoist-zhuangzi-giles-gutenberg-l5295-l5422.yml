  quote: "“he who is unconscious of his own personality, combines in himself the human
    and the divine.”"
  summary: 'The passage presents several teachings and anecdotes: Lao Tzŭ addresses
    Ch''iu on skill, self-cultivation, and unconsciousness of self; Chiang Lü Mien
    reports advice given to the Prince of Lu and is corrected by Chi Ch''ê; Tzŭ Kung
    encounters an old gardener who rejects a water-lifting machine and rebukes him
    as a Confucian learner.'
  language: English
