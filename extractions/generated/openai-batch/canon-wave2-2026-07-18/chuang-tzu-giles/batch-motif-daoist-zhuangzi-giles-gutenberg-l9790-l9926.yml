canonical_text:
  quote: ''
  summary: The passage introduces Kêng Sang Ch'u, a disciple of Lao Tzŭ living on
    the Wei-lei Mountains, whose unconventional household and quiet presence benefit
    the district. Local people propose honoring him like a spirit or tutelary god,
    but he is ashamed and explains the agentless operation of TAO and the need for
    hiddenness. He rejects the conventional exaltation of virtue and knowledge, criticizes
    Yao and Shun, and warns of social disorder. Nan Yung Ch'u asks how to attain this
    way; Kêng Sang instructs preservation of form and vitality but then says he cannot
    transform him and sends him south to Lao Tzŭ. Nan Yung travels seven days and
    is unsettled by Lao Tzŭ's opening question.
  language: English
  quote_policy: summarized
