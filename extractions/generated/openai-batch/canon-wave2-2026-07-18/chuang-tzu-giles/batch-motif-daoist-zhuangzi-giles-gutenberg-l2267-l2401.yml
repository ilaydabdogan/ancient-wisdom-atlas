canonical_text:
  quote: '"that negative state is the fasting of the heart."'
  summary: Yen Hui asks Confucius for a method, and Confucius explains the fasting
    of the heart as inward unity, sensory restraint, and self-emptying in which Tao
    can abide. Confucius illustrates this through paradoxes and an empty-room/window
    image, then says the method was used by ancient exemplars. In a following dialogue,
    Tzŭ Kao, Duke of Shê, asks Confucius about an alarming mission to Ch'i; Confucius
    counsels safety through Destiny, Duty, resignation, self-oblivious service, and
    careful transmission of messages.
  language: English
  quote_policy: quoted
