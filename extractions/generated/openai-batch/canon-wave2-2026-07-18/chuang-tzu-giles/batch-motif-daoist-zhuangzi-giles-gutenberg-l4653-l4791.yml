canonical_text:
  quote: '"Abandon wisdom and discard knowledge, and the empire will be at peace."'
  summary: 'The passage criticizes imposed charity, duty, law, coercion, and knowledge
    as disruptions of natural goodness and sources of social disorder. It then narrates
    the Yellow Emperor''s visits to Kuang Ch''êng Tzŭ on Mount K''ung-t''ung: first
    to ask how to use heaven, earth, and the Two Powers for government, and later,
    after resigning the throne and undergoing seclusion, to ask how to preserve the
    self. Kuang Ch''êng Tzŭ teaches inner quiet, sensory stillness, purity, and self-preservation,
    and describes the Great Light, Profound Mystery, and the positive and negative
    Powers.'
  language: English
  quote_policy: quoted
