candidate_motifs:
- id: motif:1
  label: Abandoning wisdom and knowledge to restore peace
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly associates imposed wisdom, knowledge, and moral systems
    with disorder and explicitly says that abandoning wisdom and discarding knowledge
    will bring peace to the empire.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The motif is expressed as a Daoist critique of conventional knowledge
    rather than as a praise of ordinary wisdom.
- id: motif:2
  label: Ruler seeks a mountain sage for perfect TAO
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The Yellow Emperor travels to Mount K'ung-t'ung to question Kuang Ch'êng
    Tzŭ, who is said to possess perfect TAO, and returns after renunciation to receive
    instruction.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage is didactic and philosophical; it does not frame the journey
    as a heroic adventure.
- id: motif:3
  label: Renunciation and seclusion before esoteric instruction
  taxonomy_refs:
  - departure
  - initiation
  - mystical_quest
  basis: After being rebuked, the Yellow Emperor resigns the throne, lives in a solitary
    hut, lies on straw, remains secluded for three months, and then returns in a humble
    posture to receive teaching.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the label is
    inferred from the sequence of withdrawal, humility, and instruction.
- id: motif:4
  label: Cosmic dual powers that contain each other
  taxonomy_refs:
  - duality
  basis: Kuang Ch'êng Tzŭ describes positive and negative Powers as controllers of
    heaven and earth and says each contains the other.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage's note identifies the Two Powers as Yin and Yang, but the
    extraction relies only on the supplied text and note.
- id: motif:5
  label: Misrule disrupts natural and celestial order
  taxonomy_refs:
  - chaos
  basis: Kuang Ch'êng Tzŭ says that under the Yellow Emperor's government clouds rain
    prematurely, tree foliage falls before yellowing, and the sun and moon are dimmed;
    earlier sections also describe social confusion and unrest.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: The passage presents this as a philosophical critique of government, not
    as a full cosmic-destruction myth.
- id: motif:6
  label: Cave refuge during social disorder
  taxonomy_refs:
  - departure
  basis: During the described disorder, virtuous men seek refuge in mountain caves
    while rulers tremble in ancestral halls.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives this as a brief image, not a developed cave narrative.
