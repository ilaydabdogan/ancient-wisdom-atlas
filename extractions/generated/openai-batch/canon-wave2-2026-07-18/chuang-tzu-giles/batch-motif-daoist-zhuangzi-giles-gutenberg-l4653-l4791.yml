- id: obs:10
  text: After nineteen years on the throne, with his laws obtaining throughout the
    empire, the Yellow Emperor goes to Mount K'ung-t'ung to see Kuang Ch'êng Tzŭ.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Yellow Emperor asks Kuang Ch'êng Tzŭ about perfect TAO so that he may
    secure harvests, feed his people, and control the Two Powers of nature for the
    protection of living things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kuang Ch'êng Tzŭ replies that the Yellow Emperor wants to use primordial integrity
