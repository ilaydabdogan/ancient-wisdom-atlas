canonical_text:
  quote: ''
  summary: Tzŭ Ch'i enters an absent, self-effacing state and answers Tzŭ Yu’s questions
    by describing the music of Man, Earth, and Heaven. Wind, called the breath of
    the universe, sounds differently through caves, tree-hollows, and instruments.
    The passage then reflects on great and small knowledge, speech, mental disturbance,
    emotions, the possible formless soul or Power, mortality, and the paradoxes produced
    by relying on one’s own criteria for contraries.
  language: English
  quote_policy: summarized
