canonical_text:
  quote: ''
  summary: 'The passage presents examples of uncertain worldly outcomes, a reflection
    on destructive disharmony and inner fire, and several illustrative episodes: Chuang
    Tzŭ rebukes delayed help through a stranded fish parable; Jên Kung Tzŭ catches
    a giant fish by using immense means; Confucianists violate a corpse to extract
    a pearl while citing ritual texts; and Lao Lai Tzŭ admonishes Confucius to abandon
    dogmatism and excessive concern for the sorrows of mankind.'
  language: English
  quote_policy: summarized
