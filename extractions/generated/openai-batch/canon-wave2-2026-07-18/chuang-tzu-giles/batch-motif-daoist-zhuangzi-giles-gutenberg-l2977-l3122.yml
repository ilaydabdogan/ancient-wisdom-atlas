canonical_text:
  quote: He who knows what God is, and who knows what Man is, has attained.
  summary: The passage gives a philosophical account of knowing the divine and the
    human, defines the pure men of old by spontaneity, freedom from attachment, equanimity
    toward life and death, deep breathing, and harmony with creation, then contrasts
    perfect or superior persons with named ancient worthies who served others' commands.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The chapter argument lists themes including the human and the divine, pure
    men of old, all things as one, life as a boon, death as a transition, and life
    eternal.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that one who knows what God is and what Man is has attained,
    and that such a person rests in known knowledge while waiting for the unknown.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is described as a self-existing principle that operates spontaneously
    without self-manifestation, and Man is described as emanating from God.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that death lifts a veil and that life is bounded at both
    ends by an immortality to which the soul reverts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pure men of old acted without calculation or plans, had no regret in failure
    or congratulation in success, and could scale heights, enter water, and enter
    fire without ordinary harm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The pure men of old slept without dreams, woke without anxiety, ate without
    discrimination, and drew breath from their uttermost depths, unlike the vulgar
    who breathed only from their throats.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pure men of old did not love life or hate death, did not rejoice in birth,
    did not try to delay dissolution, and waited patiently for the end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Such men are described as free in mind, grave in demeanour, cheerful in expression,
    unaffected by freezing cold or blazing heat, seasonally ordered in their passions,
    and in harmony with all creation.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A perfect man is said to be able to destroy a kingdom without losing the hearts
    of the people, while benefits handed down for ten thousand generations do not
    proceed from love of fellow-man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says that delight in man, affection dependent on opportunity,
    ignorance of good and evil, disregard for reputation, and lack of oblivion of
    one's own existence each prevent full perfection, superiority, or rulership.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Several named ancient worthies are listed as servants of rulers who did others'
