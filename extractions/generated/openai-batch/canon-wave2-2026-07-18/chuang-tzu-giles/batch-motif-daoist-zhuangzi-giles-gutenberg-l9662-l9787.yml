canonical_text:
  quote: ''
  summary: 'The passage contains several short teachings: a fragment on Nothing and
    the absence of nothing; an aged sword-forger explains his faultless craft as concentration;
    Confucius answers Jen Ch''iu on time before the universe, the absence of past
    and present divisions, life and death as correlates, and Tao as prior to things
    yet present in everything; Confucius answers Yen Yüan on adaptation, internal
    constancy, the limited reach of knowledge and action, the transience of human
    life, unspoken language, and action without deeds.'
  language: English
  quote_policy: summarized
