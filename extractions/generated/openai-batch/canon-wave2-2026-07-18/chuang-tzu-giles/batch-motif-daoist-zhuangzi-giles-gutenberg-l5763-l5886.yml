  summary: The passage describes ancient wisdom, cosmic non-action, the wise ruler's
    relation to heaven and earth, ordered hierarchies within Tao, the secondary place
    of forms, names, rewards, and punishments, and a dialogue in which Shun tells
    Yao to be passive like the virtue of God and natural cycles.
