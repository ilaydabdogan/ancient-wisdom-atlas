  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The men of old are said to have had limited knowledge of the universe but
    not to have been troubled, rejoicing, or acting because of their knowledge or
    abilities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heaven is described as producing all things without parturition, and earth
    as nourishing all things without increment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wise ruler practises inaction, is applauded by the empire, and is described
    as a peer of heaven and earth.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The ruler or prince is described as the essential or root, while the ruled
    or minister is described as accidental or representative.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Appeal to arms, rewards and punishments, ceremonies and laws, music and fine
    clothes, and weeping and mourning are each called the lowest form of a corresponding
    domain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists precedence relations among prince and minister, father and
    son, elder and younger brother, seniors and juniors, men and women, and husbands
    and wives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Heaven and earth, the sequence of seasons, and the phases of maturity and
    decay are used as examples of rank, precedence, and change.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ancestral temple, court, village, and practical affairs each have a stated
    order of precedence, and this order is said to appertain to Tao.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those of old who apprehended Tao are said first to have apprehended God, then
    Tao, then charity and duty, public functions, forms and names, capacity, good
    and bad, right and wrong, and rewards and punishments.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that reaching forms and names, or rewards and punishments,
    without the preceding phases is ignorance of their source or beginning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Yao says that he is not arrogant toward the defenceless, does not neglect
    the poor, grieves for the dead, pities the orphan, and sympathises with the widow.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Shun tells Yao to be passive like the virtue of God, citing sun and moon,
    the seasons, day and night, clouds, and rain.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Yao responds that Shun is in accord with God while Yao himself is in accord
    with man.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Yellow Emperor, Yao, and Shun are said to have considered heaven and earth
    perfection, and ancient rulers are said to have done what heaven and earth do,
    no more.
  category: action
  evidence_refs:
  - ev:12
