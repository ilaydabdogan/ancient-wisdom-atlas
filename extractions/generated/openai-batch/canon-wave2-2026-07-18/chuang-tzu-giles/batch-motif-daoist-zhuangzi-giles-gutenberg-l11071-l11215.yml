canonical_text:
  quote: ''
  summary: The passage opens Chapter XXV with Tsê Yang seeking access to the prince
    of Ch'u through intermediaries. Wang Kuo recommends the hermit Kung Yüeh Hsiu
    and gives a discourse on the true Sage, hidden virtue, non-action, unity, and
    natural love for others. The passage then names Jen Hsiang Shih as one who reached
    the centre and attained, adds aphorisms about time and boundaries, and shifts
    to a political anecdote in which Prince Hui of Wei considers revenge after a broken
    treaty while advisers debate assassination, war, and restraint. The supplied passage
    ends abruptly after introducing Hua Tzŭ.
  language: English
  quote_policy: summarized
