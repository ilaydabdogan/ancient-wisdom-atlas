  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage compares a beauty's unceasing joy and mankind's pleasure in her
    to a Sage's unending love for his fellows and mankind's repose in it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A wanderer is said to rejoice at seeing an old country and old home, even
