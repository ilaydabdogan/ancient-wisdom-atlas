canonical_text:
  quote: '"I do these things, but I do not know why."'
  summary: The passage first presents a dialogue in which the Penumbræ question the
    Umbra about its changing states, and the Umbra describes dependence on light,
    darkness, and an unknowable source of life. It then narrates Yang Tzŭ Chü meeting
    Lao Tzŭ, being rebuked for an overbearing appearance, humbling himself, and returning
    to the inn changed in social bearing.
  language: English
