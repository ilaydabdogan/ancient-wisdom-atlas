canonical_text:
  quote: There has been such a thing as letting mankind alone; there has never been
    such a thing as governing mankind.
  summary: The passage argues that human beings should be left to their natural dispositions
    rather than governed by coercive systems. It contrasts rulers who induce excess
    happiness or sorrow, describes cosmic and bodily imbalance caused by emotional
    and social excess, criticizes over-refinement and reward-punishment systems, presents
    inaction as the proper mode for one summoned to power, and concludes with Lao
    Tzŭ warning Ts'ui Chü not to interfere with the natural goodness and unbindable
    movement of the human heart.
  language: English
  quote_policy: quoted
