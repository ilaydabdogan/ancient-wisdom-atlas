canonical_text:
  quote: ''
  summary: The passage describes a Tao-aiming man of perfect virtue, Confucius' response
    to such ante-mundane knowledge, Chun Mang's eastward journey to the ocean and
    his explanations of the Sage, the man of perfect virtue, and the divine man, followed
    by a political exchange contrasting Wu Wang and the Great Yü and an account of
    a Golden Age in which rulers and people acted naturally without conscious moral
    categories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tao-aiming man is said to perfect virtue, body, and spiritual part, with
    the perfection of the spiritual part identified as the Tao of the Sage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same kind of man is described as entering life like one of the people,
    not knowing his destination, lacking concern for success, profit, and skill, and
    remaining unmoved by praise or blame.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius says the described man knows something but not much about the science
    of the ante-mundane, governs internally rather than externally, and that this
    science is not worth knowing for him and his listener.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chun Mang travels eastward toward the ocean, meets Yüan Fêng on the eastern
    sea shore, and says the ocean cannot be filled by pouring in or emptied by taking
    out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chun Mang describes the Sage's government as one where officials keep to their
    functions, ability receives employment, the people's voice is heard, actions follow
    accordingly, and people gather at a beck or call.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chun Mang describes the man of perfect virtue as having no thoughts in repose,
    no anxiety in action, no recognition of right, wrong, good, or bad, and as one
    to whom people cling like motherless children or lost wayfarers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chun Mang describes the divine man as riding on the glory of the sky until
    his form cannot be discerned, calling this absorption into light, and also says
    he is at one with God and man and enveloped in darkness when things return to
    their original state.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mên Wu Kuei and Ch'ih Chang Man Chi look at Wu Wang's troops, and Ch'ih Chang
    Man Chi says Wu Wang is not equal to the Great Yü and that present troubles follow
    from this.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the exchange about the Great Yü, disorder is treated as the precondition
    for his governance, with images of ointment for a sore, wigs for bald men, doctors
    for sick people, and medicine for an ill father.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Golden Age is described as a time when good men were not specially appreciated,
    ability was not conspicuous, rulers were mere beacons, people were free as wild
    deer, and moral conduct occurred without conscious labels such as duty, charity,
    loyalty, or good faith.
  category: setting
  evidence_refs:
  - ev:8
