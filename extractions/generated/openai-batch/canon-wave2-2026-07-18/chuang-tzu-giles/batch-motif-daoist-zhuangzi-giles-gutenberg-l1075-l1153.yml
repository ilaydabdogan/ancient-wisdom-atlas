  summary: The passage opens Chapter I, describing an immense fish in the northern
    ocean that transforms into a vast bird, the Rukh, which ascends on a typhoon and
    journeys south to the Celestial Lake. The passage uses comparisons of motes, water
    and air depth, small creatures' limited flight, travel provisions, and short-
    versus long-lived beings to discuss relativity of scale, perspective, knowledge,
    and time.
