  text: The ideal man is described through not separating from the Source, essence,
    or reality; the true Sage makes God the source, Tê the root, and Tao the portal
    while passively adapting to environmental modifications.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The superior man is described as practicing charity, duty to one's neighbour,
    ceremony, and music, becoming compassionate and charitable.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Officials are described as regulating conduct by law, treating fame as external,
    verifying hypotheses, basing judgment on proof, and caring for the old, weak,
