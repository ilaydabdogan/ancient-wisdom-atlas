  summary: The passage presents Tao as an all-pervading source of spirituality, political
    order, sagehood, and classical learning. It contrasts ideal sages, superior men,
    officials, ancient ritual-music practices, divergent specialist schools, and Mih
    Tzŭ's austere anti-music and simplified-mourning doctrines.
  language: English
  quote_policy: summarized
