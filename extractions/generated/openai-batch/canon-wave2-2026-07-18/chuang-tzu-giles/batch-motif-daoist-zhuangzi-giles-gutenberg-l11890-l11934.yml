  summary: The passage contrasts levels of attention among exemplary and ordinary
    persons, gives anecdotes of self-mortification rewarded and fatally imitated,
    recounts refusals of empire and an extreme response to one such refusal, and closes
    with analogies comparing fish-traps, rabbit-snares, and language as means that
    may be ignored once their ends are attained.
