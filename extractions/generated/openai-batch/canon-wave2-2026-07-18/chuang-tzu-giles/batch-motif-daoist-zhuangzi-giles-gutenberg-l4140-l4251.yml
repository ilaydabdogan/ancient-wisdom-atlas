canonical_text:
  quote: ''
  summary: Chapter IX argues that horses, materials, and people have natural dispositions
    that are harmed by artificial shaping, discipline, and prescriptive government.
    It contrasts horses' natural life with Poh Loh's horse management, artisan shaping
    of clay and wood, primordial human simplicity, and later intervention by Sages
    through ceremony, music, charity, duty, and knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Horses are described as having hoofs for frost and snow, hair for wind and
    cold, eating grass, drinking water, and moving freely on open land.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Poh Loh appears and claims to understand the management of horses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Poh Loh brands, clips, pares hoofs, halters, ties, shackles, stables, hungers,
    thirsts, trots, gallops, grooms, trims, bridles, and whips horses, after which
    many die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The potter claims he can shape clay with compasses and a square; the carpenter
    claims he can shape wood with an arc and a line.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator questions whether clay and wood desire such tools and says those
    who govern the empire make the same mistake.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people are said to have natural instincts to weave, clothe themselves,
    till, and feed themselves; these instincts are called Heaven-sent.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the time when natural instincts prevailed, there were no roads over mountains,
    no boats, and no bridges over water.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In that earlier condition, birds and beasts multiplied, trees and shrubs grew,
    humans dwelt with birds and beasts, and all creation was one.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says there were then no distinctions of good and bad people, and
    that people were equally without knowledge and evil desires.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Sages appeared, the passage says they tripped people with charity, fettered
    them with duty, and promoted music and ceremony, after which the empire became
    divided.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage asks whether sacrificial vessels, court regalia, charity, duty,
    music, ceremonies, decoration, and pitch-pipes would arise if natural integrity,
    jade, Tao, instincts, colours, and notes were left unaltered.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Horses naturally rub necks when pleased and kick when angry, but when bridled,
    bitted, and fitted with metal, they learn resistant and vicious behavior.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the days of Ho Hsü, people are described as resting and moving without
    particular aims, rejoicing when fed, and strolling with full bellies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: After Sages brought ceremonies, music, charity, and duty, the people developed
    a taste for knowledge and struggled with one another for gain.
  category: sequence
  evidence_refs:
  - ev:10
