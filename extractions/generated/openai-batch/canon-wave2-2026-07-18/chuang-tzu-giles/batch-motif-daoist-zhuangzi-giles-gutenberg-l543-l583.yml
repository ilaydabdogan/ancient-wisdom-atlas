  summary: The passage is editorial and critical rather than narrative. It states
    that a later emperor gave Chuang Tzŭ's work the title Holy Canon of Nan-hua in
    A.D. 742, criticizes the canonization of similar works, explains the translator's
    handling of textual notes and commentary, and criticizes Frederic Henry Balfour's
    earlier English translation with an example.
