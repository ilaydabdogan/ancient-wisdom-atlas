canonical_text:
  quote: I have become ONE with the Infinite.
  summary: The passage discusses uncertainty between waking identity and dream forms,
    spontaneous harmony with circumstances, and entry into the divine One. It then
    presents dialogues in which conventional moral categories are treated as impediments
    to Tao, Yen Hui describes progressive abandonment of social and mental attachments
    until becoming one with the Infinite, and Tzŭ Sang, in illness and poverty, reasons
    that no human or cosmic parent has singled him out and attributes his condition
    to Destiny.
  language: English
  quote_policy: quoted
