canonical_text:
  quote: All distinctions are thus merged.
  summary: The passage counsels return to naturalness, viewing distinctions from the
    infinite and walking in the way of Tao. It gives examples of people whose loyalty,
    faithfulness, honesty, or uprightness brought calamity. A dialogue between Discontent
    and Complacency debates reputation, wealth, pleasure, power, sufficiency, and
    freedom from care. The passage ends with examples of natural rule and refusal
    of a proffered throne.
  language: English
  quote_policy: quoted
