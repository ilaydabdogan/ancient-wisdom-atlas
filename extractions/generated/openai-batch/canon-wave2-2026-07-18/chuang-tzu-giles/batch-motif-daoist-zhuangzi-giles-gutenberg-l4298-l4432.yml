  - ev:8
  confidence: medium
  cautions: 'The taxonomy reference is approximate: the passage treats theft of a
    state and sage-wisdom, not an explicitly sacred object.'
- id: motif:3
  label: Abolition of artificial standards restores natural integrity
  taxonomy_refs: []
  basis: The passage commands discarding wisdom, jade, pearls, tallies, signets, measures,
    scales, restrictions, musical instruments, colour categories, and craft tools
