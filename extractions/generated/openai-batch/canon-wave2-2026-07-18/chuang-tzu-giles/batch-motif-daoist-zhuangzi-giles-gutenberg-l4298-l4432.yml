canonical_text:
  quote: ''
  summary: The passage argues that esteemed wisdom, government instruments, moral
    doctrines, and specialized arts can serve thieves and rulers who steal states.
    It gives examples of T'ien Ch'êng Tzŭ stealing Ch'i, sages dying violently, Robber
    Chê explaining the methods of thieving, and a set of prescriptions to discard
    artificial standards so people may return to natural integrity and receive TAO.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: T'ien Ch'êng Tzŭ is said to have slain the Prince of Ch'i, stolen his kingdom,
    and also stolen the wisdom-tricks obtained from the Sages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: T'ien Ch'êng Tzŭ is described as acquiring the reputation of a thief while
    living comfortably, with his descendants ruling Ch'i for twelve generations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that what the world esteems as great wit and great wisdom
    is serviceable to, and protective of, strong thieves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lung Fêng, Pi Kan, Chang Hung, and Tzŭ Hsü are listed as Sages who died by
    violent punishments; their wisdom is said not to have preserved them from death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An apprentice asks Robber Chê whether there is TAO in thieving, and Chê answers
    by asking for something in which there is not TAO.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Robber Chê lists five qualities of a great robber: wisdom to locate booty,
    courage to enter first, heroism to come out last, shrewdness to calculate success,
    and justice in equal division of spoil.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The doctrine of the Sages is said to be indispensable both to good men and
    to Chê, while good men are called scarce and bad men plentiful.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A proverb about lips and teeth and an anecdote about wine from Lu and Chao
    are used to explain the siege of Han Tan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage asserts that the appearance of Sages caused the appearance of
    great robbers and that, if Sages became extinct, robbers would disappear and the
    empire would rest in peace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pecks, bushels, scales, steelyards, tallies, signets, charity, and duty to
    one's neighbour are all described as things that may be stolen.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage contrasts a man who steals a purse and is punished with another
    who steals a State and becomes a Prince.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A saying attributed in the passage note to Lao Tzŭ states that fishes cannot
    be taken away from water and that instruments of government cannot be delegated
    to others.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage instructs removing wisdom and knowledge, jade and pearls, tallies
    and signets, measures and scales, and restrictions of Sages so people revert to
    natural integrity and become fit for the reception of TAO.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage calls for disrupting musical instruments, colours, and geometrical
