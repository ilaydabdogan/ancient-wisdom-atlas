canonical_text:
  quote: there are no such extremes of value or worthlessness.
  summary: A discourse rejects fixed measures of great and small, value and worthlessness,
    existence and non-existence, and good and evil. The Spirit of the River asks how
    such extremes and practical choices are to be determined; the Spirit of the Ocean
    answers from the point of view of TAO using examples of relative scale, historical
    success and failure, differing functions, animal aptitudes, correlative opposites,
    and shifting social labels.
  language: English
  quote_policy: quoted
