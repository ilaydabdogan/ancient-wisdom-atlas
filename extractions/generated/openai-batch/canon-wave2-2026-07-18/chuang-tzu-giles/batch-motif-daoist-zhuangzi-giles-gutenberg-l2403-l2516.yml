canonical_text:
  quote: ''
  summary: The passage gives advice on restrained speech, avoiding excess, and not
    exceeding one's instructions. It then presents Yen Ho asking Chü Poh Yü how to
    tutor a dangerous princely son; Chü advises self-reform, outward adaptation, and
    caution, using examples of a praying mantis opposing a chariot, tiger keepers
    managing fury, and horses startled by well-intentioned care. The final episode
    describes an artisan who ignores a huge sacred li tree because its wood is useless,
    explaining that its uselessness accounts for its long life.
  language: English
  quote_policy: summarized
