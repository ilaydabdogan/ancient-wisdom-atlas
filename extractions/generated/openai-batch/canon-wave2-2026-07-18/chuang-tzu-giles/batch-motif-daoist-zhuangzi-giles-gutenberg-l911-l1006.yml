  summary: 'Commentary on Chuang Tzu''s Tao: the passage describes attainment of Tao
    through relinquishing moral, ritual, bodily, and mental attachments; presents
    the perfect man’s mind as mirror-like; compares Tao cautiously with Heraclitus''
    Logos; discusses immanence, emanation, mystical union, antinomianism, quietism,
    Inaction, and the relation of Taoism to Confucianism, Lao Tzu, and Confucius.'
