canonical_text:
  quote: ''
  summary: 'The passage criticizes Mih Tzŭ''s severe doctrine of lifelong toil and
    contempt for death, recounts the great Yü''s flood-control labors as the model
    later invoked by Mihists, describes Mihist divisions and disputes, and then presents
    other teachings associated with the TAO of the ancients: moderation, public-spirited
    impartiality, non-aggression, disarmament, and passivity or fatalism under the
    comprehensiveness of TAO.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mih Tzŭ is described as teaching that people should toil through life and
    hold death in contempt; the passage judges this teaching unattractive, impractical,
    opposed to human passions, and not the TAO of the true Sage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great Yü is said to have drained off flood waters, made rivers and streams
    flow through the empire, used a bucket and dredger with his own hands, and made
    all streams flow to the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yü's labor is described as leaving no hair on his calves and shins, while
    wind and rain beat upon him; he is also said to have marked out the nations of
    the world and to have been a Sage.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Later Mihists are described as wearing short serge jackets and straw sandals,
    toiling day and night, making self-mortification their aim, and measuring themselves
    by the TAO of Yü.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Different Mihist groups and followers are described as disagreeing, calling
    each other schismatics, and arguing over categories such as hard and white, like
    and unlike, and odd and even.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Mih Tzŭ and Ch'in Hua Li were right in theory but wrong in
    practice, and calls Mih Tzŭ well-meaning and a man of genius but not a true Sage.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: One formulation of the TAO of the ancients emphasizes avoiding mundane entanglement
    and speciousness, seeking world tranquillity, prolonging life, taking only what
    is sufficient, and purifying the heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sung Hsing and Yin Wên are described as followers of TAO who adopted a cap
    shaped like Hua Mountain as a badge and spoke of bringing joy to mankind and peace
    within the ocean-girdled world.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sung Hsing and Yin Wên are said to have suffered insult without noticing it,
    preserved people from strife, prohibited aggression, caused arms to lie unused,
    and saved their generation from wars.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sung Hsing and Yin Wên are associated with minimal subsistence, expressed
    as five pints of rice; their disciples are described as starving but still remembering
    the world's claims and toiling day and night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Their sayings about the superior man include not finding fault, not appropriating
    others' credit, valuing benefit to the world, treating non-aggression and unused
    arms as external, and treating restraint of passions as internal.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Another formulation of the TAO of the ancients emphasizes public spirit, belonging
    to no party, not acting only for oneself, moving without fixed constraint, accepting
    things as they come, and being impartial.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: P'êng Mêng, T'ien P'ien, and Shên Tao are described as followers of TAO whose
