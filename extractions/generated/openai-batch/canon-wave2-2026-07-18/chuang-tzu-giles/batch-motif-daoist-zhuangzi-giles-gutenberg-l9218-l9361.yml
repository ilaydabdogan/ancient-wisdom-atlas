canonical_text:
  quote: Those who understand it do not speak about it, those who speak about it do
    not understand it.
  summary: Knowledge travels to several interlocutors asking how TAO may be known,
    approached, and attained. Silence, forgetting, and negating methods are presented
    as superior to discursive knowledge. The Yellow Emperor teaches non-action, the
    unity and transformation of life and death, and the silent cosmic order as a model
    for the Sage.
  language: English
  quote_policy: quoted
