canonical_text:
  quote: The universe and I came into being together; and I, and everything therein,
    are ONE.
  summary: The passage presents a philosophical account of knowledge before matter,
    before conditioned matter, and before contraries; describes the arising of contraries
    as a decline of TAO and the rise of individual bias; contrasts argumentative knowledge
    with the true Sage's inward, non-assertive knowledge; and uses paradoxes of size,
    age, speech, existence, and non-existence to assert unity beyond verbal distinctions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The knowledge of the men of old is said to reach back to a time when matter
    did not exist, followed by matter unconditioned, then matter conditioned before
    contraries were known; when contraries appeared, TAO declined and individual bias
    arose.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Falling and rising are compared to effects of Chao Wên's music; Chao Wên played
    the guitar, Shih K'uang wielded the baton, and Hui Tzŭ argued.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hui Tzŭ tried to enlighten people, did not do so in the proper way according
    to the passage, ended in the obscurity of the 'hard and white,' and his son failed
    to establish the principle from his works.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The true Sage is said to aim at light from darkness and to transfer himself
    into the position of the things viewed rather than viewing them only subjectively.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage asks whether Speech belongs under a category of contraries or
    outside such categories, and notes the difficulty of speech after contraries have
    ceased to be.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker questions beginnings, the relation of existence and non-existence,
    the coming into existence of nothing, and whether his own words have really been
    uttered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage reverses ordinary measures by saying that the tip of an autumn
    spikelet is greater than anything under heaven, a vast mountain is small, and
    P'êng Tsu died young; it then states that the universe, the speaker, and everything
    therein are ONE.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that if all things are ONE there is no room for Speech,
    but if Speech exists, ONE and Speech make two, and two and one make three, beyond
    which even mathematicians fail to reach TAO.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The passage lists the Eight Predicables as paired delimitations: Right and
    Left, Relationship and Obligation, Division and Discrimination, Emulation and
    Contention.'
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The true Sage is described as recognizing delimitations within an external
    world without assigning them, and as assigning, classifying, and arguing without
    justifying, classifying, or arguing in the ordinary sense.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tzŭ Yu asks how this can be, and Tzŭ Ch'i answers that the true Sage keeps
    his knowledge within while ordinary people set forth theirs in argument to convince
    one another.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that perfect TAO does not declare itself, perfect argument
    does not express itself in words, and perfect charity, honesty, and courage are
    not manifested in absolute or obvious forms.
  category: speech
  evidence_refs:
  - ev:12
