canonical_text:
  quote: The ancients who attained TAO were equally happy under success and failure.
  summary: A sequence of anecdotes contrasts poverty, hunger, political office, rulership,
    and military counsel with contentment, inner cultivation, and attainment of Tao.
    Figures refuse office, remain cheerful in hardship, reject imperial power, or
    decline involvement in political action.
  language: English
  quote_policy: quoted
