candidate_motifs:
- id: motif:1
  label: Focused concentration produces effortless skill
  taxonomy_refs:
  - wisdom
  basis: The hunchback catches cicadas by bodily stillness and single attention, and
    Confucius states that singleness of purpose induces concentration.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a philosophical teaching example rather than a narrative of supernatural
    power.
- id: motif:2
  label: Detachment from external danger preserves efficacy
  taxonomy_refs:
  - wisdom
  basis: The boatman’s skill is explained as obliviousness to water and equanimity
    toward capsizing; the gambling analogy says external stakes disturb inner resource.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The motif is expressed through practical analogies, not through a single
    mythic quest episode.
- id: motif:3
  label: Balance of inner and outer self-care
  taxonomy_refs:
  - duality
  - wisdom
  basis: Shan Pao cares for the inner self and is destroyed externally, while Chang
    I cares externally and dies internally; both are said to have neglected laggards.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the contrast didactically; it does not explicitly name
    a cosmological dualism.
- id: motif:4
  label: The happy mean as protective wisdom
  taxonomy_refs:
  - wisdom
  basis: Confucius praises neither obscurity nor prominence but an unconscious happy
    mean, and extends the idea of precaution from dangerous travel to passion and
    banquets.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a moral aphorism rather than an extended narrative motif.
- id: motif:5
  label: Sacrificial honor versus the victim’s wish to live
  taxonomy_refs:
  - sacrifice
  basis: The Grand Augur contrasts ritual honors for pigs with the pigs’ likely preference
    to live on bran, then reveals his own willingness to die for honor.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage critiques viewpoint and attachment to fame; it does not present
    a divine command or mythic origin of sacrifice.
- id: motif:6
  label: Spirit encounter interpreted as self-injury and vital-force imbalance
  taxonomy_refs:
  - wisdom
  basis: Duke Huan’s sighting of a bogy is followed by illness, but Huang says the
    Duke is self-injured and explains symptoms through the state and direction of
    vital strength.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: Huang also affirms the existence of bogies, so the passage does not simply
    deny spirits; the causal emphasis is on the Duke’s condition.
- id: motif:7
  label: Catalogue of localized spirits
  taxonomy_refs: []
  basis: Huang names spirits associated with mud, fire, dust-bin, directions, water,
    hills, mountain, moor, and marsh.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No available motif-family taxonomy precisely matches this catalogue; available
    fire, water, and mountain refs are symbol refs rather than motif-family refs.
