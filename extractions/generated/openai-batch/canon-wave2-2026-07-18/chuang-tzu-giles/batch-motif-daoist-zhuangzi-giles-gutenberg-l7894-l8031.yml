canonical_text:
  quote: ''
  summary: A series of short teachings presents skill and life-preservation through
    concentration, detachment from external stakes, and balanced care of inner and
    outer life. Examples include a hunchback catching cicadas, a skilled boatman on
    a rapid, analogies about gambling stakes and sheep, contrasting deaths of Shan
    Pao and Chang I, warnings about danger and passion, a Grand Augur addressing sacrificial
    pigs, and Duke Huan’s illness after seeing a bogy followed by Huang Tzŭ Kao Ngao’s
    explanation of vital strength and catalogue of spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hunchback describes improved cicada-catching as he balances more balls
    and says he is conscious only of the cicada wings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunchback compares his body to a motionless tree stump and his arms to
    dead branches.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius tells his disciples that singleness of purpose brings concentration
    of the faculties and explains the hunchback’s success.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yen Yüan reports crossing the Shang-shên rapid with a boatman who handled
    his craft skillfully and said boat-handling can be learned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Confucius explains that the skilled boatman is oblivious of the water, treats
    the rapid as dry land, and treats an upset like an ordinary cart accident.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confucius says a player performs well for counters, becomes nervous when staking
    his girdle, and loses his wits when staking yellow gold, although the skill is
    unchanged.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'T''ien K''ai Chih tells Duke Wei that keeping life is like keeping sheep:
    one must look for the laggards and whip them up.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shan Pao preserves his inner life but is eaten by a tiger, while Chang I attends
    to external social life but dies of internal disease.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Confucius praises neither obscurity nor prominence but an unconscious happy
    mean, and he compares precautions in dangerous travel with warnings about passion
    and banquets.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Grand Augur addresses pigs before sacrifice, imagining both the pigs’
    preference for bran and life and his own preference for honor even at the cost
    of death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Duke Huan sees a bogy while hunting, Kuan Chung says he sees nothing, and
    the Duke later becomes delirious and stays indoors for many days.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Huang Tzŭ Kao Ngao says the Duke has injured himself, describes movements
    of vital strength as producing anger, memory loss, or disease, and then lists
    several spirits or bogies.
  category: speech
  evidence_refs:
  - ev:10
