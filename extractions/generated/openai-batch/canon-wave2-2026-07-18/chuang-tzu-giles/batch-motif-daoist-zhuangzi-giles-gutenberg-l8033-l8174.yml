canonical_text:
  quote: ''
  summary: 'A sequence of illustrative anecdotes: Huang identifies the Duke''s bogy-like
    vision and the Duke''s illness leaves him; Chi Hsing Tzŭ trains fighting cocks
    until they are inwardly calm; Confucius questions an old man who survives dangerous
    cataract water by accommodating himself to it; Ch''ing explains how concentrated
    quiescence and finding the right tree produce a seemingly supernatural musical-instrument
    stand; Yen Ho predicts that Tung Yeh Chi''s horses will break down because they
    are made to perform beyond their capacity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huang describes the Wei I as a sentient bogy with a cart-wheel breadth, shaft-like
    length, purple clothes, a red cap, and respectful behavior when it hears thunder.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Duke says the being described is the one he saw; he dresses, sits up,
    and his sickness leaves before the end of the day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chi Hsing Tzŭ trains fighting cocks for a prince, who repeatedly asks whether
    they are ready.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Across four ten-day intervals the cocks move from seeking a foe, reacting
    to sounds and shadows, and raging at enemies to ignoring other cocks' crowing
    and appearing wood-like.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cataract at Lü-liang is described as falling from a height of thirty jen,
    with foam reaching forty li away, and as a place no scaly or finny creature could
    enter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old man enters the cataract water, emerges about a hundred paces away,
    and walks along the bank singing, after Confucius had ordered a disciple to try
    to save him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man says he has no special way with water, but acts through original
    condition, habit growing into nature, and acquiescence in destiny; he enters with
    the whirl and comes out with the swirl.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ch'ing, chief carpenter, carves a wooden stand for hanging musical instruments,
    and viewers regard the finished work as if supernaturally made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ch'ing says he reduces his mind to quiescence, forgets reward and fame, becomes
    unconscious of body and court, enters a mountain forest, and searches for a tree
    containing the required form.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tung Yeh Chi demonstrates charioteering before Duke Chuang, driving in straight
    lines like ruled lines and curves like compass-drawn curves; the Duke orders repeated
    circuits.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Yen Ho predicts that Chi's horses are about to break down; the horses do break
    down, and Yen Ho explains that Chi had made them perform a task beyond their capacity.
  category: sequence
  evidence_refs:
  - ev:10
