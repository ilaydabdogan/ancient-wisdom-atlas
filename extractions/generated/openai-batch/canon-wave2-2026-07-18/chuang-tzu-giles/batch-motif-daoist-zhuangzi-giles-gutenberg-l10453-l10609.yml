    craft, money, power, or change.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: People are described as always doing something, following a regularity like
    the seasons, and dissipating their vital forces toward destruction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Chuang Tzŭ asks Hui Tzŭ whether archers who aim at nothing and hit something
    would make everyone another Yi, and whether each person having his own right would
    make everyone a Yao.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Chuang Tzŭ names Confucianists, Mihists, the schools of Yang and Ping, and
