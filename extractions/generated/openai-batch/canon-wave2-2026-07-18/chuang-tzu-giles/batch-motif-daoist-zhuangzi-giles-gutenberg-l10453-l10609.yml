candidate_motifs:
- id: motif:1
  label: Non-aggressive rule as wisdom
  taxonomy_refs:
  - wisdom
  basis: The passage opposes conquest and aggression and recommends abstention, sincerity,
    responsiveness, and sparing the people from death.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif label abstracts ethical instruction from a political admonition;
    no cross-tradition claim is implied.
- id: motif:2
  label: Quest to find TAO beyond known roads
  taxonomy_refs:
  - mystical_quest
  - departure
  - wisdom
  basis: The Yellow Emperor travels with companions to see TAO at a mountain, reaches
    the wilds at the limit of the known, loses the road, and seeks guidance.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage names the journey and destination but does not give a detailed
    ritual itinerary.
- id: motif:3
  label: Humble child teacher instructs a ruler
  taxonomy_refs:
  - wisdom
  basis: A horse-grazing boy knows where TAO abides, instructs the Yellow Emperor
    on governance, and is honored as Divine Teacher.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The boy is unusual in knowledge, but the passage does not describe a miraculous
    birth or childhood.
- id: motif:4
  label: Care without harm as model of governance
  taxonomy_refs:
  - wisdom
  basis: The boy directly equates governing the empire with looking after horses and
    states that seeing no harm comes to the horses is all that is needed.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: This is a governance analogy within the passage rather than a separate
    narrative episode.
- id: motif:5
  label: Sun-chariot journey beyond the compass restores sight
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The boy’s improved sight follows advice to mount the chariot of the sun and
    visit the wilds of Hsiang-ch'êng, after which he dwells outside the points of
    the compass.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage is brief and includes translator commentary; the exact literal
    versus allegorical status of the sun chariot should be reviewed.
- id: motif:6
  label: Attachment to roles dissipates vital force
  taxonomy_refs:
  - wisdom
  basis: The passage describes many social types as bound to their activities and
    concludes that people cannot remain inactive and dissipate vital forces toward
    destruction.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is aphoristic social criticism rather than a mythic narrative scene.
- id: motif:7
  label: Technical marvels mistaken for TAO
  taxonomy_refs:
  - wisdom
  basis: A disciple claims feats with fire and ice as attainment, but Lu Chü says
    these are merely latent heat and cold and not his TAO.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The feats are reported inside an analogy told during a debate.
- id: motif:8
  label: Attunement and loss of key-note
  taxonomy_refs:
  - wisdom
  basis: Lu Chü’s tuned lutes resonate when matched in pitch, but disorder appears
    when an interval is altered and the key-note loses influence.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The motif is inferred from a musical demonstration; no available taxonomy
    entry specifically names resonance or music.
