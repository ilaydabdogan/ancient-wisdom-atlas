  quote: ''
  summary: The passage counsels a ruler against conquest and aggression; narrates
    the Yellow Emperor’s journey to find TAO at Chü-tz'ŭ Mountain, where he is taught
    by a horse-grazing boy; describes people as bound to occupations and compulsive
    activity; and presents Chuang Tzŭ’s dialogue with Hui Tzŭ, including Lu Chü’s
    demonstrations involving fire, ice, and resonant lutes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An advising speaker questions whether slaying a whole nation and annexing
    its territory for the nourishment of passions and soul constitutes victory.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The advising speaker tells the addressed ruler to abstain, cultivate inward
    sincerity, respond to conditions, and avoid aggression so that the people escape
    death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Yellow Emperor travels to see TAO at Chü-tz'ŭ Mountain with named companions
    serving as charioteer, attendant, outriders, and rear guard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the wilds of Hsiang-ch'êng, the seven Sages lose their way and have no
    one from whom to ask the road.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The travelers meet a boy grazing horses who says that he knows Chü-tz'ŭ Mountain
    and where TAO abides.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy says he would govern the empire in the same way that he looks after
    horses.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The boy recounts that, when he lived within the points of the compass, his
    sight became dim; an old man advised him to mount the chariot of the sun and visit
    the wilds of Hsiang-ch'êng; afterward his sight improved and he continued to dwell
    outside the points of the compass.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When pressed again about governing, the boy says that one should see that
    no harm comes to the horses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Yellow Emperor prostrates himself before the boy, addresses him as Divine
    Teacher, and departs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Schemers, dialecticians, and critics are described as unhappy without the
