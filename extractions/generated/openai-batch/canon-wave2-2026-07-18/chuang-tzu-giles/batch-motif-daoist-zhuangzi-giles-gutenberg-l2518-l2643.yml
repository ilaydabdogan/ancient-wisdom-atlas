canonical_text:
  quote: "“All men know the use of useful things; but they do not know the use of
    useless things.”"
  summary: A sequence of anecdotes and admonitions presents trees, sacrificial exclusions,
    bodily deformity, and political withdrawal as cases in which apparent uselessness,
    defect, or inauspiciousness preserves life, while usefulness or worth attracts
    harm.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A tree appears to an artisan in a dream and speaks to him after he returns
    home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaking tree says fruit-bearing trees are stripped, broken, and caused
