  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaking tree says it aimed for uselessness, and the artisan later explains
    that sacred status helped it escape enemies and cutting.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Tzŭ Ch'i sees a large tree on Shang mountain whose shade could shelter many
    chariot teams, but whose branches, grain, leaf, and odor make it unsuitable or
    harmful for ordinary uses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tzŭ Ch'i says the large tree attained its size because it is good for nothing,
    and that a wise man might follow its example.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Ching-shih, beech, cedar, and mulberry trees are cut down for cages, beams,
    and coffins according to their size, and therefore perish beneath the axe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For sacrifices to the River God, certain bulls, pigs, and men are excluded
    as inauspicious, while the wise regard those traits as auspicious.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hunchback Su is described with severe bodily deformities and is able to
    earn a living by tailoring, washing, and sifting rice.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Su’s deformity shields him from conscription and public works, and he receives
    grain and firewood; the passage says physical deformity preserves the body and
    extends the point to moral and mental deformity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chieh Yü passes Confucius’s door, addresses him as a phoenix, and says prophets
