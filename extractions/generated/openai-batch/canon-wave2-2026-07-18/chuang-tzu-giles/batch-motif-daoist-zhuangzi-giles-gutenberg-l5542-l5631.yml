  summary: The passage argues against flattery toward parents, rulers, and society;
    criticizes conformity and collective error; uses analogies of mistaken travellers,
    unheard great music, an anxious ugly father, a tree made into sacrificial vessels,
    sensory confusion, outer adornment, prisoners, and caged animals to discuss loss
    of original nature and false attainment. A closing editorial note questions the
    chapter's attribution to Chuang Tzu.
