canonical_text:
  quote: ''
  summary: The passage describes a popular pictorial version of an episode with a
    tiger, a well, and the legend “All is Destiny.” Chuang Tzu reflects that creatures
    injure one another and that pursuit of gain brings loss, withdraws for three months
    after being suspected by a park-keeper, and explains to Lin Chu that he lost sight
    of his real self while in the park. A second anecdote tells of Yang Tzu at an
    inn where an ugly concubine is loved and a beautiful one hated; Yang Tzu turns
    the servant’s explanation into an instruction to be virtuous without self-consciousness.
  language: English
  quote_policy: summarized
