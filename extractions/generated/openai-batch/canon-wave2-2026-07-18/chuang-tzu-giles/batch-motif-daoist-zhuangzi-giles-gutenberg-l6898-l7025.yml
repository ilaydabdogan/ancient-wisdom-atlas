canonical_text:
  quote: It was the time of autumn floods. Every stream poured into the river...
  summary: During autumn floods, the river swells and the Spirit of the River rejoices,
    thinking the earth's beauty has gathered to himself. He travels east to the ocean,
    sees its vastness, and confesses his limited understanding. The Spirit of the
    Ocean teaches him about narrow perspectives, the relative scale of ocean and cosmos,
    human insignificance, and the non-final nature of categories such as great and
    small, near and far, success and failure, life and death, infinitesimal and colossal.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Autumn floods cause every stream to pour into the river, swelling it until
    the opposite banks are so distant that a cow and a horse cannot be distinguished.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Spirit of the River laughs for joy because he thinks all the beauty of
    the earth is gathered to himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Spirit of the River journeys east downstream until he reaches the ocean.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the ocean, the Spirit of the River sees no limit to the waves, changes
    countenance, sighs, and admits that he had heard only part of the truth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Spirit of the River says that seeing the Ocean Spirit's inexhaustibility
    saved him from being a laughing-stock to those of comprehensive enlightenment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Spirit of the Ocean says one cannot speak of ocean to a well-frog, of
    ice to a summer insect, or of TAO to a pedagogue whose scope is restricted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Spirit of the Ocean says all streams pour into the ocean without making
    it overflow, and that drainage does not empty it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Spirit of the Ocean says spring, autumn, floods, and droughts bring no
    change to the ocean.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Spirit of the Ocean says he does not boast because his shape comes from
    the universe and his vital power from Yin and Yang.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Spirit of the Ocean compares himself in the universe to a small stone
    or small tree on a vast mountain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Spirit of the Ocean compares the Four Seas to puddles in a marsh, the
    Middle Kingdom to a tare-seed in a granary, and an individual human to the tip
    of a hair on a horse's skin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Spirit of the Ocean cites Poh I and Confucius as examples of over-estimation
    of self and likens this to the River Spirit's former view of water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Spirit of the River asks whether he should regard the universe as great
    and the tip of a hair as small.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Spirit of the Ocean answers that dimensions are limitless, time is endless,
    conditions are not invariable, and terms are not final.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Spirit of the Ocean says the wise man does not treat the small as too
    little or the great as too much, and does not rejoice or grieve according to nearness,
    success, failure, life, or death.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Spirit of the River asks about dialecticians' claims regarding the infinitesimally
    small and the infinitesimally great.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The Spirit of the Ocean answers that greatness and smallness depend on comparison,
    and that the infinitesimal and the colossal fall into different categories.
  category: speech
  evidence_refs:
  - ev:11
