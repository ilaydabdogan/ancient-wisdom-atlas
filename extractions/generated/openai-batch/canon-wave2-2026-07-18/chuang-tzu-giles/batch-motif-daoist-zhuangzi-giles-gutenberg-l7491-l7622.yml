  summary: The passage questions whether perfect happiness exists, contrasts conventional
    worldly aims with the doctrine that true pleasure lies in inaction, presents Heaven
    and Earth as accomplishing through doing nothing, recounts Chuang Tzŭ singing
    and beating a bowl after his wife's death while explaining death as natural transformation,
    and begins an episode at the K'un-lun Mountains where a hunchback and a one-legged
    man develop ulcers near heroic tombs.
