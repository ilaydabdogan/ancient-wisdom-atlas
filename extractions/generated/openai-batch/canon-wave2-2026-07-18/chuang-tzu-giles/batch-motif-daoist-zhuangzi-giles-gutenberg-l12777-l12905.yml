candidate_motifs:
- id: motif:1
  label: decline from primordial non-injury to warfare and coercion
  taxonomy_refs: []
  basis: The passage contrasts the non-injuring age of Shên Nung with the Yellow Emperor's
    battle, later depositions, killings, and the strong oppressing the weak.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a passage-level pattern rather than an explicitly named taxonomy
    family in the supplied list.
- id: motif:2
  label: critique of revered sages and inherited doctrines
  taxonomy_refs:
  - wisdom
  basis: The speaker challenges celebrated rulers, Confucian dogmas, and the reputations
    of ancient worthies, treating conventional wisdom as corrupting or ineffective.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  - ev:16
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage is polemical and
    anti-conventional rather than a simple wisdom-teaching scene.
- id: motif:3
  label: self-sacrifice or fatal fidelity condemned as reputation-seeking
  taxonomy_refs:
  - sacrifice
  basis: Examples include cutting flesh to feed Wên Wang, drowning or burning rather
    than abandoning an obligation, and the passage's claim that such figures exaggerated
    reputation and disregarded death.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage condemns these acts and does not present them as sacred ritual
    sacrifices; the sacrifice taxonomy is therefore only partially supported.
- id: motif:4
  label: tree as refuge and death-site
  taxonomy_refs: []
  basis: Trees are used for early human safety and later appear in the deaths of Pao
    Chiao and Chieh Tzŭ T'ui.
  evidence_refs:
  - ev:2
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage does not identify the tree as sacred or cosmic; it is a recurring
    literal image.
- id: motif:5
  label: rising water as fatal test of steadfastness
  taxonomy_refs: []
  basis: Wei Shêng remains beneath a bridge as water rises because his assignation
    partner has not arrived, grasps a buttress, and dies.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: This motif is based on a single episode in the passage.
- id: motif:6
  label: loyal minister's fatal counsel or remonstrance
  taxonomy_refs: []
  basis: Shên T'u Ti dies after ignored counsel, and the passage later names loyal
    ministers such as Pi Kan and Wu Tzŭ Hsü whose deaths are treated as objects of
    ridicule.
  evidence_refs:
  - ev:12
  - ev:16
  confidence: medium
  cautions: The passage groups these examples rhetorically, but individual historical
    contexts are not elaborated here.
