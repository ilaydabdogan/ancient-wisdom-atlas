canonical_text:
  quote: They all exaggerated reputation and disregarded death.
  summary: A speaker contrasts an ancient age of simple non-injury with later warfare,
    dynastic violence, and reputation-seeking deaths. He criticizes celebrated rulers,
    Confucius, disciples, recluses, and loyal ministers as failing to preserve life
    or original purity.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says the empire is the largest state and notes that rulers such
    as Yao, Shun, T'ang, and Wu Wang obtained it, while their descendants or posterity
    later lost territory or disappeared.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In olden times, humans are said to have sought safety by making dwellings
    in trees, gathering acorns and chestnuts by day, and sleeping on branches at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Early people are said not to have known how to make clothes; they gathered
    fuel in summer and warmed themselves by fire in winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the days of Shên Nung, people are described as living among wild deer,
    knowing mothers but not fathers, tilling ground, weaving cloth, and harboring
    no thought of injuring others.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Yellow Emperor is said to have fought Ch'ih Yu at Chŏ-lu, where blood
    flowed for a hundred li.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage presents later rulers and ministers as associated with deposition,
    killing, oppression of the weak, and coercion of the few by the many.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker accuses Ch'iu, identified in the passage context as Confucius,
    of preaching old dogmas, using sophistries, deceiving rulers, seeking wealth and
    power, and deserving the name Robber Ch'iu.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tzŭ Lu is described as being enticed to follow Confucius, abandoning martial
    dress and sword, becoming a disciple, later attempting to slay the prince of Wei,
    failing, and being hacked to pieces and exposed at Wei's eastern gate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius is described as driven out of Lu, tabooed in Wei, unsuccessful in
    Ch'i, and surrounded by the Ch'êns and Ts'ais.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Six reputed worthies are said to have high reputations, but the passage attributes
