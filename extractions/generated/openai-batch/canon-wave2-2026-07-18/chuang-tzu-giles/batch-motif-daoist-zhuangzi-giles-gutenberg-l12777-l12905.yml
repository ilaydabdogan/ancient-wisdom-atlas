  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Pao Chiao is said to have made a display of virtue, abused the world, grasped
    a tree, and died.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Shên T'u Ti is said to have jumped into a river with a stone on his back when
