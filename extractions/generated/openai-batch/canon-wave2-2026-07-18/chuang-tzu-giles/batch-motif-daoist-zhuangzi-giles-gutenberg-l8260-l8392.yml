canonical_text:
  quote: ''
  summary: The passage presents two didactic episodes. First, Chuang Tzŭ observes
    a useless mountain tree that is spared, then a useless non-cackling goose that
    is killed, and answers the resulting dilemma by pointing beyond fixed usefulness
    and uselessness to TAO. Second, I Liao counsels the prince of Lu that attempts
    to avoid misfortune through conventional virtue are shallow, compares the prince's
    state to an animal skin that attracts traps, and urges him to discard power, desire,
    and the human hindrance in order to roam with TAO through Infinite Nought.
  language: English
  quote_policy: summarized
