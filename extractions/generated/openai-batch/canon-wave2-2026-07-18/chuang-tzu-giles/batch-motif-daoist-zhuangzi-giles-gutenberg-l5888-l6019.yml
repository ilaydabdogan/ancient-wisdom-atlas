canonical_text:
  quote: "“Be like these; follow TAO; and you will be perfect.”"
  summary: The passage presents encounters with Lao Tzŭ/Lao Tan. Confucius is advised
    to consult him and expounds charity and duty, which Lao Tzŭ rejects in favor of
    following Tao and natural regularity. Shih Ch'êng Ch'i visits Lao Tzŭ, first accuses
    him of moral failure, then apologizes and asks about personal cultivation. Lao
    Tzŭ responds with teachings on natural humility, the dangers of self-confidence,
    the vastness of Tao, and the peaceful condition of the perfect man.
  language: English
  quote_policy: quoted
