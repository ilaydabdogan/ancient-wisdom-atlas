  quote: All things, all conditions, were ONE.
  summary: The passage contrasts worldly study with Tao reached through repose, describes
    a primeval condition of unity, peace, ordered seasons, and unused knowledge, then
    narrates successive decline through named rulers, government, moral reform, art,
    learning, and attachment to office. It praises old sages and retired scholars
    who preserve themselves by returning to natural instincts, avoiding rhetoric,
    and remaining equally content under changing external conditions.
  language: English
  quote_policy: quoted
