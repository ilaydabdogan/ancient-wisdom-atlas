canonical_text:
  quote: 'Foot-prints are made by the shoe: they are not the shoe itself.'
  summary: The passage contains two dialogues. In the first, Tzŭ Kung describes differing
    actions by ancient rulers, and Lao Tzŭ responds by surveying the administrations
    of the Yellow Emperor, Yao, Shun, and Yü, ending with a criticism of the Three
    Kings and Five Rulers as producing confusion and harmful wisdom. In the second,
    Confucius tells Lao Tzŭ that his arrangement and use of the Six Canons failed
    to persuade rulers. Lao Tzŭ replies that the canons and spoken words are only
    traces like footprints, not the shoe itself, and teaches through animal reproduction
    examples that Nature, Destiny, Time, and Tao cannot be altered or obstructed.
    After three months indoors, Confucius returns, says he has attained, and Lao Tzŭ
    confirms this.
  language: English
  quote_policy: quoted
