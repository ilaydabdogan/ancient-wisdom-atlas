canonical_text:
  quote: ''
  summary: 'An editorial note links preceding words to chapter lxxxi of the Tao-Tê-Ching
    and comments on their placement in Confucius''s mouth. The passage then presents
    an anecdote: the Prince of Ch''u sits with the Prince of Fan; a Ch''u official
    speaks of signs of Fan''s destruction; the Prince of Fan replies that Fan''s destruction
    has not harmed his existence because of TAO, while Ch''u''s preservation will
    not preserve the Prince of Ch''u, who is said to lack TAO. The passage ends with
    an editorial label identifying the argument as an amphiboly.'
