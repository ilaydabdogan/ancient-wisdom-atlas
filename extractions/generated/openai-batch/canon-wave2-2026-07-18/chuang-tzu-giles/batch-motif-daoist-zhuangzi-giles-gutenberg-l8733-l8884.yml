canonical_text:
  quote: '"With such men as these, you have only to look, and TAO abides. There is
    no room for speech."'
  summary: The passage presents several dialogues about Tao, perfected virtue, and
    wordless influence. T'ien Tzŭ Fang praises Ch'i Kung but names Tung Kuo Shun Tzŭ
    as his true tutor, describing him as perfect and transformative without verbal
    praise. Prince Wên reacts with silent self-reproach. Wên Po Hsüeh Tzŭ encounters
    a persistent man of Lu, whose formal and forceful demeanor causes him to sigh.
    Confucius remains silent before Wên Po and explains that with such men Tao abides
    through a look. Yen Yüan asks why he can imitate Confucius outwardly but cannot
    follow him beyond mortality; Confucius responds with teaching on the death of
    the mind, bodily death, the sun, the grave, and the futility of seeking what has
    already passed away.
  language: English
  quote_policy: quoted
