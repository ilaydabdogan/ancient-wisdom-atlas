candidate_motifs:
- id: motif:1
  label: wordless transmission of Tao
  taxonomy_refs:
  - wisdom
  basis: The chapter argument says Tao cannot be imparted in words; Prince Wên is
    silenced by hearing of the perfect tutor; Confucius says a look is enough with
    such men and there is no room for speech; Yen Yüan describes Confucius's power
    to make people believe without speaking.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The available taxonomy has only a broad wisdom family; the passage's specific
    form is Daoist wordless realization rather than generic instruction.
- id: motif:2
  label: perfect sage beyond praise and formal virtue
  taxonomy_refs:
  - wisdom
  basis: Tung Kuo Shun Tzŭ is described as perfect, outwardly human and inwardly divine,
    beyond praise, and able to transform people without verbal instruction; Prince
    Wên contrasts this with his previous valuation of holiness, wisdom, charity, and
    duty.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The description is reported by T'ien Tzŭ Fang rather than shown directly
    through Tung Kuo's own action in the passage.
- id: motif:3
  label: ritual form contrasted with knowledge of the human heart
  taxonomy_refs:
  - wisdom
  basis: Wên Po Hsüeh Tzŭ says Middle Kingdom gentlemen excel in ceremonies and obligations
    but lack knowledge of the human heart, and later describes the visitor through
    images of rigid form and forceful admonition.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly resolve whether the visitor is morally
    deficient, only that Wên Po sighs in response to him.
- id: motif:4
  label: death of the mind as greater sorrow than bodily death
  taxonomy_refs: []
  basis: Confucius explicitly says that no sorrow compares with the death of the mind
    and that the death of the body is secondary.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No available taxonomy reference precisely matches this mind-body motif
    without overextending into death-rebirth categories.
- id: motif:5
  label: disciple follows outward form but cannot follow inner transcendence
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Yen Yüan says he can follow Confucius's walking, trotting, galloping, speaking,
    arguing, and preaching, but cannot follow when Confucius dashes beyond mortality
    and exercises nonverbal influence.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The movement sequence is metaphorical in the dialogue; it is not a literal
    journey or ascent.
- id: motif:6
  label: seeking the already vanished essence
  taxonomy_refs:
  - wisdom
  basis: Confucius says Yen Yüan fixes attention on something in him that has already
    passed away and compares the search to seeking a horse in a market-place.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The referent of the vanished quality is philosophical and not fully specified
