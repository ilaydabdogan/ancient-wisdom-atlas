canonical_text:
  quote: ''
  summary: The passage presents didactic reflections and dialogues on Tao, impartiality,
    impermanence, natural and artificial conditions, and sage-like freedom from injury.
    It then gives an allegorical chain in which walrus, centipede, snake, wind, eye,
    and mind envy one another’s capacities, with explanations of natural mechanism.
    The excerpt ends with Confucius surrounded at K'uang while continuing to play
    and sing, prompting Tzŭ Lu to ask why he is cheerful.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage warns that considering paired terms such as few and many from
    only one side injures or confuses Tao, and it urges impartial, expansive treatment
    of all creation.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tao is described as without beginning and without end, while other things
    are born, die, remain impermanent, and continually change form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Human life is compared to a galloping horse, changing at every turn and hour,
    and the passage asks what one should do except let decomposition proceed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Spirit of the River asks about the value of Tao, and the Spirit of the
    Ocean answers that those who understand Tao apprehend eternal principles and do
    not suffer injury from without.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A person of perfect virtue is said not to be burnt by fire, drowned in water,
    hurt by frost or sun, or torn by wild bird or beast, because he discriminates
    between safety and danger and remains happy in differing circumstances.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Horses and oxen having four feet are presented as natural, while putting a
    halter on a horse or a string through a bullock’s nose is presented as artificial.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage instructs not to let the artificial obliterate the natural, will
    obliterate destiny, or fame cause virtue to be sacrificed, and says observance
    leads to reversion to the divine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'An envy sequence is given: the walrus envies the centipede, the centipede
    envies the snake, the snake envies the wind, the wind envies the eye, and the
    eye envies the mind.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The centipede says it does not manage its legs; its mechanism works naturally
    and unconsciously, compared with saliva drops falling in different sizes and numbers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The snake says that one’s natural mechanism is not to be changed and that
    it has no need of legs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wind says that it can be pointed at or kicked at by others but can break
    huge trees and destroy large buildings; excelling in great things is said to belong
    only to sages.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Confucius is described as surrounded at K'uang, yet continuing to play and
