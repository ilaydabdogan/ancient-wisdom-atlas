  quote: ''
  summary: The passage teaches that Tao, repose, stillness, and inaction are the source
    and regulating pattern of the universe. The Sage’s mind is compared to still water
    and a mirror of creation. Wise rulers administer by inaction; those who enjoy
    the happiness of God live and die as part of divine function and physical change,
    expressing repose/motion through Negative/Positive and earth/heaven.
  language: English
  quote_policy: summarized
