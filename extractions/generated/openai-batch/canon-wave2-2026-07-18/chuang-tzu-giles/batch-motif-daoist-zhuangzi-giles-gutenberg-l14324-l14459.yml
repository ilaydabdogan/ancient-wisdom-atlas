canonical_text:
  quote: ''
  summary: The passage reviews several exponents and critics of Tao. It presents teachings
    that advise neutrality beyond positive and negative, responsiveness like inanimate
    or natural things, humility, non-aggression, and non-assertion. It then praises
    Kuan Yin and Lao Tzŭ as true ancient sages and describes Chuang Tzŭ as an unconventional
    thinker whose writings use indirect speech, paradoxical language, and harmony
    with the universe.
  language: English
  quote_policy: summarized
