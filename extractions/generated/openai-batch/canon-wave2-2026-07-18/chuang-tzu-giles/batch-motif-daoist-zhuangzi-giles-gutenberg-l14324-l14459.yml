  basis: 'The passage repeatedly pairs and reverses opposites: positive and negative
    cease, strong is content to be weak, pure accepts disgrace, first becomes lowest,
    substantial is exchanged for unsubstantial, life and death are juxtaposed, and
    heaven and earth are blended in one.'
