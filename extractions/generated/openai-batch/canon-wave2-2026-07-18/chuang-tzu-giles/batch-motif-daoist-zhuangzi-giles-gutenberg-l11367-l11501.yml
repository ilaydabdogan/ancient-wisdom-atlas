canonical_text:
  quote: ''
  summary: The passage contrasts ancient rulers who blame themselves with contemporary
    rulers who punish the people, reflects on changing judgments and the limits of
    known knowledge, recounts explanations for Duke Ling's name including a divined
    tomb inscription, and defines society through part-whole analogies, impartiality,
    and Taoist non-action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says rulers of old credited the people with success and right
    action, while assigning failure and wrong action to themselves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says rulers of the present conceal things, impose dangerous tasks,
    heavy burdens, and long marches, and punish or slay those unable to comply.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people are described as resorting to fraud, deceit, and theft when their
    powers, knowledge, or means are insufficient.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chü Poh Yü is said to have changed his opinions at sixty, regarding as wrong
    what he had previously regarded as right.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says things are produced and issue forth, but no one knows their
    source or sees the portal; people value known knowledge but not the unknown route
    to knowledge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Confucius asks three historiographers why Duke Ling received the name Ling
    despite drinking, pleasure, neglected government, hunting, and poor relations
    with other princes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ta T'ao answers that Duke Ling was named Ling for those very reasons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Poh Ch'ang Ch'ien says Duke Ling was bathing with three wives when Shih Ch'in
    entered, and that the Duke covered himself and the women out of respect for a
    virtuous man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hsi Wei recounts divination about Duke Ling's burial and the discovery at
    Sha-ch'iu of a stone coffin bearing an inscription about Duke Ling seizing it
    for his tomb.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: T'ai Kung Tiao defines society as an agreement of families and individuals
    to follow customs, in which discordant elements unite into a harmonious whole.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'The horse is used as an example: no single part is a horse, but the combination
    of all parts makes the horse.'
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A mountain is described as high because of its particles, and a river as large
    because of its drops.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The just man is described as regarding parts from the standpoint of the whole
    and as not obstinately despising others' views.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Different seasons, official functions, civil and military roles, and varying
    laws are presented as compatible with completeness when there is no partiality.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: TAO is described as unidentifiable, as doing nothing, and as enabling all
    things to be done by doing nothing.
  category: speech
  evidence_refs:
  - ev:11
