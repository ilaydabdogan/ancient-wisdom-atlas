canonical_text:
  quote: ''
  summary: The passage opens with questions about the causes of celestial motion,
    rain, clouds, and wind. Wu Han Chao answers by invoking the Six Influences, the
    Five Virtues, and the rule of a ruler in harmony with them. Chuang Tzu then discusses
    charity, filial piety, virtue, and the indivisibility of Tao. The final section
    presents Pei Men Ch'eng describing the overwhelming effect of the Yellow Emperor's
    music, followed by the Yellow Emperor's account of perfect music as moving from
    human standard through divine lines, five virtues, spontaneity, seasonal blending,
    Yin-Yang harmony, and unbroken alternation of life and death, rising and sinking.
  language: English
  quote_policy: summarized
