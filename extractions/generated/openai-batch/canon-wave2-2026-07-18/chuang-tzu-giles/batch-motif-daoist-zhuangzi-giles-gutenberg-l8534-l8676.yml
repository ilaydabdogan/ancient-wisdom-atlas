canonical_text:
  quote: ''
  summary: 'The passage presents several didactic episodes: Confucius relinquishes
    formal study; Sang Hu transmits Shun''s deathbed advice to Yü; Chuang Tzŭ distinguishes
    poverty from misery before the prince of Wei and uses animal and political examples;
    Confucius, starving between Ch''ên and Ts''ai, teaches Yen Hui about natural hardship,
    external advantage, waiting, and the relation of man and God; Chuang Tzŭ in a
    park observes a bird, a cicada, and a mantis in a chain of predation and forgetfulness.'
  language: English
  quote_policy: summarized
