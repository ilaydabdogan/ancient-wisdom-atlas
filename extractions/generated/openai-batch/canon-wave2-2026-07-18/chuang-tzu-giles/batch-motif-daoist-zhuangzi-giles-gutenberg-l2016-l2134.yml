canonical_text:
  quote: ''
  summary: The passage gives maxims on limited life and limitless knowledge, then
    narrates Prince Hui's cook cutting up a bullock by following Tao and natural openings.
    It next presents Hsien's response to a footless official and an analogy of wild
    fowl preferring freedom over caged feeding. Finally, after Lao Tzu's death, Ch'in
    Shih mourns briefly and explains that birth and death occur at their proper times,
    while excessive grief violates eternal principles; death is compared to a release,
    and life or soul to fire transmitted after fuel is consumed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that life has a limit while knowledge is without limit,
    and that driving the limited in search of the limitless is fatal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage advises avoiding fame when striving for others, avoiding disgrace
    when striving for self, and pursuing a middle course to preserve body, mind, duties,
    and allotted span.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prince Hui's cook cuts up a bullock with coordinated motions and sounds described
    as rhythmical and harmonious.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prince Hui praises the cook's skill, and the cook replies that he has devoted
    himself to Tao, which he says is better than skill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cook says he now works with his mind rather than his eye, follows openings
    or cavities according to the animal's natural constitution, and does not cut through
    joints or large bones.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The cook says his chopper has lasted nineteen years and still has an edge
    as if fresh from the whetstone because the blade enters interstices at the joints.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the cook meets a difficult hard part, he becomes cautious, fixes his
    eye, stays his hand, gently applies the blade, and waits until the part yields.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Prince Hui says that from the cook's words he has learned how to take care
    of his life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hsien sees a certain official who has lost a foot and asks whether this condition
    is the work of God or of man, then attributes it to God.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wild fowl are described as getting food and drink only intermittently but
    not wanting to be fed in a cage because they would not be free.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: When Lao Tzu dies, Ch'in Shih goes to mourn, utters three yells, and departs.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ch'in Shih says he found old persons and young persons grieving intensely
    for Lao Tzu, and he interprets such attachment as violating eternal principles
    and increasing human emotion.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Ch'in Shih says the Master came because it was his time to be born and went
    because it was his time to die, so lamentation and sorrow have no place for those
    who accept birth and death in this sense.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Death is described as God cutting down a man suspended in the air; the fuel
    is consumed, but the fire may be transmitted, and its end is not known.
  category: speech
  evidence_refs:
  - ev:14
