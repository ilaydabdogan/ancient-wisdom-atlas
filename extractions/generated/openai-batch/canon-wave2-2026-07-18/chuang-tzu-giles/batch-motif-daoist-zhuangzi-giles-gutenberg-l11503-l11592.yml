canonical_text:
  quote: TAO folds them all in its embrace.
  summary: In a philosophical dialogue, Shao Chih asks T'ai Kung Tiao about creation,
    vitality, Chance, Predestination, and Tao. T'ai Kung Tiao explains creation as
    the Ten Thousand Things, describes reciprocal alternation among cosmic and worldly
    conditions, rejects Chance and Predestination as limited to material existence,
    and presents Tao as beyond both language and silence. A closing note compares
    the essay with Buddhist books from the West.
  language: English
  quote_policy: quoted
