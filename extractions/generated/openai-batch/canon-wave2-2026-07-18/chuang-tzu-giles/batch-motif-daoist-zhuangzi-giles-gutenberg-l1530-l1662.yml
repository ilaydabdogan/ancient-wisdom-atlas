canonical_text:
  quote: positive and negative alike blend into an infinite ONE
  summary: The passage discusses speech, Tao, subjective and objective distinctions,
    and the reconciliation of contraries. It argues that fixed distinctions such as
    affirmative and negative, beauty and ugliness, construction and destruction, and
    subjective and objective are unified from the standpoint of Tao. A parable of
    monkeys receiving chestnuts illustrates how different arrangements can leave the
    underlying total unchanged while satisfying differing perspectives.
  language: English
  quote_policy: quoted
