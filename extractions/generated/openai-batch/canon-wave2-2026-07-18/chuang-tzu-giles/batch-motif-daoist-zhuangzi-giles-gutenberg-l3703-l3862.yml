canonical_text:
  quote: ''
  summary: A sequence of anecdotes and dialogues presents governance as best accomplished
    by non-coercive inaction, self-perfection, accord with natural order, and freedom
    from artificial standards. Figures contrast artificial lawmaking and active cleverness
    with hidden virtue, self-effacement, and invisible efficacy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yeh Ch'üeh asks Wang I four questions; Wang I cannot answer any of them, and
    Yeh Ch'üeh is delighted and reports this to P'u I Tzŭ.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: P'u I Tzŭ says Emperor Shun was not equal to T'ai Huang, contrasting Shun's
    charitable but artificial government with T'ai Huang's peaceful sleep, waking
    inactivity, self-identification as horse or ox, substantial wisdom, and genuine
    virtue.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: Chien Wu reports that Jih Chung Shih taught him about laws and regulations
    evolved by princes, which people would not venture to disobey.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:4
  text: Chieh Yü rejects that teaching as false and compares governing mankind that
    way to impossible or absurd tasks involving the sea, a river, a mosquito, and
    a mountain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chieh Yü says the truly wise man's government has no concern with externals,
    begins with self-perfection, and acts without overt effort; he adds examples of
    bird and mouse avoiding human dangers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: T'ien Kên, travelling south of the Yin mountain and reaching the river Liao,
    meets a Sage and asks about governing the empire.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Sage rebukes T'ien Kên's question, says God has just turned him out a
    man, and describes being borne on light pinions beyond the cardinal points to
    nowhere and nothingness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After a second question from T'ien Kên, the Sage instructs him to resolve
    mental energy into abstraction, physical energy into inaction, follow the natural
    order, omit self, and the empire will be governed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yang Tzŭ Chü asks Lao Tzŭ whether an ardent, courageous, principled, untiring
    pursuer of TAO would count as a wise ruler.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lao Tzŭ answers that such a person would be a handicraftsman wearing out body
    and mind, and gives animal examples in which conspicuous qualities bring harm
    or tethering.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lao Tzŭ describes the goodness of a wise ruler as covering the empire, influencing
    all creation without being consciously perceived, taking countless forms, and
    travelling through the realms of Nowhere.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Chi Han is described as a wonderful magician in Chêng who predicts birth and
    death, fortune and misfortune, and life span with supernatural accuracy; the people
    flee him, but Lieh Tzŭ visits and becomes infatuated.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Hu Tzŭ tells Lieh Tzŭ that he has taught him only the ornamentals, not the
    essentials, of TAO; he uses a poultry-yard analogy and warns that forcing TAO
    on people merely exposes oneself.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Chi Han visits Hu Tzŭ and predicts that Hu Tzŭ is doomed and like wet ashes;
    Hu Tzŭ later says he had shown only an earthlike outward stillness while concealing
    his inner energy.
  category: sequence
  evidence_refs:
  - ev:12
