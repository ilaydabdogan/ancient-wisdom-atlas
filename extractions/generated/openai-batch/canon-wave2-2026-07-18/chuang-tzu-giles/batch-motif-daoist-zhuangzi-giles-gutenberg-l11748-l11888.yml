canonical_text:
  quote: ''
  summary: A series of teachings and anecdotes criticizes reputation-seeking goodness,
    describes a divine tortoise that appears in Prince Yüan's dream but is captured,
    killed, and used for reliable divination, and presents dialogues and reflections
    on the useless, the Yellow Spring, the perfect man, unobstructed Tao, breath,
    hermitage, seasonal growth, and simple remedies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening teaching calls the use of goodness as a passport to influence
    through gratifying others an everlasting shame, and describes the true Sage as
    a passive agent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Yüan of Sung dreams of a dishevelled-haired man who says he comes from
    the waters of Tsai-lu, serves the River God, and has been caught by the fisherman
    Yü Ch'ieh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Soothsayers interpret the dream figure as a divine tortoise, and the prince
    summons the fisherman Yü Ch'ieh.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yü Ch'ieh reports that he has netted a white tortoise, and the prince orders
    it brought to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prince is uncertain whether to kill or keep the tortoise alive; a divinatory
    response instructs him to slay it for divination and predicts good fortune.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the tortoise is killed, seventy-two omens are taken, and none proves
    false.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Confucius comments that the divine tortoise can appear in a dream and provide
    faultless omens, yet cannot escape the fisherman's net or being cut to pieces.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Confucius says wisdom and spirituality have limits and advises removing small
    wisdom so great wisdom may shine.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Hui Tzŭ calls Chuang Tzŭ's theme the useless, and Chuang Tzŭ replies that
    the useless must be understood before the useful can be discussed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chuang Tzŭ illustrates the use of the useless by saying that a person uses
    only the ground under the sole of the foot, then after death goes beneath the
    earth to the Yellow Spring.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Chuang Tzŭ says the perfect man leaves no trace, can transcend the limits
    of the human without withdrawing from the world, and lives with mankind without
    injury to himself.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The passage lists unobstructed eye, ear, nose, mouth, mind, and wisdom as
