- id: motif:2
  label: sacrificial or lethal divination of a sacred animal
  taxonomy_refs:
  - sacrifice
  basis: A divinatory response instructs the prince to slay the tortoise for purposes
    of divination, after which omens are taken successfully.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text says the tortoise is slain for divination, but it does not explicitly
    describe an offering to a deity.
- id: motif:3
  label: limits of wisdom before fate or snares
  taxonomy_refs:
  - wisdom
  basis: Confucius states that the divine tortoise has wisdom enough for dreams and
    faultless omens but cannot avoid the fisherman's net or dismemberment, and then
    says wisdom has limits.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is philosophical and aphoristic rather than a developed mythic
    plot.
- id: motif:4
  label: usefulness of the useless
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzŭ states that one must understand the useless before discussing
    the useful and illustrates this with the contrast between the vast earth and the
    small portion used by the foot.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a philosophical paradox in dialogue form, not a narrative motif.
- id: motif:5
  label: descent beneath earth to the Yellow Spring after death
  taxonomy_refs: []
  basis: Chuang Tzŭ says that after a man turns up his toes, he goes beneath the earth
    to the Yellow Spring.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives only a brief death-image and does not describe an afterlife
    journey in detail.
