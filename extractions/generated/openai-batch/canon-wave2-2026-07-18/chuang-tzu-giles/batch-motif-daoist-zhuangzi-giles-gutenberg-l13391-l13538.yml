canonical_text:
  quote: '"This man is a Sage!"'
  summary: Confucius rests with his disciples at Apricot Altar in the Black Forest,
    plays the lute, and is observed by an old fisherman. The fisherman questions Tzŭ
    Kung and Tzŭ Lu about Confucius, criticizes Confucius for straying from the true
    path, and leaves. Confucius follows, bows twice, and asks for instruction. The
    fisherman teaches about natural correspondence, proper social functions, the sorrows
    of ranks from common people to the Son of Heaven, and the faults and obstructions
    that disturb conduct and government.
  language: English
  quote_policy: quoted
