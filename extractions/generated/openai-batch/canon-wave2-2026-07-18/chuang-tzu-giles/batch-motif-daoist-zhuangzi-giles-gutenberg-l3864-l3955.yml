canonical_text:
  quote: ''
  summary: The passage recounts successive interviews in which Hu Tzŭ presents different
    states that Chi Han first diagnoses, then cannot read, and finally flees from.
    Lieh Tzŭ realizes his lack of real knowledge and practices simplicity. The passage
    then states teachings on Inaction, passivity, and the mirror-like mind of the
    perfect man. A separate parable tells how Shu and Hu, rulers of the southern and
    northern seas, try to repay Hun Tun of the central zone by boring seven human
    openings into him, causing his death on the seventh day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chi Han tells Lieh Tzŭ that Hu Tzŭ is better and will recover; Hu Tzŭ later
    says he had shown himself with a little energy visible.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a further interview, Chi Han says Hu Tzŭ is never the same and that he
    can tell nothing from his physiognomy; Hu Tzŭ says he showed a state of harmonious
    equilibrium and speaks of the abyss through images of whale and water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the next encounter Chi Han cannot stand still, becomes confused, turns,
    and flees; Hu Tzŭ says he showed himself as TAO appeared before time, as a self-existing
    blank.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lieh Tzŭ concludes that he has not acquired real knowledge and spends three
    years without leaving the house, helping with cooking, feeding pigs like human
    beings, discarding the artificial, and reverting to the natural.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that through Inaction one may become a centre of thought,
    focus of responsibility, and arbiter of wisdom while remaining unmoved and compliant
    with divine principles without outward manifestation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The perfect man is described as employing his mind as a mirror that grasps
    nothing, refuses nothing, receives, and does not keep.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares fame through Inaction to spirits of the dead coming to
    a boy who impersonates a corpse; the note explains that in old Chinese funeral
    rites a boy sat speechless and motionless as a corpse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shu is named ruler of the southern sea, Hu ruler of the northern sea, and
    Hun Tun ruler of the central zone; a note says Hun Tun denotes matter before separation
    and subdivision into visible phenomena.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shu and Hu often meet on Hun Tun's territory, are well treated by him, and
    decide to repay him by boring seven holes in him because all men have such holes
    while Hun Tun has none.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shu and Hu bore one hole each day, and Hun Tun dies on the seventh day.
  category: sequence
  evidence_refs:
  - ev:7
