canonical_text:
  quote: ''
  summary: 'The passage presents Kuang Ch''êng Tzŭ teaching the Yellow Emperor about
    preserving the original One, the eternal self, Tao, and endurance beyond ordinary
    mortality. It then narrates two meetings between the Spirit of the Clouds and
    the Vital Principle: the Spirit seeks knowledge about cosmic disorder and governance,
    while the Vital Principle rejects knowing, blames disorder on government, and
    advises inaction, non-differentiation, emptiness, and return to original simplicity.
    The passage closes with an aphorism about people preferring similarity and attempting
    differentiation from others.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kuang Ch'êng Tzŭ says he preserves the original ONE, rests in harmony with
    externals, and has kept his body from decay for twelve hundred years.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yellow Emperor prostrates himself and says Kuang Ch'êng Tzŭ is surely
    God.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kuang Ch'êng Tzŭ says the self is eternal and infinite, while men think it
    mortal and finite; he contrasts those who possess TAO with those who do not.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kuang Ch'êng Tzŭ says living things spring from dust and return to dust, and
    says he will lead the listener through Eternity into Infinity; he identifies his
    light with sun and moon and his life with heaven and earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Spirit of the Clouds, while passing eastward through Air, meets the Vital
    Principle, who is slapping his ribs and hopping about.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Spirit of the Clouds says the relationship of heaven and earth is out
    of harmony, the six influences do not combine, and the four seasons are irregular;
    he wants to blend the influences to nourish living beings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Vital Principle responds to the Spirit of the Clouds' request by saying
    that he does not know.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Three years later the Spirit of the Clouds again meets the Vital Principle,
    rejoices, prostrates himself, and asks to interrogate him; the Vital Principle
    says he wanders and roams without knowing what he wants or where he is going.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Spirit of the Clouds says he also roams, but people depend on his movements
    and he is unavoidably summoned to power.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Vital Principle names confusion of empire, violated conditions of life,
    failure of God's will, disorder among beasts, night cries of birds, blight in
    plants, and destruction among creeping things, and says these are the fault of
    government.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Vital Principle says the poison lurks there and tells the Spirit of the
    Clouds to go back; he then advises feeding the people with the heart, resting
    in inaction, casting off the slough, spitting forth intelligence, ignoring differences,
    becoming one with the infinite, releasing mind and soul, and being vacuous and
    Nothing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Vital Principle says all things should revert to their original constitution;
    without knowledge the result is simple purity, while knowledge produces divergence;
    he tells the Spirit not to seek names or relations of things.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Spirit of the Clouds prostrates himself, takes leave, and says he has
    found what he had long sought.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The closing aphorism says people rejoice in others being like themselves,
    object to those unlike themselves, and seek friendship with likes over unlikes
    from a desire to differentiate themselves.
  category: speech
  evidence_refs:
  - ev:10
