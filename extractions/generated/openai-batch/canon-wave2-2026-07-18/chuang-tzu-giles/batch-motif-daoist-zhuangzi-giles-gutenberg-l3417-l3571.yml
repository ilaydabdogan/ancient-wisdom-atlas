  quote: ''
  summary: Dialogues describe acceptance of death under Nature, TAO, and God; friends
    who sing beside a corpse because the dead companion has returned to God; Confucius
    explaining people who travel beyond ordinary ritual rule; analogies of fish in
    water and humans in TAO; and a discussion of restrained mourning as an advance
    toward wisdom.
  language: English
  quote_policy: summarized
