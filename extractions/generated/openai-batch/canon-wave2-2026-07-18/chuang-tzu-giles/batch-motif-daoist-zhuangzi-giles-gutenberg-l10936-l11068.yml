canonical_text:
  quote: '"Leave wisdom to ants. Strive for what fishes desire."'
  summary: The passage criticizes narrow learning, parasitic complacency, crowd-attracting
    enthusiasm, and unexamined capacities. It praises the spiritual or divine man
    who follows natural development, uses examples of fish in water, drugs, animal
    proportions, rivers, shadows, and unknown ground, and culminates in knowledge
    of great principles, the unknowable ultimate, the great Guide, and the dispelling
    of doubt.
  language: English
  quote_policy: quoted
