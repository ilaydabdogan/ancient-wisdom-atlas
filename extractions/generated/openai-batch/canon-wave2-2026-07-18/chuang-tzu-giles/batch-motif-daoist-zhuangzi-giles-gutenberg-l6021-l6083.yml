canonical_text:
  quote: ''
  summary: The passage argues that books, words, and sensory forms or sounds cannot
    convey the essence of Tao. It then tells of Duke Huan reading the words of dead
    sages when a wheelwright challenges him, calling such words the dregs of the ancients
    and explaining that the crucial art of wheel-making depends on tacit mind-hand
    coordination that cannot be put into words or transmitted even to his son.
  language: English
  quote_policy: summarized
literal_observations:
