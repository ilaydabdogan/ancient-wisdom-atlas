  text: Books are described as valued by the world as representing Tao, but the passage
    states that books are only words and that the valued part of words is the thought
    contained in them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the thought contained in words has a bias that cannot
    be conveyed in words.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visible form and colour, and audible sound and noise, are said not to provide
    understanding of the essence of Tao, despite people thinking they do.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that those who know do not speak, and those who speak do
    not know.
  category: speech
  evidence_refs:
