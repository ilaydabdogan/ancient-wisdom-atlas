canonical_text:
  quote: ''
  summary: The passage introduces Robber Chê, younger brother of Liu Hsia Chi, as
    a violent outlaw leader. Confucius decides to admonish him despite warnings, visits
    his camp near T'ai-shan, and is threatened. Confucius praises Chê's beauty, wisdom,
    and courage and proposes that he become a ruler and restore social and ancestral
    rites. Chê rejects the praise and political offer as flattery and manipulation.
  language: English
  quote_policy: summarized
