canonical_text:
  quote: "“virtue should prevail and outward form be forgotten.”"
  summary: Duke Ai tells Min Tzŭ that, after hearing about the perfect man, he fears
    that his former understanding of rulership has harmed his state and describes
    Confucius as a moral friend rather than merely a minister. Two examples follow
    in which rulers favor physically atypical men over well-formed men. The passage
    then states that virtue should prevail over outward form and describes the truly
    wise as needing no ordinary wisdom, sincerity, virtue, or skill, feeding on the
    divine, wearing human forms without human passions, and having no place for positives
    and negatives. Hui Tzŭ questions Chuang Tzŭ about men without passions; Chuang
    Tzŭ replies that TAO gives expression and God gives form, and defines such a man
    as one undisturbed by good and evil. Chuang Tzŭ then criticizes Hui Tzŭ for devoting
    intelligence to externals and mocks his concern with the “hard and white.”
  language: English
  quote_policy: quoted
