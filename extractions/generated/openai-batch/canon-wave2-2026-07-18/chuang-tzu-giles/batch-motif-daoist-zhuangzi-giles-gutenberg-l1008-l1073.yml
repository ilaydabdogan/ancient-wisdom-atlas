canonical_text:
  quote: ''
  summary: The passage contrasts Confucian and Laoist understandings of Tao, describes
    Lao Tzŭ as cultivating Tao while remaining concealed and withdrawing during dynastic
    decay, and frames later Taoism as mystical dissent against established Confucianism.
    It then compares this pattern to Western representations of Plato and Aristotle,
    states an intended parallel between Chuang Tzŭ and Heracleitus, and cautions against
    overreading parallels such as those proposed between Gautama and Christ.
  language: English
  quote_policy: summarized
