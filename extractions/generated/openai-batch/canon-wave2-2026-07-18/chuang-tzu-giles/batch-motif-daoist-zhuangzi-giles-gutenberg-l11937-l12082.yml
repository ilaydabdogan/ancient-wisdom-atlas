canonical_text:
  quote: ''
  summary: The passage contrasts attributed speech, authority-based speech, and language
    that overflows naturally like a full goblet and is said to accord with God. It
    discusses language, contraries, subjective judgments, germs, cyclic reproduction,
    and divine equilibrium. It then presents anecdotes involving Chuang Tzŭ, Hui Tzŭ,
    Confucius, Tsêng Tzŭ, and Yen Ch'êng Tzŭ Yu, including Confucius changing opinions,
    filial grief over salary and parents, and a nine-year progression after instruction
    toward perfection, knowing God, and questioning life, death, Destiny, and supernatural
    agency.
  language: English
  quote_policy: summarized
literal_observations:
