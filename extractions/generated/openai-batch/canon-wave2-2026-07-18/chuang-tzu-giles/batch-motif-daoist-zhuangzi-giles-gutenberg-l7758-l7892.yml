canonical_text:
  quote: ''
  summary: The passage opens Chapter XIX, “The Secret of Life,” with teachings on
    life, destiny, bodily nourishment, renunciation, rebirth, body and vitality, heaven
    and earth, and nearness to TAO/God. Lieh Tzŭ asks Kuan Yin how the perfect man
    can pass through solid bodies, fire, and heights; Kuan Yin answers with teachings
    on purity, formlessness, eternal life, divine refuge, non-retaliation, and intelligence
    from God rather than cunning. The passage then begins an anecdote in which Confucius
    encounters a hunchback catching cicadas and asks about his method.
  language: English
  quote_policy: summarized
literal_observations:
