- id: obs:3
  text: The passage says bodily nourishment is necessary but not sufficient to preserve
    life, and that life comes and goes beyond human refusal or restraint.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Renouncing the world is said to remove worldly cares, produce a natural level,
