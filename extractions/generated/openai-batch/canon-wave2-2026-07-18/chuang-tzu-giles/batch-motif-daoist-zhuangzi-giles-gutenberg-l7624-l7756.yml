  quote: Life and death are as day and night
  summary: 'The passage presents several didactic episodes: a speaker treats death
    as no cause for loathing; Chuang Tzu questions a bleached skull and dreams that
    it describes death as happier than life; Confucius warns against imposing one
    being''s standards on another through the tale of a sea-bird killed by inappropriate
    human honors; Lieh Tzu addresses an old skull and describes transformations of
    beings returning to the great Scheme.'
