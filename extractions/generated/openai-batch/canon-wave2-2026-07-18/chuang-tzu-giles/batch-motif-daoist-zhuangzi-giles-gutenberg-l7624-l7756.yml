candidate_motifs:
- id: motif:1
  label: Life and death treated as equivalent or reversible states
  taxonomy_refs:
  - duality
  basis: The passage compares life and death to day and night, has the dream skull
    prefer death to mortal life, and has Lieh Tzu say there is no life and no death.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage frames this as philosophical speech rather than a narrative
    of literal travel between worlds.
- id: motif:2
  label: Speaking skull as teacher about death
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzu's skull speaks in a dream and teaches that death lacks mortal
    hierarchy and troubles; Lieh Tzu separately addresses an old skull as a companion
    in knowing there is no life and no death.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: Only the Chuang Tzu skull speaks; the Lieh Tzu skull remains silent in
    the supplied passage.
- id: motif:3
  label: Refusal of rebirth into mortal life
  taxonomy_refs:
  - death_rebirth
  basis: Chuang Tzu proposes that the skull's body be born again with renewed bones
    and flesh, but the skull refuses to exchange the happiness of death for mortal
    troubles.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The rebirth is hypothetical and not enacted.
- id: motif:4
  label: Harm caused by treating another being as oneself
  taxonomy_refs:
  - wisdom
  basis: The prince of Lu treats a sea-bird with human wine, music, and sacrifice;
    the bird does not eat or drink and dies, and Confucius explains that beings with
    different constitutions have different needs.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a didactic animal anecdote rather than a mythic animal transformation.
- id: motif:5
  label: Transformation cycle and return to source
  taxonomy_refs:
  - death_rebirth
  basis: Lieh Tzu lists a sequence of living forms transforming into other forms and
    concludes that man returns to the great Scheme from which all things come and
    to which all things return.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The transformations are presented as a cosmological or natural cycle,
    not as individual reincarnation in a biographical narrative.
- id: motif:6
  label: Different natures require different ways
  taxonomy_refs:
  - wisdom
  basis: Confucius states that water is life to fishes and death to man, and that
    sages did not favor uniformity but adapted means to ends.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The motif label is interpretive but closely follows the explicit lesson
    in the passage.
