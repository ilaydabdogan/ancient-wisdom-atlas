canonical_text:
  quote: TAO is the source of all creation. Men have it, and live. They lose it, and
    die.
  summary: The passage closes a statement on reverence for one who possesses TAO,
    then presents episodes about Lieh Tzŭ turning back from Ch'i, being warned by
    Poh Hun Wu Jen about attracting followers through outward brightness, and Huan
    of Chêng, whose Confucian studies, family religious-philosophical conflict, suicide,
    and dream appearance illustrate the contrast between natural virtue and artificial
    self-regard.
  language: English
  quote_policy: quoted
