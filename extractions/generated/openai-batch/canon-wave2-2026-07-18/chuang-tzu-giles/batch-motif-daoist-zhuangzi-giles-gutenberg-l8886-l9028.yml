canonical_text:
  quote: ''
  summary: 'The passage presents several didactic episodes: Lao Tzŭ teaches Confucius
    about wandering in the unborn, cosmic Negative and Positive principles, unity
    beyond life and death, and natural virtue; Chuang Tzŭ challenges Duke Ai of Lu
    about outward signs of scholarship and Tao; brief exempla describe Po Li Ch''i''s
    rise from cattle-feeding to administration and Shun''s indifference to life and
    death.'
  language: English
  quote_policy: summarized
