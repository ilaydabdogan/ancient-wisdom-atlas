candidate_motifs:
- id: motif:1
  label: wandering in the unborn as contemplative attainment
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Lao Tzŭ says he was wandering in the unborn and later says the result is
    perfect goodness and perfect happiness.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage presents an inward philosophical condition rather than a narrated
    journey with external stages.
- id: motif:2
  label: cosmic dual principles generating harmony
  taxonomy_refs:
  - duality
  basis: The passage names passive Negative and active Positive principles and says
    their interaction produces harmony by which all things are produced.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The principles are abstract and not personified as deities in this passage.
- id: motif:3
  label: unity beyond life and death
  taxonomy_refs:
  - annihilation_union
  - wisdom
  basis: The perfect man sees all creation as one and is not disturbed by life and
    death, beginning and end, or gain and loss.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is a philosophical teaching about unity and equanimity, not a narrative
    of literal annihilation or rebirth.
- id: motif:4
  label: spontaneous natural virtue
  taxonomy_refs:
  - wisdom
  basis: Lao Tzŭ compares the virtue of the perfect man to water's natural fluidity,
    heaven's height, earth's solidity, and the brightness of sun and moon.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The motif is ethical and cosmological rather than mythic narrative.
- id: motif:5
  label: outward insignia fail to prove wisdom
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzŭ says scholars with Tao need not wear robes and robe-wearing need
    not mean possession of Tao; the mandate reveals only one robe-wearer able to withstand
    questioning.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The episode is satirical and didactic; it should not be treated as evidence
    for a formal initiation rite without further support.
- id: motif:6
  label: hidden competence recognized despite low status
  taxonomy_refs:
  - wisdom
  basis: Po Li Ch'i's successful cattle-feeding leads Duke Mu to disregard his low
    condition and entrust him with administration.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is a brief exemplum and gives little narrative detail.
- id: motif:7
  label: indifference to status and death as moral power
  taxonomy_refs:
  - wisdom
  basis: The passage links rejection of rank, Po Li Ch'i's lack of attraction to rank
    and power, and Shun's unconcern for life and death with effective virtue or influence.
  evidence_refs:
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The examples are adjacent but not explicitly unified into a single named
    motif by the passage.
