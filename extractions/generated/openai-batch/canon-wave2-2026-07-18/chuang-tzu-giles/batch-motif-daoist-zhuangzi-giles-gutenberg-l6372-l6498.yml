canonical_text:
  quote: ''
  summary: The passage contrasts artificial imitation with suitability, then presents
    Confucius seeking TAO from Lao Tzŭ after unsuccessful studies of numbers and Yin-Yang.
    Lao Tzŭ says TAO cannot be given or received without inner and outer fitness,
    criticizes attachment to reputation, wealth, power, and formal charity/duty, and
    urges original simplicity through natural images. Confucius returns silent and
    describes Lao Tzŭ as a Dragon; Tzŭ Kung then seeks an interview and asks about
    ancient rulers.
  language: English
  quote_policy: summarized
