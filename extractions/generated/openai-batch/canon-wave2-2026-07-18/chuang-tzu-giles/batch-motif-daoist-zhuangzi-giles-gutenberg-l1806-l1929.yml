canonical_text:
  quote: ''
  summary: The passage presents aphorisms on Tao, speech, non-knowing, and Light;
    a dialogue in which Shun redirects Yao from military desire toward virtue; a dialogue
    between Yeh Ch'üeh and Wang I on uncertainty and species-relative standards; an
    account of the Perfect Man as untouched by cosmic extremes and beyond life and
    death; and a dialogue in which Chü Ch'iao and Chang Wu Tzŭ discuss Confucius,
    the true sage, unity beyond distinctions, and doubt about ordinary attitudes toward
    life and death. The passage ends with a fragment naming Li Chi as daughter of
    Ai Fêng.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening aphorisms state that manifest Tao is not Tao, argumentative speech
    falls short, fixed moral absolutes have limits, and the highest knowledge stops
    at what it does not know.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Knowing the argument without words and the Tao that does not declare itself
    is linked with being 'of GOD'; the state called Light is described through pouring
    in and out without fullness or emptiness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Emperor Yao says he has long desired to smite three named states; Shun calls
    them paltry out-of-the-way places and asks why Yao cannot shake off the desire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shun recalls a time when ten suns came out together and illuminated all things,
    then says virtue should excel suns.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note glosses Light as passive but irresistible influence of complete virtue
    rather than active force.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Yeh Ch'üeh asks whether all things are subjectively the same; Wang I repeatedly
    answers questions about knowing with uncertainty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wang I contrasts habitats suited to a man, an eel, and monkeys, and diets
    preferred by humans, deer, centipedes, owls, and crows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Wang I contrasts mating and beauty standards: humans admire Mao Ch''iang
    and Li Chi, while fishes, birds, and deer flee at the sight of them.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wang I says the standards of human virtue and of positive and negative are
    so obscured that they cannot actually be known as such.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Perfect Man is described as a spiritual being who would not feel heat
    if the ocean were scorched, cold if the Milky Way were frozen, or fear if mountains
    were split by thunder and the deep thrown up by storm.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Perfect Man would mount the clouds of heaven, drive the sun and moon before
    him, and pass beyond the external world where death and life no longer have victory
    over man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Chü Ch'iao reports Confucius as saying that the true sage ignores mundane
    affairs, neither seeks gain nor avoids injury, asks nothing from people, adheres
    to Tao, speaks without speaking, and roams beyond the dusty world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Chü Ch'iao says that Confucius called those words wild, but that he himself
