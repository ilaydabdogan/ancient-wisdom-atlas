canonical_text:
  quote: ''
  summary: 'The passage presents several anecdotes: counsel to seek action in Tao;
    Tai Chin Jen''s allegory of kingdoms fighting on a snail''s horns to reduce political
    conflict by the scale of boundless space; Confucius recognizing a hidden sage
    in menial guise at Mount I; a border-warden''s agricultural analogy and Chuang
    Tzŭ''s criticism of artificial self-regulation; and Poh Chü''s proposed wandering
    with Lao Tzŭ, including a lament over dead malefactors and the claim that honour,
    disgrace, and wealth generate evil and contention.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prince asks where he shall find what to do, and Hua Tzŭ answers that it
    is in TAO alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tai Chin Jen describes a snail with a kingdom on its left horn ruled by Aggression
    and another on its right horn ruled by Violence; the rulers constantly fight for
    territory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince accepts that space has no limit, and Tai Chin Jen says a bounded
    kingdom seems infinitesimally small when considered after boundless space.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tai Chin Jen places the prince within nested locations—kingdom, Wei State,
    Liang city—and asks how he differs from Violence; the prince says there is no
    difference.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Tai Chin Jen leaves, the prince is mentally disturbed, and Hui Tzŭ praises
    Tai Chin Jen above famed sages by using a sound analogy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Confucius stops at a restaurant on Mount I, sees a servant on a neighboring
    roof, and tells Tzŭ Lu that the servant is a sage under menial garb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Confucius says the hidden sage has no fame, perseveres inexhaustibly, speaks
    with his mouth but not with his heart, has turned from mankind, and has drowned
    himself on dry land.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Confucius prevents Tzŭ Lu from calling the hidden sage because the sage would
    scorn a toady; when Tzŭ Lu goes to see, the house is empty.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The border-warden says poor ploughing and weeding gave poor results, while
    deep ploughing and careful weeding yielded an excellent harvest.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Chuang Tzŭ says people of the day hide their Godhead, abandon natural dispositions
    and feelings, part with their souls, and follow the fashion of the hour.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chuang Tzŭ says that when natural dispositions lack thoroughness, an evil
    tribe takes their place, grows like reeds and rushes, destroys natural disposition,
    and breaks out like sores and ulcers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Poh Chü studies under Lao Tzŭ and proposes wandering over the world; Lao Tzŭ
    replies that the world is as it is seen here.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Poh Chü says he would go to Ch'i, view dead bodies of malefactors, push them
    to make them rise, cover them with his robes, cry to God, and lament that they
    were first to fall into trouble on earth.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Poh Chü says honour and disgrace were set up and evil followed, wealth was
    accumulated and contentions began, and these evils weary the body without rest.
  category: speech
  evidence_refs:
  - ev:13
