candidate_motifs:
- id: motif:1
  label: Guidance in Tao beyond partisan judgment
  taxonomy_refs:
  - wisdom
  basis: Hua Tzŭ rejects the dispute's opposed positions and directs the prince to
    find action in TAO alone.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The beginning of the excerpt enters mid-anecdote, so the prior argument
    is only partly visible.
- id: motif:2
  label: Political conflict reduced by cosmic scale
  taxonomy_refs:
  - wisdom
  basis: Tai Chin Jen's snail-horn kingdoms and boundless-space reasoning make the
    prince's political position appear infinitesimal and akin to Violence.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The available taxonomy has no exact 'microcosmic war' category; 'wisdom'
    is a broad family assignment.
- id: motif:3
  label: Hidden sage in humble guise who withdraws from recognition
  taxonomy_refs:
  - wisdom
  basis: Confucius identifies a servant as a sage under menial garb who effaces himself,
    avoids fame, and disappears when he might be approached.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports Confucius's identification; the servant does not speak
    directly.
- id: motif:4
  label: Artificial self-cultivation displacing natural disposition
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzŭ says modern self-regulation hides Godhead, abandons natural dispositions,
    and allows destructive growths to replace them.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The motif is conceptual and moral-philosophical rather than narrative
    action.
- id: motif:5
  label: Outward wandering quest refused by teacher
  taxonomy_refs:
  - mystical_quest
  basis: Poh Chü proposes wandering over the world, while Lao Tzŭ answers that the
    world is already as seen here.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: No journey is actually undertaken in the supplied passage.
- id: motif:6
  label: Compassionate lament for socially condemned dead
  taxonomy_refs: []
  basis: Poh Chü says he would visit the dead malefactors of Ch'i, rouse and cover
    them, cry to God, and lament them as first fallen into trouble.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The described acts are proposed speech, not narrated as completed ritual
    action.
- id: motif:7
  label: Social distinctions and accumulated wealth as sources of evil
  taxonomy_refs:
  - wisdom
  basis: Poh Chü links honour and disgrace with evil, wealth with contention, and
    both with exhaustion of the body.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: This is an explicit ethical explanation rather than a developed mythic
    episode.
