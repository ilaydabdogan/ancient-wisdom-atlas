  quote: ''
  summary: The passage presents sayings and anecdotes on knowing Tao without speech,
    the uselessness of dragon-killing skill, the sage’s avoidance of certainty and
    arms, the perfect man’s return before beginnings, Chuang Tzŭ’s rebuke of Ts'ao
    Shang’s status-seeking, Yen Ho’s warning about making Confucius a state pillar,
    distinctions between external and internal punishment, Confucius’s account of
    hidden motives and nine tests of character, and Chêng K'ao Fu’s humility under
    office.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chuang Tzŭ says that knowing Tao without speech belongs to the natural, while
    knowing Tao with speech belongs to the artificial.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chu P'ing Man spends a large patrimony learning from Chih Li I how to kill
    dragons; after three years he is perfect, but has no direction in which to display
    the skill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The true Sage regards certainties as uncertainties and is not up in arms,
    while men in general regard uncertainties as certainties and trust to arms.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mean man seeks to penetrate Tao, creation, and the ONE but is confounded
    by time, space, and objective existences.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The perfect man carries his mind back before the beginning, rests in oblivion,
