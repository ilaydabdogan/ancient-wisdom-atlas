candidate_motifs:
- id: motif:1
  label: Declining sovereignty to preserve life or Tao
  taxonomy_refs:
  - wisdom
  basis: Several episodes present offers of empire or rulership being refused because
    health, life, self-cultivation, or safety is valued above power.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:13
  confidence: high
  cautions: The supplied taxonomy has no exact 'refusal of rule' family; 'wisdom'
    is used broadly for the passage's stated evaluative teaching.
- id: motif:2
  label: Withdrawal or departure from power
  taxonomy_refs:
  - departure
  basis: Figures withdraw from political obligation or danger by hiding in mountains,
    going to the sea, fleeing office, or leaving territory with followers.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The departures are ethical-political withdrawals rather than a quest departure.
- id: motif:3
  label: Life and body valued above empire, territory, and gain
  taxonomy_refs:
  - wisdom
  basis: Narratorial comments and Tzŭ Hua Tzŭ's counsel explicitly rank life, body,
    and arms above empire, state, territory, or gain.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  - ev:15
  confidence: high
  cautions: This is a philosophical pattern rather than a narrative mythic motif in
    the strict sense.
- id: motif:4
  label: Humble adept hidden from elite recognition
  taxonomy_refs:
  - wisdom
  basis: Yen Ho is said to have attained Tao, but he lives in a hovel, wears coarse
    grass clothing, and tends oxen when elite messengers arrive with gifts.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: medium
  cautions: The passage fragment ends before Yen Ho's response to the messengers,
    so the full function of the scene is incomplete.
comparison_claims:
- id: claim:1
  claim: 'The passage internally links multiple anecdotes by the same function: demonstrating
    that preservation of life, body, or Tao is more important than empire, office,
    territory, or gain.'
  claim_level: same_function
  target: Repeated declining-power anecdotes within the supplied passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:11
  - ev:13
  - ev:15
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison across anecdotes in the same passage,
    not a claim about historical transmission or external parallels.
- id: claim:2
  claim: Several episodes can be cautiously grouped with a departure pattern because
    figures leave or flee places of power and obligation.
  claim_level: same_motif
  target: departure motif family
  evidence_refs:
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  counter_evidence_refs:
  - ev:13
  confidence: medium
  limitations: Some departures are voluntary withdrawals, while Shou's flight is reversed
    when he is compelled toward rulership; the passage does not frame them as a quest.
