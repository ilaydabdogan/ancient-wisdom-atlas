canonical_text:
  quote: ''
  summary: A sequence of anecdotes presents rulers offering the empire or rulership
    to others, who decline because of illness, contentment, bodily preservation, or
    danger. Other episodes show a ruler abandoning territory to avoid bloodshed, a
    reluctant heir being forced toward rule, an adviser arguing that the body is worth
    more than empire or territory, and Yen Ho, reputed to have attained Tao, living
    humbly as an oxherd.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yao offers to resign the empire to Hsü Yu, who declines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yao offers the empire to Tzŭ Chou Chih Fu, who says he is ill, trying to cure
    himself, and has no leisure for the empire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that the empire is of paramount importance but should
    not be allowed to injure one's chance of life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Shun offers the empire to Tzŭ Chou Chih Poh, who declines with the same explanation
    of illness and self-cure.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator says that not sacrificing one's life for the empire marks the
    man of Tao as different from the man of the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shan Chüan answers Shun by describing a self-sufficient seasonal life and
    says he does not want to trouble himself with the empire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After declining the empire, Shan Chüan hides among the mountains, and nobody
    knows where he is.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A labourer of Shih Hu tells Shun that the chief thing is to husband one's
    strength.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The labourer and his family carry away their household gods and children,
    go to the sea, and do not return.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: T'ai Wang Shan Fu is attacked by savages who refuse skins, silk, dogs, horses,
    pearls, and jade because they want the territory.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: T'ai Wang Shan Fu says territory should not become injurious to life, leaves
    with his staff, is followed by his people, and founds a new state at the foot
    of Mount Ch'i.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After three princes of Yüeh have been killed, Shou flees; he is found, smoked
    out with moxa, and brought to a royal carriage.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Shou protests to heaven about being made to rule, and the narrator explains
    that he objects to the dangers of princely office.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Tzŭ Hua Tzŭ asks prince Chao Hsi whether he would cut off a hand to become
    emperor, and the prince says he would not.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Tzŭ Hua Tzŭ argues that arms and body are worth more than empire, Han, or
    the disputed territory, and criticizes the prince for wearing out body and soul
    with anxiety.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The prince of Lu sends messengers with presents to communicate with Yen Ho
    after hearing that Yen Ho has attained Tao.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Yen Ho lives in a hovel, wears coarse grass clothing, and tends oxen.
  category: attribute
  evidence_refs:
  - ev:17
