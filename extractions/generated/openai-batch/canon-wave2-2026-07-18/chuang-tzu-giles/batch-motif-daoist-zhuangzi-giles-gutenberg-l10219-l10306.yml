canonical_text:
  quote: TAO is the sovereign lord of TÊ.
  summary: The passage gives philosophical instruction on ordering the mind into repose,
    non-perception, unconditionedness, and inaction. It defines relationships among
    TAO, TÊ, life, nature, action, and error; contrasts ordinary knowing with effortless
    seeing; discusses spontaneous virtue; and uses examples involving Yi, birds, rulers,
    ministers, a one-legged man, condemned criminals, and self-oblivious persons.
    It concludes with guidance for attaining peace, spirituality, right action, and
    accordance with necessity as the TAO of the Sage.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: If the unnamed twenty-four are not allowed to run riot, the mind is ordered;
    ordered mind leads to repose, clarity from perception, unconditionedness, and
    inaction by which everything can be accomplished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: TAO is called the sovereign lord of TÊ; TÊ is described as the virtue of spontaneity;
    life glorifies TÊ; nature is the substance of life; the operation of nature is
    action and its perversion is error.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: People who know are said to use physical power and mental effort, but not
    to know how to be like the eye, which sees without looking.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Spontaneous emotion is called virtue passive, while emotion not evoked by
    the external is called virtue active; their names are said to be antagonistic
    but essentially accordant.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yi is described as skilled at hitting the bull's-eye but unable to prevent
    people from praising him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sage devotes himself to the natural and neglects the artificial; only
    the Perfect Man can profitably devote himself to both natural and artificial.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Insects are said to influence insects because they are natural; the Perfect
    Man is said to hate the artificially natural when he hates the natural.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a bird falls in with Yi, Yi will get it; if the world were made into a
    cage, birds would have no place of escape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: T'ang is said to have got I Yin by cookery, and Duke Mu of Ch'in is said to
    have got Po Li Ch'i by five rams' skins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A one-legged man discards ornament because his exterior is not open to commendation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Condemned criminals go up to great heights without fear because they no longer
    regard life and death from their former point of view.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Those who pay no attention to their moral clothing and condition become oblivious
    of their own personality and proceed to be the people of God.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Persons who have passed into the eternal harmony of God do not rejoice when
    revered and are not angered when insulted.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: External anger is described as anger proceeding from not-anger, and external
    actions as actions proceeding from inaction.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage advises leveling down the emotional nature for peace, cultivating
    adaptation of the intelligence for spirituality, falling in with necessity for
    right action, and identifies necessity as the TAO of the Sage.
  category: speech
  evidence_refs:
  - ev:8
