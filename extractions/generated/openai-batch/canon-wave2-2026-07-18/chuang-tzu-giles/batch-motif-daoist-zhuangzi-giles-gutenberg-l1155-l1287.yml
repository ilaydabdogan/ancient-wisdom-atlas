canonical_text:
  quote: ''
  summary: The passage presents immense beings of the northern Celestial Lake, contrasts
    the giant Rukh with a quail's limited flight, and extends the contrast to human
    smallness and greatness. It describes Yung, Lieh Tzŭ, and the ideal sage who transcends
    self, action, reputation, and dependence. It then recounts Emperor Yao offering
    rule to Hsü Yu, who refuses reputation and kingship through analogies of sufficiency.
    Finally, Chien Wu reports Chieh Yü's account of a divine man on Miao-ku-shê mountain,
    and Lien Shu rebukes Chien Wu's disbelief.
  language: English
  quote_policy: summarized
