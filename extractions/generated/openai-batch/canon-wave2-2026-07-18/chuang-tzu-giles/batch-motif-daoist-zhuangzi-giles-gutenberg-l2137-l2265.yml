canonical_text:
  quote: ''
  summary: Yen Hui asks leave of Confucius to go to Wei and attempt to help a badly
    governed state. Confucius warns that premature use of Tao, virtue, wisdom, and
    moral preaching will bring danger, citing violent rulers and failed ancient campaigns.
    Yen Hui proposes disciplined and ceremonially adaptive plans for admonishing the
    Prince of Wei, but Confucius rejects them as ineffective and imprudent.
  language: English
  quote_policy: summarized
