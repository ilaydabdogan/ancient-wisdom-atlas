candidate_motifs:
- id: motif:1
  label: Sage's courage as acceptance of fate and opportunity
  taxonomy_refs:
  - wisdom
  basis: Confucius distinguishes the Sage's courage from physical courage by defining
    it as knowing failure as fate, success as opportunity, and remaining fearless
    in danger.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a philosophical teaching rather than a narrative ordeal.
- id: motif:2
  label: Confined creature unable to grasp the vast realm
  taxonomy_refs:
  - wisdom
  basis: The frog in the old well boasts of its narrow habitat, while the turtle describes
    the vast eastern sea; Mou uses the contrast to criticize limited understanding.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is embedded as a didactic parable within dialogue.
- id: motif:3
  label: Immeasurable sea unaffected by flood and drought
  taxonomy_refs:
  - wisdom
  basis: The eastern sea is described as not enlarged by repeated floods or narrowed
    by repeated droughts, illustrating imperviousness to external conditions.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage's note glosses this as imperviousness to external influences;
    no flood-renewal narrative is present.
- id: motif:4
  label: Boundless sage beyond directions returning to Tao from chaos
  taxonomy_refs:
  - chaos
  - wisdom
  basis: Mou says Chuang Tzŭ moves below and above, has no north, south, east, or
    west, is engulfed in the unfathomable, begins with chaos, and returns to Tao.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The description is metaphorical and doctrinal; it does not narrate a literal
    cosmological journey.
- id: motif:5
  label: Humility of limited instruments before vast reality
  taxonomy_refs:
  - wisdom
  basis: Mou compares argumentative examination of Chuang Tzŭ to looking at the sky
    through a tube or pointing at the earth with an awl.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an analogy cluster rather than an independent plot.
- id: motif:6
  label: Refusal of office in favor of living freedom
  taxonomy_refs:
  - wisdom
  basis: Chuang Tzŭ rejects a state appointment by saying he prefers to be like a
    living tortoise wagging its tail in mud rather than a dead sacred tortoise venerated
    in a temple.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage presents this through animal comparison rather than direct
    doctrinal explanation.
comparison_claims:
