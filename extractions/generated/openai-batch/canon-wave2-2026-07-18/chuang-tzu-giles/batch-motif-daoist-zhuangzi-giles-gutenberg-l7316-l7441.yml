  claim: 'Within the passage, the frog-in-the-well parable, mosquito-and-mountain
    image, ant-and-river image, and tube-and-awl images serve the same didactic function:
    they mark a mismatch between limited capacity and a vast object of knowledge.'
  claim_level: same_function
  target: internal pattern of limited perception or inadequate scale before Chuang
    Tzŭ's teaching
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal functional comparison only, not a claim of historical
    contact or broader cross-cultural recurrence.
