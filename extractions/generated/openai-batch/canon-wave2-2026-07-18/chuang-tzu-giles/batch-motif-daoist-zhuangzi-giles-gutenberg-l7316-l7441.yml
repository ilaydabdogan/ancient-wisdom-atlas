canonical_text:
  quote: ''
  summary: 'The passage contains several episodes: Confucius teaches Yu that success
    and failure depend on fate, opportunity, and circumstances, then soldiers apologize
    for mistaking him for Yang Hu. Kung Sun Lung asks Mou of Wei why he cannot match
    Chuang Tzŭ; Mou answers with the parable of a frog in an old well and a turtle
    of the eastern sea, then adds analogies for limited knowledge and describes Chuang
    Tzŭ as moving beyond directions and returning to Tao. Kung Sun Lung leaves speechless.
    Chuang Tzŭ, while fishing, refuses Ch''u officials'' offer of state administration
    by comparing himself to a tortoise that would rather live in mud than be dead
    and venerated in a temple. The passage ends as Hui Tzŭ, prime minister of Liang,
    is warned that Chuang Tzŭ may want his office.'
  language: English
  quote_policy: summarized
