canonical_text:
  quote: ''
  summary: A runaway slave takes refuge in a cave that belongs to a lion. The lion,
    suffering from a thorn in its paw, allows the slave to remove the thorn and dress
    the wound. The two live together for a time. After returning to town, the slave
    is captured and sentenced to be thrown to beasts in a public arena. The lion in
    the arena is the same lion, which recognizes him and shows affection rather than
    attacking. The audience asks that the slave be spared, and the governor grants
    liberty to both the slave and the lion.
  language: English
  quote_policy: summarized
