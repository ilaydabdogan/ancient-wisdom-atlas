  quote: Misfortune often assails us from an unexpected quarter.
  summary: A one-eyed stag grazes by the sea-shore and watches the land for hounds,
    leaving his blind side toward the sea. Sailors see him from the shore, shoot him
    with an arrow, and mortally wound him. As he dies, he reflects that he feared
    danger from land but was ruined from the sea. The stated moral says misfortune
    often comes from an unexpected direction.
