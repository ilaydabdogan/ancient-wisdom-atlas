  quote: The scene of past sufferings revives painful memories.
  summary: A Swallow advises a Nightingale to leave leafy coverts and live among humans
    under roofs; the Nightingale refuses because memories of past wrongs among humans
    make their dwellings hateful. A fatigued Traveller falls asleep at the brink of
    a deep well; Dame Fortune wakes him and warns him to move away, saying she would
    be blamed if he fell though the fault would be his folly.
