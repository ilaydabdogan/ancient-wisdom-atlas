  summary: A trumpeter captured in battle pleads that he has killed no one and carries
    only a trumpet; his captors say this is more reason to kill him because he incites
    others to fight. In a second fable, a wolf with a bone in his throat promises
    reward to a crane for removing it, but after the crane helps him he refuses payment
    and says her survival after putting her head in his mouth is reward enough.
