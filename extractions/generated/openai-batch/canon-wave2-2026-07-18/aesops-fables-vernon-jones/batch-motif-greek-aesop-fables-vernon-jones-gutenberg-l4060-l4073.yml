canonical_text:
  quote: ''
  summary: Ants are said to have once been men who farmed but stole their neighbours’
    crops and fruits. Jupiter, angered by their covetousness, changed them into ants;
    their form changed, but their nature did not, and they still gather and store
    the fruits of others’ labour. The moral states that punishment does not remove
    a thief’s bent.
