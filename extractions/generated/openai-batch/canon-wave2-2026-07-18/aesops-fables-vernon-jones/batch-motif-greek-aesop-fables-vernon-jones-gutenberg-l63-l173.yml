canonical_text:
  quote: ''
  summary: Chesterton's introduction describes Æsop as an uncertain historical or
    legendary figure associated with fables, argues that fables are an anonymous human
    tradition later attached to a named collector, compares this process with Arthurian
    and Grimm/Perrault traditions, presents Æsop as a Phrygian slave and philosophic
    storyteller, and contrasts impersonal animal fables with human-centered fairy
    tales.
  language: English
  quote_policy: summarized
