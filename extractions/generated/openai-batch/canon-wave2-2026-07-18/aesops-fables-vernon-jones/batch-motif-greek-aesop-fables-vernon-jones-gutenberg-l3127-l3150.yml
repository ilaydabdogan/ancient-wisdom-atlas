  quote: ''
  summary: In one fable, a Wolf accuses a Fox of theft, the Fox denies it, and an
    Ape judges that the Wolf likely did not lose what he claims while the Fox is still
    guilty. The moral states that dishonest people receive no credit even when they
    act honestly. In another fable, two Cocks fight for mastery; the loser hides,
    the victor crows from a stable roof, and an Eagle carries the victor away, allowing
    the hidden Cock to rule. The moral states that pride comes before a fall.
