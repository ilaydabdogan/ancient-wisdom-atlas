canonical_text:
  quote: ''
  summary: Two fables are presented. In the first, a stag fleeing hounds hides in
    a cave, but the cave contains a lion who kills him; the appended moral says this
    is like passing from one danger to a worse one. In the second, an ill man vows
    to sacrifice one hundred oxen to the gods if healed; after recovery he substitutes
    tallow oxen, and the gods punish the deceit through a dream that leads him to
    robbers, enslavement, and sale for one hundred crowns.
  language: English
  quote_policy: summarized
