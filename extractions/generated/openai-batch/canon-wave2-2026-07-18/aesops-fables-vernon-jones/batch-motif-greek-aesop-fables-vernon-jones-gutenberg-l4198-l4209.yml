  quote: '"my horn would cry aloud even if I held my tongue."'
  summary: A goatherd gathers his flock for return to the fold. One goat strays and
    ignores his calls and whistles. He throws a stone, breaks one of her horns, and
    asks her not to tell his master. The goat answers that the broken horn itself
    will reveal what happened. The stated moral says that what cannot be hidden should
    not be concealed.
