canonical_text:
  quote: ''
  summary: The Moon asks her Mother for a gown, but the Mother says no gown can fit
    because the Moon's shape changes from new to full and intermediate phases. A woodman
    loses his axe in a river; Mercury retrieves gold and silver axes before the true
    axe, and the woodman honestly rejects the false ones. Mercury rewards him with
    all three axes. An envious companion imitates the loss and falsely claims the
    golden axe, so Mercury refuses to give him either the gold axe or his own.
  language: English
  quote_policy: summarized
