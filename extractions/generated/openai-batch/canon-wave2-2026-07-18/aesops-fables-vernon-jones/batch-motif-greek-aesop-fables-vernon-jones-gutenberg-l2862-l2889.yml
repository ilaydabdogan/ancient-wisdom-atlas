canonical_text:
  quote: '"There, that shows what sort of judges you are!"'
  summary: A nobleman offers prizes for novel public performances. A popular Clown
    imitates a pig so convincingly that the audience thinks a pig is hidden on him,
    and applauds when none is found. A Countryman then hides a real young pig under
    his smock, makes it squeal, and is judged inferior to the Clown until he reveals
    the pig and mocks the spectators' judgment.
