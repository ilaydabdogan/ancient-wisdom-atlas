  summary: A man loads an Image onto an Ass to take it to a temple. People along the
    road uncover and bow out of reverence for the Image, but the Ass thinks the honor
    is for himself, becomes conceited, and refuses to move. The driver beats him and
    says that people do not worship an Ass. The stated moral warns against taking
    credit due to others.
