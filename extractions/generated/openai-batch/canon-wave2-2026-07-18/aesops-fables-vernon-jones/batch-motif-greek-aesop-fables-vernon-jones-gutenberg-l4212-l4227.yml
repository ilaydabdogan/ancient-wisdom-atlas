  summary: The Sheep complain to the shepherd that they provide wool, lambs, and milk
    but receive only grass, while the Dog provides no such products and receives table
    food. The Dog replies that he protects the Sheep from thieves and wolves and keeps
    them secure enough to graze. The Sheep accept his argument and stop objecting
    to the shepherd’s favor toward him.
