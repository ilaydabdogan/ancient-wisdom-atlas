  summary: A Crow envies a Raven because people respect the Raven as a bird of omen
    that foretells the future. Wanting the same reputation, the Crow caws loudly from
    a roadside tree as travellers approach. The travellers first fear a bad omen,
    but one identifies the bird as only a crow and says it means nothing. The moral
    states that those who pretend to be what they are not make themselves ridiculous.
