  summary: A debtor in Athens, unable to pay his creditor, takes his only sow to market
    for sale. When a buyer asks about the sow's litters, the debtor claims she produces
    females at the Mysteries and males at the Panathenaea, aligning the claim with
    Athenian festival sacrifices. The creditor adds an even more impossible claim
    that the sow has kids at the Dionysia.
