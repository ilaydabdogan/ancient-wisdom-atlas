  quote: Deeds, not words.
  summary: Two fables are presented. In the first, a fisherman catches a single sprat,
    hears its plea to be released until it grows larger, and refuses to give up what
    he has. In the second, a traveller boasts of an unmatched jump at Rhodes, and
    a listener challenges him to prove it immediately by jumping as if the present
    place were Rhodes.
