  summary: An aged sick lion lies in his den while the forest beasts visit him. The
    wolf accuses the absent fox of neglecting the lion. The fox arrives, claims he
    has been seeking a cure, and recommends that the lion flay a wolf and wrap himself
    in the warm skin. The lion kills the wolf, and the fox treats this as the result
    of stirring up ill-will.
