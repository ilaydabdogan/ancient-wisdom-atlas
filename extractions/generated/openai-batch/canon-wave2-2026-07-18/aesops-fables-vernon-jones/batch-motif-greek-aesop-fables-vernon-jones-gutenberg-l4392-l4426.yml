canonical_text:
  quote: The weak will sometimes find ways to avenge an insult, even upon the strong.
  summary: In one fable, a Wasp repeatedly stings and clings to a Snake's head until
    the Snake kills both of them by putting his head under a wagon wheel. In another,
    a Hare seeks protection from a Beetle while being chased by an Eagle; the Eagle
    ignores the Beetle and eats the Hare. The Beetle then destroys the Eagle's eggs,
    even when the Eagle lays them in Jupiter's lap, leading to an explanation for
    why eagles avoid laying eggs when beetles are present.
  language: English
  quote_policy: quoted
