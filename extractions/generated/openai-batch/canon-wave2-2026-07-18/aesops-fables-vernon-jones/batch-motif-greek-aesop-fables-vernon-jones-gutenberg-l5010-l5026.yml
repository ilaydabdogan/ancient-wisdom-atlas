  summary: A miser converts all his possessions into a single lump of gold, buries
    it secretly in a field, and visits it daily. One of his men observes him, discovers
    the hidden gold, and steals it at night. When the miser laments the loss, a neighbour
    tells him to put a brick in the hole and look at it daily, since the unused gold
    had been of no practical use to him.
