  summary: A pet Monkey is aboard a ship returning to Athens. A storm capsizes the
    ship near Attica, and the Monkey is thrown into the water. A Dolphin mistakes
    him for a man and carries him toward shore. Near the Piræus, the Dolphin questions
    him about being Athenian and knowing the port. The Monkey falsely claims status
    and acquaintance, exposes his ignorance, and is drowned after the Dolphin abandons
    him.
