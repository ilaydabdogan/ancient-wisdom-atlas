  quote: There is no virtue in giving to others what is useless to oneself.
  summary: A wolf who cannot eat oats claims to have left a field of oats untouched
    for a horse. The horse replies that if wolves could eat oats, the wolf would not
    have chosen the pleasure of hearing over feeding himself. The closing moral states
    that giving what is useless to oneself is not virtuous.
