canonical_text:
  quote: ''
  summary: 'The passage contains two fables. In the first, a Rose and an Amaranth
    speak in a garden: the Amaranth envies the Rose''s beauty and scent, while the
    Rose contrasts its own brief bloom with the Amaranth''s lasting flowers. In the
    second, a Man shelters a Horse, an Ox, and a Dog during a winter storm; in gratitude,
    the animals divide the life of Man and assign their own qualities to youth, middle
    age, and old age.'
