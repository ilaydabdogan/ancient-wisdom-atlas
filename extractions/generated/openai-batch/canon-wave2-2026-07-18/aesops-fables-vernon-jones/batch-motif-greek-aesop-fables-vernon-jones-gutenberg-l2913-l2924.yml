  summary: A lion and an ass hunt together. They find wild goats in a cave. The lion
    waits at the cave mouth while the ass enters and brays to drive the goats out.
    The lion kills the goats as they emerge. Afterward the ass boasts that he frightened
    them well, and the lion replies that, had he not known the ass, he too would have
    run.
