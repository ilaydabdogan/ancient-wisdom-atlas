  quote: False faith may escape human punishment, but cannot escape the divine.
  summary: An Eagle and a Fox become close neighbors. After the Eagle takes the Fox's
    cubs to feed her young, the Fox curses her. The Eagle later carries burning sacrificial
    flesh to her nest; wind sets the nest on fire, her fledglings fall, and the Fox
    devours them. The moral states that false faith cannot escape divine punishment.
