  quote: ''
  summary: A sick man consults several doctors. Most say he is not in immediate danger,
    but the last predicts death within twenty-four hours. The man recovers and meets
    that doctor, who jokingly treats him as if returned from the other world. The
    man replies with an imagined report that the dead drink water of oblivion and
    that authorities there planned to prosecute doctors, but spared this man because
    he was an impostor rather than a doctor.
