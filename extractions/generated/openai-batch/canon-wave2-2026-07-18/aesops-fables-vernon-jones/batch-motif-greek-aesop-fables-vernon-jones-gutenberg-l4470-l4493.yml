canonical_text:
  quote: ''
  summary: A ploughman uses an ox and an ass together for ploughing because he has
    only one ox; afterward the ass asks which animal will carry the master home, and
    the ox says the ass will, as usual. In a second fable, Demades addresses an inattentive
    Athenian assembly, wins attention by offering an Aesop fable, begins a tale of
    Demeter, a swallow, and an eel at a bridgeless river, then rebukes the audience
    for preferring fables to public business.
