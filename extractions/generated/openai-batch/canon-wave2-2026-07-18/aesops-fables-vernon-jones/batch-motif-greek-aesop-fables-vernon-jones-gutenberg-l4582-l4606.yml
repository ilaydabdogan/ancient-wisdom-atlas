  summary: In one fable, Wolves offer the Sheep peace if the Sheep surrender their
    sheep-dogs to death; the Sheep agree, but an old Ram warns that the Wolves remain
    dangerous even when dogs protect the flock. In another fable, a man buys a Swan
    to hear its reputed song, but it stays silent when asked to entertain guests and
    sings only later when it senses its approaching death, after which the owner angrily
    regrets not killing it earlier.
