  quote: ''
  summary: In one fable, Pigeons suffering attacks from a Kite invite a Hawk to defend
    them, but the Hawk kills more Pigeons than the Kite had. In another, a widow mourning
    at her husband’s grave is approached by a Farmer who claims parallel grief, proposes
    marriage, and wins her consent; while he has left his plough, a thief steals his
    oxen, causing him to lament sincerely.
