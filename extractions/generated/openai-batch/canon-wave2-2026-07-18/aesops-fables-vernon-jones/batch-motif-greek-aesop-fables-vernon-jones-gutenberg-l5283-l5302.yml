  quote: ''
  summary: In one fable, Jupiter orders Prometheus to create Man and animals, then
    to reduce the imbalance by turning some beasts into men, explaining why some people
    have human forms but beastly souls. In the next, a Swallow boasts to a Crow that
    she was once an Athenian princess whose husband cut out her tongue and whom Juno
    changed into a bird for protection; the Crow mocks how much she chatters despite
    the loss.
