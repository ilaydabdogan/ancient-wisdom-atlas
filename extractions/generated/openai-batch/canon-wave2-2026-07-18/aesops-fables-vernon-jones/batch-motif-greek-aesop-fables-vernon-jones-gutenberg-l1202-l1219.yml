  quote: Betray a friend, and you'll often find you have ruined yourself.
  summary: An Ass and a Fox travel together to forage. When they encounter a Lion,
    the Fox bargains for his own safety by offering to help the Lion capture the Ass.
    The Fox leads the Ass into a hidden hunter’s pit, but the Lion kills the Fox first
    and then eats the Ass.
