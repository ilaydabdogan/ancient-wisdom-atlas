  summary: The passage personifies Goods and Ills as forces once equally present in
    human affairs. Human foolishness allows the Ills to multiply and threaten the
    Goods. The Goods go to heaven and ask Jupiter for protection and guidance. Jupiter
    grants protection and decrees that Goods should visit humans singly, unnoticed,
    and rarely, explaining why Ills are common on earth while Goods are seldom seen.
