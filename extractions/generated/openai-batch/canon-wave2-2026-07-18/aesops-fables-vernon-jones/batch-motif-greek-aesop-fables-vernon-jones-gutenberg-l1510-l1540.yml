canonical_text:
  quote: ''
  summary: In one fable, a gnat rests on a bull's horn, asks whether the bull minds
    its departure, and is told that the bull neither noticed its arrival nor will
    notice its leaving. The attached moral says people may overestimate their consequence
    to others. In the next fable, two travellers meet a bear; one hides in a tree
    while the other feigns death. The bear leaves him, and the survivor says the bear
    advised him not to travel with a friend who deserts him at the first sign of danger.
    The attached moral says misfortune tests friendship.
