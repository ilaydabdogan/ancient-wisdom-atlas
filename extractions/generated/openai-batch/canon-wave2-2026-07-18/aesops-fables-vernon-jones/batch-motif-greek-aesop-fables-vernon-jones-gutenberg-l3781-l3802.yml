  quote: ''
  summary: Two fables are presented. In the first, a full-grown Bull struggling to
    enter a cow-house is offered advice by a young Calf, and replies that he knew
    the way before the Calf was born. In the second, Trees grant a Woodman an ash
    sapling for an axe handle; after making the handle, he fells the noblest trees,
    and the Trees lament that their small gift and sacrifice of the ash have caused
    their ruin.
