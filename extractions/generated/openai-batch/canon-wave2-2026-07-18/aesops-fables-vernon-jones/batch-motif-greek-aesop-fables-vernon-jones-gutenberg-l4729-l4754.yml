  quote: ''
  summary: Two fables are presented. In the first, hungry dogs try to drink down a
    deep river so they can reach hides steeping in it, but die from drinking before
    they succeed. In the second, a Lion kills an Ass after the Ass divides hunting
    booty into equal shares; the Fox then gives almost all the booty to the Lion and
    says he learned from the Ass, followed by a moral about learning from others'
    misfortunes.
