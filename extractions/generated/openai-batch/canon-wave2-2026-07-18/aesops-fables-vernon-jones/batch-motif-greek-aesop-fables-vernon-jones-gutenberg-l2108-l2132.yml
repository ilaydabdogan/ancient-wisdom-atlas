  summary: In one fable, oxen pulling a heavy wagon complain that the axletrees make
    noise while the oxen do the work; the moral states that those who suffer least
    complain most. In another, a boy traps his hand in a jar by grasping too many
    filberts and is advised by a bystander to take fewer so he can withdraw his hand;
    the moral warns against attempting too much at once.
