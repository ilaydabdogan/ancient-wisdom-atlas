canonical_text:
  quote: "“when I have yawned three times I become a ravening wolf”"
  summary: A thief stays at an inn seeking something to steal. During a festival he
    sees the innkeeper wearing a fine new coat. He sits with the innkeeper, speaks
    with him, then yawns and howls like a wolf. He claims that after three yawns he
    becomes a ravening wolf and asks the innkeeper to take charge of his clothes.
    The frightened innkeeper removes his coat and runs indoors, leaving the coat in
    the thief’s hands; the thief leaves with it.
