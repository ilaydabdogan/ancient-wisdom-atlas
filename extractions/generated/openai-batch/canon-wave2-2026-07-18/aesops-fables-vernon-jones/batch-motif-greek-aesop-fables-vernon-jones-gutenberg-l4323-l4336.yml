  quote: When you hit back make sure you have got the right man.
  summary: A thief steals honey from an apiary while the bee-keeper is absent. When
    the bee-keeper returns and finds the hives empty, the bees return, find the hives
    overturned, and sting him instead of the thief. The bee-keeper angrily rebukes
    them for attacking the one who cared for them rather than the thief.
