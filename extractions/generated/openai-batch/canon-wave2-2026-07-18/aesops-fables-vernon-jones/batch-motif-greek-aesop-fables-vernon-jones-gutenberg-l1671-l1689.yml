  summary: A pedlar loads his ass with salt. After the ass falls in a stream, some
    salt dissolves and the burden becomes lighter. The ass later lies down in the
    stream to repeat this result, but the master detects the trick and replaces the
    load with sponges, which absorb water and make the burden heavier. The moral warns
    that a successful tactic may be overused.
