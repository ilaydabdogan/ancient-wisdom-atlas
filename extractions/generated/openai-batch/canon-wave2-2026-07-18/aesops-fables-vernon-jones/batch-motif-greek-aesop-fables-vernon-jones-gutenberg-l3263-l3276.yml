  quote: If you choose bad companions no one will believe that you are anything but
    bad yourself.
  summary: A farmer sets traps in a newly sown field to catch cranes eating his seed.
    He finds cranes and a stork caught together. The stork pleads that he is not a
    crane and is harmless, but the farmer says the stork will suffer because he was
    found among the crop-ruining cranes. The stated moral warns that bad companions
    cause one to be judged bad as well.
