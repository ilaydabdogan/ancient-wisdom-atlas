canonical_text:
  quote: ''
  summary: Chesterton argues that fables use animals as simplified, fixed signs to
    teach moral truths. He contrasts animal figures with humanized equivalents, compares
    fable animals to heraldic, hieroglyphic, alphabetic, and prehistoric animal signs,
    lists several familiar animal-fable examples, and states that animal fables across
    named traditions tend toward the same moral conclusions about pride, accidental
    superiority, and excessive cleverness.
  language: English
  quote_policy: summarized
