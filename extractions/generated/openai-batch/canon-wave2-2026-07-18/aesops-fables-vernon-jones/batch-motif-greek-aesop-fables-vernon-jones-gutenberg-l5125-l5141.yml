canonical_text:
  quote: ''
  summary: A man whose spade is missing suspects his labourers and proposes that they
    swear an oath in a town temple, because he thinks the town gods are better at
    detecting theft than country deities. At the town gates he hears a crier seeking
    information about a thief who stole from the city temple, and decides to go home
    because gods unable to detect theft from their own temple are unlikely to identify
    his spade's thief.
