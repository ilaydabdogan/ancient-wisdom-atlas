  summary: In one fable, a Peacock mocks a Crane for dull plumage, and the Crane answers
    that she can fly into the clouds while the Peacock remains on the earth. In another,
    a Cat disguises himself as a doctor and asks after sick Birds in an aviary, but
    the Birds refuse him entry and say they will be well when he is gone. The passage
    ends with a moral about disguise failing to deceive the wise.
