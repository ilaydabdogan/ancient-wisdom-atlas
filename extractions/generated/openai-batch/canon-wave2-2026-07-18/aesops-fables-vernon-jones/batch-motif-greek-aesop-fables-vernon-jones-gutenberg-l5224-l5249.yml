  quote: ''
  summary: In one fable, a Dog chases a Wolf and boasts inwardly about his strength,
    but the Wolf says he is afraid of the Dog's master rather than the Dog. In another,
    Jupiter allocates privileges to the gods; Grief arrives late, receives the tears
    shed for the dead as his portion, and the moral warns against prolonged mourning
    because Grief will send fresh causes for tears.
