  summary: In one fable, a wild boar sharpens his tusks on a tree before any visible
    danger, explaining to a fox that he must be ready before danger arrives. In the
    next, Mercury disguises himself as a man to learn how people value him, asks a
    sculptor the prices of statues of Jupiter, Juno, and himself, and hears that his
    own statue would be included for free if the others are bought.
