canonical_text:
  quote: Self-help is the best help.
  summary: A Lark raises her young in a cornfield. When the Farmer first says he will
    ask neighbours to help reap, the mother Lark tells her young there is no hurry.
    When the Farmer later says he will hire men that day and set them to work, she
    tells her young they must leave because he is now taking matters in hand himself.
    The passage ends with a moral praising self-help.
