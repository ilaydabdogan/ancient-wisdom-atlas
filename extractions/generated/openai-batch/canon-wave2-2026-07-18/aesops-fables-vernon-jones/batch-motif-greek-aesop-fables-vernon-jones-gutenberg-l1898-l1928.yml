  summary: In one fable, a well-oiled lamp boasts that it shines more brightly than
    the sun, is blown out by wind, and is relit by someone who tells it not to compare
    itself with celestial lights. In another, a wise owl repeatedly warns the birds
    about future dangers from oak, flax, and an archer; the birds mock her, but later
    respect her after her warnings prove true, while she no longer gives advice.
