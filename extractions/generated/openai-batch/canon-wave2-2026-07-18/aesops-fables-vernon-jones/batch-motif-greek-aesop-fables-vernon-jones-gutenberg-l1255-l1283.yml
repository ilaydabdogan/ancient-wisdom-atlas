canonical_text:
  quote: ''
  summary: Two fables are presented. In the first, boys throw stones at frogs in a
    pond until one frog asks them to stop, saying that the boys' sport is death to
    the frogs. In the second, the North Wind and the Sun compete to make a traveller
    remove his cloak; the Wind's force makes the traveller hold the cloak tighter,
    while the Sun's warmth leads him to remove it. The stated moral is that persuasion
    is better than force.
