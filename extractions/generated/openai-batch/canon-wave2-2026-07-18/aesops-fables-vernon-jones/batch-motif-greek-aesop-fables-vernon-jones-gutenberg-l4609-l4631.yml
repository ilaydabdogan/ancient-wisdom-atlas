  quote: ''
  summary: The passage presents two fables. In the first, a snake complains to Jupiter
    about being trodden on, and Jupiter says that biting the first trampler would
    have made others more careful. In the second, a wolf is impressed by his enlarged
    shadow at sunset, imagines himself superior to a lion, and is then attacked and
    devoured by a lion; the wolf recognizes that fancies rather than facts caused
    his ruin.
