  summary: An Ass and a Cock are together in a cattle-pen. A starving Lion comes to
    attack the Ass, but the Cock crows loudly and the Lion flees. The Ass misreads
    the event as proof that the Lion will fear him too, pursues the Lion, and is eaten
    once away from the Cock. The stated moral is that false confidence often leads
    to disaster.
