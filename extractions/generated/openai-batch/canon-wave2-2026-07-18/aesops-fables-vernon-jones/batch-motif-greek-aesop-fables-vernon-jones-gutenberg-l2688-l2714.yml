canonical_text:
  quote: ''
  summary: Two fables are presented. In the first, a viper enters a carpenter's shop,
    asks tools for food, and is rebuffed by a file that says it only takes and never
    gives; the moral states that the covetous are poor givers. In the second, a cat
    seizes a cock, seeks a pretext for eating him, rejects his defense that his crowing
    wakes people for work, and kills and eats him; the moral states that lack of a
    good excuse does not stop a villain from crime.
