  summary: Two travellers, one habitually false and one habitually truthful, come
    to the land of Apes. The King of the Apes stages a royal audience and asks their
    opinion of him and his subjects. The lying traveller flatters him and is rewarded;
    the truthful traveller identifies the king and subjects as fine apes and is ordered
    to be clawed to death.
