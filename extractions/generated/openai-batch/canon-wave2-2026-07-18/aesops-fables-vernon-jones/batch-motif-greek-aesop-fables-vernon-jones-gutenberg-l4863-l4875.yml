  quote: ''
  summary: 'A Fox serves a Lion in hunting: the Fox locates prey, the Lion kills it,
    and the Lion takes the larger share. Dissatisfied, the Fox tries to hunt or steal
    independently by taking a lamb, but the shepherd sets dogs on him and the dogs
    kill him. The moral favors safe servitude over dangerous freedom.'
