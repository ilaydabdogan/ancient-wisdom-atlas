canonical_text:
  quote: Be shy of favours bestowed at the expense of others.
  summary: A rich man prepares a banquet. His dog invites another dog to share in
    the feast. The invited dog enters the kitchen expecting to eat well, but the cook
    throws him out of the window. Injured and embarrassed, the dog later claims to
    other dogs that he had drunk so much wine he cannot remember leaving the house.
    The fable ends with a caution about favours bestowed at another’s expense.
