  quote: ''
  summary: An unskilful cobbler abandons his trade and presents himself as a doctor
    with a universal antidote. When he falls ill, the king tests him by pretending
    to mix poison into the antidote, though he adds only water. Afraid, the cobbler
    admits he knows nothing of medicine and that the antidote is worthless. The king
    rebukes the subjects for trusting with their lives a man they would not trust
    with their boots.
