  quote: You may change your habits, but not your nature.
  summary: A crow envies a swan’s white plumage and believes the swan’s bathing water
    causes it. The crow leaves its former feeding place near sacrificial altars, lives
    among pools and streams, washes repeatedly, fails to become whiter, and dies of
    hunger. The fable closes with a moral contrasting changed habits with unchanged
    nature.
