canonical_text:
  quote: "“a creature who twice walked into a Lion's den can't have got any.”"
  summary: A sick Lion in his den asks the Fox to lure a Stag so the Lion can eat
    the Stag's heart and brains. The Fox twice deceives the Stag with claims about
    royal succession and safety; the first attack fails, but the second succeeds.
    The Fox steals the brains, then tells the Lion that a creature who twice entered
    a Lion's den could not have had any brains.
