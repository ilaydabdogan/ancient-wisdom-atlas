  quote: ''
  summary: An ass, badly treated by a gardener, asks Jupiter to give him another master.
    Jupiter sends Mercury to arrange the sale first to a potter and then, after another
    complaint, to a tanner. The ass realizes that the final master may bring him to
    the tanning-vat and reflects that his earlier masters were preferable. The stated
    moral says servants do not recognize a good master until they have served a worse
    one.
