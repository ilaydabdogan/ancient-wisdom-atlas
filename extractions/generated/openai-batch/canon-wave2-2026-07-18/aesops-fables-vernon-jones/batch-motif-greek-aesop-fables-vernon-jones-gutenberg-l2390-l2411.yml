canonical_text:
  quote: ''
  summary: In one fable, a dog carrying meat over a stream mistakes its reflection
    for another dog with a larger piece of meat, attacks it, and loses its own meat
    to the current. In another, Jupiter orders Mercury to add an infusion of lies
    to the ingredients of tradesmen; Mercury gives equal amounts to most but pours
    the remainder into the horse-dealer, explaining why tradesmen lie and horse-dealers
    lie most.
  language: English
