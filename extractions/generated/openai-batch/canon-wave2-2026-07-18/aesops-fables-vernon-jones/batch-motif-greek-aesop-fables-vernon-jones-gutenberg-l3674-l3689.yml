canonical_text:
  quote: I have only got what I deserved
  summary: A man loads an Ass and a Mule for a journey. On a rough, steep road the
    Ass asks the Mule to take part of his load, but the Mule refuses. The exhausted
    Ass falls and is killed. The driver puts the Ass’s load and flayed skin onto the
    Mule, who painfully carries them and admits that his refusal to help caused his
    present burden.
