canonical_text:
  quote: Do not count your chickens before they are hatched.
  summary: A farmer's daughter returns from milking with a pail of milk on her head.
    She imagines turning the milk into a chain of profits, ending with a new gown
    and the admiration of young men at a fair. While imagining herself tossing her
    head, she actually tosses it, spills the milk, and loses the basis for all her
    plans. The passage closes with the moral not to count chickens before they hatch.
  language: English
  quote_policy: quoted
