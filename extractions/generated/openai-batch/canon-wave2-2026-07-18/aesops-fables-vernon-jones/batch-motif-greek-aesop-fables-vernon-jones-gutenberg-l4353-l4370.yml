canonical_text:
  quote: ''
  summary: A Bat, a Bramble, and a Seagull form a partnership for a trading voyage,
    each investing or carrying different goods. A storm sinks their boat and cargo,
    though all three reach land. Afterward the Seagull searches the sea for lost lead,
    the Bat hides by day to avoid creditors, and the Bramble catches at passing clothes
    in hope of recovering lost garments. The moral states that people are more concerned
    to recover losses than to gain what they lack.
