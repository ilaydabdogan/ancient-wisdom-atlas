canonical_text:
  quote: ''
  summary: An Athenian and a Theban travel together and debate the merits of their
    cities' heroes. The Theban praises Hercules as the greatest hero and now among
    the gods; the Athenian argues that Theseus is superior because Hercules had once
    served another. The Athenian wins the argument through glib speech, and the Theban
    concedes while wishing that, if the heroes become angry, Athens may suffer Hercules'
    anger and Thebes only Theseus'.
