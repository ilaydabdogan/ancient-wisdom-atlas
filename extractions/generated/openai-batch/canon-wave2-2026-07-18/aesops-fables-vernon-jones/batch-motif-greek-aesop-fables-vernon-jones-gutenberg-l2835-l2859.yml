canonical_text:
  quote: ''
  summary: Two fables are presented. In the first, an earthenware pot and a brass
    pot are swept down a flooded river; the brass pot offers protection, but the earthenware
    pot refuses closeness because a touch would break it. The stated moral is that
    equals make the best friends. In the second, an old hound who formerly served
    his master well can no longer hold a wild boar because of age; when scolded, he
    asks to be honored for past service rather than abused for present weakness.
