canonical_text:
  quote: ''
  summary: In one fable, an injured and hungry Wolf asks a passing Sheep to bring
    water, but the Sheep refuses because the water would enable the Wolf to obtain
    meat. In the next, a Tunny-fish fleeing a Dolphin is driven onto a sandbank; the
    Dolphin follows, and both are left out of the water. The Tunny accepts death more
    readily because the enemy causing it will share the same fate.
