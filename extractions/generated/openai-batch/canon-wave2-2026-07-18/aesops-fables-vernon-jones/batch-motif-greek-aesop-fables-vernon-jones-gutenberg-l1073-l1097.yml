  quote: ''
  summary: Two Aesopic fables are presented. In the first, a groom gives a horse much
    grooming while stealing part of its feed, and the horse tells him that feeding
    matters more than combing. In the second, a wolf invents accusations against a
    lamb as pretexts for killing it; the lamb refutes each accusation, but the wolf
    devours it anyway.
