  quote: ''
  summary: A Kid strays from the flock and is chased by a Wolf. Knowing he will be
    caught, the Kid asks the Wolf to play music so he may dance before dying. The
    Wolf plays a pipe while the Kid dances. Gods guarding the flock hear the sound,
    come to investigate, see the Wolf, and drive him away. The Wolf says he deserved
    this because he left his own trade as butcher to become a piper.
