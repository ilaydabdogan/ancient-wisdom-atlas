  summary: Two fables are presented. In the first, a Bear boasts of refinement and
    restraint, and a Fox rebukes him by wishing he would eat dead bodies rather than
    living creatures; the stated moral concerns hypocrisy. In the second, an old Peasant
    urges his Ass to flee from approaching armed men, but the Ass is indifferent after
    learning that capture will not mean heavier loads.
