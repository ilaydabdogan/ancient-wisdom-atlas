  summary: A stag hides from huntsmen beneath a thick vine. After the huntsmen pass,
    the stag eats the vine’s leaves, causing movement that reveals him. A huntsman
    shoots into the foliage, and the stag dies, acknowledging that he has been punished
    for feeding on the plant that protected him. The closing moral states that ingratitude
    can bring its own punishment.
