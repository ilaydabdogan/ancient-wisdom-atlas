canonical_text:
  quote: in trying to please all he had pleased none
  summary: A miller and his son repeatedly change how they transport their ass after
    criticism from different groups on the road. They finally carry the ass on a pole,
    are mocked by townspeople, and the frightened animal falls from a bridge into
    the river and drowns. The miller returns home ashamed, having failed to please
    everyone and having lost the ass.
  language: English
  quote_policy: quoted
