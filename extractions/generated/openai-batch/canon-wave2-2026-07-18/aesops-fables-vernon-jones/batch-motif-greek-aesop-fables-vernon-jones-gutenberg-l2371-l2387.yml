canonical_text:
  quote: What is worth most is often valued least.
  summary: A thirsty stag drinks at a pool, admires the appearance of his antlers
    in his reflection, and despises his legs. When a lion attacks, the stag's legs
    let him outrun the lion over open ground, but his antlers become caught in branches
    in a wood, and the lion kills him. The stag recognizes too late that the despised
    legs could have saved him while the admired horns caused his ruin.
