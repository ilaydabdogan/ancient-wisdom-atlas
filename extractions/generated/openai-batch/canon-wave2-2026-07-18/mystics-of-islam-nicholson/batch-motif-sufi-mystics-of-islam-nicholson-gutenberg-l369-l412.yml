canonical_text:
  quote: ''
  summary: Nicholson describes early Sufi ascetic and quietistic tendencies as harmonizing
    with and drawing nourishment from Christian theory. He notes Christian anchorites
    as teachers of wandering Moslem ascetics, traces several ascetic practices to
    Christian sources, and presents exempla in which Jesus and Christian hermits teach
    that love of God surpasses fear of punishment or desire for reward. The passage
    ends by characterizing Christian influence as both ascetic and mystical, with
    Oriental Christian mysticism also shaped by Plotinus and Neoplatonism.
  language: English
  quote_policy: summarized
