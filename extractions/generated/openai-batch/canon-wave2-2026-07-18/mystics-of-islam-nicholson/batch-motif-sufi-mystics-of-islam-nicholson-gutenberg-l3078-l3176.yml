canonical_text:
  quote: ''
  summary: 'The passage describes Sufi saintship and the institutional development
    of Sufi orders, discusses whether saints may know their own saintship and salvation,
    presents Bayazid al-Bistami rejecting a reputed saint who violates mosque decorum,
    and contrasts legalist Sufi views with popular beliefs that saints may stand beyond
    ordinary judgment. It then gives the Koranic story of Moses and Khadir: Moses
    asks to accompany the immortal sage to learn from him, Khadir requires silence,
    damages a boat, kills a youth, and later explains hidden reasons for those acts.'
  language: English
  quote_policy: summarized
