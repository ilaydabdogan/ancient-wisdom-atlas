canonical_text:
  quote: ''
  summary: The passage explains Hallāj's utterance “Ana ’l-Haqq” as divine speech
    through a selfless person and relates it to Moses and the burning bush. It quotes
    Rūmī's ode in which the One Light or Loved One appears in many forms, including
    Noah, Abraham, Jesus, an Arab figure, ʿAlī's sword, and Hallāj on the scaffold.
    Nicholson then discusses Sufi theories of deification as unification, Ibn al-ʿArabī's
    distinction between partial human reality and the Reality, and Niffarī's account
    of waqfat as luminous cessation from seeking, transcendence of time and place,
    and finding only God.
  language: English
  quote_policy: summarized
