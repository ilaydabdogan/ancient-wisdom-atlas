canonical_text:
  quote: ''
  summary: The passage explains Sufi poverty as emptiness of desire and self, distinguishes
    the faqīr or dervish from the advanced Sufi, gives maxims for dervishes, defines
    the nafs as the lower appetitive soul and obstacle to union with God, recounts
    animal manifestations of the nafs, and describes mortification and self-surrender
    as ethical transmutation leading to ridā and tawakkul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: True poverty is described as both lack of wealth and lack of desire for wealth,
    an empty heart as well as an empty hand.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The names faqīr and dervīsh are presented as names by which the Mohammedan
    mystic is proud to be known because they imply being stripped of thoughts or wishes
    that divert the mind from God.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A truly poor faqīr is described as wanting nothing besides the Lord of the
    present and future life and as denuded of individual existence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: God is said sometimes to endow saints with an outward show of wealth and worldliness
    in order to hide them from the profane.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Jāmī is cited as saying that faqīrs renounce all worldly things for the sake
    of pleasing God, with motives including judgment, Paradise, and inward peace.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that faqīrs rank below the Sufi when they seek benefit
    for themselves, and that absence of self distinguishes the Sufi from the faqīr.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Maxims for dervishes regulate begging, gratitude for poverty, conduct toward
    the rich, acceptance of offered daily bread, and avoidance of anxious thought
    for tomorrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The nafs is described as the lower or appetitive soul, an evil self seated
    in passion and lust.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The nafs, together with the world and the devil, is described as a great obstacle
    to the attainment of union with God.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Prophet is quoted as saying that one's worst enemy is the nafs between
    one's two sides.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mohammed ibn ʿUlyān relates that something like a young fox came forth from
    his throat, and that God caused him to know it was his nafs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When Mohammed ibn ʿUlyān trod on the fox-like nafs, it grew bigger at every
    kick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The fox-like nafs says it was created perverse, so that pain to other things
    is pleasure to it and their pleasure is its pain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The nafs of Hallāj was seen running behind him in the shape of a dog, and
    other cases record it appearing as a snake or a mouse.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Mortification of the nafs is called the chief work of devotion and is required
    for a disciple to learn the rudiments of Sufism.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Mortification includes weaning the nafs from accustomed things, encouraging
    resistance to passions, breaking pride, and bringing it through suffering and
    tribulation to recognize its vileness and impurity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Outward methods of mortification mentioned include fasting, silence, and solitude.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Advanced Sufis interpret self-mortification as a moral transmutation in which
    the lower self is not essentially destroyed but is purged of evil attributes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:19
  text: The passage explains dying to self as living in God, with evil attributes
