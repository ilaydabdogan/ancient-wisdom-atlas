- id: obs:1
  text: A master seats the speaker before him, bandages the speaker's eyes, and orders
    concentration of all mental faculties on the heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker reports that the heart opened, that something like an overturned
    cup within him was set upright, and that unbounded happiness filled his being.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker sees an internal reproduction of the cell and a doubled scene
    of another Tawakkul Beg seated before another Mollā-Shāh.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: After alternately uncovering and rebinding his eyes, the speaker reports seeing
    the master both with physical sight and with spiritual sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mawlānā Saʿduddīn of Kāshghar enters a trance after concentration of thought,
    appears to be falling asleep, and says the state is different from sleep.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nizāmuddīn says that by concentration he brought the spirituality of Mohammed
