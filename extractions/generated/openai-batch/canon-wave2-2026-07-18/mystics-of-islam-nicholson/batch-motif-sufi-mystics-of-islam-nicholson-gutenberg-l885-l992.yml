canonical_text:
  quote: ''
  summary: The passage describes the beginning of the Sufi Path through guidance by
    a spiritual director, a three-year discipline of service and inward watchfulness,
    the training of Shiblī under Junayd, and practices of poverty, mortification,
    trust, recollection, and renunciation. It includes examples of ascetic poverty
    and a dream-story in which possession of fewer garments is linked to precedence
    in Paradise.
  language: English
  quote_policy: summarized
