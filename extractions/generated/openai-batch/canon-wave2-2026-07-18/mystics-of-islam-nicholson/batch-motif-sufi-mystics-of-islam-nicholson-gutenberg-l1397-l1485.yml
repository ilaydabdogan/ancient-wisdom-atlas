literal_observations:
- id: obs:1
  text: Sarī al-Saqatī asks God not to punish him with the humiliation of being veiled
    from God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Hell and Paradise by saying veiling from God is the
    hardest pain, while unveiledness is the most perfect pleasure.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who love God are described as having vision of God that enables them
    to endure tribulation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The passage distinguishes two kinds of contemplation: one from perfect faith
    and one from rapturous love.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In rapturous love, a person’s whole being is described as absorbed in the
    thought of the Beloved, so that nothing else is seen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Muhammad ibn Wāsiʿ is cited for seeing God in everything, while Shiblī is
    cited for seeing nothing except God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: One contemplative method is described as seeing the act with the bodily eye
    and the Agent with the spiritual eye; another is described as seeing only the
    Agent through love.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The lover is instructed to turn the eye away from created things in order
    to see the Creator with the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Sahl ibn ʿAbdallah of Tustar says that shutting one’s eye to God for a single
    moment prevents right guidance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Bāyazīd counts only the years in which he has seen God as belonging to his
    life, and excludes the years of being veiled by the world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: In the quoted Mawāqif passage, God tells the speaker that a science of nearness
    is to see in everything the effects of beholding God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: 'The commentator lists degrees of perception: seeing God before a thing, after
    it, with it, or seeing nothing but God.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'A certain Sufi’s three pilgrimages are described as stages: first seeing
    the Kaʿba without its Lord, then seeing both, and finally seeing the Lord of the
    Kaʿba but not the Kaʿba.'
  category: sequence
  evidence_refs:
  - ev:5
