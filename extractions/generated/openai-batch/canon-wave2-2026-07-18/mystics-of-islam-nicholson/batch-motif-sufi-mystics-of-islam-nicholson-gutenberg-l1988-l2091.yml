canonical_text:
  quote: ''
  summary: Nicholson explains Sufi gnosis as contemplation of divine attributes, centered
    on unity and culminating in the passing-away of duality. The passage contrasts
    ordinary Muslim and Sufi meanings of divine oneness, presents creation as God's
    self-manifestation through images of treasure, mirror, beauty, love, garden, plants,
    and fire, quotes Jāmī on the relation of the Real to the universe, and discusses
    Man, Mohammed, and the Logos as Sufi doctrines compared with Christian formulations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gnostic contemplates God's attributes rather than God's essence, and a
    remaining trace of duality disappears only in fanā al-fanā, described as total
    passing-away in the undifferentiated Godhead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Divine unity is described as the first and last principle of gnosis.
  category: attribute
  evidence_refs:
