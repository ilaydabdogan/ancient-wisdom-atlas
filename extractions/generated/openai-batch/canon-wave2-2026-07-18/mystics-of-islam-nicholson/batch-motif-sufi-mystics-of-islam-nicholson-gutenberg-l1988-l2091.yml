  text: The passage contrasts ordinary Muslim and Sufi declarations that God is One,
    saying the Sufi means that God is the One Real Being underlying all phenomena.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The universe, including man, is described as essentially one with God, either
    as emanation like sunbeams from the sun or as a mirror reflecting divine attributes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A quoted Tradition has God say that He was a hidden treasure, desired to be
    known, and therefore created creation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jāmī's poem describes the Beloved unveiling beauty in the unseen, holding
    a mirror to His own face, and being both spectator and spectacle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jāmī's poem describes creation as lying in the sleep of non-existence before
