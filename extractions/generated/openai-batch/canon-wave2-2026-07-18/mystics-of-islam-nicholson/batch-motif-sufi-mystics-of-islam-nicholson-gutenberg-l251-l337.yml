  confidence: high
  cautions: The statements are aphoristic and theological, not a full mythic episode.
- id: motif:5
  label: Overwhelming vision that confounds death and life
  taxonomy_refs: []
  basis: One saying says visible gnosis would cause death by its splendour; another
