canonical_text:
  quote: These ideas--Light, Knowledge, and Love--form, as it were, the keynotes
  summary: Nicholson describes early Sufism as emerging from Islamic asceticism, affected
    by Christian ideals, Islamic theological debates, and Greek philosophy. He presents
    Sufi sayings on divine love, inner light, gnosis, spiritual vision, nature as
    evidence of divine unity, God as Beloved, and an immanent One Real Being dwelling
    everywhere and especially in the human heart.
  language: English
  quote_policy: quoted
