candidate_motifs:
- id: motif:1
  label: Asceticism as first stage of a mystical journey
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: The passage explicitly says Sufis began to regard asceticism as only the
    first stage of a long journey and as preliminary training for a larger spiritual
    life.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage uses journey language metaphorically in a scholarly explanation,
    not as a narrative itinerary.
- id: motif:2
  label: Divine love and God as Beloved
  taxonomy_refs:
  - divine_beloved
  basis: Quoted sayings present love as God's gift and address God privately as 'O
    my Beloved.'
