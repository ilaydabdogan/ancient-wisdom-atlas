canonical_text:
  quote: ''
  summary: 'The passage discusses Sufi ecstatic trance, especially ecstasy associated
    with samāʿ, or audition: music, singing, dancing, Qurʾanic recitation, heavenly
    voices, and ordinary sounds heard as divine praise. It gives anecdotes of Abū
    Hamza, Sahl ibn ʿAbdallah, and Zangī Bashgirdī, summarizes theories attributed
    to Hujwīrī, Dhu ’l-Nūn, Pythagoras, Plato, and Rūmī, and describes debate over
    whether samāʿ is spiritually beneficial or morally dangerous.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ecstatic trance is described as theoretically involuntary, though certain
    conditions are said to favor it, especially vision of God’s majesty and revelation
    of divine omnipotence to the heart.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abū Hamza, while walking in Baghdād and meditating on God’s nearness, fell
    into ecstasy, proceeded without seeing or hearing, and recovered his senses in
    the desert.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sahl ibn ʿAbdallah is reported to have remained in ecstasy for twenty-five
    days at a time without food, while still answering theologians’ questions and
    sweating even in winter.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Sufis came to induce ecstasy by concentration, recollection
    or dhikr, music, singing, and dancing, all included under samāʿ or audition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sufi writers are said to recount persons being thrown into ecstasy by hearing
    Qurʾanic verses, a heavenly voice, poetry, or music; some are said to have died
    from the emotion aroused.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A mystical belief described in the passage says every created thing praises
    God in its own language, so all sounds form a vast choral hymn, and spiritually
    opened hearts hear God’s voice in ordinary sounds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A theory attributed to Pythagoras and Plato says music awakens the soul’s
    memory of celestial harmonies heard before separation from God; Rūmī’s cited verses
    mention spheres, Paradise, Adam, and earthly veils of earth and water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The formal practice of samāʿ spread among Sufis and caused disagreement, with
    some treating it as lawful and praiseworthy and others condemning it as innovation
    and incitement to vice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dhu ’l-Nūn’s cited saying describes music as a divine influence that stirs
    the heart to seek God, while distinguishing spiritual listening from sensual listening.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hujwīrī is presented as judging audition by its results and as using a tavern-and-cell
    saying to illustrate that the hearer’s state determines the effect.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage describes intense ecstatic movement as not ordinary dancing or
    bodily indulgence but a dissolution of the soul when rapture becomes intense and
    conventional forms disappear.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hujwīrī is said to prescribe precautions for audition and to regard public
    dervish concerts as demoralizing, especially for novices.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Zangī Bashgirdī is described as a spiritually advanced dervish whose presence
    was needed before the mystic dance could begin; during samāʿ he rose into the
    air and sat on a lofty arch.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Zangī descended onto Majduddīn of Baghdād, clasped the sheikh’s neck with
    his legs, and Majduddīn continued spinning in the dance despite the weight.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: After the dance, Zangī bit Majduddīn’s cheek, leaving a lasting scar that
    Majduddīn later described as the mark he would boast of on the Day of Judgment.
  category: sequence
  evidence_refs:
  - ev:12
