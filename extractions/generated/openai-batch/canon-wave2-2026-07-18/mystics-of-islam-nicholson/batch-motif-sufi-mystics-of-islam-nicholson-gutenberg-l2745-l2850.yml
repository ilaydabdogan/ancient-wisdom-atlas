canonical_text:
  quote: ''
  summary: The passage presents Sufi divine love as an ascent toward divine beauty,
    a restless longing for the Beloved, a divine gift that precedes human love, and
    a passing-away of the individual self. It cites Hujwīrī, Bāyazīd, Ibn al-ʿArabī,
    Junayd, Jalāluddīn, and Sarī al-Saqatī, includes an apologue of a devotee corrected
    by Khadir after Satan discourages his prayer, and describes love as inner light,
    heavenly astrolabe, and the force that removes veils. The narrator also compares
    Sufi love doctrine with Christian and Neoplatonic mystical traditions.
  language: English
  quote_policy: summarized
