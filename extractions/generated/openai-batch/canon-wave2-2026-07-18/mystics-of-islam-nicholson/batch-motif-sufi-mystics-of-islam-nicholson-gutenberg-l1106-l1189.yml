canonical_text:
  quote: God’s will be done! What have I to do with wishing?
  summary: The passage presents an anecdote of a dervish in the Tigris who refuses
    to state a personal wish and submits to God’s will. It then explains extreme Sufi
    trust in God as renunciation of personal initiative, discusses Shaqīq of Balkh’s
    teaching on divine unity, trust, satisfaction, and present-hour reliance, contrasts
    extreme passivity with later Sufi practical exertion, and concludes by contrasting
    cold equanimity with a higher morality of love and self-devotion.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A dervish falls into the Tigris, cannot swim, is offered help from the bank,
    and replies that God’s will should be done rather than stating a personal wish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Extreme trust in God is described as renouncing every personal initiative
    and volition, with passivity compared to a corpse in the hands of a burial washer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A special class of ancient Sufis is said to have applied trust to everyday
    life by not seeking food, hired work, trade, or medicine when ill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: These Sufis committed themselves to God’s care and expected their allotted
    portion to come as surely as it comes to birds, fish, and a child in the womb.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The principles of trust are said to depend on the Sufi theory of divine unity
