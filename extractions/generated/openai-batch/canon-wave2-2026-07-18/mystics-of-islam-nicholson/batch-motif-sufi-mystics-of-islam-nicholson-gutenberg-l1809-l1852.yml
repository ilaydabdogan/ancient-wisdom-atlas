  summary: Nicholson presents Niffarī’s teaching that the gnostic’s outward practice
    should follow the Sunna while inwardly following divinely given gnosis. The passage
    contrasts exoteric and esoteric revelation, religious law and inner experience,
    plurality and Unity, and describes the elect as illuminated while common people
    are veiled by mind, logic, and tradition.
