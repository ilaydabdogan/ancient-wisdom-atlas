canonical_text:
  quote: "“Seventy Thousand Veils separate Allah, the One Reality, from the world
    of matter and of sense.”"
  summary: The passage surveys Neoplatonic and Gnostic elements that Nicholson presents
    as channels into early Sufi speculation. It then quotes a Rifāʿī dervish doctrine
    in which every soul passes before birth through seventy thousand veils of light
    and darkness, loses divine qualities, gains earthly qualities, forgets its origin,
    and becomes imprisoned in the body. Sufism is described as a way to escape this
    prison, unveil the veils, recover unity with the One while embodied, and be refined
    like metal by the fire of spiritual passion.
  language: English
  quote_policy: quoted
