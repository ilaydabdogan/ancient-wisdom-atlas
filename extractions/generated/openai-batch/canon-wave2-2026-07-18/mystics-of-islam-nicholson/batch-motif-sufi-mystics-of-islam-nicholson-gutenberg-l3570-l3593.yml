canonical_text:
  quote: ''
  summary: Nicholson states that the doctrine of saintship has held a fundamental
    place in Sufism and has produced practices such as submission to saints, dependence
    on their favour, pilgrimage to shrines, and adoration of relics. He criticizes
    seeking God through another person’s inner light, calls this vicarious holiness,
    and quotes material attributed to ʿAlāʾuddīn ʿAttār that urges dwelling beside
    God rather than God’s creatures and attending to the works of holy men rather
    than worshipping at their tombs.
  language: English with Persian transliteration in quoted verse
  quote_policy: summarized
