literal_observations:
- id: obs:1
  text: The passage says mystics describe spiritual progress as a journey or pilgrimage,
    and that a Sufi seeker calls himself a traveller who advances by stages along
    a path toward union with Reality.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A seven-stage sequence is attributed to the Kitāb al-Lumaʿ: repentance, abstinence,
    renunciation, poverty, patience, trust in God, and satisfaction.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage distinguishes acquired stages from uncontrolled spiritual states
    and lists ten states including meditation, nearness to God, love, fear, hope,
    longing, intimacy, tranquillity, contemplation, and certainty.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the states descend from God into the heart and cannot be
    repelled when they come or retained when they go.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Completion of the path requires traversing all stages and receiving whatever
    states God bestows; the seeker is then raised to Gnosis and Truth and becomes
    a knower or gnostic.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The quest of Reality is described as a threefold journey: the Path, the Gnosis,
    and the Truth.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Repentance occupies the first place in lists of stages, marks the beginning
