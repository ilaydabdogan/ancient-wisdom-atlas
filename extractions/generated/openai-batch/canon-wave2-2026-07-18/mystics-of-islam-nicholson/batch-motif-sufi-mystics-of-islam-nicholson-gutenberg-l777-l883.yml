    and other experiences that lead people to enter the Path.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Repentance is described as the soul awakening from heedlessness; true repentance
    requires abandoning known sins, resolving not to return to them, and making restitution
    where possible.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage presents a high mystical theory in which repentance comes from
    God to man as divine grace, illustrated by Rābiʿa’s reply that God’s turning toward
    a person precedes that person’s turning toward God.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage contrasts novice instruction about remembering sins humbly with
    an adept doctrine that real repentance consists in forgetting everything except
    God; Hujwīrī is quoted as saying recollection of sin is a veil between God and
    the contemplative.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The passage concludes the repentance section by linking sin with self-existence
