canonical_text:
  quote: The light in the soul, the eye by which it sees, and the object of its vision,
    all are One.
  summary: 'The passage describes later stages of the Sufi quest: the Perfect Man
    turns back toward creatures as guide, then in a fourth journey associated with
    death becomes a mirror of divine self-disclosure. It discusses aridity after ecstasy,
    a dervish’s loss of the vision of Unity, the question of personality in union
    with God, and poetic images of union, death, transformation, ascent, and self-annihilation
    in the Godhead.'
  language: English
  quote_policy: quoted
