  summary: The passage explains Sufi recollection or dhikr as repeated remembrance
    of God, describes methods of vocal and inward repetition, gives examples of absorption,
    presents Ghazali's account of solitary practice leading to divine illumination,
    defines the final state as effacement or fanā, and compares meditation to Buddhist
    dhyāna and samādhi while noting breath practice, music, singing, dancing, and
    intense stillness as aids.
