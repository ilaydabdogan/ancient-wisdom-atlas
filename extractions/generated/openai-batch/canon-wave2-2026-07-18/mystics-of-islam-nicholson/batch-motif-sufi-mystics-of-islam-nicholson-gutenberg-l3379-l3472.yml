  quote: ''
  summary: The passage gives a sequence of aphoristic sayings about saintly power,
    divine love, mystical death and revival, nothingness before God, and the Way to
    God. It then surveys reported miracles of Muslim saints, comments on their status
    in higher Sufi teaching and Dervish Orders, and summarizes a four-stage dervish
    process of self-annihilation in the Murshid, the Pīr, the Prophet, and finally
    union with God, followed by a reference to Tawakkul Beg under Mollā-Shāh.
  language: English
  quote_policy: summarized
