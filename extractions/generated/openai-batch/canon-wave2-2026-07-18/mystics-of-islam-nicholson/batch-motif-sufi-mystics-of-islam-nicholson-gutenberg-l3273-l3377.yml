candidate_motifs:
- id: motif:1
  label: annihilated self as mirror of another
  taxonomy_refs:
  - annihilation_union
  basis: The poem explicitly says the person is annihilated, void of form, and mirror-like,
    and Khurqānī later speaks of being one through God’s Oneness.
  evidence_refs:
  - ev:1
  - ev:10
  confidence: high
  cautions: The poem and Khurqānī sayings are adjacent in the passage but are not
    explicitly attributed to the same speaker.
- id: motif:2
  label: veiled and unveiled saintly perception
  taxonomy_refs: []
  basis: Khurqānī’s awareness of distant events and ignorance of a nearby death are
    explained by a veil being lifted and lowered.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this as an anecdote, not as a generalized doctrine
    of visionary knowledge.
- id: motif:3
  label: sacred orientation contested and pilgrimage road controlled
  taxonomy_refs:
  - world_center
  basis: The qibla is identified as the prayer direction toward the Kaʿba, Khurqānī
    claims a second qibla, and the Grand Sheykh’s response blocks and reopens access
    to Mecca.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The world-center taxonomy is inferred from the qibla/Kaʿba orientation
    and Mecca pilgrimage setting; the passage does not use the phrase world center.
- id: motif:4
  label: protective invocation of saint produces invisibility
  taxonomy_refs: []
  basis: A traveller who mentions Khurqānī’s name during a brigand attack becomes
    invisible along with his camel and merchandise.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage explains the event through Khurqānī’s real invocation of God
    rather than through the name alone.
- id: motif:5
  label: reciprocal secrecy compact between saint and God
  taxonomy_refs:
  - covenant
  basis: A divine voice and Khurqānī each threaten disclosure, then conclude with
    ‘Keep thy secret, and I will keep Mine.’
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The covenant taxonomy is cautious because the passage gives a reciprocal
    verbal agreement but does not call it a covenant.
- id: motif:6
  label: posthumous saintly aid from the tomb
  taxonomy_refs: []
  basis: Khurqānī says that after his death he will raise his hands from the tomb
    and shed God’s grace upon a descendant’s lips.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The aid is predicted in a saying; no fulfilled posthumous episode is narrated
    in this passage.
- id: motif:7
  label: eschatological leadership at Resurrection and Paradise entry
  taxonomy_refs:
  - resurrection
  basis: Khurqānī says he will stand at the Resurrection and that a person will not
    enter Paradise until he leads him forward.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage concerns standing at the Resurrection and leading others,
    not a detailed resurrection narrative.
- id: motif:8
  label: cosmic saint whose body spans the universe
  taxonomy_refs: []
  basis: Khurqānī claims power to command the empyrean and sun and describes his skull,
    feet, and hands as cosmically located.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage records sayings of cosmic scale but does not provide a narrative
    action demonstrating them.
- id: motif:9
  label: annihilation of Paradise and Hell in the saint
  taxonomy_refs:
  - annihilation_union
  basis: Khurqānī says Paradise seeks him, Hell fears him, and both would become annihilated
    in him together with their inhabitants.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The annihilation is expressed as a first-person claim and hypothetical
    event.
- id: motif:10
  label: sweet infusion from the divine Throne
  taxonomy_refs: []
  basis: Khurqānī reports something from the Throne of God trickling into his mouth
    during sleep and producing inward sweetness.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The substance is not identified beyond ‘something,’ so further symbolic
    classification would be speculative.
