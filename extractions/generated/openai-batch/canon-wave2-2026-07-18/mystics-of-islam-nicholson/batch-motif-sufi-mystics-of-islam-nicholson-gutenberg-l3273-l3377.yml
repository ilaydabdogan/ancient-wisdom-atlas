canonical_text:
  quote: "“His form is vanished, he is a mere mirror; / Nothing is seen in him but
    the reflexion of another.”"
  summary: 'The passage first presents verses about a self-annihilated person as a
    mirror in which the viewer sees his own form. It then introduces Abu ’l-Hasan
    Khurqānī and gives selected anecdotes and sayings: distant knowledge conditioned
    by a veil, a disputed second qibla, blocked and reopened pilgrimage, protection
    through invoking the saint’s name, reciprocal secrecy with God, refusal to surrender
    the soul to the Angel of Death, posthumous aid from the tomb, cosmic commands
    and cosmic self-description, eschatological authority, annihilation of Paradise
    and Hell in the saint, and sweetness entering his mouth from the Throne of God.'
  language: English
  quote_policy: quoted
