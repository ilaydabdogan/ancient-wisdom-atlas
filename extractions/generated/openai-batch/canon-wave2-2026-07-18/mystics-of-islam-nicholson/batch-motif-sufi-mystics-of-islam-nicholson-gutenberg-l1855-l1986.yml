canonical_text:
  quote: "“God bade me behold the Sea, and I saw the ships sinking and the planks
    floating; then the planks too were submerged.”"
  summary: The passage presents a revelation in which God shows the speaker a Sea
    with sinking ships, floating and submerged planks, waves, shore, surface gleam,
    bottom darkness, fishes, boundaries, and beasts. The surrounding commentary interprets
    the Sea as spiritual experiences on the mystic’s journey to God and repeatedly
    warns against relying on secondary causes, religious works as independent means,
    or self-attributed abandonment. The closing prose explains gnosis as divine revelation
    to saints and cites Dhu ’l-Nūn on gnostics subsisting, moving, speaking, and seeing
    through God.
  language: English
  quote_policy: quoted
