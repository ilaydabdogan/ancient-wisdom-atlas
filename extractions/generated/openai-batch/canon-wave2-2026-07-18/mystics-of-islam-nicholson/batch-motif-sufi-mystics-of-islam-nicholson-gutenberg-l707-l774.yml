canonical_text:
  quote: Sūfism is undefinable.
  summary: The passage explains that definitions of Sūfism are numerous and partial.
    It uses Rūmī’s parable of people touching an elephant in a dark room to illustrate
    how each definition reflects limited experience. It then lists several definitions
    emphasizing divine hiddenness, self-discipline, non-possession, moral disposition,
    freedom, dying to self and living in God, contemplation, breath-control, renunciation,
    and steadfastness. The passage concludes that Sūfīs are not a sect with one dogmatic
    system, but follow many paths toward God with a family likeness, and notes the
    author’s focus on a pantheistic and speculative type of Sūfism.
  language: English
  quote_policy: quoted
