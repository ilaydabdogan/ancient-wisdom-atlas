canonical_text:
  quote: ''
  summary: The passage opens with a Sufi poem in which the speaker sees only God in
    all places and states, melts like a candle in divine fire, passes into nothingness,
    and finds only God. Nicholson then explains Sufism as resting on the loss of the
    individual self and direct ecstatic union with God. He lists technical terms for
    ecstasy, outlines three stages of fanā, relates final fanā to baqā, compares the
    first stage to Buddhist Nirvāṇa and the stages to Christian mystical categories,
    and gives examples of fanā accompanied by loss of sensation and regulated return
    to consciousness for prayer.
  language: English
  quote_policy: summarized
