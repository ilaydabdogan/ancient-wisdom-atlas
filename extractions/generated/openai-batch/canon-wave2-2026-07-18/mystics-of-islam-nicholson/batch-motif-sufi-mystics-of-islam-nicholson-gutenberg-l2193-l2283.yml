  summary: The passage presents Sufi statements and poems about recognizing God across
    differing forms of belief, opposing sectarian exclusivity, treating creeds and
    rituals as relative forms or veils, and allegorizing the pilgrimage as requiring
    inner movements of the heart. It includes sayings attributed to Ibn al-ʿArabī,
    Junayd, Hafiz, ʿAbdallah Ansārī, Sheykh ʿAbd al-Rahīm ibn al-Sabbāgh, and Abū
    Saʿīd ibn Abi ’l-Khayr, along with symbolic images of water in a vessel, flame,
    an egg, and the bird of Unity.
  language: English
