  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The passage says the effective clearance of the heart must be the work of
    God, though it requires inward human cooperation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The enlightened mystic is described as regarding God as the real agent in
