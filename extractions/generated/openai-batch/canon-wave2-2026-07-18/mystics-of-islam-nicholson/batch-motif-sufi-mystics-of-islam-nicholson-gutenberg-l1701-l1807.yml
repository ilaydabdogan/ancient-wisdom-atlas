canonical_text:
  quote: ''
  summary: Nicholson describes Sufi teaching on the heart, spirit, and inmost soul
    as organs of spiritual communication; the veiling and purification of the heart;
    the limits of sense, intellect, and book-learning for knowing God; Rumi’s inward
    instruction; maʿrifat as direct divine knowledge or gnosis; and Niffarī’s three
    classes of seekers, culminating in gnostics controlled by ecstasy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage says Sufis distinguish three organs of spiritual communication:
    the heart knows God, the spirit loves Him, and the inmost ground of the soul contemplates
    Him.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The qalb is described as connected mysteriously with the physical heart but
    not made of flesh and blood; when illumined by faith and knowledge it can know
    essences and reflect the divine mind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The heart is normally described as veiled, blackened by sin, tarnished by
    sensual impressions, pulled between reason and passion, and figured as a battlefield
    where the armies of God and the Devil contend.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The heart is said to have one gate for immediate knowledge of God and another
    gate admitting illusions of sense.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says man is potentially lower than the brutes and higher than
    the angels, and quotes a poem in which angel and brute compose man’s leaven.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that God is not known by the senses or by the intellect,
    and that logic, philosophy, and book-learning are inadequate for real knowledge
    of God.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rumi’s quoted address tells the theologian to seek the reality named, to look
    for the moon in the sky rather than in water, to become free from self, and to
    see prophetic knowledge in the heart without book, tutor, or preceptor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sufi instruction quoted in the passage says to look in one’s own heart
    because the kingdom of God is within, and it says that truly knowing oneself is
    knowing God.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The heart is compared to a mirror that reflects divine qualities, while the
