canonical_text:
  quote: "“Unification consists in making the heart single”"
  summary: The passage explains Sufi unification and gnosis as purification from all
    attachment except God, inward attraction toward divine recollection, knowledge
    of God through the self as microcosm, disappearance of egoic otherness, warnings
    from a divine voice to Niffarī about self-existence and divine veiling, and the
    gnostic view that direct revelation and inner worship supersede external law,
    reward, punishment, creed, and stone sanctuaries.
  language: English
  quote_policy: quoted
literal_observations:
