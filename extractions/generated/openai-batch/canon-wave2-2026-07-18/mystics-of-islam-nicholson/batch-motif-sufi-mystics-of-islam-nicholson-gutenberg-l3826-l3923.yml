canonical_text:
  quote: he becomes the very Light
  summary: The passage explains Sufi passing-away and union while rejecting literal
    incarnation or identity of divine and human essences. It presents al-Sarrāj and
    Hujwīrī on fanā, baqā, divine will, and transmutation of human qualities, then
    illustrates union through Majnūn and Laylā, Bāyazīd’s answer in his cell, Hujwīrī’s
    account of divine love transforming the lover, and verses attributed to Hallāj.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The wāqif is described as leaving no remnant or heir except God; when waqfat
    disappears from consciousness, he becomes Light, and his praise and knowledge
    proceed from God.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that this change is not an infusion of divine essence or
    an identification of divine and human natures, and says both doctrines are generally
    condemned.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Al-Sarrāj says some mystics of Baghdad erred by teaching that passing away
    from their qualities means entering the qualities of God, a view he says leads
    to incarnation or to the Christian belief concerning Jesus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Al-Sarrāj interprets the correct meaning as going forth from one’s own will
    and entering the will of God, with the person severed from self-regard and entirely
    devoted to God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Al-Sarrāj says God does not descend into the heart; what descends is faith
    in God, belief in unity, and reverence for the thought of Him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Al-Sarrāj rejects the view that weakening the body through abstaining from
    food and drink can remove humanity and invest a person with divine attributes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Al-Sarrāj says human inborn qualities are changed and transmuted by radiance
    from the divine Realities, while humanity itself does not depart from a person.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hujwīrī says fanā does not mean loss of essence or destruction of corporeal
    substance, and baqā does not mean God indwelling in man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hujwīrī says passing away from one’s perishable will results in abiding in
    God’s everlasting will, while human and divine attributes cannot become one another.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'Hujwīrī uses fire and iron as an analogy: fire changes the quality of iron
    without making iron into fire.'
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Hujwīrī defines union as concentration of thought upon the desired object;
    Majnūn’s concentration on Laylā causes him to see only Laylā and to perceive created
    things in her form.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A visitor asks in Bāyazīd’s cell whether Bāyazīd is there, and Bāyazīd answers
    by asking whether anyone is there except God.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Hujwīrī says God gives each friend a particle of His love and lets down shrouds
