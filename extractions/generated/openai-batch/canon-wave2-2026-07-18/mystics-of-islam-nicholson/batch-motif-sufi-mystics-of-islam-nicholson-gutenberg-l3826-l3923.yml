  claim: The passage compares the inner change of Sufi essentialisation or transmutation
    to the Magnum Opus, while treating the comparison as paradoxical and not as a
    literal account of mechanism.
  claim_level: same_function
  target: alchemical Magnum Opus as a transmutation pattern
  evidence_refs:
