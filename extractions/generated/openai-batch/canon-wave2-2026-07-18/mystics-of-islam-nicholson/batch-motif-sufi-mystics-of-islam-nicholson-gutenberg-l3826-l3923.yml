candidate_motifs:
- id: motif:1
  label: annihilation and union without literal incarnation
  taxonomy_refs:
  - annihilation_union
  basis: The passage repeatedly explains fanā, baqā, and union as passing beyond self-regard,
    entering God’s will, and experiencing Oneness while denying hulūl and ittihād.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:8
  - ev:14
  confidence: high
  cautions: The passage explicitly warns that accepted Sufi union should not be read
    as literal fusion of divine and human essences.
- id: motif:2
  label: transmutation by divine radiance or love
  taxonomy_refs:
  - annihilation_union
  basis: Human qualities are said to be changed by radiance from the divine Realities,
    and the particle of divine love transmutes what is attached to it until the lover’s
    clay becomes love.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: The passage frames transmutation as a change of qualities or perception,
    not a change of human substance into divine substance.
- id: motif:3
  label: divine beloved seen everywhere
  taxonomy_refs:
  - divine_beloved
  basis: Hujwīrī defines union as concentration on the desired object, using Majnūn’s
    perception of Laylā in all created things and applying the same principle to Sufi
    enravishment with God.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: medium
  cautions: Laylā is an illustrative human beloved within the exposition; the divine
    beloved application is made by analogy in Hujwīrī’s explanation.
- id: motif:4
  label: self-negation and all-affirmation at Oneness
  taxonomy_refs:
  - annihilation_union
  basis: The enraptured Sufi beyond subject and object is said to be able either to
    deny being anything or affirm being all things.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage introduces this as a doctrinal or mystical statement rather
    than narrating a full mythic episode.
- id: motif:5
  label: mystical quest toward union
  taxonomy_refs:
  - mystical_quest
  - annihilation_union
  basis: The passage presents a sequence of leaving self-regard, entering God’s will,
    passing away from the perishable will, concentrating on the desired object, and
    reaching Oneness.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:10
  - ev:14
  confidence: medium
  cautions: The passage is expository rather than a continuous quest narrative.
