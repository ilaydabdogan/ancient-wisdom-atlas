canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for disposing of cut hair and nails.
    It says that failure to observe lawful rites produces Daevas and Khrafstra pests
    in the earth. Hair and nails are to be removed from the faithful, fire, water,
    and consecrated baresma by prescribed distances; placed in holes; surrounded by
    furrows drawn with a metal knife; and accompanied by fiend-smiting words and the
    Ahuna-Vairya chant. Nails are also dedicated to the Asho-zusta bird so that they
    may become weapons against the Mazainya Daevas; if not dedicated, they are said
    to fall into demonic hands. Translator notes relate the hair formula to a body-as-microcosm
    theory and explain the bird’s protective function.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Daevas are produced in the earth when lawful rites
    are not observed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Khrafstras, identified there as lice, are produced
    in the earth when lawful rites are not observed and eat corn in fields and clothes
    in wardrobes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When hair is combed or shaved, or nails are pared, they are to be taken away
    by specified distances from the faithful, the fire, the water, and consecrated
    baresma bundles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For hair, a hole is to be dug to a depth determined by whether the earth is
    hard or soft, the hair is to be placed in it, and fiend-smiting words are to be
    recited aloud.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Around the hair hole, three, six, or nine furrows are to be drawn with a metal
    knife, and the Ahuna-Vairya is to be chanted the same number of times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: For nails, a hole is to be dug outside the house to the depth of the top joint
    of the little finger, the nails are to be placed in it, and fiend-smiting words
    are to be recited aloud.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Around the nail hole, three, six, or nine furrows are to be drawn with a metal
    knife, and the Ahuna-Vairya is to be chanted the same number of times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Asho-zusta bird is addressed and offered the nails, with the wish that
    they become weapons against the Mazainya Daevas.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that if the nails have not been dedicated to the bird,
    they will be in the hands of the Mazainya Daevas as weapons.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A translator note states that man was considered a microcosm whose elements
    came from corresponding natural elements, returned to them after death, and came
    back at resurrection.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: A translator note explains that reciting the formula for the Asho-zusta bird
    prevents fiends from taking the nails, and that the bird eats the nails to prevent
    harm by their means.
  category: other
  evidence_refs:
  - ev:10
