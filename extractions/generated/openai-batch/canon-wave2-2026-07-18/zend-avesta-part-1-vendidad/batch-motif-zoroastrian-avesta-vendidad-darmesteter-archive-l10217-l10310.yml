canonical_text:
  quote: ''
  summary: Ahura Mazda gives rules for placing a corpse in the cleanest and driest
    suitable place, keeping it at prescribed distances from fire, water, baresma,
    and the faithful. A grave is dug and covered with dry materials; the body remains
    until natural signs appear. Worshippers then breach the wall, summon corpse-bearers
    to carry the body to the Dakhma where corpse-eating dogs and birds are present,
    and afterward the corpse-bearers undergo washing with specified urine under the
    direction of the holy Ratu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda identifies the appropriate place in the house as the cleanest
    and driest ground, least passed through by flocks, herds, Fire, consecrated baresma,
    and the faithful.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The place is to be thirty paces from fire, water, and consecrated baresma,
    and three paces from the faithful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A grave is to be dug at that place, with depth depending on whether the earth
    is hard or soft, and its surface is to be covered with dry or protective materials
    including ashes or cowdung and dust of bricks, stones, or dry earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lifeless body is to lie there for two nights, three nights, or a month,
    until birds fly, plants grow, floods flow, and wind dries waters from the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When those natural signs occur, worshippers of Mazda make a breach in the
    wall of the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Two strong and skilful men, after stripping off their clothes, carry the body
    to a structure of clay, stones, and mortar located where corpse-eating dogs and
    birds are always present.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Afterward, the corpse-bearers sit three paces from the dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The holy Ratu proclaims that worshippers of Mazda should bring urine for the
    corpse-bearers to wash their hair and bodies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The prescribed urine is from sheep or oxen; human urine is excluded except
    from the dead person's nearest kinsman or nearest kinswoman.
  category: object
  evidence_refs:
  - ev:8
