canonical_text:
  quote: ''
  summary: The passage recounts eighteenth-century European criticism of the Avesta
    and Anquetil’s presentation of it. It summarizes Jones’s argument that texts containing
    absurd tales, laws, rules, and grotesque descriptions of gods and demons could
    not be by Zoroaster or represent a religion famed for simplicity, wisdom, and
    purity. It then notes that Chardin, Richardson, and Meiners echoed or extended
    the criticism, with Richardson offering philological objections and Meiners objecting
    that the books introduced unheard-of ideas.
  language: English
  quote_policy: summarized
