canonical_text:
  quote: ''
  summary: The passage explains how animals, celestial bodies, and humans are classified
    under Ormazd/Ahura Mazda or Ahriman; describes storm-tale imagery in which gods
    and fiends take animal or object forms; treats killing Ahrimanian creatures as
    an attack on Ahriman; describes TLrtrya's forms and celestial allies; and states
    that the righteous man of Asha receives a heavenly place and participates in end-time
    resurrection and renewal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that animals are said to belong to Ormazd or Ahriman according
    to usefulness or harmfulness to humans, but it explains their original assignment
    as arising from divine or fiendish incarnation in storm tales.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the fiend is described as a serpent because the storm fiend
    surrounds the goddess of light or the milch cows of the raining heavens with cloud
    coils like a snake's folds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that gods and fiends could be compared with, and transformed
    into, objects suggested by storm noise, lightning, streaming water, or the color
    and shape of clouds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Killing the Ahrimanian creatures called Khrafstras is presented as killing
    Ahriman himself and as a possible atonement for sin; killing an Ormazdean animal
    is presented as an abomination.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes that birds of prey were assigned to Ormazd because lightning
    imagery described the god as moving on raven wings and with a hawk's flight, even
    though this classification could conflict with an expected usefulness principle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: TLrtrya, conqueror of Apaosha, is described in mythic tales as a boar with
    golden horns, a horse with yellow ears, and a beautiful youth; because he was
    compared to a shining star, the stars stand with him on Ahura's side while the
    planets pass into Ahriman's army.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that humans belong to Ormazd or Ahriman according to deeds;
    a man of Asha helps Ormazd through sacrifice, good thoughts, words, and deeds,
    spreading life, and destroying Ahriman's creatures.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man of Asha is exemplified by the Athravan priest, the Rathaejta warrior,
    and the Vastryo husbandman; contrary figures are named as Drva;//j, Anashavan,
    and Ashemaogha.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man of Asha who has lived for Ahura Mazda is said to have a seat near
    him in heaven, and at the end of time the dead rise and live a new happy life
    on earth freed from evil and death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A footnote states that the Iranian worship of the Fravashis developed from
