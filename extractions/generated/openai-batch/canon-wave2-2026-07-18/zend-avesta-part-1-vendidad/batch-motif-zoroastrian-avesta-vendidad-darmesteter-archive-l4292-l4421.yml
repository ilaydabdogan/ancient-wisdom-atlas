  summary: The passage introduces the Vendidad as a fragmentary Avesta text often
    treated as a law book, more specifically as a code of purification. It describes
    mythic materials in the first chapters, including creation and counter-creation,
    Yima as founder of civilisation, origin-of-medicine chapters, and a revelation
    of law by Ahura to Zarathushtra. It also summarizes the organization of legal
    and ritual topics, especially impurity from the dead and purification.
