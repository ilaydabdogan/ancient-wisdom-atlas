canonical_text:
  quote: "“this man deliver thou back unto me, against the mighty day of resurrection”"
  summary: In a dialogue, holy Sraosha questions the guileful Druj demon about men
    whose actions make her conceive progeny. The Druj identifies a man who urinates
    so that it falls along the forepart of his foot and a man who emits seed during
    sleep. For each case, ritual speech, movement, and offering are prescribed as
    counteractions that destroy the fruit of the Druj's womb. The passage ends with
    an address to Spenta Armaiti asking that the man be delivered back at the day
    of resurrection as one who knows the Gathas.
  language: English
  quote_policy: quoted
literal_observations:
