canonical_text:
  quote: ''
  summary: A question-and-answer passage gives prescribed periods of staying or mourning
    after deaths of household members and relatives, distinguishing the righteous
    from sinners. It repeatedly prescribes cleansing a house through triple washing
    of bodies and clothes, triple chanting of the Gathas, offerings to Fire, baresma
    bundles, and libations to good waters, after which waters, fire, and the Amesha-Spentas
    may enter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the master or mistress of the house dies, the prescribed stay is six months
    for the righteous and one year for sinners.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cleansing prescription includes washing bodies three times, washing clothes
    three times, and chanting the Gathas three times.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
- id: obs:3
  text: The cleansing prescription includes offering a sacrifice to Fire, offering
    bundles of baresma, and bringing libations to the good waters.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
- id: obs:4
  text: After the cleansing actions, the house is said to be clean, and waters, fire,
    and the Amesha-Spentas may enter.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
- id: obs:5
  text: For a grandparent's death or a grandchild's death, the reciprocal relatives
    are prescribed to stay twenty-five days for the righteous and fifty days for sinners.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
