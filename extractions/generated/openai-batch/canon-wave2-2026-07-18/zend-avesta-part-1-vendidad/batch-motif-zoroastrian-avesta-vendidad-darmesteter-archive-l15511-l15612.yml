canonical_text:
  quote: ''
  summary: The passage describes a withering effect associated with Spenta Armaiti,
    gives a severe injunction against unnamed condemned creatures, and presents Ahura
    Mazda answering Zarathustra’s question about atonement for a man and woman who
    knowingly have intercourse while the woman has an issue of blood. The prescribed
    atonement includes slaughtering cattle, offerings to fire and waters, wood, baresma
    bundles, Zaothra-libations with Haoma and meat, roots of Hadha-naepata, and killing
    snakes.
  language: English
  quote_policy: summarized
