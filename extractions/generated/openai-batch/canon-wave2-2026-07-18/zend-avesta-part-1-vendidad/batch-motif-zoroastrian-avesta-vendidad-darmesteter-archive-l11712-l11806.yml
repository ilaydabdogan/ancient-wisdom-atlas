canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for sprinkling successive parts of
    a man’s lower body, driving the Druj Nasu from limb to limb until she is forced
    to the toes and flies away northward in the shape of a foul raging fly. The officiant
    then recites fiend-smiting and healing formulas invoking Mazda and other divine
    powers, and the man becomes freer from the Nasu at successive holes.
  language: English
  quote_policy: summarized
