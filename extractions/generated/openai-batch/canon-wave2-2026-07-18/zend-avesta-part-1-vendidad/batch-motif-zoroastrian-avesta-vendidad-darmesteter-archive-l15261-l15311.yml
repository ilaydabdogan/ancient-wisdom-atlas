    bears offspring without a male. The demon denies this and says she has four males
    who make her conceive. When asked who the first male is, she identifies him as
    a man who refuses to give anything from his stored wealth when entreated by one
    of the faithful. Sraosha then asks what can counteract this, but the answer is
    only begun in the supplied excerpt.
