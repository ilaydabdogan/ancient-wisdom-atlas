canonical_text:
  quote: ''
  summary: The passage first describes a man able to strive against a winter fiend,
    a wicked tyrant, and an ungodly Ashemaogha. It then treats a grave deed identified
    as knowingly lying in an oath before brimstoned, golden, truth-knowing water,
    with an appeal to Rashnu and a lie to Mithra. The pain for that deed “down there”
    is described as worse than several bodily tortures, and Ahura Mazda states a worldly
    penalty of seven hundred stripes with each of two named implements. The following
    editorial heading summarizes Fargard V as concerning uncleanness from the dead
    and means of purification.
  language: English
  quote_policy: summarized
