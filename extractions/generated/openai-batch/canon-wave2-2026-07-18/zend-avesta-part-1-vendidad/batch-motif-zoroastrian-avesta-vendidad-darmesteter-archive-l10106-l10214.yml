canonical_text:
  quote: ''
  summary: 'The passage first identifies a person who, despite godly intent, goes
    astray by offering libations with water defiled by the dead or by offering libations
    at night. It then opens Fargard VIII with an outline on funerals and purification.
    The first instructions address a dog or man dying in a house or hut: worshippers
    should seek a Dakhma, remove either the dead body or the house depending on which
    is easier, and perfume the house with sweet-smelling plants. A further question
    asks what should be done when death occurs during rain, snow, wind, or approaching
    darkness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A question asks who, while having godly intent and wish, goes astray from
    the ways of God and falls into the ways of the Druj/Drug.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda answers that the straying person is one who offers a libation
    with water defiled by the dead or offers libations in the dead of night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chapter outline identifies Fargard VIII as concerning purification of
    a house where someone has died, funerals, purification of corpse paths, corpse-related
    contamination, purification of a person and fire defiled by the dead, the Bahram
    fire, and purification in the wilderness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A question asks what Mazda-worshippers should do if a dog or man dies under
    the timber-work of a house or the wattlings of a hut.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura Mazda instructs them to look for a Dakhma; if removing the dead is easier
    than removing the house, they should take out the dead, leave the house standing,
    and perfume it with named sweet-smelling plants or another such plant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If removing the house is easier than removing the dead, they should take away
    the house, leave the dead on the spot, and perfume the house with named sweet-smelling
    plants or another such plant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A later question asks what Mazda-worshippers should do if a dog or man dies
    in a house while it is raining, snowing, blowing, or becoming dark, when flocks
    and men lose their way.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: A footnote cites the Nirangistan rule that good waters may be offered from
    sunrise to sunset and compares after-sunset offering to pouring them into the
    jaws of a venomous snake.
  category: other
  evidence_refs:
  - ev:9
- id: obs:9
  text: A commentary footnote states that when a dog or man dies, the first act is
    to take the corpse out and purify the house, inside and outside, with perfumes
    burnt on the fire.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A commentary footnote says no corpse should be taken to the Dakhma while rain
    is falling or threatening, with further instructions if rain overtakes the bearers.
  category: other
  evidence_refs:
  - ev:10
