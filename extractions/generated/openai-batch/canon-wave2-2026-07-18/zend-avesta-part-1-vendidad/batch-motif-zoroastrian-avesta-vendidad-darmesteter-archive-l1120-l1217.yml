literal_observations:
- id: obs:1
  text: Father Paulo de St. Barthelemy developed Jones’s remark on the relationship
    between Zend and Sanskrit by comparing vocabulary judged unlikely to be borrowed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Barthelemy’s list of eighteen liturgical words from India
    and Persia was poorly executed, although the idea was judged promising.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Barthelemy concluded that Sanskrit had been spoken in Persia and Media, had
    given birth to Zend, and that the Zend-Avesta was authentic.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator interprets Barthelemy’s position as amounting to the view that
    Zend and Sanskrit derived from an older language, though Barthelemy did not state
    this clearly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: John Leyden regarded Zend as a Prakrit dialect parallel to Pali, identifying
    Pali with Magadhi and Zend with Sauraseni.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Erskine regarded Zend as a Sanskrit dialect imported from India by the founders
    of Mazdeism and never spoken in Persia.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Erskine’s argument used the absence of Zend from the Farhang-i Jehangiri’s
    list of seven ancient Persian dialects and the lack of close relationship between
    Zend and Pahlavi or Persian.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Germany, Meiners found no followers; theologians appealed to the Avesta
    in polemics; and Rhode sketched Persian religious history using Anquetil’s translations.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Emmanuel Rask answered Erskine by arguing that the Jehangiri list belonged
    to a later epoch and different parts of Persia, and that modern Persian came from
    a dialect related to Zend rather than from Zend itself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rask argued that Zend was not derived from Sanskrit, that its sound system
    was closer to Persian, and that its grammar resembled Sanskrit, Greek, and Latin
    while also having distinct features.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Rask supplied paradigms of three Zend nouns and corrected the pronunciation
