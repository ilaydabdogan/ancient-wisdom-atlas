  summary: The passage surveys late eighteenth- and early nineteenth-century scholarship
    on the Zend language and the Zend-Avesta, especially arguments about Zend’s relationship
    to Sanskrit, Persian, Pahlavi, Greek, and Latin, and about the authenticity of
    the Avesta texts.
