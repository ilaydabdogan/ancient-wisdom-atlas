canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for a woman placed in an enclosure:
    she is provisioned with food and clothes, directed to drink gomez mixed with ashes,
    then allowed a waterless diet including boiling milk, meat, bread, and wine. After
    three nights she washes body and clothes with gomez and water. If fever, hunger,
    and thirst threaten her life, she may drink water with authorization from a holy
    man, though the passage breaks off mid-sentence.'
