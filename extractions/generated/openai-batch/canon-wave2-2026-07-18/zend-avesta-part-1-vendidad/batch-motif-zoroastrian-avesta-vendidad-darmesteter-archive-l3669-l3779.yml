canonical_text:
  quote: ''
  summary: The passage presents a dualistic account in which Ahura/Ahura Mazda and
    Angra Mainyu stand as opposed sources of good and evil. It describes Angra Mainyu
    as marring creation, assigns domains of the world to Amesha Spentas under Ahura,
    describes corresponding demons as inverted opponents, and states that all beings,
    including animals, are engaged in the conflict.
  language: English
  quote_policy: summarized
