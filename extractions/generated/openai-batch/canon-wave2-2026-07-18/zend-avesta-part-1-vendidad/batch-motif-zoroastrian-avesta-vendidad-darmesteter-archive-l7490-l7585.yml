  - ev:3
- id: obs:3
  text: For an Avaoirista committed for the seventh time without prior atonement,
    or committed with refusal to atone, the offender is called a Peshotanu and receives
    two hundred stripes with each named implement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For an Aredus, the stated penalties rise from fifteen stripes with each implement
    to thirty, fifty, seventy, and ninety for successive offenses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a sixth Aredus without atonement for the preceding offenses, or for an
    Aredus with refusal to atone, the offender is called a Peshotanu and receives
    two hundred stripes with each named implement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For smiting another and hurting him sorely, the stated penalties rise through
    thirty, fifty, seventy, and ninety stripes with each named implement for repeated
    occurrences.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the smiting-and-hurting deed is committed a fifth time without prior atonement,
