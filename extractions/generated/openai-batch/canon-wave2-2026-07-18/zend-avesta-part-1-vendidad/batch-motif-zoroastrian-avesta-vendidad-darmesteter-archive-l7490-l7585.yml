  summary: A casuistic legal passage lists offenses and asks Ahura Mazda what penalty
    should be paid. Ahura Mazda gives escalating numbers of stripes with the Aspahe-astra
    and the Sraosho-carana for repeated offenses, and identifies some unatoned or
    refused-atone cases as Peshotanu with two hundred stripes by each implement.
