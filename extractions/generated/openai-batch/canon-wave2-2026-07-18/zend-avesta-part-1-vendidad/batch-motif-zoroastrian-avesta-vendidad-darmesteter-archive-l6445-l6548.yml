canonical_text:
  quote: ''
  summary: 'Zarathustra asks Ahura Mazda who brought Mazda''s law into Yima''s Vara
    and who rules there. Ahura Mazda identifies the bird Karshipta as the law-bringer,
    and Urvata-nara together with Zarathustra as rulers there. Translator notes expand
    on Karshipta as a heavenly bird who recites the Avesta in bird language. The passage
    then introduces Fargard III on the Earth, outlining places where the Earth rejoices
    or grieves, and begins with Ahura Mazda identifying the first place where Earth
    feels happiest: where a faithful person steps forward holding holy wood, baresma,
    and holy meat.'
  language: English
  quote_policy: summarized
