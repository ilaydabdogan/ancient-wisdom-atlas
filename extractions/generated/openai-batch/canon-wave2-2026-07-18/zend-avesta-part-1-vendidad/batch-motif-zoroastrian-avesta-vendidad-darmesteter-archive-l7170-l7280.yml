  quote: ''
  summary: The passage lists six ranked forms of contract, explains how breach of
    a lower contract is redeemed by pledging the value of the next higher contract,
    and records Ahura Mazda answering questions about the liability and atonement
    attached to breaking word- and hand-contracts. Footnotes discuss handclasp as
    a possible contractual gesture, family liability, and later interpretations in
    which punishment occurs in hell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Six contract types are enumerated in ascending terms: word-contract, hand-contract,
    sheep-contract, ox-contract, man- or human-being-contract, and field-contract.'
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: If a man makes the word-contract a mere word, the passage says it is redeemed
    by the hand-contract and requires a pledge equal to the hand-contract.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: 'The passage gives a graded redemption sequence: hand-contract by sheep-contract,
    sheep-contract by ox-contract, ox-contract by man-contract, and man-contract by
    field-contract.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: A speaker asks Ahura Mazda how many are involved in the sin if a man breaks
    the word-contract.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:5
  text: Ahura Mazda answers that the man's Nabanazdistas are answerable for a three
    hundred-fold atonement when the word-contract is broken.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A similar question is asked about breaking the hand-contract, and Ahura Mazda
