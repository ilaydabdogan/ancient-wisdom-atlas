canonical_text:
  quote: ''
  summary: A prayer invokes the much-desired Airyaman to come for the joy of Zarathustra's
    men and women and the faithful, with reward and boon connected to law and holiness,
    and to smite diseases, deaths, and hostile beings. Recited formulas ask Mazda
    for protection from the fiend, name Atar and Vohu-mano as protectors, ask for
    the rules of divine law for this world and the next, call for Sraosha and Vohu-mano
    to help, and command the fiendish Druj and the fiend's brood and world to perish
    to the regions of the north so they will not bring death to the living world of
    the holy spirit.
  language: English
  quote_policy: summarized
