  text: The passage poses a case in which a woman in a Mazdean house, at one to ten
    months of pregnancy, brings forth a still-born child.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda says to choose the cleanest and driest place in that house, least
    passed through by flocks and herds, Fire, consecrated baresma bundles, and the
    faithful.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prescribed place is to be thirty paces from fire, thirty paces from water,
    thirty paces from the consecrated baresma bundles, and three paces from the faithful.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The worshippers of Mazda are to erect an enclosure at that place and establish
    the woman there with food and clothes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first prescribed drink is gomez mixed with ashes, in three, six, or nine
