canonical_text:
  quote: ''
  summary: A question asks what Mazda-worshippers should do when a pregnant woman
    in a Mazdean house brings forth a still-born child. Ahura Mazda prescribes a clean,
    dry, low-traffic place at set distances from fire, water, baresma, and the faithful;
    an enclosure for the woman; provision of food and clothing; an initial drink of
    gomez mixed with ashes; and a subsequent restricted diet. The excerpt ends as
    the duration answer begins with three nights.
  language: English
  quote_policy: summarized
