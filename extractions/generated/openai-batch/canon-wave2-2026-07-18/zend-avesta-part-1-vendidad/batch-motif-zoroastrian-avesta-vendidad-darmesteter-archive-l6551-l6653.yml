canonical_text:
  quote: ''
  summary: 'The passage lists places where the Earth is happiest: a faithful household
    with priest, family, cattle, dog, fire, and thriving blessings; cultivated and
    well-managed land; places of increasing flocks and herds; and places where herds
    yield dung. It then lists places where the Earth feels grief: the neck of Arezura
    where fiends emerge from the Druj’s burrow, burial places of dog and human corpses,
    and Dakhmas bearing corpses. An opening fragment also mentions a holy mortar and
    invocation of Mithra and Rama Hvastra.'
  language: English
  quote_policy: summarized
