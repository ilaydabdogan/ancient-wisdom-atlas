  summary: The passage surveys eighteenth-century debates over the authenticity and
    comparative interpretation of the Avesta. It reports criticisms concerning unfamiliar
    trees, animals, demons, and praised heroes; notes comparisons among Parsi, Brahman,
    and Muslim ideas; discusses demon lore and remedies; and summarizes debates over
    Mount Alborz and Mount Meru, Persian and Indian terms for demons or gods, and
    philological evidence about Zend and Pahlavi.
