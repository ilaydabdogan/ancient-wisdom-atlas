canonical_text:
  quote: ''
  summary: A liturgical invocation names the blissful abode of the holy ones, Garo-nmanem,
    a Mazda-made bridge, beneficent beings and powers, the Gathas, world-regions and
    glories, Sraosha, and offerings of libations, wood, incense, and sacrifice to
    Fire.
  language: English
  quote_policy: summarized
