canonical_text:
  quote: ''
  summary: Ahura Mazda commands Yima to construct a Vara, a square enclosed abode
    and fold, and to stock it with selected seeds of humans, animals, trees, fruits,
    and fires. The Vara is to contain flowing waters, birds, evergreen banks, dwellings,
    streets, a sealed closure, a door, and a self-shining window. Defects, disease,
    poverty, lying, and marks attributed to Angra Mainyu are excluded. Yima asks how
    to build it, is told to stamp and knead the earth like potter's clay, and then
    does so.
  language: English
  quote_policy: summarized
