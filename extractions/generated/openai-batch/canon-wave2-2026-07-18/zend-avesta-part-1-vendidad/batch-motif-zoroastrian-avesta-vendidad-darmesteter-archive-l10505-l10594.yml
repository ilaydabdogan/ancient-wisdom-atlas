canonical_text:
  quote: ''
  summary: Ahura Mazda describes an unnamed deed as beyond atonement, then explains
    that the law of Mazda can remove sin from an untaught or non-professing sinner
    who confesses and resolves not to repeat forbidden deeds. The law is said to remove
    many sins and cleanse the faithful from evil thought, word, and deed like wind
    cleansing a plain. Zarathustra asks who is called a Daeva before death and after
    death; Ahura Mazda answers by identifying a man who engages in male same-sex intercourse
    as such a Daeva. Translator notes compare Vispo-daeva with older all-gods formulas
    and mention a pattern of wicked souls becoming demons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda states that for an unnamed deed there is no payment, atonement,
    or cleansing, and that it remains without atonement forever.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes between a sinner who is a professor of Mazda's law
    or taught in it, and one who is not; for the latter, confession and resolve not
    to repeat the forbidden deeds allow the law of Mazda to take away the sin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The law of Mazda is said to take away the bonds of sin and listed sins, including
    breach of trust, murdering one of the faithful, burying a corpse, deeds without
    atonement, heavy penalties, and any sin that may be sinned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The law of Mazda is said to cleanse the faithful from every evil thought,
    word, and deed, with a comparison to a swift mighty wind cleansing a plain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Zarathustra is addressed by name and told that full atonement for sin is effected
    by means of the law of Mazda.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Zarathustra asks the Holy Maker who is a Daeva, a worshipper or paramour of
    the Daevas, a she-Daeva, a Daeva in the self and whole being, and one who is a
    Daeva before death and becomes an unseen Daeva after death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ahura Mazda's answer classifies a man who has sexual relations with a man
    as a Daeva, a worshipper and paramour of the Daevas, and one who becomes an unseen
    Daeva after death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A translator note explains Vispo-daeva as an expression connected with an
    earlier period when daeva meant god, and compares it with invocations to all gods
    among Greeks and Indians.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: A translator note states that demons are often described as restless souls
    of the wicked excluded from heaven, and cites a Mahabadian belief that a soul
    without good speech and deeds becomes an Ahriman or gin.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: A commentary note states that the guilty person may be killed without an order
    from the Dastur and that such execution may redeem an ordinary capital crime.
  category: other
  evidence_refs:
  - ev:9
