  quote: ''
  summary: 'The passage comments on the mythical geography of Fargard I: Vanguhi and
    Rangha are described as heavenly rivers surrounding the earth, Rangha as a horizon
    or Okeanos-like boundary sometimes dividing gods from fiends, and Airyana Vaejo
    by the Vanguhi Daitya as a mythical paradise-like region associated with Yima
    and the righteous. It also notes later attempts to localize these rivers and regions
    in historical geography.'
