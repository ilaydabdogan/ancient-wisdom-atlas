canonical_text:
  quote: ''
  summary: The passage gives instructions for a purification rite. The unclean person
    repeats formulaic words that weaken the Drug and smite named fiends. The officiant
    is instructed to sprinkle the person with gomez using a brass or lead spoon attached
    to a nine-knotted stick. The hands are washed three times before the body is sprinkled
    in a set sequence; at each sprinkling the Druj Nasu moves from one body part to
    another.
  language: English
  quote_policy: summarized
