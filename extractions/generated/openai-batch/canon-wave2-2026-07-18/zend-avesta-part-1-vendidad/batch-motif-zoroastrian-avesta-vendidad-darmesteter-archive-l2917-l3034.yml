canonical_text:
  quote: ''
  summary: 'The passage presents Darmesteter''s account of Indo-Iranian religion as
    founded on two ideas: ordered natural law and conflict between good and evil powers.
    It identifies the law-establishing deity as the Heaven God or supreme Asura, later
    named Ahura Mazda in the Avesta, and describes his sky attributes, all-seeing
    wisdom, and relation to celestial and storm imagery. It also compares Iranian
    and Indian developments, including Varuna, Indra, and Brahman.'
  language: English
  quote_policy: summarized
