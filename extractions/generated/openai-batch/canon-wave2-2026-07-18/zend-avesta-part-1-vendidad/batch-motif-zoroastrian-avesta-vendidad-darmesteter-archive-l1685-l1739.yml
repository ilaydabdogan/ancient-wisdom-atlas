  quote: ''
  summary: The passage reports a tradition that Avesta fragments were sought out after
    Alexander’s ravages or preserved by oral transmission, then collected under Arsacid
    and Sassanian rulers, made the sacred book of Iran, purified, and fixed into a
    number of Nasks. It also notes scholarly doubt about the record because it assigns
    an early role to an Arsacid prince, while many writers attribute the revival and
    state establishment of Mazdeism chiefly to the Sassanian dynasty. A note mentions
    a Brahmanical account of caste origins as a likely Indian borrowing in another
    context.
  language: English
  quote_policy: summarized
