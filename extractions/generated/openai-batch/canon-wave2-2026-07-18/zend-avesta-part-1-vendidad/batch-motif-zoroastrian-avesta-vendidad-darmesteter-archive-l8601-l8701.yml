canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for an unnamed woman who remains
    apart for three nights, then for nine more nights, and is cleansed by washing
    her body and clothes with gomez and water. It asks whether the washed clothes
    may be used by priests or other members of the faithful; Ahura Mazda answers that
    they may never be so used, but may serve as coverings or sheets for a sick woman
    or an infirm, unclean person until that person becomes clean.
  language: English
  quote_policy: summarized
