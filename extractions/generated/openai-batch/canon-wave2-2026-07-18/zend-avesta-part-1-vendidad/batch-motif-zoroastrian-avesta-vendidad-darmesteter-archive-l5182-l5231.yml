canonical_text:
  quote: ''
  summary: 'The passage explains that the Patet has a religious effect: it may save
    a sinner from penalties in the other world and deliver him before God, but it
    does not remove earthly penalties before human authority. It distinguishes expiable
    sins from anaperetha, or inexpiable, sins, which are described as bringing death
    here below and torments in the other world. It lists several such sins and classes
    of offenders, then comments on Mazdean law as a Sassanian ideal and notes the
    role of Mobeds in justice and state office.'
  language: English
  quote_policy: summarized
