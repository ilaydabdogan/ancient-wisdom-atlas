canonical_text:
  quote: ''
  summary: 'The passage lists several sins: giving hard bones or hot food to certain
    dogs so that injury and death follow; striking or frightening a pregnant bitch
    so that she falls and dies; intercourse with a woman with an issue of blood; and
    intercourse with a woman quick with child. These acts are said to make the man
    a Peshotanu. Notes add parallel or explanatory statements about death-guilt and
    pregnancy timing.'
  language: English
  quote_policy: summarized
