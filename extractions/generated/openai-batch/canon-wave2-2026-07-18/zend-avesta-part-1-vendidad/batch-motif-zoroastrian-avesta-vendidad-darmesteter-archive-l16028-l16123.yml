canonical_text:
  quote: ''
  summary: The passage gives instructions for cleansing Vohu-mano, including exposure
    under the heavens for nine nights and offerings to fire. It then presents Zarathustra
    asking Ahura Mazda about urging people to recognize that they must leave the material
    world and their possessions, followed by questions about where souls receive rewards.
    Ahura Mazda describes the dead person being assailed by evil Daevas, the third-night
    dawn, Vizaresha carrying off wicked souls in bonds, and the soul entering the
    way made by Time at the Chinvat bridge.
  language: English
