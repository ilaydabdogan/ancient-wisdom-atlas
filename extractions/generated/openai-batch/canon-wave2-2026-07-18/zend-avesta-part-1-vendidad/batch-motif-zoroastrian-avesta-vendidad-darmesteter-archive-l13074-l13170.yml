canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers questions about penalties for killing or injuring
    protected dog-like creatures and dogs. The passage identifies an evil daeva active
    from midnight until sunrise, says killing it redeems sins, and describes afterlife
    consequences for one who smites dogs: the soul passes to the other world amid
    pursuit and receives no help from souls or the dogs guarding the Kinvad bridge.
    It also gives compensation rules for maiming working dogs and penalties for killing
    a shepherd''s dog.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who kills the prickly-backed, long-thin-muzzled dog Vanghapara, called
    Dusaka by evil-speaking people, is assigned a penalty of a thousand stripes with
    each of two named instruments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daeva Zairimyangura, called Zairimyaka by evil-speaking people, is described
    as an evil creature that goes from midnight until sunrise and kills thousands
    of creatures of the good spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Whoever kills the daeva Zairimyangura/Zairimyaka has sins in thought, word,
    and deed redeemed and atoned for as by a Patet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Whoever smites a shepherd's dog, house dog, Vohunazga dog, or trained dog
    will have a soul that passes to the other world amid loud howling and fierce pursuit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: No soul will meet and help the departing soul of the dog-smiter, and the dogs
    that keep the Kinvad bridge will not help it through the otherworldly howls and
    pursuit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a shepherd's dog is maimed so that it cannot warn against a thief or wolf,
    the person who injured it must pay for the lost sheep and for the dog's wound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a house dog is maimed so that it cannot warn against a thief or wolf, the
    person who injured it must pay for the lost goods and for the dog's wound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a man kills a shepherd's dog, Ahura Mazda assigns a penalty of eight hundred
    stripes with each of two named instruments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A translator note identifies Zairimyangura as the tortoise and discusses the
    name Zairimyaka in relation to freshness of water and verdure.
  category: other
  evidence_refs:
  - ev:9
