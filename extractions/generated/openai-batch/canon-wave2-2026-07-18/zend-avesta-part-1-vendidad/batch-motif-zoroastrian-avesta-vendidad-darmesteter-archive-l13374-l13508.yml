canonical_text:
  quote: ''
  summary: A legal-religious dialogue gives Ahura Mazda's instructions for restraining
    dangerous or impaired dogs, treating some dogs to heal them, assigning penalties
    or liability when restraint is neglected, describing the dog as a divinely made
    guardian of human goods, and ranking dog-wolf hybrid offspring by their destructive
    danger to domestic dogs and folds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An interlocutor asks Ahura Mazda what Mazda-worshippers should do when a mad
    dog or a dog that bites without barking is in a worshipper's house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda instructs that such a dog be fitted with a wooden collar and tied
    to a post by the two sides of the collar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the dog is not restrained and smites a sheep or wounds a man, the dog is
    said to pay for it as for wilful murder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Repeated attacks lead to an escalating sequence of cutting off the right ear,
    left ear, right foot, left foot, and finally tail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When asked about a scentless dog or mad dog, Ahura Mazda says the worshippers
    should attend him to heal him as they would one of the faithful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If healing fails, the dog is again to be collared and tied to a post; if neglect
    leads the scentless dog to fall into a hole, well, precipice, river, or canal
    and die, the responsible people become Peshotanus.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Ahura Mazda says he made the dog self-clothed, self-shod, watchful, wakeful,
    sharp-toothed, dependent on humans for food, and watchful over human goods when
    sound of mind.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Anyone awakened by the dog's voice is warned so that neither thief nor wolf
    steals from the house; the wolf is smitten, torn, driven away, and flees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ahura Mazda ranks the wolf born of a he-dog and a she-wolf as more deserving
    death than the wolf born of a she-dog and a he-wolf.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Offspring of a he-dog and a she-wolf are described as falling on shepherd's
    dogs, house dogs, Vohunazga dogs, and trained dogs, destroying folds, and being
    especially murderous, mischievous, and destructive.
  category: attribute
  evidence_refs:
  - ev:7
