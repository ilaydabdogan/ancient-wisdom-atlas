canonical_text:
  quote: ''
  summary: In repeated cycles under Yima, the earth becomes full of flocks, herds,
    men, dogs, birds, and red blazing fires. A first-person speaker warns Yima of
    the lack of room. Yima moves toward the luminous space to meet the sun, presses
    the earth with a golden ring, bores it with a poniard, and asks Spewta Armaiti
    to open and stretch herself to bear living beings. The earth grows larger by one-third,
    later by two-thirds, and after nine hundred winters the warning recurs. Footnotes
    identify Spewta Armaiti as the genius of the earth and discuss solar-royal and
    later Yima traditions.
  language: English
  quote_policy: summarized
