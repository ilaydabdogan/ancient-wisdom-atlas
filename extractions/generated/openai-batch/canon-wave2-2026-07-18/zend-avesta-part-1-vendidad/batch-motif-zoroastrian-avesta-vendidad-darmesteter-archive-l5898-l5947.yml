canonical_text:
  quote: ''
  summary: 'The passage closes a section by saying Angra Mainyu counter-created winter
    through witchcraft. It then introduces and summarizes Fargard II: Ahura Mazda
    offers Yima the task of receiving and bringing the law to men; after Yima refuses,
    he is charged with preserving and prospering creatures. Yima keeps death and disease
    away, expands the earth three times, and, when a destructive winter approaches,
    builds a Vara to preserve seeds of animals and plants, where the blessed live
    under his rule. A commentary note also connects a passage to tales of headless
    people with eyes on their shoulders in several traditions.'
  language: English
  quote_policy: summarized
