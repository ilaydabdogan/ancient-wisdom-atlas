canonical_text:
  quote: "“the Druj Nasu flies away to the regions of the north, in the shape of a
    raging fly”"
  summary: The passage gives ritual instructions concerning corpse pollution. A way
    over which dog carcasses or human corpses have been carried is not to be used
    again by people, animals, Fire, consecrated baresma, or the faithful until a specified
    dog is made to pass along it in repeated cycles. When the dog is brought there,
    the Druj Nasu departs northward in the form of a stained raging fly. An Athravan
    then goes along the way reciting fiend-smiting prayers.
  language: English
  quote_policy: quoted
