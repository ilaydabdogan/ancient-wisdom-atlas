canonical_text:
  quote: He who sows corn, sows holiness
  summary: The passage contrasts those who till the Earth with those who do not, presents
    sowing corn as strengthening the law of Mazda, describes grain as distressing
    and expelling the Daevas, and gives a priestly saying that eating enables holy
    work, husbandry, and generation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Earth is described as bringing forth plenty of fruit, with a simile comparing
    this fertility to a loving bride on her bed bringing forth children to her beloved.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who tills the Earth with both left and right arms is addressed by the
    Earth and promised continued bearing of food and profusion of corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who does not till the Earth is addressed by the Earth and told he will
    stand at a stranger's door among beggars for bread and wait for refuse from the
    wealthy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ahura Mazda answers that the food that fills the law of Mazda is sowing corn
    again and again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sowing corn is described as sowing holiness and as making the law of Mazda
    grow higher and become fat through acts of adoration, oblations, and sacrifices.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'A sequence of grain growth and processing is linked to the Daevas'' reactions:
    they start up when barley comes forth, faint when corn grows rank, groan when
    corn is ground, and are destroyed when wheat comes forth.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Daevas are said to be unable to stay in a house where wheat is coming
    forth and to experience plenty of corn as though red-hot iron were in their throats.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The priest is instructed to teach that one who does not eat lacks strength
    for works of holiness, husbandry, and begetting children, and that every material
    creature lives by eating and dies by not eating.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage ends by asking who is the fifth that rejoices the Earth with greatest
    joy; the answer is not included in the provided excerpt.
  category: speech
  evidence_refs:
  - ev:8
