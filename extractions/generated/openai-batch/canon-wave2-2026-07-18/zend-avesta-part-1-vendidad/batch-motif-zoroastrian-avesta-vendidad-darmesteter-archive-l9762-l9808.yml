canonical_text:
  quote: ''
  summary: 'The supplied range contains a transition from a healing passage into Vendidad
    VIII. Ahura Mazda answers questions about how long ground or earth remains affected
    after contact with the corpse of a dead man: one year when the corpse lies on
    the ground under heavenly light and sun, and fifty years when the corpse is buried
    in the earth. Notes explain that being “itself again” means restored to purity
    and fit to till, and that the ground remains Nasu until that time. A footnote
    also comments on healing by the holy word and the Barashnum ceremony.'
