canonical_text:
  quote: ''
  summary: The passage explains Zoroastrian purity rules concerning corpses, bodily
    emissions, and menstruation. Corpses are exposed on mountains or in Dakhmas, away
    from people and elements such as water, tree, fire, and earth. The text distinguishes
    defiling corpses of beings belonging to Ahura from non-defiling Ahrimanian creatures.
    It also treats breath, hair, nail cuttings, and menstrual blood as sources of
    impurity associated with demonic power, requiring ritual separation or protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that earlier Persian burial practices persisted, while
    priests developed scruples about defiling a god and later Magian observances became
    general law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A corpse is to be laid on a mountain summit far from man, water, tree, fire,
    and earth, with a layer of stones or bricks separating it from the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Special buildings called Dakhmas were erected for corpse exposure, and the
    dead were left far from the world, beholding the sun.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Dakhma is described in a note as a round stone building or Tower of Silence
    with a pit, pavement, surrounding wall, entrance, and drainage to closed pits.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that only corpses of beings belonging to the world of Ahura
    defile, because in their death the demon triumphs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The corpse of an Ahrimanian creature is said not to defile and to become clean
    by dying.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The faithful are said not to be defiled by the corpse of an Ashemaogha or
    a Khrafstra, and killing them is described as a pious work like killing Ahriman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage treats bodily emissions as partial death: what leaves the body
    is dead and becomes property of the demon; breath is unclean and must not be used
    to blow fire.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Parings of nails and cuttings or shavings of hair are described as unclean
    and as possible weapons in the hands of demons unless protected by rites and spells.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Menstruation is said to be sent by Ahriman; a menstruating woman is described
    as unclean and possessed, confined apart from the faithful and the fire, restricted
    in food, and fed from a distance with a long leaden spoon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The commentator says similar notions are found among peoples far removed from
    one another, but in Persia they were made part of the whole religious system.
  category: other
  evidence_refs:
  - ev:10
