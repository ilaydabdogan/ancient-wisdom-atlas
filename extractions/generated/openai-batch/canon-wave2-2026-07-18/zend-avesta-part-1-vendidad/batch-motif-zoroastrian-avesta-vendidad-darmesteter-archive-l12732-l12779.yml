canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers questions about how long kin should stay after deaths
    of children or siblings, distinguishing thirty days for the righteous and sixty
    days for sinners. He also gives repeated instructions for cleansing a house: washing
    bodies and clothes three times, chanting the Gathas three times, making offerings
    to Fire, offering baresma, and bringing libations to good waters so that the house
    becomes clean and sacred presences may enter.'
  language: English
  quote_policy: summarized
