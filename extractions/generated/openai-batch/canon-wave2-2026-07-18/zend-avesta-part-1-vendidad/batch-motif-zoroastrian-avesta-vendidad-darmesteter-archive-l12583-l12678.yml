canonical_text:
  quote: ''
  summary: The passage gives liturgical formulas for driving away Angra Mainyu, Aeshma,
    the Nasu, and the Druj through repeated chants and protective prayers to Mazda,
    Airyaman, and Armaiti Spenta. It then introduces Fargard XII with an editorial
    note on manuscript transmission and explains that the chapter concerns periods
    of staying or seclusion for near relatives of the dead, who are treated as unclean
    through relationship with the deceased.
  language: English
  quote_policy: summarized
