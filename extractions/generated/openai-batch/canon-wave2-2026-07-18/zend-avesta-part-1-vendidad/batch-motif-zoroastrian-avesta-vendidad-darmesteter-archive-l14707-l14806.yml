canonical_text:
  quote: ''
  summary: The passage closes a purity-law section with penalties and condemnation
    of intercourse with a woman who has a blood issue. It then introduces Fargard
    XVII on hair and nails, explaining that bodily matter separated from a person
    is treated as dead matter vulnerable to Ahriman or demons unless ritually contained.
    Zarathustra asks what deed increases the strength of the Daevas like a sacrifice,
    and Ahura Mazda answers that careless disposal of cut hair or nails in a hole
    or crack does so.
  language: English
  quote_policy: summarized
