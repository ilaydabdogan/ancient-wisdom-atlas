canonical_text:
  quote: ''
  summary: The passage describes death defilement by Nasu as grievous to celestial
    bodies and pleasing purification as delighting fire, water, earth, cow, trees,
    and the faithful. Zarathustra asks Ahura Mazda about the reward for one who cleanses
    Nasu-defilement, and Ahura Mazda promises welfare in the blessed abode in the
    other world. Zarathustra then asks how to fight the Druf and Nasu that come from
    the dead against the living; Ahura Mazda commands repeated recitation of Gathic
    words, after which the Druf fades away.
  language: English
