canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for digging a sequence of holes with
    seasonal depths and measured spacing, drawing furrows around them with a metal
    knife, setting hard materials as steps, and having the unclean person approach
    while Zarathustra stands outside the furrow and recites. Notes identify gomez
    and water in the holes and explain the furrow or kesh as a spell-drawn boundary
    used against the Drug or fiend.
  language: English
