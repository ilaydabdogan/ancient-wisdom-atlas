  summary: The passage is a scholarly introduction discussing evidence for Mazdean
    beliefs before and during the Achaemenian period. It lists major tenets such as
    two opposing principles, Ormazd and Ahriman, opposing creations, a finite world,
    final defeat of evil, resurrection, and everlasting life. It also discusses Magian
    practice, Achaemenian inscriptions, Herodotus, mountain worship identified with
    Ormazd, ritual killing of noxious animals, and a comparative note about beings
    or objects that cast no shadow.
