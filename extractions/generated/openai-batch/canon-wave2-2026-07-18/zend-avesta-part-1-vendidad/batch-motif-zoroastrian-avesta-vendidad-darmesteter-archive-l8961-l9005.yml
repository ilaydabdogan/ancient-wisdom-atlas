canonical_text:
  quote: ''
  summary: A ritual-legal dialogue asks what should be done when a decomposing corpse
    is in water. Ahura Mazda instructs that as much of the corpse as possible should
    be removed and laid on dry ground, defines the extent of pond-water defilement
    attributed to the Dru^ Nasu, and states that after the corpse is removed and a
    portion of the water drawn off, the remaining water is clean and drinkable by
    cattle and men. A note adds a commentary tradition about merit and sin in removing
    or failing to remove the corpse.
  language: English
  quote_policy: summarized
