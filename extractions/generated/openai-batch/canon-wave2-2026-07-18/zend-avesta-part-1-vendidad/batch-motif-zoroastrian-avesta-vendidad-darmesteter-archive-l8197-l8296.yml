  quote: ''
  summary: In Fargard V.55, Ahura Mazda rejoices Zarathustra and declares purity,
    obtained through Mazda's law and good thoughts, words, and deeds, to be the greatest
    good after life. A question asks how the fiend-destroying law of Zarathustra surpasses
    all other utterances. Ahura Mazda answers with comparisons to the sea Vouru-kasha
    above floods, a great stream above a rivulet, a great tree above small plants,
    and heaven above earth. The passage then turns to ritual authority involving the
    Ratu, the Sraosha-varez, and draona-services, but the supplied excerpt ends mid-sentence.
  language: English
