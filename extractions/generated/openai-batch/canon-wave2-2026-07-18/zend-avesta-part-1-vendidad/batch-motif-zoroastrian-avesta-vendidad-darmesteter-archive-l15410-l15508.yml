canonical_text:
  quote: ''
  summary: The passage gives an instruction to use fire-containing names, then presents
    Sraosha questioning the Druj about a person over fifteen who walks without the
    sacred girdle and shirt. The Druj says Daevas wither such a person at the fourth
    step and that no countermeasure exists. A new section has Ahura Mazda invite Zarathustra’s
    questions; Zarathustra asks who grieves him most, and Ahura Mazda identifies Cahi,
    whose look dries waters and withers vegetation.
  language: English
  quote_policy: summarized
