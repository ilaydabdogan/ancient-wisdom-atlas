canonical_text:
  quote: ''
  summary: The passage discusses the loss and preservation of Mazdean sacred literature.
    It states that much literature was destroyed or lost after the Arab conquest and
    during the Parsi exodus, while liturgical texts such as the Vendidad were better
    preserved. It also reports a Parsi tradition that the original Avesta, revealed
    by Ormazd to Zoroaster and by Zoroaster to King Vistasp, consisted of twenty-one
    Nosks, most of which were burnt by Iskander/Alexander; afterward priests collected
    surviving fragments and remembered material to form the present collection.
  language: English
  quote_policy: summarized
