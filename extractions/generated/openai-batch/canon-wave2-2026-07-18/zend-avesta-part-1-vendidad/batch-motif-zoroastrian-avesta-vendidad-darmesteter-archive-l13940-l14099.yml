canonical_text:
  quote: ''
  summary: The passage lists required acts of atonement for an offense against the
    soul of the water dog, including gifts of agricultural implements, precious metal,
    running water, arable land, a house, beds, a virgin maid, cattle, whelps, bridges,
    repaired stables, dog-cleansing, and feasting of holy men. Ahura Mazda gives measurements
    and valuations in response to questions. The passage states that completing the
    atonement leads to the world of the holy ones, while failure leads to the dark
    world of the wicked. It then begins a new section on sins that make a person a
    Peshotanu, including knowingly teaching a wrong foreign creed to one of the faithful.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is instructed to give godly men agricultural implements as atonement
    for the soul of the water dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The required agricultural implements include a plough, share, yoke, ox whip,
    stone mortar, hand-mill, and spade.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The person must provide silver valued at the price of a stallion and gold
    valued at the price of a camel.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The person must procure a rill of running water for godly husbandmen; Ahura
    Mazda defines it by the depth and breadth of a dog.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person must give arable land to godly men; Ahura Mazda defines the amount
    as what can be watered by the rill on both sides.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The person must procure a house with ox-stalls and provide beds with cushions
    for godly men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The person must give a virgin maid to a godly man, identified by Ahura Mazda
    as the person’s sister or daughter of puberty age, past her fifteenth year, with
    earrings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The person must give twice seven small cattle, bring up twice seven whelps,
    throw twice seven bridges over canals, repair twice nine stables, cleanse twice
    nine dogs, and feed twice nine godly men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the atonement is undergone, the person enters the world of the holy ones;
    if not, the person falls into the world of the wicked, described as dark and made
    of darkness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ahura Mazda says there are five sins that, if committed without confession
    or atonement, make the committer a Peshotanu.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The first listed sin is knowingly teaching one of the faithful a foreign,
    wrong creed or law.
  category: speech
  evidence_refs:
  - ev:10
