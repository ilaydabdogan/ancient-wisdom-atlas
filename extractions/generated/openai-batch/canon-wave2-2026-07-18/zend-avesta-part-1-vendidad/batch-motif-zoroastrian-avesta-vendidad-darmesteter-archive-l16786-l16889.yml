canonical_text:
  quote: If death come at night, may healing come at dawn!
  summary: The passage contains invocations for healing and renewal, commands to waters
    to circulate between sea, sky, and earth, prayers for the sun and moon to rise
    above Hara Berezaiti and give light, and a holy spell for cleansing birth and
    making a woman fertile. Translator notes connect the water and light cycle with
    Hara/Alborz and Vouru-kasha, and explain the moon as keeper of the bull's seed.
  language: English
  quote_policy: quoted
