canonical_text:
  quote: ''
  summary: Ahura Mazda identifies the bird Parodany or Parodar, also called Kahrkatas,
    as the bird that raises its voice at dawn. The bird calls people to arise, recite
    the Ashem prayer against the Daevas, and resist Bushyasta, who urges the living
    world back to sleep. The passage gives an ethical instruction on good and bad
    thoughts, words, and deeds. Fire, called the son of Ahura Mazda, asks different
    helpers in successive parts of the night to tend it with clean wood and washed
    hands because Azi, made by the Daevas, seeks to extinguish it. Sraosha is then
    said to wake the bird, which repeats the dawn warning.
  language: English
  quote_policy: summarized
