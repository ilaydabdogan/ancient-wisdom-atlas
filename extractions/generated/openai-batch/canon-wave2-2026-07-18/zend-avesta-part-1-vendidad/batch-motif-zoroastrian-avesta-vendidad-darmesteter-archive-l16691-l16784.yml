canonical_text:
  quote: ''
  summary: The supplied range contains prayers against the fiend, an outline of Fargard
    XXI as concerned with waters and light, a praise of the holy bull, and an invocation
    calling clouds and rain to descend in many drops to destroy sickness and death.
    A short formula contrasts death arriving at one time of day with healing arriving
    at the opposite time. Translator notes connect the primeval bull with Ormazd,
    Ahriman, and older cloud-bull rain imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening prayer says that the will of the Lord is the law of holiness and
    that Vohu-mano's riches are given to one who works for Mazda and relieves the
    poor with power given by Ahura.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker asks Mazda who has been placed to protect him while the fiend's
    hate grasps him, naming Atar and Vohu-mano in connection with the holy world's
    continuance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks who will smite the fiend to maintain Mazda's ordinances and
    asks that Sraosha come with Vohu-mano to help whom Mazda pleases.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A command tells the fiendish Druj, the brood of the fiend, and the world of
    the fiend to perish away to the northern regions and no longer give the living
    world of the holy spirit to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Fargard XXI is presented under the title 'Waters and Light' and is outlined
    as including praise of the holy bull, invocation to rain, invocations to waters
    and the lights of sun, moon, and stars, and spells against disease.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The holy, beneficent bull is hailed as making increase and growth, giving
    gifts to faithful people and the unborn faithful, and being killed by Cahi, the
    ungodly Ashemaogha, and the wicked tyrant.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Clouds are called to come along the sky, through the air, and down onto the
    earth in thousands and myriads of drops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cloud and rain invocation is directed toward destroying sickness and death,
    including sickness and death made by Gaini, as well as Gadha and Apagadha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage pairs death coming at eve with healing coming at daybreak, and
    death coming at daybreak with healing coming at night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A translator note identifies the primeval bull as created by Ormazd and killed
