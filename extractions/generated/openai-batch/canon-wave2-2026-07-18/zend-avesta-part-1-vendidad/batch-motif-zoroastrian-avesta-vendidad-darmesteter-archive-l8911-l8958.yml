canonical_text:
  quote: ''
  summary: The passage gives ritual-legal questions and answers concerning dead dog
    or human remains. It states escalating penalties when bones or a whole body are
    thrown on the ground and grease or marrow flows from them. It then asks what a
    Mazda-worshipper should do upon finding a corpse in running water; Ahura Mazda
    instructs him to remove shoes and clothes, enter the river, and take the dead
    out of the water.
