canonical_text:
  quote: ''
  summary: The passage states rules about not wasting valuable material by putting
    clothing on a corpse, gives an afterlife consequence for that act, and begins
    a section on death pollution of ground. Ground where dogs or men have died must
    lie fallow for a year; premature sowing or watering is sinful and penalized. To
    restore ground for tillage, worshippers must inspect for bodily remains, and specific
    penalties are given for neglecting this or throwing a bone that leaks grease or
    marrow onto the ground. Translator notes compare later and foreign funerary clothing
    customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda is presented as not allowing anything valuable to be wasted, even
    a very small amount of thread.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who throws clothing on a dead body, even a small amount, is said
    not to be pious while alive and not to have a place in the happy realm when dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same sinner is said to go to the world of fiends, described as a dark
    world made of darkness, through his own doings and soul.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A translator's note says the dead must lie naked or clothed only with the
    light of heaven, and notes a later custom of using old, washed clothing rather
    than new clothing.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: A translator's note quotes a later tradition in which every unnecessary shroud
    thread becomes a black snake in the other world, clinging to the shroud-maker's
    heart.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: A translator's note contrasts the rule with Greek practice of dressing the
    dead in gay attire, while also noting later offerings of rich garments to the
    soul.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ground on which dogs or men have died must lie fallow for one year, and no
    worshipper of Mazda is to sow or water that part of the ground during that year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the ground is sown or watered within the year, the sin is equated with
    bringing dead matter to water, earth, and plants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stated penalty for sowing or watering the contaminated ground within the
    year is two hundred stripes with the Aspahe-astra and two hundred with the Sraosho-karana.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: To make the ground fit for tillage again, worshippers must look for bones,
    hair, flesh, dung, or blood on the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Failing to inspect for those remains carries the same stated penalty of two
    hundred stripes with each named implement.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Throwing onto the ground a small bone of a dead dog or dead man, if grease
    or marrow flows from it, carries a stated penalty of thirty stripes with each
    named implement.
  category: action
  evidence_refs:
  - ev:8
