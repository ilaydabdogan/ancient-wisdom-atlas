canonical_text:
  quote: There shall be, while I am king, neither cold wind nor hot wind, neither
    disease nor death.
  summary: The passage introduces Fargard II as combining myths of Yima with traditions
    about world-ending winter, renewal, and later fiery destruction. In the narrative,
    Zarathustra asks Ahura Mazda who was the first mortal taught by him. Ahura Mazda
    identifies Yima, asks him to bear the divine law, accepts Yima's refusal, and
    instead commissions him to make the worlds thrive, nourish, rule, and watch over
    them. Yima accepts and promises a reign without extreme winds, disease, or death.
    Ahura Mazda gives Yima a golden ring and a gold-inlaid poniard as signs and instruments
    of sovereignty; under Yima the earth becomes filled with living beings.
  language: English
  quote_policy: quoted
