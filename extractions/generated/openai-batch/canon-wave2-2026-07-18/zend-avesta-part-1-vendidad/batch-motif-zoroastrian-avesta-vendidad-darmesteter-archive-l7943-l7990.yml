canonical_text:
  quote: ''
  summary: A question asks what penalty applies when a man waters a corn field and
    an animal carries a corpse into the stream. Ahura Mazda answers that no sin falls
    on a man for dead matter brought by animals, winds, or flies, because otherwise
    the world would be filled with excluded Peshotanus whose souls cry and wail. A
    following question asks whether water kills, and notes discuss irrigation inspection,
    corpse contact, and the holy status of water and fire.
