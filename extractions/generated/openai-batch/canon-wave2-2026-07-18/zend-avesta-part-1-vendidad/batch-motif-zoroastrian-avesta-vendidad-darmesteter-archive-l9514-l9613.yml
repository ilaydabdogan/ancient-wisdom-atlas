canonical_text:
  quote: ''
  summary: The passage describes the Druj Nasu making persons unclean, then presents
    a dialogue in which Zarathustra asks Ahura Mazda whether wood, corn, or fodder
    touched by dead matter from a dead dog or man can be made clean. Ahura Mazda gives
    procedures involving separating the material on the ground at measured distances
    around the dead matter and sprinkling it once with water. The instructions vary
    according to whether the material is dry or wet and according to the condition
    involving corpse-eating dogs or birds.
  language: English
  quote_policy: summarized
