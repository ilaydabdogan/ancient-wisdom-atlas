canonical_text:
  quote: ''
  summary: 'The passage first contrasts the living and dead Ashemaogha: while alive
    he defiles the good creation, harms water, fire, cattle, and faithful people,
    and deprives the faithful of goods; when dead he does not do these acts. It then
    introduces Fargard XIII on dogs, identifies Vanghapara/Duzaka as a prickly-backed,
    long-muzzled good creature that kills creatures of the evil spirit from midnight
    until sunrise, and states that killing it damages the killer''s soul for nine
    generations and blocks passage over the Cinvat bridge unless atoned by sacrifice
    to Sraosha. Editorial notes connect the hedgehog image with solar rays and note
    the power of the creature''s high name.'
  language: English
  quote_policy: summarized
