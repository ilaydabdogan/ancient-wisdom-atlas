canonical_text:
  quote: ''
  summary: 'The passage is a contents listing for sections of the Vendidad. It names
    cleansing instructions, the duration of the Upaman for relatives, and several
    sections concerning dogs: the dog of Ormazd and the dog of Ahriman, named forms
    identified as hedge-hog and tortoise, offences against dogs, duties and food owed
    to dogs, care of mad dogs, praise and classification of dogs including wolf-dog
    and water dog, and atonement for murdering a water dog. It also begins a section
    on five sins that make a sinner a Peshotanu.'
