canonical_text:
  quote: ''
  summary: Yima enlarges the earth after addressing Spenta Armaiti, and living beings
    come forth according to his wish. Ahura Mazda and Yima convene parallel assemblies
    of gods and mortals in Airyana Vaejo by the river Daitya. Ahura Mazda warns Yima
    that fatal winters with frost and deep snow will fall on the material world, causing
    beasts in several habitats to perish, and begins instructing him to make a Vara,
    glossed in a note as an enclosure. Translator notes compare later/commentarial
    versions to a deluge tradition.
  language: English
  quote_policy: summarized
