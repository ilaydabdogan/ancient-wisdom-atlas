canonical_text:
  quote: ''
  summary: 'The passage gives repeated answers by Ahura Mazda on how to cleanse a
    house: bodies and clothes are washed three times, the Gathas are chanted three
    times, offerings are made to Fire, baresma is offered, and libations are brought
    to good waters; afterward the house is clean and waters, fire, and the Amesha-Spentas
    may enter. It also gives stay durations after deaths of cousins and descendants
    of cousins, with longer durations for sinners than for the righteous, and ends
    by raising the case of a stranger who does not profess the true faith or law.'
  language: English
  quote_policy: summarized
