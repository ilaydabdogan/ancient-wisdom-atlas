canonical_text:
  quote: A maid bathing in the lake Kasava will conceive by it
  summary: The passage summarizes an eschatological myth in which Zarathustra's seed
    is preserved by divine beings, guarded by Fravashis, and later causes a bathing
    maid at Lake Kasava to conceive the victorious Saoshyant, who will liberate the
    world, raise the dead, and begin immortality. The remainder argues against a simple
    Iranian-Vedic religious schism, discussing Asura, Daeva, Indra, Naunghaithya,
    Sauru, and related Vedic or Avestan names as evidence for shared or shifted religious
    vocabulary.
  language: English
  quote_policy: quoted
