canonical_text:
  quote: ''
  summary: In this Vendidad passage, Ahura Mazda says he brought down many healing
    plants growing around the one Gaokerena to oppose sickness and corruption attributed
    to Angra Mainyu. The prayer calls health upon mortal bodies through blessing-spells,
    prayers, and praises; commands sickness, death, pain, fever, and disease to depart;
    asks for the Druj to be smitten; drives away diseases, Yatus, Pairikas, and wicked
    beings; and invokes Airyaman for the rejoicing of Zarathustra’s faithful community.
  language: English
  quote_policy: summarized
