canonical_text:
  quote: ''
  summary: In a question-and-answer passage, Zarathustra asks Ahura Mazda where the
    bodies and bones of the dead should be laid. Ahura Mazda prescribes high summits
    with corpse-eating dogs and birds, fastening the corpse to prevent bones from
    reaching water and trees, penalties for failure, and construction of a Dakhma-like
    building for remains if possible. If the building cannot be afforded, the dead
    man is laid on the ground under the open light of heaven and sun. The supplied
    range also includes the beginning and synopsis of Fargard VII, which describes
    Nasu’s action on the dead and the cleansing of defiled objects.
  language: English
  quote_policy: summarized
