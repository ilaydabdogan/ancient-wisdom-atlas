canonical_text:
  quote: ''
  summary: An introductory passage interprets Zarathustra as a demon-smiter and lawgiver
    whose chief weapon is the holy word or prayer. It describes his awaited birth,
    creation rejoicing at his growth, Ahura Mazda seeking a boon from Ardvi Sura Anahita
    for him, fiends attacking and fleeing, Angra Mainyu being repelled by stones and
    sacred formulas, and Zarathustra conversing with Ahura on the mountain and in
    the forest of holy questions. The passage also makes explicit comparisons with
    storm-god and divine-voice patterns in other traditions.
  language: English
  quote_policy: summarized
