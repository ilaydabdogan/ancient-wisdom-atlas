canonical_text:
  quote: ''
  summary: Ahura Mazda speaks of making a beautiful shining mansion. Angra Mainyu,
    described as a deadly ruffian, looks at him and creates a vast number of diseases
    by witchcraft. The speaker calls on Airyaman to heal him and promises offerings
    of livestock for sacrifice to the holy Saoka, along with a blessing-spell that
    restores the sick. Airyaman sets off toward the mountain and forest of the holy
    questions, bringing groups of nine animals, nine twigs, and drawing nine furrows.
    A drive-away formula expels named harmful beings, sickness, death, pain, fever,
    and diseases attributed to Angra Mainyu.
  language: English
  quote_policy: summarized
