  quote: ''
  summary: The passage gives a series of questions to Ahura Mazda about the reward,
    after a man's soul has parted from his body, for bringing different kinds of used
    or defiled fire to the Daityo-gatu. Ahura Mazda answers with reward equivalents
    measured in fire-brands. A note explains Daityo-gatu as the Bahram fire, the sacred
    center to which earthly fires return.
