canonical_text:
  quote: ''
  summary: Ahura Mazda identifies Gathic words to be recited four times, followed
    by fiend-smiting and healing expulsion formulas. The formulas drive named daevas
    and hostile beings away from house, borough, town, land, defiled bodies, local
    authorities, and the holy world. The words are said to smite Angra Mainyu and
    all daevas and to stand against Druf/Nasu, who defiles the living from the dead.
    Zarathustra is then instructed to dig nine holes in ground with little water and
    few trees, because purity is said to be the greatest good after life.
  language: English
  quote_policy: summarized
