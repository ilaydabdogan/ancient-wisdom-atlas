canonical_text:
  quote: ''
  summary: 'A dialogue gives rules for a person who has touched a corpse in a distant
    place: conditional washings with gomez, running prescribed distances while requesting
    cleansing, transfer of trespass to those who refuse to cleanse him, final cleansing
    with gomez and water, and penalties for defiling water or fire through contact
    with water or trees on the way.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda is addressed and answers a question concerning one who has touched
    a corpse in a distant place in the fields.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the Nasu has already been smitten by corpse-eating dogs or corpse-eating
    birds, the person is to wash his body with gomez thirty times and rub it dry with
    the hand thirty times, beginning each time with the head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Nasu has not yet been smitten by corpse-eating dogs or corpse-eating
    birds, the person is to wash his body with gomez fifteen times and rub it dry
    with the hand fifteen times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The person must run a Hathra until he meets a man and loudly state that he
    touched a corpse without wilful sin of mind, tongue, or hand and wishes to be
    made clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the first, second, and third men encountered will not cleanse him, the
    refusal is described as putting a third, a half, and then the whole of his trespass
    upon the refuser's own head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person is to continue until near a house, borough, town, or inhabited
    district, cry out the same declaration, and if not cleansed there, cleanse his
    body with gomez and water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the person found water on his way, the water is said to require atonement,
    with a penalty of four hundred stripes with each of two named instruments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the person found trees on his way, the fire is said to require atonement,
    with the same stated penalty of four hundred stripes with each of two named instruments.
  category: action
  evidence_refs:
  - ev:6
