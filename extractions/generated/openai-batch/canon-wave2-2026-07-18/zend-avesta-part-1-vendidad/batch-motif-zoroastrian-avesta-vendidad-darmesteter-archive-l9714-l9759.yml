  quote: ''
  summary: 'The excerpt prescribes graded compensation for healing different human
    and animal patients, including ranked household or territorial heads, their wives,
    a son of a borough lord, oxen, and sheep. It then introduces several healers offering
    themselves together: one heals with the knife, one with herbs, and one with the
    holy word. Translator notes explain a blessing as holiness or paradise, cross-reference
    another Vendidad fee tariff, and compare verbal healing to spells and Greek healing
    traditions.'
