canonical_text:
  quote: ''
  summary: The passage describes nineteenth-century scholarly debates over the Zend-Avesta.
    It recounts the decipherment of ancient Persian inscriptions at Persepolis and
    Behistun, which supported the authenticity of the Zend books, then introduces
    a controversy between interpreters who relied on Pahlavi tradition and those who
    relied on comparison with the Vedas. The passage presents the Vedic scholars'
    claim that the Vedas illuminate Avesta language, gods, and heroes, and then gives
    the traditional school's reply that relationship is not identity and that tradition
    is needed to understand Persian developments.
  language: English
  quote_policy: summarized
