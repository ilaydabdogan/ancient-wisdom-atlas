canonical_text:
  quote: ''
  summary: In a repeated legal exchange, questions ask who must care for a pregnant
    bitch lying in various built or held places. Ahura Mazda answers that the builder
    or holder of the place must support her until the whelps are born, and that failure
    causing harm to the whelps incurs the penalty for wilful murder. A commentary
    note adds a rule for a bitch lying on the high road.
  language: English
  quote_policy: summarized
