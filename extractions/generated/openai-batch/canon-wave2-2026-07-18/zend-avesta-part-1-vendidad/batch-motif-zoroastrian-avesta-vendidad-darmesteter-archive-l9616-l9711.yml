canonical_text:
  quote: ''
  summary: The passage gives ritual rules for cleaning corn that has been near dead
    matter or Nasu, then turns to a legal-medical dialogue in which Ahura Mazda says
    an aspiring healer should first prove knife-treatment skill on Daeva-worshippers.
    Three deaths disqualify him permanently; three recoveries qualify him permanently;
    a disqualified healer who wounds a Mazda-worshipper incurs the penalty for wilful
    murder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the Nasu has been affected by corpse-eating dogs or birds, corn is to
    be laid apart on the ground around the dead matter at different measured lengths
    depending on whether the corn is dry or wet, then sprinkled once with water and
    declared clean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quantity of corn around dead matter is regulated according to whether
    the corn is dry or wet, sown or not sown, reaped or not reaped, ground or not
    ground, and kneaded or not kneaded; after one sprinkling with water, it is clean.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker asks Ahura Mazda whether a Mazda-worshipper who wants to practice
    healing should first prove skill on Mazda-worshippers or on Daeva-worshippers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ahura Mazda answers that the candidate should first prove himself on Daeva-worshippers
    rather than Mazda-worshippers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the candidate treats three Daeva-worshippers with the knife and each dies,
    he is forever unfit to practice healing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A healer who has failed in that way must not attend, treat with the knife,
    or wound any Mazda-worshipper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If such a healer wounds a Mazda-worshipper with the knife, he is to pay the
    same penalty as for wilful murder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the candidate treats three Daeva-worshippers with the knife and each recovers,
    he becomes forever fit to practice healing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After qualification, the healer may attend Mazda-worshippers, treat them with
    the knife, and heal them with the knife.
  category: action
  evidence_refs:
  - ev:7
