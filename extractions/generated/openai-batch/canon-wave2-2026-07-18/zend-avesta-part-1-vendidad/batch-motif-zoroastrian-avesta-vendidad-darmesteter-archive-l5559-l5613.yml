canonical_text:
  quote: ''
  summary: 'Editorial notes frame the passage as cosmology rather than migration history,
    describe Angra Mainyu''s counter-creations as vices and plagues, and discuss possible
    dating from the mention of the Seven Rivers. The Vendidad passage then has Ahura
    Mazda speak to Spitama Zarathustra, saying that he made every land dear to its
    dwellers so that the living world would not all invade Airyana Vaejo. A note summarizes
    an alternating process: Ahura Mazda creates a delightful land, and the destructive
    adversary brings a counter-creation against it.'
