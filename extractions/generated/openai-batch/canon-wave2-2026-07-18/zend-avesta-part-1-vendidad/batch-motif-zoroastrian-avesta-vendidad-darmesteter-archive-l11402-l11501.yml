canonical_text:
  quote: ''
  summary: The passage closes a prior section by stating that an atoning penalty saves
    the one who submits to it, while refusal leads to dwelling in the mansion of the
    Drug. It then introduces Fargard IX, the nine nights' Barashnum, described as
    a major purification rite. Zarathustra asks Ahura Mazda how to cleanse a body
    defiled by the dead. Ahura Mazda instructs that a qualified godly man prepare
    a clean dry space, fell trees on a nine-Vibazu square, keep prescribed distances
    from fire, water, baresma, and the faithful, and begin digging ritual holes with
    seasonal depths.
  language: English
  quote_policy: summarized
