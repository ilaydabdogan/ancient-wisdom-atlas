canonical_text:
  quote: ''
  summary: 'The passage closes a preceding penalty statement attributed to Ahura Mazda,
    then opens Fargard XVI. In dialogue form, it gives rules concerning a woman with
    an issue of blood: a separate place is to be prepared, distances are prescribed
    from fire, water, consecrated baresma, and the faithful, food is delivered at
    a distance in metal vessels with a limited ration, and a child who touches her
    must be washed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda states a penalty involving seven hundred stripes with each of
    two named implements.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heading describes Fargard XVI as concerning the uncleanness of women during
    their sickness, how it can be removed, and related laws.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: An unnamed speaker asks what Mazda worshippers should do if a woman in a worshipper's
    house has an issue of blood, whether outside the ordinary course or at the usual
    period.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ahura Mazda instructs that the way be cleared of wood, dry dust be strewn
    on the ground, and a building be erected higher than the house so that the woman's
    look does not fall upon the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman is to be kept fifteen paces from the fire, water, and consecrated
    baresma bundles, and three paces from the faithful.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The person who brings food to the woman is to remain three paces from her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Food and bread are to be brought in vessels of brass, lead, or another common
    metal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The specified ration is two danares of long bread and one danare of milk pap,
    with the stated purpose of preventing her from gathering strength.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a child has just touched the woman, the child's hands are to be washed
    first and then the child's body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Editorial notes identify the separate building or way as the Dashtanistan
    and explain the clearing and dust-strewing as measures against touching and defiling
    wood or earth.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: An editorial note explains that metal vessels can be made clean, unlike defiled
    earthen vessels.
  category: other
  evidence_refs:
  - ev:10
