canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about places where the Earth feels grief
    or joy. The Earth grieves where Angra Mainyu's creatures have many burrows and
    where the family of a faithful person is driven into captivity. The Earth rejoices
    when corpses and corpse-platforms are removed. A man must not carry a corpse alone,
    because Nasu defiles him permanently; such a man is assigned to an isolated, dry,
    clean place away from water, plants, Fire, sacred bundles, herds, and the faithful.
  language: English
  quote_policy: summarized
