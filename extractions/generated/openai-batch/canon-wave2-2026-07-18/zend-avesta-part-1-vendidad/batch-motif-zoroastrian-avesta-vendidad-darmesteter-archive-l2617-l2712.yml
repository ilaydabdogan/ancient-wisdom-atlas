  quote: ''
  summary: 'The passage argues that “Magi” was an origin or tribal designation rather
    than the Avestan functional term for priest, identifies Athravan as the Avestan
    priestly term meaning “fire-man,” and summarizes a Median origin for the Avesta.
    Notes within the passage refer to mythic or legendary material: an unnamed figure
    praying to Ahriman and being bound to Mount Damavand, and a Yasna episode in which
    Haoma overthrows Keresani, compared by the author with Vedic Kri''sanu, who withholds
    Soma from humans.'
