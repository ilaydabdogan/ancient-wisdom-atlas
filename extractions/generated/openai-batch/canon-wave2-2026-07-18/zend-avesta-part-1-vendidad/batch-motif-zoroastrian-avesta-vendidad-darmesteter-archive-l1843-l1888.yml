canonical_text:
  quote: ''
  summary: 'The passage presents a philological argument that the Avesta’s Zend language
    points to a pre-Sassanian groundwork: Zend is described as not the national language
    of Persia, distinct from ancient Persian, and different from Pahlavi, the Persian
    language of the Arsacid and Sassanian periods. The author argues that Sassanian
    adoption of Zend as a religious language implies pre-existing sacred writings
    in Zend, while also cautioning that this does not prove every Avesta text is pre-Sassanian.'
  language: English
  quote_policy: summarized
