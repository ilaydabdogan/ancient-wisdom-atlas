canonical_text:
  quote: ''
  summary: The passage explains ritual impurity associated with childbirth, especially
    after a still-born child, including gomez, restrictions on water, danger during
    the first three days after delivery, and apotropaic fire against fiends. It then
    describes sickness as uncleanness or possession caused by Ahriman and treated
    by washings and spells, with spell-medicine valued above knife and drug medicine.
    Notes compare related birth-protection customs involving fire, a sword, fairy
    Aal, Roman threshold gods, and Sylvanus.
  language: English
  quote_policy: summarized
