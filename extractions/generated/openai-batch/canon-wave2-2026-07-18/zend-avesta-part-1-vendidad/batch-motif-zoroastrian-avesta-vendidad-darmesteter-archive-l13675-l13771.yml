canonical_text:
  quote: ''
  summary: 'The supplied passage closes a preceding ritual sequence in which three
    nights of fire, baresma, and Haoma are followed by restored fertility and health.
    Fargard XIV is introduced as an appendix on atonement for killing a water dog.
    Zarathustra asks Ahura Mazda what penalty is due when someone kills such a water
    dog. Ahura Mazda answers with a sequence of punishments and ritual obligations:
    many stripes, large offerings of hard and soft wood to the fire of Ahura Mazda,
    consecrated baresma, Zaothra libations with Haoma and sacred meat to the good
    waters, and the killing of snakes.'
  language: English
  quote_policy: summarized
