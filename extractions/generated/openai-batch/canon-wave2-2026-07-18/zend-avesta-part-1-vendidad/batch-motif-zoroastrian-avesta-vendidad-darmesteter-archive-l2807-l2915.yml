  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Magi ascended the throne with Ardeshir, one of their
    pupils, and that Magian observances became the law of all Iran.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the strictness of Magian observances made their triumph short-lived
    and describes the triumph of Islam as a deliverance for the consciences of many.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage summarizes Magism as teaching that the present world is twofold
    and is the work of two hostile beings, Ahura Mazda and Angra Mainyu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage identifies Ahura Mazda as the good principle and source of all
    that is good, and Angra Mainyu as the evil principle and source of all that is
