canonical_text:
  quote: ''
  summary: The passage describes the historical rise, enforcement, and decline of
    Magian observances in Iran, then summarizes Magism as a twofold world shaped by
    hostile good and evil principles. It presents Ahura Mazda as source of good and
    revealer of law to Zarathustra, Angra Mainyu as source of evil and invader of
    Ahura Mazda's world, humanity as active in the conflict, and Saoshyawt as a future
    unborn son of the lawgiver who will appear at the appointed time, after which
    evil and hell are destroyed, the dead rise, and everlasting happiness reigns.
    It also states an author's comparative claim that the religion of the Magi derives
    from the same Indo-Iranian source as the religion of the Indian Rishis.
  language: English
  quote_policy: summarized
