  summary: A legal dialogue asks what penalty applies when a man smites another, causing
    blood, a broken bone, or death. Ahura Mazda gives graded penalties in stripes
    with two named instruments, and repeated or unatoned offenses lead to the offender
    being called a Peshotanu and receiving two hundred stripes with each instrument.
    The passage ends with an injunction to walk according to holiness.
