  quote: ''
  summary: A ritual washing sequence is described. If hands are not washed first,
    the body is made unclean. After the hands are washed three times, water is sprinkled
    on the forepart of the skull. In repeated questions and answers, Ahura Mazda explains
    where the Druj Nasu rushes as the good waters reach successive body parts. A note
    summarizes the Nasu as expelled symmetrically and driven downward from the head
    to the toes.
