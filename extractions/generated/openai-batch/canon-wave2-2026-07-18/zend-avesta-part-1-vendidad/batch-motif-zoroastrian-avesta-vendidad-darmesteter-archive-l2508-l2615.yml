canonical_text:
  quote: ''
  summary: The passage discusses traditions about Zoroaster’s birthplace and the origin
    of Magian worship. It reports a Bundahish tradition in which Zoroaster founds
    his religion through sacrifice in Airyanem Vaejo, and an Avestan tradition in
    which he is born and receives law from Ormazd on a mountain by the river Dareja.
    It contrasts Rai/Ragha and Atropatene as rival origin sites, describes Media and
    the Magi as religiously authoritative, notes fire-related interpretations of Atropatene,
    and briefly mentions Cyrus, Croesus, and a Zoroastrian prohibition against burning
    the dead.
  language: English
  quote_policy: summarized
