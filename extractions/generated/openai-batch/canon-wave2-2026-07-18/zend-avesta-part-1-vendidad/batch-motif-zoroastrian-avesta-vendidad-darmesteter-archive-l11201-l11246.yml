canonical_text:
  quote: ''
  summary: 'The passage presents repeated questions about the reward due after death
    if a man brings various kinds of fire to the Daityo-gatu. Ahura Mazda answers
    each case with an equivalent number of fire-brands brought to the Daityo-gatu:
    ninety in the opening answer, then eighty for a brass-worker''s fire, seventy
    for a blacksmith''s fire, sixty for an oven or baker''s fire, and fifty for fire
    from under a cauldron or kitchen-fire.'
  language: English
  quote_policy: summarized
