canonical_text:
  quote: ''
  summary: The passage first gives repeated similes for an unnamed male subject, comparing
    him to a thief, wild beast, courtesan, and child. It then states that the shepherd's
    dog and house dog should not be kept away from faithful people's houses and that
    houses subsist through them. A question asks where a dog's ghost goes after death;
    Ahura Mazda answers that it passes to the spring of the waters, where water dogs
    are formed. Killing a water dog is said to bring drought and loss of fertility,
    and the return of abundance depends on the water dog's murderer being put to death
    and a sacrifice being offered for the dog's holy soul.
  language: English
  quote_policy: summarized
