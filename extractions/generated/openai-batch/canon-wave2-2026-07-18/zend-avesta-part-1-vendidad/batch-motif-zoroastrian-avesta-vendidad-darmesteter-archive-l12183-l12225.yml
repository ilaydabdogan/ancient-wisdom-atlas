  summary: A speaker asks Ahura Mazda which words in the Gathas are to be said three
    times. Ahura Mazda answers by naming several Gathic/Yasna formulae to be said
    aloud thrice, then instructs that further fiend-smiting and healing words be recited
    to drive away named demonic beings from houses, settlements, lands, corpse-defiled
    bodies, social authorities, and the holy world.
