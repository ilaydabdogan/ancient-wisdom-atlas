canonical_text:
  quote: ''
  summary: 'The passage first states that repentance remits other evil deeds and can
    absolve a person. It then presents Zarathustra asking Ahura Mazda how far the
    Druj Nasu’s pollution extends when one person dies among people resting close
    together. Ahura Mazda answers with ranked rules: if the dead one is a priest,
    warrior, husbandman, or one of several kinds of dogs, the Druj Nasu rushes forth
    and defiles a specified number of nearby beings, with the number decreasing by
    category.'
  language: English
  quote_policy: summarized
