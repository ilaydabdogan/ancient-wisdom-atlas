canonical_text:
  quote: ''
  summary: The passage discusses the holiness of fire, water, and earth. Fire is to
    be cared for, not degraded, and restored to its proper altar after profane use;
    its flames are described as killing fiends. Blowing on fire with the mouth and
    burning the dead are condemned. Water is treated similarly, especially regarding
    contact with dead matter. Earth is also holy, associated with the goddess Spe;zta
    Armaiti, and corpses must not defile it; burial of the dead is described as an
    unatonable deed.
  language: English
  quote_policy: summarized
