- id: obs:2
  text: When necessities require profane use of fire, the passage says this should
    be temporary, like an exile, and the fire must go to the Right-Place of the fire,
    the altar of the Bahram fire, to be restored to its dignity and rights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage condemns gratuitous degradation of fire: blowing it with the
    breath of the mouth is called a crime, and burning the dead is called a heinous
    sin with no atonement.'
  category: action
  evidence_refs:
  - ev:3
