    and a thousand stripes with the Sraosho-karana form named in the passage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage defines Agerepta as rising up to smite a man, Avaoirista as coming
    upon a man to smite him, and Aredus as actually smiting a man with evil aforethought.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Upon the fifth Aredus, the offender becomes a Peshotanu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'A source note gives weapon-based explanations: Agerepta as seizing a weapon,
    Avaoirista as brandishing a weapon, and Aredus as smiting with a weapon without
    a lasting wound or with a wound healed within three days.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: For Agerepta, the listed penalties escalate across the first through seventh
    occurrences from five stripes with each named instrument to ninety stripes with
    each named instrument.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If Agerepta is committed for the eighth time without atonement for the preceding
    offenses, the offender is called a Peshotanu and receives two hundred stripes
    with each named instrument.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a man commits Agerepta and refuses to atone for it, he is called a Peshotanu
    and receives two hundred stripes with each named instrument.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: For Avaoirista, the preserved portion lists escalating penalties from ten
    stripes with each named instrument for the first offense through seventy stripes
    with each named instrument for the fifth offense.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A source note explains refusal to atone as not offering oneself to bear the
    penalty and not performing the Patet.
  category: other
  evidence_refs:
  - ev:8
