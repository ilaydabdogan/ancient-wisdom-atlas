canonical_text:
  quote: "“Nasu rushes forth… she falls on the second and defiles the next.”"
  summary: The passage gives question-and-answer rulings on corpse defilement involving
    different beings, contrasts the living wicked Ashemaogha with his corpse, describes
    harms he commits while alive, and prescribes removal of ritual objects and a corpse
    when death occurs in a house prepared for sacrifice. Translator notes identify
    the Urupi dog as a weasel opposed to serpents and describe a frog threatening
    the white Hom tree of everlasting life while a fish guards it.
  language: English
  quote_policy: quoted
