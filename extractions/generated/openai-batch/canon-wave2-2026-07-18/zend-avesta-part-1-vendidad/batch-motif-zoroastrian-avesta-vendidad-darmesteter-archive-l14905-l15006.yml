canonical_text:
  quote: ''
  summary: The passage opens with a condemnation of sinners described as embodiments
    of the Diw, then introduces Fargard XVIII and its sections. In section I, Ahura
    Mazda tells Zarathustra that a man who bears priestly items or claims to be an
    Athravan while not being girded with the law is lying. A man who sleeps through
    the night and fails to perform worship, chant, learn, or teach is also not to
    be called an Athravan. The true Athravan is described as one who stays awake through
    the night seeking holy Wisdom, which frees from anxiety and helps him at the bridge
    leading toward paradise. Ahura Mazda then invites the upright one to ask him questions
    as Maker and knower.
  language: English
  quote_policy: summarized
