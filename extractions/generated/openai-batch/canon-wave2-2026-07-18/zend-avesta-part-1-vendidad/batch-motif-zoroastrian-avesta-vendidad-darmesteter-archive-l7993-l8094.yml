canonical_text:
  quote: ''
  summary: 'Ahura Mazda answers that water and fire do not themselves kill a person;
    death is attributed to Asto-vidhotu tying a noose and Vaya carrying the person
    off, while water, fire, birds, and chance affect the body. The passage then gives
    winter funerary rules: Mazda-worshippers are to raise three small houses for the
    dead, leave the body there until seasonal signs appear, and then lay the dead
    on the Dakhma with eyes toward the sun.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda states that water kills no man and describes Asto-vidhotu tying
    a noose around the man's neck before Vaya carries him off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the water scenario, the flood moves the body up, down, and ashore; birds
    feed on it, and chance brings it from place to place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda states that fire kills no man, repeats the noose and carrying-off
    sequence, and says fire burns up life and limb before chance relocates the person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When summer is past and winter has come, the prescribed response is to raise
    three small houses for the dead in every house or borough.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The houses for the dead are to be large enough that an erect and extended
    man would not strike his skull, feet, or hands.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The lifeless body may lie in the house for two nights, three nights, or a
    month, until birds fly, plants grow, floods flow, and wind dries the waters from
    the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After those seasonal signs appear, the worshippers of Mazda are to lay the
    dead on the Dakhma with the dead person's eyes toward the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A supplied explanatory note states that the theological answer is that fire
    and water do not kill; rather, the demon of Death and Fate, identified with bad
    Vai, kills the man.
  category: other
  evidence_refs:
  - ev:8
