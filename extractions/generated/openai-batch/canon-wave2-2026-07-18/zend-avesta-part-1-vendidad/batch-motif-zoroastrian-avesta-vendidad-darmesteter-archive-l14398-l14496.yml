canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about who must support a pregnant bitch found
    in a moat or pasture-field, the penalty if her whelps are harmed through neglect,
    the duration and conditions of care for young dogs, Atar/Fire watching over pregnancy,
    and a procedure for breeding a bitch by three dogs to obtain strong offspring.
    The passage includes translator notes marking some words and clauses as doubtful
    or corrupt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a pregnant bitch lies in a moat, the person who dug or holds the moat
    is assigned responsibility to support her until the whelps are born.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the responsible person does not support the bitch and the whelps come to
    harm for want of support, the stated penalty is that for wilful murder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a pregnant bitch lies in a pasture-field, the person who sowed or holds
    the pasture-field is assigned responsibility to support her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The responsible person is instructed to move the bitch to rest on a litter
    of suitable foliage and to support her until the young dogs can defend and sustain
    themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Young dogs are said to be capable of self-defence and self-subsistence when
    they can run in a circuit of twice seven houses; young dogs are to be supported
    for six months, and children for seven years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Atar, called the son of Ahura Mazda, is said to watch over a pregnant bitch
    as he watches over a woman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: For obtaining offspring of strong nature, worshippers of Mazda are instructed
    to dig a hole in the earth in the middle of the fold, with depth varying by hardness
    of soil.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The bitch is to be tied in the hole, kept far from children and from Fire,
    and watched until a dog comes; then a second and a third dog are admitted, each
    kept apart from the former dogs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage states that a bitch covered by three dogs becomes pregnant, has
    milk come to her teats, and brings forth a young one born from three dogs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The passage raises a question about the penalty for smiting a bitch who has
    been covered by three dogs, already has milk, and is to bring forth such a young
    one; the answer is not included in the supplied excerpt.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:11
  text: Translator notes mark the phrase rendered 'kind charity' as doubtful and state
    that the clauses about the three-dog covering are corrupt and doubtful in meaning.
  category: other
  evidence_refs:
  - ev:4
  - ev:10
