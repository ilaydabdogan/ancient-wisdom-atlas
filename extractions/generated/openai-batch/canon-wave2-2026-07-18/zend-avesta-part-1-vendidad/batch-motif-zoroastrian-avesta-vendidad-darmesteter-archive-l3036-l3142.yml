  summary: The passage describes Mazdeism as moving toward Ahura Mazda's supremacy
    over other gods. It discusses a sevenfold Indo-Iranian divine conception, the
    Persian Amesha Spentas, the relation of Mithra to Ahura Mazda, Ahura Mazda as
    creator and father of gods, and episodes in which Ahura Mazda seeks aid from Vayu
    and Ardvi Sura Anahita against Angra Mainyu or in connection with the newborn
    Zoroaster.
