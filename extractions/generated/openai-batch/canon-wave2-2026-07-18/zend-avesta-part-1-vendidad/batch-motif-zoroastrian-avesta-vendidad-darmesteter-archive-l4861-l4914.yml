canonical_text:
  quote: ''
  summary: 'The passage summarizes Vendidad-related principles of uncleanness and
    cleansing: diseases and contagious illness are treated through spells, Barashnum
    washing, exclusion, and cleansing; unclean persons are confined apart in the Arme-st-gah;
    cleansing procedures vary by the degree and source of impurity; uncleanness from
    the dead is the worst and requires the nine nights'' Barashnum, especially before
    Nasu is expelled by Sag-did. Notes cite Herodotus, Agathias, other Vendidad Fargards,
    and later applications of Barashnum.'
  language: English
  quote_policy: summarized
