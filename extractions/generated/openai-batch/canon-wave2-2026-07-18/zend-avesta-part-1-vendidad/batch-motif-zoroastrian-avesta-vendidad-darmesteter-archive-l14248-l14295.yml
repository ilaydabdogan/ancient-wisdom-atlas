canonical_text:
  quote: ''
  summary: The passage gives rules, in Ahura Mazda’s answer, requiring a man who causes
    a woman to conceive to support her until birth, treating neglect that harms the
    child as wilful murder. It also extends care to pregnant females generally, including
    women and bitches, and assigns care for a bitch near birth on the road to the
    nearest householder.
