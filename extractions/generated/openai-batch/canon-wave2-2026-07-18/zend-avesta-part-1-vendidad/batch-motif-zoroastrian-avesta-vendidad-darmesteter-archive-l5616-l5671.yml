canonical_text:
  quote: Thereupon came Angra Mainyu, who is all death, and he counter-created by
    his witchcraft the serpent in the river and winter, a work of the Daevas.
  summary: Ahura Mazda names Airyana Vaejo by the river Daitya as a good land he created.
    Angra Mainyu counter-creates a serpent in the river and winter. The land is described
    as having ten winter months and two cold summer months, with winter bringing severe
    plagues. Ahura Mazda then names the plains in Sughdha as the second good land
    he created. The notes relate Daitya/Daitik to later geographical and mythic identifications,
    including khrafstras, Azis, Yima, and a refuge from destructive winter.
  language: English
  quote_policy: quoted
