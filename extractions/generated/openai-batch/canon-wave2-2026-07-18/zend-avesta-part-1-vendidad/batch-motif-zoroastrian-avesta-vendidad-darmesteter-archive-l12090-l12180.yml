canonical_text:
  quote: How shall I fight against that Druj who from the dead rushes upon the living?
  summary: The passage transitions from a cleansing rite associated with fire, baresma,
    Haoma, and restored fertility into Fargard X, where cleansing is accompanied by
    recited Gathic spells. Zarathustra asks Ahura Mazda how to fight the death-borne
    Druj that defiles the living. Ahura Mazda instructs him to recite specified Gathic
    words two, three, and four times; after the twice-recited words, an exorcism drives
    away Angra Mainyu, Nasu, and defilement from persons, dwellings, communities,
    land, and the holy world.
  language: English
  quote_policy: quoted
