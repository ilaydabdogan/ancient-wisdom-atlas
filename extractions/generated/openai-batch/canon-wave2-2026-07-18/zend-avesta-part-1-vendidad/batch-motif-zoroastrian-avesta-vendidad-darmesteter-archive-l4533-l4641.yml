canonical_text:
  quote: ''
  summary: 'The passage explains Zoroastrian corpse-pollution practices and their
    mythic rationale: dogs and birds of prey act against Nasu or fiends; a dog guards
    the Kinvat bridge; the corpse route is cleansed by a four-eyed dog and priestly
    spells; gomez is linked to heavenly animal urine and storm floods; death-contagion
    is strongest at the moment of death; corpses must be disposed of without polluting
    holy elements; and fire is treated as pure, fiend-repelling, and incompatible
    with death-uncleanness.'
  language: English
  quote_policy: summarized
