canonical_text:
  quote: ''
  summary: 'The passage gives instructions for an unclean person’s purification: progressive
    release from the Nasu at ritual holes with recitation of healing, fiend-smiting
    words; rubbing with dust; washing with water; perfuming and reclothing; then repeated
    periods of seclusion from worshippers and from fire, water, earth, cow, and trees,
    followed by washing with gomez and water and eventual restored access.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the third through sixth holes, the person becomes freer from the Nasu,
    and the words “Yatha ahu vairyo” are to be said as fiend-smiting and most-healing
    words.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unclean one is instructed to sit near the furrows of the six holes, four
    fingers from those furrows, and cleanse his body with thick handfuls of dust.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dust is taken from the ground fifteen times for him to rub his body, and he
    waits until dry to the last hair on his head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When dry, he steps over the water-containing holes and washes his body once
    at the first hole, twice at the second, and three times at the third.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: He is then perfumed with sweet-smelling plant perfumes, puts on his clothes,
    and goes back to his house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the house, he sits in the place of infirmity apart from the other worshippers
    of Mazda and must not go near fire, water, earth, cow, trees, or faithful men
    or women.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:7
  text: After three nights, after six nights, and after nine nights, he washes his
    body and clothes with gomez and water to make them clean.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:8
  text: After the final period, he may again go near the fire, water, earth, and cow
    as stated in the passage.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:9
  text: A note identifies the furrows as lying between the furrows of six holes containing
    gomez and the furrows of holes containing water.
  category: setting
  evidence_refs:
  - ev:10
