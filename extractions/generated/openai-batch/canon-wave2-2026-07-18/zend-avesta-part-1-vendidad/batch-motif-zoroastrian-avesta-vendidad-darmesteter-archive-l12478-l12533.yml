canonical_text:
  quote: ''
  summary: A ritual instruction directs the practitioner to say fiend-smiting and
    healing words, chant the Ahuna-Vairya eight times, invoke Mazda for protection,
    and recite a formula driving away named adversarial beings or abstractions and
    forms of defilement. Translator notes discuss uncertain names and compare the
    Ku«di/Ku»disa name cluster with Indian and Greek mythological names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The practitioner is instructed to say fiend-smiting and most-healing words
    and to chant the Ahuna-Vairya eight times.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited formula fragments address Mazda, ask who has been placed to protect
    the speaker, ask who will smite the fiend, and request protection from a hater.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The formula says that Aeshma, the Nasu, direct defilement, and indirect defilement
    are driven away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The formula continues by driving away Khru, Khruighni, Buidhi, Buidhka, Ku;/di,
    KimdLza, the yellow Bushyasta, the long-handed Bushyasta, Muidhi, and Kapasti.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note says Khru and Khruighni are not found elsewhere, that their names apparently
    mean “wound” and “the wounding one,” and that their status as mythological beings
    or abstractions is uncertain.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A note identifies Buidhiza as the offspring of Buidhi and says the meaning
    of Buidhi is unknown.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note identifies Ku»disa as the offspring of Kuwdi, links Ku«di with Kavawdi
    or Kavawda, and compares an Indian homonym kavandha with a raining cloud and a
    demon in the cloud.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The same note says the figure is known in Greek mythology under the name KdavBos.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note says Muidhi is an unknown demon translated by Aspendiarji as “Destruction,”
    while Kapasti is unknown and called “Revenge” by Aspendiarji.
  category: attribute
  evidence_refs:
  - ev:8
