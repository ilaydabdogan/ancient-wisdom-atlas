  text: Peter von Bohlen published an 1831 essay on the origin of the Zend language
    and asserted that Zend was a Prakrit dialect.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Bohlen erred by relying on Anquetil's often incorrect transcriptions
    and on modern Parsi forms of proper names.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Ahriman is the modern form of Angra Mainyu and rejects
    Bohlen's derivation from Sanskrit ariman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vohu-mano is described as an angel meaning 'good thought'; the passage says
    Bohlen reduced the Parsi form Bahman to Sanskrit bahuman, glossed as 'a long-armed
    god.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage presents Burnouf's arrival after about seventy years in which
