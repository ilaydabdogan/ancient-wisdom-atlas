  quote: ''
  summary: A scholarly introduction recounts Peter von Bohlen's 1831 erroneous account
    of Zend as a Prakrit dialect, his faulty comparisons using Anquetil's transcriptions
    and modern Parsi name-forms, and the later arrival of Eugène Burnouf, whose research
    is presented against a background of limited progress in Avesta interpretation
    since Anquetil.
