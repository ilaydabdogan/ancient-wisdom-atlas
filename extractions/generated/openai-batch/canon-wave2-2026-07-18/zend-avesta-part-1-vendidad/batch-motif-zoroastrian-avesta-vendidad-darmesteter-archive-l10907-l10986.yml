  summary: In a ritual sequence, Ahura Mazda explains how the Druj Nasu moves as good
    waters reach successive parts of the lower body. The officiant sprinkles the soles
    and toes with water while the subject positions the feet; the Druj Nasu is driven
    out, flies to the north in fly-like form, and is further opposed by spoken fiend-smiting
    and healing words invoking Mazda and Armaiti Spenta.
