canonical_text:
  quote: "“He shall godly and piously give to godly men twice seven sets of implements
    for the fire, as an atonement unto the soul (of the water dog)”"
  summary: The passage prescribes acts of atonement involving killing large numbers
    of specified creatures, filling holes for the unclean, and giving fire implements
    and priestly instruments to godly men for the soul of the water dog. Notes explain
    several ritual objects, including the Paitidana mouth-veil and the Khrafstraghna
    instrument for killing noxious creatures.
  language: English
  quote_policy: quoted
