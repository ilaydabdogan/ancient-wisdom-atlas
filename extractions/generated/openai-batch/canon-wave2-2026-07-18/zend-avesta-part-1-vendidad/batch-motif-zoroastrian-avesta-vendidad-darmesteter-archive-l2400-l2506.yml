  quote: ''
  summary: The passage discusses hereditary Zoroastrian priesthood, traditions placing
    Zoroaster's origin in Media rather than Bactria, Ragha/Rai and Shiz/Atropatene
    as variant birthplace traditions, priestly authority in Ragha, a Magian stronghold
    at Ustunawand, the fire temple of Azerekhsh in Shiz, royal pilgrimage there, and
    a tradition in which Zoroaster retires to Mount Sebilan, returns with the Zend-Avesta,
    and declares himself a prophet.
  language: English
