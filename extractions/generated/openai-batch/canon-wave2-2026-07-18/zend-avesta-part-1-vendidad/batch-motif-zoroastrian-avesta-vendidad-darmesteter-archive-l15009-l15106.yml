canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda what increases the unseen power of Death.
    Ahura Mazda answers that wrong teaching and neglect of specified Zoroastrian observances
    do so. The passage condemns freeing, blessing, or ritually feeding a wicked Ashemaogha.
    It then resumes the divine question-and-answer frame and introduces a question
    about the Sraosha-varez of Sraosha, who is described as holy, strong, the incarnate
    Word, mighty-speared, and lordly.
  language: English
  quote_policy: summarized
