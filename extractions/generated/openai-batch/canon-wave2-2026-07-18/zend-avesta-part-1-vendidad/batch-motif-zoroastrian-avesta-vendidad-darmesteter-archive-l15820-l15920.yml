canonical_text:
  quote: ''
  summary: Zarathustra chants the Ahuna-Vairya and asks Ahura Mazda to teach him truth.
    Sitting by the Darea on a mountain, he asks how to free the world and Mazda-worshipping
    households from Druj, Angra Mainyu, defilement, and Nasu, and how to cleanse faithful
    men and women. Ahura Mazda replies by instructing him to invoke the law of Mazda,
    the Amesha Spentas, cosmic powers, Wind, Spenta Armaiti, Ahura Mazda's Fravashi,
    and Ahura Mazda's creation. Zarathustra then recites invocations including Mithra,
    Sraosha, the holy Word, and the fiend-destroying law.
  language: English
  quote_policy: summarized
