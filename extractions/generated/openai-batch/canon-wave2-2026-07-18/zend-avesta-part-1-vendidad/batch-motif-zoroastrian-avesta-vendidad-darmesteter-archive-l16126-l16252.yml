canonical_text:
  quote: ''
  summary: The passage describes a righteous soul after death being met by a well-formed
    maid with dogs, guided upward above Hara-berezaiti and the Cinvat bridge into
    the presence of heavenly gods. Vohu-mano receives the holy one, righteous souls
    pass to the golden seats and Garo-nmanem, Daevas fear the perfume of a cleansed
    soul, Nairyo-sangha is present with gathered righteous souls, and Zarathustra
    invokes the holy world and its elements.
  language: English
  quote_policy: summarized
