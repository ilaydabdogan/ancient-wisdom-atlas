canonical_text:
  quote: ''
  summary: The passage presents repeated promises of livestock sacrifices to the good
    Saoka, a holy blessing-spell that restores fullness and health, Mathra Spenta's
    question about healing numerous diseases, and Ahura Mazda sending the herald Nairyo-sangha
    to Airyaman. Ahura Mazda's message names Angra Mainyu as the one who wrought many
    diseases by witchcraft and asks Airyaman for healing. The passage ends with Nairyo-sangha
    obeying and going to Airyaman's mansion.
  language: English
