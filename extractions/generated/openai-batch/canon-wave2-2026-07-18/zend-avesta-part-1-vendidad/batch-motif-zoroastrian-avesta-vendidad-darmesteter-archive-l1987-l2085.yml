  quote: ''
  summary: The passage is an introductory discussion of dating and editorial history,
    followed by quoted and paraphrased material from the Vendidad and a Parsi work.
    It presents an anathema by Ahura Mazda against wrong-law teachers, a model of
    good government that enforces true religion, a discussion of possible Manichean
    allusion, and a Vendidad passage praising marriage, householding, wealth, and
    meat-eating as empowering a person to resist hostile beings and forces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Khorda Avesta is later than the Gathas, the Vendidad,
    and the Yashts, while also saying no part of the Avesta can belong to a date later
    than Adarbad's fourth-century revision.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that two Vendidad passages appear to contain internal evidence
    of date, with both pointing to Sassanian times and the second to the age of Manicheism.
  category: other
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:3
  text: In the quoted Vendidad passage, Ahura Mazda curses those who teach a wrong
    law and says that freeing such a bound prisoner is no better than flaying a man
    alive and cutting off his head.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author interprets the anathema as indicating a period when Mazdeism was
    a state religion fighting heresy.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mainyo-i-Khard excerpt describes good government as maintaining true law
    and custom, expelling improper law and custom, and sustaining worship, duties,
    and good works.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mainyo-i-Khard excerpt says good government orders one who stays away
    from the way of God to return, makes him a prisoner, brings him back, distributes
    wealth shares, and delivers the body on account of the soul.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The quoted Mainyo-i-Khard passage says a good king of that sort is called
