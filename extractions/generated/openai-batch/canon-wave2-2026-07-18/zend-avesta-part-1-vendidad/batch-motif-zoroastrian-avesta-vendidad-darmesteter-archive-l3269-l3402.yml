canonical_text:
  quote: ''
  summary: The passage compares Indo-Iranian and Mazdean figures connected with storm,
    atmosphere, light, fire, and demons. It describes Indra and Verethraghna/Bahram
    as fiend-smiter or victory figures; Vayu as both atmosphere and a light-filled
    fighter; the atmosphere or Vai as a meeting-place of good and evil; Azi/Azi Dahaka/Zohak
    as a serpent or fiend who darkens the sky, takes sovereign light, overthrows Yima/Jemshid,
    is later overthrown by Feridun, and remains bound until an end-time slaying by
    Keresaspa; and Yatus as shapeshifting demons also extended to sorcerers.
  language: English
  quote_policy: summarized
