- id: obs:2
  text: Ahura Mazda says that giving bad food to a house dog is like serving bad food
    to a house-master of middle rank.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda says that giving bad food to a Vohunazga dog is like serving bad
    food to a holy man in the character of a priest who comes to the house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ahura Mazda says that giving bad food to a young dog is like serving bad food
    to a young man born of pious parents who can answer for himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The stated penalties for giving bad food are two hundred stripes with each
