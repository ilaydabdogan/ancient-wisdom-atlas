canonical_text:
  quote: Bring ye unto him milk and fat with meat; this is the right food for the
    dog.
  summary: A questioner asks Ahura Mazda about the guilt and penalties for giving
    bad food to different kinds of dogs. Ahura Mazda equates such acts with mistreating
    human social or religious figures and assigns corporal penalties. The passage
    also states that dogs age quickly while guarding goods without receiving them,
    and names milk, fat, and meat as proper food for a dog. Notes compare these teachings
    with explanations of Vohunazga and young dogs, an Ardai Viraf punishment scene,
    and a Saddar feeding rule.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A questioner repeatedly addresses the Maker of the material world and asks
    what guilt or penalty applies when a man gives bad food to specific kinds of dogs.
  category: speech
  evidence_refs:
  - ev:1
