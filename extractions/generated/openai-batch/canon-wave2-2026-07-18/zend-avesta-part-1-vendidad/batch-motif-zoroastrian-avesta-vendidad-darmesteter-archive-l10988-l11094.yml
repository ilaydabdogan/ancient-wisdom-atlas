canonical_text:
  quote: they shall separate and disperse it, that it may die out the sooner
  summary: A question asks what Mazda-worshippers should do when they encounter a
    fire used for burning or cooking a corpse. Ahura Mazda commands that the corpse-burner
    be killed, the cooking implements removed, and the fire dispersed through successive
    bundles so it dies out sooner. The passage then states that offering sweet-smelling
    wood to the fire causes Fire, son of Ahura Mazda, to destroy unseen demonic beings
    wherever the perfume goes.
  language: English
  quote_policy: quoted
