- id: obs:2
  text: After the corpse is removed from a well, people are instructed to draw off
    half, a third, a fourth, or a fifth of the well water according to their ability;
    the remaining water is then clean for cattle and men to drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a sheet of snow or hail, the defiled area is given as three steps on each
    of the four sides.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a corpse is removed from snow or hail and the snow or hail melts, the
