canonical_text:
  quote: As long as the corpse has not been taken out of the water, so long shall
    that water be unclean and unfit to drink.
  summary: Ahura Mazda answers ritual questions about how corpse contamination affects
    well water, snow or hail, running streams, and Haoma. The rules specify measured
    zones or portions of defilement, removal of the corpse to dry ground, drawing
    off or waiting for water to flow, and conditions under which Haoma remains clean
    or is restored after burial for a year.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Water in a well is described as unclean and unfit to drink while a corpse
    remains in it; the corpse is to be removed and laid on dry ground.
  category: sequence
  evidence_refs:
