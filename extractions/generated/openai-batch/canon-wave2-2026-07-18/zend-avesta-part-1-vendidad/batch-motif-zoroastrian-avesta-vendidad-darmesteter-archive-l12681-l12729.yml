canonical_text:
  quote: ''
  summary: An introductory note says that a house connected with a death is unclean
    or unlucky for relatives and may require purification or avoidance. In the ritual
    dialogue, a question asks how long children should stay for deceased parents and
    how the house may be cleansed. Ahura Mazda answers that the stay is thirty days
    for the righteous and sixty for sinners, then prescribes triple washing of bodies
    and clothes, triple chanting of the Gathas, sacrifice to Fire, baresma offerings,
    and libations to good waters, after which the house is clean and waters, fire,
    and the Amesha-Spentas may enter.
  language: English
