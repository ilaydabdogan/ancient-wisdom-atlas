canonical_text:
  quote: Thrita, the First Healer.
  summary: The passage introduces Thrita as the first healer, describes heavenly healing
    plants around the tree of eternal life, presents commentary linking Thrita with
    Haoma, Thraetaona, serpent-conquest, and medicine, and gives the opening dialogue
    in which Zarathustra asks Ahura Mazda who first drove back sickness and death;
    Ahura Mazda answers that it was Thrita, who obtained a source of remedies from
    Khshathra-Vairya.
