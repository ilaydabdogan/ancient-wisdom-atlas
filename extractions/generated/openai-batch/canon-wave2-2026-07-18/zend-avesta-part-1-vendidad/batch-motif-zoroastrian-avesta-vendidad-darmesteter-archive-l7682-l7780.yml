canonical_text:
  quote: ''
  summary: The passage gives rules for agreements among men of the same faith concerning
    goods, a wife, or knowledge; describes disciplined learning of the holy word with
    prayer; forbids denying receipt of an ox or garment before water and blazing fire;
    ranks men with wife, house, children, and riches above those lacking them; and
    states that the meat-eating man is more filled with the good spirit and can strive
    against the onsets of Asto-vtdhotu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men of the same faith, described as friends or brothers, may come to an agreement
    so that one obtains goods, a wife, or knowledge from the other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage instructs that goods be delivered, the wife be received and wed,
    and knowledge be taught as the holy word.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The learner studies in the first and last parts of day and night, gives thanks
    and prays to the gods for increased knowledge, rests in the middle parts, and
    continues until able to say all the words said by former Aethrapaitis.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the water and the blazing fire, no one is to deny having received an
    ox or garment from a neighbour.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A translator note says the water and blazing fire are the water and fire before
    which an oath is taken and that the clause seems directed against false oaths.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressed speech to Spitama Zarathustra ranks the man with a wife above
    one who begets no sons, the householder above one without a house, the man with
    children above the childless man, and the rich man above one without riches.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Of two men, the one who fills himself with meat is said to be filled with
    the good spirit much more than the one who does not; the non-eater is described
    as all but dead.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: The meat-filled man is said to be able to strive against the onsets of Asto-vtdhotu.
  category: action
  evidence_refs:
  - ev:9
