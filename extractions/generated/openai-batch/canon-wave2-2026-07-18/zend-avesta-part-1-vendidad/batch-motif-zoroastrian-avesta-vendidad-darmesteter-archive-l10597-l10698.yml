canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about whether people who have touched corpses
    can be clean. A corpse dried for more than a year does not make the toucher unclean
    under the stated dry-with-dry principle. For contact with a corpse of a dog or
    man, cleansing depends on whether the Nasu has been smitten by corpse-eating dogs
    or birds. If so, washing with gomez and water is sufficient. If not, Mazda-worshippers
    perform a staged procedure involving three sets of holes, washing first with gomez
    and later with water, bringing Ahura Mazda's dog before the man, and waiting until
    he is dry.
  language: English
  quote_policy: summarized
