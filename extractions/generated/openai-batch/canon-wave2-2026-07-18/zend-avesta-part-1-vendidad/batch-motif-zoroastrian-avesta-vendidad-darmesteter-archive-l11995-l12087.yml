canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda what should be done when a man ignorant of
    Mazdaean cleansing rites attempts to cleanse the unclean, and how to resist the
    Druj Nasu that comes from the dead to defile the living. Ahura Mazda says this
    strengthens the Druj Nasu, sickness, death, and fiendish activity. He prescribes
    binding, stripping, flaying, beheading, and giving the offender’s corpse to corpse-eating
    birds and ravens, accompanied by a repentance formula. The passage identifies
    the offender as an ungodly Ashemaogha whose improper cleansing threatens fullness,
    increase, health, and growth in the land. These benefits do not return until the
    offender is killed and holy Sraosha has offered a sacrifice in that place.
  language: English
  quote_policy: summarized
