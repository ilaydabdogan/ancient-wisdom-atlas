canonical_text:
  quote: ''
  summary: The passage describes Yima's Vara as an enclosed abode for humans and animals,
    with waters, birds, dwellings, preserved seeds of humans, cattle, trees, and fruits,
    ordered streets, a golden-ring seal, a door, and a self-shining window. It also
    describes the Vara as free from bodily defects, poverty, lying, jealousy, and
    marks attributed to Angra Mainyu. Ahura Mazda explains the lights and altered
    time within it, and says couples bear male and female offspring every fortieth
    year and live happily there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Vara is made as an abode for men and as a fold for flocks, with each side
    described as long as a riding-ground.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waters flow there; birds are settled by ever-green banks with never-failing
    food; dwellings include a house, balcony, courtyard, and gallery.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seeds of men and women and of every kind of cattle are brought there, described
    as the greatest, best, and finest kinds on earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seeds of every kind of tree and fruit are brought there; all seeds are brought
    two of every kind and are to be kept inexhaustible while the men stay in the Vara.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Vara is described as lacking certain bodily defects, poverty, lying, meanness,
    jealousy, tooth decay, leprosy requiring confinement, and bodily brands attributed
    to Angra Mainyu.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The place is organized into largest, middle, and smallest parts, with nine,
    six, and three streets respectively, and with one thousand, six hundred, and three
    hundred seeds of men and women assigned to those parts.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Vara is sealed with a golden ring, and a door and self-shining window
    are made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A question asks what lights give light in the Vara which Yima made.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ahura Mazda answers that there are uncreated and created lights; stars, moon,
    and sun are seen to rise and set only once a year, and a year seems as a day.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Every fortieth year, each couple has two offspring, a male and a female; the
    same pattern applies to cattle, and the men in the Vara live the happiest life.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The opening fragment mentions dogs, birds, and red blazing fires before the
    description of the Vara.
  category: object
  evidence_refs:
