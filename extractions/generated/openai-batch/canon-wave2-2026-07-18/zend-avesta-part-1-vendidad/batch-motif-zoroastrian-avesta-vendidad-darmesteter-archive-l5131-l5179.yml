canonical_text:
  quote: ''
  summary: The passage discusses whether severe bodily penalties in the Vendidad,
    especially stripes for killing dogs, were literally applied. It describes the
    conversion of bodily punishments into monetary fines, the coexistence of financial,
    bodily, and cleansing forms of atonement, and repentance through avowal and formulaic
    recitation. A footnote states that later Parsiism assigned money values to sins
    and good deeds and weighed them in the scales of Rashnu, comparing this principle
    of compensation with Persian law as noted by Herodotus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author doubts that punishments of eight hundred stripes for killing a
    shepherd's dog or ten thousand stripes for killing a water dog were actually applied
    literally.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bodily punishment is described as being estimated in money value and converted
    into fines, with the conversion connected to the Pahlavi translation and possibly
    already present by the last edition of the Vendidad.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ravaets are said to equate two hundred stripes, or a Tanafuhr, with fixed
    amounts of istirs, dirhems, and rupees, making one stripe approximately equal
    to six rupees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that it cannot be decided whether a guilty person could
    commute punishment independently or only with the judge's assent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author conjectures that fire-temple wealth may have come largely from
    financial penalties and that dirhems could cause the Sraosho-Xarana to fall from
    the hands of Mobeds.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Financial penalties are said not to have suppressed bodily penalties; Parsis
    are described as applying both.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The Pahlavi Commentary distinguishes three sorts of atonement: by money,
    by the Sraosho-Xarana, and by cleansing.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The third element of atonement is described as religious and consists in repentance
    manifested by avowal of guilt and recital of a formula of repentance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote states that in later Parsiism every sin and every good deed has
    a fixed money value and may be weighed in the scales of Rashnu.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The same footnote says Herodotus noticed the principle of compensation in
    Persian law.
  category: other
  evidence_refs:
  - ev:8
