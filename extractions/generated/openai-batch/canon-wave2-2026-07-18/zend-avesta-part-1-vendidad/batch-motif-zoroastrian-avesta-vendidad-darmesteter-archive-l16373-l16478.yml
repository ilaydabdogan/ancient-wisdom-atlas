  quote: ''
  summary: The passage instructs offerings and sacrifice to the holy Sraosha so that
    fiends may be struck down. It invokes the Kara fish beneath deep waters, Merezu,
    and seven bright Sravah. It then depicts Angra Mainyu and the Daevas wavering,
    gathering at the head of Arezura, reacting fearfully to the newborn holy Zarathustra,
    and fleeing into the dark world of hell.
