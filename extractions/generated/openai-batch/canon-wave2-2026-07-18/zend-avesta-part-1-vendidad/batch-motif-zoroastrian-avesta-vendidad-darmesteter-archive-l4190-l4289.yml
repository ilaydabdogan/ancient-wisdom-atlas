  quote: ''
  summary: The passage argues that Vedic and Avesta religion remain linked to a common
    Indo-Iranian source and that Mazdeism developed gradually from vague dualism into
    a more defined Magian dualism. It describes priestly elaboration, later attempts
    to derive two principles from one principle such as Space, Infinite Light, Boundless
    Time, or Fate, and still later monotheizing or allegorical interpretations of
    Ahriman, including the myth of Tahmurath riding Ahriman as a horse.
  language: English
  quote_policy: summarized
