canonical_text:
  quote: ''
  summary: A dialogue asks Ahura Mazda about penalties for killing or mistreating
    various kinds of dogs. Ahura Mazda gives graded corporal penalties for killing
    a house dog, a Vohunazga dog, and a young dog, extends dog-murder penalties to
    other dog kinds with an exception for the water dog, defines shepherd and house
    dogs by their guarding activity, describes the Vohunazga dog as seeking subsistence,
    and equates feeding bad food to a shepherd's dog with feeding bad food to a first-rank
    householder.
  language: English
  quote_policy: summarized
