  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the Nasu has already been expelled from a corpse, one simple washing, called
    Ghosel, is said to be sufficient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The defiling power of the Nasu is said to reach farther when death has just
    occurred or when the dead creature held a higher rank in the scale of beings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Menstruous women are said to be cleansed by the Ghosel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Objects are described as more or less defiled according to penetrability,
    with contrasts between metal and earthen vessels, leather and woven cloth, dry
    and soft wood, wet and dry matter, and with corpses ceasing to defile after a
    year.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage distinguishes laws about contracts and assaults from purely religious
    cases and identifies them as remains of Zoroastrian civil and penal legislation.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Contracts are classified by mode as word-contracts or hand-contracts and by
    object as sheep-, ox-, man-, or field-contracts, with stated money values.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A contract cannot be voided by one party alone; a contract breaker must pay
    the value of the next higher contract, and family and next of kin are said to
    be answerable for fulfillment.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Assaults are listed in seven degrees, and repeated unatoned offenses rise
    to the next degree until repeated agerepta can amount to manslaughter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Every crime is said to make the guilty person liable to two penalties, one
    in this world and another in the next world.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The penalty in this world consists of a number of stripes with the Aspahe-astra
    or the Sraosho-charana.
  category: action
  evidence_refs:
  - ev:9
