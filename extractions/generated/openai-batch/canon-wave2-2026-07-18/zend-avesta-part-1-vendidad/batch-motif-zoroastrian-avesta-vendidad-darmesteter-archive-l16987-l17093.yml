canonical_text:
  quote: ''
  summary: The passage closes a spell asking Airyaman to smite diseases, deaths, and
    hostile beings, invokes Mazda and Armaiti Spenta for protection, and commands
    the fiendish Druj to perish toward the north. The heading and opening of Fargard
    XXII describe Angra Mainyu creating a vast number of diseases, while Ahura Mazda
    seeks healing through the holy word and Airyaman. Translator notes identify Airyaman
    with the Indo-Iranian Aryaman, describe his heavenly mansion, and state that he
    comes to dig nine furrows for a cleansing/healing rite. Ahura Mazda tells Zarathustra
    that he made a shining mansion, says Angra Mainyu created diseases by witchcraft,
    asks Mathra Spenta to heal him, and promises swift steeds as a sacrifice to Saoka.
  language: English
  quote_policy: summarized
