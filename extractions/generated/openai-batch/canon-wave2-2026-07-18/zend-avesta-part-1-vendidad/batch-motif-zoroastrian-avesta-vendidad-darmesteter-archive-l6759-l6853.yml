canonical_text:
  quote: ''
  summary: Ahura Mazda answers questions about required distances from fire, water,
    consecrated baresma, and the faithful; instructs Mazda worshippers to confine
    and provision an unnamed person until old age; prescribes his later execution
    on a mountain and exposure to ravens with a repentance formula; and identifies
    actions that bring greatest joy to Earth, including filling burrows of Angra Mainyu's
    creatures and cultivating, watering, drying, and tilling land.
  language: English
  quote_policy: summarized
