canonical_text:
  quote: ''
  summary: The passage presents purification as attainable through good thoughts,
    words, and deeds, invokes Mazda and Armaiti Spenta against the fiendish Druj,
    and introduces Fargard XI as a set of cleansing spells. Zarathushtra asks Ahura
    Mazda how to cleanse the house, fire, water, earth, cow, tree, faithful humans,
    celestial bodies, boundless light, and all good things made by Mazda. Ahura Mazda
    answers that chanting cleansing words, including the Ahuna-Vairya five times,
    will cleanse them, and gives object-specific formulas for the house and fire.
  language: English
  quote_policy: summarized
