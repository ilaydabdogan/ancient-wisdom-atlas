canonical_text:
  quote: ''
  summary: 'In a dialogue, Ahura Mazda explains when the Druj Nasu comes upon the
    dead: immediately after natural death when the soul leaves the body, or at the
    next watch after certain violent or exceptional deaths. The Druj Nasu comes from
    the north in the form of a stained raging fly, remains until a dog or flesh-eating
    birds interact with the corpse, then returns north. The passage also gives graded
    rules for how many nearby people are defiled when a priest, warrior, husbandman,
    or shepherd''s dog dies among those resting close together.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A question asks at what moment the Druj Nasu rushes upon a man after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda answers that directly after death, as soon as the soul has left
    the body, the Druj Nasu comes and rushes upon the dead person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Druj Nasu is described as coming from the regions of the north in the
    shape of a raging fly, with knees and tail sticking out, stained with stains,
    and like the foulest Khrafstras.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Druj Nasu remains until a dog has seen or eaten the corpse, or until flesh-eating
    birds have taken flight toward it; then she rushes away to the regions of the
    north in the same raging-fly form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For deaths by dog, wolf, witchcraft, hatred, falling down a precipice, law,
    murderer, or noose, Ahura Mazda says the Druj Nasu comes at the next watch after
    death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A question describes several people resting close together and asks how many
    the Druj Nasu envelops with infection, pollution, and uncleanness when one of
    them dies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the dead one is a priest, the Druj Nasu falls on the eleventh and defiles
    ten; if a warrior, she falls on the tenth and defiles nine; if a husbandman, she
    falls on the ninth and defiles eight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the dead one is a shepherd's dog, the Druj Nasu falls on the eighth and
    defiles seven.
  category: sequence
  evidence_refs:
  - ev:6
