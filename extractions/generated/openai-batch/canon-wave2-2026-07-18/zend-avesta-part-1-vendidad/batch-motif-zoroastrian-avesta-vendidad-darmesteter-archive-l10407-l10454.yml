canonical_text:
  quote: ''
  summary: The passage contains prayers asking Mazda's law to be revealed, asking
    who will smite the fiend, invoking Sraosha and Vohu-mano as helpers, and commanding
    the fiendish Druj and its world to perish and depart to the north. It then allows
    worshippers of Mazda to bring people, livestock, Fire, baresma bundles, and the
    faithful, and to resume meat-and-wine meals in a clean house. The fragment ends
    by beginning a new legal question about thrown clothes. Footnotes connect Atar
    and Vohu-mano with repelling Ahriman, Sraosha with aid to the good soul after
    death, Gathic source lines, and the fourth-day timing after death.
  language: English
  quote_policy: summarized
