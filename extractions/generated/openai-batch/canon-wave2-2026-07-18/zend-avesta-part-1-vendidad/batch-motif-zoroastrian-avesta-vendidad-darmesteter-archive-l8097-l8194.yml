canonical_text:
  quote: ''
  summary: The passage first refers to a corpse remaining until rain has fallen on
    the corpse, Dakhma, and remains, and birds have eaten it. Zarathustra asks Ahura
    Mazda whether he sends waters from Vouru-kasha with wind and clouds down to corpses,
    Dakhmas, unclean remains, and bones, then causes them to return unseen to Puitika.
    Ahura Mazda confirms this, says the waters boil and are cleansed in Puitika, return
    to Vouru-kasha toward a well-watered tree bearing seeds of all plants, and are
    rained down as plants for human food and cattle fodder. Translator notes identify
    Puitika as a purifying sea and the tree as the tree of all seeds in later Zoroastrian
    mythic geography.
  language: English
  quote_policy: summarized
