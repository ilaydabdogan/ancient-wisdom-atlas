canonical_text:
  quote: ''
  summary: Ahura Mazda answers concerning pious giving while tilling the earth, the
    fate of one who withholds such giving, graded penalties for burying a dog or human
    corpse in the earth and failing to disinter it, the unatonable status of a knowledgeable
    offender after a longer delay, and the removal of certain sins by the law of Mazda
    when an ignorant offender confesses and resolves not to repeat the deed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda speaks in answer and addresses Spitama Zarathustra in connection
    with tilling the earth and giving kindly and piously to one of the faithful.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who tills the earth but does not kindly and piously give to one of
    the faithful is said to fall into the darkness of Spenta Armaiti, the world of
    woe, the dismal realm, and the house of hell.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a man buries the corpse of a dog or man in the earth and does not disinter
    it within half a year, the stated penalty is five hundred stripes with the Aspahe-astra
    and five hundred with the Sraosho-karana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man buries such a corpse and does not disinter it within a year, the
    stated penalty is a thousand stripes with each of the two named instruments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the corpse remains buried into the second year, the answer says nothing
    can pay, atone, or cleanse from the deed, and calls it a trespass with no atonement
    for ever and ever.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The unatonable condition is said to apply when the sinner is a professor of
    the law of Mazda or has been taught in it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: For one who is not a professor of the law of Mazda and has not been taught
    in it, the law of Mazda takes the sin away if he confesses it and resolves not
    to commit such forbidden deeds again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The law of Mazda is said to take away the bonds of sin and specific sins including
    breach of trust, murdering one of the faithful, and burying a corpse, from one
    who confesses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote explanation says corpse burial is forbidden and mentions concern
    that dogs or foxes might take a corpse to the fire and to the water.
  category: other
  evidence_refs:
  - ev:7
