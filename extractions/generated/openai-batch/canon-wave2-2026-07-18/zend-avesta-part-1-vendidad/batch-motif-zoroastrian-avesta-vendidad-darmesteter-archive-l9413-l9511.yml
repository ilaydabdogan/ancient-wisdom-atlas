canonical_text:
  quote: "“He shall go away into the world of the fiends, into that dark world, made
    of darkness, the offspring of darkness.”"
  summary: Ahura Mazda gives rules about clothes associated with the dead, permits
    restricted reuse for infirm household members, forbids waste, and states penalties
    for placing clothing on a dead body. He also declares that those who eat carcasses
    or pollute waters and fire with corpses cannot become clean, and links corpse-pollution
    with demonic impurity and destructive natural afflictions.
  language: English
  quote_policy: quoted
