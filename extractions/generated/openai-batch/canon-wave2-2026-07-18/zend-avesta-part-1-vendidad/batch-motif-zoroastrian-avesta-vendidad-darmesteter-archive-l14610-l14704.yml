canonical_text:
  quote: ''
  summary: The passage gives rules for a woman who continues to see blood over successive
    nights, states that blood after nine nights is a work of the Daevas, prescribes
    clearing a way, digging three holes, washing with gomez and water, and killing
    specified Khrafstras. It then gives penalties, answered by Ahura Mazda, for suppressing
    a woman’s issue of blood and for repeatedly touching or lying by such a woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who continues to see blood after successive nights is instructed to
    remain seated in the place of infirmity until the next stated night-count has
    passed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the woman still sees blood after nine nights, the passage identifies this
    as a work of the Daevas performed for the worship and glorification of the Daevas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The worshippers of Mazda are instructed to clear the way of wood, including
    growing trees and logs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three holes are to be dug in the earth; the woman is to be washed with gomez
    by two holes and with water by the third.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Khrafstras are to be killed: two hundred corn-carrying ants in summer, or
    two hundred other Khrafstras made by Angra Mainyu in winter.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A worshipper of Mazda who suppresses the issue of a woman with an issue of
    blood is called a Peshotanu and assigned two hundred stripes with each of two
    named instruments.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage asks about the penalty for a man who repeatedly and wilfully touches
    the body of a woman with an issue of blood so that one kind of issue changes to
