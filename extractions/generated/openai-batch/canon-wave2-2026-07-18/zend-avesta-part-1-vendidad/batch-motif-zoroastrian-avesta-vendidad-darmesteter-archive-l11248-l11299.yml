  quote: ''
  summary: 'The passage presents a ritual question-and-answer sequence: an unnamed
    questioner asks Ahura Mazda what posthumous reward a man receives for bringing
    different kinds of fire to the Daityo-gatu. Ahura Mazda gives graded equivalences:
    encampment fire equals forty fire-brands, a herdsman''s fire thirty, a field or
    hunter''s fire twenty, and one''s own hearth fire ten. The passage then begins
    a new question about cleansing.'
