  summary: The passage gives spoken formulas for cleansing water, earth, a cow, trees,
    and faithful persons. The formulas worship waters, earth, and the cow, refer to
    Mazda making plants grow, and invoke Airyaman for the faithful. Notes connect
    the earth formula’s women with heavenly rivers or Ahura’s spouses, and identify
    the source of plants as the body of the first-born bull after death.
