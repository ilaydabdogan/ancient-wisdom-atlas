canonical_text:
  quote: ''
  summary: The excerpt begins with a fragment mentioning trees and faithful persons,
    then gives graded rules for cleansing different social ranks and household members.
    The cleansed worshippers of Mazda are to compensate the cleanser with specified
    cattle or another satisfactory reward. If the cleanser leaves angry and displeased,
    the Druj Nasu enters the cleansed persons through bodily openings, reaches the
    nails, and they remain unclean forever. The sun is then said to grieve, with Spitama
    Zarathustra addressed.
