canonical_text:
  quote: ''
  summary: Angra Mainyu and allied demonic beings seek Zarathuitra's death. Zarathuitra
    rises unshaken, carrying great stones obtained from Ahura Mazda, refuses Angra
    Mainyu's offer to renounce the Mazdayasnian law, and names sacred ritual objects,
    Haoma, and Mazda-taught Words as his weapons against Angra Mainyu's creation.
    The passage also mentions the future fiend-smiter Saoshyawt coming to life from
    Lake Kasava in the dawn region.
  language: English
  quote_policy: summarized
