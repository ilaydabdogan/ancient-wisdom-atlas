canonical_text:
  quote: ''
  summary: Ahura Mazda instructs Spitama Zarathustra about Dakhmas, corpse dust, the
    merit of pulling Dakhmas down, the afterlife reward for doing so, the demonic
    and disease-bearing character of corpse-exposure sites, and procedures for placing
    a still-born child in a clean, dry, ritually separated part of a Mazdean house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura Mazda says the ground on which a Dakhma stands is not restored until
    the corpse dust has mingled with the dust of the earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda urges people in the material world to pull down Dakhmas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who pulls down even a body-sized amount of Dakhma has sins in thought,
    word, and deed remitted and atoned for.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For that person, two spirits will not wage war over the soul; when he enters
    the blissful world, the stars, moon, sun, and Ahura Mazda rejoice in him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The questioner asks where fiends and troops of fiends gather and rush together
    to kill very large numbers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ahura Mazda identifies Dakhmas built on the earth and bearing corpses of dead
    men as the place where fiends and troops of fiends gather.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the Dakhmas, the fiends feed, void filth, and eat corpses; the smell there
    is described as the smell of their feeding.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fiends revel there until stench is rooted in the Dakhmas, and diseases
    are said to arise from the Dakhmas; death has most power there after sunset.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: For people of evil spirit who do not seek better spirit, the Gaini are said
    to make diseases stronger by a third on parts of their bodies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: If a woman in the house of a worshipper of Mazda brings forth a still-born
    child, the worshippers ask what should be done.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ahura Mazda directs that the place chosen in the Mazdean house should have
    the cleanest and driest ground and be least passed through by flocks, herds, Fire,
    baresma bundles, and the faithful.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The prescribed distance is thirty paces from fire, water, and consecrated
    baresma bundles, and three paces from the faithful.
  category: other
  evidence_refs:
  - ev:11
