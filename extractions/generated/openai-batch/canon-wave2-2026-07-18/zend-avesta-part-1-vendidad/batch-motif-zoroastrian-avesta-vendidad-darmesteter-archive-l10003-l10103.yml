canonical_text:
  quote: ''
  summary: The passage gives ritual-legal instructions attributed to Ahura Mazda.
    It states a penalty for a defiling deed, describes how eating vessels touched
    by a dog carcass or human corpse may be purified according to their material,
    declares some vessel materials permanently unclean, and explains how a cow that
    has eaten corpse matter may become clean after a one-year restriction on its ritual
    use and consumption.
  language: English
