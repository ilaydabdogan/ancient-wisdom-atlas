canonical_text:
  quote: ''
  summary: A fragmentary Ashurbanapal passage describes a march through dangerous
    terrain with two-headed serpents, divine help from Marduk reviving the troops,
    and further movement through harsh land. A separate Ashurbanapal account says
    he captured Ushu on the sea coast, punished disobedient non-tributary inhabitants,
    carried gods and people to Assyria, reduced rebellious Acco, displayed bodies
    on poles around the city, deported survivors, and added them to an army presented
    by Ashur.
  language: English with Akkadian transliteration
  quote_policy: summarized
