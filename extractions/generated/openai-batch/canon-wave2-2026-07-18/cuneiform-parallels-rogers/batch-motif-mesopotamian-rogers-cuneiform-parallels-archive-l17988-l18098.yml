  quote: ''
  summary: The passage contains portions of letters attributed to Abdi-Khiba. He reports
    that royal garrisons and territories are failing, enemies and named opponents
    are active, the Khabiri have devastated royal territory, and he repeatedly asks
    the king to care for his land and send troops. A following letter opens with Abdi-Khiba's
    formal submission to the king, including falling at the king's feet seven and
    seven times, then reports hostile lands and requests troops against those who
    sinned against the king.
