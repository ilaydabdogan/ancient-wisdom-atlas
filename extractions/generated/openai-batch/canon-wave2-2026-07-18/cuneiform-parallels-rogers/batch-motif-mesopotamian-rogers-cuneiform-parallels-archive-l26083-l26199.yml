canonical_text:
  quote: ''
  summary: Sections 101-108 regulate merchant-agent losses, robbery on a journey,
    accounting for goods and money, sealed memoranda, disputes before the god and
    witnesses, multiple restitution, and punishment of a fraudulent wine seller by
    throwing her into water.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An agent who has no success where he goes must return double the money taken
    from the merchant; if money was given as a favor and the agent meets a reverse,
    he returns the principal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If an enemy robs an agent during a journey, the agent swears by the name of
    the god and goes free.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A merchant may give an agent grain, wool, oil, or other goods to traffic in;
    the agent records the price and returns the money to the merchant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The agent is to take a sealed memorandum for money given to the merchant.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the agent has not taken a sealed memorandum, unreceipted money is not placed
    to his account.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an agent has taken money and disputes with the merchant, the merchant
    brings the agent to account before the god and witnesses, and the agent must pay
    threefold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a merchant wrongs an agent and denies what the agent returned, the agent
    brings the merchant to account before the god and witnesses, and the merchant
    must pay sixfold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A wine merchant who receives money by the great stone or makes the drink measure
    smaller than the corn measure is called to account and thrown into the water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The translated passage presents the wine merchant as feminine.
  category: attribute
  evidence_refs:
  - ev:8
