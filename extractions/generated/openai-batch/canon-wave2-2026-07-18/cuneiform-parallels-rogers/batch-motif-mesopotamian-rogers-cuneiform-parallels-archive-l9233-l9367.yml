canonical_text:
  quote: ''
  summary: Papsukkal mourns, and Shamash weeps before Sin and Ea because Ishtar has
    descended to the land of No-return and has not come back. Animal and human sexual
    union has ceased. Ea creates Asushunamir and sends him to the gate of the land
    of No-return, where seven doors are to be opened and Ereshkigal is to be pleased.
    Asushunamir is instructed to ask for the khalziki-water skin. Ereshkigal reacts
    with breast-beating and finger-biting, rejects the desire as improper, and curses
    Asushunamir to degraded food, drink, dwelling, and assault.
  language: English
  quote_policy: summarized
