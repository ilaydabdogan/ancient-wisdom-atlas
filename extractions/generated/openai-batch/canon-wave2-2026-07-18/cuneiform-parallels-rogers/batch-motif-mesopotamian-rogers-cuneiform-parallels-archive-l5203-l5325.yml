canonical_text:
  quote: '"Raging storms, evil gods are they"'
  summary: 'A fragment describes instructions to raise cloud and storm, hold a life-seal
    before the face, and slay the Labbu, whose blood then flows for a long duration.
    The next section describes seven evil demons as raging storms, evil gods, and
    destructive beings created in heaven''s vault, listing their forms and effects:
    wind, dragon, leopard, Shibbu, wolf, another rampant being, and an evil storm-wind
    that darkens cities and the heavens.'
  language: English with Akkadian transliteration
  quote_policy: quoted
