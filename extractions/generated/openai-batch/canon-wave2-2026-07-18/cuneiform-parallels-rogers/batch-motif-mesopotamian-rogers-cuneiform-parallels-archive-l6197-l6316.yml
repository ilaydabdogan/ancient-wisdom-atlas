canonical_text:
  quote: ''
  summary: A fish-bodied, human-voiced being named Pannes/Oannes appears from the
    Red Sea near Babylonia in the first year, teaches humans writing, numbers, arts,
    law, agriculture, temple-founding, city-settlement, and other elements of civilized
    life, then returns nightly to the sea because he is amphibious. The passage adds
    that similar beings later appeared, that Oannes wrote a treatise on creation and
    citizenship for humans, and that Berossus listed early kings with long reigns,
    during one of which another man-and-fish being named Idotion appeared from the
    Red Sea.
  language: English
