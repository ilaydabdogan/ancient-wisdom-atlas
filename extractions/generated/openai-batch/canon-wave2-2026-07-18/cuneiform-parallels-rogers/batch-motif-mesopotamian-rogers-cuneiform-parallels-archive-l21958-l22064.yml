canonical_text:
  quote: ''
  summary: 'The passage reports Sennacherib''s campaign: Levantine kings bring tribute
    and kiss his feet; Sidqa of Ashkelon is deported with his household and gods,
    and Sharruludari is installed under tribute; Sidqa''s cities are captured; Ekron''s
    leaders imprison Padi and give him to Hezekiah of Judah; Egyptian and Melukhkha
    forces are summoned and defeated near Altaqu with Ashur''s help; and Ekron''s
    offending leaders are slain and displayed on poles around the city.'
  language: English
  quote_policy: summarized
