canonical_text:
  quote: ''
  summary: Legal provisions from the Code of Hammurapi concerning fugitive slaves,
    burglary, robbery, compensation for unrecovered robbery or loss of life, punishment
    for theft during a house fire, and the opening of a rule on royal service obligations.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who helps a palace slave or freedman's slave pass through the city
    gate to escape is to be put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A house owner who receives a fugitive slave and does not produce the slave
    at the commandant's demand is to be put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who seizes a fugitive slave in the field and returns the slave to
    the owner is to receive two shekels of silver from the owner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a captured slave will not name the owner, the slave is to be brought to
    the palace for inquiry and then returned to the owner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who keeps a slave in his house and is later found with the slave
    in his hands is to be put to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a slave escapes from the hand of the captor, the captor must swear by the
    god to the slave's owner and then goes free.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A burglar who has broken into a house is to be killed before the breach and
    thrust into it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A captured brigand is to be put to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a brigand is not captured, the robbed person recounts the loss before the
    god, and the city and governor of the place where the robbery occurred compensate
    the loss.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the loss was a life, the city and governor pay one mina of silver to the
    dead person's people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: If a fire breaks out in a man's house and someone who came to extinguish it
    takes the householder's property, that person is to be thrown into that fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The next section begins with a rule about a soldier or constable ordered to
    go on an errand of the king and not going, but the legal consequence is not included
    in the provided passage.
  category: sequence
  evidence_refs:
  - ev:11
