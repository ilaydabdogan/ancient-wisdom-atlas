canonical_text:
  quote: ''
  summary: A first-person royal campaign account attributed by the heading to Ashurnazirpal
    describes crossing rivers and mountains, entering and taking Aribua, storing supplies
    and settling Assyrians there, destroying cities of Lukhuti, impaling captives,
    marching to the great sea, washing weapons and offering to gods, receiving tribute
    from coastal rulers, climbing Mount Amanus, cutting timber, making offerings,
    and setting up a stela of royal deeds.
