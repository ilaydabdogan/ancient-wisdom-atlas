canonical_text:
  quote: ''
  summary: 'A damaged prayer fragment asks that a lord be appeased and identifies
    a hand-lifting prayer to Sin. The main hymn addresses Ramman/Iškur as the weather
    god: glorious lord, mighty bull, child of heaven, lord of Karkar and plenty, companion
    of Ea, storm-rider, and lion of heaven. His name and splendor affect the land;
    his thunder shakes Mullil/Enlil and makes Ninlil tremble; Enlil sends forth his
    son Ramman.'
  language: English with Sumerian/Akkadian transliteration excerpts
  quote_policy: summarized
