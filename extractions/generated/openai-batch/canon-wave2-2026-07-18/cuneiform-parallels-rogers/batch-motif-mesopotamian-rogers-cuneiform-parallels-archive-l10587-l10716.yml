canonical_text:
  quote: ''
  summary: A hymn to Marduk presents a repeated litany in which cities and many named
    deities call on him to rest or have peace. Editorial notes explain that “Rest”
    abbreviates an older incantation formula meaning that the deity’s heart should
    be appeased, and that the hymn was performed antiphonally. The closing lines ask
    that the anger of the lord of the gods be appeased and that Nippur, Sippar, and
    Babylon not be cast away.
  language: English
  quote_policy: summarized
