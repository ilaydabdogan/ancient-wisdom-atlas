canonical_text:
  quote: ''
  summary: 'The passage praises Tutu under several names and functions: purifier,
    good wind, giver of plenty, lord of pure incantation, reviver of the dead, merciful
    liberator of captive gods, creator of humanity, destroyer of evil, knower of divine
    hearts, director of righteousness, and namer of the four quarters of the earth
    in a fragmentary note.'
  language: English with Akkadian transliteration
  quote_policy: summarized
