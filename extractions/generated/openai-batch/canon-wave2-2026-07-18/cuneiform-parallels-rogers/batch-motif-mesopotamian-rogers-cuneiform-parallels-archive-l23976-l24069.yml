canonical_text:
  quote: ''
  summary: The passage from the Cylinder of Cyrus presents Marduk as choosing Cyrus,
    guiding him to Babylon, allowing a peaceful entry, delivering Nabonidus to him,
    and receiving praise from the people. Cyrus then declares his royal titles and
    ancestry, states that Bel and Nabu love his rule, cares for Marduk's worship,
    prevents enemies from entering, removes a dishonoring yoke, restores ruined dwellings,
    and receives Marduk's blessing for himself, his son, and his troops.
  language: English translation with Akkadian transliteration in the passage
  quote_policy: summarized
