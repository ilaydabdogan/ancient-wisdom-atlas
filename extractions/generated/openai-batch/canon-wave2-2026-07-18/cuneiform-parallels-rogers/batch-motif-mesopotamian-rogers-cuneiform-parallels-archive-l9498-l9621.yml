canonical_text:
  quote: ''
  summary: The passage opens with a ritual couplet in which wailers perform and the
    dead are invited to return and smell incense, with a note identifying the text
    as part of a sacred meal for souls of the dead. The Nergal and Ereshkigal fragment
    then describes the gods preparing a feast, sending a messenger to Ereshkigal so
    she may receive her portion, and Ereshkigal sending Namtar to high heaven. Fragmentary
    and editorially reconstructed material describes an insult to Namtar when a god
    does not rise before him, Ereshkigal's threat to kill the offender, Namtar's return
    to the gods, and his attempt to identify the absent god.
  language: English with Akkadian transliteration
  quote_policy: summarized
