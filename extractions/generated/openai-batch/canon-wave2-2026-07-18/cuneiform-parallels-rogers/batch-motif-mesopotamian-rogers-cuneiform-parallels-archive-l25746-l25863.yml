canonical_text:
  quote: ''
  summary: Selected laws from the Code of Hammurapi regulate repayment of loans in
    grain or sesame, failed crops, negligent dike or canal maintenance causing water
    damage, unauthorized grazing by shepherds, cutting a tree in an orchard without
    consent, and the start of a provision about giving a field to a gardener to plant
    a garden.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A debtor who lacks money to repay must give grain or sesame to the merchant
    at market value fixed by the king for the loan and its interest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a cultivator has not secured a crop of grain or sesame in his field, his
    contract is not made void.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who neglects to strengthen his dike and whose dike breaks, allowing
    water to carry away a meadow, must restore the grain he caused to be lost.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the man responsible for the dike break cannot restore the grain, he and
    his goods are to be sold, and the people whose grain was carried away share the
    proceeds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man who opens a canal for irrigation and neglects it, causing water to carry
    away an adjacent field, must measure out grain on the basis of the adjacent fields.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man who opens the waters and causes water to overflow his neighbor's field
    must pay ten GUR of grain per GAN.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A shepherd who pastures sheep on a field without agreement or the owner's
    consent owes the field owner twenty GUR of grain per GAN beyond the owner's harvest
    of the field.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a shepherd turns sheep into a field after the sheep have gone up from the
    meadow and been closed within the gate, he must keep the field and at harvest
    measure out sixty GUR of grain per GAN to the field owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man who cuts down a tree in another man's orchard without the orchard owner's
    consent must pay one half mina of silver.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage begins a provision in which a man gives a field to a gardener
    to plant a garden, and the gardener plants the garden.
  category: action
  evidence_refs:
  - ev:7
