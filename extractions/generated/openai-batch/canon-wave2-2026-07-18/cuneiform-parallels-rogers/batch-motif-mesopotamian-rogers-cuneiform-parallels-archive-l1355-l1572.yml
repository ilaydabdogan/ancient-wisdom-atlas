canonical_text:
  quote: ''
  summary: A fragmentary creation passage recounts Apsu and Tiamat consulting about
    the gods, their sons. Apsu complains that he cannot rest because of their clamor
    and proposes destroying or dispersing their way. Tiamat becomes angry and speaks
    of destroying what they made. Mummu gives hostile counsel to Apsu. Apsu accepts
    the counsel. Ea, described as knowing all things, perceives their design and prepares
    a pure incantation. After a lacuna, fragments mention an avenger, Tiamat, Apsu
    laid waste, Mummu taken captive, vengeance, tempest, and Tiamat hearkening to
    a bright god.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
