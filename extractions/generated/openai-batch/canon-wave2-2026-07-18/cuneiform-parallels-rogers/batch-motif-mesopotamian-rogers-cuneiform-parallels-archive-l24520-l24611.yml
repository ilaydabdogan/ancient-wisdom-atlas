canonical_text:
  quote: ''
  summary: A certificate records that Ina-Uruk-rishat, having no daughter, adopted
    Etirtu as daughter after a payment of seven shekels of gold. The document defines
    Etirtu’s permitted statuses, forbids making her a servant, sets duties of reverence
    and postmortem water libation, states penalties for denial of the relationship,
    and records an oath before deities and King Kurigalzu with witnesses and date.
    The supplied excerpt then begins the next marriage-contract section, where a man
    says he has no child and wants a child.
  language: English
  quote_policy: summarized
