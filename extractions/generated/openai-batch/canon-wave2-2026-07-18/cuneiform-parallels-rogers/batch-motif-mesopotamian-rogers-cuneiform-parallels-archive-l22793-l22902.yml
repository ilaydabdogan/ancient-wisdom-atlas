canonical_text:
  quote: ''
  summary: 'The passage first lists kings from coastal and island regions from whom
    the narrator demands timber, columns, stone, sphinxes, and bulls for his palace
    at Nineveh. It then begins an account of the narrator''s tenth campaign: Ashur
    gives confidence and command, troops march from Asshur, cross flooded rivers,
    climb difficult mountains, besiege Ba''al of Tyre, and continue through waterless
    terrain toward Melukhkha, using well water and taking camels from kings of Aribi.'
  language: English with Akkadian transliteration
  quote_policy: summarized
