canonical_text:
  quote: ''
  summary: A passage on the seven evil demons describes destructive beings associated
    with Adad moving through heaven, storming the vault of heaven, and darkening Sin.
    Ellil consults Ea, recalls the celestial ordering of Sin, Shamash, and Ishtar,
    sees Sin darkened, and sends his minister Nusku to report the matter to Ea in
    the ocean.
  language: English, with transliterated Akkadian in parallel lines
  quote_policy: summarized
