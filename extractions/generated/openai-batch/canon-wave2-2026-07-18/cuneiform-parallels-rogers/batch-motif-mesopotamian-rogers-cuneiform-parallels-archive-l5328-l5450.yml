- id: obs:1
  text: The seven evil demons are described as mighty destroyers associated with Adad,
    moving at Adad's right and flashing like lightning as they go to wreak destruction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The demons arise evilly in the broad heaven, identified as the home of Anu,
    with no one opposing them.
  category: setting
