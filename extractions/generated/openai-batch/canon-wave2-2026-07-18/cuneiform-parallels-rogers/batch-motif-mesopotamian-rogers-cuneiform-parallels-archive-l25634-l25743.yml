  quote: Ramman (god of storms) ravage the field and carry away the (remaining) produce
  summary: Legal provisions from the Code of Hammurapi concerning cultivation duties,
    neglected or unreclaimed fields, tenant and owner shares, storm or drought losses,
    debts, interest, and fields pledged as security for loans.
  language: English with Akkadian transliteration
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A person who neglects a field must compensate the owner with grain based on
    neighboring fields and restore the field by breaking it up, hoeing, harrowing,
    and returning it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who takes an unreclaimed field for three years and leaves it uncultivated
    must restore it in the fourth year and measure out grain per GAN.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If an owner has already received rent-produce and Ramman ravages the field
    and removes the remaining produce, the loss falls on the tenant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the owner has not received the produce, the tenant and owner share the
    grain according to the contract.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a tenant transfers cultivation to another because of failure to gain maintenance
    in a former year, the owner is not to interfere if the field is cultivated, and
    grain is received at harvest according to the contracts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a debtor’s field is ravaged by Ramman, the produce is carried away, or
    grain fails because of lack of water, the debtor does not return grain to the
    creditor or pay that year’s interest, and alters the tablet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A borrower may give a field as security to a merchant and instruct him to
    cultivate it and take grain and sesame from it; at harvest, the field owner receives
    the produce and pays the merchant for loan, interest, and cultivator maintenance.
  category: action
  evidence_refs:
  - ev:7
