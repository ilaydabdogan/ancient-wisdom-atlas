  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A creditor who takes grain from a heap or store without the owner's consent
    must restore the grain and forfeit what he had lent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man who seizes another for debt without having a debt against him must pay
    one third of a mina of silver for each seizure.
  category: sequence
  evidence_refs:
  - ev:6
