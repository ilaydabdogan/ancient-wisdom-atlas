  text: A wine seller who gives 60 KA of drink on credit at harvest time is to receive
    50 KA of grain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man away on a journey gives silver, gold, stones, or portable property to
