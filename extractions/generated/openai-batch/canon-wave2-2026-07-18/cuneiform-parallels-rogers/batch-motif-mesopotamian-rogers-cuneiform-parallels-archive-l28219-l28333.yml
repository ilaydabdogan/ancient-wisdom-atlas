literal_observations:
- id: obs:1
  text: The passage lists daily wages or payments in silver for several crafts and
    kinds of labor, including stone cutter, carpenter, leather worker, ship builder,
    and builder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states daily hire rates for ships, including a ship, a ship sailing
    upstream, and a ship of sixty GUR tonnage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a purchased male or female slave develops bennu fever before completing
    a month, the slave is returned to the seller and the buyer receives back the money
    paid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a purchased male or female slave has a claim upon him or her, the seller
    is responsible for the claim.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If someone buys a slave in a foreign land and the slave is later recognized
    by the owner in the buyer's own land, native slaves are to receive freedom without
    payment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the recognized slaves are natives of another land, the purchaser must declare
    before the god the money paid, the owner must repay that money to the merchant,
    and the owner receives the slave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a slave says to his master, 'Thou art not my master,' he is called to account
