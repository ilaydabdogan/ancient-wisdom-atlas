  summary: The passage gives wage and ship-hire rules, several laws about the purchase,
    claims, return, liberation, or punishment of slaves, and the opening of the epilogue
    in which Hammurapi describes his laws as righteous, calls himself a wise and perfect
    king, and says Ellil presented the people to him while Marduk gave him rule.
