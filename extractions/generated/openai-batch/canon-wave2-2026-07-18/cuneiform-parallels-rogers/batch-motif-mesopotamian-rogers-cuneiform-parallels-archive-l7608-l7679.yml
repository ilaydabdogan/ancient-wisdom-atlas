canonical_text:
  quote: ''
  summary: After the deluge story ends, Ut-napishtim is said to dwell far away at
    the mouth of the rivers. He challenges Gilgamesh to avoid sleep for six days and
    seven nights as part of his search for life. Gilgamesh fails, but Ut-napishtim’s
    wife pities him, and Gilgamesh is directed to a plant at the bottom of the ocean.
    He retrieves it with stones tied to his feet and intends to bring it to Uruk as
    a plant of renewed youth. While he bathes in fresh water, a serpent steals the
    plant. Gilgamesh and Ur-shanabi then return overland to Uruk, where Gilgamesh
    speaks of rebuilding the city walls.
  language: English
  quote_policy: summarized
