canonical_text:
  quote: ''
  summary: 'The passage depicts severe scarcity: a mother and daughter are separated
    and watch each other’s balances; in the sixth year a daughter and child are prepared
    for eating in damaged lines; households and people are under extreme distress.
    A second section describes Adad diminishing rain, lower waters being restrained,
    crop failure, salt-whitened fields, plants not sprouting, and lambs not fattening.
    Notes explain Nisaba as a vegetation deity and interpret the white/salt ground
    as an effect of drought.'
