canonical_text:
  quote: ''
  summary: The passage presents a bilingual creation text in which Marduk places reed-work
    upon the waters, pours dust on it, forms mankind for the gods' desired habitation,
    creates animals, rivers, vegetation, lands, marshes, swamps, houses, cities, and
    named cultic places. The goddess Arum/Aruru is named as creating the seed of mankind
    with him. The passage then notes the fragmentary state of the tablet and begins
    the following section on cattle and beasts, including an editorial note about
    a small Assyrian text and Nin-igi-azag, followed by a fragmentary opening line
    about gods in assembly making the [heavens?].
  language: English translation with Akkadian transliteration
  quote_policy: summarized
