  summary: A fragmentary portion of the Sixth Tablet reports Ea answering and speaking
    about transformation, destruction of one, and men. After a lost section, the gods
    rejoice, set their dwelling in Upshukkinaku, identify a heroic son as their avenger
    and succorer, sit in assembly, name him, and exalt him.
