canonical_text:
  quote: ''
  summary: The passage gives provisions from the Code of Hammurapi concerning daughters
    and marriage settlements, adoption and rearing of children, return to a biological
    father's house under certain conditions, protection from claims after adoption
    or craft training, compensation when an adopted son is dismissed, punishments
    for denying or abandoning rearing parents, and the beginning of a provision about
    a son given to a wet-nurse.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment states that after a father has gone to his fate, an unnamed
    female shall not share in the goods of her father's house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a father has not given a daughter by a concubine a marriage settlement
    or husband, her brothers must provide a marriage settlement and give her to a
    husband after the father's death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young child taken to sonship and reared is protected from claims by others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If an adopted child is rebellious against the adopted father and mother, the
    adopted son returns to the house of his father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: No claim may be brought for the son of a chamberlain who is a palace warder
    or for the son of a vowed woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If an artisan adopts a son and teaches him his handicraft, no one may bring
    a claim for that child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the artisan does not teach the adopted son his handicraft, the adopted
    son may return to his father's house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a man has not numbered the child he adopted and reared with his sons, that
    adopted son may return to his father's house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a father who reared an adopted son later acquires children and seeks to
    cut off the adopted son, the adopted son shall receive one third of a son's portion
    from the father's goods and then go, but not field, garden, or house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the son of a chamberlain or of a vowed woman tells the rearing father or
    mother, 'Thou art not my father' or 'Thou art not my mother,' his tongue is to
    be cut out.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the son of a chamberlain or of a vowed woman knows his father's house,
    hates the father and mother who reared him, and goes back to his father's house,
    his eye is to be plucked out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The beginning of a provision states that a man gives his son to a wet-nurse
