  quote: ''
  summary: The passage summarizes events in Sargon II's reign and gives an annal excerpt
    on Samaria. It describes western rebellion and Yamani's flight, Assyrian campaigns
    in Urartu/Chaldia and nearby regions, the invasion of Babylonia and Sargon's proclamation
    as governor there, the dedication of Dur-Sharrukin, Sargon's violent death without
    burial in his house, and the conquest, deportation, resettlement, and taxation
    of Samaria.
  language: English
