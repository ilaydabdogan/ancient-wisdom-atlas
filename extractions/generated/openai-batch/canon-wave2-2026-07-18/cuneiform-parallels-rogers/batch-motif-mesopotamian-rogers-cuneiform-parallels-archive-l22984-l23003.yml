    quickly to Babylon and was accepted as king without trouble. The passage notes
    that few native inscriptions preserve accounts of his military campaigns, since
    most inscriptions concern building and restoration projects, and it begins to
    mention Jehoiakim of Judah paying tribute after Nebuchadrezzar's departure from
    the south.
