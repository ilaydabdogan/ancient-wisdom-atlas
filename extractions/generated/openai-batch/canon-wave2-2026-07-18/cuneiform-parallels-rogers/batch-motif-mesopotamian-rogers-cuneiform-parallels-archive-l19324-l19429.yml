canonical_text:
  quote: By command of Ashur, the great lord, my lord I fought with them and defeated
    them.
  summary: The passage gives editorial context on Shalmaneser III and excerpts from
    the Obelisk and Monolith inscriptions. In the Obelisk Inscription, the royal speaker
    campaigns against Balikh-region cities after Giammu is killed, crosses the Euphrates,
    receives Hittite tribute, and defeats a coalition by command of Ashur. In the
    Monolith Inscription, the royal speaker departs Nineveh, crosses the Tigris, approaches
    Giammu's Balikh cities, enters palaces, brings in his gods, holds festival, and
    plunders treasury goods for Asshur.
  language: English
  quote_policy: quoted
