canonical_text:
  quote: ''
  summary: A sick speaker reports failed ritual diagnosis, lack of divine help, premature
    funerary treatment, an enemy's joy, and eventual mercy associated with family
    guardian beings. The next section gives an incantation invoking atonement deities
    on behalf of a sick person and asking whether moral, verbal, or cultic offenses
    have caused the affliction. An editorial note explains the Shurpu burning series
    as rites to remove bans and curses by burning objects while seeking the guilt
    behind suffering.
  language: English translation with Akkadian transliteration also present
  quote_policy: summarized
