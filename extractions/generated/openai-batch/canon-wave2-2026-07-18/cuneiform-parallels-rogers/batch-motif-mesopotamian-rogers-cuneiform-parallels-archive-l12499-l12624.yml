canonical_text:
  quote: ''
  summary: The passage presents a wisdom fragment with instructions against slander,
    evil speech, and impulsive speech; commands daily sacrifice, prayer, incense,
    petition, and prostration to one's god; links fear of gods, offering, and prayer
    with favor, life, forgiveness, and lengthened days; adds social obligations toward
    friend and companion; and concludes with a priestly prayer asking release from
    bonds and fetters, a brightened face, commendation to the servant's creator god,
    and life so the servant may praise the deity.
  language: English translation with Akkadian transliteration present in the source
    passage
  quote_policy: summarized
