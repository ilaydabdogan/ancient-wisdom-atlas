canonical_text:
  quote: ''
  summary: Ea promises Nergal fourteen companions to accompany him. Nergal comes to
    Ereshkigal's door and asks the porter for entry, saying he has been sent. The
    porter consults Namtar, who identifies Nergal to Ereshkigal. Ereshkigal orders
    that he be brought in and says she will slay him. After damaged lines, Nergal
    stations named companions at successive doors, cuts down Namtar in the court,
    commands doors to be opened, and seizes Ereshkigal by the hair from her throne
    to the ground to cut off her head.
  language: English with Akkadian transliteration
  quote_policy: summarized
