  summary: Gilgamesh asks Ut-napishtim how he was exalted and found life among the
    gods. Ut-napishtim replies that he will reveal a hidden word and the decision
    of the gods. He names Shurippak on the Euphrates as an old city and describes
    the gods as moved to send a flood, with Ea, lord of Wisdom, repeating their word
    to a reed hut.
