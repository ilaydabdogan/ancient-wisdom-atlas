canonical_text:
  quote: ''
  summary: In this portion of the Babylonian flood account, Ellil is blamed for sending
    the deluge without counsel and destroying the people. When Ellil sees the ship
    and realizes that someone has survived, he becomes angry. Ninib identifies Ea
    as the one capable of planning the escape. Ea rebukes Ellil for sending a flood
    without thought, urges measured punishment and mercy, and says that he revealed
    the divine secret indirectly by making Atrakhasis see a dream. Ea then enters
    the ship, brings forth the first-person survivor and his wife, positions and blesses
    them, and declares that Ut-napishtim and his wife are now to be like the gods.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
