canonical_text:
  quote: ''
  summary: The passage presents sections of Esarhaddon Prism B. Hazael of Aribi brings
    tribute to Nineveh and asks for his gods; Esarhaddon repairs and returns the gods,
    appoints Tabua, imposes taxes, and later installs Ya'lu. A later column describes
    rebuilding an armory with spoils attributed to Ashur, forced labor from conquered
    peoples, a terrace made with mountain stone, and demands involving western and
    maritime kings, including Manasseh of Judah.
  language: English translation with Akkadian transliteration also present
  quote_policy: summarized
