canonical_text:
  quote: Thy word sounds over the earth, and vegetation springs up.
  summary: 'A hymn to Sin praises the power of his word: divine beings bow, abundance
    and living creatures increase, and truth and righteousness arise. The hymn declares
    his word unknowable and his lordship unrivaled, petitions him to look on his temple
    and city, and invokes his wife, son, the Igigi, and the Anunnaki to ask that he
    be appeased.'
  language: English translation with Sumerian/Akkadian transliteration
  quote_policy: quoted
