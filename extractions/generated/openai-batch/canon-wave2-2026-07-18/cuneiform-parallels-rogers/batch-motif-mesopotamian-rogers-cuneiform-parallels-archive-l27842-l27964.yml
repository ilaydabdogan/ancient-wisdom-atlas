canonical_text:
  quote: ''
  summary: Legal clauses from the Code of Hammurapi regulate liability for hired boats,
    lost cargo, ship collisions, annual hire payments, seizure of an ox for debt,
    and damage or loss involving hired oxen, cows, and asses. One collision clause
    requires a declaration of loss before the god.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boatman who carelessly grounds or loses a hired ship must render ship for
    ship to the owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a hired boatman and ship carry freight and the boatman carelessly grounds
    the ship or loses its contents, the boatman must render back the ship and what
    was lost from it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boatman who grounds a man's ship and refloats it must pay money amounting
    to half of the ship's price.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hired boatman is to be paid six GUR of corn per year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When an upstream-moving ship strikes and sinks a downstream-moving ship, the
    owner of the sunk ship declares the lost goods before the god, and the upstream
    ship's owner must render the ship and losses.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man who seizes an ox for debt must pay one third of a mina of silver.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The annual hire of a working ox is four GUR of grain, and the hire of a milch
    cow is three GUR to its owner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a hired ox or ass is killed by a lion in the field, the loss belongs to
    the owner.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a hired ox dies through neglect or blows, the hirer must render ox for
    ox to the owner.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a hired ox has its foot crushed or nape cut, the hirer must render ox for
    ox; if its eye is lost, the hirer pays half its price to the owner.
  category: action
  evidence_refs:
  - ev:9
