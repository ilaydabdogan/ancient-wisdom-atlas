  quote: "“I drew him like a fish out of the sea and cut off his head.”"
  summary: A royal inscription of Esarhaddon recounts the conquest and destruction
    of Sidon, the capture and execution of its king Abdmilkot after flight into the
    sea, the plundering and deportation of people and goods, the founding of a new
    city named Esarhaddon-burg, and the appointment of Assyrian officials. A following
    fragment begins an account of Adumu, a fortress of Aribi, earlier captured by
    Sennacherib, Esarhaddon's father.
