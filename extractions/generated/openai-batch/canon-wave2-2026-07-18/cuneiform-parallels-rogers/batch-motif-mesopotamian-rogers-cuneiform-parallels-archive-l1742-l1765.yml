canonical_text:
  quote: ''
  summary: A fragmentary Akkadian transliteration from the Second Tablet names Tiamat,
    Apsu, Ea, Anshar, and the gods. Tiamat is associated with hostile action or plotting
    against the gods and with recompense for Apsu. Ea hears the matter, is distressed
    and silent, then goes to Anshar, identified as his father or begetter, and reports
    what Tiamat has planned. The reported speech calls Tiamat “our mother/begetter,”
    says she has hated the speakers, has arranged an assembly, is raging, and that
    the gods have gathered or turned to her.
  language: Akkadian transliteration with English heading
  quote_policy: summarized
