canonical_text:
  quote: ''
  summary: 'The passage summarizes Sargon II''s accession after Shalmaneser V, notes
    that he was not of the royal line, and reviews major military and political events
    of his reign: the fall and deportation of Samaria, conflict with Merodach-baladan
    in Babylonia, suppression of a western coalition, and replacement of Azuri of
    Ashdod by his twin brother Akhimiti.'
  language: English
  quote_policy: summarized
