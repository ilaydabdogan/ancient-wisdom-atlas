canonical_text:
  quote: ''
  summary: After victory over his enemies, the lord, named Marduk in the transliterated
    portion, takes the tablets of Destiny, secures captive gods, returns to the conquered
    Tiamat, breaks her skull, disperses her blood, divides her body, makes one half
    a covering for heaven, restrains her waters, surveys heaven and the Deep, and
    founds E-sharra for Anu, Bel, and Ea.
  language: English with Akkadian transliteration
  quote_policy: summarized
