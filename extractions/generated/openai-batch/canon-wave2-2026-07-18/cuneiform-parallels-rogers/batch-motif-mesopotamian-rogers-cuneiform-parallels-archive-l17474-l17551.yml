canonical_text:
  quote: ''
  summary: 'The passage summarizes the political administration of Egyptian-held Syria
    and Palestine in the Tell-el-Amarna period: local rulers were retained as princes
    under Egyptian officers; the region is divided into Canaan and Amurru; Egyptian
    power weakened on the borders; governors appealed for aid against the Khatti/Hittites
    and Khabiri; and the author discusses Hittite references and the debated relationship
    between Khabiri and Hebrews.'
  language: English
  quote_policy: summarized
