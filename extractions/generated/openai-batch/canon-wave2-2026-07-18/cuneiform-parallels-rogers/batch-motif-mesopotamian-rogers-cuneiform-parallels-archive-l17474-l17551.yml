- id: obs:1
  text: Some native rulers descended from local royal lines were retained but called
    princes rather than kings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: These local rulers were not free to rule their cities or provinces in internal
    or external affairs and were under the direction of an officer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage divides Syria and Palestine roughly into Canaan, the larger southern
    portion, and Amurru, the Lebanon region.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tell-el-Amarna documents are said to deal largely with Canaan and Amurru
    and to show their political situation especially in the reign of Amenophis IV.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the long peaceful reign of Amenophis III, Egyptian power had not been
    felt on the borders of the king's Asiatic dominions, leaving the borders vulnerable
    to invasion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many governors were making appeals to the king for aid against enemies threatening
    Egyptian dominion in Asia.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two enemies identified as most dreaded were the Khatti, also called Hittites,
    and the Khabiri.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Khatti/Hittites are identified with the people later mentioned in Egyptian
    inscriptions as Kheta and are described as having pressed southward from Kappadokia
    into Syria.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Hittites later fought Rameses II at Kadesh and that
    a kingdom associated with them endured in remnants until the fall of Carchemish
    under Sargon II in 717 B.C.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The name Hittites is said to be used in the Old Testament in a broad sense,
    including Lebanon branches and a subordinate clan in southern Palestine near Hebron.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Khabiri are described as difficult to locate; the word is said to be identical
    with Hebrew, but the passage rejects identifying them with the invading Hebrews
    under Joshua because of chronological and narrative difficulties.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Khabiri are described as a wandering stem that had not yet made a local
    habitation in the land, and Abraham is cited as having been called a Hebrew in
    this sense when he first appeared in Palestine.
  category: relationship
  evidence_refs:
  - ev:5
