canonical_text:
  quote: ''
  summary: 'A Babylonian chronicle passage records dated political and military events:
    Assyrian campaigns against Egypt, the death and succession of an Elamite king,
    persons brought to Assyria, deities entering Agade and Babylon, the conquest of
    Shupri and Memphis, deaths of royal figures, executions of nobles, Esarhaddon’s
    death, the enthronement of his two sons in Babylon and Assyria, later captures,
    and a scribal colophon.'
