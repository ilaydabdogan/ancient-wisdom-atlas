canonical_text:
  quote: "“With the power of Nabu and Marduk, my lords, I ordered my troops to march
    to the Lebanon.”"
  summary: A royal speaker recounts passing difficult roads, defeating enemies, governing
    lands, and removing evil. In the Lebanon inscription, he says Marduk entrusted
    lands to him, that he exalted Babylon, entered the cedar mountains of Lebanon,
    drove out an enemy, restored scattered inhabitants, opened mountain roads, brought
    large cedars before Marduk and into Babylon, settled the Lebanon people in peace,
    and set up his royal image permanently.
  language: English with transliterated Akkadian
  quote_policy: quoted
