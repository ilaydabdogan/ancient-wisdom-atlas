canonical_text:
  quote: If a man have destroyed the eye of a gentleman, they shall destroy his eye.
  summary: The passage gives legal clauses from the Code of Hammurapi concerning unauthorized
    substitution of a child by a wet-nurse, striking a father, injuries to men of
    different legal statuses, penalties for striking superiors or equals, responsibility
    after quarrel wounds or death, and the beginning of a clause on striking a pregnant
    gentleman's daughter.
  language: English with Akkadian transliteration
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A wet-nurse who substitutes another child without the consent of the father
    and mother is called to account and punished by cutting off her breasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man has struck his father, the stated penalty is cutting off his hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man destroys the eye of a gentleman, his own eye is to be destroyed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a man breaks a gentleman's bone, his own bone is to be broken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the injured person is a freedman, destruction of the eye or breaking of
    the bone is punished by payment of one mina of silver.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the injured person is a gentleman's slave, destruction of the eye or breaking
    of the bone is punished by payment of half the slave's price.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man knocks out the tooth of a man of his own rank, his tooth is to be
    knocked out; if he knocks out the tooth of a freedman, he pays one third of a
    mina of silver.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a man strikes a superior, he is to receive sixty strokes with an ox-tail
    whip in public.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Striking the cheek of an equal gentleman requires payment of one mina of silver;
    striking a freedman by a freedman requires ten shekels of silver; a gentleman's
    slave striking the cheek of a freedman is punished by cutting off his ear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a man wounds another man in a quarrel, he must swear that he did not strike
    intentionally and must be responsible for the doctor.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: If a man dies from blows, the offender must swear; compensation differs according
    to whether the deceased is of gentle birth or the son of a freedman.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The next subsection begins with a case in which a man strikes a gentleman's
    daughter and causes her to lose what was in her womb; the clause is incomplete
    in the supplied passage.
  category: action
  evidence_refs:
  - ev:12
