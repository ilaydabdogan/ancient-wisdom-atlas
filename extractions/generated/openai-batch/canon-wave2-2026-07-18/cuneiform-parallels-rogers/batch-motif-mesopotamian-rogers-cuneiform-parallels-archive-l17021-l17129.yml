canonical_text:
  quote: ''
  summary: 'The passage contains Hammurapi-related administrative and royal-inscription
    material: a labor deployment order, an instruction to register an intercalary
    second Elul and adjust tribute timing, royal titles presenting Hammurapi as king
    of Babylon and ruler of the four quarters, claims that his deeds please Shamash
    and Marduk, and claims that he fortified Sippar with an earth-raised wall, swamp,
    Euphrates works, and a wall of safety. It also describes Sippar and Babylon dwelling
    peacefully, calls Hammurapi the darling of Shamash and beloved of Marduk, and
    begins a further royal inscription mentioning Marduk, Anu, and Bel.'
  language: English with Akkadian/Babylonian transliteration
