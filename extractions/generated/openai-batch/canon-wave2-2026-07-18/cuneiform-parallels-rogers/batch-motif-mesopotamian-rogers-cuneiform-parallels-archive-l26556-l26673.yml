  quote: ''
  summary: The passage presents legal cases from the Code of Hammurapi concerning
    wives entering another household during a husband's captivity or flight, the return
    or non-return of wives and children, divorce payments for child-bearing and childless
    women, fixed silver payments, and household misconduct by a wife.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment states that if there is no food in a man's house and his wife enters
    another house, the woman has no blame.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man is taken prisoner and there is no food in his house, his wife may
    have entered another house and borne children there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the captive husband later returns and regains his city, the woman returns
    to her first husband and the children follow their father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man leaves his city and flees, and his wife afterward enters another
    house, the wife does not return to him when he comes back because he hated his
    city and fled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who wishes to put away a child-bearing concubine or wife must return
    her marriage portion and give her the usufruct of field, garden, and goods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child-bearing woman brings up her children; after they are grown, she
    receives a portion like that of one son, and a man of her choice may marry her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man who puts away a wife who has not borne children gives her money equal
    to her bride-price and restores the marriage portion from her father's house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If no bride-price exists, one mina of silver is given for divorce; if the
    husband is a freedman, one third of a mina of silver is given.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A wife living in a man's house who sets her face to go out, acts foolishly,
    neglects her house, and belittles her husband is called to account.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the household-misconduct case, if the husband says he has put her away,
    she goes without divorce payment; if he says he has not put her away, he may marry
    another woman and the first woman dwells as a maidservant in his house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage ends with the beginning of a case in which a woman hates her husband
    and begins to speak, but the consequence is not included in the supplied passage.
  category: speech
  evidence_refs:
  - ev:8
