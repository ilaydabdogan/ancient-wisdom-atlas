  summary: 'The passage narrates Tiglathpileser IV''s early campaigns and imperial
    organization: intervention in Babylonia against Aramaeans, subjection of eastern
    provinces, conflict with Sarduris II of Khaldia/Urartu, the siege and provincialization
    of Arpad, submission and rebellion among Syro-Phoenician states, and administrative
    consolidation through Assyrian governors.'
