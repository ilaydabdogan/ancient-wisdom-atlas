canonical_text:
  quote: He sprinkled Ishtar with the water of life, and brought her forth.
  summary: A female authority commands Namtar, her messenger, to summon the Anunnaki
    at the palace of justice, seat them on a golden throne, sprinkle Ishtar with the
    water of life, and bring her forward. Namtar carries this out and leads Ishtar
    outward through seven doors, restoring her clothing, ornaments, and crown in reverse
    sequence. A fragmentary closing section gives obscure instructions concerning
    Tammuz, waters, oil, a red garment, music, maidens of joy, and Belili, identified
    in a note as Tammuz's sister.
  language: English
  quote_policy: quoted
