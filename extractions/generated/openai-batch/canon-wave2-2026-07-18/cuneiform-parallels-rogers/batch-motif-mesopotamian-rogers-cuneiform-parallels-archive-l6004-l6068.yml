canonical_text:
  quote: The road to Heaven he made him take, and to Heaven he ascended.
  summary: Adapa is instructed how to behave before Anu, including commands concerning
    food, water, garments, and oil. A messenger of Anu says Adapa broke the wing of
    the South wind and orders him brought before Anu. Adapa ascends to Heaven, reaches
    Anu's door, and is addressed there by Tammuz and Gishzida, who ask about his mourning
    garment.
  language: English translation with Akkadian transliteration
  quote_policy: quoted
