canonical_text:
  quote: ''
  summary: 'The passage describes Tiglathpileser IV''s western campaigns: the capture
    of Kullani, tribute payments, deportations and colonist settlement, installation
    of governors or kings, the flight of Hanno of Gaza, the removal of Gaza''s gods
    and goods to Assyria, intervention after Ahaz appealed for aid, and the devastation
    of Damascus and surrounding cities.'
