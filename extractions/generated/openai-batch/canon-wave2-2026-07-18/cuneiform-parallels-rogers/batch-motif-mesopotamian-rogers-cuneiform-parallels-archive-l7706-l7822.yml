  quote: ''
  summary: The passage first comments that Engidu, in dialogue with his reunited friend,
    cannot reveal the great mysteries; the search for eternal life has failed, though
    there is comfort in meeting friends in the next world. It then introduces another
    Babylonian recension of the Deluge story. In the fragment, a speaker tells the
    recipient to enter a ship, close its door, and bring grain, livestock, possessions,
    wife, kin, craftsmen, cattle, and beasts. Atra-khasis tells Ea that he has never
    built a ship and asks for a plan to be marked on the earth so he can build it.
