canonical_text:
  quote: ''
  summary: 'Rogers introduces a fragmentary text associated tentatively with the Atrakhasis
    Deluge tradition. The summary describes human sin followed by famine, Atrakhasis
    seeking Ea''s aid, a divine assembly in which Ellil complains, repeated punishments
    including pestilence and infertility, and finally the sending of a flood. The
    preserved column gives a year-by-year picture of distress: revolt, cities reduced
    to straits, people wandering downcast, and a daughter looking for the mother.'
  language: English
  quote_policy: summarized
