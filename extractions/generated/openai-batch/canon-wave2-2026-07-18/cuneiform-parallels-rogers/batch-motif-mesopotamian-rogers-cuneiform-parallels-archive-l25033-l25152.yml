canonical_text:
  quote: ''
  summary: The passage gives early provisions of the Code of Hammurapi concerning
    accusation, witness testimony, judicial misconduct, theft from divine or palace
    property, and transactions without witnesses or contract. One provision sends
    a person accused of sorcery to plunge into the river-god, whose outcome determines
    guilt or innocence and shifts penalties and property accordingly.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who makes an unproved capital accusation against another man is to be
    put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man accused of sorcery, when the accusation is not justified, is required
    to go to and plunge into the river-god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the river-god overcomes the accused person, the accuser takes the accused
    person's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the river-god declares the accused person innocent and saves him, the accuser
    is put to death and the person who plunged into the river-god takes the accuser's
    house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A note in the passage identifies the river procedure as a form of ordeal and
    describes ordeal as a method of detecting criminals widely spread in antiquity.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: A witness in a capital case who cannot justify his testimony concerning a
    crime is to be put to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A witness who lies about corn or money is to bear the sentence of that case.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A judge who alters a sealed decision after giving judgment must pay twelvefold
