literal_observations:
- id: obs:1
  text: In the fifth year of garden care, the garden owner and the gardener are to
    share equally, and the owner marks off and takes his share.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a gardener does not plant the whole field and leaves a waste place, the
    waste space is assigned to the gardener's portion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a gardener fails to plant an assigned arable field as a garden, he must
    measure out compensation to the field owner based on adjacent fields, perform
    the required work, and restore the field.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the field was unreclaimed land, the gardener must work and restore the
    field and measure out ten GUR of grain per GAN for each year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a garden is given to a gardener to manage, the gardener gives two thirds
    of the garden produce to the owner and keeps one third while he holds the garden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a gardener has not properly tilled a garden and has reduced its produce,
    he must measure out the garden produce according to adjacent gardens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The edition notes that five columns of text are erased and that the omitted
    sections concerned gardening, house tenancy, and merchant-tenant relations; the
    numbering of restored sections is described as doubtful.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the debt clause, a man who borrowed money from a merchant and had nothing
    to give offers the dates produced in his already cultivated garden for the debt.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The debt clause says the merchant shall not assent to taking all the dates;
    the garden possessor may take the dates and then pay the merchant.
  category: action
  evidence_refs:
  - ev:9
