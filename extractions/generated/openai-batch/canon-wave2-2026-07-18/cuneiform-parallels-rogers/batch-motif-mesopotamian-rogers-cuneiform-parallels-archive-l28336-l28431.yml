  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shamash is described as the great judge of heaven and earth, and righteousness
    is said to be established in the land by Shamash's command.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Marduk's order is said to protect Hammurapi's statue from destruction, and
    Hammurapi's name is to be remembered in Esagila.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: An oppressed person with a cause is instructed to come before Hammurapi's
    image, read the inscription, heed the words, learn his cause, find justice, and
    become glad at heart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The petitioner is imagined praising Hammurapi as a lord and father to his
