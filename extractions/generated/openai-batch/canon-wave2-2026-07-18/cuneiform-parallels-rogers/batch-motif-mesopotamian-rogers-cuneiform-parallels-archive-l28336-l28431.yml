canonical_text:
  quote: ''
  summary: Hammurapi speaks as a divinely called king who brings peace, security,
    prosperity, and justice. He says gods entrusted him with weaponry, vision, and
    wisdom; he protects the weak, orphans, and widows; he writes his words on a monument
    before his royal image; and he instructs the oppressed person to read the inscription,
    find justice, praise his rule, and pray before Marduk, Zarpanit, and the deities
    of Esagila.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hammurapi says he provided a peaceful dwelling, opened difficult barriers,
    and made light stream over the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He says Zamama and Nana entrusted a powerful weapon to him, Ea assigned him
    keenness of vision, and Marduk gave him wisdom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: He says he drove out enemies above and below, ended fighting, brought prosperity
    to the land, made the people dwell in security, and allowed no disturber among
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The great gods are said to have called him, and he calls himself a shepherd
    whose staff is righteous and whose good shadow is spread over his city.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He says he protects the people of Sumer and Akkad and lets their brethren
    work in peace under his protection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: He says he acts so that the strong may not hurt the weak and so that orphans
    and widows may be protected in Babylon.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: He says he wrote his precious words on his monument and established them before
