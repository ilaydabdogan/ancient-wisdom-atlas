canonical_text:
  quote: ''
  summary: The passage narrates Cyrus’s expansion toward Babylonia while Nabonidus
    remains occupied with building, restoration, and ancient foundations. It describes
    Nabonidus in Tema, his failure to enter Babylon for cultic or state duties, the
    death of his mother, Cyrus’s crossing into Assyria, Belshazzar’s defensive role,
    and the later fall of Sippar and Babylon without resistance. It then begins an
    inscription of Nabonidus from clay cylinders, in which he identifies himself as
    king of Babylon, supporter of major temples, reverer of the great gods, and restorer
    of an old step tower at Ur built by earlier kings.
  language: English
  quote_policy: summarized
