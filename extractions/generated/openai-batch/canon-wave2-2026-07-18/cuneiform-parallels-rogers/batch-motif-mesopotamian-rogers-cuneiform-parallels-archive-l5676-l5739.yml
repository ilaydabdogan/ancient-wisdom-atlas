canonical_text:
  quote: ''
  summary: In a fragment from Tablet 2 of the Myth of Adapa, Adapa speaks against
    the South Wind and breaks its wing. The South Wind does not blow upon the land
    for seven days. Anu asks his messenger Ilabrat why this has happened, and Ilabrat
    reports that Adapa, son of Ea, has broken the South Wind's wing. Anu reacts, ascends
    his throne, orders that someone bring Adapa, and Ea, described as knowing heaven,
    rouses him.
