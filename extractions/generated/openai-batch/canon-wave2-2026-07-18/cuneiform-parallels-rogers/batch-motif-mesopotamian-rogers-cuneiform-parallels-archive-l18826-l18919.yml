canonical_text:
  quote: ''
  summary: A letter-like passage reports a speaker in Gurra in durance receiving two
    knives, a lance, and two baskets from a workman; arranging repair and delivery
    of a broken lance; asking about wine and cities; referring to an authority over
    cities whose anger would destroy enemies and bring victory; directing Ilurabi
    at Rachab regarding the speaker's man; and ending with a highway note for a messenger.
    The passage also includes numbered transliteration lines.
