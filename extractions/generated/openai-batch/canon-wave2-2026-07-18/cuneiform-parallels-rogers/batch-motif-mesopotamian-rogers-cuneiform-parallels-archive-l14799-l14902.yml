canonical_text:
  quote: ''
  summary: 'Chronicle entries recount warfare and dynastic change among Babylon, Elam,
    and Assyria: Sippar is entered and its inhabitants killed; Shamash remains in
    E-barra; rulers are enthroned, captured, carried away, or killed in revolts; Uruk’s
    gods and inhabitants are plundered; Sennacherib ravages Elam; Menanu gathers Elamite
    and Babylonian forces, later suffers speech loss and dies.'
  language: English translation with Akkadian transliteration
  quote_policy: summarized
