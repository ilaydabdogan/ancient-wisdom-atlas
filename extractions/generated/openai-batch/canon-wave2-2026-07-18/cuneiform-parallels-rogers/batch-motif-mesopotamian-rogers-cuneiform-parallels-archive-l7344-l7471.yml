  quote: ''
  summary: In the Babylonian Flood Story excerpt, the first-person speaker sees the
    flood sea and an island, the ship comes to rest at Mount Nisir, and birds are
    sent out to test for a resting place and the abatement of waters. The speaker
    then releases living things, offers sacrifice and libation on the mountain, and
    the gods respond to the offering; the Lady of the gods raises a jewel and speaks
    of remembrance.
