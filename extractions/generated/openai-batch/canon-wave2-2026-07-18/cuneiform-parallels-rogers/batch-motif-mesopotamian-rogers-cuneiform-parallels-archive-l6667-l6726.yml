canonical_text:
  quote: Be thou my husband, I thy wife
  summary: Gilgamesh adorns himself after washing his weapons. Ishtar desires him
    and offers marriage, luxury, homage, and tribute. Gilgamesh refuses by recalling
    the bad fates of her former lovers, including Tammuz. In anger Ishtar ascends
    to Anu and obtains a bull to destroy Gilgamesh in Uruk. The bull kills many, but
    Engidu and Gilgamesh destroy it; Engidu taunts Ishtar with part of the carcass.
    Gilgamesh dedicates the bull's horns to Lugalbanda, and he and Engidu triumph
    through Uruk while women acclaim Gilgamesh.
  language: English
  quote_policy: quoted
