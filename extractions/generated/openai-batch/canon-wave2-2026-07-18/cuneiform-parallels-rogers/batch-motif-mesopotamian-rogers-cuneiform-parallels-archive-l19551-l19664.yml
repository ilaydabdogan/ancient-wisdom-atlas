canonical_text:
  quote: With their bodies I dammed (101) the Orontes
  summary: The passage excerpts Assyrian royal inscriptions of Shalmaneser III. It
    describes mass slaughter near the Orontes, seizure of enemy war equipment, a sixth-year
    campaign from Nineveh through river crossings and Hittite tribute, sacrifice to
    Hadad at Khalman, battle against a coalition at Qarqar, and a Berlin inscription
    giving royal titles, lineage, conquests, a fire simile for attack, and the seizure
    of Akhuni with his gods, soldiers, and goods.
  language: English translation with Akkadian transliteration excerpts
  quote_policy: quoted
