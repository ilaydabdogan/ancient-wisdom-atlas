  quote: ''
  summary: Gilgamesh returns to Uruk after failed journeys and seeks knowledge from
    the abode of the dead. When he cannot meet the conditions for reaching it, he
    tries to have Engidu's spirit brought back to earth. Ellil and Sin do not grant
    the appeal, but Ea commands Nergal, who opens a hole in the earth and causes Engidu's
    spirit to come out like wind.
