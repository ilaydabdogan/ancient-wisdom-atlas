canonical_text:
  quote: ''
  summary: A fragment from the Legend of Sargon reports a first-person royal speaker
    going up to great Dur-ilu and then addresses whatever king will be exalted after
    him. The future king is told to rule the black-headed peoples, destroy mighty
    mountains with bronze axes, climb upper mountains, break through lower mountains,
    besiege the Sea country three times, and go up to Dur-ilu. Notes identify Dur-ilu
    as an eastern Babylonian city whose name means “Wall of God,” and Dilmun as an
    island in the Persian Gulf.
  language: English with Akkadian transliteration
