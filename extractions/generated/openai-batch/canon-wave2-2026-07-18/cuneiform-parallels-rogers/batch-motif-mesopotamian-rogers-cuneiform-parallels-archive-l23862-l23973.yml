canonical_text:
  quote: ''
  summary: The passage first presents Nabonidus describing the reconstruction and
    founding of a temple tower for Sin at Ur, followed by prayers asking Sin to enter
    the house, favor the temples, instill fear of his divinity in the people, protect
    Nabonidus and Belshazzar from sin, and grant them long life. It then begins the
    Cylinder of Cyrus, describing a defective ruler whose actions dishonor cities,
    stop daily offerings, oppress the people, provoke divine anger, and lead gods
    to leave their homes while Marduk turns toward ruined dwelling places and corpse-like
    people of Sumer and Akkad.
  language: English with Akkadian transliteration
  quote_policy: summarized
