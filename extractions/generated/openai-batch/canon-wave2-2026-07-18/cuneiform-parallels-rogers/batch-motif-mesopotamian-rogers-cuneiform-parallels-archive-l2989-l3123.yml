canonical_text:
  quote: ''
  summary: In a creation-story passage, Marduk challenges Tiamat after she has prepared
    her army and weapons. Tiamat reacts violently, recites an incantation, and approaches
    battle. Marduk catches her in a net, drives winds into her mouth and belly, pierces
    and kills her, stands on her body, scatters and captures her allies, fetters creatures
    and devils, and conquers Kingu.
  language: English translation with Akkadian transliteration included
  quote_policy: summarized
