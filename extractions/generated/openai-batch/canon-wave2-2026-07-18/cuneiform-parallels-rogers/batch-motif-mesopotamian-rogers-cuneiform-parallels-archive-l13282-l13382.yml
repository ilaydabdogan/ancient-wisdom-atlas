canonical_text:
  quote: An evil day.
  summary: 'The passage gives a liturgical prescription for an “evil day”: the ruler
    or shepherd of great peoples, the priest, and the physician avoid specified actions;
    at night the king brings a gift and sacrifice before Marduk and Ishtar, and raised
    hands in prayer are pleasing to god. The following doctrinal prose discusses the
    growth of the Babylonian pantheon, imported and duplicated deities, divine attendants,
    and priestly lists that classify minor deities as aspects or reflections of greater
    gods.'
  language: English with transliterated Akkadian excerpts
