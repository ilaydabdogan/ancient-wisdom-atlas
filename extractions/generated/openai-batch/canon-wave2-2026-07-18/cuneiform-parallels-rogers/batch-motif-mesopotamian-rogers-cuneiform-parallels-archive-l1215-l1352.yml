  summary: The passage opens the Babylonian creation story with an unnamed heaven
    and earth, mingled primeval waters, absence of fields, marshes, gods, names, and
    fixed destinies. Divine generations then appear, including Lakhmu, Lakhamu, Anshar,
    Kishar, Anu, and Nudimmud. Tiamat and Apsu become troubled, and Apsu summons Mummu
    to go with him to Tiamat.
