canonical_text:
  quote: ''
  summary: The passage gives inheritance and property rules for women described as
    votaries, vowed females, hierodules, a votary of Marduk, and the opening of a
    case concerning a concubine daughter. It distinguishes cases where a father has
    or has not given a marriage portion or written a deed granting full discretion.
    After the father's death, the woman's right to enjoy, dispose of, or pass on property
    depends on the deed, religious status, and specified family claims, especially
    those of brothers.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman without written permission for full discretion over her estate is
    treated differently from a woman whose deed grants such discretion.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: In the first case, after the father dies, the brothers take the woman's field
    and garden and must provide grain, oil, and wool according to the value of her
    share.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the brothers do not provide the required grain, oil, and wool, the woman
    may give her field or garden to a cultivator who will maintain her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman may enjoy the property given by her father for life, but she may
    not sell it for money or transfer it to another when the rule denies her full
    discretion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: When a deed grants a votary or vowed female full discretion, after the father's
    death she may give the estate to whomever she chooses, and her brothers have no
    claim upon her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a father has not granted a marriage settlement to his daughter who is a
    votary or vowed female, she receives the portion of a son from the goods of her
    father's house, enjoys it for life, and after her it belongs to her brothers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If a father has vowed a votary or hierodule to a god and has not given her
    a marriage portion, she receives one third of the portion of a son, enjoys it
    for life, and after her it belongs to her brothers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A votary of Marduk of Babylon without a marriage portion or deed receives
    one third of the portion of a son with her brothers, pays no tax, and may give
    after her wherever she chooses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The opening of the next rule concerns a father who grants a marriage settlement
    to his daughter who is a concubine and gives her to a husband, but the result
    of the rule is cut off in this passage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The repeated formula that the father has gone to his fate marks the father's
    death as the trigger for the inheritance rules.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
