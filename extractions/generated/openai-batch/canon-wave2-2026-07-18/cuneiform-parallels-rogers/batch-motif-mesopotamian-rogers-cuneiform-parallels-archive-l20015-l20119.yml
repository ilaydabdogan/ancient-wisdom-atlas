canonical_text:
  quote: ''
  summary: A Calah inscription of Adad-nirari IV presents the Assyrian king as divinely
    watched over and established by Ashur, as a priestly servant of Ashur, as conqueror
    of lands from eastern mountain and sea regions to western coastal lands, as besieger
    of Damascus, and as receiver of surrender, tribute, palace goods, and offerings
    associated with major Mesopotamian gods.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adad-nirari is introduced with royal titles including great king, powerful
    king, king of the world, and king of Assyria.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ashur is said to have watched over Adad-nirari from childhood, presented him
    with an incomparable kingdom, proclaimed his lordship, and established his throne.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Adad-nirari is described as a lofty priest who adorns E-sharra, holds command
    of E-kur, and goes about in the service of Ashur his lord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kings of the four quarters of the earth are said to have been cast down at
    Adad-nirari's feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The inscription lists many eastern and western lands conquered by Adad-nirari,
    including regions from Siluna and mountain slopes to the great eastern sea and
    from the Euphrates to the great western sea.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Conquered western lands are said to have cast themselves at the king's feet,
    after which he laid tribute and taxes upon them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Adad-nirari marched against Damascus and shut up Mari', king of Damascus,
    in his royal city.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fear of the brightness of Ashur is said to have smitten Mari' to earth;
    Mari' then took the king's feet and surrendered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The inscription lists silver, gold, copper, iron, garments, ivory furniture,
    possessions, and goods taken in Mari's palace at Damascus.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: All the kings of Chaldea are said to have surrendered, and tribute and taxes
    were laid upon them for the future.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Babylon, Borsippa, and Kutha are said to have brought pure offerings to the
    oracles of Bel, Nebu, and Nergal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: An editorial note reports a proposed connection between Adad-nirari's campaign
    and the biblical statement that the Lord gave Israel a saviour, while also noting
    a counter-identification with Jeroboam.
  category: other
  evidence_refs:
  - ev:7
