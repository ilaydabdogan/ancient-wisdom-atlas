canonical_text:
  quote: ''
  summary: A fragmentary creation passage describes the formation of the firmament
    and earth, the bringing to life of living things, and the making and division
    of cattle, beasts of the field, and moving things of the city. It then names Nin-igi-azag
    as creating two small creatures, apparently one white and one black, with Gula
    mentioned in a damaged context. A following toothache incantation opens with a
    cosmological sequence in which Anu, the Heavens, Earth, Rivers, Canals, and Morass
    successively generate the Worm. The Worm weeps before Shamash and Ea, asks what
    food and destructive object will be given to it, rejects an offer of figs and
    fig jam, and asks to be placed between the teeth.
  language: English; Akkadian transliteration
  quote_policy: summarized
