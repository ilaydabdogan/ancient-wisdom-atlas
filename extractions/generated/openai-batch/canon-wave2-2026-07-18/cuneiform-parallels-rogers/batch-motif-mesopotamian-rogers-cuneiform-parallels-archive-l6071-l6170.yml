canonical_text:
  quote: ''
  summary: Adapa, associated with mourning for the vanished gods Tammuz and Gishzida,
    appears before Anu. Anu questions him about breaking the South wind's wings, and
    Adapa explains that the South wind capsized him while he was fishing at sea. Anu
    then questions why Ea revealed the heart of heaven and earth to humankind. Food
    and water of life are brought to Adapa, but he does not eat or drink because Ea
    told him not to; he accepts garments and oil, and Anu orders him returned to earth.
  language: English translation with transliterated Akkadian in parallel
  quote_policy: summarized
