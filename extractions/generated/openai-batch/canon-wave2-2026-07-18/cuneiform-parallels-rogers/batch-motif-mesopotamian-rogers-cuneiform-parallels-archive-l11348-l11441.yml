  quote: |-
    I am Ishtar goddess of the evening,
    I am Ishtar goddess of the morning
  summary: The passage hymns Ishtar as goddess of evening and morning, opener of the
    gleaming heaven's bolt, darkener of heaven, shaker of earth, radiant figure on
    heaven's terrace, queen above and below, and power over mountains. It then petitions
    that her heart and soul be appeased, invoking Anu and Ellil, and addresses her
    by a series of queenly titles associated with heaven and several cult places.
    The passage ends with a performance note identifying it as a psalm on the flute
    to Ishtar.
