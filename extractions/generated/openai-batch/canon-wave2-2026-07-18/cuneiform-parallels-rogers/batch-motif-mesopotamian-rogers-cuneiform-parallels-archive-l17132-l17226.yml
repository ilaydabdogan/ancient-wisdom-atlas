canonical_text:
  quote: "“I dug out the Hammurapi canal, named Nukhush-nishe which brings abundance
    of water unto the land of Shumer and Akkad.”"
  summary: The passage presents Hammurapi as divinely authorized to rule Shumer and
    Akkad. He digs the Hammurapi canal, changes its banks into cultivated fields,
    provides unfailing water, gathers scattered people, supplies food and drink, and
    settles them peacefully. Through power bestowed by Marduk he builds and names
    a lofty fortress at the head of the canal, comparing its height to a mountain
    reaching heaven and associating its name with his father Sin-muballit. A following
    letter orders Sin-idinnam to call out landholders along the Damanum canal to clear
    it within the month. The passage then begins a prose section on the Tell-el-Amarna
    letters and their discovery in Egypt.
  language: English; Akkadian transliteration
  quote_policy: quoted
