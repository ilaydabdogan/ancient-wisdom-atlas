canonical_text:
  quote: ''
  summary: A boundary-stone passage describes offenses against a field and pasture
    grant, then invokes multiple gods to punish the offender. It also threatens anyone
    who removes, hides, burns, submerges, encloses, or conceals the stone, and states
    that the great gods named on the stone will curse such a person. The passage ends
    with names and titles at the sealing of the tablet.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names possible actions against a field and pasture grant, including
    seizure with evil purpose, making a claim, taking the field, giving or returning
    it away, and denying that it was given, measured, presented, or received.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sequence of gods is invoked to punish the offender with overthrow, destruction
    of life, evil fate, loss of gladness and abundance, darkening of the face, and
    lack of just judgment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ninib is identified as lord of boundaries and boundary-stones and is asked
    to tear out the offender's boundary stone.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gula is asked to put lingering illness into the offender's body so that blood
    pours out like water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ishtar is called lady of countries and her fury is described as a flood; she
    is asked to reveal difficulties so the offender does not escape misfortune.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nusku is called a mighty lord and powerful burner and is asked to become the
    offender's evil demon and burn his root.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A second prohibited scenario concerns whoever removes the stone and hides
