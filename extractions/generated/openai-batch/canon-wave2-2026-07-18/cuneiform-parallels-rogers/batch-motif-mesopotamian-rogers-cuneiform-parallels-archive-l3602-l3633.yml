canonical_text:
  quote: ''
  summary: 'The passage praises named divine figures or epithets: Asari as giver of
    fruitfulness and founder of agriculture; Asaru-alim as full of counsel; Asaru-alim-nuna
    as great, begotten by a father, and ordering the decrees of Ami, Bel, and Ea;
    and Tutu as creator of renewal, consecrator of sanctuaries, maker of incantation,
    defender against attackers, unrivaled among the gods, Zi-ukkina, life of the divine
    host, and establisher of the brilliant heavens.'
  language: English
  quote_policy: summarized
