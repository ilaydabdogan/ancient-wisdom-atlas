  summary: The passage is an ethical incantation framed as a sequence of questions
    about possible social, verbal, ritual, magical, and religious offenses committed
    by an unnamed person. It asks whether the person harmed neighbors, families, just
    persons, companies, gods, vows, offerings, and sacrifices, then asks that he be
    freed from whatever ban has been placed upon him.
