  quote: He granted him wisdom, but he did not grant him eternal life.
  summary: The opening of Tablet No. 1 presents Adapa of Eridu as a wise man created
    by Ea, granted wisdom but not eternal life. He is described as pure and observant
    of divine statutes, makes bread and daily provisions for Eridu, prepares the table,
    performs boating, fishing, and hunting service, and then embarks by ship onto
    the broad sea when wind drives the vessel.
