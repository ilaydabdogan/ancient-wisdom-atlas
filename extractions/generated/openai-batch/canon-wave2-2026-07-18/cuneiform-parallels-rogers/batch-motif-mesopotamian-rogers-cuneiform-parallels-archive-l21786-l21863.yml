canonical_text:
  quote: ''
  summary: The passage discusses the chronology and source division of Sennacherib’s
    western or Judaean campaigns. It rejects a single-campaign interpretation as problematic,
    cites Rawlinson’s two-campaign view, lists chronological difficulties involving
    Tirhaka and Sennacherib’s death, and summarizes a proposed division in which a
    first campaign ends with Rabshakeh returning to the Assyrian king, while a second
    campaign includes a surrender letter to Jerusalem, Hezekiah’s refusal on Isaiah’s
    advice, pestilence in the Assyrian army, withdrawal to Assyria, and Sennacherib’s
    later death.
  language: English
