  quote: ''
  summary: The passage gives ritual instructions for an incantation before Ishtar,
    including a lamb, censer fire, aromatic materials, a drink offering, threefold
    recitation, and prohibitions against bowing and looking back. It includes a colophon
    naming a magician-copyist. The hymn praises Ishtar as heavenly light, fire over
    the earth, a rising goddess, a dangerous animal-like presence, a virgin ornament
    of the heavens, sister of Shamash, and a speaker who rises to give omens for divine
    kin.
  language: English translation with Akkadian transliteration included
  quote_policy: summarized
