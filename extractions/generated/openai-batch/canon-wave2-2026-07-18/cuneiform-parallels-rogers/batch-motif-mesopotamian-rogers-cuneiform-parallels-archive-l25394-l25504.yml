canonical_text:
  quote: "“In no case shall his field or garden or his house be given for his ransom.”"
  summary: Legal provisions regulate soldiers or constables who evade service, are
    captured, return from captivity, leave or neglect their estates, have heirs unable
    or able to manage affairs, or require ransom. The passage assigns consequences
    for substitution, property restoration or forfeiture, guardianship, and ransom
    by household, temple, or palace.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A soldier or constable who hires a substitute and sends him in his own place
    is to be put to death, and the hireling takes the officer's house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a soldier or constable stationed in a garrison of the king is captured
    and his field and garden are given to another, his field and garden are restored
    if he returns and reaches his city.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the captured soldier or constable has a son able to carry on his affairs,
    the field and garden are given to that son, who conducts his father's affairs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the son is young and unable to carry on his father's affairs, one third
    of the field and garden is given to the mother, and she rears him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a soldier or constable neglects his field, garden, and house and leaves
    them waste, and another takes and manages them for three years, the former holder
    does not regain them on return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the property is left for only one year and the former holder returns, his
    field, garden, and house are given back to him, and he carries on his own affairs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a soldier or constable is captured on an errand of the king and a merchant
    ransoms him and brings him back to his city, the ransom is first drawn from the
    soldier's own house if possible.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: If the soldier's house lacks enough for ransom, the temple of the god of his
    city ransoms him; if the temple lacks enough, the palace ransoms him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The soldier's field, garden, and house are not to be given for his ransom.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage opens a partial provision concerning a governor or magistrate
    and men of a levy, but its consequence is not present in the supplied excerpt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A footnote states that the Babylonian word translated as garrison is of doubtful
    meaning.
  category: other
  evidence_refs:
  - ev:10
