canonical_text:
  quote: ''
  summary: Abdi-khiba addresses the king as servant, performs a sevenfold repeated
    prostration, rejects slander, and identifies himself as a royal officer, shepherd,
    and tribute-bringer. He says the king’s strong arm, not his parents, established
    him in his father’s house. He reports gifts to royal officers, describes hostility,
    occupation of the king’s cities by the Khabiri, slain local figures, and asks
    the king to care for the land and send troops before the royal territory is lost.
  language: English with transliterated Akkadian elements
  quote_policy: summarized
