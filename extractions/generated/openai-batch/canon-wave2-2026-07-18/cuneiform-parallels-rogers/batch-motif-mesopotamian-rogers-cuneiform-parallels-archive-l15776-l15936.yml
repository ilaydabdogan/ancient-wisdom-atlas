canonical_text:
  quote: ''
  summary: 'A segment of an Assyrian eponym list gives entries for years 816-790.
    Each entry names an eponym, often with a city, land, or office, and commonly records
    a campaign destination introduced by “Against.” Two brief notes stand out: in
    the entry for 815, the great god went to Der, and in the entry for 803, a plague
    is noted after a campaign toward the sea coast.'
