canonical_text:
  quote: ''
  summary: 'The passage first gives Herodotus'' account of Sethos: after relying on
    a dream, he gathers non-warrior Egyptians at Pelusium, where nocturnal field mice
    destroy the enemy''s weapon fittings, causing the enemy to flee and fall. A temple
    statue shows Sethos holding a mouse with an inscription about reverencing the
    gods, and a note compares this iconography to Apollo Smintheus. The passage then
    cites Polyhistor and Abydenus on Sennacherib, including his death by his son,
    violent royal successions, Babylonian rulers, Sennacherib''s campaign against
    Babylon, and his installation of his son Asordanius as king.'
  language: English, with Greek and Latin excerpts
  quote_policy: summarized
