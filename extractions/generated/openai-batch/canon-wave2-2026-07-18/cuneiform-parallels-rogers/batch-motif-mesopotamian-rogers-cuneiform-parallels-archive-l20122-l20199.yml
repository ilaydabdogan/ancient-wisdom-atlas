canonical_text:
  quote: Let every later prince trust in Nebo, trust not in any other god.
  summary: A translated inscription for a Nebo statue from Calah praises Nebo with
    divine, scribal, merciful, and ruling epithets; states that a governor made and
    presented the statue for the life and wellbeing of Adad-nirari, Sammuramat, the
    donor, his household, people, and posterity; and ends with an exhortation that
    later princes trust in Nebo rather than another god.
  language: English translation with Akkadian transliteration included in the passage
  quote_policy: quoted
