canonical_text:
  quote: ''
  summary: The speaker describes preparing and sealing a ship, providing food and
    drink to the people, finishing the vessel at the rising of Shamash, loading possessions,
    family, animals, and craftsmen, receiving Shamash's appointed time to enter and
    close the door when heavy rain comes, entrusting the ship to Puzur-Amurri, and
    seeing the storm begin with a black cloud and Adad's thunder.
