canonical_text:
  quote: ''
  summary: 'A plate caption describes a stone tablet of Nabu-pal-iddin showing Shamash,
    the sun god, seated within his shrine. In front of the shrine is Shamash''s symbol,
    and before it stand three figures: a priest conducting the king Nabu-pal-iddin,
    followed by the goddess A, who intercedes for the king. The slab was found in
    an earthenware casket at Sippar by Hormuzd Rassam and is now in the British Museum.'
  language: English
  quote_policy: summarized
