  summary: The passage lists early rulers and fish-human beings said to appear from
    the Red Sea and to be sent by Oannes. It identifies Edoranchus with Enmeduranki,
    describes divine transmission of divinatory secrets and objects from Shamash and
    Adad, gives a royal sequence ending with Xisuthros/Atra-khasis and the great flood,
    and introduces the Gilgamesh Epic as containing the Babylonian Flood legend.
