canonical_text:
  quote: If I, your avenger, / Do enchain Tiamat and give you life / Make an assembly,
    exalt my destiny.
  summary: Kingu receives the tablets of destiny and authority. Anu and Nudimmud fail
    before the opposing power, while Marduk offers to enchain Tiamat and save the
    gods if an assembly exalts his destiny. Gaga carries Anshar's message to Lakhmu
    and Lakhamu, reporting that Tiamat and allied gods are preparing battle and that
    Ummu-Khubur has made weapons and spawned monstrous serpents.
  language: English translation with Akkadian transliteration
  quote_policy: quoted
