canonical_text:
  quote: ''
  summary: The passage ends a toothache incantation in which a Worm is associated
    with consuming blood and gum tissue of the teeth; Ea is invoked to strike the
    Worm, and a ritual mixture of beer, the plant sa-kil-bir, and oil is applied to
    the tooth after the incantation is repeated three times. The passage then introduces
    Assyrian cosmology as rooted in Babylonian cosmology, describes the replacement
    or identification of several gods in theological speculation, and presents a broken
    Assyrian creation fragment in which Anshar is connected with days, night and day,
    Tiamat, wind, a head, a spring, nostrils, and poured-down water or liquid.
  language: English translation with transliterated Akkadian/Sumerian lines
  quote_policy: summarized
