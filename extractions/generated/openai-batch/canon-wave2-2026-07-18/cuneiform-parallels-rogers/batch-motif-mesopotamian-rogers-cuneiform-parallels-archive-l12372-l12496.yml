canonical_text:
  quote: ''
  summary: 'The passage contains the end of an incantation fragment in which a sufferer
    is said to have been banned through familial figures, with an editorial note explaining
    that an exorciser seeks the witchcraft source and ends the ban through exorcisms.
    It then presents a wisdom fragment with ethical instructions: do not oppress others,
    give food and wine, seek truth, help and protect the weak, and avoid a woman described
    as harlot/prostitute/outcast. The text links conduct with the anger or pleasure
    of the actor''s god and of Shamash, who requites evil or good.'
  language: English translation with Akkadian transliteration
  quote_policy: summarized
