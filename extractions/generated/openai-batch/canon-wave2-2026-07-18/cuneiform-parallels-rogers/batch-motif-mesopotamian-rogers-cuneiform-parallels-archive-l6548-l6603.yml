canonical_text:
  quote: To that dwelling, which one enters, but comes not forth again
  summary: 'The passage summarizes the broken opening of the second tablet: Engidu
    leaves Gilgamesh for the wilderness and beasts, is admonished by Shamash, returns
    to Uruk, and tells Gilgamesh a terrible dream of a no-return dark dwelling. The
    passage then notes that the friends plan a journey against Khumbaba, warder of
    the cedar mountain of Irnini/Ishtar, with editorial speculation about rescuing
    a goddess statue and a possible historical image-carrying parallel.'
  language: English
