canonical_text:
  quote: ''
  summary: Legal clauses from the Code of Hammurapi assign penalties for causing pregnancy
    loss or death among women of different social status, and fees or penalties for
    medical treatment by a doctor, including successful surgery, failed surgery, bodily
    punishment, slave replacement, and silver compensation.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One clause states that a ten-shekel silver payment is due for what was in
    a woman’s womb, and the following clause states that if that woman died, the offender’s
    daughter is to be put to death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If blows cause the daughter of a freedman to lose what was in her womb, the
    payment is five shekels of silver; if she dies, the payment is one half mina of
    silver.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a gentleman’s maidservant is struck and loses what was in her womb, the
    payment is two shekels of silver; if she dies, the payment is one third mina of
    silver.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A doctor who uses a bronze lancet to treat a severe wound or remove a cataract
    for a gentleman and cures the patient receives ten shekels of silver.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For similar medical treatment, the fee is five shekels when the patient is
    the son of a freedman and two shekels when the patient is a gentleman’s slave,
    paid by the slave’s owner.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a doctor uses a bronze lancet on a gentleman and causes the gentleman’s
    death or destroys his eye, the doctor’s hand is cut off.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a doctor uses a bronze lancet on the slave of a freedman and causes death,
    he must render slave for slave; if he destroys the slave’s eye, he pays half the
    slave’s price in silver.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A doctor who sets a broken bone or cures a painful swelling receives five
    shekels from a man, three shekels if the patient is the son of a freedman, and
    two shekels from the owner if the patient is a gentleman’s slave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The clauses distinguish social categories including gentleman, freedman, maidservant,
    slave, and slave owner.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  - ev:8
