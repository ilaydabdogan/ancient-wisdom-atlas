  quote: ''
  summary: The passage describes two plate captions. Plate No. 25 is a relief from
    a Theban grave in the Berlin Museum depicting Amenophis IV. Plate No. 26 depicts
    Ikh-en-Aton, also identified as Amenophis IV, with Nefertiti and six daughters
    sacrificing to the Solar Disk, whose rays stream toward him and end in hands.
    The inscriptions provide names and titles of the worshiped divine principle and
    of the royal family members.
