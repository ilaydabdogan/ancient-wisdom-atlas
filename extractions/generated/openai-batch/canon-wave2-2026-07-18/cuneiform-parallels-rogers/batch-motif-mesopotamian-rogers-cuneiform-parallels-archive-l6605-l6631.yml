    described as servant of Nin-sun and mistress of all knowledge. The narrative summary
    says Gilgamesh induces his mother to make an offering to Shamash, likely for favor
    or an oracle. A later fragmentary section says Engidu urges Gilgamesh to abandon
    the expedition, but the friends set out and approach the cedar mountain guarded
