  summary: The passage describes bronze-door images in which Ashur, king of the gods,
    goes to battle into Tiamat/the sea, with gods arranged before and behind him and
    beasts from Tiamat given over to death. It also includes an address to the River
    of Creation, which is said to create all things, to have been dug by the great
    gods, to contain Ea's dwelling, to receive an unparalleled deluge and powers from
    Ea and Marduk, and to judge mankind.
