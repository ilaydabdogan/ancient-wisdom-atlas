canonical_text:
  quote: ''
  summary: Adapa is instructed about what will happen when he appears in mourning
    and when he goes before Anu. He is told to say that two gods, Tammuz and Gishzida,
    have vanished in his country. He is also told not to fail the order, to keep the
    speaker's word, to come up to heaven, and to approach Anu's door, where Tammuz
    and Gishzida stand.
