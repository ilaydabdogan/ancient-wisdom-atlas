canonical_text:
  quote: ''
  summary: 'The passage summarizes Sennacherib''s western campaign: Sidon surrenders
    after its king flees, Ethobal is installed, several small states offer presents
    and fealty, Ashkelon and nearby towns are taken, an Egyptian-Ethiopian force is
    defeated at Eltekeh, Ekron is destroyed, many cities in Judah are captured, Jerusalem
    is blockaded but not taken, and Lachish is taken. It then turns to source criticism,
    comparing Assyrian sources with biblical accounts in Kings and Isaiah.'
  language: English
  quote_policy: summarized
