  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entry for 788 names Qil-Ishtar, records action against Kiski, and states
    that Nabu entered the new Temple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The entry for 786 names Adad-uballit of Rimusi and states that the great god
    returned to the city of Der.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several entries list named Assyrian officials or kings together with campaign
    destinations, especially repeated actions against Urartu.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: The entry for 775 names Nergal-eresh of Racappa and records action against
    the land of cedars, identified parenthetically as Amanus.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Entries for 773-767 continue the annual eponym pattern with destinations including
