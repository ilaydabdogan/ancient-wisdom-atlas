  summary: A section of the Assyrian Eponym List records annual eponyms for years
    789-767, associated cities or offices, campaign destinations, and brief cultic
    notes including the laying of the foundation of Nabu's temple in Nineveh, Nabu
    entering a new temple, and a great god returning to Der.
