canonical_text:
  quote: ''
  summary: Gilgamesh reaches Siduri-Sabitu while grieving Engidu and seeking the way
    to Ut-Napishtim. Siduri warns that the sea and the waters of death are nearly
    uncrossable, with Shamash named as the only one to have crossed. Ur-Shanabi, the
    sailor of Ut-Napishtim, agrees to help Gilgamesh cross by ship. They approach
    Ut-Napishtim’s coast, and Gilgamesh asks how Ut-Napishtim attained endless life;
    the passage then introduces the Flood story from the survivor’s own lips.
  language: English
  quote_policy: summarized
