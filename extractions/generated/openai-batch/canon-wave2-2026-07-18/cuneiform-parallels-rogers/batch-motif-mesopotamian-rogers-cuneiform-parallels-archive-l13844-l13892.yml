canonical_text:
  quote: ''
  summary: A ritual instruction titled “The Scapegoat” directs the Irrishu to order
    and cut off a sheep’s head. The Mashmashu uses the sheep’s body and incantations
    to purify and exorcise the temple and its naos, removes a platter, carries the
    sheep’s body to the river Na-la at evening, and casts it into the river. The Mashmashu
    and Irrishu then depart into the country; items belonging to Nabu, lord of Babylon,
    are not to be introduced into Babylon, and the officiants remain in the country
    from the fifth to the twelfth day.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
