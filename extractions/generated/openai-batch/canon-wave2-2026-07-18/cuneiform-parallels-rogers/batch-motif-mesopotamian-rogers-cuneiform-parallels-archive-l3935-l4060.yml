canonical_text:
  quote: ''
  summary: The passage closes a creation-text section by declaring Marduk's fifty
    names, instructing that they be remembered, learned, and taught, and praising
    Marduk's fertile beneficence, unchangeable command, wrath, and compassion. It
    then gives Damascius's report of a Babylonian cosmogony with two origins, Tauthe
    and Apason, successive divine generations, and Belos as Demiurge. The next section
    introduces a ritual cosmology used in restoring a fallen temple, beginning with
    Anu creating the heavens.
