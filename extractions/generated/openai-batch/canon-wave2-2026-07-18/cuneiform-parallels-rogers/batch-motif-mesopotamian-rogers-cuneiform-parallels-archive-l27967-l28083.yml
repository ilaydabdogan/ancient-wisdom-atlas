canonical_text:
  quote: ''
  summary: The passage gives Code of Hammurapi provisions §§248-261 concerning hired
    oxen, animal injury and fatal goring, divine-caused animal death cleared by oath,
    penalties for agricultural theft by an entrusted field overseer, restitution for
    seed and oxen, wage rates for agricultural workers, and fines for stolen irrigation
    or farm equipment.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a hired ox is injured in its horn, tail, or nostril, the hirer must pay
    a fraction of its price.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a hired ox dies after the god strikes it, the hirer swears before the god
    and is released from liability.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a savage bull in a person's charge gores a man and causes death, the case
    is said to have no remedy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If an owner knows his ox is given to goring but does not bind its horns or
    shut it up, and the ox kills a man of gentle birth, the owner must pay one half
    mina of silver.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the person killed by the goring ox is a gentleman's slave, the payment
    is one third mina of silver.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man hired to oversee and cultivate a field may be furnished with seed-grain
    and entrusted with oxen.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the field overseer steals seed or provender and it is found in his hands,
    his hands are to be cut off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the overseer takes seed-grain and starves the oxen, he must restore from
    the seed he has hoed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the overseer hires out the man's oxen or steals seed and does not make
    it grow in the field, he is called to account and must measure out grain per unit
    of field.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the overseer cannot pay his compensation, he is made to remain in the field
    with the cattle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage sets annual grain wages for a field laborer, an ox-driver, and
    a herdsman or shepherd.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: Theft of a watering machine, watering bucket, or harrow is punished by fixed
    silver payments.
  category: action
  evidence_refs:
  - ev:10
