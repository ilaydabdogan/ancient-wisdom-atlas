canonical_text:
  quote: ''
  summary: 'Fragmentary chronicle entries recount campaigns and royal conflicts: Iluma-ilu,
    Samsu-iluna, and Abishi are linked with war and a failed attempt to catch Iluma-ilu
    by damming the Tigris; the men of Khatti march against Akkad; Ea-gamil, Ulam-Buriash,
    and Agum are associated with campaigns around the Country of the Sea, Elam, and
    Dur-Ea; the temple of Ea in Dur-Ea is razed. A following Babylonian Chronicle
    excerpt reports Tiglathpileser''s enthronement in Assyria, his campaign and plundering
    in Akkad, removal of the gods of Shapazza, and Borsippa''s separation from Babylon.'
  language: English
  quote_policy: summarized
