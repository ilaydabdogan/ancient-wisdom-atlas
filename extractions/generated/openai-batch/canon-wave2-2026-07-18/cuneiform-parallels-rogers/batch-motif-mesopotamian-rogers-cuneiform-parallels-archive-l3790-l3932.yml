  summary: A fragmentary seventh-tablet creation passage praises and names a central
    deity through royal and cosmic titles. The deity is described as creator, lord,
    counsellor of Ea, Nibiru, the one who passed through and conquered Tiamat, upholder
    of star paths, ruler forever, and recipient of names from Bel, the Igigi, and
    Ea.
