canonical_text:
  quote: ''
  summary: A first-person legend presents Sargon of Agade as the child of a lowly
    mother and unknown father. His mother secretly bears him, places him in a bitumen-sealed
    rush basket, and casts him into the river. The river carries him to Akki the irrigator,
    who rescues and raises him. Sargon becomes a gardener, is loved by Ishtar, and
    later rules peoples and conducts campaigns in mountain and sea-country regions.
  language: English, with Akkadian transliteration in the apparatus
