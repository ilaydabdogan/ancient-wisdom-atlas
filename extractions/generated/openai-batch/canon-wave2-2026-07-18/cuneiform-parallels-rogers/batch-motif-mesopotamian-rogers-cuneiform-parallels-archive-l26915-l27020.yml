canonical_text:
  quote: ''
  summary: Laws §§161-167 regulate bride-price, marriage portions, inheritance after
    a wife’s or father’s death, provision for an unmarried youngest son, and division
    of paternal and maternal property among children.
  language: English; Akkadian transliteration included
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a man has brought a present and bride-price to his father-in-law’s house,
    and a comrade slanders him so that the father-in-law refuses the daughter, the
    father-in-law must return double what was brought, and the comrade may not take
    the wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a wife has borne children and then goes to her fate, her father may not
    claim her marriage portion; it belongs to her children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a wife has not borne children and goes to her fate, if the father-in-law
    has returned the bride-price, the husband has no claim to her marriage portion,
    which belongs to her father’s house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the father-in-law has not returned the bride-price, the husband may deduct
    the bride-price from the woman’s marriage settlement and return the rest to her
    father’s house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A father may apportion field, garden, or house to the son who is first in
    his eyes and write a sealed deed; after the father goes to his fate, that son
    keeps the gift and also shares equally in the father’s house goods with his brothers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a father arranged wives for his sons but not for his youngest son, after
    the father goes to his fate the brothers must give the youngest brother bride-price
    money from the father’s house goods beyond his share and enable him to take a
    wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man has children by a first wife and later by another woman, after the
    father goes to his fate the children do not divide according to their mothers;
    they take their respective mothers’ marriage settlements and divide the father’s
    house goods equally.
  category: relationship
  evidence_refs:
  - ev:7
