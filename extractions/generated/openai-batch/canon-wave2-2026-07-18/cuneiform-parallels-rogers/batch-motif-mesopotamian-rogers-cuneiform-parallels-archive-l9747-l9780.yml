canonical_text:
  quote: ''
  summary: A female speaker asks Nergal not to kill her and asks to speak with him.
    Nergal listens and relaxes his hands while she weeps. She proposes that he become
    her husband and she his wife, promising him sovereignty over the wide earth and
    the tablet of wisdom, with him as lord and herself as lady. Nergal hears her,
    seizes and kisses her, wipes away her tears, and asks what she has wanted from
    him until now.
  language: English translation with Akkadian transliteration
