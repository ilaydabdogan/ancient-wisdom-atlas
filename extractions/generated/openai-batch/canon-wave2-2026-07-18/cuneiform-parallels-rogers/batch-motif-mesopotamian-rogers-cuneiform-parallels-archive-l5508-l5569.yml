canonical_text:
  quote: ''
  summary: The passage introduces the Myth of Adapa as preserved on four fragments
    and summarizes the contents of the first tablets. Adapa, or Adamu, son of Ea,
    receives wisdom but not eternal life and serves as a semidivine wise priest at
    Eridu, providing ritual bread and water and fishing in the Persian Gulf. A south
    wind overturns his boat; in anger he breaks its wings, stopping its cooling effect
    for seven days. Anu summons him to account. Ea advises Adapa how to seek the pity
    of Tammuz and Gishzida at heaven's portal and warns him not to eat or drink what
    is offered. The provisions are actually food and water of life, so Adapa loses
    the chance for immortality and returns to earth.
  language: English
  quote_policy: summarized
