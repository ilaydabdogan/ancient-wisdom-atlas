canonical_text:
  quote: "“At the feet of the king, my lord, seven and seven times, I fall.”"
  summary: Abdi-khiba addresses the king as lord, reports that Milki-il and Shuardata
    have acted against the king's land, names territories and cities lost to Khabiri
    and Kelti groups, and asks the king to send troops or officials so that the king's
    land may be restored. A fragmentary continuation repeats the submission formula
    and says the speaker is not a prince but an officer of the king. The passage also
    begins an editorial introduction to a letter from Lachish.
  language: English translation with transliterated Akkadian accompanying
  quote_policy: quoted
