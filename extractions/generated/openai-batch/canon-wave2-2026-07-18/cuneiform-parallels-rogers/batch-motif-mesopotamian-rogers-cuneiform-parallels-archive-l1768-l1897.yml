canonical_text:
  quote: ''
  summary: In this excerpt from the creation story, forces gather at Tiamat's side
    for battle. Ummu-Khubur creates weapons and eleven monstrous beings, including
    serpents, dragons, scorpion men, fish men, and other fearsome forms. Kingu is
    exalted among the gods, appointed to lead the troops and control the battle, addressed
    as spouse, and given the tablets of destiny. After receiving the power of Anu,
    Kingu decrees destinies among the gods.
