  quote: ''
  summary: The passage describes a relief on the top of a Kudurru or boundary stone.
    It shows Merodach-baladan, king of Babylon, conferring title to landed property
    on one of his nobles. A two-line inscription identifies the portrait, and divine
    symbols at the top represent Nabu, Ninkharsag or Ninlil, Ea, and Marduk. The stone
    is identified as being in the Berlin Museum.
