canonical_text:
  quote: ''
  summary: A prayer praises Ishtar as a terrifying and exalted goddess whose name
    shakes heaven and earth, who is adored by humankind, judges with justice, restores
    the downtrodden, rules conflict and battle, subdues gods, holds royal power, frees
    slaves, shines as torch and flame, heals or revives the dead and sick, and is
    petitioned by a suffering servant for mercy and deliverance.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
