canonical_text:
  quote: ''
  summary: 'Historical exposition on the Tell-el-Amarna period: Amenophis III''s prosperous
    reign and succession arrangements; Amenophis IV''s marriage, religious shift from
    Amen to the Solar Disk, hymns to the sun''s rays, and founding of a new city;
    the later return to Thebes and abandonment of that city; and Egyptian governance
    of conquered cities in Syria and Palestine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amenophis III's reign is described as marked by extensive building works and
    prosperity throughout the kingdom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In his later years Amenophis III negotiated a marriage for his son by Queen
    Tiy, who was to succeed him as Amenophis IV; the passage notes apparent difficulty
    about the succession and says Queen Tiy apparently reigned alone briefly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Soon after accession, Amenophis IV married Tatukhepa, identified in the passage
    as Nefertiti, daughter of Tushratta king of Mitanni.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In his sixth year Amenophis IV changed his faith, became a worshiper of the
    Solar Disk, and forsook the god Amen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the probable influences on Amenophis IV's religious change
    were his mother Tiy, his wife, and philosophizing priests, especially Eye.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The new faith is said to have been expressed in hymns celebrating the life-giving
    power of the sun's rays.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Amenophis IV built a new city bearing his name and transferred the court's
    residence there from Thebes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the new city the king reigned surrounded by his wife and daughters, who
    are said to be associated with him in all his enterprises.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Correspondence with the kings of Babylonia and Mitanni and with Egyptian representatives
    in Syria took place there, and the discovered record chamber is said to preserve
    knowledge of intercourse between Egypt and the north.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: After Amenophis IV died, the court returned at once to Thebes, and his body
    was placed in his tomb near Tell-el-Amarna.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The city built by Amenophis IV was deserted, decayed rapidly, and passed from
    memory; the passage says his conversion made no permanent change in Egypt and
    Amen continued to rule as before.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The conquest of Syria and Palestine required a plan of governance; some resistant
    cities were destroyed, rebuilt, and given Egyptian organization and religion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Other cities received princes, probably chosen by the Pharaoh from previously
    prominent local men; Abdikheba of Jerusalem is said to boast that he was appointed
    by the great king rather than inheriting the governorship.
  category: relationship
  evidence_refs:
  - ev:5
