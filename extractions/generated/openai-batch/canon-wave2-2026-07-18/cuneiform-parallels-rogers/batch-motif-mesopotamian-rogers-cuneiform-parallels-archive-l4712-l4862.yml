  quote: ''
  summary: A fragmentary Assyrian cosmology passage names a cedar, Adad, a sceptre
    of peace, the mighty ocean, a sanctuary, gods including Lakhmu and Lakhamu, Anshar,
    and Nannar. Anshar speaks to the gods in a damaged section concerning what is
    above the ocean, a copy of Esharra that has been built, fortified places beneath,
    and a house or dwelling in whose interior a city will be founded. Later damaged
    lines refer to things founded or created by hands, the earth, the city of Asshur,
    and work that has been fashioned.
