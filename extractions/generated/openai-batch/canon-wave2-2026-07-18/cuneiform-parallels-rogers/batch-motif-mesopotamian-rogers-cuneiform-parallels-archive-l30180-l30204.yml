  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stele is described as the largest Assyrian monolith yet discovered, with
    measurements of 3.46 meters in height and 1.25 meters in width.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A group of symbols of gods appears above and in front of the king's head.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first divine-symbol group includes Ashur as a bearded figure, Belit as
    a goddess on a lion, Ellil with extended hands riding on an animal, and Ramman
    holding lightning in his left hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second divine-symbol group by the king's hand includes symbols identified
    with Marduk, Nabu, Ea, and Ninib.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A top-right group includes the crescent of Sin, the winged disk of Shamash,
