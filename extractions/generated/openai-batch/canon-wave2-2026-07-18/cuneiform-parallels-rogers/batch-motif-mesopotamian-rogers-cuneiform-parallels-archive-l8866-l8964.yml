canonical_text:
  quote: ''
  summary: The passage begins Ishtar's descent by describing her intention to go to
    the land of No-return, the dark dwelling of Irkalla. It describes the underworld
    road and house, where entrants do not return, lack light, eat dust and clay, sit
    in darkness, and are clothed like birds with wings. Ishtar reaches the door, demands
    that the porter open it, and threatens to break the entrance and bring up the
    dead against the living if refused. The porter begins to speak.
