  quote: Then for Marduk, their avenger, did they decree destiny.
  summary: A first-person speaker calls for Tiamat to be enchained, for the gods to
    assemble in Upshukkinaku, and for destiny to be fixed so an enemy may be attacked.
    Lakhmu, Lakhamu, the Igigi, and the great gods respond; the gods gather before
    Anshar, feast, drink, and finally decree destiny for Marduk as their avenger.
