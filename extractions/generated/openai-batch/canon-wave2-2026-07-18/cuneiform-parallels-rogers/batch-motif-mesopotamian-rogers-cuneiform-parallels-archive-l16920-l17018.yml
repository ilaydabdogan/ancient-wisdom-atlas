canonical_text:
  quote: ''
  summary: The passage first summarizes Hammurapi’s public works, lawgiving, and administration
    of justice. It then gives translated royal inscription material in which Kudur-Mabuk
    builds the temple E-nun-makh for Nannar after Nannar hears his prayer, and Arad-Sin/Eri-Aku
    is described with royal and divine titles while restoring Ur and a mountain-like
    wall for Nannar. The passage closes with the opening of a letter from Hammurapi
    to Sin-idinnam.
  language: English
  quote_policy: summarized
