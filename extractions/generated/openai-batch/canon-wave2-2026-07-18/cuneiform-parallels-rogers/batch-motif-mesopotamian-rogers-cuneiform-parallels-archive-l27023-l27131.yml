canonical_text:
  quote: ''
  summary: Legal provisions regulate when a father may cut off a son from sonship,
    how acknowledged and unacknowledged children of a maidservant are treated after
    the father’s death, and what property, residence, and remarriage rights a wife
    or widow may have.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father who says he will cut off his son must have the matter examined by
    judges; if the son has not committed a heavy crime that cuts off sonship, the
    father may not cut him off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a son commits a heavy crime against his father, the judges reconcile them
    for the first offense; after a second heavy crime the father may cut him off from
    sonship.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a father has acknowledged children borne by his maidservant as his sons
    and numbered them with the wife’s sons, then after his death both groups of sons
    divide the father’s household goods equally, while the wife’s sons choose first
    at the division.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the father did not acknowledge the maidservant’s sons as his sons, they
    do not share the father’s household goods with the wife’s sons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the unacknowledged case, the maidservant and her sons receive freedom,
    and the wife’s sons may not claim the maidservant’s children for service.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wife takes her marriage portion and any settlement deeded to her on a
    tablet, may dwell in her husband’s house and enjoy it during life, may not sell
    it, and after her it belongs to her sons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the husband gave no settlement, the wife is to be paid her marriage portion
    and a share from her husband’s house corresponding to that of one son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a woman’s sons trouble her to leave the house, judges investigate; if the
    sons are found in the wrong, she does not leave her husband’s house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the woman herself chooses to leave, she leaves the husband’s settlement
    to her children, takes the marriage portion from her father’s house, and may be
    taken by the husband of her choice.
  category: sequence
  evidence_refs:
  - ev:8
