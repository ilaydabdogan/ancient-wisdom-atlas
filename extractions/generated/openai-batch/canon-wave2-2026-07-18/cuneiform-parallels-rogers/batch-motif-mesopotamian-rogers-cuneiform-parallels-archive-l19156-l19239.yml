  quote: ''
  summary: The passage narrates Assyrian campaigns under Shalmaneser III against western
    Aramaean and allied states. It describes burned and annexed territory, planned
    attacks on Patin, Hamath, and Damascus, the role of Bir-idri of Damascus, the
    battle at Qarqar, conflicting Assyrian victory claims, repeated Assyrian setbacks,
    later political fragmentation among the western states, gifts sent by Tyre, Sidon,
    and Jehu, and Hazael of Damascus being left isolated.
