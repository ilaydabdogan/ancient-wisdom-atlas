canonical_text:
  quote: ''
  summary: The passage narrates the discovery, concealment, sale, damage, dispersal,
    and scholarly identification of more than three hundred Tell-el-Amarna clay tablets,
    later recognized as diplomatic letters and dispatches involving western Asian
    rulers, local governors or princes, and Egyptian kings Amenophis III and Amenophis
    IV.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman found dried and worm-eaten remains of ancient wooden record boxes
    in a mound and extracted more than three hundred inscribed clay tablets and tablet
    fragments from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tablets varied in size, with some described as very small and others larger.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fearing confiscation by the Egyptian government, the woman concealed the tablets
    with help from relatives and pursued secret negotiations for their sale.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some tablets were sent to Dr. Jules Oppert in Paris, who pronounced them forgeries;
    M. Grebaut did not attend to others brought to his attention.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some larger tablets were broken into multiple pieces in hopes that each piece
    could be sold to tourists for as much as an intact tablet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A bag of tablets sent to Luxor for sale among antiquity dealers caused many
    tablets, especially imperfectly baked ones, to be ground to powder and lost.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: One hundred and sixty tablets or fragments were bought by Theodore Graf, sold
    to J. Simon, and presented to the Royal Museums in Berlin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eighty-two tablets were bought for the British Museum trustees by E. A. Wallis
    Budge; sixty came to the Cairo Museum; others entered private collections.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the texts were widely scattered and that their study
    would have been easier if they had remained together.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Museum officials in Berlin, London, and Cairo recognized the tablets as letters
    from western Asian monarchs or dispatches from governors and princes to Amenophis
    III or Amenophis IV.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The governors or princes mentioned in the passage acknowledged the Egyptian
    kings as lawful rulers or suzerains over their territories.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author says that setting the documents in relation to biblical literature
    requires a broader view of their historical origin.
  category: speech
  evidence_refs:
  - ev:10
