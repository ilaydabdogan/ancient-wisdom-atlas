  summary: A bilingual creation passage says that the forms of heaven and earth were
    fixed and entrusted to the great gods. The passage links this entrusting with
    creating the day and renewing the month as signs for mankind. It then says that
    men saw Shamash at the gate of his going forth, with an uncertain final verb concerning
    Shamash in the midst of heaven and earth.
