canonical_text:
  quote: ''
  summary: 'Legal provisions from the Code of Hammurapi regulate royal service personnel
    and real property: penalties for officials who exploit soldiers, restrictions
    on selling or transferring service benefices, rules for purchased or vassal property,
    exchange and return of service property, and liability for failing to cultivate
    a field.'
  language: English with transliterated Akkadian in parallel
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the preserved ending of a preceding rule, a governor or magistrate connected
    with hiring a substitute for a king's errand is to be put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A governor or magistrate who takes a soldier's property, plunders a soldier,
    lets a soldier on hire, defrauds a soldier in judgment, or takes a gift given
    by the king to a soldier is to be put to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who buys cattle or sheep that the king gave to a soldier forfeits his
    money.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The field, garden, or house of a soldier, constable, or tribute man is not
    to be sold for money.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a man purchases the field, garden, or house of a soldier, constable, or
    tribute man, his tablet is broken, he forfeits his money, and he returns the property
    to its owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A soldier, constable, or tribute man may not transfer the field, garden, or
    house of his benefice to his wife or daughter, nor assign it for debt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: From a field, garden, or house that he has purchased and acquired, a man may
    transfer property to his wife or daughter or assign it for debt.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A nun(?), a merchant, or another vassal may sell his field, garden, or house
    for money, and the purchaser must fulfill the duties attached to the property.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:11
- id: obs:9
  text: If a man receives in exchange the field, garden, or house of a soldier, constable,
    or tribute man and makes an additional payment, the service holder who returns
    to the property keeps that additional payment.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:10
  text: A man who takes a field for cultivation but produces no grain is called to
    account and must give grain to the field owner on the basis of neighboring fields.
  category: sequence
  evidence_refs:
  - ev:10
