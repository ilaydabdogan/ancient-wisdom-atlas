  summary: 'The passage narrates political events around Sennacherib''s reign: Merodach-baladan
    seizes Babylonian power, seeks western allies including Hezekiah, Sennacherib
    defeats him near Kish, reorganizes Babylonia, then turns toward a western rebellion
    involving Judah, Egypt, Ekron, and Assyrian-appointed officials.'
