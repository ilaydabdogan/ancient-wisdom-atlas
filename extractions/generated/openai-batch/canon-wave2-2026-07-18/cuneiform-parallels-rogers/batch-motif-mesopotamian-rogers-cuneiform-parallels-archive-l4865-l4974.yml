canonical_text:
  quote: ''
  summary: A fragmentary Assyrian cosmological passage praises Ashur as creator, father
    and lord of the gods, maker of heaven, Hades, and humankind, and determiner of
    destiny. It then introduces a Sennacherib building inscription describing a bronze
    door in the New Year's festival house at Ashur, engraved with Ashur going to battle
    into the sea/Tiamat, bearing a bow, riding a chariot, releasing a storm flood,
    accompanied by Amurru as charioteer and by other gods in battle order.
  language: English with Akkadian transliteration
  quote_policy: summarized
