canonical_text:
  quote: ''
  summary: The passage presents a first-person royal campaign account. An opponent
    is said to flee after hearing the royal advance and being overcome by fear of
    Ashur. The narrator claims victories over Elam, Samaria, Gaza, Egypt-associated
    forces, and Hamath; reports deportation, seizure of chariots, appointment of governors,
    tribute-taking, defeat and capture of enemies, suppression of rebellion, burning
    of Karkar, flaying of Yaubi'di, killing of rebels, and incorporation of chariots
    and horsemen into royal forces.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening fragment, an unnamed opponent who had not bowed to the narrator's
    lordship hears the advance of the narrator's column; the fear of Ashur is said
    to cast him down, and he flees.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says that from the beginning through the fifteenth year of his
    reign he defeated Khumbanigash of Elam near Dur-ilu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator says he besieged and captured Samaria, carried away 27,290 inhabitants,
    collected 50 chariots, appointed governors, and imposed former royal tribute on
    the remaining population.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Hanno of Gaza and Sib'e, the Tartan of Egypt, come to Rapikhi to offer battle;
    the narrator defeats them, Sib'e flees and is not found, and Hanno is taken prisoner.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator receives tribute from Pir'u of Egypt, Samsi queen of Arabia,
    and It'amara the Sabaean, including gold, mountain products, horses, and camels.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yaubi'di of Hamath is described as having no claim on the throne and as a
    bad man; he seeks the kingdom of Hamath and causes Arpad, Simirra, Damascus, and
    Samaria to rebel against the narrator.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator gathers the troops of Ashur and besieges Yaubi'di and his soldiers
    in Karkar, described as Yaubi'di's darling city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator captures and burns Karkar, flays Yaubi'di, kills rebels in the
    cities, and states that he establishes peace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator collects 200 chariots and 600 horsemen from the inhabitants of
    Hamath and adds them to his royal forces.
  category: action
  evidence_refs:
  - ev:9
