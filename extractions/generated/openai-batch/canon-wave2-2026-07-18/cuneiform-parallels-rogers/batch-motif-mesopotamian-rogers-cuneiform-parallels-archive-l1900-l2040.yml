canonical_text:
  quote: ''
  summary: In a fragmentary creation-story passage, Anshar hears that Tiamat is in
    revolt and reacts with distress. He recalls that Mummu and Apsu have been cast
    down and that Tiamat has exalted Kingu. After missing lines, Anshar addresses
    his son as a mighty warrior and sends him to stand before Tiamat, first attempting
    to pacify her. Anu approaches Tiamat and sees her opened jaws but cannot endure
    her presence and turns back. Anshar grieves and turns toward Ea; later fragmentary
    lines again urge a son to approach battle.
