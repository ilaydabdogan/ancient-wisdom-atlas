  summary: The annalistic passage reports tribute brought before the first-person
    royal narrator, foot-kissing, construction of a royal palace, appointment of I-di-bi'lu
    as Resident in Egypt, prior annexation and deportation connected with Bit-Khumria/Samaria,
    lists of prisoners and people carried away, Mitinti of Ashkelon’s oath-breaking
    and fear after Reson’s defeat, Rukibtu’s enthronement and supplication, transfer
    of fifteen cities to Idi-bi'il of Arubu, and a small inscription listing coastal
    cities captured and officials appointed as governors.
