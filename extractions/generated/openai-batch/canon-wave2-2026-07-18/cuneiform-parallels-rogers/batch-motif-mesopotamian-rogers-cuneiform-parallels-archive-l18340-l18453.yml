  quote: ''
  summary: The passage contains portions of letters attributed to Abdi-khiba. He presents
    himself as the king's servant and son, makes formulaic acts of submission, asks
    that his words be conveyed clearly to the king, accuses local figures of revolt
    and territorial seizure, reports threats to Jerusalem and the absence or diversion
    of garrison forces, and asks the king to send troops and an agent to protect the
    king's land.
