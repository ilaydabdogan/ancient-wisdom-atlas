canonical_text:
  quote: I fear death, therefore do I wander in the desert.
  summary: Gilgamesh mourns Engidu, fears that he too will die, and wanders in the
    desert. He resolves to seek Ut-napishtim, a forefather said to have escaped death
    and to live beyond the western seas. His route takes him toward mountain defiles
    and Mount Mashu, where scorpion men guard the way; after a long passage through
    darkness he reaches sunlight and a beautiful garden by the sea.
  language: English
