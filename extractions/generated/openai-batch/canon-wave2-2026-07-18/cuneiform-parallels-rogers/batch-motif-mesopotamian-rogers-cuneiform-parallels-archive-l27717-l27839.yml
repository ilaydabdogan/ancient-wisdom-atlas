canonical_text:
  quote: ''
  summary: The passage gives laws from the Code of Hammurapi concerning veterinary
    operations on oxen or asses, alteration of a slave's mark, house-building fees
    and liability for collapse, and boat-building fees and quality obligations. The
    English translation is followed by Akkadian transliteration for the same sections.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A veterinary doctor who operates on an ox or ass for a severe wound and saves
    its life receives one sixth of a shekel of silver from the animal's owner.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A veterinary doctor who operates on an ox or ass for a severe wound and causes
    its death must give the owner one fourth of the animal's value.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A brander who, without the slave owner's consent, makes a slave's mark unrecognizable
    has his hands cut off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a man deceives a brander and causes him to make a slave's mark unrecognizable,
    the deceiving man is put to death and buried in his house; the brander swears
    that he branded unknowingly and goes free.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A builder who completes a house for a man receives two shekels of silver per
    SAR of house as his fee.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a builder makes a weak house and it falls, causing the death of the house
    owner, the builder is put to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the fallen house causes the death of the house owner's son, the builder's
    son is put to death; if it causes the death of the house owner's slave, the builder
    gives slave for slave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a builder causes loss of property through a fallen house, he restores what
    was lost and rebuilds the house from his own goods; if a wall falls because the
    work was not properly joined, he makes the wall good at his own cost.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A boatman who builds a boat of sixty GUR for a man receives two shekels of
    silver; the next law begins a case in which a boatman's untrustworthy work causes
    injury to the boat in the same year.
  category: sequence
  evidence_refs:
  - ev:9
