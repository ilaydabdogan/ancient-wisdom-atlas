canonical_text:
  quote: "[Hezekiah] himself I shut up like a caged bird within Jerusalem"
  summary: The passage is an Assyrian royal account of Sennacherib's western campaign.
    The speaker distinguishes offenders from pardoned people, restores Padi to rule
    under tribute, attacks Hezekiah of Judah, captures cities and booty, confines
    Hezekiah in Jerusalem, redistributes territory to other kings, increases tribute,
    and receives Hezekiah's submission and gifts at Nineveh. A following summary notes
    the removal of Luli of Sidon and installation of Tuba'lu, with tribute imposed
    and Judah destroyed.
  language: English with Akkadian transliteration
  quote_policy: quoted
