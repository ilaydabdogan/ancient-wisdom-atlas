  quote: ''
  summary: The passage gives several legal provisions from the Code of Hammurapi concerning
    false claims of loss, accusation, marriage contracts, adultery, sexual assault,
    oaths before the god, river ordeal, and obligations of a wife when her husband
    is taken prisoner.
  language: English with Akkadian transliteration
