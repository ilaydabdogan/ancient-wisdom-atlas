literal_observations:
- id: obs:1
  text: A man who falsely claims to have lost something must declare the alleged loss
    before the god and pay double the claimed amount as a forfeit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who makes an unproved accusation against a votary or another man's wife
    is brought before the judge and has the hair cut from his temples.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who takes a wife without arranging marriage contracts has not made that
    woman a legal wife in this provision.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a wife is caught lying with another man, the pair are bound and thrown
    into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the adultery provision, the woman's husband may save his wife, and the
    king may save his male servant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man who forces the betrothed wife of another, described as not having known
    a male and living in her father's house, is put to death, while the woman goes
    free.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A wife accused by her husband but not caught lying with another man takes
    an oath in the name of the god and returns to her house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A wife against whom the finger has been pointed, but who has not been caught
    lying with another man, must plunge into the holy river for her husband's sake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a man has been taken prisoner and there is food in his house, the damaged
    text indicates that his wife is not to enter another house and is to care for
    her possessions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If that woman does not care for her possessions and enters another house,
    she is convicted and cast into the water.
  category: action
  evidence_refs:
  - ev:10
