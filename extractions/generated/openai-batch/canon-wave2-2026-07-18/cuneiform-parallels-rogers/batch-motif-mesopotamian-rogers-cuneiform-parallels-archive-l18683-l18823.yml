canonical_text:
  quote: ''
  summary: The excerpt closes an administrative guarantee or sale text with date and
    witnesses, followed by the beginning of the Letters from Ta'anek. Letter A is
    from Guli Addu to Ashirat-yashur, includes a blessing, references money and gold
    pieces, asks about a greeting and information received through Belram, gives instructions
    about an omen or finger of Ashirat and its sign or event, and mentions Ashirat-yashur's
    daughter Shalmisha in Rubute, who is to be given to sovereignty or to the lord
    when grown. Letter B opens from Akhi-ia-mi to Ashirat-yashur with a protective
    invocation to the lord of the gods and language of brotherhood and affection.
  language: English with Akkadian transliteration excerpts
  quote_policy: summarized
