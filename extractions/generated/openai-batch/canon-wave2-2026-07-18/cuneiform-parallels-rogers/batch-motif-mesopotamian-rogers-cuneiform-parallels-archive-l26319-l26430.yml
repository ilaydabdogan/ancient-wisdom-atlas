canonical_text:
  quote: ''
  summary: Sections 117-125 give legal rules for debt-service of family members and
    slaves, ransom of a female slave who has borne children, storage of grain, deposits
    of valuables, witnesses and contracts, disputes over deposits, double restitution,
    and liability for loss through burglary or pillage.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in debt may sell or hand over his wife, son, or daughter for money or
    service; they work three years in the purchaser's or exploiter's house and are
    set at liberty in the fourth year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a male or female slave has been handed over to service, a merchant may
    transfer or sell the slave, and no legal case lies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man in debt hands over for money a female slave who has borne him children,
    he must repay the merchant and ransom the female slave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When grain stored in another man's house is taken or its amount disputed,
    the grain owner declares the grain in the presence of the god, and the house owner
    restores double the amount taken.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man who stores grain in another man's house pays a yearly storage price
    of five KA of grain per GUR.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: A deposit of silver, gold, or anything else is to be shown to witnesses, set
    under contract, and then deposited.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a deposit is made without witnesses or contract and is disputed at the
    place of deposit, no legal case lies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a witnessed deposit is denied, the denying party is called to account and
    must repay double what was disputed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If deposited property is lost through burglary or pillage along with the house
    owner's property, the negligent house owner must make good the loss.
  category: sequence
  evidence_refs:
  - ev:9
