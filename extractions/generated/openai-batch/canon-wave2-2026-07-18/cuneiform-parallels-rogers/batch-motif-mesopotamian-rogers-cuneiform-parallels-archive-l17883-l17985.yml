canonical_text:
  quote: ''
  summary: The excerpt closes a Rib-Adda letter in which the speaker asks the king
    for an answer, provisions, and official support through Jankhamu; threatens alliance
    or departure if no answer comes; reports hostility from relatives of a man given
    to the king; and mentions prayer to Ba'alat of Byblus. It then begins an Abdi-khiba
    of Jerusalem letter in which Abdi-khiba addresses the king as lord, prostrates
    himself seven and seven times, denies revolt, says the king appointed him, and
    complains about a royal officer favoring the Khabiri over native princes.
  language: English
