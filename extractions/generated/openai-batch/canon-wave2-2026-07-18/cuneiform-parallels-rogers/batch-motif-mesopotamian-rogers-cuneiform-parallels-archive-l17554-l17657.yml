canonical_text:
  quote: ''
  summary: The passage first describes the Tell-el-Amarna letters as evidence for
    Babylonian linguistic influence in western Asia and notes additional cuneiform
    tablet finds in Palestine. It then gives part of a letter from Burraburiash, king
    of Karaduniash, to Napkhururia/Amenophis IV, king of Egypt. Burraburiash greets
    the Egyptian king as his brother, invokes the friendship of their fathers, reports
    that his merchants were slain and robbed in Canaan, sends Azzu as an informant,
    and asks the Egyptian king to punish the offenders and restore the money.
  language: English
