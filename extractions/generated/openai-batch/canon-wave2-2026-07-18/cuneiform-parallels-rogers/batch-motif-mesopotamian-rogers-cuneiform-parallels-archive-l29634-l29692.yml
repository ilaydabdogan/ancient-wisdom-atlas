canonical_text:
  quote: ''
  summary: 'Plate captions identify an Assyrian clay tablet of The Descent of Ishtar
    to Hades, showing obverse and reverse, and describe three cylinder seals: a Babylonian
    seal with Sin receiving an introduced worshiper; a Persian seal with Darius hunting
    lions under the emblem of Ahuramazda; and a Babylonian seal of Adda the scribe
    showing Ishtar with a bow and lion, and Shamash rising or setting between mountains.'
  language: English
  quote_policy: summarized
