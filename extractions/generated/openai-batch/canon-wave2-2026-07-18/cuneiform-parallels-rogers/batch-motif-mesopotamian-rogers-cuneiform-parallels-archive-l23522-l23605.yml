canonical_text:
  quote: ''
  summary: 'The passage recounts Nebuchadrezzar’s victory, his father’s death in Babylon,
    his return across the desert to assume dominion, and the transport and settlement
    of captives in Babylonia. It then summarizes later Babylonian successions: Amel-Marduk/Evil-Merodach,
    his release of Jehoiachin, his assassination, the reign of Nergal-shar-usur, Median
    pressure, the brief reign and assassination of Labashi-Marduk, and the accession
    of Nabonidus with priestly and religious interests.'
  language: English with embedded Greek excerpt
  quote_policy: summarized
