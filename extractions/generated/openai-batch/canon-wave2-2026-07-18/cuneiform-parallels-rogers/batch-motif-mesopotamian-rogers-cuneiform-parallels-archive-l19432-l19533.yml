canonical_text:
  quote: like Adad I rained a deluge upon them
  summary: The royal speaker says he crossed the Euphrates at flood on sheep-skin
    boats, received tribute from western kings, approached Khalman, received submission
    and tribute there, and offered sacrifices to Adad. He then captured and burned
    cities belonging to Irkhulini the Hamathite, including Qarqar. A coalition of
    named rulers and forces marched against him. The speaker attributes his victory
    to power granted by Ashur and arms granted by Nergal, says he defeated the coalition
    from Qarqar to Gilzau, and compares his attack to Adad raining a deluge.
  language: English with Akkadian transliteration present
  quote_policy: quoted
