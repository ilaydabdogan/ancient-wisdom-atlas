canonical_text:
  quote: ''
  summary: Abdi-khiba warns the king that Jerusalem and its lands will be lost without
    troops, asserts that his authority over Jerusalem came from the king rather than
    his parents, accuses Milki-il and Lapaja's sons of handing the land to the Khabiri,
    asks for royal officers, garrison, and provisions, reports revolt and caravan
    robbery, and appeals to the king's permanent claim over Jerusalem. He also addresses
    the royal scribe as a servant, reports violence by the people of Kash, and asks
    that the matter be brought before the king.
  language: English with Akkadian transliteration
  quote_policy: summarized
