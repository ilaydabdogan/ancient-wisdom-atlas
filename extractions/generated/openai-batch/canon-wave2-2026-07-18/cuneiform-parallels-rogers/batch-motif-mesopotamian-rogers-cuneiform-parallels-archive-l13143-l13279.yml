canonical_text:
  quote: ''
  summary: The passage first preserves the end of a psalm to Tammuz, addressing husbandmen
    and describing their lord as hero, grain-god, and child, then as isolated, destroyed,
    no longer granting peace or salvation, sleeping like a dog and raven while a wail
    is raised. The passage then gives a prayer asking to depart from wickedness, be
    saved, behold a favorable and true dream, have dream deities stand at the speaker's
    head, enter Esagila, be commended to merciful Marduk, and respond with praise.
  language: English translation with Sumerian and Akkadian transliteration
  quote_policy: summarized
