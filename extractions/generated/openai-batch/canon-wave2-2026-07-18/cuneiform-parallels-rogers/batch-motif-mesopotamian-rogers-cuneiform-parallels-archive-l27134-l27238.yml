canonical_text:
  quote: ''
  summary: The passage gives laws from the Code of Hammurapi concerning remarriage,
    marriage portions, mixed-status marriages involving slaves and free women, division
    of property after a husband's death, judicial oversight of a widow with minor
    children who wishes to remarry, protection of minor children's property, and the
    beginning of a rule about a votary or vowed woman receiving a marriage portion
    by deed.
  language: English translation with transliterated Akkadian lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a woman has borne children to a later husband, after her death the sons
    from the former and later marriages divide her marriage portion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the woman has not borne children to the later husband, the sons of her
    first husband divide her marriage portion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a palace slave or a freedman's slave marries the daughter of a gentleman
    and she bears sons, the slave owner may not claim those sons for service.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a mixed-status marriage, the daughter of a gentleman may enter the slave
    husband's house with a marriage portion, and the couple may join hands, build
    a house, and acquire property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the slave husband dies, the daughter of the gentleman takes her marriage
    portion, and property acquired during the marriage is divided into two parts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: One half of the acquired property goes to the slave owner, and one half goes
    to the daughter of the gentleman for her children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the daughter of the gentleman had no marriage portion, the property acquired
    from the time of joining hands is still divided into two parts between the slave
    owner and the woman for her children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A widow whose children are minors may not enter another house without the
    consent of the judges.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the widow enters another house, the judges inquire into the residue of
    her former husband's estate, entrust the former husband's house to the later husband
    and the widow, and cause them to receive a deed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The later husband and widow are to administer the property and rear the minor
    children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: No utensil belonging to the widow's sons may be sold for money; a buyer loses
    the money and must return the property to its owners.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage begins a rule about a votary or vowed woman whose father granted
    her a marriage portion and wrote her a deed, but the rule is incomplete in the
    provided excerpt.
  category: sequence
  evidence_refs:
  - ev:9
