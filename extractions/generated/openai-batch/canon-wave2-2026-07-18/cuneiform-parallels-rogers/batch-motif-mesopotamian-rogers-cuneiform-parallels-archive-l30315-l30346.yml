canonical_text:
  quote: ''
  summary: The passage describes Plate No. 47 as an enumeration of twenty symbols
    on the boundary stone of Nebuchadrezzar I from Nippur. The listed symbols include
    shrines, scepters, animal forms, celestial signs, a lightning fork ending in serpents,
    a serpent winding over the head of the stone, and a bird beside the serpent; many
    are identified as symbols of named Mesopotamian deities.
  language: English
