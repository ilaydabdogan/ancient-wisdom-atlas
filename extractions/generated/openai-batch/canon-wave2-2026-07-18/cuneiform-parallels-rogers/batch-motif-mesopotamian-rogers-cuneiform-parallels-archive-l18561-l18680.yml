  summary: The passage contains an English translation and transliteration of a letter
    fragment reporting an alleged conspiracy involving Shipti-Ba'al and Zimrida, a
    quoted request for weapons, a planned campaign against the king's land, Pabu's
    role in the plan, and the dispatch of Rapi-el with intelligence. It then gives
    Gezer tablet texts recording seal-authenticated property sales, named persons,
    witnesses, dates, and a partially broken clause concerning sickness or physical
    defect.
