  text: Shamash's curse is asked to sweep the target away quickly, cut him off among
    the living, and deprive him of water below in the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sin is asked to take away the target's crown and royal throne, lay guilt and
    sin upon him, and make his reign end in sighs, tears, burdens, and a life like
    death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ramman is asked to deprive the target of rain from heaven and water floods
    from springs, destroy his land with hunger and want, thunder over his city, and
    make his land into heaps.
  category: action
  evidence_refs:
  - ev:5
