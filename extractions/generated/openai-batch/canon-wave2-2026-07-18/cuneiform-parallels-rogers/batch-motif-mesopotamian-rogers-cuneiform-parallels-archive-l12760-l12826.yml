canonical_text:
  quote: ''
  summary: A hymn or lament to Tammuz asks how long the putting forth of leaves will
    be held back, describes the speaker's city as oppressed, the shepherd as desolate,
    and the laws of the land as suppressed. The addressed lord has gone forth from
    the secret chamber. The reverse repeatedly laments a divine figure with titles
    including hero, lord of healing, Damu, Gishzida, Lamga, prince, god of wailing,
    and Tammuz. It says that in infancy he lay in a sunken boat, in manhood he lay
    in submerged grain, and that he lay amid a south storm and tempest; a final line
    about rest is uncertain, with an editorial note suggesting the marriage bed may
    be meant.
  language: English with Sumerian/Akkadian transliteration
  quote_policy: summarized
