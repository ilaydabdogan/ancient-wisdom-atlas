canonical_text:
  quote: ''
  summary: 'The passage preserves the end of a flood account: a ship comes to rest
    on a mountain; a flood survivor and companions leave the ship, worship, sacrifice,
    and disappear; a heavenly voice instructs the remaining survivors to go to Babylon
    and recover writings. An English continuation says the ship’s remains were located
    in the mountains of the Gordysoans in Armenia, its asphalt was used apotropaically,
    and survivors came to Babylonia, recovered writings at Sippar, founded cities
    and shrines, and repopulated Babylonia. The passage then introduces a doctrine
    of world destruction by fire, attributed through Seneca to Berosus, and notes
    uncertain possible echoes in Hebrew texts.'
  language: English with Greek and Latin excerpts
  quote_policy: summarized
