  summary: A damaged passage describes Atrakhasis turning to Ea and setting a couch
    by the river. Ellil, disturbed by human clamor, convenes the gods and calls for
    chill, pestilence, illness, headache, and calamity to end the noise. The affliction
    rises like a tempest. Atrakhasis, called wise, speaks with Ea and asks that the
    sufferings of humanity cease; Ea replies in a fragmentary section that includes
    an instruction to pray to a goddess.
