canonical_text:
  quote: ''
  summary: The watchman tells Ishtar he will announce her arrival to Ereshkigal. Ereshkigal
    hears that her sister Ishtar has come, questions why she has arrived, speaks of
    clay as food, water as drink, and mourning those separated from family by death,
    then orders the gate opened according to ancient custom. The watchman admits Ishtar
    through successive doors into Cutha and the land of No-return, removing her crown,
    ear pendants, neck chains, and breast ornaments under the sovereign's orders.
  language: English
  quote_policy: summarized
