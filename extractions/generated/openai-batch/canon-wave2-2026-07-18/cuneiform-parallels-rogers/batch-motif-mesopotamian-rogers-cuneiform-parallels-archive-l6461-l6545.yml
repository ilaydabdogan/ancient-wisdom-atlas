canonical_text:
  quote: Two thirds of him is God, one third of him is man.
  summary: 'The passage introduces the first tablet of the Gilgamesh Epic: Gilgamesh
    is described as a far-traveling, semi-divine hero who saw hidden wisdom, brought
    tidings from before the deluge, wrote his sufferings on a stone tablet, and built
    Uruk''s wall. His harsh demands on Uruk lead the people to appeal to the gods,
    who ask Aruru to create a rival. Aruru forms Engidu from clay and spit. Engidu
    is hairy, lives among wild beasts, protects them from hunters, and is later enticed
    by a harlot to follow her.'
  language: English
  quote_policy: quoted
