canonical_text:
  quote: ''
  summary: 'In a fragment of Atrahasis, Ellil addresses an assembly of the gods and
    decrees afflictions against humanity: lack of vegetables, diminished rain, obstructed
    underground waters, reduced agricultural produce, salty fields, failed plants
    and livestock, calamity, and a closed womb. The text then reports these conditions
    as having occurred. After a missing passage, Ea is named in connection with a
    ritual in which a female figure recites an incantation, spits on clay, and divides
    fourteen clay pieces, placing seven on the right. An editorial note says Ea forms
    replacement humans with the assistance of Nami/Aruru and seven mothers.'
  language: English translation with Akkadian transliteration
  quote_policy: summarized
