canonical_text:
  quote: ''
  summary: Epilogue passage from the Code of Hammurapi instructing a later ruler or
    reader to preserve Hammurapi's inscribed monument and use it as a model for just
    rule. Compliance is linked with Shamash prolonging the ruler's reign; alteration
    or erasure of the law, words, image, or name is answered by curses invoking Anu,
    Ellil, Bel, and Belit.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hammurapi says that words of righteousness, the law of the land, and decisions
    he pronounced are written on his monument.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later man is instructed not to alter the law and not to efface Hammurapi's
    image.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the later man has wisdom and wishes to keep his land in order, he is to
    heed the words on the monument, which will show procedure, administration, law,
    and decisions.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The later ruler is to rule subjects, pronounce judgment, give decisions, drive
    wicked and evildoers from the land, and promote the people's prosperity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hammurapi identifies himself as king of righteousness and says Shamash endowed
    him with justice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the later man heeds Hammurapi's words and does not efface the law, deface
    the words, or alter the monument, Shamash is asked to prolong his reign and let
    him rule in righteousness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the later man ignores Hammurapi's words, despises the curses, does not
    fear the god's curse, blots out the law, defaces words, alters images, blots out
    Hammurapi's name, writes his own name, or commissions another to do so, curses
    are invoked against him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The curse is said to apply whether the offender is king, lord, patesi, commoner,
    or bears any other name.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anu is invoked to remove the offender's royal glory, break his staff, and
    curse his fate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ellil is invoked to set rebellion, downfall, a sighing reign, short life,
    famine, darkness, and sudden death as the offender's destiny.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Bel is invoked to command the destruction of the offender's city, the scattering
    of subjects, the loss of dominion, and the erasure of name and memory in the land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Belit is invoked as the great mother whose command is powerful in Ekur and
    is asked to make the offender's affairs evil before Ellil.
  category: action
  evidence_refs:
