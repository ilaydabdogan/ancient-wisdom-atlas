canonical_text:
  quote: ''
  summary: A boundary-stone inscription records divine and royal favor connected with
    offerings, supplications, and service. Nebuchadrezzar is described with royal
    epithets, and Bau-shum-iddina measures and grants a specified Tigris-side field
    in Bit-Sin-sheme to the priest Nusku-ibni forever. The field boundaries, former
    flood exposure, neighboring properties, surveyors, and a future warning against
    anyone who would overturn the field are listed.
  language: English with transliterated Akkadian/Sumerian
  quote_policy: summarized
