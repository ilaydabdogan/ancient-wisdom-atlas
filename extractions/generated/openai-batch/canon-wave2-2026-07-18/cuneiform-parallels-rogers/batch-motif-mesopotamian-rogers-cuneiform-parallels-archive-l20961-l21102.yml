canonical_text:
  quote: ''
  summary: 'The passage reports Assyrian royal actions: a territory read as Naphtali
    is added to Assyria, officials are appointed as governors, Hanno of Gaza flees
    to Egypt, Gaza is captured, goods and gods are carried away, a royal portrait
    is set up, tribute and taxes are imposed, people and goods of Bit Khumria are
    taken to Assyria, Pekah is deposed and Hosea established as king, and gold and
    silver are received. A Nimroud Tablet excerpt lists tribute from numerous named
    rulers and itemizes tribute goods such as metals, garments, land and sea products,
    royal treasure, horses, mules, and teams.'
  language: English translation with Akkadian transliteration excerpts
