canonical_text:
  quote: ''
  summary: The passage presents laws from the Code of Hammurapi, chiefly §§142-150,
    concerning disputes between husband and wife, return of marriage portions, punishment
    of a negligent wife, maidservants and concubines, the status of a childbearing
    maidservant, care for an ill wife, and deeded property given to a wife and later
    distributed by a mother.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who is found to have been economical and without reproach, while her
    husband has gone out and greatly belittled her, is said to have no blame.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blameless woman in this provision takes her marriage portion and goes
    to her father's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman described as not economical, going about, neglecting her house, and
    belittling her husband is to be thrown into the waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a wife gives a maidservant to her husband and the maidservant bears children,
    the man is not permitted to take a concubine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a wife has not presented her husband with children, the husband may take
    a concubine into his house, but the concubine does not rank with the wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a maidservant given to the husband bears children and then makes herself
    equal with her mistress, the mistress may not sell her for money.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the childbearing maidservant case, the mistress may put a mark upon the
    maidservant and count her among the maidservants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the maidservant has not borne children, her mistress may sell her for money.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a wife is seized by leprosy or a similar condition, the husband may take
    another woman, but he may not put away the stricken wife.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The stricken wife remains in the house the husband has built, and he maintains
    her as long as she lives.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: If that woman is not content to dwell in her husband's house, he pays her
    the marriage portion brought from her father's house, and she may go away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man may give his wife field, garden, house, or goods and leave her a sealed
    deed.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the husband's death, the wife's children may not make claim on her deeded
    property; the mother gives her estate to the child whom she loves and not to brothers.
  category: relationship
  evidence_refs:
  - ev:9
