canonical_text:
  quote: ''
  summary: A fragmentary section of Hammurapi's code gives rules about garden produce
    after accounting, houses subject to vassalage obligations, conduct on one's own
    and a neighbor's lot, an uncultivated portion linked to possible house break-in,
    tenant removal before lease expiration, and payment to a creditor with chattels
    before witnesses when produce or silver is unavailable.
  language: English, with transliterated Akkadian in parallel
  quote_policy: summarized
