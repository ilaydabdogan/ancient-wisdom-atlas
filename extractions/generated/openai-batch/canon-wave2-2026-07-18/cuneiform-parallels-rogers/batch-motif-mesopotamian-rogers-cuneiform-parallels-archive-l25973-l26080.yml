- id: obs:1
  text: After an account including interest, the remaining dates produced in the garden
    are assigned to the possessor of the garden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If produce, silver, or movable goods are given for a house bound by vassalage
    obligation, the payer loses what was paid and the house returns to its owner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the house is not bound by vassalage obligation, it may be bought with produce,
    silver, or movable goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may act on his own lot without the neighbor's permission, but may do
    no injury on the neighbor's lot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fragmentary rule says the possessor of a house shall replace something unspecified.
