    states that he reigned eight years in Elam.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Sennacherib, King of Assyria, was killed by his son in a revolt; the revolt
    continued for a specified period, and Esarhaddon then took the Assyrian throne.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Zeru-kinish-lishir fled before Assyrian nobles to Elam, where the King of
