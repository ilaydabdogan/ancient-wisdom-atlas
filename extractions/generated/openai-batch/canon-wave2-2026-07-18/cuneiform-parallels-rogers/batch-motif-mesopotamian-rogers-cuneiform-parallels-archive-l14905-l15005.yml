  summary: A Babylonian chronicle passage records Elamite and Assyrian royal successions,
    periods of revolt, the return of city gods to their cities, fugitives captured
    and killed, military campaigns, the removal of royal heads to Assyria, and an
    Elamite massacre at Sippar. Several lines are broken or uncertain.
  language: English translation with Akkadian transliteration
