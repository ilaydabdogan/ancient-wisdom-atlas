  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The god Ka-di and other gods of Dur-ilu returned to Dur-ilu; the chief god
    and other gods of Dur-Sharrukin returned to Dur-Sharrukin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A broken line reports named and unnamed persons being brought to Assyria and
