canonical_text:
  quote: At the feet of my lord, my sun have I fallen seven times and (again) seven
    times.
  summary: Two excerpted letters of Rib-Adda address the great king with a blessing
    from Ba'alat of Byblus and a repeated formula of obeisance. Rib-Adda reports Byblus
    as loyal but threatened by Khabiru forces, asks the king not to hold back from
    Sumur and his cities, describes the role of royal representatives, reports seized
    horses and an obstructed tablet, and requests military support.
  language: English
  quote_policy: quoted
