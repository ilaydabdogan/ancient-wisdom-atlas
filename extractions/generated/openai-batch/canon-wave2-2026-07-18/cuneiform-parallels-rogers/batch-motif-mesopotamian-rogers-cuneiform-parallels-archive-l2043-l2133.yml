canonical_text:
  quote: ''
  summary: In a creation-tablet passage, the lord approaches Anshar after his father's
    word. Anshar rejoices and kisses him, and fear departs. The lord asks to fulfill
    what is in his father's heart. Tiamat is described as an armed female attacker
    whose neck will be trampled. The son, called wise, is told to appease Tiamat by
    pure incantation, set out, avoid bloodshed, and return. The lord then says that
    if he, as avenger, enchains Tiamat and gives the gods life, they should assemble
    in Upshukkinaku, exalt his destiny, and let his spoken decree of fate remain unchanged.
  language: English with Akkadian transliteration
  quote_policy: summarized
