canonical_text:
  quote: ''
  summary: The passage gives campaign excerpts for Shalmaneser III. In the eleventh
    regnal year he departs Nineveh, crosses the Euphrates at high water, captures
    and burns cities, fights a coalition led by Bir-idri of Damascus, Irkhuleni of
    Hamath, and twelve sea-coast kings, takes prisoners and war equipment, receives
    tribute from Kalparundi of Patin, and cuts cedar on Amanus. It also gives Obelisk
    and Bull inscription versions of a fourteenth-year campaign in which he crosses
    the Euphrates and defeats twelve kings.
  language: English translation with Akkadian transliteration included
  quote_policy: summarized
