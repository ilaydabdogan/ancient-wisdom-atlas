canonical_text:
  quote: ''
  summary: The passage introduces Shalmaneser III as the uncontested successor of
    his father Ashurnazirpal II. It says he extended his father's policies and made
    conquest of western states, rather than mere plunder, his policy. It describes
    attacks on Aramaean settlements in the Euphrates valley, repeated invasions in
    859, 858, and 857, the power of Bit-Adini, and ravaging marked by violent displays
    including pyramids of heads. A footnote locates Bit-Adini near both banks of the
    Euphrates where the river turns west after the Taurus.
