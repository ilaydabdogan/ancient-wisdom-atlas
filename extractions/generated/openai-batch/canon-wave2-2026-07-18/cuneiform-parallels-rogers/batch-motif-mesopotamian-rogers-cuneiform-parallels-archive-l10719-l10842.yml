canonical_text:
  quote: ''
  summary: The passage contains the close of a prayer asking for gracious regard toward
    the deity's house, city, Babylon, and E-sagila, and for protective elements of
    Babylon, E-sagila, and E-zida to be restored. A note assigns the hymn to the eleventh
    day of Nisan at Marduk's entry into E-sagila. It then begins a 'Prayer of the
    Raising of the Hand' to Ishtar, praising Ishtar/Irnini/Gushea as sovereign goddess,
    queen, light of heaven and earth, daughter of Sin, bearer of arms, establisher
    of combat, framer of laws, wearer of dominion's crown, disturber of peace, fulfiller
    of destiny and decision, and deity exalted by Anu, Ellil, and Ea.
  language: English with Akkadian transliteration
  quote_policy: summarized
