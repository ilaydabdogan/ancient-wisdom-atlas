canonical_text:
  quote: ''
  summary: A fragmentary Assyrian eponym list records yearly notices from 717 to 705
    and a related fragment for 708 to 704. The entries mention cities, governors,
    royal returns, conquest, destruction, gods entering temples, an oracle, conflict
    near the Assyrian king's camp, and Sennacherib taking the throne.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is organized as dated eponym-year entries with short historical
    notices, many of them fragmentary.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: In the 709 entry, a king is said to have been taken prisoner at Kish, and
    Sharru-ukin, identified parenthetically as Sargon, took the hands of Bel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the 708 entry, Kummukh was captured and a governor was appointed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first list records the king returning from Babylon in 707 and the gods
    of Dur-Yakin entering their temples after notices involving Dur-Yakin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The similar fragment records a 707 entry in which the king returned from Babylon
    and the gods of Dur-Sharru-ukin entered their temple on the twenty-second day
    of Teshrit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The 705 entry names Upakhkhir-Bel as eponym governor of Amedi and says that,
    on the twelfth day of Ab, Sennacherib took his seat on the throne.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The 705 entry also mentions an oracle, the Kulummaites, guerillas, and the
    camp of the King of Assyria, but the notice is fragmentary.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The 704 entry names Nabu-dini-ebush as eponym governor of Nineveh and mentions
    Larak, Sarabunu, and building activity at a palace in Kakzi.
  category: action
  evidence_refs:
  - ev:7
