canonical_text:
  quote: They rejoiced, they paid homage, "Marduk is king."
  summary: The gods address Marduk, test his command by placing a garment among them
    for him to destroy and restore, and then rejoice at the power of his word. They
    proclaim him king, give him symbols of authority and an invincible weapon, and
    send him to cut off Tiamat's life. Marduk prepares weapons, lightning, fire, a
    net, and multiple winds to enclose Tiamat so she cannot escape.
  language: English translation with Akkadian transliteration
  quote_policy: quoted
