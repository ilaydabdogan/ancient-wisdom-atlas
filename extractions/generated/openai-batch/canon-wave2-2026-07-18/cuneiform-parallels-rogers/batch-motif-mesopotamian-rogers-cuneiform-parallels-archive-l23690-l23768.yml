canonical_text:
  quote: '"Preserver of Esagila and Ezida"'
  summary: 'The passage describes Nabonidus as a temple-restoring king who rebuilt
    the Shamash temple at Sippar on an ancient foundation associated with Naram-Sin,
    used cedar beams for the new building, and reconstructed the E-ulbar shrine of
    Ishtar-Anunit. It then turns to the rise of the Medes and Persians: the Medes
    helped destroy Nineveh and expanded under Cyaxares; Cyrus, born in Anshan as son
    of Cambyses and initially subordinate to Astyages, rebelled, received Astyages
    bound by his own troops, sacked Ecbatana, ended Median power, and expanded Persian
    control toward Lydia and Asia Minor.'
  language: English
  quote_policy: quoted
