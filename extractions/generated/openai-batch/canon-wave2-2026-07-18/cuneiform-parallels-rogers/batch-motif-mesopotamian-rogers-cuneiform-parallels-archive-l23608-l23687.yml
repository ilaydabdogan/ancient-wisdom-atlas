canonical_text:
  quote: ''
  summary: The passage describes Nabonidus as a Babylonian king devoted to rebuilding
    temples, excavating early foundation stones, recovering older royal records, and
    preserving the memory of earlier builders. It contrasts this activity with neglect
    of military and political preparation while Cyrus rose in power. It also describes
    Nabonidus living at Tema while Belshazzar, his son, handled state affairs in his
    name.
  language: English
