canonical_text:
  quote: ''
  summary: 'The passage gathers translated and transliterated materials about Sennacherib:
    destruction of mountain and hill-country peoples and cities, an inscription showing
    Sennacherib enthroned while prisoners of Lachish pass before him, a campaign against
    Arabian figures who flee into the desert after camels are taken, and Herodotus''s
    account of the Egyptian priest-king Sethos receiving divine reassurance in a sanctuary
    dream when Sennacherib invades.'
