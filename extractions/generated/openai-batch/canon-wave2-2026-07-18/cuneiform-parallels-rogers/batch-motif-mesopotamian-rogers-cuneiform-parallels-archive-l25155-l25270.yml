canonical_text:
  quote: ''
  summary: The passage gives laws from the Code of Hammurapi concerning theft, lost
    property, witness procedure, restitution, liability when witnesses or sellers
    are absent, and the death penalty for stealing a minor son of a gentleman. It
    includes an English translation followed by transliterated Akkadian text for the
    same sections.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who steals an ox, sheep, ass, pig, or ship must restore thirtyfold if
    the property belonged to a god or palace, and tenfold if it belonged to a freedman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the thief lacks the means to pay the required restitution, he is to be
    put to death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When lost property is found in another man's possession, the possessor may
    claim that he bought it from a seller in the presence of witnesses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The owner of lost property may claim that he will bring witnesses who know
    the lost property.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Judges consider the evidence brought by the purchaser, seller, purchase witnesses,
    owner, and witnesses who know the lost property.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Witnesses give testimony in the presence of the god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: If the seller is found liable in the lost-property case, the seller is put
    to death as a thief, the owner receives the property, and the purchaser recovers
    his money from the seller's estate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the purchaser cannot produce the seller and purchase witnesses, while the
    owner produces witnesses who know the property, the purchaser is put to death
    as a thief and the owner receives the property.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the owner of lost property does not produce witnesses who know the property,
    he is called a malefactor, is said to have stirred up strife, and is put to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the seller has died, the purchaser takes fivefold damages from the seller's
    estate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: If witnesses are not at hand, the judges set a fixed time of up to six months;
    if the man does not bring witnesses within that period, he bears the penalty of
    the case.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man who steals the minor son of a gentleman is to be put to death.
  category: action
  evidence_refs:
  - ev:8
