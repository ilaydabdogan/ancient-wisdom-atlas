canonical_text:
  quote: ''
  summary: After bathing, a damsel asks what had happened. The other explains that
    she had placed her things in her head, recounts what an old man did, and connects
    this with her former large head. Umkccakaza gives a garment, puts on her ornamented
    brass-bead garment, and states her name. The two return home and stand at the
    doorway. The people see two damsels, ask which has come to point out a husband,
    and do not know where one comes from. The village damsel identifies Ukandakulu.
    The people tell the chief, who sees her, orders many cattle slaughtered, summons
    the nation, and has the people dance for the queen.
  language: Zulu with English translation
