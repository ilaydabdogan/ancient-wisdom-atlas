canonical_text:
  quote: As soon as he was born, he stood up.
  summary: Uthlakanyana is born after all others are sent out of the hut. Immediately
    after birth he stands, refuses his mother’s help in cutting what hangs from him,
    says he is already old and a man of the council, cuts himself with his father’s
    spear, is washed by his mother, then goes out with the spear. In the cattle-kraal
    the men run away; he sits by the fire and eats meat belonging to the men. An editorial
    note compares the speaking and walking newborn to a 1623 European report about
    a child thought to be Antichrist.
  language: Zulu with English translation and English editorial notes
  quote_policy: quoted
