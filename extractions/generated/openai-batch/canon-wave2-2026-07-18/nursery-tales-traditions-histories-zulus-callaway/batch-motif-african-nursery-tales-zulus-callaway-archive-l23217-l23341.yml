canonical_text:
  quote: ''
  summary: A boy addresses Ubongopa-kamagadhlela with a repeated formula that urges
    movement and entry into the pen while warning of thieves from another tribe. Ubongopa
    and the cattle move as the boy speaks. When ordered to come down, the boy says
    he does not walk on the ground and has never felt the ground since birth; after
    speaking the formula he gets down. He then resists entering a house, and people
    take him to the house of a dead man.
