canonical_text:
  quote: ''
  summary: The passage describes rules for a polygamic household when a chief wife
    is displaced. A new wife may fill her office, receive the heir as her son, and
    become chief wife. The heir remains first in rank, the new wife's children follow
    him, and property follows the heir from the old house to the chief house. The
    passage also states that a chief wife can be ejected for failing in the obligation
    to receive and feed strangers at the head house.
  language: Zulu with English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is told that because she has destroyed her great name, another woman
    will be taken as wife to fill her place and become mother of the heir.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heir is described as a son separated from his mother because of her offence
    and placed with the new wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the new wife fills the office well, she is regarded as the chief wife and
    as mother of the youth taken from his mother.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children born to the new wife are not chiefs; they come after the young
    chief in order, with her first child next after him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Property belonging to the heir's house is taken from his mother's house to
    the chief house and follows the boy wherever he goes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Only small things necessary for the displaced mother's existence are left
    in the old house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The matter is settled with the understanding that the former chief wife has
    been ejected permanently and the new wife is established as chief.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the new wife is good and treats the boy with great care, he forgets his
    real mother and becomes accustomed to the new mother and her house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A chief wife may be ejected if she does not know how to deal with strangers,
    because receiving and feeding strangers is an obligation of the chief wife of
    the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The head house is described as the house to which strangers from all parts
    go and where they are to be treated well.
  category: setting
  evidence_refs:
  - ev:6
