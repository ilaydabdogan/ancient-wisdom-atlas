canonical_text:
  quote: ''
  summary: The passage describes blood-relations recognizing or feeling for one another
    through the navel, even before conscious recognition of kinship. It gives an example
    in which two men discover they share a grandfather and both cry. It then states
    that the precise working of the navel is not explained by the old men, though
    the phenomenon is treated as constantly confirmed. The passage also describes
    a desolated country in which parents and young children become separated, children
    are scattered and raised in different places, and relatives believe one another
    dead because they do not know each other's whereabouts.
  language: Zulu and English
  quote_policy: summarized
