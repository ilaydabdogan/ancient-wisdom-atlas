canonical_text:
  quote: ''
  summary: Umamba asks his father for cattle so he can go to a damsel’s father for
    marriage arrangements. He travels with cattle and young men. On the way he has
    Unthlamvu-yetusi carry a pot of fat, then lag behind with him, anoint him, and
    remove his skin because the grass hurts him when he moves on his belly. After
    the skin is removed he rises and walks, but puts the skin on again when near the
    others. At the damsel’s home, people flee because they see a snake; the damsels
    correct them, saying he is the bridegroom of Unthlamvu-yetusi. Cattle are killed
    and eaten, and the bridegroom’s party returns home.
  language: English
  quote_policy: summarized
