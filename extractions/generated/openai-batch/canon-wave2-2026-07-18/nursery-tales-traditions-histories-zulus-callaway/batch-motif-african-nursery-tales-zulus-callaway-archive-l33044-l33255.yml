canonical_text:
  quote: ''
  summary: A chief with many wives marries two sisters and makes one the chieftainess,
    while the other is jealous. The chieftainess’s first three infants die after the
    jealous sister handles them, and the household suspects her. The chieftainess
    later gives birth secretly to an imamba, a snake-child named Umamba, who survives
    and grows. The other sister gives birth to a boy named Unsimba and rejoices that
    her child is human. People infer that the earlier infants were killed by Unsimba’s
    mother because she wanted Unsimba to become king.
  language: English translation with Zulu original
  quote_policy: summarized
