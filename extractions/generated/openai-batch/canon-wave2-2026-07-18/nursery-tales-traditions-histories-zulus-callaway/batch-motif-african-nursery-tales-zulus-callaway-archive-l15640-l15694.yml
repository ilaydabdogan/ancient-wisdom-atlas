  quote: ''
  summary: After another new moon, the seekers find their sister. She recognizes them
    and asks where they have come from. They say they were separated from their parents,
    troubled by cannibals, stayed in a beautiful country above, killed a cannibal
    by refusing him food, and descended to seek her. All three then live peacefully
    together.
