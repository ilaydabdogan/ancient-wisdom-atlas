canonical_text:
  quote: ''
  summary: A bilingual Zulu-English passage explains how honey is taken from a bee
    hole while avoiding destruction of the bees' entrance. It warns that a snake,
    including an imamba, may be hidden inside; a gatherer may be bitten while reaching
    for the last comb. The passage describes using a stick to test for a snake and
    contrasts a timid person who leaves the hole with a brave person who breaks it
    open to see while taking the honey.
  language: Zulu and English
  quote_policy: summarized
