  text: A husband sees his wife returning with honey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise person taking honey does not damage the bee entrance, but digs at the
    side to remove comb and later closes the made opening with a stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A snake may be inside the honey hole, and people may be bitten while taking
    honey from it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Holes in the honeycomb may be noticed; the gatherer may think roots caused
    them, though roots are said to break combs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When reaching for the last comb where the snake is coiled, the gatherer cannot
    see inside and searches with the hand only.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hidden snake may wound the gatherer's hand; the hand is drawn out quickly
    and seen bleeding.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the snake is an imamba, the bitten person is said to die immediately; if
    it is another snake, remedies may be applied.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before digging, people put a stick into the mouth of the hole to see whether
    a snake is with the bees.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a snake is present, the bees walk on the stick and the person says that
    there is a snake.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A timid person leaves the hole, while a brave person breaks the whole hole
    open so that he can see while taking the honey.
  category: sequence
  evidence_refs:
  - ev:9
