canonical_text:
  quote: ''
  summary: Officers come to a father or king and ask what reward he will give for
    good news. After refusing offered cattle of various colours, they ask for and
    receive a selected herd of black oxen. They report seeing a child like one of
    his children. The father recognizes the child as his son and asks which wife bore
    him; those who know identify the wife who had concealed the child. Angry, the
    king assembles the nation and orders his son taken far away and placed in a great
    forest known to contain a many-headed man-eating monster. The mother and sister
    are present and begin to accompany the group toward the forest.
  language: Zulu with English translation
  quote_policy: summarized
