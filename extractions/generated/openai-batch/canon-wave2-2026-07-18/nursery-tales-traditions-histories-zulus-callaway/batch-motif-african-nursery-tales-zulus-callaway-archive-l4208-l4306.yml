canonical_text:
  quote: ''
  summary: Uthlakanyana asks the iguana for his flute, disputes the iguana's explanation,
    beats the iguana, takes the flute, and kills him. Uthlakanyana then returns to
    the cannibal's place, finds the cannibal gone and the house burnt, lives troubled
    in the open, wanders, and decides to return to his mother. At home, his mother
    rejoices after their long separation and says she had feared he would die or lack
    food; Uthlakanyana replies that he has returned.
  language: Zulu with English translation
  quote_policy: summarized
