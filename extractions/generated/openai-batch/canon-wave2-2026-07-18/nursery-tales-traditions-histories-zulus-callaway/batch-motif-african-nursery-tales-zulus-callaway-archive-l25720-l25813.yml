  summary: Umdhlubu is described as a conspicuously beautiful damsel whose mother
    rejoices in her. Her household is exalted, while other queens develop enduring
    hatred because Umdhlubu is admired above their own children. A king from another
    people, named in headings as Unkosi-yasenthla, hears of her, sets out with a thousand
    head of cattle, and seeks her as a bride.
