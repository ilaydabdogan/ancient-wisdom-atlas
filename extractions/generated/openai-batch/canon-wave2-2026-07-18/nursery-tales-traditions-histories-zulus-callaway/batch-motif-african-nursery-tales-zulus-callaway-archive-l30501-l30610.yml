canonical_text:
  quote: ''
  summary: Usilwanekazana, troubled by reports about witchcraft in her family and
    speaking of killing a leopard, later remains alone while others are away. She
    cooks milk with pounded corn and gives it hot to Usilwane's dog, which dies. Usilwane
    returns, accuses her of intentionally killing his dog despite prior warning, rejects
    her explanation that people said he would practice witchcraft by the dog, and
    stabs her below the armpit with an assagai.
  language: Zulu with English translation
  quote_policy: summarized
