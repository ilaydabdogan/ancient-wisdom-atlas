canonical_text:
  quote: ''
  summary: 'The passage closes an Isitwalangcengce tale in which a being expecting
    brains is left with branches in a heap on a rock, while a man returns home. The
    narrator says the Isitwalangcengce is an old fabulous tale now used to quiet crying
    children by warning that it will carry them off. The passage then begins the story
    of Udhlokweni: after dark, a hyena carries off Udhlokweni, chief wife of a great
    village, takes her toward a forest and narrow pass, retrieves her when she grabs
    a tree, and asks about the greatness implied by her funeral lamentation. She says
    she was a great queen who treated her people kindly.'
  language: Zulu with English translation
  quote_policy: summarized
