canonical_text:
  quote: ''
  summary: A king fathers many sons but fears that grown sons will depose him, so
    old women are appointed to kill his male children. Another son, identified by
    the heading as Usikulumi, is born; his mother brings him to the old women while
    hiding him in her bosom, gives them presents, and pleads with them. An editorial
    footnote compares the wider legend with Greek stories of threatened children such
    as Paris, Oedipus, and Perseus.
  language: Zulu with English translation and English editorial notes
  quote_policy: summarized
