canonical_text:
  quote: ''
  summary: 'An unnamed male figure is trapped, reduced to bones, runs to a mud-hole,
    and becomes a tree after bees enter his bones. The passage then shifts to Usitungusobenthle:
    the king, identified in the heading as her father, calls for her at home. The
    girls refuse; he goes to the puberty-ceremony hut and finds another girl decorated
    with tree branches and presented as Usitungusobenthle. He calls all the girls
    out and beheads them with a sword on a block.'
