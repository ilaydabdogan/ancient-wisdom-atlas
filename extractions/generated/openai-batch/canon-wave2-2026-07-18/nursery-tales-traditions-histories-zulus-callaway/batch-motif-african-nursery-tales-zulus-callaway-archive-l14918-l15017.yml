canonical_text:
  quote: ''
  summary: During a pursuit, a girl uses sesamum to slow the cannibals following her.
    She watches for their approach by the dust they raise, repeatedly pours sesamum
    on the ground, and moves on quickly while they stop to pick it up. When tired,
    she climbs a very high tree and sits on the topmost branch. The cannibals arrive
    tired, sit at the foot of the tree, and rest before intending to continue the
    pursuit. An editorial note compares the delay-by-thrown-object episode with other
    tales while emphasizing that this version uses appetite rather than magical transformation.
  language: English translation with Zulu source text
  quote_policy: summarized
