canonical_text:
  quote: ''
  summary: A fleeing son-in-law is pursued but the pursuers halt at fire and later
    turn back near villages. The pursuing group reaches home, boils and eats their
    grandmother, saying this will keep them from dying. The son-in-law reaches home,
    gives a liver to a female recipient, and is praised. Editorial notes explain journey-counting
    by sleeps and relate the eating of the old woman to a life-prolonging medical
    superstition involving remains of very old animals.
  language: Zulu and English
  quote_policy: summarized
