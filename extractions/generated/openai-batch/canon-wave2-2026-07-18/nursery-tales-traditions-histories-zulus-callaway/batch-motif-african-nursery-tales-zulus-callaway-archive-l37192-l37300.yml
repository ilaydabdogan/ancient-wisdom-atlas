canonical_text:
  quote: ''
  summary: A hungry man searches for bread he had previously thrown away, using a
    remembered landmark and arm gesture to reconstruct where it fell. He fails to
    find it, misses the time for digging roots, and returns faint. Later, after the
    famine ends, he tells the story; listeners laugh and say famine impairs judgment,
    and he agrees that famine does not make a person clever.
  language: English translation with Zulu original
  quote_policy: summarized
