canonical_text:
  quote: ''
  summary: Uluthlazase’s father kills the girls, including Ubuthlaluse, after saying
    they killed or abandoned Uluthlazase with the Isikqukqumadevu. He then brings
    Uluthlazase forth. He summons the nation to seek the Isikqukqumadevu; the princess
    shows the pool, men enter the water, the being comes out enraged, and they kill
    it. Damsels from the whole country come out because the being had devoured them
    alive at the bathing pool. Their fathers bring cattle to reclaim them and give
    the cattle to Usikulumi; a note explains this as a Zulu custom of reclaiming a
    lost child by offering a bullock.
  language: Zulu with English translation
  quote_policy: summarized
