canonical_text:
  quote: ''
  summary: Uthlakanyana dresses in the cannibal mother’s garments, lies in her place,
    and imitates her voice while the cannibals eat flesh they are told is game. A
    cannibal boy repeatedly observes that the hands and foot resemble his mother’s,
    but an elder rebukes and beats him. Uthlakanyana then leaves, removes the garments,
    reveals that they are eating their mother, and flees. At a swollen river he changes
    himself into a weeding-stick, which the pursuing cannibals take and throw, thinking
    he has crossed.
  language: English translation with Zulu original
  quote_policy: summarized
