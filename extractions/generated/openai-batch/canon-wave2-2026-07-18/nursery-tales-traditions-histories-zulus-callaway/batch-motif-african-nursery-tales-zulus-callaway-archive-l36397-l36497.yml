canonical_text:
  quote: ''
  summary: 'The passage describes the Abatwa as living in rocky country without fixed
    villages, consuming game where they kill it and then moving on. It recounts a
    dangerous encounter etiquette: an Umutwa asks a traveler where he was seen; a
    truthful answer that he was seen nearby causes anger and fatal shooting, while
    saying he was seen from a distant mountain pleases him because it magnifies him.
    It also says that Abatwa traveling after game is exhausted ride together along
    a horse from neck to tail, and eat the horse if no game is found.'
  language: English translation with Zulu source text
  quote_policy: summarized
