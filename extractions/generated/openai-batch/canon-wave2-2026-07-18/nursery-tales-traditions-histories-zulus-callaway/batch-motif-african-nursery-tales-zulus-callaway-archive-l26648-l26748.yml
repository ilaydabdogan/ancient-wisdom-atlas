canonical_text:
  quote: ''
  summary: 'The passage explains rules of inheritance and household property in a
    polygamic household: cattle used for dowry and house property, a wife or house
    designated as an isolated hill, the limited chiefly status of the iponsakubusa,
    the claims of a chief wife, and ranked seating in the hut or kraal.'
  language: English translation with Zulu terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The offspring of a cow are not all taken for a wife's dowry; those remaining
    are the property of her house, and she is called a hill.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's son is called iponsakubusa; he is not chief in his father's house,
    but when the village of his mother's house has become great, he is the sole head
    there and is not interfered with.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A father may give his chief wife a cow or cattle as the property of her house
    and may say that the cattle belong to her house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a husband marries a wife and does not place her under the chief wife, the
    chief wife can make a claim and ask why her village is being devoured.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The note defines an intaba as a solitary hill standing out alone, not a connected
    ridge.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The note says the woman called intaba is the commencement of a new house and
    owes nothing to the husband's forefathers or to the house of the chief wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The note defines iponsakubusa as ''The-almost-a-chief'': he is not chief
    of his father''s house; the eldest son of the chief wife is chief and heir there,
    while the iponsakubusa is chief and heir in the secondary great house.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief place in a kraal or hut is on the right-hand side of the doorway;
    when the eldest son of the great house and the iponsakubusa are both present,
    the eldest son sits on the right and the iponsakubusa on the left.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: If neither the father nor the eldest son is present, the iponsakubusa sits
    in the chief place above the other children of both houses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The secondary great house is constituted when the husband takes a secondary
    chief wife by his own private property; inheritance claims between it and the
    great house are limited by surviving heirs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The husband's private or personal property can be used as he pleases and,
    if unappropriated at his death, becomes the heritage of the eldest son.
  category: relationship
  evidence_refs:
  - ev:8
