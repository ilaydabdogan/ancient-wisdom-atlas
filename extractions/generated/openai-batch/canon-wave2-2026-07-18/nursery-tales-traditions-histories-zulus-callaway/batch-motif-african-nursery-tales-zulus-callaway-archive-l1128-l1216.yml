canonical_text:
  quote: "“Ukcaijana is like the weasel ... his smallness is like its, and his cunning
    as great as its.”"
  summary: The passage explains beliefs and names associated with Ukcaijana/Uhlakanyana.
    A path-crossing encounter is treated as an omen of not obtaining food and as an
    encounter with a wizard. Ukcaijana is likened to a weasel in smallness and cunning.
    His praise-giving names identify him with the weasel family and describe bravery,
    including stabbing a man first while the man underestimates him because of his
    small size. Footnotes compare the path-crossing omen to a hare-crossing bad sign
    elsewhere and explain praise names through a river/fords metaphor.
  language: English translation with Zulu original and Zulu names
  quote_policy: quoted
