canonical_text:
  quote: ''
  summary: 'The passage describes the honey-bird calling people to places where a
    leopard, animal remains, or a great coiled snake may be found. It then recounts
    an incident at Imbava: after the narrator''s father killed a buffalo, a group
    set out to fetch the flesh, but a honey-bird urgently called some of them away.
    They followed it to the open site of an old village, searched while expecting
    bees or honey, left after finding nothing, and were brought back by the bird.
    The narrator then noticed a large bent object under a tree.'
  language: Zulu with English translation
  quote_policy: summarized
