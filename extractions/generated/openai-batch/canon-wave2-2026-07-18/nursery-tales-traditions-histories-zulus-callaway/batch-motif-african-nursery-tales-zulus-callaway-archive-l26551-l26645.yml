canonical_text:
  quote: ''
  summary: A passage explains how, in a polygamic household, a husband may acquire
    a cow independently through separately cultivated produce or tobacco. He tells
    the chief wife that the cow is not from her house or the hereditary estate and
    therefore cannot be claimed by them. If the cow increases and is used to take
    another wife, that wife is understood not to belong to the chief wife's house
    or the hereditary estate. A footnote distinguishes household property units with
    special claims and the eldest son's inheritance rights.
  language: Zulu with English translation
