  quote: ''
  summary: The passage explains inheritance and authority in a polygamic household.
    It distinguishes the iponsakubusa, sons of the chief-house side, the real chief,
    father’s cattle, a son’s own cattle, wives married through different cattle estates,
    and the relative authority claimed by their children.
  language: English translation with parallel Zulu text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If an iponsakubusa is living and the chief house has come to an end, the iponsakubusa
    cannot inherit the chief-house property while any boy remains from the side belonging
    to the chief house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If no boy survives from that side, the iponsakubusa inherits the whole and
    becomes chief because the real chief is dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents these rules as the condition of polygamy and the position
    of a husband in his house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man’s father’s cattle and his own cattle are distinct, although the son
    may call the father’s cattle his after the father dies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fathers customarily give cattle to sons during life; the gift is described
    as not many cattle, but one, and that one can increase.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'When his own cattle have increased, a son may marry two wives at the same
    time: one through his father’s cattle and one through his own cattle.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage identifies the two wives as producing two sides within the household.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Children born from the two wives do not have power throughout the whole village.
  category: relationship
  evidence_refs:
  - ev:7
