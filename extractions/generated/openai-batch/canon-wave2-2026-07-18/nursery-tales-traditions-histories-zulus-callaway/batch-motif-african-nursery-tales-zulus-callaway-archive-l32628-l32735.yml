canonical_text:
  quote: "“Go home ! Do not stay here.”"
  summary: Umkatshana follows a hunted rheebuck and his dogs into a hole, reaches
    people who live beneath the earth, sees cattle and milking there, meets his own
    friends, and is sent home. After people at home have begun to think he is dead,
    he returns and reports that those below are people like those above and that named
    persons were there. The passage also names the place of descent.
  language: Zulu with English translation
  quote_policy: quoted
