canonical_text:
  quote: ''
  summary: The passage, headed “The Honey-Bird,” lists comparative examples of a little
    bird that warns endangered women, reveals deception, and restores a forgotten
    bride to a prince’s memory. It then introduces an account of the honey-bird’s
    habits, described as nearly intelligent, reportedly given by a native informant
    and corroborated by white witnesses who had been led by the bird to honey deposits.
    The compiler suggests that superstitions about birds may arise from observed animal
    intelligence and from beliefs in possible communication between humans and animals.
  language: English
