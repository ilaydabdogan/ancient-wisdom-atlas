  summary: A mother and father discuss the absence of Unthlatu and the presence of
    other possible husbands, identified as crows. Untombinde arrives intending to
    marry Unthlatu, is told to separate from the other damsels and stay alone in the
    youth's house, and later becomes the means by which Unthlatu, who comes by night
    and asks not to be made known, is seen.
