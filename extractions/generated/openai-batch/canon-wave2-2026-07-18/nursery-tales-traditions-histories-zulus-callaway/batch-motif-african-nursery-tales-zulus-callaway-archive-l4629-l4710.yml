canonical_text:
  quote: ''
  summary: The passage gives a cumulative chain of prior damaged or consumed items
    ending in Uthlakanyana receiving a shield. Uthlakanyana then meets men fighting
    a leopard without shields, lends them his shield, and the men kill the leopard.
    When the shield's hand-loop breaks, he demands his shield and recites the chain
    of earlier replacements; the men give him a war-assagai, and he goes on. The narrator
    says the next use of the war-assagai may be told another time.
  language: Zulu with English translation
  quote_policy: summarized
