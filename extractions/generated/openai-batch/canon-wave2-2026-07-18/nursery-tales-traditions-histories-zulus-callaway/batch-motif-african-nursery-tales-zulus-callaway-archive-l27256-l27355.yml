canonical_text:
  quote: ''
  summary: The passage describes rules of inheritance in a polygamic household. If
    proper heirs of the chief house are absent or dead, inheritance passes through
    related houses in order, and finally to the iponsakubusa when the chief house
    has ended. It also describes removal of the first wife from the chief position
    for adultery, her demotion to the gate or side of the kraal if she has borne a
    boy, and the selection of a virgin replacement wife.
  language: Zulu with English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When no proper heir can enter on the heritage, it is taken by kin and by a
    house that participated with the great house when cattle were slaughtered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heritage falls to the houses in the order of their inheritances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If all those to whom the inheritance belongs are dead, the iponsakubusa takes
    possession because the whole house has ended and because he shares a father-line
    connection with the chief house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first wife may be ejected from the chief place; the reason explicitly
    stated in this excerpt is adultery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the first wife committed adultery before bearing a child, her house is
    said not to be proper to stand at the head of the village.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the first wife has borne a boy, she is moved from the house at the head
    of the village to the gate or side of the kraal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Another wife is then sought; she is to be a virgin and not one of the women
    who had been under the ejected wife.
  category: action
  evidence_refs:
  - ev:7
