canonical_text:
  quote: ''
  summary: A wedding party is summoned and brought with beer prepared. At the wedding
    dance, some people laugh at Umamba because he is a snake and doubt that he can
    dance. After the dancing, Umamba is privately anointed with fat, has a skin removed,
    calls for his mother to bring his things, and adorns himself. He then puts on
    a great skin, goes out on his belly to the cattle-pen, and later has the skin
    removed by his lad in front of the people, who cannot look at him because of his
    glistening appearance. A footnote explains the role of the man sent to wait for
    and hasten the marriage party.
  language: Zulu with English translation
  quote_policy: summarized
