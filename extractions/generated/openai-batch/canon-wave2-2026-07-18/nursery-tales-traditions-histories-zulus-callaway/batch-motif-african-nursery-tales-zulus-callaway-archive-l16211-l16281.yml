canonical_text:
  quote: ''
  summary: The passage frames a section on legends as hearsay, then presents an appendix
    on cannibalism. It reports opinions that cannibalism arose recently in famine,
    catalogs alleged forms of cannibal practice, compares some accounts with Herodotus'
    report of the Padseans, notes a suggested link with sacrifice, states that the
    Zulu-Kafir regards cannibalism as unnatural, and describes cannibals in Zulu legends
    as magnified into giants and magicians.
  language: English with a Zulu heading and opening statement
  quote_policy: summarized
