  quote: ''
  summary: An unnamed woman has placed material in a pot or vessel and, after three
    moons without looking, finds children grown and laughing on the fourth moon. She
    rejoices, goes to the garden, worries about whether her children can live while
    other women mock her, and at night shuts the doorway with a wicker door and mat
    so no passerby can see inside. A heading says she conceals and feeds the children
    by night. Editorial notes compare the unusual generation to other examples of
    extraordinary birth or production.
