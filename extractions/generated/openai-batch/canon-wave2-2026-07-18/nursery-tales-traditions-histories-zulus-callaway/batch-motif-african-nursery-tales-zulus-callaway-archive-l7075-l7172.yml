canonical_text:
  quote: ''
  summary: In this excerpt, Unthlatu speaks of jealousy over his being called king.
    He sends the girl Untombinde to call the afflicted mother. The mother enters,
    weeps quietly, identifies the lost child as her own, and says she will tell the
    father that the whole country should brew beer. The father asks what the beer
    is for, and the mother says she will see the people because she used to be queen.
    Editorial notes explain an attempted killing by obstructing breath, the persecuted
    younger-brother pattern, and beer brewing as equivalent to assembling the nation.
  language: Zulu and English
  quote_policy: summarized
