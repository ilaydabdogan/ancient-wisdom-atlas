canonical_text:
  quote: ''
  summary: 'Men identify the newly born Uthlakanyana as more like a man than a child,
    ask his mother whether he is the child who spoke within her, and praise his wisdom
    at birth. They propose that he should be the great child among the king’s children.
    Uthlakanyana then proposes a contest: his father should throw a leg of beef below
    the kraal, and the person who retrieves it first will be recognized as the man.
    The passage closes as the father throws the leg and the others crowd at the kraal
    opening, while Uthlakanyana begins to act differently. Editorial notes compare
    him with Basuto Litaolane and an Arabic legend of Abraham.'
  language: Zulu with English translation
  quote_policy: summarized
