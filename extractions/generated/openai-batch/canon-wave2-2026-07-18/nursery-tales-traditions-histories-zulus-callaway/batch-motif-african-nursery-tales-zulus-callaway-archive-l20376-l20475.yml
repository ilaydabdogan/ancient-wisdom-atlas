canonical_text:
  quote: "“Are you a man or a beast?”"
  summary: Reporters tell their chief that something has appeared in the chief's cave.
    Other Amadhlungundhlebe are summoned and go to the cave. Umkxakaza sees many approaching
    and expects to be killed. The group sits by a tree, plucks tobacco according to
    the chief's cave-sweeping order, and sends the two witnesses to look into the
    cave doorway. They report one glistening figure that they cannot see clearly.
    The chief has everyone ask whether the figure is a man or a beast; Umkxakaza begins
    to reply, but the supplied passage stops there.
  language: Zulu with English translation
  quote_policy: quoted
