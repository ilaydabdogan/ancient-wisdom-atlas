  quote: ''
  summary: A newly arrived ingogo goes hunting with others, later says he has stomach
    pain and asks for a leg of meat to be set aside. The next morning, when the others
    go hunting, he remains with the little ones, sends them to fetch water in a leaking
    vessel, and while they are delayed he kills the absent izingogo’s grandmother
    with a spear, opens her body, and takes out her liver.
