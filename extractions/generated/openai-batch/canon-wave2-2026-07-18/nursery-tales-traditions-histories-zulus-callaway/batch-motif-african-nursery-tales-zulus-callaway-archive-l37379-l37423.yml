canonical_text:
  quote: ''
  summary: A tale headed as another tale of a crow describes two women in the fields
    who hear a crow perched on a tree speak about a childless woman. The women run
    home and report it; the people call it an omen. The childless woman is identified
    as the daughter of Usipongo of Idhlanimi among the Amakuza, and afterward her
    husband is very ill.
  language: Zulu with English translation
