canonical_text:
  quote: ''
  summary: Henry Callaway’s preface explains his early study of Zulu, the scarcity
    of reference works, and his method of writing down material dictated by Zulu speakers,
    then checking it through rereading, correction, explanation, and comparison with
    other speakers. He states that many contributors took part and that he did not
    standardize their language.
  language: English
  quote_policy: summarized
