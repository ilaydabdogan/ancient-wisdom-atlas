canonical_text:
  quote: ''
  summary: In this excerpt, Ugungqu-kubantwana questions an old woman sitting in her
    shade. The old woman goes to a river and drinks a large pool until its bottom
    mud appears. Ugungqu-kubantwana orders that she be eaten; hyenas agree, while
    oribes who serve as officers delay the eating until later. At night, after the
    animals sleep, four oribes lift the old woman, three carrying her while the fourth
    carries a water-vessel.
