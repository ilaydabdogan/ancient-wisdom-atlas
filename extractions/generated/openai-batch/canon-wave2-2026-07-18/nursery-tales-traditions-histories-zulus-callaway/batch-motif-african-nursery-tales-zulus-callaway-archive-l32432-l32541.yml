canonical_text:
  quote: ''
  summary: Untombi-yapansi is brought to her sister and identifies a thing as an imbulu,
    recounting its actions. The chief orders a deep pit to be dug in the cattle-pen
    and water to be boiled. Milk in a pot is lowered into the pit. All the women,
    including the bride identified in a note as the imbulu, are ordered to jump across
    the hole. The imbulu refuses in fear, is compelled to leap, and its tail sees
    the milk and throws itself into the pit; the chief then orders boiling water to
    be fetched.
  language: English translation with Zulu parallel text
  quote_policy: summarized
