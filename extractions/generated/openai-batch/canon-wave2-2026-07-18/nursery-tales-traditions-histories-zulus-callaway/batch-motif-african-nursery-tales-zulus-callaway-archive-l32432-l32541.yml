- id: obs:2
  text: The chief calls Untombi-yapansi's sister, brings Untombi-yapansi out to her,
    and the sister cries while recalling that she had wondered why Untombi-yapansi's
    body did not glisten.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Untombi-yapansi tells them that the thing was an imbulu and gives a full account
    of what the imbulu had done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief tells Udalana to tell the boys to wake early and dig a deep pit
    in the cattle-pen, and to tell the women to boil water early in the morning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning the boys dig a deep pit, and milk in a pot is lowered by a
    cord into the hole.
  category: action
