canonical_text:
  quote: ''
  summary: The passage discusses traditions and anecdotes in which Franks, Crusader-associated
    Thafurs, and Richard Cœur de Lion are represented or rumored as cannibals. It
    begins with a Turkish child being reassured that some Franks do not eat children,
    then links this belief conjecturally to Crusade-era fears. It describes Thafurs
    as reputed eaters of enemy dead and recounts a romance episode in which Richard
    serves boiled Saracen heads to Saladin's ambassadors and claims Saracen flesh
    will feed the Christian army.
