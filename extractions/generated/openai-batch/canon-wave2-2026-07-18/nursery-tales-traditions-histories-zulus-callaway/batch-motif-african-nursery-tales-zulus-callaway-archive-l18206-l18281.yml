canonical_text:
  quote: ''
  summary: The passage explains the origin of baboons from an Amafene tribe. The people
    are described as idle and unwilling to cultivate, preferring to eat food grown
    by others. Their chief, of the house of Tusi, tells them to prepare food for a
    journey because they will leave their homes for the wilderness. They collect food,
    make bread, and fasten digging-pick handles behind themselves; the handles grow
    into tails, hair appears, their foreheads change, and they become baboons. They
    go to precipices and rocks, and a later saying identifies a killed baboon as one
    of Tusi’s men.
  language: Zulu with English translation
  quote_policy: summarized
