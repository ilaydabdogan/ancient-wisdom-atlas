canonical_text:
  quote: ''
  summary: A crying child tells a great frog that she is troubled because she is said
    to be destined to become the wife of her brother. The frog tells her to fetch
    the beautiful things she loves. She gathers clothing, brass items, and beads,
    brings them to the river, and agrees when the frog asks if she wants to be taken
    to her own people. The frog swallows her possessions and then the child, and travels
    with her. On the way, a line of young men sees the large frog and proposes killing
    him with stones. A footnote compares the episode with European tales involving
    a weeping girl by water helped by a frog or large fish.
  language: Zulu and English
  quote_policy: summarized
