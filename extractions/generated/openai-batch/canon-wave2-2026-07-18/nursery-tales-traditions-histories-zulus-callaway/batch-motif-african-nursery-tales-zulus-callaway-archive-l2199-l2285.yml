  summary: Uthlakanyana takes his walking-stick, complains about his birds being eaten,
    goes to a cannibal's traps, removes birds, and is caught by birdlime set on sticks.
    He pleads with the cannibal not to kill or beat him, asks to be cleansed and taken
    home, invokes the cannibal's mother, and warns that beating him will make him
    bitter and unpleasant to eat. The provided line range also includes an English
    editorial comparative note about expelling a fiendish or non-human child in Danish
    and Lutheran examples.
