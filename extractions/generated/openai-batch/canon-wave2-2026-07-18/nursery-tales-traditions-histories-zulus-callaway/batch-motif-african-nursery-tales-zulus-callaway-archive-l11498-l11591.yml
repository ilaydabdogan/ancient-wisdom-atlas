canonical_text:
  quote: ''
  summary: A woman identified in headings as the queen places two children on a mat,
    gives them milk, and later returns them to their place. As they grow rapidly,
    their mother conceals them indoors because she fears the crows will see and kill
    them. The crows harass her by spilling water and scattering ashes in the house
    while she is away. She laments that she is treated badly because she has no publicly
    recognized child. The passage ends as the boy and girl have grown into a young
    man and maiden.
  language: Zulu with English translation
  quote_policy: summarized
