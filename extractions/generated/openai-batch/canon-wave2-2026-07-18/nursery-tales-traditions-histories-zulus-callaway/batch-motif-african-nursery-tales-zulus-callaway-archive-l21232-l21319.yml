canonical_text:
  quote: ''
  summary: A girl arrives at her father’s town and speaks with her mother, who is
    making beer and appears disordered with grief. The girl asks what has happened
    at the kraal and about a man at the gateway. The mother says that death has entered
    the household because the princess royal went away with a beast; the man at the
    gateway is the princess’s father. The mother explains that, when the princess
    came of age, cattle were to be used to bring her home, but her father lacked enough
    cattle, so the cattle of the beast were taken. The girl asks why they are crying.
  language: Zulu original with English translation
  quote_policy: summarized
