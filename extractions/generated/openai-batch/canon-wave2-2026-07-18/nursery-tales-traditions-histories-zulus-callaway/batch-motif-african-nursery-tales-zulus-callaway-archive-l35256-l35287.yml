  summary: A group is lost after an event ending at a pool; only one person escapes
    and returns home crying. Men ask him to show where a rock had been. At the place,
    he identifies the former location of the rock. The men ask whether it was actually
    a tortoise and whether the children have been devoured. The children are not seen
    again; mourning follows, and the account is told to all the people.
