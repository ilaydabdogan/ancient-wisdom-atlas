canonical_text:
  quote: ''
  summary: After a lump is stabbed, the being called Isikgukyumadevu dies, and the
    cattle, dogs, people, and Untombinde that it had devoured come out from its dead
    body. Untombinde returns to her father, Usikulumi, and is taken by Unthlatu, son
    of Usibilingwana, to be his wife. She goes to the bridegroom's kraal, but the
    people there say that Usibilingwana's son was lost as a boy. Untombinde remains
    in a house built for her. Food and beer are placed there, and at night Unthlatu
    comes, eats and drinks, stays a long time, and leaves. In the morning Untombinde
    finds the food and drink gone.
  language: English translation with Zulu source text
  quote_policy: summarized
