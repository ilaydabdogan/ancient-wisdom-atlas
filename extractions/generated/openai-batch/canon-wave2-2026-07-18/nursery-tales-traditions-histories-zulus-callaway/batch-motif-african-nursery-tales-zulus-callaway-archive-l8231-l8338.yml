canonical_text:
  quote: ''
  summary: A cannibal retrieves his bag, which has been filled with biting animals.
    After returning home, he prepares for cooking and sends children and then his
    chief wife to fetch the bag; each is bitten. He has himself shut inside the house,
    opens and shakes the bag, and the animals rush upon him.
  language: Zulu with English translation
  quote_policy: summarized
