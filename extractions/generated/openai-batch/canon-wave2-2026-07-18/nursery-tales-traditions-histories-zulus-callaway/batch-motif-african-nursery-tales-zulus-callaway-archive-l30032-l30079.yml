canonical_text:
  quote: ''
  summary: A mounted armed group leaves the black men and comes at night to a pool
    to wait for a creature. Two snakes emerge from the pool, and fire blazes when
    the lower one appears. The men shoot at the snake without striking a mortal spot,
    and it pursues them as they flee on horses. The horses divide; one Dutchman eventually
    hits the snake, after which the men discuss the vanished flame and how to find
    the others by firing guns from a hill.
