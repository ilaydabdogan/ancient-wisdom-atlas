canonical_text:
  quote: ''
  summary: A girl is confined inside a rock dwelling that opens and closes at the
    owner's spoken command. The cannibal owner warns her not to roast meat at noon,
    but when she cooks, the odor attracts other cannibals. She first refuses them
    entry, but one cannibal alters his voice to resemble the owner's and is admitted.
    After he leaves to hunt, the girl escapes; when the rock remains silent on his
    return, he summons other cannibals to pursue her, and they stop to gather scattered
    sesamum.
  language: Zulu with English translation
  quote_policy: summarized
