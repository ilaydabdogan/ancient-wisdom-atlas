canonical_text:
  quote: ''
  summary: The passage describes young men coming to the umgonqo, the place or house
    where puberty ceremonies for a damsel are performed. The house is described as
    a gathering place for young people where ordinary modest restraints on speech
    and conduct are suspended. Young men from many places are kept from entering until
    they give a present. If a girl-king is present, she decides what present will
    open the door and refuses one judged too small. A woman who sleeps in the umgonqo,
    together with other damsels, also obstructs the young men until induced by a present
    to go out.
  language: English translation with Zulu parallel text
  quote_policy: summarized
