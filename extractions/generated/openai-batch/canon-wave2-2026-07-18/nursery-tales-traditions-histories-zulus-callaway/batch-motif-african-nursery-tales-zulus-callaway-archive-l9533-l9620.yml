canonical_text:
  quote: ''
  summary: Ulangalasenzantsi sets out to fetch his children from Ulangalasenthla after
    gathering ten oxen. Wearing a ragged garment, he reaches a sequence of swollen
    rivers; at each river he throws in one ox, the river opens or divides, and he
    crosses, until ten rivers have been crossed and the oxen are gone. Editorial notes
    connect the two names with upper/lower sun geography and gloss the oxen as probable
    sacrifices to river spirits or gods.
  language: English translation with Zulu source text
