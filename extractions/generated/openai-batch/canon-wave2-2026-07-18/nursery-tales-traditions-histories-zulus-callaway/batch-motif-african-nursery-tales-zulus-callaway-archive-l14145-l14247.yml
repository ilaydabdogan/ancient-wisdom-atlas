canonical_text:
  quote: ''
  summary: The passage describes how a honey-bird guides people to bees by crying,
    settling, moving toward the ground, and indicating direction. A man follows the
    bird, finds bees at the foot of a tree, digs them out, takes honey, and leaves
    young bees and comb for the bird. The bird is said to eat young flying bees rather
    than comb, and placing honey for it is said to make it lose its voice. In a honey-rich
    country the bird may call again, but a man who already has enough honey may decline
    to follow. The passage also says that in thorn-country women follow the bird to
    find bees.
  language: Zulu with English translation
  quote_policy: summarized
