canonical_text:
  quote: ''
  summary: A new town is built and completed for the queen. The king visits; many
    cattle are killed so the soldiers can eat and finish the town. The king goes to
    live at the new town and takes Umdhlubu as his wife. The people of Umdhlubu’s
    father return home and tell their king that their work is done well; they report
    cattle for Umdhlubu’s mother, given by her son, and convey respects to both parents.
    The passage closes by saying all lived together in peace.
