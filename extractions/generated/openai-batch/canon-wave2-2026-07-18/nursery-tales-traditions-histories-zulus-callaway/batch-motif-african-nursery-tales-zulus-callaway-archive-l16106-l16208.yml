  summary: The passage describes encounters between men and Amazimu. Men may recognize
    approaching Amazimu, prepare weapons, form a line, and either fight or flee. Amazimu
    are described as powerful, terrible, and very swift. They hunt people, pursue
    those who run until they tire, capture them, carry them to a concealed wilderness
    place, then boil and eat them.
