canonical_text:
  quote: ''
  summary: 'An editorial comparative note summarizes several European tale parallels:
    Roland leaves and forgets his bride under enchantment until recognizing her voice
    at a later wedding; the bride secretly works in a shepherd''s cottage after transforming
    into a flower; a golden child is lost to his bride through enchantments and released
    by his brother; and a king''s son forgets a giant''s daughter after a dog''s kiss
    until reminded by pigeons. The note explicitly compares the secret work episode
    with Ukcombekcansini and her damsels and cites further similar tales in Thorpe.'
  language: English
  quote_policy: summarized
