canonical_text:
  quote: ''
  summary: In this bilingual Zulu-English passage, an unnamed male figure resists
    threats from cattle thieves, says he cannot be stabbed, and uses a repeated utterance
    associated with Ubongopa-kamagadhlela. A thief reports to the chief that stolen
    cattle are under magical power because a man or boy lies on a white ox and can
    make the cattle halt. The chief threatens to kill the ox by which the boy practises
    magic and to force the boy to rest on the ground; the cattle halt at the village
    entrance and the men say the boy will not let them proceed.
