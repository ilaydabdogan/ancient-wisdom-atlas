canonical_text:
  quote: ''
  summary: A male figure reaches a town entrance, changes into a beautiful glistening
    frog, and draws the attention of Umkccakaza and the town people. After the frog
    leaves the gateway, Umkccakaza has her things prepared and follows it with an
    escort. When she is later alone with the frog, it becomes a man or old man and
    says he is taking her to the home of his chief. They travel to another nation
    and toward a large forest path near his home.
  language: English translation; Zulu original also present
  quote_policy: summarized
