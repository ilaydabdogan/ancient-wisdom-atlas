canonical_text:
  quote: "“I am crying because I have no child.”"
  summary: 'A woman digging in a garden sits weeping because she has no child, while
    other wives of the king give birth to crows. Two pigeons come to her and speak
    with each other. One repeatedly says “Vukutu,” while the other asks why it does
    not inquire into her grief or into what she will give them if they give her power
    to have a child. The woman offers all she has, then food: amabele, which the pigeons
    reject as unsuitable for them, and amadumbi.'
  language: Zulu with English translation
  quote_policy: quoted
