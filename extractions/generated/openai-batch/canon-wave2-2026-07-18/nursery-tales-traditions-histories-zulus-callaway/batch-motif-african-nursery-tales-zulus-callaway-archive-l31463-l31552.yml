canonical_text:
  quote: ''
  summary: 'A food-serving episode is described: Untombi-yapansi is not to be served
    in the children''s vessel, and her brother-in-law says food should be placed in
    her hands rather than on the ground. Her sister pours amasi or whey into her hands,
    but Untombi-yapansi has placed her hands around a house pillar, so the liquid
    spills when she separates them. A note explains this as related to a custom about
    not eating milk belonging to a brother-in-law. The sister later gives her boiled
    mealies. In the morning the sister complains that birds trouble her garden; the
    imbulu proposes that Umsila-wezinja go with the watchers, and Untombi-yapansi
    goes with Udalalana.'
  language: English with parallel Zulu text
  quote_policy: summarized
