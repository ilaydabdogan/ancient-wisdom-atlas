canonical_text:
  quote: ''
  summary: Untombi-yapansi rides her ox, sings of her father’s cattle-pen, is answered
    by people and trees, and opens the earth with a rod so that her father’s things
    and people enter. She then smears herself with black earth, returns to the garden
    watch-house, and drives away birds by declaring that she is truly Untombi-yapansi,
    not Umsila-wezinja. A note reports another version in which she allows the birds
    to consume the garden.
  language: English with Zulu text
  quote_policy: summarized
