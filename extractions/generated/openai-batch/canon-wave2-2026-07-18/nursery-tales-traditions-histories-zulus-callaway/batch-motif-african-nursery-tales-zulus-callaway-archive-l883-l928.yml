canonical_text:
  quote: ''
  summary: 'The introductory passage surveys recurring contents of Zulu nursery tales:
    Uthlakanyana is described as a cunning, malicious dwarf with magical powers; giant
    cannibals and the ogress Uzwanide appear; animals speak and sometimes serve as
    forms assumed by magical powers; the tales are said to involve magic and a contest
    between good and malicious genii; magical trees, a voice-opening Rock of Two-holes,
    huge monsters, an island-like River Tortoise, and a very long Fiery Serpent are
    listed. The editor also notes that fables and other narratives have been combined
    with the nursery tales.'
  language: English
  quote_policy: summarized
