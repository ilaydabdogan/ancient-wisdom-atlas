canonical_text:
  quote: ''
  summary: A woman tells her husband that the children she shouted for are hers alone
    and not a man's children. A boy and a girl come out; the father embraces the boy
    and asks where the children came from. The woman says pigeons gave them to her,
    scarified her loins, and a clot came out, was placed in a vessel, and became human
    beings; she nourished and hid them because crows might have killed them. The father
    then approves slaughtering a young ox rather than a goat, and the mother shows
    the bridegroom his bullock, which is killed and eaten.
  language: Zulu with English translation
  quote_policy: summarized
