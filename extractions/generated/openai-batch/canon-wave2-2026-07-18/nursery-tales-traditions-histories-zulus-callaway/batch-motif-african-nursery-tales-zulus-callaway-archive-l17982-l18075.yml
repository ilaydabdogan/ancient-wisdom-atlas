canonical_text:
  quote: ''
  summary: The passage describes Ugungqu-kubantwana, also called Ugunggu, as the mother
    and chief of all animals. Animals drink first at a special pool, because if she
    drank first she would exhaust the water. Her body is described as containing land
    on one side and rivers and great forests on the other; animals avoid those rivers
    as common water and prefer the milk-like pool. Her name is associated with the
    loud sound heard when she approaches. An editorial note compares the tale with
    South African and Basuto animal traditions.
  language: Zulu with English translation and editorial English notes
  quote_policy: summarized
