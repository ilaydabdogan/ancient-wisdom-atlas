canonical_text:
  quote: ''
  summary: The passage first reports a saying attributed to Undayeni that attentive
    listening may reveal meaningful speech from a wagtail, though the narrator says
    the bird's speech remained unintelligible. It then gives an anecdote in which
    a crow calls Umpeza by name and warns him not to join men going to take cattle
    during conflict between the Zulus and the Dutch. Some hear and believe the warning
    and return; others reject it because birds are not known to speak with people
    and go on. The larger group is killed by the Zulus, with Usichile alone escaping,
    after which those remaining believe that birds speak though people do not understand
    them.
  language: Zulu original with English translation
  quote_policy: summarized
