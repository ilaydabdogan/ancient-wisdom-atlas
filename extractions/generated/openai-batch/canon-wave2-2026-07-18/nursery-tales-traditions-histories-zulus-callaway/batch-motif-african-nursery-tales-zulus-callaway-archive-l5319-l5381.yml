canonical_text:
  quote: ''
  summary: The passage introduces Uzembeni as a great woman with two daughters. She
    devours the people of her country, eating men together with game and boiling human
    and animal flesh together, until no other people remain. Her two daughters are
    noted for their beauty. When no men remain, Uzembeni catches one daughter, tears
    off one cheek, boils and eats it, but finds the flesh bitter and no longer wants
    to finish eating her.
  language: Zulu with English translation
