canonical_text:
  quote: Men say, “The rainbow is disease. If it rests on a man, something will happen
    to him.”
  summary: Utshintsha, the owner of a garden, sees a rainbow after rain. The rainbow
    descends into a river, comes out into the garden, approaches him, dazzles his
    eyes with red colour, and causes him to flee in fear. The passage reports a saying
    that the rainbow is disease and that harm follows if it rests on a person. Utshintsha
    says that after the rainbow drove him from the garden, his body became affected
    with swellings; a note describes a scaly eruption over the whole body.
  language: Zulu with English translation
