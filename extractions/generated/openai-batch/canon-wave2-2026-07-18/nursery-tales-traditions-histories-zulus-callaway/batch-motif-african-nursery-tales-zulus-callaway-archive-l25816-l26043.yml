canonical_text:
  quote: ''
  summary: A king arrives with cattle and asks Umdhlubu's father for Umdhlubu in marriage.
    Her father assents, appoints attendants and an officer, and sends marriage goods.
    Umdhlubu is received as queen at the husband's home, participates in dance and
    gift actions, and a town is built for her and her people.
  language: Zulu with English translation
  quote_policy: summarized
