canonical_text:
  quote: ''
  summary: A brother and sister are in a beautiful upper region, with the earth far
    below. They fear cannibals on the earth. They find a large ox, bring it to their
    house, kill and flay it, spread the skin in the sun, and light a fire. Cannibals
    smell the meat, look up, and see the house. The sister proposes drawing one cannibal
    up because the brother has a spear, and the brother cuts the moist hide into a
    long rope.
