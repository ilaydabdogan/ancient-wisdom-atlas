  quote: ''
  summary: The preface explains the making of the first volume of Zulu Native Literature
    from orally transmitted materials. The author describes collecting, translating,
    and arranging tales from native informants, presents the book as a students’ edition
    for Zulu language and comparative folklore, and argues that the tales are valuable
    as records of a people’s mind rather than merely nursery stories.
  language: English
  quote_policy: summarized
