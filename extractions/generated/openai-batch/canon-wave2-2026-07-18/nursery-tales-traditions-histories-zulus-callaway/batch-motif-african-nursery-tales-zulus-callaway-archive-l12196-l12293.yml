canonical_text:
  quote: ''
  summary: A bride's father says all customs for the child should be completed before
    the bridegroom's party departs with her, because crows may kill her. Goats and
    cattle are killed, meat is eaten, and the bride dances for the bridegroom's party.
    The father advises the party to set aside a leg as food for the journey and they
    agree to depart in the morning. The mother warns them that they will see a green
    animal in the path on the high land and must not pursue it, so that the daughter's
    marriage will be fortunate. Notes explain the bride's dance as a ceremony acknowledging
    the bridegroom and identify the green animal only tentatively as an insimango,
    a large greenish baboon.
  language: English translation with Zulu source text
  quote_policy: summarized
