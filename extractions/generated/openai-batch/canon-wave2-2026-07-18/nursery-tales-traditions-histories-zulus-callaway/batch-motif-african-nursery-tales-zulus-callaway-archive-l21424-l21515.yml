canonical_text:
  quote: ''
  summary: The passage describes adornment with a head-ring and a woman's top-knot,
    followed by rejoicing. It then reports that Umkxakaza's return and beauty are
    rumored among nations. Many chiefs seek her as a wife, but her father refuses
    because she has just returned after being carried off by a beast and he wants
    her to remain with him. Another distant chief hears of her and sends an old man.
    A footnote explains the head-ring and woman's top-knot as socially marked head
    adornments.
