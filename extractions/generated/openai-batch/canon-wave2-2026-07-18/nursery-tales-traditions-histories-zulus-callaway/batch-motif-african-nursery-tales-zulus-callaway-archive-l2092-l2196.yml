  quote: "“I am very old. I am not your child.”"
  summary: Uthlakanyana tells the woman regarded as his mother that he is very old,
    not her child, and will leave to travel alone over the whole world. The pot is
    emptied; the mother says the birds have become dung at the bottom, with only heads
    remaining above. The boy eats the heads and refuses to give any to her, accusing
    her of having eaten the birds' flesh. Editorial notes compare the marvelously
    speaking child with Highland and Grimm fairy-child material and describe Uthlakanyana
    as feigning a reason to quit the household.
