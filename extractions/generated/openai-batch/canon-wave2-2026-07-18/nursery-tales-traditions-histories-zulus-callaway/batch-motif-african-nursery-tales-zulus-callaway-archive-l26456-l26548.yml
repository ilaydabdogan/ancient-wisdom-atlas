canonical_text:
  quote: ''
  summary: The passage explains inheritance rules in a polygamic household. Wives
    obtained with cattle belonging to a son's house belong to that house, and a village
    that grows through those wives remains the boy's. If the children of the associated
    houses die, he inherits their property, because they are not considered a separate
    family from him. A note explains that a new estate can be founded through gifts,
    labor, or children’s contributions, and that a wife acquired with such property
    belongs to the house that supplied it. The editor further compares this household
    rule to the family of Jacob, interpreting Leah, Rachel, Bilhah, Zilpah, Reuben,
    and Joseph through the framework of chief and secondary houses.
  language: English with Zulu source text in parallel
  quote_policy: summarized
