canonical_text:
  quote: ''
  summary: Ubabuze is carried through the clouds by a skin to the kraal of the damsel
    he loves and is received as the princess's husband. After a year, the damsel's
    father assembles a large marriage party. Ubabuze asks for many cattle because
    hyenas are on the road, then sets out with the damsel, cattle, and people. At
    the place where the hyenas had left him, he places the skin on the flesh of a
    striped mouse, kills an ox for it, and leaves the meat for the mouse to eat.
  language: English translation with Zulu original
  quote_policy: summarized
