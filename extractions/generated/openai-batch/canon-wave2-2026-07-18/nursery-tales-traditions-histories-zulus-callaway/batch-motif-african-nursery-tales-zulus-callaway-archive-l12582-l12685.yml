canonical_text:
  quote: "“Ukakaka the king’s child gone off with an animal!”"
  summary: As Ukakaka returns with soldiers, the bride is left behind, alone with
    an ox. Many birds go before the party and repeatedly say that Ukakaka, the king’s
    child, has gone off with an animal or Imbulu. Ukakaka asks his men whether they
    hear the birds speaking, and they explain that such birds speak. The repeated
    words trouble him. Near home the birds return to the forest. The party enters
    home with the bride still behind, and the next scene begins at the cattle-pen
    where men sit with Ukakaka’s father, the king.
  language: Zulu with English translation
  quote_policy: quoted
