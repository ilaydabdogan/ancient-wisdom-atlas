canonical_text:
  quote: I know not how he entered within me.
  summary: A mother explains that she has given birth to a human child without knowing
    how he entered her, while asserting that she was not old enough for pregnancy,
    never spoke with a man, and was unmarried. She and the child return to the king
    of the east. The king rejoices, assembles the nation, and commands praise for
    the child, saying the child belongs to his line and is not the child of a male.
    The child grows up, becomes known as the wise son of the king, surpasses other
    doctors, heals people whom others cannot cure, and travels among nations healing
    and helping people.
  language: Zulu original with English translation
  quote_policy: quoted
