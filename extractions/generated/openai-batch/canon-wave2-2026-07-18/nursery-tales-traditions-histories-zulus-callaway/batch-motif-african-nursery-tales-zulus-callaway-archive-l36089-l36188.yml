canonical_text:
  quote: ''
  summary: The passage recounts two Utikoloshe-related episodes. In the first, milk
    placed in a calabash disappears and is attributed to Utikoloshe; a boy who milks
    cows into his own mouth is followed by Utikoloshe's complaint, the boy's deformity,
    lost milking cords, and calves released at night. In the second, an unnamed woman
    delays going to a wedding dance, her husband lies in wait, and Ugilikakgwa, identified
    in a note as Utikoloshe, puts on an oribe-skin garment and prepares to imitate
    dance-play associated with the Amakxosa.
  language: Zulu with English translation and English notes
  quote_policy: summarized
