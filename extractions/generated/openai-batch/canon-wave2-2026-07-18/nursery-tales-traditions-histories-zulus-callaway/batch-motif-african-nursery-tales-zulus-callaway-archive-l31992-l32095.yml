canonical_text:
  quote: "“Open, earth, that all the things of my father may come out.”"
  summary: Udalana examines Untombi-yapansi but does not see a glistening spot. A
    chief visits the garden and watch-house, and Untombi-yapansi descends. In the
    evening Udalana tells the chief to hide at her watch-house and follow Umsila-wezinja
    when she goes to bathe; Udalana says the chief will see her glistening, emerging
    from a pool with a brass rod, opening the earth so that her father’s things come
    out, mounting an ox, and singing while men, cattle, trees, and everything sing
    with her.
  language: English translation with Zulu source text present
  quote_policy: quoted
