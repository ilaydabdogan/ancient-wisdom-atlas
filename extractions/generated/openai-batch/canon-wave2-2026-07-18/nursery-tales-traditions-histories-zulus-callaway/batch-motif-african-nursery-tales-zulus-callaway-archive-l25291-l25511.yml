canonical_text:
  quote: "“O king, your child that was dead has come to life again.”"
  summary: A messenger tells the king that his daughter Umdhlubu, formerly dead, has
    returned alive. The king orders public rejoicing and the gathering of oxen. People
    bring cattle and gifts, slaughter cattle, and dance. The king slaughters cattle
    in stages to draw Umdhlubu out and into the cattle-kraal, then feasts with her.
    She resumes her royal position, and she later says that a frog brought her there.
  language: English translation with Zulu original
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A messenger reports to the king that the king’s child who was dead has come
    to life again, and identifies the child as Umdhlubu.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king doubts the messenger, threatens him if the report is false, and orders
    him to raise a public cry for people to bring large oxen if it is true.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The messenger announces that the princess has come, and identifies her to
    the men as Umdhlubu, the king’s child who was dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people rejoice, take shields, drive oxen, bring presents for the princess,
    and slaughter many cattle, including cattle on the roads for old people and sick
    people who cannot reach the home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father asks Umdhlubu to come out; after cattle are slaughtered in increasing
    numbers, she appears at the doorway, comes out, and then enters the cattle-kraal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: People dance for Umdhlubu, but another side of the kraal does not rejoice
    or dance with that side’s children and queens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The father sits with Umdhlubu in the house and orders a fat young ox to be
    killed and cooked so they can eat and rejoice because she was dead and has risen
    from death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: All the people rejoice; Umdhlubu returns to her royal position, her father
    resumes his former habits at the kraal, and her mother and the children of her
    house rejoice together.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When asked how she came there, Umdhlubu says she was brought by a frog and
