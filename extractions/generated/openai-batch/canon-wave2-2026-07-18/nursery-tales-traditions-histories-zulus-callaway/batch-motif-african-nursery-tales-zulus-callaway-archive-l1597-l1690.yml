canonical_text:
  quote: "“Do you say he is a man?”"
  summary: Uthlakanyana takes meat meant for others to his mother's house after leaving
    a bloody feeding-mat and stick as apparent evidence that the meat had been properly
    hung up. When the villagers cannot find their meat, he points to those bloody
    objects as witnesses. The women of the kraal then question what kind of person
    has been born that day and whether Uthlakanyana is truly a man.
