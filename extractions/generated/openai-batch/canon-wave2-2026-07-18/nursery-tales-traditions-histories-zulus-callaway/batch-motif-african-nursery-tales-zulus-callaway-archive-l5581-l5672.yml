  summary: In a bilingual Zulu-English passage, Uzembeni's daughters refuse to help
    the female figure search and refer to injuries she has caused. After she sleeps
    and then goes hunting, the daughters bring out Usikulumi. One daughter escapes
    with him, while the injured daughter stays behind. Usikulumi fetches his dogs
    from a reed-bed, and the fugitives travel day and night to avoid being overtaken.
