canonical_text:
  quote: ''
  summary: Umkxakaza-wakogingqwayo refuses to come out because she says she is a chief's
    child. A chief sends Amadhlungundhlebe to fetch a large ox, which is slaughtered,
    after which Umkxakaza emerges with her blanket, sleeping mat, pillow, rod, and
    beaded petticoat. She is ordered to turn so the Amadhlungundhlebe can look at
    her; they praise her appearance but object to her two legs, then tell her to go
    into the cave and leave. Later many Amadhlungundhlebe come carrying a veil that
    reveals the wearer's body. Umkxakaza fears they have come to kill her. They take
    tobacco, enter the cave, tell her to come out, give her the veil, and she puts
    it on.
  language: Zulu and English
  quote_policy: summarized
