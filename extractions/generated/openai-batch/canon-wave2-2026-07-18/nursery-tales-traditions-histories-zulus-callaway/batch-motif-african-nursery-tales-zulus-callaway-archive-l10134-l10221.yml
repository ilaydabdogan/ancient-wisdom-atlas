  summary: Ubabuze, a king, wants to visit a damsel despite his parents' objection
    and his father's warning that no one goes there and returns. His father eventually
    permits him, gives him many cattle and accompanying men, and warns him to avoid
    the road up the mountain and take the road around it. At the fork, Ubabuze chooses
    the prohibited mountain road.
