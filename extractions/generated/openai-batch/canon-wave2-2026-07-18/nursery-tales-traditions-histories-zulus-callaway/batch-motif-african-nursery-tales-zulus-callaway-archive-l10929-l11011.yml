canonical_text:
  quote: ''
  summary: At the close of the tale, Udemazane warns Udemane that their father's bird
    is going away. Udemane delays while filling his mouth, and the bird first moves
    to the fence and then flies away. The father returns at night expecting his titbit,
    finds the bird gone and the amasi greatly reduced, questions his children, hears
    from one child that the others let the bird go and ate the amasi, and beats them
    while lamenting the loss and fearing famine. An editorial note compares the bird's
    power of rendering labour vain with a Central American legend in which beasts
    undo the clearing work of Hunahpu and Xbalanque.
  language: Zulu and English
  quote_policy: summarized
