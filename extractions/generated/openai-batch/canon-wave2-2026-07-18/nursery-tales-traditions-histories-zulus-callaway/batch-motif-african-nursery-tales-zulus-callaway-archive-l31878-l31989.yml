canonical_text:
  quote: "“Open, earth, that I may see the things of my father”"
  summary: Untombi-yapansi goes to the river to bathe while Udalana secretly follows.
    After bathing, Untombi-yapansi emerges glistening with a brass rod, strikes the
    ground, and commands the earth to open so that her father’s people, possessions,
    cattle, and food come out. She adorns herself, rides an ox, sings, and the people
    and trees join the song. She then commands everything to sink back into the ground,
    smears her body, returns to the garden, and explains her delay as caused by washing
    a dirty black body.
  language: Zulu with English translation
  quote_policy: quoted
