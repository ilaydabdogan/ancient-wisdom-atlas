canonical_text:
  quote: ''
  summary: 'In this excerpt, the imbulu claims to be Untombi-yapansi, explaining its
    changed appearance by illness. Untombi-yapansi''s sister questions the claim,
    remembers the true child as brass-like and glistening, and asks about a person
    at the doorway. The imbulu calls that person a mere thing found at the river and
    later names her Umsila-wezinja. Food is given or offered: porridge to the imbulu
    and whey to the doorway person, whom the husband insists should be brought into
    the house. The doorway person enters and is served whey in a child''s vessel as
    the imbulu begins to object.'
  language: Zulu with English translation
  quote_policy: summarized
