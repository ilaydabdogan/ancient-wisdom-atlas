canonical_text:
  quote: he did not chew it, he merely swallowed it.
  summary: Usilosimapundu consumes everything brought out from a village without chewing
    and remains unsatisfied. Animated leaves enter houses, empty two beer pots, carry
    the pots to the gateway, and Usilosimapundu swallows them. Usilosimapundu then
    summons Umkrakaza-wakoginggwayo, who retrieves and wears brass ornaments and takes
    brass-associated belongings before coming outside; he tells her to turn her back
    to him.
  language: Zulu with English translation
