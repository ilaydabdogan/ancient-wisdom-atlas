canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a king''s child, with his mother and
    companions, heals diseases without accepting reward and is acknowledged by nations
    as a child of a kingly father. A source attribution follows. The next tale begins
    in a famine: women and a grandmother go to gather herbs, reach the Umtshezi river,
    and encounter a huge tortoise that obstructs the water and takes the grandmother
    into deep water. Later a boy who has thrown a stone into the deep pool refuses
    food, says he wants to enter the pool, runs there, and is found with only his
    head above water while his father and community try to respond.'
  language: Zulu and English
  quote_policy: summarized
