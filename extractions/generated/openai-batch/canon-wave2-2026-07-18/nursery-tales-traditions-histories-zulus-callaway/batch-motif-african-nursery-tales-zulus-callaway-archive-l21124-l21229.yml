canonical_text:
  quote: ''
  summary: Umkxakaza is deliberately given little food by the Amadhlungundhlebe, becomes
    thin, packs gifts from their king into a basket, and leaves. She travels in fear,
    sleeps in the open, endures hunger, and receives mixed treatment from villages.
    She reaches a hilltop, sees a large town resembling both the Amadhlungundhlebe
    town and her father's town, notices smoke from fires, and at the gateway sees
    a man whose hair is like a cannibal's but who resembles her father.
  language: Zulu with English translation
  quote_policy: summarized
