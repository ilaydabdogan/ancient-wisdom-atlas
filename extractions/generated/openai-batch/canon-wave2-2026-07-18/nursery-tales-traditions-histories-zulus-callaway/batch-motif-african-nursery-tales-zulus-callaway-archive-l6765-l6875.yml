canonical_text:
  quote: ''
  summary: Untombinde discovers that food left in the house has been consumed and
    fears being accused of theft. Her mother questions her about the missing food
    and whether she heard the man. At night, food is again placed in the house. Unthlatu
    enters, wakes the damsel, questions her about her intention to marry the lost
    Unthlatu, urges her to marry the king’s sons instead, and offers her meat and
    beer. She refuses, citing marriage-related restrictions.
  language: English with Zulu parallel text
  quote_policy: summarized
