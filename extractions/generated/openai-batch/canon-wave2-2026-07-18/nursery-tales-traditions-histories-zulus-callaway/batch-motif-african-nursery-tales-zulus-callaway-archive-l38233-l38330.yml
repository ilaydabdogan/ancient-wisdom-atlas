  summary: The passage explains keys to riddles. One riddle uses the image of beings
    adorned with white hip-dresses to misdirect guessers toward men at a wedding,
    but the answer is teeth. Another riddle describes the tongue as an afflicted man
    among enemies, with the teeth as enemies that may injure it while eating.
