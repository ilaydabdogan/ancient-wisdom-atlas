canonical_text:
  quote: ''
  summary: Ulangalasenzantsi comes to a spring used by Ulangalasenthla’s village,
    recognizes his daughter’s child among children gathering reeds, breaks the child’s
    reed to summon the child’s mother, and then reveals himself to his daughter. She
    warns that Ulangalasenthla threatens him and may kill him, while Ulangalasenzantsi
    instructs her to conceal his identity and present him as a foreigner named Ubombi.
  language: English translation with Zulu original
