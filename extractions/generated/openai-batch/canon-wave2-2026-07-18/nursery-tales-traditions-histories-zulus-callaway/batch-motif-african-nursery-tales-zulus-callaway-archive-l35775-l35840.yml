canonical_text:
  quote: ''
  summary: In a bilingual Zulu-English passage, Isitwalangcengce speaks of Udhlokweni's
    funeral lamentation and the grief of her people and children. Udhlokweni says
    she loved the children and gave generously to women and men. Isitwalangcengce
    says it has taken her from her village forever. Udhlokweni catches hold of a tree
    and climbs up; Isitwalangcengce goes on alone to a river, throws itself down,
    and laments that it has killed itself while thinking it was throwing down Udhlokweni.
    Udhlokweni has fled and returned to her mourning people.
  language: Zulu and English
  quote_policy: summarized
