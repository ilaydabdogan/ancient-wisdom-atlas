canonical_text:
  quote: ''
  summary: A mother carries her child after a nurse refuses. While a group cuts fibre,
    rests in a valley, and makes bundles, the mother gives a fibre bundle to the child
    and later forgets her. At home the child is missing; the mother searches unsuccessfully.
    Rival wives rejoice that the father’s darling has been destroyed and the pet wife
    confounded. A messenger reports the child’s loss to the king, who is greatly troubled.
  language: Zulu with English translation
