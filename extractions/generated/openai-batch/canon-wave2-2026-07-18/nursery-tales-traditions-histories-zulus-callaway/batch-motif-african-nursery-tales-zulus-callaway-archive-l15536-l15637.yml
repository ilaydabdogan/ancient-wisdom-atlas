canonical_text:
  quote: ''
  summary: In this excerpt, a cannibal dies during the night. A sister urges her brother
    to leave their tree refuge and seek another sister whom their mother had said
    was married. After the brother expresses fear of cannibals, the siblings soften
    a rope in water, fasten it to a large log, descend to the ground, leave the rope
    hanging, pass the dead cannibal's bones, and travel onward seeking their sister.
    A section heading states that they find the sister and live with her in peace.
  language: Zulu with English translation
  quote_policy: summarized
