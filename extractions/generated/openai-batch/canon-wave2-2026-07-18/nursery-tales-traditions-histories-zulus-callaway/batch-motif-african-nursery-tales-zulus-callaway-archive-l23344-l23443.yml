canonical_text:
  quote: ''
  summary: In a ruined house, a boy is given food and refuses food eaten on the ground.
    He spits, and the spittle boils, speaks to the chief, and fills the house. A violent
    rainstorm follows, making all houses leak, while the boy’s own house is later
    found dry. The people identify him as magically powerful and decide to kill his
    ox to test whether the marvels will continue. When the ox is to be killed, the
    boy says he will die if the ox dies.
  language: Zulu with English translation and notes
