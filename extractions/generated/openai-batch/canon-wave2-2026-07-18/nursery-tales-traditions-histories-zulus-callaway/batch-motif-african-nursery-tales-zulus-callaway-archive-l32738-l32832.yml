canonical_text:
  quote: "“Do not come near us at once ; you still smell of fire.”"
  summary: 'The passage first states that when a man dies in this world and goes to
    the people beneath, they tell him to remain at a distance until the smell of fire
    has passed off. It then begins the tale of Uncama-ngamanzi-egudu: Uncama’s ripening
    mealie garden is repeatedly wasted by a porcupine; he waits for a dewy day, follows
    the brushed-off dew trail to the porcupine’s hole, enters with weapons intending
    to kill it, and goes on until he reaches a pool.'
  language: Zulu with English translation
  quote_policy: quoted
