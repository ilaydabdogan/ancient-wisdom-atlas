canonical_text:
  quote: ''
  summary: Imbulu persuades the bride to come down and lend her dress, veil, and ox.
    Imbulu puts on the bridal items, mounts the ox, and refuses to dismount. The bride
    and bridesmaids depart, become birds, and remain in the forest. The bridegroom
    returns with his men, notices that the figure presented as the bride is altered,
    feels bodily weakness, and suspects that she is not his bride; the figure answers
    indistinctly that the bridesmaids went home. Footnotes explain the veil and uluve
    bird and compare unexplained bodily weakness to an omen and to a substituted-queen
    tale.
  language: Zulu with English translation
  quote_policy: summarized
