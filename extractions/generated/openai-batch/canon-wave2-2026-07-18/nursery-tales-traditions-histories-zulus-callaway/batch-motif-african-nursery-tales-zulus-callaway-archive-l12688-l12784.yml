canonical_text:
  quote: ''
  summary: 'A prince, Ukakaka, arrives with an altered damsel. His father the king
    angrily questions whether she is the beautiful damsel reported by the Abahhwebu
    and threatens them. Ukakaka says the Abahhwebu told the truth: he saw her when
    she was beautiful, but at her home they had been told not to kill a certain animal;
    after they killed it, the damsel was changed, her companions were gone, and he
    saw she was not the same damsel. After a few days, Ukakaka refuses to have her
    called his wife, and the people say she is not like a human being.'
  language: Zulu with English translation
  quote_policy: summarized
