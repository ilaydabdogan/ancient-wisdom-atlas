canonical_text:
  quote: ''
  summary: In a bilingual Zulu tale excerpt with English translation, thieves come
    by night to steal and beat cattle. A child or cattle-keeper is blamed for the
    swollen cattle, although the thieves caused the injuries. On a later night, the
    thieves enter again, beat the cattle without waking them, and force the detected
    person to speak. A repeated formula calls Ubongopa-kamagadhlela to awake and then
    to go; Ubongopa and the cattle depart, while calves free themselves from cords,
    open the door, and follow.
  language: Zulu with English translation
