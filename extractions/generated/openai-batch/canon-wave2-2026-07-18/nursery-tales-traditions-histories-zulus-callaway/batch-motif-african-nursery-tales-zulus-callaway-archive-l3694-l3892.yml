  text: The first cannibal, who refused to lend the calabash, follows Uthlakanyana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second cannibal invites Uthlakanyana to bray his skin, and the calabash
    outside makes a loud sound.
  category: action
