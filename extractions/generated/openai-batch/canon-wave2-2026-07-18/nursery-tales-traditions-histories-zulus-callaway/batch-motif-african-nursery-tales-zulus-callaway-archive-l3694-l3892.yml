canonical_text:
  quote: ''
  summary: Uthlakanyana is refused trust and a calabash by one cannibal, then uses
    that cannibal’s loud calabash and boastful identity to frighten another cannibal.
    He later returns to the calabash-owning cannibal, asks to live with him as a child
    or sister’s child, gains acceptance, and is left to guard the kraal while the
    cannibal hunts.
  language: Zulu with English translation
  quote_policy: summarized
