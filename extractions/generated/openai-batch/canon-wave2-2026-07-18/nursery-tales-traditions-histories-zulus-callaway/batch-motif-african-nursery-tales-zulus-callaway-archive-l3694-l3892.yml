- id: obs:1
  text: A cannibal recognizes Uthlakanyana, rejects his kinship claim, refuses to
    lend him a calabash, and says he will not communicate with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uthlakanyana goes to another cannibal’s house and again claims a kinship relation,
    calling the cannibal his uncle.
  category: action
  evidence_refs:
