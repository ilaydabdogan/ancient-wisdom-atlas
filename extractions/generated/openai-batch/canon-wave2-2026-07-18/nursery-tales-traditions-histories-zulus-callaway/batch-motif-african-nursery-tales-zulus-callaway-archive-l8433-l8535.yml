canonical_text:
  quote: ''
  summary: Usitungusobenthle is left alone and is carried away through the air by
    the Amajubatente. They pass near her mother, who tries unsuccessfully to seize
    her and follows weeping. At evening the Amajubatente perch in a tree while the
    mother lies at its foot; during the night they take Usitungusobenthle to their
    own country. In the morning the mother returns. Among the Amajubatente, Usitungusobenthle
    is made queen, has an Ijubatente husband, and gives birth to three children.
  language: Zulu with English translation
  quote_policy: summarized
