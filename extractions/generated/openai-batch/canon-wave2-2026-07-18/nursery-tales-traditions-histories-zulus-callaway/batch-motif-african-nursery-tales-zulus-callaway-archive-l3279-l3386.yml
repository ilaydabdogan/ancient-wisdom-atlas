canonical_text:
  quote: ''
  summary: The excerpt closes one Uthlakanyana episode by saying he kills and eats
    a leopard's child and eats the leopard, then continues travelling. A bracketed
    alternate version makes the victim a doe with thirteen children; Uthlakanyana
    acts as nurse and eats the kids one by one. In that version he flees from the
    doe, reaches a full river, turns into an upper millstone, and is thrown across
    by the doe, then reveals the deception. A footnote compares this incident with
    Litaolane in a Basuto legend. The next section begins with Uthlakanyana meeting
    a cannibal, exchanging kinship greetings, inviting him to hear about Mrs. Leopard,
    and offering meat.
  language: Zulu with English translation and English editorial notes
  quote_policy: summarized
