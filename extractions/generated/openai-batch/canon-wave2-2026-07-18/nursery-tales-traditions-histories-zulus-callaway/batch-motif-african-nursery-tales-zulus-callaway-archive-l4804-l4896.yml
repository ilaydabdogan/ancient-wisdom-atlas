canonical_text:
  quote: "“This child is like our king.”"
  summary: A mother persuades old women not to kill her loved son, and they suckle
    him and take him to his maternal uncle. When the boy has grown into a young man,
    he herds cattle at his uncle’s kraal, commands the other boys to heat stones,
    kill a fine calf, skin it, and roast it. Later his father’s officers meet him,
    ask who he is, and, because he resembles their king, take him to his father. An
    editorial footnote comments on heated-stone meat baking as an unusual custom for
    local Zulu practice at the time of collection.
  language: Zulu with English translation
  quote_policy: quoted
