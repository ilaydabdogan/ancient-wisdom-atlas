canonical_text:
  quote: ''
  summary: Uthlakanyana has a cannibal climb onto a house to thatch while he works
    from inside. He secretly fastens the cannibal's long hair into the thatch, then
    leaves, takes boiled cow udder from the fire, and eats it. The cannibal tries
    to come down but cannot, and Uthlakanyana says he has thatched well and can now
    eat in peace. A note compares the episode to a Basuto tale in which a hare traps
    a lion by weaving the lion's tail into a hut.
  language: Zulu with English translation
  quote_policy: summarized
