canonical_text:
  quote: ''
  summary: 'A group traveling on oxen goes from village to village while seeking their
    mother. At each stopping point an ox is made to cry and a formula is repeated:
    the travelers say their mother gave birth to them but did not nourish them, that
    they ate earth and grew, and that they are children of Ulubundubundu-a-ba-lu-vume.
    Village people repeatedly tell them to go forward. At the large village of Umkuzangwe
    they are asked whose children they are and answer that they are children of Unthlangunthlangu.'
  language: Zulu with English translation
  quote_policy: summarized
