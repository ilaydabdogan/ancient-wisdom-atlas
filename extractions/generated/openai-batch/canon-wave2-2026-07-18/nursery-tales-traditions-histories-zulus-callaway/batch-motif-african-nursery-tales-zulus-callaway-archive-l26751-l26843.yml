canonical_text:
  quote: ''
  summary: The passage explains property and inheritance claims in polygamous households.
    A chief wife may object when cattle linked to her children are used to take another
    wife. If cattle from the chief house help provide bridewealth for a wife of another
    side, the heir of the chief house may claim that the resulting son belongs partly
    to the chief house. The father can prevent this by replacing the borrowed cattle
    with other cattle. A son’s side of the village may be enlarged through further
    wives assigned to that side, and those wives become its heritage.
  language: Zulu with English translation
  quote_policy: summarized
