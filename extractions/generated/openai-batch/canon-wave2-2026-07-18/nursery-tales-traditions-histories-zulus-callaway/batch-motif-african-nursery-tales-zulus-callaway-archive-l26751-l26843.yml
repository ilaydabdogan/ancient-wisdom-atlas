  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the cattle used to take the wife called a hill are too few, and the husband
    supplements them with cattle of the chief house, the heir of the chief house puts
    in a claim.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heir of the chief house refuses to agree with the son called the iponsakubusa
