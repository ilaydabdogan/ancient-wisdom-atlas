canonical_text:
  quote: ''
  summary: The passage describes an immense cattle-enclosure or village, then narrates
    how Umkxakaza-wakogingqwayo, a king's child, is publicly announced as being of
    age. Her father, the king, sends increasingly large groups of cattle to bring
    her back from the open country. Umkxakaza dismisses lesser offerings, remarks
    on the visible sun, and says she will not return until the sun is darkened according
    to her father's saying.
