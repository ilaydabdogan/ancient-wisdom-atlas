canonical_text:
  quote: ''
  summary: In a Zulu fable, a hyena carrying a bone sees the moon reflected in still
    water, mistakes the reflected moon for fat meat, drops the bone, and repeatedly
    plunges after the reflection, getting only muddy water. Another hyena takes the
    discarded bone. Daylight dims the moon, and the first hyena is mocked for continuing
    to run into the water and grasp at nothing.
  language: Zulu with English translation
