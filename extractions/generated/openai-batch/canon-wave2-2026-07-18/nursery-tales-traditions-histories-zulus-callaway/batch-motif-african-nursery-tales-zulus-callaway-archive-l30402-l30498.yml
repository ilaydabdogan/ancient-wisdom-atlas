canonical_text:
  quote: ''
  summary: 'A chief has three children: Usilwane, Usilwanekazana, and Untombi-yapansi.
    Usilwane and Usilwanekazana love each other. Usilwane goes hunting and returns
    with a leopard, calling it his dog and ordering that it be fed milk porridge only
    when cold. The leopard grows large, and the people fear it and suspect Usilwane
    of becoming an umtakati because he keeps a leopard as a dog.'
