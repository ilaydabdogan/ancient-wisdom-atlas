  quote: ''
  summary: A bilingual Zulu and English passage explains several riddles. It describes
    how a louse is misleadingly called an ox killed in two cattle-pens, meaning thumbs;
    how a pillar is called a man because it stands and upholds a house; how the ear
    is described as unmoved by wind while the person moves; and how teeth are called
    men standing in a row like wedding-dancers.
