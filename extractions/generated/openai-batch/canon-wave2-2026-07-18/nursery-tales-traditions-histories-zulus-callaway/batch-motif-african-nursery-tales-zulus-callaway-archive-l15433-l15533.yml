  quote: ''
  summary: The supplied excerpt shows a brother and sister roasting and eating meat
    in a house while a cannibal is denied food. The cannibal tries at night to take
    contents from an ox's stomach, but the sister alerts the brother, who threatens
    him and makes him put it down. After dawn the siblings continue eating the meat,
    give the cannibal nothing, and watch him to keep him from taking scraps; an internal
    heading says the cannibal dies.
