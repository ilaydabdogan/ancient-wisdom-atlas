canonical_text:
  quote: ''
  summary: Ubabuze, called son of the king, recalls that his father warned him not
    to take a bad road infested by hyenas. The hyenas repeatedly call to him and receive
    his cattle, then his people, until he is alone. When they continue pursuing him
    to eat him, he meets a striped mouse, follows its instruction to skin it and carry
    the skin, and the skin lifts him up to the clouds while the hyenas remain on the
    ground and turn back.
  language: Zulu with English translation
  quote_policy: summarized
