canonical_text:
  quote: ''
  summary: Uthlakanyana conceals from his mother that trouble has brought him back,
    emphasizing instead that he returned out of love so that she will continue to
    treat him well. The next day he attends a marriage-dance, returns by way of a
    hill, finds and digs up an umdiandiane tuber, and asks his mother to cook it while
    he goes to milk. She cooks it, tastes it, finds it pleasant, and eats it all.
    When he asks for it, she admits that she has eaten it. A section heading states
    that the mother redeems her fault by a milk-pail, and a footnote identifies umdiandiane/intondo
    as an edible tuber.
  language: Zulu with English translation
  quote_policy: summarized
