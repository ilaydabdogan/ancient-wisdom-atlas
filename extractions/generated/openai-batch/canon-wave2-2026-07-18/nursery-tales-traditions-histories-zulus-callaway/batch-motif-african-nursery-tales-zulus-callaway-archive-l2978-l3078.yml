canonical_text:
  quote: ''
  summary: The range begins with the close of an episode in which an old man pulls
    a root until tired while Uthlakanyana eats bread and leaves. Uthlakanyana then
    finds a leopard’s children while their mother is away. When the leopard returns
    with a buck and becomes angry, he offers to stay with the children, guard them
    while she hunts, and build a thatched house. The leopard agrees. Uthlakanyana
    then begins arranging how the children are to be suckled, and the leopard insists
    both children suck together so that neither cries.
  language: Zulu and English
  quote_policy: summarized
