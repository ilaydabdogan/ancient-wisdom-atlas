canonical_text:
  quote: ''
  summary: Uthlakanyana and a cannibal share meat after the cannibal says he was very
    hungry. Two cows appear, one white and one black. The cannibal claims the white
    cow and Uthlakanyana claims the black cow. Uthlakanyana proposes building a house,
    then has the cannibal's white cow killed first to test its claimed whiteness inside;
    it is found lean. His own cow is then killed and found very fat. The cannibal
    praises Uthlakanyana as wise. Uthlakanyana then proposes thatching the house before
    they eat because rain is coming.
  language: English translation with Zulu source text
  quote_policy: summarized
