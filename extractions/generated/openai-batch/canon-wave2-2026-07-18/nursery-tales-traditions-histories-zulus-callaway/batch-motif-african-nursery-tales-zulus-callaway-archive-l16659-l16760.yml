canonical_text:
  quote: ''
  summary: 'The passage describes a chief or king using parts of a conquered person’s
    body in ritual medicine: flesh is mixed with king-medicine, burned, and eaten
    as an izembe preparation; the head is kept and later used near king-medicine before
    military action as a charm for courage and conquest. Editorial notes define king-medicine
    and izembe and describe associated preparation and magical use.'
  language: Zulu with English translation and English notes
  quote_policy: summarized
