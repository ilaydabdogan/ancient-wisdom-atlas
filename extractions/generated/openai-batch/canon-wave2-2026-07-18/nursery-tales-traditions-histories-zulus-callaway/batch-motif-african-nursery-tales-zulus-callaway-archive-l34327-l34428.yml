canonical_text:
  quote: ''
  summary: Unanana-bosele is told that an elephant ate her children. In the morning
    she prepares maize and amasi in a large pot, carries a knife, and searches for
    the one-tusked elephant. An antelope, a leopard, and other animals direct her
    toward a place with high trees and white stones. She finds the elephant lying
    there, but the elephant gives the same directions as though the sought elephant
    were elsewhere.
  language: English
