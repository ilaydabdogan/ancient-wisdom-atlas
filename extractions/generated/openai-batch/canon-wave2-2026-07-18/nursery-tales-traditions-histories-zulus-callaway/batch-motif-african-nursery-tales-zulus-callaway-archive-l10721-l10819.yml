canonical_text:
  quote: ''
  summary: In this excerpt of a Zulu tale, a husband hides a bird or milk-yielding
    source in a sealed pot in his hut so that his wife and children will not see it.
    At night, while the household sleeps, he opens the pot, handles the bird, pours
    out amasi, seals the pot again, and eats alone. One child has seen him and later
    tells the other children. Editorial notes compare the wonderful bird to Mick Purcell’s
    Bottle and define amasi as properly prepared sour milk.
  language: Zulu with English translation and English editorial notes
