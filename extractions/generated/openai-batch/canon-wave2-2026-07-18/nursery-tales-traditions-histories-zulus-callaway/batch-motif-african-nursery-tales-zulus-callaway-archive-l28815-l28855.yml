canonical_text:
  quote: There is among black men the custom of abstaining from certain foods.
  summary: 'The appendix describes a food-abstinence custom: when a cow''s calf is
    removed dead and the cow also dies before the calf is taken away, young people
    who have not had a child abstain from that cow''s flesh. Girls are described as
    not even being considered possible eaters of it, because the cow is said to produce
    a similar evil among women. The editor says these abstinences resemble the JEtoon
    dab of West coast Africans.'
