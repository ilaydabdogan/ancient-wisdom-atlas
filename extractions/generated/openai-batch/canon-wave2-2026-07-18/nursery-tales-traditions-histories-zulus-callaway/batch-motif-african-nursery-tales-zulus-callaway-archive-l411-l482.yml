canonical_text:
  quote: ''
  summary: In this prefatory passage, Callaway explains that collected Zulu-language
    materials came to serve not only language study but also inquiry into customs,
    histories, thought, religion, and possible connections with other peoples through
    traditions and myths. He describes preparing manuscript materials for publication,
    choosing to print Zulu and English translation side by side, explaining his idiom-for-idiom
    translation policy, noting editorial softening of some sexual references, and
    introducing his preferences for writing and spelling Zulu words.
  language: English
