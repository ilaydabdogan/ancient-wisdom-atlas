  summary: In a Zulu nursery-tale excerpt, a king takes several wives and indicates
    that one wife, identified as the future sovereign's mother, is expected to bear
    the royal successor. Other wives give birth in two cycles, and their children
    grow, walk, are weaned, and eventually become young men, while the chief/designated
    wife remains pregnant and has not yet given birth. Footnotes gloss the title and
    explain a naming custom for married women.
