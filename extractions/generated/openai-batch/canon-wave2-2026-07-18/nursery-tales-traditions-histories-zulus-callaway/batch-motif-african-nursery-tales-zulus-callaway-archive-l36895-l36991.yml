  summary: The passage gives a proverb about a hyena that throws away a bone and grasps
    at nothing after seeing the moon in water; it is used when someone is laughed
    at. An editorial note compares this to “The Dog and the Shadow” and “Hibernian
    Moon-rakers.” The passage then begins a tale in which a baboon meets a leopard
    in the forest, calls other baboons, and they try to bamboozle and kill the leopard.
    The leopard and baboons are said to hate one another because leopards kill young
    baboons. The baboons groom and stroke the leopard until it relaxes; while surrounding
    it, some dig a long hole because the leopard has a long tail.
