canonical_text:
  quote: ''
  summary: A young woman enters her mother’s house and says she is only on a journey.
    The mother laments that her own child was lost after being left in a valley and
    was thought to have died there. The young woman challenges the mother’s explanation,
    while the mother says the queens made her forget the child and prevented the nurse
    from carrying her. The mother then looks closely, recognizes the young woman as
    her child, rejoices, and praises her with laud-giving names.
