canonical_text:
  quote: ''
  summary: In the tale, a man being carried by Isitwalangcengce in a basket toward
    a rock escapes by putting tree branches in the basket as substitute weight, catching
    a tree, and running home. He reports the danger to the community, explains that
    children are being taken when they answer calls, and devises a plan involving
    two paths because Isitwalangcengce prefers the rocky path while he escaped by
    the bush-path.
  language: Zulu with English translation
  quote_policy: summarized
