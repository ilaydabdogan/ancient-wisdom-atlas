  quote: "“Behold then the cattle which darken the sun.”"
  summary: A party drives off Usilosimapundu’s cattle. The herd raises so much dust
    that the sun and sky are hidden, and the cattle are brought to Umkxakaza. Afterward
    Umkxakaza returns home, enters a prepared umgongo with damsels, and the community
    rejoices by slaughtering bullocks. A note explains the umgongo as a chamber in
    which a girl of age is placed.
