canonical_text:
  quote: ''
  summary: 'The passage describes the Abatwa as dreadful not because of size, but
    because they are small, concealed under grass, and able to attack unseen. A hidden
    Umutwa pierces a man with an arrow before the man sees the shooter. The Abatwa
    are compared to fleas: small, hard to grasp, troublesome, and able to dominate
    because they are unseen. Their power is concealment, especially in high grass,
    where they can see men while remaining unseen.'
  language: Zulu with English translation
