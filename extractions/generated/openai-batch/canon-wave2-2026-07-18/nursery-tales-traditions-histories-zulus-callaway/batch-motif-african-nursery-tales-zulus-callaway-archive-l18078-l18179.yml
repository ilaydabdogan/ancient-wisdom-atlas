  quote: "“The Izingogo are fabulous animals, — degenerated men”"
  summary: The passage describes the Izingogo as former or apparently human beings
    who live apart from human habitations, have become animal-like, eat human flesh,
    and test whether newcomers belong to them through shared habits and leaping at
    a river bank. Children are said to detect a false ingogo more sharply than the
    older ones. Their leaping ability is linked to eating red earth.
