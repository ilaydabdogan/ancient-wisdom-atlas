canonical_text:
  quote: ''
  summary: Unthlamvu-yetusi follows instructions to pull Umamba while looking away;
    a skin comes off, and she sees Umamba as very beautiful with a glistening body.
    Umamba explains that after his mother had lost earlier children and her sister
    was blamed, his mother had a small imamba skin procured and placed him in it at
    birth, so the household thought he was a snake. He asks Unthlamvu-yetusi not to
    tell anyone. He also says his lad anoints him with fat and removes the skin. The
    next morning Unthlamvu-yobutlilalu says she wants to go home, and twenty cattle
    are selected.
  language: Zulu with English translation
  quote_policy: summarized
