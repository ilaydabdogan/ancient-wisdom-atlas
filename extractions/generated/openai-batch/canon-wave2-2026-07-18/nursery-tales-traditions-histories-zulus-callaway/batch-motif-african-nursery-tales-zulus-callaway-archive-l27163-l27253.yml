canonical_text:
  quote: ''
  summary: 'After Ubabazeleni’s death, Umatongo attempts to assume village headship
    but is reminded that he has no standing and that Unsilane will take the headship.
    The passage then explains inheritance rules in a polygamic household: children
    after the first girl belong to their house, remain under the chief house through
    their mother’s marriage-cattle connection, and may inherit if the chief house’s
    heirs die. Heritage passes by the ordered sequence of houses according to marriage
    order and is not to bypass eligible houses.'
  language: Zulu with English translation
  quote_policy: summarized
