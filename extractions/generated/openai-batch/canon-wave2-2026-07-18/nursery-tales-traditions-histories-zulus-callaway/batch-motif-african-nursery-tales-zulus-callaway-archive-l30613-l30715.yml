canonical_text:
  quote: It was just as though she was asleep.
  summary: Usilwane places Usilwanekazana’s blood in a pot, cleans and adorns her,
    and lays her out as if asleep. He kills a sheep, mixes its blood with hers, cooks
    the blood and viscera as food, and sets it by the fireplace. When Untombi-yapansi
    arrives, Usilwane offers her the food; she asks why Usilwanekazana is sleeping
    and where the food came from, and Usilwane says he does not know why she sleeps
    and points to the sheep as the source of the food.
  language: English translation with Zulu source text
  quote_policy: quoted
