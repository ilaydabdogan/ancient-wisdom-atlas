canonical_text:
  quote: ''
  summary: In this passage from the Usitungusobenthle tale, a child speaks from inside
    a bag and says she has been forsaken by her father’s children. Her brothers recognize
    her voice and the cannibal is brought to her family. Her mother feeds the cannibal
    and has him beat the bag so the child speaks again; the father/king is called
    and hears the voice. The father gives the cannibal a perforated calabash to fetch
    water, delaying him. While the cannibal is occupied with the leaking vessel, scorpions,
    snakes, and dogs are placed in the bag, and Usitungusobenthle is removed by her
    father. Footnotes compare the leaky-vessel water task to Moorachug and the Danaides,
    and note a similar Bechuana tale of Tselane.
  language: Zulu and English
  quote_policy: summarized
