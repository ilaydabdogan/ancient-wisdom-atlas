canonical_text:
  quote: ''
  summary: After Usilwanekazana is reported killed by Usilwane, the people return
    home, call back the fleeing Usilwane, seize and bind him. The king orders the
    house shut and burned with himself, his wife, and Usilwane inside, while Untombi-yapansi
    is told to go live with her sister. Usilwane asks not to be burned but to be stabbed
    with an assagai; the chief refuses in the visible excerpt.
  language: English with Zulu source text
  quote_policy: summarized
