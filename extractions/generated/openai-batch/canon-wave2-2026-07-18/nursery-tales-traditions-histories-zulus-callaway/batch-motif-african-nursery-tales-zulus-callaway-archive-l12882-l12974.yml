canonical_text:
  quote: ''
  summary: In this excerpt, Uthlese is asked who she will say performed a set of household
    tasks, and she says she will claim that she did them. The visitors depart to the
    open country and become birds again. When the village people return, the women
    ask who smeared floors, fetched water and firewood, prepared mealies for beer,
    and heated water. Uthlese claims she did it all, and the household is pleased.
    The next morning, after the people leave to dig, damsels arrive carrying firewood;
    Uthlese calls them her father’s daughters-in-law and a wedding party, and they
    perform further work for the kraal, including beer-related tasks and fetching
    water. The supplied passage breaks off while they are grinding malt.
  language: English translation with Zulu parallel text in the supplied passage
  quote_policy: summarized
