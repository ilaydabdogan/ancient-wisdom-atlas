  summary: The passage says that the Isitshakamana was small and round, moved by walking
    on its buttocks, and was the size of a child not yet able to walk. It then reports
    that in the same year Ujobe had a child named Usitshakamana, who is said to still
    be living, grey-haired, and to have grandchildren.
