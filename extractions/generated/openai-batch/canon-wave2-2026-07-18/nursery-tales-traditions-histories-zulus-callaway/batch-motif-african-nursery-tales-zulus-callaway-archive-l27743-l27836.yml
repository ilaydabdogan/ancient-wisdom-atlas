canonical_text:
  quote: ''
  summary: A woman arrives at a settlement and is recognized. In a house at the gateway,
    the owner asks after her health and refers to a former beast within her. The woman
    asks what the king says about her; she is told that he laughs and that people
    said he was happy because she was dead and feared she would bear another prodigy.
    The householder reports to the king that the mother of the snake has come from
    the old village. The king summons her, greets her, asks after her health, and
    she says she is well. She is given food and eats; people then tell the king not
    to continue talking with her as the passage breaks off.
  language: Zulu with English translation
  quote_policy: summarized
