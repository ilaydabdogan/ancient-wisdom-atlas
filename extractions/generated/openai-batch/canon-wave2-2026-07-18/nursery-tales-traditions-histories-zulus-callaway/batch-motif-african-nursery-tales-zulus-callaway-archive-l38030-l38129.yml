canonical_text:
  quote: We mean a house by the cow which gives much milk.
  summary: The passage gives keys to several riddles. One explanation says that a
    milk-giving cow signifies a house, with milk explained as the joy the house gives
    to those beneath it. Another explains a village and the paths from it as fruit-bearing
    branches, with pumpkins representing villages. A third identifies the answer as
    a louse taken from a blanket and killed between two thumbs, leaving both nails
    red; the excerpt ends during its explanation of the misleading term “ox.”
  language: Zulu with English translation
  quote_policy: quoted
