canonical_text:
  quote: ''
  summary: An old man takes Umkxakaza off the path into the forest, says he will not
    hand over such a beautiful person to another man, and calls the beasts. Umkxakaza
    hears the forest crash and becomes afraid. She opens her head to put away her
    belongings, her head closes and appears fearfully large, and she climbs into a
    tree whose branches close behind her. She sees a village ahead and remains in
    the tree. Wild beasts arrive seeking prey and seize the old man, who tells them
    not to eat him because she is no longer there.
  language: Zulu with English translation
  quote_policy: summarized
