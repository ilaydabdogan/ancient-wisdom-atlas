canonical_text:
  quote: ''
  summary: 'In a dialogue, unnamed respondents say they came from a pool and that
    a snake was put into the pool. They identify Unthlangunthlangu as the snake’s
    father and identify their mother as the daughter of So-and-so. They refuse to
    come down from an ox. The king then questions them further: they affirm that Unthlangunthlangu
    is their father, say their mother had no other children, and recount that she
    was pregnant for many years before giving birth once, to a boa, which was cast
    into a pool.'
