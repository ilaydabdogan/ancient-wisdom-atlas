  quote: "“Go and fetch for me water at a place where no frog cries.”"
  summary: During a famine, an old woman repeatedly returns at noon to her son-in-law’s
    house and eats the amasi stored for the household. The hungry household and children
    cry, while the old woman blames an unnamed thief. The husband lies in wait, catches
    her, and tells her to fetch water from a place where no frog cries, promising
    not to expose her. He gives her a water-vessel, and she travels for a long time,
    passing many rivers and reaching unknown rivers.
