canonical_text:
  quote: ''
  summary: The cannibal who owns the house returns and acknowledges that Uthlakanyana
    has surpassed the man who had driven him away. Uthlakanyana declares himself greater
    and says he will also take the cannibal in, and the cannibal accepts that he has
    been surpassed. Later Uthlakanyana remembers that the iguana took his flute, travels
    upriver, finds the iguana feeding and carrying the flute, climbs the iguana's
    sunning tree, calls to it, and then descends toward the place where it is feeding.
  language: English with Zulu source text
  quote_policy: summarized
