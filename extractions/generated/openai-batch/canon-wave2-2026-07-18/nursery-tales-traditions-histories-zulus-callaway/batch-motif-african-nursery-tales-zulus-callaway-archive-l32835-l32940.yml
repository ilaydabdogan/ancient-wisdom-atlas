canonical_text:
  quote: ''
  summary: An unnamed man travels through a dark hole while following a porcupine.
    He passes a pool, sleeps, crosses a river, and continues after losing reliance
    on the porcupine's footprints. He reaches light, hears dogs and children, and
    finds a village with smoke rising. Fearing unknown inhabitants, he retreats along
    the same path, crosses the river again, passes the pool, exits the hole, observes
    that the place has features resembling those above, and returns home to his wife.
  language: Zulu with English translation
  quote_policy: summarized
