  summary: The passage lists several foods abstained from by different groups. It
    explains avoidance of certain cow flesh, pig flesh, elephant, and cattle entrails
    through fears of childbirth danger, bad resemblance appearing in offspring, famine
    necessity overriding avoidance, and fear that eating entrails may lead to being
    stabbed in the bowels.
  language: Zulu and English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The flesh of a certain cow is abstained from because women are said to risk
    becoming like the cow in childbirth, being unable to give birth, and dying with
    the child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls do not eat pig's flesh; the passage describes the pig as ugly, with
    an ugly mouth and long snout, and says girls fear pig-like resemblance appearing
    among their children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage generalizes that many things are abstained from through fear of
    bad resemblance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: It is reported that a person once gave birth to an elephant and a horse, while
    the narrator adds that the truth of this is not known.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elephant is said to produce an evil resemblance because, after being killed,
    parts of its body resemble those of a female, including breasts like those of
    a woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Young people fear eating elephant, but it may be eaten in famine from necessity;
    young women are represented as saying that giving birth to an elephant and living
