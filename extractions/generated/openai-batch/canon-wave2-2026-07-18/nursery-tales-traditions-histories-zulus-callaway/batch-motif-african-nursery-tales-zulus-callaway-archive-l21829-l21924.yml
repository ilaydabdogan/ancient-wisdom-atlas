canonical_text:
  quote: ''
  summary: A woman presented as a wife is admired for beauty but criticized because
    her head is animal-like or deformed. The king or bridegroom rejects her, while
    his sister defends her and later invites her to watch a dance. Ukandakulu fears
    public ridicule and expulsion, but the sister remains loyal and goes with her.
  language: English translation with parallel Zulu text
  quote_policy: summarized
