canonical_text:
  quote: ''
  summary: A chief's daughter looks into a pool and is drawn into it as if called.
    The chief comes with cattle to redeem his child. Spotted, red, and white cattle
    do not cause the beast to release her, but when two black hornless oxen are cast
    in, the beast releases her and eats them. She is taken out, but afterward is no
    longer as before and cannot understand anything. The tale is identified as one
    among the Amakheosa, with much lost. An editorial note introduces fabulous animals
    and compares them to domestic and other sprites of Northern nursery tales.
  language: Zulu and English
  quote_policy: summarized
