canonical_text:
  quote: ''
  summary: A chief is seized; his soldiers lose courage, the army scatters, and cattle
    are taken. The victors bring the captive to their country and send messengers
    to their own chief. That chief prepares himself because he fears the captive chief’s
    unknown medicines and dangerous presence. He calls a doctor to strengthen him,
    approaches boldly, repeatedly leaps over the captive, kills him, sits on the corpse,
    and begins cutting small portions from every part of the body. A footnote explains
    isitunzi as presence, prestige, or a terrible/reverential influence.
  language: Zulu with English translation and English note
  quote_policy: summarized
