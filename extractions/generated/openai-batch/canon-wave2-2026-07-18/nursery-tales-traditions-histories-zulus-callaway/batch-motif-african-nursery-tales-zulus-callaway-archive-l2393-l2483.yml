  quote: ''
  summary: In a Zulu-English passage, Uthlakanyana persuades the cannibal's mother
    to play at boiling each other. He chooses a great pot, enters it briefly while
    the water is not yet hot, has himself removed, then increases the fire until the
    water boils and tells the cannibal's mother that it is pleasantly warm and fit
    for her to enter.
