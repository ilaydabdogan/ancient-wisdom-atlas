  quote: "“He said he would be cooked by you, when I was absent.”"
  summary: Uthlakanyana is brought home by a cannibal who intends that his mother
    cook him. Uthlakanyana has instructed the cannibal not to beat him and to leave
    him with the mother. In the morning he asks to be put on the hut roof to dry in
    the sun, so that he can see which way the cannibal goes when leaving.
