canonical_text:
  quote: "“If you take out those cattle of your own accord, you will take yourself
    out of the chief-place.”"
  summary: After Unsukuzonke, his mother has a daughter who grows up and marries Umathlanya.
    Uzita says the daughter belongs to Ubabazeleni’s house because Unsukuzonke’s mother
    was married with cattle from that house. Unsukuzonke objects and insists on paying
    back the cattle so he can claim the benefit himself. Uzita warns that doing so
    will remove Unsukuzonke from the chief-place and from the position next after
    Ubabazeleni. Unsukuzonke proceeds, is removed from that position, and Unsilane
    is placed there temporarily until Ubabazeleni’s son grows up.
  language: Zulu with English translation
  quote_policy: quoted
