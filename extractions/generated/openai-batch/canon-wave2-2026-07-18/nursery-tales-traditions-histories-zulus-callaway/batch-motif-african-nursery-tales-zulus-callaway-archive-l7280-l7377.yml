canonical_text:
  quote: They scarified her in two places on the loins, and said, “You will now have
    a child.”
  summary: A childless royal wife is asked what she will give to be told she will
    have a child. She offers all her possessions, but the unnamed agents instead demand
    a vessel of castor-oil berries, break it outside, scatter and eat the seeds, scarify
    her loins in two places, and promise that she will have a child. She returns home
    and becomes pregnant. The passage also explains her prior loss of household status
    because of barrenness, contrasts her with other wives who gave birth to troublesome
    crows, and notes that her house had been moved from the upper part of the kraal
    to the entrance despite her queenly rank and royal birth.
  language: English translation with Zulu text
  quote_policy: quoted
