canonical_text:
  quote: ''
  summary: Uthlakanyana uses a bag of dangerous animals and a contracted doorway to
    entrap a cannibal in his house. The animals emerge, sting, bite, poison, and eat
    the cannibal. After the cannibal dies, Uthlakanyana mocks him, removes the body,
    and takes possession of the house.
  language: Zulu with English translation
  quote_policy: summarized
