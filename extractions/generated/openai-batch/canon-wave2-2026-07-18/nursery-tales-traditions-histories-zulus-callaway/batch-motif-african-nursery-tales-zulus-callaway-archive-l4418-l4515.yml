canonical_text:
  quote: ''
  summary: In a bilingual Zulu-English passage, Uthlakanyana receives a milk-pail
    from his mother after demanding his umdiancliane. He lends the milk-pail to boys
    herding sheep; when it is broken, he demands it back by reciting how he obtained
    it, and the boys give him an assagai. He then lends the assagai to other boys
    eating liver; when it breaks, he again recites the chain of prior exchanges. A
    section heading says this broken assagai results in an axe. An editorial note
    explains that Uthlakanyana speaks correctly when lending objects, but drops initial
    vowels when demanding compensation, making himself sound childlike to arouse compassion
    and produce humor.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
