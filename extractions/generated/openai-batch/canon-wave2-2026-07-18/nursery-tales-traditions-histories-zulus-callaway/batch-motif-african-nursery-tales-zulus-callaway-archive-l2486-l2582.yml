canonical_text:
  quote: "“So she was boiled, and said no more.”"
  summary: Uthlakanyana unfastens a woman's clothes despite her objection, says he
    is only game about to be eaten by her and her sons, puts her into a covered container,
    and refuses to take her out while she cries that she is being scalded and done.
    He argues that her speech proves she is not yet fully scalded or done; when she
    falls silent, he declares she is done and says her children will eat her.
