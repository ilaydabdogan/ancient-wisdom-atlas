canonical_text:
  quote: ''
  summary: Long-toe/Uzembeni pursues Usikulumi and a damsel. They climb a lofty yellow-wood
    tree while dogs remain below. Long-toe arrives with an axe and tries to cut down
    the tree. The dogs attack and tear her body apart. The tree immediately restores
    itself, and Long-toe comes to life again, her limbs rejoining before she resumes
    hewing.
  language: Zulu with English translation
