canonical_text:
  quote: "“Take a water-vessel, Ubalatusi, and go and fetch water from the river.”"
  summary: A group identified as leaves enters a house and sends Ubalatusi to fetch
    water from the river. When her water-vessel is full, Ubalatusi cannot leave the
    river. The leaves then send Umkccakaza to look for water at home despite her objection
    that she is of age and does not leave the umgong'o. She fetches water from another
    house. The leaves then order her to light a fire, and she says she cannot.
