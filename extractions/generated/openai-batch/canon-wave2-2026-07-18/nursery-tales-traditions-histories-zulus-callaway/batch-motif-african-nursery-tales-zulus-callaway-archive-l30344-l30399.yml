canonical_text:
  quote: ''
  summary: A Zulu account reports that old men say the rainbow is a sheep that comes
    out of great pools, rests on rocks, and appears when the sky is clouded. A man
    who goes out in the morning may be poisoned by it, shown by an eruption, and must
    be treated by a rainbow-doctor. An editorial footnote compares Dahoman Danh as
    snake or rainbow, the Heavenly Snake, and notes a pool name glossed as Snake or
    Rainbow-water-in.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
