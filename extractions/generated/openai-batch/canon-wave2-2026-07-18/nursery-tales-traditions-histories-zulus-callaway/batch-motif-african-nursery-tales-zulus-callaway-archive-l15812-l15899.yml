canonical_text:
  quote: ''
  summary: A boy named Umbadhlanyana, son of Umakgubata, likes hunting. After he kills
    and carries a very small bird called an ukcilo, many cannibals surround him. One
    cannibal takes and eats the bird. Umbadhlanyana contracts himself, becomes short,
    and enters the cannibal's nostrils, speaking from there as the cannibal sneezes
    and tells him to come out. Footnotes explain the small-person implication of Umbadhlanyana's
    name, the smallness of the ukcilo, and an editorial comparison with Norse Thumbikin
    in a horse's nostril.
  language: Zulu and English
  quote_policy: summarized
