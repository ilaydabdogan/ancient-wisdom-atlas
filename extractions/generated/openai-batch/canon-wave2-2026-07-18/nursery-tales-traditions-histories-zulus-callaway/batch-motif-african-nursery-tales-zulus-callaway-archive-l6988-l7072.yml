canonical_text:
  quote: ''
  summary: In this passage, a male speaker's spittle gives royal praise. He tells
    Untombinde to light a fire; after she does so, she sees his shining body and is
    afraid and amazed. He asks what she will report in the morning, asks after the
    grieving mother of Unthlatu, says he lives underground after being lost as a small
    child, and begins to explain that he left because of his brethren. Editorial notes
    compare speaking spittle to a cited version of “The Battle of the Birds” and clarify
    kinship usage.
  language: English translation with Zulu parallel text
  quote_policy: summarized
