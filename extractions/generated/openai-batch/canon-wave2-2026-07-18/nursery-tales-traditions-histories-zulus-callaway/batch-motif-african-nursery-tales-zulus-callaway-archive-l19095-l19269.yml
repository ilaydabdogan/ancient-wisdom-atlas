canonical_text:
  quote: ''
  summary: In this bilingual Zulu-English passage, a preceding fragment describes
    slaughter, meat, and cattle. Umkxakaza has remained for uncounted years in the
    umgon^o, known only to damsels who prevent others from seeing her. Before she
    is to come out, the people go to the king's royal garden while beer is being prepared
    in her father's village, leaving Umkxakaza and her sister Ubalatusi alone. After
    the people depart, thunder and earth movement occur; Ubalatusi goes out and sees
    a forest at the village entrance, with the fence broken down. As the sisters speak,
    two leaves break off from a tree whose name is cut off in the excerpt. An editorial
    footnote compares this episode to traditions of speaking trees.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
