canonical_text:
  quote: ''
  summary: In a night episode, the oribes place an unnamed female at the outside border
    of her village and return before morning. They then plan how to hide that they
    helped her flee, deciding to smear mud on the hyenas' legs so the chief will think
    the hyenas took and ate the chief's game. In the morning the animals notice the
    missing game, suspect the oribes, and the oribes propose that the chief inspect
    everyone's feet for traces of travel.
  language: English translation with Zulu source text
  quote_policy: summarized
