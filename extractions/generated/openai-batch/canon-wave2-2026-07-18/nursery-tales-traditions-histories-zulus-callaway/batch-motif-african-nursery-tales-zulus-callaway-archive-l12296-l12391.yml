canonical_text:
  quote: ''
  summary: A bridal party sets out the next morning. The bride and bridegroom ride
    on two large oxen, with soldiers ahead and the bride’s damsels behind. On high
    land they see an animal that the bride’s mother had warned them not to kill or
    pursue. The soldiers pursue it despite the bride’s warning, and the bridegroom
    dismisses her concern. After waiting in the sun, the bridegroom leaves to bring
    the soldiers back. The bride and damsels wait a long time; the bride says she
    is tired and wants water. An Imbulu arrives, greets them as beautiful princesses,
    and the heading says it accosts and deceives the bride. A footnote describes the
    Imbulu as a large land lizard associated in local explanation with drinking cows’
    milk.
  language: Zulu with English translation and English note
  quote_policy: summarized
