canonical_text:
  quote: ''
  summary: In the morning Umkrakaza sits outside and sees two leaping beings. They
    sit under a tree, go to the tobacco garden, pluck tobacco, notice footprints,
    put the tobacco outside, and enter the cave. Umkrakaza then thrusts out both hands
    and recognizes the beings as Amadhlungundhlebe. Editorial notes comment on the
    beings' strange dialect and compare them with half-men or one-legged beings in
    other traditions.
  language: English translation with Zulu source text present
