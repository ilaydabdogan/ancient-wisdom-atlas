canonical_text:
  quote: The elephant seized her and swallowed her too.
  summary: A woman repeatedly asks to be shown the elephant that ate her children.
    The elephant tries to send her onward, then swallows her. Inside its stomach she
    finds landscapes, settlements, people, animals, and her children. She feeds the
    children amasi, tells them the beast can be eaten, makes a fire, and cooks and
    eats the elephant's liver and flesh with them. The other people inside then also
    cut and eat.
  language: Zulu with English translation
  quote_policy: quoted
