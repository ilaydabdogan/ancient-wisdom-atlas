canonical_text:
  quote: ''
  summary: In this fragment, Untombi-yapansi repeatedly shouts an announcement that
    Usilwanekazana has been killed by Usilwane, who says she killed the prince's leopard
    without cause. An old woman in the royal garden hears and reports the distant
    shouting; the king orders her seized and cast outside the garden, and she is killed
    because people say she is prophesying evil against the king's child. Untombi-yapansi
    then goes to another small elevation and shouts again. An old man hears and reports
    the message; the chief orders him seized and cast outside the garden. The passage
    ends as Untombi-yapansi goes near the people and begins to shout a third time.
  language: Zulu and English
  quote_policy: summarized
