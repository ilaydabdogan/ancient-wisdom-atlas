canonical_text:
  quote: ''
  summary: In a Zulu-English parallel passage, resident children and the Abahhwebu
    exchange information about their homes, peoples, and kin status. The children
    identify their hill village, the house near the main entrance, and their mother
    as a former queen whose house was moved because she had no child. The Abahhwebu
    say they are a small troop seeking a very beautiful damsel for their king’s first
    marriage. After they leave, the boy helps place a water-vessel on the girl’s head,
    the children return uphill, and their mother questions them about fetching water
    after she had forbidden them to go outside.
