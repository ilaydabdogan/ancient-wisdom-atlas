  quote: 'It happens because of affliction: because she gave birth to a snake.'
  summary: In this excerpt, participants identify the one who followed them and the
    named child identifies his mother. The mother's house is said to be at the gateway
    because she gave birth to a snake. The father commands cattle to be gathered,
    gifts are given in connection with Untlilatu-yesiziba and his younger sister,
    and Untlilatu-yesiziba refuses the father's invitation to go to the head house,
    choosing his mother's house instead.
