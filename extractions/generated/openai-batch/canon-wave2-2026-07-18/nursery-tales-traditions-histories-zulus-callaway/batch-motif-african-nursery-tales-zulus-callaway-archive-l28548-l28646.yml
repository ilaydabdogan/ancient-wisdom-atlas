canonical_text:
  quote: ''
  summary: A snake is born after many days and fills the house. A man locates its
    head and fastens a cord to its neck. Unthlatu-yesiziba says he heard, though he
    did not see, Unthlangunthlangu command that the snake be cast into a pool. The
    snake is dragged and cast into water. Unthlatu-yesiziba says he went up to the
    snake's mouth, put out his hand, removed the skin, and ten persons came out and
    stood in birth order.
  language: Zulu with English translation
  quote_policy: summarized
