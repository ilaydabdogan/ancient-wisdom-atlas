canonical_text:
  quote: ''
  summary: Usilosimapundu departs, leaving Umkxakaza alone in a cave with sugarcane
    and maize. She sleeps there, eats selected middle portions of the food in the
    morning, and later sees a strange being approach from the high land. The being
    sits under a lone tree, leaps toward the place, enters a tobacco garden, is frightened
    by footprints, enters the cave, sees Umkxakaza's hand, and flees, leaving the
    tobacco behind.
  language: Zulu with English translation
  quote_policy: summarized
