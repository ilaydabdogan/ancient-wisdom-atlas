canonical_text:
  quote: ''
  summary: A ruler summons the tribe and orders them to follow and kill a boy. When
    the boy hears the pursuers near, he addresses Ubongopa-kamagadhlela and calls
    for standing still because enemies are killing them. The cattle stand still. The
    pursuers accuse the boy of magic, tell him to come down and stand away from the
    cattle, and repeatedly throw assagais at him; the assagais strike the ground instead
    of hitting him. The boy jeers at them and asks for an assagai to stab at them.
    After further failed throws, the pursuers say they are worsted and invite him
    to try. A footnote compares the failed missiles with a scene in the Odyssey where
    Minerva turns aside weapons hurled at Ulysses.
  language: Zulu with English translation
  quote_policy: summarized
