canonical_text:
  quote: ''
  summary: Usitungusobenthle and her children are on the far side of the sea when
    the Amajubatente army arrives. She offers to ferry the army across with a long
    rope, but when many hold the rope and are in the sea, she cuts it with a sharp
    stone so they are carried away. She repeats the deception with another group,
    pretending each time that the loss was accidental. Editorial notes compare the
    episode to other tales involving pursued figures, water crossings, and drowned
    pursuers.
  language: English translation with Zulu source text present
  quote_policy: summarized
