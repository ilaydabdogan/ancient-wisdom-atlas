canonical_text:
  quote: ''
  summary: 'The passage first closes an episode in which children’s kin knowledge
    and knowledge of family names lead to a concealed sister being restored to her
    brother after repayment to those who raised her; this is called a case of the
    navel. The narrator then introduces a related, remembered matter from a time of
    political upheaval and scattering: Umagushu marries Umanjonga, but during the
    family’s dispersal she leaves on the road, returns to her own people, and is lost
    to her husband amid general confusion.'
  language: Zulu with English translation
  quote_policy: summarized
