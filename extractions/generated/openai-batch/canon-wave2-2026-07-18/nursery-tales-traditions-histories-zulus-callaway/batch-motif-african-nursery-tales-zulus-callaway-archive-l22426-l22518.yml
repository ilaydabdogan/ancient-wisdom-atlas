  summary: In this segment of the tale, the younger brother reports that he was told
    to hew a tree, from which livestock emerged and was assigned to him. He says the
    elder left him in the water. The father, mother, and others arrange a rope rescue
    from the foot of a precipice. After the younger is drawn up and recounts the journey,
    the family returns home and finds that the elder son has fled to an unknown place.
