canonical_text:
  quote: ''
  summary: The passage explains rules of inheritance in polygamic households. Sons
    and houses are ranked according to the cattle used to marry their mothers. A son
    linked to the chief house has priority; a lower-ranked son may live separately
    and can take the chief place only if no one remains from the chief house. Bridewealth
    cattle from daughters can return to the chief house and be used to marry further
    wives. The example of Uzita, Ubabazeleni, and Unsukuzonke illustrates how succession
    is arranged to avoid disputes.
  language: Zulu original with English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the father of a specified son is head of the whole
    village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son whose mother was married with his father's cattle does not remain in
    the hereditary estate village; he leaves and has his own village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: That son remains inferior to the son whose mother was married with the cattle
    of the chief house, but he may take the chief place if no one remains from the
    chief house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the chief house takes a wife with its cattle and she has a female child,
    the child is treated as belonging to the chief house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the female child is married, the cattle received as her dowry can be
    used by the son of the chief house to take a wife.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The son of the chief house may place the wife in the kraal according to his
    pleasure, because the village is his own.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the example, Uzita married the mother of Ubabazeleni; she became chief
    wife and gave birth to Ubabazeleni, described as Uzita's chief son.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cattle belonging to Ubabazeleni's house later married the mother of Unsukuzonke,
    making Unsukuzonke Ubabazeleni's brother and a recognized inheritor if Ubabazeleni
    and his offspring died.
  category: sequence
  evidence_refs:
  - ev:5
