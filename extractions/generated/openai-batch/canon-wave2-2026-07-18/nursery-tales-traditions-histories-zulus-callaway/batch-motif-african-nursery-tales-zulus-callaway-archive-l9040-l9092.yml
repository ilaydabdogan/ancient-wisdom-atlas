  quote: ''
  summary: 'A sequence of beings comes out into the world: first a fowl, then a man,
    a bullock, a dog, a goat, a sheep, and then all other things. Each named being
    expresses that it sees the world again after a long absence or confinement. Men
    then build houses again, are happy again, and all things return to their former
    condition.'
