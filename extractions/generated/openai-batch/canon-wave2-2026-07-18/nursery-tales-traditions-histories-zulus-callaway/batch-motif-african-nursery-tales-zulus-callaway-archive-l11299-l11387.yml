  summary: A woman is directed through a sequence involving a horn, a lancet, turning
    her back, scarification or cupping at the loins, and the collection of clotted
    blood. She is told to pour the clot into a large vessel and leave it until two
    moons have passed. Later she finds two children in the vessel. An editorial footnote
    compares this unusual birth to several other legends of extraordinary generation.
