canonical_text:
  quote: This, then, is the laughing of fire.
  summary: The passage gives the end of a riddle explanation in which fire is associated
    with burnt children, a father killed in a burning house, a wife and child burnt
    together, withered trees, and starving cattle. It then lists the answer to another
    riddle as “The eye,” followed by a note comparing that riddle to “The Belly and
    the Members.” A further riddle answer, “A stone,” is explained through the stone’s
    use in blocking a gateway or grinding, described as work that only the stone can
    do.
