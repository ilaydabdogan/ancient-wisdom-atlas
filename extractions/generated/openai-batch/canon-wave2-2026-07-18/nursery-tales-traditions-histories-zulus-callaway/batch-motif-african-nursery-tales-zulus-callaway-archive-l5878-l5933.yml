canonical_text:
  quote: ''
  summary: Usikulumi travels to Uzembeni's place to choose a girl. On the way a swallow
    warns him and instructs him to skin it so that its skin can warn him of Uzembeni.
    The skin, sewn and placed in sticks, speaks to Usikulumi, warns him at night when
    Uzembeni creeps toward him, tells him when to leave in the morning, and later
    directs him toward a tree during flight with the girl.
  language: Zulu with English headings
  quote_policy: summarized
