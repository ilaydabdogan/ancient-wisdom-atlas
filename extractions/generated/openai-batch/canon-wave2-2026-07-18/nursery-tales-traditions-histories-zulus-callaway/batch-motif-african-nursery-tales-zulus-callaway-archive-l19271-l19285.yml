canonical_text:
  quote: ''
  summary: 'An editorial note quotes the tale “Lilia Rosa”: while on the sea-shore,
    Lilia Rosa finds a fawn’s head and leg, places the leg on a pole for birds, sleeps,
    wakes to music, and sees the leg transformed into a linden and the head into a
    nightingale. The tree’s leaves and the nightingale together produce a heavenly
    harmony.'
