canonical_text:
  quote: where it died, a fire was kindled.
  summary: After getting out, a party fires and meets eight Dutchmen. The party says
    it is safe, reports that one horse hid and was helped by another, and says it
    fired at a snake. At the place where the snake died there is fire or smoke. The
    party finds a great, man-sized, very long snake with fat running out and proposes
    fetching a wagon to carry it away.
