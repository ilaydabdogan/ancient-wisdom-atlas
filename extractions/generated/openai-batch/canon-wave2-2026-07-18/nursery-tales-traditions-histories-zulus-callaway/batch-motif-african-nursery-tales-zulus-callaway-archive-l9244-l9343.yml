canonical_text:
  quote: ''
  summary: In this excerpt, the Isikgukgumadevu leaves to summon others because it
    cannot conquer the strong damsel. Another animal warns the damsel to go away;
    she takes her garment, comes up out of the water, and returns home. At home, other
    girls claim that signs of puberty have come upon her, while she tells her mother
    they left her with the Isikgukgumadevu. Her mother tells her father; the father
    arms himself, demands to see his child, and confronts the girls, who mock and
    refuse him. The excerpt ends as he enters the hut and pulls aside the mats. A
    section heading states that the other girls deceive the parents and are killed.
  language: Zulu and English
  quote_policy: summarized
