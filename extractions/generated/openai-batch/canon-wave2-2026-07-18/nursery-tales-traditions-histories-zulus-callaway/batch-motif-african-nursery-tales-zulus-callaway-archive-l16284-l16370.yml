  summary: Appendix commentary discusses Zulu legends of long-haired cannibals or
    Amazimu, surveys reported long-haired African groups, compares Scotch Highland
    Gruagachs, and proposes that cannibal legends may arise from slave-raiding, intergroup
    fear, metaphorical uses of “eat,” nursery warnings, and broader examples such
    as Anthropophagi and an Arabian Nights passage.
  language: English
