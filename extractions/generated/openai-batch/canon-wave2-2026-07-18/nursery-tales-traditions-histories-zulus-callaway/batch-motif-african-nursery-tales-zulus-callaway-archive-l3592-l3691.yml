canonical_text:
  quote: ''
  summary: In a bilingual Zulu-English passage, Uthlakanyana refuses to release a
    cannibal, takes meat into a house, shelters during hail, rain, and lightning,
    and the cannibal dies on the house-top after being struck by hailstones. Uthlakanyana
    then eats the cow alone and travels on. In the next episode opening, he meets
    another cannibal carrying a large musical calabash and calls him uncle; the cannibal
    denies knowing him or being his uncle.
  language: Zulu and English
  quote_policy: summarized
