canonical_text:
  quote: ''
  summary: The mother names the girl Ukcombekcantsini, while the boy refuses a present
    name and says he will receive a manhood name from his father when grown. Later,
    while the mother is absent, the girl persuades the boy to go outside to fetch
    water at the river, despite their mother's prohibition. The children fill a water-vessel;
    the boy is described as white and the girl as very shining. A line of many people
    comes to the river and asks for water, and the boy gives each person water to
    drink.
  language: English translation with Zulu source text
  quote_policy: summarized
