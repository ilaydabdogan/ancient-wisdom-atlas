canonical_text:
  quote: ''
  summary: Umkxakaza says her household milk-calabash is too large for her to carry
    alone and requires three people. The personified leaves go with her, fetch the
    calabash, pour amasi into vessels, arrange ground corn and amasi with baskets
    and a spoon, and send these to Usilosimapundu. Usilosimapundu swallows the ground
    corn, baskets, amasi, and spoon. A leaf then returns to the house, tells Umkxakaza
    to take down three spoons, and urges her to eat amasi; she begins to refuse, saying
    she does not eat amasi, but the supplied passage cuts off mid-sentence.
  language: Zulu with English translation
  quote_policy: summarized
