canonical_text:
  quote: ''
  summary: Ulangalasenzantsi survives spear attacks, obtains the children of his people
    from Ulangalasenthla, and departs. Ulangalasenthla then sends an army to kill
    him and the children. Ulangalasenzantsi reaches a great flooded red river, raises
    his royal rod, and the river is stayed so that his party can cross. When the pursuing
    army enters the river after him, he lowers the rod and the river overwhelms them.
    The children rejoice, but Ulangalasenzantsi and many older people die during the
    later journey; the young survivors and one man reach their own country.
  language: Zulu with English translation
  quote_policy: summarized
