canonical_text:
  quote: ''
  summary: A male figure returns with cattle, calls Ubongopa-kamagadhlela into the
    pen, and eats on top of his ox. He grows up without knowing fire, without wearing
    a garment, and without touching the ground. Thieves from another tribe repeatedly
    try to steal the cattle at night, but the cattle do not rise when beaten and the
    thieves' sticks break. In the morning, the male figure wakes the named ox and
    commands the herd to graze and return.
  language: Zulu with English translation
  quote_policy: summarized
