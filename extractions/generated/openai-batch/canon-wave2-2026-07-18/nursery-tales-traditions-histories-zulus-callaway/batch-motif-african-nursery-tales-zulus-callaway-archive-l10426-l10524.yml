canonical_text:
  quote: ''
  summary: 'The passage first concludes the Ubabuze episode: the hyenas beg Ubabuze,
    he gives them nothing, the damsel’s brother kills the hyena chief, and all the
    hyenas die. Ubabuze’s party returns home with the bride; people lament because
    they expected his death, many oxen are killed, the marriage is celebrated, the
    bride becomes queen, and her brothers and the marriage party remain there. The
    passage then begins UMUNTU NENYONI, where a famine and absence of cattle are described,
    a woman goes to dig in a garden or field, and a bird called umvemve, glossed as
    a wagtail, comes; the heading says her labor is made useless by the wagtail.'
  language: Zulu with English translation
  quote_policy: summarized
