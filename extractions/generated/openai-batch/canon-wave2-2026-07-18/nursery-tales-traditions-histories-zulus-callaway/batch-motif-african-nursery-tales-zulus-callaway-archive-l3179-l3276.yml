canonical_text:
  quote: ''
  summary: In this portion of a Uthlakanyana tale, Uthlakanyana has already eaten
    one of a leopard's cubs and manipulates the return of the remaining cub. After
    skinning and cooking a buck, he enters a house and invites the leopard in. He
    has prepared the doorway so that the leopard will be delayed, and he escapes through
    a long hole in the house. When the leopard follows and comes to the doorway, she
    is pierced by four assagais fixed there and dies.
  language: Zulu with English translation
  quote_policy: summarized
