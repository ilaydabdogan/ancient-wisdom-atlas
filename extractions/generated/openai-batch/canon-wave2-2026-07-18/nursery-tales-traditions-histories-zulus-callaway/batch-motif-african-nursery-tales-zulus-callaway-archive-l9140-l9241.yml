canonical_text:
  quote: ''
  summary: A being called Isikgukgumadevu takes the garments of damsels at the water.
    The damsels ask for their garments and receive them, but the princess Uluthlazase
    refuses to ask. The other damsels leave her. Uluthlazase seizes and fights Isikgukgumadevu
    for her garment; it drags her and sinks with her into a pool, where neither can
    overcome the other and both rest or sleep from exhaustion.
  language: English with Zulu source text present
  quote_policy: summarized
