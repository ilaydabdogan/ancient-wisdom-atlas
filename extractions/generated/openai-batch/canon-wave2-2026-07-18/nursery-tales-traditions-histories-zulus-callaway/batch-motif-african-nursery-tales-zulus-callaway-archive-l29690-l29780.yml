  summary: Relatives question the wife of their uncle about the child she carried
    when she left; she says she miscarried. Later they see a girl who resembles their
    family. Although they lack proof and are told the child died, they feel bodily
    kinship through the navel. At her marriage the girl names Umagushu as her father,
    and she is called Umamagushu in the kraal into which she marries.
