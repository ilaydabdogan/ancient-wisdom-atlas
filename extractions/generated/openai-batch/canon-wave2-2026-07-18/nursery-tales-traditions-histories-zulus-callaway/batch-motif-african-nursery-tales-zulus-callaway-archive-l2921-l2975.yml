canonical_text:
  quote: ''
  summary: Uthlakanyana at first refuses to lend his whistle or flute to an iguana,
    fearing the iguana may carry it into the river pool because it lives in deep water.
    After the iguana moves to open country, Uthlakanyana lends it the whistle. The
    iguana refuses to return it, strikes Uthlakanyana with its tail, and goes into
    deep water with it. Uthlakanyana then goes elsewhere, steals hidden bread belonging
    to an old man, runs into a snake's hole, and tricks the old man into releasing
    him by saying the old man has caught a root.
  language: English
  quote_policy: summarized
