canonical_text:
  quote: ''
  summary: An old woman from another royal household goes to fetch water, hears a
    child playing, and finds the child by the river. She brings the king’s chief wife
    to see the child; the child is washed, carried home by the queen, suckled and
    raised with the queen’s son. The girl grows up, is appointed chief of the girls,
    and a feast with slaughtered cattle is held. Later, chief men tell the queen’s
    son to marry her, and he objects that she is his sister because they nursed together
    from his mother.
  language: English translation with Zulu source text present
