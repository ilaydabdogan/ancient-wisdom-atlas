canonical_text:
  quote: ''
  summary: The preface discusses orthographic choices for writing Zulu, especially
    the representation and analysis of click sounds. It cites several scholars and
    observers on whether clicks were borrowed from Hottentot languages, how clicks
    occur in Kafir/Zulu and Hottentot speech, and whether the click sign should precede
    or follow associated consonants. The passage is philological rather than mythic-narrative.
  language: English
  quote_policy: summarized
