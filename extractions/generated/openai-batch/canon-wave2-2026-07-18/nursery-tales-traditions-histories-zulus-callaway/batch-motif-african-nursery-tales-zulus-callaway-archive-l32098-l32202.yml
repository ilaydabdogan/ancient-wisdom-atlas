canonical_text:
  quote: ''
  summary: A chief goes to Udalana's watch-house while Udalana and Untombi-yapansi
    go to the garden. Untombi-yapansi notices the absence of dew and suspects someone
    is present. In the garden, birds are not driven away by the usual method, and
    Udalana explains this to the chief. Untombi-yapansi refuses to bathe, perceives
    someone in the garden because of the missing dew, and later returns with Udalana
    after the chief leaves.
  language: Zulu with English translation
  quote_policy: summarized
