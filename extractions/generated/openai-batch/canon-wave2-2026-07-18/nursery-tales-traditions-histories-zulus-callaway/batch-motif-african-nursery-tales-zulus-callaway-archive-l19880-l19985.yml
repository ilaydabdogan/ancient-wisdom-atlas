canonical_text:
  quote: "“my child is taken away by the beast who was plundered of his cattle.”"
  summary: A mother and Ubalatusi arrive home and find signs of disturbance. The mother
    cannot find her child, concludes that a beast has taken the child, and alerts
    the men. The men arm themselves, follow the beast’s tracks, and confront it. The
    beast waits, laughs, urges them to act quickly before sunset, and their thrown
    spears miss, landing in a pool, on a rock, and in grass.
