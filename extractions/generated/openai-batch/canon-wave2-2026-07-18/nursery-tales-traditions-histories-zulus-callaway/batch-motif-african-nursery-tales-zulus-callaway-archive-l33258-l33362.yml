canonical_text:
  quote: "“when they saw that he was a snake, they fled”"
  summary: The passage reports a father's speech about a medicine or hand-touch by
    which children were said to die, while the snake did not die. Later, grown maidens
    come to choose husbands; some choose Unsimba and some Umamba, but those who see
    Umamba flee because he is a snake. The father, who loves Umamba, says Unsimba
    must not marry before Umamba, while Unsimba laughs and Umamba's mother dismisses
    the prohibition.
  language: English translation with Zulu source text present
  quote_policy: quoted
