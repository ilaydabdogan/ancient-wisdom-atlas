canonical_text:
  quote: the hyrax went without a tail because he sent other animals for it
  summary: 'A fable explains why the hyrax has no tail: when tails were distributed,
    rain and clouded sky kept the hyrax in its hole, so it asked tailed animals to
    bring back its tail; they returned with tails, but the hyrax never received one
    and therefore cannot use a tail to drive away flies.'
