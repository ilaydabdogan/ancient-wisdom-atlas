canonical_text:
  quote: ''
  summary: Umkxakaza is observed by the Amadhlungundhlebe, who remark on her two legs
    and hands; they are described as one-sided beings. They dance for her, take her
    to their chief’s large village, feast her with cattle meat, and the chief loves
    her and calls her his child. She lives in the dark royal dwelling, with a white
    royal dwelling lower in the village. She grows extremely fat, becomes unable to
    walk far, leaves a pool of fat when she rises, and the chief drinks it. The passage
    heading states that the Amadhlungundhlebe wish to kill her.
  language: Zulu and English
  quote_policy: summarized
