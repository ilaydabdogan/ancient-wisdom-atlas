canonical_text:
  quote: I am come from the men who live underground.
  summary: A man named Uncama returns after being thought dead. His wife says his
    belongings were buried or burned. He explains that he followed a porcupine, reached
    people living underground, saw signs of an inhabited village, and returned out
    of fear. A narrator says the tale made people afraid to enter ant-bear holes.
    An editorial note compares a subterranean feat of Senuttaro among the Nagas with
    one ascribed to Untombi-yapansi.
  language: Zulu original with English translation and English editorial note
  quote_policy: quoted
