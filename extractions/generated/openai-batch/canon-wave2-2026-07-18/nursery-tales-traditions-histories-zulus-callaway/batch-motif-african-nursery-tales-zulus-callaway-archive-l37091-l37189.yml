canonical_text:
  quote: ''
  summary: An unnamed man takes more bread than he can eat while traveling. Because
    he is full and does not want to carry the surplus, he throws the bread beside
    the path. After many days, mice have eaten it. Later, during a famine when roots
    are being dug for food, he passes the same place, remembers the bread, searches
    for it in the grass, and does not find it.
  language: Zulu and English
