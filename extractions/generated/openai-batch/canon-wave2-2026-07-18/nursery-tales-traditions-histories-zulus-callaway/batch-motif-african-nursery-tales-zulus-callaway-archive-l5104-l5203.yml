canonical_text:
  quote: ''
  summary: Usikulumi is recognized by his uncle, who rejoices, assembles his tribe,
    gives him oxen, and holds a feast. Usikulumi then goes to his father's kingdom.
    His father is told that the son he cast away in the great forest has returned;
    the father is troubled, assembles the nation with weapons, orders Usikulumi killed,
    and commands that he be stabbed with a spear. Usikulumi stands in an open space
    and invites the spear attack, confident that he will not die.
  language: Zulu with English translation
  quote_policy: summarized
