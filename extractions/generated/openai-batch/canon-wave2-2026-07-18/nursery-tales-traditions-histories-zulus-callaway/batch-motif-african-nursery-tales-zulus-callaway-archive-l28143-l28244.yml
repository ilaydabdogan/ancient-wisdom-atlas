canonical_text:
  quote: ''
  summary: A group of children travel seeking their mother. They repeatedly strike
    an ox called Umpengempe and tell it to cry while they recite that their mother
    only gave birth to them, did not nourish them, and that they ate earth and grew.
    They arrive at the village where their mother was born and stand at the gateway.
    An old woman comes out, recalls that her child gave birth to a beast that was
    cast out, and the children are asked to repeat the ox-crying act. They are then
    told to dismount from the oxen, refuse, and cattle are fetched, including two
    oxen, while they are asked whose children they are.
  language: English translation with parallel Zulu text
  quote_policy: summarized
