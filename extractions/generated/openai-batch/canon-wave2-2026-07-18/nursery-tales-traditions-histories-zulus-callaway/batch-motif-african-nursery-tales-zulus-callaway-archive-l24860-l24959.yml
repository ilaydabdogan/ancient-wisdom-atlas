canonical_text:
  quote: ''
  summary: A frog travelling with or carrying Umdhlubu is repeatedly threatened by
    passers-by who want to kill it. The frog declares that it is only a frog, will
    not be killed, and is taking Umdhlubu to her own country. The people leave it
    alone. Later it encounters men and then boys herding cattle, including a boy identified
    as Umdhlubu’s father’s son or her half-brother, who calls for the great frog to
    be killed with sharp sticks.
  language: Zulu and English
