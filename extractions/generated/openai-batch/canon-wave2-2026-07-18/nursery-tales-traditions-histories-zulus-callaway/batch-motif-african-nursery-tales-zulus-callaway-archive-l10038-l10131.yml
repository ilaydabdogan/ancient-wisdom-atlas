canonical_text:
  quote: ''
  summary: An unnamed speaker says he did not see where a man died and did not see
    or bury other brethren who died during a difficult journey through enemies. The
    surviving people remain, build houses, rejoice, and again become a great people.
    The tale is described as an old myth or legend among the people, of unknown origin
    and older than the arrival of white men. An editorial footnote compares the tale
    with Moses and Pharaoh, discusses possible routes of transmission, and notes other
    water-dividing escape traditions involving Usitungusobenthle and Heitsi Eibip.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
