canonical_text:
  quote: ''
  summary: 'The excerpt recounts naming and coming-of-age material connected with
    Umkccakaza/Wakoginggwayo. A female is named after an episode in which an army
    killed many men; another child, Ubalatusi, is named because she resembles brass.
    Umkccakaza’s father promises that when she comes of age many cattle, seized by
    spear from distant nations, will be gathered to bring her home. When she declares
    her maturity to other damsels, they rejoice, summon others, remain with her, and
    then plunder the village. An explanatory note describes the Zulu custom of ukubuyisa
    for a royal princess’s maturity: she leaves home for the wilds, is brought back
    by the slaughter of a bullock, and a period of festive disorder and property-taking
    is tolerated.'
  language: English translation with Zulu original terms
  quote_policy: summarized
