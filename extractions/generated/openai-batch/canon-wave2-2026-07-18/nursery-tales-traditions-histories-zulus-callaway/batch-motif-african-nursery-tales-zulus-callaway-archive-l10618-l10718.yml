canonical_text:
  quote: ''
  summary: A woman tells her husband that a bird comes while she is digging, claims
    the land as its father's, and commands the clods, seed, handle, and pick to undo
    the cultivation. The next morning the husband hides near her, hears the bird,
    chases it over a hill, and catches it. The bird asks to be released and offers
    to make whey; after the man drinks it, he asks for curds, which the bird makes,
    and the man eats.
  language: Zulu and English
  quote_policy: summarized
