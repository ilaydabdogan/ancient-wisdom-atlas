canonical_text:
  quote: ''
  summary: At a pool, people see a person who says he is held by the foot and then
    sinks; the people say he has been devoured by the tortoise, and an ox is selected
    as part of reporting the matter to Ungonyama, father of IJbithla. Later boys playing
    by the Umtshezi river mistake a tortoise for a beautiful rock and make cattle-pens
    on it with cowdung. A little boy says the rock has eyes and thrusts a stick into
    the tortoise's eye, but the others deny it. On another day the tortoise turns
    over with the boys and goes with them into the pool; one little boy escapes at
    a distance and reports what happened.
  language: English translation of Zulu narrative
  quote_policy: summarized
