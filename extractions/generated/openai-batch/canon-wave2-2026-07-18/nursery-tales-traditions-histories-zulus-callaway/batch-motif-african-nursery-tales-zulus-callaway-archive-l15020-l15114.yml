canonical_text:
  quote: They looked up, and saw the girl sitting on the very top, on a mere bird’s
    twig.
  summary: A girl hidden at the top of a tree is discovered when water from her leaking
    vessel falls on cannibals below. The cannibals repeatedly try to cut down the
    tree with axes, but whenever it is about to fall it settles back and becomes firm
    as before. The girl's brother dreams that his sister is being eaten by cannibals
    near a known place, and in the morning he sets out with his very great dogs toward
    the place of the dream.
