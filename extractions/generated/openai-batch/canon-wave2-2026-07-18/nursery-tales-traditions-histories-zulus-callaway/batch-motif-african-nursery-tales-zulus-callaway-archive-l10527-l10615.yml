canonical_text:
  quote: ''
  summary: A woman repeatedly goes to cultivate land, but each time finds her previous
    work erased. A bird, identified in the editorial note as a wagtail, perches on
    a tree before her and declares the land to be its father's land, which it refuses
    to allow to be cultivated. The bird commands the clods to return, the seed to
    scatter, the pick-handle to break, and the pick to fly off; the commands are fulfilled,
    making the woman's labor vain.
  language: Zulu with English translation
