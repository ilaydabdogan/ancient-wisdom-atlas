canonical_text:
  quote: ''
  summary: Uluthlazase the princess governs or becomes queen with the young girls.
    Her father slaughters cattle to gladden her because she had been carried away
    by the Isikqukgumadevu. The fathers of the damsels thank the male figure credited
    with taking their children out of the Isikqukgumadevu and killing it. A following
    note describes the Isikqukgumadevu as a hairless, long, large animal that swallowed
    young girls without eating them.
