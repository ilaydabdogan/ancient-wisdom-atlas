canonical_text:
  quote: ''
  summary: The appendix comments that several Zulu tales refer to persons descending
    into water, remaining there, and returning unharmed. It summarizes traditions
    of people coming from below and revealing themselves in water, heavenly men and
    a king of heaven, and tales of men descending to lower regions and returning to
    report what they saw. It states that earth, heaven, water, and underground are
    imagined as inhabited, and that underground people, or abapansi, are supposed
    to be departed dead living materially. The author compares these beliefs cautiously
    to Virgil, Dante, Arabian Nights, and Undine.
  language: English
  quote_policy: summarized
