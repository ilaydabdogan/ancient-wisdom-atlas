canonical_text:
  quote: ''
  summary: 'The passage gives an editorial note on the wooden pick called uhlakulo,
    then narrates episodes of Uthlakanyana: he has been carried across a river while
    transformed into a stick; he lures, kills, roasts, and eats a hare and makes a
    whistle from a bone; an iguana in a tree asks to borrow the whistle and Uthlakanyana
    loses it; in a later episode he steals bread and attempts misdirection when seized.'
  language: Zulu with English translation and editorial notes
  quote_policy: summarized
