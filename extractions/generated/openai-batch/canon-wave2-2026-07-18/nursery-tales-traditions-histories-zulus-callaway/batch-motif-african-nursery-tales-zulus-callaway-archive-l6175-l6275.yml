canonical_text:
  quote: ''
  summary: Two wedding companies ask merchants to judge which girl is prettiest. The
    merchants praise Utintakabazana but say she is not equal to Untombinde, the king’s
    child, using several flattering images; Utintakabazana’s marriage company kills
    the merchants. The groups later bathe at the river or pool of the Ilulange after
    removing ornaments and clothing. A little girl discovers the possessions are gone,
    and the girls identify the Isik^uk^umadevu as the one who took them; one girl
    petitions it to return her things. Notes explain the praise imagery and describe
    the Isik^uk^umadevu as a bloated, squatting, bearded monster, with reported interpretations
    connecting the tale to a first large ship or to Noah’s ark.
  language: English translation with Zulu parallel text
  quote_policy: summarized
