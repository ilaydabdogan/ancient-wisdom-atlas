canonical_text:
  quote: ''
  summary: A tale episode presents an unnamed male in a tree while Uzembeni attacks
    the tree. Dogs tear Uzembeni apart, and a speaking skin warns that she is dead
    but will revive and tells the male to descend and go quickly. Uzembeni later reconstitutes
    after being ground to powder and thrown into water, searches for those who escaped,
    and goes home when she cannot find them. Editorial notes compare repeated revival
    with Heitsi Kabib and note resemblances to Basile’s Petrosinella.
  language: Zulu and English
  quote_policy: summarized
