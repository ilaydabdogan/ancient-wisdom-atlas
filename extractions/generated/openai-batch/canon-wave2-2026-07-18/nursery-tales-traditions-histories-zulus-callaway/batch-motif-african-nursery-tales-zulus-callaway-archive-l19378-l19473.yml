canonical_text:
  quote: ''
  summary: In this passage, speaking leaves command Umkxakaza to make fire, place
    a pot on the hearth, fetch corn, boil it, and grind it. She repeatedly says she
    cannot cook or grind because she is the king's child and shows her long nails.
    One leaf cuts off her nails with a knife, another demonstrates grinding, and she
    then grinds a large mass of corn. The leaves also direct her to bring and wash
    vessels connected with amasi and a milk calabash. A note explains the social meaning
    of long nails and says cutting them reproves her idleness and uselessness.
  language: Zulu with English translation
  quote_policy: summarized
