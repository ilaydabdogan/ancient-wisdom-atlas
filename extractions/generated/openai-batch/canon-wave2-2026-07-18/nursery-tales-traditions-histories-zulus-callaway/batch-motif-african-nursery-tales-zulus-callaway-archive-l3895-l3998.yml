canonical_text:
  quote: ''
  summary: Uthlakanyana gathers a bagful of poisonous biting creatures, returns to
    the cannibal’s house, deceives the cannibal with talk of a narrow doorway and
    a journey to fetch a cousin, hides the bag, and at night builds up the doorway
    so that the cannibal cannot easily leave. In the morning he calls to the cannibal
    and claims to bring bad news; the cannibal tries to open the door and finds it
    firm.
  language: Zulu with English translation
