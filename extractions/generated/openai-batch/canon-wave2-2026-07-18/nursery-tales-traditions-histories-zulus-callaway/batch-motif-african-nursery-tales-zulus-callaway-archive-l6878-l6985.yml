canonical_text:
  quote: ''
  summary: In this passage, an unseen visitor has been coming to Untombinde, speaking
    with her and eating food, while not allowing her to light a fire. After he leaves,
    Untombinde checks the wicker door and finds it still closed. Her mother asks who
    was speaking and eating there, but Untombinde says she does not know. Food is
    prepared for a third visit, including beer, meat, and sour milk. In the evening
    Untlilatu comes, wakes Untombinde, tells her to feel him from foot to head, and
    she finds his body slippery and hard to grasp. He then asks whether she wants
    him to tell her to light the fire, requests snuff, takes a pinch from her hand,
    and sniffs it. An editorial footnote compares the unseen nightly visits to Cupid
    and Psyche and to a Neapolitan tale in the Pentamerone.
  language: Zulu and English
  quote_policy: summarized
