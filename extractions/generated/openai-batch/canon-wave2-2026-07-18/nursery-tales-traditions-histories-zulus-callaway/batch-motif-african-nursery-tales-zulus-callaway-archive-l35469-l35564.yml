canonical_text:
  quote: "“It is said it does not eat a man, but only his brains.”"
  summary: The passage explains a meat-sharing custom after slaughter, in which women
    send pieces of meat to friends by children. It then describes the Isitwalangcengce
    lurking beside house doorways, seizing a child with the meat, carrying the victim
    on its head, taking the victim to a rock, breaking the head, licking up the brain,
    and leaving the body. A following episode begins with the Isitwalangcengce carrying
    off a sleeping man, who asks where they are going; it answers that they are going
    by the path of rocks.
  language: Zulu with English translation
  quote_policy: quoted
