canonical_text:
  quote: I was Untombi-yapansi.
  summary: After returning home, Untombi-yapansi says the birds trouble them, and
    the sister tells her, under the name Umsila-wezinja, to guard the corn. The chief
    later goes secretly to the garden and hides in the corn. Udalana and Untombi-yapansi
    come to watch the garden. Untombi-yapansi sees dew beginning to wash away the
    substance with which she has smeared herself and changes position. When birds
    arrive, Udalana tells her to scare them; she speaks a formula that names the birds,
    the sister’s garden, her assumed name Umsila-wezinja, and her prior identity as
    Untombi-yapansi. The birds leave immediately, and the chief wonders at what he
    has seen. The passage ends as a noon bathing episode begins.
  language: Zulu original with English translation
  quote_policy: quoted
