  quote: ''
  summary: People flee from a frightening, large-headed figure walking with a princess
    and wonder at the being the chief has married. Later, after bathing with the royal
    damsel, Ukandakulu is questioned about her appearance; she commands her head to
    open, releases her things, and her head closes small again, prompting the damsel’s
    amazed recognition and laughter.
  language: Zulu with English translation
