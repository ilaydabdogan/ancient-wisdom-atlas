canonical_text:
  quote: ''
  summary: At the king's village, a woman is mocked for having borne a beast or snake
    and for the earlier expectation that her child would become king. The king tells
    the other women to leave her alone. In the pool, the snake lives in water; a boy
    removes the snake's skin and many children appear. Unthlatu-yesiziba addresses
    Ntombintombi as a sibling, and the children leave the water and go toward home.
    They are counted as ten children, five boys and five girls; the next episode begins
    with obtaining oxen for a search for their mother.
  language: English with Zulu parallel text
  quote_policy: summarized
