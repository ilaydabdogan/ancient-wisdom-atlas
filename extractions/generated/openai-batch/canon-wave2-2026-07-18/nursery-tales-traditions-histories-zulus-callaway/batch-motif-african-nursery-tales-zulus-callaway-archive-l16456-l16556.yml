  summary: The passage describes an account in which one chief, at enmity with another,
    sends soldiers to capture the rival chief alive. Spies are seized to reveal the
    rival chief’s hiding place. The captive is brought back so the attacking chief
    may leap over him as a public sign of triumph; the heading frames the account
    as one concerning a man or chief being eaten. A note explains the triumphal leap
    by comparison with leaping over a killed snake, a captive or dead rival chief,
    or a killed lion.
