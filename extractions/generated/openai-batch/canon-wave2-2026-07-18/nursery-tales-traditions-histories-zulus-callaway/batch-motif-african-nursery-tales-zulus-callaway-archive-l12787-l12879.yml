canonical_text:
  quote: ''
  summary: A legless old woman, Uthlese, remains at the village while the others go
    to dig. The damsels again become human, ask Uthlese whether she will report seeing
    girls there, and she says she will not. The damsels then take vessels, fetch water,
    prepare materials for beer, smear the floors of the houses, and gather firewood
    for the whole village or kraal.
  language: English translation with parallel Zulu
  quote_policy: summarized
