canonical_text:
  quote: ''
  summary: Women described as mothers of crows leave the houses and mock the queen
    or woman whom they believe has no child, not knowing that she actually has a girl
    while they themselves have borne crows. Men, including the father or head associated
    with the crows, angrily rebuke the women and say no one would spend cattle as
    dowry for a crow. The king or village head then tells the bridegroom's men that
    he has no daughter and only crows, but they insist that a human damsel is present
    and consider asking earlier visitors as witnesses.
  language: Zulu with English translation
  quote_policy: summarized
