canonical_text:
  quote: ''
  summary: Some boys herd cattle to the Umtshezi, where a boy throws a stone into
    a pool. After returning home, he refuses food and says he is going to the pool
    to get into it. His mother alerts Umajola, and the father and a company run after
    him. They find the child in the middle of the pool with only his head visible.
    The father wants to enter the pool, but the company restrains him, saying the
    child is already dead. The father offers cattle, including a fine bullock, to
    anyone who will take out his child. At sunset the boy is still visible in the
    pool.
  language: English
