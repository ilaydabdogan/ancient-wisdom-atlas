canonical_text:
  quote: This is what we mean by “to know by the navel.”
  summary: The passage explains a Zulu expression translated as sympathy or knowing
    through the navel. A small child who refuses many people willingly goes to a blood-relation,
    and the parents interpret this as recognizing kin by the navel. A second example
    begins with an elder traveler in a distant country who seeks shelter at sunset,
    is treated kindly by village hosts, receives food, and enters a conversation that
    turns toward birth and the father’s name; the excerpt ends before that example
    concludes.
  language: Zulu with English translation
