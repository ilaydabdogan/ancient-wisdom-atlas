canonical_text:
  quote: ''
  summary: People doubt Undayeni's claim to hear a bird. Later, while the group is
    sitting in a cattle-pen, a wagtail jabbers; Undayeni says it brings news and interprets
    it as saying that the next year will be a dry season. The listeners laugh and
    say he is dreaming, questioning how anyone who is not a bird could understand
    bird language. The passage then states that Ungoza came and that the group bought
    many cattle with corn from the people of Ungoza, before the fragment cuts off.
  language: English
