canonical_text:
  quote: ''
  summary: In this episode, the protagonist requests a single assagai, spits on the
    ground, and the spittle speaks a salutation to him. He hurls the assagai and kills
    a chief together with all the chief's people. He then strikes the people with
    the assagai so that they rise again, while the chief remains dead; the revived
    people declare themselves his people and agree to accompany him. While traveling,
    the party passes through another tribe, whose chief orders them killed. The protagonist
    is told to come down from his ox and replies that he does not walk on the ground.
    An editorial footnote compares the revival episode with other tales of restoring
    the dead to life.
  language: Zulu and English
