  summary: A bilingual Zulu-English key to riddles explains the tongue as a man among
    enemies because it dwells among teeth during chewing; explains the closing-poles
    of a cattle-pen as night guards that block cattle from escaping and lie down after
    the gateway is opened in the morning; and begins an explanation of fingers as
    ten matched parts that go in pairs.
