canonical_text:
  quote: ''
  summary: A man travels with loaves, sleeps in the open, and reaches the place of
    the new moon, where many izingogo are playing by a river. The older izingogo claim
    him as an ingogo, while the younger ones notice his human features and privately
    deny that he is one. At the kraal, where an old grandmother is present, the older
    ones go hunting; the man stays behind, and the younger ones refuse to leave the
    grandmother alone with the newcomer.
  language: Zulu with English translation
