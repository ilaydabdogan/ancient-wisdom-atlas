canonical_text:
  quote: ''
  summary: The preface argues that children's tales are inherited materials rather
    than mere childish inventions; when compared with legends of other peoples, they
    may reveal relationships and common human modes of thought. A quotation from Elizabeth
    Cookson presents customs, creeds, tales, songs, and superstitions as evidence
    for past mental life. The author then applies this framework to Zulu tales, claiming
    they show traces of a higher past, evidence of intellectual and tender feeling,
    and practical value for learning language, traditional lore, and missionary translation
    work.
  language: English
  quote_policy: summarized
