canonical_text:
  quote: ''
  summary: Two damsels from another country arrive so that one may choose Unsimba
    as husband. A marriage-selection gathering is held. Umamba enters with the young
    men; the damsels flee because he is a snake, but the king and others identify
    him as the king’s child. The damsels are told his mother lost children by death
    before he was born. Later, the bride’s sister repeatedly chooses Umamba, despite
    others trying to redirect her choice to Unsimba.
