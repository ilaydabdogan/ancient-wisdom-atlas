canonical_text:
  quote: ''
  summary: Umkxakaza's mother accompanies the beast Usilosimapundu for a time, asks
    to see her child, weeps with her, kisses her, and tells her to go in peace. Usilosimapundu
    then takes Umkxakaza far away to an old village site with a tobacco garden and
    a prepared bright cave containing bedding and water. He tells her to stay there
    and explains that by separating her from her father he has repaid the father for
    taking his cattle and deprived him of the cattle he would have received at her
    marriage.
  language: English translation with Zulu source text present
  quote_policy: summarized
