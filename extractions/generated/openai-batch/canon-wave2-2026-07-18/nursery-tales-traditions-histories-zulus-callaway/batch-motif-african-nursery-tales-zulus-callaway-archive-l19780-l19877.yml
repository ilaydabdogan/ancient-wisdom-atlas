canonical_text:
  quote: ''
  summary: Usilosimapundu directs Umkxakaza-wakogingqwayo to turn, laugh, and come
    down. She is troubled because she is leaving her parents and princely position,
    but she goes down to him. Her younger sister at the river and her mother seem
    to feel her departure and hurry back. Umkxakaza mounts Usilosimapundu; he runs
    off, and the sister and mother see something disappearing behind a hill without
    knowing what it is. Editorial notes explain the feeling as sympathy or presentiment
    and compare such impressions broadly with beliefs in other legends and societies.
  language: Zulu with English translation and English editorial notes
  quote_policy: summarized
