canonical_text:
  quote: "“Tshiyo, tshiyo, tshiyo; your child has been put into the water.”"
  summary: In this passage from “The Two Brothers,” the elder brother lowers the younger
    brother to drink water, leaves him at the bottom, drives away cattle, and lies
    to their parents. In the morning, a bird alerts people that the child is in the
    water and leads the parents to the place. The father looks over the precipice
    and the younger brother explains that his brother abandoned him after the younger
    had first helped him. He also recounts that the elder refused a request from a
    little old woman, who then asked the younger brother to accompany her.
  language: Zulu and English
  quote_policy: quoted
