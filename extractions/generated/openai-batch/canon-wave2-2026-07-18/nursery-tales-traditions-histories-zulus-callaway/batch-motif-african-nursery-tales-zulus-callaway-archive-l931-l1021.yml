canonical_text:
  quote: ''
  summary: The preface describes Uthlakanyana as very small and extremely cunning,
    habitually despised by people who think a child cannot deceive them. It explains
    his smallness as connected with being overburdened by cunning and wisdom, gives
    alternate names, and compares the name Ukcajana to a clever little red animal
    with a black-tipped tail that steals bait from a trap before the intended wild
    cat arrives. Editorial notes discuss an English proverb about weasels and respectful
    or euphemistic naming of bait animals.
  language: Zulu and English
  quote_policy: summarized
