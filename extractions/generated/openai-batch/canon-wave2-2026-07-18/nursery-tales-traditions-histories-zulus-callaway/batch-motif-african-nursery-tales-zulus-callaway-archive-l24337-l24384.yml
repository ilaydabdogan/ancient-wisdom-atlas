canonical_text:
  quote: ''
  summary: A repeated formula tells Ubongopa-kamagadhlela to go in, and the cattle
    enter the enclosure. A new village is built. A male speaker rejects a damsel because
    she goes on the ground; she departs. He chooses to live on the back of Ubongopa-kamagadhlela
    until death, is permitted to stay there, herds his people’s cattle, and continues
    enchantments practiced from childhood.
