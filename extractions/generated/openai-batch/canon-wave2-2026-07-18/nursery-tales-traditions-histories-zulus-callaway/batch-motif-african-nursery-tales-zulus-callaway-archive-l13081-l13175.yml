canonical_text:
  quote: ''
  summary: A group of female visitors drink and give drink to Uthlese, who says she
    will not tell. The visitors later depart into open country and turn into birds.
    Household women return to find all the mash mixed and decide that something wonderful
    is about to happen at home. In the evening Ukakaka presses Uthlese to reveal who
    has done the work. She first claims responsibility, then tells him that many damsels
    come at noon while the household is away; among them is a very beautiful damsel
    with a glistening body, and they make beer at the home. Ukakaka plans to come
    at noon to see them and asks Uthlese not to warn them.
  language: Zulu with English translation
  quote_policy: summarized
