canonical_text:
  quote: ''
  summary: In this passage, an imbulu takes Untombi-yapansi's things, mounts her ox,
    refuses to return them, and engineers a water-crossing episode. After Untombi-yapansi's
    feet become wet, the imbulu renames her Umsila-wezinja and claims the name Untombi-yapansi
    for itself. They then arrive at the married sister's village, where the imbulu
    enters and tells Untombi-yapansi not to come in but to hold the ox.
  language: Zulu with English translation
