  quote: ''
  summary: A liquid identified in the Zulu text as water is fetched and poured into
    a hole, where the imbulu is scalded and then covered with earth. The chief orders
    the whole nation summoned because he is a chosen husband and his sister-in-law
    has come. The marriage company enters the village; Untombi-yapansi dances with
    her people, lives happily with her sister, cattle are killed, meat is eaten, and
    everyone lives together happily.
