canonical_text:
  quote: ''
  summary: An old woman asks two brothers to accompany her. The elder refuses, the
    younger agrees, and the elder follows. They reach a country with a tree that has
    cattle. At the old woman's instruction, the younger boy hews the tree and livestock
    emerge, including cattle, a sheep, a goat, and a white ox. The brothers return
    driving the cattle with their hunting dogs. In a scorched country without water,
    they reach a precipice; the elder asks to be tied with a rope and lowered to drink
    water below. Notes in the passage compare striking or cutting a tree to release
    beings or wealth with other tales.
  language: Zulu with English translation and English notes
  quote_policy: summarized
