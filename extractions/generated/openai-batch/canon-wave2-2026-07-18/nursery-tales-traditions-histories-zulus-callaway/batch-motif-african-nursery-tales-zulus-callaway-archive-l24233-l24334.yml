canonical_text:
  quote: ''
  summary: Ubongopa-kamagadhlela sends messengers to tell his father he is coming.
    The father first disbelieves, but a peculiarly colored bullock from the home village
    is sent as proof that Ubongopa is still alive. The father summons the nation,
    orders beer to be made, and announces that the chief is coming back. After the
    people see the bullock, they accept the report, prepare for his arrival, and seek
    a damsel to be present. Ubongopa then approaches home with men and many cattle,
    is placed at the front, reaches the gateway, and his parents rejoice.
  language: Zulu with English translation
  quote_policy: summarized
