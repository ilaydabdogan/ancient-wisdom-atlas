canonical_text:
  quote: ''
  summary: The heading identifies a fourth visit by a bride and her maids. After the
    people of the kraal leave to dig, the girls enter, prepare and collect beer, clean
    the kraal, fetch firewood, enter the house where Uthlese is, and drink beer. Ukakaka
    enters and prevents them from escaping through the doorway. He questions Ukcombekcansini,
    who laughs and accuses him of taking her from her father's kraal, leaving her
    on the high lands, and going away with an Imbulu. A footnote gives an editorial
    comparison to a Messeria episode in Thorpe's Yule-tide Stories.
  language: Zulu and English
  quote_policy: summarized
