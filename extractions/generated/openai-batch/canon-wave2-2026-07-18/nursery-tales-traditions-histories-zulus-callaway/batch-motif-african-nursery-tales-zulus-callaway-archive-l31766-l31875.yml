canonical_text:
  quote: ''
  summary: Udalana questions Untombi-yapansi, addressed as Umsila-wezinja, about what
    she said and where she has eaten. At home the chief asks whether birds were present,
    and Untombi-yapansi says there were many. The imbulu accuses her of letting birds
    destroy the garden. The next morning Untombi-yapansi hesitates to go first because
    dew may remove the substance smeared on her body that hides her brass-colour and
    prevents recognition. At the garden, Udalana points out birds, and Untombi-yapansi
    speaks of birds devouring her sister’s garden, while qualifying that the sister
    is no longer truly her sister.
  language: Zulu and English translation
  quote_policy: summarized
