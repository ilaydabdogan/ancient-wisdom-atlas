  quote: ''
  summary: The preface passage discusses how to represent Zulu click sounds and aspirates
    in writing. It considers whether click signs should be new signs or diacritic
    marks, evaluates Lepsius characters and Max Muller's suggested use of k, t, and
    l, and states the author's provisional decision to continue using italicized c,
    q, and x as click signs while hoping for uniform orthography.
