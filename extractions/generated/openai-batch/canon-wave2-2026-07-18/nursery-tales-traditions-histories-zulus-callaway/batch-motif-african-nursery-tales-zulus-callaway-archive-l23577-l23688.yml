canonical_text:
  quote: ''
  summary: After a bullock has been butchered and the people are sent away to bathe
    before eating, one boy remains behind. He places the skin on the ground, restores
    the separated body parts, organs, tail, and blood to their proper positions, wraps
    everything in the skin, and calls on Ubongopa-kamagadhlela to arise. Breath returns
    to Ubongopa, who looks up, and the boy tells him to stand.
  language: Zulu with English translation
