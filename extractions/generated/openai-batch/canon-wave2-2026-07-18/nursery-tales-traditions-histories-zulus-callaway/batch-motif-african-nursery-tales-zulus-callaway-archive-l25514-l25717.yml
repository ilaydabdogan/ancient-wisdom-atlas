canonical_text:
  quote: The frog built a great town, and became a great chief.
  summary: 'The passage first recounts Uselesele being brought home, fed, rewarded
    by a king with cattle and people, and then becoming a wealthy chief and king whose
    food abundance attracts followers. It then shifts to Umdhlubu: Unkosi-yasenthla
    hears of her beauty, sends envoys to Unkosi-yasenzansi, and the envoys choose
    her above the other daughters to become the king''s queen, causing shame among
    those not chosen and rejoicing in Umdhlubu''s house.'
  language: Zulu and English translation
  quote_policy: quoted
