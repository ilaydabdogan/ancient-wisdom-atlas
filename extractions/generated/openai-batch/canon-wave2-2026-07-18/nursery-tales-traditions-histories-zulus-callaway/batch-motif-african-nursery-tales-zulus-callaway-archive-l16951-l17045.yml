canonical_text:
  quote: ''
  summary: A woman travels from pool to pool seeking water. At most pools, frogs answer
    when she asks if a frog is present, and she pours the water out. At a very great
    pool with many paths and shady trees, no frog answers; she fills her vessel and
    drinks repeatedly because the water is pleasant, until she has stomach pain and
    cannot stop. The next heading announces that animals warn her of the arrival of
    U gungopi-hubantwana.
  language: Zulu with English translation
