canonical_text:
  quote: ''
  summary: Others urge a young man to marry a girl raised in his household, but he
    refuses and calls her his sister. An old woman tells the girl that she was found
    in a valley and brought up by the queen, so the proposed husband is not her brother.
    The girl grieves, goes to the river with a water-pot, refuses food at home, and
    returns to the river the next morning, where a friend or unidentified being begins
    to appear while she is crying.
  language: English translation with Zulu original in parallel
  quote_policy: summarized
