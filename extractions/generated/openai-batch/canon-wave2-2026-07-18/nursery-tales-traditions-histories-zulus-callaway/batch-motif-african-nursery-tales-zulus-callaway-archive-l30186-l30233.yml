canonical_text:
  quote: The people say the bow is an umnyama, which dwells in a pool, and is like
    a sheep.
  summary: The passage says that when the rainbow appears the weather clears. People
    identify the bow with an umnyama that dwells or drinks in pools, fear large pools
    because the umnyama may eat a person, and say that a diviner-in-preparation may
    enter such a pool without being eaten, emerge covered with coloured clay and entwined
    with snakes, and return home with them.
  language: Zulu and English; extraction based on the provided English translation.
