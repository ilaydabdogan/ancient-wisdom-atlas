canonical_text:
  quote: ''
  summary: After the cock crows, Uthlahanyana says he is going to check his trapped
    birds. He secretly enters his own house while his mother sleeps, eats the bodies
    of the birds in the pot, leaves the heads, fills the pot with cowdung, and closes
    it again. He then leaves, returns as if newly arrived, washes, asks for the birds,
    and claims that the birds have turned into dung because the sun has risen. When
    his mother asks how it happened, he says he is the one who knows and challenges
    her about having given birth to him.
  language: Zulu and English
  quote_policy: summarized
