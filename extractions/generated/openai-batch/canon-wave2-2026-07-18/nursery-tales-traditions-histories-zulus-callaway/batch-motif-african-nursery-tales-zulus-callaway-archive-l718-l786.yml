  summary: The preface discusses transcription and pronunciation of Zulu guttural
    fricatives and aspirated lateral or lingual sounds. It cites Lepsius, Bleek, Grout,
    Colenso, and Max Muller, explains the editor's preferred spellings such as hh,
    italic hh, thl, and dhl, and compares some sounds with German, Welsh, and English
    examples.
  language: English
  quote_policy: summarized
