canonical_text:
  quote: Among us such a wife goes out; she is not fit to bear the village.
  summary: The passage describes a wife who fails in household obligations by grudging,
    hiding, and secretly eating food, scolding dependents, and turning them out. Such
    a wife is removed from the chief place, sent to a lower position near the entrance,
    and replaced by another who can fill the position properly.
