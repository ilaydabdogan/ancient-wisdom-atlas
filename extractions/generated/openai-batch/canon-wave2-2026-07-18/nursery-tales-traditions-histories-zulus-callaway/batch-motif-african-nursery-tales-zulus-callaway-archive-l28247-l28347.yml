canonical_text:
  quote: ''
  summary: A group of children identify themselves as children of Unthlangunthlangu.
    They recount that their mother gave birth to a snake, that the king ordered it
    cast away, and that the mother was left behind. Their grandmother confirms the
    mother is her child and recalls that the child had been expected to become king.
    People assemble to see the children said to have come out of the snake. The children
    travel with their grandmother, answer questions about their origin, say they lived
    in a pool because they were a snake, and are directed to Unthlangunthlangu’s village,
    where they reach home.
  language: Zulu with English translation
  quote_policy: summarized
