canonical_text:
  quote: ''
  summary: The king’s daughter Untombinde repeatedly asks her father and mother for
    permission to go to the Ilulange, a place from which they say nothing returns.
    After several yearly requests, her parents consent. She gathers two companies
    of one hundred maidens each, one on either side of the road, and they set out.
    They meet merchants and the girls stand on both sides of the path.
