canonical_text:
  quote: "“though I have had no child, yet you have seen that I have a child.”"
  summary: The Abahhwebu insist that they saw a girl at the village and can identify
    the house she entered. The village chief angrily denies that there is any human
    girl there and says the woman in that house has borne no child. The woman of the
    house comes out, greets the strangers as bridegroom’s people of the princess,
    invites them in with cattle to be killed for them, and speaks ambiguously about
    having no child yet being seen as having one. Her husband then questions her,
    and she replies that since she has no children, she could not have obtained a
    child.
  language: English translation with Zulu original present
  quote_policy: quoted
