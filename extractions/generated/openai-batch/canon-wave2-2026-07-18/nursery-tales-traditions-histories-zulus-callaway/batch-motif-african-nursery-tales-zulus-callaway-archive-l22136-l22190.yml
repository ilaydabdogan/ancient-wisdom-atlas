  quote: ''
  summary: A celebration is held in which beer is made and the king dances; his sister
    questions him about his earlier order to send Umkakaza away. An old man is killed
    for prior misconduct. Umkakaza returns to her father's with cattle marking her
    as the bridegroom's chosen bride; dowry is paid, she marries the king, becomes
    his wife, and reigns prosperously with him.
