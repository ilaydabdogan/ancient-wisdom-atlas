  quote: ''
  summary: The passage opens a tale titled “Umdhlubu and the Frog.” A king marries
    the daughter of another king and loves her greatly. His other wives are troubled
    by this love. The beloved wife bears a girl, whom the father also loves greatly.
    When the girl has grown, the other wives plot against her during the father’s
    absence, proposing to go cut fibre and instructing the children not to agree.
  language: Zulu with English translation
