canonical_text:
  quote: "“If you are come to select a bride, which is the damsel among all these
    of ours?”"
  summary: The passage first reports that Ukcombekcantsini and a boy had gone to fetch
    water and were seen by Abahhwebu, who asked whose children they were. Later, many
    people arrive at the village with many cattle, leave some cattle outside, drive
    others into the cattle-pen, and respectfully ask the father for his daughter in
    marriage. The villagers are astonished and say there is no human girl there to
    choose, but the visitors ask as though they know the damsel. The women wonder
    which daughter will be selected with so many cattle.
