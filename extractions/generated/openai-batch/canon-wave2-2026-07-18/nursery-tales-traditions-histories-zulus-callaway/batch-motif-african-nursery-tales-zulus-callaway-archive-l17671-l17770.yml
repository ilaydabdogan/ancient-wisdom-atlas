  quote: "“What kind of an ingogo is that who has eyes like a man ?”"
  summary: After a figure takes down an uvati and flees, young izingogo return at
    sunset, see dry blood on a path, and find their grandmother dead in a long dim
    house. They report to the older ones that a man-like ingogo killed her; the older
    ones abandon their game, take up spears, and ask which way he went. A note defines
    the uvati as a two-stick friction apparatus for producing fire.
