canonical_text:
  quote: They said, “We are now your people.”
  summary: An armed group and its chief repeatedly try to kill a boy with assagais,
    but their weapons strike the ground. The boy spits; the spittle remains on the
    ground, fizzes, and praises him. Given assagais, he chooses one, kills the chief
    and the people, revives them, then finally kills the chief while reviving the
    others, who submit to him.
  language: Zulu with English translation
  quote_policy: quoted
