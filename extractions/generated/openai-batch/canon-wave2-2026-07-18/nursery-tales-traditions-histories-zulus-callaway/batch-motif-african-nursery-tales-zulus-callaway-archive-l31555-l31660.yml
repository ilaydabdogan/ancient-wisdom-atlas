canonical_text:
  quote: ''
  summary: At the gardens, Untombi-yapansi states that she is not really Umsila-wezinja
    but Untombi-yapansi, and the birds that devour Udalana's garden depart at her
    words. At midday she goes to a river pool to bathe, emerges shining like brass
    and holding a brass rod, strikes the ground, and calls forth her father's people,
    cattle, and her food; many people, cattle, and food come out of the earth. A note
    says that another version includes the dead among the company.
  language: Zulu with English translation
  quote_policy: summarized
