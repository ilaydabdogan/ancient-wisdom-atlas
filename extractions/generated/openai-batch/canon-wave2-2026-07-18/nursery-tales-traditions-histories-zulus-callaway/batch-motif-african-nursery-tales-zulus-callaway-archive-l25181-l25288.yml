canonical_text:
  quote: She has come to life again.
  summary: Untombinde, a queen or mother who had been sorrowful after the death of
    her first-born, dresses herself and rejoices publicly. A woman from her side investigates,
    sees the child in the house, and gives thanks. The crowd also sees the child;
    Untombinde's side rejoices, while rival queens say they thought they had killed
    the child and fear that their own children's supremacy is ending.
  language: English translation with Zulu original in parallel
