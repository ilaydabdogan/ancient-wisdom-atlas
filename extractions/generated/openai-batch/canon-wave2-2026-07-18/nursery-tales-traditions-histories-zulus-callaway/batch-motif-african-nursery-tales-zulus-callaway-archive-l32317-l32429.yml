canonical_text:
  quote: ''
  summary: Untombi-yapansi leaves for the river while the chief and Udalana follow
    and hide. She enters a pool, emerges gleaming like brass with a brass rod, strikes
    the ground, and commands the earth to open so her father’s possessions, people,
    cattle, and her own things will come out. Food, garments, ornaments, cattle, and
    people appear; she eats, dresses, mounts an ox, and sings of her father’s cattle-pen
    while the people and trees join the song. After the things sink back into the
    ground, the chief reveals himself, reassures the frightened Untombi-yapansi, and
    takes her with Udalana toward the garden.
  language: Zulu and English
  quote_policy: summarized
