canonical_text:
  quote: ''
  summary: A youth and his sister lower a rope to a cannibal, persuade him that it
    is strong, and let him climb. When he is midway between above and below, the youth
    proposes letting go so that the cannibal falls. The girl first suggests raising
    him so they can harass him as cannibals have harassed them, but agrees to the
    fall. The cannibal falls, complains of injury, and the brother falsely says the
    rope slipped and offers a stronger rope. The cannibal climbs again and is raised
    to the place where the siblings are. A following heading states that they tantalise
    the cannibal by eating in his presence. A footnote compares the trick to a jackal-and-lion
    episode in Bleek's Hottentot Fables.
  language: Zulu with English translation
  quote_policy: summarized
