canonical_text:
  quote: ''
  summary: Untombi-yapansi is sent away by her father to her sister, riding an ox.
    He tells her that from the hill she will hear the burning village and must not
    look back. She hears the fire, laments that her parents are burning, and reaches
    a great river. There an imbulu appears and asks to ride her ox and use her things.
    Untombi-yapansi knows from her mother's prior warning that an imbulu would appear
    if the ox stepped on a stone, but she eventually dismounts. A note says another
    version warns her not to tread on a certain stone in the path.
  language: Zulu with English translation
  quote_policy: summarized
