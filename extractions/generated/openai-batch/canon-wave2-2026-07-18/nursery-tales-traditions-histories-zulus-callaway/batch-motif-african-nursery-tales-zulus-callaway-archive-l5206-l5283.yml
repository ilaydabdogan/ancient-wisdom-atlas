canonical_text:
  quote: They hurled their spears at him, without having power to kill him.
  summary: Usikulumi stands until sunset while spears thrown at him fail to kill him.
    The passage explains that a monster strengthened him because it knew he was returning
    to his people, that his father did not want him, and that they would try to kill
    him. An editorial note compares this invulnerable-hero pattern with another Zulu
    legend, Balder, Zulu medicinal invulnerability practices, and Polynesian examples
    involving Maui and Rupe as pigeons.
  language: Zulu and English
  quote_policy: quoted
