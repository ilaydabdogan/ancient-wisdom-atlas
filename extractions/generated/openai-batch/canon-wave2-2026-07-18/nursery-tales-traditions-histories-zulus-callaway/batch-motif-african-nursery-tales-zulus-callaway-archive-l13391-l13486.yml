  summary: The Imbulu sees milk, her tail unfolds, and she throws herself into a pit.
    The people pour boiling water into the hole, killing her. The people are then
    told that the true bride has arrived; the nation is summoned to a royal wedding
    dance, and the next day the assembled people dance, slaughter many cattle, and
    feast for several days. Editorial notes compare parts of the tale with other false-bride
    or transformed-animal narratives.
