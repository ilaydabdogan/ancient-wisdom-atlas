canonical_text:
  quote: ''
  summary: A boy is threatened by thieves at a gateway and answers with a repeated
    address to Ubongopa-kamagadhlela, telling it to go because thieves of another
    tribe are killing them. In the village, a man interprets the night-driving of
    cattle as a sign that the royal youth is of age; food and beer are prepared, but
    after dark the people search for the absent child who left with cattle and calves.
    As the group continues, the boy again addresses Ubongopa-kamagadhlela, this time
    telling it to stand still.
  language: Zulu with English translation
  quote_policy: summarized
