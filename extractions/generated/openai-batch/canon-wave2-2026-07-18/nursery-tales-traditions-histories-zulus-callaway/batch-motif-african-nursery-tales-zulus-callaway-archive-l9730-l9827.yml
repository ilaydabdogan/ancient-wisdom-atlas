canonical_text:
  quote: ''
  summary: Ulangalasenzantsi is concealed in the house of an old woman and says he
    will rest before collecting the captive children of his nation, fetching the woman
    addressed, and killing her husband. On the third morning he appears openly before
    Ulangalasenthla and claims the children. Ulangalasenthla refuses, asserts possession
    of the children, summons his soldiers through a boy, and orders them to kill Ulangalasenzantsi.
  language: Zulu with English translation
  quote_policy: summarized
