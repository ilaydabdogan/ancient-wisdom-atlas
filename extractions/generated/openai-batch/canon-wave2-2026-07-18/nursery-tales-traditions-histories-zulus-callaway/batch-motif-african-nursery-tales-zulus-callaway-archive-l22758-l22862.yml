canonical_text:
  quote: ''
  summary: In this fragment, Ubongopa-kamagadhlela commands cattle to go graze and
    return. Thieves repeatedly come at night to make the cattle rise, beating them
    with sticks and even wrenching their tails, but the cattle do not get up. The
    thieves escalate by cutting many sticks and carrying extra bundles, but the sticks
    break and the cattle remain unmoved. The passage also notes a person not seen
    on the ox and Ubongopa-kamagadhlela eating on top of the ox named Ubongopa.
  language: Zulu and English
