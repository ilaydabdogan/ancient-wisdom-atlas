canonical_text:
  quote: ''
  summary: In a bilingual Zulu-English passage, Usilwane tells Untombi-yapansi that
    something was merely killed. Usilwane then leaves for his own house. When Untombi-yapansi
    prepares to eat, a large fly repeatedly asks for food in exchange for information.
    Usilwane tells her to kill the fly and not feed it. After the third request, Untombi-yapansi
    gives the fly food; the fly warns her not to eat because the food is Usilwanekazana's
    blood, says Usilwane killed Usilwanekazana after claiming she killed his leopard,
    and states that both Usilwanekazana and the leopard are dead. Untombi-yapansi
    then uncovers Usilwanekazana and sees blood flowing from beneath the blanket;
    the section heading says she runs away and is pursued by Usilwane.
  language: Zulu and English
  quote_policy: summarized
