canonical_text:
  quote: "“Wo, Ugilikakgw—o!”"
  summary: The passage gives several linked episodes about Ugilikakgwa or Utikoloshe.
    In one, a husband kills Ugilikakgwa and his wife after knowing of their cohabitation.
    In another, Umtshakazi, a rejected wife, is instructed to use coloured earth,
    fat, boiled white amabele, and a small vessel at the river to summon Ugilikakgwa;
    when the being emerges she flees, and he later returns to the pool after people
    pelt him with stones. In a further episode, a husband discovers his wife with
    the Utikoloshe, kills him, bundles the body in grass, makes his wife carry it
    to her people, exposes it before assembled men, and receives his cattle back.
  language: Zulu and English translation
  quote_policy: quoted
