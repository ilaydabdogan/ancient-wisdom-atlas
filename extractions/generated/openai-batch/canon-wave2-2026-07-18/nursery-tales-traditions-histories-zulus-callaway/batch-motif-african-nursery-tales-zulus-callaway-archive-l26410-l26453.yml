  quote: ''
  summary: An explanatory passage on inheritance in polygamic households describes
    the eldest son, called the father’s “little chief,” as heir-at-law and next chief
    or head. It explains that women married with cattle from the eldest son’s house
    become his heritage, and it distinguishes hereditary paternal estate from property
    derived through the mother.
