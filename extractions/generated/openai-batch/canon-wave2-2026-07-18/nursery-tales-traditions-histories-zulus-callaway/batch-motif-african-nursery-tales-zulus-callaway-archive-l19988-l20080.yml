canonical_text:
  quote: ''
  summary: An armed group repeatedly fails to wound a beast with spears. The beast
    allows Umkxakaza to descend after people plead, but when her people surround her
    to take her away, the beast passes through them and carries her off again. Her
    mother, father, brother, and sister follow; the father, brother, and sister turn
    back from fatigue, while the mother continues. The beast later gives the mother
    sugarcane and maize, which she eats.
