  quote: she could not eat the milk of her son-in-law.
  summary: An old woman living with her daughter at her son-in-law's kraal is offered
    amasi during a famine. She refuses it. Her son-in-law then offers her a cow and
    tells her to eat its milk, but she refuses again, saying she cannot eat her son-in-law's
    milk. A note explains a customary restriction on eating milk from certain affinal
    households.
