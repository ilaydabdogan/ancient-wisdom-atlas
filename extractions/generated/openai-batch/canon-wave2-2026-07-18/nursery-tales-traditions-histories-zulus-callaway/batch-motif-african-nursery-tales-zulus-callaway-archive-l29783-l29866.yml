canonical_text:
  quote: ''
  summary: An introductory note presents a Zulu tale about a great fiery serpent connected
    with water, Dutch arrival-era circumstances, and a rainbow-as-snake belief. In
    the translated tale, men report a fast fiery serpent that comes out of the water.
    Amangwane ambush it, cut off its head as it emerges from a pool, and its body
    returns to the pool; afterward the pool dries and water ceases to flow. Dialogue
    reports that the serpent had a fiery head and contained a soft stone. Editorial
    notes compare the dried pool motif with a Bechuana belief about sacred water-snakes
    and gloss the soft stone as bezoar-like.
  language: English translation with Zulu source text and editorial notes
  quote_policy: summarized
