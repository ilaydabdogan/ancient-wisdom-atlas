canonical_text:
  quote: ''
  summary: 'The passage gives an account of human cannibalism: a man or chief is not
    eaten like cattle flesh, but is charred with great medicines and eaten in a special
    manner by a chief. It adds that when one chief kills another and portions are
    cut from the slain chief''s body, this greatly humiliates the slain chief''s tribe;
    a reported taunt says the defeated have already been eaten and are now in the
    eaters'' stomachs.'
  language: Zulu original with English translation
