canonical_text:
  quote: ''
  summary: Pigeons instruct a woman to cup herself with a horn, take a clot of blood,
    place it in a sealed pot for eight months, and uncover it in the ninth month.
    She finds a child in the pot, feeds and hides him, and he grows quickly. Her husband
    later sees the child, asks whose he is, accepts her explanation that the child
    came from her clot through the pigeons' wisdom, and rejoices.
  language: Zulu with English translation
  quote_policy: summarized
