  quote: ''
  summary: The passage is a comparative appendix on stories and cosmological ideas
    involving ascent or descent between earth, heaven, stars, the moon, and regions
    under the earth. It cites plant-based routes such as trees, rattans, and vines;
    figures who travel to or from heavenly realms; grain or plant origins connected
    with upper-world journeys; Yggdrasil as a world-spanning tree; Tylor's caution
    about overusing coincidences to prove common origin; and an Arabic belief in seven
    heavens and seven earths.
  language: English
  quote_policy: summarized
