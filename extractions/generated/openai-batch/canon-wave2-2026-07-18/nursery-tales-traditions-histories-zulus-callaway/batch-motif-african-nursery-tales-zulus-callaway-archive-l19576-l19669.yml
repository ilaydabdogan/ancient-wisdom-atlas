canonical_text:
  quote: ''
  summary: A young woman, Umkxakaza-wakogingqwayo, is pressed by speaking leaves to
    eat amasi before the completion of puberty ceremonies. She protests that this
    should not happen before the proper ritual release by her father, but she takes
    a spoon and the amasi is eaten. The leaves then remove household goods from the
    village to the gateway. At the house of Umkxakaza’s mother, she asks them to spare
    a small pot in the upper part of the house; they leave the little pot and large
    pots of strained beer. A heading states that Ueilosimapundu devours everything
    in the village.
  language: Zulu and English
  quote_policy: summarized
