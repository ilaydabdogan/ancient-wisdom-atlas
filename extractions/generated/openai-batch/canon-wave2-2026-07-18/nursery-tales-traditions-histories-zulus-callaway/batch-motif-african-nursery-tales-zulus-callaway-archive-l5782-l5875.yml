  summary: After the tree creaks, the dogs again tear off Uzembeni’s head and limbs,
    carry them to a river rock, grind the flesh to powder with pebbles, and cast it
    into the water. Usikulumi and the damsel descend from the tree and flee to Usikulumi’s
    people. Uzembeni dies. Usikulumi’s people greet his unexpected return first with
    funeral lamentation, then by killing oxen and rejoicing, saying they had thought
    him dead. Editorial notes compare tree-related material and the return-lamentation
    custom with Polynesian examples.
