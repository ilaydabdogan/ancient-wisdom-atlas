canonical_text:
  quote: "“the queen has gone away with the king’s children.”"
  summary: Three children leave a hunting party one by one after claiming injuries
    or pains. They have intentionally deceived their father so they can return to
    their mother. The mother, Usitungusobenthle, ties up her luggage and departs with
    the children. An old woman raises an alarm that the queen has gone away with the
    king’s children. Hunters who hear and report the alarm are seized and killed by
    others, who accuse them of devising or prophesying ill luck for the king’s children.
  language: English translation with Zulu text present
