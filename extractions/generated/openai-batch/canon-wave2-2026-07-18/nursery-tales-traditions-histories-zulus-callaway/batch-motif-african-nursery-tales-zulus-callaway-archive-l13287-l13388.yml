canonical_text:
  quote: ''
  summary: Ukakaka rejoices that the damsel lost to him on the high lands has arrived
    and tells his father she is in the house. His father orders men to dig a pit in
    the cattle enclosure and women to boil water. Milk is placed in the pit, and the
    false bride is summoned with the other women to leap over it, because an Imbulu
    is expected to throw itself into the pit when it sees milk. The bride says she
    is afraid to enter the cattle-pen of strangers but is told to go and to leap like
    the other women.
  language: English translation with Zulu parallel text
  quote_policy: summarized
