canonical_text:
  quote: ''
  summary: Usikulumi comes alone to the damsels after leaving his dogs in reeds. The
    girls fear that Long-toe will pursue him if he is sent away, so they dig a pit
    in the house, place him in it, cover it, and sit above it. At sunset Uzembeni
    returns, preceded by the toe, smells a pleasing human odor in the house, asks
    the girls what is there, and seeks to look for herself while the girls deny knowing
    anything. A collector’s note compares the scenting of hidden human prey to similar
    episodes in other legends.
  language: English with Zulu text present
  quote_policy: summarized
