canonical_text:
  quote: "“She has given birth to a snake.”"
  summary: A king’s wife gives birth to a snake after a prolonged pregnancy. The community
    identifies it as a boa constrictor, drags it to a pool, and throws it into the
    water. The king and his people flee to another country, leaving the snake’s mother
    behind. After many years she sets out to follow the king and explains to people
    she meets that she was abandoned because she bore the beast.
  language: English with Zulu source text
  quote_policy: quoted
