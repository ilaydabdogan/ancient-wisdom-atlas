canonical_text:
  quote: ''
  summary: A female actor cuts a rope while the king's people are in the sea, and
    they are carried away by the water; only a few remain and turn back. Usitungusobenthle
    returns to her homeland and finds it empty because the Isikgukgumadevu has eaten
    the people. She sees what appears to be a new mountain near the former village,
    discovers that it is the monster, approaches with a knife, and cuts open its belly.
    A heading and editorial note identify this as the ripping open of the Isikgukgumadevu
    and connect it with renewal and with other monster-belly traditions.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
