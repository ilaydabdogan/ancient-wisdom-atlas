  quote: ''
  summary: Umamba, described as a snake without hands, asks Unthlamvu-yetusi to close
    the doorway, spread his mat, and anoint him with fat before sleep. She is afraid
    to touch a snake, but she stays and sleeps in the house with him. In the morning
    the household marvels at her courage, and Umamba’s mother prepares good food for
    her while regretting that Umamba is not a human being who could marry her.
  language: Zulu with English translation
