canonical_text:
  quote: Unanana builds in the road.
  summary: A woman named Unanana-bosele has two young children and another child staying
    with them. She has deliberately built her house in the road, trusting in her own
    superiority. When she leaves to fetch firewood, animals visit and question the
    child who remains. A large elephant finally swallows the two children and leaves
    the little girl, who later tells the returning mother that an elephant with one
    tusk took them.
  language: English translation with Zulu source text
  quote_policy: quoted
