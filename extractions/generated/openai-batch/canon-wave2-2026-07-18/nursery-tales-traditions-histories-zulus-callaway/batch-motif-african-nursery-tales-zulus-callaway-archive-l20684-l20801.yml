canonical_text:
  quote: ''
  summary: The Amadhlungundhlebe, described as people who eat humans, urge their chief
    to have Umkxakaza eaten and her fat melted down. The chief, who loves her, resists
    but eventually agrees after prolonged pressure. The people prepare firewood, a
    hole, a large fire, and a sherd. When Umkxakaza is brought and sees many people,
    she sings to heaven; the passage heading and note connect her incantation with
    raising a tempest against her enemies.
  language: Zulu with English translation and editorial notes
