canonical_text:
  quote: ''
  summary: 'The passage closes an elephant-swallowing episode: an elephant complains
    of illness after swallowing a woman and having many people in its stomach; after
    it dies, the woman cuts it open and a cow, goat, dog, and people emerge. The rescued
    people give the woman livestock, and she returns home with her children, where
    her little girl rejoices because she had thought her mother dead. The passage
    then begins a new tale titled “The Wise Son of the King,” introducing a king of
    the east with many daughters and noting that a strange thing happens to the youngest
    while the daughters bathe.'
  language: Zulu and English
  quote_policy: summarized
