canonical_text:
  quote: for our mother eats men.
  summary: The passage opens with a fragment saying that daughters escaped because
    of the bitterness of flesh. It then narrates that Usikulumi, a king's son, comes
    by day to court Uzembeni's daughters while Uzembeni is away hunting. Uzembeni
    is also called Long-toe because her long toe raises dust before she appears. Usikulumi
    and the two daughters love one another, but the daughters weep and warn him that
    their mother eats men and that they do not know where to hide him. One daughter
    points to an injury on her cheek as her mother's doing.
  language: Zulu and English translation
  quote_policy: quoted
