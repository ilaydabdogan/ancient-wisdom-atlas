canonical_text:
  quote: "“Do not laugh at an ugly thing; you will give birth to something like it,
    and be ashamed.”"
  summary: The passage describes a belief that laughing at certain beings or conditions
    can produce harmful or resembling consequences. A pig is described as very ugly
    in the head; women who laugh at it are silenced by old people, who warn that the
    laugher may give birth to something like it. A deformed person is also not laughed
    at, because a woman who laughs is said to call down an omen on herself. The passage
    generalizes that many such things bring about things resembling themselves and
    are therefore abstained from. An opening fragment refers to a dreaded danger ending
    in a man’s death, but its antecedent is not clear within the excerpt.
