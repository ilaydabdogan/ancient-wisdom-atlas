canonical_text:
  quote: "“Open, earth, that I may enter,56 for I am about to die this day.”"
  summary: Untombi-yapansi flees from Usilwane, who pursues her with an assagai intending
    to stab her. When he comes near, she asks the earth to open; the earth opens and
    she enters, so he cannot find her. She travels beneath the earth, emerges at midday
    near a chief’s garden, stands on a small elevation, and shouts an alarm about
    coming weeping.
