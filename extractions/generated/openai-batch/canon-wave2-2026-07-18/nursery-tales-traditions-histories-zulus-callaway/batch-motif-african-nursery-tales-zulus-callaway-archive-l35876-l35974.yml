canonical_text:
  quote: ''
  summary: A person encounters a beast associated with a pool while fishing. After
    its gaze meets his, he flees home and asks to be hidden under a pot, blankets,
    and in a corn-hole, but reports that the beast is still looking at him. Another
    man identifies the animal as Isitshakamana and says it knows the names of old
    people. The frightened witness says the beast calls names of his ancestors and
    generations unknown to them, and he dies because he saw it.
  language: Zulu with English translation
