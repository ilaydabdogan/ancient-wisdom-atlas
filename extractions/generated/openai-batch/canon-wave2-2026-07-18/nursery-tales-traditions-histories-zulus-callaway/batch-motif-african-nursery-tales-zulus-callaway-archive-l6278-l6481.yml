canonical_text:
  quote: ''
  summary: In this excerpt, the other girls in a marriage party beseech the Isikgukgumadevu
    for their belongings and blame Untombinde for leading them to the great pool.
    Untombinde alone refuses to petition the being, saying she is the king’s child,
    and the monster seizes her and puts her into the pool. The other girls return
    home and report this to her father, the king. The king sends troops against the
    monster, but it emerges from the water, is described as mountain-sized, and swallows
    the army, the royal village, people, dogs, cattle, and two beloved twin children.
    A father who escaped arms himself with clubs and an assagai, pursues the monster,
    asks buffaloes where it has gone, and receives a forward direction from them.
    The excerpt ends during this pursuit episode.
  language: Zulu and English
  quote_policy: summarized
