canonical_text:
  quote: ''
  summary: In this passage, heaven or lightning kills some of the Amadhlungundhlebe
    while leaving Umkxakaza unharmed. Her enemies then try to place her on a red-hot
    sherd so she cannot sing. At the gateway she looks upward and addresses heaven
    in a song about thunder, rain, and seasonal change. Clouds appear, she repeats
    the song, and the storm kills the chief and many of the Amadhlungundhlebe; a small
    remnant remains afraid.
  language: Zulu and English
