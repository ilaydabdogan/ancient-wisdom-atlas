canonical_text:
  quote: ''
  summary: The passage continues a cumulative tale about Uthlakanyana. After receiving
    an axe, he meets women fetching firewood, lends them the axe, and the axe breaks.
    He demands its return by reciting a chain of earlier broken or consumed objects
    and receives a blanket from the women. He then meets two unclothed young men,
    lends them the blanket, and it tears as they pull it between them. The heading
    states that the torn blanket leads to a shield, but the supplied excerpt ends
    while he is beginning the repeated demand formula.
  language: Zulu with English translation
  quote_policy: summarized
