canonical_text:
  quote: ''
  summary: 'The appendix explains a belief connected with a boy remembering a pool
    and ceasing to eat: a beast in the water can seize a person''s shadow when the
    person looks into the water. After the shadow is taken, the person wants to enter
    the pool, believes there is no death there, and dies by being eaten by the beast.
    People are forbidden to look into a dark pool for fear of losing their shadow.
    A similar Amakccosa/Amakrosa tale is briefly noted.'
  language: Zulu with English translation
