canonical_text:
  quote: ''
  summary: A group of beautiful people stand at a gateway and strike an ox named Umpengempe,
    making it cry while they repeat that they seek their mother, who bore but did
    not nourish them, and that they ate earth and grew. Their mother is distressed
    and says they seem to speak to her and mention her mother's name. The action is
    repeated before assembled people and the king. The passage then begins a section
    in which the grandmother is questioned about where she found these people.
  language: Zulu with English translation
