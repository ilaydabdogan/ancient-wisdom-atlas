canonical_text:
  quote: ''
  summary: An editorial appendix surveys giants and monsters in Zulu tales and in
    other traditions. It identifies Isikgukgumadevu as the major Zulu monster, a river
    monster able to live on land, and compares it with Kammapa of Basuto legends.
    It then lists many-headed, water, dragon, serpent, fish, cosmic-animal, and giant-animal
    examples from classical, European, Polynesian, American Indian, Hindu, Muslim,
    Ojibwa, Norse, Greek, and other traditions.
  language: English
  quote_policy: summarized
