canonical_text:
  quote: ''
  summary: The passage continues an animal inquiry in which mud on feet and legs is
    used to identify the hyenas, who are accused of having taken and eaten an unnamed
    female and are then eaten by the chief. In a later section, an old woman remains
    at the edge of the kraal until someone from home informs her son-in-law, who fetches
    her and her water-vessel and then drinks the water she brought. When the water
    is finished, she tells him to fetch the liver of an ingogo, and many loaves are
    made for his long journey. Editorial notes compare the mud-evidence episode and
    the reciprocal dangerous task with other tale traditions.
  language: Zulu with English translation
  quote_policy: summarized
