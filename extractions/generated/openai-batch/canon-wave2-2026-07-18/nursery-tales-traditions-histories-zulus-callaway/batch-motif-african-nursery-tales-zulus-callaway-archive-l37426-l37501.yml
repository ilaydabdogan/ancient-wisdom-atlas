canonical_text:
  quote: ''
  summary: A tale set during a war-desolated country says that hoes spoke while people
    were digging. A dog at the king’s town made a song concerning Madhladhla/Umadhladhla
    and the only son of Ukadhlakadhl(a). The people, hearing the dog’s song, said
    the country was dead. The song later became beloved by damsels and was sung with
    tears. Editorial notes identify the dead chief and explain the dog’s rebuke as
    a call to weep for him.
  language: Zulu with English translation and editorial notes
