  quote: ''
  summary: A man carrying a liver is pursued by the izingogo, who follow a trail of
    blood. He escapes the first pursuit by climbing a steep place, making fire with
    uvati, and setting surrounding grass alight so that the animal pursuers flee from
    the fire. After sleeping and fleeing again, he sees the izingogo pursuing him
    a second time and begins to make fire again before the provided passage breaks
    off.
