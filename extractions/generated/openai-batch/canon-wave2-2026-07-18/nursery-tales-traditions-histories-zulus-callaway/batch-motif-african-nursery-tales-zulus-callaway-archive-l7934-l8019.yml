canonical_text:
  quote: ''
  summary: Usitungusobenthle and her sister go with female attendants to gather ubenthle.
    The sister from the great house says their father does not love her but loves
    the child of the inferior house. On the return, the father-beloved girl has left
    her ubenthle behind and remembers it on the high land. She asks the attendants
    to accompany her back, but they refuse because her sister has instructed them
    to do so. Usitungusobenthle returns alone and encounters a cannibal sitting in
    a house where her ubenthle is.
  language: Zulu with English translation
  quote_policy: summarized
