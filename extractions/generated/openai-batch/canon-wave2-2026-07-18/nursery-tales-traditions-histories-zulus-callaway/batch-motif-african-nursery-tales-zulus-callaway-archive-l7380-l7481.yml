canonical_text:
  quote: ''
  summary: A woman gives birth to Unthlatu, a very beautiful human child, and hides
    him in a sewn boa skin so co-wives will not kill him. The child later leaves his
    mother to avoid being killed. His mother searches unsuccessfully, but his house
    is kept for him; she leaves beer, meat, and other food there, and some is eaten
    by morning. Damsels arriving to marry say they have come to Unthlatu.
  language: Zulu with English translation
