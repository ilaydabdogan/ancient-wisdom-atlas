canonical_text:
  quote: ''
  summary: The passage contains a fragment about Uhlakanyana as a child who could
    speak unusually and was strong enough to overcome old men, with mention of his
    taking a leg of beef. It then gives an editorial comparative account from Irish
    fairy lore in which Mrs. Sullivan tests a suspected fairy substitute by boiling
    eggshells; the substitute speaks with an old man's voice, reveals great age, and
    disappears before she finds her own child restored in the cradle. A closing note
    points to Thorpe for other methods of detecting an imp substituted for a child.
  language: English with Zulu fragment
  quote_policy: summarized
