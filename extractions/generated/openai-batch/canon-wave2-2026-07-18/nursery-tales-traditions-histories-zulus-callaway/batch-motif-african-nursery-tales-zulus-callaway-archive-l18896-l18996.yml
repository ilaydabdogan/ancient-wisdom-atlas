canonical_text:
  quote: ''
  summary: The passage describes Usilosimapundu, a vast beast with trees and countries
    on his body. Two tall trees named Imidoni are his officers. When an army drives
    away cattle, Usilosimapundu questions them; they insult him, and he lets them
    go with words identified in a note as a threat. The beast is further described
    as having only a mouth and eyes visible, a rock-like face, a large red mouth,
    and different seasonal regions on his body. Editorial notes compare the beast
    to a moving land, Milton’s Leviathan, a world-animal notion, and Sindbad’s great
    fish.
  language: English with Zulu original present
