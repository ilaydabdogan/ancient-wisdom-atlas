canonical_text:
  quote: ''
  summary: A stranger stays briefly in a kraal, says he is ill, and remains behind
    when others leave. He kills, boils, and eats Umasendeni’s mother, fills vessels
    with her remains, and departs. Her son returns, discovers the befouled house and
    flesh, summons the people, and says his mother was eaten by the stranger he had
    taken in. The people say they had warned that the stranger was a cannibal. The
    son buries his mother in the vessels.
  language: Zulu with English translation
