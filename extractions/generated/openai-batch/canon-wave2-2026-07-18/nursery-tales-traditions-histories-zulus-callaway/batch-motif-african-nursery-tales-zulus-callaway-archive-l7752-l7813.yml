canonical_text:
  quote: ''
  summary: 'An editorial note frames the Amavukutu legend as an old account connected
    with primitive origins and compares it with a resuscitation tale in which a girl''s
    heart is placed in milk inside a calabash. The translated legend begins at the
    beginning, near the “source of being”: rock pigeons come to a house, find a childless
    married woman outside, enter, scatter ashes, and prompt her lament that she has
    no child to scatter ashes. Six pigeons then arrive, and one repeatedly says “Vukutu”
    while another asks why it says that.'
  language: Zulu original with English translation and English editorial notes
  quote_policy: summarized
