canonical_text:
  quote: ''
  summary: In this passage from the tale of Umamba, Unsimba says that a girl who chose
    Umamba will reject him because he is a snake. The girls identify themselves as
    Unthlamvu-yobuthlalu and her sister Unthlamvu-yetusi. Unsimba loves Unthlamvu-yetusi
    more than Unthlamvu-yobuthlalu. After the choices are completed, Unsimba and Umamba
    each go to their houses. The young men take Unthlamvu-yobuthlalu to Unsimba's
    house and send Unthlamvu-yetusi to Umamba's house. In Umamba's house, Unthlamvu-yetusi
    sees Umamba on his mat and Umamba's sister sitting there. Umamba's sister asks
    whether Unthlamvu-yetusi would agree to be the wife of a snake. Unthlamvu-yetusi
    and Umamba discuss whether a snake devours people.
  language: Zulu and English
  quote_policy: summarized
