canonical_text:
  quote: ''
  summary: Usikulumi travels to Uzembeni to court her daughters. A swallow warns him
    of danger and instructs him to make its skin into a warning charm on rods. The
    charm alerts Usikulumi when Uzembeni comes and later wakes him when she stealthily
    approaches at night. At dawn the charm tells him to leave; he departs with a damsel,
    flees from Uzembeni, reaches a tree, and is told to climb it for preservation.
  language: English
  quote_policy: summarized
