canonical_text:
  quote: ''
  summary: The passage describes a dispute after black men kill a solitary serpent
    seen coming from the water. The Dutch say such a serpent ought not be killed alone,
    because killing it wrongly may dry the pool or stop the water. The black men say
    they wanted its head or attached part for medicine. Later, the Dutch go to the
    pool at night on horseback; two serpents emerge, fire blazes with one of them,
    shots are fired, and the serpent pursues the riders.
  language: Zulu and English
  quote_policy: summarized
