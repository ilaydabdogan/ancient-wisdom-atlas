canonical_text:
  quote: ''
  summary: Usikulumi is taken by his mother, sister, and the king's son to a great
    forest, placed on a great rock, and left alone. A many-headed monster comes from
    the water, takes him without killing him, feeds him, and gives him people until
    he becomes great and is a king. He travels with a large nation and comes to his
    uncle's house, where he is not recognized; his officer asks the uncle for a fine
    bullock in Usikulumi's name, and the uncle reacts to hearing the name.
  language: Zulu and English
  quote_policy: summarized
