canonical_text:
  quote: ''
  summary: In the evening, Umamba's sister enters the house, sits with them, and leaves.
    Umamba asks Unthlamvu-yetusi to close the doorway, then asks her to anoint him
    because he moves painfully on his belly and sleeps better when anointed. He repeatedly
    says he devours no one. Unthlamvu-yetusi hesitates, handles the fat as directed,
    and anoints him; when she feels the snake body is very cold, she is afraid. Afterward
    Umamba asks her to hold and stretch him because his body is contracted, while
    again reassuring her that he will not harm or devour her.
  language: Zulu and English
  quote_policy: summarized
