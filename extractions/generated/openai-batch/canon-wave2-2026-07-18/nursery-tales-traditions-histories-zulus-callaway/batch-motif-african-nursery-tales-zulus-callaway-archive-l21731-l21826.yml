canonical_text:
  quote: ''
  summary: After called beings tear the old man and then depart, the old man goes
    home. Umkxakaza exits the forest and rejoins him near the village, asking him
    to wait because they travel together. The old man notices that her head is now
    large, though it had been small, and fears asking what caused this because he
    had called beasts to her. They enter the village; she stands at the doorway while
    he makes obeisance to his chief. A heading says the people wish to drive her away
    because of her deformity. An editorial footnote compares parts of the episode
    with Northern and Norse tales involving wild beasts or animal rulers.
  language: Zulu with English translation and English editorial note
  quote_policy: summarized
