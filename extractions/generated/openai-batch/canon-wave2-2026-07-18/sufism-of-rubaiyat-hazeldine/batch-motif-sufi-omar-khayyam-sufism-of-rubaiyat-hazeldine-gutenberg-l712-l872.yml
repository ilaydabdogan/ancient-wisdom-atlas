candidate_motifs:
- id: motif:1
  label: Celestial signs as symbolic book of wisdom
  taxonomy_refs:
  - wisdom
  basis: The planets, signs, and constellations are explicitly called symbols of universal
    creative energies and later signs of a heavenly book containing histories.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage is interpretive and allegorical; it does not narrate a mythic
    episode involving the heavenly bodies beyond their symbolic function.
- id: motif:2
  label: Self-knowledge unlocks cosmic identity
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage presents the will as a key to a door and says future faith must
    be knowledge of oneself, with a note describing the human as a miniature universe.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The motif is doctrinal and symbolic rather than a narrative quest with
    travel or trials.
- id: motif:3
  label: Inner initiation into spiritual authority
  taxonomy_refs:
  - initiation
  - mystical_quest
  - wisdom
  basis: The veil, lamp, and voice within accompany an instruction to enter one's
    birthright and become lord, master, prophet, priest, and king.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage names offices and symbolic objects but does not describe a
    formal ritual initiation.
- id: motif:4
  label: Potter and clay as self-formation
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly uses Potter, clay, wheel, and pot imagery to explain
    human responsibility, the will, the mind, experience, and action.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: The Potter is not consistently a separate creator figure; Mother Earth
    and the later explanation identify humans or the will as the potter.
- id: motif:5
  label: Divine child or divine human birthright
  taxonomy_refs:
  - divine_parent_child
  basis: The passage instructs the moulding of a child and addresses the human as
    a divine child, while also speaking of a birthright.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: low
  cautions: The passage does not give a divine parentage narrative; the taxonomy link
    is based only on the phrase "child divine" and birthright language.
- id: motif:6
  label: Plant return to earth and renewed blooming
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: The lily returns to earth, and from its seed other lilies bloom, fade, and
    die.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a botanical cycle used as a lesson, not a full personified dying-and-returning
    deity narrative.
- id: motif:7
  label: Union of God and humanity
  taxonomy_refs:
  - annihilation_union
  basis: The passage states a hope that mother, child, God, and man unite as one,
    and earlier links self-knowledge with the universe being the self.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: medium
  cautions: The passage speaks of union but does not explicitly describe annihilation
    of self; the taxonomy match is therefore approximate.
- id: motif:8
  label: Moral recompense through action
  taxonomy_refs:
  - wisdom
  basis: The passage says good recompenses with peace and bliss while evils are recompensed
    with pain and death, within the potter-and-wheel explanation of action.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage emphasizes moral causality without explicitly depicting a
    judging deity or court.
- id: motif:9
  label: Pressed wine as spiritual transformation and immortality
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - sacrifice
  basis: Wine is described as ruby red, resurrected from the dead, poured into the
    cup of immortality; a note compares grapes passing through the press with humans
    passing through earthly experience to give up the material and accept the spiritual.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage uses symbolic and possibly Christian-inflected language such
    as crown of thorns; it does not narrate a specific resurrection event.
