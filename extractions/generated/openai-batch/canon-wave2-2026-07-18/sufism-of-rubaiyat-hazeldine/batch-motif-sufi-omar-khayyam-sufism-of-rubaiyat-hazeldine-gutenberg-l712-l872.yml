literal_observations:
- id: obs:1
  text: The speaker directs the addressee to look to the Eternals and question heavenly
    symbols identified with planets and their qualities; these are said to depend
    on one great cause.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents a key and a door, saying the will unlocks the door and
    that future faith must be knowledge of oneself.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the universe is the self and explains in a note that
    human nature may be analyzed as a miniature of the universe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Earth, fire, air, water, and ether are listed as elements composing all things
    under heaven; questions about their origin and destiny are answered by saying
    only He knows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The heavenly signs are described as symbols of a book whose open pages contain
    recorded histories of men, things, and worlds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A veil, lamp, and voice within are named, and the addressee is told to become
    lord, master, prophet, priest, and king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A voice from the depths tells the addressee not to murmur, to make the best
    of life, and says that after passing onward one will never return to clay.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker gives ethical instructions about thinking, acting, giving, friendship,
    strangers, and avoiding future regret.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator says that in passing through life of clay he found a barren waste
    called Insane and asked whether the Potter's hand had blundered in making monstrous
    shapes called man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A friend answers that the same hand made both poison and antidote, and the
    passage says not to blame the Potter or clay but oneself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mother Earth is quoted as saying that humans knead and mould while she is
    the plastic side of life, and that the human is the Potter spinning the wheel
    of life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Brothers, sisters, and mothers are instructed to mould a child free from fear,
    strong, firm, true, and fit for birth; the human is called a divine child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A lily is described as returning to earth; from its seed other lilies will
    bloom, fade, and die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage warns that the cup of life should not contain remorse and that
    tears return salt for salt and smart for smart.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: Life is called the clay, the soul the spinner, the will the Potter, experience
    the wheel, action the turning force, and the mind the pot containing thoughts.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Good actions are said to recompense with peace and bliss, while evils are
    said to recompense with pain and death.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: Another wine is described as drawn from life's vintage into the cup of immortality;
