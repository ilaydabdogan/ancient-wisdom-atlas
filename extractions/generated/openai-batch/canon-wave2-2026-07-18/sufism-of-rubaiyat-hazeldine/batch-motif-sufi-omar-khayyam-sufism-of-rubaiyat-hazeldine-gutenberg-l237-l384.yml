candidate_motifs:
- id: motif:1
  label: Wisdom and knowledge as sacred drink, tree, book, and lore
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly associates spiritual attainment with the Cup of Wisdom,
    Wine of Life as knowledge gained, the Tree of Knowledge, the Book of Life, sacred
    lore, and sages.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is interpretive and allegorical rather than a narrative myth
    episode.
- id: motif:2
  label: Divine beloved speaking through the human soul
  taxonomy_refs:
  - divine_beloved
  basis: The soul of man is called the Lips of the Beloved and Lips of God through
    which a Spiritual Voice speaks and calls humanity to live.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The identification is supplied by the passage and its note; no external
    Sufi doctrine is assumed.
- id: motif:3
  label: Mystical quest for inward deliverance and Supreme Peace
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: The passage tells the addressee to fill earthly life with resolution, lay
    aside fear and indolence, seek deliverance within, renounce enslaving pleasures,
    and follow the path to the Temple of Supreme Peace.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: medium
  cautions: The motif is ethical-didactic and lacks a discrete journey narrative.
- id: motif:4
  label: Opposites resolved in Infinite Unity
  taxonomy_refs:
  - duality
  - annihilation_union
  basis: The passage names many opposed pairs, places a stream or river between them,
    and says that in Infinite Unity distinctions such as slave and monarch cease.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes metaphysical unity more than a plotted union scene.
- id: motif:5
  label: Death overcome in the Infinite
  taxonomy_refs:
  - death_rebirth
  - annihilation_union
  basis: The passage says all life and death are transcending states, death is dead
    to those who know, and a note states that death ceases when the Infinite is reached.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: There is no literal death-and-return episode; the motif is abstract and
    doctrinal.
- id: motif:6
  label: Moral compensation and balancing of life's account
  taxonomy_refs:
  - divine_judgment
  basis: The Law of Compensation, Justice, and the balancing of life's account govern
    the relation of worldly pleasure, virtuous denial, knowledge, useless works, and
    righteous works.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: Justice is personified, but the passage does not narrate a formal judgment
    scene.
- id: motif:7
  label: Regeneration from evil
  taxonomy_refs:
  - death_rebirth
  basis: The note on the Rose says it asks where the spirit of regeneration springs
    forth by which a man is reclaimed from evil.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The regeneration is stated as an interpretive question, not enacted in
    the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares multiple religious names by saying the same
    real may be styled God, Jehovah, Christ, Buddha, Djaina, or Brahm and is called
    by various names by sages.
  claim_level: same_function
  target: God, Jehovah, Christ, Buddha, Djaina, and Brahm as names for the same ultimate
    reality within the passage's interpretive frame
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: This is a passage-internal universalizing assertion from a later English
    Sufi-interpretive work; it does not by itself demonstrate historical contact,
    doctrinal identity, or common inheritance among the named traditions.
