canonical_text:
  quote: ''
  summary: A sequence of interpretive verses and notes presents the King of Splendor,
    the Cup of Wisdom, the Ruby of the Vine, the soul as the Lips of the Beloved or
    God, a Nightingale and Rose, the Fire of Resolution, the Law of Compensation,
    Justice, the Infinite, the River of Contentment, the Book of Life beneath the
    Tree of Knowledge, and a path to the Temple of Supreme Peace. The passage explains
    many images as allegories of spiritual life, wisdom, inward deliverance, moral
    balance, and unity beyond opposites.
  language: English
  quote_policy: summarized
