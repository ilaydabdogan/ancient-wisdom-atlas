  summary: The passage closes with praise of a divine soul of love, then describes
    the moon’s repeated waning and filling as generations come and pass away. The
    speaker bids farewell to an earthly home addressed as father, mother, and teacher,
    asks forgiveness, imagines dust mingled with the earth, autumn petals keeping
    vigil over the tomb, winds chanting for the dead soul, and the speaker yielding
    life into the mother’s arms. Editorial notes then list textual corrections and
    explain that “MIZZERAN” refers to a person who chants the call to prayer, though
    “AZAN” would fit the context better.
