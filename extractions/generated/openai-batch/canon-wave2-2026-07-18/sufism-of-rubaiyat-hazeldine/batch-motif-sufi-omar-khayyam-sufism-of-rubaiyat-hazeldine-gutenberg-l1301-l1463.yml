canonical_text:
  quote: ''
  summary: 'The passage presents an allegorical teaching on the secret way from embodied
    clay-life to freedom, the return of the heart to God, and the role of death as
    release. It describes man in the Garden of Iram, a serpent, tasting from a woman’s
    hand, fruits of good and evil, and the conquest of self. It then moves to a potter’s
    shed where clay shapes and vases reveal moral states: a dog becomes an emblem
    of faithfulness, human vessels are judged or remade, lust is condemned, and a
    bull-vase is made a heavenly sign of endurance and seasonal renewal.'
  language: English
  quote_policy: summarized
