  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: The fourth poem section says a new year of life has begun and that the awakened
    soul is revived with a deep love of knowledge under the Tree of Life.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The note on Moses says the White Hand signifies truth, honesty, and friendship,
