- id: motif:6
  label: Seasonal solar decline and renewal
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: Bahrám Gùr marks the old year entering winter, while Ramazán and the poem's
    new year of life mark regeneration and revival.
