canonical_text:
  quote: ''
  summary: The passage gives allegorical notes for names, places, celestial bodies,
    and expressions in the Rubáiyát, then begins the poem with invocations to awaken
    sleeping souls, follow a sure path toward the Spiritual Sun, hear an inner tavern
    summons, seek the heavenly goal, and stand under the Tree of Life associated with
    Moses and wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Rubáiyát is described as a reading between lines, a meaning within a meaning,
    and a paradox.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Omár Khayyám, glossed as the Tent Maker, is said to signify the Supreme Creator;
    the tent is explained as representing the universe, with earth as floor and heavens
    as canopy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expression Astronomer Poet is identified as another title for the Creator,
    who orders the heavens and stars and controls the seasons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Iram is defined as the nameless center of the universe, a womb of birth, and
    a heavenly garden where Jamshyd sits enthroned and divines hidden astronomical
    mysteries from a seven-orbited cup.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rustum and Zál are presented as personifications of universal positive and
    negative creative energies and of opposites such as summer and winter, youth and
    age.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hátim Tai is presented as the personification of charity, benevolence, and
    generosity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Takht-i-Jamshyd is explained as the throne of wisdom or mid-heaven, with Jamshyd
    symbolized by the sun at zenith; the sun is described as a symbol of God rather
    than as God.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bahrám Gùr is said to symbolize the sun in Sagittarius and the old year that
    will be lost in winter or Capricorn.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Saturn, Parwìn, and Mushtarì are each assigned celestial or moral symbolism:
    old age or ripeness, spirituality and gentleness, and benevolence, religion, and
    big-heartedness.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Máh to Máhi, from fish to moon, is explained as denoting conception to birth
    and transition between matter and spirit and between life and death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ramazán is described as a lunar month in spring and as the birth of regeneration
    or spring.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The first poem section calls slumbering souls to awake and asks to be led
    by a sure path to the place where the Spiritual Sun rises and mortal darkness
    sets.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The second poem section says a Supreme Voice within a tavern announces that
    the sacrifice is ready, invites entry, and says the soul learns of God, worlds,
