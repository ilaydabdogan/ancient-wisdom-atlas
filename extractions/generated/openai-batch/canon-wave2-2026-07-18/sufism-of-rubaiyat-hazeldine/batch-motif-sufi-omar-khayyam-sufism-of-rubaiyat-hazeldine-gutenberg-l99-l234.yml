  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives a symbolic expression, not a narrative initiation episode.
- id: motif:8
  label: Mystical path from darkness to spiritual light
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The first stanza asks to be led by a sure path to the rising Spiritual Sun
    beyond mortal darkness and destructive passions.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The destination and path are devotional and allegorical rather than geographically
    described.
- id: motif:9
  label: Inner summons over external ritual
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The Supreme Voice within the tavern invites entry for prayer and learning,
    while carved creeds, pomp, rituals, and dumb forms are criticized.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The text supports an inward-learning pattern; initiation is inferred from
    the invitation and learning sequence.
- id: motif:10
  label: Prepared sacrifice before entry
  taxonomy_refs:
  - sacrifice
  - initiation
  basis: The tavern voice announces that the sacrifice is ready and urges those outside
    not to loiter but to enter.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The sacrifice is not specified as an object, animal, person, or inward
