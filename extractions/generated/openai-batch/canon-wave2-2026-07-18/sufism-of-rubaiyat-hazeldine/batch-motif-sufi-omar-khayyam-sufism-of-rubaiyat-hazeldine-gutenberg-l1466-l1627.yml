canonical_text:
  quote: ''
  summary: The passage presents created beings as pots and other forms shaped by a
    divine Potter, created by one great cause and returning to Him. It expands the
    image into flowers, ocean forms, a cosmic wheel and workshop, spring rains, vines
    and grapes, dust nourishing unborn vines, a path toward the crown of life, spiritual
    gardens of peace and love, the rejection of divisive religious labels, harmonious
    animal pairs by a river, desert springs, and an Angel of Repose who comforts sufferers
    and transforms fear of death into thoughts of love.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some created forms are old and some are bright, but neither youth nor age
    can tell who is pot, potter, or mould; they know only that one great cause created
    and dissolved all.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leaves, blooms, ferns, flowers, and marine-colored forms are described as
    spun on the same wheel and as yielding life to earth while beauty, perfume, and
    souls go to Him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Potter is said to spin, grind, knead, and fire the lives of all in a shop
    identified as the universe, and nothing is wasted in the work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: All things are said to speak in praise of Him, who is called Lord of Heaven,
    Creator, and the Grave; a note explains Him as both container and contained and
    as prior to priestly or warrior status.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Spring is personified as a water carrier with a rain skin who drives Winter
    back, sends warming rains, and is identified with the Holy Spirit given from heaven
    to man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The vine puts forth new leaves, grapes sweeten in the sun, youth ripens with
    the frosts of years, and the dead are laid away in leaves from the Tree of Life
    within the vineyard of life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Human dust is mingled with earth to nourish unborn vines, and deeds, acts,
    and thoughts in life are described as nutrition for future vines.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A doubter is addressed about who perishes; each person must tread a noble
    path and win the crown of life, and what is created in divine love is said not
    to be destroyed by wrath.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: People are urged to dwell in peace and freedom, cultivate beautiful flowers,
    exclude weeds of remorse and shame, and illuminate the spiritual gardens of the
    mind.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage rejects labels such as priest, infidel, pagan, and heathen before
    Him and says all are called friends.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: When divisive names are no longer heard, the rose of love appears, the Eagle
    and Dove perch on branches, the Tiger and Lamb play by the river, and the scene
    is called a view of heaven with night passed and day dawned.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Every desert is said to have its spring, and every man and woman is said to
    find freedom as the goal of life and live in peace.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Angel of Repose is asked to comfort those who suffer, impart a magic word
    that turns fear of death into living thoughts of love, and bid all awake and rise.
  category: action
  evidence_refs:
  - ev:13
