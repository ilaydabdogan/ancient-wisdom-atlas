candidate_motifs:
- id: motif:1
  label: Return of all forms to the divine source
  taxonomy_refs:
  - annihilation_union
  basis: The passage states that one great cause created and dissolved all, that all
    went again to Him, and that the distinction between potter, pot, and the addressee
    is a secret to be searched out.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not use the technical phrase annihilation or union; the
    classification rests on the stated return to Him and blurring of creator/created
    distinctions.
- id: motif:2
  label: Cosmic artisan shaping living forms
  taxonomy_refs: []
  basis: The divine Potter works on a wheel in the universe, grinding, kneading, and
    firing the lives of all into forms and wasting nothing.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family directly names a creator-potter motif, so
    taxonomy_refs are left empty.
- id: motif:3
  label: Seasonal renewal through spring rain and vine-ripening
  taxonomy_refs:
  - seasonal_cycle
  basis: Spring drives back Winter with rain; the vine puts forth leaves, grapes sweeten
    with the sun, and youth ripens with the frosts of years.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:12
  confidence: high
  cautions: The cycle is poetic and spiritualized rather than a full seasonal myth
    narrative.
- id: motif:4
  label: Death feeding new life
  taxonomy_refs:
  - death_rebirth
  basis: The dead are laid in vineyard leaves, dust mingles with earth to nourish
    unborn vines, and future vines are fed by the deeds, acts, and thoughts of life.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage emphasizes organic renewal and moral continuity; it does not
    describe a single named dying-and-returning figure.
- id: motif:5
  label: Tree and vineyard of life
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage names the Tree of Life and places human rest and renewal within
    a vineyard of life.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The Tree of Life is explicit, but the passage does not present an axis
    mundi or world-center structure.
- id: motif:6
  label: Mystical search for the secret and crown of life
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: The passage commands the hearer to search out the secret of potter, pot,
    and self, and later says each person must tread a noble path and win the crown
    of life.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  cautions: The passage gives exhortation and imagery rather than a developed quest
    narrative.
- id: motif:7
  label: Reconciliation of inner dualities by love
  taxonomy_refs:
  - duality
  basis: The Eagle and Dove are glossed as sympathy and antipathy, and the Tiger and
    Lamb as physical and spiritual natures; both pairs are pacified or harmonized
    when love conquers greed, selfishness, and avarice.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The duality interpretation is supplied by the passage's own notes, not
    by the bare animal image alone.
- id: motif:8
  label: Universal fellowship beyond divisive religious names
  taxonomy_refs: []
  basis: The passage says that before Him there is no priest, infidel, pagan, or heathen,
    and that all are called friends; it also urges peace, freedom, and harmony with
    God.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied taxonomy family directly captures this social-religious reconciliation
    motif.
- id: motif:9
  label: Awakening from fear of death into love
  taxonomy_refs:
  - resurrection
  basis: The Angel of Repose imparts a word that turns fear of death into living thoughts
    of love and bids all awake and rise, laying aches and pains aside.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The language of rising supports a resurrection-like motif, but the passage
    frames it as comfort and freedom from fear rather than a detailed afterlife event.
- id: motif:10
  label: Peaceable animal harmony as heaven descending
  taxonomy_refs: []
  basis: The Eagle and Dove perch together, the Tiger and Lamb play by the river,
    and the passage calls this a view of heaven descending, with night passed and
    day dawned.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No explicit external comparison is made in the passage, so the motif is
    recorded without cross-tradition claims.
