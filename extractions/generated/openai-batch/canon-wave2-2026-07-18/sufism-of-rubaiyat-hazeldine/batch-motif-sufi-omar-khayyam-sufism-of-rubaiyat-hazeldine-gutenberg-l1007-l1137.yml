canonical_text:
  quote: ''
  summary: The passage presents a symbolic heaven-to-earth line, Masonic-style tools
    and lodge imagery, a solar/cosmic circuit of a Master, and a directional life-course
    from birth to death and peace. It then narrates an encounter with the speaker’s
    invisible soul or guide, who brings a divine message, ascent, waters of eternity,
    and wine of immortality. The guide teaches on equality, suffering, judgment within
    the human heart, peace, future rest beyond the grave, and the contrast between
    destructive earthly wine and the wine of life’s experience.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A line stretched from the heavens toward earth is called the “Plumb Line of
    the Universe” and is revered by sages and the wise.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Where the line meets earth, the addressed person faces the setting sun, is
    freed from the fatal square, raised by the Master’s hands, exalted from the dead,
    and greets brethren.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master rises from the East, sits at high twelve on an arch, surveys the
    quarters, writes orders on a trestle-board guarded by four regents, crosses a
    mystic line, falls, and seeks repose with fellow-craft.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that there is no yesterday or tomorrow, but endless day
    wrapped in endless night, in which all sleep and wake.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A footnote explicitly identifies the material as “Jewels of Masonic Lore”
    and speaks of an earthly lodge closing and a heavenly lodge opening for those
    found worthy and qualified.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mortals receive builder’s tools, including the plumb, guiding line, square,
    cross, cube-stone, and mystic trowel.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: 'The passage maps human life onto directions: East as birth, South as manhood,
    West as fall and place of peace, and North as death.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker’s invisible soul brings a divine message, saves the speaker from
    earthly fetters, bids the speaker rise to the skies of skies, and leads to waters
    of eternity and a golden chalice of immortality wine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A note says the golden cup refers to collective experiences.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: The answering figure says all men and women were made equal, that tears and
    sorrows were not given to humankind, and that suffering is chosen and can function
    as birth-pains giving freedom to the soul.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The answering figure rejects simple human judgment of right and wrong and
    says true judgment is found through a judge who never errs in the human heart;
    the infinite law of heaven cannot be fully defined by human speech.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: A praise-address invokes Mighty Peace, a truth-breathing Lord adored by darkness
    and light, as a subduer of fear and sorrow and leader to future rest beyond the
    grave among past sages.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Life is described as a vine whose press yields the wine of life, while the
    fool brews a hurtful drink from wantonness; the wise draw the wine of life and
    the fool drinks the wine of earth.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: A note says that this life is the sum total of what the preceding one was.
  category: other
  evidence_refs:
  - ev:14
