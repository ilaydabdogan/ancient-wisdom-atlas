candidate_motifs:
- id: motif:1
  label: Cosmic plumb line joining heaven and earth
  taxonomy_refs:
  - world_center
  basis: The passage names a line descending from the heavens to earth as the Plumb
    Line of the Universe and later calls it a guiding line between heaven and tomb.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The passage states a cosmic vertical line, but does not explicitly call
    it a world center; the taxonomy link is approximate.
- id: motif:2
  label: Initiatory raising from death into fellowship
  taxonomy_refs:
  - initiation
  - resurrection
  - death_rebirth
  basis: The addressed person is made free and accepted, raised by the Master’s hands,
    exalted from the dead, and returned to greet brethren; the note also speaks of
    worthiness and qualification for heavenly lodge work.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage uses esoteric allegorical language rather than a literal death-and-return
    narrative.
- id: motif:3
  label: Solar master’s daily circuit
  taxonomy_refs: []
  basis: The Master rises from the East, sits at high twelve/noonday, surveys the
    quarters, crosses a mystic line, falls, and seeks repose as days are measured.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy family exactly names a daily solar circuit.
- id: motif:4
  label: Day-night and darkness-light duality
  taxonomy_refs:
  - duality
  basis: The passage says there is no yesterday or tomorrow, only endless day wrapped
    in endless night; the praise-address also names darkness and light.
  evidence_refs:
  - ev:4
  - ev:12
  confidence: high
  cautions: The duality is stated symbolically and is not developed as a full cosmological
    doctrine in this excerpt.
- id: motif:5
  label: Fourfold elemental trial and cross-proof of life
  taxonomy_refs:
  - initiation
  - sacrifice
  basis: The passage speaks of being born of earth, tried by air, fire, and water,
    nailed to the cross, and seeking proof of life through cross and cube-stone symbolism.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not narrate a specific sacrificial victim; the motif
    is inferred from the symbolic sequence of trial and being nailed to the cross.
- id: motif:6
  label: Mystical ascent guided by the inner soul
  taxonomy_refs:
  - mystical_quest
  - ascent
  basis: The speaker’s Soul Invisible brings a divine message, saves the speaker from
    earthly fetters, and bids ascent to the skies of skies and waters of eternity.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The identity of the guide is phrased as the speaker’s invisible soul;
    no external guide tradition should be assumed.
- id: motif:7
  label: Immortality drink in a golden cup
  taxonomy_refs:
  - death_rebirth
  basis: A golden chalice pours the wine of immortality, which the speaker drinks
    before returning the cup; a note glosses the cup as collective experiences.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage explicitly names immortality wine, but the taxonomy connection
    to death-rebirth is interpretive and should be reviewed.
- id: motif:8
  label: Suffering as birth-pain of soul-freedom
  taxonomy_refs:
  - sacred_birth
  - initiation
  basis: The answer says sufferings are deliverant pains of birth that give freedom
    to the soul.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage treats birth-pain metaphorically, not as a literal sacred
    birth narrative.
- id: motif:9
  label: Inner judgment and wisdom beyond human right and wrong
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The passage says true judgment is found through a judge who never errs in
    the human heart and that human speech cannot define the infinite law of heaven.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The judge is inward rather than a narrated external tribunal.
- id: motif:10
  label: Guidance to peaceful rest beyond the grave
  taxonomy_refs:
  - afterlife_journey_map
  - wisdom
  basis: Mighty Peace is praised as leader to future rest beyond the grave, where
    sages of the past dwell, and as a source of refuge in a law of peace.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The afterlife location is named briefly as future rest beyond the grave,
    not mapped in detail.
- id: motif:11
  label: True wine of life versus destructive earthly wine
  taxonomy_refs:
  - wisdom
  basis: The passage contrasts the wine of life and vintage of life’s experience with
    harmful earthly wine that causes destruction and remorse; the wise draw the former
    and the fool drinks the latter.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The motif is ethical-symbolic and should not be reduced to a literal temperance
    statement alone.
