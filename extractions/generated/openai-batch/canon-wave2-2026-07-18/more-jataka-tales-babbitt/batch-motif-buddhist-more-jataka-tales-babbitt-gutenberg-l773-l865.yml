canonical_text:
  quote: ''
  summary: A king discovers a mango carried downriver and travels to the mango-tree
    where it grew. At night a troop of monkeys comes to eat the fruit. The king orders
    archers to shoot the monkeys when they descend, but the Chief of the Monkeys stretches
    himself between branches across the river so the troop can cross over his back
    and escape. The king, seeing this rescue, promises to care for the chief.
