canonical_text:
  quote: ''
  summary: A cruel prince is abandoned during a storm and swept downriver on a log
    with a Snake, Rat, and Parrot. A poor man rescues them, cares for the animals
    before the prince, and receives grateful promises from the animals. The prince
    secretly hates the rescuer, later becomes king, and plans to have the poor man
    killed to conceal the rescue and avoid giving the promised reward.
