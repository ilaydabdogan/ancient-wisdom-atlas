  summary: A Lion suffers when a bone sticks in his throat. A Woodpecker agrees to
    remove it but first props open the Lion's jaws with a stick for safety. After
    the Woodpecker removes the bone, the Lion gives no thanks and later refuses to
    help the Woodpecker, claiming that letting the bird leave his mouth was enough.
    The Woodpecker then avoids the Lion.
