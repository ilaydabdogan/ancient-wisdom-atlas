  quote: ''
  summary: A young Lion ignores his parents’ warnings and shelters a flattering Wolf.
    At the Wolf’s prompting, he begins killing the king’s ponies. After further warnings
    and failed royal precautions, the king stations an archer, who shoots the Lion.
    The Wolf abandons him, and the Lion dies.
