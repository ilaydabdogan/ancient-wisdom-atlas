canonical_text:
  quote: ''
  summary: A Deer, a Woodpecker, and a Turtle live as friends near a lake. A hunter
    traps the Deer; the Turtle gnaws the leather trap while the Woodpecker delays
    and warns of the hunter. After the Deer escapes, the hunter captures the weakened
    Turtle in a bag. The Deer lures the hunter away, returns, tears open the bag with
    his horns, and frees the Turtle. The three friends evade the hunter and live together
    thereafter.
  language: English
  quote_policy: summarized
