  quote: ''
  summary: A gardener wants to join a city holiday and asks the monkeys in the king's
    garden to water the young trees. The monkey chief agrees, but when the monkeys
    do not know how much water each tree needs, he tells them to pull up the trees
    and judge by root length. The monkeys uproot the young trees, and when the gardener
    returns, the trees are dead.
