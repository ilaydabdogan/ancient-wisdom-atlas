canonical_text:
  quote: If mice eat plows, then birds carry off boys;
  summary: A village trader leaves his plow with a town trader, who sells it and claims
    that mice ate it. The village trader then hides the town trader's son with a friend
    and claims that a bird carried the boy away. In court, he points out the parallel
    between the two impossible claims. The judge orders the plow and the son returned.
  language: English
  quote_policy: quoted
