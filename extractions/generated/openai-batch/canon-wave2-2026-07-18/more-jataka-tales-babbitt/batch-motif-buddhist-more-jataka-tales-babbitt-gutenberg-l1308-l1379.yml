canonical_text:
  quote: ''
  summary: A wise surviving Goat lives in a hillside cave after wolves have eaten
    the other goats. The wolves try to lure her out by pretending one wolf is dead
    and needs burial, but she detects the trick and escapes. When they try again with
    a false invitation to friendship, she counters by saying she will bring named
    hounds and a dog with their mates; the wolf flees and the Goat never sees the
    wolves again.
