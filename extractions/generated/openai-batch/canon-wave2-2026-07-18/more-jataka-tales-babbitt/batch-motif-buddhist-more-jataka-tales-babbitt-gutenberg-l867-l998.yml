canonical_text:
  quote: ''
  summary: A hawk family lives on an island in a lake. At the Mother Hawk’s urging,
    the Father Hawk befriends a kingfisher, a turtle, and a lion. When hunters camp
    beneath the hawks’ nest and plan to eat the young hawks, the hawks call on these
    friends. The kingfisher repeatedly puts out the hunters’ fire with water; the
    turtle puts it out with mud and drags the hunters into the lake when they try
    to catch him; finally the lion’s roar frightens the hunters away. The hawks thank
    their friends.
  language: English
  quote_policy: summarized
