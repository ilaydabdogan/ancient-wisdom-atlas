canonical_text:
  quote: ''
  summary: Two deer, Beauty and Brownie, are warned by their father to lead their
    herds away from ripening cornfields, travel by night, avoid villages, and stay
    in the high hills until crops are cut. Beauty follows the instructions and loses
    no deer. Brownie forgets them, travels by day near villages, and many of his deer
    are killed by hunters; only a few remain when he returns.
  language: English
  quote_policy: summarized
