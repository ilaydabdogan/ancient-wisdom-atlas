canonical_text:
  quote: ''
  summary: A wolf deceives a community of rats by pretending to be lame and to live
    only on air. The rats’ chief and followers visit him out of pity, and the wolf
    secretly eats the last rat each time they leave. When the rats notice their numbers
    shrinking, the chief tests the wolf by going last, escapes the attack, exposes
    the deceit, kills the wolf, and the rats thereafter live peacefully.
