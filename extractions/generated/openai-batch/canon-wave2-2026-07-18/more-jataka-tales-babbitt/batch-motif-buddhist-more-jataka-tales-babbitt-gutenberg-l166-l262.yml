canonical_text:
  quote: ''
  summary: A king’s household goes to a lake in the royal garden, leaving the queen’s
    jewels with a servant. A Girl Monkey watches, steals the queen’s pearl string
    while the servant sleeps, and hides it in a tree. After the theft is discovered,
    the chief guard reasons that someone inside the guarded garden must have taken
    it. He sets out strings of glass beads as bait. Other monkeys take the beads,
    and the thief reveals herself by putting on the pearls and boasting. The chief
    guard catches her, returns her to the king, and is praised for his cleverness.
  language: English
  quote_policy: summarized
