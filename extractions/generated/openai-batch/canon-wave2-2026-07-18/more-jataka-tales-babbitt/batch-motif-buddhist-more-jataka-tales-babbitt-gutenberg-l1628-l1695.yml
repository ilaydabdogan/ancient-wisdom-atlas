canonical_text:
  quote: ''
  summary: A dog regularly visits the king's elephant, and the two animals become
    close companions who eat, sleep, and play together. A farmer buys and takes away
    the dog. The elephant grieves and refuses to eat or bathe. The king's chief servant
    recognizes that the elephant is lonely rather than physically ill. The king orders
    that the dog be released and compensates the buyer. The dog returns, the elephant
    rejoices, and the two live together thereafter.
  language: English
