  summary: A lion accepts a hungry wolf as a servant and shares meat with him after
    the wolf scouts prey from a mountain. Grown strong and proud, the wolf insists
    on killing an elephant himself despite the lion's warning. The wolf attacks, misses,
    and is killed by the elephant.
