canonical_text:
  quote: ''
  summary: In “The Cunning Wolf,” townspeople go into the woods for a holiday and
    eat all their meat. One man tries to obtain fresh meat by pretending to be dead
    beside a lake where animals drink. The King of the Wolves suspects the trick,
    tests the man by pulling at his club, and exposes the deception when the man pulls
    back. The man throws the club but misses, the animals escape, and he reports that
    the wolf played the better trick.
