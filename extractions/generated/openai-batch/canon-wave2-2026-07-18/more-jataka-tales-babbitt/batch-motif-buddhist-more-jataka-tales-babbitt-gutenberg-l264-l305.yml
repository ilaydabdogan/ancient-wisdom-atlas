canonical_text:
  quote: ''
  summary: Three named fishes leave a wild river country for waters near a town. Very-Thoughtful
    warns that fishermen and their nets make the place dangerous, but the other two
    delay returning. Thoughtful and Thoughtless are caught in a net. Very-Thoughtful
    splashes before and behind the net so the fisherman thinks the fish have escaped
    in opposite directions; when the fisherman pulls in one corner, the trapped fish
    get out. The three return to their old home and live safely.
