canonical_text:
  quote: '"It is better to save poor, weak animals than to save a prince."'
  summary: A king orders the execution of a poor man who had saved him. The poor man
    publicly explains the injustice, and the crowd kills the king and makes the poor
    man king. The new king visits the Snake, Rat, and Parrot, receives their offered
    wealth or aid, brings them to the city, and provides them with honored homes and
    food.
  language: English
  quote_policy: quoted
