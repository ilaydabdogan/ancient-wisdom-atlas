canonical_text:
  quote: ''
  summary: The passage describes a transition in early Sufism from asceticism to pantheistic
    speculation, focusing on Hellaj as a figure accused of divine incarnation claims,
    revered by disciples, executed after opposition from orthodox authorities, and
    later interpreted by Ghazzali in terms of mystical ecstasy and confusion between
    the self and divine reflection. It also lists earlier or parallel Islamic and
    Persian examples of incarnation, divine emanation, veiled prophetic leadership,
    and transmigration claims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that earlier Sufi asceticism passed into later dreamy pantheism
    around the end of the third century after Muhammad, making the relation between
    finite humanity and infinite divinity a central subject of inquiry and meditation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hellaj is described as a poor cotton-carder, an Arabised Persian born in Persia,
    educated in Irak, and instructed by Junaid.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hellaj had many disciples who revered him as a spiritual guide and attributed
    almost supernatural powers to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Orthodox mullahs were scandalised by Hellaj's growing popularity, moved the
    authorities against him, and procured his execution in 922 A.D.; before death
    he endured severe tortures with composure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The declared reason for Hellaj's condemnation was that he regarded himself
    as an incarnation of the Godhead; after his death his disciples honoured him as
    a saint and associated him with the saying, "I am the Truth."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A teaching attributed to Hellaj says that one purified by abstinence and freed
    from fleshiness receives the Spirit of God as it entered Jesus, and that at this
    degree of perfection the person's will and acts are done by God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Letters attributed to Hellaj are said to begin, "From the Lord of Lords to
    His slaves," and his disciples addressed him as the Spirit of the Spirit incarnated
    in the form of Hosain the cotton-carder.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says the genuineness of the quoted fragments is supported but
    not entirely certain; nevertheless it states that Hellaj's disciples after his
    death regarded him as divine, citing Ibn Hazm as explicit support.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ghazzali is said to shelter Hellaj from blasphemy by construing "I am the
    Truth" pantheistically and attributing it to excess love for God and mystic ecstasy.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ghazzali's explanation describes the servant's soul as the first veil between
    God and the servant, the human heart as divinely illuminated and mirroring eternal
    Truth, and error as confusing the mirror with what is mirrored.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage characterizes Hellaj as representing an old idea, described as
    Indian in origin, which he combined with Sufism and which changed Islamic thought
    about God.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The passage lists earlier Islamic examples of incarnation doctrine: Ali was
    reported as an incarnation and venerated by Shiahs, the Khattabiyah worshipped
    Imam Jafar Sadik as God, and another sect believed the Divine Spirit descended
    upon Abdallah Ibn Amr.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Khorassan, Abu Muslim was widely regarded as an incarnation of the spirit
    of God, and Ostasys professed to be an emanation of the Godhead and gathered thousands
    of followers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ata, called Mokanna or the veiled prophet because he wore a golden mask, is
    described as a self-styled Avatar with many followers who resisted the Caliph's
    armies before ending his life with his harem and servants in a besieged castle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Babek taught transmigration of souls and communism; his followers resisted
    the Caliph's troops, and he claimed that the soul of an ancient law-giver named
    Bod had passed into him.
  category: speech
  evidence_refs:
  - ev:9
