  quote: ''
  summary: The passage presents an allegorical discourse in which hostile horn-like
    beings attack the human soul, while angelic and intellectual beings aid spiritual
    progress. It describes increasingly exalted regions near the Great King or Lord,
    culminating in Active Intelligence and in an apophatic account of divine beauty
    and splendour. The narrator then explains the allegory as concerning the soul's
    development, its eternal destiny, the formation of a spiritual microcosm, and
    beatitude through intellectual perception.
