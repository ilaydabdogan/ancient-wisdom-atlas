canonical_text:
  quote: ''
  summary: The passage describes spiritual combat and ascetic practice as producing
    detachment from sense perception, insight into reality, foreknowledge, and saintly
    powers. It contrasts earlier and greatest mystics, who do not value or publicize
    such powers, with modern practitioners who seek unveiled perception. It also gives
    examples of miraculous powers among the Prophet’s companions and concludes with
    a mirror analogy for right disposition of the soul.
  language: English
  quote_policy: summarized
literal_observations:
