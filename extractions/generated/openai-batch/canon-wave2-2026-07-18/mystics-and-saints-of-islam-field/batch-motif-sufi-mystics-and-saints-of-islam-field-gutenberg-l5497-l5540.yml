  text: Men who practice spiritual combat are said to become disentangled from sense
    things and to perceive the real nature of things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Such practitioners are said often to know events before they occur.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Through prayers and spiritual force, such practitioners are said to hold sway
    over inferior beings who must obey them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The greatest mystics do not boast of disentanglement or rule over inferior
    creatures and do not reveal what they have learned unless ordered to do so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Supernatural workings are described as painful, and those experiencing them
    ask God for deliverance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The companions of the Prophet are said to have practiced spiritual warfare
    and to have received tokens of divine favour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists walking on water, passing through fire unharmed, and receiving
