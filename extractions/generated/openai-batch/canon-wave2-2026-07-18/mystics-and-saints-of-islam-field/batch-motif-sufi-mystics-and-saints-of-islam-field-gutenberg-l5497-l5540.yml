  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some modern practitioners are said to value attaining disentanglement from
    sense things and speaking about mysteries discovered when the veil is removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: These modern practitioners use ascetic methods and meditation to nourish the
    intellectual soul and maximize perception.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the described goal, a person’s perception is said to comprehend all existence
    without a veil, from the throne of God to the smallest drops of rain.
  category: attribute
  evidence_refs:
  - ev:4
