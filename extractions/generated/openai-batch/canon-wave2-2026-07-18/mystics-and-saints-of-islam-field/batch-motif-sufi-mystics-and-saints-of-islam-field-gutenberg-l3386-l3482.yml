canonical_text:
  quote: ''
  summary: The passage gives a biographical account of Fariduddin Attar's call to
    religious life and introduces the allegorical poem Mantiq-ut-tair, in which birds
    representing mystics, led by the hoopoe, undertake a perilous journey to the Simurgh
    through seven named valleys of spiritual progress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fariduddin Attar is described as born near Nishapur in Khorassan in A.D. 1119
    and as having carried on his father's druggist business, from which he received
    the cognomen Attar.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wandering dervish pauses at Attar's shop door, silently regards him, and
    fills his eyes with tears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dervish contrasts his own light bundle and clothes with Attar's sacks
    of valuable drugs and asks what Attar will do when the time comes to go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Attar promptly abandons his business, leaves the world, enters a Sufi convent
    under Sheikh Ruknuddin, practices devotion, and later makes the pilgrimage to
    Mecca.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Attar is said to have conceived the idea of compiling stories of holy men
    of Islam and to be chiefly known for the Mantiq-ut-tair or Parliament of Birds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the allegorical poem, various birds representing mystics unite under the
    leadership of the hoopoe to journey to the court of the Simurgh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Simurgh is described as a mysterious bird whose name signifies thirty
    birds and as dwelling in Mount Kaf, the mountain encircling the world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The birds initially offer excuses for not undertaking the journey; the hoopoe
    rebukes them and says the road is perilous and that many start but few reach the
    goal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The hoopoe names seven valleys on the road: Search, Love, Knowledge, Independence,
    Unity, Amazement, and Poverty and Annihilation.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Valley of Search, new trials appear at every step; the traveler must
    cast away possessions, empty the hand, detach the heart from earthly things, and
    then receive rays from the Light of the Divine Essence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Valley of Love, the traveler must be made of fire, be ready to sacrifice
    worlds to flames, and pass beyond distinctions such as faith and infidelity, good
    and evil, religion and irreligion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Valley of Knowledge, pilgrims progress according to their capacities;
    some reach only the temple entrance, another finds the Divinity within it, and
    the Sun of Knowledge illumines each according to capacity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Valley of Knowledge includes images of a path through fire, the furnace
    of the world becoming a garden of roses, the almond within the shell, God under
    the veil of apparent things, and successful diving into the depths of an ocean
    by the perfect.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Valley of Independence, the traveler is done with everything but God;
    a hurricane annihilates kingdoms, seven seas become a pool, seven planets a spark,
    eight paradises a curtain, seven hells ice, and many caravans perish.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Valley of Unity is described as privation of all things, reduction to
    unity, and contemplation of the Divine Essence apart from every attribute.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the Valley of Amazement, the pilgrim suffers and groans; each breath is
    like a sword, days and nights pass in sighs, blood drops from each hair trace
    the word alas, and the pilgrim finds his way no more.
  category: sequence
  evidence_refs:
  - ev:11
