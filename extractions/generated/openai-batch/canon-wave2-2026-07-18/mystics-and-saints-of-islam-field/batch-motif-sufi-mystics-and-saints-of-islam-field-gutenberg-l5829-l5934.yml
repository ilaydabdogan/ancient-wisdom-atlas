canonical_text:
  quote: ''
  summary: 'The passage collects Islamic and Persianate traditions about Jesus: Rumi’s
    Jesus imagery; narratives of Jesus’ homelessness and teachings on worldly transience;
    an account of Jesus’ trial, prophetic birth, suffering, crucifixion, and images
    of his face from the Dabistan; notes on Gospel translations; ethical sayings attributed
    to Jesus; and a temptation scene involving Satan and a mountain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rumi’s Diwan-i-Shams-i-Tabriz is cited as identifying the speaker with a sweet-smiling
    Jesus through whom the world is alive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rumi is also cited as saying that the pure one is regenerated by the breath
    of Jesus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Jalaluddin Rumi spent most of his life at Iconium,
    where the author thinks apostolic traditions likely lingered.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says that Jesus’ homelessness strongly impressed the Mohammedan
    imagination and gives a Pathan youth’s question about the Son of Mary having nowhere
    to lay his head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Qissas-al-ambiya story, Jesus sees a fox in the wilderness and asks
    where it is going; the fox says it is returning home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jesus says that everyone has built a house but that he has no resting-place;
    hearers offer to build a house for him and pay the expenses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Jesus chooses a site at the edge of the sea where the waves are highest and
    explains that the world is a sea on which no abiding building can be raised.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: An inscription over a bridge at Fatehpur Sikri attributes to Jesus the saying
    that the world is a bridge to pass over, not to build upon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The author comments that a keen sense of the transitoriness of earthly things
    characterizes Oriental saints and mystics.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Dabistan account, the high-priest asks Jesus under oath whether he
    is the Son of God; Jesus affirms and says the Son of Man will sit at God’s right
    hand and descend in the clouds of heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Dabistan account says the hearers call Jesus’ statement blasphemy because,
    according to the creed of the Jews as represented there, God never descends in
    the clouds of heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage cites Isaiah as announcing Jesus’ birth through imagery of a branch
    from the root of I'shai, a flower in which the Spirit of God dwells, and a virgin
    bearing a son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Dabistan account says Jesus was spat upon, smitten, scourged, and wounded,
    and connects these events with Isaiah’s predictions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Pilatus washes his hands and disclaims part in Jesus’ blood; the Jews in the
    account accept responsibility for the blood, and the passage states that this
    leads to retribution against them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The cross is placed on Jesus’ shoulders; a woman wipes his bloody face with
    the border of her garment and obtains three images of it, said to remain in Spain,
    Milan, and Rome.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Mohsin Fani is quoted as saying that the Gospel was translated from the tongue
    of Jesus into Arabic, Greek, Latin, and Syriac.
  category: other
  evidence_refs:
  - ev:9
- id: obs:17
  text: A saying attributed to Jesus condemns learned men who love reputation, honor
    in assemblies, and invitations to feasts, saying they have their reward in the
    world.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: In the Kitab-al-Aghani, Satan comes to Jesus, challenges him about speaking
    truth, tells him to climb a mountain and cast himself down, and Jesus refuses
    by saying God has forbidden tempting him through self-destruction.
  category: sequence
  evidence_refs:
  - ev:11
