    lingered.
  claim_level: historical_contact
  target: apostolic traditions at Iconium
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: The wording is speculative and does not provide direct evidence that
    Rumi used those traditions.
