candidate_motifs:
- id: motif:1
  label: life-giving or regenerating Jesus
  taxonomy_refs:
  - death_rebirth
  basis: Rumi’s cited lines say the world is alive through Jesus and that the pure
    one is regenerated by Jesus’ breath.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage speaks of regeneration and life-giving presence, but does
    not narrate a literal death-and-rebirth event.
- id: motif:2
  label: homeless holy figure teaching worldly impermanence
  taxonomy_refs:
  - wisdom
  basis: Jesus’ homelessness is emphasized, and the fox-house story turns his lack
    of resting-place into a teaching about the world as an unstable sea.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The available taxonomy has no exact homelessness or renunciant-wanderer
    category; wisdom is a broad fit.
- id: motif:3
  label: world as temporary passage, not dwelling
  taxonomy_refs:
  - wisdom
  basis: The sea story and bridge inscription both state that the world is not a stable
    place for building but something to pass over or through.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a didactic image rather than a full narrative episode.
- id: motif:4
  label: sacred birth through virgin and Spirit
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Isaiah is cited as announcing that a virgin will bear a son and that the
    Spirit of God will dwell in the flower from the root of I'shai.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the birth through quoted prophecy rather than narrating
    the birth itself.
- id: motif:5
  label: divine sonship under accusation
  taxonomy_refs:
  - divine_parent_child
  basis: The high-priest asks Jesus whether he is the Son of God, Jesus affirms the
    wording, and his speech leads to a charge of blasphemy.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage reports a trial dialogue; it does not independently develop
    a full divine parent-child mythic cycle.
- id: motif:6
  label: suffering righteous figure led to crucifixion
  taxonomy_refs:
  - sacrifice
  basis: Jesus is spat upon, smitten, scourged, wounded, made to carry a cross, and
    led to die; the text connects wounds with transgressions and his people.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The selected passage does not include resurrection or post-death events.
- id: motif:7
  label: miraculous holy image from contact with the suffering body
  taxonomy_refs: []
  basis: A woman wipes Jesus’ bloody face with her garment and obtains three images
    said to be preserved in three places.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage reports the images but gives no further explanation of their
    making or ritual use.
- id: motif:8
  label: condemnation of reputation-seeking religious learning
  taxonomy_refs:
  - wisdom
  basis: The attributed saying calls learned men hateful in God’s eyes when they love
    reputation, honored places, and feasts.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is an ethical aphorism rather than a narrative motif.
- id: motif:9
  label: Satanic temptation of a holy figure on a mountain
  taxonomy_refs:
  - trickster_boundary
  basis: Satan challenges Jesus’ truthfulness and urges him to climb a mountain and
    cast himself down; Jesus refuses the test.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The taxonomy reference is approximate; Satan functions as a tempter rather
    than as a playful trickster.
