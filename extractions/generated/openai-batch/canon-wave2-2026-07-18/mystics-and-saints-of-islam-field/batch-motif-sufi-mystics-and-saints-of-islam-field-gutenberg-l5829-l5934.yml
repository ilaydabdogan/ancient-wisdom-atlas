    and Pilate approximates the Gospel narrative more closely than the version ordinarily
    current among Mohammedan writers.
  claim_level: same_motif
  target: Gospel trial and Passion narrative
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: This records the source author’s comparison only; no independent textual
