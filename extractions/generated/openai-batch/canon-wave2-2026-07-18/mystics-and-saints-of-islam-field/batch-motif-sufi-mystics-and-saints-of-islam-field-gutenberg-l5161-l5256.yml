  summary: The passage summarizes Mullah Shah’s mystical doctrine of divine unity,
    the dissolving of individual existence in God, secrecy for initiates, ascetic
    preparation, and ethical dangers attributed to pantheistic interpretation. It
    contrasts possible epicurean consequences with morally austere Sufi figures, especially
    Mullah Shah and Prince Dara-Shikoh, and includes Dara-Shikoh’s account of meeting
    Mullah Shah and seeking the doctrine of Unity through multiple scriptures including
    the Upanishads or Vedas, the Koran, Pentateuch, Gospels, and Psalms.
  language: English
  quote_policy: summarized
