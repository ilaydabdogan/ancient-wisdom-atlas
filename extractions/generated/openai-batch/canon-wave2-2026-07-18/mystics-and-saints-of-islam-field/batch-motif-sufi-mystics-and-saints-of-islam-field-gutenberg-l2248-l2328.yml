canonical_text:
  quote: ''
  summary: The passage recounts Habib Ajami as a Basran usurer who extracts payments
    harshly, refuses a dervish, sees household food turn to blood, repents, confesses
    before Hasan Basri, remits debts, gives away wealth, adopts devotional life in
    a hermitage by the Euphrates, and later receives household provisions described
    as wages from his unseen Employer or Master.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Habib Ajami is introduced as a rich usurer of Basra who spends much of his
    time collecting money owed to him and demanding payment for the time spent collecting
    it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a debtor's house, Habib takes a neck of mutton from the debtor's wife and
    later exacts money from another debtor to buy wood and bread.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a dervish asks for alms at Habib's door, Habib sends him away without
    giving alms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the dervish departs, Habib's wife finds that the food in the cooking
    pot has become blood, and she attributes the misfortune to Habib's harshness toward
    the dervish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Habib is frightened, repents, and vows to abandon usury.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Children first avoid Habib because they fear the dust raised by his feet will
    curse them; after his repentance, children avoid him so that the dust raised by
    their own feet will not soil him.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Habib consults Hasan Basri while Hasan is preaching on the terrors of judgment
    day, faints from fear, and then publicly confesses his sins before Hasan and the
    congregation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Habib remits all debts owed to him, invites debtors to take back their bonds,
    gives away his accumulated wealth, and is left with nothing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Habib builds a hermitage on the banks of the Euphrates, spends nights in prayer,
    and attends Hasan Basri's instruction during the day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Habib's wife complains that the household has no food or clothing, Habib
    says he has been working for a generous employer who will pay him after ten days.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the tenth day, four men bring flour, a sheep, honey, and oil to Habib's
    wife, and a fifth brings gold; they say the goods are from Habib's Employer and
    that his Master bids him continue his work.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After hearing his wife's report of the delivered provisions and message, Habib
    becomes more firmly resolved to give up the world and live to God.
  category: sequence
  evidence_refs:
  - ev:7
