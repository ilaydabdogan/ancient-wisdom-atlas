  summary: A sequence of Sufi biographical anecdotes presents divine appointment,
    dream admonition, ascetic discipline, paradoxical spiritual instruction, suffering
    near the divine Friend, mercy toward a fire-worshipper who feeds birds, and Zu'n
    Nun's final prayers and deathbed blessing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man says that after a night of drinking and debauchery he was told
    in sleep that God had taken an ascetic's soul and chosen him to fill the ascetic's
    place on earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unnamed man is instructed to go to a river bank, meet a ferryman, receive
    a garment, staff, and water-skin, and live as the first owner lived.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Schakran grieves that he was not chosen as successor to the dead saint, then
    hears a sleeping voice saying that divine favor is a free gift and that God does
    not forget those who seek Him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A disciple of Zu'n Nun reports forty pilgrimages to the Kaaba and forty years
    of nightly devotional exercises without revelation from the unseen world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zu'n Nun tells the disciple to omit prayers, eat freely, and sleep; the disciple
    prays anyway, eats, sleeps, and dreams of the Prophet conveying God's salutation
    and instruction to continue bravely on the path.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator explains Zu'n Nun's instruction by comparing sheikhs to physicians
    and says some spiritual-path matters are not justified by the written law, citing
    the command to Abraham to slay his son.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While circling the Kaaba, Zu'n Nun questions an emaciated man who says he
    loves the Friend and that those whom the Friend approaches most nearly are most
    severely tried.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Zu'n Nun meets a fire-worshipper scattering millet in a snowy plain for birds,
    and the man says that even if God does not accept the act, it is enough that God
    sees it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Long afterward at Mecca, the former fire-worshipper says God accepted the
    act, gave him faith, and brought him to the Kaaba; Zu'n Nun then hears a voice
    saying the Lord's mercy is without limit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Zu'n Nun daily prays for uncertain subsistence, lack of honor among men, and
    seeing God's face in mercy at death; at his last moment he says he wants his final
    breath to bless the Most High.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
