- id: motif:4
  label: Philosophical waters and mountain ascent toward knowledge
  taxonomy_refs:
  - mystical_quest
  - wisdom
  - ascent
  - cosmic_mountain
  basis: Flowing waters are glossed as logic and metaphysics; their refreshment lets
