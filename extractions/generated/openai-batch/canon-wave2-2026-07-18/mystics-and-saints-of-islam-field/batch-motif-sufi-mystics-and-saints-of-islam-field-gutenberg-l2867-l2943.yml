canonical_text:
  quote: ''
  summary: 'The passage recounts Avicenna''s secret departure from Hamadan in Sufi
    disguise, his reception at Ispahan, later illness and death, and literary links
    with Omar Khayyam. It then gives explanatory notes for allegorical images: ascent
    through heavenly gates, bad companions that hinder intellect, waters as philosophical
    disciplines, the mountain of Kaf as the heights of science, the dark pole as the
    soul needing divine grace, the miry sea as Matter joined with Form, opposing faculties
    as horned or animal figures, and the body as a tattered vest awaiting resurrection
    while the soul enjoys knowledge in heaven.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After liberation from imprisonment, Avicenna secretly left Hamadan with his
    brother, his disciple Joujani, and two servants, with all five disguised as Sufis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group reached Ispahan after a painful journey and was received in a friendly
    manner by Ala-ed-Dowla; Avicenna continued philosophical discussions and composed
    the Shifa and the Najat there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Avicenna later followed Ala-ed-Dowla toward Bagdad, suffered a gastric malady
    and apoplexy, recovered temporarily, and died after the sickness returned at age
    57 in A.D. 1037.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Professor Browne is cited as saying that a celebrated stanza in Fitzgerald's
    translation of Omar Khayyam was actually composed by Avicenna.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cited stanza describes a first-person rise from earth's centre through
    the Seventh Gate to Saturn's throne, with many knots unravelled but not the master-knot
    of human fate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Professor Browne is also cited as saying that a few days before death Omar
    Khayyam was reading Avicenna's Shifa, specifically the chapter on the One and
    the Many.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note identifies man's bad companions as unregulated imagination, irascibility,
    and carnal concupiscence, and says death delivers man and transports him to the
    celestial country of true repose.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note states that flowing waters signify logic and metaphysics, while a stagnant
    pool signifies positive science as the basis of philosophy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same note says that a man refreshed by the flowing waters of philosophy
    will grasp the scheme of the universe and scale the encircling mountain of Kaf
    without worldly entanglements.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note says the pole surrounded by darkness signifies the soul of man, which
    is intended to govern the body but needs divine grace to attain truth and emerge
    into full light.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note links the miry sea to Matter stirred into life by the setting sun,
    identified as Form, with birth, death, ebb, and flow proceeding in ceaseless change.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note describes the kingdom of Form as beginning with the four mingled elements
    and developing through mineral, vegetable, and animal stages before pure intellect
    struggles with human faculties.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The flying horn is explained as imaginative faculties, the marching horn as
    passions, and the watchman as the perceptive faculty conveying impressions of
    the five senses to the King, identified as the human soul.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: A note cross-references the Logos of Philo.
  category: other
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says the soul's existence is not manifest to the senses yet is
    too manifest to doubt, and that the body destroyed by death is not mended until
    resurrection while the soul is in heaven enjoying all knowledge.
  category: attribute
  evidence_refs:
  - ev:11
