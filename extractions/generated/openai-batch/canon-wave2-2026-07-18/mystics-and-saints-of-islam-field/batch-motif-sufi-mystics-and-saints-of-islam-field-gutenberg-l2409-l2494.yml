canonical_text:
  quote: ''
  summary: The passage gives a biographical account of Avicenna’s early education,
    his exceptional mastery of religious and scientific subjects, his habits of study,
    prayer, and dream-problem-solving, his resolution of difficulties in Aristotle
    through Al Farabi’s commentary, his healing of rulers, access to a rare library
    later destroyed by fire, political wandering, and eventual appointment as vizier
    after curing Shams-ed Dawla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Avicenna was born near Bokhara and, by age ten, was described as a perfect
    master of the Koran and a student of arithmetic and algebra.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avicenna studied logic, Euclid, and the Almagest under An-Natili and soon
    surpassed his teacher by explaining difficulties to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Avicenna studied medicine, treated patients to increase his knowledge rather
    than for gain, and eminent physicians came to him for instruction when he was
    sixteen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When perplexed by a question, Avicenna went to the mosque and prayed to God
    to resolve the difficulty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At night Avicenna lit a lamp, read and wrote, drank wine when tired, and reported
    that he often found solutions in sleep to problems from his waking thoughts.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Avicenna read Aristotle’s Metaphysics forty times without understanding it,
    then bought Al Farabi’s commentary, after which his difficulties were immediately
    cleared up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After curing Emir Nuh Ibn Mansur, Avicenna was rewarded with access to the
    prince’s library, which held chests of rare manuscripts and ancient scientific
    treatises.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prince’s library was later destroyed by fire; the passage says Avicenna
    remained the sole depository of its knowledge and reports that some accused him
    of burning it to monopolize its contents.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After leaving Bokhara, Avicenna went to Jorjan and then wandered through towns
    of Khorassan; Sultan Mahmoud sent descriptions and drawings of him so that he
    might be arrested after Avicenna refused to come to court.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Avicenna was called to Hamadan to treat Shams-ed Dawla, cured him, and was
    appointed vizier in gratitude.
  category: sequence
  evidence_refs:
  - ev:10
