  summary: The passage moves from table-of-contents entries into the preface. The
    preface argues that Islamic mysticism is not merely an alien import and locates
    its roots in the Koran, citing the Koranic light verse. It presents Muhammad and
    early companions as marked by religious meditation, love of the Maker, fear of
    the Lord, and expectation of seeing hell after death. It then says this fear led
    to asceticism, mentions ascetic communities founded by Abu Bekr and Ali, and describes
    early Sufis as orthodox mystics within Islam. The closing paragraph identifies
    sources for the sketches and the translator's intended Christian readership context.
