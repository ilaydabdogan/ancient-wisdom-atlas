canonical_text:
  quote: "“How can two loves co-exist in one heart?”"
  summary: 'The passage recounts episodes from Ibrahim’s ascetic life: reunion with
    his wife and son, the son’s death after Ibrahim prays against divided attachment,
    divine voices at the Kaaba, Ibrahim’s explanation of renouncing kingship, sayings
    on marriage, poverty, and wealth, and his care for companions who had plotted
    to eat without him.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ibrahim’s wife and son join a fakir to seek him; when the wife sees Ibrahim
    she identifies him as the son’s father, bystanders weep, and the son swoons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the son revives, Ibrahim greets and embraces him, then asks about his
    religion, knowledge of the Koran, and religious books; the son answers affirmatively.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ibrahim prepares to leave; his wife and son weep and prevent him, after which
    Ibrahim raises his eyes to heaven, prays for help, and the son immediately dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ibrahim explains to his companions that a voice challenged him for attachment
    to God while his heart was engaged with another person, and that he prayed for
    either the child’s soul or his own to be taken if love for the child separated
    him from God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the Kaaba on a rainy night, Ibrahim asks God to blot out his sins and hears
    a Voice answer that if everyone’s sins were blotted out, none would share in the
    ocean of divine mercy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ibrahim says he abandoned rank and kingdom after looking in a mirror and seeing
    his tomb, the long road to the other world, lack of provision, and an upright
    judge questioning him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ibrahim says a dervish who marries is like one embarking on a vessel, and
    when children are born he is like one drowning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ibrahim tells a groaning dervish that he bought the position of dervish at
    the price of royalty and considers it a good bargain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ibrahim refuses gold offerings, calls a rich man who still seeks more wealth
    wretched, and says he possesses nothing and asks nothing of anyone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ibrahim works for hire, spends his earnings on provisions for companions,
    returns after evening devotions, and cooks for them when he thinks they may have
    gone to bed hungry.
  category: sequence
  evidence_refs:
  - ev:8
