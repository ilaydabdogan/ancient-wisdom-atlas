canonical_text:
  quote: ''
  summary: 'The passage gives several anecdotes about Hasan Basri: his fear of divine
    judgment, a deathbed encounter with the fire-worshipper Shamaun followed by a
    dream of Shamaun in Paradise, and a Tigris episode in which Hasan misjudges a
    man who then saves drowning passengers and teaches Hasan about inner sight and
    humility.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hasan is described as continually apprehensive because of fear of the Lord,
    compared to a man seated near an executioner.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After hearing of sinners who remain in hell for years and are then taken out,
    Hasan prays to be among those eventually released from hell.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hasan weeps at night because he fears an unlawful step or evil word may cause
    him to be rejected from the throne of the Most High and his pious works not accepted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hasan says death, though certain, resembles something doubtful and uncertain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shamaun is described as Hasan's neighbor, an infidel and fire-worshipper,
    whose hair and beard are blackened by smoke as his last hour approaches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Shamaun gives three objections to Muslims: they call the world perishable
    but heap up treasures, call death inevitable but neglect preparation for another
    world, and expect to contemplate the Most High while doing acts He abhors.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hasan answers that believers confess the unity and existence of the Most High,
    while Shamaun has worshipped fire; Hasan says fire is only a creature and cannot
    scorch him if divine grace is granted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shamaun professes the faith of Islam and dies soon afterward; Hasan dreams
    of him wearing a gold crown, clothed in resplendent raiment, and walking in Paradise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hasan habitually considers everyone he sees superior to himself, but at the
    Tigris he internally suspects a seated man of drinking wine with a woman of doubtful
    character.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A heavily laden boat containing seven persons founders near the shore, and
    the seated man casts himself into the river and draws out six persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rescuer challenges Hasan to save the remaining person, reveals that the
    jar contains water and that the woman is his mother, and says Hasan has looked
    with the outer eye rather than the inner eye.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hasan falls at the rescuer's feet, kisses his hand, recognizes him as one
    of the Lord's chosen servants, asks to be saved from the abyss of self-worship,
    and afterward considers everyone superior to himself.
  category: sequence
  evidence_refs:
  - ev:7
