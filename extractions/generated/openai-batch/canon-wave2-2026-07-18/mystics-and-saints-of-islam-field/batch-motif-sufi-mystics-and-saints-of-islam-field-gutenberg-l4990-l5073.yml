canonical_text:
  quote: ''
  summary: Prince Dara-Shikoh seeks out the secluded ascetic Mullah Shah as a spiritual
    guide, is first rebuffed, persists after a servant's criticism and sudden death,
    and is later accepted through mediation. In Mullah Shah's cell, Dara-Shikoh tends
    a smoking lamp-wick, wins the sheikh's affection, and undergoes an experience
    in which the invisible world is revealed. Dara-Shikoh's sister Fatimah later seeks
    instruction by letters, is admitted among the initiates, attains intuitive knowledge
    of God and union with Him, and is described as fit to succeed the sheikh.
  language: English
  quote_policy: summarized
