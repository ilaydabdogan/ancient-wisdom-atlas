canonical_text:
  quote: ''
  summary: 'The passage defines the mihrab, then recounts several episodes about Zu''n
    Nun of Egypt: his renunciation after seeing a blind bird miraculously fed, his
    exhortation of a caliph and persecution in Cairo, his encounter with a maiden
    later recognized as an angel, and Schakran''s account of ferrying an aged man
    who predicts his own death and bequeaths ascetic objects to a dissolute musician.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mihrab is defined as the niche or apse in a mosque wall facing Mecca.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ibn Khalliqan describes Zu'n Nun as eminent in learning, devotion, and communion
    with the Divinity; the passage also states that Zu'n Nun's father was a Nubian-born
    slave who was enfranchised and adopted by Koraish.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zu'n Nun says that while journeying from Egypt he slept in a desert, saw a
    blind little bird fall from its nest, and saw the ground split open to reveal
    gold and silver trays containing sesame and water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Zu'n Nun treats the bird episode as a warning and says that he renounced the
    world and remained at the door of divine mercy until admitted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After enemies denounced Zu'n Nun to Caliph Mutawakkil, he was summoned to
    Bagdad, exhorted the caliph, moved him to tears, and was dismissed honorably.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Cairo, Zu'n Nun rebuked the inhabitants and local governors, was beaten
    and imprisoned, and while being dragged through the street declared that the suffering
    was nothing if he was not separated from God.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Zu'n Nun saw a maiden on the roof of a riverside palace; she rebuked him for
    allowing anything to draw his attention away from God, disappeared, and he recognized
    her as an angel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Schakran, Zu'n Nun's spiritual teacher, recounts that as a young ferryman
    on the Nile he ferried an aged man wearing a tattered robe, carrying a staff,
    and wearing a water-skin around his neck.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The aged man tells Schakran that Schakran will forget him until noon the next
    day, then find him dead in the shade of a solitary tree, pray over him, bury him,
    and deliver his robe, staff, and water-skin to the first person who asks for them
    across the river.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Schakran remembers at noon, crosses the river, finds the aged man dead with
    a calm smiling face, prays over him, buries him at the foot of the tree, and takes
    the robe, staff, and water-skin back to his boat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the eastern shore, a young dissolute hired musician asks for the bequest,
    receives the robe, staff, and water-skin, removes his gay clothes, puts on the
    tattered robe, hangs the water-skin around his neck, takes the staff, and departs.
  category: sequence
  evidence_refs:
  - ev:10
