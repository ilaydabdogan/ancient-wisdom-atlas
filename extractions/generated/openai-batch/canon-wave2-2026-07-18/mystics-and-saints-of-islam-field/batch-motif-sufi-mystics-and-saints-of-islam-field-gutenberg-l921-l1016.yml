canonical_text:
  quote: ''
  summary: 'The passage gives hagiographic anecdotes and sayings of Rabia of Basra:
    her intimate address to God, enslavement and emancipation, pilgrimage reflection
    at the Kaaba, night prayer, refusal of marriage, concern with resurrection and
    judgment, exclusive love of God, a dream encounter with the Prophet, and teachings
    on divine vision and repentance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabia is introduced as the daughter of Ismail, a woman known for holy life,
    native to Basra and from the tribe of Adi.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rabia is described as holding converse with God; she asks God to consume with
    fire a heart that loves Him, and a voice refuses and tells her not to think ill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the silence of night, Rabia goes to the roof of her house and says that
    others are with their beloveds while she rejoices in being alone with God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After her parents die during famine in Basra, Rabia is sold as a slave, treated
    harshly, and made to do menial services.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After falling and breaking her wrist while avoiding a stranger's gaze, Rabia
    says her only disquiet is not knowing whether God is satisfied with her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A voice tells Rabia not to vex herself and promises her a rank on the day
    of Resurrection that nearby angels will envy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Rabia's master overhears her praying that her heart desires God's approbation
    and obedience, but that being delivered into a creature's hands hinders her service.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After hearing Rabia's prayer, her master says it is no longer possible to
    treat her as a slave and frees her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: During pilgrimage to the Kaaba, Rabia halts in the desert, calls both herself
    and the Kaaba stones, and says she needs to contemplate God's face.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A voice from the Most High answers that Moses desired to see the divine Face,
    and that the mountain shown it dissolved into many fragments.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Abda reports that Rabia spends the whole night in prayer, briefly sleeps in
    her oratory near dawn, and warns her soul about sleeping until the resurrection
    call.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When asked by Hasan Basri about marriage, Rabia says she has no will to dispose
    of, belongs to the Lord, rests under His commandments, and counts herself as nothing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Rabia states that she reached her degree of piety by annihilating herself
    completely.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Rabia declines marriage by citing anxiety over dying with faith intact, receiving
    her register in her right hand on the Day of Resurrection, and being led either
    to Paradise or to hell.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Rabia says she comes from the other world, goes into the other world, and
    in this world eats its bread while doing works of the other world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Rabia says she loves the Lord so much that she does not trouble herself about
    Satan's enmity.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: In a dream, the Prophet asks whether Rabia loves him, and she answers that
    love of the Most High fills her heart so completely that there is no room for
    love or hatred toward anyone else.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Rabia says that if she did not see the one she serves, she would not serve
    Him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: Rabia is often found in tears and says she fears a voice at the last moment
    might declare her unworthy to appear in God's court.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:20
  text: Rabia teaches that repentance depends on God granting repentance, and that
    if He grants it, He will accept it.
  category: speech
  evidence_refs:
  - ev:10
