  quote: ''
  summary: 'The passage gives a biographical account of Mullah Shah: his birth in
    Badakshan, departure for study and spiritual training, discipleship under Sheikh
    Mian Mir, long ascetic practice, attainment of union with God in Kashmir, later
    withdrawal and influence over disciples, non-dual mystical utterances, preference
