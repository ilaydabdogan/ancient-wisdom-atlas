canonical_text:
  quote: "“I am the Truth”"
  summary: The passage introduces Mansur Hallaj, describes his disputed reputation,
    reports accusations of miraculous or sorcerous powers, presents Shiite and Sufi
    interpretations of his ascetic doctrine and divine utterances, and recounts an
    orthodox account of his arrest, interrogation, denial of divinity, and a disputed
    teaching about a substitute for pilgrimage through ritual action and charity to
    orphans.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed male figure from the preceding context is said to have died in
    860 A.D., with his tomb still venerated at Cairo.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mansur Hallaj is identified as a Persian of Zoroastrian lineage, a pupil of
    Junaid of Bagdad, and a more enthusiastic figure than the sober-minded Junaid.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hallaj’s utterance “I am the Truth” is said to have led to his execution,
    because “the Truth” is described as one of the recognized names of God in Islamic
    nomenclature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Sufis regard Hallaj as a great saint, while more orthodox
    observers regard him as a daring blasphemer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Orthodox accounts described Hallaj as a sorcerer associated with supernatural
    powers, including making summer fruits appear in winter, revealing secrets, knowing
    private thoughts, and drawing inscribed coins from an empty hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moderate Shiites interpreted Hallaj’s doctrine as a path of abstinence, refusal
    of pleasure, and chastising the flesh, by which a person could be purged of what
    is human, receive the spirit of God, and have actions done by God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Shiites are reported to have explained Hallaj’s death by his influence over
    princes and courts and the resulting anxiety of others, especially orthodox mullahs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ghazzali is said to have interpreted Hallaj’s sayings favorably because of
    excessive love for God, while many tenth-century theologians considered Hallaj
    an infidel and blasphemer deserving execution.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage notes disagreement among Sufis about whether Hallaj was a thorough-going
    pantheist or taught a more limited divine immanence in certain souls.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the orthodox account, common people in Bagdad circulated reports that Hallaj
    could raise the dead and that Jinn were his slaves who brought him whatever he
    desired.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hallaj and some followers were arrested; the followers admitted that they
    regarded him as God because he raised the dead, while Hallaj denied claiming divinity
    or prophethood and described himself as a mortal who worshipped the Most High.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The vizier sought a legal sentence against Hallaj, but legal authorities said
    they lacked proof or confession; later a book of Hallaj’s was found describing
    a substitute for pilgrimage involving a cleansed closed chamber, ritual circuits,
    feeding thirty orphans, serving them, clothing them, and giving each seven dirhems.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
