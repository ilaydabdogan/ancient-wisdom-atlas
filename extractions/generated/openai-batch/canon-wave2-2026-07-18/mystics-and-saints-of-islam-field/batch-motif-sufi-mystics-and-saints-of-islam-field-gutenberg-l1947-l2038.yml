candidate_motifs:
- id: motif:1
  label: Mystic identification with the divine Truth
  taxonomy_refs:
  - annihilation_union
  basis: Hallaj’s utterance “I am the Truth,” later favorable interpretation through
    excessive love of God, and the ascetic account of being purged of the human and
    acting by God support a motif of mystical union or annihilation.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage emphasizes that this interpretation was disputed; orthodox
    authorities understood the same utterance as blasphemy.
- id: motif:2
  label: Ascetic purification and ascent toward angelic or elect status
  taxonomy_refs:
  - mystical_quest
  - ascent
  - initiation
  basis: The moderate Shiite account describes abstinence, refusal of pleasure, chastising
    the flesh, gradual lifting to the height of the elect and angels, and purification
    from everything human.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The ascent is doctrinal and metaphorical in this passage, not a narrated
    journey through cosmic levels.
- id: motif:3
  label: Contested saint as miracle worker or sorcerer
  taxonomy_refs: []
  basis: The passage reports that orthodox writers attributed supernatural feats to
    Hallaj, including manipulating seasonal fruits, revealing secrets, knowing private
    thoughts, and producing inscribed coins.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: These are reported accusations or accounts, not confirmed events within
    the narrator’s own voice.
- id: motif:4
  label: Attributed raising of the dead
  taxonomy_refs:
  - resurrection
  basis: Common people of Bagdad reportedly said Hallaj could raise the dead, and
    his followers are said to have regarded him as God because he raised the dead.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The ability is presented as rumor and as follower testimony in an orthodox
    account, not as a direct narrative demonstration.
- id: motif:5
  label: Martyrdom through accusation of blasphemy
  taxonomy_refs: []
  basis: The passage states that Hallaj’s utterance led to execution, notes that some
    authorities regard him as saint and martyr, and contrasts this with theologians
    who judged him an infidel and blasphemer deserving death.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents several competing explanations for his execution,
    including doctrinal utterance and political influence.
- id: motif:6
  label: Ritual substitution and merit through charity
  taxonomy_refs:
  - sacred_exchange
  basis: A book attributed to Hallaj is said to prescribe a cleansed chamber ritual,
    circuits, feeding and serving thirty orphans, clothing them, and giving seven
    dirhems each as more meritorious than pilgrimage.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage presents this teaching as a discovered assertion used in a
    legal case; it does not show the ritual being performed.
comparison_claims:
- id: claim:1
  claim: The passage itself compares the diversity of opinions about Hallaj to Jewish
    and Christian differences concerning the Messiah.
  claim_level: same_function
  target: Jewish and Christian views concerning the Messiah
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison concerns divided reception of a religious figure; it
    does not claim that Hallaj is a messianic figure or that the traditions share
    a historical motif here.
- id: claim:2
  claim: The moderate Shiite interpretation compares the purified person’s reception
    of the spirit of God to Jesus receiving the spirit of God.
  claim_level: same_function
  target: Jesus as one who received the spirit of God
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the specific analogy stated in the passage
    and does not establish equivalence between Hallaj and Jesus.
