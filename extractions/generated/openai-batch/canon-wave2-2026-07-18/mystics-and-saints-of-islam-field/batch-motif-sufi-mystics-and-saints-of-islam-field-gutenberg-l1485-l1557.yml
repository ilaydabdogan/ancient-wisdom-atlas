canonical_text:
  quote: ''
  summary: 'The passage presents sayings and anecdotes about Fudhayl: he admonishes
    Caliph Harun-al-Rashid with warnings of judgment and hell, rejects the Caliph''s
    gold, criticizes conversation that forgets God, values inner virtue over outward
    asceticism, stresses obedience to a spiritual superior, accepts his son''s death
    as God''s will, and teaches service of God for love rather than fear or hope.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fudhayl tells Harun-al-Rashid to treat older, younger, and female Muslims
    as father, brothers, and sisters, and warns him about hell, the Day of Judgment,
    and interrogation on the Day of Resurrection.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harun-al-Rashid weeps; Fazl asks Fudhayl to stop; Fudhayl calls Fazl Haman,
    and Harun understands this as implying a comparison of himself to Pharaoh.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:3
  text: Harun-al-Rashid offers Fudhayl a purse containing a thousand pieces of gold,
    and Fudhayl rejects it as making his own burden heavier.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fudhayl says that he renounces this world while the Caliph renounces the next,
    contrasting the transitory world with the enduring next world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sofian Tsavri relates that Fudhayl judged an apparently pleasant evening of
    conversation to be not good because both speakers had forgotten the Most High.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A stranger comes to Fudhayl seeking talk and calm of mind, and Fudhayl sends
    him away, describing the exchange as mutual misleading with lies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator describes Fudhayl's fasts, watchings, ragged dress, and pilgrimages,
    but says he preferred interior virtue and purity of intention to outward observances.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Fudhayl says that modesty, compliance, meekness, and patience gain a higher
    reward than constant fasting and nightly prayer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fudhayl declares that even if he had a promise of whatever he asked in prayer,
    he would not offer that prayer except in union with a superior.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Fudhayl's only son dies young, Fudhayl is seen cheerful and says that
    God's good pleasure is also his own good pleasure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fudhayl's sayings condemn acting or refraining for human esteem, and define
    true service of God as service for love rather than fear or hope.
  category: speech
  evidence_refs:
  - ev:8
