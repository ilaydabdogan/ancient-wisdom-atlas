canonical_text:
  quote: ''
  summary: 'The passage defines conversion as an inward spiritual crisis within Islam,
    gives Al-Ghazzali''s analogy of actually taking refuge in God, and recounts four
    conversion examples: Al-Fudail the highwayman, Ibrahim Ben Adham the prince, Al-Ghazzali
    the theologian, and Ferid-eddin-Attar the poet/druggist. It concludes by comparing
    these cases to recognition and reversal and to cross-religious conversion as a
    psychological fact.'
  language: English
  quote_policy: summarized
