canonical_text:
  quote: ''
  summary: 'The passage presents Jalaluddin Rumi’s teaching through poetic and prose
    excerpts: beings pass through successive forms toward return to God; the soul
    can bear a Christ above space; the human task is to polish the soul like a mirror
    through discipline, love, free will, and guidance by a pir; the stone changed
    by the sun into a jewel is compared to hearts transformed by love; the excerpt
    ends with Rumi’s death, final counsel to disciples, tomb at Iconium, and revered
    status among Moslems.'
  language: English
  quote_policy: summarized
