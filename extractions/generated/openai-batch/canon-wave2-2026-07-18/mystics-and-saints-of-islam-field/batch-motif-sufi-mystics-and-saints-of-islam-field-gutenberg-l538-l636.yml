literal_observations:
- id: obs:1
  text: The passage contrasts Christian martyrology with Islamic ecstatic religious
    expression and attributes the latter to religious exercises, fasts, pilgrimages,
    desert conditions, poverty of ideas, and social-religious pretense.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ghazzali is reported as saying that the prophet commanded those not moved
    to tears by Koran recitation to pretend to weep and be moved, because forced practice
    may later become spontaneous.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that when repeated Koran verses lost ecstatic force, single
    lines or fragments of poems could suffice to produce ecstasy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Taury recited verses about mourning doves, shared sorrow, and mutual non-understanding
    between doves and the speaker; the listeners then fell into ecstatic contemplation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ibrahim ben Adham heard verses about forgiveness and estrangement and immediately
    entered a trance lasting twenty-four hours.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ghazzali divides ecstatic states produced by hearing poetic recitations into
    classes, including sensuous delight in melody and pleasure joined with understanding
    the apparent meaning of words.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The third class of hearer applies poetic language to relations between humans
    and God, aiming at knowledge of God, meeting Him, union with Him, secret contemplation,
    and removal of the veil.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Poetic references to praise or blame, acceptance or refusal, union with the
    Beloved or separation from Him, lament, and longing are said to act on the Sufi
    like a spark on tinder and set the heart aflame.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fourth and highest class consists of fully initiated persons whose minds
    are closed to everything except God, who are denuded of self, and who sink into
    the ocean of contemplation of God; this is called self-annihilation, or Fana.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage describes absorption in the Creator as like a flash of lightning
