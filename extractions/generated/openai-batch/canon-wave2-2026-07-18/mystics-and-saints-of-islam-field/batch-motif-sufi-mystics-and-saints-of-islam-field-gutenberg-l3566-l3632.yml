canonical_text:
  quote: ''
  summary: After a long journey, thirty exhausted birds reach the Palace of the Simurgh
    and ask that the Simurgh become their king. They are initially rejected, persist
    despite despair, receive a document listing their sins, undergo a death that becomes
    new life, see themselves reflected in the Simurgh, hear an explanation that the
    Simurgh is a mirror and that their journey was impelled by Him, and finally vanish
    in Him as guide, pilgrims, and road cease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Countless birds begin the journey, but only thirty arrive at the Palace of
    the Simurgh, exhausted and without feathers or wings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thirty birds say they have come so that the Simurgh may become their king,
    and they describe love for him as the motive for their journey.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chamberlain of the King rejects the birds and orders them to go back; after
    despair, they persist and are compared to a moth seeking death in a lamp flame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chamberlain of grace opens a door and gives the birds a document listing
    their sins against the Simurgh; reading it causes death that is also birth into
    new life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Attar states that the birds' bodies become dust, their souls are annihilated,
    they are purified of earthly elements, and they receive a new life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The birds behold themselves reflected in the Simurgh; depending on their gaze,
    the Simurgh appears as the thirty birds, the birds appear as the Simurgh, or only
    one Simurgh appears.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A voice says the Majesty of the Simurgh is a sun-resembling mirror in which
    contemplators see their own reflection.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The voice says that the birds' actions in the valleys occurred by the Simurgh's
    impulse and instructs them to find self-effacement in Him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The birds vanish in Him forever, and the distinctions of guide, pilgrims,
    and road cease.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator calls the bird tale an allegory, or a Sufi's "Pilgrim's Progress,"
    containing nearly five thousand couplets.
  category: other
  evidence_refs:
  - ev:9
