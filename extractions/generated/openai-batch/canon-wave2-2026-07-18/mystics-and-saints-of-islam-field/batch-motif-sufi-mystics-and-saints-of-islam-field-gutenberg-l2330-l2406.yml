canonical_text:
  quote: ''
  summary: A sequence of anecdotes contrasts Hasan Basri and Habib Ajami. Habib gives
    all his guest-food to a dervish and is shortly supplied with a richer meal and
    money. Hasan refuses to pray with Habib because of his pronunciation, but a dream-answer
    tells him Habib's heart is right. Habib truthfully tells pursuers that Hasan is
    in his dwelling, yet they do not find him; he attributes the escape to truthfulness
    and Qur'anic recitations. Habib contrasts purifying the heart with writing theological
    works. Attar comments that knowledge ranks above miracles and cites Solomon. Habib
    weeps at Qur'an recitation despite not understanding Arabic fully, saying his
    tongue is foreign but his heart is Arab.
  language: English
  quote_policy: summarized
