canonical_text:
  quote: ''
  summary: The passage presents a pantheistic ode of outward religious and cosmic
    searching that ends with finding the Godhead within. It then describes Jalaluddin
    Rumi's Masnavi, the reed flute's lament over separation from its home, and commentary
    on Sufi longing for return to God. A fable follows in which Moses rebukes a shepherd's
    anthropomorphic prayer, but God corrects Moses, emphasizing union, sincere love,
    and the heart over formal correctness. The passage closes by naming the 'Elephant
    in the Dark' as teaching a similar lesson.
