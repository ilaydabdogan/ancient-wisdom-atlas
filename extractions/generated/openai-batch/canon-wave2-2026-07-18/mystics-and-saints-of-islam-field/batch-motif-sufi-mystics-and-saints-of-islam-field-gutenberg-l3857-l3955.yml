  quote: ''
  summary: The passage introduces Suhrawardy as a learned Persian Sufi associated
    with the Ishrakiyya or Illumined school, describes his heterodox reputation, death
    by confinement and deprivation after a heresy sentence, popular legends around
    his tomb, and summarizes themes from the preface and doctrine of the Hikmat al
    Ishrak, including illumination, inspiration, contemplation, a tripartite cosmos,
    and the philosopher as representative of God on earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that older Pantheistic mystics left few writings and that
    heretical books and openly heterodox views were suppressed, leading Persian Sufis
    to veil their ideas in technical language.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suhrawardy is described as a learned Shafiite who studied jurisprudence and
    philosophy in several cities and gave himself the title “Disciple of the Spirit-world.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Suhrawardy founded a sect called the Ishrakiyya, “The Illumined,”
    and composed the Hikmat al Ishrak, “The philosophy of illumination.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Aleppo, Suhrawardy is said to have influenced Prince Malik Zahir; an orthodox
    party persuaded Saladin to sentence him to death as a heretic, and Malik Zahir
    carried out the sentence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After hearing the sentence, Suhrawardy is said to have quoted a Persian verse
