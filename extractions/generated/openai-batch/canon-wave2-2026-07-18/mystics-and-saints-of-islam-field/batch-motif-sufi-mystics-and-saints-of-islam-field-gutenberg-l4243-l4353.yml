canonical_text:
  quote: '"Die before you die."'
  summary: 'The passage presents several didactic Sufi illustrations: learned men
    touch an elephant in darkness and mistake partial knowledge for the whole; poems
    describe the Devil''s snares and human frailty; a frontier warden exemplifies
    faithful responsibility in a master''s absence; Sufi self-mortification is explained
    through kinds of death; and a caged parrot gains freedom by imitating death after
    receiving an indirect lesson from free parrots. The passage ends with an image
    of a hard heart revived by grace and the breath of Jesus.'
  language: English
  quote_policy: quoted
