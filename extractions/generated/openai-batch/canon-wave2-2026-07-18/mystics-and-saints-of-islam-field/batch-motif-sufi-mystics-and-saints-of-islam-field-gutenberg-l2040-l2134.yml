canonical_text:
  quote: ''
  summary: The passage recounts the condemnation, punishment, and death traditions
    surrounding Mansur Hallaj, including a legal accusation of infidelity, his profession
    of Islam, a caliphal punishment order modified by the vizier, his execution and
    cremation, disciples' reports denying his death, and Fariduddin Attar's hagiographic
    account of Hallaj as a martyr of truth whose ecstatic sayings and disclosure of
    mysteries brought orthodox suspicion and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vizier showed a disputed passage to the cadi Abou Amr; the cadi accused
    Hallaj of false attribution and infidelity, and the vizier pressed for a death
    sentence signed by religious authorities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hallaj protested that the condemnation was unjust, professed Islam, invoked
    traditions from the Prophet, acknowledged the four Imams and first four Caliphs,
    and asked God to save his life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Caliph ordered scourging and decapitation if Hallaj survived, but the
    vizier transmitted a harsher sequence involving cutting off hands and feet, beheading,
    and burning the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hallaj endured punishment, his body was burnt, and his ashes were cast into
    the Tigris.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hallaj's disciples did not believe he had died; they believed a resembling
    person had been martyred in his place and that Hallaj would appear again after
    forty days; some reported meeting him on an ass on the road to Nahrawan.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Attar's account describes Hallaj as a martyr in the way of truth, pure outwardly
    and inwardly, a loyal lover drawn toward contemplation of God's face, a miracle-worker,
    and a knower of mysteries.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Abd Allah Khafif and Shibli are quoted as affirming Hallaj's knowledge or
    path, while other wise men reproached him for revealing mysteries of truth to
    common people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Junaid predicted that Hallaj would redden the head of the stake; Hallaj replied
    that on that day Junaid would abandon the dervish garment for ordinary dress;
    later Junaid put on a mullah's robe and turban and signed an opinion distinguishing
    Hallaj's outward and inward condition.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Hallaj served Abd Allah Teshtari, made pilgrimage to Mecca, became Junaid's
    disciple, traveled widely, gained followers, uttered strange sayings including
    'I am the Truth,' and was opposed by witnesses and orthodox authorities.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:10
  text: Hallaj was imprisoned, refused to withdraw his statement when urged by Ibn
    Ata, endured blows with a rod, was led to execution before a large crowd, and
    again cried that he was the Truth.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
