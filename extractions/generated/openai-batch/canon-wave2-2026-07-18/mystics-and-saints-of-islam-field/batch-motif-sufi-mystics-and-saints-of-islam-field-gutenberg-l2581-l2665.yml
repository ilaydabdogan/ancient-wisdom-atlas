canonical_text:
  quote: ''
  summary: An old man instructs a seeker about two inner companions, irascibility
    and carnal concupiscence, which must be controlled for progress on a difficult
    journey. He then describes a three-part universe with visible heaven and earth,
    eastern and western regions beyond barriers, a healing fountain reached through
    darkness, Mount Kaf, guardians of hell, a miry western sea, successive eastern
    regions, and the sun rising between Satan’s two horns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The right-hand companion is identified with irascibility and is described
    as impetuous, difficult to repel, and comparable to a blazing fire, rushing torrent,
    runaway horse, or lioness deprived of young.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The left-hand companion is identified with carnal concupiscence, whose evil
    influence comes from insatiable appetite, and is compared to a famished beast
    let loose to graze.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seeker is told that release from the two companions is unavailable except
    by migrating to places where such creatures are unknown, and that he must hold
    their reins tightly to master them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After hearing the description, the narrator alternates gentleness and severity
    toward the companions, invokes God’s help, and reports being delivered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man says the journey will be impeded and difficult, progress will
    be interrupted, and the companions will lose influence only when the seeker applies
    himself wholeheartedly to progress.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The universe is described as having three parts: visible heaven and earth,
    and two marvellous regions to the East and West separated from the world by barriers
    passable only by a few elect souls through divine grace.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A flowing fountain near a stagnant pool has healing waters that refresh the
    traveller, give marvellous energy, help him cross savage deserts, scale Mount
    Kaf, and escape the power of hell’s guardians.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Perpetual darkness surrounds the pole until God permits light, and the fearless
    entrant into this darkness emerges onto a clearly lighted plain where the springing
    fountain is found.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The extreme West contains an immense sea called the miry sea where the sun
    sets, and a desolate, sterile, dark land whose inhabitants are always passing
    away.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The western land exposes visitors to illusions, has weak sunlight and barren
    soil, sees its buildings destroyed, contains perpetual conflict and tyranny, and
    has animals and plants undergoing strange developments.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The eastern path passes through an empty plain, then a mountainous region
    with clouds, strong winds, rapid rivers, gold, silver, and precious stones but
    no plants, then regions with plants but no animals, animals but no humans, and
    finally humans.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the extreme limit of the East, the sun is seen rising between the two horns
    of Satan, named the flying horn and the marching horn.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The marching horn is divided into a fierce-animal form and a gross-animal
