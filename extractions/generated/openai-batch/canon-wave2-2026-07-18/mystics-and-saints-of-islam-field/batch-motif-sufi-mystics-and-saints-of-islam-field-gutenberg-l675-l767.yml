canonical_text:
  quote: ''
  summary: 'The passage gives biographical and anecdotal material about Hasan Basri:
    his origins, his fearless counsel to a governor, a funeral procession in Roum
    that moves him to asceticism, his warning about uncontrolled ecstatic groaning,
    and his unembarrassed preaching before Hejaj ben Yusuf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hasan Basri is described as born in Medina, later freed, and retired to Basra,
    where he lived as part of an ascetic milieu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: His open disavowal of the reigning Ommeyah family is said to have exposed
    him to danger.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Omar ibn Hubaira asks Hasan Basri, Muhammad Ibn Sirin, and as Shabi whether
    he must obey written orders from Abd al Malik.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hasan answers that God outweighs Abd al Malik, that an angel will take the
    governor from throne and palace to the tomb, and that only his deeds can save
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the replies, Ibn Hubaira rewards the consulted men and gives Hasan a
    double reward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: As a young lapidary in Roum, Hasan accompanies a vizier outside the city to
    a plain containing a large ornate tent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hasan sees soldiers, mullahs and learned men, old men, maidens bearing precious
    stones, and finally the sultan and vizier process around or enter the tent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The vizier explains that the tent contains the tomb of the king's dead child
    and that the court visits it once a year.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The groups say in turn that swords, knowledge and eloquence, groans and prayers,
    or beauty and wealth could not ransom the dead child from Allah's decree or fate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sultan says he has brought soldiers, learned men, old men, and maidens
    with treasures, but cannot bring his son back because all power is powerless before
    Him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After hearing the explanation, Hasan is deeply stirred, leaves Roum, retires
    to Basra, vows not to smile until he knows his eternal destiny, practices severe
    asceticism, and preaches.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A disciple of Hasan casts himself on the ground and groans when the Koran
    is recited.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Hasan says the disciple's groans would be like a destructive fire if he can
    restrain them, but if beyond his control Hasan is six stages behind him in piety;
    Hasan also says such groanings are generally Satan's work.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hejaj ben Yusuf enters the mosque with a large retinue carrying drawn swords
    while Hasan is preaching.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Hasan does not shorten his discourse in Hejaj's presence; after the sermon,
    Hejaj takes Hasan by the hand and publicly honors him.
  category: sequence
  evidence_refs:
  - ev:8
