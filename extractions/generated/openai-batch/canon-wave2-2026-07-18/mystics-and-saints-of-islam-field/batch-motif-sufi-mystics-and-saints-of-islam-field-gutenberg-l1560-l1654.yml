canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from Bayazid Bastami''s life: his childhood
    response to a Qur''anic verse about serving God and parents, his mother''s renunciation
    of claims over him, his ascetic exile and return, a revelation connected with
    serving his mother, a charitable act replacing pilgrimage, a correction of spiritual
    pride, reconciliation after being struck with a guitar, and a lesson about divine
    provision.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bayazid is described as pious while still a child and is sent by his mother
    to the mosque to read the Koran with a mullah.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After hearing a verse explained as commanding service to God and to parents,
    Bayazid goes home and asks his mother whether she will give him to God or ask
    God to give him to her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bayazid's mother says she gives him up to the Lord and renounces all rights
    over him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A few years later Bayazid leaves Bastam and lives for thirty years as a barefoot
    ascetic in the deserts of Syria.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Bayazid later returns home, he hears his mother praying for her poor
    exile; when she opens the door, they embrace and weep together.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bayazid tells a friend that he learned too late the importance of serving
    his mother, and recounts standing with a full water pitcher on a freezing winter
    night until she awoke.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Bayazid's mother wakes and asks for water, the water has frozen and the
    jug handle is stuck to his hand; he says he kept holding it so as to be ready
    when she asked.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bayazid says that on that same night the Lord revealed to him all that he
    wanted to know.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: An unnamed man asks Bayazid for his two hundred pieces of gold and tells him
    to walk seven times around him, promising greater recompense than Bayazid would
    obtain at the Kaaba; Bayazid complies and does not make the pilgrimage that year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After thinking himself the greatest Sufi of the age, Bayazid goes into the
    desert of Khorassan and resolves not to move until the Lord sends someone to show
    him himself as he really is.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A camel rider approaches Bayazid, says Bayazid wants him to swallow up Bastam
    and Bayazid himself in the twinkling of an eye, warns him to curb his heart and
    not forget the road, and departs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: At a burial-ground, a young man playing a guitar strikes Bayazid on the head
    with it, breaking the instrument and wounding Bayazid.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The next morning Bayazid sends sweetmeats and gold to the young man so that
    he may buy another guitar and so that no rancour will remain in his heart; the
    young man comes crying, asks pardon, and repents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After praying with a friend who asks how Bayazid gets provision without asking
    anyone or working, Bayazid says he must pray again because it is unlawful to pray
    with one who does not know the Bestower of daily bread.
  category: speech
  evidence_refs:
  - ev:7
