canonical_text:
  quote: ''
  summary: 'The passage recounts anecdotes about Fudhayl ben Ayaz: his early life
    as a highwayman, his return of a merchant’s entrusted money, his conversion to
    ascetic penitence after hearing a Qur''anic admonition, his later instruction
    at Mecca and reputation for sanctity, and his severe counsel to Caliph Harun al-Rashid
    on judgment, self-rule, and the burden of political power.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fudhayl ben Ayaz is introduced as a highwayman who pitched his tent between
    Merv and Abiwerd and acted as chief among robbers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fudhayl apportioned booty among his robbers, observed Friday prayers, and
    dismissed servants who neglected those prayers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A merchant from a captured caravan hid a large sum by leaving it in a tent
    with a coarse-garbed man, who was Fudhayl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The robbers attacked the caravan, took goods, and bound the travelers; the
    merchant helped ransom and gather the travelers' remaining property.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fudhayl told the merchant to take back the deposited money and explained that
    he had preserved the merchant's trust while trusting in the Lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Fudhayl’s conversion to ascetic life is described as occurring while he climbed
    over a wall to see a girl he loved and heard a Qur'anic verse admonishing believers
    to humble their hearts before God.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After hearing the verse, Fudhayl said that the time had come, went to a ruined
    edifice at night, heard nearby travelers fear his arrival, announced his penitence,
    and asked pardon for former misdeeds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fudhayl later resided at Mecca, received instruction from Abou Hanifeh, returned
    to his own country, and became widely known for sanctity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Caliph Harun al-Rashid asked Fazl the Barmecide to take him to a man who could
    help him rise out of moral torpor.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sofyan ibn Oyaina responded deferentially to the Caliph, and Harun said that
    Sofyan was not the man he sought.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Fudhayl’s door, Fudhayl was reciting a Qur'anic verse about whether evildoers
    would be set on the same level as those who do well.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fudhayl resisted the visitors' entry and extinguished the lamp so that he
    would not see them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the dark, Harun touched Fudhayl's hand, and Fudhayl exclaimed about a soft
    hand and prayed that it escape hell fire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Fudhayl prayed; Harun wept and asked him to speak at least one word.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Fudhayl told Harun a report in which the Prophet said that ruling oneself
    in service of the Lord is better than ruling a nation for a thousand years.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Fudhayl also cited Omar son of Abd al Aziz as calling the Caliphate toils
    and regarding power as a calamity rather than a blessing.
  category: speech
  evidence_refs:
  - ev:8
