candidate_motifs:
- id: motif:1
  label: Trust preserved by a robber chief
  taxonomy_refs:
  - sacred_exchange
  basis: The merchant entrusts money to Fudhayl, who returns it intact despite his
    band's robbery and frames the act in terms of human trust and trust in the Lord.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy link to sacred_exchange is broad; the passage describes entrusted
    property and reciprocal trust rather than a formal ritual exchange.
- id: motif:2
  label: Conversion through sacred admonition
  taxonomy_refs:
  - initiation
  basis: Fudhayl's conversion to ascetic life follows his hearing of a Qur'anic verse
    that calls believers' hearts to humble submission to God's admonition.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage reports a voice pronouncing the verse but does not identify
    the voice's source.
- id: motif:3
  label: Penitent renounces former predation
  taxonomy_refs:
  - departure
  - initiation
  basis: After the conversion moment, Fudhayl announces that he has entered the path
    of penitence and asks forgiveness for former misdeeds from travelers who fear
    him.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The motif is extracted from a moral-biographical sequence; the taxonomy
    references are interpretive but closely tied to explicit penitence and life-change.
- id: motif:4
  label: Ruler seeks ascetic wisdom
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: Harun seeks someone to raise him from moral torpor, rejects an ascetic who
    shows courtly deference, and receives severe counsel from Fudhayl.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The search is moral and spiritual, not a journey narrative beyond visits
    to ascetics.
- id: motif:5
  label: Ascetic warning of judgment to worldly power
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: Fudhayl recites a verse distinguishing evildoers from those who do well,
    prays that the soft hand escape hell fire, and teaches Harun that self-rule in
    service of the Lord surpasses ruling a nation.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The warning is delivered through Islamic scriptural and ascetic teaching
    within the passage; no external comparison is inferred.
- id: motif:6
  label: Worldly power as bondage or calamity
  taxonomy_refs:
  - wisdom
  basis: Fudhayl cites Omar son of Abd al Aziz as saying he is caught in the toils
    of the Caliphate and regards power as a calamity.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif appears within an embedded exemplary saying rather than as
    an enacted scene in the main narrative.
