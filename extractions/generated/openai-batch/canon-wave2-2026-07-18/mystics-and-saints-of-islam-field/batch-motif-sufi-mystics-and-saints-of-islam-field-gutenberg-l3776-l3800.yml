  quote: the criminal in heaven, with his face shining like the sun
  summary: A devotee refuses funeral prayers for a dead criminal. In a dream he sees
    the criminal honored in heaven; the criminal explains that God showed him mercy
    because of the devotee's lack of compassion, then teaches through the image of
    a child with a lamp in a dark night and through statements about the human relation
    to heaven, hell, angels, soul, and the Whole.
