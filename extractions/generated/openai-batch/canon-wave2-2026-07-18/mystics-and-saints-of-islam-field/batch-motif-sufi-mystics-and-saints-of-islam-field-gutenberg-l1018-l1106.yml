canonical_text:
  quote: ''
  summary: A sequence of anecdotes presents Rabia as an ascetic teacher devoted to
    God. She redirects contemplation inward, fasts, refuses worldly gifts, rejects
    attachment to a decorated house, accepts illness and affliction as God's will,
    and defines pure sincerity as forgetting pain through absorption in God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabia remains secluded in her house, and when her servant tells her to go
    out and contemplate the works of the Most High, Rabia tells the servant to enter
    into herself and contemplate God's work within.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After seven days and nights of fasting for prayer, Rabia seems to hear her
    emaciated body complain that she is torturing it without mercy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man brings Rabia food in a bowl, but while she goes to light the lamp a
    cat eats the food; when she then goes to draw water, her lamp goes out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Rabia asks why the Lord makes her wretched, a voice says that she may
    receive the whole world, but only if the love she has for God is taken from her
    heart, because love of God and love of the world cannot exist together.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rabia says that after hearing the voice she expelled love of earthly things
    from her heart, turned her gaze away from them, and prayed to be absorbed in God's
    love so that no other affection would fit in her heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men of learning and piety ask how Rabia reached a high degree although miracles
    have not been granted to women; Rabia answers that women have not been as self-infatuated
    as men and have not claimed divinity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rabia refuses a merchant's purse of gold, saying that God gives daily bread
    and that she does not know whether the money was gained lawfully or unlawfully.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rabia enters a new house given by another merchant, becomes absorbed in looking
    at wall paintings, then leaves and refuses to re-enter because she fears attachment
    to the house will distract her from preparation for the other world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: While ill, Rabia answers Sofian's suggestion that she pray for relief by saying
    that if God sent the sufferings, she cannot ignore God's will by asking for their
    removal.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Rabia tells Sofian that without inclination to the low world he would be faultless,
    and rebukes him for asking whether God can be satisfied with him when he has not
    done anything to please God.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Malik finds Rabia drinking from a broken pitcher, lying on an old mat with
    a brick for a pillow; when he offers to seek help from rich friends, she rejects
    the offer and says God provides for both rich and poor.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a discussion of sincerity, Rabia rejects endurance, thanks, and delight
    in afflictions as insufficient definitions, and says the sincere person forgets
    the pain of affliction through absorption in God.
  category: speech
  evidence_refs:
  - ev:9
