canonical_text:
  quote: ''
  summary: The passage introduces Sharani in sixteenth-century Egypt and describes
    tensions between the Ulema and Sufis. It contrasts book-based theological authority
    with Sufi claims to inner perception, pure-hearted worship, mystic ecstasy, and
    celestial inspiration. It also summarizes a Persian theosophical doctrine of divine
    emanation and the soul’s return to God after purification, distinguishes Arab
    Sufism from that more openly pantheistic formulation, and describes Ghazzali’s
    attempted reconciliation of orthodox Islam with Sufi doctrine as ultimately only
    apparent.
  language: English
  quote_policy: summarized
