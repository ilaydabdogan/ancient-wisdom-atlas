canonical_text:
  quote: ''
  summary: The passage describes Persian and Shiite settings for doctrines of apotheosis,
    divine indwelling, and incarnation; the career and execution of Hellaj; later
    similar incarnation claims; Ghazzali's criticism of Sufi claims of love, union,
    lifted veils, and direct speech with God; and a later division between orthodox
    and pantheistic forms of Sufism, including self-annihilation and absorption in
    God.
  language: English
  quote_policy: summarized
