canonical_text:
  quote: ''
  summary: The passage presents Ibn Khaldoun’s exposition of Sufism as renunciation
    of worldly aims for devotion to God. It describes the name’s likely derivation
    from wool, the disciple’s struggle with passions, gradual progress through spiritual
    stations toward knowledge of divine unity, strict self-examination, Sufi terminology
    and codification by Ghazzali, and meditation leading to lifted veils of sense,
    perception of invisible things, divine grace, and nearness to the heaven of angelic
    beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sufism is described as giving oneself constantly to devotional exercises,
    living solely for God, abandoning worldly attractions, and separating from society
    for devotion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that when desire for worldly wealth spread, persons devoted
    to piety were distinguished as Sufis or aspirants to Sufism.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The most probable derivation of the name is given as “suf” meaning wool, and
    Sufis are said to wear woollen garments to distinguish themselves from the crowd.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The disciple of the spiritual life is said to wage warfare with himself and
    his passions, and each struggle produces either a state that may become a station
    or a passing emotion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The disciple is said to rise from one station to another until arriving at
    knowledge of the Divine Unity and of God.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Progress through stages is described as gradual, founded on obedience, sincerity
    of intention, and faith, and requiring the disciple to demand an account of his
    soul and watch the hidden recesses of his heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mystics are said to examine the effects of works on the soul and to use rays
    of divine illumination received in ecstasy to test whether their actions contain
    defects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sufis are said to possess special rules of conduct and technical expressions,
    and Ghazzali is said to have treated these in Ihya-ul-ulum, helping reduce the
    system to writing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Spiritual combat and meditation are said to be followed by the lifting of
    the veils of sense and perception of certain worlds belonging to the things of
    God, while the sensual man cannot perceive them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Disentanglement from sense is described as occurring when the spirit gives
    up exterior senses, uses interior ones, and becomes dominant and renewed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Meditation is described as nourishment by which the spirit grows until knowledge
    of an absent One becomes consciousness of a present One, and the soul receives
    divine grace and knowledge and approaches the loftiest heaven of angelic beings.
  category: sequence
  evidence_refs:
  - ev:10
