  summary: 'The passage recounts Bayazid Bastami walking alone outside a silent town
    under a bright full moon and asking why God’s sublime audience-hall lacks worshippers.
    An inner voice answers that access to the divine Court is granted only rarely.
    The passage then describes Fariduddin Attar’s extreme asceticism and death during
