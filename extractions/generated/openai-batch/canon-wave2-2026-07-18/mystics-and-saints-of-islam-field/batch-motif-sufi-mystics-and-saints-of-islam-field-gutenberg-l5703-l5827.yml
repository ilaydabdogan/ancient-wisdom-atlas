  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Sa'di's poetic parable, Jesus passes by a cave where a monk lives, and
    a dissolute youth appears at a distance.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The youth falls down, prays, weeps, and laments thirty squandered years; the
    monk condemns him and asks God to keep him far from the sinner at Judgment Day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'A heavenly revelation through Jesus says both prayers are granted: the repentant
    sinner is forgiven and made a citizen of paradise, while the monk goes to hell
    because he asked not to stand beside the sinner.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Nizami's apologue, Jesus teaches in a marketplace with his disciples, then
    approaches a crowd gathered around a dead dog in a gutter.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The crowd expresses disgust at the dog, but Jesus praises the whiteness of
    its teeth.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Rumi's Masnavi passage contrasts leaving Jesus and cherishing an ass, and
