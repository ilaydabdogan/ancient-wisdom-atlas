literal_observations:
- id: obs:1
  text: The compiler states that the article collects passages in Mohammedan writers
    where Christ is given a higher place than in the Koran and where deeds and words
    are mentioned about which the Koran is silent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Koran calls Christ the Spirit of God and a Word proceeding
    from God, while also saying God could destroy the Messiah and his mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A traditional saying attributed to Mohammed states that Satan touches every
    child at birth except Mary and her son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A traditional saying has God say at the resurrection that people failed to
    visit Him when a servant of His was sick.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same resurrection saying identifies visiting the sick servant with finding
    God with that servant.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A traditional saying attributed to Mohammed says God will send back the Son
    of Mary to rule and judge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Suhrawardi is quoted as attributing to Christ a doctrine in which the death
