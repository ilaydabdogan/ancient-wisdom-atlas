  summary: The appendix gathers Muslim traditional, historical, and poetic passages
    about Christ/Jesus, including reports of his sinlessness, return to judgment,
    sayings on charity and rebirth, Gospel-like episodes, and Sufi poetic examples
    in which Jesus teaches mercy, repentance, wisdom, and inner spiritual help.
  language: English
