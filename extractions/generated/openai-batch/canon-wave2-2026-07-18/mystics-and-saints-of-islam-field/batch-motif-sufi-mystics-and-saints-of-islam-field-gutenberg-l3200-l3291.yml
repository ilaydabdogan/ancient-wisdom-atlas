- id: motif:2
  label: Reason yielding to prophetic guidance
  taxonomy_refs:
  - wisdom
  basis: Reason is said to recognize inspiration, acknowledge its limits, and hand
    a person over to prophets, who are compared to guides for the blind and physicians
    for the sick.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy reference is broad; the passage concerns epistemic and religious
    authority rather than a mythic wisdom quest.
- id: motif:3
  label: Exchange of eternal future life for present worldly goods
  taxonomy_refs: []
  basis: Ghazzali challenges the lax by saying that if they believe in a future life
    but sell it for the goods of this world, they irrationally barter eternity for
    numbered days.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage uses exchange language, but it is a moral exhortation rather
    than a ritualized sacred exchange.
- id: motif:4
  label: False exemption from religious practice
  taxonomy_refs: []
  basis: The passage presents a self-styled Sufi, an Ismailian, and a philosopher-like
    speaker as offering different claims that excuse or bypass ordinary religious
    practice or authority.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: This is a polemical pattern within the passage and not necessarily a cross-cultural
    myth motif.
- id: motif:5
  label: Preach to oneself before preaching to others
  taxonomy_refs:
  - wisdom
  basis: Ghazzali's letter states that one should accept preaching oneself before
