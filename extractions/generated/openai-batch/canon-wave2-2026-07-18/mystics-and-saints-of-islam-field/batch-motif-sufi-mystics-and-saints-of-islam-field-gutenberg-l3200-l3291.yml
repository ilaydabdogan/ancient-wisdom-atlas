canonical_text:
  quote: ''
  summary: The passage presents extracts attributed to Ghazzali on the spiritual heart,
    ignorance as a fatal poison, passions as disease, prophetic devotional practices
    as remedies, and reason as limited before revelation. It describes Ghazzali questioning
    religiously lax people and recording excuses from theologians, a self-styled Sufi,
    an Ismailian, and a philosopher. The surrounding commentary frames Ghazzali as
    a reformer, notes a comparison by D.B. Macdonald to Ritschl, and quotes a letter
    in which Ghazzali says one should preach to oneself before preaching to others,
    citing a revelation to Jesus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says man is composed of a body and a heart, and defines the heart
    as the spiritual part that is the seat of knowledge of God rather than the physical
    organ.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: The body is compared to something that flourishes in health and decays in
    disease, and the heart is described as either spiritually sound or afflicted by
    a fatal malady.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ignorance of God is called a deadly poison, and the revolt of the passions
    is called a disease.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Knowledge of God and obedience to Him through self-control are described as
    the antidote and remedy for spiritual poison and disease.
  category: attribute
  evidence_refs:
  - ev:3
