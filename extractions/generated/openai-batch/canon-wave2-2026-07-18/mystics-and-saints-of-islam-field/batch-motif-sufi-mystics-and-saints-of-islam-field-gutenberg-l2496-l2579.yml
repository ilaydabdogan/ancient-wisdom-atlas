canonical_text:
  quote: ''
  summary: The passage recounts Avicenna's work as philosopher and statesman, his
    imprisonment and release, and his completion of the Shifa and a mystical allegory,
    Hay ibn Yokdhan. The allegory begins with a narrator meeting an ageless old man
    named Hay ibn Yokdhan, born in Jerusalem, who travels all regions of the earth
    by guidance of his Father and holds keys to all sciences. The accompanying explanation
    interprets the old man as active Intelligence encountered by the soul during bodily
    life, and interprets the discourse on physiognomy as a movement toward logic,
    which can disclose hidden things and help free one from earthly and sensual entanglements.
    Imagination is described as a nearby companion that mixes truth and falsehood.
  language: English
  quote_policy: summarized
