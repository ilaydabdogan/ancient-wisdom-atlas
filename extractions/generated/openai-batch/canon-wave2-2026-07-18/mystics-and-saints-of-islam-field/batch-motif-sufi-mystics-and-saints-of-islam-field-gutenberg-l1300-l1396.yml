canonical_text:
  quote: ''
  summary: A set of anecdotes about Ibrahim ben Adham presents him counseling a sinner
    through six impossible tests, undergoing divine requital for former luxury, displaying
    austerity in an orchard, receiving heavenly recognition in a dream of Gabriel
    writing names, teaching a horseman through reference to the cemetery, and disappearing
    at death with his tomb location uncertain. Footnotes explain Munkir and Nakir
    and connect one anecdote to Leigh Hunt's poem about Abou Ben Adhem.
  language: English
  quote_policy: summarized
