canonical_text:
  quote: ''
  summary: The passage presents a hierarchy of philosophers and theosophists, asserting
    that the complete theosophist is God's representative or vicar on earth and may
    rule publicly or secretly as the mystical pole. It then describes a doctrine of
    divine and heavenly light, ideal prototypes in heavenly spheres, saintly power
    to manifest such prototypes, the obedience of the material world to illuminated
    souls, and the burning of Suhrawardy's books after his death by order of Caliph
    Nasir.
  language: English
  quote_policy: summarized
