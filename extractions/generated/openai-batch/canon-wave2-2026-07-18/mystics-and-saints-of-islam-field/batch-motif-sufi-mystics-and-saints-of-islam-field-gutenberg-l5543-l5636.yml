canonical_text:
  quote: ''
  summary: The appendix argues that Islamic and Sufi literature contains many Christian
    elements, especially sayings, parables, and Gospel-like episodes attributed to
    God, Mohammed, Jesus, historians, poets, and Sufi writers. Examples include Judgment
    sayings, Second Advent traditions, adaptations of Gospel parables, Ghazzali’s
    moral images, Saadi’s Gospel echoes, and Nizami’s story of Christ praising the
    white teeth of a dead dog.
  language: English
  quote_policy: summarized
