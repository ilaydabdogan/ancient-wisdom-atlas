canonical_text:
  quote: ''
  summary: The passage recounts Sheikh Sanaan, a saintly Muslim guide, dreaming that
    he must leave Mecca for Roum and become an idolater. In Roum he falls in love
    with a Christian maiden, accepts wine, idolatry, and swineherding at her demand,
    and separates from his disciples. Through the disciples' forty days of prayer
    and fasting, God restores his heart and memory, and he returns toward Mecca. The
    Christian maiden then dreams of the Prophet, seeks the Sheikh, and asks to be
    taught Islam.
  language: English
  quote_policy: summarized
