literal_observations:
- id: obs:1
  text: Hatim Assam says disciples who do not intercede for people conducted to hell
    on the Day of Judgment are not his disciples.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bayazid says his disciples will stand at the brink of hell to seize and save
    those cast down there, even if entering hell themselves becomes necessary.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bayazid reports hearing a Voice say that the divine treasury is full of human
    adoration and devotion and asks him to bring sorrow of heart, humility, and contrition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After forty years of asceticism, Bayazid says he came before doors and curtains
