canonical_text:
  quote: ''
  summary: The passage collects sayings and deathbed traditions about Bayazid, including
    teachings on intercession at Judgment, divine requests for humility and contrition,
    renunciation of possessions before the throne of God, the humble heart as divine
    dwelling, annihilation of earthly desire, mercy for all beings, imitation rather
    than relic possession, love of God above paradise, veils of the world, Sufism
    as suffering, and Bayazid's final self-abasing prayer.
  language: English
