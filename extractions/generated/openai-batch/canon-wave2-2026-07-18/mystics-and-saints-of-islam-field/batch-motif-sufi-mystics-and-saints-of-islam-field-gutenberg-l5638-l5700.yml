canonical_text:
  quote: ''
  summary: The passage argues that Jalaluddin Rumi and later Sufi and Persian religious
    materials show Christian influence or Gospel echoes. It summarizes a Masnavi story
    about a mutilated vizier who deceives Christians and divides them through contradictory
    epistles, lists Gospel allusions in Rumi, recounts Mansur al-Hallaj's ecstatic
    utterance and death, quotes a poetic image of Mansur's cross becoming a fruit-bearing
    tree, notes Sufi and Babi phrases with Christian parallels, reports Henry Martyn's
    description of Sufis, mentions converts from Islam who passed through Sufism,
    and describes a gilded but still visible Christ mosaic in St. Sophia.
  language: English
  quote_policy: summarized
