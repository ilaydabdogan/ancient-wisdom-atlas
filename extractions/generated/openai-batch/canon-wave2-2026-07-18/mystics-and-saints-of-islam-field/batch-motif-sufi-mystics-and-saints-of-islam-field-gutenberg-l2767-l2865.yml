canonical_text:
  quote: ''
  summary: The passage discusses postmortem states of souls, rejecting annihilation
    and distinguishing passion-bound souls from noble souls that pass to contemplation.
    It then presents Avicenna's poem on the soul as a heavenly dove descending into
    bodily confinement and later seeking departure toward its original spiritual abode.
    The final section gives Avicenna's explanation of prayer for the dead and tomb
    visitation as seeking aid from perfected souls who retain influence after death.
  language: English
  quote_policy: summarized
