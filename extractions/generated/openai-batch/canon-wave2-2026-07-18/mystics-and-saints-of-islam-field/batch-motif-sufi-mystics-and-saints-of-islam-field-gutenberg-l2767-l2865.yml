  evidence_refs:
  - ev:1
- id: obs:3
  text: Ill-prepared and refractory souls are said to continue pining after sensual
    enjoyments after separation from the body and to suffer from the impossibility
    of gratifying them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ill-prepared souls may retain worldly conceptions of beatitude and damnation
