canonical_text:
  quote: ''
  summary: The passage narrates Mansur Hallaj’s final counsel, his confident movement
    toward execution, exchanges with disciples and Shibli, his stoning and mutilation,
    his prayer for those torturing him, and his death by beheading followed by burning
    and dispersal of his ashes. It then cites later Sufi praise by Rumi and Abdurrahman,
    contrasting Hallaj with Pharaoh and presenting Hallaj’s cross as becoming a fruitful
    tree after death.
