canonical_text:
  quote: ''
  summary: 'The passage first closes the Sheikh Sanaan episode: the woman who has
    become one of the Faithful bids farewell, says she can no longer endure absence,
    and dies. It then relates an anecdote in which Gabriel hears Allah accepting a
    prayer, searches for the hidden suppliant, is directed to a Christian convent
    in Roum, and finds a man adoring an idol. God explains that the man errs through
    ignorance, pardons him, and grants him the highest rank of saints.'
