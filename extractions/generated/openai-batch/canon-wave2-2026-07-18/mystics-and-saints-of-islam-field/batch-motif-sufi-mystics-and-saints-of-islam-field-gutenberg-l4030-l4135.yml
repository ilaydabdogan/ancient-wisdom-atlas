canonical_text:
  quote: Only complete union of the knower with the known is knowledge.
  summary: 'The passage gives a biographical account of Jalaluddin Rumi: his family’s
    departure from Balkh, Attar’s early prophecy, his succession as spiritual instructor
    at Konia, his transformative meeting with Shams-i-Tabriz, the hostility of his
    disciples toward Shams, Shams’s departures, Rumi’s institution of flute-accompanied
    mystical dances, the Mevlevi order’s cosmic symbolism, Shams’s death, and verses
    interpreting the Kaaba pilgrimage as an inward devotion of the heart.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The chapter identifies Jalaluddin Rumi as a major Persian mystical poet and
    gives his name as meaning “the glory of religion.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jalaluddin was born at Balkh in 1207 AD, and his father Behauddin was a professor
    of theology under Sultan Khwarezm Shah.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Behauddin left Balkh with his family and dependants after apparently exciting
    the Sultan’s displeasure, vowing not to return while the Sultan remained on the
    throne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Nishapur, Fariddudin Attar pointed to Jalaluddin, predicted that he would
    light a great flame in the world, and gave him the Asrarnama, described as a book
    of secrets.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Behauddin and Jalaluddin made the pilgrimage to Mecca, after which Behauddin
    settled at Konia, from which Jalaluddin received the title Rumi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After Behauddin’s death, Jalaluddin succeeded him as Sheikh or spiritual instructor
    and later gave himself up to mysticism.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ruknuddin told Shams-i-Tabriz to go to Roum because there was a Sufi there
    who glowed with divine love and needed that glow fanned to a clear flame.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shams-i-Tabriz arrived in Iconium and met Jalaluddin riding on a mule among
    disciples escorting him from lecture hall to house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shams-i-Tabriz asked Jalaluddin about the aim of his teaching and religious
    exercises, then answered that complete union of the knower with the known is knowledge.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Shams-i-Tabriz’s words strongly impressed Jalaluddin, who questioned him and
    went with him to lonely desert places for uninterrupted conversation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jalaluddin’s pupils and adherents persecuted and ridiculed Shams-i-Tabriz,
    calling him a barefoot and bareheaded fakir who had come to lead their teacher
    astray.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Shams-i-Tabriz fled to his native city without telling Jalaluddin; Jalaluddin
    followed him, found him, and persuaded him to return.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After renewed persecution, Shams-i-Tabriz departed to Syria and remained there
    for two years.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: During the separation, Jalaluddin instituted mystical dances accompanied by
    the flute, identified as the beginning of the Mevlevi or dancing dervish order.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Mevlevi gyrations are said to symbolize the planets wheeling around their
    central sun and the attraction of the creature to the Creator.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: Shams-i-Tabriz later returned to Konia and died there in a tumult whose details
    are not known.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Jalaluddin composed the Diwan-i-Shams-i-Tabriz to commemorate Shams-i-Tabriz,
    placing Shams’s name where the author’s name would stand.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: The quoted pilgrimage verses identify the essential Kaaba as the heart and
    say that God values the offered heart above material riches.
  category: speech
  evidence_refs:
  - ev:13
  - ev:14
