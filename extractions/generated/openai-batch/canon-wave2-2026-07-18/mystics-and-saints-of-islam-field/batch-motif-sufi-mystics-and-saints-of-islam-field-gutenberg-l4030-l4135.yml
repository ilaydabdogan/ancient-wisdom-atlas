candidate_motifs:
- id: motif:1
  label: mystical transformation through encounter with a guide
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: Shams-i-Tabriz is sent to find Jalaluddin, confronts him with a teaching
    on knowledge, and so impresses him that Jalaluddin seeks uninterrupted conversation
    and gives himself to mystical association.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is biographical rather than a formal initiation tale; the
    motif label abstracts from the reported encounter.
- id: motif:2
  label: union as true knowledge
  taxonomy_refs:
  - annihilation_union
  - wisdom
  basis: Shams-i-Tabriz says that complete union of the knower with the known is knowledge,
    and the accompanying verse says knowledge is valuable when it frees one from oneself.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives a doctrinal statement rather than a narrative enactment
    of full union.
- id: motif:3
  label: divine love as flame to be kindled
  taxonomy_refs:
  - divine_beloved
  - mystical_quest
  basis: Attar predicts that Jalaluddin will light a great flame in the world, and
    Ruknuddin tells Shams to fan Jalaluddin’s glow of divine love to a clear flame.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The fire language is metaphorical within the prose and is not developed
    into an independent mythic episode.
- id: motif:4
  label: separation from beloved companion generating ritual expression
  taxonomy_refs:
  - departure
  - divine_beloved
  basis: After Shams’s departure to Syria, the passage says Jalaluddin softened the
    pain of separation by instituting mystical dances accompanied by the flute.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The beloved companion is Shams-i-Tabriz, a human friend and spiritual
    catalyst; the taxonomy reference to divine beloved is only partial because the
    passage also frames the dance toward the Creator.
- id: motif:5
  label: cosmic dance around a central source
  taxonomy_refs:
  - world_center
  - mystical_quest
  basis: The Mevlevi gyrations are explicitly said to symbolize planets wheeling around
    a central sun and the creature’s attraction to the Creator.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy does not include a specific cosmic-dance motif; world-center
    is inferred from the central-sun image.
- id: motif:6
  label: 'inner sacred center: heart as Kaaba'
  taxonomy_refs:
  - world_center
  - sacred_exchange
  - divine_beloved
  basis: The quoted verses state that the essential Kaaba is the heart, that outward
    circling is vain if one harms a human heart, and that God seeks the heart rather
    than material wealth.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage presents this as spiritualized Islamic pilgrimage, not as
    a separate myth of founding a sacred center.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares or reinterprets the Islamic pilgrimage to
    the Kaaba as an inward devotion centered on the human heart, describing the heart
    as the essential Kaaba and the offering God values.
  claim_level: same_function
  target: Islamic pilgrimage rite to the Kaaba spiritualized as heart-centered devotion
  evidence_refs:
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the passage’s own statement about Sufi poets
    spiritualizing Islamic rites and should not be generalized to all Sufi poetry
    without further evidence.
- id: claim:2
  claim: The passage explicitly explains the Mevlevi dance as visually and symbolically
    analogous to planets wheeling around a central sun and to the creature’s attraction
    to the Creator.
  claim_level: visual_similarity
  target: planetary orbit around a central sun and creature-Creator attraction pattern
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal symbolic explanation supplied by the passage, not
    an external historical comparison.
