canonical_text:
  quote: ''
  summary: 'Frazer describes an Issapoo ceremony in Fernando Po in which the cobra-capella
    is regarded as a guardian deity, a serpent skin is annually hung from the highest
    tree in the public square, and infants born during the previous year touch its
    tail. He compares this with brief reports of Python clan and Psylli customs involving
    children and snakes. He then introduces a Zuni midsummer custom: a procession
    travels westward, said to go to the city of the Ka-ka, and returns four days later
    in ceremonial costume with living turtles. In one household a turtle is followed
    with prayers and scattered meal, touched and invoked as a source of divine favor,
    and described by the bearer as precious and unable to die.'
  language: English
  quote_policy: summarized
