candidate_motifs:
- id: motif:1
  label: annual killing of a sacred animal and preservation of its skin
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: The passage explicitly introduces the West African case as annual killing
    of a sacred animal and preservation of its skin, with the skin placed on a tree
    in an annual ceremony.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The excerpt describes the preserved skin and annual ceremony but does
    not narrate the killing itself in detail.
- id: motif:2
  label: serpent guardian for infants and clan children
  taxonomy_refs:
  - serpent
  basis: The Issapoo infants touch the serpent skin for protection, while the Senegambia
    and Psylli examples also connect serpents with children shortly after birth or
    clan identity.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The protective interpretation for Issapoo is Frazer's statement; the Senegambia
    and Psylli examples are only briefly summarized.
- id: motif:3
  label: totemic sacred animal worship outside agriculture
  taxonomy_refs: []
  basis: Frazer states that the slain animal in the Californian, Egyptian, and Fernando
    Po customs probably is or once was a totem and that the worship appears unrelated
    to agriculture; he introduces the Zuni custom in this context.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Frazer uses cautious language ('probably') and the excerpt gives no detailed
    evidence for the Californian or Egyptian cases.
- id: motif:4
  label: ritual departure and return with sacred animals
  taxonomy_refs:
  - departure
  - return
  - mystical_quest
  - seasonal_cycle
  basis: At midsummer a Zuni procession departs to a named other destination and returns
    four days later in ritual costume carrying living turtles.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The excerpt does not explain the full meaning of the city of the Ka-ka
    or the 'home of our others.'
- id: motif:5
  label: sacred animal treated as child or kin
  taxonomy_refs: []
  basis: The turtles are carried as tenderly as infants, some wrapped like children,
    and one turtle is prayed over and treated as precious in the household.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The infant comparison is the eyewitness narrator's description; the emic
    explanation is not fully given in the excerpt.
- id: motif:6
  label: sacred captive described as unable to die
  taxonomy_refs: []
  basis: The turtle-bearer responds to the narrator's concern by saying the turtle
    is precious and cannot die, while the narrator objects that lack of food and water
    will kill it.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The excerpt ends mid-exchange and does not provide the subsequent explanation.
comparison_claims:
- id: claim:1
  claim: Frazer presents the Issapoo infant-serpent contact, the Senegambia Python
    clan visitation, and the Psylli infant exposure as similar serpent-related customs
    involving children soon after birth or clan belonging.
  claim_level: same_function
  target: Senegambia Python clan and Psylli Snake clan customs compared with the Issapoo
    serpent-skin infant ceremony
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not claim historical contact or common inheritance;
    it only supplies brief functional parallels.
- id: claim:2
  claim: Frazer groups the Californian, Egyptian, and Fernando Po customs as cases
    in which the slain animal probably is or once was a totem and animal worship appears
    unrelated to agriculture.
  claim_level: same_motif
  target: Californian and Egyptian sacred-animal customs named by Frazer alongside
    the Fernando Po case
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt does not describe the Californian or Egyptian customs directly,
    and Frazer marks the totemic identification as probable rather than certain.
- id: claim:3
  claim: Frazer cautiously associates the Zuni turtle custom with the preceding non-agricultural
    sacred-animal pattern while also saying it has features that place it in a somewhat
    different category.
  claim_level: same_function
  target: Zuni turtle custom compared with preceding Californian, Egyptian, and Fernando
    Po sacred-animal customs
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is Frazer's framing; the Zuni narrative itself supplies
    actions and speeches but not a complete explanatory doctrine.
- id: claim:4
  claim: The eyewitness explicitly makes a visual and behavioral comparison between
    the carried turtles and infants or little children.
  claim_level: visual_similarity
  target: turtles in the Zuni return procession compared with infants or children
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is a narrator's analogy within the passage and should not by itself
    be treated as a full symbolic interpretation.
