canonical_text:
  quote: ''
  summary: 'A set of footnotes records comparative customs and references: hunters
    cutting tongues from slain animals; sacred or luck-bringing treatment of tongues;
    a suggested explanation that tongue-removal prevents slain animals from warning
    living animals; an Abghazian autumn rite involving a white ox from a holy cave,
    its killing, eating, burning of bones, and burial of ashes; and references to
    the wren as king or kinglet of birds in several European names.'
  language: English
  quote_policy: summarized
