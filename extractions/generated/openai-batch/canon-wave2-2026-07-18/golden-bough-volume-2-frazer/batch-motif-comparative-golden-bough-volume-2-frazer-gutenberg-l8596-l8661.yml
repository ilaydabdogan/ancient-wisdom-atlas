canonical_text:
  quote: ''
  summary: 'Frazer describes the Natchez Harvest Festival or Festival of New Fire:
    preparations, fasting and purification, a dawn temple rite oriented to the rising
    sun, generation of new fire, rekindling of hearths, gathering and offering of
    first maize, and an evening presentation of bread to the setting sun followed
    by feasting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the chief Natchez solemnity as the Harvest Festival
    or Festival of New Fire.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A crier instructed people to prepare new vessels and garments, wash houses,
    burn old grain, garments, and utensils in a common fire, and announced amnesty
    for criminals.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people were commanded to fast for three days, abstain from pleasures,
    use a purifying emetic called the “root of blood,” and keep silence during the
    fast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn after the fast, the people gathered at the temple of the Sun, which
    had east and west doors and an altar placed to receive the first beams of sunrise.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Images of a chouchouacha, a rattlesnake, and a marmoset stood on or near the
    altar, before which an oak-bark fire normally burned perpetually but was allowed
    to die out once yearly before the festival.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The great chief stood to the right of the altar and was described as taking
    his title and tracing descent from the Sun; his wife stood to the left.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before presiding, the high priest had to plunge three times into the Mississippi,
    then watched the eastern horizon while rubbing two pieces of dry wood and muttering
    magic words.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two acolytes stood beside the high priest holding cups filled with a black
    drink.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women stood outside the temple in a semicircle with backs turned east, each
    leaning on a mattock and supporting an infant; at sunrise they turned and held
    infants and mattocks up to the sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the first appearance of the sun’s disc, fire came from the rubbed wood
    and was caught in tinder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The great chief and his wife drank the black liquor, priests lit reeds and
    oak bark, and the sacred flame was used to rekindle all village hearths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chief’s wife led the women to the harvest fields, where men were not allowed
    to follow; the women gathered first sheaves of maize, presented some at the altar
