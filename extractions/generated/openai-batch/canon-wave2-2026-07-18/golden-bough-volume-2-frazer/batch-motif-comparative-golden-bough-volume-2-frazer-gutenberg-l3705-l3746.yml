canonical_text:
  quote: ''
  summary: The passage lists examples from Rook, New Britain, Minahassa in Celebes,
    Halmahera, and the Key Islands in which sickness, epidemics, crop failure, drought,
    and other misfortunes are attributed to devils or spirits and addressed by communal
    or priestly rites of expulsion using noise, weapons or branches, temporary evacuation,
    holy fire, offerings, and flight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Rook, after a misfortune, people gather, make loud cries, curse, howl,
    and beat the air with sticks to drive away the devil named Marsába.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On Rook, the devil is driven step by step from the place of the mishap to
    the sea, and is said generally to retire to the sea or to Lottin island.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In New Britain, sickness, drought, crop failure, and other misfortunes are
    attributed to wicked spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In New Britain, during periods of sickness and death, district inhabitants
    go by moonlight to the fields armed with branches and clubs, then beat and stamp
    the ground with howls until morning to drive away devils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Minahassa, after repeated disasters or a severe epidemic, all villagers
    leave their homes with household goods and stay for several days in temporary
    huts outside the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Minahassa men, some masked or with blackened faces and all armed, return silently
    to the deserted village, then at a priest’s signal rush through streets and houses,
    yelling and striking walls, doors, and windows to drive away devils.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Minahassa priests and people carry holy fire nine times around each house
    and three times around each house-ladder, then keep the fire burning in the kitchen
    for three days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Alfoers of Halmahera attribute epidemics to a devil from other villages,
    and a sorcerer attempts to remove the disease by driving the devil away.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Alfoer sorcerer receives a costly garment from each villager, places the
    garments on four vessels, leaves them in the forest where the devil is thought
    to be, and orders the demon to abandon the place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Key Islands, during sickness, people build a shore stage loaded with
    meat and drink; the priest bans the disease-causing spirits, and the people run
    back to the village at full speed.
  category: sequence
  evidence_refs:
  - ev:5
