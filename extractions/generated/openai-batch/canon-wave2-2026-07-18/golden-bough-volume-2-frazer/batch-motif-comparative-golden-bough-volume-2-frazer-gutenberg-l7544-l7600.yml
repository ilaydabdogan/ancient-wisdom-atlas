canonical_text:
  quote: the receptacle in which a man keeps his life
  summary: Frazer argues that the totem can be interpreted as an external receptacle
    for a person's life or soul. He compares this to external-life tales, discusses
    plurality of souls among several peoples, and treats Batta clan taboos and external-soul
    beliefs as an illustrative totemic case.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that a totem is a receptacle in which a man keeps his life,
    and compares this with Punchkin keeping his life in a parrot and Bidasari keeping
    her soul in a golden fish.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that a person with both a sex totem and a tribal totem could
    be understood as having life bound up with two different animals, so that the
    death of either would entail his own.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage presents the divisibility of life, or plurality of souls, as a
    notion that allows portions of life to be transferred to different animals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Caribs are described as supposing one soul in the head, another in the
    heart, and other souls at places where an artery is felt pulsating.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Hidatsa Indians are described as explaining gradual death by four souls
    leaving the body one after another, with dissolution complete only after all four
    have departed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Laos are described as supposing thirty spirits in the body, residing in
    parts such as hands, feet, mouth, and eyes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that sex totems occur nowhere but in Australia, and therefore
    a practitioner of totemism usually need not have more than one soul outside the
    body at a time.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Battas of Sumatra are described as divided into exogamous clans with male-line
    descent, each clan being forbidden to eat the flesh of a particular animal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Batta clan animals listed in the passage include tiger, ape, crocodile,
    dog, cat, dove, and white buffalo.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Batta clan members are said to explain abstention from an animal's flesh by
    descent from animals of that species, possible transmigration of souls into them
    after death, or obligations owed to the animals; sometimes the clan bears the
    animal's name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each Batta is described as believing he has seven souls, or on a more moderate
    computation three, with one soul always outside the body; whenever that outside
    soul dies, the man dies at the same moment.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage notes that the writer who mentions the Batta external-soul belief
    says nothing about Batta totems, but Frazer concludes by analogy that the external
    soul must be housed in the totem animal or plant.
  category: other
  evidence_refs:
  - ev:8
