canonical_text:
  quote: ''
  summary: Frazer argues that Pliny’s report of Druids cutting mistletoe in the sixth
    month likely refers to a Midsummer rite. He surveys European Midsummer customs
    involving the gathering or use of plants believed to confer invisibility, healing,
    protection, luck, invulnerability, divination about lovers, or agricultural benefit.
    He then connects these customs to folk rules about cutting mistletoe on Midsummer
    Eve and to traditions concerning oak-mistletoe, the “oil of St. John,” and the
    epithet “all-healer.”
  language: English
  quote_policy: summarized
