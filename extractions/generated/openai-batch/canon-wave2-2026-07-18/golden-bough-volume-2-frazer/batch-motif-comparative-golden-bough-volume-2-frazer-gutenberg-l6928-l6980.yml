canonical_text:
  quote: ''
  summary: Frazer lists Norse, Icelandic, Celtic, and Breton tale episodes in which
    giants, ogres, or beasts have a heart, soul, life, or fatal vulnerability concealed
    outside the body, often in an egg inside nested beings or places. Heroes or other
    agents obtain and destroy the object, causing the antagonist's death. A related
    Icelandic episode ties Gestr's life to a candle, and one Norse story ties the
    ogres' destruction to a hidden grain of sand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a Norse tale, a giant says his heart is in an egg inside a duck, in a well,
    in a church, on an island, in a lake; the hero obtains and breaks the egg, and
    the giant bursts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another Norse story, a hill-ogre says a princess can return home only if
    she finds a grain of sand under the ninth tongue of the ninth head of a dragon;
    when the hero brings the grain to the ogres' rock, the ogres burst and the rock
    and lake are transformed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In an Icelandic episode, spae-wives foretell Gestr's destiny; the youngest
    says he will live only as long as a candle burns, the chief sybil extinguishes
    the candle and gives it to his mother, and Gestr later lights it and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a Celtic tale, a giant says his soul is in an egg inside a duck inside
    a wether beneath a threshold flagstone; when the egg is crushed, the giant dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In another Celtic tale, a sea beast has carried off a king's daughter; an
    old smith says the beast can be killed only by breaking an egg in a trout's mouth,
    after a sequence involving a hind and a hoodie; the egg is broken and the beast
    dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a Breton story, a giant says fire, water, and steel cannot harm him, but
    an egg hidden through a pigeon, hare, wolf, and his brother can kill him if crushed
    on his breast; a soldier obtains and crushes the egg, and the giant dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In another Breton tale, Body-without-Soul's life is in an egg inside a dove,
    hare, wolf, and iron chest at the bottom of the sea; as the hero kills the animals
    the giant weakens, and when the egg is broken on the giant's forehead he dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Across the listed tales, hidden small objects such as eggs, a grain of sand,
    or a candle are linked to the life, death, or destruction of a named person or
    group.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
