canonical_text:
  quote: ''
  summary: 'The passage first discusses animal processions and animal disguises, weighing
    whether they are pre-agricultural animal-reverence survivals or agricultural representations
    of the corn-spirit. It then introduces the transference of evil: pains, sins,
    diseases, or misfortunes may be placed on a god, animal, object, or ritual vehicle
    and removed through casting away, killing, carrying off, or sending away.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the hunting of the wren and the procession with a man clad
    in cow-skin show nothing proving an agricultural relation, and may date from a
    pre-agricultural era of animal reverence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says some European processions of animals or animal-disguised
    men may possibly be agricultural and may represent the corn-spirit in animal shape,
    but it also says the question is obscure and difficult.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the custom of killing the god has been found among
    peoples in hunting, pastoral, and agricultural stages of society.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that accumulated misfortunes and sins of a people are sometimes
    laid on a dying god, who is supposed to bear them away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes a belief that pains and griefs can be transferred to
    another being, by analogy with moving a physical load from one back to another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that trouble may be transferred to a person, an animal,
    or a thing; a thing may act as a vehicle that conveys trouble to whoever next
    touches it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In some East Indian islands, epilepsy is said to be treated by striking the
    patient with leaves of certain trees and throwing the leaves away, because the
    epilepsy is believed to have entered the leaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some Australian groups are described as treating toothache by applying a heated
    spear-thrower to the cheek, casting it away, and identifying the toothache with
    a black stone called karriitch, which may be thrown toward enemies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that a Moor with a headache may beat a lamb or goat until
    it falls down, believing the headache has passed to the animal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After an illness, a Bechuana king is described as sitting on an ox while water
    is poured over him; the ox is then drowned, and the doctor and people believe
    the king’s disease has transferred to it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Among the Malagasy, a faditra is described as something selected by a divining-board
    to take away evils or diseases; a priest charges evils onto it, and it may be
    blown away, sunk, carried away, or dashed on the ground depending on its form.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Malagasy rite to avert a foretold bloody death involves carrying a vessel
    of blood on the head, mounting a bullock, spilling the blood on the bullock’s
    head, and sending the animal into the wilderness so that it may not return.
  category: sequence
  evidence_refs:
  - ev:9
