canonical_text:
  quote: ''
  summary: Frazer describes Kakian initiation rites in which boys are reported restored
    to life by the devil, return with feathered sticks as tokens of spirit-land, behave
    as if disoriented or newborn, observe food and hair restrictions, and are later
    deemed men eligible to marry. He then compares simulated death, resurrection,
    and rebirth at initiation with Brahman twice-born investiture and Mithraic initiation,
    argues that totemism and such rites imply an external-soul belief, and applies
    this pattern to Balder's life in the mistletoe and fairy-tale examples of life
    or death stored in objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mothers and sisters of the lads go home to weep and mourn while the initiation
    proceeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Guardians or sponsors return to the village with news that the devil, through
    priestly intercession, has restored the lads to life; they arrive fainting and
    mud-daubed, like messengers from the nether world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each lad receives from the priest a stick adorned with cock or cassowary feathers;
    the sticks are said to have been given by the devil and serve as tokens that the
    lads have been in spirit-land.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: On returning home, the lads totter, enter backward or by the back door, hold
    plates upside down, and remain dumb while indicating wants by signs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sponsors teach the lads common acts of life as if the lads were newborn
    children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After leaving the Kakian house, the boys must avoid certain fruits until the
    next rites, and their mothers or sisters may not comb their hair for twenty or
    thirty days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of the hair restriction, the high priest takes the boys to a lonely
    forest place and cuts a lock from the crown of each head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the initiatory rites, the lads are considered men and may marry; marriage
    before the rites is described as scandalous.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Frazer states that simulation of death and resurrection or new birth at initiation
    appears or leaves traces beyond the Kakian example, citing Brahman investiture
    and a pretence of killing in Mithraic initiation.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Frazer argues that totemism and initiation rites involving pretend killing
    and restoration imply a belief or intention of depositing the soul in an external
    object.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Frazer suggests that initiation regularly occurs at puberty and that the danger
    addressed by totemism and related systems is associated with sexual maturity and
    sexual relations, while noting that the exact danger remains obscure.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Frazer concludes that Balder's life in the mistletoe fits the idea that a
    person's life or death can be embodied in an object, and he lists fairy-tale examples
    where figures die or are endangered through such objects.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
