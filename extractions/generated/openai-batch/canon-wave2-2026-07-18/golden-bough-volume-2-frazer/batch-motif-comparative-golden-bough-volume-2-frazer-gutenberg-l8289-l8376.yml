comparison_claims:
- id: claim:1
  claim: The cited Basuto, Ashantee, Hova, Burmese, Koch, Ho, Rajamahall-area, Central
    Provinces, and Punjab practices are presented as comparable examples of first-fruits
    rites in which new crops are ritually offered, received, or treated before ordinary
    use or consumption.
  claim_level: same_function
  target: first-fruits offering or sacrifice before consumption across the cited traditions
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is Frazer's secondary comparative framing; the passage
    does not demonstrate historical contact, common inheritance, or identical local
    meanings.
- id: claim:2
  claim: The Ashantee, Hova, and Burmese examples share a royal-recipient pattern
    in which first-fruits are presented to, or first eaten by, a sovereign before
    wider access.
  claim_level: same_function
  target: royal first-fruits presentation and royal first-eating pattern
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explicitly qualifies the king's divine character as probable,
    and the three examples differ in festival context and crop type.
