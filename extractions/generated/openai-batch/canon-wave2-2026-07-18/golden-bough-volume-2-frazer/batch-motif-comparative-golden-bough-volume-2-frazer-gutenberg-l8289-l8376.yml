canonical_text:
  quote: ''
  summary: Frazer surveys first-fruits offerings in which new crops are withheld from
    ordinary consumption until a portion is offered to gods, ancestors, kings, or
    other sacred recipients. He gives examples from Basuto, Ashantee, Hova, Burmese,
    Koch, Ho, Rajamahall hill-tribe, Central Provinces, and Punjab practices, including
    harvest festivals, animal sacrifice, royal first-eating, libations, field gestures,
    and restrictions on eating new grain before ritual observance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that new fruits may be presented as thank-offerings to
    divine beings believed to have produced them, and that people may be forbidden
    to eat new crops until first-fruits have been offered to a deity or king.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Basutos, threshed and winnowed corn is left in a heap on the threshing-floor
    and may not be touched before a religious ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Basuto corn owners bring a new vessel, boil some grain, throw handfuls of
    the boiled grain onto the heap, thank the gods, ask for future bread, and then
    eat the rest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Basutos keep defiled persons away from exposed corn and limit their participation
    in moving the harvest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Ashantee, during a September yam harvest festival, the king eats the new
    yams before the people may eat them; the festival lasts a fortnight and ordinary
    sanctions are said to be suspended.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Hovas of Madagascar carry first sheaves of new grain to the sovereign's
    palace as the grain ripens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Burma, pangati fruits were taken to the king's palace for the king to eat,
    and no one else might partake before the king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kochs of Assam offer some first-fruits to named ancestors while calling
    to them and clapping their hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Hos offer new rice to Sing Bonga, described as dwelling in the sun, and
    sacrifice a white cock before anyone may eat the new rice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Hill tribes near Rajamahall hold a thanksgiving festival before eating new
    kosarane grain, with sacrifices to Chitariah Gossaih and Kull Gossaih and a communal
    meal after offerings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the Rajamahall festival, a chief receives a hog, a measure of kosarane,
    and a pot of spirits, blesses his vassals, makes libations in the names of gods
    and the dead, drinks, and throws away some kosarane.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The same Rajamahall-area tribes hold another festival when Indian corn is
    reaped, with household sacrifices to Kull Gossaih and distribution of feast food
    to village houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Anyone among these tribes who eats new kosarane or new Indian corn before
    the public thanksgiving may be fined a white cock, which is sacrificed to Chitariah.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Central Provinces of India, the first grain of the season is offered
    to Bhímsen or Bhím Deo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the Punjab, sugar-cane planting involves a woman with a necklace walking
    round the field while winding thread on a spindle; when sugar-cane is cut, first-fruits
    are offered on an altar near the press sacred to the sugar-cane god and later
    given to Brahmans.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: When women begin picking cotton in the Punjab example, they go round the field
    eating rice-milk, spit the first mouthful toward the west, exchange the first
    cotton picked for salt, pray over the salt, and keep it in the house until picking
    is finished.
  category: sequence
  evidence_refs:
  - ev:8
