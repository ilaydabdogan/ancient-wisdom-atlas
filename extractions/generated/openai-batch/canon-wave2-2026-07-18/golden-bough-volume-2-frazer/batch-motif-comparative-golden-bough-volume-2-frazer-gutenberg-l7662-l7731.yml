canonical_text:
  quote: ''
  summary: Frazer presents examples of initiation rites described as supposed, pretended,
    or represented death and restoration to life, including Australian, Fijian, Congo,
    and Ambamba cases, and a final account of a novice’s life being sympathetically
    bound to a fetish and to a seen bird or object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces the examples as cases of supposed death and resurrection
    at initiation.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among some New South Wales Australian tribes, Thuremlin is said to take each
    lad away, kill him, sometimes cut him up, restore him to life, and knock out a
    tooth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one Queensland account, the humming of the Bullroarer at initiation is
    said to be the noise of wizards swallowing boys and bringing them up again as
    young men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ualaroi account says a boy meets a ghost that kills him and brings him
    to life again as a man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a represented resurrection ceremony, an old man disguised with stringy
    bark fibre lies in a grave, is lightly covered, and holds a small bush that appears
    to grow from the soil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Novices are brought to the grave edge; a song is sung; the bush begins to
    quiver and move; and the buried man starts up from the grave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fijian lads at initiation are shown apparently dead men covered with blood,
    with bodies seeming cut open and entrails protruding.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a yell from the Fijian priest, the pretended dead men spring up and run
    to the river to cleanse themselves of pig blood and entrails.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Ndembo practice, initiating doctors arrange a pretended fit, after which
    the person is carried to an enclosed place outside town and is said to have died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Parents and friends supply food during Ndembo seclusion, and after a period
    ranging from months to years the doctor brings the Ndembo people to life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After revival, Ndembo initiates pretend not to know people or ordinary actions,
    may talk gibberish, behave as if returned from the spirit-world, and receive another
    name.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Ambamba account, the fetish priest shakes a calabash against a village,
    and men and lads whose hour has come fall into lifeless torpidity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In Ambamba, a favored man may be carried into the bush and buried in the fetish
    house, later reviving without understanding and being taught by the fetish man
    like a small child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Ambamba account says one who has not undergone the ceremony of new birth
    is looked down upon and not admitted to dances.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: During initiation, the novice is said to be sympathetically united to the
    fetish and, in the sacred hut, sees a bird or other object with which his existence
    is thereafter bound up.
  category: relationship
  evidence_refs:
  - ev:7
