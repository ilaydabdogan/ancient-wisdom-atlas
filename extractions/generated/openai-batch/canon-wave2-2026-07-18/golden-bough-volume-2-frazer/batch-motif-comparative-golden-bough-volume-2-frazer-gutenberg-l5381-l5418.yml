canonical_text:
  quote: ''
  summary: Frazer surveys legends and folk-tales in which girls or women must avoid
    sunlight, are carried off or transformed by sunbeams, or conceive by the Sun or
    a solarized divine image. He compares modern Greek, Tyrolese, Sicilian, Greek
    Danae, and Kirgis examples and notes that the idea of women being impregnated
    by the sun appears in legends and marriage customs.
  language: English
  quote_policy: summarized
