canonical_text:
  quote: ''
  summary: Frazer conjectures that the horses said to have killed Virbius may have
    been embodiments of Virbius as a vegetation deity, and that the myth arose to
    explain the exclusion of horses from his grove. He compares this with goats connected
    to Athene, rams connected to Ammon, and the Roman October horse sacrifice, emphasizing
    annual exceptions, animal representatives of deities, ritual use of skins or blood,
    and fertility aims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a tradition that Virbius, called the first divine King
    of the Wood at Aricia, was killed by horses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that vegetation spirits may be represented as horses and
    conjectures that the horses in the Virbius tradition were embodiments of him as
    a vegetation deity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says the myth of Virbius being killed by horses was probably invented
    to explain cult features, including the exclusion of horses from his sacred grove.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage presents Athene’s relation to the goat as a parallel case: the
    goat is inferred to have been a sacred animal or embodiment of Athene, yet goats
    were generally neither sacrificed to her nor allowed on the Acropolis.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated reason for excluding goats from Athene’s sanctuary is that the
    goat injured the olive, described as Athene’s sacred tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Varro is cited for an annual exception in which a goat was driven onto the
    Acropolis for a necessary sacrifice; the author infers that its skin may have
    renewed Athene’s aegis on her statue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Thebes in Egypt, rams are described as sacred and normally not sacrificed,
    but one day each year a ram was killed and its skin placed on Ammon’s statue.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author hypothesizes that an annual exception may also have existed at
    Aricia, with a horse taken into the grove and sacrificed as an embodiment of Virbius.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author says that such an animal could later be misunderstood as an enemy
    sacrificed to the god whom it had injured.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage describes a Roman rite on October 15 in which a chariot race took
    place on the Field of Mars and the right-hand horse of the victorious team was
    sacrificed to Mars with a spear to ensure good crops.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Roman horse’s head was cut off, adorned with loaves, and contested by
    inhabitants of two wards before being fastened to a civic location.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Roman horse’s tail was carried quickly to the king’s house so that blood
    dripped on the hearth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The horse’s blood was preserved until April 21, mixed by Vestal virgins with
    blood of unborn calves, distributed to shepherds, and used to fumigate flocks.
  category: sequence
  evidence_refs:
  - ev:9
