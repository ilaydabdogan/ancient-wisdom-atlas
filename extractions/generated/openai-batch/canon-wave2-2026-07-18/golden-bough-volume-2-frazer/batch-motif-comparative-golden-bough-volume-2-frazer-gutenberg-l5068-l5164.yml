candidate_motifs:
- id: motif:1
  label: sacrifice of humans treated as divine representatives
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly describes humans killed, skinned, and connected with
    gods or god-representation, and Frazer generalizes this as killing men whom worshippers
    regard as divine.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The examples are reported through Frazer’s comparative summary, not through
    primary ritual texts in this passage.
- id: motif:2
  label: death and renewed divine representative through skin transfer
  taxonomy_refs:
  - death_rebirth
  - dying_and_returning
  basis: Frazer states that the slain god comes to life again immediately by having
    a living man clothed in the slain representative’s skin; the Toci and Totec examples
    elaborate this sequence.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The renewal language is Frazer’s interpretation of the ritual representation;
    the passage does not provide indigenous theological explanation.
- id: motif:3
  label: vegetation priest killed to preserve seasonal fertility
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  - sacrifice
  basis: The priest of Nemi is interpreted as embodying woods and vegetable life,
    and his death in vigor is said to keep spring, summer, and autumn plant abundance
    from failing.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Frazer frames the interpretation conditionally with 'if I am right.'
- id: motif:4
  label: mother goddess embodied by a sacrificial woman
  taxonomy_refs:
  - mother_goddess
  - sacrifice
  basis: A woman at the annual festival represents Toci, called the Mother of the
    Gods, bears the goddess’s name and ornaments, and is sacrificed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage describes only one summarized festival example.
- id: motif:5
  label: Golden Bough as prerequisite object in violent priestly succession
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage states that each candidate for the Arician priesthood had to
    pluck the Golden Bough before slaying the priest.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: This excerpt introduces the question of the Golden Bough but does not
    yet explain its nature or any axis/world-tree function.
- id: motif:6
  label: divine ruler or priest forbidden to touch the ground
  taxonomy_refs: []
  basis: Frazer introduces a rule that divine personages may not touch the ground
    and supplies several examples of kings, priests, or royals being carried, walking
    on mats, or avoiding being seen on foot.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No available taxonomy family exactly matches this taboo; the passage gives
    examples but limited explanation.
- id: motif:7
  label: first seasonal offerings to a god-image
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The priest wearing Totec’s skin receives first fruits, first flowers, and
    seed maize while enthroned as the god’s image.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports a single example and does not further explain the
    offering theology.
comparison_claims:
- id: claim:1
  claim: The passage explicitly treats Mexican human sacrifices and skin-clad deity
    impersonations as evidence that may strengthen the probability of comparable divine-human
    sacrifices at Aricia.
  claim_level: same_function
  target: Arician/Nemi priesthood sacrifice compared with Mexican ritual sacrifices
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is Frazer’s argument; he notes that evidence for Aricia
    is less full and leaves judgment to the reader.
- id: claim:2
  claim: Frazer proposes the Arician priest’s violent death as a possible particular
    instance of the broader custom of killing men regarded by worshippers as divine.
  claim_level: same_motif
  target: general custom of killing divine men
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents this as a reasoned presumption rather than a demonstrated
    historical identity.
- id: claim:3
  claim: The skin-wearing rites involving Toci, Totec, and the Quauhtitlan fire-god
    festival share the function of making living ritual actors appear as, or be identified
    with, gods after sacrificial killing.
  claim_level: same_function
  target: Mexican skin-clad divine impersonation rites
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The examples concern different deities and festivals and are mediated
    by Frazer’s summary.
- id: claim:4
  claim: The no-touch-ground taboo is presented as a recurring rule among several
    divine or royal offices, including Japanese, Zapotec, Tahitian, Dosuma, and Persian
    examples.
  claim_level: same_motif
  target: divine or royal ground-contact taboo
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage compares similar rules but does not claim historical contact
    or common inheritance.
