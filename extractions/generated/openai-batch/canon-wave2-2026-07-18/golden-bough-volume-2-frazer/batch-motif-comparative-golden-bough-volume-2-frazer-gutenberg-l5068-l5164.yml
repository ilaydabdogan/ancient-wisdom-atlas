canonical_text:
  quote: ''
  summary: Frazer describes several Mexican rituals in which sacrificed humans are
    skinned and living priests or young men wear the skins as images or representatives
    of deities. He then argues that these examples make comparable divine-human sacrifices
    at Aricia more plausible. The passage turns to the Golden Bough and explains Frazer’s
    view that the priest of Nemi embodied woodland and vegetable life and had to be
    killed in vigor so that sacred life could pass to a successor. It closes by introducing
    a taboo that divine kings or priests may not touch the ground, with examples from
    Japan, Zapotec Mexico, Tahiti, Dosuma, and Persia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, in Mexican ritual, a slain man-god could be skinned
    and a living man clothed in the skin became the new representative of the godhead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an annual festival, a woman representing Toci, the Mother of the Gods,
    wore the goddess’s ornaments and name and was treated as the goddess’s living
    image.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman representing Toci was feasted, diverted with sham fights, taken
    at midnight to the summit of a temple, and beheaded on the shoulders of a man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Toci representative was killed, her body was flayed; a priest wore
    the skin as Toci’s representative, while a young man representing Cinteotl wore
    the thigh skin as a mask.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Totec’s annual festival, captives were killed and skinned, and a priest
    wearing one of the skins and the god’s ornaments was enthroned and received offerings
    of first fruits, first flowers, and seed maize.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Quauhtitlans sacrificed two slaves for the god of fire, skinned them,
    removed their thigh bones, and had two priests wear the skins and carry the bones
    while descending the temple stairs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The crowd below the Quauhtitlan temple identified the descending priests as
    gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Frazer states that the priest of Nemi embodied the spirit of the woods and,
    secondarily, vegetable life in general.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Frazer states that the Nemi priest had to be killed while still vigorous so
    that sacred life could be transmitted to a successor and plant fertility would
    not fail.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says each candidate for the Arician priesthood had to pluck the
    Golden Bough before slaying the priest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A rule or taboo is introduced that a divine personage may not touch the ground
    with the foot.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Examples of the no-ground-contact rule are given for the Mikado of Japan,
    the supreme pontiff of the Zapotecs, Tahitian royalty, the king of Dosuma, and
    the king of Persia.
  category: relationship
