canonical_text:
  quote: ''
  summary: Frazer summarizes Mongolian, Tartar, and Malay narratives in which a person's
    soul is located outside the body, often in an animal, object, or nested container;
    capture, injury, removal from water, or destruction of that external soul affects
    consciousness, death, or revival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Mongolian story, the lama Tschoridong sends his soul in the form of
    a wasp to sting Joro's eyes; Joro catches the wasp and makes the lama alternately
    lose and recover consciousness by opening and shutting his hand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Tartar poem, two youths cut open an old witch without killing her;
    she says her soul is in her shoe-sole as a seven-headed speckled snake, and she
    dies after the snake's heads are cut off.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another Tartar poem, Kartaga wrestles the Swan-woman for a very long time
    while the piebald horse and black horse know that her soul is not in her body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Swan-woman's soul is described as seven little birds in a golden casket,
    inside a black chest, at the foot of a copper rock near the meeting of nine seas;
    after the birds' heads are cut off, the Swan-woman dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Tash Kan story, Tash Kan says his soul is a quail within a nested sequence
    involving poplars, a golden well, Maralen, a golden box, and a silver box; after
    the hero kills the quail, Tash Kan drops dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In another Tartar poem, a hero pursuing his sister is warned that she has
    carried away his soul in a golden sword and golden arrow, and that she can kill
    him by using those weapons against him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Malay poem, a childless merchant and his wife adopt Bidasari after
    finding her by a river; the merchant transfers her soul into a golden fish kept
    in a golden box full of water and hidden in a pond.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The queen tortures Bidasari, but Bidasari cannot die because her soul is not
    in her; Bidasari tells the queen how to obtain and handle the box and fish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the golden fish is taken out of water and worn by the queen, Bidasari
    falls into a swoon or remains unconscious; when the fish is put back into water,
    Bidasari revives.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The king finds Bidasari unconscious, later hears the secret of her life, takes
    the fish from the queen, puts it in water, and Bidasari revives before becoming
    his wife.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Several of the Tartar examples use repeated numbers, including seven snake
    heads, seven birds, seven poplars, seven Maralen, seven quails, and nine seas.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
