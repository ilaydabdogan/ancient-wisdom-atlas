candidate_motifs:
- id: motif:1
  label: external soul or life-token outside the body
  taxonomy_refs: []
  basis: Across the passage, souls are located in a wasp, snake, birds, quail, weapons,
    and a golden fish rather than remaining in the person's body.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is Frazer's summary of multiple narratives, not the full primary
    texts.
- id: motif:2
  label: life or death controlled by harming the external soul-creature
  taxonomy_refs: []
  basis: The witch, Swan-woman, and Tash Kan die after the animal identified as the
    soul is destroyed; the lama's consciousness changes when the wasp-soul is confined
    or released.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: 'The exact mechanism differs among stories: consciousness alteration,
    death by beheading, and death by wringing a neck.'
- id: motif:3
  label: remote or nested concealment of the soul
  taxonomy_refs: []
  basis: The Swan-woman's soul is nested in containers at a remote copper rock; Tash
    Kan's soul is nested through trees, water, animals, and boxes; Bidasari's soul-fish
    is hidden in a water-filled box in a pond.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The degree of remoteness varies; Bidasari's hiding place is in a family
    garden pond rather than a distant cosmic landscape.
- id: motif:4
  label: serpent as external soul-form
  taxonomy_refs:
  - serpent
  basis: The old witch's soul is explicitly located in a seven-headed speckled snake
    hidden in her shoe-sole.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This serpent form occurs in one example within the passage.
- id: motif:5
  label: shapeshifting helper destroys the opponent's soul-container
  taxonomy_refs:
  - shapeshifter
  basis: The piebald horse turns into a bald-headed man and cuts off the heads of
    the seven birds that are the Swan-woman's soul.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only the piebald horse is described as changing form.
- id: motif:6
  label: water-dependent revival through an external soul-object
  taxonomy_refs:
  - death_rebirth
  basis: Bidasari swoons or remains unconscious when the soul-fish is out of water
    and revives when the fish is put back into water.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage describes swooning, unconsciousness, and revival, not an unambiguous
    death followed by rebirth.
comparison_claims:
- id: claim:1
  claim: The Mongolian, Tartar, and Malay examples in the passage share an external-soul
    pattern in which a person's life, consciousness, or death is tied to a soul located
    outside the body.
  claim_level: same_motif
  target: external soul or life-token pattern across the passage's reported traditions
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: This is a passage-internal comparison based on Frazer's summaries;
    it does not establish historical contact or common origin.
- id: claim:2
  claim: 'The wasp, snake, birds, quail, and fish examples have the same narrative
    function: the external animal or animal-like soul-form mediates control over the
    soul-holder''s body or life-state.'
  claim_level: same_function
  target: animal-form external soul episodes within the passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: Outcomes vary from altered consciousness to death or revival; the passage
    does not imply that all animal forms carry the same symbolic meaning.
- id: claim:3
  claim: The Swan-woman, Tash Kan, and Bidasari stories share a nested concealment
    pattern for the external soul, though the nesting locations and containers differ.
  claim_level: same_motif
  target: nested concealment of a soul-object in Tartar and Malay examples
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Swan-woman and Tash Kan examples are more elaborate and remote
    than Bidasari's garden-pond hiding place.
