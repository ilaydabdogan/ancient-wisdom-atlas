canonical_text:
  quote: ''
  summary: Frazer discusses an Athenian ox sacrifice treated as the murder of a sacred
    creature, links the ox that tastes corn with a corn-deity, describes a Beauce
    straw-man called the great mondard placed on an apple-tree and later destroyed
    in water or fire, and compares these rites with first-fruits customs, harvest
    suppers, and symbolic resurrection of corn- and tree-spirits.
  language: English
  quote_policy: summarized
