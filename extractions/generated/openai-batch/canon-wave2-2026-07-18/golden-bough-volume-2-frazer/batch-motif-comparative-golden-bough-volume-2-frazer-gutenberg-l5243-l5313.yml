canonical_text:
  quote: ''
  summary: Frazer catalogs reported puberty seclusion practices for girls among groups
    in New Guinea, Borneo, Ceram, Vancouver Island, Alaska, the Rio de la Plata, Bolivia,
    and Brazil, emphasizing confinement in darkness, exclusion from sun or fire, hammocks
    or huts, fasting, bodily marking, blood, attendants, and staged emergence or return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some parts of New Guinea, chiefs' daughters around age twelve or thirteen
    are kept indoors for two or three years, with the house shaded so the sun cannot
    shine on them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Ot Danoms, girls aged eight or ten are shut for a long period in
    a little raised room or cell that is almost totally dark and has a single small
    window.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ot Danom girl may not be seen by her family during confinement; a single
    slave woman waits on her, and the girl occupies herself with weaving mats or other
    handiwork.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the Ot Danom girl is brought out at womanhood, she is shown the sun,
    earth, water, trees, and flowers as if newly born; a feast is held, a slave is
    killed, and the girl is smeared with his blood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Ceram, girls at puberty were formerly shut up alone in a dark hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Among the Aht, girls at puberty are enclosed with mats in a gallery or cage
    where neither sun nor fire can be seen; they receive water but no food, and seeing
    sun or fire during the ordeal is said to disgrace them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among the Thlinkeet or Kolosh, a pubescent girl is confined in a dark hut
    or cage with only an air-hole, without fire, exercise, or associates; food is
    put in through a window, she drinks from the wing-bone of a white-headed eagle,
    and she wears a flapped hat so her gaze does not pollute the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Koniags, girls at puberty are placed in small huts where they remain
    on hands and knees for six months, then kneel upright for another six months after
    the hut is enlarged.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among the Indians of the Rio de la Plata, a girl at first symptoms of puberty
    is sewn in her hammock as if dead, with only a small hole left for her mouth to
    breathe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Among the Chiriguanos, the girl is raised in a hammock to the roof for a month,
    lowered halfway in the second month, and in the third month old women with sticks
    run about striking things and saying they are hunting the snake that wounded her
    until one says she has killed it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among some Brazilian Indians, a pubescent girl's hair is burned or shaved,
    she is placed on a flat stone, cut down the back with an animal tooth until bleeding,
    rubbed with gourd ash, bound hand and foot, enclosed in a hammock, and kept three
    days without eating or drinking.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Brazilian girl must step from the hammock onto a flat stone because her
    feet may not touch the ground; a female relation carries her out with a live coal
    to prevent evil influences from entering her body, and later she follows dietary
    restrictions, receives further gashing, is blackened with pigment, and then goes
    about as usual.
  category: sequence
  evidence_refs:
  - ev:7
