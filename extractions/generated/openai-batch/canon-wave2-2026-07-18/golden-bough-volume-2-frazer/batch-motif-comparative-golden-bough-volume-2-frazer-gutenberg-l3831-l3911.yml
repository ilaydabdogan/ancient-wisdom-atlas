canonical_text:
  quote: ''
  summary: 'Frazer describes several seasonal or annual ceremonies for expelling spirits
    or impurities: Point Barrow Eskimo drive Tuña from houses toward a fire at the
    sun’s return; Baffin Land Eskimo enchanters drive Sedna away during autumn gales;
    Iroquois New Year ceremonies include disorder, masks, and driving evil spirits
    from huts; Cherokee purification rites use exorcisers with sycamore rods and water
    ablutions to remove impurity.'
  language: English
  quote_policy: summarized
