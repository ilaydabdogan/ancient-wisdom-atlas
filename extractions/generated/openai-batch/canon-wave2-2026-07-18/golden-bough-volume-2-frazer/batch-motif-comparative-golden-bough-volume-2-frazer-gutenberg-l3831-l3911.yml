candidate_motifs:
- id: motif:1
  label: seasonal or annual expulsion of harmful spirits
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage frames the examples as seasonal moments for general expulsion
    and gives winter-sun-return, autumn-gale, New Year, and autumn-new-moon timings.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage is comparative scholarship; the motif label generalizes across
    the examples as Frazer presents them.
- id: motif:2
  label: communal house-to-house exorcism
  taxonomy_refs: []
  basis: Tuña is hunted from every house at Point Barrow, and Iroquois masked men
    go from hut to hut driving away evil spirits.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: The Baffin Land and Cherokee examples involve dwellings or town purification
    but are not described in the same house-to-house form throughout.
- id: motif:3
  label: harmful being expelled through or from a floor opening
  taxonomy_refs: []
  basis: Tuña is thrust down through a hole in the iglu floor, and Sedna approaches
    and is struck at a hole in the floor.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: 'The actions differ: Tuña is expelled through the opening, while Sedna
    is encountered and harpooned at it.'
- id: motif:4
  label: fire as destination for expelled spirit or evil influence
  taxonomy_refs: []
  basis: At Point Barrow, parties drive Tuña toward the fire and invite him into it;
    Iroquois masked men scatter embers and ashes during the expulsion of evil spirits.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: medium
  cautions: The Iroquois passage does not explicitly say the evil spirits enter the
    fire; it only describes fire materials used during the expulsion.
- id: motif:5
  label: ritual removal of impurity by water and discarded clothing
  taxonomy_refs: []
  basis: In the Cherokee festival, people enter water and allow old clothes to be
    carried away by the stream, supposing impurities removed.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This motif is directly attested only in the Cherokee example within this
    passage.
- id: motif:6
  label: sacrifice of a white dog in a purification festival
  taxonomy_refs:
  - sacrifice
  basis: The passage identifies sacrifice of the White Dog as a conspicuous feature
    of the current Iroquois ceremony.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Frazer states that this feature appears to be a comparatively modern addition
    and absent from the oldest descriptions.
- id: motif:7
  label: temporary ritual disorder before expulsion or purification
  taxonomy_refs: []
  basis: The Iroquois New Year festival is described as a Saturnalia with disguise,
    destruction, violence, and general licence, followed by a ceremony driving evil
    spirits from the village.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage connects the disorder and expulsion within the same festival,
    but not every act of disorder is explicitly described as exorcistic.
- id: motif:8
  label: confession as preparation for expulsion of evil influences
  taxonomy_refs: []
  basis: The passage says the Iroquois general confession of sins probably prepared
    for public expulsion of evil influences by stripping moral burdens.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The explanation is Frazer’s inference, signaled by the word 'probably,'
    rather than a direct indigenous statement in the passage.
comparison_claims:
- id: claim:1
  claim: The passage presents several communities’ rites as sharing the function of
    seasonal or annual expulsion of harmful spirits, evil spirits, or impurities.
  claim_level: same_function
  target: seasonal communal expulsion and purification rites in the Point Barrow,
    Baffin Land, Iroquois, and Cherokee examples
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on Frazer’s selected descriptions and terminology;
    the passage does not establish historical contact or common origin.
- id: claim:2
  claim: The Point Barrow and Iroquois examples share a house-to-house or hut-to-hut
    pattern of expelling unwanted spirits from domestic spaces.
  claim_level: same_function
  target: domestic-space exorcism in Point Barrow Tuña rite and Iroquois New Year
    expulsion
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The ritual agents, objects, and seasonal contexts differ, and no historical
    relationship is claimed.
- id: claim:3
  claim: 'The Point Barrow and Cherokee examples both describe removal of harmful
    or impure matter by directing it into a material medium: fire in one case and
    flowing water in the other.'
  claim_level: same_function
  target: disposal of spirit or impurity into fire or stream
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The targets differ: Tuña is a spirit, while Cherokee impurities are
    linked with old clothes; the passage does not state that the media have identical
    meanings.'
- id: claim:4
  claim: The Iroquois White Dog rite belongs in the passage only cautiously as a sacrificial
    feature of the broader festival, since Frazer says it was probably a later addition.
  claim_level: same_motif
  target: sacrifice motif within Iroquois New Year ceremony
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The passage explicitly warns that the White Dog sacrifice is absent
    from the oldest descriptions and may not belong to the earlier expulsion ceremony.
