canonical_text:
  quote: "“dancing, singing, and clashing their swords against their shields”"
  summary: Frazer discusses the Salii as Roman dancing priests whose armed processions
    may have expelled evils for transfer to a scapegoat figure, compares this to Iroquois
    scapegoat dogs and other armed or costumed agricultural rites, and links dancing,
    leaping, sowing, plough processions, and year-end license with expulsion of evils
    and crop fertility.
  language: English
  quote_policy: quoted
