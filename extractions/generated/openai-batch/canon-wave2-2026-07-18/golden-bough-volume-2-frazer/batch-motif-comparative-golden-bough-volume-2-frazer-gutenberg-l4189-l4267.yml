canonical_text:
  quote: ''
  summary: The passage surveys several European and Eastern Russian rites, usually
    tied to calendar dates, in which villagers expel Satan, the Devil, witches, disease
    spirits, or female wood spirits by beating houses, making noise, using fire or
    smoke, throwing objects into rivers, making offerings, or processing through the
    village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Wotyaks, young girls assemble at the year's end or New Year with
    sticks split in nine places, beat corners of houses and yards, say they are driving
    Satan from the village, and throw the sticks into the river below the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Wotyak variant, unmarried men collect food and brandy from houses,
    cook groats under a fir-tree in a field, pronounce an expulsion formula, then
    return to houses and throw young women into the snow while saying that disease
    spirits should leave them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Malmyz account, some boiled groats are thrown into the fire with words
    asking a god not to afflict the people with sickness and pestilence or give them
    to the spirits of the wood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Kasan Government Wotyak ceremony, a sacrifice is first offered to the
    Devil at noon, after which men on horseback arm themselves with whips, lime-wood
    clubs, and lighted twigs to drive the Devil from houses and out of the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kasan Wotyak rite includes beating every corner of house and yard, shutting
    the door, spitting at the ejected fiend, riding out of the village, flinging away
    the clubs, and spitting again at the Devil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cheremiss chase Satan from their dwellings by beating walls with lime-wood
    cudgels; after he flees to the wood, they pelt the trees with cheese-cakes and
    eggs from the feast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Albania on Easter Eve, young people carry and swing resinous-wood torches
    in procession through the village, then throw them into the river while addressing
    Kore and saying she should never return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In some Calabrian villages, March begins with a night-time expulsion of witches
    accompanied by church bells, people running through streets, and cries that March
    has come; the rite is repeated on Friday evenings in March.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Tyrol, houses are cleansed and fumigated before May Day, and the May
    Day witch-expulsion involves burning bundles on poles, incense, bells, pots, pans,
    whips, barking dogs, a shouted formula, and running seven times around houses,
    yards, and village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Brunnen in Switzerland on Twelfth Night, boys process with torches and
    lanterns and make noise with horns, cow-bells, whips, and similar objects to frighten
    away Strudeli and Strätteli, two female spirits of the wood.
  category: action
  evidence_refs:
  - ev:8
