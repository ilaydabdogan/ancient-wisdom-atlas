canonical_text:
  quote: ''
  summary: Frazer links ancient Druidic wicker or osier sacrificial images with later
    European spring and midsummer fire-festivals. The passage describes processional
    wicker giants in Douay, Dunkirk, Belgium, French Flanders, and England; burning
    wicker giants in Paris and Brie; and the burning of live animals, including serpents,
    cats, a fox, a cock, and squirrels, in seasonal fires. It also notes beliefs about
    fertility and good luck attached to these rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that great quinquennial festivals were accompanied, apparently,
    by a large expenditure of human life, and supposes that lesser annual festivals
    of the same sort may underlie later European fire-festivals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Druidic images made of osiers or covered with grass
    in which victims were enclosed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports Mannhardt's view that Celtic victims encased in osiers
    and grass represented the tree-spirit or spirit of vegetation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Modern European processions described in the passage include large osier,
    wicker, basket-work, canvas, or artificial giants, sometimes moved by men enclosed
    inside them.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:5
  text: Some wicker-work giants or figures were burned in spring or summer bonfires,
    and in Paris spectators scrambled for burning fragments after the image was burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Luchon on Midsummer Eve, a tall hollow wicker column decorated with foliage
    and flowers was filled with combustibles, live serpents were thrown into it, and
    it was set on fire while participants danced with torches.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage lists other seasonal fires in which live cats, a fox, a white
    cock, a horse's head, cats at spring observances, and squirrels were burned or
    thrown into fires.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In Paris, people collected embers and ashes of a midsummer fire and took them
    home because they believed the remains brought good luck.
  category: relationship
  evidence_refs:
  - ev:7
