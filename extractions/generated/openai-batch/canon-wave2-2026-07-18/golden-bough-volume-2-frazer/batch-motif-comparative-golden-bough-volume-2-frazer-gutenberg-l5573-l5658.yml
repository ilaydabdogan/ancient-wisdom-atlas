canonical_text:
  quote: ''
  summary: 'Frazer argues that detailed myths may be invented to explain rites, then
    identifies two main incidents in Balder’s death myth: the pulling of mistletoe
    and the death and burning of the god. He compares these to annual European fire
    customs involving bonfires, dancing or leaping around fire, effigy burning, rolling
    burning wheels, crop omens, and field-protective practices in several regions.'
  language: English
  quote_policy: summarized
