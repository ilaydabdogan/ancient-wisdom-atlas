canonical_text:
  quote: ''
  summary: The passage describes a Tongan Inachi first-fruits ceremony centered on
    yams, procession, prayer at the grave of a former Tooitonga, distribution of offerings
    among gods, priests, king, and Tooitonga, and a closing assurance of divine protection.
    It then lists first-fruits offerings in Samoa, Tahiti, Huahine, Easter Island,
    Maori practice, a doubtful Old Prussian report, and Roman sacrifices of first
    corn and new wine before consumption.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At sunset and through the night, conchs sound and men and women sing a refrain
    instructing rest and no work; public roads remain empty until morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the morning, inhabitants of Tonga approach Mooa by land and sea while singing
    and sounding conchs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Processions include men and women in new gnatoos with red ribbons and flower
    wreaths; the men carry spears and clubs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each party brings yams in a basket, carried carefully by a principal vassal;
    the baskets are placed in the malai and the yams are slung on poles under mataboole
    regulation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pairs of men carry the slung yams toward the grave of the last Tooitonga with
    slow, measured steps, while chiefs and matabooles sit before the grave with bowed
    heads and clasped hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The procession circles the grave two or three times, with conchs blowing and
    men singing, before the yams are deposited before the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A mataboole of Tooitonga addresses the gods generally and then particular
    figures including the late Tooitonga, thanks them for a good harvest prospect,
    and asks that beneficence continue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'After the yams return to the malai, other Inachi articles such as dried fish
    and mats are added and the goods are divided into shares: about a fourth for the
    gods and priests, about a half for the king, and the rest for Tooitonga.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the Inachi materials are carried away, the company drinks cava, and
    a mataboole says the gods will protect and grant long lives if ceremonies and
    respect for chiefs continue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Samoans are said to have presented first-fruits to spirits and chiefs;
    one family whose god was eel-shaped gave first-fruits of taro plantations to the
    eel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Tahiti, first fish, sacred fish kinds, first orchard and garden produce,
    and portions of livestock were brought to an altar; the passage states that death
    was supposed to follow if the god did not receive such acknowledgment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Huahine, first-fruits were presented to Tani at the temple in quantities
    scaled by social rank, with a direct formula offering food to Tani.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Easter Islanders offered the first produce of the ground to Make-Make and
    Haua, and Maori first-fruits of sweet potatoes were offered to Pani, son of Rongo.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage reports a doubtful claim that Old Prussians offered first-fruits
    of crops and fishing to Curcho.
  category: other
  evidence_refs:
  - ev:10
- id: obs:15
  text: Romans sacrificed first ears of corn to Ceres and first new wine to Liber;
    people were not to eat the new corn or drink the new wine before priestly offerings.
  category: action
  evidence_refs:
  - ev:11
