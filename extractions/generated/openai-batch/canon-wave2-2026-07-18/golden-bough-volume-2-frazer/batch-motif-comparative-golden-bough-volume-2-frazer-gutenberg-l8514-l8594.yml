- id: motif:4
  label: withholding new food until first portion is ritually offered
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: In the Roman example, people may not eat new corn or drink new wine until
    priests have made the first sacrifices to Ceres and Liber.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This prohibition is explicit only in the Roman example in the supplied
    passage.
- id: motif:5
  label: welfare or danger conditioned on proper offerings
  taxonomy_refs:
  - sacred_exchange
  basis: The Tongan closing address says gods will protect and grant long lives if
    ceremonies and chiefly respect continue, while the Tahitian example says death
    was supposed if the god did not receive acknowledgment.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: 'The stated consequences differ: one is a promise of protection and longevity,
    the other a threat of death.'
comparison_claims:
- id: claim:1
  claim: Within the passage, the Tongan Inachi and the Samoan, Tahitian, Huahine,
    Easter Islander, and Maori examples belong to the same broad first-fruits offering
    motif, in which first produce is directed to gods, spirits, or chiefs.
  claim_level: same_motif
  target: Polynesian first-fruits offerings
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage compares practices by topic but does not establish a single
    origin, historical contact, or identical ritual structure.
- id: claim:2
  claim: 'The Tongan assurance of divine protection and the Tahitian warning of death
    for non-acknowledgment show a similar ritual function: first-fruits offerings
    are linked to divine favor or avoidance of harm.'
  claim_level: same_function
  target: First-fruits offerings as securing welfare through divine acknowledgment
  evidence_refs:
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The stated outcomes and ritual contexts are not identical.
- id: claim:3
  claim: The Roman sacrifices of first corn and new wine resemble the same broad first-fruits
    motif because first agricultural products are offered to named deities before
    ordinary consumption.
  claim_level: same_motif
  target: Roman first corn and new wine sacrifices to Ceres and Liber
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives no evidence of historical contact or common inheritance
    with the Polynesian examples.
- id: claim:4
  claim: The reported Old Prussian offerings to Curcho would fit the first-fruits
    offering motif if accurate, but the passage explicitly marks the statement as
    doubtful.
  claim_level: same_motif
  target: Reported Old Prussian first-fruits and fishing offerings to Curcho
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: uncertain
  limitations: The passage itself states that doubt rests on the report.
