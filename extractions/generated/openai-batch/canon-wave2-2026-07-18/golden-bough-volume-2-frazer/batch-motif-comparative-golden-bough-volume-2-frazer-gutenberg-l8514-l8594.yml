- id: motif:2
  label: harvest procession to a sacred grave or ritual focal place
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: In the Tongan ceremony, yams are carried in procession to the grave of the
    last Tooitonga, circled, deposited, and accompanied by prayer for harvest beneficence.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: This specific grave-centered procession is only described for the Tongan
    Inachi ceremony in the passage.
- id: motif:3
  label: redistribution of sacred offerings among divine, priestly, royal, and Tooitonga
    shares
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: The Inachi goods are divided into shares allotted to the gods and priests,
