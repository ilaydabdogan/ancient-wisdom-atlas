canonical_text:
  quote: ''
  summary: The passage surveys rites and folk cures in which curses, evil, sin, disease,
    or bad omens are ritually shifted from a person, household, crop, or animal to
    another bearer such as a bird, kite, boar, wise man, Brahman, calf, ass, neighbor,
    water, paper, twig, string, tree, hair, dog, or thread.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Battas of Sumatra, a childless woman is associated with a rite called
    “making the curse to fly away,” involving a sacrifice of three grasshoppers and
    the release of a swallow with a prayer that the curse depart with it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Jews, in cleansing a leper or a house suspected of
    leprosy, let a bird fly away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Miaotse of China, when the eldest son reaches seven years old, the
    father makes a straw kite and lets it fly away in the desert, bearing evil with
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Morocco, wealthy Moors are said to keep a wild boar in their stables so
    that jinn and evil spirits may enter the boar rather than the horses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Dyaks are said to believe that certain men can neutralize bad omens by
    eating a small portion of farm produce and thereby taking the omen into themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Travancore, when a Rajah is dangerously ill, a Brahman embraces him, declares
    that he bears the king’s sins and diseases, and is then sent away permanently
    from the country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Burghers or Badagas, after a death, the sins of the deceased are
    laid upon a buffalo calf, which is set free and not afterward used for common
    purposes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage groups ancient and modern European examples as attempts to shift
    disease and sin from oneself to another person, animal, or thing.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ancient recommendations described transferring scorpion-sting pain from a
    man to an ass by sitting on the ass in a prescribed way or whispering to it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Roman fever cure involved attaching the patient’s nail parings with wax
    to a neighbor’s door before sunrise so that the fever passed to the neighbor.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Plato is cited as referring to wax figures found on doors, tombstones, or
    cross-roads as objects that would alarm people.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: In Orkney, water used to wash a sick person is thrown at a gateway so that
    sickness may transfer to the first passer-through.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A Bavarian fever cure involved placing a written note in another person’s
    pocket so that that person caught the fever.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Another fever cure has the patient silently place an elder twig in the ground;
    the fever adheres to the twig and transfers to whoever pulls it up.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: A wart cure involves tying as many knots in a string as there are warts and
    placing the string under a stone; whoever treads on the stone receives the warts.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: A gout cure transfers gout to an oak by placing the sufferer’s nail parings
    and leg hairs into a bored hole in the tree and sealing it.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: A Flemish ague cure transfers the cold to an old willow by tying three knots
    in a branch and addressing the tree before running away without looking back.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: A Sunderland cough cure hangs the patient’s shaved hair on a bush so that
    birds carrying the hair to nests carry the cough with it.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: A Northamptonshire and Devonshire cough cure places a patient’s hair between
    slices of buttered bread and gives it to a dog, which is expected to receive the
    cough.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: On Carpathus, a priest ties a red thread around a sick person’s neck; the
    next morning the thread is removed and tied to a tree to transfer the sickness
    to the tree.
  category: action
  evidence_refs:
  - ev:20
