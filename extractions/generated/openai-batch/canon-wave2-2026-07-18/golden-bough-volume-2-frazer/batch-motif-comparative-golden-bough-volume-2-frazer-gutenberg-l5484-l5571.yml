canonical_text:
  quote: "“suspended, so to say, between heaven and earth”"
  summary: Frazer explains menstrual and puberty seclusion as an attempt to isolate
    a dangerous sacred force, compares these taboos with restrictions on divine kings
    and priests, then introduces the Norse Balder as a divine figure whose death follows
    from Frigg’s oaths, Loki’s discovery of the mistletoe exception, Hödur’s fatal
    throw, and Balder’s ship cremation with Nanna and his horse.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that secluding women at menstruation is intended to neutralise
    dangerous influences believed to emanate from them.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the danger is believed to be especially great at first menstruation,
    when girls may be forbidden to touch the ground or see the sun.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Girls under these rules are described as kept between heaven and earth, including
    examples of a hammock slung to a roof and a raised dark cage.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the precautions are also for the girl’s own safety, and gives
    examples of feared consequences such as shrivelling, sores on the neck, and sores
    on the throat.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage applies the same explanation to divine kings and priests, treating
    puberty uncleanness and holy sanctity as manifestations of the same supernatural
    energy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For divine personages, not touching the ground or seeing the sun is explained
    as preventing dangerous discharge of divinity and preserving their virtue for
    functions on which people and the world depend.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Balder dreams ominous dreams that seem to forebode his death, after which
    the gods hold council and seek to make him secure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Frigg obtains oaths from many beings and substances that they will not hurt
    Balder, after which the gods test his invulnerability by shooting, hewing, and
    throwing stones at him.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Loki, in the guise of an old woman, learns from Frigg that mistletoe had not
    sworn because it seemed too young.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Loki pulls the mistletoe, gives it to the blind god Hödur, directs him where
