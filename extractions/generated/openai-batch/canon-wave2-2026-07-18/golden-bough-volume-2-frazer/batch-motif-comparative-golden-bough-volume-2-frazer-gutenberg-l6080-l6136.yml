canonical_text:
  quote: ''
  summary: Frazer presents European fire-festivals as sun-charms or imitative magic
    for ensuring sunshine, citing burning wheels, tar-barrels, sun-shaped discs, friction-kindled
    fires, need-fires, cattle driven through fire, and midsummer or St. John’s customs
    involving youths covered in green branches or leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports Mannhardt’s explanation that European fire-festivals are
    sun-charms or magical ceremonies intended to ensure sunshine for people, animals,
    and plants.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A burning wheel is rolled down a hillside during these festivals and is described
    as imitating the sun’s course, especially on Midsummer Day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A burning tar-barrel is swung around a pole and is described as imitating
    the sun’s apparent revolution.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blazing discs shaped like suns are thrown into the air and are described as
    imitative magic.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage states that the supposed magical effect works through mimicry
    or sympathy: imitating the desired result is thought to produce it.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The midsummer fire is sometimes popularly called the “fire of heaven,” connecting
    an earthly flame with a heavenly flame.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that festival fire was probably originally obtained by friction
    of two pieces of wood, with examples connected to Easter, midsummer, and Beltane
    fires.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Need-fires are kindled during special distress, especially outbreaks of murrain,
    and cattle are driven through them as cattle are sometimes driven through midsummer
    fires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A quoted verse asks for forest trees, rejects sour milk, and asks for beer
    and wine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In parts of Bavaria, boys collect fuel for the midsummer bonfire; one boy
    is covered from head to foot in green fir branches and led by a rope through the
    village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Moosheim, the St. John’s Fire usually lasted fourteen days and ended on
    the second Sunday after Midsummer Day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Moosheim, children are left in charge of the bonfire while older people
    retire to a wood.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Moosheim, older people encase a young fellow in leaves and twigs; he goes
    to the fire, scatters it, and treads it out, while those present flee at his appearance.
  category: action
  evidence_refs:
  - ev:9
