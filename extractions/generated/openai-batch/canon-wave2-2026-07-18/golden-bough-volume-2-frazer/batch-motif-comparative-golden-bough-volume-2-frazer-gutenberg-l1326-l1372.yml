canonical_text:
  quote: "“once a year the Egyptians sacrificed pigs to the moon and to Osiris”"
  summary: 'Frazer describes the pig in ancient Egypt as both abhorred and ritually
    important: contact with pigs and pig’s milk are treated as polluting or dangerous,
    swineherds are excluded, yet pigs are annually sacrificed to the moon and Osiris
    and eaten. He compares this to several reported totemic or sacred-animal food
    taboos in which eating the sacred animal or plant causes disease, madness, or
    death.'
  language: English
  quote_policy: quoted
