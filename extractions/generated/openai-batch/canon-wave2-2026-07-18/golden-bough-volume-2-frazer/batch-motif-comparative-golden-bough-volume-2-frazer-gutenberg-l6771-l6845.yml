candidate_motifs:
- id: motif:1
  label: External soul or externalized life-token
  taxonomy_refs: []
  basis: Across the examples, life, fate, or strength is repeatedly located outside
    the body in a brand, hair, bird, serpent, plant, spear, dragon, or stone.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage itself uses the category of external soul, but individual
    examples vary between life, fate, immortality, and strength.
- id: motif:2
  label: Destruction or removal of token causes weakness or death
  taxonomy_refs: []
  basis: The passage repeatedly describes burning, plucking, cutting, killing, or
    placing a fatal token and an immediate or progressive loss of strength, sickness,
    or death.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: Some examples specify death, while others first describe sickness or loss
    of strength.
- id: motif:3
  label: Nested life-token hidden within animals
  taxonomy_refs: []
  basis: Several stories place the fatal or vital token inside one or more animals,
    such as doves in a boar or a stone in a bird inside a leveret inside a hydra.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:12
  confidence: high
  cautions: The passage groups these examples, but the exact nested sequences differ.
- id: motif:4
  label: Female relative or captive discovers or destroys fatal token
  taxonomy_refs: []
  basis: Mothers, daughters, and a captive princess remove, burn, or deploy fatal
    tokens in several examples.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:10
  - ev:12
  confidence: medium
  cautions: 'The motives differ: anger, romantic betrayal, maternal action, and rescue
    are all represented.'
- id: motif:5
  label: Life paired between twins or linked beings
  taxonomy_refs:
  - sacred_twins
  basis: The queen and her twin dragon brother live and die together according to
    the astrologers’ declaration.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives one example; the taxonomy reference is limited by the
    fact that the dragon twin is not explicitly called sacred.
- id: motif:6
  label: Restoration through dragon blood
  taxonomy_refs:
  - resurrection
  basis: The Pentamerone example states that the queen can be restored to life by
    smearing parts of her body with the dragon’s blood.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage reports the condition for restoration but does not narrate
    the restoration being performed.
- id: motif:7
  label: Plant as vessel of human strength
  taxonomy_refs: []
  basis: In the pumpkin story, the sons’ strength resides in pumpkin fruit planted
    at their births, and the plants grow with the children.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The plant is a pumpkin, not one of the supplied symbol taxonomy items.
- id: motif:8
  label: Serpent or many-headed creature holds vital force
  taxonomy_refs:
  - serpent
  basis: An old man’s strength is in a ten-headed serpent, and the Roman story uses
    a seven-headed hydra as part of the nested fatal-token sequence.
  evidence_refs:
  - ev:8
  - ev:12
  confidence: medium
  cautions: Only the old man example explicitly names a serpent; the hydra is included
    as a many-headed creature but not explicitly called a serpent in the passage.
comparison_claims:
- id: claim:1
  claim: The passage presents the ancient Italian legend of Silvia’s child as a close
    parallel to the Greek story of Meleager, since both children’s lives are bound
    to burnable objects and both mothers destroy the object after the child kills
    maternal uncles.
  claim_level: same_motif
  target: Meleager’s brand and Silvia’s spear
  evidence_refs:
  - ev:2
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states the parallel but does not argue historical contact.
- id: claim:2
  claim: The Nisus and Pterelaus stories share the function of a fatal golden or purple
    hair removed by a daughter during a siege after she falls in love with the besieging
    leader.
  claim_level: same_function
  target: Nisus’s fatal hair and Pterelaus’s golden hair
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports similarity of narrative function, not common origin.
- id: claim:3
  claim: The modern Greek golden-hair tale and the Greek named hair tales recur in
    the same externalized-strength or life-token pattern, with a person’s life or
    strength dependent on hair.
  claim_level: same_motif
  target: Greek fatal-hair variants
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The named tales concern death or immortality, while the modern tale
    first concerns strength and weakness.
- id: claim:4
  claim: The Greek enchanter, ogre, and monster stories share a variant pattern in
    which life or strength is located in doves or birds, often hidden in or accessed
    through another object or animal.
  claim_level: same_motif
  target: Greek bird-or-dove external-soul variants
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The number and placement of birds or doves differ among variants.
- id: claim:5
  claim: The Roman Aladdin magician’s nested fatal stone is comparable in motif function
    to the Greek hidden-bird variants because a life-ending token is concealed within
    a sequence of beings and must be obtained to kill the magician.
  claim_level: same_function
  target: Roman nested fatal stone and Greek hidden bird/dove variants
  evidence_refs:
  - ev:6
  - ev:7
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage places these examples in the same discussion but does not
    explicitly call the Roman tale a direct parallel to the Greek bird variants.
- id: claim:6
  claim: The Pentamerone queen and dragon example shares the broader life-link pattern
    with the external-soul examples, although the life is paired with another living
    being rather than simply placed in an object.
  claim_level: same_function
  target: Pentamerone queen-dragon life-link and external-soul pattern
  evidence_refs:
  - ev:1
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The form is reciprocal or paired life, not a straightforward external
    object containing a soul.
