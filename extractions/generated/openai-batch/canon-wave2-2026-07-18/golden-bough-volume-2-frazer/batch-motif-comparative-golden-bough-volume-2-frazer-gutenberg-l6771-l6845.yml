canonical_text:
  quote: the idea of an external soul is not uncommon
  summary: The passage surveys Greek, Italian, Pentamerone, and Roman tale examples
    in which a person’s life, strength, or fate is bound to an external object, animal,
    body part, plant, or nested token; destruction or removal of that external life-token
    causes weakness or death, and in one case blood can restore life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage explicitly frames the examples as Greek tales, ancient and modern,
    involving the idea of an external soul.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Meleager’s death is tied to a brand burning on the hearth; his mother preserves
    it in a box and later burns it, after which Meleager dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nisus has a purple or golden hair whose removal is fated to cause his death;
    Scylla removes it during a siege after falling in love with Minos, and Nisus dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pterelaus is made immortal through a golden hair; his daughter removes the
    hair during a siege after falling in love with Amphitryon, and Pterelaus is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a modern Greek tale, a man’s strength is in three golden hairs; when his
    mother removes them he becomes weak and timid and is killed by enemies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In one Greek story, an enchanter’s life is bound to three doves inside a wild
    boar; killing the doves makes him progressively sick and then dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Greek ogre and monster variants place strength or life in birds or doves,
    sometimes accessed through golden hairs or hidden in a wild boar; killing the
    final bird or dove kills the being.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: An old man’s strength is in a ten-headed serpent; cutting off the serpent’s
    heads makes him unwell and the last head’s removal causes his death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A dervish tells a queen that the strength of her three sons will reside in
    pumpkins planted at each birth; the pumpkins grow with the children, and loss
    or cutting of a pumpkin weakens the corresponding son.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'An ancient Italian legend is presented as a close parallel to Meleager: Mars
    gives Silvia a spear bound to her child’s fate, and Silvia later burns it after
    the grown child kills his maternal uncles.'
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In a Pentamerone story, a queen has a twin brother who is a dragon; she lives
    only as long as the dragon, and dragon blood is said to be able to restore her
    life if the dragon is killed.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: In a modern Roman version of Aladdin, a magician’s fatal vulnerability is
    a precious stone hidden through a sequence of beings; the princess puts the stone
    under his pillow and he dies.
  category: sequence
  evidence_refs:
  - ev:12
