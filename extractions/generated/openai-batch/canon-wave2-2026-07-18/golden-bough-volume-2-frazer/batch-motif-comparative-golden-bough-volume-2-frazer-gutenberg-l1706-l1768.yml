canonical_text:
  quote: "“partaken of sacramentally, that is, as the body of the corn-spirit”"
  summary: Frazer describes Lithuanian and related European new-crop rites in which
    grain, beer, loaves, fowls, potatoes, iron, and first corn are handled or consumed
    ceremonially. The passage presents these as examples of sacramental eating or
    ritual management of a crop spirit, with a conditional comparison to Christian
    communion bread.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that in some examples the corn-spirit is represented and
    eaten in human shape, while in other cases solemn eating ceremonies indicate sacramental
    partaking of the corn-spirit’s body.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lithuanian peasants held a festival called Sabarios after harvest and the
    sowing of new corn, using first-threshed and winnowed grain that had been reserved
    for the rite.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The reserved grains were mixed; part was baked into little loaves for household
    members, and the rest was made into beer, with the first brew assigned to the
    farmer, wife, and children and the second to servants.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The farmer chose an evening when no stranger was expected, knelt before the
    beer barrel, poured beer on the bung, and addressed fruitful earth with a request
    for crops to flourish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the parlour lay a bound cock and hen of the same colour and brood, hatched
    within the year; red birds were excluded.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The farmer prayed and thanked God for the harvest, the household offered the
    cock and hen to God and earth, and the farmer killed the birds with a wooden spoon
    while pouring out beer in thirds.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The wife boiled the fowls in a new pot, and loaves, boiled fowls, new beer,
    a ladle, and three mugs reserved for this occasion were used in the household
    meal around an inverted bushel.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The family knelt, the father prayed and drank three mugs of beer, others followed,
    the loaves and fowls were eaten, and each person emptied each of the three mugs
    nine times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: No food was supposed to remain; leftovers were consumed the next morning with
    the same ceremonies, bones were given to the dog or buried under dung, the rite
    occurred at the beginning of December, and no bad word might be spoken that day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports that present-day Lithuanians pull each other’s hair at
    table when eating new potatoes or loaves made from new corn, and says the meaning
    is obscure while comparing it to a similar custom at heathen Lithuanian sacrifices.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Many Esthonians of Oesel would not eat bread from new corn until first biting
    a piece of iron; the passage identifies the iron as a charm meant to render harmless
    the spirit in the corn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Sutherlandshire all family members must taste newly dug potatoes, or the
    spirits in the potatoes take offence and the potatoes would not keep.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: In one part of Yorkshire the clergyman cuts the first corn, and an informant
    believed that the corn so cut is used for communion bread; Frazer conditionally
    interprets this as Christian communion absorbing an older sacrament.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
