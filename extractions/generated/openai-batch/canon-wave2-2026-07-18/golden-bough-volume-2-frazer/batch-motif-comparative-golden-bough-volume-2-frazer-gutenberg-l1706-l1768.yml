candidate_motifs:
- id: motif:1
  label: Sacramental consumption of the crop spirit
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: The passage explicitly frames new-corn eating as partaking of the body of
    the corn-spirit and connects several new-crop foods with spirits.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: high
  cautions: This is Frazer’s interpretive framing within a comparative study, not
    an emic explanation for every practice listed.
- id: motif:2
  label: First-fruits or new-crop harvest rite
  taxonomy_refs:
  - seasonal_cycle
  basis: The rites occur after harvest and sowing, involve new corn, new potatoes,
    and first corn, and are tied to the beginning of December or initial consumption
    of the crop.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The practices come from different regions and dates; the passage groups
    them comparatively.
- id: motif:3
  label: Offering for future crop fertility
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The farmer pours beer to fruitful earth, prays for crops to flourish and
    for a good crop next year, and offers the cock and hen to God and earth.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The text does not provide a full native theological explanation beyond
    the reported prayers.
- id: motif:4
  label: Animal pair sacrifice with ritual restrictions
  taxonomy_refs:
  - sacrifice
  basis: A cock and hen of restricted colours, same brood, and same year are offered,
    killed by blows of a wooden spoon rather than beheading, boiled in a new pot,
    and eaten.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explain the meaning of all restrictions.
- id: motif:5
  label: Ritual purity, exclusion, and speech restriction
  taxonomy_refs: []
  basis: The farmer chooses an evening without expected strangers; unused vessels
    are required; no food should remain; and no bad word may be spoken on the ceremony
    day.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: These elements are present, but the passage does not explicitly label
    them as purity rules.
- id: motif:6
  label: Protective charm against spirit in food
  taxonomy_refs: []
  basis: The Oesel practice of biting iron before new-corn bread is explicitly explained
    as a charm to render harmless the spirit in the corn.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The explanation is Frazer’s stated interpretation.
- id: motif:7
  label: Obligatory communal tasting to appease food spirits
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: In Sutherlandshire all family members must taste new potatoes, otherwise
    the spirits in the potatoes take offence and the potatoes would not keep.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports this as a current belief but gives no additional ritual
    context.
- id: motif:8
  label: First-corn rite conditionally linked to communion bread
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Yorkshire custom has a clergyman cut the first corn, and an informant
    believes it is used for communion bread; Frazer conditionally states that this
    would show absorption of an older sacrament.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: low
  cautions: The report is conditional and based on an informant’s belief as presented
    in the passage.
comparison_claims:
- id: claim:1
  claim: The passage groups Lithuanian, Esthonian/Oesel, Sutherlandshire, and Yorkshire
    practices as related examples of ritually controlled first consumption of new
    harvest food because of a crop spirit or sacramental quality.
  claim_level: same_function
  target: European new-crop consumption rites involving corn, bread, potatoes, and
    first corn
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The grouping is Frazer’s comparative framing; the local rites differ
    in form, region, and stated rationale.
- id: claim:2
  claim: The passage explicitly compares the modern Lithuanian hair-pulling custom
    at new-food meals with a similar custom at heathen Lithuanian solemn sacrifices.
  claim_level: visual_similarity
  target: Heathen Lithuanian solemn sacrifices
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: The passage says the meaning of the hair-pulling custom is obscure,
    so the comparison is limited to reported similarity of action.
- id: claim:3
  claim: The passage conditionally proposes that a Yorkshire first-corn custom may
    have been absorbed into Christian communion through the use of first corn for
    communion bread.
  claim_level: historical_contact
  target: Christian communion bread and an older first-corn sacrament
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: Frazer presents the report conditionally and attributes the communion-bread
    detail to an informant’s belief.
- id: claim:4
  claim: The Esthonian iron-biting practice and the Sutherlandshire potato-tasting
    rule serve comparable functions as responses to spirits believed to be present
    in new crop food.
  claim_level: same_function
  target: Protective or appeasing responses to spirits in new corn bread and new potatoes
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: One case uses a charm to render a spirit harmless, while the other
    requires family tasting to avoid offence; the actions are not the same.
