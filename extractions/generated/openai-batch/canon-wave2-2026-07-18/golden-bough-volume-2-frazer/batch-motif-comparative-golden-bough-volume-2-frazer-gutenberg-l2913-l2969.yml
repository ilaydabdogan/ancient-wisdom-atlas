candidate_motifs:
- id: motif:1
  label: resurrection from preserved bones
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Multiple examples describe bones being preserved, arranged, or protected
    so that animals or humans may come to life again.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage is a comparative scholarly synthesis and not a single primary
    mythic narrative.
- id: motif:2
  label: ritual treatment of bones after eating or sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The Dacotas clean and bury dog bones after a feast, and the Lapps order and
    bury bones and selected parts of sacrificed animals.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: 'The stated reasons differ by example: respect toward a species, resurrection,
    or restoration in an afterlife realm.'
- id: motif:3
  label: slain game returns to maintain future supply
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: The passage states that preserving bones supports the future supply of game,
    and that bison bones are expected to become fat and fit for slaughter the next
    June.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The seasonal element is explicit only in the Minnetaree bison example;
    the broader passage is about resurrection rather than a full seasonal-cycle myth.
- id: motif:4
  label: afterlife or underground resurrection of animals
  taxonomy_refs:
  - resurrection
  basis: Lapp sacrificed animals are expected to revive in Jabme-Aimo, and Kamtchatkans
    are said to believe every creature will rise and live underground.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No journey sequence is described; the motif is limited to location of
    restored life.
- id: motif:5
  label: dismembered body reassembled and revived
  taxonomy_refs:
  - resurrection
  basis: The Magyar hero is cut in pieces, then revived after the serpent-king arranges
    the bones and washes them with water; other examples involve collected or restored
    limbs.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The Osiris example is presented as possibly belonging to the same circle
    of beliefs, not as certain within the passage.
- id: motif:6
  label: missing body part replaced by artificial member
  taxonomy_refs:
  - resurrection
  basis: The passage gives a gold-and-ivory shoulder-blade, a golden leg, an ivory
    shoulder, and a wooden replacement member as examples associated with restoration
    or multiple lives.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The Pythagoras and Osiris connections are explicitly interpretive or tentative
    in the passage.
- id: motif:7
  label: fear of offending animal ghosts or species through broken bones
  taxonomy_refs: []
  basis: The passage states that reluctance to break animal bones may arise from fear
    of intimidating living animals of the same species or offending ghosts of slain
    animals.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is presented as one possible basis among several, not as a confirmed
    explanation for every case.
- id: motif:8
  label: serpent restorer using water
  taxonomy_refs:
  - resurrection
  - serpent
  basis: In the Magyar tale, the serpent-king arranges the hero's bones, washes them
    with water, and the hero comes to life again.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This specific serpent-water restoration appears in one tale within the
    passage.
comparison_claims:
- id: claim:1
  claim: The passage treats Minnetaree, Dacota, Lapp, Kamtchatkan, North American,
    and Mongolian examples as comparable variants of a belief that animal remains
    can support renewed life.
  claim_level: same_motif
  target: cross-cultural animal bone preservation and resurrection pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is mediated by Frazer's synthesis; the passage itself
    notes differences between otherworldly, underground, and present-world resurrection.
- id: claim:2
  claim: The passage connects ritual preservation of animal bones with folk tales
    in which animals or men revive if their bones are preserved.
  claim_level: same_motif
  target: folk-tale revival from preserved bones
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says there are traces in folk tales of the same belief,
    but gives limited narrative detail.
- id: claim:3
  claim: The passage cautiously aligns Pythagoras's golden leg, Pelops's ivory shoulder,
    and Osiris's wooden replacement member with the motif of revival after a missing
    or consumed body part is replaced.
  claim_level: same_motif
  target: replacement-member resurrection stories involving Pythagoras, Pelops, and
    Osiris
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The wording is speculative for Pythagoras and especially Osiris, including
    phrases such as reported explanation and may perhaps belong.
- id: claim:4
  claim: The passage compares Lapp and Kamtchatkan beliefs specifically by their shared
    expectation that revived creatures live in an underground or otherworldly realm.
  claim_level: same_function
  target: underground or otherworldly animal resurrection
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives brief summaries rather than full accounts of either
    tradition.
