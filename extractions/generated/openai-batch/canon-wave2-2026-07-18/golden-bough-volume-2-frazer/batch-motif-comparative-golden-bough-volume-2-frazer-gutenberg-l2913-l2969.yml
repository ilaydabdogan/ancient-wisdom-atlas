canonical_text:
  quote: "“if the bones are preserved, they will in course of time be reclothed with
    flesh”"
  summary: Frazer surveys beliefs and tales in which preserved bones of eaten, slain,
    sacrificed, or dismembered beings can be reassembled, reclothed with flesh, and
    restored to life; he compares animal bone rites among several peoples with folk-tale
    and classical examples of missing body parts replaced by artificial members.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that some peoples respect the bones of game because they
    believe preserved bones can be reclothed with flesh and the animal can live again.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says hunters have an interest in leaving bones intact, because
    destroying them would reduce the future supply of game.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many Minnetaree Indians are described as believing that slain bison bones
    rise again with renewed flesh and life, becoming fit for slaughter in the following
    June.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buffalo skulls on the western American prairies are described as arranged
    in circles and symmetrical piles while awaiting resurrection.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating a dog, the Dacotas are described as collecting, scraping, washing,
    and burying the bones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Dacota treatment of dog bones is said to express lack of disrespect toward
    the dog species and a belief that the bones will rise and reproduce another dog.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Lapp animal sacrifice, the bones and selected parts are set aside, laid
    in anatomical order in a coffin, and buried with rites after the flesh is eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lapps are described as believing that the god receiving the sacrifice
    would reclothe the bones with flesh and restore the animal to life in Jabme-Aimo,
    the subterranean world of the dead.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage contrasts Lapp and Kamtchatkan expectations of underground or
    otherworldly resurrection with North American expectations of animal resurrection
    in the present world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The practice of stuffing or framework-stretching the skin of a sacrificed
    animal among Mongolian peoples is interpreted in the passage as pointing toward
    belief in present-world resurrection.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says objections to breaking the bones of eaten or sacrificed animals
    may come from belief in animal resurrection, fear of intimidating other animals
    of the same species, or fear of offending ghosts of slain animals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Folk tales are described in which animals or men revive if their bones are
    preserved, sometimes returning lame because one bone was eaten, broken, or lost.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a Magyar tale, a cut-up hero is restored when the serpent-king arranges
    the bones in order and washes them with water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Magyar tale, the hero's lost shoulder-blade is replaced with one made
    of gold and ivory.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Pythagoras is described as said to have displayed a golden leg as proof of
    supernatural pretensions connected with claims of many lives.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Pelops is described as restored to life with an ivory shoulder replacing the
    shoulder eaten by Demeter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Osiris is described as having a missing member eaten by fish, after which
    Isis collects his scattered limbs and replaces the missing member with one of
    wood.
  category: sequence
  evidence_refs:
  - ev:10
