canonical_text:
  quote: ''
  summary: Frazer surveys harvest and first-fruits rites in parts of the East Indies
    and nearby islands. The passage describes rice or paddy offered to gods, ancestors,
    or household spirits; animal killing or sacrifice; ritual altars, stones, ancestor
    figures, skulls, images, pots, and miniature houses; temporary taboos; and consecrated
    oil used for blessing or healing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Tjumba, a festival after harvest presents rice-filled vessels as a thank-offering
    to the gods; a sacred stone at the foot of a palm-tree receives blood from a sacrificed
    animal, rice, and flesh, and the palm-tree is hung with lances and shields.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dyaks of Borneo hold a first-fruits feast when paddy is ripe; priestesses
    process with gong and drum to farms, gather ripe paddy, wash it in coconut water,
    and place it around a decorated bamboo altar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Dyak feast, the village is tabooed so that no one may leave; fowls
    are killed, dancing and gong-beating continue day and night, and crop gathering
    begins after the festival ends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a Celebes harvest rite for pounding new paddy, two mats with pillows, clothing,
    and a sword appear to represent deceased ancestors; rice and water are placed
    before them and they are sprinkled with new paddy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Minahassa of Celebes hold a festival of eating the new rice in which fowls
    or pigs are killed and some flesh, rice, and palm-wine are set apart for the gods
    before communal eating and drinking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people of Kobi and Sariputi offer cooked first-fruits rice with tobacco
    and other items to their ancestors as a token of gratitude; the ceremony is called
    feeding the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Tenimber and Timorlaut Islands, first-fruits of paddy with live fowls
    and pigs are offered to the matmate, ancestor spirits worshipped as guardian spirits
    or household gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The matmate are said to enter houses through roof openings, dwell temporarily
    in skulls or wood or ivory images to partake of offerings and help the family,
    and also take forms including birds, pigs, crocodiles, turtles, and sharks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Amboina, new fruits are offered to the gods before priests may eat them;
    boiled new rice or other produce with coconut milk and saffron is offered, oil
    may be poured before the deity, and leftover oil is kept for smearing people to
    confer blessings.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Irayas and Catalangans of Luzon worship ancestor souls called anitos,
    offer them first-fruits of the harvest, and regard some as household deities residing
    in pots or associated with miniature houses near dwellings.
  category: relationship
  evidence_refs:
  - ev:8
