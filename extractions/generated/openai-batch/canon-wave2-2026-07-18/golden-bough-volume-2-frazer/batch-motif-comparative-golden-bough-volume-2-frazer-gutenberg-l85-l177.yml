  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person who cuts the last corn or binds the last sheaf receives the name
    of the animal, such as Rye-wolf, Rye-sow, or Oats-goat, and may keep it for a
    year.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The animal is often represented by a puppet made from the last sheaf or from
    wood, flowers, and similar materials, and the puppet is carried home on the last
    harvest wagon amid rejoicing.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Specific crops may have their own animal names, such as Rye-wolf, Barley-wolf,
    Oats-wolf, Pea-wolf, or Potato-wolf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The animal is sometimes believed to be killed by the last stroke of the sickle
    or scythe, and more often to remain alive while any corn is still unthreshed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At threshing, the person who gives the last stroke with the flail is told
    that he has got the Corn-sow, Threshing-dog, or a similar animal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: After threshing is finished, an animal-shaped puppet may be carried by the
    thresher of the last sheaf to a neighboring farm where threshing continues.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The thresher of the last sheaf may himself represent the animal and, if caught
