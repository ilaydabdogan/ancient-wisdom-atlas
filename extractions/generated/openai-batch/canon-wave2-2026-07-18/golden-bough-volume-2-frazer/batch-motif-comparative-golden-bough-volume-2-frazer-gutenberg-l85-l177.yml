- id: obs:1
  text: The contents list sections on the corn-spirit as an animal, eating the god,
    killing the divine animal, transference and expulsion of evils, scapegoats, killing
    the god in Mexico, and the Golden Bough.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The section opens by saying that the corn-spirit has appeared in animal form
