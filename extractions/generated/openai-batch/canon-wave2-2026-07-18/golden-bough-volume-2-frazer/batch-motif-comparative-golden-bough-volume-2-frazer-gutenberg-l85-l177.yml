    “neck.”
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists many animal forms attributed to the corn-spirit, including
    wolf, dog, hare, cock, goose, cat, goat, cow or bull, pig, and horse.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The corn-spirit is described as present in the corn and as caught or killed
    in the last sheaf.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the corn is cut, the animal is said to flee before the reapers, and an
