canonical_text:
  quote: ''
  summary: The passage includes a contents list and the opening of a section on the
    corn-spirit as an animal. It describes beliefs that the corn-spirit appears as
    various animals, dwells in the crop, is caught or killed in the last sheaf or
    at threshing, may be represented by an effigy, and is especially imagined as a
    wolf or dog in parts of France, Germany, and Slavonic countries. It also recounts
    an East Prussian practice of judging a field-wolf by the position of its tail.
  language: English
  quote_policy: summarized
