canonical_text:
  quote: ''
  summary: 'The passage reports first-fish and first-catch precautions among several
    groups: seasonal fish are greeted or honored, first salmon or halibut are handled
    under ritual restrictions, a Karok ritual specialist fasts and kindles sacred
    fire with the first salmon, Columbia River rules govern cutting, cooking, hearts,
    sale, and same-day consumption, and Aino fishing includes purity rules, silence,
    and bringing the first fish into the hut through a special opening rather than
    the door.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that when fish are the first of the season, additional
    precautions are taken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On salmon rivers, first seasonal fish are received with deference by tribes
    said to subsist largely on fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In British Columbia, Indians are reported to have gone out to meet the first
    fish and addressed them as chiefs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the Thlinket of Alaska, the first halibut of the season is carefully
    handled, addressed as a chief, and honored with a festival before fishing continues.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Karoks of California dance for salmon in spring when salmon begin to run
    up the Klamath River, with the stated purpose of ensuring a good catch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Karok figure called Kareya or God-man retires to the mountains and fasts
    for ten days before returning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the Kareya returns, the people flee; he goes to the river, takes the
    first salmon of the catch, eats some of it, and kindles sacred fire in the sweating-house
    with the rest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Karok rule reported in the passage forbids taking salmon before the dance
    and for ten days after it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Karok fishermen are said to avoid booth or weir poles gathered at the river-side,
    to bring poles from the highest mountain, and not to reuse the same poles a second
    year.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The stated Karok rationale for pole restrictions is that salmon might have
    seen the poles or that old salmon might tell young salmon about reused poles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Among Indians of the Columbia River, first salmon are reported not to be cut
    crosswise or boiled, but roasted; they are not to be kept overnight and are to
    be consumed on the day taken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Among Indians of the Columbia River, fish are not to be sold without first
    removing the heart, and the passage reports a belief that if a stranger ate the
    heart early in the season no more fish would be caught.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Ainos prepare for fishing by observing ceremonial purity, and women at
    home must keep strict silence while fishing is underway.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The first Aino fish is brought home through a small opening at the end of
    the hut rather than through the door, with the stated reason that other fish would
    see him and disappear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage links the Aino entry rule to a wider custom of bringing game into
    huts by a window, smoke-hole, or special back opening instead of by the door.
  category: relationship
  evidence_refs:
  - ev:6
