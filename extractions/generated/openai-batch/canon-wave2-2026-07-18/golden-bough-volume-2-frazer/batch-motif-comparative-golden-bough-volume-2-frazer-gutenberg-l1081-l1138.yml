  quote: ''
  summary: Frazer describes ox-related agricultural rites at Great Bassam and in China,
    then compares grain-filled or dismembered animal and effigy customs with Silesian,
    Florentine, Khond, Dionysian, and Athenian examples as fertility-bearing sacrificial
    or seasonal practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Great Bassam in Guinea, two oxen are slain annually to procure a good harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women sit before the oxen, chant that the ox will weep, and throw manioc meal
    or palm wine on them, especially into their eyes, until tears roll down; the people
    then dance and sing that the ox weeps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two men seize the oxen's tails and cut them off at one blow; the passage reports
    a belief that misfortune will occur if the tails are not severed at one blow.
    The oxen are then killed and their flesh is eaten by the chiefs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author states that the tears of the Great Bassam oxen, like those of Khond
    human victims, are probably a rain-charm, and connects the ox tail with ideas
    about the corn-spirit's tail.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Chinese spring ceremony described, on the first day of spring the governor
    or prefect goes in procession to the east gate and sacrifices to the Divine Husbandman,
    represented with a bull's head on a man's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A large effigy of an ox, cow, or buffalo stands outside the east gate with
    agricultural implements beside it; it is made from differently colored paper,
    and the paper colors are said to indicate the coming year's character.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mandarins walk around the ox effigy and beat it with colored rods; when the
    ox is broken, five kinds of grain pour out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The paper fragments of the Chinese effigy are set on fire, and people scramble
    for burning fragments because they believe obtaining one brings fortune for the
    year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A live buffalo is killed and its flesh divided among the mandarins; in another
    account, a clay ox effigy is beaten by the governor and stoned by the people until
    broken for an abundant year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage compares the Chinese ceremony with Silesian burning of an effigy
    of Death and Florentine sawing of an Old Woman effigy filled with dried fruits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author concludes that Dionysus, as goat and bull, may have been essentially
    a vegetation god, and proposes that rending a live bull or goat in Dionysian rites
    allowed worshippers to obtain portions of life-giving and fertilizing influence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the Dionysian animal's flesh was eaten raw as a sacrament
    and conjectures that some flesh may have been taken home to be buried in fields
    or otherwise used for crops.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage conjectures that the resurrection of Dionysus may have been represented
    ritually by stuffing and setting up the slain ox, as in the Athenian bouphonia.
  category: relationship
  evidence_refs:
  - ev:6
