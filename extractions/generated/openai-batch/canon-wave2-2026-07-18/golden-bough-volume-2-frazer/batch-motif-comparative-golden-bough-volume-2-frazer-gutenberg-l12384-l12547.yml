  summary: A sequence of footnotes discusses Greek ritual terms for subterranean sacred
    spaces, animal offerings placed in adyta or caverns and later buried, swine as
    sacred or sacrificial animals in several traditions, and brief scholarly identifications
    of sacrificial boars with divine or mythic figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The scholiast calls the spaces megara and adyta; megara are explained as subterranean
    vaults or chasms sacred to gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At spring and autumn festivals of Isis at Tithorea, geese and goats are thrown
    into an adyton, left until the next festival, then their remains are removed and
    buried near the temple.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage uses the Isis-festival example as an analogy for the view that
    pigs thrown into caverns at the Thesmophoria were left there until the next festival.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: In Crete, described as an ancient seat of Demeter worship, the pig is said
    to have been very sacred and not eaten; the note adds that this does not exclude
    sacramental eating, as at the Thesmophoria.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Harranians are reported to have sacrificed swine once a year and eaten
    the flesh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A scholarly conjecture is reported that wild boars annually sacrificed in
    Cyprus represented Adonis himself.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Herodotus is said to distinguish a pig sacrifice to the moon from a pig sacrifice
    to Osiris; in the moon sacrifice, selected pig parts are fat-covered and burned
    while the rest is eaten.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: For the Osiris sacrifice, each man is described as slaying a pig before his
    door and giving it to the swineherd to take away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage reports Lefébure’s recognition that, in a referenced story, the
    boar is Typhon himself.
  category: relationship
  evidence_refs:
  - ev:7
