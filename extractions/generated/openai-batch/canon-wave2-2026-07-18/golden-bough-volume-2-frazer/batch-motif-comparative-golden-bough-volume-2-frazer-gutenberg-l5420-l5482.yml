canonical_text:
  quote: ''
  summary: Frazer presents comparative reports of rules and beliefs surrounding menstruation
    and puberty seclusion, including restrictions on women’s movement, touch, water
    use, paths, hunting and fishing areas, and claims that contact, sight, or footsteps
    can harm men, crops, animals, liquids, tools, or trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the seclusion of girls at puberty is grounded in dread
    of menstruous blood.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Australian example, boys are told that seeing the blood will make them
    gray-headed early and prematurely weaken them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Australian example, a woman lives apart at menstruation; if a young
    man or boy approaches, she calls out and he detours to avoid her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Australian example, men avoid tracks made by women at such times, and
    the woman is barred from men’s paths, men’s objects, fish, and water; breaking
    the rules is punished severely.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Bushmen example, a girl’s glance during the time of required retirement
    is believed to fix men in place and change them into talking trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Guayquiries example, anything a menstruating woman steps on is believed
    to die, and a man who treads where she has passed is believed to suffer swollen
    legs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Creek and related Indian example, menstruating women are compelled
    to live in separate huts, and approaching them is described as dangerous pollution;
    enemies who kill them must cleanse themselves with sacred herbs and roots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Chippeway and Hudson Bay Territory examples, menstruating women are
    excluded from camp, live in branch huts, and wear hoods concealing the head and
    breast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Chippeway and Hudson Bay Territory examples, menstruating women may
    not touch household furniture or men’s objects, walk on common paths, cross animal
    tracks, walk on river or lake ice, or go near hunting and fishing places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Chippeway and Hudson Bay Territory examples connect violation of these
    rules with loss of future hunting success.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Lapp example forbids menstruating women to walk on the shore from which
    fishers set out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Pliny example lists effects attributed to the touch of a menstruating
    woman, including souring wine, blighting crops, killing seedlings, blasting gardens,
    bringing down fruit, dimming mirrors, blunting razors, rusting metals, killing
    or driving away bees, and causing mares to miscarry.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The later European examples include beliefs that a menstruating woman can
    sour beer, spoil beer, wine, vinegar, or milk, prevent jam from keeping, cause
    a mare to miscarry, wither buds, or kill a cherry tree.
  category: action
  evidence_refs:
  - ev:9
