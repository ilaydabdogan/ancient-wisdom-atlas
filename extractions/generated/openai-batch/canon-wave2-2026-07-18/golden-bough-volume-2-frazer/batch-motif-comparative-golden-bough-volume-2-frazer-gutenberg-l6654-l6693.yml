canonical_text:
  quote: ''
  summary: The passage recounts two stories identified as Hindoo. In the first, Princess
    Sodewa Bai is born with a golden necklace containing her soul; a jealous co-wife
    has it stolen, and Sodewa Bai dies when another woman wears it but revives whenever
    it is removed, until the prince restores it to her. In the second, a mendicant
    tells a queen that her future son Dalim’s life is bound to a boal-fish, whose
    heart contains a wooden box and golden necklace; the elder queen obtains the necklace,
    and Dalim dies when she wears it but revives when she removes it.
