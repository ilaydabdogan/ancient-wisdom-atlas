canonical_text:
  quote: ''
  summary: The passage describes the Inca festival Situa, held in September to expel
    disease and troubles from the capital. Participants fast, prepare maize pastes
    including one mixed with blood from children, wash and rub paste on their bodies,
    anoint thresholds, worship the Sun, send royal messengers with lances down four
    roads, perform public gestures and cries of expulsion, bathe, use lit straw torches,
    and carry lances by relays beyond the city where they are washed and set as a
    boundary against returning evils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Situa festival is described as a September Inca festival intended to banish
    disease and troubles from the capital and its vicinity, timed with the beginning
    of the rains and associated sickness.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: As preparation, the people fasted on the first day of the moon after the autumnal
    equinox.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A coarse maize paste was baked in two sorts; one sort was kneaded with blood
    obtained from children aged five to ten years by bleeding them between the eyebrows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Families assembled at the house of the eldest brother, or at the house of
    the next older relation when there was no elder brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those who had fasted washed their bodies and rubbed blood-kneaded paste over
    the head, face, breast, shoulders, arms, and legs so that the paste might take
    away infirmities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The head of the family anointed the threshold with the same paste as a token
    that the household had performed ablutions and cleansed their bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The High Priest performed the same ceremonies in the temple of the Sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At sunrise the people worshipped the Sun, asked him to drive evils out of
    the city, and broke their fast with the paste that had been kneaded without blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A royal Inca described as a messenger of the Sun came from the fortress richly
    dressed, carrying a lance decorated with many-colored feathers and gold rings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The messenger ran from the fortress to the centre of the great square, where
    a golden urn used for the sacrifice of chicha stood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The messenger touched the lances of four other royal Incas and told them the
    Sun ordered them to drive evils out of the city; the four then ran down four royal
    roads to the four quarters of the world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: People came to their doors, shook their clothes as if shaking off dust, and
    cried for the evils to be gone and for the Creator to let them reach another year.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: After shaking their clothes, people passed their hands over their heads, faces,
    arms, and legs as if washing, in order to drive evils from their houses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The people danced, including the Inca himself, and bathed in rivers and fountains
    while saying their maladies would come out of them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: People lit straw torches, passed them from one to another, struck each other
    with them, and said that all harm should go away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Lances were carried by relays of runners five or six leagues beyond the city,
    after which the runners washed themselves and their weapons in rivers and set
    up the lances as a boundary preventing the return of banished evils.
  category: sequence
  evidence_refs:
  - ev:9
