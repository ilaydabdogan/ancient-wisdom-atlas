canonical_text:
  quote: ''
  summary: Frazer argues that a totemic external soul would be concealed from strangers
    because of fear of sorcery, compares this secrecy to fairy tales in which a giant
    hides the place of his soul, and interprets puberty initiation rites involving
    simulated death and revival as an exchange of souls between a youth and his totem.
    He also cites a Basque hunter story in which a bear kills a man and breathes its
    soul into him, making the revived man a bear in soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Batta does not explicitly affirm that his external soul
    is in his totem, but gives other grounds for respecting the sacred animal or plant
    of his clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a person who believes his life is bound up with an external
    object would be unlikely to reveal the secret to a stranger.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists hair and nail clippings, spittle, food remnants, and a name
    as personal remnants thought capable of being used by a sorcerer for destruction.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the fairy-tale example, a princess asks a giant where he keeps his soul,
    and the giant usually gives false or evasive answers until the secret is obtained
    after coaxing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that among many tribes, especially those known to practise
    totemism, lads at puberty undergo initiatory rites that may include a pretence
    of killing the lad and bringing him to life again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Frazer proposes that the initiatory rite consists in extracting the youth’s
    soul in order to transfer it to his totem.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes the rite’s simulated death and resurrection as an exchange
    of life or souls between the man and his totem.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Basque hunter story says the hunter was killed by a bear, the bear breathed
    its own soul into him, the bear’s body died, and the hunter himself was a bear
    because he was animated by the bear’s soul.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Frazer states that in the totemistic ceremony the lad dies as a man and comes
    to life again as an animal, with the animal’s soul in him and his human soul in
    the animal.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says the revived initiate may call himself Bear or Wolf according
    to his totem and treat bears or wolves as brethren.
  category: relationship
  evidence_refs:
  - ev:10
