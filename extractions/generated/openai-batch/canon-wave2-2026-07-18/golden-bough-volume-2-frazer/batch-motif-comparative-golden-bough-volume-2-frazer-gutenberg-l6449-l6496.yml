canonical_text:
  quote: ''
  summary: Frazer argues that European Aryan fire-festivals share a primitive common
    stock and infers that an early feature was the burning of a man representing the
    tree-spirit, originally associated with the oak. He cites oak-wood friction for
    sacred or need-fires among Slavic, German, and Scottish examples, oak fuel for
    perpetual or midsummer fires, the use of charred oak embers for crop fertility
    and protection, and an analogy with the Boeotian Daedala in which an oak was felled
    and burned.
  language: English
  quote_policy: summarized
