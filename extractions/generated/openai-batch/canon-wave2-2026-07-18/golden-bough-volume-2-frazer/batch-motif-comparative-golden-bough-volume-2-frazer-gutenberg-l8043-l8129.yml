canonical_text:
  quote: ''
  summary: Frazer argues that mistletoe growing on oak was treated as a liminal plant
    that might contain the life of the oak or of figures linked to it. He compares
    this idea with beliefs about sea foam, rowan trees, witchcraft protection, Scottish
    family fate bound to mistletoe on an oak, a taboo concerning deer on Finchra,
    and Virgil’s Golden Bough, which he infers was mistletoe poetically described.
  language: English
  quote_policy: summarized
