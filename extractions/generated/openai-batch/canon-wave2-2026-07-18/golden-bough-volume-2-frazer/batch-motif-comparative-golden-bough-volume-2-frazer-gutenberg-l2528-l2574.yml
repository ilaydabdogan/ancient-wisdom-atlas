canonical_text:
  quote: "“We kill you, O bear! come back soon into an Aino.”"
  summary: Frazer summarizes reported Aino, Gilyak, and Goldi bear ceremonies involving
    captive or hunted bears, ritualized killing, offerings or apologies to the bear,
    consumption of flesh, and post-mortem treatment of the head or skull.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In Miss Bird’s report of the Aino ceremony, yells and shouts excite the bear;
    a chief wounds it with an arrow; the cage bars are raised; and the Ainos wound
    the released bear, with drawing its blood said to bring good luck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Aino bear falls exhausted, its head is cut off; the weapons used
    against it are offered to the head; and the bear is asked to avenge itself upon
    the weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Usu, when the bear is killed, the Ainos address it by saying that they
    kill it and ask it to come back soon into an Aino.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One cited authority says the bear’s heart is often offered to the dead animal
    to assure it that it is still alive; another denies this and says the heart is
    eaten; Frazer notes that the practice may vary by place.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Gilyaks are described as a Tunguzian people of Eastern Siberia who hold
    a bear festival of the same sort, in which the bear is an object of village solicitude
    and plays the chief part in religious ceremonies.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Gilyak account, an old she-bear is shot, her cub is reared in the village,
    and when the bear is large enough it is taken from its cage and dragged through
    the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Gilyak bear is first led to the riverbank to ensure fish abundance, then
    taken into every house, where fish, brandy, and other offerings are made; some
    people prostrate themselves, and the bear’s entrance or sniffing at food is considered
    a blessing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Despite honoring the Gilyak bear, the villagers continually tease, poke, and
    tickle it until it is surly, then tie it to a peg and shoot it dead with arrows.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: After the Gilyak bear is killed, its head is cut off, decked with shavings,
    and placed on the feast table; people beg pardon of it and worship it; its flesh
    is roasted and eaten, and its skull is placed on a tree near the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the Gilyak feast, the brain and entrails are eaten last, and the people
    sing and dance in ranks as bears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The Goldi are described as neighbors of the Gilyaks who treat the bear in
    much the same way: they hunt and kill it, or keep a live bear in a cage, feed
    it well, call it son and brother, parade it at a festival, then kill and eat it.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Goldi account, the skull, jaw-bones, and ears are suspended on a tree
    as an antidote against evil spirits, and those who eat the bear’s flesh are believed
    to gain zest for the chase and courage.
  category: action
  evidence_refs:
  - ev:5
