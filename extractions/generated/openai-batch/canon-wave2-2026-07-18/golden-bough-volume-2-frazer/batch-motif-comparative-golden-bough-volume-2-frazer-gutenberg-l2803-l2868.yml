canonical_text:
  quote: ''
  summary: Frazer compares practices in which game animals and fish are treated with
    respect after capture because their souls, patrons, or kin may punish disrespect
    or withhold future catches. Examples include taboos on burning bones, animal souls
    entering a sick person to avenge wrongs, fish worship in Peru, Huron preaching
    to fish, attribution of herring disappearance to maltreatment, a canoe offering
    to fish, and Maori release of the first fish with prayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elan, deer, and elk are described as receiving punctilious respect from North
    American Indians, including prohibitions against giving their bones to dogs, throwing
    bones into fire, or dropping their fat on fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for respecting animal remains is that souls of dead animals
    were believed to see what was done to their bodies and report it to other beasts,
    affecting whether animals of that species would allow themselves to be taken.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A medicine-man is described as asking a sick man whether he had thrown away
    deer or turtle flesh and attributing the illness to the soul of the deer or turtle
    entering the man's body to avenge the wrong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sioux are described as avoiding sticking an awl or needle into a turtle
    because they expect the turtle to punish them later.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Canadian Indians are described as not eating elk embryos except at the close
    of the hunting season, in order that mother elks would not become shy and refuse
    capture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Indians are said to believe each sort of animal has a patron or genius
    who watches over and preserves it; an Indian father caresses a dead mouse to appease
    the genius of mice before giving it to his daughter to eat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Indians of Peru are described as adoring the fish they caught most abundantly
    and treating the most useful local fish as gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Peruvian explanation cited says that the first fish made in the world
    above gave birth to all other fish of that species and sent its children to sustain
    the tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Otawa Indians are described as avoiding burning fish bones because they
    believed dead fish souls passed into other fish bodies and would be displeased
    and stop coming to the nets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hurons are described as avoiding throwing fish bones into fire lest fish
    souls warn other fish not to be caught.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Hurons are described as having men who preached to fish and persuaded
    them to come and be caught.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The disappearance of herring from the sea near Heligoland in 1530 is described
    as being attributed by fishermen to two lads whipping a freshly caught herring
    and throwing it back into the sea.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Natives of Duke of York Island are described as annually decorating a canoe
    with flowers and ferns, loading or supposedly loading it with shell-money, and
    setting it adrift to pay the fish for those caught.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Maoris are described as returning the first fish caught to the sea with
    a prayer that it may tempt other fish to come and be caught.
  category: sequence
  evidence_refs:
  - ev:8
