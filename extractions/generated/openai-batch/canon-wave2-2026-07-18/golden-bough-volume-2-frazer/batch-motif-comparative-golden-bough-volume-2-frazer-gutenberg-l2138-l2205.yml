canonical_text:
  quote: By eating the body of the god he shares in the god’s attributes and powers.
  summary: Frazer lists examples in which people eat, drink, or apply parts of brave
    men, enemies, or executed criminals to acquire courage, strength, skill, power,
    or divinity. He then interprets the eating of a god’s body and drinking of a god’s
    blood as a sacramental sharing in divine powers. The passage introduces the topic
    of killing divine animals and describes the Acagchemen annual Panes bird-feast,
    in which a revered buzzard is killed, preserved in part, buried, mourned, and
    believed to return to life and multiply.
  language: English
  quote_policy: quoted
