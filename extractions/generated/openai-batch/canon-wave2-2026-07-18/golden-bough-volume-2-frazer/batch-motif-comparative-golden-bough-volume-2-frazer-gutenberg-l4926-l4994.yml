canonical_text:
  quote: ''
  summary: Frazer interprets the beating of a human scapegoat with squills, wild fig
    branches, and similar plants as apotropaic purification and stimulation of reproductive
    power before sacrifice. He links the rite to a vegetation-god renewal pattern
    and compares it with examples of ritual beating or scourging using plants, rods,
    torches, nettles, sticks, and branches in Mediterranean, South American, New Guinean,
    and European customs.
  language: English
  quote_policy: summarized
