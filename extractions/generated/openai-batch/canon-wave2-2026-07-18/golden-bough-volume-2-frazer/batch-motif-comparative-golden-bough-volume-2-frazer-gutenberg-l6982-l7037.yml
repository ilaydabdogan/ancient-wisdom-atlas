canonical_text:
  quote: I will enchant my heart and place it on the top of the flower of the Acacia.
  summary: Frazer introduces the ancient Egyptian story of “The Two Brothers” as an
    example of the external soul idea. In the summarized tale, the younger brother
    Bitiu serves his elder brother Anupu. Anupu’s wife attempts to seduce Bitiu, then
    falsely accuses him of assault. Anupu prepares to kill Bitiu, but a cow warns
    Bitiu. Bitiu flees, calls on the Sun, and a crocodile-filled water barrier separates
    the brothers. Bitiu then tells Anupu he will go to the Valley of the Acacia, enchant
    his heart, and place it on the Acacia flower; if the Acacia is cut and the heart
    falls, Anupu must put the heart in fresh water so Bitiu may live again. A bubbling
    beer pot will be the sign that evil has befallen him. Anupu returns home, kills
    his wife, and casts her to the dogs.
  language: English
  quote_policy: quoted
