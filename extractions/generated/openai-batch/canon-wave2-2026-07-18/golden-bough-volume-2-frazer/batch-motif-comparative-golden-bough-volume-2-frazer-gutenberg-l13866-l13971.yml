canonical_text:
  quote: ''
  summary: The passage is a set of footnotes. Its main substantive note describes
    the Dassera festival in Nepal as an annual period involving holiday, city purification,
    jail-delivery or removal of prisoners, gifts from masters to servants, feasting
    and drinking, a military firing ceremony interpreted by Frazer as expelling demons,
    and the postponement of rice cutting until the festival ends. It also notes general
    licence at Wasuahili New Year and at the Ashantee new yam festival. Other notes
    cite sources or briefly mention customs such as standing on a sacrificed victim
    and the Roman Mamurius/Mamurius Veturius being beaten and expelled in legend.
  language: English
  quote_policy: summarized
