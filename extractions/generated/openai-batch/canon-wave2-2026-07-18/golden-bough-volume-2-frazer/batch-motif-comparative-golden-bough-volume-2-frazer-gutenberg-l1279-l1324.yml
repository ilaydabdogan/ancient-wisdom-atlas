canonical_text:
  quote: ''
  summary: Frazer discusses variant explanations for Adonis's connection with the
    boar, Syrian and Jewish pig taboos, and the possibility that animals treated as
    unclean were originally sacred or sacramentally consumed as divine embodiments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage reports several variant stories linking Adonis with a boar: a
    boar kills him, a boar rends the bark of the tree in which infant Adonis was born,
    and Hephaestus kills him on Mount Lebanon while he hunts wild boars.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Hierapolis, pigs were neither sacrificed nor eaten, and touching a pig
    made a person unclean for the rest of the day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that some explained the Syrian pig restriction by uncleanness
    and others by sacredness; Frazer identifies this undifferentiated sacred/unclean
    state as taboo.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Frazer argues that the pig could have been held as an embodiment of the divine
    Adonis and that the hostile-animal story may be a later misunderstanding of god-in-animal
    embodiment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the rule against sacrificing or eating pigs among worshippers
    of Attis and presumably Adonis does not rule out solemn sacramental killing and
    eating of the pig as representative of the god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Greek observers could not decide whether Jews worshipped
    swine or abominated them, since Jews might neither eat swine nor kill them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Frazer infers that the pig was originally held sacred rather than unclean
    by the Israelites.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that some Jews down to the time of Isaiah secretly met
    in gardens to eat swine and mice flesh as a religious rite.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Frazer interprets the secret rite as ancient sacramental eating of animals
    venerated as divine and states the general thesis that so-called unclean animals
    were originally sacred.
  category: other
  evidence_refs:
  - ev:6
