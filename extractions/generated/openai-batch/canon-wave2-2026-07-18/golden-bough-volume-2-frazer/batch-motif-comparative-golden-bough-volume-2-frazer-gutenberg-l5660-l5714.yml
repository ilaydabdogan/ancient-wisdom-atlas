canonical_text:
  quote: ''
  summary: Frazer discusses spring fire customs in which straw or wooden human-like
    figures are burned at Lent, Shrove Tuesday, Carnival, Ash Wednesday, the spring
    equinox, and Easter Eve. The passage describes regional examples involving figures
    called Death, the Old Woman, and Judas; burning, shooting, trial, dancing, leaping
    over fires, carrying May-trees, and using fragments, charred sticks, or ashes
    for crop, household, and weather protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage links bonfires kindled on the first Sunday in Lent with fires
    in which an effigy called Death is burned during the ceremony of carrying out
    Death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Spachendorf a straw-man dressed in a fur coat and fur cap is placed in
    a hole outside the village and burned on the morning of Rupert’s Day, identified
    parenthetically as possibly Shrove Tuesday.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the Spachendorf straw-man burns, people seek fragments of it and fasten
    them to branches of the highest tree in a garden or bury them in fields, believing
    this will improve crop growth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Frazer notes that even when a straw-man is not named Death, he considers the
    observance probably to have the same meaning, while also stating that the name
    Death may not express the ceremony’s original intention.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:5
  text: At Cobern lads make a straw-man on Shrove Tuesday, formally try it, accuse
    it of local thefts committed during the year, condemn it to death, lead it through
    the village, shoot it, and burn it on a pyre.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Cobern people dance around the blazing pyre, and the last bride must leap
    over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Oldenburg on Shrove Tuesday evening people set long straw bundles on fire,
    run around the fields waving them, shrieking and singing, and finally burn a straw-man
    on the field.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Düsseldorf district the Shrove Tuesday straw-man is made of an unthreshed
    sheaf of corn.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Zurich on the first Monday after the spring equinox, boys drag a straw-man
    on a small cart through the streets while girls carry a May-tree, and the straw-man
    is burned when vespers ring.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the Aachen district on Ash Wednesday a man is encased in peas-straw, taken
    to an appointed place, slips out of the straw casing, and the casing is burned
    while children think the man is being burned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Val di Ledro on the last day of Carnival a straw-and-brushwood figure
    called the Old Woman is made and burned in a ceremony called burning the Old Woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: On Easter Eve in Catholic countries, church lights are extinguished and a
    new fire is made, sometimes with flint and steel and sometimes with a burning-glass;
    the Easter candle is lit from this fire and used to rekindle the church lights.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In many parts of Germany an Easter bonfire is kindled near the church from
    the new fire, consecrated, and used to char sticks of oak, walnut, and beech that
    people take home.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: Some Easter bonfire sticks are burned at home in a newly kindled fire with
    a prayer for protection of the homestead from fire, lightning, and hail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Some charred Easter sticks are placed in fields, gardens, and meadows with
    a prayer against blight and hail; the passage says such fields and gardens are
    thought to thrive and avoid hail, pests, witch harm, and poor ears of corn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Charred sticks are applied to the plough, and ashes of the Easter bonfire
    mixed with ashes of consecrated palm-branches are mixed with seed at sowing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: A wooden figure called Judas is sometimes burned in the consecrated Easter
    bonfire.
  category: action
  evidence_refs:
  - ev:7
