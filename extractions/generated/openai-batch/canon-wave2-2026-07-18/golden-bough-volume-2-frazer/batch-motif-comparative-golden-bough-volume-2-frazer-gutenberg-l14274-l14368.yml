canonical_text:
  quote: ''
  summary: 'The passage consists of Frazer''s footnotes giving comparative examples:
    Costa Rican Indian concepts of ceremonial uncleanness called nya and bu-ku-rú,
    including purification of unused objects and houses by beating them; examples
    of three-day restrictions or confinement for Brahman and Balinese boys after rites;
    and a discussion of bone incidents in folktales alongside taboos and bone drinking
    tubes associated with girls'' puberty or menstrual seclusion.'
  language: English
  quote_policy: summarized
