canonical_text:
  quote: ''
  summary: Frazer presents Welsh and border-county sin-eating customs as examples
    of transferring evil or sin from a deceased person to another person through funerary
    food, drink, and payment. He then gives reported analogues from India and Turkistan
    in which paid or marked persons consume corpse-associated food or take on sins.
    The passage transitions to community-wide expulsion of evils, including direct
    clearance of invisible beings and indirect expulsion by a material vehicle or
    scapegoat, illustrated by a description of Guiana Indians and a peaiman clearing
    harmful spiritual beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Welsh sin-eating as an example of supposed transference
    of evil from one person to another.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hereford/Wales account, poor people were hired at funerals to take
    on the sins of the deceased, receiving bread, drink, and money over or near the
    corpse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hereford/Wales account says the sin-eater’s act freed the deceased from
    walking after death; North Wales is said to use milk instead of beer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Shropshire account, an old man sat facing the door, received money,
    bread, and ale, then pronounced rest for the departed soul and pledged his own
    soul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes doubt about Aubrey’s account while also reporting later
    claims of the practice near Llandebie.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Tanjore, bones of the deceased Rajah and two wives were ground, mixed with
    boiled rice, and eaten by twelve Brahmans who were paid; the sins were believed
    to pass into their bodies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Biláspúr and Chambá examples, Brahmans ate rice with milk or ghee from
    the hand of a dead royal person or corpse and were socially marked or treated
    as outcast afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Oude, after an infant was killed and buried in the birth room, a priest
    cooked and ate food there on the thirteenth day and was supposed to take the sin
    and cleanse the family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Utch Kurgan, an old man was said to live by taking on the sins of the dead
    and praying for their souls.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Frazer generalizes these cases as illustrating transference of ills to another
    person, animal, or thing, and then distinguishes individual rites from community-wide
    clearances of evil.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Guiana passage describes Indians as fearing numerous spiritual beings,
    using camp-fire or firebrand light, and employing a peaiman to clear such beings
    from a settlement for a time.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Frazer divides general clearances into direct expulsion of invisible evils
    and indirect expulsion through a material vehicle or scapegoat.
  category: sequence
  evidence_refs:
  - ev:8
