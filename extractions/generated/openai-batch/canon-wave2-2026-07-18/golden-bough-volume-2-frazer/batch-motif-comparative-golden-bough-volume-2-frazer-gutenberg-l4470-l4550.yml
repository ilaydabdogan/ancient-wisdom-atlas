candidate_motifs:
- id: motif:1
  label: Periodic expulsion of evils by scapegoat or material vehicle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage explicitly frames the examples as mediate expulsion of evils
    by a scapegoat or material vehicle that often recurs yearly, seasonally, biennially,
    or at New Year.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The exact term 'scapegoat' is used by the source, but the available taxonomy
    has no dedicated scapegoat category.
- id: motif:2
  label: Waterborne removal of sickness, sin, misfortune, or devils
  taxonomy_refs: []
  basis: Multiple examples send a prao, bark, model ship, pot, or boat away by sea
    or river while it bears diseases, sins, misfortunes, or devils.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The available motif taxonomy has no precise entry for waterborne expulsion;
    the water association is recorded under symbols rather than motif taxonomy.
- id: motif:3
  label: Animal scapegoat bearing communal or household misfortune
  taxonomy_refs:
  - sacrifice
  basis: Dogs and a goat are made bearers of disease, misfortune, death, cattle loss,
    or sins; several dogs are killed or burned after the transfer.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The Jewish goat is sent away rather than killed in this passage, so 'sacrifice'
    applies most clearly to the dog examples.
- id: motif:4
  label: Destruction of material representations to remove evils
  taxonomy_refs: []
  basis: A Chinese jar representing yearly ills is exploded, Old Calabar figures containing
    devils are burned and thrown into a river, and a Tibetan paper devil figure is
    burned.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The rites differ in materials and stated agents; the shared motif is functional
    rather than a detailed narrative identity.
- id: motif:5
  label: New Year ritual renewal with fire and sin transfer
  taxonomy_refs:
  - seasonal_cycle
  basis: The Iroquois example takes place during the New Year festival, extinguishes
    old fires, kindles a new fire, gathers sins, transfers them to white dogs, and
    burns the dogs.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The renewal interpretation is limited to the actions described; the passage
    does not elaborate a broader cosmology of renewal.
comparison_claims:
- id: claim:1
  claim: The Leti/Moa/Lakor, Biajas, Nicobar, and Sucla-Tirtha examples share the
    same function of dispatching sickness, sins, misfortunes, or devils away by a
    waterborne object.
  claim_level: same_function
  target: Waterborne expulsion rites using prao, bark, model ship, pot, or boat
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage groups the examples by function, but it does not claim
    historical contact or common inheritance.
- id: claim:2
  claim: The Chinese, Old Calabar, and Tibetan examples share the function of removing
    evils through destruction of a material representation by explosion, fire, or
    violent disposal.
  claim_level: same_function
  target: Destructive removal of represented evils or devils
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The represented forces differ: yearly ills and disasters in China,
    devils at Old Calabar and Tibet.'
- id: claim:3
  claim: The Western Himalayan, Breadalbane, Iroquois, and Jewish examples share the
    pattern of placing disease, misfortune, death, cattle loss, or sins onto an animal
    that is killed, driven out, burned, or sent away.
  claim_level: same_function
  target: Animal scapegoat pattern across dog and goat examples
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The animal species and final treatment differ, and the passage does
    not establish a historical relationship among these rites.
- id: claim:4
  claim: The whole passage presents these cases as instances of mediate expulsion
    of evils by a scapegoat or material vehicle, often recurring on a calendrical
    cycle.
  claim_level: same_motif
  target: Frazer's comparative category of periodic mediate expulsion of evils
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison made by the source passage; it should not be taken
    as evidence by itself for diffusion, contact, or common origin.
