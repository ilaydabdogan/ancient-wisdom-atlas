canonical_text:
  quote: ''
  summary: 'Frazer presents examples of periodic expulsion of evils by material vehicles
    or scapegoats: boats, pots, jars, effigies, dogs, and a goat are made to carry
    or embody sickness, sins, misfortune, devils, or yearly ills and are then sent
    away, exploded, burned, killed, or driven into wilderness or water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames mediate expulsion of evils by a scapegoat or material vehicle
    as a practice that tends to become periodic.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of Leti, Moa, and Lakor annually send diseases to sea in a small
    prao loaded with family deposits including food, a fowl, eggs, and field insects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Leti, Moa, and Lakor formula addresses the departing vessel and tells
    it to take sickness away to other islands and lands eastward.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Biajas of Borneo annually send a small bark to sea laden with the sins
    and misfortunes of the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Nicobar example, a model ship is carried through villages, devils are
    chased from huts and driven aboard it, and the ship is launched to sail away with
    the wind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Sucla-Tirtha, an earthen pot containing accumulated sins is set adrift
    on a river; an associated legend tells of a boat whose white sails turn black
    as a sign of forgiven sins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among aboriginal tribes of China, a yearly third-month festival includes burying
    and exploding an earthenware jar filled with gunpowder, stones, and bits of iron
    representing the past year's ills.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Old Calabar, stick and bamboo figures called nabikems are made to represent
    humans, birds, crocodiles, and other forms, and devils are expected to take up
    abode in them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the Old Calabar expulsion, people shout, fire shots, tear up the nabikems,
    burn them, and throw them into the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Teshu Lumbo on Tibetan New Year's Day, a paper figure of a man, identified
    to the witness as a figure of the devil, is burned over a fire with smoke and
    explosion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In a Western Himalayan example, a dog is intoxicated, fed sweetmeats, led
    around the village, released, chased, and killed with sticks and stones to prevent
    disease or misfortune for the year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Breadalbane on New Year's Day, a dog is given bread and driven out while
    a formula asks that human death or cattle loss for the household fall on the dog's
    head.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the Iroquois New Year festival, village fires are extinguished, ashes are
    scattered, and a new fire is kindled with flint and steel.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Iroquois rite, costumed men gather the people's sins, two decorated
    white dogs are strangled and hung, the people's sins are transferred to them,
    and the dogs are burned on a pyre.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: An Iroquois report states that ashes from the pyre on which a white dog was
    burned were carried through the village and sprinkled at every house door.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Jewish example states that sins of the people are laid on a goat's head
    and the goat is sent into the wilderness annually.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage notes that the Iroquois expulsion of evils had formerly been immediate
    rather than by scapegoat.
  category: relationship
  evidence_refs:
  - ev:9
