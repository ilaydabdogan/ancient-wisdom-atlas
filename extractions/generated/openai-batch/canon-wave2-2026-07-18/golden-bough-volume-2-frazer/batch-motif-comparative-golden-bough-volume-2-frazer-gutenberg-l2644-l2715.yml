canonical_text:
  quote: ''
  summary: The passage surveys reported hunting rites in which animal victims, especially
    bears, are apologized to, honored, fed, addressed, blamed on outsiders, or treated
    as guests after being killed and eaten. Examples are given from Kamtchatkans,
    Ostiaks, Koriaks, Finns, Lapps, American Indians, the Otawa Bear clan, and Nootka
    Indians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that hunters kill animals for food while trying to appease
    animal victims and their kin, excuse or conceal their role in the killing, and
    promise honorable treatment of remains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamtchatkans are described as making excuses to land or sea animals before
    killing them, asking that the animals not take offense, and offering cedar-nuts
    so that the animal would seem to be a guest at a feast rather than a victim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After killing and eating a bear, a Kamtchatkan host is described as bringing
    out the bear's head, wrapping it in grass, giving it trifles, blaming Russians
    for the death, and asking the bear to tell other bears of its good treatment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ostiaks are described as cutting off a killed bear's head, hanging it on a
    tree, gathering around it, paying it divine honors, and making speeches that blame
    Russians, Russian tools, and other nonlocal agents for the killing and butchering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Ostiaks perform these actions because they believe the slain
    bear's wandering ghost would attack them if not appeased.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: An alternate Ostiak treatment stuffs the slain bear's skin with hay, subjects
    it to mockery, spitting, and kicking, sets it on its hind legs, and then gives
    it veneration due to a guardian god.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Koriaks are described as skinning a killed bear or wolf, dressing one of their
    own people in the skin, dancing around the skin-clad person, and saying that someone
    else, generally a Russian, killed the animal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When killing a fox, Koriaks are described as skinning it, wrapping the body
    in grass, and telling it to inform its companions that it was hospitably received
    and given a new cloak.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Finns are described as trying to persuade a slain bear that it had fallen
    from a tree rather than been killed by them, while Lapps thank a killed bear and
    pray that it will not retaliate by storms or other means.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that reverence for bears killed and eaten by hunters is
    traced across the northern Old World and appears in similar forms in North America.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: American Indian bear hunters are described as preparing by fasts and purgations,
    offering expiatory sacrifices to souls of bears killed in previous hunts, and
    asking those souls to favor the hunters.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After killing a bear, an American Indian hunter is described as putting a
    pipe mouthpiece between the bear's lips, blowing smoke into its mouth, and asking
    the bear not to be angry or obstruct later hunting.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The American Indian bear carcass is described as roasted whole and completely
    eaten; the head is painted red and blue, hung on a post, addressed by orators,
    and praised.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Men of the Otawa Bear clan are described as making a feast of a killed bear's
    own flesh and addressing the bear with an explanation that hungry children wish
    to take it into their bodies.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Nootka Indians are described as seating a killed bear upright before the head
    chief, putting a chief's bonnet on its head, powdering its fur with white down,
    setting provisions before it, inviting it to eat, and then skinning, boiling,
    and eating it.
  category: sequence
  evidence_refs:
  - ev:12
