candidate_motifs:
- id: motif:1
  label: appeased animal victim after killing
  taxonomy_refs: []
  basis: Across the passage, killed animals are addressed, apologized to, thanked,
    fed, honored, or asked not to retaliate.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a descriptive comparative pattern in Frazer's account; the passage
    does not give indigenous motif terminology.
- id: motif:2
  label: animal victim treated as honored guest
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes cedar-nuts, trifles, provisions, invitations to eat,
    feasts, and language of hospitality directed to animals that are killed and eaten.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents hospitality and
    offerings but does not explicitly name a formal exchange doctrine.
- id: motif:3
  label: blame for sacred killing shifted to outsiders or accidental causes
  taxonomy_refs: []
  basis: Kamtchatkan, Ostiak, Koriak, and Finnish examples deny the hunters' responsibility
    by blaming Russians, Russian tools, someone else, or a fall from a tree.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports several cases but does not establish whether all are
    historically connected.
- id: motif:4
  label: veneration of animal remains as powerful presence
  taxonomy_refs: []
  basis: Bear heads are wrapped, hung, painted, praised, and honored; a stuffed bear
    skin is venerated as a guardian god.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage combines different communities and practices under a comparative
    frame.
- id: motif:5
  label: dead animal as messenger to its living species
  taxonomy_refs: []
  basis: A killed bear is asked to tell other bears of good treatment, and a killed
    fox is told to tell its companions of hospitality and a new cloak.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: Direct messenger language is explicit only in the Kamtchatkan bear and
    Koriak fox examples.
- id: motif:6
  label: expiatory sacrifice to souls of slain game
  taxonomy_refs:
  - sacrifice
  basis: American Indian hunters are described as offering expiatory sacrifices to
    souls of bears slain in previous hunts and asking those souls to favor the hunters.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This specific motif is supported by one portion of the passage.
- id: motif:7
  label: ritual incorporation of animal through complete eating
  taxonomy_refs: []
  basis: The North American examples include whole consumption of a bear carcass and
    Otawa speech describing children taking the bear into their bodies.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage gives limited explanation of the meaning of complete consumption
    beyond the quoted address.
comparison_claims:
- id: claim:1
  claim: The passage itself compares bear-reverence practices among hunters across
    the northern Old World with similar forms in North America.
  claim_level: same_function
  target: northern Old World and North American bear-hunt rites involving propitiation,
    honor, and post-kill address
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to Frazer's comparative framing in this passage;
    it does not establish historical contact, common inheritance, or identical ritual
    meanings.
- id: claim:2
  claim: The Kamtchatkan, Ostiak, Koriak, and Finnish examples share a recurring denial
    or displacement of responsibility for the animal's death.
  claim_level: same_motif
  target: blame-shifting or denial in reported northern Eurasian animal-killing rites
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples differ in details and the passage does not independently
    document the original ritual contexts.
