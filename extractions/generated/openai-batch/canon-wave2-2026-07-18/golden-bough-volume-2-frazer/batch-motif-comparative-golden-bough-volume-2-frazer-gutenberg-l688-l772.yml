canonical_text:
  quote: ''
  summary: The passage reports European harvest customs in which a Mare, Horse, Boar,
    Sow, or Pig is associated with the last sheaf, last standing corn, or last threshing
    stroke. It describes sending or attempting to pass the harvest animal to another
    farm, feeding the last sheaf to a young horse, naming the person who cuts or threshes
    last as having the Sow or Pig, and subjecting the bearer to mock pursuit, rough
    treatment, pig-calls, or festive food in pig form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A call-and-response formula names the farmer whose harvest is finished and
    asks where to send the Mare; the answer names a farmer whose harvest is not finished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The farmer who finishes harvest last is said to keep the Mare all winter,
    because he cannot send her on to anyone else.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Longnor, the head man of the first farmer to finish harvest was mounted
    on the team’s best horse, decorated with ribbons and streamers, and led by a boy
    to neighboring farmhouses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The decorated man who took the Mare could receive harvest-ale and rough good-humoured
    treatment, sometimes returning without decorations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near Lille, a tired harvester is said to have the fatigue of the Horse; the
    first sheaf is called the Cross of the Horse; reapers dance round the last blades;
    and the last-sheaf product is given to the youngest horse to eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the youngest horse of the parish represents the corn-spirit
    of the following year and absorbs the old Corn-horse by eating the last corn cut.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Berry, the harvesters’ noon sleep in the field is called seeing the Horse,
    and delayed permission to sleep may be met by neighing which the others imitate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage introduces the pig, boar, or sow as another animal embodiment
    connected with the corn-spirit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Thüringen, movement of young corn by wind can be described as the Boar
    rushing through the corn.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: On Oesel, the last sheaf is called the Rye-boar; the man who gets it is saluted
    as having the Rye-boar on his back and responds with a song praying for plenty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In several Swabian and Bavarian examples, the person who cuts the last stalk
    or gives the last threshing stroke is said to get or have the Sow or Pig and may
    be mocked, named, bound, or dragged.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Swabia, the person called Sow may try to pass on the designation by throwing
    a straw-rope into a house and saying that he brings the Sow; if caught, he may
    be beaten, shut in a pig-sty, and forced to take it back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Upper Bavaria, the man who gives the last threshing stroke must carry a
    Pig, described as either a straw pig effigy or a bundle of straw-ropes, to a neighboring
    farm where threshing is unfinished.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the Pig-bearer is caught, threshers may beat him, blacken or dirty his
    face, throw him into filth, bind the Sow on his back, or, if the bearer is a woman,
    cut off her hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the harvest meal, the man who carried the Pig may receive dumplings shaped
    as pigs, while others make pig-calling cries; in some cases he is carted round
    the village and thrown on a dunghill.
  category: sequence
  evidence_refs:
  - ev:9
