  summary: The passage consists chiefly of footnotes citing comparative examples.
    It describes several marriage customs in which newly married people or a bride
    are oriented toward, exposed to, or led to greet the rising sun, including an
    explicit belief that the sun’s rays can impregnate the bride. It also describes
    an agricultural remedy in which a menstruous woman walking around a field is believed
    to protect it from insects, with similar remedies noted in other traditions.
