canonical_text:
  quote: Dionysus—a tree-god—is sometimes represented in goat form
  summary: Frazer compares Dionysus, Greek Pans, Satyrs, Silenuses, Italian Fauns,
    Silvanus/Silvanuses, Russian Ljeschie, and corn-spirits as examples in an argument
    that goat-formed woodland spirits are widespread and that Dionysus's goat form
    belongs to his character as a tree-god rather than to a fusion of independent
    cults.
