canonical_text:
  quote: ''
  summary: Frazer argues that Greek scapegoat practices and Mexican rites involving
    human representatives of gods support his proposed interpretation of the priest
    of Nemi as a slain representative of a divine grove-spirit. The passage describes
    captives or selected young men treated as living images of deities, worshipped,
    honored, and eventually sacrificed, including the annual Tezcatlipoca victim whose
    heart is offered to the sun and whose successor is immediately appointed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says his interpretation of the Greek scapegoat removes a possible
    objection to the theory that the priest of Nemi was slain as a representative
    of the spirit of the grove.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that human beings periodically or occasionally slain by
    Asiatic Greeks were treated as embodiments of divinity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says the Athenians probably treated persons kept for sacrifice
    as divine, even though they were social outcasts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author states that, on the primitive view he describes, a divine mouthpiece
    or embodiment is not chosen because of moral qualities or social standing.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ancient Mexico is presented as offering close parallels to the rule of the
    Arician priesthood, especially in the custom of killing a human representative
    of a god.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Acosta's account, a captive was given the name of an idol, dressed with
    ornaments like the idol, and said to represent that idol for a period of time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the period of representation, people worshipped the captive, brought
    alms, and brought children and sick people so that he might cure and bless them;
    attendants kept him from fleeing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the feast, the represented captive was killed, opened, and eaten as a solemn
    sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the annual festival of Tezcatlipoca, an unblemished young man was chosen
    as the living image of Tezcatlipoca for a whole year, trained for the role, maintained
    in luxury, clothed under royal care, and attended by pages.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man who represented Tezcatlipoca carried flowers, played the flute,
    and was adored by people who knelt before him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Twenty days before the sacrifice, four delicately nurtured damsels bearing
    the names of four goddesses were given to the young man as brides; five days before
    the sacrifice, honors, banquets, and balls increased.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the last day, the young man was ferried across the lake in a covered barge
    to a small pyramid-shaped temple and broke one of his flutes at every step as
    he ascended the stairs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the summit, a priest cut open the young man's breast with a stone knife,
    removed his heart, and offered it to the sun; his head was hung among earlier
    victims' skulls, his limbs were prepared for the lords' table, and another young
    man immediately took his place.
  category: sequence
  evidence_refs:
  - ev:6
