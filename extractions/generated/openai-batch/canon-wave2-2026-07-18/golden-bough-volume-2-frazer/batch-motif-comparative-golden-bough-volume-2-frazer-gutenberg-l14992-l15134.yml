  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Albanian story is summarized in which a monster’s strength is contained
    in three pigeons, which are inside a hare, which is inside the silver tusk of
    a wild boar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Albanian story, killing the boar makes the monster feel ill, cutting
    open the hare leaves him barely able to stand, and killing the three pigeons makes
    him expire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note says that in both Greek and Italian stories, the quarrel between a
    nephew and uncles concerns the skin of a boar that the nephew gave to his lady-love
    and the uncles took from her.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note says that in an Arabian story the life of a witch is bound up with
    a phial, and that when the phial is broken, she dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note says that in an Arabian story the hero drinks the milk of an ogress’s
    breasts and is therefore regarded by her as her son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note says that in a Tartar poem a boy’s soul is shut up by his enemies in
