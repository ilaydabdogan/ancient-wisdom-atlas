canonical_text:
  quote: "“a total clearance of all the ills that have been infesting a people”"
  summary: Frazer summarizes public expulsions of accumulated evils, arguing that
    immediate and mediate expulsions have the same aim. He notes annual or seasonal
    timing, links many such rites with new-year beginnings, describes periods of social
    licence around the rite, and emphasizes divine men or animals used as scapegoats
    to receive transferred evils and be slain.
