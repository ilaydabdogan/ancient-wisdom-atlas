canonical_text:
  quote: ''
  summary: 'Frazer argues that traces of human sacrifice at Highland Beltane fires
    can be set beside ancient reports of Celtic sacrifices by fire. He summarizes
    accounts attributed to Caesar, Posidonius, Strabo, and Diodorus: among the Celts
    of Gaul, criminals and, if necessary, war captives were sacrificed to the gods
    at a five-year festival for the fertility of the land; Druids or priests killed
    victims by arrows, impalement, or burning them alive in large wicker, wood, and
    grass images filled with living humans and animals.'
  language: English
  quote_policy: summarized
