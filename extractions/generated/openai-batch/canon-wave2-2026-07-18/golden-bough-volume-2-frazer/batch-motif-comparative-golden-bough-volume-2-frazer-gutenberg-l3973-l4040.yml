canonical_text:
  quote: ''
  summary: Frazer describes several annual or seasonal ceremonies in West Africa,
    Abyssinia, and North-Eastern India in which communities expel devils or evil spirits,
    use fire or torchlight, make offerings and prayers for protection and crops, clean
    household vessels, and temporarily allow license, mockery, or social inversion
    during festivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people of Guinea are described as annually banishing the devil from all
    their towns with ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Axim, the expulsion is preceded by eight days of feasting and permitted
    lampooning of superiors and inferiors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the eighth day at Axim, participants hunt the devil with cries, chase him,
    and pelt him with sticks, stones, and other objects until he is driven out of
    town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Axim expulsion, women wash and scour wooden and earthen vessels
    to free them from uncleanness and the devil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Onitsha on New Year’s Day, every family brings a firebrand into the street,
    throws it away, and speaks a formula announcing the new year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports an interpretation by Mr. Taylor that the fire drives away
    the old year with its sorrows and evils and welcomes the new year.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the Abyssinian Mascal festival, people light bonfires, carry torches through
    the town, and poke light into dark corners of houses and outbuildings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Hos, the harvest-home festival occurs in January when granaries
    are full, and the ceremonies begin with sacrifice and offerings to the village
    god.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ho village priest prays for preservation from misfortune and sickness,
    seasonable rain, good crops, and in some places for souls of the dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the Ho festival, an evil spirit is supposed to infest the place, and men,
    women, and children process through the village with sticks, shouting and singing
    until they believe it has fled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the Ho expulsion procession, participants feast, drink rice-beer, and
    enter a period described as a saturnale with suspended duties and restraints.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Mundaris are said to keep a similar harvest-home festival in which farm
    labourers are feasted by masters and allowed unusual freedom of speech.
  category: relationship
  evidence_refs:
  - ev:8
