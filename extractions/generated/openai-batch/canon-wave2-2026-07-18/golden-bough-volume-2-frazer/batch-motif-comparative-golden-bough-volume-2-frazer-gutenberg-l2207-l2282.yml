canonical_text:
  quote: "“The ram, therefore, was killed, not as a sacrifice to Ammon, but as the
    god himself”"
  summary: Frazer argues that a Californian rite of killing a divine bird is based
    on identifying the life of an animal species with an individual animal life, compares
    this idea with Samoan family animal gods, and presents the Egyptian annual killing
    of the sacred ram of Ammon as a close ritual parallel. He further proposes that
    preserved animal skins could function as tokens containing divine life and could
    develop into annually renewed or permanent divine images.
  language: English
  quote_policy: quoted
