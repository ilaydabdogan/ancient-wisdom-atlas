  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Siam, signal gunfire moves from the palace through stations to the outer
    city gate, driving demons outward step by step.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the Siamese expulsion, a consecrated striped couch-grass rope is fastened
