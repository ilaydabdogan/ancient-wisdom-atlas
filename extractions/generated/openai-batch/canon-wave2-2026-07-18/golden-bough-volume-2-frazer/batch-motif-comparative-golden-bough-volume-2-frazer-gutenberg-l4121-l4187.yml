  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Punjaub formula asks dirt and wretchedness to depart and good fortune
    to come in.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tonquin rite is described as a general expulsion of malevolent spirits,
    commonly held once a year and especially during severe mortality among people
    or cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Tonquin account, malevolent spirits are identified with punished criminals
    or rebels who are believed to harm the land in revenge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the Tonquin expulsion, an intermediate month after the new year is
    marked by feasting, licence, closure of courts, and suspension of ordinary legal
    enforcement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the Tonquin ceremony, a general offers meat to the criminal devils and
    malevolent spirits before accusing and banishing them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Tonquin, guns, artillery, and muskets are fired so that the noise may drive
