canonical_text:
  quote: ''
  summary: The passage describes an Aino bear festival in which a young bear is captured,
    nursed and fed, honored as a higher being, ritually addressed with apologies and
    libations, danced around and lamented, killed before sacred wands, adorned and
    offered food and drink, consumed in parts by participants, and finally represented
    by its skull on a pole beside the sacred wands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young bear is caught near the end of winter, brought into the village, suckled
    at first by an Aino woman, later fed fish, and kept in a wooden cage until strong
    enough to threaten escape.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear is described as not being kept merely for food, but as regarded and
    honored as a fetish or higher being.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the festival, the Ainos apologize to their gods, saying they treated
    the bear kindly as long as possible but can no longer feed him and must kill him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The festival includes invited relations, friends, and in a small village nearly
    the whole community; in the described instance about thirty men, women, and children
    are present in their best dress.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The master of the house and the guests offer libations at the fireplace to
    the god of the fire, and then to the house-god in the sacred corner of the hut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The housewife who had nursed the bear sits apart, silent and sad, and repeatedly
    weeps as the festival progresses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women and girls dance around the bear’s cage, clap, sing, and some older women
    or nurses stretch their arms toward the bear and address it affectionately; the
    bear rushes in the cage and howls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Libations are offered to the inabos or sacred wands outside the hut; five
    new wands with bamboo leaves are set up for the festival, and the leaves are said
    to mean that the bear may come to life again.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bear is let out, roped, led near the hut, shot at by men with wooden-button-tipped
    arrows, gagged with a stick, and killed by nine men pressing his neck against
    a beam.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: While the men kill the bear, women and girls stand behind them, dance, lament,
    and beat the men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The carcass is placed before the sacred wands, furnished with sword and quiver,
    adorned as a she-bear with necklace and earrings, and offered millet-broth, millet-cakes,
    and sake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Men offer libations to the dead bear and drink; women and girls later put
    aside visible sorrow and dance merrily, while millet cakes are thrown from the
    roof for all to scramble after.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The bear is skinned and disembowelled; blood is caught in cups and swallowed
    by men, liver is eaten raw with salt, and flesh and vitals are kept for later
    division among those present.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the brain is extracted and eaten, the skull is hung on a pole beside
    the sacred wands with the gagging stick and, for a time, the sword and quiver;
    the company dances before the pole and ends with drinking.
  category: sequence
  evidence_refs:
  - ev:10
