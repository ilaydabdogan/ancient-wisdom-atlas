canonical_text:
  quote: ''
  summary: The passage describes Scottish Highland Beltane bonfires on May Day, including
    need-fire preparation, communal feasting, a blackened cake lot that selects a
    mock sacrificial victim, and offerings for livestock protection. It also describes
    a second Beltane account involving libations and cake offerings to protective
    beings and harmful animals, then compares or juxtaposes similar fire customs in
    Germany and Sweden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the central Highlands of Scotland, Beltane fires were formerly kindled
    on May 1 on hills or knolls near pasturing cattle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants cut a round trench in the turf, left a central platform for the
    company, and placed fuel in the middle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The account says all fires in the country were extinguished the night before
    and a sacred need-fire was made the next morning by friction using wood implements.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some versions required groups of three-times-three or three-times-nine persons
    to turn the wimble or axle-tree; certain serious crimes among them were believed
    to prevent the fire or remove its virtue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The need-fire was credited with protection against witchcraft, disease in
    humans and cattle, and poisons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: After lighting the fire, the company ate a custard of eggs and milk, sang
    and danced around the fire, and divided an oatmeal cake into portions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One portion of the cake was blackened with charcoal, all portions were put
    into a bonnet, and blindfolded participants drew portions by lot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The person who drew the blackened portion was identified as the devoted person
    to be sacrificed to Baal for a productive year for humans and animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The selected person was called cailleach bealtine, was subjected to a show
    of being put into the fire or quartered, was rescued, pelted with eggshells, spoken
    of as dead, and had to leap three times through the flames.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A second account describes herdsmen holding Beltien as a rural sacrifice,
    preparing a fire and caudle of eggs, butter, oatmeal, and milk, and spilling some
    caudle on the ground as a libation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the second account, each participant had an oatmeal cake with nine square
    knobs dedicated either to preservers of flocks and herds or to animals that destroyed
    them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Participants faced the fire, broke off knobs, flung them over the shoulder,
    and addressed recipients with requests to preserve horses or sheep, or to spare
    lambs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says some German mountains are named from Easter fires kindled
    on them, just as Highland eminences are named from fires.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:14
  text: In Sweden, May festival bonfires were lit on hills and knolls by striking
    flints; young people danced in a ring around the fires, and older people observed
    whether flames leaned north or south as a sign of the spring weather.
  category: sequence
  evidence_refs:
  - ev:6
