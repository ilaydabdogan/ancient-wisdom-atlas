  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: In the Isle of Man custom, servants or boys hunt and kill a wren, fasten it
    to a pole, carry it in procession from house to house while chanting, collect
    money, lay the wren on a bier, sing dirges, bury it, and dance after the burial.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A later Isle of Man variant places the wren in crossed decorated hoops, exchanges
    wren feathers for coins, buries the bird on the seashore or waste ground, and
    preserves the feathers as protection from shipwreck for a year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In parts of Ireland, boys hunt and kill the wren on Christmas Day or St. Stephen's
    Day, fasten it in holly and ivy on a broomstick, go house to house singing, receive
