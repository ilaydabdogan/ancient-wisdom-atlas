  summary: The passage describes an Indian dough-snake burial and offerings at its
    grave, Snake tribe practices concerning snakes, and Frazer's comparison with European
    wren customs, including beliefs that the wren is royal or unlucky to harm, annual
    hunting and killing of the wren, house-to-house processions, burial, exchange
    of feathers, feasting, and regional variants in the Isle of Man, Ireland, Essex,
    and Pembrokeshire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After every house has been visited, a dough snake is buried and a small grave
    is erected over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During nine days of September, women worship at the snake grave, offer curds
    while kneeling and touching the earth with their foreheads, and then distribute
    the remaining curds among children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the dough snake is a substitute for a real snake,
    noting that where snakes abound worship is offered in jungles where snakes are
    known to be rather than at the dough-snake grave.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Members of the Snake tribe worship in the same way every morning after a new
    moon, do not kill snakes, say snakebite does not hurt them, and give a dead snake
    clothes and a regular funeral.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that ceremonies closely analogous to Indian snake worship
    survived in Europe and identifies the hunting of the wren as the best-known example.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wren is described as designated king, little king, king of birds, hedge
