canonical_text:
  quote: "“by eating the flesh of an animal or man he acquires not only the physical,
    but even the moral and intellectual qualities”"
  summary: Frazer summarizes a comparative pattern in which agricultural peoples are
    said to kill a corn-spirit or plant-spirit represented in human or animal form
    and to eat the god sacramentally. He then gives many examples of peoples who are
    reported to eat or avoid animals, body parts, or substances because they believe
    qualities such as courage, strength, agility, speech, longevity, or soul-power
    pass to the consumer.
  language: English
  quote_policy: quoted
