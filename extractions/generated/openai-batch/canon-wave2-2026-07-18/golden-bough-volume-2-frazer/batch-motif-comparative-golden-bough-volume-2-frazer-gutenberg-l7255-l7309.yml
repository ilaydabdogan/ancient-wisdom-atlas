canonical_text:
  quote: ''
  summary: Frazer recounts a Nias story in which a captured chief cannot be killed
    by water, fire, or steel until his wife reveals that his life is bound to a hard
    hair on his head; when the hair is removed, his spirit departs. Frazer then treats
    external soul beliefs in folk-custom, citing examples of souls kept in a bag during
    house entry, in iron during childbirth, and in hair as a source of strength or
    life across several reported traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief from Nias is captured by enemies who fail to kill him by drowning,
    burning, or piercing with steel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief’s wife reveals that a hair on his head is as hard as copper wire
    and that his life is bound up with it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the hair is plucked out, the chief’s spirit flees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Frazer states that the idea of a soul deposited outside the body, or in the
    hair, occurs in popular tales of many races and is connected with customs.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Frazer summarizes a tale pattern in which a hero removes his soul from his
    body before battle so that his body may be invulnerable and immortal in combat.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Minahassa of Celebes, when a family moves into a new house, a priest
    collects the family members’ souls in a bag and later restores them because entering
    a new house is considered supernaturally dangerous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Southern Celebes, during childbirth, a messenger brings a piece of iron
    to the doctor, who keeps it until the confinement ends; the iron represents the
    woman’s soul and must not be lost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Frazer states that in folk-tales a man’s soul or strength is sometimes bound
    up with his hair, so that cutting the hair causes death or weakness.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The natives of Amboina are reported to have thought their strength was in
    their hair and would leave them if it was shorn.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Amboina court cases described by Frazer, prisoners who withstood torture
    confessed when their hair was cut or when shears were produced to cut it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Ceram, young people are reported to be believed weakened and enervated
    if their hair is cut.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Zacynthus, people are reported to think that ancient Greek strength resided
    in three hairs on the breast and returned if the hairs grew back.
  category: other
  evidence_refs:
  - ev:5
