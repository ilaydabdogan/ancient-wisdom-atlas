canonical_text:
  quote: ''
  summary: Frazer compares hunting customs in which killed or trapped animals are
    addressed respectfully, apologized to, honored with rites, protected from contemptuous
    treatment, or offered gifts. Examples include elephants, lions, leopards, tapirs,
    sables, beavers, bears, buffalo, and other animal beings whose souls or guardian
    spirits are believed to affect future hunting success or revenge mistreatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kafir hunters address an elephant deferentially while spearing it, apologize
    after its death as if the death were accidental, and bury its trunk with solemn
    ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some Eastern African tribes, a killed lion is brought before a king, who
    prostrates himself and rubs his face on the lion's muzzle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In parts of Western Africa, a leopard killer is bound and brought before chiefs;
    after his defense, the dead leopard is adorned with a chief's bonnet and honored
    with nightly dances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Guiana Indians destroy the babracot used to dry tapir meat before leaving
    camp because they fear a tapir may later find evidence of the slaughter and take
    revenge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Stiens of Cambodia are described as believing that animals have souls
    that roam after death; they beg a killed animal's pardon and offer sacrifices
    proportioned to the animal's size and strength.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: North American Indians are described as treating the bear, buffalo, and beaver
    as manidos that provide food, conducting ceremonies for the bear and honoring
    its head and paws, while treating less dangerous or less useful animals with contempt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Siberian sable-hunters keep a caught sable from public view and avoid speaking
    good or evil of it, believing that sables can hear such speech and be offended
    by human behavior.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Alaskan hunters preserve sable and beaver bones away from dogs for a year
    and then bury them carefully to avoid offending the spirits who look after those
    animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Canadian Indians collect and protect beaver bones from dogs and dispose of
    them in the river or fire, explaining that the beaver's soul observes the treatment
    of its bones and that other beavers respond accordingly.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before hunting beaver, Canadian Indians offer a solemn prayer and tobacco
    to the Great Beaver; after the hunt, an orator gives a funeral oration over the
    dead beavers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'The passage explicitly states a comparative distinction: animals that are
    feared, edible, or both are treated with ceremonial respect, while animals that
    are neither formidable nor good to eat are despised.'
  category: other
  evidence_refs:
  - ev:6
  - ev:11
