- id: claim:4
  claim: Frazer explicitly compares treatment of animals according to danger and food
    value, presenting fear and usefulness as reasons for ceremonial respect.
  claim_level: same_function
  target: Comparative criterion for respect toward hunted animals
  evidence_refs:
