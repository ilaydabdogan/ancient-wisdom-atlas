candidate_motifs:
- id: motif:1
  label: Apology or respectful address to killed animal
  taxonomy_refs: []
  basis: The passage gives examples of hunters addressing an elephant with honorific
    pleas, apologizing after its death, Stiens begging pardon from killed animals,
    and Canadians giving a formal speech over dead beavers.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage reports these practices through Frazer's comparative summary;
    local meanings may differ among the groups named.
- id: motif:2
  label: Hunted animal treated as chief, lord, peer, or divinity
  taxonomy_refs: []
  basis: The elephant is called a great lord, the leopard is treated as a peer and
    chief of the forest, bear/buffalo/beaver are called manidos, and the Great Beaver
    receives prayer and tobacco.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:10
  confidence: high
  cautions: The terms are presented in English translation or paraphrase within a
    comparative account.
- id: motif:3
  label: Proper treatment of animal remains preserves future hunting success
  taxonomy_refs:
  - sacred_exchange
  basis: Sable and beaver bones are protected from dogs, buried, or placed in river
    or fire so guardian spirits or animal souls do not feel contempt and cause future
    hunting failure.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is broad; the passage frames the practice as respect
    preventing loss of game rather than a formal exchange system in every example.
- id: motif:4
  label: Animal soul or guardian retaliates against disrespect
  taxonomy_refs: []
  basis: Tapir revenge, Stien animal souls that may torment killers, sables that hear
    and resent human behavior, and beaver souls that report bone treatment all present
    animals or their spirits as responsive to human conduct.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: 'The retaliatory mechanism varies: revenge, torment, refusal to be caught,
    or guardian spirits withholding game.'
- id: motif:5
  label: Offerings or sacrifices to animal beings connected with the hunt
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The Stiens offer sacrifices to killed animals, and Canadian Indians offer
    prayer and tobacco to the Great Beaver before hunting beaver.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: Only some examples in the passage include explicit offerings or sacrifices.
- id: motif:6
  label: Funeral or honor rites for animal prey
  taxonomy_refs: []
  basis: The passage describes solemn burial of the elephant trunk, royal homage to
    a lion, dances for a dead leopard, elaborate elephant death ceremonies among the
    Stiens, and a funeral oration over dead beavers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:10
  confidence: high
  cautions: The rites differ substantially in form and social setting.
- id: motif:7
  label: Ritual distinction between valuable or feared animals and contemptible animals
  taxonomy_refs: []
  basis: The passage explicitly contrasts animals that are feared, edible, or both
    with those described as neither formidable nor good to eat, and states that the
    former receive ceremonial respect while the latter are despised.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: high
  cautions: This is Frazer's comparative interpretation of the examples rather than
    a single local mythic statement.
comparison_claims:
- id: claim:1
  claim: 'Across the cited hunting examples, apologies, offerings, homage, concealment,
    and bone care serve a similar function: preventing animal or spirit offense and
    sustaining future hunting success or safety.'
  claim_level: same_function
  target: Animal propitiation in hunting rites across the examples in the passage
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage compares many geographically distinct practices but does
    not establish historical contact or common origin.
- id: claim:2
  claim: Several examples share a motif of hunted animals being elevated to social
    or sacred ranks such as lord, chief, peer, manido, or Great Beaver.
  claim_level: same_motif
  target: Animal-as-chief or animal-as-divinity pattern in hunting contexts
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: Honorific titles and divine labels may not be equivalent across languages
    and traditions; the claim is limited to the passage's reported parallels.
- id: claim:3
  claim: The passage links ritual handling of animal remains with respect toward the
    animal or its spirit in multiple cases, including elephant trunk burial, bear
    head and paw homage, and sable or beaver bone care.
  claim_level: same_function
  target: Respectful ritual treatment of animal body parts after the kill
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The specific body parts, disposal methods, and stated reasons vary
