canonical_text:
  quote: ''
  summary: The passage describes several southern French wren-hunting customs around
    December, Christmas, New Year, and Twelfth Day, including the proclamation of
    a temporary King, processions with a wren on a pole, priestly blessing or release
    of the bird, weighing the bird, and feasting. It then presents the author's comparison
    of these rites with bear, snake, hide, feather, human-victim relic, and deity-communion
    patterns, followed by a Highland and St. Kilda New Year hide ceremony involving
    sunwise running, beating a hide, house blessings, burning hide pieces, and applying
    them to people and domestic animals for protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Carcassonne, young people of the street Saint Jean annually went outside
    the town on the first Sunday of December with sticks and beat bushes while looking
    for wrens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Carcassonne custom, the first person to strike down a wren was proclaimed
    King.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Carcassonne King returned in procession carrying the wren on a pole; later
    processions included torches, music, a chalk inscription at houses, royal clothing,
    a sceptre, a wreath-decorated pole, mass, visits to officials, money collection,
    and a banquet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Entraigues, men and boys hunted the wren on Christmas Eve; when they caught
    one alive, they presented it to the priest, who freed it in the church after midnight
    mass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Mirabeau, the priest blessed the bird, and women could mock, insult, and
    blacken men's faces with mud and soot if women caught a wren while men failed
    to do so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At La Ciotat, armed men hunted the wren near the end of December; after a
    wren was caught, it was hung on a pole, paraded around the town, weighed in scales,
    and followed by merrymaking at table.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the wren-hunting custom closely parallels a Gilyak
    bear procession and an Indian snake procession and belongs with them to the same
    circle of ideas.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author formulates a pattern in which a worshipful animal is killed annually
    with solemnity and is promenaded door to door before or after death so worshippers
    may receive divine virtues from the dead or dying god.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Highland and St. Kilda custom on the evening before New Year's Day,
    a cowherd and young people met, one person was covered with a cow's hide, and
    others carried staves with raw hide tied to the ends.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hide-covered person ran three times sunwise around the dwelling-house
    while the others pursued and beat the hide with their staves while crying out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Highland and St. Kilda group went to each dwelling-house door, recited
    verses, and pronounced a blessing on the house, family property, cattle, food,
    clothing, and health.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: At each house, participants burned a small piece of hide in the fire and applied
    it to the nose of each person and domestic animal, which was believed to protect
    them from disease and misfortune during the coming year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage adds that the burned hide pieces were identified by another authority
    as breast pieces of sheep-skin, and compares them with Isle of Man wren feathers
    and relics of a Khond human victim.
  category: object
  evidence_refs:
  - ev:7
