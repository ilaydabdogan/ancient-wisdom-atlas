canonical_text:
  quote: ''
  summary: Frazer argues that the priest called the King of the Wood personified the
    oak or the tree bearing the Golden Bough, that his life was bound to the mistletoe,
    and that his killing may once have involved breaking the bough and burning him
    in a midsummer oak fire. The passage then explains the name Golden Bough by comparison
    with Welsh mistletoe names and with European fern-seed folklore, where a golden
    or fiery seed appears at solstitial times, reveals treasure, brings wealth, and
    in one German tale derives from the blood of the sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the priest of the Arician grove, the King of the Wood,
    personified the tree on which the Golden Bough grew; if the tree was an oak, he
    personified an oak-spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the King of the Wood's life or death with the mistletoe
    on the oak and says that he could not die while the mistletoe remained intact.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that slaying the King of the Wood required breaking the mistletoe
    and probably throwing it at him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage proposes that the King of the Wood was formerly burned, dead or
    alive, at an annual midsummer fire festival in the Arician grove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes a perpetual fire in the grove, probably fed with sacred
    oak-wood, and says the King of the Wood formerly met his end in a great oak fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says a later rule allowed the King of the Wood to live as long
    as he could prove his divine right by physical force, so that he escaped fire
    only to fall by the sword.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage compares the supposed annual fiery tragedy at Nemi with rites
    among the Celts of Gaul and possibly among northern Aryans in Norway, and connects
    it with primitive Aryan oak worship.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says mistletoe was called the Golden Bough and notes that Welsh
    also knew mistletoe as the tree of pure gold; Virgil is cited as describing the
    bough as golden in stem and leaves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes mythical fern-seed or fern-bloom as blooming like gold
    or fire on Midsummer Eve or St. John's Day.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says that possessing fern-seed, or ascending a mountain with it
    on Midsummer Eve, reveals gold or earth-treasures; placing it among money prevents
    the money from decreasing, and catching it at Christmas brings riches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage argues that fern-seed's fiery aspect is primary, that its golden
    aspect is secondary, and that fern-seed is an emanation of the sun's fire at the
    summer and winter solstices.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the German story summarized by the passage, a hunter shoots at the sun
    on Midsummer Day at noon, catches three falling drops of blood in a white cloth,
    and these blood-drops are fern-seed.
  category: action
  evidence_refs:
  - ev:7
