canonical_text:
  quote: ''
  summary: Frazer argues that mistletoe, identified with the Golden Bough, is gathered
    at solstitial times and associated with treasure-divination, oak trees, fire-making,
    and the renewal of the sun. He links Midsummer beliefs about an oak bloom and
    the oil of St. John with mistletoe, then compares Virbius, Balder, Zeus/Jove,
    oak worship, sacred fire, and the King of the Wood at Nemi as parts of a reconstructed
    primitive Aryan oak religion.
  language: English
  quote_policy: summarized
