canonical_text:
  quote: '"the public expulsion of evils at the New Year would be preceded by a period
    of general licence"'
  summary: The passage is a cluster of notes and footnotes. It proposes an analogy
    between Roman New Year expulsion rites, Saturnalian licence, and Matronalia slave-feasting;
    cites evidence for Athenian pharmakoi led out as civic purifications and connected
    with a mythical stoning; notes a Yucatan sacrifice involving genital blood smeared
    on an idol; gives a parallel of healing by striking sick people with a hammer;
    and cites Mexican cases of people representing deities and being slain in that
    character.
  language: English with some Greek and Latin citations
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage proposes that, by analogy, the Roman Saturnalia may once have
    been celebrated in February when the Roman year began in March.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that at Rome, as in many places, a public New Year expulsion
    of evils would be preceded by a period of general licence such as the Saturnalia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the Matronalia on 1 March as a possible trace of an
    earlier Saturnalian timing because mistresses feasted their slaves, as masters
    did at Saturnalia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Harpocration is cited as saying that two men were led out at Athens during
    the Thargelia as purifications for the city, one on behalf of men and one on behalf
    of women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Harpocration did not expressly state that the Thargelia victims
    were put to death, but the author infers stoning because the ceremony imitated
    the execution of a mythical Pharmacus who was stoned to death.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a cited Yucatan sacrifice, blood was drawn from the genitals of a human
    victim and smeared on the face of an idol.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage asks whether the Yucatan rite may originally have intended to
    transfuse reproductive energy into the god.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A cited parallel describes a woman going from house to house, striking sick
    people with a hammer and bidding them be whole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage cites other Mexican instances of persons representing deities
    and being slain in that character.
  category: relationship
  evidence_refs:
