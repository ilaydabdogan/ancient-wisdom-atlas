- id: motif:3
  label: secret of invulnerability revealed or obtained
  taxonomy_refs: []
  basis: 'Several tales depend on learning where a being’s life is kept: an ogress
    reveals objects to the lad, a prince learns the pillar secret, an ogress tells
    the princess the two-bee secret, and Rama’s ally knows Ravana’s secret.'
