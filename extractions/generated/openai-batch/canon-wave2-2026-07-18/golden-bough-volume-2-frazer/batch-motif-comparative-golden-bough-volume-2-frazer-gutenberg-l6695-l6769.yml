comparison_claims:
- id: claim:1
  claim: The Cashmeer and Bengalee examples share the same functional pattern in which
    a hostile being’s life is concentrated in a separate object or animal and destroying
    that locus kills the being or group.
  claim_level: same_function
  target: Cashmeer and Bengalee external-life tales in this passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes rather than provides full tale texts, and each
    variant uses different life-holders.
- id: claim:2
  claim: The Siamese or Cambodian Ravana story is explicitly described in the passage
    as probably derived from India.
  claim_level: historical_contact
  target: Indian narrative tradition associated with Rama and Ravana
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests only on the passage’s wording 'probably derived from
    India' and gives no independent transmission evidence.
- id: claim:3
  claim: The Bengalee prince’s tree and the Indian prince’s barley plant share the
    function of a plant left behind as an index of an absent traveler’s condition.
  claim_level: same_function
  target: life-plant indicator pattern in Bengalee and Indian tales
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: Only the tree is directly called the prince’s life; the barley plant
    is described as indicating well-being, danger, or death.
- id: claim:4
  claim: The Gilgit fairy king’s soul in the snows resembles the broader external-life
    pattern in the passage, though the example is much briefer than the others.
  claim_level: same_motif
