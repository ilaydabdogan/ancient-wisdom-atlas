canonical_text:
  quote: ''
  summary: Frazer summarizes several Cashmeer, Bengalee, Siamese or Cambodian, Indian,
    and Gilgit tales in which the life or soul of ogres, kings, princes, or a fairy
    king is located in external animals, objects, plants, snow, or a box. Destruction,
    damage, or control of the external locus causes death, invulnerability, or indicates
    the person’s condition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cashmeer lad pretends to be the grandson of an old ogress, and she shows
    him seven cocks, a spinning-wheel, a pigeon, and a starling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old ogress says the birds and spinning-wheel contain the lives of specific
    ogres or ogresses; the lad kills the birds, smashes the spinning-wheel, and the
    ogres and ogresses perish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In another Cashmeer story, an ogre cannot die unless a particular palace verandah
    pillar is broken; a prince breaks it, and the ogre dies when the pillar falls.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another Cashmeer tale, an ogre’s life dwells in a queen bee located in
    a honeycomb on a tree; the hero crushes the queen bee, and the ogre dies immediately.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In some Bengalee tales, the life of a tribe of ogres is concentrated in two
    bees on a crystal pillar in deep water.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bengalee ogress says that if the bees are destroyed without any blood
    falling, the ogres will die, but if blood falls, a thousand ogres will arise from
    it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The captive princess reveals the two-bee secret to the hero, who kills the
    bees; all the ogres die at that same moment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In another Bengalee story, all ogres live in Ceylon and all their lives are
    in a single lemon; a boy cuts the lemon in pieces, and all the ogres die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a Siamese or Cambodian story, Thossakan or Ravana removes his soul from
    his body by magic and leaves it in a box, making him invulnerable in battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ravana deposits the soul-box with the hermit Fire-eye before fighting Rama.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: One of Rama’s allies transforms into Ravana’s likeness, obtains the soul-box
    from Fire-eye, flies to Rama, and squeezes the box until Ravana dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a Bengalee story, a prince plants a tree in his father’s courtyard and
    tells his parents that the tree’s freshness, partial fading, or complete fading
    will indicate his well-being, danger, or death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In another Indian tale, a travelling prince leaves a barley plant to be watched;
    when the prince is beheaded, the plant snaps and its ear falls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the legend of the origin of Gilgit, a fairy king’s soul is in the snows
    and he can perish only by fire.
  category: relationship
  evidence_refs:
  - ev:9
