canonical_text:
  quote: ''
  summary: Frazer distinguishes expulsions in which evils are embodied or loaded onto
    a material vehicle, then gives examples from Pomo, Mandan, Cambodian, Kasya, Andalusian,
    and Ceram practices involving disguised demon figures, chases, barriers, contests,
    and a disease-laden boat sent away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes a class of expulsions in which evil influences are
    embodied visibly or loaded onto a material medium that carries them away from
    a people, village, or town.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pomo example describes disguised men representing devils, entering from
    the mountains with flaming pitch vessels on their heads and being driven back
    into the mountains after a staged struggle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mandan example describes a black-painted man representing the devil, entering
    from the prairie, frightening women, taking part in a buffalo dance, and being
    chased from the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Cambodian palace example describes men painted as fiends being chased
    by elephants in the palace courts, after which a consecrated cotton thread is
    stretched around the palace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kasya example describes an annual demon-expulsion ceremony involving two
    bands of men tugging a rope across a stream, with one side probably representing
    demons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Carmona example describes boys disguised with glue and feathers running
    from house to house while people avoid them and bar their houses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that demons may also be understood as invisibly present
    in a material visible vehicle that conveys them away, with a ship or boat named
    as a common vehicle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Ceram example describes a small ship filled with rice, tobacco, eggs,
    and other contributed items, addressed to sicknesses as provisions for their departure,
    and set adrift from the shore.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
