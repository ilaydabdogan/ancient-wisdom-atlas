canonical_text:
  quote: what is sacred is dangerous
  summary: The passage argues that contact with sacred things is often treated as
    dangerous and removable by washing or other rites. It gives examples involving
    pigs, scriptures, priestly and Greek sacrificial washing, Tongan contact with
    sacred chiefs, and several clan or divine-animal taboos in which seeing, touching,
    smelling, catching, or using sacred animals or associated leaves is believed to
    cause illness, impurity, or death.
  language: English
  quote_policy: quoted
