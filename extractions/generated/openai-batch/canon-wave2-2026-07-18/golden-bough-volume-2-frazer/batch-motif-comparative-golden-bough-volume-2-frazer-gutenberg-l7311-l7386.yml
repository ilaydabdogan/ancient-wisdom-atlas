canonical_text:
  quote: "“The life of the man is bound up with the life of his tamaniu.”"
  summary: Frazer surveys beliefs and customs in which a person’s life, prosperity,
    sickness, or death is sympathetically linked with a plant, tree, animal, stone,
    knife, column, or other object. Many examples concern birth trees or objects associated
    with the navel-string; other examples concern a cure through a cleft tree, Byron’s
    oak, Simeon’s life linked to a column, and the Banks Islands tamaniu.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that folk-tales sometimes bind a person's life to a plant,
    so that the plant's withering and the person's death are linked in sequence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the M’Bengas, two trees of the same kind are planted for two children
    born on the same day, people dance around the trees, and each child's life is
    believed to be bound to one tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The M’Bengas example states that if the child's tree dies or is thrown down,
    the child is expected soon to die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that in the Cameroons a person's life is believed to be sympathetically
    bound to a tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Papuans unite a newborn child's life with a tree by driving a pebble
    into the bark; if the tree is cut down, the child is expected to die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Maoris are described as burying a child's navel-string in a sacred place
    and planting a sapling over it; the sapling's condition is read as a sign of the
    child's life and prospects.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Southern Celebes and Bali, a coconut or cocoa-palm is planted at a child's
    birth and is described as the child's contemporary or life-plant.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The Dyaks of Borneo are described as planting a palm-tree that serves as
    an index of fate: flourishing indicates good fortune, while withering or death
    indicates misfortune.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists European birth-tree customs in which a tree is planted at
    a child's birth, tended with care, and believed to grow, flourish, or dwindle
    with the child.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In England, persons are described as being passed through a cleft tree as
    a cure for rupture, after which a sympathetic connection is believed to exist
    between patient and tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The English cleft-tree example says that the patient's life depends on the
    tree and that cutting the tree down causes the rupture to return and mortification
    to follow.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Lord Byron is described as planting a young oak at Newstead and holding the
    idea that he would flourish as the oak flourished.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage generalizes that a person's life may be united by physical sympathy
    with an animal or thing, so that the death or destruction of the animal or thing
    is followed by the person's death.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Romanus Lecapenus is said to have removed the capital of a column after an
    astronomer told him Simeon's life was bound to it; Simeon is then reported to
    have died at the same hour.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Among the Karens of Burma, the knife used to cut a child's navel-string is
    preserved because the child's life is said to be connected with it.
  category: object
  evidence_refs:
  - ev:13
- id: obs:16
  text: The Malays are described as believing that a person's soul or fate may become
    mysteriously related to another person or animal.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:17
  text: In the Banks Islands, some people connect themselves with a tamaniu, usually
    an animal such as a lizard or snake, or a stone; the tamaniu is watched and consulted
    during sickness.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:18
  text: The Banks Islands example states that if the tamaniu dies, is broken, or is
    lost, the connected man will die.
  category: relationship
  evidence_refs:
  - ev:15
