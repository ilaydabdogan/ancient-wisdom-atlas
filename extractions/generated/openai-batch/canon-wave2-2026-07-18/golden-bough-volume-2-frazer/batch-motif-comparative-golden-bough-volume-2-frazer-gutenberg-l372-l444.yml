canonical_text:
  quote: ''
  summary: Frazer surveys European harvest customs in which the corn-spirit is identified
    with a goat, appears in standing grain, affects lagging harvesters, is attached
    to the last sheaf or last cutter, and may be represented by sheaves, horns, wooden
    or straw goat figures, processions, and the passing of a sheaf called the Cripple
    Goat from farm to farm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the corn-spirit often appears in the form of a goat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Prussian examples, movements in grain are described with goat sayings,
    and the presence of goat-named beings in fields is used to warn children away
    from crops and pods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sick or lagging harvester may be described as having been pushed by the
    Harvest-goat or Corn-goat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Oefoten, Norway, a harvester who has not finished after neighboring harvesters
    is said to remain on an island, and goat calls are imitated according to the harvester's
    sex.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In several local examples, the person who cuts or binds the last corn or sheaf
    is associated with the Corn-goat, Wheat-goat, Oats-goat, Harvest-goat, Rye-goat,
    or Goat.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:6
  text: The last heap, last sheaf, or last handful of corn may be called or fashioned
    as a goat, including the addition of horns or the statement that the Goat is sitting
    in the sheaf.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: At Gablingen, a carved wooden goat decorated with oats, garlands, and flowers
    is set in the field and assigned to the last reaper to finish.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: In some harvest customs, the last binder or cutter is dressed, crowned, led,
    transported, drenched, or otherwise publicly marked as the Goat or Corn-goat.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage presents one view in which the goat-form corn-spirit lives in
    the farmhouse or barn over winter, and another view in which it moves from a cut
    farm to another farm where corn is still standing.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a Skye custom, a sheaf called the Cripple Goat is passed from the first
    farmer to finish reaping to neighboring farmers still reaping, continuing until
    all the corn is cut.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage explains the lameness of the Cripple Goat as probably due to the
    corn-spirit being crippled by cutting the corn, and compares this with a last-sheaf
    bearer who must limp.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: In the Böhmer Wald mountains, peasants race while driving corn home, and village
    boys erect a colossal straw Oats-goat on the roof of the loser.
  category: action
  evidence_refs:
  - ev:12
