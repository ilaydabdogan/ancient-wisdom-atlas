canonical_text:
  quote: ''
  summary: The passage describes Mexican ritual seed-paste images representing cloud-capped
    mountains that are worshipped, ritually cut open, and eaten; then discusses Roman
    human-shaped loaves called maniae, Compitalia effigies dedicated to Mania, and
    Frazer's proposed comparison between Arician sacramental loaves and Mexican divine
    images. It also gives examples from Borneo, Celebes, and Burma of effigies or
    dummies used to deceive ghosts or demons and protect living or sick persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mexican festival participants made small human-shaped images from seed paste
    to represent cloud-capped mountains, and dressed them with paper ornaments.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Households made varying numbers of these images, placed them in household
    oratories, and worshipped them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Food offerings in tiny vessels were made to the images four times during the
    night, while people sang and played the flute before them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At daybreak priests stabbed the images with a weaver's instrument, cut off
    their heads, tore out their hearts, and presented the hearts to the householder
    on a green saucer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bodies of the images were eaten by the family, especially servants, with
    the stated purpose of preserving the eaters from certain diseases associated with
    neglecting worship of the deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Romans had human-shaped loaves called maniae, and the passage states that
    such loaves appear to have been especially made at Aricia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mania is identified as the name of the Mother or Grandmother of Ghosts, to
    whom woollen effigies of men and women were dedicated at the Compitalia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Woollen effigies were hung at Roman house doors, with one for each free person
    and a different kind for each slave, because ghosts of the dead were believed
    to be abroad and might take the effigies instead of living residents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A tradition described the Compitalia woollen figures as substitutes for an
    earlier custom of human sacrifice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author explicitly says the data are fragmentary and uncertain before suggesting
    that Arician human-shaped loaves were sacramental bread made in the image of the
    annually slain divine King of the Wood and eaten by worshippers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that Mexican sacraments in honour of Huitzilopochtli were
    accompanied by the sacrifice of human victims.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The author suggests that the story of Manius and the many Manii may be an
    etymological myth explaining the term maniae for the loaves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author says the alleged substitution of Compitalia effigies for human
    victims is probably unfounded, because dummies used to divert demons from living
    people are described as not uncommon.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Some Dyaks of Borneo set wooden images at their doors during epidemics so
    plague demons may carry off the images instead of people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Minahassa of Celebes may move a sick man to another house and leave a
    pillow-and-clothes dummy on his bed, which the demon is supposed to mistake for
    him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: In Burma, the passage reports a belief that a patient will recover if an effigy
    is buried in a small coffin.
  category: action
  evidence_refs:
  - ev:9
