candidate_motifs:
- id: motif:1
  label: External soul or vital essence kept outside the body
  taxonomy_refs: []
  basis: Multiple tales locate a being's death, life, strength, soul, or heart outside
    the body in an object, plant, animal, or remote place.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage is Frazer's comparative summary; the extraction does not verify
    individual tale variants beyond the supplied text.
- id: motif:2
  label: Nested containers conceal the vital object
  taxonomy_refs: []
  basis: Several examples use chains such as oak-casket-hare-duck-egg, tree-stag-duck-egg,
    mountain-fox-heart-bird, lake-dragon-boar-pigeon, or mountain-pond-duck-egg-light.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The specific order and contents vary by tale.
- id: motif:3
  label: Destroying or manipulating the external object harms or kills the owner
  taxonomy_refs: []
  basis: Koshchei bends or dies when the egg is squeezed or broken; the witch dies
    when the egg-light is put out; Soulless dies when the soul is removed; the German
    warlock weakens and dies when the bird is squeezed and killed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: Some summarized examples disclose the hiding place but do not narrate
    the destruction in the quoted passage.
- id: motif:4
  label: Life-token plant mirrors a person's vitality
  taxonomy_refs: []
  basis: The Oldenburg flowers bloom while the children live and wither when they
    die; the Russian rose-tree also contains the enchantress's death and affects her
    when uprooted.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: medium
  cautions: The flower example is explicitly life-token correspondence, while the
    rose-tree example is a death-location rather than a simple mirroring token.
- id: motif:5
  label: Remote or guarded location protects the vital essence
  taxonomy_refs: []
  basis: Vital objects are placed under an oak, in a blue forest, in a mountain, in
    a lake under a city, on a rock in the Red Sea, or in a locked church with iron
    doors and a moat.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage does not always state how each remote location is reached.
- id: motif:6
  label: Another person's heart seized and tormented
  taxonomy_refs: []
  basis: One Russian story says a witch has a prince's heart and keeps it seething
    in a magic cauldron, tormenting him.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This motif is represented by a single brief summary in the passage.
- id: motif:7
  label: Strength transferred by consuming the vital egg
  taxonomy_refs: []
  basis: In the Bohemian tale, the seer sucks the egg containing the warlock's strength,
    after which the warlock becomes weak and the strength passes into the seer.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Only one example in this passage explicitly describes transfer of strength
    to the destroyer.
comparison_claims:
- id: claim:1
  claim: The passage presents Slavonic and Teutonic examples as belonging to the same
    broad external-soul pattern.
  claim_level: same_motif
  target: Slavonic and Teutonic external-soul tale examples summarized by Frazer
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This is a claim about Frazer's grouping within the passage, not an
    independent historical explanation of transmission or origin.
- id: claim:2
  claim: The Russian, Bohemian, Serbian, and South Slavonian examples share the function
    of hiding death or strength in nested animals, objects, or places.
  claim_level: same_function
  target: Slavonic nested external-vitality tales in the passage
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: 'The examples differ in the vital term used: death, strength, heart,
    bird, or pigeon.'
- id: claim:3
  claim: The Transylvanian Saxon and German examples share the pattern in which a
    remote soul, life, or heart is obtained by an opponent and its destruction or
    removal kills the dangerous being.
  claim_level: same_function
  target: Teutonic-stock external-soul tales in the passage
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives summarized tale forms only and does not establish
    historical contact between the examples.
