canonical_text:
  quote: ''
  summary: Frazer summarizes Slavonic and Teutonic folk-tale examples in which a being's
    death, life, strength, heart, or soul is located outside the body, often hidden
    in nested animals, objects, plants, or distant guarded places. In several examples,
    handling or destroying the external object weakens, controls, or kills the being;
    one example describes life-flowers that flourish or wither with the lives of royal
    children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a Russian tale, Koshchei the Deathless says his death is in an egg, inside
    a duck, inside a hare, inside a casket under an oak.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prince obtains Koshchei's egg; squeezing it makes Koshchei bend double,
    and shattering it kills him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other Koshchei or snake variants describe a fatal blow from an egg or a small
    stone in an egg, and Koshchei moving from side to side as the egg is shifted between
    hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another Russian story, an enchantress's death is in a blue rose-tree in
    a blue forest; Prince Ivan uproots the tree, the enchantress sickens, and when
    he throws the tree into the cellar the building shakes and becomes an island with
    freed people giving thanks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another Russian story, a witch torments a prince by holding his heart and
    keeping it seething in a magic cauldron.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Bohemian tale, a warlock's strength is in an egg inside a duck inside
    a stag under a tree; a seer finds and sucks the egg, after which the warlock becomes
    weak and the strength passes to the seer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a Serbian story, True Steel says his strength is in a bird inside a heart
    inside a fox in a mountain; when the fox is killed and the bird is burnt, True
    Steel falls dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a South Slavonian story, a dragon tells an old woman that its strength
    is in a pigeon inside a boar inside a dragon in a lake under an emperor's city.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In a Transylvanian Saxon tale, bullets pass through a witch without harming
    her, and she says her life is a burning light in an egg inside a duck on a pond
    in a mountain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The young man in the Transylvanian Saxon tale obtains the egg, smashes it,
    puts out the light, and the witch's life goes out.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a German story, Soulless the cannibal keeps his soul in a box on a rock
    in the Red Sea; a soldier opens the box, removes the soul, throws it backward,
    and Soulless dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In an Oldenburg story, each child of a king has a flower in the king's garden
    that blooms while the child lives and withers when the child dies.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: In another German story, an old warlock says he has no heart in his breast
    and that his heart is in a bird flying in a secured church surrounded by a moat.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The damsel's lover catches the bird-heart; squeezing the bird makes the warlock
    ill and senseless, and killing the bird kills the warlock.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage explicitly frames the examples as Slavonic stories of the same
    sort and as Teutonic-stock stories of the external soul.
  category: other
  evidence_refs:
  - ev:12
