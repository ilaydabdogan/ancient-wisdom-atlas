canonical_text:
  quote: ''
  summary: Frazer argues that Celtic and Druidic midsummer fire rites involved burning
    human and animal victims as representatives of vegetation or corn spirits, compares
    these rites with modern European bonfire customs, and then describes, through
    Pliny, the Druidic ceremony of gathering sacred mistletoe from an oak with sacrifice,
    white ritual elements, and healing/fertility beliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents the idea that men burned in wicker frames by the Druids
    represented the spirit of vegetation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names cattle, cats, foxes, and cocks as animals burned by Druids
    or in modern bonfires and says these animals are variously regarded by European
    peoples as embodiments of the corn-spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says there is no certain European evidence that serpents represented
    the tree-spirit or corn-spirit, and suggests that serpents at the Luchon midsummer
    festival may have replaced other animal victims.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says that customs of burning wicker-work giants and animals enclosed
    in wicker-work or baskets occur most clearly in France or the wider area of ancient
    Gaul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says these burning customs are generally observed at or about
    midsummer, and infers that the original rites were also held at midsummer.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage summarizes the reconstructed Celtic rite as an annual midsummer
    festival in which living men representing the tree-spirit or spirit of vegetation
    were enclosed in wicker frames and burned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the rite was designed as a charm to make the sun shine
    and crops grow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage identifies the gathering of sacred mistletoe by the Druids as
    another major feature of the Celtic midsummer festival.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Pliny passage quoted by Frazer, Druids esteem mistletoe and the oak
    on which it grows as especially sacred, choose oak-woods for sacred groves, and
    perform no sacred rites without oak-leaves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Pliny passage says the Druids believe whatever grows on oak trees is sent
    from heaven and marks the tree as chosen by the god.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The mistletoe is gathered with solemn ceremony especially in the sixth month,
    after preparations for sacrifice and a feast under the tree; two white bulls with
    unbound horns are brought to the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A priest in a white robe climbs the tree and cuts the mistletoe with a golden
    sickle, while the mistletoe is caught in a white cloth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the cutting, victims are sacrificed with a prayer that God may prosper
    his gift, and a mistletoe potion is believed to promote animal fertility and to
    remedy poison.
  category: sequence
  evidence_refs:
  - ev:6
