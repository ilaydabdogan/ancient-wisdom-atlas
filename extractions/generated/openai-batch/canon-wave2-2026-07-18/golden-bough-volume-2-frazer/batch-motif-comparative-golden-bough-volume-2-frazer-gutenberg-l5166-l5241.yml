canonical_text:
  quote: ''
  summary: Frazer describes taboos in which sacred or royal persons must avoid sunlight,
    light, ground contact, or ordinary social contact, then compares these restrictions
    with puberty seclusion practices for girls in Loango, among Zulu-related South
    African groups, and in New Ireland. The passage especially emphasizes prohibitions
    against seeing the sun and touching the ground, and describes long confinement
    of New Ireland girls in dark, tabu-marked cages until young womanhood and a marriage
    feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rule is stated that the sun may not shine upon the divine person, and it
    is associated with the Mikado and the Zapotec pontiff.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zapotec pontiff is described as a god-like figure whom the earth was not
    worthy to hold and the sun was not worthy to shine upon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mikado’s sacred person is not to be exposed to open air, and the sun is
    not thought worthy to shine on his head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The heir to the throne of Bogota lives in temple retirement from age sixteen
    and must not see the sun, eat salt, or converse with a woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The heir to Sogamoso fasts for seven years in a dark temple without seeing
    sun or light, and the future Inca fasts for a month without seeing light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The passage explicitly identifies two recurring rules: not touching the ground
    and not seeing the sun.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Loango girls at puberty are confined in separate huts and may not touch the
    ground with any part of the bare body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among Zulu-related South African groups, a girl at first signs of puberty
    hides by the river among reeds, avoids being seen by men, covers her head from
    sunlight, and returns after dark to hut seclusion.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In New Ireland, girls are confined for four or five years in small dark cages
    and are not allowed to set foot on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The New Ireland confinement house is marked as tabu and contains conical leaf
    cages with tightly sewn leaves, double doors, and bamboo platforms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the New Ireland example, men except the girls’ own relations are forbidden
    to look at them, and an old woman in charge is allowed to open the cage doors.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: When one New Ireland girl comes out for beads, an old woman places pieces
    of wood and bamboo on the ground so the girl can step on them without touching
    the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The inside of a New Ireland cage is described as hot, stifling, dark when
    closed, and containing bamboo water holders, with only enough room for crouched
    sitting or lying.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: New Ireland girls are allowed out once daily to bathe in a dish or wooden
    bowl near each cage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: New Ireland girls are placed in cages when quite young, remain until they
    are young women, and are then brought out for a great marriage feast.
  category: sequence
  evidence_refs:
  - ev:9
