canonical_text:
  quote: Both dog and wolf appear as embodiments of the corn-spirit in harvest-customs.
  summary: The passage surveys European harvest and threshing customs in which dog
    and wolf names are applied to the last sheaf, last standing corn, last reaper
    or binder, threshing actions, and seasonal figures. It also describes a garlanded
    wether called the field wolf and winter processions involving wolf figures.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In several named regions, the person who binds or cuts the last sheaf is called
    by dog-related names, or the completion of reaping is described as killing a crop-specific
    dog.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A harvester who falls behind may be described as having the White Dog or White
    Bitch near him, or as having been bitten by the White Bitch.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In German harvest customs described in the passage, the wolf is said to be
    in the last sheaf or last standing corn, and the last cutter or binder is said
    to have, fetch, or be bitten by the wolf.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Rügen, the woman who binds the last sheaf is called Wolf and, on returning
    home, bites two women of the household and receives meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Buir, the last sheaf was formerly shaped like a wolf, kept in the barn
    until threshing was finished, brought to the farmer, and sprinkled with beer or
    brandy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In many places, the sheaf called the Wolf is made in human form and dressed
    in clothes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Wanzleben, after threshing, peasants process with a man enveloped in threshed-out
    straw and led by a chain; he is called the Wolf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Trier, men thresh the last sheaf until it is reduced to chopped straw,
    with the stated belief that the Corn-wolf in the last sheaf has been killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In French harvest customs, reapers call out that the wolf is in or near the
    last corn and compete to catch it by finishing their swath first.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Guyenne, after the last corn is reaped, a garlanded wether called the Wolf
    of the field is led around the field by singing reapers and then killed on the
    field.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes midwinter customs in which a man with a wolf skin, a
    stuffed wolf, or a man enveloped in leaves and called the Wolf is led or carried
    about while money is collected.
  category: action
  evidence_refs:
  - ev:7
