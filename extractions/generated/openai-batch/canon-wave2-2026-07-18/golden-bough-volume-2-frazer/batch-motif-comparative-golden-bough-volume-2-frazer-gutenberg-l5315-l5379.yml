canonical_text:
  quote: ''
  summary: Frazer describes and compares puberty-seclusion rites for girls among the
    Macusis, other Indians of Guiana, the Uaupes of Brazil, Hindoo maidens, and Cambodian
    maidens. The passage includes hammock or dark-room confinement, fire and food
    restrictions, ritual handling of objects, beating or ant-stinging, claims of purification
    and contagion removal, reintegration as clean or marriageable, and Cambodian eclipse-related
    exceptions involving devotion to an eclipse-causing monster.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Macusis, a girl showing first signs of puberty is hung in a hammock
    at the highest point of the hut; for the first few days she may not leave it by
    day, but at night she must come down, light a fire, and spend the night beside
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the height of her symptoms, the Macusi girl fasts rigorously; after
    the symptoms abate, she moves to a small compartment in the darkest corner of
    the hut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Macusi girl cooks her food at a separate fire and in her own vessel; a
    magician later mutters charms and breathes on her and on valuable things she has
    touched, while her pots and drinking vessels are broken and buried.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After her first bath, the Macusi girl is beaten by her mother with thin rods
    without crying; after a second beating at the end of the second period, she is
    called clean and may mix with people again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other Indians of Guiana keep the pubescent girl in a hammock at the top of
    the hut for a month and then expose her to large, painfully biting ants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Frazer states that ant-stinging and beating are intended as purification,
    not punishment or endurance testing, and that the rite is meant to drive away
    malignant influences or dangerous contagion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Uaupes of Brazil, a girl at puberty is secluded in the house for
    a month, receives only a small amount of bread and water, and is then struck by
    relations and friends with pieces of sipo until she falls senseless or dead; if
    she recovers, the striking is repeated four times at six-hour intervals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Uaupes account, sipo pieces are dipped into prepared pots of meat and
    fish and then given to the girl to lick, after which she is considered a marriageable
    woman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Hindoo maiden at maturity is kept in a dark room for four days, forbidden
    to see the sun, treated as unclean and untouchable, and given a restricted diet
    including boiled rice, milk, sugar, curd, and tamarind without salt.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Cambodia, a girl at puberty is put to bed under a mosquito curtain, nominally
    for a hundred days but often for fewer days.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Another Cambodian account says a pubescent maiden enters the shade for a retirement
    that may last from days to years; she must not be seen by strange men, eat flesh
    or fish, or go to the pagoda, but the retirement is suspended during eclipses
    so that she may make devotions to the monster said to cause eclipses.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Frazer infers that the Cambodian eclipse exception shows that the prohibition
    on looking at the sun is interpreted literally.
  category: speech
  evidence_refs:
  - ev:12
