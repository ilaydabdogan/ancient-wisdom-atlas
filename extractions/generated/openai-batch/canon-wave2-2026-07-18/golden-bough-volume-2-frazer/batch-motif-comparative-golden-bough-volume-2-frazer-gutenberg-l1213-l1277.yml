canonical_text:
  quote: ''
  summary: Frazer compares the Thesmophoria's treatment of swine with Northern European
    harvest customs in which parts of killed animals or last-sheaf figures are eaten
    and parts retained for sowing. He generalizes this as an animal-form corn-spirit
    whose remains secure renewal, then discusses whether the spirit is dead, revived,
    or living underground. He also cites the Phigalian Black Demeter's horse-headed
    image and withdrawal into a cave as evidence for animal forms of the corn-spirit,
    and turns to Attis, whose swine taboo, boar-killing legend, and possible cry 'Pig
    Attis' are treated as evidence for animal embodiment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the Thesmophoria as an autumn festival for the corn-goddess
    in which swine flesh was partly eaten and partly kept in caverns until it was
    later sown with seed-corn to secure a crop.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists Northern European harvest customs involving a goat, ox,
    cock feathers, pig flesh or bones, and a Yule Boar made from the last sheaf, with
    portions retained until later sowing or harvest use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states a general pattern in which the corn-spirit is killed in
    animal form in autumn, part of its flesh is eaten sacramentally, and part is retained
    as security for continuing or renewed energies.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says it is unclear whether the corn-spirit is conceived as dead,
    revived after killing, or alive underground; for the Thesmophoria it reports pigs
    thrown in alive and supposed to reappear at the following year's festival.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that the Black Demeter in the cave of Phigalia was represented
    as a woman with the head and mane of a horse.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage recounts a legend in which Demeter, searching for her daughter,
    took mare form to escape Poseidon, withdrew in black clothing to the cave of Phigalia,
    and was persuaded by Pan to leave after the earth's fruits were perishing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies the Black Demeter's absence, during which the fruits
    of the earth perish, as an expression of winter vegetation.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says Attis worshippers abstained from swine, that Attis was killed
    by a boar, and that the cry 'Hyes Attes' may mean 'Pig Attis.'
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
