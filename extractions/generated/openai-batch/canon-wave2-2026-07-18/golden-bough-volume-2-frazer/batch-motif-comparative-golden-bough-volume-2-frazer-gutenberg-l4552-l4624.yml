canonical_text:
  quote: ''
  summary: 'Frazer describes several scapegoat or purification rites: annual human
    sacrifices at Onitsha to remove communal sins; a Siamese expulsion of a woman
    believed to absorb malign influences; a Nias public sacrifice of a horse or buffalo,
    with a formerly associated expelled man; and a Tibetan New Year ceremony in Lhása
    involving a temporary monk-ruler, priestly rites, a marked human victim, dice
    divination, and expulsion beyond the city.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Onitsha, two human beings are annually sacrificed to take away the sins
    of the land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Onitsha victims are bought with money collected by public subscription
    from persons said to have committed serious sins during the past year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Onitsha purchase is described as obtaining two sickly persons, one to
    be offered for the land and one for the river; a man from a neighboring town is
    hired to kill them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A witnessed Onitsha victim, a young woman, was dragged face downward from
    the king’s house to the river while crowds cried “Wickedness!”
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Onitsha dragging was intended to take away the
    iniquities of the land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Siam, a woman was formerly carried through the streets on one day of the
    year with music, insulted by the mob, pelted with dirt, and thrown outside the
    city boundary.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Siamese rite barred the woman from entering the city walls again and was
    believed to make her draw upon herself malign influences of the air and of evil
    spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The people of Nias offer a red horse or a buffalo as a public sacrifice to
    purify the land and obtain the favour of the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Nias account says that formerly a man was bound to the same stake as the
    buffalo and then driven away after the animal was killed; no one might receive
    him, speak with him, or give him food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Frazer infers that the expelled Nias man was supposed to carry away the sins
    and misfortunes of the people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In Tibet, the New Year begins with the new moon about 15 February, and for
    twenty-three days the government of Lhása is entrusted to the highest-bidding
    monk of Debang monastery, called the Jalno.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Jalno announces his office through Lhása while bearing a silver stick,
    receives homage from monks, and exercises authority through fines and taxes.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: Priests assemble at the Máchindránáth temple in Lhása, perform religious ceremonies,
    and pray to the gods to prevent sickness and other evils among the people.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: In the Tibetan ceremony, one man is sacrificed as a peace-offering; he is
    not purposely killed, but the ceremony often proves fatal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Tibetan victim has grain thrown against his head and his face painted
    half white and half black.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: On the tenth day, the Tibetan victim is brought from the temple, receives
    small donations, and throws dice with the Jalno.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: If the Tibetan victim wins the dice game, evil is foreboded; if the Jalno
    wins, the people rejoice because the victim is believed accepted by the gods to
    bear all the sins of Lhása.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: After the dice outcome, the Tibetan victim is painted, dressed in a leather
    coat, marched to the city walls, driven outside by the populace, and taken to
    Sáme monastery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: If the Tibetan victim dies soon afterward, the people call it auspicious;
    otherwise he is kept prisoner at the monastery for a year before being allowed
    to return to Lhása.
  category: sequence
  evidence_refs:
  - ev:8
