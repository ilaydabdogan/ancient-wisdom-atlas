candidate_motifs:
- id: motif:1
  label: chosen scapegoat bears communal sins or evils
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly describes human or animal figures as taking away sins,
    drawing malign influences, purifying the land, or bearing all the sins of Lhása.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: "“Scapegoat” is Frazer’s comparative label; the particular rites differ
    in victim type, outcome, and stated rationale."
- id: motif:2
  label: periodic communal purification through sacrifice or expulsion
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: Onitsha sacrifices are annual, Siam has one day of the year, and Tibet’s
    rite is tied to the New Year; each involves removal of communal wrongdoing or
    danger through a selected victim.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The Nias example is described as a public sacrifice but not explicitly
    dated as annual in this passage; timing and calendar meanings vary.
- id: motif:3
  label: expulsion beyond civic boundary
  taxonomy_refs: []
  basis: The Siamese woman is thrown outside the ramparts and forbidden to return,
    and the Tibetan victim is marched to the city walls and driven outside Lhása.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: The Onitsha and Nias examples include removal or river movement but do
    not share the same explicit city-wall structure.
- id: motif:4
  label: ritual divination deciding acceptance of the scapegoat
  taxonomy_refs: []
  basis: In Lhása, the victim throws dice with the Jalno; the outcome is read as foreboding
    evil or showing that the gods have accepted the victim as bearer of communal sins.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This divinatory dice element is only attested for the Tibetan example
    in the passage.
- id: motif:5
  label: temporary festival ruler governing before purification rite
  taxonomy_refs: []
  basis: The Jalno, a highest-bidding monk, temporarily receives authority over Lhása
    around New Year, exacts fines, and participates in the later scapegoat dice ceremony.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly state how the Jalno’s temporary rule symbolically
    relates to the scapegoat rite beyond sequence and participation.
comparison_claims:
- id: claim:1
  claim: The Onitsha, Siamese, Nias, and Tibetan examples share the function of transferring
    communal sins, evils, malign influences, or misfortunes to a selected human or
    animal figure.
  claim_level: same_function
  target: scapegoat or communal purification pattern across the rites described in
    the passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not establish historical contact or common inheritance;
    victim type, ritual outcome, and local explanations differ.
- id: claim:2
  claim: The Siamese and Tibetan examples share a boundary-expulsion structure in
    which a marked or degraded human figure is removed from the city beyond its walls
    or ramparts.
  claim_level: same_function
  target: urban boundary expulsion of a scapegoat figure
  evidence_refs:
  - ev:3
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The Siamese woman is not described as a formal sacrifice, while the
    Tibetan man is part of a temple-centered peace-offering and dice rite.
- id: claim:3
  claim: The Onitsha and Tibetan examples both include a public procession marked
    by hostile communal noise directed at the victim during removal.
  claim_level: visual_similarity
  target: public abusive procession of a sin-bearing victim
  evidence_refs:
  - ev:2
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The passage records different actions and endpoints: the Onitsha victim
    is dragged to the river and killed, while the Tibetan victim is driven outside
    the city and taken to a monastery.'
- id: claim:4
  claim: The Onitsha and Tibetan examples both explicitly combine sacrifice language
    with the idea that the victim bears or removes the sins of the community.
  claim_level: same_motif
  target: human sacrificial scapegoat bearing communal sin
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The Tibetan passage notes that the man is not purposely killed, though
    the ceremony often proves fatal; the Onitsha victims are intentionally killed.
