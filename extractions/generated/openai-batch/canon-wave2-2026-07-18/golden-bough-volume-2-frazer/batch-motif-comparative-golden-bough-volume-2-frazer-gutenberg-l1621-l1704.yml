canonical_text:
  quote: ''
  summary: The passage interprets the Roman October horse sacrifice and related European
    harvest customs as rites involving animal or human-shaped representatives of the
    corn-spirit. It describes the horse’s head, tail, and blood as ritual objects
    connected with harvest fertility; compares Roman, African, German, Scottish, Swedish,
    and French customs; and introduces the theme of sacramentally eating the corn-spirit
    through animals, new corn, girl-shaped loaves, and a dough-man.
  language: English
  quote_policy: summarized
