canonical_text:
  quote: "“eating the soul of the rice”"
  summary: Frazer lists first-fruits and new-harvest rites from Boeroe, Celebes, Southern
    India, Gilgit, Onitsha, and Natal/Zululand. The examples involve ritual harvesting,
    offering, sacrifice, divination, communal eating of new crops, and restrictions
    on ordinary harvesting or eating until the ceremony is completed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In Boeroe, each clan contributes new rice to a common meal called “eating
    the soul of the rice,” and some rice is set apart for spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Alfoers of Celebes, the priest sows the first rice-seed, plucks
    the first ripe rice, roasts and grinds it, and gives some to each household member.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Bolang Mongondo, an offering of a pig or fowl precedes harvest; the priest
    plucks rice from fields, later offers an egg, and every family member eats the
    returned rice before normal harvesting is allowed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Burghers, a Curumbar sows the first seed and reaps the first sheaf;
    the grain is made into cakes, offered as a first-fruit oblation, and eaten with
    sacrificed animal remains by the Burgher family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Coorgs, an astrologer chooses the first-sheaf cutter, who cuts rice
    with a new sickle after the household bathes and goes to the field at sunset.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Coorg ceremony, a rice-adorned bundle of leaves is fixed to the central
    post of the threshing-floor, the mistress washes the cutter’s feet, participants
    drink milk, honey, and sugar, and each eats a rice cake portion on an Ashvatha
    leaf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the Coorg cutting, no one may touch the sheaf-cutter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Pongol in Southern India, new rice is boiled in a new pot on a noon-kindled
    fire; the family watches the milk’s boiling as an omen for the coming year, offers
    some rice to the image of Ganesa, and eats the rest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Gilgit, before wheat harvest, a household member secretly gathers ears
    at dusk; some are hung over the door, and the rest are roasted and eaten in milk
    before harvest begins the next morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Onitsha, headmen prepare yams, palm-leaves, kola-nuts, and fish; the Libia
    divides a roasted yam and places a piece on the eater’s lips, after which the
    eater gives thanks and eats.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Among the Kafirs of Natal and Zululand, no one eats new fruits until after
    a New Year festival at the king’s kraal, where the king places a boiled mixture
    of crops, sacrificed animal flesh, and medicine into each man’s mouth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Several described rites occur before general harvesting or ordinary eating
    of the new crop is permitted.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:7
  - ev:9
