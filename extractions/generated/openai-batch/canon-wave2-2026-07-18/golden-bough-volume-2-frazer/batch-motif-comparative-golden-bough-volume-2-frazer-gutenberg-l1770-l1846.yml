candidate_motifs:
- id: motif:1
  label: Ritual eating of the first or new harvest before ordinary use
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage repeatedly describes new rice, yams, wheat ears, or fruits being
    ritually eaten before general harvesting or ordinary consumption proceeds.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is a comparative scholarly compilation; it does not present
    one continuous mythic narrative.
- id: motif:2
  label: First-fruits offering or sacrifice
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: New crop portions or associated items are offered to spirits, to Ganesa’s
    image, or as first-fruit oblation; animals or an egg are also sacrificed or offered
    in several rites.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  confidence: high
  cautions: The offerings differ by region, recipient, and ritual form.
- id: motif:3
  label: Ritual specialist mediates access to the new crop
  taxonomy_refs: []
  basis: Priests, a Curumbar first-sower/reaper, a selected sheaf-cutter, the Libia,
    and a king each mediate the first handling or eating of crops.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  confidence: medium
  cautions: The specific social status and function of these mediators vary widely.
- id: motif:4
  label: Sanctifying communal meal
  taxonomy_refs:
  - sacred_exchange
  basis: Several rites culminate in household or community members eating ritually
    prepared food described as sacramental, federal, offered, or sanctified.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: medium
  cautions: The vocabulary of sanctification is strongest in some examples and more
    implicit in others.
- id: motif:5
  label: Harvest-year omen from boiling milk
  taxonomy_refs:
  - seasonal_cycle
  basis: In Pongol, the family watches how the milk boils, and the passage states
    that rapid boiling indicates prosperity while slow boiling indicates the reverse.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This motif is explicitly attested only in the Pongol example within this
    passage.
- id: motif:6
  label: Temporary restriction before first-fruits rite
  taxonomy_refs: []
  basis: The passage states that normal rice harvesting in Bolang Mongondo follows
    only after the ceremony, that Gilgit harvest begins after the pre-harvest eating,
    and that no one among the Kafirs may eat new fruits until after the festival.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:9
  confidence: medium
  cautions: Restrictions are not identical across all examples.
comparison_claims:
- id: claim:1
  claim: The passage presents a recurring cross-cultural function in which the first
    or new crop is ritually handled and eaten before ordinary harvest or consumption.
  claim_level: same_function
  target: First-fruits or new-harvest eating ceremonies across Boeroe, Celebes, Southern
    India, Gilgit, Onitsha, and Natal/Zululand
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional comparison by juxtaposition, but it
    does not demonstrate historical contact or common origin.
- id: claim:2
  claim: Several examples use offerings or sacrifices to dedicate the first crop or
    its associated foods before communal eating.
  claim_level: same_function
  target: First-fruits oblation and sacrificial dedication patterns
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The recipients and sacrificial materials differ; some examples in the
    passage do not mention sacrifice or offering.
- id: claim:3
  claim: The passage repeatedly assigns control over first-crop access to a ritual
    mediator such as a priest, selected cutter, country doctor, or king.
  claim_level: same_function
  target: Ritual mediation of first harvest access
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The mediators occupy different social roles, and the passage does not
    claim they are equivalent institutions.
