  text: The passage states that anthropomorphic and theriomorphic conceptions of the
    corn-spirit are completely parallel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When corn waves in the wind, it is said either that the Corn-mother or that
    the Corn-wolf and similar animal figures are passing through the corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children are warned not to stray in corn-fields because either the Corn-mother
    or the Corn-wolf and similar animal figures are said to be there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The last corn cut or last sheaf threshed is supposed to contain either the
    Corn-mother or the Corn-wolf and similar figures, and the last sheaf may be made
    in the shape of a woman or an animal.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The person who cuts, binds, or threshes the last sheaf may receive a name
    corresponding to the name given to the sheaf, such as Old Woman or Wolf.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Some human-form sheaves called the Maiden or Mother of the Maize are kept
    from one harvest to the next to secure the continuance of the corn-spirit's blessing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Animal-related harvest objects such as the Harvest-cock or goat flesh are
    also kept from one harvest to the next for a similar purpose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Grain from the Corn-mother, feathers of the cock, or the Yule Boar may be
    mixed with seed-corn in spring to make the crop abundant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Part of the Corn-mother or Maiden, and part of the Yule Boar, may be given
    to cattle, ploughing horses, or oxen so that they may thrive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The death of the corn-spirit is represented by killing, really or in pretence,
    either a human or animal representative.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Worshippers partake sacramentally of the body and blood of the representative,
    whether human or animal, or of bread made in that representative's likeness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage lists additional animal forms of the corn-spirit, including stag,
    roe, sheep, bear, ass, fox, mouse, stork, swan, and kite.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage proposes that the appearance of an animal or bird among the corn
