canonical_text:
  quote: ''
  summary: Frazer summarizes parallels between human and animal conceptions of the
    corn-spirit, including its presence in the last sheaf, preservation of harvest
    objects for future fertility, ritual killing and consumption of representatives,
    and an explanation of why escaping animals in the last standing corn could be
    identified with the corn-spirit. He ends by asking whether this animal-form conception
    may explain animals associated with ancient vegetation deities.
  language: English
  quote_policy: summarized
