canonical_text:
  quote: ''
  summary: The passage surveys Northern European customs in which pig or boar parts,
    boar-shaped loaves, and Yule straw are used at sowing, harvest, Christmas/Yule,
    and Easter. The source interprets these practices as expressions of a corn-spirit
    embodied in animal or bread form, used to promote fertility, protect crops, and
    be eaten sacramentally.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Neuautz in Courland, when barley is first sown, the farmer’s wife boils
    pig chine and tail and brings them to the sower in the field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sower eats some of the boiled pig, cuts off the tail, and sticks the tail
    in the field; the passage reports a belief that the ears of corn will grow as
    long as the tail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the pig is the corn-spirit, put into the ground at
    sowing-time and appearing again at harvest; it notes that among neighboring Esthonians
    the last sheaf is called the Rye-boar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In German districts mentioned by the passage, pig bones or ribs are kept,
    exchanged with ashes, mixed with seed-corn, inserted into sown fields, or placed
    in a seed-bag among flax seed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The German pig-bone and pig-rib practices are described as protecting against
    earth-fleas and moles and helping flax grow well and tall.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In many parts of White Russia, people eat roast lamb or sucking-pig at Easter
    and throw the bones backward onto fields to preserve corn from hail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Sweden and Denmark at Yule, people bake a loaf in the form of a boar-pig,
    called the Yule Boar, often using corn from the last sheaf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Yule Boar stands on the table through Yule and is often kept until spring
    sowing, when part is mixed with seed-corn and part is given to ploughmen and plough
    animals to eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage describes Yule straw as long rye-straw set apart for Christmas
    and used by Swedish peasants in field-fertility, harvest-omen, and fruit-tree
    fertilizing practices.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Swedish Christmas custom described in the passage involves a man wrapped
    in a skin with straw in his mouth like boar bristles, while an old woman with
    a blackened face pretends to sacrifice him with a knife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The final paragraph says the corn-spirit is conceived as embodied in an animal,
    the divine animal is slain, and its flesh and blood are partaken of by harvesters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The final paragraph says bread or dumplings made in an animal image may substitute
    for real flesh and be eaten sacramentally.
  category: relationship
  evidence_refs:
  - ev:6
