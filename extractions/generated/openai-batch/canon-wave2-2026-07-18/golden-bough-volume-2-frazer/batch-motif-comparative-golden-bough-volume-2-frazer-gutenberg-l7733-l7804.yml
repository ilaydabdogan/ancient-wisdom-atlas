canonical_text:
  quote: ''
  summary: 'Frazer quotes descriptions of two initiatory rites: the Belli-Paaro of
    Quoja in West Africa and the Huskanaw among Indians of Virginia. Both involve
    youths secluded from ordinary society, taught or treated by initiates or keepers,
    represented as dying or losing their former lives, and later returned as changed
    adult members of the community.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Quoja, the Belli-Paaro ceremony is described as admission into an assembly
    of spirits and as granting the right to enter spirit groves and eat offerings
    brought there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Belli-Paaro initiation is said to occur every twenty or twenty-five years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Initiated members bear lines on the neck between the shoulders, apparently
    pricked with a needle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Marked initiates are treated as persons of spirit and, at a certain age, may
    speak in public assemblies; uninitiated persons are described as profane, impure,
    and ignorant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the king's order, unmarked youths are brought weeping to a place appointed
    in the forest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The youths are told that they must suffer death in order to undergo the change,
    and they dispose of their property as if their lives were over.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Initiated instructors stay beside the novices and teach them a dance called
    killing and verses in praise of Belli.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The forest phase of Belli-Paaro lasts five or six years in a forest village,
    with hunting and fishing, while women and uninitiated persons are forbidden to
    approach the sacred wood.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: After instruction, the novices are shut in small huts, where women bring them
    food and they begin to speak again with mankind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On entering the huts, the novices are covered with bird feathers and wear
    bark caps hanging before their faces.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The novices pretend not to recognize anyone and to be ignorant of local customs
    such as washing and rubbing with oil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After being dressed in clothes, the novices dance the dance of Belli before
    the assembled neighborhood and are then taken by instructors to their parents'
    houses.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Among the Indians of Virginia, the Huskanaw initiatory ceremony is said to
    take place every sixteen or twenty years, or more often as young men grow up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In Huskanaw, youths are kept in solitary confinement in the woods for several
    months and are fed only an infusion of intoxicating roots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The intoxicating diet causes the youths to go raving mad for eighteen or twenty
    days, according to the quoted description.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Huskanaw rite is said to make the youths lose memory of former things,
    including parents, possessions, and language.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: Doctors gradually restore the youths to their senses by reducing the intoxicating
    diet, then bring them back to town while still wild or crazy from the medicine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: After returning, the youths must avoid showing former memory; if they do,
    they must undergo Huskanaw again, and the second treatment is said to be often
    fatal.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:19
  text: The returned youths act as if unable to speak or understand language until
    they learn it again, and keepers attend them until they relearn things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The quoted description states that the Huskanaw initiates 'unlive their former
    lives' and begin manhood by forgetting boyhood.
  category: speech
  evidence_refs:
  - ev:9
