canonical_text:
  quote: ''
  summary: Frazer discusses Australian sex totems and broader tribal or family totems.
    He describes beliefs that human lives are bound up with particular animals or
    plants, producing protective taboos, kinship naming, and death consequences when
    a totemic counterpart is killed. He then compares these patterns with nagual,
    ihlozi, tamaniu, and fairy-tale external-life examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Australian men and women are described as protectors of bats and owls respectively,
    with bats usually allotted to men and owls to women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each man is said to believe that his own life and the lives of male relatives
    are bound up with particular bats, so protecting bats protects male kin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each woman is said to believe that her own life and the lives of female relatives
    are bound up with particular owls, so guarding owls guards female kin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that when a man's life is in a bat, the bat can be treated
    as his brother and the man can be described as a bat; similarly, an owl can be
    a woman's sister and the woman an owl.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Men and women are said to address each other by the associated animals: a
    man addresses a woman as an owl, and she addresses him as a bat.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Among the Kurnai, Emu Wrens are described as brothers of the men and the men
    as Emu Wrens; Superb Warblers are described as sisters of the women and the women
    as Superb Warblers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage defines a totemic relation as one in which a person names himself
    after an animal, calls it brother, and refuses to kill it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sex totems are described as comparatively rare, while tribal or clan totems
    are described as more common and hereditary in either the male or female line.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Frazer explains tribal reverence for an animal or plant species as based on
    the belief that each individual's life is bound up with one animal or plant of
    that species, and that killing or destroying it would cause the person's death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sir George Grey's account of a Western Australian kobong describes a mysterious
    connection between a family and its kobong, leading family members to avoid killing
    or gathering the relevant animal or vegetable under certain circumstances.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says that within the whole totem species only one individual is
    specially dear to the person, but because that individual is unknown, all members
    of the species are spared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A crow is reported to have been killed, after which a Boortwa, or Crow-clan
    man, named Larry died; the killing of his wingong is said to have hastened his
    death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage lists further examples in which killing a nagual, ihlozi, tamaniu,
    or the fairy-tale animal in which life is stored causes the associated person's
    death.
  category: sequence
  evidence_refs:
  - ev:10
