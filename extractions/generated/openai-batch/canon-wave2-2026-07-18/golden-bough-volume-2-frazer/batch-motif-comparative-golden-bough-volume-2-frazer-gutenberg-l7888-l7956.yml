canonical_text:
  quote: ''
  summary: The passage describes male puberty initiation rites among the Galela and
    Tobelorese of Halmahera and the Kakian association in west Ceram. The first rite
    includes preparation of red water, smearing boys, forest hiding behind trees,
    bathing, and feeding. The second includes blindfolded entry into a dark forest
    shed, simulated demonic sounds, represented killing or swallowing, confinement,
    body dyeing and tattooing, warnings of secrecy, and instruction in tribal rules
    and traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Galela and Tobelorese, boys undergo an initiation that is described
    as including a pretence of begetting them anew.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parents of boys who have reached the proper age arrange a common ceremony
    at shared expense and invite others to attend.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shed is prepared with separate long tables for men and women; rayfish skins
    and red-coloring wood are brought, and a priest or elder makes powder from the
    wood using the ray-skin while each boy's name is called.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vessels containing the powder are filled with water; at the third cock-crow
    the priest smears the boys' faces and bodies with the red water, which the passage
    says represents blood shed at perforation of the hymen.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Near daybreak the boys are taken to the wood and must hide behind the largest
    trees while armed men accompany them with dancing and singing, and the priest
    knocks three times on each tree behind which a boy is hiding.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boys remain in the wood through the day, expose themselves to the sun,
    bathe in the evening, return to the shed, and are supplied with food by women.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In west Ceram, boys at puberty are admitted to the Kakian association, which
    the passage characterizes as religious and social, with initiation of young men
    as a chief object.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kakian house is described as an oblong wooden shed in the darkest forest
    trees, built so little light enters that what happens inside cannot be seen.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kakian initiands are conducted blindfolded by two sponsor or guardian men,
    followed by parents and relations; the high priest calls on devils, and an uproar
    made secretly by men with bamboo trumpets is believed by women and children to
    be made by devils.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: As each Kakian boy enters the shed, a chopping sound, cry, and blood-dripping
    sword or spear appear; the passage explains this as a token that the boy's head
    has been cut off and that the devil has carried him to the other world for regeneration
    and transformation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In some places, the boys are pushed through an opening shaped like crocodile
    jaws or a cassowary beak, and it is then said that the devil has swallowed them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kakian boys remain in the shed for five or nine days, hear trumpets and
    weapons, bathe daily, are smeared with yellow dye, and receive one or two tattooed
    crosses on the breast or arm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Kakian novices must sit motionless in a crouching posture; a chief speaks
    through a trumpet in strange tones imitating spirits, warns them under pain of
    death to keep the society's rules and secrecy, and priests teach them conduct
    toward blood relations as well as tribal traditions and secrets.
  category: speech
  evidence_refs:
  - ev:8
