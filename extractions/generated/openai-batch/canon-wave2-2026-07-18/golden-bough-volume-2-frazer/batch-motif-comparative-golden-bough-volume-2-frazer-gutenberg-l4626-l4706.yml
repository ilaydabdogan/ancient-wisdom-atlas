- id: motif:2
  label: annual expulsion of human or personified scapegoat
  taxonomy_refs: []
  basis: Halberstadt has an annual chosen man expelled from church during Lent; Entlebuch
    annually drives Posterli from the village into neighboring territory.
  evidence_refs:
