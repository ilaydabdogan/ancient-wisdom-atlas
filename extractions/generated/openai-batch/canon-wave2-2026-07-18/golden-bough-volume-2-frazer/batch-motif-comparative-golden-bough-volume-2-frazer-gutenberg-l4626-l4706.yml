canonical_text:
  quote: ''
  summary: Frazer surveys examples of scapegoat rites involving humans, personified
    figures, animals, and divine or inspired men. The passage describes Halberstadt’s
    Lenten “Adam,” Entlebuch’s expulsion of “Posterli,” Malabar cows bearing transferred
    sins, Egyptian bull sacrifice, Gond possession by Ghansyam Deo, and an Albanian
    Moon-temple sacrifice interpreted as transferring communal sins and misfortunes
    to a divine human victim.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Halberstadt, a man was chosen each year and was believed to be stained
    with heinous sins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Halberstadt man was brought to church on the first day of Lent in mourning
    garb with his head muffled, then turned out after the service.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During Lent the Halberstadt man walked barefoot through the city, did not
    enter churches, did not speak to anyone, was fed by canons, and slept in the streets
    after midnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before Good Friday the Halberstadt man was readmitted to church, absolved,
    given money, called Adam, and considered to be in a state of innocence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Entlebuch, “Posterli” was driven from the village into neighboring lands;
    it could be represented by a lad disguised as an old witch, goat, or ass, or by
    a puppet drawn in a sledge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Entlebuch driving-out ceremony used loud horns, clarionets, bells, whips,
    and similar noisemakers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Malabar, Bramins were said to transfer the people’s sins into one or more
    cows, which were then carried away to an appointed place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Egyptian bull sacrifice, evils that might otherwise befall the people
    and Egypt were invoked upon the bull’s head, after which the head was sold to
    Greeks or cast into the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage reports signs of Egyptian cattle sanctity: cows were holy, bulls
    required marks and priestly sealing for sacrifice, Apis and Mnevis were worshipped,
    dead bulls were buried, and mourners beat their breasts at a bull sacrifice in
    Isis rites.'
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Frazer states an inference that the Egyptian slain bull bearing popular misfortunes
    was once a divine scapegoat, and also mentions a Madi lamb and a Zuni turtle as
    possible divine scapegoat examples.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Among the Gonds, Ghansyam Deo was worshipped as protector of the crops, and
    the god was said to descend on the head of a worshipper who then staggered and
    rushed into the jungle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports the idea that the Gond worshipper was singled out as a
    scapegoat for the sins of the rest of the village.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the Albanian Moon temple of the Eastern Caucasus, sacred slaves included
    inspired men who prophesied; a man showing unusual inspiration and wandering in
    the woods was bound with a sacred chain and kept in luxury for a year.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: At the end of the year, the Albanian inspired man was anointed, led out, pierced
    through the side and heart with a sacred spear, and omens for the commonwealth
    were drawn from how he fell.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The Albanian victim’s body was taken to a place where all the people stood
    on it as a purificatory ceremony; Frazer explicitly interprets this as indicating
    transfer of sins to the victim.
  category: action
  evidence_refs:
  - ev:13
