canonical_text:
  quote: ''
  summary: 'Frazer distinguishes two forms of animal worship: animals revered and
    spared, and animals revered because they are killed and eaten. He links these
    to two forms of sacramental killing of an animal god, contrasts Egyptian and Aino
    types, and gives examples involving pastoral tribes, Abchases shepherds, and Kalmuck
    consecration and killing of a white ram.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes animal worship in which animals are respected and
    neither killed nor eaten from animal worship in which animals are revered because
    they are habitually killed and eaten.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Both forms of animal reverence are described as aiming at benefits from the
    animal: protection, advice, help, non-injury, or the material benefit of flesh
    and skin.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: North American Indians are presented as revering and sparing totem animals
    while also revering animals and fish used for subsistence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Australian aborigines are described as having primitive totemism and as using
    sympathetic magic, rather than conciliation of killed animals, to secure game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage maps the two forms of animal worship onto two forms of killing
    the animal god: rare solemn killing of a usually spared animal, and atoned killing
    of an animal from a habitually killed species.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage labels the type involving a habitually spared species as the Egyptian
    type and the type involving a habitually killed species as the Aino type.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pastoral tribes are described as consecrating one herd animal, eating it sacramentally
    in the family circle, and treating its bones with ceremonial respect on behalf
    of all cattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Abchases shepherds are described as eating a spring common meal with loins
    girt and staffs in hand; the meal is interpreted in the passage as both sacrament
    and oath of mutual help and support.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rich Kalmucks are described as consecrating a white ram called the ram of
    heaven or ram of the spirit, never shearing or selling it, and killing and eating
    the old ram when a new one is to be consecrated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Kalmuck rite, a sorcerer kills the old ram after sprinkling it with
    milk; its flesh is eaten, its skeleton and some fat are burned on a turf altar,
    and its skin with head and feet is hung up.
  category: sequence
  evidence_refs:
  - ev:5
