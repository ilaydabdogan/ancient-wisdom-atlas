canonical_text:
  quote: ''
  summary: Frazer argues that Egyptian attitudes toward pigs involved sacred ambivalence
    rather than simple uncleanness. He links the pig or boar with Set/Typhon, Osiris,
    Horus, Ra, annual pig sacrifice, corn-spirit symbolism, and later reinterpretations
    in which a former divine representative becomes treated as a divine enemy. He
    compares these patterns with Proserpine at the Thesmophoria, European harvest
    animal killings, red-haired men, Roman red-haired puppies, and red oxen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents Egyptian beliefs and customs about the pig as involving
    supernatural power and mixed reverence and abhorrence rather than simple uncleanness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eudoxus is reported to have said that Egyptians spared pigs because, after
    the Nile subsided, swine were released into fields to tread seed into moist earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the pig came to be regarded in Egypt as an embodiment of
    Set or Typhon, described as the enemy of Osiris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage recounts that Typhon, in the shape of a boar, menaced Horus's
    eye; Horus burned him and instituted pig sacrifice after Ra declared the pig abominable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage recounts a story that Typhon was hunting a boar when he discovered
    and mangled Osiris's body, and that this was given as the reason for an annual
    pig sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that an animal killed as a solemn sacrifice once a year
    is generally treated as divine, being spared the rest of the year and slain in
    the character of a god.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author argues that the pig sacrificed to Osiris was originally a god and
    Osiris himself, but was later distinguished from Osiris and opposed to him as
    an enemy.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage links the boar in cornfields with the corn-spirit and states that
    the wild boar's damage to corn later helped construe it as the corn-spirit's enemy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says pigs were sacrificed to Osiris on the day tradition said
    Osiris was killed, making the pig killing an annual representation of Osiris's
    killing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage compares the Osiris pig killing with pigs thrown into caverns
    at the Thesmophoria to represent Proserpine's descent, and with European harvest
    killing of animals as corn-spirit representatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says red-haired men were burned and their ashes scattered with
    winnowing-fans, and interprets them as former representatives of Osiris or the
    corn-spirit later explained as Typhon representatives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says red oxen were sacrificed by Egyptians because of their resemblance
    to Typhon, while suggesting that they were originally slain because of resemblance
    to the corn-spirit Osiris.
  category: relationship
  evidence_refs:
  - ev:8
