candidate_motifs:
- id: motif:1
  label: Sacred animal under taboo and awe
  taxonomy_refs: []
  basis: The passage describes the pig as an animal endowed with supernatural powers
    and treated with a blended reverence and abhorrence.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is Frazer's explanation of Egyptian customs, not a direct primary-source
    ritual description.
- id: motif:2
  label: Annual sacrifice of a divine animal
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: The author states that an animal solemnly sacrificed once a year is generally
    divine, and applies this to the annual pig sacrifice to Osiris.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The general rule is asserted by the author and needs human review against
    primary evidence.
- id: motif:3
  label: Ritual victim as both god and enemy of god
  taxonomy_refs:
  - duality
  - sacrifice
  basis: The pig is argued to have been originally Osiris or the corn-spirit but later
    treated as Typhon or Osiris's enemy; red-haired men and red oxen are presented
    as similar cases.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The motif depends on Frazer's reconstruction of an earlier stage behind
    later mythological explanations.
- id: motif:4
  label: Corn-spirit embodied in animal or human representatives
  taxonomy_refs:
  - seasonal_cycle
  - sacrifice
  basis: The passage identifies pig or boar, harvest animals, red-haired men, Roman
    red-haired puppies, and red oxen as representatives of the corn-spirit that are
    killed or sacrificed.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage compares several traditions at a high level; details are compressed.
- id: motif:5
  label: Boar attacks or kills a vegetation-associated god
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage reconstructs an older story in which Osiris, like Adonis and
    Attis, was slain or mangled by a boar or by Typhon in boar form.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The older story is explicitly presented as the author's interpretation
    rather than a directly quoted myth.
- id: motif:6
  label: Ritual representation of descent into the lower world through caverns
  taxonomy_refs: []
  basis: The passage says pigs thrown into caverns at the Thesmophoria annually represented
