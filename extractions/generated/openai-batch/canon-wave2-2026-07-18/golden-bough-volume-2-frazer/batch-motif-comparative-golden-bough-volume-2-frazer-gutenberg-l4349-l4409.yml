canonical_text:
  quote: ''
  summary: The passage surveys reported ceremonies in Timorlaut, Buro, Ceram, Amboina,
    Babar, Tikopia, and the Nicobar Islands in which sickness, disease-demons, or
    related misfortune are addressed through ritual vessels, offerings, substitutes,
    branches, animals, noise, procession, water, and fire. Several rites send a prao,
    canoe, bark, or model boat away by sea or river after loading it with representations,
    provisions, disease-carriers, or a captured demon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Timorlaut, a small prao containing the image of a man and provisions for
    a long voyage is set adrift to mislead demons said to be causing sickness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Timorlaut launch, people address sickness and tell it to leave; three
    days later a pig is killed and part of its flesh is offered to Dudilaa with a
    request that the people be made well.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: If the Timorlaut prao strands at an inhabited place, the passage says sickness
    will break out there; coast people burn a stranded prao because demons are said
    to fly from fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Buro, the prao that carries away demons of disease is described as about
    twenty feet long and equipped with sails, oars, anchor, and provisions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Buro rite, people beat gongs and drums and rush about to frighten demons;
    ten young men strike people with water-dipped branches, put the branches on the
    disease-burdened prao, tow it far out to sea, and address Grandfather Small-pox.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Buro men return from setting the prao adrift, all the people bathe
    together in the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explains the Buro branch-striking as a means of transferring disease-demons
    to the branches before the branches are removed by boat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In inland Ceram, a priest strikes houses with consecrated branches during
    sickness and throws the branches into a river; the passage compares this with
    Wotyak sticks used to expel devils and then thrown into a river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Amboina, a patient’s body is rubbed with a live white cock, which is then
    placed on a little prao and committed to the waves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Babar archipelago, a bark meant to carry away the sickness of a village
    contains ashes from every kitchen and a bowl into which all sick people have spat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that puppets are sometimes put in boats to represent sick
    persons and lure demons after them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Tikopia, during an epidemic cough, a flower-adorned little canoe is carried
    around the island by four sons of principal chiefs, accompanied by the population,
    before being launched on the sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Nicobar Islands, sickness or failure to catch fish is blamed on spirits;
    offerings are prepared, a pig is roasted, and portions are offered to shades.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Nicobar rite, priests with reddened faces pretend to catch the demon
    of disease, force it into a leaf model boat decked with garlands, and tow the
    boat far out to sea so that it is unlikely to return.
  category: sequence
  evidence_refs:
  - ev:9
