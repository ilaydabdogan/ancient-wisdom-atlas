candidate_motifs:
- id: motif:1
  label: Disease sent away in a ritual vessel
  taxonomy_refs:
  - ark_vessel
  basis: Multiple reported rites use a prao, bark, canoe, or model boat to carry sickness,
    disease-demons, or a captured demon away over water.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy reference is functional and analogical; the passage describes
    ritual disease-expulsion vessels, not a flood ark narrative.
- id: motif:2
  label: Transfer of illness to substitute carriers
  taxonomy_refs: []
  basis: The passage reports disease-demons or sickness being transferred to branches,
    a white cock, bowls of ashes and spittle, and human images or puppets before removal.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage explicitly explains transfer for the branches; for some other
    carriers, transfer is inferred from their placement in the disease-removal vessel.
- id: motif:3
  label: Apotropaic fire against demons
  taxonomy_refs: []
  basis: A stranded Timorlaut prao is burned because demons are said to fly from fire.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This occurs as one element within the Timorlaut report rather than as
    a full independent rite in the passage.
- id: motif:4
  label: Propitiatory offering for healing or relief
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Pig flesh is offered to Dudilaa with a request to make the village well,
    and Nicobar offerings are made to spirits or shades when sickness or lack of fish
    is blamed on spirits.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: medium
  cautions: Not every ceremony in the passage involves offering; recipients and stated
    purposes vary.
- id: motif:5
  label: Communal noise, procession, and purification in epidemic rite
  taxonomy_refs: []
  basis: Buro participants beat gongs and drums and later bathe in the sea; Tikopia
    participants carry a canoe around the island with cries and beating of bushes
    before launching it.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The passage presents these as features of two examples, not as a universal
    requirement of the boat-expulsion pattern.
- id: motif:6
  label: Waterborne removal of a baleful burden
  taxonomy_refs: []
  basis: Rivers, tides, waves, and the sea repeatedly function as routes by which
    the sickness, devils, or disease-burden is carried away and kept from returning.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: This is a ritual pattern in a comparative scholarly passage, not a single
    narrative episode.
comparison_claims:
- id: claim:1
  claim: The passage supports identifying a shared motif of sending sickness or disease-demons
    away in a ritual vessel across the East Indian examples and the Tikopia and Nicobar
    examples.
  claim_level: same_motif
  target: Disease-expulsion boat rites in Timorlaut, Buro, Amboina, Babar, Tikopia,
    and the Nicobar Islands
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage presents a comparative pattern only; it does not establish
    historical contact, diffusion, or common inheritance.
- id: claim:2
  claim: 'The passage explicitly compares the Ceram and Wotyak practices as having
    the same function: objects used to expel sickness or devils are thrown into a
    river so the current removes the harmful burden.'
  claim_level: same_function
  target: Ceram consecrated branches and Wotyak devil-expelling sticks
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is functional; the passage gives no evidence for a direct
    relationship between the communities.
- id: claim:3
  claim: Branches, the white cock, ashes, spittle, and puppets/images can be cautiously
    compared as substitute carriers or media for transferring sickness or demons before
    removal.
  claim_level: same_function
  target: Substitute-carrier pattern in disease-expulsion rites
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The transfer mechanism is stated clearly for branches; other objects
    are reported as included in removal rites, but the passage gives less explicit
    explanation for each.
- id: claim:4
  claim: The Timorlaut image of a man in the prao and the stated practice of placing
    puppets in boats both support a comparison based on human representations luring
    demons away from sick persons.
  claim_level: same_motif
  target: Human-representation lure in disease boat rites
  evidence_refs:
  - ev:1
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The general puppet practice is mentioned without naming a specific
    community in this passage.
- id: claim:5
  claim: The Timorlaut offering to Dudilaa and the Nicobar offerings to spirits or
    shades can be compared as propitiatory exchanges directed to nonhuman recipients
    in contexts of sickness or misfortune.
  claim_level: same_function
  target: Propitiatory offerings to nonhuman recipients for communal relief
  evidence_refs:
  - ev:2
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The Timorlaut passage requests healing from Dudilaa, while the Nicobar
    passage includes both sickness and lack of fish; the recipients are not identical.
