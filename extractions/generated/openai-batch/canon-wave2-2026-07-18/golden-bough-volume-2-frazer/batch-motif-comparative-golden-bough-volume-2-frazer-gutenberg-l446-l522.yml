canonical_text:
  quote: ''
  summary: The passage surveys harvest and threshing customs in which a goat, goat-name,
    goat-skin, straw goat, or related effigy is treated as an embodiment or representative
    of the corn-spirit. It describes cutting, chasing, killing, eating, preserving,
    wearing, threshing, transferring, or naming practices connected with the last
    grain or unfinished harvest work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the corn-spirit is sometimes believed to appear as
    a goat and to be slain on the harvest-field by a sickle or scythe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near Bernkastel, reapers determine their order by lot; a slower reaper may
    be isolated in a patch called the Goat and mocked, and the tail-bearer cutting
    the last ears is said to cut off the Goat's neck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near Grenoble, a live goat is decorated, chased, caught, held by the farmer's
    wife, and beheaded by the farmer; its flesh is eaten at the harvest supper, some
    is preserved until the next harvest, and its skin is made into a cloak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The goat-skin cloak is worn by the farmer in bad weather at harvest-time and
    given to a reaper with back pains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage connects back pains and wounds during reaping with the corn-spirit
    and gives examples of healing or protection through a cat, first ears of corn,
    or the first handful of ears.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near Marktl, sheaves are called Straw-goats or Goats; the last sheaf is adorned
    with flowers and cakes, placed in the middle of the heap, torn at by some threshers,
    and struck with flails by others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Oberinntal the last thresher is called Goat; at Tettnang the thresher giving
    the last stroke before turning the bundle is called He-goat, and the one giving
    the final stroke after turning is called She-goat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the Tettnang custom implies that the corn is inhabited
    by a male and female pair of corn-spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In several threshing customs, a straw goat or goat effigy is taken or set
    at the farm or barn of a neighbor whose threshing is not finished, sometimes in
    exchange for wine or money and sometimes with punishment if the carrier is caught.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Zabern, a farmer lagging behind in threshing may have a real stuffed goat
    or fox set before his door.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Traunstein district, the Oats-goat is thought to be in the last sheaf
    of oats, represented by an old rake with an old pot for a head, and children are
    told to kill it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A stranger passing a harvest-field may be treated as the Corn-goat escaping
    in human shape, and laborers may shout 'He-goat!' at the stranger or at a person
    who fails to remove his hat during rape-seed threshing in Schleswig.
  category: speech
  evidence_refs:
  - ev:8
