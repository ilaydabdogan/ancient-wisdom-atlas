  quote: ''
  summary: This index excerpt lists comparative-religion entries from Loango to Mirrors,
    including sacred and tabooed kings, puberty and menstruation seclusion, harvest
    and corn customs, May and Midsummer customs, fire festivals, sacred animals, soul
    and shadow beliefs, hair and nail taboos, first-fruits, sacrifices, scapegoats,
    and expulsion of devils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Loango entries mention a king deposed when the harvest fails, supernaturally
    endowed kings, restrictions around seeing the king eat, confinement after coronation,
    burial of food left by the king, food restrictions, and seclusion of girls at
    puberty.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Midsummer entries mention pageants in London, a fire ceremony at Luchon,
    a fire festival in Masuren, fires in Metz, European fire festivals, burning of
    effigies in Midsummer fires, Midsummer Eve superstitions, and magic plants gathered
    on Midsummer Eve.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Harvest and corn entries mention customs at Longnor, Lüneberg, Marktl, and
    Mecklenburg; the last handful of corn called the Maiden; a mother of maize; a
    lament called Maneros at cutting the first sheaf; and the corn-spirit as a mare.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Entries mention carrying out Death in Lusatia, a human scapegoat in Marseilles,
    a Malagasy vehicle for transference of ills, expulsion of devils by the Mandan
    Indians, and driving away the devil or devils by the Miaotse and Minahassa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Soul-related entries mention a child’s life supposed to be bound up with a
    tree among the M’Bengas, an external soul in a Malay poem, Malays and the soul,
    bringing back the soul in Melanesia, a warrior’s shadow in Mangaia, Melanesian
    stones and a man’s shadow, and a tree superstition of the Miris.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hair, nail, and head entries mention burying nail parings by the Madi, the
    use of cut hair in magic, burning or burying cut hair by the Makololo, burying
    hair and nail cuttings in the Maldives, Malays not touching a man’s head, Maori
    sacredness of the head and hair-cutting ceremony, Marquesan shaving of the head,
    and the Mikado’s hair and nails being cut.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Entries mention Maori fear of the blood of women, seclusion of women during
    menstruation, and dread of menstruous blood.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Animal-related entries mention a crocodile not killed in Madagascar, a goat
    sacred to the Madenassana bushmen, reverence for the cow in Malabar, a lamb killed
    sacramentally by the Madi, resurrection of the bison among the Minnetaree Indians,
    and tiger’s flesh eaten by the Miris.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sacrifice entries mention human sacrifices by the Marimos, a human scapegoat
    in Marseilles, sacrifice of new-born babes in Mexico, human sacrifice at a harvest
    festival in Mexico, and incarnate gods slain in Mexico.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Consumption entries mention men eaten to obtain their qualities, Mexican sacraments
    in which paste images of the god are eaten, Minahassa blood drinking at festivals,
    and tiger’s flesh eaten by the Miris.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Maori entries include offerings of first-fruits.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Human-divinity entries mention men gods in the South Sea Islands, Mangaia
    priests called gods, a man-god entry, men deified in their lifetime in the Marquesas
    Islands, and milkmen worshipped by the Todas.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: May entries mention a May bride, May Day carols and customs, a May king, May
    poles, a May queen, a sleeping bridegroom, May trees, and a May Day custom in
    Mayenne.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Mikado entries mention his life, cooking of his food, effects of wearing
    his clothes without leave, cutting his hair and nails, and his not being allowed
    to touch the ground.
  category: attribute
  evidence_refs:
  - ev:14
