canonical_text:
  quote: ''
  summary: Frazer surveys midsummer fire customs in Slavonic, Baltic, Greek, Mediterranean,
    and North African settings, including bonfires, fire-jumping, driving cattle through
    or over fire-sites, making new fire by friction, tree or torch burning, prayers
    for crops or fruit trees, and the burning or destruction of human-shaped effigies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Russia, fires are lit and young people crowned with flowers jump through
    them, while cattle are also driven through them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Little Russia, a straw-wrapped stake is set on fire on St. John’s Night,
    and women throw birch boughs into the flames with a spoken wish for tall flax.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Ruthenia, bonfires are kindled from fire produced by friction; elders perform
    the operation while others observe silently, after which songs begin, young people
    leap in couples through the smoke or flames, and cattle are driven through it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Prussia and Lithuania, Midsummer Eve fires are lit on heights and are said
    to protect against thunder, hail, and cattle disease, especially if cattle cross
    the burned places the following morning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In parts of Masuren, all village fires are extinguished, a wheel on an oaken
    stake is revolved until friction produces fire, and households take flame from
    the new fire to relight domestic hearths.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Bohemia, cows were formerly driven over midsummer fires to protect them
    from witchcraft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Servia, herdsmen light birch-bark torches, march around sheepfolds and
    cattle-stalls, climb hills, and let the torches burn out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: In Greece, women light fires on St. John’s Eve and jump over them while declaring
    that they leave their sins behind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In Corsica, people set fire to a tree trunk or whole tree on St. John’s Eve,
    and young men and maidens dance around the blaze called fucaraja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: In Algeria and Morocco, Mohammedans are reported to kindle midsummer bonfires
    of straw, throw incense and spices into them through the night, and invoke divine
    blessing on fruit trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: At Rottenburg, a straw-wrapped stump fashioned as a human figure called the
    angel-man is covered with flowers, burned, attacked by boys with swords, cut to
    pieces, and followed by leaping over the fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the Tyrol, a straw-man called the Lotter is carted through the village
    on Midsummer Day and burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In French Flanders, a straw male figure was burned in the midsummer bonfire,
    while a female figure was burned on St. Peter’s Day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Grätz, a puppet called the Tatermann was dragged to a bleaching-ground
    and pelted with burning besoms until it caught fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: In parts of Russia, a figure of Kupalo is burned or thrown into a stream on
    St. John’s Night; another Russian custom carries a straw effigy of Kupalo over
    the midsummer bonfire.
  category: action
  evidence_refs:
  - ev:6
