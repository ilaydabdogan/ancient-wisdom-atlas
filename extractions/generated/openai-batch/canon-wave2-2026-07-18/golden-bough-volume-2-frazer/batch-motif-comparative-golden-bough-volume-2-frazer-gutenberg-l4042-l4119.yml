canonical_text:
  quote: ''
  summary: 'Frazer surveys several seasonal or periodic rites described as expulsions
    of devils or as having that appearance: post-harvest devil-driving among Hindoo
    Koosh tribes; a Khond seed-time rite involving a car carrying seed for evil spirits;
    a Balinese dark-moon district expulsion with offerings, torches, noise, and subsequent
    silence; and a Fijian annual ceremony timed by the balolo sea-slug, marked by
    prayer, uproar, silence, feast, and final clatter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among some Hindoo Koosh tribes, as among the Hos and Mundaris, devils are
    expelled after harvest to drive evil spirits from granaries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hindoo Koosh example, a porridge called mool is eaten, the family head
    fires a matchlock into the floor, then goes outside and continues loading and
    firing until the powder horn is exhausted, while neighbors do the same.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The day after the Hindoo Koosh firing rite is spent in rejoicing, and in Chitral
    the festival is called devil-driving.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Khonds of India expel devils at seed-time and worship Pitteri Pennu, described
    as the god of increase and gain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Khond rite, a rude car is made from a basket on sticks and bamboo rollers;
    the priest first takes it to the lineal head of the tribe and then to all houses,
    receiving seed and feathers from each.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Khond car is taken to a field outside the village with young men in attendance,
    who beat each other and strike the air with long sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The seed carried out in the Khond car is called the share of the evil spirits,
    spoilers of the seed; the car and contents are abandoned to them so they will
    not interfere with the remaining seed-corn.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: After the Khond car rite, each household kills a hog over the year's seed
    and prays to Pitteri Pennu; elders feast, young men pelt the returning elders
    with jungle fruit, and on the third day the lineal head sows first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: In Bali, large-scale periodic expulsions of devils are usually held on the
    dark moon of the ninth month when the country is considered warm from long-unmolested
    demons.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the Balinese rite, offerings are placed for devils at a cross-road near
    the principal temple, prayers are recited, and a horn blast summons the devils
    to the meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Balinese men light torches at a holy lamp before the chief priest, move through
    streets and lanes crying for the devils to depart, while householders knock loudly
    on doors, beams, rice-blocks, and other objects.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: In the Balinese account, fiends flee to the prepared banquet, where the priest
    receives them with curses that finally drive them from the district.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: After the Balinese expulsion, silence is kept through the next day; people
    remain on their premises, household work including cooking stops, watchmen alone
    may appear, and wreaths of thorns and leaves warn strangers from entering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:14
  text: On the third day in Bali the state of siege is raised, but work in rice-fields
    and buying and selling in the market remain forbidden, and many people still stay
    home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:15
  text: In Fiji, an annual ceremony with the aspect of an expulsion of devils is timed
    by the appearance of balolo, a fish or sea-slug that swarms from coral reefs on
    one day of the year.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:16
  text: At places where balolo are taken, the sea-slug's appearance signals a general
    feast, and an influential man ascends a tree to pray to the spirit of the sky
    for good crops, fair winds, and related benefits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:17
  text: In the Fijian ceremony, people make a tremendous clatter with drumming and
    shouting for about half an hour, followed by four days of dead quiet, feasting,
    and prohibition of all work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:18
  text: At daylight after the fourth night in Fiji, the town becomes uproarious as
    men and boys knock on house doors with clubs and sticks and cry Sinariba, concluding
    the ceremony.
  category: action
  evidence_refs:
  - ev:4
