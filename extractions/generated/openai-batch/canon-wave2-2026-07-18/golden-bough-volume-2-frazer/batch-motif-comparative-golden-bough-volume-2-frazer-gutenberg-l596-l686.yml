canonical_text:
  quote: ''
  summary: Frazer surveys European harvest and threshing customs in which the corn-spirit
    is represented as a cow, bull, ox, calf, horse, or mare. The final thresher or
    last sheaf may receive an animal name, costume, effigy, or ritual treatment; the
    corn-spirit may be passed to a neighbor whose crop is unfinished; and some customs
    describe killing or slaughtering an ox/bull at the close of reaping or threshing.
    The passage also treats the young corn-spirit as born in calf form and compares
    horse/mare harvest rites such as crying the Mare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the corn-spirit may hide among cut corn in the barn
    and reappear in bull or cow form at threshing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Wurmlingen example, the man who gives the last threshing stroke is
    called a crop-specific Cow, covered in straw, given stick horns, led by ropes
    to a well, and made to low like a cow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Obermedlingen example, the person who gives the last stroke gets a
    straw Cow figure tied to his back, has his face blackened, is tied to a wheelbarrow,
    and is wheeled around the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Swiss and Hungarian examples call the last thresher Cow, Corn-bull, or Thresher-cow
    and may wrap him in straw, bind him to a tree, or envelope him in a cow hide with
    horns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage explicitly describes a recurring confusion between anthropomorphic
    and theriomorphic conceptions of the corn-spirit.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:6
  text: In Pessnitz and Herbrechtingen, a straw-man or ragged old woman effigy associated
    with the Cow is placed before or thrown into the premises of a neighbor or farmer
    who has not finished threshing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Several examples describe the bull or ox form of the corn-spirit as killed
    at threshing or after reaping, including a real ox slaughtered and eaten by the
    threshers at Chambéry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the young corn-spirit may be born in calf form on
    the field, with harvest actions interpreted as the sheaf giving birth to a calf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes a mythical calf in sprouting spring corn and reports
    Mannhardt's view that it is the same animal later believed to be killed at reaping.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The corn-spirit is also described as appearing in horse or mare form, including
    a Hertfordshire rite where the last standing blades are tied together, called
    the Mare, and cut by thrown sickles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Hertfordshire and Shropshire mare customs include shouted dialogue and
    the sending or pretended offering of the mare to a neighbor or lagging farm whose
    corn is not yet fully reaped.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
