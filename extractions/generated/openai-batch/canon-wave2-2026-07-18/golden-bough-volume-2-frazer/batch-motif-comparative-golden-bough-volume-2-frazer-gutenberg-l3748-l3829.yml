canonical_text:
  quote: ''
  summary: The passage compiles several reported ceremonies for expelling devils,
    demons, evil spirits, or ghosts thought to cause illness, infertility, or communal
    danger. Examples include a Nias exorcism using a roof, pole, palm-leaf rope, pig,
    and good spirit; village-wide expulsions using closed gates, noise, weapons, and
    temporary exclusion; Burmese anti-cholera uproar; Kumi smallpox rites involving
    a killed monkey and blood; a Great Bassam fertility-related exorcism with offerings
    and weapons; a Huron ceremony involving disorder, fire, dreaming, and gifts; and
    an Australian annual ceremony in which painted performers drive away ghosts of
    the dead for twelve months.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Nias example, a sorcerer treats a seriously ill man by setting up a
    pole, stretching a palm-leaf rope from the pole to the house roof, killing a pig
    on the roof, and letting the pig roll to the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Nias devil causing illness is described as descending by the palm-leaf
    rope to get the pig, while a good spirit invoked by the sorcerer prevents the
    devil from climbing back up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the first Nias remedy fails, men shut the house except for one dormer-window,
    slash with swords, and make noise with gongs and drums so that devils flee through
    the roof opening and down the rope.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Nias epidemic, village gates are closed except one, people make loud
    noise and brandish swords, the devils are driven out, and the final gate is shut;
    for eight days no one may enter the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Burmese cholera example, able-bodied men climb on roofs and strike
    with bamboos and wood, while the rest of the population makes a loud din for three
    successive nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Burmese uproar is said to be directed against cholera demons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Kumi smallpox example, villages are placed under entry-and-exit restrictions;
    a monkey is killed, hung at the village gate, and its blood mixed with river pebbles
    is sprinkled on houses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Kumi rite, each house threshold is swept with the monkey’s tail, and
    the fiend is adjured to depart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Great Bassam, women who wish to become mothers offer wine-vessels or statuettes
    of women suckling children, assemble in a fetish hut, and are sprinkled with rum
    by a priest while young men fire guns and brandish swords.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Huron ceremony called Lonouyroya, men run through the village, break
    and upset things in wigwams, throw fire and burning brands, and howl and sing
    throughout the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Huron ceremony, participants dream of an object, then visit wigwams
    asking for presents until they receive the thing dreamed of; receiving it is associated
    with assured health, while not receiving it is associated with a sealed fate.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that occasional ceremonies of this kind tend to become
    periodic, commonly annual, so that a community may make a fresh start after a
    general riddance of evil spirits.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Australian example on the Barwan River, performers sing and beat time
    with boomerangs while a body-painted man with feathers stands still looking for
    ghosts, then moves and rushes about flourishing a branch.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: More similarly adorned Australian performers join in conflict with invisible
    assailants, and the group is said to be satisfied that the ghosts have been driven
    away for twelve months.
  category: sequence
  evidence_refs:
  - ev:11
