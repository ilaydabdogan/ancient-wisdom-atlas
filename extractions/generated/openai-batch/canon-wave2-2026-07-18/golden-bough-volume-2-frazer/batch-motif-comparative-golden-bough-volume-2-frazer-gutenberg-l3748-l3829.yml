candidate_motifs:
- id: motif:1
  label: illness attributed to intrusive devils, demons, evil spirits, or ghosts
  taxonomy_refs: []
  basis: Several examples explicitly identify illness, cholera, smallpox, barrenness,
    or general maladies as caused by devils, demons, evil spirits, a fiend, or ghosts.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage reports beliefs as summarized by Frazer and his cited sources;
    it does not provide indigenous-language categories except for the Huron ceremony
    name.
- id: motif:2
  label: expulsion of spirits by loud noise and aggressive display
  taxonomy_refs: []
  basis: Nias, Burmese, Great Bassam, Huron, and Australian examples all include loud
    sound, weapons, rushing, striking, or enacted conflict directed at demons, spirits,
    or ghosts.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: Specific instruments and actions vary by case.
- id: motif:3
  label: ritual boundary closure with one escape route
  taxonomy_refs: []
  basis: The Nias house and village examples close all openings except one exit, and
    the Kumi villages are placed under entry-and-exit restrictions during the smallpox
    rite.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: Only the Nias examples explicitly describe a controlled escape route for
    spirits; the Kumi example describes village restrictions but not the same exit
    structure.
- id: motif:4
  label: animal victim used in exorcism or disease expulsion
  taxonomy_refs:
  - sacrifice
  basis: The Nias sorcerer kills a pig during the exorcism, and the Kumi kill a monkey
    whose body, blood, and tail are used in the smallpox rite.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage does not state that all examples use animal victims.
- id: motif:5
  label: periodic annual riddance of evil spirits or ghosts
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage states that occasional ceremonies tend to become periodic, often
    annual, and gives an Australian annual custom expelling ghosts for twelve months.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The annual form is explicitly illustrated for the Australian example;
    the general tendency is Frazer’s comparative framing.
- id: motif:6
  label: dreamed object received as health-assuring gift
  taxonomy_refs: []
  basis: In the Huron Lonouyroya, participants dream of an object and seek presents
    until receiving the dreamed thing, which is associated with assured health.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif is confined to one example in the passage and is not linked
    by the passage to the other rites except as part of a sickness ceremony.
- id: motif:7
  label: fertility exorcism with nursing-mother images
  taxonomy_refs: []
  basis: At Great Bassam, women desiring motherhood offer wine-vessels or statuettes
    of women suckling children before a rite to drive away the spirit believed to
    cause barrenness.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Only one locality in the passage supplies this fertility-focused example.
comparison_claims:
- id: claim:1
  claim: The Nias, Burmese, Kumi, Great Bassam, and Huron examples are presented as
    sharing the ritual function of expelling afflicting spirits associated with illness,
    epidemic, barrenness, or bodily and mental maladies.
  claim_level: same_function
  target: Cross-cultural exorcism of afflicting spirits in the passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional comparison, not historical contact
    or common inheritance; the rites differ in objects, actions, and stated aims.
- id: claim:2
  claim: Several examples use collective noise, weapons, striking, or staged aggression
    as a recurring technique for driving away demons, spirits, or ghosts.
  claim_level: same_motif
  target: Noisy and aggressive spirit-expulsion pattern within the compiled examples
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  limitations: Not every example in the passage centers on noise or armed display;
    the Nias pig diversion and Huron dreamed-object sequence have additional structures.
- id: claim:3
  claim: The passage explicitly frames annual ghost-expulsion ceremonies as a periodic
    development of occasional spirit-riddance rites.
  claim_level: same_function
  target: Occasional exorcism rites and annual communal expulsion of ghosts
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Frazer’s interpretive framing within the passage; it does not
    establish a historical sequence for any specific community.
