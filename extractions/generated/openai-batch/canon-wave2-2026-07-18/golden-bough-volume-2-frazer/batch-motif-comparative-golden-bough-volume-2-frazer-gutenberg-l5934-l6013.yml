canonical_text:
  quote: ''
  summary: The passage surveys midsummer, St. John, and St. Peter fire customs in
    France, England, Wales, the Isle of Man, Ireland, and Scotland. It describes bonfires,
    torches, burning wheels or barrels, leaping or passing through fire, dances around
    fires, and uses of smoke, coals, or torches for fields, crops, cattle, and purification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Poitou, a straw-covered wheel is set on fire and run through fields, which
    are said to be fertilised by it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Poitou, people leap three times over the fire while holding nut-tree branches,
    which are later hung over the cattle-stall door.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Brest, torches are brandished and thrown into the air together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Brittany, midsummer fires burn on hills; people dance round them, sing,
    and leap over glowing embers, and a bonfire may be built round a pole topped with
    a nosegay or crown.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes ignited wooden discs being thrown into the air and,
    at Edersleben near Sangerhausen, a burning tar barrel swung around a high pole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the North of England, midsummer bonfires were lit in streets or on high
    hills; young people leaped over the fires and played games while older people
    watched, and firebrands were carried about the fields.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Herefordshire and Somersetshire, fires were made in fields on Midsummer
    Eve to bless the apples; Devonshire also observed leaping over midsummer fires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Cornwall, bonfires were lit on Midsummer Eve, people marched round them
    with lighted torches, and torches were carried from village to village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On Whiteborough near Launceston, a large bonfire was kindled with a tall summer
    pole and a large bush fixed at its centre.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Isle of Man, fires were lit to windward of every field so that smoke
    would pass over the corn, and blazing furze or gorse was carried several times
    around folded cattle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Ireland, bonfires were held on the eves of St. John Baptist and St. Peter,
    and people carried about tied bundles of reeds that had been set on fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the South of Ireland, bonfires blazed on eminences near habitations, and
    people carried torches around them while shouting and dancing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: An Irish account says people ran through streets and fields with blazing wisps
    of straw on long poles to purify the air, because harmful supernatural beings
    were believed to be abroad that night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: An observer of Ireland in 1782 reported midnight fires on many eminences,
    with people dancing round the fires, passing through them, and making sons, daughters,
    and cattle pass through the fire.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A notice from 1867 reports bonfires across Leinster, people dancing around
    fires, children jumping through flames, and the former practice of carrying live
    coals into cornfields to prevent blight.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: In Scotland, sources mention midsummer or St. Peter’s Day fires and lighted
    torches on mountains and high grounds.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: In the Perthshire Highlands, a cowherd went three times round the fold, following
    the course of the sun, with a burning torch; this was believed to purify flocks
    and herds and prevent diseases.
  category: sequence
  evidence_refs:
  - ev:11
