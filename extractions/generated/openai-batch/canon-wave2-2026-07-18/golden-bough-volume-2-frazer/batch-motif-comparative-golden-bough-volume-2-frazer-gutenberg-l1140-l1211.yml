canonical_text:
  quote: ''
  summary: Frazer discusses Demeter, Proserpine, pigs, and the Thesmophoria. He describes
    pigs as sacred to Demeter and sacrificed in her mysteries, then interprets the
    Thesmophoria rites of casting pigs, dough-cakes, and pine branches into chasms
    as a dramatization of Proserpine or Demeter descending to and returning from the
    lower world. A scholion describes serpents in the caverns, women called drawers
    retrieving decayed remains after purification, and the remains being sown with
    seed-corn for a good crop. Frazer also summarizes an etiological legend about
    Pluto abducting Proserpine and Eubuleus's swine being swallowed, and argues that
    the pigs originally represented Proserpine or Demeter in animal form.
  language: English
  quote_policy: summarized
