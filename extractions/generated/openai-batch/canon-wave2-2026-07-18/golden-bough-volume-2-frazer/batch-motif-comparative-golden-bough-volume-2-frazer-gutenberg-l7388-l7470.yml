candidate_motifs:
- id: motif:1
  label: life bound to an animal double or external counterpart
  taxonomy_refs: []
  basis: Multiple examples state that a human's life, health, existence, prosperity,
    or fate is bound to an animal, serpent, nagual, tona, or animal species.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is a secondary comparative synthesis; individual ethnographic
    claims are not independently evaluated here.
- id: motif:2
  label: death of animal counterpart causes human death
  taxonomy_refs: []
  basis: The Zulu ihlozi, Zapotec tona, Guatemalan or Chontal nagual, Quetzaltenango
    green bird, and Australian animal species are all described as linked to death
    or shortened life when killed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: Some examples concern a known individual animal, while the Australian
    examples concern an unknown individual within a species.
- id: motif:3
  label: ritual quest for animal companion through solitude, sacrifice, dream, and
    blood offering
  taxonomy_refs:
  - initiation
  - sacrifice
  basis: 'The Chontal youth obtains the nagual through a structured sequence: solitary
    withdrawal, prayer to gods, animal sacrifice, sleep or dream, appearance of an
    animal, blood offering, and promised companionship.'
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call the procedure an initiation; the
    taxonomy link is based only on the ritual acquisition sequence.
- id: motif:4
  label: protective taboo toward life-linked animal species
  taxonomy_refs: []
  basis: Australian men and women protect all members of the relevant animal species
    because any one of them may be the animal linked with a human life.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames this as belief and social consequence, not as a formal
    taboo system.
- id: motif:5
  label: serpent as personal guardian or battle double
  taxonomy_refs:
  - serpent
  basis: The Zulu ihlozi is a mysterious serpent guardian, and the naguals of chiefs
    are said to fight in serpent form.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: Serpents are one among several animal forms in the passage; the broader
    motif is not exclusively serpentine.
- id: motif:6
  label: animal double linked to wealth or prosperity
  taxonomy_refs: []
  basis: The passage states that a man without a nagual could never grow rich, and
    the Chontal seeker asks the visionary animal for abundant salt and cacao.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The wealth connection is explicit for the nagual but not for all animal-counterpart
    examples in the passage.
comparison_claims:
- id: claim:1
  claim: The passage treats Zulu ihlozi, Zapotec tona, Guatemalan or Chontal nagual,
    and Australian sex-linked animal species as variants of a pattern in which human
    life or welfare is bound to an animal counterpart.
  claim_level: same_motif
  target: cross-cultural animal double or life-bound counterpart pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is Frazer's secondary framing; the passage does not
    establish historical contact or common inheritance among the traditions.
- id: claim:2
  claim: 'The passage explicitly compares the Australian belief to the Central American
    nagual while noting a difference: Central American examples may involve a known
    individual animal, whereas Australian examples involve an unknown member of a
    species.'
  claim_level: same_function
  target: Central American nagual and Australian sex-linked animal species
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim concerns functional similarity in the passage, not identity
    of ritual context or historical relationship.
- id: claim:3
  claim: The passage compares the killing of the green bird followed by the Indian
    chief's death to the fairy-tale pattern in which killing Punchkin's parrot causes
    Punchkin's death.
  claim_level: same_motif
  target: Punchkin fairy tale parrot life-bound motif
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Punchkin narrative itself is only alluded to, not narrated in this
    passage.
- id: claim:4
  claim: The passage compares the killing of any protected Australian animal species
    member to the killing of the green bird linked with the Indian chief, because
    both are said to entail or immediately accompany human death.
  claim_level: same_function
  target: Australian protected species and Quetzaltenango green bird nagual
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The Australian examples concern uncertain species-membership rather
    than a known personal animal double.
