canonical_text:
  quote: ''
  summary: Frazer surveys beliefs in personal or group animal counterparts among Zulus,
    Zapotecs, Guatemalan and Chontal Indians, and South Eastern Australian tribes.
    The passage emphasizes that a human life, health, wealth, or fate may be regarded
    as bound to a serpent, animal double, nagual, tona, or sex-linked animal species,
    and it describes rituals, protections, deaths, and fights arising from that belief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Zulus are described as believing that every man has an ihlozi, a mysterious
    serpent that guards and helps him and remains underground.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Zulu example, a man without an ihlozi must die; if an ihlozi serpent
    is unintentionally killed, the corresponding man dies, while the serpent comes
    to life again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Zapotecs, relatives draw and erase animal figures on the floor during
    a woman's confinement, and the figure remaining at birth is called the child's
    tona or second self.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Zapotec child later obtains the animal represented by the tona and cares
    for it because the child's health and existence are believed to be bound up with
    the animal's life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among Indians of Guatemala, the nagual or naual is described as an animate
    or inanimate object, usually an animal, standing in a parallel relation to a particular
    man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Chontal procedure for obtaining a nagual includes going alone to a forest
    place by a river or to a mountain top, praying to the gods, sacrificing a dog
    or bird, and lying down to sleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Chontal account, a jaguar, puma, coyote, crocodile, serpent, or bird
    appears in a dream or after waking, and the seeker offers it blood from the tongue,
    ears, and other body parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The visionary animal tells the seeker that the first animal encountered on
    a specified hunting day will be itself and will always be the seeker's companion
    and nagual.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that a man without a nagual could never grow rich, and
    that the Indians believed the death of a nagual would entail the owner's own death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A legend says the naguals of Indian chiefs fought the Spaniards in serpent
    form, and that the highest chief's nagual appeared as a great green bird.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the legend, Pedro de Alvarado kills the great green bird with a lance,
    and at the same moment the Indian chief falls dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In many Australian tribes, each sex regards a particular animal species as
    life-linked, but individuals do not know which member of the species is their
    own counterpart.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Because the linked individual animal is unknown, men or women spare and protect
    all animals of the relevant species.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Among the Wotjobaluk, the bat is called the life of a man and the nightjar
    the life of a woman; when either creature is killed, the life of some man or woman
    is believed to be shortened.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Wotjobaluk belief is described as causing fights between men and women,
    with women using yamsticks and men sometimes injuring or killing women with spears.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: At Gunbower Creek, the bat is described as linked to women, and people would
    not kill it because a woman would be sure to die in consequence.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Where the bat is the men's animal, men protect it strongly; where the fern
    owl or large goatsucker is the women's animal, women protect it and may strike
    a man who kills one.
  category: action
  evidence_refs:
  - ev:9
