canonical_text:
  quote: ''
  summary: The passage describes the Creek busk, an annual first-fruits ceremony held
    when corn ripens. It includes avoidance of the new harvest before the rite, destruction
    of old provisions and objects, extinguishing of old fires, cleansing of houses
    and sacred spaces, fasting and purgation, kindling and distribution of a new sacred
    fire, first-fruit offerings to the holy spirit of fire, dances, mock battle, continence,
    smearing with white clay, and bathing in running water before communal departure
    in joy and peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Creek busk is described as the chief yearly first-fruits ceremony, held
    in July or August when corn was ripe, and as marking the end of the old year and
    the beginning of the new one.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the ceremony, the people did not eat or handle any part of the new
    harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the busk, people obtained new clothes, utensils, and furniture, gathered
    old clothes, rubbish, old grain, and old provisions into a heap, and burned them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: All village fires were extinguished, ashes were swept away, and the temple
    hearth or altar was dug up and cleared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief priest placed button-snake roots, green tobacco leaves, and a little
    of the new fruits at the bottom of the fireplace, which was then covered with
    white clay and wetted with clean water; a green arbour of young tree branches
    was made over the altar.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women cleaned houses, renewed hearths, and scoured cooking vessels so they
    would be ready for the new fire and new fruits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred square was swept clean, food vessels were removed from the temple,
    eligible men entered the holy square, and sentinels kept out impure persons and
    animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The devotees fasted for two nights and a day and drank a bitter button-snake-root
    decoction to vomit and purge their bodies; people outside the square received
    green tobacco to chew and swallow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After commands for silence, staying indoors, and removal of every spark of
    old fire, the high priest made new fire by friction of two pieces of wood and
    placed it on the altar under the green arbour.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the new fire was believed to atone for all past crimes
    except murder and that the chief priest announced it had purged away the sins
    of the past year.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The high priest offered portions of the new fruits, rubbed with bear's oil,
    together with flesh to the holy spirit of fire as a first-fruit offering and annual
    oblation for sin, and consecrated emetics by pouring a little into the fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women carried portions of the new fire home to unpolluted hearths, and the
    new fruits were cooked on the new fires and eaten with bear's oil.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Men rubbed new corn between their hands and on their faces and breasts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Warriors with white down on their heads and white feathers in their hands
    danced around the sacred arbour where the new fire burned; later the warriors
    fought a mock battle and men and women danced in three circles around the sacred
    fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The ceremonies lasted eight days with strict continence, and near the end
    all the people smeared themselves with white clay and bathed in running water.
  category: sequence
  evidence_refs:
  - ev:9
