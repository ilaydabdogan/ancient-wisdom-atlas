canonical_text:
  quote: "“Out with hunger, and in with wealth and health.”"
  summary: The passage surveys Greek human scapegoat rites in Chaeronea, Marseilles,
    Athens, Leucas, and Greek Asia Minor. It describes slaves, poor men, outcasts,
    criminals, or deformed persons being beaten, expelled, hurled, stoned, burned,
    or otherwise removed so that hunger, plague, famine, drought, or other communal
    evils would be transferred away from the city or household. Some rites are tied
    to annual or harvest festivals such as the Thargelia.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In Chaeronea, a ceremony called the “expulsion of hunger” was performed by
    the chief magistrate at the Town Hall and by householders at home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Chaeronea rite, a slave was beaten with rods of agnus castus, turned
    out of doors, and addressed with a formula expelling hunger and inviting wealth
    and health.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the Chaeronea ceremony closely resembles Japanese,
    Hindoo, and Highland customs already described by the author.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Marseilles during plague, a poorer-class man offered himself as scapegoat,
    was maintained for a year at public expense, dressed in sacred garments and holy
    branches, led through the city with prayers that the people’s evils fall on him,
    and then cast out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Athens, degraded and useless persons were maintained at public expense,
    and during calamities such as plague, drought, or famine two outcasts could be
    sacrificed as scapegoats, one for men and one for women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Athenian male-designated victim wore black figs around his neck, the female-designated
    victim wore white figs, and the victims were led about the city and apparently
    stoned to death outside it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that every year at the Thargelia in May two victims, one
    for men and one for women, were led out of Athens and stoned to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Leucadians annually hurled a criminal from the white bluff called the
    Lover’s Leap into the sea as a scapegoat, while birds, feathers, and boats were
    used to lighten the fall and carry him beyond the boundary.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Greek Asia Minor, when a city suffered plague, famine, or other calamity,
    an ugly or deformed person was chosen to take on the city’s evils, given dried
    figs, barley loaf, and cheese to eat, beaten seven times on the genitals with
    squills and wild-tree branches, burned on a pyre, and his ashes cast into the
    sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says a similar custom appears to have been annually celebrated
    by Asiatic Greeks at the harvest festival of the Thargelia.
  category: relationship
  evidence_refs:
  - ev:8
