  summary: The passage is mainly a footnote apparatus from Frazer. Substantive notes
    mention children sleeping on Yule straw, a substitution of brandy for hare's blood,
    the Attic Bouphonia sacrifice with disputed accounts of the axe and knife trial,
    the King Archon's role in trials of lifeless objects, and Thesmophoria-related
    testimony about Demeter, Proserpine, ascent from the lower world, and engulfment
    in a chasm.
