candidate_motifs:
- id: motif:1
  label: annual sacred-animal killing and ritual meal
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: The Todas kill and eat a young male buffalo calf once a year, and the Madi
    or Moru are reported to kill a lamb at stated annual times.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The exact local meanings are not fully supplied, and for the Madi or Moru
    rite the quoted observer says he could not ascertain the exact meaning.
- id: motif:2
  label: blood application as ritual communion or protection
  taxonomy_refs:
  - sacrifice
  basis: The Madi or Moru lamb’s blood is sprinkled and applied to different bodies,
    and Frazer explicitly interprets the smearing as communion with divinity; related
    smaller rites are said to avert further evil.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: The communion reading is Frazer’s interpretation, not an explanation directly
    attributed to the Madi or Moru participants.
- id: motif:3
  label: mourning the death of a sacred animal
  taxonomy_refs:
  - sacrifice
  basis: The Madi or Moru people are described as sad before the annual lamb slaughter
    and joyful after it; Frazer interprets the sorrow as mourning a divine animal’s
    death.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The source states that the exact meaning of the ceremony had not been
    ascertained.
- id: motif:4
  label: circulating a sacred animal or effigy for communal blessing
  taxonomy_refs:
  - sacred_exchange
  - serpent
  basis: Frazer describes a form of communion in which a sacred animal is taken from
    house to house, cites the Gilyak bear procession, and then gives the Punjab dough-snake
    procession with household blessings and offerings.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The Gilyak example involves a bear before slaughter, while the Punjab
    example uses a dough snake effigy and offerings; the passage supports functional
    comparison, not identity of origin.
- id: motif:5
  label: ritual implements from sacred tree and sacred fire
  taxonomy_refs:
  - sacrifice
  basis: In the Toda rite the calf is killed with a club made from the sacred tree,
    and a sacred fire produced by rubbing sticks is used in roasting the flesh.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage names the sacred tree and fire but does not explain their
    meanings beyond their ritual use.
- id: motif:6
  label: gender-restricted sacrificial meal
  taxonomy_refs:
  - sacrifice
  basis: The Toda calf flesh is eaten by men alone, with women excluded from the assembly.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the reason for women’s exclusion.
comparison_claims:
- id: claim:1
  claim: Frazer presents the Toda calf ceremony as an example of a sacrament of the
    Egyptian type.
  claim_level: same_function
  target: Egyptian-type sacrament of a sacred animal
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt does not describe the Egyptian rite in detail, so the comparison
    is preserved only as Frazer’s framing.
- id: claim:2
  claim: Frazer compares the Madi or Moru sorrow at the lamb’s annual slaughter to
    mourning for the sacred buzzard among Californians and the Theban ram among Egyptians.
  claim_level: same_function
  target: mourning the death of a sacred animal in Californian and Egyptian examples
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The passage reports that the exact local meaning of the Madi or Moru
    custom had not been ascertained; the comparison is Frazer’s interpretation.
- id: claim:3
  claim: Frazer compares the Punjab snake procession to a broader form of communion
    exemplified by the Gilyak bear being promenaded through a village before slaughter.
  claim_level: same_function
  target: Gilyak bear procession before slaughter as circulation of sacred influence
  evidence_refs:
  - ev:10
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The two examples differ materially: one involves a live bear before
    killing, while the other involves a dough snake effigy carried with blessing formulas
    and offerings.'
