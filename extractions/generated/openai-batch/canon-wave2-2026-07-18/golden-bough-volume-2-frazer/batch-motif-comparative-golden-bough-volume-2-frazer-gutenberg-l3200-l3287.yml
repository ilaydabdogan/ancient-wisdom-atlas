canonical_text:
  quote: ''
  summary: 'Frazer describes several rituals involving sacred or ritually treated
    animals: the Todas’ annual killing and eating of a young male buffalo calf; the
    Madi or Moru lamb ceremony involving circling, fleece, blood marking, a discourse,
    leaves, skull display, and distribution of flesh; and a Punjabi Snake-tribe practice
    in which a painted dough snake is carried from house to house with blessings and
    requests for offerings. Frazer also compares these practices to Egyptian, Californian,
    Theban, and Gilyak examples.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Todas are described as a pastoral people of Southern India who subsist
    largely on buffalo milk; their buffalo is described as sacred to a degree and
    treated with kindness and adoration.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Todas do not eat cow-buffalo flesh and generally abstain from male-buffalo
    flesh, except for an annual ceremony in which adult males kill and eat a very
    young male calf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young male calf is taken into the dark recesses of the village wood and
    killed with a club made from the Toda sacred tree, the tûde or Millingtonia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sacred fire is made by rubbing sticks, the calf flesh is roasted on embers
    of certain trees, and only men eat it; women are excluded from the assembly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Madi or Moru tribe of Central Africa is described as having cattle as
    chief wealth and as killing a lamb on certain solemn occasions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Madi or Moru annual ceremony, a large group of all ages assembles around
    a circle of stones beside a road or path, and the people are said to be sad before
    the rite and joyful after it.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A boy leads a choice lamb four times around the assembled people, who pluck
    small bits of its fleece and place them in their hair or on another body part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man belonging to a kind of priestly order kills the lamb at the stones,
    sprinkles its blood four times over the people, and applies blood marks differently
    to children, women and girls, and men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a discourse and exhortation to kindness, the people place leaves on
    or beside the circle of stones; the lamb’s skull is hung on a tree near the stones,
    and its flesh is eaten by the poor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Madi or Moru lamb-killing custom is also reported at smaller scale for
    family trouble, illness, bereavement, graves of departed friends, and joyful occasions
    such as a son’s return after long absence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Frazer states that the people’s sorrow at the annual slaughter indicates that
    the lamb slain is a divine animal whose death is mourned by worshippers.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Frazer states that smearing worshippers with the lamb’s blood is a form of
    communion with the divinity, externally applying the vehicle of divine life.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Frazer identifies a form of communion in which a sacred animal is taken from
    house to house, and cites the Gilyak custom of promenading a bear through a village
    before it is killed.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the Punjab example, a Snake tribe is said to worship the snake once a year
    in September for nine days.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Mirasans, especially those of the Snake tribe, make a black-and-red painted
    dough snake, place it on a winnowing basket, and carry the basket around the village
    and into houses.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The snake bearers recite blessings and request offerings; households generally
    give dough or corn, and households connected with a new bride, a departed bride,
    or a son’s birth may give money or cloth.
  category: speech
  evidence_refs:
  - ev:13
  - ev:14
