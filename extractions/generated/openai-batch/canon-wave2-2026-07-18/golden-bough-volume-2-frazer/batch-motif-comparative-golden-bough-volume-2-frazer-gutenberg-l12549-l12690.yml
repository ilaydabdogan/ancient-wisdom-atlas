canonical_text:
  quote: ''
  summary: A sequence of footnotes cites sources on cattle reverence, Apis and Isis-Hathor
    worship, charms, and first-fruits ceremonies. The substantive notes include details
    of a Zulu first-fruits feast involving a bull, gall, boys, a green calabash, new-year
    opening, and a taboo on eating new fruits early; notes on American Indian and
    Cherokee ceremonies; a Cherokee sacred-square rite using green boughs and a central
    tree; and a variant account of burning old vessels and preparing new ones for
    a festival.
