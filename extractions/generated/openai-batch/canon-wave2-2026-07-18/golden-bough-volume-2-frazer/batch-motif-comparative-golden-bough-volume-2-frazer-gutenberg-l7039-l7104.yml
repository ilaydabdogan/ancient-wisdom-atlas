canonical_text:
  quote: ''
  summary: 'The passage recounts Bitiu living alone in the Valley of the Acacia with
    his heart on an Acacia flower, receiving a divinely made wife, being killed when
    the Acacia flower is cut, and being revived when his elder brother finds the heart
    in an Acacia berry and places it in fresh water. It then presents two Arabian
    examples: a Jinnee hides his soul in a sparrow enclosed in nested boxes and chests,
    and dies when the sparrow is strangled; an ogress queen’s life and the eyes of
    blinded queens are kept in bottles, while a female slave’s life is a beetle, and
    both the slave and the ogress die when their external life-vessels are destroyed
    or released.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger brother Bitiu dwells alone in the Valley of the Acacia, hunts
    by day, and lies under the Acacia whose flower bears his heart.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun asks Khnum to make a wife for Bitiu so that he will not dwell alone,
    and Khnum makes a woman described as perfect in her limbs with all the gods in
    her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A lock of the woman’s hair falls into the river, reaches Pharaoh’s washerwomen
    in Egypt, and perfumes Pharaoh’s raiment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pharaoh’s magicians say the lock belongs to a daughter of the Sun who has
    the essence of all the gods, and messengers are sent to seek her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman is brought from the Valley of the Acacia with chariots, archers,
    and much company, and Pharaoh loves her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman tells Pharaoh to have the Acacia cut down and Bitiu destroyed; men
    cut the flower on which Bitiu’s heart rests, and Bitiu falls down dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bitiu’s elder brother receives a pot of beer that bubbles and a jug of wine
    that grows turbid, then travels to the Valley of the Acacia and finds Bitiu dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder brother searches for Bitiu’s heart under the Acacia for years, finds
    it in an Acacia berry, puts it into fresh water, and Bitiu revives after drinking
    the water in which his heart was placed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the story of Seyf-el-Mulook, a Jinnee says astrologers foretold that a
    son of a human king would destroy his soul, so he put his soul in the crop of
    a sparrow hidden within nested boxes, chests, and a marble coffer in the surrounding
    ocean.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seyf-el-Mulook obtains the sparrow, strangles it, and the Jinnee falls to
    the ground as a heap of black ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In a modern Arabian tale, a king marries an ogress who blinds the king’s forty
