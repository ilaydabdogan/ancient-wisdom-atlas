canonical_text:
  quote: ''
  summary: The passage compiles Kabyl, Magyar, Hungarian, Samoyed, and Tartar examples
    in which a being’s fate, life, soul, heart, power, or strength is located outside
    the body in animals, objects, containers, or hidden places. Heroes or opponents
    obtain, destroy, steal, or restore these external life-tokens, causing death,
    loss of power, resurrection, peace, or renewed strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Kabyl story, an ogre declares that his fate is in an egg, which is
    in a pigeon, which is in a camel, which is in the sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kabyl hero obtains the egg, crushes it between his hands, and the ogre
    dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Magyar tale, an old witch detains Prince Ambrose in the bowels of the
    earth and says her life and power are in two beetles nested inside a box, pigeon,
    hare, and wild boar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ambrose kills the black beetle, causing the witch’s power to leave her, and
    later kills the shining beetle, causing her spirit to leave her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a Hungarian story, the Dwarf-king’s safety is in a golden cockchafer nested
    within a golden cock, golden sheep, and golden stag on the ninety-ninth island;
    the hero overcomes these animals and recovers his bride.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Samoyed story, seven warlocks kill a man’s mother, carry off his sister,
    and each night remove their hearts and place them in a dish that is hung on tent-poles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wronged man’s wife steals the warlocks’ hearts; the man destroys six hearts,
    compels the seventh warlock to restore his mother by means of a bag containing
    her spirit, and then destroys the seventh heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a Tartar poem, Bulat cannot die in combat until a golden casket hanging
    from the sky is brought down and the white birds inside it, one of which is his
    soul, are killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another Tartar poem, two brothers hide their souls as a white herb with
    six stalks in a deep pit; an enemy digs up the souls and puts them in a golden
    ram’s horn in his quiver, after which the brothers make peace.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In another Tartar poem, a demon survives binding and sword-cuts because his
    soul is in a twelve-headed serpent inside a saddle-bag; when the serpent is killed,
    the demon dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In another Tartar poem, Kök Chan deposits a golden ring containing half his
    strength with a maiden; later a woman drops the ring into his mouth, restoring
    force that allows him to slay his enemy.
  category: sequence
  evidence_refs:
  - ev:8
