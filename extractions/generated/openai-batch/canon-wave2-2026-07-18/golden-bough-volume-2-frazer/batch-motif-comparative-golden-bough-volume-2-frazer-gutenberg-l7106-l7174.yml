candidate_motifs:
- id: motif:1
  label: externalized life or soul hidden outside the body
  taxonomy_refs: []
  basis: Multiple examples describe fate, life, safety, hearts, or soul located outside
    the body in an object, animal, container, or hidden place.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage is a secondary comparative compilation and does not provide
    the primary texts in full.
- id: motif:2
  label: nested containers protecting a life-token
  taxonomy_refs: []
  basis: Several examples place the life-token inside sequences of animals, boxes,
    caskets, bags, or remote places before it can be reached.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The exact nesting structures vary by story.
- id: motif:3
  label: destroying the life-token kills or weakens the being
  taxonomy_refs: []
  basis: Crushing the egg kills the ogre; killing beetles removes the witch’s power
    and life; overcoming golden animals defeats the Dwarf-king; destroying hearts
    kills warlocks; killing birds or the serpent enables the death of Bulat or the
    demon.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: Some examples produce incapacity or defeat rather than immediate death.
- id: motif:4
  label: detachable hearts as lives
  taxonomy_refs: []
  basis: The warlocks remove their hearts nightly, and destroying or withholding the
    hearts controls whether they live or die.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is represented by one story in the passage.
- id: motif:5
  label: spirit in a bag restores the dead
  taxonomy_refs:
  - resurrection
  basis: The dead mother’s spirit is contained in a bag and, when made to breathe
    over her bones, restores her to life.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives this as a brief episode within the warlock story.
- id: motif:6
  label: abducted bride or sister recovered through defeat of supernatural captor
  taxonomy_refs:
  - stolen_beloved
  basis: The Dwarf-king had carried off the hero’s bride, and the warlocks had carried
    off the man’s sister; action against the captors’ life-tokens is linked to recovery
    or redress.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage explicitly states recovery of the bride, but gives less detail
    on the sister’s final status.
- id: motif:7
  label: externalized strength stored in a ring
  taxonomy_refs: []
  basis: Kök Chan places half his strength in a golden ring and regains force when
    the ring is put into his mouth.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This concerns strength rather than life or soul, so it is adjacent to
    but not identical with the external-soul examples.
- id: motif:8
  label: serpent containing a demon’s soul
  taxonomy_refs:
  - serpent
  basis: The demon’s soul is specifically said to be in a twelve-headed serpent, and
    killing the serpent kills the demon.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Only one example in this passage uses a serpent as the soul-container.
comparison_claims:
- id: claim:1
  claim: The Kabyl, Magyar, Hungarian, Samoyed, and Tartar examples in the passage
    share the pattern of a being’s life, fate, heart, safety, or soul being externalized
    and made vulnerable through an object, animal, or container.
  claim_level: same_motif
  target: externalized life or soul motif across the listed comparative examples
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This supports a motif-level comparison only; the passage does not establish
    historical contact, borrowing, or common inheritance among the traditions.
- id: claim:2
  claim: The Kabyl, Magyar, Hungarian, and Tartar demon examples share a nested-containment
    function in which the vulnerable essence must be reached through a sequence of
    animals or containers.
  claim_level: same_function
  target: nested containers concealing a life-token
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The nesting media differ substantially, and the passage gives brief
    summaries rather than full tale contexts.
- id: claim:3
  claim: The Samoyed warlock story and the Tartar stories of Bulat and the two brothers
    all treat a separable heart or soul as an object that can be stolen, held, or
    destroyed to determine the outcome of conflict.
  claim_level: same_function
  target: control of detachable soul-object in conflict
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The outcomes differ: death, resurrection under compulsion, defeat,
    or negotiated peace; the claim is functional rather than a claim of identical
    narrative structure.'
- id: claim:4
  claim: Kök Chan’s ring containing half his strength resembles the external-soul
    examples in its use of an external object holding a vital capacity, but the capacity
    is strength rather than life or soul.
  claim_level: same_function
  target: external object containing vital capacity
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  limitations: The passage distinguishes this example by describing stored strength,
    not stored life, heart, fate, or soul.
