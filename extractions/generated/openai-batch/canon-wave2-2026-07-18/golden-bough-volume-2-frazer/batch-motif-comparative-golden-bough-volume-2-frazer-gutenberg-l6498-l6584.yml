canonical_text:
  quote: The pulling of the mistletoe was thus at once the signal and the cause of
    his death.
  summary: Frazer connects oak-wood midsummer fires, the burning of a human representative
    of the oak-spirit, Celtic and Scandinavian mistletoe customs, and Balder’s death
    by mistletoe. He then introduces the wider pattern of the external soul, in which
    a person’s life or soul may be placed outside the body in a material object or
    safe place, so that harm to that object determines the person’s fate.
  language: English
  quote_policy: quoted
