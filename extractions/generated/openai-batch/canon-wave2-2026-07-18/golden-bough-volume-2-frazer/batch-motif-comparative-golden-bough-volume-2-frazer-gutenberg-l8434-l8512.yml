canonical_text:
  quote: ''
  summary: The passage compiles reports of first-fruits offerings in Fiji, Tana in
    the New Hebrides, the Kingsmill Islands, and Tonga. It describes yams or other
    foods presented to ancestors, gods, priests, or a divine chief; associated taboos,
    stones or altars, prayers, feasts, dances, and preparations for an annual Tongan
    yam ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In certain Fijian tribes, the first-fruits of the yam harvest are presented
    to ancestors in the Nanga before the main crop is dug for ordinary use, and no
    one may taste the new yams until the presentation is made.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yams offered in the Great Nanga are piled there and allowed to rot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that anyone who appropriated the Fijian offerings for
    personal use was expected to be smitten with madness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A mission teacher reported seeing yam vines growing among weeds from piles
    of decayed offerings in the Nanga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Fijian first-fruits presentations are described as occasions of great feasts
    and public rejoicing, and the Nanga is said to be frequently called Mbaki, or
    Harvest.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: In other parts of Fiji, first-fruits of yams presented at the principal district
    temple became the property and revenue of priests, while the stated pretense was
    that they were needed for the god.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Tana, the general term for gods is reported to mean a dead man; departed
    ancestors and deified long-lived chiefs are said to receive prayers and to preside
    especially over yams and fruit-trees.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Tana, a small amount of new fruit is placed on a stone, tree branch, or
    temporary stick altar; the chief acts as high priest and prays aloud before the
    people shout, feast, and dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In some Kingsmill Islands, the god Tubuériki is represented by an upright
    flat coral stone wrapped with fresh coconut-palm leaves that are changed monthly.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kingsmill worship of Tubuériki includes prayers before the stone and placing
    beside it portions of food prepared for ordinary use; first-fruits of the season
    are always offered to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In Tonga, the Inachi is an annual allotment of first-fruits and other eatables
    offered to the gods in the person of the divine chief Tooitonga before the general
    yam crop matures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the Tongan ceremony, a special yam species is planted earlier in fenced
    patches; the King asks Tooitonga to appoint the day, conches are sounded at night,
    and the yams are dug and decorated with red pandanus ribbon.
  category: sequence
  evidence_refs:
  - ev:6
