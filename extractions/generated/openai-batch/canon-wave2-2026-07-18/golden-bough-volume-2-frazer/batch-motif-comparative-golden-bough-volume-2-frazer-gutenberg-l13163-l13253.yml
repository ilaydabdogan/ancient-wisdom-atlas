canonical_text:
  quote: ''
  summary: 'Footnote material in Frazer lists customs concerning animal sacrifice,
    hunting, feasting, and disposal of remains: animals are killed without shedding
    blood or breaking bones; bones are preserved, burned, hung on trees, returned
    to the sea, or kept from dogs; some customs are explained as preserving game,
    enabling animal return, transmitting remains to a spirit-land, or preventing magical
    harm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the annual White Dog sacrifice, the Iroquois strangled the dog without
    shedding blood or breaking bones, and then burned it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Australian Aboriginal people were said not to break the bones of the
    native bear when killing it, because the bear was associated with having once
    stolen river water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several cited groups are described as avoiding the breaking of animal bones
    during killing, eating, or feasting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one war-feast account, a whole animal was cooked and eaten, its bones were
    not broken, and the stripped bones were hung on a tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On St. Olaf’s Day, the Karels of Finland killed an unshorn lamb without a
    knife, roasted it whole, avoided breaking its bones, and placed portions for house-spirits,
    fields, and future May-tree birches.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Innuit of Point Barrow preserved unbroken seal bones and returned them
    to the sea through ice cracks or holes in order to secure hunting fortune.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Frazer states that in the seal-bone custom the probable idea is that the bones
    will receive flesh again and the seals will come back to life.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mosquito Indians and Yurucares are described as preserving bones or eggshells
    to prevent deer, chickens, fish, or game from disappearing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Indians of Costa Rica are described as gathering bones after a meal and either
    burning them or keeping them away from dogs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Frazer suggests that burning bones to keep dogs from them may be a way of
    transmitting the bones to the spirit-land.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Australian Aboriginal people are described as burning animal bones because
    an enemy could use the bones with charms to cause the eater’s death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note states that in folk-tales and in custom, blood is sometimes not allowed
    to fall on the ground.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Faleshas are described as carefully removing a vein from an animal’s thighs
    with surrounding flesh after killing an animal for food.
  category: action
  evidence_refs:
  - ev:9
