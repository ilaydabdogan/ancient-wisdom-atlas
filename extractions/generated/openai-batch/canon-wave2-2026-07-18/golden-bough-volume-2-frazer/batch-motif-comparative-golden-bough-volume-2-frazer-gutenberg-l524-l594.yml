canonical_text:
  quote: ''
  summary: The passage surveys European harvest and sowing customs in which a goat-skin,
    bull, cow, ox, calf, last sheaf, or straw figure is treated as an embodiment or
    sign of the corn-spirit. It describes ritual killing, suspension, dancing, last-sheaf
    naming, teasing of the last reaper, decorated bovines led around fields or farmyards,
    and solemn killing at the close of reaping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At winter-corn sowing, Prussian Slavs killed a goat, ate its flesh with ceremonies,
    and hung its skin on a high pole near an oak and a large stone until harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At harvest, a peasant acting as priest offered prayer; young people danced
    around the oak and pole; the priest distributed herbs, placed the goat-skin on
    the stone, sat on it, and spoke about forefathers and old customs and beliefs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the goat-skin suspended in the field from sowing
    to harvest represents the corn-spirit overseeing corn growth.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the corn-spirit often assumes the form of a bull, cow, or
    ox, and cites sayings in which a steer or bull is described as being in the corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some regions explain a harvester's lameness or sickle wound by saying that
    the Bull pushed him, that he has the Bull, or that he has the wound of the Ox.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator explains these injury sayings as cases in which a person has
    unknowingly encountered the divine corn-spirit and been punished with lameness.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: In some districts the last sheaf is shaped as a horned ox called the Old Man,
    or as a human form called the Buffalo-bull; the narrator notes a mixture of human
    and animal conceptions of the corn-spirit.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Thurgau, Swabia, and parts of Switzerland, the last sheaf, last bundle,
    or reaper who cuts the last ears may be called the Cow, Wheat-cow, Corn-cow, Oats-cow,
    or Corn-steer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The last cutter may receive flowers, corn-ears, and extra drink, but is also
    teased and laughed at; a Cow figure made from ears of corn, corn-flowers, and
    sometimes a woman shape may be carried to the farmhouse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In East Prussia, remaining ears on the last swath can be seized with the cry
    'Bull! Bull!'; in Upper Bavaria a late farmer may have a large straw bull set
    up on his land with a mocking label.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Pouilly near Dijon, an ox decorated with ribbons, flowers, and ears of
    corn is led around the field with dancing reapers; a man dressed as the Devil
    cuts the last ears and then kills the ox.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Part of the Pouilly ox's flesh is eaten at the harvest supper, and part is
    pickled and kept until the first day of spring sowing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Pont à Mousson and elsewhere, a decorated spring-born calf is led three
    times around the farmyard, followed by reapers with implements, released, chased,
    and caught; the catcher is called King of the Calf before the calf is solemnly
    killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At Lunéville, the passage says the village Jewish merchant acts as butcher
    in the calf-killing ceremony.
  category: relationship
  evidence_refs:
  - ev:7
