canonical_text:
  quote: ''
  summary: 'Frazer argues that the figure of a dying god used as a scapegoat may combine
    two customs: killing a divine representative to preserve divine life from age
    and annually expelling accumulated evils. He applies this interpretation to the
    European custom of “carrying out Death,” to Roman Mamurius Veturius or “old Mars,”
    and to analogies such as disease- or sin-laden boats.'
  language: English
  quote_policy: summarized
