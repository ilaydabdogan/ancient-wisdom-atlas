canonical_text:
  quote: ''
  summary: Frazer lists European harvest customs in which the corn-spirit is embodied
    as a hare or a cat. The hare or cat is associated with the last standing corn,
    last sheaf, final cutting, or final threshing. Some customs use phrases such as
    chasing, catching, or killing the animal; others involve a decorated cat, human
    cat-costumes, or an actual cat killed and eaten after harvest/threshing.
  language: English
  quote_policy: summarized
