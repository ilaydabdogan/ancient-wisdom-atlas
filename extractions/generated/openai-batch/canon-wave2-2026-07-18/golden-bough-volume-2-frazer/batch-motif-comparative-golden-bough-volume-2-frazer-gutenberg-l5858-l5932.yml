canonical_text:
  quote: ''
  summary: The passage describes midsummer fire-festivals held around the summer solstice
    in several European regions. Reported features include bonfires, torch processions,
    rolling flaming wheels, paired leaping over fires for crop growth, preservation
    of embers or ashes for garden and field fertility or protection, generation of
    a “new and pure fire” by friction, fumigation to drive away harmful beings from
    cattle and dwellings, and a Konz rite in which a burning wheel rolling into the
    Moselle is taken as an omen of abundant vintage.
  language: English
  quote_policy: summarized
