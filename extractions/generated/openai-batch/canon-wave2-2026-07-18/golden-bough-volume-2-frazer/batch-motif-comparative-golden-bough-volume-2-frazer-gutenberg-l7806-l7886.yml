canonical_text:
  quote: "“pretence of being killed and brought to life again”"
  summary: The passage surveys initiation or religious-association rites in North
    America and Oceania in which candidates or boys are made to appear killed, eaten,
    buried, or transformed through ritual objects, blows, masked figures, animal disguises,
    or named supernatural beings, and are then restored or incorporated into a society.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Some North American religious associations are described as open only to candidates
    who have undergone a pretended killing and restoration to life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Naudowessie ceremony, a candidate kneels before a chief, who says a
    spirit will strike the candidate dead and restore him to life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Naudowessie chief throws a small bean-like object toward the young man;
    the man falls motionless, later receives blows, expels the object from his mouth,
    and comes to life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In other tribes, the apparent killing instrument is a medicine-bag made from
    an animal skin that roughly preserves the animal's shape and contains charms or
    medicine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The medicine-bag is believed to issue a spirit or breath able to knock down
    and kill a man and also restore him to life; one thrust kills and a second thrust
    restores.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Nootka Sound, a chief fires a pistol close to his son's ear; the son falls
    as if killed, and women cry out that the prince is dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Nootka ceremony, two figures dressed in wolf skins with wolf-head masks
    enter on hands and feet, lift the prince, and carry him away on their backs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that peoples in this part of America are divided into totem
    clans, including a principal Wolf clan, and that clan members wear part of the
    totem animal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Among the Toukaway Indians of Texas, men dressed in wolf skins run on all
    fours, howl, mimic wolves, scratch up a living tribesman who had been deliberately
    buried, and place a bow and arrows in his hands.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: On Rook, masked men demand circumcised boys who have not yet been swallowed
    by Marsaba; the boys are delivered trembling and must creep between the masked
    men's legs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Rook procession announces that Marsaba has eaten the boys and will not
    disgorge them until he receives pigs, taro, and other provisions, which the villagers
    contribute and which are consumed in Marsaba's name.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In New Britain, boys become full members of the Duk-duk association around
    their fourteenth year, when the Tubuvan gives them a cane blow that is supposed
    to kill them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Tubuvan and Duk-duk are disguised men representing cassowaries; they wear
    large grass or palm-fibre hats and leaf coverings, and women may not see them.
  category: attribute
  evidence_refs:
  - ev:6
