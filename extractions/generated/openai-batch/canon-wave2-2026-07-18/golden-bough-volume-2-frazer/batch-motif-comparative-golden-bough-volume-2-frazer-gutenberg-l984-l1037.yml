canonical_text:
  quote: ''
  summary: Frazer discusses Dionysus represented as a bull and argues that this animal
    form is safer to understand as an expression of Dionysus as a vegetation deity
    than as a bull-totem survival. He then describes the Athenian bouphonia, an ox
    sacrifice near the end of threshing, including the grain offering, killing of
    the ox, communal eating, stuffing of the hide, yoking the stuffed animal to a
    plough, and a trial in which the axe and knife are condemned and cast into the
    sea.
  language: English
  quote_policy: summarized
