  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The axe and knife used to kill the ox were wetted with water brought by maidens
    called water-carriers, then sharpened and handed to the butchers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: One butcher felled the ox with the axe, another cut its throat with the knife,
    and the butchers fled after the killing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ox was skinned, all present partook of its flesh, and the hide was stuffed
