    Dionysus may have developed from or succeeded a bull-totem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says it is safer, in the author's view, to regard the bull form
    of Dionysus, like his goat form, as an expression of his character as a vegetation
    deity.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Athenian sacrifice called bouphonia, described as the murder of the ox,
