canonical_text:
  quote: ''
  summary: Frazer discusses reports that some North American Indigenous hunters detached
    or avoided eating the sinew from the legs or thighs of deer and other animals.
    He recounts a Loucheux and Hare-skin sacred story in which Fireless and Homeless
    helps a benevolent giant defeat a hostile giant by cutting the hostile giant's
    leg sinew. Frazer then interprets the taboo as possibly connected to a belief
    that an animal's body parts, including reproductive parts, were needed for the
    animal's resurrection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Reported Choctaw and other Indigenous practices include detaching a sinew
    from venison and either avoiding it, discarding it, or treating it in conflicting
    ways according to different informants.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Adair reports that hunters cut a piece from the lower thigh of deer, and an
    informant says eating it was regarded as dangerous pollution associated with sickness,
    misfortunes, and spoiled guns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Loucheux and Hare-skin Indians are described as forbidden by custom to
    eat the sinew of the legs of animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the sacred story, a man enters a porcupine burrow, becomes lost in darkness,
    and is released when a kind giant cleaves open the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The kind giant hunts elans and beavers for Fireless and Homeless and carries
    him in the sheath of his flint knife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The kind giant warns that an enemy associated with the sky has sworn his destruction
    and that his blood would redden the clouds if he were slain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The kind giant gives Fireless and Homeless an axe made from the tooth of a
    gigantic beaver.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A whale under the ice makes a sound because it is naked and cold, then takes
    human shape and attacks the kind giant.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the struggle, the kind giant tells Fireless and Homeless to cut the
    leg sinew; after the sinew is cut, the wicked giant falls and is slain.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the sky grows red, Fireless and Homeless understands that the kind giant
    is dead and weeps.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Frazer states that the story is an invented myth explaining an existing custom
    rather than the historical reason for the custom.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: Frazer suggests that the original reason for preserving or avoiding the sinew
    was a belief that the sinew was needed for slain animals to reproduce or come
    to life again.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: Frazer compares this proposed logic with the Lapp practice of burying the
    male bear skeleton with genital parts in hope of resurrection.
  category: other
  evidence_refs:
  - ev:13
