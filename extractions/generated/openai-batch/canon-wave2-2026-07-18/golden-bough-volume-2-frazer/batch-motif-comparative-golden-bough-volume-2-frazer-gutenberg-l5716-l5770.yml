canonical_text:
  quote: ''
  summary: 'Frazer describes Easter Eve and Easter-season fire customs in several
    European regions: village lads make and burn bonfires, sometimes with a straw
    effigy called the Easter-man or Judas; fire is carried from church; women may
    be excluded in one custom; ashes, branches, and charred sticks are used in fields
    or water; communities assemble on hills or mountains, sing, dance, move sunwise,
    jump over fire, carry blazing straw over fields, roll or throw burning objects,
    collect ashes, and in some places burn squirrels or bones.'
  language: English
  quote_policy: summarized
