canonical_text:
  quote: ''
  summary: A caravan is robbed in Greek territory; Lucman refuses to waste wise admonition
    on hardened robbers and the passage turns to charity as protection against calamity.
    Subsequent anecdotes present Lucman learning manners from the unmannerly, a holy
    man criticizing an excessive devotee, and a repentant wanderer counseled to endure
    slander while remembering divine knowledge of hidden sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A caravan in the territory of the Greeks is attacked by robbers and plundered
    of much property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The merchants lament and seek the intercession of God and the prophet, but
    this does not restore their goods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lucman is among the travellers, and one traveller asks him to direct wisdom
    and admonition to the robbers in hopes that they may return part of the property.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lucman answers that it would be a pity to cast admonitions of wisdom upon
    the robbers; the passage compares such effort to trying to remove canker from
    rusted iron or drive an iron nail into flint.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that prosperity should include remembrance of the bankrupt
    and needy, and that refusing the beggar may be followed by a tyrant taking by
    force.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lucman says he learned manners from the unmannerly by avoiding whatever behavior
    seemed bad to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage contrasts the wise, who can derive instruction from a joke, with
    the fool, to whom chapters of wisdom seem like jesting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: An abid is said to eat ten mans of food in one night and recite the whole
    Koran before morning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A good and holy man says the abid would have done better to eat half a loaf
    and sleep; the passage links an unencumbered body with the light of good works.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Divine favor places a lamp of grace in the path of a wanderer in forbidden
    ways and directs him into the circle of the righteous and the society of dervishes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dervishes' spiritual cooperation helps the wanderer convert wicked propensities
    into praiseworthy deeds and restrain sensual indulgences.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Calumniators question the converted man's sincerity and say that he retains
    his original habits.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says repentance may deliver a person from the wrath of God, but
    not from the slanderous tongue of man.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The converted man complains to his ghostly father about people's tongues;
    the holy man weeps and says he should be grateful that he is better than people
    represent him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The holy man counsels that being good while people speak evil is better than
    being wicked while people consider one good.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: A speaker says he may conceal himself from neighbors, but God knows what is
    secret and open; a shut door cannot avail against Omniscience.
  category: speech
  evidence_refs:
  - ev:11
