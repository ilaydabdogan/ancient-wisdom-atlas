canonical_text:
  quote: ''
  summary: The passage presents two didactic love exempla. In the first, an Arabian
    king hears of Mujnun’s desert madness for Laila, summons him, judges Laila unimpressive
    when she is brought before him, and hears Mujnun explain that only a lover with
    the same malady can perceive her beauty and understand his pain. In the second,
    a young man and his beloved fall from a vessel into a whirlpool; when help comes,
    he asks that the beloved be saved instead of himself. The narrator closes by directing
    whole-hearted love toward God and invoking Laila and Mujnun as exemplars of love.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People relate to a king of Arabia that Mujnun, despite knowledge and wisdom,
    has gone toward the desert and abandoned himself to distraction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king orders Mujnun brought before him and reproves him for forsaking human
    society and taking on brute-like manners.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mujnun replies that those who reproach his love for Laila would understand
    his excuse if they could see her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mujnun says the sight of the beloved’s face could make observers cut their
    fingers instead of the orange in their hands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king has Laila searched for among Arab tribes and brought to the courtyard
    of his seraglio.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king sees Laila as tawny and feeble, and regards her as less beautiful
    and elegant than the lowest menial in his harem.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mujnun says the king would need to look at Laila through a Mujnun’s eye to
    understand the spectacle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mujnun says that only someone with the same malady or fellow-suffering can
    understand his condition, and he uses images of firewood, wounds, salt, and hornet
    stings to describe pain and sympathy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A handsome young man and a lovely damsel are embarked together in a vessel
    on the mighty deep and fall together into a whirlpool.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the pilot offers assistance, the young man, from the vortex, asks him
    to leave him and take the hand of his beloved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the young man’s speech is admired and that the lovers’
    lives end in this manner.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The narrator instructs the hearer not to learn love from a faithless person,
    to devote the whole heart to God, and to shut the eyes to the rest of the world.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The narrator says that if Laila and Mujnun returned to life, they could read
