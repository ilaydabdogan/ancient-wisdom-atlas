canonical_text:
  quote: ''
  summary: 'A narrator and another speaker argue over whether the rich should be praised
    as generous or condemned as miserly. Their dispute over wealth, poverty, greed,
    and petitioners becomes heated and physical, with the narrator comparing the turn
    to violence to Azor and Abraham. They submit the matter to a cazi, who gives a
    balanced judgment: worldly advantage is mixed with danger, and both rich and poor
    contain virtuous and flawed people.'
  language: English
  quote_policy: summarized
