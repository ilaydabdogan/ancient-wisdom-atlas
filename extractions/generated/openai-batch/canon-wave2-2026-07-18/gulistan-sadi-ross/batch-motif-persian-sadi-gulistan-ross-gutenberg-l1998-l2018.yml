canonical_text:
  quote: ''
  summary: A fatigued and hungry dervish arrives as a guest at a hospitable house
    where learned and witty guests are telling jests. Asked to contribute, he offers
    a distich comparing himself, hungry before a spread table, to a bachelor outside
    a bath full of women. The company applauds and food is set before him; when the
    host asks him to wait for prepared forced meat, the dervish replies that plain
    bread is enough for someone baked by the desert.
  language: English
