canonical_text:
  quote: ''
  summary: A moral passage contrasts moderate contentment with greed through images
    of shared meat, dogs fighting over abundance, bread satisfying hunger, and the
    greedy eye remaining unsatisfied. The narrator recalls his dying father's advice
    that lust is like fire, that indulgence leads toward hellish flames in the next
    world, and that continence should be used like water to extinguish lust in this
    world.
  language: English
  quote_policy: summarized
