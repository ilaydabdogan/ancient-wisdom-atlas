canonical_text:
  quote: ''
  summary: A sequence of didactic anecdotes and maxims contrasts generosity with power,
    contentment with importunity, wisdom with wealth and kingship, independence with
    patronage, temperance with excess, and measured eating with gluttony. Named and
    unnamed wise figures, rulers, dervishes, physicians, and religious authorities
    are used as vehicles for moral instruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wise man is asked whether munificence or courage is preferable, and he answers
    that one who has munificence has no need of courage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tombstone inscription attributed to Bahram-gor says liberality is stronger
    than power, recalls Hatim Tayi's enduring name for generosity, and urges giving
    a tithe of wealth in alms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mendicant from western Africa speaks among shopkeepers at Aleppo and says
    that equity among the wealthy and contentment among the poor would end importunity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that contentment makes one rich, patience is associated
    with Lucman, and lack of patience is linked with lack of wisdom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Two noble Egyptian youths choose different pursuits: one studies knowledge
    and becomes the wisest man of his age, while the other accumulates wealth and
    becomes king of Egypt.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wealthy Egyptian brother scorns the poorer philosophical brother, who
    replies that wisdom is the heritage of prophets and that he is grateful not to
    possess the means to injure others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A dervish in want patches his ragged garment and consoles himself that a dry
    crust and coarse woollen frock are preferable to dependence on another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When told that a benevolent gentleman could relieve his condition, the dervish
    refuses and says it is better to die of want than expose necessities before another.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Persian king sends a skilful physician to Mohammed, but no one among the
    Arabs requests medicine from him for years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mohammed explains that the tribe eats only when pressed by hunger and stops
    eating while still having appetite; the physician accepts this as the cause of
    their health and departs respectfully.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A person repeatedly vows abstinence and breaks the vows; a reverend gentleman
    warns that the person's appetite will eventually destroy him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A parable says that a man reared a wolf whelp, and when it was grown it tore
    its patron and master.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ardishir Babagan asks an Arabian physician how much food should be eaten daily;
    the physician answers that a hundred dirams' weight is sufficient and that excess
    food becomes a burden one must support.
  category: speech
  evidence_refs:
  - ev:7
