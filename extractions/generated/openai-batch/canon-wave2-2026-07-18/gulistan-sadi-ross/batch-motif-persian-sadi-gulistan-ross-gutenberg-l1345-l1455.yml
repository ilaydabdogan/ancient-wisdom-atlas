canonical_text:
  quote: ''
  summary: 'The passage opens Chapter II, “Of the Morals of Dervishes,” with several
    didactic anecdotes: a parsa refuses to judge a monk’s hidden heart; penitents
    pray at the Cabah for forgiveness; a holy man gives his rug to a thief; and traveling
    mendicants explain their caution after a thief disguised as a dervish brought
    punishment on innocent companions.'
  language: English
  quote_policy: summarized
