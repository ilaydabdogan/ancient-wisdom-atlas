canonical_text:
  quote: ''
  summary: A sequence of Gulistan anecdotes presents a widower complaining that his
    mother-in-law remains after his wife’s death; the narrator receiving a cooling
    drink from a beautiful woman and reflecting on thirst, beauty, and the divine
    cup-bearer; and the narrator’s meeting with a beautiful grammar student in Kashghar,
    followed by a farewell justified through an anecdote about a holy man who remains
    in a cavern to avoid temptation in the city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man’s beautiful wife has died, while her elderly mother remains in his house
    because of the dowry arrangement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When friends come to comfort him, the man says his wife’s absence is less
    intolerable than her mother’s presence, and he describes the wife as a rose or
    treasure and the mother as a thorn or snake.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The narrator remembers passing through a street in youth during intense summer
    heat and taking shelter in the shade because of thirst and weakness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A beautiful woman appears in a shadowed portico holding a goblet of snow-cooled
    water mixed with sugar and spirit of wine; the narrator drinks it and says he
    is restored to new life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator says that ordinary water cannot quench the kind of thirst he
    feels and contrasts intoxication with wine with intoxication with the cup-bearer,
    identified parenthetically as God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: During a period of peace between Sultan Mohammed Khowarazm-Shah and the king
    of Khota, the narrator enters the metropolitan mosque at Kashghar and meets a
    beautiful youth studying Arabic grammar.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator and the youth exchange remarks that connect the grammar example
    of Zaid and Amru with political peace, love poetry, and the need to address people
    according to their capacities.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The next day the youth learns that the narrator is Sa'di, expresses regret
    at not knowing earlier, offers service, and asks him to stay longer.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The narrator declines to remain and tells of a holy man who lives retired
    in a cavern and avoids the city because of its beautiful charmers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: After the explanation, the narrator and the youth kiss each other’s head and
    face and take leave, with verses expressing grief at farewell.
  category: action
  evidence_refs:
  - ev:11
