canonical_text:
  quote: ''
  summary: 'The passage presents three didactic episodes: a physically powerful but
    inexperienced young escort panics during an ambush; a rich man''s son and a poor
    dervish''s son dispute over their fathers'' tombs, leading to a moral about poverty
    as a light burden at death; and a man dressed like a dervish but lacking meekness
    abuses the rich in company.'
  language: English
  quote_policy: summarized
