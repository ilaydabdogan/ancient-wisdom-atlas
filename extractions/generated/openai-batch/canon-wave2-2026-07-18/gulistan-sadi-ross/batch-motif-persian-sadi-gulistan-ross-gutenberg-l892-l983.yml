canonical_text:
  quote: ''
  summary: Four didactic anecdotes and maxims concern royal generosity, the danger
    of hoarding, fair dealing by rulers, the growth of oppression from small abuses,
    punishment of an oppressive revenue-collector, and delayed retaliation against
    a powerful wrongdoer after his fall.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prince inherits immense riches from his father and gives innumerable gifts
    to his troops and people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A courtier advises the prince to restrain spending, warning of future accidents
    and enemies and recommending daily hoarding of treasure.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince rejects the courtier's advice and says God made him sovereign over
    the property so that he might enjoy and spend it, not hoard and watch it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince contrasts Carown, who perished despite many magazines of treasure,
    with Nushirowan, who is said not to have died because he left a fair reputation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a hunting seat, Nushirowan orders that salt from a village be taken at
    its fair price and not by force.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nushirowan says small beginnings of oppression accumulate, using examples
    of a monarch taking one apple and troops taking many fowls after a sanctioned
    taking of eggs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A revenue-collector seizes the huts of peasants in order to enrich the sovereign's
    treasury.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A cited maxim says that one who offends the Most High to gain a creature's
    favor will have that creature turned against him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage compares a burden-bearing ass favorably to a man-devouring lion
    and to people who injure fellow-creatures.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the revenue-collector's conduct is reported to the king, the king has
    him racked and tortured to death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A person who had suffered from the revenue-collector's oppression speaks at
    the time of the collector's execution about misuse of authority over subjects'
    property.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: An evil-disposed person strikes a pious good man on the head with a stone;
    the injured man keeps the stone because he has no power of revenge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the offender is cast into a dungeon by the sovereign, the poor man throws
    the same stone at his head.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The poor man says he feared the offender's high station earlier but acts after
    finding him in a dungeon.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: A closing maxim advises waiting until fortune has manacled the wicked person's
    hands before attacking him.
  category: speech
  evidence_refs:
  - ev:12
