canonical_text:
  quote: ''
  summary: A sequence of didactic maxims warns against weak persons opposing the powerful,
    rejected admonition, envy toward virtue, misplaced mercy or irreversible punishment,
    ignorant opposition to learning, and reliance on ancestry or display rather than
    intrinsic virtue and skill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that whoever contends with the great or strong risks his
    own blood, a broken head, or destruction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Images for imprudent opposition include butting with a ram, grappling with
    a lion, boxing against a naked scimitar, and setting a weak wrist against a wrist
    of iron.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that whoever will not listen to admonition harbors the prospect
    of hearing reproof and should hear it in silence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Idle people are compared to market curs that snarl at sporting dogs and prevent
    them passing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mean or envious person unable to vie with another in virtue is said to assail
    that person with malignity or reviling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that counsel with women is bad, generosity with prodigals
    is a fault, and mercy toward a sharp-fanged pard would be injustice to harmless
    sheep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage first says that a person who has a foe at his mercy and does not
    kill him is his own enemy, then reports an opposing maxim advising delay in execution
    of captives because release or execution remains possible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The opposing maxim says it is easier to separate soul from body than to restore
    life to the dead, and that an arrow cannot be recalled once it has left the bow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A learned man arguing with the ignorant is compared to a gem bruised by a
    stone, a nightingale caged with a crow, and a gold cup bruised by worthless stone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage contrasts genius and education, saying embers have noble origin
    in fire but may fall to dust without intrinsic worth, while sugar is valued for
    its own innate quality rather than for the cane.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage cites Canaan's bad disposition despite descent from Noah and says
    Abraham springs from Azor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Musk is said to disclose itself by smell, and a person expert in an art need
    not announce it because skill will show itself.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A wise man is compared to a silent vase in a druggist's shop that is full
    of virtues, while an ignorant man is compared to a warrior's drum, full of noise
    and empty babbling.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A learned man among illiterate people is compared to one of the lovely in
    a circle of the blind or the Koran in an infidel's dwelling.
  category: relationship
  evidence_refs:
  - ev:7
