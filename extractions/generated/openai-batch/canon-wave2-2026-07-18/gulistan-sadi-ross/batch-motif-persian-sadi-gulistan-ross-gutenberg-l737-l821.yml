canonical_text:
  quote: ''
  summary: A poor associate asks the narrator to help him obtain an accounting office.
    The narrator first warns him against royal service through maxims and a fox fable
    about false accusation, but the friend angrily appeals to the duties of friendship.
    The narrator then intercedes with the lord high treasurer; the associate is appointed,
    promoted, becomes a royal favorite, and the narrator closes with consolatory maxims
    about fortune, hidden mercy, and patience.
  language: English
  quote_policy: summarized
