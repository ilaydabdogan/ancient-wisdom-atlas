canonical_text:
  quote: ''
  summary: A sequence of didactic anecdotes contrasts temperance with indulgence,
    honor with dependence on miserly or sour-faced benefactors, self-earned bread
    with patronage, and concludes with Moses praying for a destitute dervish buried
    in sand for lack of clothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two dervishes of Khorasan travel together; one is spare and breaks his fast
    only every other night, while the other is robust and eats three meals daily.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two dervishes are detained at a city gate on suspicion of spying and sealed
    into a place whose entrance is built up with mud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a fortnight, the sealed place is opened; the strong dervish is dead
    and the weak dervish is alive and well.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wise man explains that the voracious eater could not endure lack of food,
    while the abstemious man survived because such patience was habitual to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A philosopher tells his son not to eat excessively, and the son replies that
    hunger can kill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father cites the Koranic instruction to eat and drink but not to excess,
    then frames moderation as avoiding both regorged food and life-deserting depletion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A wounded young man in battle is told that a notoriously stingy merchant has
    a mummy antidote that might help him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wounded youth refuses to ask the stingy merchant, saying the request itself
    would be like deadly poison, and the passage states that honorable death is preferable
    to infamous life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A learned man with a large family and small means asks a great man for support;
    his pension increases, but his reputation falls in the great man's eyes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A dervish needing money is introduced to a rich man, sees him sitting with
    a hanging lip and sullen discontent, says nothing, and returns home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hatim Tayi sacrifices forty camels, invites Arab tribal chiefs to a feast,
    and later meets a wood-cutter at the border of the desert.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The wood-cutter says that whoever can eat bread from his own labor will not
    put himself under obligation to Hatim Tayi; Hatim calls the wood-cutter superior
    in spirit and independence.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Moses sees a dervish who has buried his body in sand because he lacks clothing;
    the dervish asks Moses to pray for subsistence, and Moses prays accordingly.
  category: sequence
  evidence_refs:
  - ev:10
