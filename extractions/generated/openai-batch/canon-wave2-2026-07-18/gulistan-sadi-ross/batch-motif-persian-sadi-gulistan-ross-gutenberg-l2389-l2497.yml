  quote: ''
  summary: A sequence of moral anecdotes describes thirst and hunger in the desert,
    gratitude learned from seeing a worse deprivation, a king sheltered by a peasant,
    a wealthy mendicant compelled to contribute money, and a merchant whose endless
    trade ambitions are answered with a maxim on contentment and death.
  language: English
  quote_policy: summarized
