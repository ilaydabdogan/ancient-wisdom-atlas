canonical_text:
  quote: ''
  summary: 'Three adjacent didactic anecdotes describe religious speakers with harsh
    or discordant voices: a preacher corrected by a rival''s ironic dream report,
    a prayer-caller paid to leave a mosque post, and a Koran reciter told that his
    manner of chanting harms the dignity of his religion. A reflective passage praises
    frank criticism over flattering friends.'
  language: English
  quote_policy: summarized
