canonical_text:
  quote: ''
  summary: 'Three didactic court anecdotes: a condemned runaway slave avoids execution
    through a legal counterproposal involving the hostile vizir; an imprisoned minister
    refuses a neighboring prince’s offer and is restored by King Zuzan for fidelity;
    a holy man interprets a king’s reward of a diligent attendant as an image of divine
    reward at the judgment-seat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A slave of King Umraw-layas absconds and is brought back by pursuers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A vizir who dislikes the returned slave uses his influence to seek the slave’s
    execution as an example to other slaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The slave falls at the king’s feet and asks that, if he must die, the king
    establish a legal plea so the slave’s blood will not be charged to the king at
    the last reckoning or day of resurrection.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The slave proposes that the king command him to kill the vizir and then execute
    him in retaliation, so that his death would occur according to law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king smiles and asks the vizir’s advice; the vizir asks the king to manumit
    the slave and admits that he himself was at fault for engaging a dangerous opponent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: King Zuzan imprisons a generous minister after an act displeases him, but
    crown officers treat the minister courteously because of his former benefits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A bordering prince sends the imprisoned minister a covert letter offering
    appreciation, deliverance, and welcome if the minister will incline toward him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The imprisoned minister answers that he cannot betray his ancient benefactor
    and patron after a trifling change of affection.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After an informer reports the correspondence, King Zuzan orders investigation,
    reads the reply, commends the minister’s fidelity, gives him an honorary dress
    and largess, and apologizes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The restored minister says his calamity was ordained by God and states that
    foe and friend, pleasure and pain, and the hearts of both are at God’s disposal.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A king of Arabia orders that a certain attendant’s salary be doubled because
    he is constant in attendance, while other courtiers are distracted by play and
    neglect duty.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A holy man interprets the royal reward as a model for how devoted servants
    will be apportioned at the judgment-seat of the Most High, saying obedience is
    rewarded and the devout hope not to depart disappointed from God’s threshold.
  category: speech
  evidence_refs:
  - ev:9
