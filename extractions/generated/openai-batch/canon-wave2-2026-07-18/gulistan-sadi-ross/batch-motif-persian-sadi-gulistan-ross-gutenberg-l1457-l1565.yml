canonical_text:
  quote: ''
  summary: 'The passage presents several moral anecdotes: the narrator reflects on
    dervish instruction; a zahid performs false austerity before a king and is exposed
    by his son; the youthful narrator is rebuked by his father for judging sleepers;
    a sermon at Balbek on divine nearness affects a passing traveller more than the
    congregation; a camel-driver warns an exhausted pilgrim that moving toward Mecca
    is survival; and a wounded holy man thanks God that he suffers misfortune rather
    than sin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker gives thanks to a majestic Deity for instruction connected with
    dervishes and states that one indiscreet person can harm many prudent people,
    using the image of a dog contaminating a cistern of rose-water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A zahid, while a king's guest, eats less than his appetite wants and prays
    longer than usual so that observers will think highly of his sanctity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the zahid returns home and asks for food, his shrewd son points out
    that if the meal at court was only for show, the prayers should also be repeated;
    the narration then warns the hypocrite about the day of judgment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In youth, the narrator stays awake all night beside his father with the Koran
    open on his lap while others sleep, and he criticizes the sleepers for not rising
    to pray.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The father replies that the narrator would have done better to sleep than
    to calumniate others, and he describes the braggart as enclosed by a veil of conceit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the metropolitan mosque of Balbek, the narrator preaches to a cold-hearted
    congregation on the Koranic statement that God is nearer than the vein of the
    neck, using the image of an intimate mistress from whom he remains estranged.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A traveller entering the outer circle of the congregation responds to the
    sermon with a groan, after which others join in lamentation; the narrator says
    that those far away may be present in knowledge while those nearby may be distant
    in ignorance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: During a night journey in the desert of Mecca, the exhausted narrator lies
    down and asks the camel-driver to leave him to his fate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The camel-driver tells the narrator that holy Mecca lies ahead and a profane
    robber behind; to go forward is to escape, while to remain is to die.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the sea-shore, a holy man wounded by a tiger gives thanks to the Most High,
    saying he has been overtaken by misfortune and not by sin, and that death from
    the beloved friend God would not make him cling to life.
  category: speech
  evidence_refs:
  - ev:7
