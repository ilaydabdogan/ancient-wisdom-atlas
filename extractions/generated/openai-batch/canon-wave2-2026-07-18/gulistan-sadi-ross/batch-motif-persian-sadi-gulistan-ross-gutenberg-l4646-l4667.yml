  quote: Any discreet man that was in Mujnun's company would entertain him only with
    encomiums on Laila.
  summary: 'The passage gives maxims on social speech: one should accommodate speech
    to the host or hearer, as a discreet person with Mujnun would speak in praise
    of Laila; one who interrupts others to display knowledge exposes ignorance, and
    a prudent person waits until a question is properly stated before answering.'
