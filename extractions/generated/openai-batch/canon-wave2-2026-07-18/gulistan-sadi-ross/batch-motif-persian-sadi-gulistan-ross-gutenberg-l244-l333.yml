  quote: ''
  summary: 'The passage presents several royal anecdotes: a king spares a condemned
    captive after a compassionate vizir reframes the captive''s abuse as pious counsel;
    an inscription associated with King Feridun warns that worldly dominion is impermanent;
    a king dreams of the dead Sultan Mahmud whose eyes still look about because others
    possess his former wealth; and an underestimated short prince proves his wisdom
    in speech and his valor in battle.'
