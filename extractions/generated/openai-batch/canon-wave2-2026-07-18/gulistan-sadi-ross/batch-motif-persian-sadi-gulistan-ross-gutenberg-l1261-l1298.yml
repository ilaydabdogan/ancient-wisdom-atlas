canonical_text:
  quote: ''
  summary: Two moral anecdotes are presented. In the first, Harun-al-Rashid's child
    complains that an officer's son has insulted his mother; ministers propose severe
    punishments, while Harun counsels forgiveness or strictly bounded retaliation
    and praises restraint in anger. A supporting example describes a man who answers
    abuse with humility. In the second, the narrator is in a vessel when a boat sinks
    behind them and two brothers are drawn into a whirlpool; a gentleman offers a
    reward to the pilot, who saves one brother while the other dies. The pilot explains
    that the rescued brother once helped him in the desert, while the dead brother
    once whipped him. The passage closes with a moral that good and evil return to
    the doer and urges care for the poor and needy.
  language: English
  quote_policy: summarized
