canonical_text:
  quote: ''
  summary: 'A sequence of moral anecdotes: a drunken youth rebukes a scornful ascetic
    by asking for compassion toward sinners; a beaten dervish is instructed by his
    spiritual father to practice resignation and forgiveness; a personified standard
    and curtain dispute dignity, with the curtain defending humility; a holy man teaches
    that self-control is greater than physical strength; a father rebukes a shoemaker
    for injuring his wife; and a law doctor refuses to restore his blind son-in-law''s
    sight, fearing he would repudiate an ugly wife.'
  language: English
  quote_policy: summarized
