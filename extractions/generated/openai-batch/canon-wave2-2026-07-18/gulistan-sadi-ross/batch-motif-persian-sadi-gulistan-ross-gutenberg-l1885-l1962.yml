canonical_text:
  quote: ''
  summary: A Syrian holy man living ascetically in the wilderness is persuaded by
    a king and minister to move into a city garden near the royal residence. The king
    supplies a luxurious dwelling, a beautiful damsel, and a beautiful youth. The
    hermit adopts rich food, clothing, perfumes, and ease, and is later found transformed
    in appearance and habits. A philosophic vizir advises the king to give money to
    learned men so they can teach, but to give nothing to hermits so they remain anchorites.
  language: English
  quote_policy: summarized
