canonical_text:
  quote: ''
  summary: A sequence of moral anecdotes presents rulers confronted by fear, death,
    holy counsel, oppressed subjects, and ascetic rebuke. Hormuz explains the confinement
    of ministers through a maxim about fearing those who fear one. A dying Arab king
    hears news of conquest but recognizes it will benefit his heirs. At the tomb of
    Yahiya/John the Baptist, an unjust prince seeks prayer against an enemy and is
    counseled to show justice to weak subjects. Dervishes or holy men answer tyrants
    with prayers or advice that their inaction or death would benefit others. A naked
    dervish outside in the cold prompts a carefree intoxicated king to give him money
    and clothing.
  language: English
  quote_policy: summarized
