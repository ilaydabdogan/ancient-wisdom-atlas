  summary: Three didactic anecdotes and maxims describe a fisherman losing a strong
    fish because fortune was not with him, a handless and footless person killing
    a many-footed creature because destiny overtook it, and Sa'di criticizing an ignorant
    man adorned with elite clothing and status markers.
