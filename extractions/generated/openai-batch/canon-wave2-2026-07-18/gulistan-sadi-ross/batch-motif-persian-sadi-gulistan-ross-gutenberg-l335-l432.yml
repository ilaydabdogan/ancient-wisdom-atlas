canonical_text:
  quote: ''
  summary: A young warrior rallies the king's troops, is declared heir, survives a
    poisoning attempt by his brothers through his sister's warning, and the king divides
    his domains. A new anecdote then describes Arab robbers occupying a mountain stronghold,
    their capture by ambush, and a royal debate over whether a youthful robber should
    be executed or spared. The vizir argues for mercy and education, citing tradition
    and exempla; the king grants pardon while warning that a small foe may become
    dangerous.
  language: English
  quote_policy: summarized
