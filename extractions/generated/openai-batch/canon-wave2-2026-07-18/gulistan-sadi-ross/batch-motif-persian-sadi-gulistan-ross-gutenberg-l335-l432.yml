candidate_motifs:
- id: motif:1
  label: youthful valor leading to royal succession
  taxonomy_refs:
  - royal_legitimacy
  basis: The youth rallies the army, the troops win, and the king declares him heir-apparent.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a didactic court anecdote rather than a formal royal origin
    or enthronement myth.
- id: motif:2
  label: jealous kin attempt poisoning of an elevated youth
  taxonomy_refs: []
  basis: After the youth is declared heir-apparent, his brothers bear him a grudge
    and put poison into his food; his sister's sign prevents him from eating.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a concise episode and does not elaborate a full sibling-rivalry
    cycle.
- id: motif:3
  label: prevent danger while it is still small
  taxonomy_refs:
  - wisdom
  basis: Officials compare the robber threat to a newly rooted tree and a dam leak
    that should have been stopped early; the king later quotes a warning about a small
    stream becoming destructive.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: This is expressed as proverbial wisdom within the passage, not as a supernatural
    narrative.
- id: motif:4
  label: mountain stronghold of outlaws overcome by ambush
  taxonomy_refs: []
  basis: Robbers occupy a mountain fortress and are defeated when warriors hide in
    the mountain recesses and capture them after their return.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The mountain is a military setting, not described as cosmic or sacred.
- id: motif:5
  label: intercession for a condemned youth
  taxonomy_refs:
  - wisdom
  basis: The vizir and courtiers plead for the young robber's life, and the king grants
    pardon despite misgivings.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The motif is didactic and judicial; no miraculous rescue is described.
- id: motif:6
  label: innate vice versus reform through association
  taxonomy_refs:
  - wisdom
  basis: The king argues that the vicious cannot be improved, while the vizir argues
    that the boy may learn from virtuous company and cites examples of association.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents a moral debate and does not resolve the philosophical
    issue beyond granting pardon.
- id: motif:7
  label: serpent offspring as lingering danger
  taxonomy_refs:
  - serpent
  basis: The king says that killing a viper while fostering its young would not be
    rational, as part of his argument against sparing the robber youth.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The serpent appears in a metaphorical speech, not as an acting creature
    in the narrative.
comparison_claims:
- id: claim:1
  claim: The vizir explicitly links his argument about the stripling's reformability
    to a tradition that a child is born on the right way and is later shaped by parents.
  claim_level: same_function
  target: Islamic tradition on child nature and upbringing cited in the passage
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses the tradition as an internal didactic citation; it
    does not provide source details beyond the quoted formulation.
- id: claim:2
  claim: The vizir uses the wife of Lot and the dog of the Seven Sleepers as contrasting
    exempla for the moral effect of association with the wicked or the righteous.
  claim_level: same_function
  target: Lot's wife and the dog of the Seven Sleepers as association exempla
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is explicitly made in the vizir's speech, but only in
    brief summary form.
- id: claim:3
  claim: The king compares the pardoned enemy youth to Zal's warning to Rustem that
