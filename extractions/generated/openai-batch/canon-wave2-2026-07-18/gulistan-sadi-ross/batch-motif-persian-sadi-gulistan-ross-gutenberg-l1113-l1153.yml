canonical_text:
  quote: ''
  summary: A wrestling master teaches a favored pupil nearly all of his many techniques
    but withholds one. The pupil becomes powerful, boasts before the king that he
    equals his master, and is ordered into a public match. The master defeats him
    with the one withheld technique. The king rewards the master and reproaches the
    pupil. The master explains that he reserved the trick for such a day and cites
    sayings about not giving a friend power to harm and about pupils turning learned
    archery against their teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is described as a master of wrestling who knew three hundred and
    sixty sleights and could show a fresh trick for every day of the year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The master taught one scholar three hundred and fifty-nine feats but delayed
    teaching one remaining feat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth became so proficient in wrestling that his contemporaries could
    not cope with him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth boasted before the reigning sovereign that the master’s only superiority
    came from seniority and tutorship, not greater power or skill.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king was displeased and ordered a wrestling match in a fenced spacious
    field before ministers, nobles, and gallant men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The youth rushed into the ring with great force, compared to a huge elephant
    and to force capable of moving a brazen mountain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The master, aware that the youth was stronger, used the strange feat that
    he had not taught him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The master seized the youth with both hands, lifted him above his head, and
    threw him to the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The crowd shouted, and the king ordered an honorary dress and largess for
    the master.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king reproached the youth for acting treacherously toward his own patron
    and failing in his presumption.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The youth said the master did not overcome him by strength and ability but
    by one wrestling trick withheld from instruction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The master said he had reserved the trick for such a day and quoted advice
    not to give a friend so much power that, if hostile, the friend can injure one.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The master added a proverbial saying about pupils who learn archery from a
    teacher and later make that teacher their target.
  category: speech
  evidence_refs:
  - ev:6
