canonical_text:
  quote: ''
  summary: A sequence of didactic anecdotes and maxims concerns a spendthrift dervish
    who angers a king after squandering charity, a minister who counsels measured
    generosity, an ancient king whose underpaid soldiers abandon him, a displaced
    vizir who refuses return to office after joining dervishes, and a parable of a
    lion-provider who accepts a lion's protection but avoids dangerous closeness.
    The passage repeatedly warns about timing, patronage, royal fickleness, and prudent
    withdrawal from power.
  language: English
  quote_policy: summarized
