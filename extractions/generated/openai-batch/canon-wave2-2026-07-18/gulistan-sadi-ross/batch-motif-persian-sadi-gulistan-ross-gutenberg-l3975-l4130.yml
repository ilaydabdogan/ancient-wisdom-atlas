candidate_motifs:
- id: motif:1
  label: generosity over hoarding
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly contrasts the person who gives with the person who
    hoards riches and dies leaving them behind.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is aphoristic and ethical rather than narrative myth.
- id: motif:2
  label: divine bounty as model for human giving
  taxonomy_refs:
  - wisdom
  - sacred_exchange
  basis: Moses tells Carum to be bounteous as God has been bounteous, and the passage
    urges generosity and gratitude for divine grace.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The exchange is moral and devotional; no formal ritual exchange is described.
- id: motif:3
  label: knowledge must become practice
  taxonomy_refs:
  - wisdom
  basis: The passage says acquiring science without practice is vain and compares
    book-learning without practice to a beast carrying books.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: Presented as didactic maxim, not as a developed tale.
- id: motif:4
  label: blind guide
  taxonomy_refs:
  - wisdom
  basis: An intemperate learned man is likened to a blind link-boy who shows the road
    to others but does not see it himself.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The image is explicitly comparative and metaphorical.
- id: motif:5
  label: friend and enemy reversal
  taxonomy_refs:
  - wisdom
  - duality
  basis: The passage warns that a friend may become an enemy and an enemy may become
    a friend, and that a friend allied with foes should be abandoned.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The duality is social and prudential rather than cosmological.
- id: motif:6
  label: small fire becoming world-consuming threat
  taxonomy_refs:
  - world_destroying_fire
  basis: A weak enemy is compared to a spark that should be quenched before it becomes
    a flame able to consume a whole world.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The world-consuming fire is a metaphor for political danger, not a literal
    cosmogonic or apocalyptic event.
- id: motif:7
  label: stratagem before sword
  taxonomy_refs:
  - wisdom
  basis: The passage says money and stratagem should be used before life is endangered
    or the sword decides.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: This is a proverb-like rule of prudence rather than a narrated conflict
    episode.
- id: motif:8
  label: peace-seeker not forced into war
  taxonomy_refs:
  - wisdom
  basis: The passage advises choosing the least offensive course and not forcing a
    mild-spoken person at the gate of peace into war.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The motif is expressed as counsel, not as a story scene.
- id: motif:9
  label: misplaced mercy empowers the oppressor
  taxonomy_refs:
  - wisdom
  basis: The passage says compassion to the wicked tyrannizes the good and pardon
    of the oppressor harms the oppressed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The claim is normative and social rather than mythic.
