  quote: ''
  summary: The passage gives an aphorism about regret at death for those who possessed
    wealth but did not spend it and those who possessed knowledge but did not practice
    it. It contrasts the miser with the generous person. The conclusion states that
    the Gulistan was completed by God's assistance, defends the author's original
    and humorous style of instruction, compares moral warning to prophetic message-delivery,
    and asks the reader to pray for the author, transcriber, owner, and translator.
  language: English
