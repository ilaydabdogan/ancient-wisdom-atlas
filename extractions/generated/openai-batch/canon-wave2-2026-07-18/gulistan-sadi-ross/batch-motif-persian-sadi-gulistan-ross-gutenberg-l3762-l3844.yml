canonical_text:
  quote: poverty is my glory!
  summary: A first-person disputant and a dervish argue over poverty and wealth. The
    first speaker distinguishes true spiritual poverty from performative begging and
    argues that wealth enables charity, lawful enjoyment, and protection from transgression.
    The dervish replies that the rich are proud, contemptuous, and spiritually poor
    despite their possessions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The antagonist cites a prophetic saying that poverty is a glory.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person speaker says the prophetic saying applies to people resigned
    to fate, not to people wearing pious garb in order to receive charitable bread.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first-person speaker addresses the opponent as an empty sound, asks what
    he can effect on the last day of account, and tells him to turn away from begging
    rather than only repeat a rosary.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first-person speaker says poverty without divine knowledge comes near
    infidelity, while wealth can clothe the naked and free prisoners.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first-person speaker cites the Koran concerning provision for the blessed
    in Paradise and connects present property with Providence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first-person speaker says hardship and appetite can lead a person into
    dangerous enterprises, disregard of future punishments, and failure to distinguish
    lawful from forbidden acts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The first-person speaker uses food-related similes: a dog mistakes a clod
    for a bone, and a greedy person mistakes a corpse bier for a tray of food.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first-person speaker says the worldly opulent are regarded by Providence
    and are preserved from illegal things through lawful enjoyments.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first-person speaker lists poverty-linked harms and punishments, including
    pinioned felons, jailed bankrupts, innocence ruined, theft punished by mutilation,
    housebreaking, and suspension by the heels.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The first-person speaker says lawful access to beautiful companions prevents
    desire for forbidden acts and uses houris, idols of Yaghma, and dates as images
    in the argument.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The first-person speaker says hungry people steal bread and that poverty can
    lead chaste people into wickedness and public disgrace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the first speech ends, the dervish abandons forbearance and replies
    in language figured as drawing a tongue-sabre and riding the steed of eloquence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The dervish says the rich are proud, self-conceited, fastidious, overbearing,
    greedy for wealth, and ambitious for rank.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The dervish says the rich insult learned people as beggars, reproach the indigent
    for rags, refuse humble salutations, and may be rich in appearance but beggars
    in reality.
  category: speech
  evidence_refs:
  - ev:7
