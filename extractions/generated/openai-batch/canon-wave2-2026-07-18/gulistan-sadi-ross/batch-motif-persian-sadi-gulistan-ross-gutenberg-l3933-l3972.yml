  summary: A cazi answers a dervish's criticism of rich people by distinguishing misers
    who ignore distress from generous wealthy people who seek worldly and otherworldly
    benefit. He praises a named sovereign, and the disputants reconcile, ending with
    verses advising the poor not to complain and the rich to spend and give.
