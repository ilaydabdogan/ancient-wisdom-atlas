canonical_text:
  quote: ''
  summary: The passage presents two moral anecdotes. In the first, Moses returns from
    a conference with God on Mount Sinai and encounters a dervish being taken for
    retaliation after drunkenness, quarrel, and killing; the narrator draws a lesson
    about divine wisdom in limiting rank, wealth, and power. In the second, an Arab
    in Busrah recounts being lost in the desert without provisions and finding pearls
    that he first mistakes for food, learning that treasure is useless where sustenance
    is needed.
