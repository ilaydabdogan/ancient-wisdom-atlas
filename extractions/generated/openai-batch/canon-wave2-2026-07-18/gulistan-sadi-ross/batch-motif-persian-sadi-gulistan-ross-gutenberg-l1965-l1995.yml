  quote: such as are recluses do not take money; and such as take money are not anchorites
  summary: A king vows to distribute money among recluses if an important affair succeeds.
    After success, he sends a servant with a bag of coins, but the servant returns
    saying he found no true recluses, because true recluses do not accept money. The
    king acknowledges the servant’s point. A learned man is then asked about consecrated
    bread or alms and distinguishes acceptable support for devotion from forbidden
    collection for endowment.
