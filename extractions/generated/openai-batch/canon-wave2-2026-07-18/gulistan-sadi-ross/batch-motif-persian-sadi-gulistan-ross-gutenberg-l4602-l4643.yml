canonical_text:
  quote: A learned man without works is a bee without honey
  summary: 'The passage gives several moral aphorisms: learning without action is
    likened to a honeyless bee; self-provided plain clothing and food are preferred
    to dependent luxury; prudence requires tested guidance like a physician or caravan;
    Ghazali praises asking others when ignorant; and Lucman refrains from asking David
    about miraculously moulded iron because he expects wisdom to reveal it in due
    course.'
  language: English
  quote_policy: quoted
