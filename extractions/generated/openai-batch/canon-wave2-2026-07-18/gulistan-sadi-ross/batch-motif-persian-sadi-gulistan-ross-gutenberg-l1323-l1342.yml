canonical_text:
  quote: Power and fortune depend not on knowledge
  summary: Harun-al-Rashid conquers Egypt and, in contempt of Pharaoh’s pride, appoints
    a lowly and foolish slave, Khosayib, to govern it. Khosayib gives an absurd answer
    to farmers whose cotton has been washed away. A holy man comments that fortune
    and power do not correspond to knowledge but come through heaven, and illustrates
    this with a fool finding treasure while a learned projector fails.
  language: English
