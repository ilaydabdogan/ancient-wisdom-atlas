canonical_text:
  quote: ''
  summary: The narrator returns from pilgrimage and meets a formerly powerful acquaintance
    now reduced, accused, abandoned by friends, imprisoned, released, and dispossessed.
    The narrator reminds him of earlier counsel about the hazards of serving princes.
    A second anecdote describes the narrator interceding with a prince to restore
    support to a pious fraternity after their patronage was withdrawn; after humble
    entry and moral appeal, the prince restores the allowance and arrears.
  language: English
  quote_policy: summarized
