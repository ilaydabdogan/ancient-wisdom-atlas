  evidence_refs:
  - ev:2
- id: obs:4
  text: The man describes general mistreatment of one who has fallen and praise of
    one favored by fortune.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man says he endured persecution, was released from imprisonment after
    news of the pilgrims’ safe return, and lost hereditary property by confiscation.
  category: speech
  evidence_refs:
  - ev:3
