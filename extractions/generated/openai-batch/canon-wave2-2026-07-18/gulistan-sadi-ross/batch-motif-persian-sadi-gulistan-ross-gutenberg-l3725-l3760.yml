canonical_text:
  quote: poverty has a gloomy aspect in this world and in the next
  summary: The speaker replies to a friend by defending the rich as benefactors of
    the poor, travelers, pilgrims, and dependents. He argues that wealth enables charitable
    and ritual giving, makes worship more collected, and that poverty distracts a
    person from devotion. He supports the argument with an ant's seasonal storing
    and with cited Arabic and prophetic sayings about poverty.
  language: English
  quote_policy: quoted
