canonical_text:
  quote: We should not fix our heart so on any thing or being as to find any difficulty
    in removing it.
  summary: A ragged dervish traveling with a caravan loses a gift of money to robbers
    but remains unmoved and teaches detachment. The narrator responds with a memory
    of intense youthful attachment to a beautiful young man whose death led to mourning
    at the tomb, dirges, and a vow to withdraw from worldly enjoyment and society.
  language: English
  quote_policy: quoted
