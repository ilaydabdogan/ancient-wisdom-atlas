  summary: The introduction identifies Sa'di as a Shirazi Persian poet and author
    of the Gulistan, describes his actual garden hermitage and an anecdote contrasting
    perishable flowers with the enduring Rose Garden of his book, compares Sa'di with
    Hafiz within Sufic pantheism, recounts Sa'di's religious formation, travels, preaching,
    slavery, and return to Shiraz, and characterizes the Gulistan as a work of practical
    wisdom and religious suggestion.
