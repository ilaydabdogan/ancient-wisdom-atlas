canonical_text:
  quote: ''
  summary: 'The passage contains several moral anecdotes: a man avoids visiting a
    friend while the friend holds high office, preferring to visit when he is out
    of office; the Prophet tells Abu-Horairah not to visit daily so affection may
    increase; a holy man explains that the sun is not loved because it is seen daily
    except when veiled in winter clouds; the narrator withdraws from society, is captured
    by Franks and forced to dig at Tripoli, is ransomed by an Aleppo chief, married
    to the chief’s daughter, and then compares that marriage to a worse enslavement;
    a final sheep-and-wolf exemplum presents a rescued sheep reproaching the rescuer
    who later slaughters it.'
  language: English
  quote_policy: summarized
