canonical_text:
  quote: ''
  summary: 'The passage gives didactic counsel that food and life are governed by
    divine provision and destiny: seeking or not seeking daily bread makes no difference
    to God''s provision, and even predators cannot kill unless destiny ordains it.
    A further aphorism states that what is not designed cannot be reached, while what
    is ordained can be attained anywhere. Alexander is cited as having reached chaos
    after great toil but failing to drink the water of immortality.'
