canonical_text:
  quote: ''
  summary: 'Four didactic anecdotes: a Shaikh advises the narrator to answer slander
    by continence; a Shaikh of Syria contrasts inward and outward Sufi states; a mystically
    distracted traveler hears animals praising God at dawn and laments his own heedlessness;
    during a pilgrimage toward Hijaz, a boy''s plaintive song moves an ascetic''s
    camel to ecstatic motion, prompting the narrator to rebuke the ascetic''s insensibility
    and describe all creation as praising God.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker complains to a reverend Shaikh that a certain person
    has testified against his character on the charge of lasciviousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shaikh tells the speaker to shame the detractor through continence and
    virtue, and compares a virtuous person to a harp already in tune.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Shaikh of Sham or Syria is asked about the condition of the Sufi sect and
    answers by contrasting former spiritual unity with present outward clothing and
    inward raggedness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Shaikh of Sham says that a wandering heart prevents purity even in seclusion,
    while a heart fixed on God makes a wealthy or high-ranking person a hermit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator and a caravan march all night and halt toward morning on the
    skirts of the wilderness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A mystically distracted companion laments loudly at dawn, wanders into the
    desert, and takes no rest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The companion says nightingales, pheasants, frogs, and wild beasts were awake
    in God's praise, making his own sleep of forgetfulness seem ungenerous.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The companion says a bird's morning song took away his patience, reason, fortitude,
    and understanding, and that humans should not be silent while birds sing God's
    praise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: On a pilgrimage to Hijaz, the narrator travels familiarly with piously disposed
    young men who hum tunes and chant spiritual hymns, while an abid disparages the
    morals of dervishes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the palm plantation of the tribe of Hulal, a tawny-complexioned boy comes
    out from the Arab horde and sings a plaintive melody.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The abid's camel kicks, prances, throws the abid, and dances into the wilderness
    after the boy's song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator tells the abid that the spiritual strain threw a brute into ecstasy
    and asks why it has not likewise changed him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The narrator uses images of zephyr moving a ban-tree twig but not a solid
