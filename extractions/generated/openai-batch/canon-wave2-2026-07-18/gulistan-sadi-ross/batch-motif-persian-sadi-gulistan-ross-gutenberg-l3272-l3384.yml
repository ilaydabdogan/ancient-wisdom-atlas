canonical_text:
  quote: ''
  summary: 'A sequence of didactic anecdotes on old age, death, family obligation,
    and prudence: a Persian-speaking dying old man laments the brevity of life and
    rejects medical consolation; a rich old man recalls praying at a pilgrimage tree
    for a son while the son privately wishes to pray for his father''s death; an exhausted
    young traveler receives advice from a slower old man; a formerly merry youth becomes
    a family man and laments lost youth; and a mother reproves her son for harshness
    by reminding him of infancy.'
  language: English
  quote_policy: summarized
