  quote: A king had reached the end of his days and had no heir to succeed him.
  summary: A dying king without an heir orders that the first person entering the
    city gate in the morning be crowned. A beggar becomes ruler, later loses provinces
    to rebellion, and tells an old friend that prosperity brings burdens and that
    contentment is better than riches.
