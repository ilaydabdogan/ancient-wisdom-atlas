canonical_text:
  quote: ''
  summary: In one anecdote, Nushirowan the Just is told that God has removed an enemy
    from the world, and he refuses to rejoice because his own life is also temporary.
    In another, Abu-zarchamahr remains silent during a court council until asked why;
    he says ministers resemble physicians who intervene only when needed, and that
    he would speak if he saw danger like a blind man walking into a pit.
