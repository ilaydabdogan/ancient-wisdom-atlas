canonical_text:
  quote: ''
  summary: 'The supplied passage presents three didactic anecdotes: a solitary dervish
    refuses to honor a passing king and admonishes him about kingship, mortality,
    and the transience of dominion; an innocent condemned man persuades a king that
    unjust execution would leave the king with enduring sin, and the king spares him;
    Nushirowan and his ministers debate an affair of state, and Abu-zarchamahr explains
    why he conforms to the king’s opinion when outcomes are uncertain.'
  language: English
