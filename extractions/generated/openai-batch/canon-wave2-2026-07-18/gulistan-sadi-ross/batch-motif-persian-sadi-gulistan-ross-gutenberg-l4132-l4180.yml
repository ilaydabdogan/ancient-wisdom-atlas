  quote: ''
  summary: A sequence of ethical aphorisms warns against mercy toward the wicked,
    recommends inverting an adversary’s counsel, criticizes rulers without clemency
    and holy men without learning, describes anger as fire that first burns the angry
    person, contrasts fiery pride with earthy patience, and says an evil-disposed
    person cannot escape his own evil heart even by ascending to heaven.
  language: English
