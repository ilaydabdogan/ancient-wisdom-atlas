candidate_motifs:
- id: motif:1
  label: Equal instruction, unequal innate capacity
  taxonomy_refs:
  - wisdom
  basis: The preceptor’s answer and the stone and Canopus analogies all distinguish
    identical external influence from differing internal capacity.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a didactic wisdom motif rather than a mythic plot episode.
- id: motif:2
  label: Trust in providence from prenatal care
  taxonomy_refs:
  - wisdom
  basis: The senior argues that God provided the embryo with faculties and therefore
    will not forget daily sustenance.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents theological admonition, not a narrated divine intervention.
- id: motif:3
  label: Judgment by deeds rather than lineage
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The Arab father says God will ask what one has done in life and not ask about
    one’s father or origin.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No extended afterlife journey or courtroom scene is narrated.
- id: motif:4
  label: Veneration through sacred association
  taxonomy_refs:
  - wisdom
  basis: The Caabah covering is revered not because of its silk-worm fabric but because
    of association with a venerable friend.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives an analogy about association; it does not describe a
    ritual origin myth.
- id: motif:5
  label: Ingratitude to parents and kindred brings disfavor
  taxonomy_refs:
  - wisdom
  basis: Scorpion birth lore is interpreted as a sign of hostile conduct toward parents,
    and the dying father’s maxim warns against ingratitude to kindred.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The scorpion account is presented as reported philosophical lore and moral
    exemplum.
- id: motif:6
  label: Bad character needs no greater season or opportunity
  taxonomy_refs:
  - wisdom
  basis: The speaking scorpion says its character in summer gives no reason for it
    to come abroad also in winter.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a brief animal fable-like repartee, not a developed mythic narrative.
- id: motif:7
  label: Pilgrimage tested by conduct
  taxonomy_refs:
  - wisdom
  basis: The foot-pilgrims cross the desert but become worse through contention, while
    the patient camel is called the real pilgrim.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage emphasizes ethical conduct during pilgrimage rather than pilgrimage
    as a mystical quest.
- id: motif:8
  label: Danger of practicing fire where conditions are fragile
  taxonomy_refs:
  - wisdom
  basis: The philosopher warns that fireworks are unsuitable for someone living in
    a straw dwelling.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The motif is practical admonition; fire symbolism is present through fireworks
    but not elaborated cosmologically.
- id: motif:9
  label: Misplaced trust in unqualified expertise
  taxonomy_refs:
  - wisdom
  basis: The man consults a horse-doctor for a human eye complaint, is blinded, and
    the moral warns against entrusting important affairs to inexperienced persons.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The judge’s harsh verdict is part of the exemplum and should not be generalized
    beyond the passage.
- id: motif:10
  label: Respect for sacred text by avoiding desecration
  taxonomy_refs:
  - wisdom
  basis: The Imaam refuses to inscribe Qur'anic verses where time, feet, or dogs might
    deface or defile them.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives a reverential norm, not a myth about scripture’s origin.
- id: motif:11
  label: Grave imagined as seasonal floral renewal
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: The epitaph asks the friend to wait for spring to see roses blossoming on
    the dead son’s bosom or from his dust.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The image is poetic and vegetal; it does not explicitly narrate bodily
    resurrection.
