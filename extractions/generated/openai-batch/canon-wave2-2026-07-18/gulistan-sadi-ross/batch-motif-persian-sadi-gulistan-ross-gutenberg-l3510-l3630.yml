canonical_text:
  quote: ''
  summary: A sequence of didactic anecdotes and aphorisms addresses education and
    innate capacity, trust in divine providence, judgment by deeds rather than ancestry,
    filial ingratitude through scorpion lore, quarrelsome pilgrims, unsuitable fireworks,
    misplaced trust in an unqualified healer, and a bereaved Imam’s epitaph for his
    son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king entrusts his son to a preceptor; the preceptor’s own sons excel while
    the king’s son does not, and the preceptor answers that the instruction was the
    same but capacities differed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The education anecdote is followed by analogies of stones that may or may
    not contain precious metals and the star Canopus producing different qualities
    in different places.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A learned senior tells a disciple that if humans sought God as earnestly as
    sustenance, their places in Paradise would surpass those of angels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: God is described as providing the embryo with soul, reason, bodily form, speech,
    judgment, understanding, and other faculties, and therefore as not forgetting
    daily bread.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: An Arab tells his son that on the day of judgment God asks about deeds in
    life, not ancestry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The covering of the Caabah is said to be revered not for its material origin
    but because it associated with a venerable friend.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Books of philosophers are cited for the claim that scorpions are born by eating
    through their mother’s womb and tearing open her belly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A good and great man accepts the scorpion account as fitting their conduct
    toward parents; a dying father warns his son that ingratitude to kindred cannot
    expect fortune’s friendship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A scorpion, asked why it does not appear in winter, answers by questioning
    whether its summer character would justify appearing also in winter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: During a pilgrimage to Mecca, foot-travellers fall into quarrels, accusations,
    and recriminations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A rider in a camel-litter compares chess pawns that become queens after crossing
    the board with foot-pilgrims who cross the desert and become worse.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the quarrelsome haji is not a real pilgrim, while the patient
    camel feeding on thorns and bearing a burden is called one.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Hindu teaches fireworks, and a philosopher warns that this sport is unsuitable
    for someone whose dwelling is made of straw.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man with an eye complaint consults a horse-doctor, receives a quadruped
    eye remedy, becomes blind, and is denied redress by the judge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The moral states that important affairs should not be entrusted to inexperienced
    or mean-capacity persons.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: A great Imaam’s son dies; the Imaam avoids putting Qur'anic verses on the
    tomb urn where they may be effaced, trodden upon, or defiled, and selects an epitaph
    about spring and roses from the dead son’s dust.
  category: sequence
  evidence_refs:
  - ev:9
