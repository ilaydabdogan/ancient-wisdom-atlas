canonical_text:
  quote: ''
  summary: A sequence of didactic sayings describes fearless counsel to kings, the
    duties of rulers and officials, the danger of corrupt judges, and a wise man's
    explanation that the cypress is called free because, unlike fruiting trees, it
    is not bound to seasonal flourishing and decline; the cypress, date-tree, and
    Tigris are used as moral images for independence, generosity, and endurance beyond
    political power.
  language: English
  quote_policy: summarized
