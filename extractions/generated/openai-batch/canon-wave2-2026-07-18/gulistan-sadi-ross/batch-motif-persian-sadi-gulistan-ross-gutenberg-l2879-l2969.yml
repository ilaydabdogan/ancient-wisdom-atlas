  summary: The passage presents several brief anecdotes and aphoristic reflections
    about friendship, love, jealousy, absence, attachment, reproach, and regret. Speakers
    describe the lover's partial vision, the desirability created by absence, jealousy
    of rivals or even messengers, willing endurance of reproach for a beloved, and
    remorse after separation from a radiant young beloved.
