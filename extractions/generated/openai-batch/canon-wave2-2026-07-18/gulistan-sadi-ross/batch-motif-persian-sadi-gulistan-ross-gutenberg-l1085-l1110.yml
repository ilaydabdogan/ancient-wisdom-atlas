canonical_text:
  quote: ''
  summary: A tyrant exploits the poor in firewood sales. A holy man rebukes him, comparing
    him to harmful creatures and warning that injustice cannot escape God. The tyrant
    rejects the rebuke, but later a fire from his kitchen consumes his property. The
    holy man interprets the fire as arising from the suffering of the poor. A separate
    crown inscription attributed to Kai-khosrau reflects on the passing of kingdoms
    from one ruler to another.
