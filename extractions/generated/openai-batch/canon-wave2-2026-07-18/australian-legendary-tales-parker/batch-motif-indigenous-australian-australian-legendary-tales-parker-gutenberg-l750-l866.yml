canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which men reproach mothers for
    leaving children with Gooloo, search unsuccessfully for the lost Wahroogahs, and
    the women mourn while hearing wailing. It then begins the tale of two Weeoombeen
    brothers: the elder kills an emu, the younger''s cry alerts Piggiebillah, Piggiebillah
    threatens them and takes the emu, the brothers enlist armed men against him, and
    then hide with the emu in a stone-sealed hole while using the carcass as a shield
    against spears.'
  language: English
  quote_policy: summarized
