canonical_text:
  quote: ''
  summary: The passage describes a water-holding tree near a camp, two children left
    without water, their elder brother splitting the tree to release a stream, and
    the drowning of the returning adults. It then narrates “The Mayamah,” in which
    enemy warriors come to an empty camp during a borah, question an old dog, and
    are turned to stone after the dog answers. The passage ends with the beginning
    of “The Bunbundoolooeys,” where a pigeon mother carries her young child in a goolay
    while hunting and digging for grubs near wattle trees.
  language: English
  quote_policy: summarized
