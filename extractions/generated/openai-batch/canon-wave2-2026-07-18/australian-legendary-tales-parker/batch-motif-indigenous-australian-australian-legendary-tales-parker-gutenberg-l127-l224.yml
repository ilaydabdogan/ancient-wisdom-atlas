canonical_text:
  quote: ''
  summary: The preface explains Parker's purpose in collecting and publishing Noongahburrah/Narran
    legends, emphasizes the perceived urgency of recording them, notes linguistic
    and customary diversity, identifies intended child audiences, acknowledges named
    Aboriginal contributors, describes Peter Hippi as king and dedicatee, recalls
    memories of Major Mitchell's arrival and fear of wheel tracks, and frames the
    booklet as a publication for white children whose sales may support a Christmas
    dinner for the remaining Noongahburrahs.
  language: English
  quote_policy: summarized
