canonical_text:
  quote: "“And there they still are, near the Milky Way, and known as Wurrawilberoo.”"
  summary: An old man punishes his two sons for neglecting their parents by sending
    them to throw boomerangs, becoming a whirlwind, and carrying them with two mubboo
    trees into the sky near the Milky Way. The mothers discover what happened and
    avenge the boys by pouring hot pine gum into the old man’s eyes. He runs away
    crying and is identified with the Mopoke night hawk. The women later become Mooninguggahgul
    mosquito birds whose cries summon mosquitoes.
  language: English
  quote_policy: quoted
