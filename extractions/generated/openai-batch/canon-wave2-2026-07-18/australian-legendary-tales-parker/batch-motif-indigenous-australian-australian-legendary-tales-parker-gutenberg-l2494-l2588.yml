canonical_text:
  quote: ''
  summary: Tribes gather at Googoorewon for corroborees, hunting, feasting, exchanges,
    and compacts. The Wirreenun secretly prepare a borah ground for initiation, excluding
    women from its mysteries. During a night gathering an uncanny whirring noise is
    identified as the borah spirit. The camps are ceremonially moved into the borah
    ring. Byamee rebukes the noisy Mahthi tribe and decrees that they will lose human
    speech and laugh no more, barking and howling instead; if a Mahthi speaks, hearers
    will turn to stone. The Mahthi find the decree fulfilled. The passage closes with
    Byamee asking women why they are not grinding doonburr and the women reporting
    that their dayoorls are gone.
  language: English
  quote_policy: summarized
