canonical_text:
  quote: ''
  summary: The passage concludes one tale in which Goonur's wives are trapped and
    killed in creek water, then restored to life by Goonur's mother, the Mother Doctor.
    After death the Mother Doctor is marked by a falling star and thunder, while the
    wives are taken to the sky as the red star Gwaibillah. The passage then gives
    the tale of Deereeree, a fearful widow with four daughters. Bibbee makes the rainbow
    Euloowirree as a sky-spanning roadway to impress and frighten her into marriage.
    After death Deereeree becomes the willy wagtail and Bibbee becomes the woodpecker
    or climbing tree bird.
  language: English
  quote_policy: summarized
