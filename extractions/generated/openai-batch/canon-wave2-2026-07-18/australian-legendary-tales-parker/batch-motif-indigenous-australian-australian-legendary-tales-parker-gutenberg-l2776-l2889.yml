  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: The hunters bake the emu eggs in ashes and cook the plucked emu in a hole
    with coals, leaves, feathers, and earth.
  category: action
  evidence_refs:
  - ev:9
