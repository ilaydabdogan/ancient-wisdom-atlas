canonical_text:
  quote: ''
  summary: The passage ends a Noondoo episode in which Byamee's dog gives birth in
    scrub to dangerous hybrid offspring called earmoonan, and Byamee lives apart with
    a fatal face-taboo. It then tells how hardworking Wurrunnunnah store honey while
    Bunnyyarl waste time, after which Wurrunnunnah become wild bees and Bunnyyarl
    become flies. The next episode begins with Deegeenboyah, an old man seeking food,
    falsely joining the Mullyan hunters' first-emu-nest song, claiming prior discovery
    of their nest, and accompanying them as they net, kill, and cook the emu and eggs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Byamee hurried his dog to the springs of Noondoo, where the dog went into
    thick scrub and gave birth to a litter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pups are described as having dogs' bodies, pigs' heads, and the fierceness
    and strength of devils.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who meets an earmoonan in the scrub of Noondoo is said to be slain,
    and Byamee himself does not go near the breed of his old dog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Byamee is said to live forever; no man must look on his face, because doing
    so brings death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Byamee lives alone in thick scrub on one of the Noondoo ridges and is called
    the mightiest of Wirreenun.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bunnyyarl and Wurrunnunnah are relations who live in one camp.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Wurrunnunnah work to gather and store food and honey for future famine
    or winter, and they invite the Bunnyyarl to gather honey from flowers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Bunnyyarl refuse the invitation, spend their time around rubbish, and
    expect to share whatever the Wurrunnunnah bring back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Wurrunnunnah gather and store honey, then stop living with the Bunnyyarl
    because they are tired of doing all the work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Wurrunnunnah are changed into little wild bees, and the Bunnyyarl are
    changed into flies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Deegeenboyah is an old man with two wives and two daughters, and he has difficulty
    supplying them with food.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Deegeenboyah often joins Mullyan men on hunting trips for a more certain food
    supply, but on one day he is too late and hides near their camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When returning hunters sing the Song of the Setting Emu, Deegeenboyah sings
    the same song as if he too has found an emu nest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The song's translated meaning concerns finding the first emu nest of the season,
    seeing the emu's white mark, and protecting the eggs from ants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Deegeenboyah tells the Mullyan that he found an emu nest too, suggests they
    found the same nest after him, and asks where their nest is.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Mullyan state that the nest is in a clump of Goolahbahs on the edge of
    the plain; Deegeenboyah then claims it as his and proposes sharing and trapping
    the emu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Mullyan use a long emu-trapping net and camp near the nest with Deegeenboyah,
