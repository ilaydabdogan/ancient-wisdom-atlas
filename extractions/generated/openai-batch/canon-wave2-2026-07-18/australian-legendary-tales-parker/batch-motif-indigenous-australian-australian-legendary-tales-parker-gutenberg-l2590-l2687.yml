canonical_text:
  quote: '"And the Dummerh were changed into pigeons, with a cry like the spirits
    of \"Oom, oom, oom.\""'
  summary: Byamee sends women to recover missing dayoorl stones; invisible Wondah
    spirits move the stones with an ominous cry, leading the Dummerh away until the
    stones form a mountain and the Dummerh become pigeons. A second episode tells
    how Wahn the crow shields himself from the Ooboon chief's deadly light and kills
    him. The passage then describes a Borah initiation sequence in which boys are
    carried away by assigned men while women are confined so they cannot see further
    rites.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Byamee accuses the women of lending dayoorls to the Dummerh and orders them
    to go to the Dummerh camp to ask for them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women ask at each camp for a dayoorl, but each camp reports that its dayoorls
    are gone after the Dummerh had asked to borrow them and been refused.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The women hear a strange repeated 'Oom' sound in the air, trees, ground, and
    grasses, fear that the Wondah are present, clutch their fire sticks, and return
    to camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Byamee flashes a fire stick toward the sound and sees two dayoorls moving
    away without any visible person moving them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the morning all the dayoorls are gone, and the Dummerh camp is empty.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Dummerh had wished for the Wondah to bring stones; dayoorls then glided
    through their camp while the 'Oom' sound was heard everywhere.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Dummerh follow the dayoorls, which cut a pathway from Googoorewon to Girrahween
    that is now a water-course in high floods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The dayoorls go to Dirangibirrah, pile themselves into a mountain, and become
    a future source of good dayoorls; the Dummerh are changed into pigeons with an
    'Oom' cry.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Ooboon chief comes out when strangers enter the Ooboon camp and flashes
    a light on them that kills instantly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wahn the crow plans to investigate with his biggest booreen and warns others
    not to follow too closely.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Wahn shades himself from the Ooboon chief's light with his booreen and startles
    him with a deep 'Wah' call.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Wahn runs back for his boondee, returns, strikes the Ooboon chief from behind,
    kills him, and reports the act to his camp.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At the Borah corroboree, women relations of the boys dance all night; young
