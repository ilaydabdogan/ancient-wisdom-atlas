canonical_text:
  quote: ''
  summary: Deegeenboyah proposes staying behind to cook an emu while the Mullyans
    hunt more emus. After the group returns with more emus, he asks to carry them
    so the others can play with throwing weapons; when they are out of sight, he takes
    the emus through the trap-door entrance of the Murgah Muggui spider's underground
    home. Mullyangah, chief of the Mullyans, tracks him, learns the trap-door route
    from Deegeenboyah's daughters, kills the daughters and wives, then waits at the
    trap-door, takes the cooked emus as they are pushed out, and confronts Deegeenboyah.
  language: English
  quote_policy: summarized
