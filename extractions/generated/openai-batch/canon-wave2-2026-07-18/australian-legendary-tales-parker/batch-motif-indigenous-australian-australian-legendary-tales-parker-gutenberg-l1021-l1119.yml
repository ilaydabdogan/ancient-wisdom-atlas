  text: Goonur and Bootoolgah forget the comebee during a moment of crowd laughter,
    and it slips from Goonur’s arm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beeargah seizes the comebee with his combo, cuts it open, takes out the firestick,
