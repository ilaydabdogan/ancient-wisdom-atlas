  text: Bootoolgah pursues Beeargah but cannot catch him; seeing fires everywhere,
    he gives up guarding the secret because it has become common property among the
    assembled tribes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Weedah builds more than twenty grass nyunnoos or humpies and makes fires before
    each one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Weedah moves among the shelters imitating many kinds of voices so that a passerby
