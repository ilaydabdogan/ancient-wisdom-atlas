  quote: ''
  summary: The range contains the closing episode in which Beeargah obtains a guarded
    firestick from the comebee and spreads fire, followed by the opening of “Weedah
    the Mocking Bird,” where Weedah uses false shelters, fires, and imitated voices
    to lure solitary people to a fatal fire. Mullyan then tracks missing Beeargah
    to Weedah’s camp and questions him.
