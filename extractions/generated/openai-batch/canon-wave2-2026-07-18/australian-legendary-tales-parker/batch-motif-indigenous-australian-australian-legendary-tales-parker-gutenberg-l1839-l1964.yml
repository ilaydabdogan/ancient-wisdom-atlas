canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Goomblegubbon's wives flee with their
    children across a river with help from other men, and Goomblegubbon loses their
    trail after the camp and country are burned. It then tells of Mooregoo the Mopoke,
    who refuses Bahloo the Moon's requests for rugs and weapons; Bahloo makes a bark
    shelter, rain floods the country, and Mooregoo drowns. The final section begins
    the tale of Ouyan the Curlew, who, pressured to hunt emu, cuts flesh from his
    own legs to feed the women; his mother discovers the deception and calls for him
    to be beaten.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goomblegubbon's wives say they are running away because he would not lend
    them a dayoorl to grind doonburr, leaving them and their children at risk of starvation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women say they do not know where they are going, except that it must be
    far enough away to avoid Goomblegubbon following and killing them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two black fellows say they want wives and will each take one and care for
    the children.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two men swim across the river, first carrying children and then women,
    because the women cannot swim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Goomblegubbon returns from hunting, finds his wives and children gone, follows
    their tracks to the river with spears, and sees them across the river with unfamiliar
    men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Goomblegubbon cannot swim and calls for someone to cross him over, but receives
    no answer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: By morning the opposite camp is deserted and set on fire, the surrounding
    country is burned, and the tracks cannot be found; Goomblegubbon never sees or
    hears of his wives or children again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mooregoo the Mopoke camps by himself and makes many boomerangs, nullah-nullahs,
    spears, neilahmans, and opossum rugs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bahloo the Moon asks Mooregoo to lend or give him an opossum rug and then
