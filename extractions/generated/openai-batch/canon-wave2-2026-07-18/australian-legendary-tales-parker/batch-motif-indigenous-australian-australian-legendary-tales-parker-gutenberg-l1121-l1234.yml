canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which Mullyan the eagle hawk perceives
    Weedah''s fire trap, reverses it, and throws Weedah into the flames; Weedah''s
    head bursts like thunder and a mocking bird rises from his remains, explaining
    the bird''s head-hole, grass playgrounds, and mimicry. A new episode begins: Gwineeboo
    and Goomai find and kill a kangaroo at a creek, hide it from hunters, and are
    exposed by Gwineeboo''s child asking for kangaroo. Goomai strikes the child, whose
    blood stains his breast red. The hunters recover and cook the kangaroo, refuse
    meat to the women and child, and the women build a dardurr and chant to summon
    hail, wind, rain, and lightning against them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mullyan sees a blazing fire, a friend's track behind him, and Weedah edging
    him toward the fire, and concludes that the fire would reveal where his friends
    are if it could speak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mullyan pretends to fall into Weedah's trap, seizes Weedah at the fire, speaks
    of returning what was done to Beeargah and his friends, and throws Weedah into
    the blazing fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Mullyan leaves, he hears a thunder-like sound identified as the bursting
    of the back of Weedah's head; a bird called Weedah, the mocking bird, rises from
    Weedah's remains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mocking bird is said to have a hole at the back of its head and to make
    grass playgrounds while imitating many voices and sounds.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Gwineeboo and Goomai are at a creek getting mussels when a kangaroo enters
    the water while escaping hunters.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gwineeboo kills the kangaroo with a yam stick, and the two women hide the
    kangaroo's body under weeds in the creek while Gwineeboo's little son watches
    from the bank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Quarrian and Gidgereegah ask whether the women saw a kangaroo, and the women
    deny seeing one while inviting the hunters to eat mussels at their camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The child repeatedly asks for kangaroo, causing suspicion; Goomai strikes
    him on the mouth, and his blood trickles down and stains his breast red.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The women fight noisily, and the hunters quietly leave, hide, and plan to
    return and surprise them.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: When the women retrieve the kangaroo and begin making a fire to cook it, the
