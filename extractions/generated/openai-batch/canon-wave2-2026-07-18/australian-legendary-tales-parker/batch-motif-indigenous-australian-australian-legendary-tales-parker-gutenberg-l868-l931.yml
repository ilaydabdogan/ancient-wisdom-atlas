canonical_text:
  quote: ''
  summary: The Weeoombeens evade pursuers and are later understood by those pursuers
    to have become little white-throated birds; Piggiebillah is linked etiologically
    with a porcupine ant-eater whose skin resembles being covered with small spears.
    A new tale begins in which Bootoolgah the crane and Goonur the kangaroo rat live
    in a country without fire, discover fire-making by rubbing wood with kindling,
    decide to keep the knowledge secret, cook fish, and are questioned by others about
    the changed food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Weeoombeens discuss how to elude the black fellows, knowing they would
    be killed if caught, and eat emu flesh while talking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The black fellows return, remove a stone from the entrance, enter the hole,
    and find emu remains but no Weeoombeens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The searchers see spears still in the emu, find no tracks, and observe two
    little birds sitting on a bush near the hole and returning to it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After no sign of the Weeoombeens is found, the black fellows become sure that
    the brothers have turned into the little white-throated birds, and the birds are
    thereafter called Weeoombeens.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Piggiebillah is remembered through a porcupine ant-eater that bears his name
    and has skin described as covered with miniature spears.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the days when Bootoolgah the crane was married to Goonur the kangaroo rat,
    there was no fire in their country, and food was eaten raw or dried in the sun.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bootoolgah rubs two pieces of wood together, sees a faint spark and slight
    smoke, and proposes making fire to cook food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Goonur advises splitting the stick and adding bark and grass so a spark may
    kindle a light; Bootoolgah follows her advice, and a small flame appears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bootoolgah and Goonur are said to discover the art of fire making.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bootoolgah and Goonur decide to keep fire-making secret from all the tribes,
    make fires in a Bingahwingul scrub, and hide firesticks in Bingahwingul seeds
    and in a comebee.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bootoolgah and Goonur cook fish, bring cooked fish back to camp, and others
    notice it differs from usual sun-dried fish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When asked what they did to the fish, Bootoolgah and Goonur say they let it
    lie in the sun, but the others reject that answer.
  category: speech
  evidence_refs:
  - ev:7
