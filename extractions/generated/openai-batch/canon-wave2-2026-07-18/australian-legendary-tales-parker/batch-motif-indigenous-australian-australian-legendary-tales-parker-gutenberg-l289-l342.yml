canonical_text:
  quote: ''
  summary: Introductory commentary characterizes Mrs. Parker's Noongahburrah collection
    as children's tales including aetiological myths. It says the stories explain
    animal markings and habits, constellations, the origin of death, and the origin
    of fire; it also compares the collection with the Metamorphoses, Kipling's animal
    stories, Bushmen and Red Indian traditions, European popular tales, the Prometheus
    myth, and Zulu stories. The passage also notes human-animal blending, subsistence
    themes involving food and water, rain-magic, hunting devices, and the source of
    the book's designs.
  language: English
  quote_policy: summarized
