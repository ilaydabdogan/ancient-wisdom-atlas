canonical_text:
  quote: ''
  summary: 'The passage first concludes a Bahloo snake episode: people fear and kill
    snakes, while Bahloo sends more snakes as reminders of their refusal to obey him.
    It then begins and develops “The Origin of the Narran Lake.” Byamee sends his
    two wives, Birrahgnooloo and Cunnunbeillee, to gather frogs and yams while he
    follows a marked bee for honey. The wives bathe at Coorigel Spring and are swallowed
    by two kurreahs, who enter an underground watercourse and carry the spring and
    river water away. Byamee detects trouble, pursues the kurreahs along dried waterholes,
    wounds and kills them, and their writhing makes hollows that fill with water.
    He cuts open the kurreahs, removes his apparently lifeless wives, lays them on
    red ant nests, and they revive. He warns them not to bathe in deep holes of the
    Narran because kurreahs may haunt them.'
  language: English
  quote_policy: summarized
