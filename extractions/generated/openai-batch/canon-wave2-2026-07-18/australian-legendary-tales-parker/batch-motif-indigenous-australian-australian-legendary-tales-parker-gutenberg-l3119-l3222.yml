canonical_text:
  quote: ''
  summary: In a severe drought, young Noongahburrah men question why the old Wirreenun
    has not made rain. Wirreenun places a feathered stick and clear stones in a waterhole,
    orders bark shelters and raised ant-bed floors prepared, leads the whole camp
    into the water, extracts charcoal from their heads, and sends them to shelter
    as clouds gather. During thunder and lightning he stands before the shelters singing
    to keep the storm away, after which rain falls for days. When the country becomes
    green again, the people celebrate his skill as rainmaker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The country is in drought: most river water is gone, grass is dead, trees
    are dying, and bark shelters have not been used for a long time.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young Noongahburrah men say their fathers claimed Wirreenun could make rain,
    and they question why he has not done so while food animals and plants are failing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: For two or three days Wirreenun goes to the creek waterhole and places there
    a feathered long stick and two large clear pebbles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The clear pebbles are objects Wirreenun usually keeps concealed in his clothing
    or head-band, especially from women.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wirreenun orders young men to cut bark for shelters, build a raised ant-bed
    place for a fire, and make ant-bed floors where the shelters will stand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the shelters are finished, Wirreenun commands the whole camp—men, women,
    and children—to come with him to the waterhole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wirreenun jumps into the water, the tribe follows, and all splash and play
    in the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wirreenun goes behind each person, appears to suck the back or top of the
    head, draws out lumps of charcoal, and spits them into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A young man repeatedly throws Wirreenun back into the water until Wirreenun
    is shivering; this is the signal for all to leave the creek.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wirreenun sends the young people into a large bough shed to sleep while he,
    two old men, and two old women remain outside with their belongings loaded on
    their backs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A single black cloud appears, other clouds rise around it, and they meet overhead
    as a large rain-laden mass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Wirreenun wakes the young people and tells them to gather their possessions
    and hurry into the bark shelters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Thunder and lightning follow; a lightning flash strikes a nearby tree, and
    the camp huddles in the shelters in fear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The women shriek that they will be killed, while the men are silent but look
    frightened.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Wirreenun says he will go out and stop the storm from hurting the camp, and
    that the lightning will come no nearer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Wirreenun stands naked in front of the shelters, faces the storm, and sings
    a chant while thunder and lightning continue.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After a lull and a brief breeze, rain begins in earnest and continues as a
    steady downpour for several days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Wirreenun removes the feathered stick and stones from the waterhole when he
    sees from the clouds that their work is done.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: After the rain, the country is green again and the people hold a corroboree
    singing of Wirreenun’s skill as rainmaker to the Noongahburrah.
  category: sequence
  evidence_refs:
  - ev:8
