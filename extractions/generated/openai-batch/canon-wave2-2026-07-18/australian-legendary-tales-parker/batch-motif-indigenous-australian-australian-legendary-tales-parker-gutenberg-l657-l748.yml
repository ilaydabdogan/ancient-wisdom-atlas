canonical_text:
  quote: ''
  summary: 'The passage first reports Byamee’s fulfilled declaration that dry land
    would become Narran Lake, filled with water and waterfowl. It then begins the
    tale of Gooloo the magpie: Gooloo, described as an old wicked woman, stores and
    grinds doonburr seed. When a neighbouring tribe camps nearby and the men go hunting,
    she persuades the women to leave their children with her while they gather food.
    After feeding the children, she takes them to her real home in a hollow tree and
    secures them there. The mothers return, cannot find Gooloo or the children, hear
    children wailing, and report the loss to the returning men.'
  language: English
  quote_policy: summarized
