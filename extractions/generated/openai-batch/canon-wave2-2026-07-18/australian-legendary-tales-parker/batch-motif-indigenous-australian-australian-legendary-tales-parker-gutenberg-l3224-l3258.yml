canonical_text:
  quote: ''
  summary: Wirreenun, wishing to show his power, summons another rainmaker and has
    the tribes gather at Googoorewon, then a dry plain bordered by gaunt trees said
    to have once been black fellows. The two rainmakers bring rain over the plain
    until it becomes a lake. Wirreenun orders young men to fish with nets despite
    their doubts; the nets fill with several kinds of fish, providing plenty for the
    tribes and their dogs. The elders then decide to hold a borah so boys may be made
    young men, and the famous Googoorewon borah follows Wirreenun’s triumph.
  language: English
  quote_policy: summarized
