canonical_text:
  quote: ''
  summary: Bootoolgah and Goonur secretly cook fish using a firestick kept in a comebee.
    Boolooral and Quarrian spy on them, observe the fire-making and cooking, and report
    back. The community plans a large corroboree to distract the fire-keepers so Beeargah
    can steal the comebee and firestick for common use. Many painted tribes attend,
    and the Bralgahs' comic dance begins to distract the audience while Goonur guards
    the comebee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bootoolgah and Goonur repeatedly disappear after catching fish and return
    with food that looks different from the food of others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boolooral, the night owl, and Quarrian, the parrot, are appointed to follow
    Bootoolgah and Goonur and discover what they do.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The watchers follow the pair to a Bingahwingul scrub, lose sight of them,
    then climb a high tree at the scrub edge to observe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bootoolgah and Goonur take a stick from a comebee, blow on it, place it among
    leaves and twigs, and a flame appears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two feed the flame with larger sticks and put their fish into the remaining
    ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the discovery is reported, the camp community discusses how to get the
    comebee containing the firestick.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A plan is formed to hold a large corroboree so Bootoolgah and Goonur will
    be distracted and someone can seize the comebee, steal the firestick, and start
    fires for common benefit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Beeargah, the hawk, is instructed to pretend to be sick, lie near the two
    fire-keepers, watch them, and steal the comebee when they are laughing and inattentive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Surrounding tribes agree to attend and prepare distinctive body painting for
    the corroboree; the Bralgahs are especially invited because of their dancing.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: At the corroboree Goonur carries the comebee over her arm, becomes absorbed,
    and lets it slip; Bootoolgah notices, replaces it, and warns her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bralgahs dance with repeated advances, bows, faster movements, pirouettes,
    long-necked gestures, and comic solemnity, causing the audience to laugh while
    Beeargah keeps watch.
  category: action
  evidence_refs:
  - ev:8
