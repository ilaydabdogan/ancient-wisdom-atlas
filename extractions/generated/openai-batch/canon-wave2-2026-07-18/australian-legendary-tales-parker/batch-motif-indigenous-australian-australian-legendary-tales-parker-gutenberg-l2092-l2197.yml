canonical_text:
  quote: ''
  summary: Goonur is tricked by his wives into jumping onto a false bandicoot nest
    and drowning in water beneath it. His mother tracks him, retrieves his body, and
    revives him by placing him on an ant bed. She hides him in her dardurr and carries
    him in a comebee so the wives will not know he lives. The wives discover him and
    pretend joy; Goonur pretends to trust them while secretly preparing vengeance
    by setting hidden pointed stakes in a creek and inviting them to dive.
  language: English
  quote_policy: summarized
