canonical_text:
  quote: ''
  summary: The passage describes stages of a boys' borah initiation, including the
    exclusion of women, bodily marks, farewell to old women, and months of isolation
    from mothers. It then recounts how Millindooloonubbah, a widow whose children
    died of thirst after the tribes failed to help her and emptied water holes, curses
    the assembled tribes to become trees. Other named groups become birds or beasts.
    The transformed place remains as Googoorewon, with a lake, borah ring remains,
    trees, animals, and remembered voices. The men and boys at the little borah escape
    the metamorphosis, and Byamee proposes leaving for a far country.
  language: English
  quote_policy: summarized
