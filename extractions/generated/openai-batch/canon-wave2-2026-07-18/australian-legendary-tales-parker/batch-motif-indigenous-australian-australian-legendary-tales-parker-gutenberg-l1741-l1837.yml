canonical_text:
  quote: ''
  summary: Mullyan the eagle hawk is described as a cannibal who kills lone hunters
    with an oversized spear and takes their bodies to a house in a yaraan tree, where
    women associated with him cook and eat the flesh. The victims’ friends track one
    killing to the tree but cannot climb it, so Bibbee and Murrawondah climb up, enter
    the humpy, and hide a smouldering fire stick. The fire spreads, burns Mullyan
    and the women, and the roof collapses, leaving charred bones. The legend then
    identifies Mullyan with the morning star, accompanied by a small star as his remaining
    arm and a larger star as Moodai his wife. The next tale begins with Goomblegubbon
    the bustard, his wives Beeargah and Ouyan, and Beeargah’s two children camped
    near a small water hole. After Goomblegubbon refuses to lend the wives a grinding
    stone, they plan revenge by making opossum-skin water bags, emptying the water
    hole, taking the children, and leaving for the river, where two men swim over
    and question them.
  language: English
  quote_policy: summarized
