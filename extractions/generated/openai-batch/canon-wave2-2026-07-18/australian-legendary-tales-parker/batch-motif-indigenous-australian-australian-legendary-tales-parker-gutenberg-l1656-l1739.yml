canonical_text:
  quote: ''
  summary: The passage recounts Narahdarn forcing a woman up a gunnyanny tree, cutting
    off her trapped arm, and causing her death, then leaving her body beside her sister’s
    and returning to camp bloodstained without honey. The mother of the Bilbers questions
    him, he refuses to answer, and the tribe sends young men to follow his tracks.
    At a night corrobboree, dancers maneuver Narahdarn toward a large fire and men
    throw him into it, avenging the Bilbers. The passage then opens the next tale,
    naming Mullyan the eagle hawk, his opossum wife and mother-in-law, and Buttergah
    in a yaraan tree home.
  language: English
  quote_policy: summarized
