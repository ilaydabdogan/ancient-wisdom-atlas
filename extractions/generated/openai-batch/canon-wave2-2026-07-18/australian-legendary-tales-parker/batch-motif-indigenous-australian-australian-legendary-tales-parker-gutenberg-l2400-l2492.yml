canonical_text:
  quote: ''
  summary: The passage recounts Bougoodoogahdah, an old woman living with dingoes,
    who repeatedly deceives men so her dogs can kill them for food. Watchers discover
    the scheme, and surrounding tribes kill the woman and dogs. After death her cry
    continues from her heart, from which a small rain-making bird emerges. The dead
    dingoes become snakes, and white stones at the killing places are identified as
    fossilized bones of the victims. The passage then begins a new tale in which tribes
    gather at Googoorewon for a secretly planned borah, and Byamee intends to take
    his two sons to be made young men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman named Bougoodoogahdah lives alone with four hundred dingoes and
    treats other people as food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bougoodoogahdah lures groups of men by saying she knows where many paddy melons
    are and by directing them to wait on a moorillah or ridge with their nullahs ready.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Her soft call, rendered as “Birree, gougou,” signals the dingoes to come out,
    surround the men, kill them, and help drag the bodies back to camp for cooking
    and eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hidden watchers observe the ambush pattern and report it; surrounding tribes
    then organize an armed attack that kills the dingoes, Bougoodoogahdah, and her
    two little dogs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Bougoodoogahdah is killed and her bones are broken, her cry continues;
    a watcher sees her heart move and a little bird come out of it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The little bird is described as greyish, nocturnal, dwelling on the moorillahs,
    and associated with rain when its eggs are stolen or when it cries in the daytime
    during drought.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead dingoes are changed into many poisonous snakes; the two little dogs
    are changed into a small non-poisonous carpet snake because they had not bitten
    the men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Heaps of white stones at the moorillah points where the killings occurred
    are identified as the fossilized bones of the massacred men.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A good season prompts tribes to gather at Googoorewon, and old men whisper
