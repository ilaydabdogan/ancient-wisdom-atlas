canonical_text:
  quote: First they were changed into birds and afterwards into stars in the sky
  summary: The passage first concludes an episode in which Gwineeboo and the women
    refuse dardurr shelter to Gidgereegah and Quarrian during a violent storm; the
    two men are changed into birds and then stars, with a kangaroo between them. It
    then begins the tale of Wurrunnah, who leaves home after being refused food, encounters
    an eyeless man who sees through his nose, finds a lagoon that vanishes, is frightened
    by Bulgahnunnoo under bark, and flees after killing a being he mistook for a featherless
    emu.
  language: English
  quote_policy: quoted
