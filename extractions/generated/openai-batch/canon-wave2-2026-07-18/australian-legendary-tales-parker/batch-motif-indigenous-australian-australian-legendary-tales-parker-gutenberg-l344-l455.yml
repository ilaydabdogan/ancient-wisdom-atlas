canonical_text:
  quote: ''
  summary: The passage begins the tale of Dinewan the emu and Goomblegubbon the bustard.
    Dinewan is acknowledged as king by the other birds, while Goomblegubbon envies
    her. Goomblegubbon deceives Dinewan into cutting off her wings, then reveals her
    own wings and escapes. Dinewan seeks revenge by hiding most of her young and persuading
    Goomblegubbon that having only two children will make them larger; Goomblegubbon
    kills all but two of her young. The passage ends before Dinewan answers Goomblegubbon's
    final objection.
  language: English
  quote_policy: summarized
