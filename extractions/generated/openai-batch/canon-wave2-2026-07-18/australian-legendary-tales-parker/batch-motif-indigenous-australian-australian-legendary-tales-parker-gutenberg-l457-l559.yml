canonical_text:
  quote: ''
  summary: The passage closes one Dinewan and Goomblegubbon tale by explaining why
    emus lack wings and why bustards lay only two eggs. It then tells how Oolah the
    lizard accidentally injures a Galah with a returning boomerang, after which the
    Galah wounds and stains Oolah, and both pronounce lasting bodily traits on the
    other. The passage then begins the tale of Bahloo the moon, who asks people to
    carry his snake-dogs across a creek and offers renewed life after death if they
    obey; when they refuse through fear, Bahloo declares that people will remain dead
    like a sunken stone rather than rise like floating bark.
  language: English
  quote_policy: summarized
