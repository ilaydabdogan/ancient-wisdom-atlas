canonical_text:
  quote: ''
  summary: Wurrunnah encounters seven Meamei sisters, receives food from them, then
    hides and steals two yam sticks to separate two of the sisters from the group.
    He seizes the two girls and forces them to travel with him as wives. Later, when
    he orders them to cut bark from two pine trees despite their warning that he will
    not see them again, the trees rise upward, carrying the two girls to the sky.
    The five sisters already in the sky call to them and draw them in, and the passage
    identifies the seven sisters together with the Pleiades, called the Meamei.
  language: English
  quote_policy: summarized
