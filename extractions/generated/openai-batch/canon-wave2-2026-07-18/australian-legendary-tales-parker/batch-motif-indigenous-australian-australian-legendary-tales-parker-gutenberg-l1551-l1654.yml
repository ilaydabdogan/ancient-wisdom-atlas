canonical_text:
  quote: ''
  summary: A mother forgets her baby in a goolay near a Dunnia clump; the child grows
    alone into a man, and when she returns and tries to embrace him, he kills her
    with a stone. In the next tale, Oongnairwah and Guinarey arrange a fishing drive
    with birds at a creek; Deereeree and Burreenjin warn of an alligator but ignore
    an instruction to leave, and the alligator drowns everyone, leaving the place
    Goomade red with blood. In the following tale opening, Narahdarn the bat seeks
    honey by marking and following a bee, then sends his wives to extract honey from
    a marked tree; one wife is trapped, has her arm cut off by Narahdarn, and dies,
    after which he orders her sister to continue.
  language: English
  quote_policy: summarized
