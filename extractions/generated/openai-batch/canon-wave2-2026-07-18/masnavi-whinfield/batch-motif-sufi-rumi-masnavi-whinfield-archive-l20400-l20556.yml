canonical_text:
  quote: ''
  summary: The passage warns that cleverness, learning, and philosophical speculation
    can mislead the spiritual traveller, while humility and obedience receive grace.
    It then tells of a Musulman travelling with a Jew and a Christian. God provides
    sweetmeats; the Jew and Christian wish to postpone or prevent division, while
    the fasting Musulman goes hungry. The next morning they agree that the best dream
    will win the sweetmeats. The Jew reports being taken by Moses to Mount Sinai and
    shown heavenly glory; the Christian reports being taken by Isa to the fourth heaven.
    The Musulman reports that Muhammad appeared, praised his prayer and fasting, commanded
    him to eat the divinely provided sweets, and that he obeyed. The others concede
    that his waking vision was superior. The closing lesson rejects excessive speculation
    and contrasts direct sight of fire with merely inferring fire from smoke.
  language: English
  quote_policy: summarized
