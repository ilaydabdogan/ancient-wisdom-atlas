canonical_text:
  quote: ''
  summary: The passage presents a Sufi didactic section on the spiritual benefit of
    sickness and adversity. A sick man welcomes pain because it brought Muhammad to
    visit him and because God sent the illness as mercy. The passage then expands
    into teachings that suffering, abasement, grief, and even death can hide exaltation
    and life. It instructs the hearer to resist lust, act contrary to deceptive inner
    counsel, abandon self-reliant knowledge, embrace renunciation, and understand
    good and evil as proceeding from God without diminishing divine perfection.
  language: English
  quote_policy: summarized
