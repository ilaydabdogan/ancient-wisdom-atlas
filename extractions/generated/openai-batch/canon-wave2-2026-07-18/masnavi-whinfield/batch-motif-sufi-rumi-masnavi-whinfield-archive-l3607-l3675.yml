canonical_text:
  quote: ''
  summary: The passage frames the tale as having an outward form and a hidden moral.
    It teaches that outward forms, gifts, prayers, and attentions can witness inward
    love, but such signs may be true or false. Hypocritical devotion may imitate divine
    intoxication. The speaker asks God for discernment, saying that true discernment
    comes when the senses see by Allah's light. A person illumined by God's light
    and kindled by love of God is freed from dependence on outward signs, effects,
    and causes.
  language: English
  quote_policy: summarized
