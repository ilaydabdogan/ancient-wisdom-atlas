canonical_text:
  quote: ''
  summary: The passage explains evil and contrary forms as part of divine artistry,
    contrasts willing and unwilling worship, gives a prayer taught by the Prophet,
    and imagines the faithful on the last day passing through Hell as a green garden
    because they have transformed their inner fires. It closes with imagery of lovers
    consumed like moths by the Beloved’s torch, glossed in a note as annihilation
    of self in God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The divine artist is described as painting both fair pictures, including Joseph,
    and ugly pictures, including demons and ’afrits; both are said to be His workmanship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Infidelity and faith are both said to bear witness to Him and bow before His
    sway; the faithful worship willingly, while Guebers are said to worship unwillingly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Prophet tells a sick man to pray for good in this world and the next,
    a pleasant path like a garden, and the Holy One as the goal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the last day the faithful ask the King whether all people passed through
    Hell; the King answers that the green garden that appeared during their passage
    was Hell and the place of dread torment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hell is said to have become a green garden with trees for the faithful because
    they quenched inner fires for God’s sake.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:6
  text: The passage lists transformations of lust, pride, wrath, ignorance, greed,
    malice, and poisons into a holy garden, guiding light, meekness, knowledge, bounty,
    rose-garden, and pure sweets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The faithful are said to have made fiery lust a verdant garden, sown the seed
    of fidelity, heard nightingales of prayer and praise, and drawn water out of the
    hell of lust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Speakers describe themselves as victims and nothings before eternal Being,
