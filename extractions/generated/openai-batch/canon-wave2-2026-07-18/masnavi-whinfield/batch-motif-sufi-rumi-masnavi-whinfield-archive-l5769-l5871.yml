canonical_text:
  quote: ''
  summary: The passage summarizes an anecdote comparing lust to an abandoned mother
    whose killing brings peace; explains hatred of prophets and saints as self-hatred
    and describes holy figures as tests and curtains of divine light; narrates a king
    testing two slaves by their speech; and presents a succession of prophetic light
    through Adam, Seth, Noah, Abraham, Ishmael, and David.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man kills his mother because she repeatedly misconducts herself with strangers
    and argues that otherwise he would need to kill strangers daily and incur blood-guiltiness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lust is explicitly likened to the abandoned mother; once it is slain, one
    is said to be at peace with all men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says those who hate prophets in reality hate themselves, comparing
    them to sick men quarrelling with a physician or boys with a teacher.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prophets, saints, and holy men are described as created to test human dispositions
    and to separate the good from the bad.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Grades of prophets, saints, and holy men are described as curtains of the
    light of God that make its brilliance visible to different grades of human sight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A king purchases two slaves, one very handsome and one very ugly, and sends
    the handsome slave to the bath before questioning the ugly slave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ugly slave responds to the king by praising the absent handsome slave
    and saying his inward qualities correspond to his outward beauty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The slave argues that outward beauty is accidental while the eternal soul
    is substance, and that good works and thoughts bear fruit in the next world.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The same slave says thought precedes completed work, as an architect's plan
    precedes a building and a gardener's design precedes fruit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The slave says the world is the realized thought of Universal Reason.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the other slave is summoned, he calls his fellow slave a liar and a rascal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king says the slanderous slave's tongue has betrayed his inner vileness
    and cites the saying that every man is hidden under his own tongue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A brightness like lightning kindles the souls of prophets and saints, and
    Adam acquires knowledge from that light.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The light shining from Adam is gathered by Seth, and Adam makes Seth his viceroy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Noah receives the gift of the lustre and becomes a soul bearing pearls in
    the tempest of the flood.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Abraham is led by the light and enters Nimrod's fiery furnace without fear.
  category: action
  evidence_refs:
  - ev:8
