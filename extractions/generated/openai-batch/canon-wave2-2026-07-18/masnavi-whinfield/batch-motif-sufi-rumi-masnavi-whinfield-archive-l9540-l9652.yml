- id: obs:1
  text: An opening fragment describes boys persuading their teacher that he is ill;
    the teacher refuses a mirror, believes the boys, and dismisses them from lessons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poet uses the boy’s sharpness to reject the view that all people are born
    with equal ability and to affirm that innate capacities vary greatly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A darvesh takes up residence in the mountains in order to live in solitude.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mountain place contains many fruit-trees, and the darvesh vows not to
    pluck fruit but to eat only fruit shaken down by the wind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a period without wind, the darvesh remains faithful to the vow for five
    days but then, driven by hunger, plucks fruit from the branches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explains the lapse by saying that the darvesh omitted the words
