canonical_text:
  quote: ''
  summary: 'The passage ends an earlier schoolroom trick episode, then presents Story
    IX: a darvesh living in mountain solitude vows to eat only fruit fallen by the
    wind, breaks the vow after hunger, is mistakenly arrested with robbers, and loses
    the hand that plucked the fruit. The prose and verse interpret the episode as
    teaching that vows and actions depend on God’s will, using images of the heart
    as a feather in wind, water boiling over fire, and birds entering a snare despite
    seeing it. The final lines introduce a comparison of hidden divine decrees through
    the image of a distressed king’s son.'
  language: English
  quote_policy: summarized
