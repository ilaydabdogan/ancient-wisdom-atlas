canonical_text:
  quote: ''
  summary: An admonishing speaker argues that a claim of hidden virtue is contradicted
    by willingness to misbehave before the All-seeing God. She illustrates this with
    a story in which a Sufi’s wife hides her paramour under a woman’s dress and presents
    him as a rich lady proposing a marriage. The Sufi infers that the pretended lady’s
    claims are false. The lover then claims he was only testing his mistress, but
    she rebukes him, saying that a detected fault should be confessed as Adam did
    and that such testing resembles Abu Jahl’s demand that the Prophet perform a miracle.
  language: English
  quote_policy: summarized
