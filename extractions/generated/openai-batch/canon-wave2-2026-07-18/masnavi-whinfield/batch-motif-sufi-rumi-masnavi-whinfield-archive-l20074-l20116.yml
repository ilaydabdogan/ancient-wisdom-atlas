canonical_text:
  quote: ''
  summary: A poor Faqir prays to God to be fed without working. A divine voice sends
    him to a scribe's house to obtain a writing that gives directions to a hidden
    treasure. A king seizes the writing and searches unsuccessfully. The Faqir also
    fails until a heavenly voice explains that he should shoot the arrow gently because
    the treasure is close to him. The narrator applies the story to spiritual treasures
    that people overlook nearby.
  language: English
  quote_policy: summarized
