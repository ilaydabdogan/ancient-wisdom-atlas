canonical_text:
  quote: ''
  summary: 'The passage moves through several didactic episodes and images: a body
    compared to flint and steel that can generate fire; Gabriel revealing an immense
    form to Mustafa, who swoons and is then embraced; an address to Husamu-d-Din about
    renewed existence, form and spirit, and the union of earth and heaven; a commentary
    on Abraham and four birds interpreted as vices; and the opening of the story of
    the Prophet''s large infidel guest, whose excessive eating and drinking lead to
    his confinement and illness.'
  language: English
  quote_policy: summarized
