canonical_text:
  quote: ''
  summary: The passage contrasts reliance on personal reason and stratagem with guidance,
    patience, surrender, and grace. The princes learn about the lady shown in the
    fort from an old Shaikh, are warned about the dangerous journey to China, and
    are told that the King of China favors those ready to yield their lives rather
    than those using tricks. The eldest prince urges perseverance, and the princes
    leave country and parents. The passage then describes their secret figurative
    speech about the beloved mistress and reflects on the true understanding of the
    language of birds, Solomon, the false demon, the Simurgh, and Mount Qaf.
  language: English
  quote_policy: summarized
