canonical_text:
  quote: ''
  summary: The passage presents reflections on God writing forms on Not-being, reason
    reading divine signs, human bewilderment in seeking true aims, the sacrifice of
    the peacock of ambition by Abraham, and the concealment of mercy and wrath in
    their opposites as a test. It then introduces Story II, in which an Arab loudly
    mourns a dog that died of hunger, while refusing to spend his own food on the
    dog because tears cost him nothing; a neighbor exposes and rebukes the hypocrisy.
  language: English
  quote_policy: summarized
