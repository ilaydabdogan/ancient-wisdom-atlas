canonical_text:
  quote: ''
  summary: 'The passage contains several connected didactic anecdotes and expositions:
    a quarrel among speakers of different languages who all want grapes under different
    names; an allegory of ducklings raised by a land fowl but urged toward the ocean;
    reflections on human earthly and angelic nature, Solomon, birds, water, and the
    Causer; a wilderness story in which travellers eat a young elephant despite a
    sage''s warning and are slain by an avenging elephant except for one abstainer;
    and a brief teaching that the pious are God''s children under divine care.'
  language: English
  quote_policy: summarized
