canonical_text:
  quote: ''
  summary: The passage describes divine pardon and purification, explains acts and
    words as evidence of hidden thoughts, contrasts bodily and spiritual diagnosis,
    describes an arrived traveller whose light makes outward testimony unnecessary,
    distinguishes enduring soul from passing accidents and practices, presents sincerity
    as the purification of witnesses, and ends with a prayer for spiritual enlightenment
    and entry into a holy assembly where saints drink pure wine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is said to purge dealings from hypocrisy, wash defilement clean, pardon
    sins, and rain down water to purify the impure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Acts and words are described as witnesses of the mind within and as grounds
    for inferring thoughts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When inward vision cannot penetrate, the listener is told to inspect the water
    voided by a sick man; this water serves the bodily physician as evidence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The physician of the spirit is said to penetrate the soul and ascertain a
    person’s faith, without needing outward acts and words.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The text says act-and-word evidence is required only from one not joined to
    the divine Ocean like a stream.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The traveller arrived at the goal is described as having a light that fills
    deserts and wastes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The arrived traveller’s witness is said to be exempt from bearing witness
    and from trouble, risk, and good works; both worlds bloom through him like roses.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Accidents are said to manifest secret essence, while the essential quality
    abides and accidents pass away.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Prayers, holy war, and fasting are said not to endure, while the noble soul
    endures.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The soul exhibits acts and words and rubs its substance on the touchstone
    of God’s command, saying that its faith is true and presenting witnesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Witnesses must be purified; their purification is sincerity, truthful speech,
    and keeping promises in acts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Contradictory words and acts are rejected or arrested, and God is asked how
    He can listen to such contradictory witness unless He decides in mercy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In a prayer for spiritual enlightenment, the speaker asks God to bestow favor,
    take him by the ear, and draw him to a holy assembly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The holy assembly is described as a place where saints in ecstasy drink God’s
    pure wine; the speaker says he has smelled its perfume and asks not to be withheld
    from the musky wine.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The prayer says God’s bounty is shared by men and women and that prayers are
    granted before they are uttered.
  category: speech
  evidence_refs:
  - ev:10
