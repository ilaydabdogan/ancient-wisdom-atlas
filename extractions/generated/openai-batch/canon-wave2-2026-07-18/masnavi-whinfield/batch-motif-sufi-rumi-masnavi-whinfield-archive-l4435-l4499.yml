  quote: The knowledge of men of heart bears them up, / The knowledge of men of the
    body weighs them down.
  summary: The passage contrasts heart-derived knowledge with bodily or school knowledge.
    True knowledge is described as lifting, guiding, and leading toward union with
    God, while merely external knowledge is a burden unless borne rightly. The speaker
    urges the seeker to move beyond names and letters, seek the reality named by God’s
    name, and purify the self like a polished steel mirror.
