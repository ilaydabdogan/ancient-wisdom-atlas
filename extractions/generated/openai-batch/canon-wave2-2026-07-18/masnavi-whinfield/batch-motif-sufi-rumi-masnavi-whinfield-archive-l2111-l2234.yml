  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beasts advise laying aside caution, trusting Providence, not fighting
    the divine decree, and being as dead before God’s commands.
  category: speech
  evidence_refs:
  - ev:3
