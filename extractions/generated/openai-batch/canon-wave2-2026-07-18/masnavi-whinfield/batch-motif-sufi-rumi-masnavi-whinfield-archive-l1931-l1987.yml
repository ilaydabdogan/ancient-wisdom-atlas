canonical_text:
  quote: ''
  summary: 'The passage opens with an image of mutually contrary scrolls, then recounts
    a tyrannical Jewish king who tries to eradicate Christians by enforcing idol worship
    under threat of fire. A Christian woman refuses; her babe is cast into the fire
    but speaks from within it, saying the fire is cool and cannot burn him. Other
    Christians enter the fire unharmed. The king rebukes the fire, which replies that
    it is God''s servant and will not use its consuming power for evil; it then consumes
    the king and his Jews. A doctrinal reflection follows: the elements are servants
    of God, and secondary causes act only under the First Cause.'
  language: English
  quote_policy: summarized
