    worship; gives examples of recognition and nonrecognition of prophetic truth;
    teaches that care for a sick saint is treated as care for God; tells of a gardener
    who separates three friends before chastising them; and narrates Bayazid’s pilgrimage
    encounter with a sage who redirects him from the Ka'ba to the saint as a living
    house of God.
