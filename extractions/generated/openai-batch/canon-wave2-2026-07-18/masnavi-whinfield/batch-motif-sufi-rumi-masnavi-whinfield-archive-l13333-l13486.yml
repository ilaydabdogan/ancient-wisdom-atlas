canonical_text:
  quote: ''
  summary: A didactic passage contrasts Adam's open confession with Iblis's blame
    of God, argues against excusing sin as compulsion, and uses Canaan's refusal of
    Noah's ark to elevate love, inspired bewilderment, and submissive ignorance over
    clever self-reliance and book-learning. It closes with examples of sanctified
    foolishness and amazement.
  language: English
  quote_policy: summarized
