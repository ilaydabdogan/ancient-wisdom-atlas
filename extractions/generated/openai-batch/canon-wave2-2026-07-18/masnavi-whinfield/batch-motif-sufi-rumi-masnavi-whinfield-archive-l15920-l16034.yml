canonical_text:
  quote: Seek annihilation and adore change of state.
  summary: The passage teaches that safety from inner enemies comes through annihilation
    of self and absorption in God. It contrasts base worldly attachment with divine
    transformation, prays for God to change error into knowledge, and describes a
    sequence of higher existences and repeated resurrections from elemental and living
    states toward rising beyond the world of sense and form.
  language: English
  quote_policy: quoted
