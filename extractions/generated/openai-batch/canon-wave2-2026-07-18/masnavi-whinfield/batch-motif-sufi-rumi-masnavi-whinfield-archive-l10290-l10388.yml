canonical_text:
  quote: ''
  summary: The passage recounts the People of Saba receiving abundance, failing to
    give thanks, rejecting prophetic admonition, and being left to destructive flood
    punishment. It also teaches that parables in divine matters require knowledge
    of hidden mysteries, using Moses' staff-serpent, Iblis, Korah, and Noah's mocked
    ark-building as examples.
  language: English
  quote_policy: summarized
