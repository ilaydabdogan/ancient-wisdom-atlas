canonical_text:
  quote: ''
  summary: The passage links earthly music to heavenly spheres and remembered Paradise,
    then recounts Ibrahim’s rebuke and disappearance after seeking union with God
    while enthroned. It then turns to Solomon’s words to Saba and Bilqis, his preaching
    to birds in their own modes, summarized miracles from the Prophet’s childhood,
    and a moral illustration about pursuing low earthly objects rather than the spiritual
    world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says philosophers teach that human melodies come from the revolving
    spheres, and that heavenly influence can make harsh voices melodious.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says humans, as members of Adam, heard melodies in Paradise and
    retain faint memories of heavenly songs despite earthly veils of earth and water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Music is described as food for lovers because it recalls their primal union
    with God and strengthens inward feelings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ibrahim sits on his throne, hears cries and heavy footsteps on the palace
    roof, and questions who is there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rooftop searchers say they are looking for camels; when Ibrahim asks who
    searches for camels on a housetop, they answer that they follow his example of
    seeking union with God while sitting on a throne.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the rooftop exchange, the passage says no one saw Ibrahim again; his
    substance was hidden from men, and his fame was compared to the 'Anka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says Solomon’s words are borne by the breeze to Saba like bodies
    meeting souls at resurrection or boys returning home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Solomon is addressed as one who knows birds’ language and is instructed to
    sound the note of each bird that approaches.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Different birds are named as receiving different preaching: predestination,
    patience, comfort, Mount Qaf, avoidance of the hawk, mercy, light, peace, and
    signs of dawn.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A prose summary says the Prophet was suckled by Halima, idols bowed before
    him, he strayed from home, Abd ul Muttalib prayed for him to be found, and he
    was found in the Ka'ba.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A prose summary says a cur attacked a blind man instead of hunting the wild
    ass with well-bred dogs, illustrating pursuit of mean earthly objects over aspiration
    to the spiritual world.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bilqis is admonished to bestir herself while the market is thronged and to
    flee unprofitable traffic.
  category: speech
  evidence_refs:
  - ev:9
