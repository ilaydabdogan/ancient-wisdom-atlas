- id: motif:2
  label: Renunciation of the throne for divine seeking
  taxonomy_refs:
  - departure
  - annihilation_union
  - mystical_quest
  basis: Ibrahim is rebuked for seeking union with God while on a throne, and after
    the exchange no one sees him again.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage title calls this abdication, but the narrated action is compressed
    and does not describe his later path.
- id: motif:3
  label: Absurd search used as spiritual rebuke
  taxonomy_refs:
  - wisdom
  basis: The rooftop search for camels is presented as a deliberate analogue for Ibrahim’s
    incongruous enthroned seeking.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a parabolic teaching device rather than a standalone mythic episode.
- id: motif:4
  label: Hidden holy figure compared to the 'Anka at Mount Qaf
  taxonomy_refs:
  - ascent
