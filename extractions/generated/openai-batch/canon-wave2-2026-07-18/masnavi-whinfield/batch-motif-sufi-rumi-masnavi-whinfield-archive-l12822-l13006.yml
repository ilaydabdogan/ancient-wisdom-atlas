candidate_motifs:
- id: motif:1
  label: Music awakens memory of divine union
  taxonomy_refs:
  - annihilation_union
  - divine_beloved
  - mystical_quest
  basis: The passage says music recalls lovers’ primal union with God and intensifies
    the fire of love.
