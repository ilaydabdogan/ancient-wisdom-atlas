canonical_text:
  quote: ''
  summary: Pharaoh considers whether to abandon infidelity and believe Moses' promises.
    His wife Asiya urges belief and warns him against consulting Haman, whom she sees
    as spiritually blind. She illustrates her warning with the parable of a royal
    falcon spoiled by an ignorant old woman, then reflects that Pharaoh and Haman
    are drawn together because like associates with like. A second parable tells how
    an endangered infant at a canal is drawn away by the sight of another infant,
    followed by a doctrinal statement about spiritual and animal affinities.
  language: English
  quote_policy: summarized
