canonical_text:
  quote: ''
  summary: 'The passage first presents a prologue in which Shams of Tabriz is praised
    and presses the speaker to disclose ecstatic states, while the speaker warns that
    the secrets of the Friend or Beloved should remain veiled because direct exposure
    would overwhelm. It then gives the story of an oilman’s parrot: a cat upsets an
    oil-jar, the oilman wrongly strikes the parrot, and the parrot later mistakes
    a bald passerby for someone who has suffered the same cause of baldness. The following
    moral contrasts worldly and spiritual senses and uses images of destruction followed
    by rebuilding to describe spiritual renewal.'
  language: English
  quote_policy: summarized
