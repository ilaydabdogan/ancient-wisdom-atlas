canonical_text:
  quote: ''
  summary: The passage first describes a ruined man who asks everyone to release him
    from an unseen bondage identified as God's hidden decree. It then gives Ahmad/Muhammad
    as one who could see the invisible rope and firewood burden associated with Omm
    Jabil, wife of Abu Lahab. The next story introduces an old holy man who does not
    mourn his dead sons because he says they remain visible to the eyes of his heart
    and present to him when he withdraws from outward sense.
