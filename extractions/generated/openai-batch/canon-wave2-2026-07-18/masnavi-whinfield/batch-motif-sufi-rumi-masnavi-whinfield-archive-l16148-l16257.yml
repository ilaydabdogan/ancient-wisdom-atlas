canonical_text:
  quote: ''
  summary: A man publicly claims to be a prophet and is brought before a king. He
    says he came from the spirit-world to earth with open eyes, identifies heaven
    as his home, and defends his inspiration as divine teaching. The passage then
    gives a prayer asking God to free envious people, followed by examples of envy
    in rulers and lovers and the beginning of a lover-and-mistress anecdote.
  language: English
  quote_policy: summarized
