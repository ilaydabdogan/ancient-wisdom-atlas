  text: 'From the roof, the bird gives a second counsel: do not grieve for what is
    past or vex oneself over what is already done.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bird says that a precious pearl weighing ten drachms is hidden inside
