canonical_text:
  quote: ''
  summary: The passage opens with didactic lines about becoming as dead under the
    wise in order to rise from degradation, contrasted with a wandering fool. It then
    begins the story of a man who captures a bird. The bird argues that eating it
    will not satisfy him, offers three counsels in exchange for release, gives the
    first counsel on the man's wrist, flies free to the roof, gives the second counsel,
    then claims that a valuable pearl was hidden in its body, causing the man to lament.
  language: English
  quote_policy: summarized
