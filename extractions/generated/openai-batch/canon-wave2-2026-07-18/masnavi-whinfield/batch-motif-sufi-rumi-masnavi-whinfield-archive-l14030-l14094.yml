    not spring upward.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man captures a bird by wiles and snares.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bird says the man has eaten many oxen and sheep and sacrificed camels
    without becoming satisfied, so he will not be satisfied with the bird's flesh.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bird asks to be released so that it may give the man three counsels, to
