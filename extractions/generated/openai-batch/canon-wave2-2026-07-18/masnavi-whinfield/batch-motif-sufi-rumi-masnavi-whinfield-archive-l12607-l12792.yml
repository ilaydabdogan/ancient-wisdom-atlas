  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames this within Sufi doctrinal exposition; taxonomy fit
    is approximate.
- id: motif:4
  label: Ascent and overcoming distance by divine grace
  taxonomy_refs:
  - ascent
  - mystical_quest
