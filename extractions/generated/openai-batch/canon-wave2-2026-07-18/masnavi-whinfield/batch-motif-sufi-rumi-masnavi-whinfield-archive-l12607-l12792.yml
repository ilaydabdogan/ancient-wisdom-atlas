- id: motif:5
  label: Renunciation of worldly wealth for otherworldly kingdom
  taxonomy_refs:
  - sacred_exchange
  - mystical_quest
  basis: Solomon tells Bilqis to quit wealth and earthly rule for realms not of this
    earth; Ibrahim bin Adham is cited as renouncing his kingdom for eternity.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: The exchange is spiritual and ethical, not a ritual bargain.
- id: motif:6
