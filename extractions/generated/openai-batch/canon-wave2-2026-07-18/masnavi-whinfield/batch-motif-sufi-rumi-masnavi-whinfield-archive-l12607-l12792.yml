canonical_text:
  quote: ''
  summary: The passage presents doctrinal reflections on man as microcosm and macrocosm,
    the priority of fruit over tree as an analogy for Muhammad’s primordial status,
    and spiritual nearness to God. It then recounts Solomon’s rebuke to Bilqis’s messengers
    for bringing gold, a parable about a druggist’s soapstone weight, Solomon’s admonition
    to abandon worldly sovereignty for divine service, an anecdote of a darvesh miraculously
    sustained in the forest and a saintly woodcutter who turns firewood into gold
    and back, and a brief citation of Ibrahim bin Adham as a model of renouncing kingship
    for eternity.
  language: English
  quote_policy: summarized
