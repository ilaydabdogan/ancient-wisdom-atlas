- id: motif:2
  label: Fruit as final cause of the tree
  taxonomy_refs:
  - wisdom
  basis: The passage states that the tree appears to produce the fruit, but in reality
    exists because of the fruit; this is applied to Mustafa’s primordial priority.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The motif is analogical and theological, not a discrete mythic action.
- id: motif:3
  label: Primordial prophet preceding the first ancestor
  taxonomy_refs:
  - wisdom
  basis: Mustafa says he is outwardly Adam’s son but inwardly Adam’s first forefather,
