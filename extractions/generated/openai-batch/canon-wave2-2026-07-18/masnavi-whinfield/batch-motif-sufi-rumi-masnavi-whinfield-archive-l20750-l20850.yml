canonical_text:
  quote: He whose eyes discern God in the world is safe from destruction.
  summary: The passage completes a parable in which a robber who can recognize by
    day someone seen at night recognizes the king after a burglary and is spared.
    Rumi glosses this as an image of spiritual recognition of God and prophetic intercession,
    then turns to reflections on inner kinship over outward form and introduces the
    story of the pensioner of the Prefect of Tabriz.
  language: English
