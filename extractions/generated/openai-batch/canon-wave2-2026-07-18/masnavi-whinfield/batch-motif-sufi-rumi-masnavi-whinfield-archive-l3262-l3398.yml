canonical_text:
  quote: His old life died, and he was regenerated.
  summary: The passage moves from mystical bridal language for the hidden Beloved
    to a rebuke of the harper by Omar, who warns against attachment to past and future
    and points to the road of the annihilated. The harper is described as emancipated,
    regenerated, lifted beyond earth and heaven, and immersed in the Lord's glory
    like identification with an ocean. The range then begins the story of an Arab
    and his wife living in desert poverty, with the wife urging improvement and the
    Arab citing a prophetic saying that poverty is his glory.
  language: English
