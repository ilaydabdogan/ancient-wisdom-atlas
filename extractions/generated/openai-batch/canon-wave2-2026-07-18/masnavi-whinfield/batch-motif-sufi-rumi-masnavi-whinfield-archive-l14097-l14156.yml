canonical_text:
  quote: ''
  summary: 'A bird reminds a man of two counsels: not to grieve over what is past
    and not to believe foolish assertions. When the man asks for a third counsel,
    the bird refuses, saying counsel is wasted on an ignorant hearer. The passage
    then introduces a story of Moses and Pharaoh, framed as true reason confronting
    opinion or illusion. Moses asserts that both he and Pharaoh derive their bodies
    from earth, their souls from God, and have no lord but God; Pharaoh claims lordship
    over Moses and invokes his childhood nurturing of him; Moses rejects Pharaoh''s
    lordship and recalls Pharaoh''s attempt to kill him in infancy. Moses then uses
    images of breaking soil, cutting cloth, and grinding wheat as necessary preparations
    for cultivation, clothing, and bread.'
  language: English
  quote_policy: summarized
