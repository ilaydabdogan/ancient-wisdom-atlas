canonical_text:
  quote: ''
  summary: The passage first describes an aged ascetic devotee whose reason and bodily
    strength have failed, whose abstinence has brought no joy, and whose work has
    not yet received reward from his Friend. He sits sorrowfully and friendless, without
    one to open his eyes or guide him to eye-salve, striving only on the chance of
    being right while losing the kernel through love of the shell. A prose continuation
    then says Mahmud asks Ayaz to reveal his secrets, because even sad thoughts may
    benefit hearers. It compares the wise man to a guest-house that welcomes all thoughts,
    joyful or sorrowful, as Abraham may have entertained angels unknowingly, and introduces
    an illustrative story about a woman who drove away a valued guest by a petulant
    remark.
  language: English
  quote_policy: summarized
