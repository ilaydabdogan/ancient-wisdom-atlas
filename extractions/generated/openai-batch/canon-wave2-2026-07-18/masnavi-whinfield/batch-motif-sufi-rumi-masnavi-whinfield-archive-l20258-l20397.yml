canonical_text:
  quote: ''
  summary: 'The passage gives examples of divine power reversing ordinary protections
    or supports: Qarun is swallowed with his wealth; food can choke; clothing can
    become cold; a cloud associated with Shu''aib becomes punitive; and a staff becomes
    a serpent. It then explains the Faqir''s treasure quest: a divine voice says he
    was told only to place an arrow on the bow, not to draw with full force, and to
    dig where the arrow falls. The passage interprets excessive effort and speculation
    as moving away from a treasure that is near, comparing this to Canaan seeking
    safety on a mountain rather than following Noah, and to an ignorant person abandoning
    a true master for a dangerous new school.'
  language: English
  quote_policy: summarized
