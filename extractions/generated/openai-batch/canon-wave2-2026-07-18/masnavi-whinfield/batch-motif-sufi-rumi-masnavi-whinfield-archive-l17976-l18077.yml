canonical_text:
  quote: ''
  summary: 'The passage presents several moral anecdotes about sincerity, religious
    appearance, and discernment: a disguised dwarf at a women’s sermon exposes a preacher’s
    mistaken inference about spiritual emotion; a king presses Ayaz to explain his
    regard for old shoes and rags; a Gueber distinguishes Bayazid’s saintly faith
    from a hypocritical missionary’s faith; a harsh-voiced Mu''azzin unintentionally
    prevents a girl from converting; a cat-and-meat puzzle illustrates the Gueber’s
    difficulty about Bayazid’s body and spirit. The passage then begins the story
    of a devotee who condemns wine, breaks a noble’s wine-jar with a stone, and provokes
    the noble’s anger.'
  language: English
  quote_policy: summarized
