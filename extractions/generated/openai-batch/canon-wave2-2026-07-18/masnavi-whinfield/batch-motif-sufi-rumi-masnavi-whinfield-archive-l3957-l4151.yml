canonical_text:
  quote: ''
  summary: The passage opens with garden, season, blossom, fruit, body, bread, grape,
    and healing metaphors about hidden difference and transformation through loss.
    It then tells the story of a Qazwin man who wants a lion tattoo but cannot endure
    the needle. The following counsel has the Prophet address Ali, urging reliance
    on a Pir or spiritual guide, obedience, patience with chastisement, and submission
    like Moses before Khizr, while using images of palm-trees, shadow, Mount Qaf,
    Simurgh, the sun, hand, road, and desert.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts a perfect rose or lily that rejoices in spring with
    a useless thorn that desires autumn to hide the rose's beauty and the thorn's
    shame.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Gardener is said to know the difference between the plants even in autumn,
    and the sight of One is valued above the world's sight.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A figure called the One Person is described as the world, as the sun, and
    as holding the writing of all existence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blossoms announce spring and give way to fruit; the passage says that when
    the body is destroyed the soul lifts up its head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bread, grapes, and citrons are presented as useful only after being broken,
    crushed, or pounded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man of Qazwin asks to have a lion tattooed on his back, but when the needles
    prick him he cries out in pain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tattoo patient objects first to the lion's tail and then to each place
    where the artist applies the needles, until the artist throws down the needles
    and pigments and refuses to continue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Prophet addresses Ali as the Lion of God and counsels him not to rely
    on lion-like valor, but to seek refuge under the palm-trees of Truth and under
    the Man of Reason.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The spiritual guide is described as making a thorn into a bed of roses, giving
    sight to blind eyes, having a shadow like Mount Qaf, and having a spirit like
    a Simurgh soaring high.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The spiritual guide is also described as the sun of the spirit hidden in the
    form of a man, from whose light men and angels draw life.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ali is told to choose a Director and be submissive to him as Moses submitted
    to Khizr, remaining patient even when Khizr staves in a boat or slays a young
    man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says a friend is needed, warns against traveling the road alone
    through the desert, and identifies the Director's hand with the grasp of Allah.
  category: speech
  evidence_refs:
  - ev:9
