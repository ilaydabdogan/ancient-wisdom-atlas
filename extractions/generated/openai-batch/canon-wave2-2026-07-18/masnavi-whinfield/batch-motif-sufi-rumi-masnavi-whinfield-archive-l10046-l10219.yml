canonical_text:
  quote: ''
  summary: The passage presents Daquqi as a wandering seeker of God's chosen ones,
    reflects on non-spatial spiritual journeying and divine manifestation, teaches
    that varied religious praises are directed toward one divine source, then continues
    a story in which David judges a dispute over a cow and exposes an older hidden
    murder. It closes with a reflection that criminals' own hands and feet disclose
    hidden sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Daquqi is described as continually praying and journeying in order to meet
    the particular favourites or chosen ones of God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Daquqi says he journeyed for years and months to East and West, barefoot over
    thorns and flints, while absorbed in God and love of a figure called the Moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the lover travels with the heart and that the journey
    of spirits or the soul does not involve ordinary footsteps, stages, time, place,
    or change of location.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daquqi longs to behold the splendours of the Friend in human form, described
    through images of an ocean gathered into a drop and a sun compressed into an atom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says praises of righteous men and prophets are mingled into one
    stream because the one praised is only One.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage uses examples of light reflected from a wall and the moon reflected
    in a well to describe mistaken praise of reflections or forms rather than their
    source.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the story continuation, a petitioner slays and eats a cow, and the cow's
    owner accuses him of theft and brings him before David.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: David first orders restitution, then after private meditation reverses the
    sentence and orders the plaintiff to give up the claim and then his goods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: David discovers that the plaintiff formerly killed the accused man's grandfather
    and stole his goods; David leads the Muslims to the desert tree where the murder
    occurred and executes the murderer there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The closing teaching says criminals and sinners expose their own hidden crimes,
    and that hands and feet bear witness to secrets of the heart, especially in passion,
    anger, wrath, and revenge.
  category: speech
  evidence_refs:
  - ev:8
