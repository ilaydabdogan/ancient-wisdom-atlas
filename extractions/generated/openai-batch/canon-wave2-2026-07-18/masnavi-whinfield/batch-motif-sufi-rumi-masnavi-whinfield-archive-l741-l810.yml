canonical_text:
  quote: ''
  summary: 'The passage is a contents listing for Book V, naming several stories and
    associated topical headings: the Prophet and his quest, prayers for spiritual
    enlightenment, the Arab and his dog, the sage and the peacock, non-monastic Islam,
    prayers for higher aspirations, the Bafizis of Sabzawar, Satan''s snares, a man
    claiming prophethood, a youth imitating a Shaikh, blindness to spiritual things,
    the creation of Adam, God as the only real agent, death as gain, and Mahmud and
    Ayaz with a description of one made one with God.'
