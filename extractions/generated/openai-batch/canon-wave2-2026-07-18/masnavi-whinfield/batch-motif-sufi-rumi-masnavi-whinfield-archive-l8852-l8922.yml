    But  thou  hast  drunk  only  sour  whey.
  summary: A first-person speaker rebukes a second-person pretender who claims closeness
    to God and saintly status. The passage contrasts true divine wine with sour whey,
    false loverhood with attachment to an evil demon, common divine nearness with
    saintly inspired love, and dry branch intoxication with wine that bears fruits
    of wisdom and penitence.
