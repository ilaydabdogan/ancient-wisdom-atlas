canonical_text:
  quote: ''
  summary: The passage moves from a dialogue with personified bad passion in a private
    cell, framed as the greater warfare, to a summarized tale in which an Egyptian
    prince captures a damsel after seeing her portrait but later pardons the captain
    she loves and unites them. It then presents teachings on hearing, seeing, ideas,
    and reality through a sage, the bat and sun, Moses and the mount, heroic battle
    images, Majnun, and the Beloved. The closing section criticizes denial of life
    beyond the present world and compares impermanent dominion to a dream.
  language: English
  quote_policy: summarized
