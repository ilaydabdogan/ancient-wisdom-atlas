canonical_text:
  quote: ''
  summary: 'The passage presents an allegory in which potherbs boil in a pot, protest
    their suffering, and are told by a housewife that the fire is meant to improve
    them and make them fit for life. The explanation connects mercy, vengeance, trial,
    purification, and rising above nature. It then shifts to Abrahamic sacrifice imagery:
    the speaker identifies as Abraham, addresses the hearer as the son under the knife,
    and says that the head cut off is restored to life by being cut off.'
  language: English
  quote_policy: summarized
