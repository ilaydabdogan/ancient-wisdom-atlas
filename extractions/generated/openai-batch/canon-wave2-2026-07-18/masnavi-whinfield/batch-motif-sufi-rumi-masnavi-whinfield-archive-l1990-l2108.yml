canonical_text:
  quote: ''
  summary: The passage first teaches that visible causes such as flint and steel are
    secondary to a higher First Cause perceived by prophets. It then compares praise
    and prayer to water or vapor rising and divine rewards descending. The passage
    next summarizes a Kalila and Damna story in which a lion dominates the beasts,
    the beasts agree to send one victim daily, an anecdote about Solomon and the angel
    of death illustrates the futility of escaping destiny, and a hare chosen as victim
    begins a stratagem by telling the lion of an alleged rival and leading him to
    a well.
  language: English
