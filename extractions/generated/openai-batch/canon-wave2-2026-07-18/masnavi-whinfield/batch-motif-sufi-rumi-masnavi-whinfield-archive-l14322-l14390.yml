canonical_text:
  quote: ''
  summary: The passage presents an extended image of a leased house whose term lasts
    until death. A tenant who fails to profit from it is put out by the owner, who
    demolishes it to reveal a hidden gold-mine. The tenant laments having been absorbed
    in pictures and forms rather than the hidden treasure. Hakim Sanai is cited advising
    that the house full of pictures be swept clean. A heading states that those who
    recognize God's almighty power do not ask where heaven or hell are. The passage
    ends with an address to Pharaoh contrasting mercy for wisdom with the stick and
    expulsion from the stable for foolishness.
