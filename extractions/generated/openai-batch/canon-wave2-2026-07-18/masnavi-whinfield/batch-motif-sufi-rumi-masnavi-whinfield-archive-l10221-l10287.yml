canonical_text:
  quote: ''
  summary: The passage warns that God can cause secret sins to be revealed at the
    day of judgment. It describes the sinful soul as casting up sparks of fire and
    speaking of itself as belonging to fire. It then presents an allegory in which
    lust is a murderer, claimant, and usurping master, while reason is the slayer
    of lust's cow, identified with the body; spiritual food and treasure are obtained
    only through this slaying and digging.
  language: English
  quote_policy: summarized
