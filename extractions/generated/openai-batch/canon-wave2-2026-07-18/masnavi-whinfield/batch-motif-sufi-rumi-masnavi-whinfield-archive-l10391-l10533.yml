canonical_text:
  quote: ''
  summary: A dialogue presents the Men of Saba arguing that their hearts and conditions
    are divinely fixed and incurable. The prophets answer that some qualities and
    pains are unalterable, but others can be changed or cured through God's mercy;
    they warn against despair and emphasize obedience to God. The Men of Saba continue
    to complain that the prophets' warnings increase their distress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Men of Saba ask the preachers to stop and say God has placed a lock upon
    their hearts that no human can overcome.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Men of Saba argue that God has painted and assigned created things as
    they are, and that argument cannot alter that assignment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Men of Saba illustrate their claim with examples they treat as impossible
    transformations, including stone becoming ruby, old becoming young, earth becoming
    water, water becoming honey or milk, heaven becoming dregs, earth becoming pure
    wine, and mountain becoming grass.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prophets answer that God created some qualities in people that cannot
    be altered and other accidental qualities that may be made good.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The prophets contrast impossible and possible transformations: stone to gold
    is impossible, copper to gold is possible, sand blooming as a rose is impossible,
    and sand turning to mud is within its capacity.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prophets say some pains have no cure, while other pains have cures, and
    they describe remedies as belonging to God's mercy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Men of Saba reply that their own pains do not admit of cure and that warnings
    make their bonds heavier.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Men of Saba compare their condition to an obstructed body in which water
    does not reach the liver; even drinking the ocean does not quench thirst, and
    the hands and feet become dropsical.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prophets say despair is wrong, God's mercy and grace are boundless, and
    one must not despair of such a benefactor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The prophets say difficult conditions may later be relieved, hope may follow
    hopelessness, and sunlight may follow darkness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The prophets acknowledge that the people are weighted as with stones and have
    locks upon them, but say their own business is resignation, obedience, and servitude
    to God.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Men of Saba complain that the prophets make them miserable and plunge
    their previously untroubled souls into anxieties.
  category: speech
  evidence_refs:
  - ev:9
