canonical_text:
  quote: ''
  summary: The passage teaches that hidden spiritual meanings and the counsel of inspired
    ones should be heeded. It uses Zulaikha’s many coded utterances about ordinary
    things to show that her one meaning is Yusuf, whose name nourishes, quenches thirst,
    and turns pain to joy for her. The passage then links this to love, divine naming,
    union with God, and the distinction between the Friend and veiling appearances.
    It ends by returning to the story of three princes who reach the metropolis of
    China; the eldest insists on presenting himself before the king despite his brothers’
    warnings and their advice to heed the Pir.
  language: English
  quote_policy: summarized
