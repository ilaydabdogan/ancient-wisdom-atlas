canonical_text:
  quote: ''
  summary: 'The passage moves through several didactic episodes: postmortem retaliation
    is described through wolf-shaped bad qualities; Zul Qarnain visits Mount Qaf,
    a bright emerald mountain encircling the world and linked by hidden veins to cities
    and earthquakes; a parable of ants watching a pen explains layers of causation
    up to divine impulsion; and Muhammad asks Gabriel to reveal his true form, despite
    the frailty of bodily senses.'
