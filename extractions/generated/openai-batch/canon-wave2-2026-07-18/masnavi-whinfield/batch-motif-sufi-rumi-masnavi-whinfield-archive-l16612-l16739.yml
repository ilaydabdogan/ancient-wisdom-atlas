canonical_text:
  quote: ''
  summary: The passage recounts God sending angels to take a handful of earth for
    Adam’s creation. Israfil is diverted, while 'Izrail refuses Earth’s entreaties
    and brings back the earth. The episode is interpreted as teaching that creatures
    are instruments and God is the only real agent. God appoints 'Izrail as the angel
    of death, explains that death will operate through diseases, and the passage argues
    that death is gain or life for the spiritual, while carnal reason mistakes life
    and death.
  language: English
  quote_policy: summarized
