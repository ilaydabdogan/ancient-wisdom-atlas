canonical_text:
  quote: ''
  summary: 'The passage develops a sequence of mystical and philosophical images:
    human reason and thought are compared to unseen oceans whose visible forms are
    waves, spray, cups, and speech; a rider mistakenly searches for the steed he is
    already riding; light, color, darkness, pain, grief, and happiness are used to
    explain knowledge by contrast; God is said to remain hidden because God has no
    opposite, with Moses and Mount Sinai cited as an example.'
  language: English
  quote_policy: summarized
