canonical_text:
  quote: ''
  summary: 'The passage first describes a sad faqir whose prayers alternate between
    despair and renewed hope until he hears a divine command to ascend. It then teaches
    that God abases and exalts, illustrating this by paired conditions in nature,
    time, bodily health, and worldly events. The passage turns to divine unity overcoming
    plurality through wine and saltpan imagery. A second section interprets the Qur''anic
    statement about placing a Khalifa on earth: God sets up a vicegerent as a mirror
    of divine sovereignty, establishes light and darkness, and presents history as
    recurring conflict between opposed standards, including Adam and Iblis, Abel and
    Cain, Abraham and Nimrod, Moses and Pharaoh, Mustafa and Abu Jahl, and punished
    groups or figures such as Thamud, the Adites, and Qarun.'
  language: English
  quote_policy: summarized
