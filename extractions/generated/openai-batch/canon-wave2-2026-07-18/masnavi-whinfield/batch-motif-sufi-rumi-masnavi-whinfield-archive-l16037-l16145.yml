canonical_text:
  quote: ''
  summary: The passage frames a story of Muhammad Shah, the Rafizi inhabitants of
    Sabzawar, and a dying traveler named Abu Bakr as a parable about the world, the
    man of God, and God seeking a true heart. It then presents Iblis asking God for
    traps to catch humankind, receiving wealth, horses, jewels, wine, silk, and finally
    the beauty of women, which he accepts as especially effective.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage refers to a saying about a wise man falling into the company of
    fools and illustrates it with a young deer placed in an asses' stable, where it
    is jeered at and maltreated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Muhammad Shah captures Sabzawar, whose Rafizi inhabitants come out humbly
    to beg for their lives and offer ransom and tribute.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince states that he will spare the inhabitants only if they produce
    from Sabzawar a man named Abu Bakr.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants say that such a name is hateful to the Shi'as and that finding
    a man so named in the city would be impossible.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After searching the neighborhood, the inhabitants find a traveler lying by
    the roadside at the point of death who bears the name Abu Bakr.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the traveler cannot walk, the inhabitants place him on a bier and
    carry him into the king's presence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king reproaches the inhabitants for contempt and neglect of the pious
    Sunni and cites a saying that God regards hearts and deeds rather than outward
    show and wealth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The poet states that, in the parable, Sabzawar is the world, the poor Sunni
    is the man of God despised and rejected by men, and the king is God Almighty seeking
    a true heart among evil men.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Iblis asks the Almighty for a mighty trap with which to catch human game.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: God gives Iblis gold, silver, and troops of horses as means to catch creatures,
    but Iblis remains dissatisfied.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: God next offers jewels, costly wines, and silken garments; Iblis asks for
