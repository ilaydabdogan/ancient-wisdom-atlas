canonical_text:
  quote: ''
  summary: The passage personifies the flute as revealing inner secrets and recounting
    the sufferings of love, including Majnun’s toils. The speaker contrasts raw and
    ripe spiritual understanding, urges an addressee to break bonds to silver and
    gold, and uses water, pitcher, oyster, pearls, and torn garment images for covetousness,
    contentment, and purification by love. Love is praised as healing madness and
    physician of pride, as exalting bodies to heaven and animating hills. A Sinai
    allusion describes love giving life to Mount Sinai, its quaking, and Moses falling
    in a swoon. Footnotes gloss self-annihilation leading to eternal life in God,
    the Raw/Ripe distinction, and the Qur'anic Sinai allusion.
  language: English
  quote_policy: summarized
