canonical_text:
  quote: ''
  summary: The passage moves from a contrast between divine and human jealousy into
    a devotional complaint to God as the Beloved. The speaker describes wailing under
    divine chastening, transforms grief into a pleasing offering, reflects on the
    disappearance of “we” and “I” in the Beloved, and describes the true lover as
    beyond joy, sorrow, and seasonal alternation.
  language: English
  quote_policy: summarized
