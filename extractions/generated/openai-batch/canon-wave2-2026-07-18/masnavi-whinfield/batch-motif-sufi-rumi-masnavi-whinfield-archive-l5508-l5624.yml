canonical_text:
  quote: ''
  summary: A pauper enters a prison, consumes the prisoners' food, and is publicly
    proclaimed a pauper by order of the Qazi. A Kurd lends a camel hoping for reward
    but receives nothing after hearing the all-day proclamation. The passage then
    compares the pauper's dependence on prison to Iblis in the world-prison, where
    Satan steals true faith, enters many forms, hides beneath appearances, and enters
    thoughts to lead people into sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pauper gains admittance to a prison and eats the prisoners' victuals, leaving
    them none.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prisoners complain formally to the Qazi and ask that the pauper be banished
    from the prison.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pauper tells the Qazi that he has no house or means of livelihood except
    what the prison supplies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Qazi orders the pauper to be carried through the city while a proclamation
    announces that he is a pauper, so that no one will lend to or trade with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Attendants borrow a camel from a Kurd who sells firewood; the Kurd agrees
    from hope of reward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pauper is carried on the camel from morning to evening while the proclamation
    is made in Persian, Arabic, and Kurdish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the Kurd asks for payment, the pauper refuses, saying the proclamation
    should have told him the pauper had no money.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pauper says the prison is his sustenance and paradise; the passage then
    presents Iblis speaking to Allah and asking for respite until the day of resurrection.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Iblis says that in the prison of the world he takes true faith from people
    by fraud or deceit and frightens or distracts them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Satan is described as a dog that enters a thousand forms; if no outward form
    is available, he enters thoughts to draw people into sin.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage lists many kinds of thoughts, including pleasure, business, science,
