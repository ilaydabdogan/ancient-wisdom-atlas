canonical_text:
  quote: ''
  summary: 'The passage first treats mystical union as bodily nakedness from illusions
    and says the final mystery cannot be expressed in words. It develops metaphors
    of the sea, wooden horse or boat, silence, inaudible spiritual cries, and the
    perfect spiritualist who breaks the boat and enters the sea of Truth like a fish.
    It then resumes the story of the king and his sons: after the eldest prince dies,
    the second brother comes to court, receives spiritual knowledge from the King,
    becomes proud and rebellious, and is compared to Nimrod, who survived shipwreck
    and divine nurturing but became an enemy of God and Abraham. The prince repents
    and is pardoned, but divine decree remains; the King’s missing arrow is found
    fixed in his throat. Dying, the prince praises the King as both slayer and saviour,
    saying only his body has been struck while his spirit goes to the Friend.'
  language: English
  quote_policy: summarized
