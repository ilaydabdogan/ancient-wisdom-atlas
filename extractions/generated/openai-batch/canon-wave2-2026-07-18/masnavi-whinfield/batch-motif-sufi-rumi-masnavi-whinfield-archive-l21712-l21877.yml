candidate_motifs:
- id: motif:1
  label: Inexpressible mystical union beyond bodily veils
  taxonomy_refs:
  - annihilation_union
  - divine_beloved
  - mystical_quest
  basis: The passage speaks of becoming naked of the body and its illusions, entering
    intimate union, and reaching a mystery that words cannot express.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is mystical and didactic rather than a discrete mythic episode.
- id: motif:2
  label: Silence as vessel for crossing the sea
  taxonomy_refs:
  - mystical_quest
  - ark_vessel
  basis: The wooden horse, glossed as a boat, is required at sea and is then identified
    with silence as guide and support.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The vessel is metaphorical; it is not described as a literal ark narrative.
- id: motif:3
  label: Perfected seeker entering the sea of Truth
  taxonomy_refs:
  - annihilation_union
  - mystical_quest
  basis: The perfect spiritualist breaks the boat, plunges into the sea as a fish
    of the sea of Truth, and becomes a mystery beyond speech and silence.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The imagery is explicitly symbolic and not a literal sea voyage.
- id: motif:4
  label: Divine illumination and spiritual sight
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: The King grants insight beneath phenomena, and the passage says God gives
    sight to the pure spirit after it escapes bodily bonds.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:12
  confidence: high
  cautions: The motif is doctrinally stated; narrative embodiment is mainly through
    the prince.
- id: motif:5
  label: Heavenly nourishment followed by pride and judgment
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The prince is fed spiritual food by the King, becomes self-conceited and
    rebellious, repents, yet remains subject to a divinely decreed fatal outcome.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The King and God are closely linked in the passage, but their exact allegorical
    relation should be reviewed by a human.
- id: motif:6
  label: Miraculous infant survival and nurture after shipwreck
  taxonomy_refs:
  - miraculous_child
  - ark_vessel
  basis: Nimrod alone survives a shipwreck as an infant, is saved through the pity
    of 'Izra'il, and is nurtured by God without mother or nurse.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This appears as a brief internal exemplum rather than the main story;
    the vessel taxonomy is approximate because the text describes a wrecked ship,
    not an ark.
- id: motif:7
  label: Fatal arrow as irrevocable judgment
  taxonomy_refs:
  - divine_judgment
  basis: Although the King has pardoned the prince, one missing arrow is found fixed
    in the prince’s throat and is associated with the decreed doom.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage presents the arrow through mystical narrative language; the
    mechanics of the wound are not fully explained.
- id: motif:8
  label: Bodily death with spiritual preservation and return to the Friend
  taxonomy_refs:
  - death_rebirth
  - annihilation_union
  - divine_beloved
  basis: The dying prince gives thanks that the King struck his body rather than his
    spirit, and the text says the body must perish before the spirit lives happily
    and goes to the Friend.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage emphasizes spiritual release rather than a literal bodily
    resurrection.
