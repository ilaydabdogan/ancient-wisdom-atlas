canonical_text:
  quote: ''
  summary: An exhortation addresses Bilqis, warning that death will destroy worldly
    possession and urging her to leave the kingdom of darkness for the lasting kingdom
    of faith. The passage describes spiritual kings seated in a hidden garden of the
    spirit, its fruits and fount of life, bodiless movement through the heavens, protection
    from sorrow and thoughts of death, and the addressee becoming her own fortune,
    treasure, and kingdom. A note interprets union as the swallowing up of duality
    and separate phenomenal existence in the One.
  language: English
  quote_policy: summarized
