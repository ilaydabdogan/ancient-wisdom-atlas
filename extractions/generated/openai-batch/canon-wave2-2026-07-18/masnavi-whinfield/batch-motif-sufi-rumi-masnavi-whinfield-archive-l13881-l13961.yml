canonical_text:
  quote: ''
  summary: The passage contrasts outward judgment by signs and appearances with inward
    discernment by divine light, using images of veils, rind and kernel, coins, a
    basket, and the heart. It warns that external professions of faith can mislead,
    exhorts the listener to become old in wisdom and faith like Universal Reason,
    and then introduces the story of three fishes in a secluded lake, identified as
    taken from Kalila and Damnah / Anvar i Suhaili.
  language: English
  quote_policy: summarized
