canonical_text:
  quote: ''
  summary: The passage exhorts resignation, presents plants or potherbs as undergoing
    boiling, death, nourishment, and ascent into higher forms of life, rejects a goose-like
    critic of the Masnavi, compares objections to the Masnavi with objections to the
    Koran as mere old stories, and teaches that Quranic words have layered hidden
    meanings, illustrated by Adam's visible clay/body and hidden soul.
  language: English
  quote_policy: summarized
