  summary: The passage contrasts fools and the wise through images of reason, love
    of the Friend, and spiritual food. It introduces a story of a youth who complains
    to a king about rations and receives silence because his concern is only material.
    It then comments on Moses' fear before Pharaoh's magicians, God's reassurance,
    the rod becoming a snake, and the contrast between fading sorcery and enduring
    faith or miracle.
