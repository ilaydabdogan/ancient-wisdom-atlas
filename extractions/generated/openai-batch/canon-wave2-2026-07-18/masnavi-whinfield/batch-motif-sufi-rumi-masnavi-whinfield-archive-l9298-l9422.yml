canonical_text:
  quote: ''
  summary: The passage presents a short exchange in which Zaid, after being struck,
    refuses abstract reasoning because of pain. It then tells of a lover admitted
    to his mistress who reads poems instead of embracing her; the mistress rebukes
    him for loving his own raptures rather than her. The passage applies this to Sufi
    practice, contrasting religious raptures and changing states with pure love, union
    with God, and images drawn from Abraham, Jesus, water, fire, moon, and divine
    light.
  language: English
  quote_policy: summarized
