canonical_text:
  quote: ''
  summary: 'The passage contrasts the soul and body by their origins and desires:
    the soul is heaven-born, exiled below, and seeks wisdom, life, and what is on
    high, while the body seeks earthly sustenance and possessions. It then describes
    love for a thirsty soul being kindled in the Prince of Bokhara, whose burning
    grief ascends to his master and moves compassion. A praising speaker addresses
    the Prince with exalted epithets, including phoenix, return from Mount Qaf, and
    Israfil of love’s resurrection-day, asking him to listen.'
  language: English
  quote_policy: summarized
