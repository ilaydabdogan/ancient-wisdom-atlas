canonical_text:
  quote: ''
  summary: 'God answers Moses on discernment, explaining the separation of pure and
    dark spirits through images of threshing, pearls and stones, wheat and straw,
    hidden treasure, and butter hidden in milk. The passage then summarizes a parable:
    a king marries his son to a pious Dervish''s daughter, but the prince is bewitched
    by an ugly old paramour until physicians break the spell and he returns to his
    wife. The narrator identifies the true wife with the Deity, the old paramour with
    the world, and the physicians with prophets and saints. Brief additional examples
    describe a child granted wisdom who abandons empty play, and a devotee joyful
    during famine through concentration on things above.'
  language: English
  quote_policy: summarized
