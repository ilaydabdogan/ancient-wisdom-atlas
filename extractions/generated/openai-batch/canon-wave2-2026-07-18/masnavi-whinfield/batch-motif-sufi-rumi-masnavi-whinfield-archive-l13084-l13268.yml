canonical_text:
  quote: ''
  summary: The passage describes Solomon's temple-building with the aid of men and
    Jinn, turns this into an exhortation about mastering inner demons and building
    the temple of the heart, contrasts pious prophetic construction with lust-driven
    labor, recounts a story of a poet and two differently disposed vazirs, and concludes
    with all creatures and elements depending on God for sustenance and aid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Solomon lays the foundations of the temple, and men and Jinn assist, some
    willingly and others under compulsion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says men are like demons and that lust for wealth is a chain that
    drags them into labor and activity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is cited as placing ropes or works about people's necks, made from their
    own dispositions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lust is described as fire burning in evil deeds, with the deeds compared to
    coal whose blackness becomes visible after burning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The building of the prophets is said to be without lust, and the Ka'ba is
    said to owe its foundation to Abraham's piety rather than stones and mortar.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The addressed pious ones are told to build the lively temple of the heart
    so the Divine Solomon may be seen.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says good angels should collar recalcitrant demons and fairies,
    and that carnal demons and Jinns may be made submissive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The heart is compared to Solomon's signet and is to be guarded from demons,
    lest demons rule over the person.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A poet recites a panegyric for a liberal king; the king orders one thousand
    gold pieces, but the vazir Abu-'l-Hasan gives ten thousand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After some years the poet returns in poverty, but a new vazir of the same
    name delays and reduces the payment to one hundred gold pieces.
  category: sequence
  evidence_refs:
  - ev:6
