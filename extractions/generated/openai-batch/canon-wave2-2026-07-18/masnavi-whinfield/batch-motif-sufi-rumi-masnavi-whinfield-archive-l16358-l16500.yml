canonical_text:
  quote: "“When the Eternal appears the transitory is annulled”"
  summary: The passage contrasts blind imitation with genuine spiritual insight through
    analogies of a deaf man, vessel and fountain, glass and moonlight, infantile preoccupations,
    land and sea, day and night, wind and gnat, and scriptural signs such as Moses’
    staff and the breath of Isa. It describes the disciple’s later awakening, self-recognition,
    humility, and reception of light when the transitory becomes naught before the
    Eternal.
  language: English
  quote_policy: quoted
