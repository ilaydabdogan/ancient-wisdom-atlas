canonical_text:
  quote: ''
  summary: The passage summarizes the story of an Arab whose wife persuades him to
    take their only possible gift, a pot of water, to the Khalifa at Baghdad; the
    Khalifa receives it graciously, fills the pot with gold, and sends him home by
    boat on the Tigris. The verse section then reflects on women's influence over
    men, invoking Adam and Eve, heroic exemplars, Muhammad and Humaira/Ayisha, and
    an analogy of water and fire in a cauldron. It concludes this range by beginning
    a teaching on Moses and Pharaoh as opposed figures who nevertheless act within
    God's will.
  language: English
  quote_policy: summarized
