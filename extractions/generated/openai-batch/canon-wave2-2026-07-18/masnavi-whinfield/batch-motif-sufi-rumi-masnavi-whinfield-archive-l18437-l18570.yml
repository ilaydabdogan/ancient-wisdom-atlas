canonical_text:
  quote: ''
  summary: The passage contrasts ordinary sight with divinely informed vision through
    examples of Joseph, Jacob, and Moses. It distinguishes believers who behold the
    Beloved from unbelievers absorbed in lust and gluttony, praises spiritual manliness
    and renunciation, and introduces a tale in which a king tests courtiers with a
    priceless jewel. The courtiers refuse to break it, but Ayaz obeys the king and
    breaks it. The passage then frames this as a test of true faith versus imitation,
    followed by royal judgment and Ayaz's intercession for the condemned courtiers.
  language: English
  quote_policy: summarized
