canonical_text:
  quote: ''
  summary: The passage continues a tale in which a cock explains fulfilled predictions
    of deaths and foretells the master's own death after the master shifted losses
    onto others; the master seeks Moses, who intercedes with God so that he may die
    in God's peace. A didactic section then presents freewill as the condition for
    meaningful piety, merit, reward, punishment, and final reckoning. A later story
    recounts a woman whose infants repeatedly die; after crying to God, she sees Paradise
    with mansions, hears that her sorrows are accepted in place of blood shed in holy
    war, and sees her lost children safe with God.
  language: English
  quote_policy: summarized
