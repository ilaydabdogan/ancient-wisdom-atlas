canonical_text:
  quote: ''
  summary: A merchant's caged parrot sends news of its confinement to parrots in Hindustan.
    One Hindustani parrot falls down as if dead; when the merchant reports this at
    home, the caged parrot imitates the act, is removed from the cage, revives, and
    flies away. The passage then gives didactic reflections on saints preserved from
    harm, the need not to enter dangers without spiritual readiness, saintly transformation
    of harmful or base things, and divine jealousy described through royal-audience
    analogies.
  language: English
  quote_policy: summarized
