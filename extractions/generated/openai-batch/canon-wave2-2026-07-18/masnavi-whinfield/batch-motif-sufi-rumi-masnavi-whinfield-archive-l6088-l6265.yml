canonical_text:
  quote: ''
  summary: The passage first describes spiritual emanation through images of soul-conception,
    Mary, Messiah, worlds giving birth to worlds, and repeated resurrections. It then
    tells of a thirsty man prevented by a wall from drinking tank water; he removes
    bricks and throws them into the water because the sound lets him hear the water
    and brings him nearer. The stated moral identifies the wall with the body, the
    water with life, and bodily abasement with nearness to union with Deity. A following
    discourse contrasts sensory light with God's hidden light and uses images of pen
    and hand, horse and rider, arrow and bow, King, Wisdom, and hidden Power to describe
    divine agency behind visible action. The passage ends with brief anecdotes about
    shame preventing a dirty man from bathing and about Zu'l Nun testing professed
    friends in a madhouse.
  language: English
  quote_policy: summarized
