canonical_text:
  quote: I died as inanimate matter and arose a plant, / I died as a plant and rose
    again an animal.
  summary: The Vakil answers those who warn him against yielding himself to his lord.
    He declares a fatal attraction to water, likens himself to a sacrificial cow,
    invokes the cow of Moses as life-giving sacrifice, describes repeated death and
    ascent through forms, and compares union with the beloved to pitcher-water losing
    individuality in a stream while retaining essence.
  language: English
  quote_policy: quoted
