  quote: ''
  summary: The passage retells Noah calling his son Canaan into the ark during the
    flood, Canaan refusing and trusting swimming, a torch, and a mountain, and Canaan
    being overwhelmed by a wave. It then presents a doctrinal inquiry about acquiescence
    in infidelity versus acquiescence in God’s ordinance, with a response distinguishing
    ordinance from what is ordained. The excerpt closes with a statement that divine
    love interrupts argument and a brief barber anecdote about a man asking to have
    white hairs removed from his beard.
