canonical_text:
  quote: ''
  summary: The passage narrates an infidel guest’s shame after defiling his bedding,
    the Prophet’s merciful choice to clean it himself, the guest’s return for a talisman
    and penitence, his instruction and conversion, and his later moderation in drinking
    milk. It then gives a didactic reflection on outward religious acts as witnesses
    of inner faith, with warnings against fraudulent piety and a closing emphasis
    on divine grace and mercy.
