canonical_text:
  quote: ''
  summary: A didactic passage urges listeners not to excuse inaction by fatalism but
    to accept God's command, give thanks, seek union, and exert themselves. It then
    argues that God often grants wisdom to the weak or outwardly humble, using the
    bee, silkworm, Adam, and the Seven Sleepers' dog as examples. It contrasts inner
    life and divine knowledge with empty outer form, and ends with the hare delaying
    on the road to the lion while devising a stratagem.
