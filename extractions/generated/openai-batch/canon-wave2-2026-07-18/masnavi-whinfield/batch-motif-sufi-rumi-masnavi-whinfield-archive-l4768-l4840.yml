canonical_text:
  quote: ''
  summary: The passage first notes that a Magian chief, moved by 'Ali's discourse,
    embraces Islam with his family. It then presents a speech in which the Prophet
    has foretold to both 'Ali and 'Ali's servant that the servant will one day kill
    'Ali. The servant begs to be killed first so he will not commit the sin, but 'Ali
    refuses to resist the decree, saying that what God's pen has written cannot be
    balked and that the servant is God's instrument. A question about retaliation
    leads to a theological explanation that divine displeasure, mercy, vengeance,
    and planning of events are God's secret.
  language: English
  quote_policy: summarized
