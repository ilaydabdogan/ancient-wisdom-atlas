  summary: The passage moves from a prologue on secrecy, divine aid, free will, self-abandonment,
    intoxication, and annihilation of self as ascension, into a didactic story about
    a Hindu slave who loves his master’s daughter. The father cures the slave’s desire
    by arranging a mock marriage and substituting a disguised boy, after which the
    slave rejects the girl; the episode is compared to worldly pleasures that seem
    attractive at a distance.
