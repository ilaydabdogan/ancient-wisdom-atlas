canonical_text:
  quote: ''
  summary: The passage presents exhortations on watchfulness, divine blessing, negation
    of self, annihilation in God, and spiritual knowledge. It illustrates these themes
    through a rejected sleeping lover and through a drunken Turkish noble who summons
    a spiritual minstrel. The minstrel’s song of repeated negations is explained as
    a hidden way of hinting at affirmation, and the passage closes with similes of
    divine wine, bodily wine, pitchers, poison, water of life, words, bodies, souls,
    and veils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening speaker says bashfulness has been destroyed, announces an intention
