canonical_text:
  quote: ''
  summary: 'The passage contrasts outward resemblance with hidden sacred distinction
    through sacred letters, Muhammad, a wonder-working staff, and saintly speech.
    It summarizes an anecdote about whelps barking in the womb and a heavenly voice
    explaining their likeness to spiritually unawakened speakers. It then summarizes
    a pious man of Zarwan whose unusually generous almsgiving is answered by divine
    blessing on his garden, despite his sons'' criticism. The final section begins
    a story of Adam''s creation from a handful of earth: God sends Gabriel, then Michael,
    to fetch earth, while the personified Earth pleads against the act out of fear
    of future human rebellion and divine curse.'
  language: English
  quote_policy: summarized
