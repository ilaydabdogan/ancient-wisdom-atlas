canonical_text:
  quote: ''
  summary: 'A fable contrasts three fish: a very wise fish escapes immediately into
    a running stream when fishermen are seen, a half-wise fish survives by pretending
    to be dead after the nets arrive, and a foolish fish is captured and killed. The
    passage then gives a didactic exposition distinguishing the wise man, the half-wise
    person, and the fool through images of light, guidance, the caravan, the way,
    and desert wandering.'
  language: English
  quote_policy: summarized
