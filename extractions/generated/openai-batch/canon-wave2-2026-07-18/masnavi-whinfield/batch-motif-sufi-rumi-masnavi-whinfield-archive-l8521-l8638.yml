canonical_text:
  quote: ''
  summary: The passage presents a didactic account in which a person calling on God
    is discouraged by Satan, then receives through Khizr the teaching that the very
    call to God is already God's answer. It contrasts spiritually obstructed fools
    and the painless prosperity of Pharaoh with the sorrow of God's friends, whose
    pain prompts secret prayer. It then begins a narrative of a villager who accepts
    hospitality from a townsman, invites him in return, refuses him at the village
    door after a long-delayed visit, and later makes shelter conditional on guarding
    a garden, leading the townsman to shoot the villager's pet ass by mistake in rain
    and darkness.
  language: English
  quote_policy: summarized
