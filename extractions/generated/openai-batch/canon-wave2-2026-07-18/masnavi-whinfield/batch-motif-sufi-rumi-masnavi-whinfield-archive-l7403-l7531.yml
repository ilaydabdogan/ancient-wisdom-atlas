canonical_text:
  quote: ''
  summary: 'The passage recounts a man who misses the Prophet’s prayers, sighs in
    regret, and exchanges that sigh for another man’s prayers; a heavenly voice later
    declares the sigh equal in worth to accepted prayers and calls it water of life
    and healing. It then gives brief examples of deception, including a thief’s escape
    by stratagem and a mosque built for mischief. The final section compares Qur''anic
    wisdom to a believer’s lost camel: the seeker searches anxiously while false informants
    invent details for reward.'
  language: English
  quote_policy: summarized
