  quote: found only the old shoes and the ragged dress
  summary: Ayaz privately keeps and wears his former poor clothing and shoes to remember
    his low origin and avoid pride. Others suspect him of hiding stolen treasure or
    forbidden drink. The king, though confident of Ayaz's fidelity, orders the accusers
    to search the chamber, where they find only the humble objects and return ashamed.
    The passage frames the lesson through Qur'anic examples of Iblis, Adam, creation
    from fire and clay, and shame on the day of judgment.
