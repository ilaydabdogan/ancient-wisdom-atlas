canonical_text:
  quote: "“The world is fleeting as snow. I am calling thee ! Follow me and forsake
    the world !”"
  summary: The passage opens with an allegory of base coin, pure gold, touchstone,
    alchemy, and judgment-day light. It then tells of Bayazid predicting Abu-'l-Hasan
    Khirqani, whose later visit to Bayazid's snow-covered tomb brings a voice calling
    him to renounce the world. The main story recounts Bayazid's ecstatic divine-identification
    sayings, his instruction that disciples should kill him if he repeats them, the
    disciples' knife attack when he repeats them, and the reversal of their blows
    onto themselves while Bayazid remains unharmed.
