canonical_text:
  quote: ''
  summary: The passage summarizes Rumi’s story of a jackal whose dyed skin leads him
    to claim peacock status, but whose claim is rejected when he cannot perform peacock
    behaviors. It then summarizes a hungry proud man who feigns luxury by greasing
    his beard and lips with fat until a cat carries off the fat and exposes him. The
    passage applies this false-pretense pattern to Pharaoh’s claim of divinity, cites
    a Qur'anic sign for detecting false pretenders, recalls Harut and Marut being
    tempted on earth, and begins a summary of Moses and Pharaoh.
  language: English
  quote_policy: summarized
