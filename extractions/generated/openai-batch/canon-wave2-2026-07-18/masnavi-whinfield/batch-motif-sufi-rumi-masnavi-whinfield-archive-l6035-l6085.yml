canonical_text:
  quote: A certain falcon lost his way, and found himself in the waste places inhabited
    by owls.
  summary: A falcon loses his way into the owls' waste places. The owls suspect him
    of intending to seize their nests and surround him. The falcon says he belongs
    on the king's wrist and does not desire their dwelling. He warns that the king
    would punish them if they harm him, then teaches that outward form can mislead
    but can also guide one toward inner substance and Allah.
  language: English
  quote_policy: quoted
