canonical_text:
  quote: ''
  summary: The passage teaches that listening can cure defective inner sight, while
    holy words fail to enter blind or crooked hearts. In the narrative excerpt, a
    servant says he tried to inform a Sufi about a disaster involving the Sufi's ass,
    but the Sufi was singing the same refrain as the crowd; the Sufi says blind imitation
    undid him. The speaker then explains that unverified imitation, greed for food
    and ecstatic company, and attachment to rank or wealth obstruct reason. The passage
    also presents the Prophet as a guide who asks no material recompense, naming the
    vision of The Friend as his true wage.
  language: English
  quote_policy: summarized
