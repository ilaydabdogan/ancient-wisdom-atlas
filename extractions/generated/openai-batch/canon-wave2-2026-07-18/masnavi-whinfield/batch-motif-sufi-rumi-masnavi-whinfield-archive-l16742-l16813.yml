  summary: 'The passage describes the resurrection: a divine command and the last
    trumpet summon bodies and atoms from the earth, souls return to their own bodies,
    books of deeds are placed in right or left hands, thoughts and actions become
    manifest, the pious flourish, the fearful dread the left-hand book, and the evildoer
    is sent to a fiery prison.'
