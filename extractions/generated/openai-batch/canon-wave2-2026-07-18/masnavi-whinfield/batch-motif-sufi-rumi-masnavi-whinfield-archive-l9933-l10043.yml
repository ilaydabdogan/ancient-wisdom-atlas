canonical_text:
  quote: ''
  summary: The passage first describes prayer aligned with what pleases God and love
    of God burning away self-inclination. It then introduces Daqquqi, a saintly wanderer
    seeking a vision of the Friend. At the sea-shore he sees seven lights become one
    light, then seven men, then seven trees invisible to passing crowds. The trees
    bow in prayer, become men again, and Daqquqi leads their devotions. A distressed
    ship is saved through his prayer, after which the crew vanishes and his followers
    doubt the miracle. The passage closes with descriptions of Daqquqi’s wandering,
    compassion, intercession, and a prophetic teaching that severed parts live only
    when joined to the whole.
  language: English
  quote_policy: summarized
