canonical_text:
  quote: ''
  summary: 'The passage contains didactic anecdotes and teachings: an old man’s ailments
    are attributed by a physician to old age; a moral teaching contrasts outward mosques
    with the hearts of saints and warns against treating prophets as ordinary men;
    an Arab carrier rejects a poor scholar after learning that scholarship has not
    brought him livelihood; and Ibrahim bin Adham, a renounced prince and saint, is
    introduced as an example of inspired divine knowledge, casting a needle into the
    sea and commanding it to return.'
  language: English
