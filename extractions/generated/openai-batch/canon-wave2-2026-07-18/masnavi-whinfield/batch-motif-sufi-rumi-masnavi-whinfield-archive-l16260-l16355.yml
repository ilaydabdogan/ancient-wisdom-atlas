canonical_text:
  quote: "“So God uses prophets and saints as mirrors whereby to instruct men”"
  summary: The passage moves from a brief statement about a lover giving up life for
    the beloved to a teaching-story about an ignorant youth who imitates a Shaikh’s
    weeping without understanding. A true disciple warns him that saintly actions
    arise from spiritual insight and divine source, not outward display. Further analogies
    compare blind imitation to a deaf man laughing with a crowd, a foolish lady copying
    a slave-girl’s trick, and a parrot trained by a hidden speaker through a mirror;
    the passage then says God instructs men through prophets and saints as mirrors.
  language: English
