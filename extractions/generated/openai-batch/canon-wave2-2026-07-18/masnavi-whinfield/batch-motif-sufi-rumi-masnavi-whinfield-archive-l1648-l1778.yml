canonical_text:
  quote: ''
  summary: The passage describes a deceptive religious teacher who beguiles Christians
    with pious-sounding doctrine, then turns to a prayer about human beings repeatedly
    caught in snares and released by God. It presents bodily sleep as a nightly freeing
    of spirits from the body-prison and describes the awakened Knower as asleep to
    worldly affairs and guided like a pen in a writer's hand. It closes with an anecdote
    in which Laila tells the Khalifa he cannot judge her because he is not Majnun,
    followed by reflections contrasting ordinary wakefulness with love-related spiritual
    perception.
  language: English
  quote_policy: summarized
