canonical_text:
  quote: ''
  summary: The passage closes an unresolved debate about compulsion and free agency,
    then teaches that love of God silences merely carnal reasoning. It contrasts earthly
    reason with God-given reason, describes sacrificing reason for enduring divine
    love, invokes the Egyptian women overwhelmed by Joseph's beauty, addresses God
    as hidden yet manifest through effects, and recalls a shepherd whose speech about
    God is faulty but whose love is sincere and intense.
  language: English
  quote_policy: summarized
