canonical_text:
  quote: ''
  summary: A courtier explains that he sought only the king’s blows and would have
    received eternal life if the king had cut off his head. The passage then gives
    Abraham’s refusal of Gabriel’s aid in Nimrod’s fire as an illustration of one
    who needs no intermediary with God. It contrasts divine chastisement as harmful
    to the vulgar but exalting to saints, comparing the Nile’s water as pure to Israelites
    but blood to Egyptians. Moses asks God why He creates forms and then destroys
    them. God says Moses asks to reveal divine wisdom to the people, commands him
    to sow seed, and after Moses reaps the mature corn asks why he cut it down. Moses
    answers that grain and straw belong in different places.
  language: English
  quote_policy: summarized
