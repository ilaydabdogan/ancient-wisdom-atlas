canonical_text:
  quote: ''
  summary: The passage counsels reserve through images of the sun, moon, stars, honey,
    vinegar, a purified heart, and the Last Day. It says direct vision of the Sun
    of Truth would make lesser lights unnecessary, but weaker reflected light can
    be borne by invalid hearts. It warns against publishing mysteries before their
    appointed revelation. Zaid is said to have fled, while ordinary senses, reason,
    and discourse are annihilated in the light of the King's knowledge. The passage
    then describes night, morning, and the Last Day as a restoration from unconsciousness
    and not-being to life. It begins the story of 'Ali, who, after being spat upon
    by a Magian opponent, drops his sword and explains that he acts for God's will
    rather than private vengeance; it also recounts the prophecy of his death by his
    own stirrup-bearer.
  language: English
  quote_policy: summarized
