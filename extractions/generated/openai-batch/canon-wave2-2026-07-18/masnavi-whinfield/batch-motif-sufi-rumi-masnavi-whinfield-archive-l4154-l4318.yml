canonical_text:
  quote: ''
  summary: The passage gives didactic counsel about entering within, choosing a Director,
    and becoming a polished mirror; recounts a lion, wolf, and fox dividing prey,
    where the wolf is slain for self-assertion and the fox rewarded for self-abnegation;
    tells of a man admitted to his friend only after saying “Thou” rather than “I”;
    and presents Joseph receiving a mirror, followed by teaching that defect, not-being,
    and contraries reveal beauty and perfection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening counsel contrasts one who is within and sees light with a stranger
    or ring outside the door who sees only the veil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the hearer to choose a Director, avoid sluggishness like
    water and mud, and endure rubbing in order to become a polished mirror.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A lion hunts with a wolf and a fox and catches a wild ox, an ibex, and a hare.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf proposes that the ox go to the lion, the ibex to himself, and the
    hare to the fox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lion becomes angry because the wolf has spoken in terms of “I,” “Thou,”
    “My share,” and “Thy share,” and kills the wolf with one blow of his paw.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fox, made wary by the wolf’s fate, says all the prey should be the lion’s
    portion; the lion is pleased, gives all the prey to the fox, and says the fox
    is no longer a fox but himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man knocks at a friend’s door, first answers “’Tis I” and is denied entrance,
    then returns after a year of separation and answers “’Tis Thou,” after which the
    friend admits him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Joseph’s old friend visits him and presents a mirror as the chosen gift, asking
    Joseph to admire his own face in it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says not-being and defect are mirrors of beauty and gives examples
