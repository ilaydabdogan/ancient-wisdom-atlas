canonical_text:
  quote: "“Man hankers after what is forbidden”"
  summary: 'The passage first recounts Joseph asking a fellow prisoner to remember
    him before the king, then moralizes that reliance on human aid rather than God
    prolonged his imprisonment. It then begins the story of a king’s three sons: the
    king sends them to inspect his realm but forbids them to approach a certain fort;
    they disobey, enter the fort, see images including a portrait of the King of China’s
    daughter, fall in love, and plan a journey to seek her hand. A didactic section
    warns against intoxication with outward forms and directs attention to the giver,
    the reality of love, and the formless source of forms.'
  language: English
  quote_policy: quoted
