canonical_text:
  quote: ''
  summary: The passage contrasts true self-annihilation in God with undisciplined
    self-will, warns that hypocrites can imitate the language of dervishes like fowlers
    using decoy calls, and summarizes the story of a Jewish king and his Vazir who
    persecute Christians through a deception. The Vazir mutilates himself, gains Christian
    trust as a martyr and teacher, gives contradictory secret instructions to twelve
    captains, withdraws into a cave, appoints each captain as successor, commands
    them to kill rivals, kills himself, and causes sectarian division, though one
    faithful band is preserved.
  language: English
  quote_policy: summarized
