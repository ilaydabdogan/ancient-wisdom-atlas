canonical_text:
  quote: ''
  summary: A poor debtor travels to Tabriz seeking help from the Prefect, but finds
    him dead and repents for relying on a creature rather than the Creator. A charitable
    person fails to raise much money from citizens, visits the Prefect's tomb, and
    receives dream directions to a treasure for the poor man. The poor man's prayer
    contrasts the Prefect's material gifts with God's greater gifts and creation.
    The passage develops images of God as sole Qibla, man as astrolabe and reflection
    of divine signs, and the obliteration of slave and lord in the Creator.
  language: English
  quote_policy: summarized
