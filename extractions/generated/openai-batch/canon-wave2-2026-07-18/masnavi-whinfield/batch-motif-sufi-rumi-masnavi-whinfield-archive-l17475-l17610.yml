  summary: The passage contrasts safety in Noah’s ark with the destructive sea of
    illusion, praises conviction and right perception, summarizes an ascetic saint’s
    fasting, divine direction, miraculous sustenance, charity, and discernment, presents
    reflections on fasting and trust in God’s provision, summarizes a debate about
    free will and fatalism, gives anecdotes of a fatalist robber and faithful slaves,
    and closes with images urging the reader to look beyond visible effects to their
    hidden causes and to God as giver of patience.
