canonical_text:
  quote: ''
  summary: 'The passage presents a debate in which a Muslim urges a Magian to accept
    the faith, and the Magian answers with arguments about divine sovereignty and
    compulsion. It then states that love of God cuts short reasoning and produces
    bewilderment and silence, illustrated by the Prophet’s companions preserving silence
    before deep sayings and by a phoenix of good fortune hovering overhead. The passage
    returns to Mahmud and Ayaz: the king asks why Ayaz continually visits his old
    shoes and garments, and the narrator compares this to Majnun visiting Laila, a
    Christian visiting a priest, and a mother calling to her dead infant; faith and
    love make the dead things seem living to Ayaz.'
  language: English
  quote_policy: summarized
