  summary: The passage criticizes merely external or noisy proofs as signs of blindness,
    illustrates the point with a peasant who rushes to tell the Prince of Tirmid that
    he cannot fulfill a swift mission to Samarcand, and then turns to a teaching on
    mercy, chastisement, proper placement, justice, and the non-vainness of what God
    has created.
