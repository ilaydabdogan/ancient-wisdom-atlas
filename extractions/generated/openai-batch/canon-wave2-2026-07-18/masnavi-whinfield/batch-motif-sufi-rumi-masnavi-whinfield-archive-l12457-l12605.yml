canonical_text:
  quote: ''
  summary: The passage first presents a rebuke in which a speaker says the addressee
    wrongly imagined them to be unguarded, like a lamb without a shepherd, while a
    vigilant Guardian knows every wind that touches them. It then gives a moral comparison
    of worldly lust to a bath stove or furnace that heats the bath of piety, followed
    by a brief illustrative story of a tanner harmed by perfume and cured by dung-smell.
    The main story summary recounts David being forbidden by a divine voice to build
    the Jerusalem temple because he was a man of blood; Solomon is appointed to complete
    it. Solomon’s temple-building is accompanied by miracles, his encounter with Bilqis
    Queen of Saba, the summoning of her throne, supernatural helpers, a trial involving
    a stolen signet and impersonation by Sakhar, Solomon’s restoration, and an ominous
    tuft of grass in the completed temple.
  language: English
  quote_policy: summarized
