canonical_text:
  quote: ''
  summary: The passage recounts several miracles attributed to the Prophet Muhammad,
    including a napkin purified in fire, water increased from a single water-skin,
    a dark water-carrier transformed to fairness, an infant recognizing the Prophet,
    and an eagle removing a sandal that contained a viper. The passage then draws
    a moral that sudden misfortunes may be providential protections. It next begins
    a story in which a man asks Moses to teach him the language of animals; Moses
    warns against it, but after the man persists and Moses consults God, he teaches
    him the language of fowls and dogs. The man overhears a cock and dog speaking,
    and uses the cock’s predictions of animal deaths to sell his horse and mule before
    they die.
  language: English
  quote_policy: summarized
