canonical_text:
  quote: ''
  summary: The passage first presents a didactic image in which spirit and reason
    clear away the weeds of sensation, thought, and lust so that pure water, mysteries,
    waking visions, and the gates of heaven become visible. It then introduces the
    story of Bahlol visiting a saintly Darvesh. The Darvesh explains that he fares
    like one for whom life, death, and the world are subservient because all things
    obey God's decree; the person whose will accords with that decree accepts life,
    death, and even children's deaths for God's sake without hope of reward or fear
    of punishment.
  language: English
  quote_policy: summarized
