canonical_text:
  quote: ''
  summary: A sage sees a peacock destroying his own plumage and urges him to stop.
    The peacock explains that his bright feathers attract hunters and that he wishes
    to make himself unattractive. The poet interprets the plumage as worldly cleverness,
    accomplishments, and wealth that endanger spiritual life but also provide trials
    necessary for virtue. The passage then argues for inward detachment, abstinence,
    temperance, and trial rather than self-mutilating renunciation.
  language: English
  quote_policy: summarized
