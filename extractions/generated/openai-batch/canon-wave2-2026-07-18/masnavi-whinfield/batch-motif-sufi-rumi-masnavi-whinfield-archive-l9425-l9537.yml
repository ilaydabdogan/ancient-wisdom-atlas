canonical_text:
  quote: ''
  summary: The passage counsels turning attention from self-image toward love and
    desire. It then tells of a man in the time of David who prays for food without
    work; after ridicule, a cow enters his house and he kills and eats it, illustrating
    the value of sincere petition. A didactic section contrasts knowledge with opinion
    through images of wings, a bird, a straight path, and Gabriel-like flight. A following
    story shows boys tricking their teacher into believing he is ill so they can obtain
    a holiday.
  language: English
  quote_policy: summarized
