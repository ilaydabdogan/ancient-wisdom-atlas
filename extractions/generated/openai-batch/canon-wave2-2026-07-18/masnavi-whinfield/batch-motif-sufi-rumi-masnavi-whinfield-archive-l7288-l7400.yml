canonical_text:
  quote: ''
  summary: 'The passage first gives mystical exhortations: the addressee is told that
    a spiritual Friend will transform terror, infuse a new soul, open the heart''s
    book, and help the fragment become a full moon, while dervish rebukes are preferred
    to sinners'' flattery. It then introduces the story of Mo’avia and Iblis: Iblis
    wakes the sleeping caliph for prayer, defends himself with claims about his origin,
    love of God, and role as a mirror, but Mo’avia distrusts him, prays for protection,
    and compels him to confess that he woke Mo’avia to prevent the greater spiritual
    gain that would have come from sorrowful sighs over missing prayer.'
  language: English
  quote_policy: summarized
