canonical_text:
  quote: ''
  summary: The passage opens with Moses and serpents, then narrates the story of people
    examining an elephant in a dark room by touch and giving different descriptions
    according to the part touched. The following verses compare outward sense to a
    hand that cannot grasp the whole, contrast sea and foam, describe water beneath
    water and Spirit calling spirit, discuss the difficulty of speech about form,
    and urge release from mire, weaning from earth-bound attachment, acceptance of
    wisdom and light, silence before divine speech, and entrance into Noah's ark rather
    than swimming like Canaan.
  language: English
  quote_policy: summarized
