  summary: The passage contrasts ignorance with enlightened recognition of a true
    voice. It uses analogies of a thirsty person offered water and a suckling child
    called by its mother, then says the sight and voice of prophets inwardly move
    souls. A poor man recognizes a strange sweet voice as the voice of God. A prose
    note says an anecdote about unborn infants connected with the Virgin Mary and
    the mother of John the Baptist leads into the story of the Tree of Life.
