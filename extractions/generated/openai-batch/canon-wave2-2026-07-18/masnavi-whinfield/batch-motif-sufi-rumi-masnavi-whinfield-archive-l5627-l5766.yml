- id: obs:3
  text: The lover’s love is described as visible, while the Beloved or Friend is hidden
    or absent, with the resulting distraction present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker rejects love that depends only on outward form or face and asks
