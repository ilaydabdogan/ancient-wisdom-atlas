canonical_text:
  quote: "“The lover’s love is visible, his Beloved hidden.”"
  summary: The passage counsels the addressee to reject evil suggestions, invoke God,
    and turn away from attachment to outward forms toward the hidden divine Beloved.
    It develops images of borrowed light, true and false dawn, wine and cup, jewels
    and stones, and the hidden Workman in the workshop of Not-being. It then recounts
    Pharaoh’s futile attempt to prevent Moses’ birth by killing infants, and uses
    that story as an analogy for a person who blames external enemies while the real
    enemy is bodily lust within.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker tells the addressee to sweep evil suggestions from the heart and
