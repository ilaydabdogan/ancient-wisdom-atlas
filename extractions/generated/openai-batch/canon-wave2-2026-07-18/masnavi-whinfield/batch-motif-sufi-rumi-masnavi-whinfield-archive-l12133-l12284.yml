canonical_text:
  quote: ''
  summary: The passage first personifies the Koran as warning those who abuse it.
    It then tells of a gnat petitioning Solomon for justice against the Wind; Solomon
    requires both parties to be present, the Wind arrives, and the gnat flees. The
    narrator compares this to seekers vanishing when God appears, describing union
    as eternal life that begins as annihilation. The passage then begins the story
    of a lover separated from his mistress for seven years, who is chased by patrolmen
    into a garden and unexpectedly finds her; he blesses the patrol as the cause of
    the meeting. When he tries to embrace the mistress, she rebukes him by saying
    the blowing wind shows God is present.
  language: English
  quote_policy: summarized
