canonical_text:
  quote: ''
  summary: The passage first describes a punishment in which a person performs outward
    religious duties but lacks inward expansion or relish, using husk, kernel, seed,
    tree, and form-without-soul imagery. It then begins the story of a convent Sufi
    accused by brethren of excessive speech, eating, and sleep. The Shaikh admonishes
    him toward the golden mean and cites Moses being rebuked by Khizr for excess speech.
    The accused Sufi answers that moderation is relative, that one led by spirit is
    not bound by outward law, and that the inner voice is its own evidence.
  language: English
  quote_policy: summarized
