canonical_text:
  quote: ''
  summary: 'A snake-catcher finds a large snake frozen in the mountains, thinks it
    dead, ties it up, and takes it to Baghdad. Spectators gather; the sun thaws the
    snake, which revives and destroys them. The passage then explicitly compares fleshly
    lust to the snake: hunger and humiliation keep it frozen, while warmth, wealth,
    rank, and Pharaoh-like power revive it into destructive pride. The speaker urges
    keeping it restrained and slaying it in sacred combat, with union from God as
    reward.'
  language: English
  quote_policy: summarized
