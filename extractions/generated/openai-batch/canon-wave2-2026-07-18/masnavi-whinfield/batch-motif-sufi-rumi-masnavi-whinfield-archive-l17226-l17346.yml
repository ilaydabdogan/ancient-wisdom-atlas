canonical_text:
  quote: ''
  summary: 'The passage continues and comments on the fable of the lion, fox, and
    ass, using it to illustrate the danger of merely imitated religion. The ass is
    enticed by the fox toward the lion''s lair, escapes a first attack, and is then
    persuaded again. The following verses add examples in which outward claims are
    contradicted by conduct: a camel claiming to have come from a bath has dirty legs;
    Pharaoh''s reaction to Moses'' serpent-sign exposes inconsistency; and several
    images contrast blind imitation with direct vision of divine light.'
  language: English
  quote_policy: summarized
