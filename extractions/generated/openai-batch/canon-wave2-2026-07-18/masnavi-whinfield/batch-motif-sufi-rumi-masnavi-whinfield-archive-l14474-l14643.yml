canonical_text:
  quote: ''
  summary: 'The passage teaches that celestial bodies and inanimate things obey divine
    command, giving examples from prophetic and Qur''anic traditions: stone and staff,
    the Nile, earth swallowing Qarun, the moon splitting, and trees and stones bowing
    to Mustafa. It then narrates an argument between a Sunni and a materialist/philosopher
    over the world''s transitoriness, culminating in a fire ordeal in which the philosopher
    is burned and the Sunni emerges fairer. The passage ends with the opening of a
    story about a courtier whose life is saved by intercession before an angry king.'
  language: English
  quote_policy: summarized
