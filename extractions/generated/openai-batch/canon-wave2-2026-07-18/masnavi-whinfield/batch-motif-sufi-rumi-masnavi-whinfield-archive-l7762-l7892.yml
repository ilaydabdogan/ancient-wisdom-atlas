canonical_text:
  quote: ''
  summary: The passage opens with a miracle in which fishes rise from the sea bearing
    golden needles for Ibrahim, after which Ibrahim teaches that the kingdom of the
    heart surpasses earthly sovereignty and that scent can draw the soul toward a
    spiritual garden. It then begins a story about a man in the time of Shu'aib/Jethro
    who claims that God has not punished his many sins. God tells Shu'aib inwardly
    that the man is in fact punished by chains, rust on the heart, blindness to mysteries,
    and dulled discernment. A series of analogies compares sin's accumulation to smoke
    on kettles, blacksmith grime, overwritten pages, rusted mirrors, and darkened
    metal. Shu'aib's words affect the man inwardly, and the man asks for a sign of
    the punishment.
  language: English
  quote_policy: summarized
