  summary: The passage presents a dispute over prophetic warnings called evil presages,
    answers with an analogy of a friend waking a sleeper threatened by serpents, and
    develops a teaching that different souls are turned toward worship by kindness,
    suffering, humbling, hell, or bliss. It also summarizes subsequent anecdotes involving
    a Sufi seeking not-being, Jacob and Joseph, and a devout slave in a mosque.
  language: English
