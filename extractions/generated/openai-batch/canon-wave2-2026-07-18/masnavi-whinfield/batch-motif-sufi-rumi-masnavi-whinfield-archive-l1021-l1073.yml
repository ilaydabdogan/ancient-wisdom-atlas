canonical_text:
  quote: This plaint of the flute is fire, not mere air.
  summary: The prologue calls the hearer to listen to a reed-flute that laments being
    torn from its osier bed and banished from home. The flute’s notes move listeners
    to tears, express yearning for home, and are interpreted by each hearer according
    to personal feeling. The passage states that the flute’s secrets are not perceived
    by ordinary senses, compares body and soul, and identifies the flute’s plaint
    as the fire and love that also animates wine. A footnote glosses love as the attraction
    drawing creatures back to reunion with their Creator.
  language: English
  quote_policy: quoted
