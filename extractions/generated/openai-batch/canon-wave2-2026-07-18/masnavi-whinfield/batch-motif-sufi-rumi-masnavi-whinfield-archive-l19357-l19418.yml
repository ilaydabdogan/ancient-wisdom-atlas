canonical_text:
  quote: ''
  summary: The passage presents divine nearness and union as making God impossible
    to behold as an external object. It uses the image of calling in the desert to
    hide the Beloved, then illustrates guarded disclosure through an anecdote of the
    Prophet, 'Ayisha, and a blind man. It comments on the saying 'Die before you die'
    as mortifying and annihilating the carnal self before bodily death. It then compares
    delayed repentance to ritual mourners at Aleppo whose grief for Hasan and Husain
    is treated by a Sunni poet as evidence of their own long sleepiness. For the truly
    spiritual, death is described as a cause for rejoicing rather than wailing.
  language: English
  quote_policy: summarized
