  quote: If you strike flint on mud you will get no fire.
  summary: The passage states that expressions receive value from the state of mind
    behind them. It gives analogies of tools in unsuitable hands, contrasts Mansur’s
    and Pharaoh’s utterances, contrasts Moses’ staff with the magicians’ staff, says
    that 'Isa withheld words of power from a foolish man, and reflects on the One,
    double vision, and a ball moved by a king’s hand.
  language: English
  quote_policy: quoted
