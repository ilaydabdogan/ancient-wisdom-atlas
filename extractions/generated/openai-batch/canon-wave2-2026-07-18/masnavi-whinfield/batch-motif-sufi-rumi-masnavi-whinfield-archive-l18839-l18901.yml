canonical_text:
  quote: ''
  summary: The passage teaches that knowledge is the mark and substance of soul, that
    a knowledge-less soul is like a stone, and that Adam's new soul was honored by
    the angels. It then turns to fear of censure and the evil eye as obstacles to
    openly praising Husamu-'d-Din's ecstatic states and to accepting true faith, using
    Abu Talib's fear of Arab opinion and the Prophet's nephew's exhortation as an
    example.
  language: English
  quote_policy: summarized
