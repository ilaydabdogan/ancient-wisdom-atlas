  quote: ''
  summary: A didactic passage urges attention to a lover's aspiration rather than
    outward mixture of good and evil. It contrasts a noble falcon with low quarry
    and an owl attached to the king, presents Adam as clay yet honored above heaven
    and stars, contrasts living old women with beautiful but lifeless bath-wall pictures,
    and concludes that soul is grounded in knowledge.
