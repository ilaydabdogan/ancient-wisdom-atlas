canonical_text:
  quote: ''
  summary: 'A Bokharian falls before the Prince, enters the flame, and the Prince''s
    love is kindled toward him. The passage then develops didactic images of reciprocal
    love: hearts communicating, lover and beloved seeking one another, God reciprocating
    love, thirst and water mutually attracting, the world arranged in pairs, heaven
    and earth as a male-female pair, and the body''s elements seeking return to their
    origins while divine wisdom preserves their union until the appointed day.'
  language: English
  quote_policy: summarized
