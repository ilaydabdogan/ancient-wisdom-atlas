canonical_text:
  quote: ''
  summary: The passage explains wavering will, divine impulsion, inward inspiration,
    and the relation between human free action and God's agency. It uses images of
    hearing, opened inner eyes, pearls formed in shells, musk formed in a deer's bag,
    alchemical gold, bread becoming spirit, water of life, mountains and the moon
    being cleft, ascent to heaven, world-consuming fire, and final recompense as hell
    or 'The Friend.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person bewildered by wavering will is described as having God whisper a
    riddle into his ear and being placed on the horns of a dilemma.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Preference for one of two alternatives is said to come from God's impulsion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressed person is told to remove the cotton of evil suggestions from
    the mind's ear so that a heavenly voice may enter it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heavenly voice is identified with the inward voice, and the mind's ear
    becomes a sensorium of inspiration; the spirit's eye and ear possess a sense lacking
    to ordinary reason and sense.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that what is called compulsion is, for those with inner sight,
    close communion with God rather than ordinary constraint.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those for whom God opens the eyes of the inner man are said to perceive hidden
    and future things and to possess both freewill and compulsion in a special way.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The passage presents several transmutation images: raindrops become pearls
    in shells, blood becomes musk in the musk deer''s bag, copper becomes gold with
    elixir in an alembic, and bread becomes life-giving spirit in the body.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The soul is said to effect transmutation with the water of life, and the passage
    asks what the power of the Soul of souls must be.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Flesh-born man, through the force of soul, is said to cleave mountains with
    tunnels and mines; Ferhad's soul cleft a hill, and the Soul's soul cleaves the
    moon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the heart opens the store of mystery, the soul springs to highest heaven;
    if the tongue speaks hidden mysteries, it kindles a fire that consumes the world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Human actions are described as evident and freely willed, while God's agency
    is described as the cause of those actions and the actions as signs of God's agency.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that recompense for action is either hell or 'The Friend.'
  category: sequence
  evidence_refs:
  - ev:8
