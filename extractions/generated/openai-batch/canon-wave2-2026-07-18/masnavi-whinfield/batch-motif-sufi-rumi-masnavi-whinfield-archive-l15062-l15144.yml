canonical_text:
  quote: ''
  summary: The passage uses analogies of infants drawn to mothers, disciples drawn
    to teachers, and shadows dependent on trees to describe human attachment to higher
    reason. It then describes God drawing man from animal to human states, future
    transformation beyond the present soul, worldly life as sleep or dream, awakening
    at the last day, exposure of deeds at resurrection, and reversal of present grief
    or laughter.
  language: English
  quote_policy: summarized
