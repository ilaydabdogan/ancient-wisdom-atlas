canonical_text:
  quote: ''
  summary: 'The passage exhorts spiritual teachers to keep calling worldly people
    to repentance despite apparent unresponsiveness, using images of an ant in a wheat
    store, a man knocking at an empty house before the Ramadan dawn meal, and a drum
    beaten in hope of dawn. It describes devotees spending wealth and health on mosques,
    pilgrimage, and striving for God''s favor. It then develops a divine marketplace
    image in which God buys human wealth, bodies, tears, and sighs and gives light,
    a kingdom, a divine fount, heavenly rank, and honor. The passage introduces the
    story of Bilal: an Abyssinian slave in Mecca who is tortured by his master for
    embracing Islam, refuses to recant, cries that God is One, and is purchased and
    freed by Abu Bakr; the Prophet then asks for a share, but Abu Bakr says he has
    already freed him.'
  language: English
  quote_policy: summarized
