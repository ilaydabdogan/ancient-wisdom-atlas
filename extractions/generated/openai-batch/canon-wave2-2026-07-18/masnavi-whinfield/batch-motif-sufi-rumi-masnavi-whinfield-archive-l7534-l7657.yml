canonical_text:
  quote: ''
  summary: A didactic passage argues that false doctrines and errors borrow plausibility
    from some element of truth, so discernment is needed. It then tells of four Hindustanis
    praying in a mosque who each speak in order to criticize the others, thereby sharing
    the same fault. The stated moral is to avoid fault-finding and learn from others'
    bad example. A second anecdote about two Ghuz prisoners illustrates the same proverbial
    lesson through a prisoner who asks that his companion be killed instead of himself.
  language: English
  quote_policy: summarized
