canonical_text:
  quote: ''
  summary: An incurably sick man receives a physician's permission to do whatever
    he wishes, strikes a Sufi at a stream, and is taken before a Qazi. The Qazi first
    imposes a light fine, after which the sick man strikes the Qazi too. The Sufi
    and Qazi then debate leniency, forgiveness, divine ordination, apparent good and
    evil, death, self-abnegation, and compensation in the life to come. The passage
    includes digressive comparisons involving God's warning to the Israelites, Mahmud
    of Ghazni and a Hindu boy, sayings about death, and the Masnavi as a teaching
    of poverty, self-abnegation, and Unity.
  language: English
  quote_policy: summarized
