- id: ev:14
  type: summary
  locator: 19763-19772
  quote_or_summary: The Qazi says every blow and misfortune that befalls him is divinely
    ordained and sent for his good, and that his judgment in the Faqir's case came
    by inspiration rather than impulse.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:15
  type: summary
  locator: 19772-19752
  quote_or_summary: The Sufi asks how evils and misfortunes can come from the divine
    fount of good; the Qazi replies that apparent good and evil have no absolute existence
    but are like foam on a vast ocean, and that misfortunes of the faithful in this
    life will be compensated in the life to come.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
