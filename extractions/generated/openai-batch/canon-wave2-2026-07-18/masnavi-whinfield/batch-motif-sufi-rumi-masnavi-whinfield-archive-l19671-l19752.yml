candidate_motifs:
- id: motif:1
  label: self-abnegation as death to the world
  taxonomy_refs:
  - annihilation_union
  basis: The Sufi is described as full of self-abnegation and, by his profession,
    dead to the world; the Masnavi is described as a shop of poverty and self-abnegation
    and a treasury of Unity.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage uses doctrinal language of self-abnegation and Unity, but
    does not narrate a full mystical union episode.
- id: motif:2
  label: death reinterpreted as passage to higher life
  taxonomy_refs:
  - death_rebirth
  basis: The digression says wise men cease to shrink from death and annihilation,
    which lift them to a higher and nobler life; a saying states that the dead grieve
    wasted opportunities rather than death itself.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage frames this as teaching and analogy rather than a concrete
    resurrection narrative.
- id: motif:3
  label: apparent misfortune as divinely ordained good
  taxonomy_refs:
  - wisdom
  basis: The Qazi explains that every blow and misfortune is divinely ordained and
    sent for his good, and that apparent good and evil lack absolute existence.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The available taxonomy has no more specific item for theodicy or providential
    misfortune.
- id: motif:4
  label: forgiveness tested by reversal
  taxonomy_refs:
  - wisdom
  basis: The Qazi advocates leniency toward the sick Faqir and is then himself struck;
    the Sufi urges him to apply the same mercy and forgiveness in his own case.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: This is a moral narrative pattern; the exact taxonomy mapping to wisdom
    is broad.
- id: motif:5
  label: divine judgment beyond present life
  taxonomy_refs:
  - divine_judgment
  basis: The Qazi says misfortunes suffered by the faithful in this life will be amply
    compensated in the life to come.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The passage mentions afterlife compensation, not a formal judgment scene.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the physician's permissive advice to the
    incurable sick man with God's warning to the Israelites after prophetic admonitions
    failed.
  claim_level: same_function
  target: Quranic warning to the Israelites that they may do what they will while
    God's eye observes them
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is presented as an analogy of admonition and incurability,
    not as a shared narrative origin.
- id: claim:2
  claim: The passage explicitly compares human fear of death with the captive Hindu
    boy's initial dread of Mahmud, later changed by experiencing kindness.
  claim_level: same_function
  target: Anecdote of Mahmud of Ghazni and the Hindu boy quoted from Faridu'd-Din
    'Attar
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the passage and functions as a didactic
    analogy; it does not establish a broader motif lineage.
- id: claim:3
  claim: The Qazi compares apparent good and evil to foam on the surface of a vast
    ocean, using a water image to relativize ordinary moral perception.
  claim_level: visual_similarity
  target: Foam-on-ocean image for non-absolute apparent good and evil
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a metaphor within the speech rather than an explicit cross-textual
    comparison.
