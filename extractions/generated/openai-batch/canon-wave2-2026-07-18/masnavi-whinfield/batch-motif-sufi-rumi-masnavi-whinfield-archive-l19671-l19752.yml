  quote_or_summary: The Sufi tells the Qazi that his ill-timed leniency caused the
    blow and urges him to apply to himself the mercy and forgiveness he proposed for
    another's case.
  source_text_path: texts/public-domain/sufi/project-gutenberg/masnavi-whinfield.md
