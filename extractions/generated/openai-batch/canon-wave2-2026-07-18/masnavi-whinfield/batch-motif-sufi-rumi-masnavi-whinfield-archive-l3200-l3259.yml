canonical_text:
  quote: ''
  summary: 'The passage introduces a metaphysical image in which the world and bodies
    depend on the speaker like wax shaped by bees. It then summarizes the story of
    an aged harper in the time of Khalifa ''Omar: after losing his livelihood, he
    plays his harp to God in the burial-ground of Yathrub, sleeps, and dreams of heaven.
    A divine voice directs ''Omar to relieve the old man; ''Omar finds him, gives
    him money, and later instructs him after the harper casts away his harp in contrition.
    ''Omar teaches that the harper''s worldly journey is over and that in ecstatic
    union with God past and future should be swept away. The passage closes with a
    heading about calling God “Bride” and a brief example involving Mustafa overcome
    by a sweet call and blissful sleep.'
  language: English
  quote_policy: summarized
