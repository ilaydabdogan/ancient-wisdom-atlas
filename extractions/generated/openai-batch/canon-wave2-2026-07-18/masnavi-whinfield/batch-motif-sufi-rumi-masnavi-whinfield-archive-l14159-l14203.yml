canonical_text:
  quote: ''
  summary: 'The passage summarizes Moses addressing Pharaoh: Moses aims to repay Pharaoh''s
    earlier hospitality by freeing him from lust-born illusion, rejects Pharaoh''s
    charge that the staff-to-serpent sign is sorcery, teaches that purified spiritual
    vision sees the One, urges repentance and confession of the One Creator, and describes
    death as gain through an analogy of treasure hidden in a ruined house or body.'
  language: English
