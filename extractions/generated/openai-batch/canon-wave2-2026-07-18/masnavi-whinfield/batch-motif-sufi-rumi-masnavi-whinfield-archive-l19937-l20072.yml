canonical_text:
  quote: ''
  summary: The passage exhorts the addressee to ask the body's members, which are
    personified as witnesses to God's bounties. It argues that bodily forms preserve
    traces of forgotten pleasure and pain through analogies of cotton and summer,
    ice and frost, pregnancy and children, trees and fruit, fire hidden in water,
    and roses and rosewater. It extends these analogies to mystical union, in which
    ecstatic states and words are described as spiritual progeny born of divine apparitions
    and as fruits of preceding wedlock. A transition introduces the story of the faqir
    and hidden treasure and says philosophers and learned men ignore the evidence
    of divine bounty.
  language: English
  quote_policy: summarized
