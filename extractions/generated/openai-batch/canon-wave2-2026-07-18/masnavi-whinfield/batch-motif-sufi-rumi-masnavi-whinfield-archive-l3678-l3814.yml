  summary: The passage moves from a reflection on form and reality, illustrated by
    water and tree growth, to an account of Adam's creation from dust, his wisdom
    or name-knowledge before the angels, the divine saying that God is sought in the
    believer's heart, and the angels' attachment to earth because Adam's body comes
