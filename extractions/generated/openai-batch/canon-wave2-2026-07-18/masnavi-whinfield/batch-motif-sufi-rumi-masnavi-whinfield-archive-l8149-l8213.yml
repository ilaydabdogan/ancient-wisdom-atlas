canonical_text:
  quote: ''
  summary: 'A king hears of a marvelous tree in Hindustan whose fruit grants eternal
    life and sends a courtier to find it. The courtier searches widely but is misled
    or dismissed and returns unsuccessful. He then asks the sage who first spoke of
    the tree, and the Shaikh explains that the tree is knowledge or substance rather
    than outward form: it has many names and manifestations, and seekers must pass
    beyond names to qualities and essence.'
