canonical_text:
  quote: ''
  summary: 'The passage presents a doctrine of continual emergence and return: thoughts,
    forms of speech, the world, and life arise from a formless source and return to
    God. It uses images of an ocean, waves, a stream, and a swiftly whirled spark
    of fire to explain apparent continuity. A narrative frame follows in which the
    hare, after freeing his companions from the lion, urges them toward inward struggle
    against lust and pride through the story of an ambassador sent by the Emperor
    of Rum to the caliph ''Omar. The ambassador finds ''Omar without a material palace,
    receives instruction about mystical union, asks why souls descend from heaven
    and are confined in bodies, and hears ''Omar describe divine words of power that
    bring beings into existence and return them to non-being.'
  language: English
  quote_policy: summarized
