canonical_text:
  quote: |-
    No one knows the very essence of God’s attributes
    But only in their effects and by similitudes.
  summary: The passage distinguishes knowing by report or similitude from knowing
    essence directly. It illustrates this with God's attributes, a child taught by
    analogy, knowledge of Noah by report, the paradox of human and divine agency in
    casting sand, recognition and concealment of prophets, and the opening of a story
    in which a Vakil flees the Prince of Bokhara.
  language: English
  quote_policy: quoted
