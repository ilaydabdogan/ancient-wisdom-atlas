canonical_text:
  quote: ''
  summary: 'A noble approaches a devotee’s house to chastise him. The devotee hides
    under wool and reflects that rebuking an angry person requires mirror-like hardness.
    A chess anecdote illustrates the danger of anger: a prince throws a chessboard
    at a courtier after being checkmated, and the courtier later protects his head
    with felt. Neighbours intercede for the devotee, describe him as not responsible
    for his actions, and invoke divine favor and miraculous preservation of holy persons.
    The noble refuses pacification and insists that no worldly pleasure can replace
    wine; the passage then treats wine as a figure for spiritual pleasure.'
  language: English
  quote_policy: summarized
