canonical_text:
  quote: ''
  summary: The passage recounts Luqman, a wise slave, accepting a bitter watermelon
    from his master without complaint. It then presents a poetic teaching that love
    transforms bitterness, suffering, fear, fire, death, and reversal into sweetness,
    healing, light, life, and mercy. The passage also teaches that good and ill alternate,
    that hope and fear are like two wings, invokes Abraham seeing Paradise in fire
    and ascending beyond celestial bodies, and briefly introduces Bilkis enlightened
    by the Hoopoo sent by Solomon.
  language: English
  quote_policy: summarized
