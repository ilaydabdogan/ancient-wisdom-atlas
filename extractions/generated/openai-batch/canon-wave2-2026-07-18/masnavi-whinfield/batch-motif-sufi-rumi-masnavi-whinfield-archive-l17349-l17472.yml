canonical_text:
  quote: ''
  summary: The passage contrasts outward religious imitation with inward conviction,
    summarizes an animal fable in which a fox eats the ass's heart and liver and excuses
    this by saying the ass must have lacked them, and then presents a monk identified
    as Diogenes searching with a lantern for a true man who can remain upright amid
    anger and lust. A fatalist interlocutor answers by emphasizing divine decree as
    the root of human action.
