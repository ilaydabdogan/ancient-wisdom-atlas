canonical_text:
  quote: ''
  summary: A didactic passage explains that the proper mean is relative to capacity,
    using water, loaves, appetite, prayer, and pilgrimage examples. It then presents
    a first-person ecstatic spiritual voice whose eyes sleep while the heart is awake,
    whose inner senses view two worlds, whose ordinary hardships appear reversed into
    joy, and whose seeming earthly presence is only a shadow while he ascends to the
    seventh heaven and masters thought. The passage closes by saying that a true lover
    recognizes a kinsman’s or friend’s voice by its nearness and sweetness, without
    needing further proof.
  language: English
  quote_policy: summarized
