canonical_text:
  quote: "“The Prophet told him to hold his peace.”"
  summary: The passage introduces inward prophetic knowledge and the water of life,
    then summarizes a story in which the Prophet questions Zaid at dawn. Zaid reports
    ecstatic love, timelessness, a spiritual visit to a celestial region, and a vision
    of eight heavens, seven hells, human destinies, and the last judgment. The Prophet
    repeatedly counsels him not to disclose hidden knowledge that God keeps secret
    until the last day, so that people may remain under hope, fear, and faith in the
    unseen. Zaid submits to this counsel of reserve.
  language: English
  quote_policy: quoted
