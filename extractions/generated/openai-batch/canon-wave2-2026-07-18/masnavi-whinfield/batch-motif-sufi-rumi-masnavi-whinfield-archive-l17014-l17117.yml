canonical_text:
  quote: ''
  summary: 'The passage contrasts Pharaoh and Mansur Hallaj as different speakers
    of the claim “I am the Truth,” distinguishing egoic opposition to light from mystical
    union with light. It then introduces Ayaz’s teaching that professions of faith
    or repentance contradicted by actions are worthless, illustrated by a deceptive
    husband and by resurrection testimony from a person’s body. The story of Nasuh
    follows: after a youth of disguise and misconduct in women’s baths, he seeks a
    holy man’s prayer, repents, faces exposure when a jewel is lost and all bath attendants
    are ordered searched, calls on God in terror, undergoes annihilation of the natural
    self and renewal, is spared when the jewel is found, and later refuses a summons
    that would return him to temptation.'
  language: English
  quote_policy: summarized
