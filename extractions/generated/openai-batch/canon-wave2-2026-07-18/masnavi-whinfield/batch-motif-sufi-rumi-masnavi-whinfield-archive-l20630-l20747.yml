canonical_text:
  quote: ''
  summary: A didactic passage argues that chastisement may be beneficial when timely,
    then has a peasant advise a prince to seek counsel and avoid unsuitable companions.
    It illustrates this with a fable in which a mouse and a frog tie themselves together
    with a string, allowing a raven that seizes the mouse to drag away and destroy
    the frog as well. The text then explicitly compares the mouse to the body, the
    frog to the soul, and the string to the bond that drags the soul down from bliss.
    A further anecdote begins with Sultan Mahmud of Ghazni meeting robbers incognito
    and hearing their special talents, in order to illustrate the superiority of spiritual
    perception.
  language: English
  quote_policy: summarized
