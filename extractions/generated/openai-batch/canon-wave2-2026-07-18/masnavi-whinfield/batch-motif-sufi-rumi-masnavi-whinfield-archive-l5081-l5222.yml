  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Husamu-'d-Din's absence, buds did not blossom; when he came from the sea
    to shore, the Masnavi's poetic music sounded again.
  category: sequence
  evidence_refs:
  - ev:2
