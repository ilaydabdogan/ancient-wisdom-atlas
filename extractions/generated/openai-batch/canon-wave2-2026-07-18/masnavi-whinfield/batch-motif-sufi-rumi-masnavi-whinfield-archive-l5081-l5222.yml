canonical_text:
  quote: ''
  summary: The passage opens with a prologue explaining the delayed recommencement
    of the Masnavi through images of maturation, return, ascent, and poetic renewal.
    It then summarizes the story of a Sufi whose servant neglects his ass, after which
    other Sufis sell the animal and feast while the owner unknowingly joins their
    chant. The poet explains that fables veil doctrine for hearers attached to outward
    stories, and a following section says prophets were sent to distinguish faith
    from infidelity, pure grain from chaff, and true coin from false in a dark world.
  language: English
  quote_policy: summarized
