    Allah after Moses' proposal, Pharaoh refusing conversion, and Moses receiving
    consolation from a heavenly voice. It then introduces the hidden-treasure tradition
    and develops a parable in which a house must be destroyed to reveal a treasure
    beneath it, with regret imaged as discovering too late that a bright moon had
    been hidden by a cloud.
