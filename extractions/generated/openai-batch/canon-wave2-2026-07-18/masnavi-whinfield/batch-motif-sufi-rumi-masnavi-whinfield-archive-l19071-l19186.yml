canonical_text:
  quote: ''
  summary: The passage introduces a story in which a fowler disguises himself with
    leaves and grass, falsely presents himself as a hermit, and lures a suspicious
    but hungry bird toward wheat grains set on a trap. When the bird touches the grain,
    it is caught. The fowler blames the bird's greed, and the stated moral says affliction
    comes from human errors and vices rather than destiny. The captured bird then
    cries to God, addressing the divine as Beloved One, Light on high, shining Moon,
    and source of life, and asks for mercy, grace, and sustaining presence.
  language: English
