canonical_text:
  quote: ''
  summary: The passage recounts Moses rebuking a shepherd for praying to God in concrete
    domestic terms, after which a heavenly voice corrects Moses and teaches that sincere
    inward devotion matters more than outward words or ritual forms. The divine speech
    contrasts forms used by different communities, emphasizes the humble heart, describes
    lovers whose hearts burn with love, and says human prayers are accepted through
    mercy despite defects. The passage also includes water, fire, blood, Ka'ba, milk,
    ocean, and foam imagery, and ends with Moses questioning the Creator about evil,
    paradise, hell, and fire.
  language: English
  quote_policy: summarized
