canonical_text:
  quote: ''
  summary: The passage explains that seekers may wrongly think God is far away, then
    tells an anecdote of a distressed man of Bagdad who follows a dream of treasure
    in Egypt, is arrested and beaten there, tells the truth, learns from a patrolman
    of a dreamed treasure at his own Bagdad house, returns, and finds it. The passage
    then reflects that God may delay answers to prayer so that need draws the suppliant
    nearer, using images of rising groans, angels interceding, an empty lute, and
    caged songbirds.
  language: English
  quote_policy: summarized
