candidate_motifs:
- id: motif:1
  label: Warning against foolish companions
  taxonomy_refs:
  - wisdom
  basis: The bear’s misguided protection kills the man, and the explicit moral warns
    not to make friends with fools.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents this as a moralized fable rather than a full mythic
    cycle.
- id: motif:2
  label: Reason and wisdom opposed to lust
  taxonomy_refs:
  - wisdom
  basis: The speaker contrasts Jesus’ knowledge and wisdom with the ass of lust and
    urges reason not to be overcome.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The ass is a didactic image in the passage, not an independent animal-tale
    episode.
- id: motif:3
  label: Need, thirst, and crying call forth mercy
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says shown thirst brings water, helplessness should be represented,
    cries and groans are powerful, and crying infants receive milk.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy label is approximate; the passage frames the exchange as
    divine mercy rather than contractual reciprocity.
- id: motif:4
  label: Helpless pilgrimage or devotional quest
  taxonomy_refs:
  - mystical_quest
  basis: The speaker says that if one cannot journey to the Ka’ba by oneself, one
    should present helplessness and continue calling on God.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The Ka’ba journey is used briefly as devotional instruction, not narrated
    as an extended quest.
- id: motif:5
  label: Serpent as adversary and miraculous sign
  taxonomy_refs:
  - serpent
  basis: A serpent attacks the bear in the fable, and Moses’ staff becomes a serpent
    or snake among his signs.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: The two serpent appearances occur in different embedded contexts and need
    not form a single motif within the passage.
- id: motif:6
  label: Prophetic signs rejected in favor of an idol
  taxonomy_refs: []
  basis: Moses lists many miracles but says the doubter still worships the magically
    lowing golden calf.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No available taxonomy reference precisely names this calf-worship and
    rejected-signs pattern.
- id: motif:7
  label: Like attracted to like
  taxonomy_refs:
  - wisdom
  basis: The passage says each kind is charmed by its own kind and gives animal and
    scriptural examples.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is an aphoristic explanatory pattern rather than a narrative episode.
comparison_claims:
- id: claim:1
  claim: 'The Moses section explicitly shares motifs with Qur’anic Moses traditions:
    the calf worship, Red Sea deliverance, provision in the wilderness, water from
    rock, staff-serpent, and radiant hand are presented as Moses’ signs.'
  claim_level: same_motif
  target: Qur’anic Moses and calf-worship miracle traditions
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is an English translation and summary-like poetic retelling;
    it alludes to Qur’anic material rather than reproducing the Qur’anic narrative
    in full.
- id: claim:2
  claim: The dog of the cave example is an explicit allusion to the Qur’anic People
    of the Cave tradition, supported by the wording and the source footnote to Qur’an
    xviii.
  claim_level: same_motif
  target: Qur’anic dog of the cave / People of the Cave tradition
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The allusion is brief and used as an analogy within Moses’ speech.
- id: claim:3
  claim: The devotional thirst and calling-on-God passage is linked to Qur’anic devotional
    language by its embedded Qur’an citations for divine drink and calling on God.
  claim_level: same_function
  target: Qur’anic invocation and divine mercy imagery
  evidence_refs:
  - ev:6
  - ev:7
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses citations in a Sufi didactic setting; the exact Qur’anic
