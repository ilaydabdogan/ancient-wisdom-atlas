canonical_text:
  quote: ''
  summary: The passage opens with didactic remarks about requital, reward, causes,
    and the need to prefer Jesus-like wisdom over the ass of lust. It then summarizes
    the story of a kind man who rescues a bear from a serpent; the grateful bear later
    kills the sleeping man while trying to kill flies with a stone, yielding the moral
    not to make friends with fools. A devotional section teaches that need, thirst,
    helplessness, crying, and mercy call forth divine mercy, water, and milk. A further
    section has Moses rebuke a calf-worshipper for doubting his prophethood despite
    miracles including the Red Sea deliverance, heavenly provision, water from the
    rock, the staff becoming a serpent, water becoming blood, and the radiant hand;
    it contrasts these signs with the lowing golden calf.
  language: English
  quote_policy: summarized
