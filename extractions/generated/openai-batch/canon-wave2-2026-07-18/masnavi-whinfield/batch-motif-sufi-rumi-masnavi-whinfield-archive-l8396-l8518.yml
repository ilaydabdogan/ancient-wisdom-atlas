canonical_text:
  quote: ''
  summary: The passage gives examples of prophets whose single staff, curse, or prayer
    brings divine chastisement; then teaches that hidden sin gives prayer a foul odor,
    while sincere but imperfect speech may still be accepted. It illustrates this
    with Bilal's imperfect call to prayer defended by the Prophet, and with God instructing
    Moses to seek aid through an unsinning or purified mouth.
  language: English
  quote_policy: summarized
