canonical_text:
  quote: ''
  summary: The passage summarizes the story of Hilal, a holy groom whose spiritual
    aspiration contrasts with ordinary appetite-bound men. Hilal is neglected by his
    master, falls sick, and is visited by the Prophet after divine intimation. Hilal
    responds gratefully, comparing the Prophet's advent to the sun and his revelation
    to the water of life. The following didactic verses teach that growth in grace
    and ascent occur slowly, using examples of divine creation, gestation, Adam's
    formation, and plants that climb too quickly by external support.
  language: English
  quote_policy: summarized
