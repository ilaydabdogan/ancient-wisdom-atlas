canonical_text:
  quote: ''
  summary: The passage moves from a discussion of darkness, reason, and the relation
    of the Whole to diverse parts into a didactic address. The speaker tells the addressee
    to practice patience and abstinence from vague thoughts, using images of water
    for thirsty souls, lions in a desert, medicine, a scab, gold, letters, and celestial
    bodies. It then describes creation and souls as diverse yet unified, and closes
    with the day of judgment as a great review that distinguishes enlightened persons
    from sin-darkened persons.
  language: English
  quote_policy: summarized
