canonical_text:
  quote: ''
  summary: A repentant servant, absent from his lord for ten years, resolves to return
    to Bokhara despite warnings of death or imprisonment. He says love draws him more
    strongly than prudent counsel and that life or death at his lord's hands is the
    same to him. He returns, throws himself at the Prince's feet, swoons, and is raised
    and pardoned. The narrator then draws a mystical lesson about gaining eternal
    life through abandoning one's own life and about the lover being absorbed in God.
    The passage also introduces an embedded anecdote in which a damsel asks her lover
    which city he finds most delightful; he answers that it is the city where his
    beloved dwells, and says her presence transforms hell, prison, or a well into
    places of delight, while her absence turns flowers into fire.
  language: English
  quote_policy: summarized
