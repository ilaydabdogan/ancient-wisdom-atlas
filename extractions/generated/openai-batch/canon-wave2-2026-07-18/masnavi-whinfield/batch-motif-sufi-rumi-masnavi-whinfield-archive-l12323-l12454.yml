canonical_text:
  quote: In the world there is nothing absolutely bad; / Know, moreover, evil is only
    relative.
  summary: The passage teaches that evil and benefit are relative to relation and
    perception. A lover blesses harsh patrolmen because their roughness led him to
    his beloved. Examples include poison and antidote, serpents' poison, the sea for
    sea and land creatures, and Zaid being judged differently by different people.
    The passage then instructs the hearer to view God through the eyes of God's lovers
    and through God-given sight. It explains the divine names Seeing, Hearing, and
    Knowing as essential attributes that restrain sin, foul speech, and evil plotting,
    contrasting them with empty or mismatched titles.
  language: English
  quote_policy: quoted
