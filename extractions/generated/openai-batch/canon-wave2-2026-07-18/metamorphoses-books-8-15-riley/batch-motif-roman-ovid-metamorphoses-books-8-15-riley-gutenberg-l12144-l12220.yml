canonical_text:
  quote: ''
  summary: The passage gives explanatory traditions about Myscelus founding Crotona
    through an oracle and a sign involving clear-sky rain or his wife Aithrias's tears,
    then introduces Pythagoras at Crotona as a Samian exile and philosophical teacher.
    Pythagoras is described as examining hidden causes with the mind, teaching cosmic
    and natural principles, forbidding animal food, praising non-bloody foods supplied
    by Earth, condemning flesh-eating, and invoking the old Golden Age as bloodless
    and plant-fed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Myscelus is reported to have consulted an oracle about a colony and to have
    been told to settle where he met rain in a clear sky; he obeyed and put to sea
    despite the seeming impossibility.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dangers and distress in Italy, Myscelus's wife Aithrias embraced him
    and wet his face with tears, which he took as the presage marking the city site.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second reported version says Myscelus founded Crotona after the oracle told
    him not to refuse what was offered; Sybaris was founded elsewhere, on the spot
    he had preferred.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fable summary states that Pythagoras came to Crotona, taught his philosophy,
    drew Numa Pompilius to hear him, and discussed transmigration of the soul and
    animal food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pythagoras is described as a Samian voluntary exile who held mental converse
    with the gods and saw with the eyes of his mind what was denied to ordinary human
    vision.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pythagoras examined hidden things and taught about the origin of the universe,
    causes of natural phenomena, earthquakes, the courses of the stars, and other
    concealed matters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Pythagoras is said to be the first to forbid animals from being served at
    table and to urge mortals not to pollute their bodies with such food.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speech lists corn, apples, grapes, herbs, milk, and honey as available
    foods, and says Earth gives food without slaughter and bloodshed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speech contrasts grazing animals with fierce blood-eating animals and
    condemns one living creature existing through the death of another.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The old age called Golden is described as blessed by tree-produce and herbs
    and as not polluting the mouth with blood.
  category: attribute
  evidence_refs:
  - ev:10
