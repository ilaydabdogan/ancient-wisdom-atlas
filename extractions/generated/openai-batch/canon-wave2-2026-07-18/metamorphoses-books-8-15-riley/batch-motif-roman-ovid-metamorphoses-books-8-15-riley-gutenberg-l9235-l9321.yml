canonical_text:
  quote: ''
  summary: At the Thracian shore, the Greek fleet waits to depart. Achilles rises
    as a shade and demands that Polyxena be slain to honor and appease him. Polyxena
    is led from her mother to Achilles's tomb and altar, speaks calmly before death,
    and asks that her body be returned to her mother. A reluctant priest kills her.
    Trojan women and Hecuba mourn; Hecuba laments Polyxena, Achilles's continuing
    hostility after death, the ruin of Priam's house, and her own enslavement and
    exile.
  language: English
  quote_policy: summarized
