canonical_text:
  quote: ''
  summary: 'The passage first gives explanatory notes on the loss, collection, revision,
    and later rejection or destruction of Sibylline books and verses, including a
    claim about prophecy and chastity. It then introduces Fable IV: Aeneas reaches
    Italy after leaving the Stygian abodes; Macareus recognizes Achaemenides, who
    praises Aeneas for preserving him from Polyphemus and recalls the Cyclops hurling
    rocks toward Ulysses'' ship. The synopsis also mentions Aeolus giving Ulysses
    winds in a hide, which sailors open out of curiosity, causing a storm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The explanatory note says the Sibylline books of Tarquinius Superbus were
    generally believed to have been destroyed in the flames when the Capitol burned.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Romans sent officers to Italy, Asia, and Africa to collect material called
    Sibylline oracles; much was rejected, and the remainder was entrusted to the Quindecimvirs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Augustus ordered a revision and had texts deemed genuine deposited in a box
    under a statue of Apollo Palatinus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tiberius had the texts examined again, and later Stilcho or the Emperor Honorius
    is said to have ordered them burned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the extant collection of Sibylline verses is generally
    viewed as spurious, partly because it speaks explicitly of Christian mysteries
    and names.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports St. Jerome's assertion that prophecy was given to the
    Sibyls as a reward for chastity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fable synopsis says Aeneas arrives at Caieta in Italy, where Achaemenides
    meets Macareus and relates his escape from being devoured by Polyphemus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The synopsis says Ulysses received winds from Aeolus in a hide, but sailors
    opened the bag out of curiosity, releasing the winds and raising a storm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During a steep ascent, after the Sibyl had been speaking, Aeneas emerged from
    the Stygian abodes to the Euboean city and performed sacrifice in the usual manner.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Macareus of Neritos recognized Achaemenides, who had once been deserted among
    the crags of Etna, and asked what chance or god had preserved him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Achaemenides says he is no longer ragged and declares that he venerates Aeneas
    like his own father because Aeneas has allowed him to live, speak, breathe, and
    see the sun.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Achaemenides says his life did not fall into the jaws or paunch of the Cyclops.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Achaemenides recalls that, when left behind, he feared shouting because it
