  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Achaemenides says Polyphemus tore up a mountain and hurled a huge rock and
    other stones into the waves, making him fear that stones or waves would overwhelm
    the ship.
  category: action
  evidence_refs:
  - ev:13
