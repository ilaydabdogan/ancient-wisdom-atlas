  quote: ''
  summary: The passage recounts a woman's fatal punishment by Diana after she disparages
    the goddess, the grief and transformation of her father Dædalion into a hawk by
    Apollo, and a subsequent report to Peleus of a destructive wolf-like monster attacking
    cattle near a sea-side temple of Nereus and the Nereids. Peleus interprets the
    calamity as connected to a bereaved Nereid and the departed Phocus, rejects armed
    response, prays to Psamathe, and Thetis intercedes for him.
  language: English
