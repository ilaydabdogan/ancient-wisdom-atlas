canonical_text:
  quote: ''
  summary: A company of heroes attacks a dangerous tusked beast. Ancæus boasts and
    is killed by the beast. Several hunters throw weapons with mixed results, including
    a misdirected javelin that kills a dog. The son of Œneus wounds the beast; a figure
    named in the passage as {Jason} claims and gives the skin and head to the Nonacrian
    Nymph. The sons of Thestius object to a woman receiving the honour and seize the
    trophy; the warlike prince then kills Plexippus and Toxeus.
  language: English
  quote_policy: summarized
