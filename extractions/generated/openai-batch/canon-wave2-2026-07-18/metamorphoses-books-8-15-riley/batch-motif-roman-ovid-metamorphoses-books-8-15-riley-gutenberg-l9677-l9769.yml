candidate_motifs:
- id: motif:1
  label: exposure at sea in a vessel before significant birth
  taxonomy_refs:
  - ark_vessel
  - sacred_birth
  basis: Rhea is put out to sea in an open boat and gives birth to Anius on Delos;
    Anius later becomes king and priest of Apollo.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage says open boat rather than ark and does not describe a flood
    or explicitly miraculous birth.
- id: motif:2
  label: daughters transformed into doves after hostage escape
  taxonomy_refs:
  - shapeshifter
  basis: The daughters of Anius are taken as hostages, escape, and are said to be
    transformed into doves by Bacchus.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The explanatory note also rationalizes the story, so the motif is recorded
    as a reported mythic transformation.
- id: motif:3
  label: touch that produces staple abundance
  taxonomy_refs:
  - sacred_exchange
  basis: The daughters of Anius are said to transform everything they touch into wine,
    corn, and oil, connected in the passage with provisions supplied to the Greek
    army.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage presents this as probably based on thriftiness, names, and
    Delian supplies rather than as an uncontested supernatural event.
- id: motif:4
  label: royal daughters sacrificed to end plague
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: An oracle says the Theban plague will end when the king’s daughters are sacrificed;
    the maidens offer themselves, the gods are appeased, and the plague ceases.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the episode as an explanation of a current story rather
    than giving Ovid’s verse directly.
- id: motif:5
  label: ashes of sacrificed maidens become men
  taxonomy_refs:
  - death_rebirth
  basis: The passage reports a saying that the ashes of the Theban maidens were transformed
    into men after their sacrifice inspired the youth of Thebes.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents this as a saying explained by a social change among
    Theban youths, not as a literal narrative event.
- id: motif:6
  label: mortal judge transformed by offended deity
  taxonomy_refs:
  - divine_judgment
  - shapeshifter
  basis: Cragaleus decides a dispute over Ambracia in favor of Hercules, and Apollo
    changes him into a rock.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage offers rationalizing explanations for the stone transformation.
- id: motif:7
  label: children rescued from fire by transformation into birds
  taxonomy_refs:
  - shapeshifter
  basis: Munychus’s children are transformed by Jupiter into birds when robbers set
    fire to their father’s house.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage suggests this may poetically describe an unexpected escape
    from flames.
- id: motif:8
  label: oracle founded or signaled by bird at sacred oak
  taxonomy_refs:
  - wisdom
  basis: One account says a pigeon settles on an oak in Chaonia and signifies that
    heaven wills an oracle there; another account connects Dodona with a priestess
    called a dove and with oracular oaks.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage gives multiple explanatory accounts and linguistic rationalizations,
    so the bird-oak oracle motif is reported as a tradition rather than as a single
    fixed narrative.
comparison_claims:
- id: claim:1
  claim: The passage presents the pigeon account and Herodotus’s priestess account
    as alternative explanations for the same Dodona oracle foundation tradition.
  claim_level: same_function
  target: Dodona oracle foundation accounts in Silius Italicus and Herodotus
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes later explanatory traditions and does not establish
    historical dependence between them.
- id: claim:2
  claim: The passage compares the dove-priestess tradition with proposed word similarities
    or ambiguities linking terms for priest, pigeon, women, and pigeons.
  claim_level: linguistic_similarity
  target: linguistic explanations for the Dodona dove/priestess tradition
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports conjectural etymologies and says only that such
    expressions may have given rise to the story.
- id: claim:3
  claim: The passage links the wine, corn, and oil powers of Anius’s daughters with
    their names and with actual supplies said to have gone from Delos to the Greek
    army before Troy.
  claim_level: linguistic_similarity
  target: names Oëno, Spermo, and Elaï and the provision-abundance story of Anius’s
    daughters
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is presented as Bochart’s conjectural explanation, not as
    an independently demonstrated origin.
