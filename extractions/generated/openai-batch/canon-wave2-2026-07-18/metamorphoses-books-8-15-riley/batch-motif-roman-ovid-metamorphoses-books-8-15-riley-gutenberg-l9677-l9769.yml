canonical_text:
  quote: ''
  summary: 'The passage gives explanatory notes on several stories: Rhea is exposed
    at sea and bears Anius on Delos; the daughters of Anius are taken as hostages
    and later said to become doves; Theban royal daughters sacrifice themselves to
    end a plague; Cragaleus is changed into a rock after judging a divine dispute;
    children of Munychus are changed into birds during a house fire; and alternative
    accounts explain the founding of Dodona’s oracle through pigeons, priestesses,
    doves, and sacred oaks.'
  language: English
  quote_policy: summarized
