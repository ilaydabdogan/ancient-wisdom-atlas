- id: obs:4
  text: Circe turns twice to the West and twice to the East, touches Picus with her
    wand three times, and repeats three charms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Picus flees more swiftly than usual, sees wings on his body, and is suddenly
    added to the Latian woods as a strange bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Picus' transformed body includes a hard beak, purple wings from his robe,
