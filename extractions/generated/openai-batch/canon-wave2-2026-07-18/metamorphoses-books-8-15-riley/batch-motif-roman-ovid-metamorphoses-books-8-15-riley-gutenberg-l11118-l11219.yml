canonical_text:
  quote: ''
  summary: Circe pleads for Picus to accept her love, but he refuses because of his
    bond to Canens. Circe threatens him, transforms him into a bird with wand and
    charms, and later transforms his attendants into beasts amid chthonic magical
    prodigies. Canens searches for her missing husband, laments beside the Tiber,
    wastes away, and vanishes into air; the place receives her name. A narrator then
    reports hearing or seeing such things during a long year and remaining ashore
    after Circe warns of sea dangers.
  language: English
  quote_policy: summarized
