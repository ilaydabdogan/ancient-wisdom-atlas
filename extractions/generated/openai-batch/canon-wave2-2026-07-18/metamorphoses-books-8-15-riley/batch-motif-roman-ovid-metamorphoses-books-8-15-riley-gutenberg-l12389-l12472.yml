canonical_text:
  quote: "“For my part, I cannot believe that anything lasts long under the same form.”"
  summary: A first-person speaker argues that no form remains stable, giving a catalogue
    of changed ages, sea and land reversals, altered rivers, submerged cities, a hill
    raised by trapped winds, waters that alter bodies and minds, and once-mobile places
    now fixed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker states disbelief that anything remains long under the same form
    and says the ages descended from gold to iron.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says sea has become solid earth, land has been made from sea,
    and sea-shells and old anchors have been found on mountain tops.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A current has made a plain into a valley, a flood has levelled a mountain
    into a plain, swampy ground has become dry sand, and dry places have become standing
    pools.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nature is described as opening and closing springs, while rivers burst forth
    after earthquakes or vanish and subside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Several rivers are described as being swallowed underground, reappearing elsewhere,
    changing course, flowing intermittently, drying, or changing taste and quality.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Anigros is said to have become undrinkable after Centaurs washed wounds
    made by Hercules there; the Hypanis is said to become salty after rising sweet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Antissa, Pharos, and Tyre are said to have ceased being islands; Leucas is
    said to have become surrounded by sea; Zancle is said to have been cut off from
    Italy by the sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: Helice and Buris are described as Achaian cities beneath the waves, with sailors
    pointing out their submerged walls.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A hill near Troezen is described as having once been level plain, then raised
    when winds pent in dark caverns swelled the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Waters are said to freeze or warm at different times, kindle wood under a
    waning moon, petrify entrails or touched things, and change hair to amber or gold
    color.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'Some waters are described as changing the mind: Salmacis has obscene waters,
    an Ethiopian lake causes madness or heavy sleep, and the Clitorian spring causes
    hatred of wine.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Lyncestis causes drunken reeling when drunk immoderately, and the water
    at Pheneos is harmful at night but harmless by day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ortygia is said once to have floated but now to be fixed; the Symplegades
