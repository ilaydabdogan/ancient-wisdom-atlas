canonical_text:
  quote: ''
  summary: The passage contains explanatory notes on Thetis, Peleus, Prometheus, Discord,
    Chione, Phocus, Psamathe, and Lycomedes, followed by the synopsis and opening
    of the story of Ceyx and Halcyone. It recounts Thetis' contested marriage, Prometheus'
    oracle bargain and release from the eagle, Discord's golden apple, Thetis' changes
    of form to evade Peleus, conflicting or rationalized kinship traditions, a wolf-vengeance
    episode associated with Psamathe, and Ceyx's planned sea journey to consult the
    Clarian oracle while Halcyone tearfully warns him about the sea and asks to accompany
    him.
  language: English
  quote_policy: summarized
