canonical_text:
  quote: ''
  summary: Morpheus appears to Halcyone in a dream with the voice, tears, and gestures
    of Ceyx. Halcyone wakes, laments that Ceyx has died by shipwreck, and longs to
    be united with him in death and name. At morning she goes to the shore, sees a
    corpse brought in by the waves, and recognizes it as Ceyx. She leaps from a sea-mole
    and is transformed into a bird; after touching and kissing Ceyx's body, Ceyx too
    is changed into a bird through divine pity. As birds the pair retain their conjugal
    bond, have offspring, and Halcyone broods on a floating nest during seven calm
    winter days while Aeolus restrains the winds.
  language: English
  quote_policy: summarized
