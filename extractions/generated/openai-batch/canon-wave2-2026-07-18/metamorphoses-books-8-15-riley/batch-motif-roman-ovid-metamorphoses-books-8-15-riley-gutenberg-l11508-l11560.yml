canonical_text:
  quote: ''
  summary: Venus petitions her father and the gods to grant godhead to Æneas after
    his merit and Iülus' established power. The gods and Juno assent. Venus goes to
    the Numicius river, commands it to wash away what is mortal in Æneas, anoints
    him with divine substances, and makes him a god. The people of Quirinus call him
    Indiges and honor him with a temple and altars. Notes explain traditions about
    Numicius and the term Indiges.
  language: English
  quote_policy: summarized
