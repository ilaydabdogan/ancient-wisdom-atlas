canonical_text:
  quote: ''
  summary: 'The passage summarizes ancient variant accounts about Polyxena’s death
    at or near Achilles’ tomb, Hecuba’s ancestry, enslavement, death, burial, and
    reported transformation into a bitch, and Memnon’s parentage and origins. It then
    introduces Fables V and VI: Aeneas escapes Troy with his father, son, and sacred
    relics, visits Delos, hears of Anius’ daughters transformed into doves, and the
    daughters of Orion sacrifice themselves for plague-stricken Thebes, after which
    two young men arise from their ashes.'
  language: English
  quote_policy: summarized
