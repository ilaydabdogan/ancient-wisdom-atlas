canonical_text:
  quote: ''
  summary: The passage describes Polyphemus altered by love, warned by Telemus that
    Ulysses will take his single eye, and then singing a pastoral courtship address
    to Galatea from a seaside hill while the narrator hides with Acis. Polyphemus
    praises and reproaches Galatea through natural comparisons and offers her his
    cave, fruits, cattle, milk, and animals as gifts.
  language: English
  quote_policy: summarized
