canonical_text:
  quote: ''
  summary: Baucis and Philemon entertain divine guests with humble hospitality. A
    self-refilling goblet reveals the guests as divinities; the gods spare the couple
    and punish the impious neighborhood by causing it to sink into a morass. The couple’s
    cottage becomes a temple, and their request to serve as priests and die together
    is granted through their simultaneous transformation into adjoining trees. The
    passage then turns to a speech about Proteus, who can take many forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A simple meal and second course are set out, including wine, nuts, dried figs,
    dates, plums, apples, grapes, and white honeycomb, accompanied by welcome looks
    and generous feelings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baucis and Philemon see the goblet replenish itself after being drunk and
    the wine increase by itself; they are frightened, raise their hands, pray, and
    seek pardon for the entertainment they have provided.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The couple’s single goose, described as guardian of the cottage, is prepared
    for killing for the divine guests, but it escapes toward the gods and the immortals
    forbid its death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The immortals declare that they are divinities, announce punishment for the
    impious neighborhood, and instruct the couple to leave their home and go to the
    mountain summit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The couple obeys, climbs with staffs toward the high hill, turns back, and
    sees the surrounding parts sinking into a morass while their own abode remains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The old cottage is changed into a temple, with columns, marble, carved doors,
    and a gold roof replacing its former humble materials.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The son of Saturn asks what the couple desires, and Philemon gives their
    joint request: to be priests and caretakers of the temple, and to be taken off
    together in the same hour.'
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: 'The couple’s wish is fulfilled: they serve as keepers of the temple, and
    in old age each sees the other shooting into leaf before branches cover their
    faces.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Inhabitants of Tyana show adjoining trees said to be made from the two bodies;
    the relator reports seeing garlands on the branches and placing fresh garlands
    there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Calydonian river tells Theseus that some changed forms remain fixed, while
    Proteus can pass into many shapes, including young man, lion, boar, serpent, bull,
    stone, tree, river, and fire.
  category: speech
  evidence_refs:
  - ev:10
