canonical_text:
  quote: ''
  summary: The explanatory passage summarizes traditions about Periclymenus, including
    his descent from Neleus and Neptune, his power of metamorphosis, and his death
    at the hands of Hercules. It then recounts a version of Achilles' death involving
    Polyxena, a proposed marriage, Paris hidden behind an altar in Apollo's temple,
    a heel wound, and later heroic honors for Achilles, while noting a different Homeric
    implication that Achilles died in battle.
  language: English
  quote_policy: summarized
