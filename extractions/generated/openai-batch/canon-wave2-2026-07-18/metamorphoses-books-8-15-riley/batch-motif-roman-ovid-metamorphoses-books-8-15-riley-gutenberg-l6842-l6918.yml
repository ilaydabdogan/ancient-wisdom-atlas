canonical_text:
  quote: ''
  summary: The passage describes Sleep's cave near the Cimmerians, Iris delivering
    Juno's order that Sleep send a shipwreck-vision to Halcyone, Sleep selecting Morpheus
    from among his sons, and Morpheus appearing in the form of Ceyx to announce shipwreck
    and request mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cave with a long recess in a hollowed mountain near the Cimmerians is named
    as the home and habitation of Sleep; sunlight never enters it, and fog, darkness,
    and twilight are present.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The place is silent: birds, dogs, geese, wild beasts, cattle, moving boughs,
    and human voices make no sound there.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A stream of the waters of Lethe runs from the bottom of the rock and murmurs
    among pebbles; poppies and many herbs bloom before the cavern and provide sleep
    gathered by night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dwelling has no door or porter; in the middle stands a raised dark couch
    of black ebony, feathers, and a dark coverlet, on which Sleep lies.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Unsubstantial dreams lie around Sleep in many shapes and in great number.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Iris enters the house, pushes visions aside with her hands, and her garment
    makes the sacred house shine; Sleep wakes with difficulty and asks why she has
    come.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Iris asks Sleep to command a vision resembling the real shape of the shipwrecked
    king to go to Halcyone in Herculean Trachyn; she states that Juno commands it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iris departs because she can no longer endure the vapour and feels sleep creeping
    over her limbs; she leaves along the bow by which she came.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sleep raises Morpheus from among his thousand sons; Morpheus is described
    as skilled at imitating human shape, gait, countenance, speech, dress, and customary
    words.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Other sons of Sleep have different forms: Icelos, called Phobetor by mortals,
    becomes wild beast, bird, or serpent, while Phantasos changes into earth, stone,
    water, tree, and lifeless things.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sleep selects Morpheus alone to execute Iris's command and then returns to
    his drowsy couch.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Morpheus flies silently through the dark to the Hæmonian city, removes his
    wings, assumes Ceyx's form, and stands before Halcyone's bed appearing wan, bloodless,
    unclothed, wet, and tearful.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The apparition speaks as Ceyx, says he has perished in an Aegean shipwreck
    caused by the South wind, tells Halcyone not to expect his return, and asks her
    to mourn him so he is not sent unlamented to Tartarus.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
