canonical_text:
  quote: ''
  summary: Editorial explanation connects Pythagorean doctrines of continual transformation
    and metempsychosis with Ovid's metamorphic material, then introduces fables in
    which Egeria becomes a fountain, Hippolytus is deified as Virbius, Tages arises
    from earth, Romulus' lance becomes a cornel-tree, and Cippus becomes horned and
    chooses exile. The narrative portion begins with Numa returning to Rome, ruling
    with divine and artistic guidance, teaching sacrifice and peace, dying, and being
    mourned by Egeria in the grove of Aricia.
  language: English
  quote_policy: summarized
