  quote: ''
  summary: The passage first gives an allegorical explanation of Pygmalion, then introduces
    the fable of Myrrha. Myrrha, daughter of Cinyras and Cenchris, develops an incestuous
    passion for her father, debates its wrongness, compares human law with animal
    and foreign examples, fears divine punishers, and is said in the fable summary
    to flee, bear Adonis, and be transformed into a tree.
  language: English
