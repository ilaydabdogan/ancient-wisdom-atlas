canonical_text:
  quote: ''
  summary: 'The passage explains Cyparissus as a youth associated with Apollo, transformed
    into a cypress, and links the cypress with sorrow, funerals, graves, and Sylvanus.
    It then introduces and narrates the Ganymede episode: Jupiter, desiring the youth,
    takes eagle form, carries him to heaven, and Ganymede serves nectar to Jove despite
    Juno''s displeasure. The bard frames the song as concerning Jove and youths beloved
    by gods.'
  language: English
  quote_policy: summarized
