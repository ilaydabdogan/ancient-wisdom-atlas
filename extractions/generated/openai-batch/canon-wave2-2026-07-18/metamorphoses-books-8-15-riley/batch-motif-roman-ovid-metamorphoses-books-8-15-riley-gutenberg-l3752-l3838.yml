canonical_text:
  quote: ''
  summary: A Cretan mother conceals that her newborn child is a girl, raises the child
    as a boy named Iphis, and later faces Iphis's arranged marriage to Ianthe. Iphis
    and Ianthe love one another, but Iphis laments that both are maidens and compares
    her case with the Cretan story of the daughter of the Sun and the bull. As the
    wedding approaches, Telethusa delays until she can delay no longer, then supplicates
    Isis at an altar, recalling a prior vision, Isis's symbols, and the goddess's
    counsel.
  language: English
  quote_policy: summarized
