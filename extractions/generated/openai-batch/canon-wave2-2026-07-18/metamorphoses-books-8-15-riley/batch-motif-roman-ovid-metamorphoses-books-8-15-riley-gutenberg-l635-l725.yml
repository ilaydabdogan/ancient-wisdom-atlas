canonical_text:
  quote: ''
  summary: 'The passage gives an explanatory account of Minos’s war against Athens
    and Megara, Scylla’s betrayal of Megara, and variants about Scylla and Nisus.
    It then summarizes and narrates the Minotaur episode: Minos imposes tribute on
    Athens, Daedalus builds the labyrinth to contain the two-formed monster, Theseus
    kills the monster with Ariadne’s aid and a thread, abandons Ariadne at Dia/Naxos,
    and Liber/Bacchus aids her by placing her crown among the constellations.'
  language: English
  quote_policy: summarized
