comparison_claims:
- id: claim:1
  claim: 'The explanatory note treats the fatal lock of hair as serving the same narrative
    function as Scylla’s stolen keys: both explain how Megara is opened to Minos through
    Scylla’s betrayal.'
  claim_level: same_function
  target: fatal-lock version and stolen-key betrayal account of Megara
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The editor explicitly says the reason for depicting the episode as
    a lock of hair is difficult to guess; the comparison is functional, not proof
    of origin.
- id: claim:2
  claim: 'The footnote presents multiple Ariadne-crown traditions as variants around
    the same object: Bacchus’s marriage gift, Vulcan’s jewel-made aid to Theseus,
    and the crown placed among the constellations.'
  claim_level: same_motif
  target: variant Ariadne crown traditions reported in the note
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The variants are reported by the translator/editor, not narrated fully
    in the main passage.
- id: claim:3
  claim: The note’s report that some authors and Ovid’s Fasti make Ariadne herself
    a constellation is functionally similar to the main passage’s crown-catasterism
    because both immortalize Ariadne in the heavens.
  claim_level: same_function
  target: Ariadne herself as constellation in other authors and Ovid’s Fasti
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The subject of transformation differs: in the main passage the crown
    becomes a constellation, while in the reported variant Ariadne herself does.'
