canonical_text:
  quote: ''
  summary: The passage narrates the death of Eurydice from a serpent bite, Orpheus’s
    descent to the underworld to petition for her return, the infernal powers’ conditional
    grant, and Eurydice’s second loss when Orpheus looks back before reaching the
    upper world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hymenaeus comes to the Ciconian regions in response to Orpheus but brings
    no auspicious words, joyful looks, or happy omen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The torch held by Hymenaeus smokes, brings tears to the eyes, and has no flame.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eurydice, described as the newmade bride, is walking on the grass with Naiads
    when a serpent stings her ankle and kills her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After mourning Eurydice in the upper air, Orpheus descends by the Taenarian
    gate to Styx and approaches Persephone and the ruler of the shades.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Orpheus states that he has not descended to see Tartarus or to bind the three-throated
    monster, but because a serpent’s poison killed his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Orpheus asks the underworld deities to weave again the life-thread of Eurydice
    and declares that, if the Fates deny this, he will not return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: As Orpheus sings and plays, the bloodless spirits weep, several punishments
    pause, and the Eumenides are said to shed tears.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The royal consort and the ruler of the infernal regions grant Orpheus’s request
    and call for Eurydice, who comes slowly because of her wound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Orpheus receives Eurydice under the condition that he must not turn his eyes
    back until he has passed the Avernian valleys, or the grant will be revoked.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the dark and silent ascending path, near the upper earth, Orpheus turns
    his eyes back toward Eurydice.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: After Orpheus looks back, Eurydice sinks away, reaches out to grasp him, catches
    only air, speaks a final farewell, and is carried back to the same place.
  category: sequence
  evidence_refs:
  - ev:8
