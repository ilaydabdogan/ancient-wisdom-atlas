canonical_text:
  quote: ''
  summary: Daedalus equips himself and Icarus with wings, warns Icarus to fly a middle
    course between sea and sun, and leads him through the air. Icarus flies too high,
    the sun melts the wax of his wings, and he falls into the sea calling for his
    father. Daedalus buries him, and the place is named from Icarus. A transformed
    partridge witnesses the burial; the passage explains that the bird was once Daedalus's
    gifted young nephew, whom Daedalus threw from Minerva's citadel out of envy before
    Pallas transformed him into a low-flying bird.
  language: English
  quote_policy: summarized
