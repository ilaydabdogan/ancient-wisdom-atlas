    that water below could clog the wings and the sun's fire above could scorch them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father fits the untried wings to Icarus, weeps, trembles, kisses him,
    flies ahead, encourages him, and looks back at his son's wings.
  category: sequence
  evidence_refs:
