canonical_text:
  quote: ''
  summary: During the annual rites of Ceres, Cenchreis is absent from Cinyras. Myrrha’s
    nurse deceives Cinyras and leads Myrrha to him at night despite omens. Myrrha
    becomes pregnant by her father; Cinyras later discovers her identity and draws
    his sword. Myrrha flees, wanders while pregnant, prays to be removed from both
    life and death, and is transformed into a myrrh tree. Her child is born through
    the cleft bark with Lucina’s help, and Naiads anoint him with his mother’s tears.
    The child’s beauty is compared to painted Cupids.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pious matrons celebrate the annual festival of Ceres in snow-white robes,
    offer garlands of ears of corn as first fruits, and observe nine nights in which
    marital contact is forbidden; Cenchreis is absent with them at the rites.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nurse finds Cinyras overcome with wine, tells him of a real passion under
    a false name, praises the maiden’s beauty, and says the maiden is the same age
    as Myrrha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nurse tells Myrrha that they have prevailed; Myrrha is described as sad
    and yet also rejoicing, with discord in her mind.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Myrrha approaches at a silent nighttime hour while the moon and stars are
    concealed; she stumbles three times and hears the funereal owl cry three times,
    but continues onward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nurse holds Myrrha’s hand, guides her through a secret road to the chamber
    and bed, and presents her to Cinyras with the words that she is his own.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cinyras unknowingly receives his daughter in the bed; Myrrha becomes pregnant,
    the act is repeated, and Cinyras later brings lights and discovers both the crime
    and his daughter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cinyras draws a sword; Myrrha escapes in the dark, leaves Arabian and Panchaean
    lands, wanders for nine horns of the returning moon, and reaches the Sabaean country
    while pregnant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Myrrha prays to the deities, admits she deserves punishment, and asks to be
    expelled from both the realms of the living and the dead by being transformed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: As Myrrha speaks, the earth closes over her legs, roots grow, her bones become
    wood, her blood becomes sap, her arms and fingers become branches, and bark encloses
    her body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After losing human shape, Myrrha still weeps; warm drops distil from the tree,
