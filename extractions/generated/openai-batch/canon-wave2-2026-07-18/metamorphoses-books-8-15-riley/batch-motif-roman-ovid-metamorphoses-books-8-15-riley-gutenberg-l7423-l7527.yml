canonical_text:
  quote: "“The God of the Ocean changed his body into a white bird”"
  summary: Achilles fights Cygnus, whose body is not wounded by spear or sword. Cygnus
    attributes his safety to birth from the ruler of the ocean rather than to armor.
    Achilles kills Menœtes to prove his weapon still works, then defeats Cygnus by
    throwing him down and cutting off his breath with helmet straps. When Achilles
    tries to strip the body, only armor remains, because the God of the Ocean has
    changed Cygnus into a white bird.
