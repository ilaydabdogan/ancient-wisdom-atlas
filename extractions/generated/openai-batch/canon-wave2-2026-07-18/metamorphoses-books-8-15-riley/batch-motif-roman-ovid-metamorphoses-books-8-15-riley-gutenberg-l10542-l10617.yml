canonical_text:
  quote: ''
  summary: Æneas reaches Cumæ and asks the long-lived Sibyl to guide him through Avernus
    so he may visit his father's shade. The Sibyl, inspired by a god, directs him
    to pluck a golden branch, guides him to Elysium and the underworld realm, and
    he returns. On the way back, Æneas offers her divine honors; she refuses them
    and recounts how Phœbus offered her endless life and youth if she yielded to him.
    She chose as many birthdays as there were particles of dust but forgot to ask
    for youth, and now faces extreme old age until only her voice remains recognizable.
  language: English
  quote_policy: summarized
