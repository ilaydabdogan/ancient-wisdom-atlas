canonical_text:
  quote: ''
  summary: Cippus discovers horns on his forehead after seeing them reflected in a
    stream. He prays that any good omen benefit Rome and any bad omen fall on himself,
    performs ritual atonement and entrail consultation, and receives an Etrurian soothsayer’s
    prediction that he will become king if he enters the city. Cippus rejects kingship,
    veils the horns, addresses the people and Senate, reveals himself as the predicted
    man, and asks the Romans to keep him out. The crowd grieves and honors him; the
    nobles forbid his entry but grant him land and memorialize the horns on doorposts.
  language: English
  quote_policy: summarized
