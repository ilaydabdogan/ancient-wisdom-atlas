canonical_text:
  quote: ''
  summary: The passage explains traditions around Laomedon, Troy’s walls, Neptune’s
    anger, Hesione’s exposure to a sea-monster, and Hercules’ rescue and later vengeance.
    It then summarizes and begins the story of Proteus’ prophecy about Thetis’ son,
    Jupiter’s withdrawal, Peleus’ pursuit of Thetis, her shapeshifting resistance,
    later expiation for Phocus’ death, and Psamathe’s wolf being turned to stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Laomedon is described as king of Troy who enclosed an open, defenseless city
    with walls; the work was attributed to Apollo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Laomedon raised strong banks against the sea and inundations; these banks
    were regarded as Neptune’s work, and their later destruction was reported as Neptune’s
    revenge for an unpaid reward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The explanation reports that Laomedon used treasure from Neptune’s temple
    for the embankments and city walls, promised restoration, and did not perform
    the promise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the embankments were under water and plague raged in the city, an oracle
    required the sacrifice of a royal virgin to appease the sea god.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lot fell on Hesione, and she was exposed to the fury of a sea-monster.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hercules offered to deliver Hesione for six horses, succeeded, was refused
    the recompense by Laomedon, slew Laomedon, and plundered the city.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hercules gave the kingdom to Podarces, son of Laomedon, and gave Hesione to
    Telamon, his assisting companion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The explanation proposes that the sea-monster represented sea inundations
    and that the promised six horses may have represented ships.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: A version attributed to Lycophron says the monster devoured Hercules, who
    spent three days in its belly and came out without hair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A version attributed to Palæphatus says Hesione was to be delivered to a pirate
    and that Hercules was wounded while boarding the pirate’s ship but was later victorious.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Proteus foretells that Thetis will have a son more powerful and more valiant
    than his father.
  category: speech
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:12
  text: Jupiter, being in love with Thetis, is alarmed by the prophecy and yields
    her to Peleus.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:13
  text: Thetis avoids Peleus by assuming various shapes, but Peleus holds her fast
    by Proteus’ advice; she marries Peleus and bears Achilles.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:14
  text: Ceyx tells Peleus that Dædalion, overcome by grief for Chione, was transformed
    into a hawk after Chione was slain for vying with Diana.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Psamathe sends a wolf to avenge Phocus’ death by destroying Peleus’ herds;
    after Thetis intercedes, Psamathe is appeased and turns the wolf into stone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Thetis often comes naked to a cave in a Hæmonian bay, seated on a harnessed
    dolphin.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: Peleus seizes Thetis while she sleeps in the cave, clasps her neck, and she
    changes into a bird, a tree, and a spotted tiger; he releases her when frightened
    by the tiger form.
  category: sequence
  evidence_refs:
  - ev:9
