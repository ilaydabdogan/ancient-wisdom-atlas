candidate_motifs:
- id: motif:1
  label: broken bargain with a deity brings destructive judgment
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: Laomedon fails to restore Neptune’s treasure or pay agreed rewards, and the
    sea-god’s revenge is associated with broken embankments, flooding, plague, and
    the demand for appeasement.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is an explanatory prose note and frames some details as reported
    or rationalized tradition.
- id: motif:2
  label: royal virgin exposed to appease sea deity or monster
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: An oracle says a royal virgin must be sacrificed to appease the sea god;
    Hesione is selected and exposed to a sea-monster.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage later offers an allegorical explanation that the monster may
    represent inundation.
- id: motif:3
  label: hero rescues exposed maiden and is denied promised reward
  taxonomy_refs:
  - sacred_exchange
  basis: Hercules rescues Hesione for six horses, is refused the promised recompense
    by Laomedon, and responds by killing him and plundering the city.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The reward is later interpreted as possibly ships rather than literal
    horses.
- id: motif:4
  label: hero swallowed by monster and returns after three days
  taxonomy_refs:
  - hero_descent
  - death_rebirth
  basis: The Lycophron version says the monster devoured Hercules, who spent three
    days in its belly and came out hairless.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is presented as a variant version and immediately rationalized as
    work in water; the taxonomy mapping is approximate.
- id: motif:5
  label: prophecy that a divine woman’s son will surpass his father redirects divine
    desire
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Proteus foretells that Thetis’ son will be greater than his father; Jupiter
    avoids Thetis and gives the suit to Peleus.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage emphasizes succession anxiety and marriage arrangement more
    than the later birth narrative.
- id: motif:6
  label: shapeshifting bride captured by persistent suitor
  taxonomy_refs:
  - shapeshifter
  - sacred_marriage
  - divine_beloved
  basis: Thetis resists Peleus by changing forms into a bird, tree, and tiger; he
    holds her through some changes and later marries her.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage describes forceful seizure; any sacred-marriage reading should
    be reviewed carefully.
- id: motif:7
  label: grief transformation into a bird
  taxonomy_refs:
  - shapeshifter
  basis: Ceyx reports that Dædalion, overcome by grief for Chione, was transformed
    into a hawk.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The transformation is only summarized in this passage and is not voluntary
    shapeshifting.
- id: motif:8
  label: avenging animal sent by goddess and petrified after intercession
  taxonomy_refs:
  - divine_judgment
  basis: Psamathe sends a wolf to avenge Phocus by destroying Peleus’ herds; Thetis
    intercedes, Psamathe is appeased, and the wolf is turned to stone.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The scene is summarized rather than narrated in detail in this excerpt.
comparison_claims:
