canonical_text:
  quote: ''
  summary: The passage includes an explanatory rationalization of the Cinyras, Myrrha,
    and Adonis story; a prose summary of the Adonis, Venus, Atalanta, and Hippomenes
    episode; and the opening of the translated narrative in which Cupid wounds Venus
    with an arrow, Venus follows and advises Adonis, and she prepares to recount the
    cause of her hatred of certain beasts while resting with him beneath a poplar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the explanatory account, Cinyras becomes drunk, sleeps in an indecent posture,
    is seen by Myrrha and Adonis, and later curses Myrrha and Adonis after Ammon reports
    the matter to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanation says Myrrha, after being cursed by her father, retires to
    Arabia; it also explains her tree transformation as an invention based on the
    name Mor, associated with myrrh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The explanation proposes that the story may have been founded on a Phoenician
    tradition concerning Noah and Ham's malediction.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fable summary states that Adonis is educated by the Naiads, and that his
    beauty strongly affects Venus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Venus traverses wild places in pursuit of Adonis and warns him against hunting
    lions, wild boars, and other formidable animals.
  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:6
  text: Atalanta consults an oracle about marriage and receives an answer that a husband
    will destroy her; she then establishes a running contest in which defeated suitors
    die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hippomenes asks Venus for aid, uses golden apples given by Venus to attract
    Atalanta's attention during the race, reaches the goal first, and wins her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Hippomenes' later ingratitude, Venus causes his desires to rise; he
    and Atalanta defile Cybele's shrine and are transformed into lions that draw the
    goddess's chariot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cupid accidentally grazes Venus's breast with a protruding arrow while kissing
    her, and Venus becomes charmed by Adonis's beauty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Venus abandons her usual places and even the skies, follows Adonis through
    mountains, woods, and rocky wilds, hunts harmless animals, and avoids dangerous
    predators.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Venus tells Adonis to be brave against fleeing animals but not rash against
    armed and bold beasts such as boars and lions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Venus rests with Adonis on grass beneath the shade of a poplar and mingles
