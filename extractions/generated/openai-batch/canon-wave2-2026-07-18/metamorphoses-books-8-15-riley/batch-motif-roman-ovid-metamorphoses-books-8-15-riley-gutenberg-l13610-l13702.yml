  quote: ''
  summary: Venus tries to protect the descendant of Aeneas, but Jove explains that
    Fate cannot be altered and recounts the destiny of Julius Caesar and Augustus.
    Venus takes Caesar's soul from his murdered body and carries it to the stars,
    where it becomes a flaming star. The passage praises Augustus as heir, avenger,
    ruler, and future divine figure, invokes Roman deities, and ends with the poet's
    claim that his work and name will survive beyond bodily death.
