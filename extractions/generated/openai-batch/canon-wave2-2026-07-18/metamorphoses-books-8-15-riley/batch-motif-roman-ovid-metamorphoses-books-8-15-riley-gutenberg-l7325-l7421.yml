canonical_text:
  quote: ''
  summary: The passage opens Book XII by recounting the Greek expedition against Troy,
    the detention of the fleet at Aulis, a serpent omen interpreted by Calchas, the
    demanded sacrifice of Iphigenia and her substitution by a hind, the release of
    the winds, the house of Fame at the center of the universe, and the beginning
    of combat at Troy, including the deaths and encounters involving Protesilaüs,
    Hector, Cygnus, and Achilles.
