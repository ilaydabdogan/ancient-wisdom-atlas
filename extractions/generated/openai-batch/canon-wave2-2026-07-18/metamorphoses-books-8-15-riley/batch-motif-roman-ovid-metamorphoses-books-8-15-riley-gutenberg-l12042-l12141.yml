canonical_text:
  quote: ''
  summary: 'The passage frames Numa’s inquiry into origins and recounts a tradition
    explaining the foundation of Crotona: Hercules once visited Croton, foretold a
    city, later appeared in dreams to Myscelos ordering him to leave Argos for the
    Aesar, aided him in a trial through a miraculous change of voting pebbles, and
    Myscelos then sailed to Italy and founded the city near Croton’s tomb.'
  language: English
  quote_policy: summarized
