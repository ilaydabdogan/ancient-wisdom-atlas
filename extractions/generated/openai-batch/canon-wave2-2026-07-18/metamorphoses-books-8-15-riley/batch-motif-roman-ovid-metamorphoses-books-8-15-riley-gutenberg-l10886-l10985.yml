  summary: The passage first explains Æolus as a Lipari island ruler and wind observer
    later poetically imagined as master of the winds. It then narrates Achæmenides'
    account of Circe receiving Ulysses' companions, drugging their drink, transforming
    them into swine with a wand, and confining them; Eurylochus avoids the drink and
    informs Ulysses, who enters with divine protection from the moly flower and compels
    Circe to promise restoration.
