canonical_text:
  quote: ''
  summary: Tlepolemus objects that the Pylian speaker has passed over Hercules' exploits.
    The Pylian explains that Hercules destroyed his family and recounts the death
    of Periclymenus, who had Neptune-given shapeshifting power and was killed in bird
    form. The passage then shifts to Neptune's anger against Achilles; Neptune asks
    Apollo to bring about Achilles' death, and Apollo directs Paris' fatal arrow.
  language: English
  quote_policy: summarized
