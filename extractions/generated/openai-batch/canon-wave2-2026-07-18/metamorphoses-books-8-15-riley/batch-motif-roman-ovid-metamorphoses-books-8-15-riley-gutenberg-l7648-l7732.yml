canonical_text:
  quote: ''
  summary: During a pause in the Trojan fighting, Achilles sacrifices a heifer to
    Pallas and the Greek chiefs feast while recounting martial deeds, especially Cygnus's
    invulnerability. Nestor recalls Caeneus, born as Caenis, who was transformed after
    Neptune's assault and made invulnerable. Nestor then begins the account of Pirithous
    and Hippodame's wedding, where the Centaur Eurytus and others attempt to seize
    the bride and women until Theseus intervenes.
  language: English
  quote_policy: summarized
