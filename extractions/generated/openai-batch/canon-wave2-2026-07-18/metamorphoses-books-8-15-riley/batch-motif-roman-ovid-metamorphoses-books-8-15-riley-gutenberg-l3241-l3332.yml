candidate_motifs:
- id: motif:1
  label: possible punishment for profaning a sacred tree
  taxonomy_refs:
  - divine_judgment
  basis: The explanation tentatively proposes that Dryope may have been punished for
    attempting to profane a tree consecrated to the gods.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The passage marks this as speculative with 'perhaps' and says the origin
    of the story is difficult to guess.
- id: motif:2
  label: renewal of youth in old age
  taxonomy_refs: []
  basis: Iolaüs becomes young again; the explanation also compares him to Æson, who
    renewed his youth.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  confidence: high
  cautions: The explanatory note rationalizes the motif as a way of accounting for
    great age or unusual vigor.
- id: motif:3
  label: supernatural acceleration from childhood to adulthood for vengeance
  taxonomy_refs:
  - miraculous_child
  basis: The sons of Calirrhoë are said to become young men, with Hebe adding years
    so that they could avenge their father's death while otherwise mere children.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The available taxonomy label is approximate because the passage concerns
    accelerated maturity rather than a miraculous birth.
- id: motif:4
  label: fatal necklace exchange and betrayal
  taxonomy_refs: []
  basis: A valuable necklace motivates Eriphyle to reveal Amphiaraüs' hiding place
    and later becomes involved in Alcmæon's marital conflict and assassination.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not identify the necklace as sacred or magical, only
    valuable.
- id: motif:5
  label: prophetic foreknowledge and unavoidable death
  taxonomy_refs: []
  basis: Amphiaraüs foresees that the Theban wars will be fatal, hides to avoid them,
    but is found, joins the Argives, and dies.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a rationalized explanation alongside a poetic version
    of the death.
- id: motif:6
  label: earth opening and swallowing a warrior with chariot
  taxonomy_refs: []
  basis: The explanation reports that Statius and other writers poetically say the
    earth opened and swallowed Amphiaraüs and his chariot.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The same explanatory passage also gives a non-miraculous account in which
    horses fall down a precipice.
- id: motif:7
  label: incestuous sibling desire and flight
  taxonomy_refs:
  - sibling_pair
  basis: Byblis falls in love with her brother Caunus; Caunus leaves his native country
    to avoid encouraging her passion, and Byblis follows him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage is only a brief fable summary and does not include the fuller
    narrative psychology.
- id: motif:8
  label: human transformed into a fountain
  taxonomy_refs:
  - shapeshifter
  basis: Byblis is changed into a fountain while following Caunus through Caria.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The transformation is passive in the summary; 'shapeshifter' is an approximate
    taxonomy label for metamorphosis.
- id: motif:9
  label: Fate superior to divine will
  taxonomy_refs: []
  basis: Jupiter says no one can overcome the Fates and that even he is governed by
    them; he cannot prevent old age or grant lasting youth where Fate does not allow
    it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage states the motif within Jupiter's speech rather than through
    an enacted episode in this excerpt.
