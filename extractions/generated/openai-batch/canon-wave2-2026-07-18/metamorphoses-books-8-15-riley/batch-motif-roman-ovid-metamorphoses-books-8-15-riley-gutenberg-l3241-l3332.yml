  quote: ''
  summary: The passage gives explanatory notes on Dryope, Iolaus, Amphiaraus, Alcmæon,
    and the sons of Calirrhoë, then introduces the fable of Byblis and Caunus and
    Jupiter's speech that even gods are governed by the Fates. It includes tree profanation
    speculation, youth renewal and age acceleration, betrayal through a necklace,
    blood revenge, metamorphosis into a fountain, and the limits of divine power over
    aging and fate.
