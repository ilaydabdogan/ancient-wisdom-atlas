canonical_text:
  quote: ''
  summary: Orpheus sings with his lyre on Mount Rhodope and enchants woods, rocks,
    birds, serpents, and wild beasts. Ciconian matrons or Maenads in Bacchic frenzy
    attack him; his music first weakens their weapons, but Bacchic noise drowns it
    out and they kill him. Nature and nymphs mourn. The Hebrus carries his head and
    lyre to Lesbos, where a serpent attacks the head; Phoebus drives the serpent away
    and turns its jaws to stone. Orpheus's ghost descends under the earth, finds Eurydice
    in the blessed fields, and walks with her safely.
  language: English
  quote_policy: summarized
