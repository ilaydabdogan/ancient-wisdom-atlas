canonical_text:
  quote: ''
  summary: The passage explains Vertumnus and Pomona as Etruscan-derived Roman deities
    of gardens and fruits, proposes that Vertumnus's changing forms may symbolize
    seasonal change, and introduces related Roman cult details. It then summarizes
    fables in which Vertumnus tells Pomona of Iphis and Anaxarete, followed by Roman
    foundation and deification material. The narrated section describes Iphis's rejected
    courtship of Anaxarete, his suicide at her door, his funeral procession, and Anaxarete's
    petrification under an avenging divine force.
  language: English
  quote_policy: summarized
