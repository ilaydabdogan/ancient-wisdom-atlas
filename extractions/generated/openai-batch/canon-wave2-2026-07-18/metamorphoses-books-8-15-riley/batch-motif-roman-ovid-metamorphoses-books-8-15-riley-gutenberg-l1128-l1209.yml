canonical_text:
  quote: ''
  summary: Althæa learns that her brothers have been killed by her son Meleager. Remembering
    that the Fates had bound Meleager’s life to a piece of wood saved from the fire
    at his birth, she struggles between maternal affection and sisterly vengeance,
    invokes the Eumenides and her brothers’ ghosts, then throws the fatal brand into
    the flames. As the wood burns, Meleager is burned from afar by secret fires and
    dies.
  language: English
  quote_policy: summarized
