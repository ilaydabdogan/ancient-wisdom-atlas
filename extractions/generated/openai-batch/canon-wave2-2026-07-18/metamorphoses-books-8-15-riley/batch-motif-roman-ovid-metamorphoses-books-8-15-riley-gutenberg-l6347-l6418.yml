canonical_text:
  quote: ''
  summary: Peleus performs rites to the sea gods; Proteus advises him to bind Thetis
    while she sleeps in her cave and to hold her through changing forms. Peleus overcomes
    Thetis and fathers Achilles. Later, guilty of killing Phocus and exiled, Peleus
    seeks asylum from Ceyx, who offers hospitality while grieving. Ceyx recounts Dædalion,
    Chione, her encounters with Phoebus and the son of Maia, and the birth of Autolycus
    and Philammon.
  language: English
  quote_policy: summarized
