    herself instead; when Glaucus refuses to abandon Scylla, Circe uses herbs, Hecatean
    incantations, and polluted bathing water to transform Scylla's lower body into
    barking monsters. Scylla later remains as a maritime danger and is transformed
    into a rock avoided by sailors.
