canonical_text:
  quote: ''
  summary: 'The passage narrates part of a violent battle: Rhœtus, Dryas, Phorbas,
    Pirithoüs, Theseus, Demoleon, and Peleus wound or kill opponents with fire, stakes,
    lances, clubs, trees, rocks, and animal-horn weapons. It includes an augural warning
    about Nessus and Hercules, Aphidas being killed while asleep from wine, Theseus
    escaping a hurled pine through Pallas'' warning, Crantor''s death, and Peleus''
    retaliatory attack framed as a sacrifice.'
  language: English
  quote_policy: summarized
