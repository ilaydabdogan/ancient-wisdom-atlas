canonical_text:
  quote: ''
  summary: 'The passage summarizes explanatory traditions about Hercules: his return
    with Geryon''s herds, conflicts with robbers and monsters, the relief of Atlas,
    the golden apples and dragon of the Hesperides, the raising of pillars at the
    ocean, a catalog of further exploits, and later scholarly theories interpreting
    Hercules as a historical hero, an accumulated heroic figure, or a solar/zodiacal
    personification.'
