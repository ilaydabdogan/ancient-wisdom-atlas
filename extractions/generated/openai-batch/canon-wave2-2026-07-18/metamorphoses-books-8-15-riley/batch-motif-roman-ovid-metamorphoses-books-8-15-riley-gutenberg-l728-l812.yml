candidate_motifs:
- id: motif:1
  label: Human tribute demanded to end communal calamity
  taxonomy_refs:
  - sacrifice
  basis: The Athenians are told by Delphi to satisfy Minos and obtain peace by sending
    groups of young men and virgins to him.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage calls the sending a condition of peace and tribute; it does
    not explicitly call it a sacrifice.
- id: motif:2
  label: Labyrinth ordeal with monster adversary
  taxonomy_refs:
  - labyrinth_initiation
  basis: The passage reports the story that Athenian youths were destined to fight
    the Minotaur in the Labyrinth, and later connects Theseus with the Labyrinth or
    a cavern variant.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The surrounding explanation treats parts of the myth as hostile invention
    or rationalized tradition.
- id: motif:3
  label: Helper gives secret means of escape from maze
  taxonomy_refs:
  - labyrinth_initiation
  basis: Ariadne gives Theseus the thread, interpreted as a plan showing the Labyrinth’s
    windings and exit.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage explicitly offers a rationalizing interpretation of the thread
    as a plan.
- id: motif:4
  label: Monstrous offspring from human and bull union
  taxonomy_refs: []
  basis: The Minotaur is described as the fruit of Pasiphae’s intercourse with a white
    bull sent by Neptune.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage says this was a story promulgated by Athenians and later acknowledged
    by some writers as invented from hostility to Minos.
- id: motif:5
  label: Divine revenge through illicit passion
  taxonomy_refs:
  - divine_judgment
  basis: Venus is said to inspire Pasiphae’s passion in revenge for being discovered
    with Mars by Apollo.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is embedded in a reported explanatory tradition, not narrated as
    the main event of the fable.
- id: motif:6
  label: Ingenious escape by flight from imprisonment
  taxonomy_refs:
  - ascent
  - departure
  basis: Daedalus, trapped because Minos controls land and sea, declares the sky open
    and constructs wings for escape.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The extracted passage includes the making of the wings and the fable summary,
    but not the full later escape narrative.
- id: motif:7
  label: Fatal over-ascent of the son
  taxonomy_refs:
  - ascent
  basis: The fable summary says Icarus disregards his father, flies too high, the
    Sun melts his wings, and he dies in the sea.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This action appears in the fable summary rather than in the subsequent
