  - ev:2
  confidence: medium
  cautions: The passage presents this as an explanatory foundation for the Minotaur
    story rather than as the main mythic narration.
comparison_claims:
- id: claim:1
  claim: 'The passage explicitly presents variant traditions for the Athenian tribute
    interval: annual in Apollodorus and Diodorus Siculus, but every nine years in
    Plutarch and Ovid.'
  claim_level: same_motif
  target: Athenian tribute to Minos in Apollodorus, Diodorus Siculus, Plutarch, and
    Ovid
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is reported by the translator’s explanatory note and
    is not verified against the cited works here.
- id: claim:2
  claim: The passage compares the mythic Minotaur-Labyrinth account with a rationalized
    Taurus and funeral-games account as explanations for the same Athenian tribute
    tradition.
  claim_level: same_motif
  target: Minotaur/Labyrinth story and rationalized Taurus/funeral-games tradition
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The rationalizing account is presented through later authorities named
    in the passage; historical validity is not established by the passage itself.
- id: claim:3
  claim: The passage treats Ariadne’s thread and a plan of the Labyrinth as functionally
    equivalent devices for knowing the maze’s windings and exit.
  claim_level: same_function
  target: Ariadne’s thread and plan of the Labyrinth
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an explanatory interpretation; the passage notes a thread tradition
    but prefers a rationalized plan.
- id: claim:4
  claim: 'The passage preserves a setting variant for Theseus’ combat: the Labyrinth
    in some accounts and a cavern where the son of Taurus was confined in Palaephatus’
    account.'
  claim_level: same_motif
  target: Theseus’ Labyrinth fight and cavern fight variant
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: Only a brief reported variant is included; the passage does not give
    the full Palaephatus narrative.
