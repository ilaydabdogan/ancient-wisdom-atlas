canonical_text:
  quote: ''
  summary: The passage gives an explanatory account of the Athenian tribute to Minos,
    the Labyrinth and Minotaur traditions, rationalized variants involving Taurus
    and funeral games, Theseus’ aid from Ariadne, and the beginning of the Daedalus
    and Icarus episode, including Daedalus’ construction of wings for escape from
    Crete.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Athenians, suffering famine and threatened by enemies, consult the oracle
    at Delphi and are told they must satisfy Minos to be delivered from their calamities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Minos grants peace on condition that Athens periodically send seven young
    men and seven virgins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Athenians are said to have spread a story that the youths sent to Crete
    were destined to fight the Minotaur in the Labyrinth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Minotaur is described in the reported story as the offspring of Pasiphae
    and a white bull sent from the sea by Neptune.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage reports a story in which Daedalus aided Pasiphae’s passion, and
    Venus inspired that passion as revenge connected with Apollo and Mars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: A rationalizing account says Pasiphae loved a Cretan noble named Taurus, Daedalus
    was their confidant, and Pasiphae later bore twins, one resembling Minos and one
    resembling Taurus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another account says Minos instituted funeral games for Androgeus, defeated
    contestants became slaves, Taurus first won all the prizes, and the Athenian captives
    were treated harshly or spent their lives in servitude.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Daedalus is said to have built a Labyrinth in Crete, probably for the games;
    another cited account places Theseus’ fight in a cavern where the son of Taurus
    had been confined.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Theseus goes to Crete either voluntarily or by lot, and Ariadne helps him
    by giving him a thread, interpreted here as a plan of the Labyrinth and its exit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage rationalizes Ariadne’s connection with Bacchus by saying she became
    the wife of a priest of Bacchus after being deserted by Theseus at Naxos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The fable summary says Daedalus makes wings to escape from Crete, while Icarus
    disregards his father’s advice, flies too high, has his wings melted by the Sun,
    and dies in the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The fable summary says Daedalus, jealous of Perdix, throws him from a tower,
    but Minerva supports him during the fall and transforms him into a partridge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: In the narrative, Daedalus is enclosed by the sea and reasons that Minos may
    control land and sea, but not the air.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Daedalus constructs artificial wings by arranging feathers, binding them with
    thread and wax, and bending them to imitate birds’ wings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Icarus stands with Daedalus, plays with the feathers and wax, is unaware that
    he is handling danger, and delays his father’s work.
  category: action
  evidence_refs:
  - ev:5
