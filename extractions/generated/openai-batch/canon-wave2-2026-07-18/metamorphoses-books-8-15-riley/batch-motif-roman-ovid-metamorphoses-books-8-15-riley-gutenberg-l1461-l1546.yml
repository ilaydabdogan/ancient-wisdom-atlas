canonical_text:
  quote: ''
  summary: 'The passage contains explanatory notes on the Calydonian boar and Meleager
    tradition, including omitted sacrifice to Diana, a ravaging boar, Meleager’s hunt,
    Althaea’s grief, variant accounts of Meleager’s death, and the poetic explanation
    of his sisters becoming birds. It then introduces and narrates part of Fable V:
    Theseus, returning from the boar hunt, is delayed by the flooded river Acheloüs,
    accepts the river god’s hospitality in a grotto, and hears Acheloüs explain that
    five visible islands were once Naiads who disregarded him during sacrifice and
    were swept into the sea as the land was divided into the Echinades. The fable
    summary also mentions Perimele, thrown into the sea by her father and transformed
    by Neptune into an island.'
  language: English
  quote_policy: summarized
