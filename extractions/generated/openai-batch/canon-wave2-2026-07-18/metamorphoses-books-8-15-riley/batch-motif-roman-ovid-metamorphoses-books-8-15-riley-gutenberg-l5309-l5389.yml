canonical_text:
  quote: ''
  summary: The passage recounts Atalanta’s speed and beauty, an oracle warning her
    to avoid marriage, her retreat to the woods, and her condition that suitors must
    defeat her in a race or die. Hippomenes first condemns the dangerous courtship
    contest, then falls into desire after seeing her and challenges her, invoking
    his descent from Neptune. Atalanta feels compassion and conflicted desire for
    him, warns him away, and is described as being struck by Cupid and in love without
    recognizing it.
  language: English
