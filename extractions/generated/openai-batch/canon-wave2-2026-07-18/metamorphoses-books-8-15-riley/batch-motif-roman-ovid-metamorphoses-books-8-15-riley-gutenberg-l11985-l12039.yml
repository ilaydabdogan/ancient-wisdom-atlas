  quote: ''
  summary: 'The explanatory passage discusses several narrative traditions: Iphis''s
    love for Anaxarete and her stone transformation; divine intervention when the
    Sabines enter Rome; Tarpeia''s bargain with Tatius and death; variant accounts
    of Romulus''s disappearance, assassination, dismemberment, and deification; and
    divine honours for Hersilia.'
