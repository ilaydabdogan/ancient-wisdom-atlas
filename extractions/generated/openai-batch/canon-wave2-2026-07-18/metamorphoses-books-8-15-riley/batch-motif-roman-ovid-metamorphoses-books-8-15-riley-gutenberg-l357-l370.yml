canonical_text:
  quote: ''
  summary: 'The passage summarizes Book XIII: Ajax and Ulysses contest Achilles''
    arms; Ajax kills himself and a hyacinth arises from his blood; Hecuba is taken
    to Thrace, blinds Polymnestor, and is changed into a bitch; divine figures mourn
    Hecuba and Memnon; birds arise from Memnon''s ashes; Æneas flees Troy and travels
    through places marked by transformations; Galatea tells Scylla of Polyphemus courting
    her and killing Acis; Glaucus appears as a transformed sea deity.'
