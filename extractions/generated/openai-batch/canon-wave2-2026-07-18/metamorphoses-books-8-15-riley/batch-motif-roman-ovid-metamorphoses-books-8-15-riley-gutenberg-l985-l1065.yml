canonical_text:
  quote: ''
  summary: A large company of heroes gathers for the Calydonian boar hunt. Atalanta
    appears armed with bow and arrows, and Meleager is immediately attracted to her.
    The hunters enter a dense wood, set nets, release dogs, and follow the boar’s
    tracks. The boar bursts from a marshy hollow, scatters dogs, withstands several
    spear attacks, and wounds or endangers multiple hunters. A prayer to Phoebus is
    partly granted, but Diana removes the spear point. Nestor escapes into a tree;
    the boar gores Othriades. The mounted sons of Tyndarus fail to strike before the
    boar enters the wood. Telamon falls, Peleus helps him, and Atalanta’s arrow grazes
    the boar under the ear, drawing blood and delighting Meleager.
  language: English
  quote_policy: summarized
