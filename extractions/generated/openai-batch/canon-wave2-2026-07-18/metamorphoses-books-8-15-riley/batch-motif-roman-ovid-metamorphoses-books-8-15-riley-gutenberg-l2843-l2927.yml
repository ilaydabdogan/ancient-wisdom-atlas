canonical_text:
  quote: ''
  summary: 'The passage rationalizes several labours and adventures of Hercules as
    historical or natural events behind poetic fables: clearing thieves, serpents,
    boars, stables, rivers, prisoners, Amazons, monsters, foreign kings, and giants;
    it links these to stories of the Hydra, Cerberus, Hades, Alcestis, Geryon, and
    Antaeus.'
  language: English
  quote_policy: summarized
