canonical_text:
  quote: ''
  summary: 'The passage first explains variant traditions about Byblis and Caunus,
    including her pursuit of her brother, her grief, and alternate deaths or transformations
    into a Hamadryad, a fountain, or by hanging from a walnut tree. It then introduces
    the story of Ligdus, Telethusa, Iphis, and Isis: Ligdus orders a female infant
    to be killed, Isis appears to Telethusa in a dream and forbids obedience, and
    the fable heading states that Iphis is raised as a son and later transformed into
    a man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Byblis is described as traveling through several countries in search of her
    brother, who flees from her passion, and both Ovid and Antoninus Liberalis trace
    her to Caria.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Antoninus Liberalis is reported to say that Byblis was transformed into a
    Hamadryad near a mountain summit, while Ovid is reported to say she was changed
    into a fountain that later bore her name.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rationalized account says Caunus left his father's court to avoid Byblis,
    that Byblis died of grief, and that storytellers magnified her weeping by a fountain
    into a transformation into that fountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A variant attributed through Photius to Conon says Caunus fell in love with
    Byblis and that Byblis hanged herself on a walnut tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The explanation proposes that the Byblis and Caunus story may have arisen
    as a covert reproach against Persian ordinances sanctioning sibling marriage.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ligdus tells pregnant Telethusa that he wants a male child and orders that
    a female child be put to death; both spouses weep, and Telethusa asks him not
    to limit his hopes to a son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: At night, Telethusa sees or seems to see Isis, named as the daughter of Inachus,
    standing before her bed with a train of votaries and divine attendants.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Isis tells Telethusa to lay aside care, evade her husband's commands, and
    bring up the child whatever it shall be.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: The fable heading states that Telethusa bears a daughter called Iphis, that
    Iphis passes as a son, marries Ianthe, and is transformed by Isis into a man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Byblis material is associated with Caria and with Miletus's movement from
    Crete to Caria; the Iphis story is set in Phæstian land near the Gnossian kingdom
    in Crete.
  category: setting
  evidence_refs:
  - ev:2
  - ev:6
