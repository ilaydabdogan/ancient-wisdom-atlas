canonical_text:
  quote: ''
  summary: An old woman advises an unnamed addressee to reject ordinary suitors and
    choose Vertumnus, praising his constancy, youth, grace, shared tastes, devotion,
    and ability to change into any form. She urges pity for his passion and warns
    of avenging deities, the Idalian Goddess, and the goddess of Rhamnus. She then
    says she will recount well-known Cypriot facts to persuade the addressee. Translator
    footnotes in the range explain several separate references, including lightning
    punishment for imitating Jupiter, female headgear, tree-vine marriage language,
    and the Rhamnus cross-reference.
  language: English
  quote_policy: summarized
