canonical_text:
  quote: ''
  summary: Hercules hears Deianira as Nessus carries her off, shoots Nessus with a
    poisoned arrow, and Nessus gives Deianira his blood-dyed garment as a deceptive
    love charm. Much later, Deianira hears a rumor that Hercules loves Iole and sends
    the garment to him through Lichas. Hercules wears it while sacrificing to Jupiter;
    the poison is heated by the sacrificial flames, burns into his body, and drives
    him into unbearable agony. He addresses the daughter of Saturn, asking her either
    to be satisfied by his suffering or to grant him death.
  language: English
  quote_policy: summarized
