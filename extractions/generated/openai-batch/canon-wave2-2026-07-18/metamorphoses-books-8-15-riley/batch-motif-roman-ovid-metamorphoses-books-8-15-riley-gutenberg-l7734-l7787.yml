canonical_text:
  quote: ''
  summary: A violent fight between Centaurs and Lapiths escalates after a protector
    retaliates with a bowl. The Centaurs call for arms, and banquet vessels, sacred
    fixtures, an altar fire, votive antlers, a flaming brand, and a threshold are
    used as weapons. Several named combatants are killed or horribly wounded.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed aggressor says nothing in reply, attacks the face and breast of
    a woman’s protector, and is struck in the face by a huge ancient bowl hurled by
    the son of Ægeus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The struck aggressor vomits blood, brains, and wine, lies on his back, and
    kicks on the soaked sand; the following sentence identifies his death as the death
    of a Centaur brother.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The double-limbed Centaurs become inflamed at their brother’s death and cry
    out together for arms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wine is said to give the Centaurs courage, and cups, casks, and cauldrons
    formerly suited to banquet use are hurled in war and slaughter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Amycus, son of Ophion, tears a chandelier thick with blazing lamps from a
    shrine and smashes it against the forehead of Celadon the Lapithean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Belates tears away the foot of a maple table and uses it against Amycus, sending
    him to Tartarus by a twofold wound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gryneus looks at a smoking altar, proposes using it, raises the immense altar
    with its fire, and hurls it into the Lapith crowd, striking Broteus and Orius.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Orius’s mother Mycale is described as known for incantations that often drew
    down the horns of the struggling moon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Exadius threatens punishment if he can get a weapon, then uses the antlers
    of a votive stag from a lofty pine-tree to pierce Gryneus through the eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rhœtus takes a flaming brand from the altar and breaks through the right temple
    of Charaxus, whose yellow hair catches fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Charaxus shakes fire from his hair and lifts a threshold torn from the ground,
    but its weight prevents him from throwing it effectively at the foe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The threshold instead bears down Cometes, who is identified as a friend standing
