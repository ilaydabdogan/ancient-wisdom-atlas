canonical_text:
  quote: ''
  summary: Translatorial explanation summarizes Dido/Elisa’s Tyrian lineage, the murder
    of her husband Sicharbas by Pygmalion, her deceptive flight, the foundation of
    Byrsa/Carthage through the bull-hide bargain and animal-head omens, her death
    on a sacrificial pile under pressure from Iarbas, variants around the Cercopians
    transformed by Jupiter, and the opening summary of Apollo’s offer to the Sibyl
    of years measured by grains of sand, without perpetual youth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dido, also called Elisa, is described as Belus’s daughter, co-heir with Pygmalion,
    and wife of Sicharbas/Sichaeus, a priest of Hercules with hidden treasures.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pygmalion causes Sicharbas to be assassinated, and Dido pretends reconciliation
    while planning escape from the kingdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dido places wealth on board ship, mixes sand-filled bags among bags of gold,
    and throws bags overboard while claiming to sacrifice the treasures to appease
    her husband’s spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officers sent with Dido join her plan; Tyrian nobles board; Dido sacrifices
    to Hercules and sails away; in Cyprus the group carries off eighty young women
    who are married to her companions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the African coast, Dido bargains for as much land as a bull’s hide can
    encompass, cuts the hide into thongs, and encloses enough land for a fort called
    Byrsa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During foundation work an ox’s head is found and read as an omen of slavery,
    while a horse’s head found at another spot is read as a more favorable omen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Iarbas presses Dido to marry him, she asks for time, orders an expiatory
    sacrifice to her husband’s shade, mounts a pile said to be for burning his possessions,
    and kills herself with a poniard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The note states that Virgil invented the visit of Aeneas to Dido to explain
    Roman and Carthaginian hatred, and that Ovid elsewhere follows Virgil’s account
    of Aeneas’s conduct.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aeneas is said to see the islands of the Cercopians; the note reports that
    Jupiter transformed the Cercopians into apes, with variants naming Candulus and
    Atlas and another variant changing them into rocks after conflict with Hercules.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Apollo is enamoured of the Sibyl and offers her as many years as she can grasp
    grains of sand; she forgets to ask for lasting youth and becomes gray and decrepit.
  category: sequence
  evidence_refs:
  - ev:6
