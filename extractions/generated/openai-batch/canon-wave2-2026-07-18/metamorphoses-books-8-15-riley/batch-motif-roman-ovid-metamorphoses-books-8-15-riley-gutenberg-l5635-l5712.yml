canonical_text:
  quote: ''
  summary: 'The passage summarizes variant accounts and later interpretations of the
    Venus and Adonis story: divine jealousy leads to the boar attack; Adonis is loved
    by both Venus and Proserpine and his time is divided between earth and the underworld;
    Syrian ritual mourning and rejoicing for Adonis are described; and commentators
    compare Adonis with Osiris, Thammuz, and seasonal or solar patterns, while also
    noting objections to that interpretation.'
  language: English
  quote_policy: summarized
