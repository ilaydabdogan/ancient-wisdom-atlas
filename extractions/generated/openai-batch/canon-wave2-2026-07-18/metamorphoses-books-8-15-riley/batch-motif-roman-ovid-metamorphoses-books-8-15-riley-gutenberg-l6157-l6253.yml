candidate_motifs:
- id: motif:1
  label: golden touch and wealth portent
  taxonomy_refs: []
  basis: Midas is associated with a report that everything he touched turned to gold
    and with an infant omen of ants placing wheat in his mouth as a sign of future
    wealth and frugality.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents explanatory and rationalizing traditions rather than
    the full narrative of Midas' golden touch.
- id: motif:2
  label: animal mark after faulty judgment
  taxonomy_refs: []
  basis: Midas' preference for Pan's music over Apollo's is followed by the story
    that a god gave him asses' ears.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives alternate rationalizations for the ears, so the mythic
    punishment reading is not the only explanation offered.
- id: motif:3
  label: punishment for violation of a nymph
  taxonomy_refs:
  - divine_judgment
  basis: Tmolus violates Arriphe, a nymph of Diana, and dies after being tossed by
    a bull and falling on stakes; the passage explicitly calls this a punishment.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The punishing agent is not explicitly named in the passage.
- id: motif:4
  label: gods in mortal form perform contracted labor
  taxonomy_refs:
  - sacred_exchange
  - shapeshifter
  basis: Apollo and Neptune assume mortal form and build Troy's walls for Laomedon
    after a gold payment is agreed upon.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage says they assume mortal form, but it does not dwell on metamorphosis
    mechanics.
- id: motif:5
  label: divine punishment by inundation for perjury
  taxonomy_refs:
  - divine_judgment
  basis: After Laomedon refuses the agreed reward and commits perjury, Neptune drives
    waters over Troy's land, carries off wealth, and overwhelms the fields.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Although the punishment uses flood imagery, the passage does not include
    renewal, so it is not classified as flood-and-renewal.
- id: motif:6
  label: royal daughter exposed to sea monster and rescued by hero
  taxonomy_refs:
  - sacrifice
  basis: Laomedon's daughter is demanded for a sea monster to appease the god, chained
