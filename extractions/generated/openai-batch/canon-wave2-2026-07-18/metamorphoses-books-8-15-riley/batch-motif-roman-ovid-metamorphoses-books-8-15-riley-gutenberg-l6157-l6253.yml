canonical_text:
  quote: ''
  summary: The passage gives explanatory traditions about Midas and Tmolus, then narrates
    how Apollo and Neptune build Troy's walls for Laomedon, how Laomedon refuses the
    agreed payment, how Neptune punishes Troy with inundation and a sea-monster demand,
    and how Hercules rescues Hesione but later sacks Troy after Laomedon again withholds
    the promised reward. It closes by noting Peleus' distinction in having a goddess
    for a wife.
  language: English
  quote_policy: summarized
