canonical_text:
  quote: ''
  summary: A violent storm breaks open Ceyx's ship, mixes sea and sky, and sinks the
    vessel. The crew panic and drown or cling to wreckage. Ceyx thinks and speaks
    chiefly of Halcyone, prays that his body may reach her, and is overwhelmed by
    a wave. Halcyone, unaware of his death, prepares garments and prays at Juno's
    altar for his safe and faithful return. Juno refuses further prayers for a dead
    man and commands Iris to go to Sleep so that a vision in the form of dead Ceyx
    may tell Halcyone the truth.
  language: English
  quote_policy: summarized
