canonical_text:
  quote: ''
  summary: 'The passage summarizes Book XV: Numa succeeds and investigates Crotona,
    hears of black pebbles becoming white, attends Pythagoras on the eternal changes
    of matter, and dies; Egeria mourns him and becomes a fountain despite Hippolytus’
    consolations and account of his own transformation. Other wonders are listed:
    Tages springing from earth, Romulus’ lance becoming a tree, Cippus receiving horns,
    Æsculapius being worshipped by Romans on the Tiber island, Julius Caesar being
    deified and changed into a star, and the poet predicting his own lasting fame.'
  language: English
  quote_policy: summarized
