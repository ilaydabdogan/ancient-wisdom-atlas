canonical_text:
  quote: ''
  summary: Pan challenges Apollo in music before Tmolus. Tmolus judges Apollo's lyre
    superior to Pan's reeds. Midas alone objects, and Apollo punishes him by changing
    his ears into ass's ears. Midas conceals the change, but a servant who has seen
    it whispers the secret into a buried hole. Reeds grow there and later repeat the
    secret when moved by the wind.
  language: English
