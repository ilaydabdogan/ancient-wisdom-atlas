- id: obs:2
  text: The speaker places weapons among women’s trinkets, and the disguised hero
    takes up a shield and spear before being addressed as the son of a goddess and
    sent toward war against Troy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker argues that the deeds of Achilles are his own because he found
    Achilles, gave him the arms in life, and now asks for them back after Achilles’
    death.
  category: speech
  evidence_refs:
  - ev:2
