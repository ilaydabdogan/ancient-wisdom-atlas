canonical_text:
  quote: ''
  summary: In a speech during the contest over Achilles’ arms, the speaker claims
    that Thetis hid Achilles in women’s dress, that he exposed Achilles by placing
    weapons among women’s ornaments, and that he sent the hero to war. He further
    claims credit for military successes, for persuading Agamemnon in the matter of
    sacrificing his daughter at Aulis, for deceiving the girl’s mother, for serving
    as envoy to Troy to demand Helen and the plunder, and for advising, provisioning,
    fortifying, and rallying the Greeks during the Trojan War.
  language: English
  quote_policy: summarized
