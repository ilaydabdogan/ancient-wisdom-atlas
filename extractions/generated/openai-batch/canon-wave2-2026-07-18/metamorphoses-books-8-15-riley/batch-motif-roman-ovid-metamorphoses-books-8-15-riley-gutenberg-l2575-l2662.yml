canonical_text:
  quote: ''
  summary: Explanatory notes recount Hercules’ journey with Deianira, the river Evenus
    episode with Nessus, the later fatal philtre or tunic sent by Deianira, Hercules’
    illness, pyre on Mount Oeta, death, and cultic apotheosis. The passage then summarizes
    Juno’s revenge against Alcmena by using Ilithyia/Lucina to obstruct Hercules’
    birth, Galanthis’ deceptive intervention, Hercules’ birth, and Galanthis’ transformation
    into a weasel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hercules leaves the court of Calydon with his wife and travels toward Trachyn
    to atone for the accidental death of Eunomus and seek absolution from Ceyx.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The river Evenus has overflowed its banks, requiring Hercules to cross it;
    the Centaur Nessus is associated with assistance at the river fords.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that Nessus was buried on Mount Taphiusa and that his
    tomb emitted an offensive smell associated with the Locrians’ surname.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hercules later loves Iole, daughter of Eurytus; after Eurytus refuses to give
    her to him, Hercules wars on Oechalia, kills Eurytus, and carries off Iole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Deianira, jealous of Hercules’ passion for Iole, sends either a philtre or
    love potion, or a tunic smeared inside with pitch, which unintentionally causes
    Hercules’ death.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fatal garment is identified in the passage as what poets and historians
    have termed the tunic of Nessus.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hercules suffers a wasting illness and, according to the explanation, probably
    in madness throws Lychas into the sea; this is used to explain a rock named Lychas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After consulting an oracle, Hercules is ordered to go with his friends to
    Mount Oeta and raise a funeral pile.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hercules ascends the prepared pile, lies down, and Philoctetes kindles the
    fire that consumes him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Hercules’ apotheosis began at his funeral and that from the
    moment of death he was worshipped as a Demigod.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A version says thunder sounded and lightning from heaven immediately consumed
    Hercules when Philoctetes applied fire to the pile.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A tomb and altar for Hercules are raised on Mount Oeta, where a bull, wild
    boar, and he-goat are sacrificed yearly at his festival.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Juno seeks revenge on Alcmena for her amour with Jupiter by asking Ilithyia,
    goddess over births, not to assist at Hercules’ birth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ilithyia/Lucina sits on an altar at Alcmena’s gate and by a magic spell increases
    Alcmena’s pains and obstructs delivery.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Galanthis, a maid of Alcmena, falsely declares that Alcmena has already delivered,
    causing Ilithyia to withdraw and Alcmena’s pains to ease.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: After Ilithyia withdraws, Hercules is born.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Ilithyia punishes Galanthis for her officiousness by transforming her into
    a weasel.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The poetic passage opens with Alcmena anxious for her son, with Iole as the
    person to whom she can relate her son’s achievements and her own misfortunes.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: Hyllus, at Hercules’ command, has received Iole into his bed and affections
    and made her pregnant with a noble offspring.
  category: relationship
  evidence_refs:
  - ev:11
