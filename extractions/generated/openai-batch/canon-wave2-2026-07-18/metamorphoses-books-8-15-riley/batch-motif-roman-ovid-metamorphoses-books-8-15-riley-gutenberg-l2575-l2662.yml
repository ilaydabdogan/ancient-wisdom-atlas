candidate_motifs:
- id: motif:1
  label: hazardous water crossing with centaur guide
  taxonomy_refs: []
  basis: The passage places Hercules and Deianira at the flooded Evenus and associates
    Nessus with knowledge of the fords and assistance at the crossing.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage refers to the adventure with Nessus only in explanatory summary
    and does not narrate the full episode here.
- id: motif:2
  label: fatal garment or potion sent by jealous spouse
  taxonomy_refs: []
  basis: Deianira sends a philtre or tunic because of jealousy over Iole, and the
    object unintentionally causes Hercules’ death.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: 'The passage presents alternatives: a philtre/love potion or a pitch-smeared
    tunic; it does not settle the material cause absolutely.'
- id: motif:3
  label: abduction of beloved after refusal
  taxonomy_refs:
  - stolen_beloved
  basis: After Eurytus refuses Iole to Hercules, Hercules makes war, kills Eurytus,
    and carries off Iole.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes Iole being borne off, but does not narrate her perspective.
- id: motif:4
  label: death on mountain pyre followed by divine honors
  taxonomy_refs:
  - death_rebirth
  - ascent
  basis: Hercules goes to Mount Oeta, lies on a funeral pile, is consumed by fire,
    and is then worshipped as a Demigod; another version adds thunder and heavenly
    lightning.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage states apotheosis and cultic worship, not a literal bodily
    resurrection; the ascent taxonomy is supported only indirectly by apotheosis and
    heavenly lightning.
- id: motif:5
  label: foundation of heroic cult after death
  taxonomy_refs:
  - sacrifice
  basis: The passage reports Hercules’ posthumous worship, a tomb and altar on Mount
    Oeta, and annual sacrifices of a bull, wild boar, and he-goat.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The sacrifice motif is cultic and posthumous; it is not a substitutionary
    sacrifice narrative.
- id: motif:6
  label: divine jealousy obstructs sacred birth
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Juno seeks revenge on Alcmena because of Jupiter and has Ilithyia/Lucina
    impede the birth of Hercules by magic.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage is a summary of the fable rather than the full poetic narration.
- id: motif:7
  label: trick by servant releases obstructed birth
  taxonomy_refs:
  - trickster_boundary
  - sacred_birth
  basis: Galanthis’ false declaration that Alcmena has already delivered causes the
    goddess to withdraw, after which Hercules is born.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: Galanthis functions as a deceptive helper in this scene, but she is not
    labeled a trickster by the passage.
- id: motif:8
  label: punitive transformation into animal
  taxonomy_refs:
  - shapeshifter
  - divine_judgment
  basis: Ilithyia punishes Galanthis by transforming her into a weasel after her deceptive
    intervention.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The transformation is imposed as punishment; Galanthis is not voluntarily
    shape-changing.
- id: motif:9
  label: aetiology of named rock from human victim
  taxonomy_refs: []
  basis: The passage explains the rock known as Lychas by saying poets used Hercules’
    casting of Lychas into the sea to account for its existence.
