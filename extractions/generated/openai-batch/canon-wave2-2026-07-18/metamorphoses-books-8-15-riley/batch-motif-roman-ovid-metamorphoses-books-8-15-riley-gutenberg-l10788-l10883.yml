canonical_text:
  quote: ''
  summary: A Greek survivor describes Polyphemus raging after Ulysses' escape, recalling
    the Cyclops' bloody cannibalism and his own later rescue by a Trojan ship. Another
    speaker recounts Ulysses' voyage to Aeolus, the opening of the leather bag of
    winds, the attack by the Læstrygons under Antiphates, and warns Aeneas to avoid
    Circe's shores.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A one-eyed giant ranges about Ætna, gropes through woods, stumbles against
    rocks, stretches bloody arms into the sea, curses the Grecian race, and wishes
    for Ulysses or his companions to return so he can mangle and devour them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first speaker sees the giant's bloody face, hands, empty eye-space, limbs,
    and beard, fears being swallowed, and remembers seeing companions dashed to the
    ground and eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first speaker hides for many days, trembles at every sound, survives on
    acorns and grass mixed with leaves, signals to a ship from the shore, and is received
    by a Trojan ship though he is Greek.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Æolus rules over the Etrurian seas, confines winds in prison, and gives the
    Dulichean chief the winds shut in a leather bag; after nine days, companions cut
    the fastenings because they suspect gold, and the ship is driven back to Æolus'
    harbor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the ancient city of Lamus, Antiphates reigns; an envoy party of three is
    sent, one is killed, Antiphates pursues the others, and Læstrygon followers overwhelm
    men and ships with stones and beams, while one ship carrying Ulysses escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker points out an island visible from afar and warns Aeneas, called
    a righteous Trojan and son of a Goddess, to avoid the shores of Circe.
  category: speech
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:7
  text: A footnote states that Homer recounts Ulysses putting out Polyphemus' eye,
    using the name 'nobody,' later revealing his real name, and thereby enabling the
    Cyclops to throw a rock toward the ship.
  category: other
  evidence_refs:
  - ev:7
