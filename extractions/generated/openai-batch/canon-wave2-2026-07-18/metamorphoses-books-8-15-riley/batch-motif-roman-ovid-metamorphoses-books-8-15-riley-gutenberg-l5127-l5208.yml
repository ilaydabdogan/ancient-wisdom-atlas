canonical_text:
  quote: ''
  summary: A series of explanatory footnotes identifies Panchæa and Sabæa as aromatic
    Arabian regions, notes plants and resins such as costus, frankincense, and myrrh,
    explains references to Myrrha, the Thesmophoria or festival of Ceres/Demeter,
    Ursa Major as the Triones, and the Biblical Sheba association of Saba. The longest
    note describes the women’s rites of the Thesmophoria, including procession, mourning,
    mysteries, sacred symbols, merriment, sacrifice, and white dress.
  language: English
  quote_policy: summarized
