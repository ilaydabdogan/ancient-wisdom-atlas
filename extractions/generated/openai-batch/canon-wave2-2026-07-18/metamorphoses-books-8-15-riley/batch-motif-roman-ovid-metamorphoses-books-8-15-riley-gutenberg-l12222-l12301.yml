literal_observations:
- id: obs:1
  text: The passage describes an earlier condition in which birds, hare, and fish
    were safe, every place lacked treachery, and peace prevailed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed mortal is said to have envied simple food, eaten food made from
    a carcass, and opened a path to wickedness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says killing animals that seek human destruction may be allowed,
    but says such animals still should not be eaten.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The swine is described as the first victim because it damaged seeds, and the
    goat is described as led for slaughter to Bacchus's altars because it gnawed the
    vine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sheep are described as harmless, useful to humans through their udders and
    wool, and more helpful alive than dead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Oxen are described as innocent laboring animals, and the speaker condemns
    slaughtering the ox after it has drawn the plough and produced harvests.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says people impute slaughter to the gods and believe a heavenly
    deity can rejoice in the killing of the laborious ox.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A flawless sacrificial victim is adorned with garlands and gold, placed on
    an altar, hears prayer, sees grain on its forehead, and is killed with knives
    that become stained by its blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the victim is killed, people examine entrails taken from its throbbing
