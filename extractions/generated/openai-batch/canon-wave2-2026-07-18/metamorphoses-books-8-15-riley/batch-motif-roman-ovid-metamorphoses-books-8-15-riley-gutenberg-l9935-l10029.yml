canonical_text:
  quote: ''
  summary: Polyphemus addresses Galatea from the shore, praises his own body and single
    eye, asks her to accept him, and threatens Acis, whom she loves. After seeing
    Galatea with Acis, the Cyclop pursues them and crushes Acis with a mountain fragment.
    Galatea then transforms Acis through blood, rock, reeds, and water into a horned
    azure river-youth, and the stream keeps his name. Editorial footnotes identify
    Galatea as a sea nymph and note literary parallels for Polyphemus's song and self-praise.
  language: English
  quote_policy: summarized
