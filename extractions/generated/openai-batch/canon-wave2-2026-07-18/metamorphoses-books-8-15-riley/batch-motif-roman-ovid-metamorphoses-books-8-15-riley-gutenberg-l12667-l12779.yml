  summary: 'Editorial footnotes explain examples connected with Pythagoras’s discourse
    on natural change: altered shorelines and islands, cities swallowed by earthquake
    and sea, fountains and rivers with unusual powers, healing and trial by water
    or herb, floating islands fixed by Jupiter, and a lake bath that changes a person
    into a bird.'
