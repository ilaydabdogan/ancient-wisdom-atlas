canonical_text:
  quote: ''
  summary: 'The passage first explains the Roman historical background for Ovid''s
    account of bringing Æsculapius from Epidaurus to plague-stricken Rome in the form
    of a serpent, leading to a temple on the Island of the Tiber. It then introduces
    the final fable: Julius Cæsar is assassinated, Venus intercedes, and Cæsar is
    made divine and changed into a star. The excerpt praises Cæsar as father of Augustus,
    presents Venus pleading with the gods against the conspiracy, and lists numerous
    omens that fail to avert the fated murder in the Senate-house.'
  language: English
  quote_policy: summarized
