canonical_text:
  quote: ''
  summary: The passage gives a rationalizing explanation of Daedalus, Talos/Perdix,
    the Labyrinth, Daedalus’s escape from Minos, and Icarus’s death, then introduces
    the Calydonian boar episode. Diana is angered when Oeneus omits her rites while
    honoring other gods, sends a monstrous boar to devastate Calydon, and Meleager
    gathers a band of youths for the hunt. The summary also anticipates Meleager killing
    the boar, honoring Atalanta with its head, killing his uncles, and dying when
    Althaea burns the fatal torch tied to his life; his sisters are changed into birds.
  language: English
  quote_policy: summarized
