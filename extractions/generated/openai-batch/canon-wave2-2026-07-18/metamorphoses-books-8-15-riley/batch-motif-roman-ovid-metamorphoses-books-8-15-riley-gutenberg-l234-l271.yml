  confidence: high
  cautions: The passage is a synopsis and gives no ritual or psychological interpretation
    of the Labyrinth episode.
- id: motif:3
  label: Abandoned helper and celestial crown
  taxonomy_refs:
  - ascent
  basis: Ariadne helps Theseus, is deserted on Dia, and Bacchus places her crown among
    the constellations.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says Bacchus meets Ariadne but does not state marriage or
