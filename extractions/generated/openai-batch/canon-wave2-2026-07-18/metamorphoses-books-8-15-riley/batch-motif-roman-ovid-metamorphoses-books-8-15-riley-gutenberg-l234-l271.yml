canonical_text:
  quote: ''
  summary: 'A synoptical list of Book VIII transformations and related episodes: Scylla
    betrays Megara for Minos and is changed into a bird while Nisu becomes a sea eagle;
    Minos builds the Labyrinth for the Minotaur; Theseus kills the monster with Ariadne''s
    aid and later abandons her; Bacchus sets Ariadne''s crown among the constellations;
    Dædalus flies from Crete with wings while Icarus drowns; Perdix or Talus is transformed
    into a partridge; the Calydonian boar is hunted and slain; Meleager''s death is
    hastened by Althæa burning a fatal billet; the Naiads become the Echinades islands;
    Baucis and Philemon become trees while their house becomes a temple and the region
    a pool; Achelous recounts transformations of Proteus and Metra, who supports her
    hungry father Erisicthon.'
  language: English
  quote_policy: summarized
