  cautions: The taxonomy reference captures the metamorphosis; the protective lock
    and betrayal element is more specific than the available taxonomy list.
- id: motif:2
  label: Labyrinth monster, captive victims, and helper-assisted escape
  taxonomy_refs:
  - labyrinth_initiation
  basis: The Minotaur is enclosed in the Labyrinth and fed with Athenian captives;
    Theseus kills it and escapes by Ariadne's aid.
  evidence_refs:
