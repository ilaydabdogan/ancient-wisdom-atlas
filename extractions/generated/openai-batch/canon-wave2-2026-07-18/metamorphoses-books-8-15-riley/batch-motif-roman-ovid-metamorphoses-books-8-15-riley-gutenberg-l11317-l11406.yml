canonical_text:
  quote: ''
  summary: A first-person speaker recounts Venus' vengeance, severe wanderings, Agmon's
    defiant speech against the goddess, and the transformation of Agmon and many companions
    into birdlike forms. The narrative then shifts to Venulus, who sees a cavern with
    grove and stream occupied by Pan and formerly by Nymphs; an Apulian shepherd who
    mocked and abused the Nymphs is closed into a wild olive tree whose bitter berries
    reflect his speech.
  language: English
  quote_policy: summarized
