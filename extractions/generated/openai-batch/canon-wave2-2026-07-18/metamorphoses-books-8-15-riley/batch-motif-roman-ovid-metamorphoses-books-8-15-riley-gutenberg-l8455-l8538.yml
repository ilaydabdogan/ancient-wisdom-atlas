canonical_text:
  quote: ''
  summary: The passage opens Book Thirteen with a summary of the contest between Ajax
    and Ulysses for Achilles' armor, Ajax's suicide and floral transformation of his
    blood, the role of Philoctetes and Hercules' arrows in Troy's fall, and Hecuba's
    enslavement. It then presents the beginning of Ajax's speech before the Greek
    chiefs, where he contrasts his martial deeds and divine ancestry with Ulysses'
    eloquence, alleged evasions, deceptions, abandonment of allies, and need for help
    after refusing help to others.
  language: English
  quote_policy: summarized
