canonical_text:
  quote: ''
  summary: After Erisicthon has a tree cut down, the Dryads ask Ceres to punish him.
    Ceres sends the mountain deity Oreas in a dragon-drawn chariot to summon personified
    Famine from a barren Scythian region near Caucasus. Famine enters Erisicthon's
    sleeping body and fills him with hunger, causing dreams of eating and, upon waking,
    an appetite that no food can satisfy.
  language: English
  quote_policy: summarized
