comparison_claims:
- id: claim:1
  claim: The note uses Greek purification customs for people presumed dead and returned
    alive as an analogue for Halcyone's pollution after Ceyx's death.
  claim_level: same_function
  target: Greek death-impurity purification practice and Halcyone's pollution in Ovid's
    narrative
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim comes from the translator's explanatory note; the passage
    does not provide independent Greek source citations.
- id: claim:2
  claim: The note states that Ovid's description of Sleep's abode, appearance, and
    attendants is supposed to have been borrowed from a Greek poet.
  claim_level: historical_contact
  target: Greek poetic tradition on the abode and attendants of Sleep
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The alleged Greek poet is not named, and the wording is explicitly
    tentative.
- id: claim:3
  claim: The note equates or closely associates Lucian's Taraxion with Phobetor as
    a fear-bringing dream deity.
  claim_level: same_function
  target: Lucian's Taraxion and Ovidian Phobetor
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The note says Lucian appears to mean the same deity, so the identification
    remains cautious.
- id: claim:4
  claim: The note compares Ovid's seven calm days with other counts for the same halcyon-days
    pattern in Simonides, Philochorus, and Demagoras.
  claim_level: same_motif
  target: Halcyon calm-day tradition in named Greek authorities
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: Only the day counts are given; no further details from those authorities
    are provided.
