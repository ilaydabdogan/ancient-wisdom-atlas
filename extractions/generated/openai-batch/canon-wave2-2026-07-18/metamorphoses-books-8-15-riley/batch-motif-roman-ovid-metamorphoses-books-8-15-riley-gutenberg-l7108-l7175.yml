canonical_text:
  quote: ''
  summary: A sequence of explanatory footnotes discusses death pollution and purification,
    the Cimmerian abode of Sleep, geese saving the Capitol, Lethe's waters of forgetfulness,
    a return flight through a bow, the dream figures Morpheus, Icelos, Phobetor, Taraxion,
    and Phantasos, the Aegean route of Ceyx, ancient epitaph customs, variant counts
    for calm halcyon days, and the kingfisher as an emblem of conjugal fidelity and
    sea calm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons engaged in burial of the dead are described as polluted and barred
    from temples of the gods until purified.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Greeks, people thought to have died abroad and given honorary funeral
    rites were considered impure if they returned alive; purification involved swaddling
    clothes and treatment like new-born infants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note explains Juno's view that Halcyone is polluted by the death of her
    husband Ceyx, even though he died at a distance and Halcyone does not yet know
    of it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ovid is said to place the abode of Sleep in the cold, damp, foggy region of
    the Cimmerians.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cimmerians are identified either as a people near the Palus Maeotis or
    as a fabulous race near Baiae who inhabit dark caves by day and plunder at night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The description of Sleep's abode, appearance, and attendants is said to be
    supposed to derive from a Greek poet.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Geese are credited with giving an alarm and saving the Capitol when it was
    in danger from the Gauls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dead who taste Lethe's waters, one of the rivers of Hell, are said to
    lose recollection of their former life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A cited translation describes a female figure flying away and returning through
    the bow by which she had come.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Morpheus is explained from a Greek word for shape or figure because he assumes
    various shapes; Icelos is explained from a Greek word for likeness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Phobetor is explained from a Greek word for fear because his office is to
    terrify mortals; Lucian is said to refer to the same deity as Taraxion, and Phantasos
    is explained from a Greek word for fancy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Aegean Sea is described as lying between Trachyn and the coast of Ionia,
    where Ceyx had gone.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ancient epitaphs usually contained the person's name and age, and Greek epitaphs
    could include principal life events.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Halcyone is said to promise Ceyx an honorary funeral and a share in her own
    epitaph.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'Authorities named in the note give different numbers for calm days: Simonides
    eleven, Philochorus nine, and Demagoras seven; Ovid adopts seven.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The male kingfisher is said to refuse another mate after the female's death,
    leading poets to treat the bird as an emblem of conjugal affection.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The sea is said to be calm while the female kingfisher is sitting, giving
