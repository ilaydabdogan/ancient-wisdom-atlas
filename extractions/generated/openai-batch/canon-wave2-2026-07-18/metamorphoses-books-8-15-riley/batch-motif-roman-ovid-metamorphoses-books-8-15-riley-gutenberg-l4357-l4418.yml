literal_observations:
- id: obs:1
  text: In the Roman Circus, a lengthwise low wall called the spina had three large
    wooden cones or pyramids at each end; these were shaped like cypress trees and
    called metae or goals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Necklaces are described as ancient ornaments used by Indians, Persians, Egyptians,
    and especially by Greek and Roman females as bridal ornaments; horses and favorite
    animals could also be decorated with them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The footnote says amber was distilled from trees into which the sisters of
    Phaëton were changed, and that this amber was sent to be worn by Latian matrons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bulla was a ball-shaped ornament worn suspended from the neck by Roman
    children; its use is said to derive from Etruria, and it was later laid aside
    with the toga praetexta and consecrated to the Lares.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Earrings are described as ornaments worn by both sexes among several named
    peoples, while among Greeks and Romans females alone wore them; they commonly
    had a ring and drop, with materials including gold, bronze, and pearls.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cea is identified as one of the Cyclades, and Carthaea as one of its four
    cities.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes a Roman custom of placing cypress branches before doors
    of houses where a dead body lay; Pliny is cited as saying the cypress was sacred
    to Pluto and used at funerals and on the funeral pile.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The funerary use of cypress is also explained by its strong scent and by the
    claim that, once its bark is cut, it withers and is emblematic of the frail tenure
    of human life.
  category: attribute
  evidence_refs:
  - ev:8
