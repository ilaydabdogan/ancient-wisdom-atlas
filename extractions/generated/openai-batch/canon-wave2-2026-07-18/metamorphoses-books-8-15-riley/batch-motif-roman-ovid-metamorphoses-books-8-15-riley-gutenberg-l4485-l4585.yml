canonical_text:
  quote: ''
  summary: The passage first gives a rationalizing explanation of Ganymede's capture,
    divine-eagle abduction report, cup-bearer status, catasterism as Aquarius, and
    the later Trojan-Tantalid conflict. It then narrates Apollo's love for Hyacinthus,
    the fatal quoit accident, Apollo's failed healing and lament, and the transformation
    of Hyacinthus's blood into an inscribed purple flower commemorated by annual rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tros, king of Troy, sent his son Ganymede into Lydia with nobles to offer
    sacrifice in a temple dedicated to Jupiter; Tantalus mistook the party for spies
    and imprisoned Ganymede.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Ganymede's arrest in Jupiter's temple by order of a
    prince whose ensign was an eagle gave occasion to the report that Jupiter carried
    him off in the shape of an eagle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jupiter is said to have made Ganymede his cup-bearer, and poets say that the
    Gods placed Ganymede among the constellations as Aquarius, the Water-bearer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The capture of Ganymede is said to have caused a long war between Tros and
    Tantalus, continued by Ilus against Pelops after their deaths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Paris probably carried off Helen as a reprisal against
    Menelaus, who is described as a great-grandson of Tantalus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Apollo loved Hyacinthus beyond others and spent time near the Eurotas and
    Sparta, while Delphi was without its guardian deity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Apollo carried nets, held dogs, and accompanied Hyacinthus over rugged mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During a game of quoits, Apollo threw the quoit; after it fell on hard ground,
    it rebounded and struck Hyacinthus in the face.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: Apollo supported the sinking Hyacinthus, tried to stanch the wound, and applied
    herbs, but the wound was incurable.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Apollo declared that Hyacinthus's death was his grief and crime, wished he
    could give his life for or with Hyacinthus, and said destiny restrained him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Apollo vowed that Hyacinthus would remain on his lips, be celebrated by lyre
    and songs, and become a new flower bearing an inscription of lamentation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The blood poured on the ground ceased to be blood, and a bright purple flower
    sprang up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Apollo inscribed the lament 'ai, ai' on the flower's leaves, and the Hyacinthian
