canonical_text:
  quote: "“One like thyself.”"
  summary: Cinyras asks Myrrha which suitor she prefers. Myrrha, secretly desiring
    her father, gives an ambiguous answer. At night she is torn between shame, desire,
    and death, and attempts to hang herself with her girdle. Her nurse discovers and
    stops the attempt, presses her to reveal the cause, offers magical or ritual remedies,
    and eventually understands that Myrrha’s passion is for her father. Although horrified
    and initially trying to dissuade her, the nurse promises under oath to help her
    live and obtain the man she loves.
  language: English
  quote_policy: quoted
