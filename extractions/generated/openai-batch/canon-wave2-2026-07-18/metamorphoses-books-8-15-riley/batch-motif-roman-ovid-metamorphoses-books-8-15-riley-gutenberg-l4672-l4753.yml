canonical_text:
  quote: ''
  summary: The supplied passage first explains the story of Hyacinthus as a Laconian
    youth favored by Apollo and the Muses who dies from a quoit blow, with a later
    account attributing the deflection to jealous Boreas and linking Hyacinthus to
    a flower and tomb cult. It then narrates Venus punishing the Cerastae of Cyprus
    for human sacrifice by transforming them into bulls, and punishing the Propœtides
    for denying her divinity by transforming them into rocks.
  language: English
  quote_policy: summarized
