canonical_text:
  quote: ''
  summary: The passage reports a prophecy that Rome, rising near the Tiber, will become
    mistress of the world through Trojan posterity and a descendant of Iülus who will
    ascend to heaven. It then turns to a doctrine that all things change form and
    that human souls can enter animals, using this as a basis for abstaining from
    animal slaughter, hunting, and meat-eating while allowing nonlethal uses of domestic
    animals.
  language: English
  quote_policy: summarized
