  text: Hercules says that a new calamity cannot be resisted by courage, weapons,
    or arms, and describes a consuming flame pervading his lungs and limbs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Racked with pain, Hercules ranges over lofty Oeta, groaning, shrieking, trying
    to tear off his garments, levelling trees, raging against mountains, and stretching
    his arms toward his father's heaven.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hercules sees Lichas trembling and hidden in a hollow rock, and accuses him
    of bringing the fatal present and causing his death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hercules seizes Lichas, whirls him three or four times, and hurls him into
    the Euboean waves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lichas hardens while airborne and is said to have been transformed into hard
