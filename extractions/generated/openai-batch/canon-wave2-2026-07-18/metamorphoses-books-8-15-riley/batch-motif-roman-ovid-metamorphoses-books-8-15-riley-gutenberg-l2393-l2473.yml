canonical_text:
  quote: ''
  summary: Hercules, suffering an inward consuming flame, recalls his former labors
    and then rages on Mount Oeta. He discovers Lichas, accuses him of bringing the
    fatal gift, hurls him into the Euboean sea, and Lichas becomes a human-shaped
    rock. Hercules prepares a pyre, transfers his bow, quiver, and arrows to the son
    of Poeas, and lies on the pyre with his lion skin and club. The gods fear for
    him, but Jupiter declares that only Hercules' maternal mortal part can be burned,
    while the paternal immortal part will be received into heaven.
  language: English
  quote_policy: summarized
