canonical_text:
  quote: ''
  summary: In the contest over Achilles' arms, Ajax argues that he rescued Ulysses,
    faced Hector, defended the Greek fleet, and deserves the arms more than a stealthy
    strategist. He describes the arms as too bright and heavy for Ulysses and proposes
    a retrieval test among the enemy. After Ajax ends, Ulysses rises and begins a
    reply, mourning Achilles, claiming a role in bringing Achilles to the Greeks,
    and arguing that personal merit should outweigh ancestry or kinship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ajax says he found Ulysses trembling, pale, and in danger, then covered him
    with his shield and preserved his life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ajax says Hector's approach terrified even valiant fighters; Ajax says he
    struck Hector with a large stone, withstood him alone, and was not beaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ajax says the Trojans brought fire, sword, and Jove against the Greek fleet,
    and that he protected a thousand ships with his breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ajax contrasts his open battle deeds with Ulysses' deeds, which he describes
    as stealthy, unarmed, and based on stratagem against unwary enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ajax describes Achilles' arms as including a bright gold helmet, a spear from
    Pelion, and a shield embossed with the form of the great globe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ajax says Ulysses' shield has rarely experienced battle, while his own shield
    is gaping with many wounds from darts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ajax proposes that Achilles' arms be thrown among the enemy and awarded to
    the person who brings them back.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After Ajax finishes, the crowd murmurs; Ulysses rises, looks down and then
    toward the chiefs, and begins an eloquent speech.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ulysses says Achilles has been denied to the Greeks by the Fates, wipes his
    eyes as though shedding tears, and asks who should better succeed Achilles than
    the one through whom Achilles joined the Greeks.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ulysses argues that the arms should be awarded by personal merit rather than
