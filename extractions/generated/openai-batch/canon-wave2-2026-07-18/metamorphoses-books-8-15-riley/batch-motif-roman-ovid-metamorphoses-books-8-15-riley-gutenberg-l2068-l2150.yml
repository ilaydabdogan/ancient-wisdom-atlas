canonical_text:
  quote: ''
  summary: The passage introduces and begins Achelous's account of his rivalry with
    Hercules for Deianira. Deianira's father is said to offer her to the bravest suitor;
    other suitors yield to Hercules and Achelous. Achelous tells Theseus how he argued
    his status as a local river and king of waters against Hercules's claims of Jupiter
    as father and fame from labours. Hercules answers with force, and the rivals wrestle.
    The introductory argument states that Achelous changes into various forms, including
    a bull, is overcome, loses a horn, and that the Naiads fill the horn with autumn
    fruits, making the Horn of Plenty. The narrative excerpt ends with Achelous, inferior
    in strength, transforming into a long serpent and escaping.
  language: English
  quote_policy: summarized
