canonical_text:
  quote: ''
  summary: 'The passage describes Achilles after his burning: his body is reduced
    to ashes and a small urn, while his glory endures. His shield and arms become
    the object of conflict, with the chief claimants identified as the son of Telamon
    and the son of Laërtes. Agamemnon avoids deciding the dispute alone and transfers
    judgment to the assembled Argive leaders.'
