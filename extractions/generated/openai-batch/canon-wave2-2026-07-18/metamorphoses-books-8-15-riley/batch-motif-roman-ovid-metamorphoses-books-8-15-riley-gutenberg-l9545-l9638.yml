canonical_text:
  quote: ''
  summary: 'Anius receives the Trojan visitors at Delos, performs ritual offerings,
    and recounts the fortunes of his children: a son with augury and daughters whose
    touch could produce corn, wine, and olives, later seized for the Argive fleet
    and transformed into doves after praying to Bacchus. Phoebus then gives an oracle
    directing the Trojans toward their ancient mother and kindred shores. Anius gives
    departing gifts, including a carved goblet whose images show Thebes in mourning,
    the self-sacrifice of Orion’s daughters, and twin youths arising from their ashes.
    The passage then summarizes further Trojan travel through Crete, storms, Strophades,
    Ithaca’s region, Ambracia, Dodona, and Chaonian bays.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anius receives the visitor into both temple and house, shows the city and
    dedicated temples, and points out two tree trunks once grasped by Latona in labor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Frankincense is put into flames, wine is poured on the frankincense, and entrails
    of slain oxen are burnt before the party goes to the palace for a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anchises asks whether Anius formerly had a son and four daughters; Anius confirms
    that he was parent of five children and is now almost bereft.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anius says his absent son is associated with Andros, holding that place and
    kingdom for his father, and that the Delian God granted him augury.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anius says Liber gave his daughters powers by which their touch transformed
    things into corn, wine, and the berry of Minerva.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son of Atreus learned of the daughters’ powers, used armed force to drag
    them from their father, and commanded them to supply the Argive fleet with their
    gifts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The daughters fled separately to Euboea and Andros; armed forces threatened
    war if they were not surrendered, and their brother gave them up under fear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: As chains were being prepared, the daughters prayed to Father Bacchus; Anius
    says they lost their shape, assumed wings, and became snow-white doves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the feast, the travelers consult the oracle of Phoebus, which tells
    them to seek the ancient mother and kindred shores.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Anius gives departing gifts: a sceptre to Anchises, a scarf and quiver to
    Anchises’ grandson, and a goblet to Æneas.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The goblet is described as ancient brass with gilded acanthus and a carved
    design made by Alcon and sent by Therses.
  category: object
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:12
  text: The goblet carving depicts a seven-gated city, a funeral, tombs, fires, funeral
    piles, mourning matrons, weeping Nymphs, dried springs, a bare tree, and goats
    gnawing dry stones.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'The goblet carving depicts the daughters of Orion in Thebes: one exposes
    her breast and throat, while the other thrusts a sword into herself; they die
    for their people and receive an honored funeral and burning.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: From the virgin embers of Orion’s daughters, twin youths arise; Fame calls
    them Coronæ, and they lead the funeral procession for their mothers’ ashes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Trojans give reciprocal gifts to the priest, remember their Teucrian origin,
    sail toward Crete, leave it, seek Ausonian harbors, and are tossed by a storm
    near the Strophades, where winged Aëllo frightens them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The travelers pass regions associated with Ithaca and Ulysses, Ambracia, Dodona
    vocal with oaks, and Chaonian bays where sons of the Molossian king escaped flames
    with wings attached to them.
  category: sequence
  evidence_refs:
  - ev:9
