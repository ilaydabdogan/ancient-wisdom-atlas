  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: She entreats the recipient’s aid, says he alone can save or destroy her, and
    says she desires to be more closely connected and united to him in a nearer tie.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: She argues in the message that young passion should not be restrained by ordinances,
    laws, a severe father, reputation, or fear, and says they can conceal stolen joys
    under a brother’s name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After filling the tablets, she seals them with a signet wetted by her tears,
    calls a male domestic, and tells him to carry them to her brother after a long
    pause.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The tablets slip from her hands and fall; she is shocked by this omen but
    still sends them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The servant delivers the secret writing to Caunus, who reads part of it, throws
    the tablets away, and angrily calls the servant an accursed pander to forbidden
    lust.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The frightened servant reports Caunus’s threats to Byblis; on hearing the
    refusal she turns pale and feels an icy chill, but her frantic passion returns
    when her senses return.
  category: sequence
  evidence_refs:
