canonical_text:
  quote: ''
  summary: Byblis resolves to confess her passion to her brother Caunus by writing
    on wax tablets. She struggles over the wording, describes her bodily and emotional
    symptoms, asks him to save or destroy her, argues against legal and social restraints,
    and proposes concealment under the name of siblinghood. She seals the tablets
    with a tear-wetted signet and sends them by a male domestic, despite the tablets
    falling from her hands as an omen. Caunus reads part of the message, angrily rejects
    it, threatens the messenger, and calls him a pander to forbidden lust. The messenger
    reports the refusal to Byblis, who is chilled with fear but soon feels her passion
    return.
  language: English
  quote_policy: summarized
