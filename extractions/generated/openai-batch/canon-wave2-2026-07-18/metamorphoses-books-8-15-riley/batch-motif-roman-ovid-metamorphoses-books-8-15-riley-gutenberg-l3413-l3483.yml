  text: She writes with an iron pen on clean wax tablets, repeatedly hesitating, correcting,
    scratching out, altering, rejecting, and approving her words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: She writes the word “sister,” then considers effacing it and writes a message
    in which she identifies herself as a lover while feeling ashamed to disclose her
    name.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: In the written message, she names herself as Byblis and lists pale complexion,
    wasting, downcast looks, tearful eyes, sighs, embraces, and kisses as signs of
    her wounded heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the message, she describes a grievous wound in her soul, a raging fire
