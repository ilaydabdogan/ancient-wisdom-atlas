canonical_text:
  quote: ''
  summary: 'The Book IX summary lists a sequence of episodes: Acheloüs’ transformations
    during a contest with Hercules for Deïanira; Nessus’ attempted abduction of Deïanira
    and retaliatory gift of a blood-stained garment that poisons Hercules; Lychas
    becoming a rock; Hercules’ conveyance to heaven; stories of Galanthis becoming
    a weasel and Dryope becoming a lotus; Iolaüs’ youth being restored by Hebe; Jupiter’s
    examples of Æacus and Minos; Miletus’ flight from Minos and the story of Byblis,
    Caunus, and Iphis.'
  language: English
  quote_policy: summarized
