  claim: The passage presents a historical-contact explanation in which mythological
    names of Oriental origin and their stories entered Greece and Italy from Egypt
    or Phoenicia.
  claim_level: historical_contact
  target: Egyptian or Phoenician sources for myths with Oriental names, including
    examples such as Adonis, Arethusa, Arachne, and Isis
  evidence_refs:
