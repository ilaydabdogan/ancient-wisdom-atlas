canonical_text:
  quote: ''
  summary: 'Translator footnotes identify several figures associated with the Trojan
    War narrative: Ajax gestures toward Diomedes as Ulysses'' companion; Eurypilus,
    Thoas, Idomeneus, and Meriones are briefly genealogized or described; Lemnos is
    linked with Hypsipyle saving her father Thoas during a killing of males by Lemnian
    women; Thrace is identified as a foreign land; Cassandra is described as Apollo''s
    priestess, ravished by Ajax Oïleus, captured by Agamemnon, and slain by Clytemnestra;
    Astyanax is described as Hector and Andromache''s only child, thrown from a high
    tower by Ulysses to prevent survival of royal blood.'
