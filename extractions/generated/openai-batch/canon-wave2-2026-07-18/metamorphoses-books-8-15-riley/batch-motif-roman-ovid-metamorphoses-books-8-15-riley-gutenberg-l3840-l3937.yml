canonical_text:
  quote: "“Iphis, a male, offers the presents, which, as a female, he had vowed.”"
  summary: 'A temple omen follows tears and words addressed to the Goddess: her altars
    move, temple doors shake, horns shine, and a sistrum sounds. The mother leaves
    reassured, while Iphis changes in stride, strength, features, hair, and sex, becoming
    male after having been female. Iphis and the mother make offerings with an inscription
    acknowledging the fulfilled vow. The next morning Venus, Juno, and Hymenaeus attend
    the marriage fires, and Iphis gains Ianthe. The footnotes explain Isis''s horns,
    the marriage fires, a related Antoninus Liberalis account, and a serpent associated
    with Isis iconography.'
  language: English
  quote_policy: quoted
