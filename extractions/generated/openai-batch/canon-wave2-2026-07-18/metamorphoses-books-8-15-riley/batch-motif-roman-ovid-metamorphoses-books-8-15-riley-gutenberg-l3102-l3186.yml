  - ev:3
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: Lotis' change is reported briefly as prior local knowledge, while Dryope's
    change is narrated at length and includes maternal farewell speech.
- id: claim:2
  claim: Iolaüs' rejuvenation and Calirrhoë's sons' accelerated maturity serve a similar
    narrative function as divine exceptions to ordinary aging.
  claim_level: same_function
  target: Iolaüs made young again and Calirrhoë's infant sons made men in childhood
