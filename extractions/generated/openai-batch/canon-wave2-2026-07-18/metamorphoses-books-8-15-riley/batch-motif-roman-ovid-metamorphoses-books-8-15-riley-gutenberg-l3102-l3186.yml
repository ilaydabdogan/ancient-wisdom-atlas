canonical_text:
  quote: ''
  summary: Iole recounts how her sister Dryope, while carrying and nursing her infant
    son, plucked flowers from a lotus that had once been the transformed nymph Lotis.
    The plant bled, and Dryope herself was rooted and slowly enclosed in bark, becoming
    a tree while speaking final requests for her child and family. The surrounding
    frame then describes Iole and Alcmena grieving, Iolaüs appearing young again through
    Hebe's favor, and Themis foretelling Theban civil strife and a later divine grant
    of adult years to Calirrhoë's infant sons.
  language: English
  quote_policy: summarized
