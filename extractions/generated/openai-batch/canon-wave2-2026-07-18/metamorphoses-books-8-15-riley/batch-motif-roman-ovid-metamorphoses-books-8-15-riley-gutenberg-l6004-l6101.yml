canonical_text:
  quote: ''
  summary: The passage gives explanatory traditions about Silenus, including his status
    among lower divinities, appearance, relation to Bacchus and Midas, and an account
    of a remote continent with paired cities, Anostus, two rivers, and fruits with
    emotional and life-altering effects. It then introduces the fable in which Pan
    challenges Apollo, Tmolus judges the contest, and Midas receives asses' ears for
    preferring Pan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ancients are said to have placed Satyrs and Sileni among the lower or
    common class of gods, and Pausanias is reported as treating Sileni as aged Satyrs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Silenus is singled out; traditions give him a birth at Malea or make him
    the son of a Nymph, and describe him as inferior to higher divinities but not
    mortal like humans.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Silenus is represented as bald, flat-nosed, red-faced, and like a drunken
    old man, often on an ass or supported by a thyrsus.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Silenus is said to have tended the education of the infant Bacchus, and other
    writers portray him as a philosopher, commander, or general despite drunken-old-man
    traits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a fountain into which wine had been put and links this
    setting to Midas and an interview in which Silenus speaks with Midas.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the reported conversation, Silenus describes a vast continent beyond the
    ocean, with larger and longer-lived people, magnificent towns, different customs,
    and different laws.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The remote continent contains two named cities, the Warlike and the Devout;
    the former is devoted to war and conquest, while the latter is peaceful, plentiful,
    righteous, and visited by the gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Warlike people are said to have invaded this world as far as the Hyperboreans
    with a million men, then returned home after judging the Hyperboreans unworthy
    of notice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A numerous people called Meropes are associated with a place called Anostus,
    described as not to be repassed because no one returns from it.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Anostus is described as a dreadful abyss with reddish light, two rivers named
    Sorrow and Mirth, and large trees growing about the rivers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who eat fruit near the River of Sorrow spend their lives weeping, while
    those who eat fruit near the other river forget the past, revert through life
    stages, and then die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ælian is said to regard the passage as a fable, and the editor calls the latter
    part clearly allegorical.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some writers identify Silenus as king of Caria, friend of Midas, and useful
    counselor in governing; the passage also explains his title as Bacchus's tutor
    by saying he introduced Bacchus's worship into Phrygia and neighboring lands.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The fable summary says Pan, praised by Nymphs, challenges Apollo in music;
    Tmolus judges for Apollo; Midas alone prefers Pan and receives asses' ears, which
    he hides until his barber reveals the deformity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The opening of the fable places a figure in woods and fields following Pan,
    who dwells in mountain caves, and describes lofty Tmolus overlooking the sea.
  category: setting
  evidence_refs:
  - ev:10
