  quote: ''
  summary: The passage first gives explanatory rationalizations for stories that the
    Cerastae of Cyprus were changed into bulls and the Propoetides into rocks. It
    then narrates Pygmalion’s rejection of women, his carving of and love for an ivory
    maiden, his prayer at Venus’s festival, Venus’s favorable omen, the statue’s animation,
    the marriage, and the birth of Paphos, eponym of the island.
