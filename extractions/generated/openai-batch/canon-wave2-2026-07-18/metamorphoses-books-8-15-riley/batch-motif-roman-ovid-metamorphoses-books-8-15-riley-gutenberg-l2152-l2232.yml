canonical_text:
  quote: ''
  summary: Acheloüs recounts how, after taking a serpent form, he was mocked and gripped
    by the Tirynthian/Hercules, who cited his earlier victories over serpents and
    the Lernaean Hydra. Acheloüs then changed into a bull, was thrown down, and had
    one horn broken off. The horn was consecrated by Naiads, associated with Plenty,
    and used to carry autumn produce. At daybreak the young men depart, while Acheloüs
    hides his mutilated horn in the waves and covers the injury with willow branches
    or reeds. The passage also includes explanatory footnotes on Hercules' cradle-serpents
    and Hydra traditions.
  language: English
  quote_policy: summarized
