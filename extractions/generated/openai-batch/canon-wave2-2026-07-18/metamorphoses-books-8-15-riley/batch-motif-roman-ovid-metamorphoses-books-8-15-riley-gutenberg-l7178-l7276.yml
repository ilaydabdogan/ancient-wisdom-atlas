canonical_text:
  quote: ''
  summary: 'The explanatory notes present traditions about Ceyx and Halcyone: Ceyx
    as king of Trachyn, his shipwreck after consulting Apollo, Halcyone''s grief or
    death in the sea, their transformation into birds, and an alternate Apollodorus
    version in which Jupiter punishes their pride by changing them into birds. The
    fable then tells of Æsacus, a royal Trojan, who pursues the nymph Hesperie; she
    is bitten by a serpent and dies. Æsacus blames himself, leaps into the sea, is
    pitied by Tethys, and is transformed into a diving bird that repeatedly plunges
    into the water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ceyx is described in the explanatory note as king of Trachyn, knowledgeable
    and experienced, and as someone to whom many came to atone for murders.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the deaths of his brother Dædalion and niece Chione, Ceyx went to Claros
    to consult Apollo's oracle and was shipwrecked on his return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Halcyone was afflicted by Ceyx's shipwreck and is said either to have died
    of grief or thrown herself into the sea; the pair were said to have been changed
    into kingfishers, which the note says ancient people considered a symbol of conjugal
    affection.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An alternate account attributed to Apollodorus says Ceyx and Halcyone were
    destroyed because of pride, after Ceyx assumed Jupiter's name and Halcyone assumed
    Juno's name; Jupiter changed them into birds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the fable, an old man points out a didapper flying over or cutting through
    the sea and identifies it as a king's son from the Trojan royal line and as Hector's
    brother.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Æsacus avoided cities and the court, frequented mountains and fields, and
    saw Hesperie, daughter of Cebrenus, drying her hair by her father's banks.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hesperie fled when seen by Æsacus; he pursued her, and a snake hidden in the
    grass wounded her foot with venom, ending both her flight and her life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Æsacus embraced Hesperie's body, lamented that he had pursued her, assigned
    the wound to the serpent and the occasion to himself, and declared that he would
    answer her fate with his own death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Æsacus hurled himself from a wave-undermined rock into the sea; Tethys pitied
    him, received him softly, covered him with feathers, and prevented the death he
    sought.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After gaining wings, Æsacus repeatedly threw himself into the waves, but his
    feathers broke the fall; his body became lean, long-legged, and long-necked, and
    he loved the sea and took his name from plunging in it.
  category: sequence
  evidence_refs:
  - ev:9
