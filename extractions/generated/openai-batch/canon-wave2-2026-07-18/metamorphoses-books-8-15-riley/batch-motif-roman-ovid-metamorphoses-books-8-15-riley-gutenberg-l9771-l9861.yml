canonical_text:
  quote: ''
  summary: The passage first gives antiquarian explanations of the Dodona oracle,
    including ambiguous priestly responses, variant accounts of speaking trees, pigeons,
    and ringing cauldrons, and a story about Boeotian envoys burning a priestess after
    an oracle. It then introduces the episode of Polyphemus, Acis, and Galatea, situating
    the Trojans near Scylla and Charybdis and beginning Galatea's account of Acis,
    her love for him, and the Cyclops' pursuit of her.
  language: English
  quote_policy: summarized
