canonical_text:
  quote: ''
  summary: Venus recounts how Hippomenes prayed to her before racing Atalanta, received
    three golden apples from a consecrated tree, used them to distract Atalanta and
    win the race, then failed to thank Venus. In anger, Venus caused Hippomenes and
    Atalanta to commit a forbidden act in a sacred recess near a temple of the Mother
    of the Gods, after which they were transformed into lions. Venus warns Adonis
    to avoid such dangerous beasts.
  language: English
  quote_policy: summarized
