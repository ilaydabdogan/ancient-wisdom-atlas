canonical_text:
  quote: ''
  summary: The explanatory note compares ancient accounts of Æsacus. It reports agreement
    that he was Priam's son and was transformed into a didapper or diver, but gives
    variant details about his parentage, marriage, bereavement, prophecy concerning
    Hecuba's child, exposure of an infant on Mount Ida, attempted killings to avert
    a prediction, alternate interpreters of Hecuba's dream, and Æsacus' instruction
    in divination from Merops.
  language: English
