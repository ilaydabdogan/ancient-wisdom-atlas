canonical_text:
  quote: ''
  summary: 'The passage gives explanatory traditions about Circe, Medea, Scylla, and
    Charybdis, including rationalizing and comparative accounts. It then summarizes
    and narrates Aeneas'' route after passing Charybdis: Dido receives and loves him,
    dies by the sword on a ritual pile after his departure, Aeneas performs rites
    at his father''s tomb and sails onward, and Jupiter punishes the fraudulent Cercopians
    by transforming them into ape-like animals deprived of human speech.'
