canonical_text:
  quote: ''
  summary: The passage first offers a physical explanation for the Echinades as sediment
    formed by the river Acheloüs. It then introduces the story of Jupiter and Mercury
    visiting Phrygia in human disguise, being rejected by many households but received
    by the poor elderly couple Philemon and Baucis. The summary states that the gods
    reward the couple by transforming their cottage into a temple, making them priest
    and priestess, later changing them into trees, and submerging the impious village
    as a lake. The narrative begins with a skeptical son of Ixion rejecting divine
    power over forms, Lelex answering with a Phrygian example, and the disguised gods
    entering the poor cottage where Baucis and Philemon prepare humble hospitality.
  language: English
  quote_policy: summarized
