comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Plutarch, Servius, Hyginus following Euripides
    and Seneca as variant authorities for the same Phaedra-Hippolytus narrative, differing
    especially on Phaedra's accusation and death.
  claim_level: same_motif
  target: Euripides-associated and Senecan versions of the Phaedra-Hippolytus story
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison of literary variants named in the passage, not
    an argument about historical transmission beyond those citations.
- id: claim:2
  claim: The passage identifies a later tradition, followed by Ovid and also attested
    through cited ancient commentators, in which Aesculapius revives Hippolytus and
    he appears in Italy as Virbius.
  claim_level: same_motif
  target: Hippolytus restored to life as Virbius in the Arician-grove tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage also states that the story may have been invented to support
    local worship; the claim is limited to shared narrative content among cited sources.
- id: claim:3
  claim: The passage reports that Pliny regarded the horn story of Cippus as a fable
    like that of Actaeon, supporting only a cautious comparison of horned bodily prodigy
    or transformation imagery.
  claim_level: visual_similarity
  target: Actaeon horned or transformation fable
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The passage does not narrate Actaeon's story here and also offers rationalizing
    explanations for horn-like bodily excrescences.
