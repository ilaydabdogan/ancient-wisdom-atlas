canonical_text:
  quote: ''
  summary: The passage gives explanatory accounts of Phaedra, Theseus, and Hippolytus;
    posthumous worship, catasterism, and restoration of Hippolytus as Virbius; Etruscan
    divination and the earth-born Tages; Romulus' spear becoming a tree and civic
    omen; and Genucius Cippus' horn-like forehead prodigy, its augural interpretation,
    and rationalizing explanations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Phaedra, fearing that an intrigue would become known to Theseus, is said in
    one account to have hanged herself after writing a letter accusing Hippolytus
    of an attempt on her virtue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A variant attributed to Seneca says Phaedra appeared before Theseus in grief
    holding a sword, using it to signify violence allegedly offered by Hippolytus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Theseus asked Neptune for assistance; Neptune sent a monster from the sea,
    which frightened Hippolytus' horses, leading to Hippolytus being thrown from his
    chariot and killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rationalizing explanation says Theseus ordered his son to come justify himself,
    and Hippolytus died because his horses ran away and his chariot was dashed over
    rocks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Troezen honored Hippolytus after death with divine honors, a
    temple, a priest, and yearly sacrifices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Young women of Troezen, before marriage, cut off their hair and carried it
    to the temple of Hippolytus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that Hippolytus was said to have been translated to heaven
    and changed into the constellation called Auriga, the Charioteer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Later authors, followed by Ovid according to the passage, added that Aesculapius
    restored Hippolytus to life and that he appeared in Italy under the name Virbius.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ancient Etrurians are described as skilled in divination, especially through
    inspecting entrails of beasts and observing the flight of birds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tages is said to have been the first teacher of this divinatory art, and because
    his origin and parents were unknown he was poetically called a son of the earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ammianus Marcellinus is cited as saying Tages was said to have sprung out
    of the earth in Etruria.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Romulus' spear, thrown from the Mount Aventine toward the Capitol, stuck in
    the ground and was converted into a tree that immediately put forth leaves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The spear-tree prodigy was treated as a presage of Rome's future greatness,
    and Plutarch is cited as saying the Republic flourished as long as the tree stood.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Genucius Cippus suddenly found horn-like growths on his forehead, and augurs
    said he would be chosen king if he entered Rome again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Cippus chose voluntary banishment rather than return to Rome on terms that
    would make him king.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Romans erected a brazen horned statue over the gate by which Cippus departed,
    and the Senate conferred lands on him as a reward for patriotism.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage reports skeptical and rationalizing views of Cippus' horns, including
    Pliny's comparison with Actaeon and the suggestion that horn-like bodily excrescences
