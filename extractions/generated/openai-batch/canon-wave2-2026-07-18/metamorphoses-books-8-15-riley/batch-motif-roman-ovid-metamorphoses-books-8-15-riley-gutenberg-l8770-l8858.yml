    a great and manifest charge, and that the chiefs witnessed the evidence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ulysses says Philoctetes, son of Poeas, remains on Lemnos; the Greeks consented
    to this, and Ulysses advised Philoctetes to withdraw from warfare and voyage in
    order to rest from his pains.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ulysses says the prophets demand Philoctetes for the destruction of Troy and
