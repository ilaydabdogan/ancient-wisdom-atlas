canonical_text:
  quote: ''
  summary: Ulysses answers charges involving Palamedes and Philoctetes, recounts his
    capture of a Dardanian prophet and theft of the hidden statue of Minerva from
    Troy, argues that wisdom surpasses Ajax's bodily strength, and asks the chiefs
    for the contested arms. The chiefs are moved and award the arms to Ulysses. Ajax,
    overcome by anger and grief, seizes his own sword and declares he will use it
    against himself.
  language: English
  quote_policy: summarized
