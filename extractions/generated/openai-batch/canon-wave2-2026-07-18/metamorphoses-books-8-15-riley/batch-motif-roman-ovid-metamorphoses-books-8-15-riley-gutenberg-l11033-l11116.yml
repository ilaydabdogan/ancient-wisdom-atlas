  summary: The passage first gives explanatory interpretations of Ulysses at Circe’s
    court, the herb moly, animal transformations, and a comparison with Labè from
    the Arabian Nights. It then introduces the fable of Circe’s desire for Picus,
    Picus’s constancy to Canens, and Circe’s magical deception leading him into the
    forest, with later transformation and loss foreshadowed.
