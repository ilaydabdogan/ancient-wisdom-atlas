canonical_text:
  quote: ''
  summary: A starving father consumes his estate and sells his daughter. She appeals
    to Neptune at the shore, and Neptune changes her appearance into that of a male
    fisherman, allowing her to deceive the pursuing master and regain her form. When
    her father learns she can transform, he repeatedly sells her, and she escapes
    as various animals. His hunger finally drives him to eat his own limbs. The first-person
    speaker then says that he too can change form, including into a snake and a horned
    herd leader, though one horn is now gone.
  language: English
  quote_policy: summarized
