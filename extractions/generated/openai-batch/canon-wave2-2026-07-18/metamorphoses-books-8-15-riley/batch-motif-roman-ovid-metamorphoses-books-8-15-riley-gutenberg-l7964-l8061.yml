canonical_text:
  quote: "“once the greatest of men, but now the only bird {of thy kind}, Cæneus.”"
  summary: 'An attacker taunts Cæneus, calling him Cænis and referring to his birth
    as a woman and his male appearance. Cæneus wounds the horse-human attacker, while
    weapons repeatedly fail against Cæneus’ impervious body. Monychus urges the double-limbed
    attackers to crush Cæneus with stones, beams, mountains, and woods instead of
    trying to wound him. Trees are piled over Cæneus until he cannot draw breath.
    The outcome is reported in two ways: some say his body was driven to Tartarus,
    while Mopsus says he saw a tawny bird rise from the pile and identifies it as
    Cæneus. The allied fighters grieve and continue fighting the foes.'
  language: English
  quote_policy: quoted
