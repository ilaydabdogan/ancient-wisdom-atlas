canonical_text:
  quote: ''
  summary: Hecuba laments expected funeral dishonor, goes to the shore to fetch water,
    discovers the wounded corpse of Polydorus, and turns from grief to revenge. She
    deceives Polymnestor with talk of hidden treasure and blinds him with the aid
    of captive Trojan women. Thracians attack her with weapons and stones; she bites
    at the stones and barks or howls, and her fate moves Trojans, enemies, and gods.
    The passage then turns to Aurora, who mourns Memnon slain by Achilles and petitions
    Jove for honor to console his death.
  language: English
  quote_policy: summarized
