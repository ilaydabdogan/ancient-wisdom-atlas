canonical_text:
  quote: ''
  summary: The passage moves from Vertumnus revealing his youthful divine form to
    a nymph, to early Roman events involving Amulius, Numitor, Romulus, the Sabines,
    Tarpeia, Juno, Venus, the Naiads, and Janus. It then narrates Mars requesting
    that Jupiter fulfill a promise to raise Romulus to heaven; Jupiter signals assent
    with storm signs, Mars removes Romulus from earth, and Romulus assumes the heavenly
    form of Quirinus. Juno then sends Iris to comfort Hersilia and guide her toward
    seeing her husband.
  language: English
  quote_policy: summarized
