canonical_text:
  quote: "“Maiden, I am no monster, no savage beast; I am a God of the waters”"
  summary: A maiden later identified as Scylla sees a fish-tailed water god by the
    sea. The god says he was once a mortal fisherman, recounts how enchanted grass
    caused caught fish to return to the sea, how he ate the grass, abandoned land,
    and was purified by sea deities into an aquatic divine form. Scylla leaves him,
    and he goes in anger to Circe’s court.
  language: English
  quote_policy: quoted
