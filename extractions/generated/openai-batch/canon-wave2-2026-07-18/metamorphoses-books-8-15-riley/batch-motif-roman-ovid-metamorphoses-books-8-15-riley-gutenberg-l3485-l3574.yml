canonical_text:
  quote: ''
  summary: Byblis reproaches herself for revealing her passion in a hasty letter,
    interprets the fallen tablets as a divine warning, and resolves to persist despite
    recognizing guilt. Her brother flees and founds a city abroad. Byblis goes mad,
    openly declares her unlawful desire, leaves home, follows him through several
    regions, and is compared to Bacchanals. Exhausted, she collapses; Nymphs try to
    console her. Her tears are received by Naiads into an undrying channel, and Byblis
    dissolves into tears, becoming a named fountain flowing beneath an oak.
  language: English
  quote_policy: summarized
