canonical_text:
  quote: ''
  summary: A first-person warrior recounts episodes from a violent battle involving
    centaurs and Lapith-associated combatants. He describes an enemy wounded by javelin
    and sword, the beautiful centaur Cyllarus and his beloved Hylonome, their shared
    wandering and shared entry into the battle, Cyllarus’s death by an unknown javelin,
    and Hylonome’s suicide on the same weapon while embracing him. The narrator then
    recalls further killings, including Phaeocomes wielding a tree trunk, his own
    slayings, and a catalogue of other combatants.
  language: English
  quote_policy: summarized
