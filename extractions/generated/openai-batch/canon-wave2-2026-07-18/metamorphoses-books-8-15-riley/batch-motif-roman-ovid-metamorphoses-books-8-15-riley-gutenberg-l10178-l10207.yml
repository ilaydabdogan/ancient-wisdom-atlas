  quote: ''
  summary: 'Commentary summarizes ancient traditions about Glaucus: his variant genealogy,
    drowning and sea-god cult at Anthedon, the Ariadne episode and Bacchus''s punishment,
    appearances to the Argonauts and prophetic knowledge, an unwounded escape in battle,
    metamorphosis into a Triton, and the remembered place called Glaucus'' Leap.'
  language: English
  quote_policy: summarized
