canonical_text:
  quote: ''
  summary: 'The passage first gives an explanatory note on Cippus, who may originally
    have dreamed of horns and chosen exile after augural consultation. It then recounts
    Fable VII: during a Roman pestilence, Delphi directs the Romans to seek Apollo''s
    son Aesculapius at Epidaurus. Roman envoys petition for the god; Aesculapius appears
    in a dream, promises to come, and announces that he will take serpent form. In
    the temple he manifests as a golden, crested serpent, is recognized by the priest
    and worshipped, gives a triple hissing sign, leaves his old sanctuary, and proceeds
    toward the harbor. The fable summary states that on his arrival at Rome the contagion
    ceases and a temple is built in his honor.'
  language: English
  quote_policy: summarized
