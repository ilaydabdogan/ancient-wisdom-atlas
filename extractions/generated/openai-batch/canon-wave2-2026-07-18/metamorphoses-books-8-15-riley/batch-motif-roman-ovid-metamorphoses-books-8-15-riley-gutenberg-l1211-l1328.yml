canonical_text:
  quote: Them, the daughter of Latona, at length satiated with the calamities of the
    house of Parthaon, bears aloft on wings springing from their bodies...
  summary: Calydon mourns the death of Meleager. His father grieves, his mother kills
    herself with a sword, and his sisters perform intense mourning around his body,
    ashes, tomb, and inscribed name. The daughter of Latona then transforms most of
    the sisters into winged, horny-mouthed beings and sends them through the air,
    with named exceptions.
  language: English
  quote_policy: quoted
