candidate_motifs:
- id: motif:1
  label: Divine father and mortal mother of a hero
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Hercules is described as son of the king of the Gods by a mortal mother,
    with divine-origin noble qualities.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is explanatory commentary rather than the full narrative episode.
- id: motif:2
  label: Contrasting twin brother of divine hero
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  basis: The hero has a twin brother born from a mortal sire, used to make Hercules’
    perfection manifest.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The twin is mentioned briefly and mainly as contrast; the passage does
    not narrate a full twin cycle.
- id: motif:3
  label: Infant hero defeats serpents
  taxonomy_refs:
  - miraculous_child
  - serpent
  basis: Hercules displays strength and courage in infancy by strangling snakes.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Only a summary of the event is given.
- id: motif:4
  label: Heroic purifier who destroys monsters and brings valued goods home
  taxonomy_refs:
  - culture_hero
  basis: The labors are described as destruction of monsters and bringing home valuable
    productions from other regions, with Hercules preparing to purify the earth of
    violence.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage reports a scholarly interpretation of the labors and does
    not list all individual tasks.
- id: motif:5
  label: Descent to the underworld as conquest over death
  taxonomy_refs:
  - hero_descent
  - afterlife_journey_map
  - death_rebirth
  basis: Hercules’ greatest toil is descent into the underworld and dragging Cerberus
    to light as proof of victory over death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The afterlife geography is not elaborated beyond the underworld and Hades.
- id: motif:6
  label: Hero’s defeat of or conflict with death powers
  taxonomy_refs:
  - death_rebirth
  basis: The passage links Cerberus’ extraction, wounding Hades, and conflict with
    Death as forms of the hero’s victory over death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The old myth and Euripides example are cited in commentary, not narrated
    directly.
- id: motif:7
  label: Heroic servitude and gendered role reversal under a queen
  taxonomy_refs:
  - duality
  basis: Hercules becomes Omphale’s willing slave and exchanges club and lion’s skin
    for distaff and female robe.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents the reversal briefly
    as an episode of human weakness.
- id: motif:8
  label: Apotheosis through pyre and ascent to Olympus
  taxonomy_refs:
  - ascent
