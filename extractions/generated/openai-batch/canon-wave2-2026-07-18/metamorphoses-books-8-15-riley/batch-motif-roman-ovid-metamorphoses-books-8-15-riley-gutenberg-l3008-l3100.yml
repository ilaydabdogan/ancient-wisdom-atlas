canonical_text:
  quote: ''
  summary: The passage gives explanatory commentary on Hercules as an idealized divine-human
    hero, including his parentage, twin contrast, infant serpent-strangling, labors,
    descent to the underworld, servitude to Omphale, and ascent to Olympus after death
    by fire. It then introduces the fable of Lotis and Dryope, in which Lotis is transformed
    into a tree while fleeing Priapus, Dryope unknowingly breaks a branch from that
    tree and is transformed likewise, Iolaüs is restored to youth, and Iole begins
    telling Alcmena about Dryope’s earlier suffering at the hands of the god of Delphi
    and Delos and her marriage to Andræmon.
  language: English
  quote_policy: summarized
