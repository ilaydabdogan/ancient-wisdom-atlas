canonical_text:
  quote: ''
  summary: 'The passage gives explanatory traditions about Acis, Galatea, Polyphemus,
    and the Cyclopes, including Homeric, Theocritean, etymological, Sicilian, and
    rationalizing accounts. It then introduces the fable of Glaucus: fish revive after
    touching grass; Glaucus eats the grass, leaps into the sea, and becomes a sea
    god. In the narrative opening, Galatea stops speaking, the Nereids depart, Scylla
    returns to shore, and the newly transformed Glaucus pursues her until she flees
    to a mountain near the shore.'
  language: English
  quote_policy: summarized
