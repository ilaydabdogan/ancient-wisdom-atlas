canonical_text:
  quote: ''
  summary: After Jove assents, Memnon's funeral pile burns and black embers gather,
    become living winged birds, and are named Memnonides. The birds circle the pyre,
    divide into two hostile groups, fight, and fall as a sacrifice to Memnon's ashes,
    repeating the combat after the Sun has passed through the twelve signs. The passage
    then notes the barking daughter of Dymas and Aurora's continuing tears, which
    become dew over the world. Editorial notes include a cautious suggestion that
    the fatal bird-combat may allude to gladiatorial combats at Roman patrician funerals.
  language: English
  quote_policy: summarized
