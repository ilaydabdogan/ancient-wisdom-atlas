canonical_text:
  quote: ''
  summary: Hippolytus, now called Virbius, recounts his false accusation, cursed exile,
    sea-monster-induced chariot death, underworld experience, restoration to life,
    concealment, and renaming. Egeria grieves until she is transformed into a fountain.
    The passage then compares the astonishment at this transformation to the appearance
    of Tages from a clod and to Romulus’ lance taking root and becoming a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that Hippolytus died through his father's credulity and the
    deceit of his wicked stepmother, and then identifies himself as that same Hippolytus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter of Pasiphaë unsuccessfully tempted Hippolytus, accused him of
    the desire she herself had, and his father expelled him from the city while uttering
    imprecations against him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: As Hippolytus traveled by chariot near the Corinthian gulf, the sea rose into
    a mountain-like mass, roared, divided, and sent forth a horned bull that expelled
    seawater from its nostrils and mouth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hippolytus' attendants were afraid; his horses turned toward the sea, were
    frightened by the monster, and drove the chariot over high rocks before a wheel
    broke against a stump.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hippolytus was hurled from the chariot, tangled in the reins, dragged and
    torn apart, with his body becoming unrecognizable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hippolytus says he visited realms without light and bathed his lacerated body
    in the waves of Phlegethon.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Life was restored to Hippolytus through the remedies of the son of Apollo,
    potent herbs, and Pæonian aid, against Pluto's will.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cynthia hid Hippolytus in thick clouds, gave him an older appearance without
    recognizable features, placed him in a grove, and ordered him to exchange the
    name Hippolytus for Virbius.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Egeria's grief was not relieved; she threw herself at the base of a hill,
    dissolved into tears, and the sister of Phœbus formed a cool fountain from her
    body, dissolving her limbs into ever-flowing waters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The new transformation surprised the Nymphs, and the son of the Amazon was
    also astonished.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: An Etrurian ploughman saw a clod in the fields move on its own, assume human
    form, lose its earthy form, and open a new mouth to pronounce future destiny;
    the natives called him Tages, and he first taught the Etrurians to foretell future
    events.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
