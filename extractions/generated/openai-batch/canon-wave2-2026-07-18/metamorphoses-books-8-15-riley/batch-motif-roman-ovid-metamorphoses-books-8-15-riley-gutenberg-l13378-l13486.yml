  summary: A deity from Epidaurus, appearing in serpent or coiled form, is carried
    by a garlanded Ausonian or Latian ship along the Italian coast to Rome. He is
    welcomed with sacrifices, incense, and crowds; at Rome he chooses the river island
    as his habitation, resumes celestial form, ends mourning, and comes as restorer
    of health.
