  summary: The passage explains the combat of Hercules and Acheloüs as an allegory
    of river control, describes the broken horn as a source of fertility and as related
    to variant Cornucopia accounts, introduces Deïanira as the prize of Hercules'
    victory, summarizes Nessus' attempted abduction and fatal blood-dipped tunic,
    and begins the narrative of Hercules, Deïanira, and Nessus at the swollen river
    Evenus.
  language: English
  quote_policy: summarized
