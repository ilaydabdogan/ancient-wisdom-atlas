canonical_text:
  quote: I, myself, on the loosening of those bonds, was delivered.
  summary: Alcmena recounts that Juno made the birth goddess Ilithyia or Lucina impede
    Hercules' birth by sitting with joined limbs and murmured charms. Alcmena's servant
    Galanthis deceives the goddess by falsely announcing that Alcmena has already
    delivered, causing the goddess to loosen her hands; Alcmena then gives birth.
    The goddess punishes Galanthis by transforming her body, while Galanthis retains
    traits of her former activity and remains associated with Alcmena's house.
  language: English
  quote_policy: quoted
