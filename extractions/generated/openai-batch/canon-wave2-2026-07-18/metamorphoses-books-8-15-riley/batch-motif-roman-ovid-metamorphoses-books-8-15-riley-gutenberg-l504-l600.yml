canonical_text:
  quote: ''
  summary: Scylla, daughter of Nisus, steals her father's fatal purple lock at night
    and brings it to Minos as a pledge of love and as the life of her father. Minos
    rejects her crime and sails away. Scylla laments her exclusion from country, father,
    and Crete, leaps into the sea to follow his ship, and clings to it with strength
    from Cupid. Nisus, transformed into a sea eagle, attacks her; she releases the
    stern and is herself changed into the bird called Ciris.
  language: English
