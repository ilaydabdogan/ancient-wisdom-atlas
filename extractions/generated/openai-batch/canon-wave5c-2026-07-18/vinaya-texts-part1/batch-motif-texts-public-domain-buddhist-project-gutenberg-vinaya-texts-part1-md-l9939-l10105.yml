canonical_text:
  quote: ''
  summary: The passage prescribes how novices receive pabbajja ordination through
    shaving, yellow robes, respectful posture, and a threefold declaration of refuge.
    Sariputta ordains young Rahula. Suddhodana petitions the Buddha to require parental
    permission before sons are ordained, and the Buddha establishes that rule with
    an offence for violation. Later, at Savatthi, Sariputta asks about ordaining another
    boy while already having Rahula as a novice; the Buddha allows competent Bhikkhus
    to ordain as many novices as they can instruct. The Buddha then prescribes ten
    novice precepts and rules for punishing novices in five cases, including an exclusion
    from certain places; overbroad exclusion causes novices to leave, return to lay
    life, or go to other schools.
  language: English translation with Pali technical terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The novice ordination procedure includes cutting off hair and beard, putting
    on yellow robes, arranging the upper robe over one shoulder, saluting the Bhikkhus'
    feet with the head, squatting, and raising joined hands.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice is instructed to declare refuge in the Buddha, Dhamma, and Sangha,
    and the ordination is prescribed as a threefold declaration of taking refuge.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The venerable Sariputta confers pabbajja ordination on young Rahula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sakka Suddhodana approaches and salutes the Blessed One, asks for a boon,
    and requests that sons not be ordained without permission from father and mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Suddhodana describes his pain when the Blessed One, Nanda, and Rahula gave
    up the world, using an image of love for a son cutting inward to the marrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One rules that no son should receive pabbajja without father and
    mother permission, and that one who ordains a son without that permission commits
    a dukkata offence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After residing at Kapilavatthu, the Blessed One goes to Savatthi and dwells
    in Jetavana, the Arama of Anathapindika.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A family devoted to Sariputta sends a boy asking that Sariputta confer pabbajja
    on him; Sariputta hesitates because he already has the novice Rahula.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Blessed One allows a learned and competent Bhikkhu to ordain two novices
    or as many as he can exhort and instruct.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The novices ask how many precepts they have and what they should train in.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Blessed One prescribes ten novice precepts, consisting of abstinences
    from killing, stealing, impurity, lying, intoxicants, eating at forbidden times,
    entertainments, adornment, high or broad beds, and accepting gold or silver.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Novices who do not show reverence, confidence, or harmony toward Bhikkhus
    become the subject of complaint by the Bhikkhus.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'The Blessed One prescribes punishment for novices in five cases: seeking
    to deprive Bhikkhus of alms, seeking their misfortune, seeking that they find
    no residence, abusing and reviling them, or causing divisions among Bhikkhus.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The punishment is specified as forbidding novices certain places, but Bhikkhus
    who forbid the whole Sangharama cause novices to go away, return to the world,
    or go to Titthiya schools.
  category: sequence
  evidence_refs:
  - ev:8
