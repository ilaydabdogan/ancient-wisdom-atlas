canonical_text:
  quote: ''
  summary: The passage is a doctrinal and editorial discussion of the Chain of Causation,
    or twelve nidanas. It presents the twelve nidanas as a developed answer to the
    problem of the origin and destruction of suffering, relates them to the second
    and third Noble Truths, places Thirst/Desire within a larger causal sequence,
    and traces the sequence back to Ignorance. It defines Ignorance as not knowing
    suffering, its cause, its cessation, and the path to cessation; raises a question
    about who or what is ignorant before sentient attributes arise; discusses possible
    continuity across existences through ignorance, sankharas, and consciousness;
    and compares Buddhist Avidya with Brahmanical Upanishadic theories.
  language: English with transliterated Pali/Sanskrit terms
  quote_policy: summarized
