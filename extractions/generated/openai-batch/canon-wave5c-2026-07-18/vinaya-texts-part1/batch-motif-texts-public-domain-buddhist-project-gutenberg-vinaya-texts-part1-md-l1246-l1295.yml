    literature because writing had not yet been adapted for literary use, not because
    writing sacred books was considered irreverent. It then cites Ceylonese chronicle
    tradition that the Three Piṭakas and their commentary were first handed down orally
    and later written in books by Bhikkhus who wished the Dhamma to endure amid decay.
