canonical_text:
  quote: ''
  summary: 'The passage gives procedural instructions for upasampada ordination: an
    instructor announces the candidate, the candidate requests ordination before the
    Saṃgha, a competent Bhikkhu examines disqualifications, and the Saṃgha proceeds
    if the candidate is qualified. After ordination, the new Bhikkhu is to be told
    time data, the formula, the four Resources, and, after a case of sexual misconduct
    by a newly ordained Bhikkhu left alone, the four Interdictions and the need for
    a companion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructor is to come first, proclaim a motion before the Saṃgha, and
    then the candidate is told to come, adjust his upper robe, raise joined hands,
    and ask three times for upasampada ordination.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A learned, competent Bhikkhu is to proclaim a motion before the Saṃgha and
    ask the candidate about disqualifications and diseases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The candidate is described in the formal motion as free from disqualifications,
    with alms-bowl and robes in due state, and as asking for ordination with an upajjhāya.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: After ordination, the newly ordained Bhikkhu is to have the shadow measured
    and be told the season, date, part of the day, whole formula, and four Resources.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After a certain Bhikkhu was ordained, other Bhikkhus left him alone; on the
    way he met his former wife, who invited sexual intercourse, and he had intercourse
    with her and arrived late.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Bhikkhus reported the incident to the Blessed One, who prescribed that
    a companion be given to a newly ordained Bhikkhu and that the four Interdictions
    be told to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The first Interdiction says an ordained Bhikkhu must abstain from all sexual
    intercourse, even with an animal; a violator is compared to a man whose head has
    been cut off and cannot live with only the trunk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The second Interdiction says an ordained Bhikkhu must abstain from taking
    what is not given and from theft, even of a blade of grass; a violator is compared
    to a sear leaf loosed from its stalk that cannot become green again.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The third Interdiction says an ordained Bhikkhu must not intentionally destroy
    life down to a worm or ant, and identifies killing a human being or procuring
    abortion as disqualifying; a violator is compared to a great stone broken in two
    that cannot be reunited.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fourth Interdiction says an ordained Bhikkhu must not falsely attribute
    to himself a superhuman condition or meditative attainment; a violator is compared
    to a palm tree whose top sprout has been cut off and cannot grow again.
  category: speech
  evidence_refs:
  - ev:10
