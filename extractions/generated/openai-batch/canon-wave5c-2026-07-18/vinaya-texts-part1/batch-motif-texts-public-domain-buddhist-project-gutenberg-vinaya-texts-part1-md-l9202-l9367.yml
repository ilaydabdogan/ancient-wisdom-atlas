canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya narratives and rules concerning admission to
    the order: an exception for a Sakya formerly belonging to a Titthiya school; illness-motivated
    ordinations that lead to a prohibition on ordaining persons affected by five diseases;
    and the beginning of a case in which warriors seek ordination to avoid the evil
    and demerit of fighting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sakya by birth who formerly belonged to a Titthiya school is allowed to
    receive upasampada directly, without parivasa, as an exceptional privilege for
    the Buddha's kinsmen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:2
  text: 'Five diseases are said to prevail among the people of Magadha: leprosy, boils,
    dry leprosy, consumption, and fits.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: People affected with the five diseases ask Jivaka Komarabhacca to cure them,
    offering their possessions and service, but he says he is too occupied with duties
    to the king, royal household, and the Bhikkhu fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sick people reason that if they enter the religious life among the Sakyaputtiya
    Samanas, the Bhikkhus will nurse them and Jivaka will cure them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bhikkhus confer pabbajja and upasampada on the sick people, nurse them,
    and Jivaka cures them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Because many sick Bhikkhus require care, the Bhikkhus solicit food for the
    sick, food for attendants, and medicine; Jivaka also neglects some duties to the
    king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One man affected with the five diseases plans to enter the order for nursing
    and cure, then return to the world once free from sickness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After being ordained, nursed, and cured, the man returns to the world, and
    Jivaka questions him about why he had entered the religious life.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Jivaka becomes angry and asks the Blessed One that the Bhikkhus not confer
    pabbajja on persons affected with the five diseases.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Blessed One teaches Jivaka, then tells the Bhikkhus that no person affected
    with the five diseases should receive pabbajja; the one who confers it commits
    a dukkata offence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The border provinces of King Seniya Bimbisara are agitated, and the king orders
    army officers to search through them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Distinguished warriors reflect that fighting produces evil and great demerit,
    and they seek pabbajja among the Sakyaputtiya Samanas in order to desist from
    evil and do good.
  category: speech
  evidence_refs:
  - ev:8
