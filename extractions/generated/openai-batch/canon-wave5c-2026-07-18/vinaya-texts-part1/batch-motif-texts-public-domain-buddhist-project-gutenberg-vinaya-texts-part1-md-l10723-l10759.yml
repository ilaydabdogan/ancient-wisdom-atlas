canonical_text:
  quote: ''
  summary: 'A fragment permits a person who cannot obtain nissaya to live without
    it while intending to take nissaya if a proper giver appears. Subsequent cases
    concern upasampada ordination: Mahakassapa asks Ananda to recite a proclamation
    for a candidate; Ananda refuses to pronounce Mahakassapa''s name because of his
    reverence; the Blessed One allows use of the family name in the proclamation.
    When two candidates quarrel over who will be ordained first, the Blessed One allows
    two persons to be ordained by one proclamation. The passage ends as another quarrel
    among candidates seeking ordination from different Theras begins.'
  language: English
  quote_policy: summarized
