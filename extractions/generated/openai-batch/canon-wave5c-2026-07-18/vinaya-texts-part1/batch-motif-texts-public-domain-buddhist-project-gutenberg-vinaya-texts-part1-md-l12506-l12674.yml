canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya prescriptions for Uposatha observance and monastic
    communal order: sweeping the Uposatha hall, preparing seats, lighting a lamp,
    providing drink and food, regulating travel by unlearned monks, receiving a learned
    monk, seeking instruction in the Patimokkha, avoiding vassa where necessary ritual
    knowledge is absent, and allowing a sick monk to declare his parisuddhi through
    another monk.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus ask who should sweep the Uposatha hall, and the Blessed One prescribes
    that a Thera order a young Bhikkhu to sweep it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young Bhikkhu ordered by the Thera is not to refuse sweeping unless sick;
    refusal is treated as a dukka/a offence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When there are no seats in the Uposatha hall, Bhikkhus sit on the ground and
    their bodies and robes become dusty; the Blessed One prescribes prepared seats.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When there is no lamp in the Uposatha hall, Bhikkhus in darkness tread on
    one another's bodies and robes; the Blessed One prescribes lighting a lamp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Resident Bhikkhus who do not provide drink or food cause incoming Bhikkhus
    to be annoyed and angry; the Blessed One prescribes providing drink and food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ignorant, unlearned Bhikkhus travelling to the four quarters without asking
    leave are to be questioned by their a/£ariyas and upa^Myas about where and with
    whom they will go.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If ignorant, unlearned travelling Bhikkhus name ignorant, unlearned companions,
    their teachers and preceptors should not allow them to go; permission or departure
    without permission results in a dukka/a offence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When ignorant, unlearned resident Bhikkhus do not know Uposatha, the Uposatha
    service, the Patimokkha, or its recital, and a learned Bhikkhu arrives, they are
    instructed to receive him kindly, attend to him, speak friendly words, and provide
    cleaning and rinsing items.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: On Uposatha day, if resident Bhikkhus lack knowledge of Uposatha and the Patimokkha,
    they should send a Bhikkhu to a neighbouring residence to learn the Patimokkha,
    or all go to a residence where it is known.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: During vassa, if Bhikkhus in a residence lack knowledge of Uposatha and the
    Patimokkha, they may send one Bhikkhu away for seven days to learn; if this fails,
    they should not keep vassa there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the Sangha is to assemble for Uposatha and a sick Bhikkhu is absent,
    the Blessed One prescribes that the sick Bhikkhu declare his parisuddhi through
    a specified procedure before one Bhikkhu.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The prescribed parisuddhi procedure includes adjusting the upper robe to cover
    one shoulder, squatting, raising joined hands, and reciting a declaration for
    the fraternity.
  category: sequence
  evidence_refs:
  - ev:9
