canonical_text:
  quote: ''
  summary: The passage narrates the recognition and ordination of Sariputta and Moggallana,
    public criticism of the Buddha’s drawing men into religious life, the Buddha’s
    prescribed response that the Tathagatas lead by truth, the cessation of the criticism
    after seven days, and a later complaint about bhikkhus without preceptors behaving
    improperly during alms rounds and in dining halls.
  language: English
  quote_policy: summarized
