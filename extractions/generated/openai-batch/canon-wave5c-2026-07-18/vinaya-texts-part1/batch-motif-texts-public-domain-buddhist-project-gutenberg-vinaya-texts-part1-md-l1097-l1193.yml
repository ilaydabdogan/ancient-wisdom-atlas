  summary: The passage discusses whether Vinaya-related Buddhist literature was transmitted
    only by memory or also by writing. It gives examples showing that writing existed
    and was used for royal notices, livelihood, private communications, disciplinary
    hypotheticals, and learning by Sisters of the Order. It then argues that, despite
    known writing, sacred literature had not yet been recorded in manuscripts because
    the Vinaya’s detailed treatment of monastic property contains no reference to
    manuscripts.
