  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A sick Bhikkhu sends a messenger saying he is sick and longs for the Bhikkhus
    to come.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: For five monastic classes, the Blessed One allows Bhikkhus to go within the
    seven-day condition even if not sent for, and all the more if sent for.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When visiting a sick Bhikkhu, the visiting Bhikkhus may intend to obtain food
