canonical_text:
  quote: ''
  summary: The passage gives rules allowing Bhikkhus to leave during the rainy season
    for specified reasons if the matter can be completed within seven days and they
    return within seven days. Permitted occasions include summons by listed religious
    or lay classes, visits to donors who have built residences or other facilities,
    learning an endangered suttanta, visiting the sick, and helping a Bhikkhu afflicted
    by inward struggles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus are allowed to go during the rainy season when the matter can be
    accomplished within seven days, when summoned by one of seven named classes, and
    must return within seven days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An upasaka who has built a Vihara for the Sangha may send a messenger asking
    the Bhikkhus to come so that he may bestow gifts, hear the Dhamma, and see the
    Bhikkhus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists built facilities including a Vihara, storied house, attic,
    cave, cell, store-room, refectory, fire-room, well, well house, lotus-pond, pavilion,
    park, and other structures.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Buildings may be made for the Sangha, for groups or individuals among Bhikkhus
    and Bhikkhunis, for trainees and novices, or for the builder's own use.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A lay supporter may summon Bhikkhus for household or personal matters, including
