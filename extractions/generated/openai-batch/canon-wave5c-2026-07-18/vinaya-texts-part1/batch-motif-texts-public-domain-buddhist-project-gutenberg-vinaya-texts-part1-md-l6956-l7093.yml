canonical_text:
  quote: ''
  summary: The passage first notes that an exposition on the eye and its objects is
    repeated for the other sense organs. The Blessed One travels from Gayasisa to
    Rajagaha with one thousand Bhikkhus formerly known as Gatilas and stays in the
    Latthivana pleasure garden near the sacred shrine of Supatittha. King Seniya Bimbisara
    hears of Gotama’s fame as a fully awakened teacher, visits him with a large assembly
    of Magadha Brahmanas and householders, and the assembly wonders whether Gotama
    or Uruvela Kassapa is the spiritual superior. The Blessed One perceives their
    thought and asks Kassapa why he abandoned his sacred fire and fire sacrifice.
    Kassapa replies that sacrifices concern sensory pleasures and that, after seeing
    the peaceful state of Nirvana, he no longer delights in sacrifices and offerings.
  language: English
  quote_policy: summarized
