canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya procedures for the Pavāraṇā ceremony: known offenses
    and guilty persons must be reported before the assembly; some matters may be raised
    later if not fully known; already-settled matters must not be raised again. It
    then describes resident Bhikkhus facing litigious neighboring Bhikkhus who intend
    to inhibit their Pavāraṇā, prescribing altered timing, quick assembly, hospitality
    to unexpected arrivals, possible postponement, and a rule about a sick Bhikkhu
    inhibiting a healthy one.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a deed is known but the guilty person is not known, the assembly is instructed
    to require that the deed be reported before holding Pavāraṇā, because those holding
    it should be pure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a guilty person is known but the deed is not known, the assembly is instructed
    to require that the person be reported before holding Pavāraṇā, because those
    holding it should be complete.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When both a deed and the guilty person are known, the assembly is instructed
    to require that both be reported before holding Pavāraṇā, because those holding
    it should be both pure and complete.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If either the deed or the guilty person becomes known only after Pavāraṇā,
    it is permitted to bring the matter forward then; if both were known before Pavāraṇā
    and the matter is raised again after settlement, the one raising it incurs a pācittiya
    offense.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A group of Bhikkhus who are companions and friends enter Vassa in a district
    of Kosala, while nearby litigious Bhikkhus enter Vassa intending to inhibit their
    Pavāraṇā after the residence period.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One prescribes that the resident Bhikkhus may hold Uposatha two
    or three times on the fourteenth day so that they can hold Pavāraṇā before the
    litigious Bhikkhus arrive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the litigious Bhikkhus approach the district, the resident Bhikkhus are
    told to assemble quickly, hold Pavāraṇā, and then tell the visitors that they
    have already held it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the litigious Bhikkhus arrive unexpectedly, the resident Bhikkhus are told
    to prepare seats, water for foot washing, foot-stools, and towels, meet them,
    take their bowls and robes, offer water to drink, and then go outside the boundary
    to hold Pavāraṇā.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the resident Bhikkhus cannot complete Pavāraṇā in that way, a learned and
    competent resident Bhikkhu is to proclaim a formal motion to hold Uposatha, recite
    the Pātimokkha, and postpone Pavāraṇā to the next new-moon day.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the litigious Bhikkhus remain until the full-moon day of the komudī cātumāsini,
    all the Bhikkhus must hold Pavāraṇā then whether they like it or not.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: If a sick Bhikkhu inhibits the Pavāraṇā of a healthy Bhikkhu, the response
    is that a sick person cannot endure questioning and should wait until recovery.
  category: speech
  evidence_refs:
  - ev:10
