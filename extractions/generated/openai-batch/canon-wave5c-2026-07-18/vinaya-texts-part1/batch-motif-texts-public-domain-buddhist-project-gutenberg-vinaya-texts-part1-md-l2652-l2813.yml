  summary: The passage opens the recitation of the ninety-two Pa/£ittiya rules, described
    as rules regarding matters requiring expiation, and lists rules 1-21. These rules
    address falsehood and abusive speech, Dhamma instruction and disclosures to persons
    not fully admitted or to women, sleeping and dwelling arrangements, harm to ground,
    vegetation, and living creatures in water, care of common monastic property, interpersonal
    conduct in shared dwellings, construction limits, and unauthorized exhortation
    of Bhikkhunis.
