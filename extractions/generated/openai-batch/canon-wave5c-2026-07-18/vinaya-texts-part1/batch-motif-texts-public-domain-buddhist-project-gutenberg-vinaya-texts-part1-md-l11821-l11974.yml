canonical_text:
  quote: ''
  summary: The passage gives monastic rules for conferring and abolishing the character
    of ti/£ivarena avippavasa on a Saṅgha boundary, explains robe-loss problems that
    lead to excluding villages and village neighborhoods, defines default limits for
    residence and Uposatha when no boundary is fixed, and prohibits later boundaries
    from overlapping or enclosing earlier ones.
  language: English translation with Pali technical terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learned, competent Bhikkhu is instructed to proclaim a formal motion before
    the Saṅgha to confer the character of ti/£ivarena avippavasa on a boundary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The relevant boundary is described as one determined for common residence
    and for communion of Uposatha.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: Some Bhikkhus deposited their robes in a house; the robes were lost, burnt,
    or eaten by rats, and the Bhikkhus became badly dressed with coarse robes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An editorial note glosses ti/£ivarena avippavasa as not parting with the three
    robes belonging to a Bhikkhu's usual requisites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One instructs that the Saṅgha may confer the character of ti/£ivarena
    avippavasa on the boundary, excepting villages and the neighborhood of villages.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage prescribes the sequence that a boundary is first determined and
    the ti/£ivarena avippavasa decree follows; when abolishing, the decree is abolished
    before the boundary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If no boundary has been determined, the village or market-town boundary near
    which a Bhikkhu dwells is treated as the boundary for common residence and Uposatha.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a forest without villages, common residence and Uposatha extend seven abbhantaras
    all around.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A river, sea, or natural lake cannot be a boundary; in such water bodies,
    common residence and Uposatha extend as far as an average man can spirt water
    all around.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Chabbaggiya Bhikkhus made one boundary overlap and also encompass another
    boundary determined earlier by other Bhikkhus.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: For overlapping or encompassing boundaries, the earlier act is declared lawful
    and valid, the later act unlawful and invalid; the offender commits a dukkaṭa
    offence, and an interstice between boundaries is prescribed.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
