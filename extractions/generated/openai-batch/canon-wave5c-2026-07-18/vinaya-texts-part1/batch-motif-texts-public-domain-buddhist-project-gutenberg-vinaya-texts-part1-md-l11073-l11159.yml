canonical_text:
  quote: ''
  summary: 'A monk who had been expelled for refusing to acknowledge an offence returns
    from lay life and asks for higher ordination. The Blessed One gives a conditional
    procedure: the community should ask whether he will acknowledge, atone for, or
    renounce the relevant offence or false doctrine before admitting, ordaining, restoring,
    or again expelling him. Parallel rules are given for refusal to atone and refusal
    to renounce false doctrine.'
  language: English translation with Pali terms
  quote_policy: summarized
