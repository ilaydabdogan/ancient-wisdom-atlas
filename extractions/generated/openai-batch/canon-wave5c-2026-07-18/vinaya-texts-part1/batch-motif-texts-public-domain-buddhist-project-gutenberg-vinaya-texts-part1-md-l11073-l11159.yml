- id: obs:1
  text: A Bhikkhu under expulsion for refusing to see an offence committed by himself
    returned to the world, later came back to the Bhikkhus, and asked for upasampada
    ordination.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhus reported the case to the Blessed One.
  category: action
  evidence_refs:
