- id: obs:3
  text: For a returning monk expelled for refusal to see an offence, the Blessed One
    instructs the community to ask whether he will see that offence before admitting
    him to pabbajja ordination; an affirmative answer permits admission and a negative
    answer prevents it.
  category: speech
  evidence_refs:
