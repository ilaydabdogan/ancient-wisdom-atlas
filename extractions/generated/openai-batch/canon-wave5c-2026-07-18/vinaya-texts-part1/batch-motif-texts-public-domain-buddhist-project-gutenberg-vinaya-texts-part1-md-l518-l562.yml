  summary: The passage discusses the textual history of Vinaya materials, arguing
    that the Sutta-vibhanga and Khandhakas likely took their present form at about
    the same period. It states that both works surround older material with similar
    narrative settings, include some fragments of ancient legend or tradition, and
    contain many meagre narratives that appear to be inventions explaining rules or
    ceremonies.
