canonical_text:
  quote: ''
  summary: The passage gives Vinaya procedures for former members of Titthiya schools
    who seek Buddhist ordination. One class is barred from upasampada after returning
    to the former school, while others must undergo a four-month probation. The text
    prescribes bodily preparation, robes, gestures, triple refuge recitation, a threefold
    request to the Saṅgha, a formal motion, and approval by silence. It then lists
    behaviors and dispositions by which the probationer fails to satisfy the Bhikkhus,
    including improper conduct, lack of skill or zeal, and continued emotional allegiance
    to the former school over the Buddha, Dhamma, and Saṅgha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A former member of a Titthiya school who silenced his upajjhaya when remonstrated
    with according to the Dhamma and returned to that same school is not to receive
    upasampada if he comes back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other former members of Titthiya schools who desire pabbajja and upasampada
    in this doctrine and discipline are to undergo a four-month parivasa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The preparation for the applicant includes cutting off hair and beard, putting
    on yellow robes, arranging the upper robe to cover one shoulder, saluting the
    Bhikkhus' feet, squatting, raising joined hands, and reciting refuge in the Buddha,
    Dhamma, and Saṅgha three times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The former Titthiya applicant is instructed to approach the Saṅgha and request
    a four-month parivasa three times.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A learned and competent Bhikkhu proclaims a formal motion before the Saṅgha
    to impose the four-month parivasa.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the formal decision, those in favor are to remain silent, and those not
    in favor are to speak; the Saṅgha's silence is treated as approval.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The probationer fails to satisfy the Bhikkhus if he enters the village too
    early and returns too late, or if he frequents the society of harlots, widows,
    adult girls, eunuchs, or Bhikkhunīs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The probationer also fails if he lacks skill, diligence, practical ability,
    ability to direct others, or keen zeal when doctrine is preached or questions
    are put concerning morality, contemplation, and wisdom.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A decisive failure occurs if the probationer is angry at criticism of his
    former school or pleased by criticism of the Buddha, Dhamma, and Saṅgha, or if
    he is pleased by praise of the former school and angry at praise of the Buddha,
    Dhamma, and Saṅgha.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a former Titthiya has failed in these ways, upasampada ordination should
    not be conferred on him.
  category: sequence
  evidence_refs:
  - ev:7
