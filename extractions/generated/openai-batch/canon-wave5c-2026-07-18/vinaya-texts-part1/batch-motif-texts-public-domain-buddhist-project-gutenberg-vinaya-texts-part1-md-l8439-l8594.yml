canonical_text:
  quote: ''
  summary: 'A Brahmana seeks ordination after seeing Bhikkhus receive comfortable
    support, but later admits he entered religious life for food. The Buddha rebukes
    him and prescribes that newly ordained Bhikkhus be told the four Resources: alms
    food, rag robes, tree-foot dwelling, and decomposing urine medicine, with specified
    extra allowances. A later candidate refuses ordination when told these Resources
    beforehand, so the Buddha orders that they be told immediately after upasampada.
    The passage also prescribes a quorum of ten Bhikkhus for upasampada and introduces
    an episode involving Upasena Vangantaputta and his saddhiviharika.'
  language: English
  quote_policy: summarized
