canonical_text:
  quote: a Bhikkhu may confer the upasampada ordination, give a nissaya, and ordain
    a novice
  summary: The passage enumerates conditions under which a Bhikkhu may or may not
    confer upasampada ordination, give nissaya, and ordain a novice. Qualifications
    include moral and doctrinal competence, ability to care for and instruct pupils,
    knowledge of offences and the Patimokkhas, and seniority after ordination. The
    passage ends one enumerated section, begins another, and introduces a case of
    a Bhikkhu formerly connected with a Titthiya school who returns to ask for upasampada.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A Bhikkhu may confer upasampada, give nissaya, and ordain a novice in specified
    cases when he possesses full perfection in matters such as moral practices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikkhu should not confer these functions when he lacks full perfection
    in moral practices or self-concentration and cannot help others attain those qualities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: One list disallows a Bhikkhu who is unbelieving, shameless, fearless of sinning,
    indolent, and forgetful; the corresponding permitted list names believing, modest,
    fearful of sinning, strenuous, and ready memory.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu should not confer the functions if he has moral transgressions,
    transgressions in conduct, heresy, lack of learning, or foolishness; the counterpart
    list allows one who is not guilty in those ways and is learned and wise.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Eligibility includes ability to nurse or arrange nursing for a sick dependent,
    appease discontent, dispel doubts according to the Dhamma, and know offences and
    atonement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Eligibility includes ability to train a dependent in proper conduct and morality,
    instruct him in Dhamma and Vinaya, and address false doctrine according to the
    Dhamma.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Further qualifications include knowing what is an offence or not, what is
    light or grave, knowing the two Patimokkhas in their entirety, and having completed
    ten years or more after upasampada.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage marks the end of sixteen times five cases concerning admissibility
    of upasampada and then introduces six-case lists.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: A Bhikkhu formerly belonging to a Titthiya school, who had silenced his upajjhaya
    during remonstration and returned to that Titthiya school, comes back and asks
    the Bhikkhus for upasampada.
  category: sequence
  evidence_refs:
  - ev:8
