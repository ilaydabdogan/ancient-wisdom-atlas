  summary: The passage records questions by Bhikkhus and rulings by the Blessed One
    about Uposatha days and services, lawful completion of the congregation, five
    ways of reciting the Patimokkha, abridged recitation only in cases of danger,
    and authorization for Dhamma preaching or Vinaya questions before the Saṅgha.
