  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhus ask how many Uposatha services there are, and the Blessed One
    lists four kinds based on lawfulness or unlawfulness and completeness or incompleteness
    of the congregation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One disallows three forms of Uposatha service and allows only
    the service held lawfully by a complete congregation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bhikkhus ask about ways of reciting the Patimokkha, and the Blessed One
