canonical_text:
  quote: ''
  summary: The passage recites two Patimokkha rules concerning undetermined disciplinary
    matters involving a bhikkhu seated privately with a woman. Depending on the setting,
    the report of a trustworthy believing woman, and the bhikkhu's acknowledgment,
    the matter may be handled under specified classes of rules. The recitation closes
    by asking the assembled venerable ones three times whether they are pure in this
    matter and interpreting their silence as purity.
