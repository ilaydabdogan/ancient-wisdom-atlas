- id: obs:2
  text: The first rule concerns a bhikkhu sitting with a woman, one man with one woman,
    in secret on a secluded seat described as suitable for sexual intercourse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'In the first rule, a believing woman trustworthy in speech who has seen the
    pair may lay a charge under one of three rule categories: Parajika, Samghadisesa,
    or Pacittiya.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the bhikkhu acknowledges that he sat in the described way, he is to be
