  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Blessed One prescribes that on Uposatha day the Theras should assemble
    first.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Rajagaha, several Bhikkhu residences within the same boundary quarrelled
    about which residence should host Uposatha.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: For several residences within one boundary, the Bhikkhus are told to assemble
