  text: The Blessed One forbids reciting the Patimokkha in successive cells without
    appointing a definite place and prescribes holding Uposatha after fixing an Uposatha
    hall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The possible appointed places include a Vihara, an Addhayoga, a storied building,
    a house, or a cave.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A learned, competent Bhikkhu is to proclaim a formal motion before the Sangha
    to appoint a named Vihara as Uposatha hall.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When two Uposatha halls were fixed in one district, Bhikkhus assembled in
    both places because they expected Uposatha to be held in different locations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rule given for that situation is to avoid fixing two Uposatha halls in
    one district, abolish one, and hold Uposatha in only one place.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When an appointed Uposatha hall was too small, some Bhikkhus heard the Patimokkha
    while sitting outside the fixed site.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Blessed One states that whether seated inside or outside the fixed site,
    a Bhikkhu has duly held Uposatha if he hears the Patimokkha.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A surrounding uposatha-pamukha may be determined by proclaiming landmarks
    and a formal Sangha motion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Young Bhikkhus who assembled first left when the Theras had not yet come,
