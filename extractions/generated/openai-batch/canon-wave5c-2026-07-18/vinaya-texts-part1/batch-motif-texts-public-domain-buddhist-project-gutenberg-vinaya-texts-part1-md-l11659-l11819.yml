canonical_text:
  quote: ''
  summary: 'The passage gives monastic regulations for holding Uposatha and reciting
    the Patimokkha: an appointed hall must be fixed by formal Sangha motion; duplicate
    halls in one district must be reduced to one; a surrounding area may be determined
    by landmarks when the hall is too small; senior monks should assemble first; residences
    within one boundary should hold Uposatha together; and an incident involving Maha
    Kassapa crossing a river leads into a rule about a boundary for common residence
    and Uposatha communion.'
  language: English translation
  quote_policy: summarized
literal_observations:
