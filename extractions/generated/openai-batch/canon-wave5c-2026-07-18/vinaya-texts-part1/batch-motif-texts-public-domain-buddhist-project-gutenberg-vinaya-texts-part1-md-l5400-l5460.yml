canonical_text:
  quote: ''
  summary: The Blessed One declares that Kondanna has perceived the doctrine and receives
    a name marking that perception. Kondanna is described as having seen and mastered
    the Truth, asks for ordination, and is admitted by the Blessed One. Vappa and
    Bhaddiya receive instruction, obtain the pure and spotless Eye of the Truth concerning
    origination and cessation, ask for ordination, and are admitted. The group lives
    on alms brought by three bhikkhus. A translator note mentions the thirty-three
    devas of Vedic mythology and ascending divine worlds.
  language: English with Pali terms
  quote_policy: summarized
