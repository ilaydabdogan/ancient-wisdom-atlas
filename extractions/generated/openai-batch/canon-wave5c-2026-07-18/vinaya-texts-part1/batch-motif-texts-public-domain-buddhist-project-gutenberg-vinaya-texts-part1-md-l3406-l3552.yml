canonical_text:
  quote: ''
  summary: The passage gives Vinaya rules concerning a Samaṇera who asserts that dangerous
    qualities are not sufficiently dangerous, the admonition and expulsion procedure
    for him, and penalties for Bhikkhus who associate with him after expulsion. It
    then gives rules on submitting to precepts, not disparaging or neglecting the
    Pātimokkha recitation, and offenses involving anger, blows, threatening gestures,
    groundless serious charges, and intentionally causing another monk uneasiness
    of conscience.
  language: English translation with Pali terms and transliterations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Samaṇera is described as saying that, as he understands the Dhamma proclaimed
    by the Blessed One, cultivating qualities called dangerous by the Blessed One
    does not create sufficient danger to prevent spiritual gifts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhus are instructed to tell the Samaṇera not to speak that way or
    bear false witness against the Blessed One, and to state that dangerous qualities
    have been declared full of danger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Samaṇera persists after admonition, he is told he may no longer refer
    to the Blessed One as his Teacher, loses the privilege of sleeping in the same
    place with Bhikkhus for two or three nights, and is ordered to depart.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu commits a Pa/£ittiya if he encourages, supports, eats with, or sleeps
    in the same place with the expelled Samaṇera.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
