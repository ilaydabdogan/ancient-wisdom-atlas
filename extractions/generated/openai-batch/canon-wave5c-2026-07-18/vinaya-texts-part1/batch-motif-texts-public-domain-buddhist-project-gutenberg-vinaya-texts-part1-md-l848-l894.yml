  summary: A scholarly introduction discusses whether an edict addressed a council,
    then examines the meaning and derivation of the term Patimokkha. It contrasts
    an Old Commentator’s explanation from mukha with the Northern Buddhist Sanskrit
    form Pratimoksha, which is said to support derivation from the root muk, meaning
    to free oneself or get rid of. The passage connects this derivation with the confession
    liturgy and its recitation and questions.
