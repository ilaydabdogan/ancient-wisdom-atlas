canonical_text:
  quote: ''
  summary: Rules are given for Pavaraṇa procedure when one monk inhibits another's
    Pavaraṇa, especially when a sick monk is involved. The passage then describes
    monks in Kosala who, after entering Vassa and finding a comfortable dwelling place,
    seek permission to postpone Pavaraṇa so that incoming monks will not displace
    them. The Blessed One allows an agreed procedure, including assembly, formal motion,
    Uposatha, Patimokkha recitation, later Pavaraṇa, and special handling of monks
    who travel or return before the appointed day.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Pavaraṇa is held and a monk inhibits the Pavaraṇa of a sick monk, the
    community is instructed to say that a sick person cannot endure being questioned
    and that reproof should wait until recovery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the inhibiting monk reproves the sick monk after being told to wait, he
    incurs a pācittiya offence of disregard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a healthy monk inhibits the Pavaraṇa of another healthy monk, the Saṅgha
    is to question and examine both, treat them according to the law, and then hold
    Pavaraṇa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A group of companion and friend Bhikkhus entered Vassa in a district of Kosala,
    lived in unity and concord, and found a comfortable dwelling place.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kosala Bhikkhus feared that if they held Pavaraṇa, other Bhikkhus who
    had already held Pavaraṇa might come on a journey and occupy the comfortable place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One allows the Bhikkhus in that situation to agree upon pavaraṇāsaṅgaha,
    a keeping back or postponement of Pavaraṇa.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The prescribed agreement requires all to assemble and a learned, competent
    Bhikkhu to proclaim a formal motion before the Saṅgha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The formal motion states that the Saṅgha should hold Uposatha and recite the
    Patimokkha, and hold Pavaraṇa on the next komudī cātumāsini day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the agreement on pavaraṇāsaṅgaha, a Bhikkhu who wishes to travel for
    business is told to hold Pavaraṇa and go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the traveling Bhikkhu's Pavaraṇa is inhibited, or if he inhibits another
    monk's Pavaraṇa, the passage gives formulaic replies and directs the Saṅgha to
    examine disputes according to law.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
