- id: obs:1
  text: A slave ran away, was ordained with the Bhikkhus, and was recognized by his
    masters, who proposed taking him back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One states that no slave should receive the pabba^a ordination
    and that conferring it on a slave is a dukka/a offence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bald-headed smith, after quarreling with his father and mother, went to
    the Arama and received pabba^a with the Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The smith's parents searched for him, asked the Bhikkhus about him, later
    found him ordained, and complained that the Sakyaputtiya Samaras had lied.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the complaint about the smith, the Blessed One prescribes that the Sangha's
    permission be asked before newly coming Bhikkhus are shaved.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Upali's parents considered writing, arithmetic, and money-changing as possible
    livelihoods for him but rejected each because of possible bodily discomfort or
    harm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Upali's parents considered ordination with the Sakyaputtiya Samaras because
    they thought the monks kept commodious precepts, lived comfortably, ate good meals,
    and slept on beds protected from wind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Young Upali urged the other boys to get ordained; the boys sought parental
    consent for going forth into the houseless state, received it, and were given
    pabba^a and upasampada by the Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At dawn the newly ordained boys cried out for rice-milk and food, threw bedding
    about, and made it wet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Blessed One asked Ananda about the noise, learned the cause, questioned
    the Bhikkhus, and rebuked them for knowingly conferring upasampada on persons
    under twenty years of age.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Blessed One says a person under twenty cannot endure cold, heat, hunger,
    thirst, insects, storms, sun-heat, reptiles, abusive language, and severe bodily
    pains, while a person of twenty can endure them.
  category: speech
  evidence_refs:
  - ev:8
