canonical_text:
  quote: ''
  summary: 'The passage gives several Vinaya rulings on admission to the Bhikkhu order:
    a runaway slave is ordained and then barred from receiving pabba^a; a bald-headed
    smith is ordained after a quarrel with his parents, whose search and complaint
    lead to a rule about asking the Sangha''s permission before shaving newcomers;
    young Upali and a company of seventeen boys obtain parental consent and are ordained,
    but their dawn disturbance and demands for food lead the Blessed One to rebuke
    the ordination of persons under twenty and to state that they cannot endure ascetic
    hardships.'
  language: English
  quote_policy: summarized
