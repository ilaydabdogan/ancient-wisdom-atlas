canonical_text:
  quote: Whosoever have incurred a fault, let him declare it ! If no fault have been
    incurred it is meet to keep silence !
  summary: The introduction to the Patimokkha is recited for an assembled Chapter
    on the sacred full- or new-moon Uposatha day. The assembly is asked to announce
    purity, faults are to be declared, silence is treated as confirmation of purity,
    and the question of purity is put three times before the reciter concludes that
    the venerable ones are pure.
  language: English
  quote_policy: quoted
