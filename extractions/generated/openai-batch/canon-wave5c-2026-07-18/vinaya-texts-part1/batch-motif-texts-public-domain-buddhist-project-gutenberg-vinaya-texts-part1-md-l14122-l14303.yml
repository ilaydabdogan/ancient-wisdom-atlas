canonical_text:
  quote: ''
  summary: 'A sequence of Vinaya rulings gives conditions under which Bhikkhus may
    leave rainy-season residence: to visit sick parents or specified persons, to conduct
    Sangha business, to avoid dangers such as beasts, snakes, robbers, demons, fire,
    or water, and to follow a relocated supporting village. The excerpt ends with
    a report of insufficient food for Bhikkhus in Kosala.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu's mother is sick and sends a messenger saying she longs for her
    son's coming.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhu considers existing allowances for travel during Vassa and is uncertain
    because his sick mother is not a lay-devotee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One allows Bhikkhus to go during the rainy season for seven listed
    classes of persons, whether sent for or not, if the matter can be completed within
    seven days; they are to return within seven days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Specific sickness cases are stated for a Bhikkhu's father, brother, sister,
    relation, and a person who used to live with the Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a Sangha Vihara has gone to ruin and a lay devotee offers forest-cut
    wood if the Bhikkhus fetch it, the Blessed One allows travel on Sangha business
    with return within seven days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bhikkhus in a Kosala district who entered Vassa are attacked by beasts of
    prey, and the ruling treats this as danger allowing them to leave the residence
    without guilt for interrupting Vassa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Snake attacks, robbery, and demonic affliction are each treated as danger
    cases permitting departure from the Vassa residence.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Fire or water destroying a nearby village or the Bhikkhus' resting places,
    causing lack of food or shelter, is treated as a danger case permitting departure
    from Vassa residence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When a nearby village is transferred because of fear of robbers, the Bhikkhus
    are prescribed to go where the village is, then where the greater part is, and,
    if that part is unbelieving, where the believing people are.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bhikkhus in a Kosala district who entered Vassa cannot obtain sufficient coarse
    or fine food, and the matter is reported to the Blessed One.
  category: action
  evidence_refs:
  - ev:9
