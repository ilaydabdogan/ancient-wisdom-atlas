canonical_text:
  quote: ''
  summary: A Vinaya passage gives disciplinary rules for Bhikkhus concerning food,
    invitations, eating after a meal, wrong-time or stored food, requesting delicacies,
    eating ungiven food, giving food to non-Buddhist ascetics, dismissing an invited
    meal companion, and entering a house where a meal is in progress. Editorial notes
    explain several terms and cite related textual references.
  language: English with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus are instructed to eat what is given and to accept invitations in
    the order received, with exceptions for a sick Bhikkhu and for invitations connected
    with robes being given or made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When offered sweetmeats and cakes at a house, a Bhikkhu may accept two or
    three bowls full; accepting more is a Pācittiya, and the accepted portions are
    to be taken away and divided among the Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Bhikkhu who has finished his meal, though still invited to continue eating,
    commits a Pācittiya if he eats food that has not been left over.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu commits a Pācittiya if he deliberately offers food to a Bhikkhu
    who has finished his meal in order to stir up longing, and the other Bhikkhu eats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rules prohibit eating at the wrong time, eating food that has been put by,
    requesting and partaking of listed delicacies when not sick, and placing ungiven
    food in the mouth except for water and a tooth-cleaner.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Bhikkhu commits a Pācittiya if he gives food with his own hand to an Acelaka,
    a Paribbājaka, or a Paribbājikā.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Bhikkhu commits a Pācittiya if he invites another Bhikkhu to go for a meal
    and then sends him away merely to get rid of him for a self-serving purpose.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Bhikkhu commits a Pācittiya if he forces his way into a house where a meal
    is going on and takes a seat there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The editorial note describes sweetmeats as presents sent from house to house
    on occasions such as weddings and funerals, and cakes as rice-cakes or similar
    foods prepared as journey provisions.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The editorial note identifies Acelakas, Paribbājakas, and Paribbājikās as
    non-Buddhist religious teachers or devotees, with Acelakas described as naked
    ascetics and Paribbājakas as often wandering logicians.
  category: attribute
  evidence_refs:
  - ev:10
