canonical_text:
  quote: ''
  summary: A sequence of disciplinary rules prescribes restrained eating, cleanliness
    around bowls and water vessels, conditions under which the Dhamma should not be
    preached to persons in certain postures or bearing certain objects unless they
    are sick, restrictions on easing oneself or spitting on grass or into water, and
    a closing threefold inquiry about purity after the rules are recited.
  language: English translation with some Pali terms in notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage instructs that one should not look with envious thoughts at others'
    bowls and should form food into suitable round mouthfuls rather than overly large
    balls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives multiple rules for eating without opening the mouth too
    early, putting the whole hand into the mouth, talking with food in the mouth,
    tossing food, nibbling, stuffing the cheeks, shaking the hands, scattering rice,
    putting out the tongue, or smacking the lips.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage forbids eating with a hissing sound, licking fingers, licking
    the bowl, licking the lips, taking hold of the water-jar with a food-soiled hand,
    and throwing bowl-rinsings with rice lumps into the inner court.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Dhamma should not be preached to a person holding a sunshade,
    staff, sword, or weapon unless that person is sick.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Dhamma should not be preached to a person wearing slippers
    or sandals, seated in a cart, lying on a couch, lolling, wearing a turban, or
    having the head covered, unless that person is sick.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage regulates the relative positions of speaker and listener when
    preaching the Dhamma, including rules about high and low seats, standing and sitting,
    walking behind someone, and walking beside a path.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage forbids easing oneself while standing unless sick, and forbids
    easing oneself or spitting on growing grass or into water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the rules are recited, the assembly is asked three times whether they
    are pure in the matter.
  category: speech
  evidence_refs:
  - ev:8
