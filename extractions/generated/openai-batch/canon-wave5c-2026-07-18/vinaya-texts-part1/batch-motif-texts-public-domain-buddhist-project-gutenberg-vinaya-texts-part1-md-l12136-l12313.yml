canonical_text:
  quote: ''
  summary: 'The passage gives disciplinary rules for Bhikkhus: questions and answers
    about the Vinaya before the Sa^gha require appointment; reproval for an offence
    requires permission and prudent assessment; unlawful official acts should be opposed
    in graded ways; Patimokkha recitation must be audible, with a special allowance
    for Udayi''s weak voice; Devadatta is reported for reciting the Patimokkha before
    an assembly including laymen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu may not put questions about the Vinaya before the Sa^gha unless
    appointed; appointment can be made by oneself or by another through a formal announcement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Appointed clever Bhikkhus asked Vinaya questions before the Sa^gha, after
    which the A^abbaggiya Bhikkhus became angry and threatened them with blows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One prescribed that even an appointed questioner should look at
    the assembly and mentally weigh the persons present before questioning.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Questions about the Vinaya may be answered before the Sa^gha only by an appointed
    Bhikkhu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Bhikkhu may not be reproved for an offence unless he has first given leave;
    the prescribed request asks permission to speak to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After clever Bhikkhus reproved the A^abbaggiya Bhikkhus with leave, the A^abbaggiya
    Bhikkhus became angry and threatened them with blows; the Blessed One required
    weighing the person concerned before reproval.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The A^abbaggiya Bhikkhus asked pure Bhikkhus who had committed no offence
    for leave without object or reason; this was forbidden.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The A^abbaggiya Bhikkhus performed an unlawful official act before the Sa^gha;
    protest against unlawful acts was prescribed, then moderated into group protest,
    smaller-group expression of opinion, or one person's mental determination.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The A^abbaggiya Bhikkhus intentionally recited the Patimokkha so that it could
    not be heard, and this was declared a dukka/a offence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Udayi, described as having a crow's voice, was allowed to endeavor to make
    the Patimokkha audible and thereby be free from offence.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Devadatta recited the Patimokkha before an assembly in which laymen were present,
    and the matter was reported to the Blessed One.
  category: action
  evidence_refs:
  - ev:10
