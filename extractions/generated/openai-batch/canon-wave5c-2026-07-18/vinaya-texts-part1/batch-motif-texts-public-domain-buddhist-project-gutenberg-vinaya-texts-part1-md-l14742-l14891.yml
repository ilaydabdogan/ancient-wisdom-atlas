canonical_text:
  quote: ''
  summary: A group of Bhikkhus spend the rainy-season residence in silence to avoid
    quarrel and food shortage. After the season they report this practice to the Buddha,
    who rebukes it as a vow of silence like that of the Titthiyas, forbids such silence,
    and prescribes the Pavarana ceremony after Vassa, based on what is seen, heard,
    or suspected.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed Buddha is said to dwell at Savatthi in Jetavana, the garden of
    Anathapindika.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A number of Bhikkhus, described as companions and friends, enter upon Vassa
    in a district of the Kosala country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bhikkhus decide not to speak or converse with each other as a way to keep
    Vassa in unity, concord, and without quarrel or want of food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bhikkhus organize silent communal duties around returning from alms-pilgrimage,
    including preparing seats, water for washing feet, a foot-stool, a towel, food,
    and cleaning or putting away vessels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After finishing the three months of Vassa, the Bhikkhus set their resting
    places in order, take their alms-bowls and robes, travel to Savatthi, approach
    the Blessed One, salute him, and sit near him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One asks the incoming Bhikkhus whether things went well, whether
    they had enough support, and whether they kept Vassa in unity, concord, and without
    quarrel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The passage states that Tathagatas ask questions for two purposes: to preach
    doctrine or to institute a rule of conduct for disciples.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After hearing the Bhikkhus' explanation, the Blessed One rebukes them and
    says they have kept Vassa badly, comparing their practice to a herd of cattle,
    a herd of rams, and a company of indolent people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Blessed One identifies the practice as taking upon themselves a vow of
    silence like the Titthiyas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Blessed One forbids taking a vow of silence like the Titthiyas and states
    that one who does so commits a dukkata offence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The Blessed One prescribes that Bhikkhus who have finished Vassa hold Pavarana
    with each other in three ways: by what has been seen, heard, or suspected.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The stated results of the prescribed Pavarana are living in accord, atoning
    for offences, and keeping the rules of discipline before the eyes.
  category: speech
  evidence_refs:
  - ev:6
