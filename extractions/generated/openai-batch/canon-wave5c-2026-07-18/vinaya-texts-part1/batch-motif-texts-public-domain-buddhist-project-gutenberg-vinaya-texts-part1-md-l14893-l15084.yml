canonical_text:
  quote: ''
  summary: 'The passage gives rules for holding the Pavaraṇa ceremony: a competent
    monk proclaims the motion, participants make formal declarations inviting correction
    for seen, heard, or suspected offences, and the Buddha issues procedural rulings
    about posture, seniority, sickness, absence, calendrical days, consent, and small
    local groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learned and competent Bhikkhu is to proclaim before the Sangha that the
    day is the Pavaraṇa day and that the Sangha may hold Pavaraṇa if ready.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The senior Bhikkhu is instructed to adjust his upper robe to cover one shoulder,
    sit squatting, raise joined hands, and pronounce his Pavaraṇa before the Sangha
    three times, inviting correction for what has been seen, heard, or suspected and
    promising atonement if he sees an offence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Younger Bhikkhus are instructed to perform the corresponding Pavaraṇa declaration
    after the senior Bhikkhu, with the appropriate respectful address.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Chabbaggiya Bhikkhus remain on their seats while senior Bhikkhus crouch
    down and perform Pavaraṇa; moderate Bhikkhus become annoyed and report the matter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buddha rebukes the seated conduct and prescribes that no one remain seated
    while senior Bhikkhus crouch for Pavaraṇa; doing so is a dukkaṭa offence, and
    all are to crouch while Pavaraṇa is being performed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Bhikkhu weak from age faints after waiting crouched until all have finished
    Pavaraṇa; the Buddha then prescribes crouching only until one has performed one’s
    own Pavaraṇa, after which one may sit down.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The Buddha states that there are two Pavaraṇa days: the fourteenth and the
    fifteenth of the half-month.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Buddha states that there are four Pavaraṇa services.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A sick Bhikkhu who is not present may declare his Pavaraṇa to another Bhikkhu;
    the declaration can be made by gesture, by word, or by both, and if he cannot
    do so he may be brought on his bed or chair to the assembly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the day of Pavaraṇa, one who declares Pavaraṇa is also to declare consent
    to acts that may be performed by the Order.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Relations of a certain Bhikkhu keep him back on the day of Pavaraṇa.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Five Bhikkhus in a district ask how they should hold Pavaraṇa, and the Buddha
    prescribes that five Bhikkhus may hold Pavaraṇa in a regular chapter; four Bhikkhus
    in a district then raise the same question, but the answer is not included in
    the supplied range.
  category: sequence
  evidence_refs:
  - ev:8
