canonical_text:
  quote: ''
  summary: After seven days, the Naga king Mucalinda releases the Blessed One, assumes
    the appearance of a youth, and reveres him. The Blessed One utters verses on solitude,
    Truth, restraint, freedom from lust, and the ending of pride. He then goes to
    the Rajayatana tree and sits seven days enjoying emancipation. Merchants Tapussa
    and Bhallika are directed by a former kinsman deity to offer rice-cakes and honey
    to the newly awakened Blessed One. Because Tathagatas do not accept food in their
    hands, the four Maharaja gods offer four stone bowls from the four quarters; the
    Blessed One accepts the bowls, receives the food, eats, and the merchants bow
    in reverence.
  language: English
  quote_policy: summarized
