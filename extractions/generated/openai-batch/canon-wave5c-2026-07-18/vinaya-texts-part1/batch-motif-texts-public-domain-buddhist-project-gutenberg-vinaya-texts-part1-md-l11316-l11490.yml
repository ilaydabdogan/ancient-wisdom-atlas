canonical_text:
  quote: ''
  summary: 'The passage explains the Patimokkha recitation formula: Bhikkhus in assembly
    must confess remembered existing offences after a threefold proclamation; non-confession
    becomes intentional falsehood and an impediment to meditative and wholesome attainments.
    It also glosses key formula terms and records that the Blessed One prohibits daily
    Patimokkha recitation and prescribes recitation on the Uposatha day.'
  language: English translation with Pali terms
