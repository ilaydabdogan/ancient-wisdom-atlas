canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rules on robes and robe-funds: when robe requests
    are allowed, how much may be accepted from householders, what constitutes an offence
    involving forfeiture, and how a messenger and appointed agent may mediate provision
    of robes without the monk accepting barter value directly.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu's request for a robe outside the defined right season is treated
    as a Pa/£ittiya offence involving forfeiture; the right season is when his robe
    has been robbed or destroyed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a householder or householder's wife offers a choice from materials for
    many robes, the Bhikkhu may have robes made only up to the due portion of inner
    and outer robes; exceeding the limit is an offence involving forfeiture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A non-relative householder or householder's lady may lay aside barter value
    for a set of robes intended for a particular Bhikkhu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the Bhikkhu gives directions about the robe before the offer is made, while
    desiring something fine, that is an offence involving forfeiture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If two donors have each laid aside robe value, the Bhikkhu incurs an offence
    involving forfeiture by directing them before the offer to combine the values
    into one fine robe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Rāja, Khattiya, Brahman, or Gahapati may send a messenger with the barter
    value of a robe-set for a particular Bhikkhu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The instructed reply to a messenger is that monks do not accept the barter
    value for robes, but may accept a suitable set of robes at the right time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the messenger asks whether the monk has a person who attends to such matters,
    the Bhikkhu may point out as agent the keeper of the arama or some believer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the messenger has made an appointment with the agent, the Bhikkhu may
    remind the agent two or three times that he needs a set of robes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note glosses the arama as the grove or pleasure-ground in which the monks'
    residence stood, and says it may have come to include the residence itself.
  category: setting
  evidence_refs:
  - ev:8
