  summary: The passage argues that early Buddhist textual preservation depended on
    oral transmission rather than writing. It summarizes cases where monks must travel
    to learn the Patimokkha by heart, where a lay follower fears a Suttanta may be
    forgotten and summons monks despite rainy-season travel restrictions, and where
    the Anguttara Nikaya warns that Suttantas are imperiled if learned monks fail
    to transmit them before dying.
