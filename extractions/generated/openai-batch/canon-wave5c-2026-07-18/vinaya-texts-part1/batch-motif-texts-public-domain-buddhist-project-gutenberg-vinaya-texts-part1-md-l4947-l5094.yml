canonical_text:
  quote: "“Wide opened is the door of the Immortal to all who have ears to hear”"
  summary: Brahma Sahampati repeatedly asks the Blessed One to preach the doctrine.
    The Blessed One surveys beings with the eye of a Buddha, compares their differing
    readiness to lotuses at different relations to water, and grants the request.
    He then considers whom to teach first, learns that Alara Kalama and Uddaka Ramaputta
    have died, locates the five Bhikkhus at Benares by divine vision, sets out toward
    them, and is seen on the road by Upaka.
  language: English
  quote_policy: quoted
