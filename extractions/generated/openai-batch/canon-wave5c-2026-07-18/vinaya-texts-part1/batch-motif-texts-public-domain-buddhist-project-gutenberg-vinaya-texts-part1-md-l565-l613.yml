  summary: The passage discusses the possibly traditional but unsubstantial character
    of introductory material, then argues about the compilation date of the Sutta-vibhanga
    and Khandhakas from their silence about the Ten Points. It describes the Ten Points
    controversy as a major Buddhist dispute, compares its importance to the Arian
    controversy in Christianity, notes the Council of Vesali and ensuing schism, and
    treats the final Khandhakas as an appendix containing accounts of the Councils
    of Rajagaha and Vesali.
