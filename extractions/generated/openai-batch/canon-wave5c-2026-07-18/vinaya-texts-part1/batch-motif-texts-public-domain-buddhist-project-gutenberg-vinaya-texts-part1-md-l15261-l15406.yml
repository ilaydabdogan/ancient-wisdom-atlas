canonical_text:
  quote: ''
  summary: The passage gives Vinaya rulings for performing the Pavāraṇa ceremony when
    ordinary recitation cannot be completed because of danger, delay, crowding, rain,
    or other emergencies. It permits shorter formulae or a common declaration in such
    cases, requires a competent monk to announce a formal motion, lists possible dangers,
    and forbids a monk guilty of an offence from holding Pavāraṇa.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A residence of Bhikkhus in Kosala was menaced on Pavāraṇa day by hostile people,
    preventing performance of Pavāraṇa with the threefold formula.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhus reported the difficulty to the Blessed One, who allowed Pavāraṇa
    first with a twofold formula, then with a onefold formula, and then by one common
    declaration of all Bhikkhus who had kept Vassa together.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In another case, lay people offering gifts caused most of the night to pass,
    so the Bhikkhus feared the ceremony would not finish before daybreak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prescribed response to the delay from gifts is that a learned, competent
    Bhikkhu may proclaim a formal motion before the Saṅgha to use a shorter formula
    or common declaration.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another delay scenario involves Bhikkhus occupied with reciting Dhamma, expounding
    Suttantas, discussing Vinaya, and speaking about Dhamma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large assembly of Bhikkhus, a small rain-protected place, and a great cloud
    in the sky create a risk that rain will begin before a full threefold Pavāraṇa
    can be completed.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists dangers from kings, robbers, fire, water, human beings,
    non-human beings, beasts of prey, creeping things, danger to life, and danger
    against chastity as grounds for abbreviated procedure.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Chabbaggiya Bhikkhus held Pavāraṇa while guilty of an offence, and the
    Blessed One forbade holding Pavāraṇa in that state.
  category: action
  evidence_refs:
  - ev:7
