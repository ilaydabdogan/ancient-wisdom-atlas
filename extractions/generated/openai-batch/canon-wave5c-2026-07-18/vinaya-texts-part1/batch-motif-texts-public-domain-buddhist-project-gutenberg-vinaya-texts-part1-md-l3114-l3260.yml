canonical_text:
  quote: ''
  summary: 'The passage lists Vinaya Pa/£ittiya rules governing monks: private seating
    with women, conduct after accepting meal invitations, acceptance of requisites,
    visits to armies, intoxicants, poking, water play, disrespect, frightening another
    monk, kindling fire for warmth, and bathing frequency. Several rules include exceptions
    for proper occasions, sufficient causes, illness, travel, work, robes, or limited
    duration.'
