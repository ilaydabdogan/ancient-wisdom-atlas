canonical_text:
  quote: ''
  summary: The passage recounts the Blessed One's contemplation of dependent origination
    and cessation under the Bodhi tree, his movement to the Ajapala banyan tree and
    answer to a haughty Brahmana about what makes a true Brahmana, and his later meditation
    at the Mucalinda tree during an out-of-season storm, where the Naga king Mucalinda
    shelters him with coils and hood.
  language: English translation with transliterated Pali/Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A causal sequence is stated from Ignorance through formations, consciousness,
    name-and-form, six sense provinces, contact, sensation, thirst, attachment, existence,
    birth, and finally old age, death, grief, lamentation, suffering, dejection, and
    despair; the reverse destruction of these factors is described as cessation of
    suffering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One fixes his mind on the Chain of Causation in direct and reverse
    order during watches of the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The solemn utterances state that when the real nature of things becomes clear
    to an ardent meditating Brahmana, doubts fade, cessation of causation is understood,
    and the hosts of Mara are dispelled like darkness before the sun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After seven days, the Blessed One leaves the foot of the Bodhi tree, goes
    to the Ajapala banyan tree, sits cross-legged there for seven days, and enjoys
    the bliss of emancipation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A certain haughty Brahmana approaches the Blessed One, exchanges greetings,
    stands nearby, and asks what makes one a Brahmana and what characteristics define
    a Brahmana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Blessed One answers that a Brahmana is one who has removed sinfulness,
    is free from haughtiness and impurity, is self-restrained, accomplished in knowledge
    or Veda, has fulfilled holy duties, and is uneven to nothing in the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After another seven days, the Blessed One leaves the Ajapala banyan tree,
    goes to the Mucalinda tree, sits cross-legged there for seven days, and enjoys
    the bliss of emancipation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An out-of-season great cloud appears, bringing seven days of rainy weather,
    cold weather, storms, and darkness.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Naga king Mucalinda emerges from his abode, encircles the Blessed One's
    body seven times with his windings, and extends his large hood over the Blessed
    One's head to prevent cold, heat, insects, storms, sunheat, and reptiles from
    touching him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note reports that Buddhaghosa explained the Ajapala banyan name by saying
    goat-herds used to sit in its shade; the same note says northern Buddhists tell
    of a shepherd boy planting the tree to shelter the Bodhisatta during penance.
  category: other
  evidence_refs:
  - ev:8
