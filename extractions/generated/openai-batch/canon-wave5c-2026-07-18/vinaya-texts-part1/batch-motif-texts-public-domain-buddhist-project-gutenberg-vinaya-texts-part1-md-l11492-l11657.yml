canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rulings about the Patimokkha and Uposatha: the
    Patimokkha is to be recited once each half-month, the Uposatha is to be held by
    the complete fraternity within one residence, and formal boundaries are to be
    determined by landmarks. It also narrates the Blessed One perceiving Maha Kappina''s
    solitary thought about whether to attend communal observances, appearing before
    him, instructing him not to neglect them, and returning. Further rules correct
    excessive or unsafe boundaries, including boundaries across rivers, and note confusion
    when no place for recitation is appointed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One says the Patimokkha is not to be recited three times each
    half-month, and prescribes recitation once each half-month on the fourteenth or
    fifteenth day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chabbaggiya Bhikkhus recite the Patimokkha according to their living groups,
    each before his own companions; the Blessed One forbids this and prescribes that
    the Uposatha service be held by the complete fraternity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Bhikkhus ask how far completeness extends, the Blessed One prescribes
    that it extends as far as one residence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Maha Kappina dwells near Rajagaha in the deer park of Maddakucchi and, while
    alone in solitude, considers whether he should go to the Uposatha service and
    functions of the Order, reflecting that he has become pure by the highest purity.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Blessed One understands by the power of his mind the reflection that has
    arisen in Maha Kappina's mind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One disappears from the Gijjhakuta mountain and appears before
    Maha Kappina in the deer park of Maddakucchi, with the speed compared to a strong
    man stretching or bending his arm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Maha Kappina respectfully salutes the Blessed One and sits near him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One asks Maha Kappina whether the thought about attending Uposatha
    and Order functions had arisen, and Maha Kappina confirms it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Blessed One tells Maha Kappina to honour, regard, revere, and attend the
    Uposatha and the functions of the Order; Maha Kappina promises to do so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After teaching, inciting, animating, and gladdening Maha Kappina by a religious
    discourse, the Blessed One disappears from the deer park and appears on the mountain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Blessed One prescribes that a boundary be determined, first by proclaiming
    landmarks consisting in a mountain, rock, wood, tree, path, ant-hill, river, or
    piece of water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A learned, competent Bhikkhu is to proclaim a formal motion before the Sangha
    to determine the boundary for common residence and communion of Uposatha.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Chabbaggiya Bhikkhus fix excessive boundaries of four, five, and six yojanas;
