  quote: ''
  summary: The passage gives rules for admitting a person formerly belonging to a
    Titthiya school into upasampada ordination after satisfying the Bhikkhus. If such
    a person comes naked, the upajjhaya must get him a robe; if he comes with unshaven
    hair, the Sangha's permission should be requested before shaving it. Fire-worshippers
    and CWilas are to receive upasampada directly without parivasa, with the stated
    reason beginning but cut off in the supplied passage.
