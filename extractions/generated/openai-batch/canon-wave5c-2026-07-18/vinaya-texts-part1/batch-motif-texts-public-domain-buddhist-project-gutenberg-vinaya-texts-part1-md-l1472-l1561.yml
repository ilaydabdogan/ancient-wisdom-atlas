canonical_text:
  quote: "“these four Rules, concerning those acts which bring about Defeat”"
  summary: The passage introduces the Paragika rules as rules concerning acts that
    bring about defeat. It gives rules stating that a Bhikkhu who has taken the monastic
    training and has not withdrawn from it falls into defeat and is no longer in communion
    if he commits sexual intercourse, takes what is not given in a manner counted
    as theft, or knowingly kills, procures killing, praises death, or incites self-destruction.
    Editorial notes discuss the meaning of Paragika as involving defeat rather than
    expulsion and explain withdrawal from training as throwing off the robe.
  language: English with Pali terms
  quote_policy: quoted
