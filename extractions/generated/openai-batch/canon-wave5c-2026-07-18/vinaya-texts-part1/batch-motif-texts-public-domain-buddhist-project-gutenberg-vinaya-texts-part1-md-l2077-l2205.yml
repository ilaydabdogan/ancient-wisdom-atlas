canonical_text:
  quote: ''
  summary: 'The passage introduces Nissaggiya Pācittiya rules involving forfeiture
    and gives early rules about robe possession: limits on keeping extra robes, remaining
    with one’s three robes unless permitted otherwise, accepting and making up out-of-season
    robes, restrictions involving unrelated Bhikkhunīs, and the opening of a rule
    about asking unrelated householders. Explanatory notes describe communal robe
    ownership and rule-precedent stories involving Ananda, Sariputta, sick Bhikkhus,
    and the Buddha.'
  language: English
  quote_policy: summarized
