  quote: ''
  summary: A Vinaya passage and notes present Pācittiya rules governing Bhikkhus'
    exhortation of Bhikkhunis, robe-giving or robe-making for Bhikkhunis, travel or
    boat travel with Bhikkhunis, eating food procured through Bhikkhuni intervention,
    sitting privately with a Bhikkhuni, and rules about meals at public rest-houses,
    group meals, and taking food in turn. Several rules specify exceptional 'right
    occasions' such as illness, dangerous roads, crossing by boat, journeys, robe-giving,
    large influxes of monks, and general invitations.
