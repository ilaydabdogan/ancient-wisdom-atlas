canonical_text:
  quote: ''
  summary: The Buddha and the bhikkhus are hosted by King Seniya Bimbisara, who seeks
    and donates the Ve/uvana pleasure garden as a suitable secluded dwelling; the
    Buddha accepts and permits bhikkhus to receive parks as donations. A second episode
    introduces Sa^aya with his wandering ascetics, Sariputta and Moggallana as his
    followers, their agreement to share attainment of the immortal, and Sariputta’s
    encounter with the dignified alms-going monk Assa^i, who identifies the Buddha
    as his teacher.
  language: English
  quote_policy: summarized
