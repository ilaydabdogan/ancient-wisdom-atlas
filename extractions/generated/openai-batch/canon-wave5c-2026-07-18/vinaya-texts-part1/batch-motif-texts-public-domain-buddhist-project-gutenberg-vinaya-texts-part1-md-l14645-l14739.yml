canonical_text:
  quote: ''
  summary: 'Rules are given for a Bhikkhu who has promised a lay-devotee to take up
    Vassa residence at the earlier or later period. Several cases are distinguished:
    choosing other districts for robes, brief or interrupted residence, departures
    with or without business, the seven-day return condition, departure shortly before
    the concluding ceremony, and repeated variants for Uposatha held in different
    places and for the later Vassa period. The rules state when the entry into Vassa
    is valid or invalid and when a dukkaṭa offence is committed.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu may have promised a lay-devotee to take up Vassa residence with
    him at the earlier period.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one case, the Bhikkhu sees two districts with many robes, thinks of keeping
    Vassa there to obtain many robes, and keeps Vassa in those two districts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rule declares that this earlier-period entry into Vassa is not valid and
    that the promise entails a dukkaṭa offence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In another case, the Bhikkhu holds Uposatha outside on the last day of the
    half-month, then goes to the Vihara on the first day of the next half-month, prepares
    a resting place, obtains drink and food, sweeps the cell, and leaves the same
    day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Leaving the same day, whether without business or with business, is treated
    as invalid entry into Vassa and as an offence in the repeated formula.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: If the Bhikkhu resides there two or three days and then leaves, whether without
    business or with business, the same invalidity and offence formula applies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the Bhikkhu leaves for business that can be accomplished within seven days
    but is absent beyond seven days, the entry is invalid and the offence formula
    applies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the Bhikkhu returns within those seven days, the entry into Vassa at the
    earlier period is valid and no offence is committed regarding the promise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the Bhikkhu goes away seven days before the Pavāraṇa with business, the
    entry is valid and no offence is committed whether or not he returns to that district.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Later sections repeat the cases with the variation that Uposatha is held in
    the district after arrival rather than outside, and with later-period Vassa replacing
    earlier-period Vassa.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The passage states that the third Khandhaka, concerning entering upon Vassa,
    ends here.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: A note identifies the Komudi Cātumāsini as the full moon day in the month
    Kattika and as the end of Vassa for those who entered at the later period.
  category: setting
  evidence_refs:
