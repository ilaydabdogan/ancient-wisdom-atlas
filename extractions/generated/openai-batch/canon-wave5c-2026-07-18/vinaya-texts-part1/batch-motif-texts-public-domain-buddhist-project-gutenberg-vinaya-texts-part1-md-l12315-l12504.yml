canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rules arising from incidents among Bhikkhus:
    the Patimokkha is not to be recited before laymen or without authorization; ritual
    leadership is assigned to the senior monk or, if needed, to a learned and competent
    monk; monks must learn or send someone to learn the Patimokkha, count half-month
    days and community members, announce Uposatha, and sweep the Uposatha hall.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One forbids reciting the Patimokkha before an assembly in which
    laymen are present and states that doing so is an offence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A7zabbaggiya Bhikkhus recite the Patimokkha before the Sawgha without
    being called upon, after which the Blessed One forbids uncalled recitation and
    prescribes that the Thera is master of the Patimokkha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One travels from Ra^agaha to A"odanavatthu or Kodanavatthu as
    printed in the passage, and later returns to Ra^agaha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a residence, the eldest Bhikkhu is described as ignorant and unlearned
    and as not knowing Uposatha, the Uposatha service, the Patimokkha, or its recital.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Blessed One prescribes that, when the eldest monk is not competent, the
    learned and competent Bhikkhu is to be made master of the Patimokkha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In another residence on Uposatha day, many ignorant and unlearned Bhikkhus
    are unable to recite the Patimokkha when called upon in order from the Thera down
    to the youngest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Blessed One instructs that one Bhikkhu be sent to a neighbouring residence
    to learn the Patimokkha, either abridged or in full.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One prescribes that the Thera should order a young Bhikkhu to
    go, and that an ordered monk should not refuse unless sick.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: People ask alms-going Bhikkhus what day of the half-month it is; when the
    Bhikkhus do not know, the people become annoyed and criticize them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Blessed One prescribes that all Bhikkhus learn to count the days of the
    half-month.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: People ask how many Bhikkhus there are; when the Bhikkhus do not know, the
    Blessed One prescribes counting the Bhikkhus on Uposatha day, either by groups
    or by tickets.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bhikkhus who do not know it is Uposatha day go to a distant village and return
    during or after the Patimokkha recitation; the Blessed One prescribes proclaiming
    that it is Uposatha, with the Thera responsible for doing so when he remembers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: An Uposatha hall is found full of sweepings, and the Blessed One prescribes
    sweeping the Uposatha hall.
  category: setting
  evidence_refs:
  - ev:10
