canonical_text:
  quote: ''
  summary: The Blessed One travels from Rafagaha to Kapilavatthu and dwells near Kapilavatthu
    in the Nigrodharama. He visits the residence of Sakka Suddhodana. Rahula’s mother
    tells young Rahula to ask the Blessed One, identified as his father, for his inheritance.
    Rahula approaches, speaks of the Blessed One’s shadow as blissful, follows him,
    and repeatedly asks for inheritance. The Blessed One instructs Sariputta to confer
    pabba^a ordination on Rahula; after Sariputta asks how, the Blessed One gives
    a discourse and begins to prescribe a rule to the Bhikkhus.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
