canonical_text:
  quote: ''
  summary: The passage gives procedural rules for the Pavāraṇā ceremony when one Bhikkhu
    inhibits another’s participation by accusation based on sight, hearing, or suspicion.
    The community questions the basis of the accusation, judges whether the reproved
    monk is blameless or blameworthy, prescribes consequences for unfounded charges
    or admitted offences, and instructs how to proceed when monks disagree about the
    classification of an offence.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu may say that he inhibits another Bhikkhu’s Pavāraṇā because of what
    he has seen, heard, or suspected.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the inhibition is based on sight, the questioners ask what was seen,
    when and where it was seen, the offence involved, where each monk was, and what
    each did.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the inhibition is based on hearing, the questioners ask what was heard,
    when and where it was heard, the offence involved, and from what kind of person
    the report came.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the inhibition is based on suspicion, the questioners ask what is suspected,
    when and where it is suspected, the offence involved, and whether the suspicion
    came from reports by named categories of people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the reproving Bhikkhu cannot convince intelligent fellow Bhikkhus, the
    reproved Bhikkhu is to be regarded as blameless; if he can convince them, the
    reproved Bhikkhu is to be regarded as blamable.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the reproving Bhikkhu admits that he made an unfounded charge, the Saṅgha
    is instructed to apply the appropriate proceeding or legal treatment to the accuser
    and then hold Pavāraṇā.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the reproved Bhikkhu admits an offence, the Saṅgha is instructed to expel
    him for a pārājika offence, apply saṅghādisesa proceedings for a saṅghādisesa
    offence, or treat lesser offences according to law before holding Pavāraṇā.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When monks disagree about the classification of an offence on the day of Pavāraṇā,
    those who classify it as the lesser named offence take the Bhikkhu aside, treat
    him according to law, report that he has atoned, and then the Saṅgha may hold
    Pavāraṇā.
  category: sequence
  evidence_refs:
  - ev:7
