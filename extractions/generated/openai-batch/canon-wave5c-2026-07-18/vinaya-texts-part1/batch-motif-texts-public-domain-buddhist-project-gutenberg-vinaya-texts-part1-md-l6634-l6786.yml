canonical_text:
  quote: ''
  summary: 'The Blessed One performs a sequence of extraordinary acts before Uruvela
    Kassapa and the Jatilas: retrieving fruits and a heavenly flower before Kassapa
    arrives, affecting firewood and sacred fires, creating five hundred vessels with
    fire for ascetics emerging from cold river water, and remaining unharmed in an
    inundation by making the water recede, walking on dry ground, rising into the
    air, and entering a boat. Kassapa repeatedly acknowledges the Blessed One''s magical
    powers while still denying that he is holy like himself. The passage ends with
    the Blessed One resolving to move Kassapa''s mind to show his superiority.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After sending Kassapa away, the Blessed One goes to pluck a fruit from the
    Jambu tree, arrives before Kassapa, sits in the fire room, and offers the fruit
