canonical_text:
  quote: ''
  summary: The passage describes the structure and formation of Vinaya textual sections.
    It explains that the Sutta-vibhanga is built from a historical basis, an extract
    from the Patimokkha placed in the Buddha's mouth, an Old Commentary, and Notes.
    It then describes the Khandhakas as accounts of admission into the Sangha, Uposatha,
    rainy-season observances, disciplinary proceedings, and daily life, with regulations
    framed by histories of occasions on which the Buddha was supposed to have made
    them and often followed by liturgical formularies. It notes that the Upasampada-kammavaca
    is a principal exception among Khandhaka formularies preserved separately.
  language: English
