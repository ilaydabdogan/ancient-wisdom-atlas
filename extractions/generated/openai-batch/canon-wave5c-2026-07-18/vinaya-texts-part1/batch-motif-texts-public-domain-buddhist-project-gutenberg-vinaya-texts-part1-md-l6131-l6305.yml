canonical_text:
  quote: ''
  summary: The Blessed One teaches the Bhikkhus that he has attained the highest emancipation
    through wise contemplation and exertion. Mara challenges him with claims of bondage,
    but the Blessed One declares himself delivered, and Mara vanishes. The Blessed
    One then encounters thirty rich young men in a grove after a woman has fled with
    their property; he redirects them from searching for her to searching for themselves,
    teaches them the Dhamma, and they receive ordination. Later at Uruvela, the Blessed
    One meets three Jatila leaders and asks Uruvela Kassapa to stay in the fire room,
    despite a dangerous Naga serpent there. He enters, sits mindfully, and the Naga
    emits smoke; the Blessed One resolves to conquer its fire with his own while leaving
    the serpent unharmed.
  language: English translation with Pali terms
  quote_policy: summarized
