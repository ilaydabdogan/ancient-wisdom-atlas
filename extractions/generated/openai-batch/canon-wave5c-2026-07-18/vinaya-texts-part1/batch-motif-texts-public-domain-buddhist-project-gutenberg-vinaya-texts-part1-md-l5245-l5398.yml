canonical_text:
  quote: ''
  summary: The Blessed One teaches the Middle Path, the eightfold path, and the Four
    Noble Truths to the five Bhikkhus. He describes his complete knowledge of these
    truths, his attainment of Sambodhi, and the end of rebirth. Kondanna gains the
    Eye of Truth. Devas proclaim the founding of the Kingdom of Truth at Benares,
    the shout reaches the Brahma world, ten thousand worlds tremble, and a mighty
    light appears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tathagata identifies a Middle Path that leads to insight, wisdom, calm,
    knowledge, Sambodhi, and Nirvana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Middle Path is named as the holy eightfold Path and is listed as Right
    Belief, Right Aspiration, Right Speech, Right Conduct, Right Means of Livelihood,
    Right Endeavour, Right Memory, and Right Meditation.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Noble Truth of Suffering is stated with examples including birth, decay,
    illness, death, hated presences, separation from loved objects, frustrated desire,
    and clinging to existence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Noble Truth of the Cause of suffering is stated as thirst that leads to
    rebirth and includes thirst for pleasure, existence, and prosperity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Noble Truth of the Cessation of suffering is stated as the complete cessation,
    abandoning, doing away with, deliverance from, and destruction of thirst and desire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Noble Truth of the Path leading to the cessation of suffering is again
    identified with the holy eightfold Path.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The speaker says that pure knowledge and insight into the four Noble Truths,
    with three modifications and twelve constituent parts, corresponded with knowing
    that he had obtained the highest Sambodhi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Knowledge and insight arose in the speaker's mind that emancipation could
    not be lost, that this was his last birth, and that he would not be born again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The five Bhikkhus were delighted and rejoiced, and Kondanna obtained the pure
    and spotless Eye of the Truth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the Blessed One had founded the Kingdom of Truth, earth-inhabiting devas
    shouted a proclamation that it had been founded at Benares in the deer park Isipatana
    and could not be opposed by named beings and powers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The shout is described as passing through successive groups of devas up to
    the brahmakayika devas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The shout reached the Brahma world; the system of ten thousand worlds quaked,
    shook, and trembled; and an infinite mighty light appeared through the world.
  category: setting
  evidence_refs:
  - ev:8
