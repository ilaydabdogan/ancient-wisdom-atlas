canonical_text:
  quote: ''
  summary: The passage gives Vinaya rules for Bhikkhus during Vassa. It permits leaving
    a Vassa residence without fault under dangers such as lack of food, medicine,
    attendants, temptations involving wealth or marriage, discovery of treasure, or
    threats of division in the Sangha. It also permits Vassa in a cattle-pen, caravan,
    or ship, including movement with a cattle-pen, but prohibits entering Vassa in
    a hollow tree after laypeople complain that the monks behave like goblins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus who have entered upon Vassa may leave a residence without guilt if
    they cannot obtain sufficient food, sustaining food, proper medicine, or suitable
    lay service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikkhu in Vassa may leave if a woman offers him wealth, property, animals,
    servants, a daughter as wife, herself as wife, or another wife, and he fears danger
    to the purity of his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same permission to leave is extended when similar offers are made by a
    harlot, adult girl, eunuch, relations, kings, robbers, or rascals, and when a
    Bhikkhu finds ownerless treasure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu who sees or hears of Bhikkhus striving to cause divisions in the
    Sangha may leave in order that no division arise in his presence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Bhikkhu who hears of divisions or attempts at division elsewhere may go
    there to admonish friends or friends of friends; the passage extends the same
    pattern to Bhikkhunis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One allows Bhikkhus to enter upon Vassa in a cattle-pen and to
    go with the cattle-pen if it is moved.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One allows Bhikkhus to enter upon Vassa in a caravan or in a ship
    when a journey is at hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some Bhikkhus entered upon Vassa in a hollow tree; laypeople complained that
    they behaved like goblins, and the Blessed One forbade entering Vassa in a hollow
