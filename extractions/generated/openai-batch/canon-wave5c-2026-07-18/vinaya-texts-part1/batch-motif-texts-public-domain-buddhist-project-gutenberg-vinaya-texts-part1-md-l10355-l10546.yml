canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya cases about admission to the order: a serpent
    in human form is excluded and advised to observe fast days; the Blessed One identifies
    occasions when such a serpent reveals its true nature; animals and various offenders
    or ineligible persons are barred from ordination or expelled if already ordained;
    rules are also stated about required preceptors and alms-bowls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A serpent is told that serpents are not capable of spiritual growth in this
    doctrine and discipline, and is instructed to observe fast on specified lunar
    days so as to be released from serpent existence and obtain human nature.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The serpent becomes sad, sheds tears, cries out, and goes away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One states that a serpent who has assumed human shape manifests
    its true nature during intercourse with a female of its species or when it feels
    safe and falls asleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One rules that an animal must not receive upasampada ordination,
    and if it has received it, it must be expelled from the fraternity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young man who killed his mother seeks ordination because he thinks it may
    help him get rid of his sinful deed; after Upali examines him, the case is reported
    to the Blessed One, who rules that a matricide is not to receive upasampada and
    must be expelled if already ordained.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A similar rule is stated for a person guilty of killing his father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Robbers attack travelling Bhikkhus, rob and kill some of them; some escaped
    robbers later receive pabbajja, while captured robbers are led to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One states that the killed Bhikkhus were Arahats and rules that
    a person who murdered an Arahat must not receive upasampada and must be expelled
    if already ordained.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Robbers attack travelling Bhikkhunis, rob some and violate some; the passage
    then states exclusion rules for one who has violated a Bhikkhuni, caused a schism
    in the Saṅgha, or shed a Buddha's blood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A hermaphrodite receives pabbajja, the case is reported to the Blessed One,
    and an exclusion rule is stated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that upasampada is not to be conferred on a person without
    an upajjhaya, nor with the Saṅgha, a number of Bhikkhus, or listed ineligible
    persons as upajjhaya.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Persons ordained without alms-bowls receive alms with their hands, and people
    are annoyed and compare them to Titthiyas.
  category: sequence
  evidence_refs:
  - ev:9
