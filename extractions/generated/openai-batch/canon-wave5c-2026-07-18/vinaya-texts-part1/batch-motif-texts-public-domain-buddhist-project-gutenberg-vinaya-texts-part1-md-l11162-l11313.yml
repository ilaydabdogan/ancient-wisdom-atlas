canonical_text:
  quote: ''
  summary: The passage narrates the institution of Buddhist Uposatha assemblies and
    Patimokkha recitation. Non-Buddhist Paribbajakas assemble on recurring half-month
    days and attract listeners. King Seniya Bimbisara asks the Buddha that the Bhikkhus
    assemble on those days too. After silent assemblies draw public criticism, the
    Buddha prescribes Dhamma recitation. He then prescribes the Patimokkha as the
    Uposatha service, including a communal procedure for confession and silence as
    an indication of purity.
  language: English
  quote_policy: summarized
