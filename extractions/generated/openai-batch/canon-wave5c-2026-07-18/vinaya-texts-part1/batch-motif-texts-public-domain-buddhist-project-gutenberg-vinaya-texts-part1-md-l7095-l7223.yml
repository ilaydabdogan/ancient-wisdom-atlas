canonical_text:
  quote: ''
  summary: Uruvela Kassapa publicly declares the Blessed One to be his teacher. The
    assembled Magadha Brahmanas and householders understand his submission. The Blessed
    One preaches, many attain the Eye of Truth, and others become lay-pupils. King
    Seniya Bimbisara declares five former wishes fulfilled, invites the Blessed One
    and the Bhikkhus to a meal, and prepares food. The Blessed One enters Rajagaha
    with one thousand Bhikkhus who had formerly been Jatilas. Sakka, king of the devas,
    takes the form of a young Brahman, walks before the group, praises the Buddha
    in stanzas, and identifies himself as the Buddha's attendant.
  language: English
  quote_policy: summarized
