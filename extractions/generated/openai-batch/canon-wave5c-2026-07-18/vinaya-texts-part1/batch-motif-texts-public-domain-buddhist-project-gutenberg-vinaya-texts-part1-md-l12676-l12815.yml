canonical_text:
  quote: ''
  summary: The passage gives Vinaya rules for declaring parisuddhi, a monk's purity
    from specified offences, and for conveying consent and purity declarations when
    a monk is sick, absent, obstructed, or represented by another. It specifies valid
    forms of expression, quorum requirements for Uposatha and official acts, proxy
    transmission procedures, disqualifying failures, and a case in which relatives
    seize a monk on Uposatha day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parisuddhi is glossed as purity; a Bhikkhu declares he is pure from specified
    Patimokkha offences and may charge another Bhikkhu to proclaim the declaration
    before the assembled chapter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A declaration may be expressed by gesture, by word, or by both; without such
    expression, the parisuddhi has not been declared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a sick Bhikkhu cannot come, other Bhikkhus may bring him on his bed or
    chair; if moving him would worsen sickness or cause death, the Sangha is to go
    to him and hold Uposatha there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Uposatha is not to be held with an incomplete congregation; doing so is stated
    to be a dukkaṭa offence.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the Bhikkhu entrusted with parisuddhi leaves at once after receiving the
    charge, the parisuddhi is to be declared to another.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the entrusted Bhikkhu returns to the world, dies, or admits listed disqualifying
    statuses or grave offences, the parisuddhi is to be entrusted to someone else.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the entrusted Bhikkhu fails while on the way to the assembly, the parisuddhi
    has not been conveyed; if he has already arrived with the fraternity, it has been
    conveyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the entrusted Bhikkhu reaches the assembly but does not proclaim because
    of sleep, carelessness, or meditation, the parisuddhi is conveyed without offence;
    intentional omission conveys it but incurs a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Blessed One prescribes that a sick Bhikkhu should give consent for official
    acts, and that on Uposatha day one who declares parisuddhi should also declare
    consent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note states that the rules for chanda, consent of an absentee, are the same
    as the rules just given for parisuddhi.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Relations seize a certain Bhikkhu on Uposatha day; the Bhikkhus are instructed
    to ask the relations to release him briefly until he has held Uposatha.
  category: action
  evidence_refs:
  - ev:8
