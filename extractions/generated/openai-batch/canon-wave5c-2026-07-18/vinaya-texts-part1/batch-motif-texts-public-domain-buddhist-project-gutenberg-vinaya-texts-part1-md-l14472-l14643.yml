canonical_text:
  quote: ''
  summary: The passage gives several Vinaya cases about improper places for keeping
    Vassa, a forbidden agreement not to ordain during the rainy season, and Upananda
    Sakyaputta breaking a promise to King Pasenadi in order to stay where robes were
    plentiful. Each case is reported to the Blessed One, who issues prohibitions or
    rebukes and identifies the relevant dukkaṭa offense or fault.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Bhikkhus entered upon Vassa on a branch of a tree; people were annoyed
    and compared them to huntsmen, and the Blessed One prohibited this practice as
    a dukkaṭa offense.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Bhikkhus entered upon Vassa in the open air; when rain began they ran
    to the foot of a tree or to the hollow of a Nimba tree, and the Blessed One prohibited
    entering Vassa in the open air.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some Bhikkhus entered upon Vassa without a place of rest and suffered from
    coldness and heat; the Blessed One prohibited entering Vassa without such a place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some Bhikkhus entered upon Vassa in a house for keeping dead bodies; people
    were annoyed and compared them to corpse-burners, and the Blessed One prohibited
    this residence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Bhikkhus entered upon Vassa under a sun-shade; people were annoyed and
    compared them to cowherds, and the Blessed One prohibited this residence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some Bhikkhus entered upon Vassa under an earthenware vessel; people were
    annoyed and compared them to Titthiyas, and the Blessed One prohibited this residence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Saṅgha at Sāvatthi had agreed that no one should receive the pabbajjā
    ordination during the rainy season; when the grandson of Visakha Migaramata requested
    ordination, the Bhikkhus told him to wait, and after Vassa he declined ordination.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Visakha Migaramata became angry about the agreement barring ordination during
    the rainy season and asked when the duties of the Dhamma should not be performed;
    the Blessed One ruled that such an agreement should not be made and that making
    it is a dukkaṭa offense.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Upananda Sakyaputta had promised King Pasenadi of Kosala to keep Vassa with
    him, but on the way he saw two districts with many robes and kept Vassa there
    in order to obtain many robes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: King Pasenadi and moderate Bhikkhus were angry that Upananda broke his word,
    and they connected the act with falsehood, which the Blessed One had reproved.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The Blessed One summoned the Bhikkhus, questioned Upananda, received his admission,
    rebuked him for breaking his word, and said such conduct repels the unconverted
    and estranges many of the converted.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
