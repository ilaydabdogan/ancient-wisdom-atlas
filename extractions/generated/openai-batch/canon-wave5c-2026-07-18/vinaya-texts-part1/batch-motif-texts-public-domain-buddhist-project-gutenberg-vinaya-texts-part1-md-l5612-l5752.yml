canonical_text:
  quote: ''
  summary: Yasa awakens, sees the unattractive condition of his sleeping attendants,
    becomes weary of worldly pleasures, and leaves through gates opened by non-human
    beings. He reaches the deer park, where the Blessed One teaches him and he obtains
    the Eye of Truth. Yasa's parents search for him; his father follows the marks
    of Yasa's gilt slippers to the deer park. The Blessed One miraculously prevents
    the father from seeing Yasa at first, teaches the father, and the father takes
    refuge in the Blessed One, the Dhamma, and the fraternity of Bhikkhus, becoming
    the first lay-disciple by that formula.
  language: English
  quote_policy: summarized
