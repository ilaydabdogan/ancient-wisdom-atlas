  quote: ''
  summary: The passage opens the Mahavagga, First Khandhaka. It describes the newly
    awakened Buddha dwelling at Uruvela on the bank of the Nerañjara River at the
    foot of the Bodhi tree, sitting cross-legged there for seven days in the bliss
    of emancipation, and then contemplating the Chain of Causation in direct and reverse
    order during the first watch of the night. Editorial notes discuss the passage’s
    place in Vinaya tradition and compare the duration of this post-awakening stay
    with later Buddhist accounts.
