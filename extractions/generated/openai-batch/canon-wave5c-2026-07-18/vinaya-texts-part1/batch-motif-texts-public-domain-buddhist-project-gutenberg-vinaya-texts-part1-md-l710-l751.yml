  summary: The passage argues that the Parivara-paMa is a later abstract of other
    Vinaya materials and cites stanzas attributing its composition to Dipa after consulting
    former teachers. It then turns to difficult Vinaya terminology, especially offence
    classes in the Patimokkha and elsewhere, and quotes Rev. S. Coles's criticism
    of Buddhist morality based on procedures for remedying certain faults through
    confession or penance.
  language: English with Pali terms and transliterated Pali stanza
  quote_policy: summarized
