canonical_text:
  quote: ''
  summary: A sequence of monastic disciplinary rules regulates bowls, medicines, robes,
    yarn, woven cloth, donated benefits, and time limits. Repeated violations are
    classified as Paṭittiya offences involving forfeiture. The passage also includes
    explanatory notes on bullion removal, special robes, and robe time.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk who obtains another new bowl in exchange for an old one broken in fewer
    than five places commits a forfeiture offence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bowl must be forfeited to the company of monks; the worst bowl in that
    company is then given to the offending monk with instructions to keep it until
    it breaks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sick monks may receive and use ghee, butter, oil, honey, and molasses, storing
    them only up to the seventh day; exceeding that limit is a forfeiture offence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note describes disposal of gold or silver by asking that it be thrown away,
    or by appointing a monk as a bullion-remover to throw it away without marking
    the place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A monk may provide materials for rainy-season robes when one month of the
    hot days remains, and may make and wear them when half a month remains; doing
    so earlier is a forfeiture offence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A monk who has given robes to another monk and later takes them back, or has
    them taken back, because of anger or displeasure commits a forfeiture offence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A monk who asks for yarn and has weavers make it into cloth for robes commits
    a forfeiture offence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When unrelated lay donors have robe cloth woven for a particular monk, that
    monk commits a forfeiture offence if he gives pre-offer instructions about the
    cloth’s quality and compensates the weavers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A special robe received ten days before the Kattika full moon may be accepted
    and kept until robe time; keeping it beyond that is a forfeiture offence.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: An explanatory note defines special robe donations by examples of special
    circumstances such as imminent departure, illness, pregnancy, conversion, or edification.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the completion of vassa up to the Kattika full moon, a monk in an insecure
    and dangerous forest dwelling may leave one of his three robes in a hut inside
    a village and be separated from it up to the sixth night.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Separation from the robe for more than the permitted period requires permission
    from the monks; otherwise it is a forfeiture offence.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A monk who diverts to himself a benefit already dedicated to the Saṃgha commits
    a forfeiture offence.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The section closes by stating that the thirty forfeiture rules have been recited
    and by asking the monks whether they are pure in the matter.
  category: speech
  evidence_refs:
  - ev:13
