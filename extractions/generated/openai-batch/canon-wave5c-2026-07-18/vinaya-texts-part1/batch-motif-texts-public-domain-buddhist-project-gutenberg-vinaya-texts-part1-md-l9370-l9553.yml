canonical_text:
  quote: ''
  summary: 'The passage gives a sequence of Vinaya cases in which various persons
    enter or seek entry into the Bhikkhu order: royal soldiers, robbers, punished
    persons, and a debtor. Public, royal, or creditor complaints are reported, and
    the Blessed One establishes rules forbidding the pabba^a ordination for persons
    in specified legal or social conditions, with a dukka/a offence for the ordainer.'
  language: English translation with transliterated Indic terms
  quote_policy: summarized
