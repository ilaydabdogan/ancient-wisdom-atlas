canonical_text:
  quote: ''
  summary: The passage gives Vinaya rulings for Uposatha assemblies, Patimokkha recitation,
    late-arriving resident Bhikkhus, awareness or ignorance of absent residents, degrees
    of fault, schism-risk, and boundary-entry classifications. It also includes a
    brief rule about advising other Bhikkhus after atonement for an offence.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu who has atoned for an offence may advise other Bhikkhus to atone;
    if they do not atone, he is not required to continue speaking to them if he does
    not wish to.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Uposatha, four or more resident Bhikkhus assembled in a residence, did
    not know other resident Bhikkhus were absent, believed themselves complete while
    incomplete, and recited the Patimokkha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a greater number of other resident Bhikkhus arrives while the Patimokkha
    is being recited, the Patimokkha is to be recited again, and those who first recited
    it are free from guilt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If an equal or smaller number of other resident Bhikkhus arrives while the
    Patimokkha is being recited, the part already recited is treated as correctly
    recited, and the late arrivals hear the rest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When late arrivals come after the Patimokkha recital is finished, the cases
    are again distinguished by relative number; in equal or smaller-number cases the
    late arrivals proclaim their parisuddhi in the presence of the other brethren.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The text groups the unaware-incomplete assembly cases as fifteen cases in
    which there is no offence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If Bhikkhus know other resident Bhikkhus are absent and are conscious of their
    incompleteness, yet hold Uposatha and recite the Patimokkha, the decision changes
    from freedom from guilt to a dukkaṭa offence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: If Bhikkhus know other residents are absent, feel doubt about competence,
    or abandon themselves to misbehaviour, the decisions follow the same offence pattern
    as the consciously incomplete cases.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: If Bhikkhus know others are absent, dismiss them with the phrase “What are
    those people to us?”, and risk a schism while holding Uposatha and reciting the
    Patimokkha, the offence is described as thullaccaya, a grave sin.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Later classifications concern whether resident Bhikkhus know, see, or hear
    that other resident Bhikkhus are about to enter or have entered within the boundary,
    producing many systems of triads.
  category: sequence
  evidence_refs:
  - ev:9
