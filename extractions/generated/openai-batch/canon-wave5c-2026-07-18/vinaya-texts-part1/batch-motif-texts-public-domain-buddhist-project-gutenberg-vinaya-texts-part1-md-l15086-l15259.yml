canonical_text:
  quote: ''
  summary: The passage gives procedural rules for holding Pavara^a among Bhikkhus
    in groups of four, three, two, or one; describes the declaration inviting correction
    for offences seen, heard, or suspected; gives preparations for a solitary Bhikkhu;
    prohibits artificial reduction of the assembly by conveying declarations; and
    handles cases involving offences, late-arriving resident Bhikkhus, Bhikkhunis,
    parivasikas, alternate days, and concord among the Sa^gha.
  language: English translation with transliterated Indic terms and OCR variants
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four Bhikkhus are prescribed to hold Pavara^a with each other, after a learned
    and competent Bhikkhu proclaims a natti before them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The senior Bhikkhu adjusts his upper robe and pronounces Pavara^a before the
    others, asking them to speak out of compassion about offences seen, heard, or
    suspected, and saying he will atone if he sees an offence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When only three Bhikkhus are present, they are prescribed to hold Pavara^a
    with each other; when only two are present, the senior addresses the junior and
    the junior follows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A single Bhikkhu on Pavara^a day is told to sweep a place used by Bhikkhus,
    provide water and food, prepare seats, put a lamp there, and sit down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If other Bhikkhus come to the solitary Bhikkhu, he is to hold Pavara^a with
    them; if they do not come, he is to fix his mind on the thought that the day is
    his Pavara^a.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Where groups of five, four, three, or two Bhikkhus dwell together, they are
    not to convey another's Pavara^a declaration in order to hold the ceremony as
    a smaller group or only by thought; doing so is a dukka/a offence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Bhikkhu guilty of an offence on Pavara^a day may speak a statement about
    atoning when doubt is resolved and then hold Pavara^a; the offence is not to become
    a hindrance to holding Pavara^a.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If resident Bhikkhus hold Pavara^a while unaware that other resident Bhikkhus
    are absent, and a greater number arrive during the ceremony, all are to hold Pavara^a
    again; if an equal number arrive, the first group's ceremony is correct and the
    later group holds separately.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage prohibits holding Pavara^a in a seated assembly before a Bhikkhuni,
    accepting the Pavara^a declaration of a parivasika except before the assembly
    has risen, and holding Pavara^a on another day except for preserving concord among
    the Sa^gha.
  category: action
  evidence_refs:
  - ev:9
