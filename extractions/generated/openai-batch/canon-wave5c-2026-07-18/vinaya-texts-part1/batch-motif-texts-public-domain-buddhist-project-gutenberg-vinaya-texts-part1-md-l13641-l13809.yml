canonical_text:
  quote: I prescribe, O Bhikkhus, that you enter upon Vassa.
  summary: The passage gives Vinaya rules for the rainy-season residence. Public criticism
    of monks traveling in the rains and harming plants and small living beings leads
    the Blessed One to prescribe Vassa. He sets two entry periods, prohibits travel
    after entering Vassa before completing the required three months, forbids refusal
    or evasive departure, allows obedience to a royal request about timing, and addresses
    a lay patron's complaint when monks decline to travel to a newly built Vihara
    during Vassa.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: People complain that the Sakyaputtiya Samanas travel in winter, summer, and
    the rainy season, crushing green herbs, hurting vegetable life, and destroying
    many small living things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Bhikkhus report the public complaint to the Blessed One, who gives a
    religious discourse and prescribes entering upon Vassa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One prescribes that Vassa is to be entered in the rainy season
    and states that there are earlier and later periods for entering it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The earlier time for entering Vassa is the day after the full moon of Asadha;
    the later time is one month after that full moon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Chabbaggiya Bhikkhus enter upon Vassa but continue traveling during the
    Vassa period, leading to renewed public and monastic complaint.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One rules that one who has entered upon Vassa must not travel
    before keeping Vassa for the earlier or later three months; doing so is a dukkata
    offence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Chabbaggiya Bhikkhus are unwilling to enter upon Vassa, and the Blessed
    One forbids failing to enter upon Vassa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some Chabbaggiya Bhikkhus purposely leave their district to avoid entering
    Vassa on the prescribed day, and the Blessed One forbids doing so.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: King Seniya Bimbisara sends a messenger requesting that the Vassa period be
    postponed to the next full moon day, and the Blessed One prescribes obedience
    to kings.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Blessed One travels from Rajagaha to Savatthi and dwells in the Jetavana,
    the garden of Anathapindika.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The lay devotee Udena has a Vihara built for the Sangha and sends a messenger
    asking the Bhikkhus to come because he wants to give gifts, hear the Dhamma, and
    see the Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Bhikkhus refuse Udena's request on the ground that travel during Vassa
    has been prohibited, suggest he wait until Vassa is finished, or dedicate the
    Vihara before local Bhikkhus if there is urgent need.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Udena becomes annoyed and complains that the Bhikkhus refuse to come when
    he sends for them, though he is a giver and supporter of the fraternity.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: After Bhikkhus report Udena's complaint, the Blessed One gives a religious
    discourse and begins to allow Bhikkhus to go even during Vassa; the passage breaks
    off before the condition is stated.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: An editorial note compares the Buddhist double period for entering Vassa with
    double periods prescribed for Vedic festivals in Brahmana and Sutra materials.
  category: other
  evidence_refs:
  - ev:15
