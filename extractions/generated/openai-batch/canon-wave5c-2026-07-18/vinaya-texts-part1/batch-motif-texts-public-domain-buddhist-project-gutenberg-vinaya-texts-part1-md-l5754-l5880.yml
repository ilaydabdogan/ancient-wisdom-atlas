canonical_text:
  quote: ''
  summary: Yasa attains release from attachment and the Asavas while the Buddha is
    instructing Yasa's father. The Buddha ends a display of miraculous power, the
    householder sees Yasa, and the Buddha explains that Yasa cannot return to former
    household pleasures. The householder invites the Buddha to a meal. Yasa requests
    and receives pabbajja and upasampada ordination. Later, the Buddha visits the
    householder's home with Yasa as attendant; Yasa's mother and former wife hear
    the teaching, obtain the Eye of the Truth, take refuge in the Buddha, Dhamma,
    and fraternity of Bhikkhus, and are identified as the first female lay-disciples
    by that formula.
  language: English
  quote_policy: summarized
