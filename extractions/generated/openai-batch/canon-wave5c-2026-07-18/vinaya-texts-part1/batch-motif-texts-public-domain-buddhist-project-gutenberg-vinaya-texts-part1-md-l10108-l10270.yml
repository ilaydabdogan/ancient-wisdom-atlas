canonical_text:
  quote: ''
  summary: The passage gives disciplinary rules concerning novices, bans, food restrictions,
    consent of preceptors, drawing away another monk’s followers, causes for expelling
    novices, exclusion from ordination, and a case of a lay person adopting monastic
    outward signs in order to live among Bhikkhus.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus are told not to forbid novices the whole Saṅghārāma; a Bhikkhu who
    does so commits a dukkaṭa offence, and the permitted restriction is limited to
    the place where the novice lives or frequents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhikkhus forbade novices food taken with the mouth; lay people offered rice-milk
    and meals, novices refused because of the warning, and people complained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One rules that Bhikkhus must not forbid novices food taken with
    the mouth, and that doing so is a dukkaṭa offence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chabbaggiya Bhikkhus laid a ban on novices without the consent of the
    novices’ upajjhāyas; the upajjhāyas searched for the novices and objected.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One rules that no one should lay a ban on novices without the
    consent of their upajjhāyas, and that doing so is a dukkaṭa offence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Chabbaggiya Bhikkhus drew the followers of senior Bhikkhus over to themselves,
    leaving the Theras to obtain teeth-cleansers and rinsing water for themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Blessed One rules that no one should draw another Bhikkhu’s followers
    over to himself, and that doing so is a dukkaṭa offence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A novice named Kanaka, a follower of the venerable Upananda Sakyaputta, had
    sexual intercourse with a Bhikkhuni also named Kanaka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Blessed One prescribes ten cases in which a novice is to be expelled from
    the fraternity, including destroying life, theft, impurity, lying, strong drink,
    speaking against the Buddha, Dhamma, or Saṅgha, holding false doctrines, and sexual
    intercourse with Bhikkhunis.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A eunuch who has not received upasampadā ordination is not to receive it;
    if he has received it, he is to be expelled from the fraternity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person of an old family whose kinsmen had died away, and who was delicately
    nurtured, reasoned that he could not gain or increase wealth and sought an easy
    life.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The same person described the Sakyaputtiya Samaṇas as keeping commodious precepts
    and living a commodious life, with good meals and beds protected from wind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The person procured an alms-bowl and robes, had his hair and beard cut off,
    put on yellow robes, went to the Ārāma, saluted the Bhikkhus, and was asked how
    many years had elapsed since his upasampadā.
  category: sequence
  evidence_refs:
  - ev:9
