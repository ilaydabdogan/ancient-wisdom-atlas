canonical_text:
  quote: ''
  summary: Assaji gives Sariputta a brief statement of the Dhamma concerning causation
    and cessation. Sariputta attains the Eye of Truth, repeats the teaching to Moggallana,
    and Moggallana attains the same. The two decide to place themselves under the
    Blessed One's teaching, bring two hundred and fifty paribbajakas, reject Sanjaya's
    attempt to retain them in shared leadership, and go to Veluvana, where the Blessed
    One identifies them as an auspicious pair of pupils.
  language: English
  quote_policy: summarized
