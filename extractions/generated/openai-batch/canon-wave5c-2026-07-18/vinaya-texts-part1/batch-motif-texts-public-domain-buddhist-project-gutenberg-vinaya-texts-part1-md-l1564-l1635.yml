  summary: A monastic disciplinary rule declares that a Bhikkhu who falsely claims
    extraordinary spiritual knowledge or perception, and later acknowledges the falsehood,
    is defeated and no longer in communion unless the speech arose through undue confidence.
    The passage closes the recitation of the four Conditions of Defeat and includes
    a threefold purity inquiry answered by silence.
