canonical_text:
  quote: The venerable ones are pure herein. Therefore do they keep silence.
  summary: 'The passage closes a section on matters requiring expiation, gives the
    measure of the Sugata robe, and records a threefold inquiry into the purity of
    the assembly answered by silence. It then introduces four rules on matters requiring
    confession: accepting and eating food from an unrelated Bhikkhuni within houses;
    failing to rebuke a Bhikkhuni who directs serving while Bhikkhus eat in laymen''s
    houses; accepting and eating food from households under discipline without invitation
    or sickness; and accepting and eating food in a dangerous forest dwelling without
    prior notice to visitors, unless sick. Editorial notes compare robe-size and rule
    terminology with other Buddhist texts and passages.'
  language: English
  quote_policy: quoted
