canonical_text:
  quote: ''
  summary: 'The passage records rulings on admission to the order of Bhikkhus: multiple
    candidates may be ordained by one proclamation under certain conditions; eligibility
    by age may be reckoned from conception; candidates must be questioned about diseases
    and other disqualifications; candidates should be instructed before answering;
    and only a learned, competent, appointed Bhikkhu should instruct them before the
    assembly.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dispute over who would receive ordination first is resolved by the Theras
    proposing that the candidates be ordained together by one proclamation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One allows two or three persons to be ordained by one proclamation
    if they have the same upa^Mya, but not if they have different ones.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kumarakassapa had received upasampada after completing his twentieth year
    from conception, and he questions whether the ordination was valid because the
    rule forbade ordination under twenty years of age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One states that birth is to be reckoned from the arising of the
    first thought and consciousness in the womb, and allows upasampada for those who
    have completed the twentieth year from conception.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ordained Bhikkhus afflicted with leprosy, boils, dry leprosy, consumption,
    and fits are seen, after which questioning about disqualifications is prescribed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prescribed questions ask about specified diseases, being a man and male,
    freedom, debts, royal service, parental consent, being twenty years old, the state
    of the alms-bowl and robes, the candidate's name, and the upa^Mya's name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When candidates were asked about disqualifications without prior instruction,
    they became disconcerted and perplexed and could not answer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Blessed One prescribes that candidates should first be instructed and
    then asked about the disqualifications.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When instruction in the midst of the assembly still left candidates unable
    to answer, the Blessed One prescribes instructing them aside and asking them before
    the assembly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The instruction includes having the candidate choose an upa^Mya, showing the
    candidate the alms-bowl and robes, and directing the candidate where to stand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ignorant and unlearned Bhikkhus are forbidden to instruct candidates; a learned
    and competent Bhikkhu is prescribed for this task.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Instruction by an unappointed person is forbidden, and a procedure is given
    for appointing oneself or another Bhikkhu before the Sa^gha to instruct a named
    candidate.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The appointed instructor tells the candidate that it is time to speak the
    truth and explains how to answer affirmatively or negatively when questioned before
    the assembly.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the instruction, the instructor and candidate appear together before
    the assembly.
  category: sequence
  evidence_refs:
  - ev:8
