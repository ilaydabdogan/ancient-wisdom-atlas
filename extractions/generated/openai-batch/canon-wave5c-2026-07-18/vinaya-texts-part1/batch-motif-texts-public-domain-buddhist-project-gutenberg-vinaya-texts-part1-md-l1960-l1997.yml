canonical_text:
  quote: ''
  summary: 'The passage gives a monastic disciplinary procedure: a Bhikkhu who knowingly
    conceals an offense must undergo probation for the same number of days as the
    concealment, then six days of Manatta penance, and then be reinstated only by
    a community of twenty Bhikkhus. A smaller community cannot validly reinstate him.
    The recitation then asks the venerable ones three times whether they are pure
    in the matter; their silence is understood as purity, and the recitation of the
    Samghadisesas ends.'
  language: English
  quote_policy: summarized
