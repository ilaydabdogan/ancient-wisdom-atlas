  text: Resident and incoming Bhikkhus may count the Uposatha day differently, including
    as the fourteenth, fifteenth, or first day of a pakkha.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: When resident and incoming Bhikkhus count the fourteenth and fifteenth differently,
    the prescribed accommodation depends on which group is greater or whether the
    groups are equal in number.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When one group counts the first day and the other the fifteenth, the rules
    allow refusing communion in some cases and instruct a group to go outside the
    boundary to hold Uposatha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
