  quote: ''
  summary: A Vinaya passage gives procedural rules for resident and incoming Bhikkhus
    when they disagree about the Uposatha day, when they must accommodate one another
    or hold Uposatha outside a boundary, how they must respond to signs of other monks'
    presence, and when holding Uposatha together or apart is an offence.
  language: English translation with Pali terms
