  text: Sounds of arrival, shaking out shoes, clearing the throat, and sneezing are
    treated as audible signs of incoming Bhikkhus' presence.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The distinction between Bhikkhus of the same district and a different district
