canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rules involving forfeiture: limits on seeking
    robes from a robe-fund, rules about rugs or mats made with silk or goats'' wool,
    time and distance limits for certain monastic possessions, restrictions involving
    unrelated Bhikkhunis, prohibitions on gold, silver, transactions, buying and selling,
    and a ten-day limit for a spare bowl. Notes explain terms, cross-references, and
    procedures for forfeited money.'
  language: English
