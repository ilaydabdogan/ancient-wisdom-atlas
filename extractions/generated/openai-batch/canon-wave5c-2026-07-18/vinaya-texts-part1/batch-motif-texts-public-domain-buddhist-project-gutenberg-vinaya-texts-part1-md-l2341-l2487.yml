literal_observations:
- id: obs:1
  text: A Bhikkhu seeking robes may stand silently on the matter up to the fourth,
    fifth, or sixth time; obtaining robes by exerting himself beyond that point is
    said to be a Pa/£ittiya offence involving forfeiture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the Bhikkhu does not obtain the robes, he should go himself or send a messenger
    to the source of the robe-fund and tell them the fund has not benefited the Bhikkhu
    and that they should take care of their own property.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Having a rug or mat made with silk in it is stated to be a Pa/£ittiya offence
    involving forfeiture.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Having a rug or mat made of pure black goats' wool is stated to be a Pa/£ittiya
    offence involving forfeiture.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a new rug, the passage prescribes portions of pure black goats' wool,
    white wool, and tawny or reddish-brown wool; making it without those portions
    is an offence involving forfeiture.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A new rug should be used for six years; having another new rug made within
    six years is an offence unless the Bhikkhus give permission.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When making a new seat-rug, a span's breadth from all around the old rug must
    be taken in order to disfigure it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Bhikkhu on a journey who gets goats' wool may accept it and, if there are
    no porters, carry it by hand for three leagues; carrying it farther is an offence
    involving forfeiture.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Bhikkhu getting goats' wool washed, dyed, or combed out by an unrelated
    Bhikkhuni is stated to commit an offence involving forfeiture.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Receiving gold or silver, having someone receive it for him, or allowing it
    to be kept in deposit for him is stated to be an offence involving forfeiture.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note describes a procedure in which a guilty Bhikkhu gives up gold or silver
    to the community, and an aramika or upasaka may use it to buy ghee or oil for
