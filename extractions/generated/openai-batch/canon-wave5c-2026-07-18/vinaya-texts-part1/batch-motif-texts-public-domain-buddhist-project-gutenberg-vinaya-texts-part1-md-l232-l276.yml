  summary: The passage is a textual-critical discussion of the Patimokkha. It describes
    irregular arrangement of offence clauses, possible grouping into tens, cautions
    against using such features to infer relative age, and explains the relationship
    between the Patimokkha, the Sutta-vibhaiiga, and the Vinaya Pitaka.
  language: English
  quote_policy: summarized
