canonical_text:
  quote: "“approve a site free from danger, and with an open space around it”"
  summary: 'The passage gives Samghadisesa disciplinary rules about monastic dwellings
    and accusations: a Bhikkhu must bring other Bhikkhus to approve a safe and open
    site before a hut or large residence is made, and a Bhikkhu who maliciously harasses
    another with a groundless Paragika accusation is described as seeking to make
    him leave the religious life.'
  language: English
  quote_policy: quoted
