canonical_text:
  quote: ''
  summary: 'The supplied passage first closes the story of Mara: desire for sense
    objects has ceased, Death is addressed as struck down, and Mara realizes that
    the Blessed One knows him and vanishes sadly. The passage then explains that Bhikkhus
    were bringing ordination candidates from distant places to the Buddha, causing
    fatigue. The Blessed One reflects in solitude and then authorizes Bhikkhus to
    confer pabbajja and upasampada ordinations locally. He prescribes a procedure
    involving cutting hair and beard, wearing yellow robes, covering one shoulder,
    saluting the Bhikkhus, squatting, raising joined hands, and repeating refuge in
    the Buddha, Dhamma, and Saṅgha three times.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
