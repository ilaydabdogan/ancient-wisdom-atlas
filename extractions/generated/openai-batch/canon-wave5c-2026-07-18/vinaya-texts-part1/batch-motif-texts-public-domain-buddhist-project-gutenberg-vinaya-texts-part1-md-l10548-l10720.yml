canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rules on admission to the Bhikkhu order: upasampada
    is forbidden without proper alms-bowl and robes, pabbajja is forbidden for listed
    categories of persons, nissaya with shameless Bhikkhus is forbidden, and temporary
    exceptions are allowed for monks unable to obtain nissaya while travelling, sick,
    nursing the sick, or living in a forest dwelling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One prohibits conferring upasampada ordination on a person without
    an alms-bowl and states that the conferrer commits a dukka/a offence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhikkhus had conferred upasampada on persons without robes, without bowl and
    robes, or with borrowed bowls or robes; after ordination such persons went for
    alms naked or received alms with their hands, and people were annoyed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The section closes by identifying twenty cases in which upasampada is forbidden.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bhikkhus conferred pabbajja ordination on persons with listed bodily injuries,
    impairments, illnesses, visible deformities, branded or scourged status, or proclaimed
    robber status; the Blessed One prohibits these cases and assigns a dukka/a offence
    to the conferrer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Chabbaggiya Bhikkhus gave nissaya to shameless Bhikkhus, and the Blessed
    One forbids giving such nissaya.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Bhikkhus lived in dependence on shameless Bhikkhus and later became shameless,
    bad Bhikkhus; the Blessed One forbids living in such dependence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Bhikkhus ask how to discern modest and shameless persons, the Blessed
    One prescribes waiting four or five days to observe a Bhikkhu's behavior toward
    other Bhikkhus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A travelling Bhikkhu in Kosala who cannot obtain nissaya is allowed to live
    without nissaya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A sick Bhikkhu who cannot obtain nissaya is allowed to live without it, and
    a Bhikkhu nursing a sick Bhikkhu may also do so if unable to obtain nissaya and
    asked to remain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A forest-dwelling Bhikkhu with a pleasant dwelling-place raises the same nissaya
    problem; the passage begins an allowance for such a forest-dwelling Bhikkhu.
  category: setting
  evidence_refs:
  - ev:5
