canonical_text:
  quote: ''
  summary: A Brahmana asks the Bhikkhus for pabbajja ordination and is refused, becoming
    visibly emaciated. Sariputta recalls that the Brahmana once caused a spoonful
    of food to be given to him, and the Blessed One praises gratitude and instructs
    Sariputta to confer ordination. The Blessed One then replaces upasampada by threefold
    refuge declaration with a formal act of the Order using an announcement and three
    questions. A later case of a newly ordained Bhikkhu who says he never asked for
    ordination leads to a rule that ordination must be given only after the candidate
    asks, with prescribed gestures and a threefold request.
  language: English translation with transliterated Indic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A certain Brahmana came to the Bhikkhus asking for pabbajja ordination; the
    Bhikkhus were unwilling to ordain him, and he became emaciated and discoloured
    with visible veins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One saw the Brahmana's condition and asked the Bhikkhus why he
    had become so emaciated; they reported that he had asked for ordination and had
    not obtained it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sariputta remembered that the Brahmana had once ordered a spoonful of food
    to be given to him while Sariputta was going through Rajagaha for alms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blessed One praised gratitude and remembrance of benefits, then told Sariputta
    to confer pabbajja and upasampada ordinations on the Brahmana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Blessed One abolished upasampada ordination by the threefold declaration
    of taking refuge and prescribed upasampada by a formal act of the Order in which
    an announcement is followed by three questions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ordination formula names a person who desires upasampada with a named
    preceptor; those in favour are to remain silent and those not in favour are to
    speak, with the question repeated a second and third time.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: A certain Bhikkhu soon after upasampada abandoned himself to bad conduct and,
    when admonished, answered that he had never asked them to confer upasampada on
    him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Blessed One ruled that no one should ordain a person unless asked, and
    that ordaining without being asked is a dukkata offence.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: The candidate is instructed to go to the Sangha, arrange the upper robe over
    one shoulder, salute the Bhikkhus' feet with his head, squat, raise joined hands,
    and ask three times for upasampada, requesting to be drawn out of the sinful world
    out of compassion.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The later formula adds that the named candidate asks the Sangha for upasampada
    with the named preceptor.
  category: speech
