canonical_text:
  quote: ''
  summary: Bhikkhus concerned with training complain about other Bhikkhus wearing
    improper under and upper garments on alms rounds and making loud noise in dining
    halls. The matter is reported to the Blessed One, who assembles the fraternity,
    questions the Bhikkhus, receives confirmation, rebukes the misconduct, and teaches
    against indulgent qualities while praising frugality, moderation, contentment,
    reverence, and energy.
  language: English
