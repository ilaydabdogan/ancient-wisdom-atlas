literal_observations:
- id: obs:1
  text: The Blessed One rebukes Bhikkhus, gives a religious discourse, and forbids
    knowingly conferring upasampada ordination on a person under twenty years of age.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A family dies of pestilence except for a father and son; both receive pabbajja
    ordination with the Bhikkhus and go together for alms.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During alms rounds, the boy asks his father to give him food, and people complain
    about the Sakyaputtiya Samanas.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Blessed One forbids conferring pabbajja ordination on a boy under fifteen
    years of age and assigns a dukkata offence for doing so.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A pious family devoted to Ananda dies of pestilence, leaving two boys who
    approach Bhikkhus, are turned away, and cry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ananda asks how the two boys may avoid perishing; after asking whether they
    can scare crows, the Blessed One allows pabbajja for crow-keeper boys under fifteen.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Upananda has two novices, Kanaka and Mahaka, who commit sodomy with each other;
    after complaint, the Blessed One forbids ordaining two novices.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Blessed One stays at Rajagaha through the rainy season, winter, and summer;
    people complain that the regions are covered by darkness for the Sakyaputtiya
    Samanas and that they cannot discern the regions.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Blessed One instructs Ananda to announce a journey to Dakkhinagiri, and
    Ananda takes a key and speaks to Bhikkhus in every cell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Many Bhikkhus decline to travel because of rules about dependence on teachers
    and preceptors and concerns about taking nissaya again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Blessed One goes to Dakkhinagiri with only a few Bhikkhus and later returns
    to Rajagaha.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After Ananda reports the reason for the small following, the Blessed One prescribes
