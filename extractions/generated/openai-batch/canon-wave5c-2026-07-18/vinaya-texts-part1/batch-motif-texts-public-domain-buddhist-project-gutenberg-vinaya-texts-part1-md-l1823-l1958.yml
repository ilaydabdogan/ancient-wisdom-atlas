canonical_text:
  quote: ''
  summary: 'The passage gives monastic disciplinary rules for Bhikkhus: supporters
    of a divisive Bhikkhu, a Bhikkhu refusing correction, and a Bhikkhu whose conduct
    harms lay families are to be addressed by the community and, if persistent, formally
    adjured up to a third time. Failure to abandon the course constitutes a Saṅghādisesa
    offense. The passage closes by enumerating thirteen matters requiring formal meetings
    of the Order.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu who persists after being spoken to is to be formally admonished
    by the Bhikkhus as a body up to the third time; if he does not abandon the course,
    the matter is a Saṅghādisesa offense.
  category: sequence
  evidence_refs:
  - ev:1
