- id: obs:3
  text: The Bhikkhus are instructed to tell the adherents not to support division
    in the community and to be at one with the community under one discipline.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the adherent Bhikkhus persist after being addressed, they are to be formally
