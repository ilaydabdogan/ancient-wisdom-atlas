canonical_text:
  quote: ''
  summary: Upaka questions the Blessed One about his teacher and doctrine. The Blessed
    One declares himself teacherless, awakened, emancipated, and on the way to Benares
    to proclaim the Truth. Upaka departs. The Blessed One then reaches the deer park
    at Isipatana, where five Bhikkhus first agree not to honor him but then receive
    him with services. They question his attainment after his abandonment of austerities;
    after repeated replies, they are persuaded and attend to his teaching. He teaches
    avoidance of the two extremes of sensual pleasure and mortification, and presents
    the Middle Path leading to insight, wisdom, calm, Sambodhi, and Nirvana.
  language: English
  quote_policy: summarized
