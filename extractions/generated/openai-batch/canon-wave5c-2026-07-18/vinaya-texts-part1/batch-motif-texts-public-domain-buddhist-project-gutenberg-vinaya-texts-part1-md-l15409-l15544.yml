canonical_text:
  quote: ''
  summary: 'The passage gives rules for the Pavara^a ceremony: a monk guilty of an
    offence may be reproved after leave is requested; refusal to give leave can lead
    to inhibition of that monk''s Pavara^a before the assembled Sawgha. It forbids
    groundless or late inhibition, distinguishes valid from invalid inhibition by
    ritual timing, and sets procedures for silencing or questioning an inhibiting
    monk according to his conduct and competence.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
