- id: obs:1
  text: If the upa^//aya wishes to bathe, the attendant is instructed to prepare a
    bath and obtain cold or hot water according to his wish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For entry into the bathing-place, the attendant is told to knead powder, moisten
    clay, carry and give a chair, take and set aside the robe, and give powder and
    clay.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person entering the bathing-place is instructed to besmear the face with
    clay, cover himself in front and behind, and enter in that state.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The attendant is told not to encroach on senior Bhikkhus and not to dislodge
