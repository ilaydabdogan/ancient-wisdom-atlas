canonical_text:
  quote: ''
  summary: 'The passage prescribes duties of a saddhiviharika toward an upa^//aya:
    preparing baths and bath-house items, observing seating etiquette among senior
    and junior Bhikkhus, attending the upa^//aya in and after bathing, calling for
    discourse or questions when desired, cleaning the Vihara and related rooms, restoring
    furnishings and monastic possessions to their places, adjusting windows according
    to wind and weather, and providing water and food when absent.'
  language: English translation with transliterated Indic terms
  quote_policy: summarized
