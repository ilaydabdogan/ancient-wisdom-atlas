canonical_text:
  quote: ''
  summary: 'Rules regulate Bhikkhus'' movement on the Uposatha day, restrict Patimokkha
    recitation before specified persons, and define exceptions for purity declarations
    and concord in the Saṅgha. The next section introduces residence during the rainy
    season: before this retreat had been instituted, Bhikkhus traveled in all seasons,
    provoking public criticism that they harmed plants and small living beings, unlike
    other ascetics and birds that withdraw during the rains.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the Uposatha day, Bhikkhus are told not to go from places where Bhikkhus
    are present to places where no Bhikkhus are present, except with a Saṅgha or in
    a case of danger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the Uposatha day, movement between residences with Bhikkhus of different
    districts is prohibited except under the stated exceptions, while movement to
    Bhikkhus of the same district is permitted if arrival that day is possible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Patimokkha is not to be recited in a seated assembly before a Bhikkhuni,
    sikkhamana, samanera, samaneri, one who has abandoned the precepts, or one guilty
    of an extreme offence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Patimokkha is also not to be recited before specified expelled or disqualified
    persons, including those refusing to see, atone for, or renounce an offence or
    false doctrine, and before a eunuch, a furtive adherent, or a hermaphrodite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Uposatha is not to be held by accepting the parisuddhi declaration of a parivasika
    unless the assembly has not yet risen, and is not to be held on another day except
    for re-establishing concord among the Saṅgha.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One is said to dwell at Rajagaha, in the Veluvana, in the Kalandakanivapa.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the rainy-season retreat had been instituted for the Bhikkhus, they
    traveled during winter, summer, and the rainy season alike.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: People became annoyed and angry, saying that the Sakyaputtiya Samanas crushed
    green herbs, hurt vegetable life, and destroyed many small living things by traveling
    during the rainy season.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The public complaint says that ascetics of Titthiya schools retire during
    the rainy season and arrange places to live, and that birds make nests on tree
    summits and retire during the rainy season.
  category: speech
  evidence_refs:
  - ev:5
