canonical_text:
  quote: ''
  summary: 'A sequence of Vinaya rules states that specified conduct by a Bhikkhu
    incurs a Pa/£ittiya: using an unmarked new robe; using a robe after formally making
    it over; hiding another monk''s articles; killing or knowingly drinking water
    containing living things; reopening settled matters; concealing serious offences;
    admitting an underage person to the higher grade; travelling by appointment with
    robbers or a woman; asserting that dangerous qualities are not dangerous; and
    associating with an uncorrected monk who holds that assertion. Footnotes explain
    several formal procedures and cite parallels in nearby Vinaya material.'
  language: English with Pali terms in transliteration
  quote_policy: summarized
