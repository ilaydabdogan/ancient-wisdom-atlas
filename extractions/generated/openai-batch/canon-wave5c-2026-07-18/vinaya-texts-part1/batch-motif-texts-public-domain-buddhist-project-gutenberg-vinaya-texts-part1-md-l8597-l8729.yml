canonical_text:
  quote: ''
  summary: The passage explains that Tathagatas ask purposeful questions at the proper
    time, then narrates the Buddha questioning and rebuking Upananda for taking a
    disciple too soon. The Buddha institutes rules requiring ten years' seniority,
    and later learning and competence, before a monk may confer upasampada ordination.
    A further rule prescribes that young monks choose an acariya, live in dependence
    for ten years, and relate to teacher and disciple as father and son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Tathagatas ask or do not ask about known matters according
    to the right time, and ask questions for preaching doctrine or instituting a rule
    of conduct.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One asks Upananda how many years he has completed since upasampada,
    asks the same about another Bhikkhu, and asks their relation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Upananda says he has completed two years, the other Bhikkhu has completed
    one year, and the other Bhikkhu is his saddhiviharika.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buddha rebukes Upananda as unfit to give exhortation and instruction to
    another Bhikkhu and says he has too quickly taken on followers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buddha prescribes that no one may confer upasampada ordination without
    completing ten years; violation is a dukkaṭa offence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ignorant and unlearned Bhikkhus who said they had completed ten years conferred
    upasampada ordination, producing cases of deficient preceptors and more capable
    disciples.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Bhikkhu formerly belonging to a Titthiya school silenced his preceptor during
    a Dhamma-based remonstration and returned to the Titthiya school.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Moderate Bhikkhus complain about ignorant and unlearned Bhikkhus conferring
    upasampada ordination.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After rebuking those Bhikkhus, the Buddha prescribes that only a learned,
    competent Bhikkhu who has completed ten years or more may confer upasampada ordination.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some Bhikkhus whose preceptors were absent, returned to lay life, dead, or
    schismatic lacked acariyas and instruction and wore improper garments on alms
    rounds.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Buddha prescribes that young Bhikkhus choose an acariya.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The acariya is to consider the antevasika as a son, and the antevasika is
