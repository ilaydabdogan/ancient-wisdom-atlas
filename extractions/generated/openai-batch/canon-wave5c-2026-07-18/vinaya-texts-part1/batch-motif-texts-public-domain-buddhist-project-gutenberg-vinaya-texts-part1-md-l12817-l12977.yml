canonical_text:
  quote: ''
  summary: The passage gives rules for holding Uposatha when a Bhikkhu is obstructed,
    absent, mentally unstable, or when only four, three, two, or one Bhikkhu is present.
    It prescribes formal leave for the mad Bhikkhu Gagga, quorum-related forms of
    Patimokkha recitation or purity-declaration Uposatha, bodily gestures for declaring
    purity, solitary preparations for Uposatha, and offenses for improperly holding
    rites with an incomplete or artificially reduced assembly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If relations cannot be moved aside or outside the boundary and the assembly
    remains incomplete, Uposatha is not to be held; holding it in that condition is
    a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A case is mentioned in which a Bhikkhu is seized on Uposatha day by kings,
    robbers, rascals, hostile Bhikkhus, or similar persons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One orders the Bhikkhus to assemble because the Saṅgha has official
    duties to perform.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu reports that Gagga, described as a mad Bhikkhu, is not present.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Two kinds of mad Bhikkhus are distinguished: one who intermittently remembers
    and attends Uposatha and official acts, and another who does not remember or attend
    them.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the intermittently remembering and attending mad Bhikkhu, the Saṅgha is
    instructed to grant ummattakasammuti, the madman’s leave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A learned, competent Bhikkhu is to proclaim a formal motion granting Gagga
    leave so that the Saṅgha may hold Uposatha and perform official acts with or without
    him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When four Bhikkhus are present at a residence on Uposatha day, they are allowed
    to recite the Patimokkha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When three Bhikkhus are present, they are allowed to hold parisuddhi-uposatha
    with one another.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In parisuddhi-uposatha, the senior Bhikkhu covers one shoulder with the upper
    robe, sits squatting, raises joined hands, and declares purity to the other Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Younger Bhikkhus in turn perform the same bodily arrangement and declare their
    purity to the senior Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: When two Bhikkhus are present, they are allowed to hold parisuddhi-uposatha.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A single Bhikkhu on Uposatha day is instructed to sweep a regularly used place,
    provide water and food, prepare seats, put a lamp there, and sit down.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: If other Bhikkhus arrive, the single Bhikkhu is to hold Uposatha with them;
    if they do not arrive, he is to fix his mind on the thought that the day is his
    Uposatha.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Groups of four, three, or two Bhikkhus are forbidden to reduce the required
    form by conveying the parisuddhi of one member; doing so is a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:14
