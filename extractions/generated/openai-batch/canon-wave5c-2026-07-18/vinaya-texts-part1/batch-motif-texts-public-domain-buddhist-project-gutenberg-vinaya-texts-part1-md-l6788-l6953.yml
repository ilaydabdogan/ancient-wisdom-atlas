canonical_text:
  quote: Everything, O Bhikkhus, is burning.
  summary: The Blessed One tells Uruvela Kassapa that he is not an araha and has not
    entered the path. Uruvela Kassapa requests ordination, informs his five hundred
    Jaṭila followers, and they discard their hair, braids, provisions, and agnihotra
    implements into the river before receiving ordination. Nadi Kassapa and Gaya Kassapa
    see the discarded objects carried downstream, fear for their brothers, come with
    their followers, and likewise join. A note reports fire-related wonders at Uruvela.
    The Blessed One then goes to Gayāsīsa with one thousand former Jaṭilas and teaches
    that the senses and mind are burning with lust, anger, ignorance, and suffering;
    through this exposition the thousand bhikkhus are released from attachment and
    the Asavas.
  language: English translation
  quote_policy: quoted
