canonical_text:
  quote: ''
  summary: The passage prescribes that young Bhikkhus choose an upajjhaya, or preceptor.
    It defines the preceptor-pupil relationship through a father-son analogy, gives
    the formal gestures and words for choosing a preceptor, and lists detailed duties
    of the pupil toward the preceptor in daily service, village travel, alms-round
    attendance, speech restraint, meals, cleaning, and care of robes and bowl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses Bhikkhus and prescribes that young Bhikkhus choose an
    upajjhaya, or preceptor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preceptor is instructed to consider the pupil as a son, and the pupil
    is instructed to consider the preceptor as a father, with mutual reverence, confidence,
    and communion of life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The candidate chooses a preceptor by adjusting the upper robe over one shoulder,
    saluting the intended preceptor's feet, squatting, raising joined hands, and repeating
    the request three times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The preceptor is counted as chosen only if acceptance is expressed by word,
    gesture, or both; without such expression, the preceptor has not been chosen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pupil's morning duties include rising early, removing shoes, arranging
    the robe, giving a teeth-cleanser and mouth-rinsing water, preparing a seat, offering
    rice-milk if present, cleaning the jug, removing the seat, and sweeping a dirty
    place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the preceptor wishes to go into the village, the pupil prepares garments,
    girdle, upper robes, and alms-bowl; if serving as attendant, the pupil dresses
    properly, follows at a proper distance, and handles what is put into the preceptor's
    bowl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pupil is told not to interrupt the preceptor when he speaks, but to hold
    him back if his words risk an offence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the preceptor's return, the pupil prepares a seat, water for washing feet,
    a foot-stool, and a towel, meets the preceptor, takes his bowl and robe, manages
    garments, dries and folds the robe, and offers food if desired.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the meal, the pupil offers drinking water, rinses and dries the alms-bowl,
    stores the bowl and robe carefully, puts away washing items, removes the seat,
    and sweeps if the place is dirty.
  category: sequence
  evidence_refs:
  - ev:6
