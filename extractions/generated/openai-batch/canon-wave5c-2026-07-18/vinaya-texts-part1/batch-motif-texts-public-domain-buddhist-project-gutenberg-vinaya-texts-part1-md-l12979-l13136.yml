canonical_text:
  quote: ''
  summary: The passage gives Vinaya procedures for handling offences before or during
    Uposatha and Patimokkha recitation. It prescribes individual confession gestures
    and formulas, permits declared postponement where doubt remains, forbids common
    confession of a shared offence, and provides procedures for a whole resident Sangha
    guilty of a common offence, including sending one Bhikkhu to atone first or making
    a formal proclamation before later atonement. It also describes consultation with
    another Bhikkhu to identify the name and class of an offence.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A certain Bhikkhu is guilty of an offence on the day of Uposatha and is concerned
    because Uposatha has been prescribed not to be held by a guilty Bhikkhu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a guilty Bhikkhu on Uposatha, the Blessed One prescribes going to one
    Bhikkhu, arranging the upper robe to cover one shoulder, squatting, raising joined
    hands, confessing the offence, acknowledging that he sees it, and being told to
    refrain in future.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Bhikkhu who doubts whether there is an offence may state the doubt, promise
    to atone when doubt is removed, and then hold Uposatha and hear the Patimokkha
    without hindrance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The A^abbaggiya Bhikkhus confess a shared offence in common and also accept
    a common confession; both acts are prohibited and assigned a dukkaṭa offence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Bhikkhu who remembers an offence while the Patimokkha is being recited is
    instructed to tell a neighboring Bhikkhu that he will atone after rising from
    the assembly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the whole Sangha in a residence is guilty of a common offence on Uposatha,
    the Bhikkhus are instructed to send one Bhikkhu to a neighboring residence so
    that he may atone first and then return as the person before whom the others atone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the preceding procedure does not succeed, a learned and competent Bhikkhu
    is to proclaim a ñatti before the Sangha stating that the Sangha will atone before
    another pure, guiltless Bhikkhu when it sees one; Uposatha and the Patimokkha
    are then to proceed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the whole Sangha doubts a common offence, a learned and competent Bhikkhu
    is to proclaim that the Sangha will atone when it has no doubt.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: For a Sangha that has entered vassa and is guilty of a common offence, the
    passage refers to the same procedure and allows sending one Bhikkhu away for seven
    days to atone and return.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the whole Sangha does not know the name or class of a common offence,
    another Bhikkhu anxious for training arrives, and one Bhikkhu asks him what offence
    is committed by such an action.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The consulted Bhikkhu identifies the offence and urges the questioner to atone
    for his own offence rather than focus on whether others are guilty or guiltless.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After atoning by the advice of the consulted Bhikkhu, the questioner tells
    the other Bhikkhus the offence classification and advises them to atone; they
    refuse to atone by his advice.
  category: sequence
  evidence_refs:
  - ev:9
