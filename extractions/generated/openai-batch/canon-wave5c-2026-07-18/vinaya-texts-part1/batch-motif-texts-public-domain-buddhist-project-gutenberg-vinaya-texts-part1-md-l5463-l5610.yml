canonical_text:
  quote: ''
  summary: After Mahanama and Assail receive upasampada ordination, the Blessed One
    teaches the five Bhikkhus that body, sensation, perception, Sankharas, and consciousness
    are not self, are perishable, and are not to be regarded as mine, me, or my self.
    The discourse describes disenchantment, freedom from passion, exhaustion of rebirth,
    and no further return; the five Bhikkhus are released from the Asavas, and six
    Arahats are said to be in the world. The next episode introduces Yasa in Benares
    as a delicately nurtured treasurer's son living in seasonal palaces, surrounded
    by female musicians, falling asleep before his attendants while an oil lamp burns
    through the night. An editorial note compares this Yasa scene with a Bodhisatta
    scene in cited Buddhist sources.
  language: English translation with Pali terms
  quote_policy: summarized
