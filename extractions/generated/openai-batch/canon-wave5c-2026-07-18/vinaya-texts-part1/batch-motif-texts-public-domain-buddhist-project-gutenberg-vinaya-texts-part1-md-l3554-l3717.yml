canonical_text:
  quote: ''
  summary: Rules 78-92 prescribe Pācittiya/forfeiture-related offenses for Bhikkhus
    concerning overhearing disputes, grumbling after consent, leaving a formal inquiry
    without consent, complaints over gifts, diverting Sangha property, entering royal
    or village spaces improperly, handling jewels, and making or using regulated monastic
    objects and garments beyond permitted forms or measures.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu commits a Pācittiya offense if he stands nearby to overhear quarreling
    or disputing Bhikkhus with the sole purpose of hearing what they say.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikkhu commits a Pācittiya offense if, after declaring consent to formal
    proceedings conducted according to the Dhamma, he later grumbles about those proceedings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Bhikkhu commits a Pācittiya offense if, while the Sangha is conducting a
    formal inquiry, he rises and leaves without declaring consent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu commits a Pācittiya offense if, after giving away a robe in a regularly
    constituted Sangha, he later grumbles that the Bhikkhus allocate Sangha property
    according to friendship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Bhikkhu commits a Pācittiya offense if he knowingly diverts property dedicated
    to the Sangha for the use of an individual.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Bhikkhu commits a Pācittiya offense if he crosses the threshold of an anointed
    Khattiya king without first being announced when the king has not gone forth and
    the queen has not withdrawn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Bhikkhu commits a Pācittiya offense if he picks up, or causes another to
    pick up, a jewel or jewel-equivalent except in a grove or dwelling-place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a Bhikkhu picks up a jewel or jewel-equivalent in a grove or dwelling-place,
    the item is to be laid aside so that its owner may take it away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Bhikkhu commits a Pācittiya offense if he enters a village out of hours
    without informing a present Bhikkhu, unless sufficient special business applies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Bhikkhu who has a needle-case made of bone, ivory, or horn must have it
    broken up, and the act is a Pācittiya offense.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
