canonical_text:
  quote: ''
  summary: Yasa brings four lay friends to the Blessed One and asks that they receive
    exhortation and instruction. After hearing the teaching, they see the Truth, request
    the pabba^a and upasampada ordinations, are admitted as Bhikkhus, and are released
    from attachment and the Asavas. A second group of fifty friends of Yasa likewise
    receives instruction and release. The Blessed One then commissions the Bhikkhus
    to wander separately and preach the doctrine for the welfare of many beings. Mara
    approaches and claims that the Buddha is bound by fetters; the Buddha replies
    that he is delivered from all fetters and addresses Mara as Death.
  language: English translation with Pali terms
  quote_policy: summarized
