canonical_text:
  quote: ''
  summary: Unnamed persons take refuge in the Blessed One and the Dhamma and are described
    as the first lay-disciples by the dyad formula. After seven days, the Blessed
    One leaves meditation at the Rajayatana tree, goes to the Ajapala banyan tree,
    and reflects that the doctrine is profound and difficult for desire-bound people
    to understand. His mind inclines toward silence. Brahma Sahampati perceives this,
    appears before him, kneels with joined hands, and requests that he preach, arguing
    that some beings can understand and attain salvation. Brahma urges him to open
    the door of the Immortal, look upon suffering beings from a lofty vantage, arise,
    wander, and teach.
  language: English
  quote_policy: summarized
