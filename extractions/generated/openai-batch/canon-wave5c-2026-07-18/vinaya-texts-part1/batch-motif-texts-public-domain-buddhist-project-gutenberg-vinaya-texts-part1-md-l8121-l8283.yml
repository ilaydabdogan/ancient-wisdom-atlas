canonical_text:
  quote: ''
  summary: The passage concludes rules for an upajjhaya's practical care of a saddhiviharika,
    including robe care and nursing during sickness. It then gives a disciplinary
    sequence in which saddhiviharikas fail to observe proper conduct toward their
    upajjhayas, the matter is reported to the Blessed One, and rules are issued concerning
    offences, turning away, begging pardon, forgiveness, and criteria for when a saddhiviharika
    should or should not be turned away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The upajjhaya is instructed to tell the saddhiviharika how to wash, make,
    boil dye for, and dye a robe, or to ensure that these tasks are done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When dyeing a robe, the robe is to be dyed properly, turned when required,
    and not left before the dye has stopped dripping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the saddhiviharika is sick, the upajjhaya is to nurse him as long as his
    life lasts and wait until he has recovered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Saddhiviharikas were said not to observe proper conduct toward their upajjhayas;
    moderate Bhikkhus complained and reported the matter to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One questioned the Bhikkhus, received confirmation, rebuked the
    conduct, delivered a religious discourse, and declared non-observance of proper
    conduct a dukkaṭa offence.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: A saddhiviharika who does not observe proper conduct is to be turned away
    by an upajjhaya using specified words, gesture, or both.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If no gesture, word, or combined gesture and word is expressed, the saddhiviharika
    is not considered turned away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A saddhiviharika who has been turned away is prescribed to beg pardon, and
    refusal to beg pardon is declared a dukkaṭa offence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An upajjhaya who is asked for pardon is instructed not to withhold forgiveness;
    refusal to forgive is declared a dukkaṭa offence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When forgiveness was withheld, some saddhiviharikas went away, returned to
    the world, or went over to other schools.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage forbids turning away a saddhiviharika who observes proper conduct
    and forbids failing to turn away one who does not observe proper conduct.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Five stated conditions for turning away are lack of great affection, inclination,
