canonical_text:
  quote: ''
  summary: The passage explains that members of the Buddhist Order came to want historical
    accounts for each Patimokkha rule, especially stories of how the Buddha laid rules
    down. It quotes the Cullavagga on the need for a brother to know both Patimokkhas
    and to answer where a teaching was spoken. The author infers that traditions about
    each rule existed and were esteemed, and conjectures that such traditions were
    combined with the text, old commentary, and notes in the Sutta-vibhanga of the
    Vinaya Pitaka.
