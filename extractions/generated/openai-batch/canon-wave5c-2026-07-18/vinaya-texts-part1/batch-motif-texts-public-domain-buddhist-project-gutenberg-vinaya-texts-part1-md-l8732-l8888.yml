canonical_text:
  quote: ''
  summary: The passage explains relations of dependence between Buddhist monastic
    teachers and pupils, gives a ritual formula for choosing an acariya, states reciprocal
    duties, reports problems caused by unlearned monks acting as teachers, prescribes
    qualifications for giving dependence, lists cases in which dependence ceases,
    and forbids monks lacking specified perfections from conferring ordination, giving
    dependence, or ordaining novices.
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes relations between acariya and antevasika, and between
    upajjhaya and saddhiviharika, using nissaya as dependence or care.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An antevasika chooses an acariya through a prescribed bodily sequence involving
    arranging the upper robe, saluting the feet, squatting, raising joined hands,
    and repeating a request three times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The formula asks the acariya to be the speaker's teacher and states that the
    speaker will live in dependence on him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that an antevasika should observe strict conduct toward
    his acariya, and an acariya should observe strict conduct toward his antevasika.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some antevasikas are said not to have observed proper conduct toward their
    acariyas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ignorant and unlearned Bhikkhus who had completed ten years after upasampada
    gave nissaya, producing cases where teachers were less learned or less wise than
    their pupils.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One prescribes that only a learned and competent Bhikkhu who has
    completed ten years or more may give nissaya.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The cessation of nissaya is discussed for cases involving teachers who go
    away, return to the world, die, join a schismatic faction, or give an order.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: For the acariya relation, nissaya also ceases when the acariya and upajjhaya
