canonical_text:
  quote: ''
  summary: A suspiciously uninformed ascetic is examined by Upali, and the matter
    is reported to the Blessed One, who gives a rule about one who has furtively attached
    himself to the Sangha. A serpent, ashamed of being born as a serpent, takes the
    shape of a youth and seeks ordination among the Sakyaputtiya Samanas in hopes
    of being released from serpent nature and quickly obtaining human nature. The
    serpent receives ordination and lives with a Bhikkhu in a vihara. When alone and
    asleep, he appears in his natural serpent form, filling the vihara with his body.
    The Bhikkhu discovers him, cries out, and the Bhikkhus question the serpent, who
    reveals that he is a serpent and explains the matter.
  language: English translation with Pali terms
  quote_policy: summarized
