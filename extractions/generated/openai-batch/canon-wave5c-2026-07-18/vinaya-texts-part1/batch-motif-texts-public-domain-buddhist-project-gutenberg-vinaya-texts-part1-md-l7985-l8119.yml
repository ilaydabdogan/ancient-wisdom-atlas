canonical_text:
  quote: ''
  summary: The passage gives monastic rules for reciprocal duties between an upajjhaya
    and a saddhiviharika. The saddhiviharika must help correct the upajjhaya's discontent,
    indecision, or false doctrine; assist with disciplinary proceedings and rehabilitation;
    handle robes, bowls, permissions, travel restrictions, and nursing. The upajjhaya
    in turn must give the saddhiviharika spiritual instruction, needed monastic articles,
    and nursing care when sick.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When discontent, indecision, or false doctrine arises in the upajjhaya, the
    saddhiviharika is instructed to appease, dispel, discuss, or compose the matter
    by religious conversation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the upajjhaya is guilty of a grave offence or requires penal discipline,
    the saddhiviharika is instructed to see that the Sangha imposes or completes the
    appropriate disciplinary action.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Sangha intends or begins disciplinary proceedings against the upajjhaya,
    the saddhiviharika is instructed to try to prevent, mitigate, or help bring about
    revocation of the sentence through the upajjhaya's proper conduct.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The saddhiviharika is instructed to wash, make, boil dye for, and dye the
    upajjhaya's robe when needed, including turning it properly and waiting until
    the dye stops dripping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The saddhiviharika is instructed not to give, accept, perform, or receive
    various monastic goods and personal services involving others without the upajjhaya's
    permission.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The saddhiviharika is instructed not to enter the village, go to a cemetery,
    or go on journeys without the upajjhaya's permission.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the upajjhaya is sick, the saddhiviharika is instructed to nurse him as
    long as life lasts and wait until he has recovered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The upajjhaya is instructed to observe strict conduct toward the saddhiviharika
    and to give spiritual help through teaching, questioning, exhortation, and instruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the saddhiviharika lacks an alms-bowl, robe, or required monastic articles
    and the upajjhaya has them, the upajjhaya is instructed to give them or ensure
    that the saddhiviharika obtains them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the saddhiviharika is sick, the upajjhaya is instructed to provide early-morning
    care including a teeth-cleanser, water for rinsing, a seat, rice-milk with water,
    foot-washing water, and drinking water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the Vihara where the saddhiviharika dwells is dirty, the upajjhaya is instructed
    to address the dirty dwelling according to rules cross-referenced from an earlier
    chapter.
  category: setting
  evidence_refs:
  - ev:8
