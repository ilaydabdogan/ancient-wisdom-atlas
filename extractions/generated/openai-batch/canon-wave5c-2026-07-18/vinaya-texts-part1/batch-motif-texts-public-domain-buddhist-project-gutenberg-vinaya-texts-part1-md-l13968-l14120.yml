canonical_text:
  quote: ''
  summary: The passage gives procedural cases in which Bhikkhus should respond to
    summonses concerning doubts, false doctrine, sickness, disciplinary proceedings,
    rehabilitation, ordination, taking precepts, or questions about Vassa. In repeated
    cases, those who go are instructed to return within seven days.
  language: English with transliterated Indic monastic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a Bhikkhu has doubts of conscience and sends for Bhikkhus, the addressed
    Bhikkhus are told to go with the aim of dispelling the doubts or composing him
    by religious conversation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a Bhikkhu takes to a false doctrine and sends for Bhikkhus, the addressed
    Bhikkhus are told to go with the aim of discussing that doctrine, causing it to
    be discussed, or composing him by religious conversation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a Bhikkhu is subject to grave-offence discipline, recommenced penal discipline,
    manatta discipline, or rehabilitation, the addressed Bhikkhus are told to assist
    with the relevant disciplinary or rehabilitative procedure, including resolution
    or quorum where stated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Saṅgha is going to proceed, or has proceeded, against a Bhikkhu,
    the addressed Bhikkhus are told to consider prevention, mitigation, proper conduct
    by the Bhikkhu, and revocation of the sentence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Parallel cases are given for a Bhikkhuni, including sickness, grave offence
    requiring manatta discipline, recommenced discipline, rehabilitation, and Saṅgha
    proceedings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sikkhamana who has violated her training precepts may send for assistance
    so that she may take the precepts again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sikkhamana desiring upasampada ordination may send for assistance with receiving
    ordination, proclamation of the formula, or completion of the quorum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cases involving a samanera and a samaneri include sickness, inquiry concerning
    Vassa, desire for upasampada ordination, and desire to take precepts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The instruction to return within seven days recurs across the cases in the
    passage.
  category: sequence
  evidence_refs:
  - ev:7
