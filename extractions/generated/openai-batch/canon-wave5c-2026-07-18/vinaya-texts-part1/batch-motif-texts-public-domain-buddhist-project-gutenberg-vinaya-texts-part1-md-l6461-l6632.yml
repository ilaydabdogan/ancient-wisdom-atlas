canonical_text:
  quote: ''
  summary: The passage recounts a sequence of wonders involving the Blessed One and
    Uruvela Kassapa. Kassapa fears that the Blessed One's display of wonders at a
    great sacrifice will reduce his own honor. The Blessed One reads this thought,
    goes elsewhere for alms, and later explains this to Kassapa. In another episode,
    Sakka and a tree deity provide a tank, stones, and a bent branch so the Blessed
    One can wash and dry rags. Kassapa observes these new features, hears the explanation,
    and acknowledges the Blessed One's magical powers while still denying that he
    is holy like himself. The passage ends with the Blessed One sending Kassapa ahead,
    plucking fruit from the Jambu tree, arriving before him, and sitting in the fire
    room.
  language: English
  quote_policy: summarized
