canonical_text:
  quote: ''
  summary: 'The passage introduces the Samghadisesa rules as thirteen matters requiring
    formal meetings of the Order and lists the first six: intentional emission of
    semen except during sleep; bodily contact with a woman by a degraded, perverted-minded
    Bhikkhu; passion-exciting speech to a woman; solicitation of sexual ministration;
    acting as a go-between between sexual or marital parties; and constructing a personal
    hut from begged materials subject to specified measurements. Notes explain key
    terms and give intra-canonical and commentarial cross-references.'
  language: English translation with transliterated terms
  quote_policy: summarized
