  quote: ''
  summary: 'The passage explains a sikidy divination procedure in which a figure representing
    an inquiry is compared with figures in named columns. The interpretive result
    depends on the column''s name or domain: in the example of an expected ship, a
    matching figure in the house column gives no answer, while a matching figure in
    the road column indicates that the ship is on its way.'
