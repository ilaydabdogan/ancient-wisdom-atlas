canonical_text:
  quote: ''
  summary: The passage describes Malagasy village church construction, decoration,
    offering containers, and some coercive punishments used to enforce church attendance
    or attentiveness. It emphasizes local workmanship and taste, secular or everyday
    decorative imagery, improvised receptacles for offerings, and human-imposed penances
    such as carrying a stone, crawling around an ox-fattening pen, or being struck
    with pebbles.
  language: English
