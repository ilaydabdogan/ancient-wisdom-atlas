canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy funeral practices: special rites
    for princes and kings, preservation of royal relics, posthumous royal names and
    speech taboos, Vazimba treatment of corpses and bones, cave cemeteries of north-western
    tribes, Sihanaka removal and burial of the hopelessly ill and memorial poles,
    and Bezanozano stone monuments with ox skulls and possessions of the deceased.'
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For princes, the corpse is enclosed in an ox-hide and remains exposed for
    two months in a tent encampment with incense burning continuously, or, for a king,
    in a forest under the care of a particular family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the exposure period, the body is carried with ceremony and festivities
    to a royal cemetery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a deceased king, royal relics consist of a neck vertebra, a nail, and
    a lock of hair placed in the hollow of a crocodile molar tooth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The royal relics are kept by the king's successor with the relics of ancient
    kings in a special sacred house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A king's life-name may no longer be pronounced after death; a substitute name
    is used.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a deceased king's name resembles a common word, that common word must no
    longer be pronounced by inhabitants of the country and may be replaced by a new
    term.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Anyone who pronounces the former name of a deceased king would be considered
    a sorcerer and punished by death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Vazimba wash the corpse, dress it in fine garments, seat it squatting
    on a bed or couch as if living, and have relatives or friends attend it day and
    night.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Vazimba attendants talk to the corpse and place in its hand a spoon full of
    rice or other food.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Formerly, liquids from decomposition were taken to a special place and sprinkled
    with ox blood to nourish the fandanina, a snake believed to be produced from those
    liquids.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After Sakalava conquest, the Vazimba customs were partly abandoned; when the
    effluvium became too offensive, the corpse was buried.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: About a year after burial, the Vazimba take the body from the ground, wash
    the bones, place them in a new coffin, and bury them definitively.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A cemetery of the Behisotra and Tandrona or Tankoala is described as a natural
    cave containing several small coffins.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Sihanaka secretly remove hopelessly ill people far from villages to a
    solitary place attended by an appointed person.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: After death, the Sihanaka bring the corpse into the house, where it lies in
    state for a time determined by the wealth of the deceased and the number of oxen
    killed.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: After Sihanaka funeral ceremonies, the house is abandoned and the corpse is
    interred.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The Sihanaka family erects a tall forked pole called jiro near the burial
    place beside a road.
  category: object
  evidence_refs:
  - ev:17
- id: obs:18
  text: Bezanozano burial monuments include a single stone or slab at the head and
    east of the coffin trench.
  category: object
  evidence_refs:
  - ev:18
- id: obs:19
  text: Bezanozano monuments also include stones with stakes holding the skulls of
    oxen killed during funeral ceremonies.
  category: object
  evidence_refs:
  - ev:19
- id: obs:20
  text: Sometimes tin boxes or mats belonging to the deceased are placed on Bezanozano
    funeral stones.
  category: object
  evidence_refs:
  - ev:20
- id: obs:21
  text: The crocodile tooth used for royal relics is said to be taken from a living
    crocodile, which is bound, made to release the tooth, and then set free.
  category: action
  evidence_refs:
  - ev:21
