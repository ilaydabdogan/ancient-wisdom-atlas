canonical_text:
  quote: ''
  summary: The passage gives anecdotal observations about Malagasy adoption and alteration
    of foreign names, reciprocal misunderstandings between Malagasy people and Europeans,
    Malagasy use of compass directions for positions in a house, differences in food-offering
    etiquette, and a custom of giving small money gifts on many life occasions, with
    return gifts of beef or poultry at funerals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some English names, especially names of resident missionaries, are described
    as having become naturalised among the Malagasy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A missionary asked the name of an infant to be baptized and was given the
    missionary's own full name as the infant's proposed name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator gives examples of names formed through altered or misunderstood
    foreign terms, including a name said to come from a hospital daybook and another
    combining a native prefix, altered French, and a native name.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: An English editor's misunderstanding of Malagasy wording produced a title-page
    phrase that the narrator renders literally as referring to lepers as the names
    of the authors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Foreigners are said to be designated by Malagasy people as Vazaha, while an
    English minister mistakenly described the Vazaha as a Malagasy tribe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Malagasy are described as using compass directions for positions inside
    a house where English speakers would use left, right, front, or behind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Malagasy host corrected a missionary's grooming mistake by saying the rice
    was on the southern side of the missionary's moustache.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: An old friend who was offered slices from a plum-cake took the whole cake,
    began eating it, and later put the remainder in his pockets for his children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator says Malagasy custom involved giving and expecting small bits
    of cut-money on many occasions, including births, marriages, deaths, funerals,
    illness, recovery, New Year, house-building, tomb-building, journeys, returns,
    joy, and sorrow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At funerals, a return gift is made in beef; if someone leaves before the oxen
    are killed, poultry may be given instead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrator reports returning from a funeral or preliminary lying-in-state
    with a goose or duck attached to the poles of his palanquin.
  category: action
  evidence_refs:
  - ev:8
