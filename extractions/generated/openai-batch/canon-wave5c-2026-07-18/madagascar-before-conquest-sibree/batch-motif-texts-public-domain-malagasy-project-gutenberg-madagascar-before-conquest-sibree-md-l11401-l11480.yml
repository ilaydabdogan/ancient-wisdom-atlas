canonical_text:
  quote: ''
  summary: The passage describes Malagasy chronological and astrological ideas, then
    focuses on sikidy divination. A mpisikidy places beans or fano-tree seeds before
    him and begins with an invocation that asks God, the sun, the cock, mankind, and
    the sikidy to awaken in sequence so that the sikidy may tell truth and see hidden
    things. The invocation attributes the sikidy to Silamo/Moslem Arabs, high mountains,
    named authorities, and costly exchange. Commentary states that the sikidy was
    viewed as a means by which God made His will known, and discusses Arabic/Islamic
    terminology and possible Vazimba associations.
  language: English with Malagasy terms
  quote_policy: summarized
