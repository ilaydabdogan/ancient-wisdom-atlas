canonical_text:
  quote: ''
  summary: 'The passage first notes beliefs about Malagasy idols, then recounts a
    tale in which two men display a living serpent and a manioc-root idol to collect
    offerings and distribute ordinary wood as supposed idol pieces. It next summarizes
    the fable of Rasoalavavolo, a beautiful long-haired woman whose home is under
    water; a woman seeking a child offers rings and receives smooth stones said to
    become two male children, later described as ancestors. The final tale tells how
    Rat tricks Wild-hog into a fire game: Rat survives by hiding in a hole, while
    Wild-hog is burned, bathes in water, and dies.'
  language: English
  quote_policy: summarized
