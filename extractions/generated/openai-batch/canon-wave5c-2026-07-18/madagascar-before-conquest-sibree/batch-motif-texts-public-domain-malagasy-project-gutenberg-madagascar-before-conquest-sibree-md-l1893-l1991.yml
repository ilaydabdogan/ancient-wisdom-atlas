  summary: The passage describes amusements and public gatherings in Antananarivo,
    then surveys the city’s churches, early Christian worship sites, the religious
    history of Ambatonakanga, the persecution-era reuse of a worship building as stable
    and prison, the later Martyr Memorial Church, the growth of congregations after
    1862, and the prominence of several memorial and mother churches.
  language: English
  quote_policy: summarized
