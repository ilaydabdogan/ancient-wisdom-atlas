candidate_motifs:
- id: motif:1
  label: etiology of animal behavior or status
  taxonomy_refs: []
  basis: 'Several tales explicitly explain present animal status or behavior: Railovy
    as king of birds, hawks eating chickens but not hens, Kingfisher beauty and nesting,
    and protected lizards or snakes.'
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:11
  confidence: high
  cautions: This is a descriptive motif label, not one of the supplied taxonomy families.
- id: motif:2
  label: curse establishing relations between animal kinds
  taxonomy_refs: []
  basis: Rasoavolovoloina's oath establishes treatment of killed lizards, and the
    Hawk's curse establishes hostility toward the Hen's young.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage calls these acts an oath or curse, but does not provide a
    broader taxonomy label.
- id: motif:3
  label: protected or taboo animal requiring funerary treatment
  taxonomy_refs: []
  basis: The passage says people dare not kill the Sitry, Antsiantsy, Tompondrano
    snakes, or Kingfisher, and that killed lizards or snakes may be wrapped in silk
    like corpses.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:11
  confidence: high
