canonical_text:
  quote: ''
  summary: 'The passage gives several Malagasy folk-tale extracts and explanations:
    a hawk unsuccessfully claims kingship among birds before the Railovy is chosen;
    two small lizards are killed after visiting Rasoavolovoloina and become protected
    by an oath requiring silk wrapping if killed; a hawk curses her descendants to
    kill the hen''s young after a hen kills her chick; a Vazimba goes under water,
    sends messages through a water-snake and a kingfisher, institutes offerings and
    protections for those creatures, and receives supplications at Vazimba graves;
    a chameleon and lizard quarrel and separate after a human approaches; and a boa-like
    serpent swallows a frog.'
  language: English
  quote_policy: summarized
