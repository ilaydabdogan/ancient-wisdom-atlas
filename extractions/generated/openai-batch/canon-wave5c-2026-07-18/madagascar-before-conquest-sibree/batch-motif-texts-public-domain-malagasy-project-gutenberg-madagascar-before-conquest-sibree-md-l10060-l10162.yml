canonical_text:
  quote: ''
  summary: 'The passage describes several reported mythical or monstrous creatures:
    the Fanany, a serpentlike many-headed creature associated with horns, mountains,
    lakes, and immense size; the Tekantongotra or Tokandia, a swift white nocturnal
    man-eater; the Kinoly, a human dead person who returns from the tomb as a red-eyed,
    long-nailed thief; and the Dona or Pily, a striped creature that is tame by day,
    predatory by night, changes size, and defeats a serpent by swelling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fanany is described as similar in appearance to a water-snake and the
    Manditra, fierce, having seven heads, and, at full size, a horn on each head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ralako reportedly saw the Fanany fight a bull at night; it fought with its
    seven horns rather than biting, and the horns were successively broken until the
    bull killed it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Just before death, the Fanany drew itself up and swelled to the size of a
    mountain, and its effluvium made neighboring villages uninhabitable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another account says that when the Fanany becomes large it encircles a mountain;
    if its head and tail meet with surplus length, it eats the surplus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some accounts say the enlarged Fanany sticks its tail into the earth and mounts
    up to the sky, while others say it enters a great body of water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Fanany is said to have remained in the lake of Itritriva and then moved
    to Andraikiba when it became too large for the first lake.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The native narrator says he saw an animal called the Fanany but saw no seven
    heads or sign of them; people explained that it was still too young.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tekantongotra or Tokandia is described as a large white animal, smaller
    than the Songomby, not cloven-footed, very swift, man-eating, and active at night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A note says it is commonly stated that those who even see the Tokandia are
    immediately struck dead or senseless.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:10
  text: 'The Kinoly is said to be human: after death the body is buried until the
    intestines and stomach skin decay, then the tomb is opened so the Kinoly may go
    out.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kinoly have red eyes and long nails; apart from the decayed portions, the
    body remains humanlike, though no longer like the living.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kinoly are said to steal cooked rice, other food, and sometimes rice in the
    husk, but they can hardly carry burdens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In one encounter, a Kinoly answers questions about its red eyes and long nails,
    says its nails are for tearing out the questioner's liver or inside, and then
    tears the man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Dona or Pily is described as large, long, and striped; its skin is used
    as a pattern for striped cloths.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Dona is gentle by day, fierce by night, bellows like a bull, and at night
    kills animals or people by encircling them at the loins and compressing them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: 'The Dona can make its body big or little and uses this ability to defeat
    the Menarana serpent: it shrinks, lets the serpent twine around it, then swells
    suddenly and breaks the serpent.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Menarana serpent is said to have a barbed tail like a spear and to kill
    victims with it.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: The Dona is said to be able to force its way out of a blocked hole, and whistling
    makes it angry.
  category: attribute
  evidence_refs:
  - ev:11
