candidate_motifs:
- id: motif:1
  label: many-headed horned serpentlike monster
  taxonomy_refs:
  - serpent
  basis: The Fanany is compared to snakes and described as fierce, seven-headed, and
    horned at full size.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage calls the Fanany an animal or creature and compares it to
    snakes; it does not explicitly classify it as a serpent in all accounts.
- id: motif:2
  label: mountain-encircling oversized creature with sky or water destination
  taxonomy_refs:
  - serpent
  - ascent
  basis: The Fanany is said to encircle a mountain and then either mount up to the
    sky or go into a great body of water.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage reports variant accounts, and only one variant includes ascent.
- id: motif:3
  label: immature monster explaining absent marvelous features
  taxonomy_refs: []
  basis: The native narrator did not see seven heads on the Fanany, and people explained
    that the animal was still too young.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is a local explanatory detail rather than a clearly repeated motif
    in the passage.
- id: motif:4
