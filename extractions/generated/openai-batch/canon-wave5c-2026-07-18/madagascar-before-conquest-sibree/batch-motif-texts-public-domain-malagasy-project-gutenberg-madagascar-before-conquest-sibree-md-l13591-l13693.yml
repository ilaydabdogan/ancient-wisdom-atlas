canonical_text:
  quote: ''
  summary: The passage describes varied Malagasy funeral monuments and burial practices,
    including monuments with trees, carved posts, granite pillars, iron points, cattle
    skulls and horns, cave or mountain burials, Betsileo noble corpse treatment involving
    decomposition vessels and a maggot believed to become a serpent-form soul, Bara
    burials with naked bodies and ox skulls, a claimed resemblance to Indonesian burial
    customs, and public mourning rules at the burial of the Hova king Radama I.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Exterior funeral monuments vary in placement and form and may include four
    walls, an unfilled interior, a tree planted in the middle, carved wooden posts,
    transverse carved bars, vase-shaped finials, granite pillars, iron points, and
    cattle skulls or horns.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some families do not place their dead in the ground, but deposit them in natural
    grottos or hand-cut caves on perpendicular mountain faces reached only by lofty
    scaffolding.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among Betsileo nobles, the dead body is not interred for some time; it is
    rolled on planks, fastened to the central house post, cut at the heels, and placed
    over earthen pots that receive decomposing liquid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Betsileo relatives wait until a small worm or maggot appears in one of
    the vessels before interment can proceed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A vessel is shut in the grave with the body, and a bamboo is arranged from
    the liquid to the ground surface so that the maggot, after becoming a serpent
    or fandano, can leave the tomb and visit relatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the Betsileo believe the soul of the departed reappears
    in the form of a reptile.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bara are described as laying their dead naked on the ground and covering
    them with stones; some families place naked bodies in caverns or among rocks with
    skulls of oxen killed at the funeral ceremonies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that a third, and often half, of the oxen belonging to
    the deceased are killed at Bara funeral ceremonies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In western Bara country, tall posts with crude life-sized female figures at
    their summits are reported, and the author says they were probably memorials of
    persons who died at a distant place.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author states that Malagasy burial customs closely resemble those of Indonesians
    and treats this as evidence for emigration into Madagascar from the extreme East.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the burial period of Radama I, a large kabary or national assembly was
    held at Antananarivo with 25,000 to 30,000 persons seated by district.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A mourning proclamation ordered all persons to shave or closely cut their
    hair, prohibited most work, required sleeping on the floor, and restricted women
    other than the queen from wearing the lamba above the shoulders.
  category: speech
  evidence_refs:
  - ev:9
