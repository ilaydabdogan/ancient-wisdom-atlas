    stone heap over it; rich people have coffins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sakalava remove the dead from the house immediately, place the corpse
    on a raised stage with the head toward the east, lay cloth and burial articles
    on it, light a fire under the foot, and burn incense.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the Sakalava laying-out, women keep to the north-east side of the stage
    and men to the south and south-east; visitors bring small presents, and women
    begin weeping and sobbing without speaking.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sakalava funeral stage is later destroyed, and its pieces are thrown into
    water in an uninhabited place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sakalava carry the corpse on a bier, put it on its back in a hollowed
    tree-trunk coffin, add objects belonging to the deceased, cover it with earth,
    and mark the tomb with an east-west oblong stone heap and white cloth on a pole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some Sakalava families do not bury their dead in coffins, but wrap them in
    a large mat and cover them with stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The house of a deceased Sakalava person is abandoned and left to ruin; using
