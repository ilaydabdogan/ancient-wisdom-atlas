canonical_text:
  quote: ''
  summary: The passage describes a reported parallel between Malagasy belief in transmigration
    of chiefs' souls into animals and a Samoan practice of recovering a departed spirit
    in a tangible form. It then summarizes funerary practices among the Tanosy, Tandroy,
    Mahafaly, and Sakalava, including secondary burial, stone tombs, carved memorial
    posts, corpse wrapping, raised stages, fire and incense, gendered mourning, water
    disposal of funeral-stage pieces, hollowed tree-trunk coffins, grave goods, abandoned
    houses of the dead, deathbed confession, and prayers to ancestral spirits at the
    ruined house.
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Samoan practice is described in which people try to obtain the departed
    soul in a tangible transmigrated form; the first thing to land on a cloth sheet
    is treated as the spirit and buried ceremonially.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tanosy described here bring their dead back to the land where they formerly
    lived after waiting until the bones have lost the flesh.
  category: action
  evidence_refs:
