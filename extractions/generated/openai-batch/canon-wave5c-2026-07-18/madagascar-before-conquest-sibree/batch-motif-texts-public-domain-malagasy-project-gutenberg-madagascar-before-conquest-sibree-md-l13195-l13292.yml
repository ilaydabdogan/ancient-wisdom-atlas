  text: Tanosy, Sakalava, and Mahafaly customs include placing coffins or remains
    under oblong heaps of stones.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
- id: obs:4
  text: Some Tanosy families erect wooden memorial posts near villages, with carved
    human, bird, and animal figures, especially crocodiles, and with white cloth and
    ox skulls or horns attached.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Tandroy and Mahafaly wrap the dead in several lamba, carry the body to
