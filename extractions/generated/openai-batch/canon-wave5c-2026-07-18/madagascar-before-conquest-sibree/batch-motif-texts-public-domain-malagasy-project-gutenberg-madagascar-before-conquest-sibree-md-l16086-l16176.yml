  summary: 'The passage describes three botanical regions of Madagascar: an eastern
    forest region with varied vegetation, useful timber and lianas; a central elevated
    table-land of moorlands, grass, herbs, temperate plants and endemic mountain flora;
    and a drier western region with plains, riverbank vegetation, fan-palms, baobabs,
    mangroves and other trees.'
