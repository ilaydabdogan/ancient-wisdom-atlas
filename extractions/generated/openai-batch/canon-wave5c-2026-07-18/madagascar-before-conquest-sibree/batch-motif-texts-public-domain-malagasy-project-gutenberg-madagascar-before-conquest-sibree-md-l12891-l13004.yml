canonical_text:
  quote: ''
  summary: The passage surveys varied Malagasy funeral practices, including burial
    locations, corpse preparation, coffin forms, tomb goods, ideas of death impurity,
    ancestral burial, delayed interment, offerings, funeral feasts, and mourning signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage divides Malagasy funeral practice into groups that use hidden
    cemeteries in forests or rocks and groups that inter relatives by roadsides or
    among dwellings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many groups place the dead in a hollowed tree trunk with a roof-like lid,
    while the Hova wrap the corpse in lamba and the Bara are described as sometimes
    placing the naked corpse on the ground.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nearest relatives of the same sex wash the corpse, dress its hair, and wrap
    it in new cloths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some named groups do not bury the coffin but place it on the ground, on a
    framework with palisade and roof, or in a rock fissure; most others place it in
    the ground under a rectangular heap of stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The corpse's head is generally turned east, and tombs may contain articles
    such as earthen vessels, pots of incense, and cloths.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A corpse is associated with impurity; funeral processions avoid a sovereign,
    the sovereign's dwelling, and sacred stones, and followers of a procession must
    purify themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In districts where tombs are far from dwellings, a person found in a cemetery
    is considered a sorcerer and punished with death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead are feared and respected, and burial in the ancestral cemetery or
    tomb is treated as important; relatives may bring bones from distant places to
    native soil.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a relative's body cannot be recovered, a pillow and sleeping mat are
    interred instead, and a funeral monument may be erected; vows to the dead are
    called sacred.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A widespread custom delays interment until decomposition, sometimes collecting
    liquid from the corpse; during the wake, rum and burning substances are used to
    endure odours.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Many tribes offer food and drink to the corpse, and the passage explains the
    delayed-burial custom as avoiding interment of impure corruptible matter with
    the bones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Funerals may include feasts with oxen, rum, rice, meat, muskets, doleful songs,
    and weeping; relatives do not eat the flesh of oxen killed at a family member's
    death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mourning is marked by unbraided or dishevelled hair, shaved heads at a sovereign's
    death, coarse and dirty garments, and restrictions on washing, combing, and mirror-looking.
  category: attribute
  evidence_refs:
  - ev:10
