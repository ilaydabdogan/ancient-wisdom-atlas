  text: The son of God is said to have come down to earth and to have had Rakoriaho
    and Ravao as nurses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The son of God and his nurses are lost, and stones, trees, people, water,
    and beasts seek him diligently without success.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: God commands the searchers to remain where they went, which is given as the
    reason for stones below the earth, trees rooted in the ground, and people spread
    among countries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spread of people eastward is given as the reason prayer is made toward
    the east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: God commands that the name Rakoriaho not cease from people's mouths, and the
    tale connects this with a greeting of strangers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dogs are said to utter a sound meaning, in the tale, an inquiry after Ravao.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The son of God is said to have been lost in the water, and the waters are
