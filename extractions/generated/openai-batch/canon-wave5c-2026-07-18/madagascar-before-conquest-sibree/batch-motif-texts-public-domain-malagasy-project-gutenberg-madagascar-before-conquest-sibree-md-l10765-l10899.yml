canonical_text:
  quote: ''
  summary: 'The passage presents several Malagasy tales and fables: a giant-like figure
    whose size and strength affect the landscape and who fetches the moon; a nature-myth
    of the lost son of God whose search explains stones under earth, rooted trees,
    human dispersal, eastward prayer, greetings, dog barking, and moving waters; an
    etiological fable explaining the separation of the five fingers; a tale of the
    earth attempting to fight the sky, explaining terrain inequality and the separation
    of earth and heavens; and a tale explaining why the owl goes out by night after
    missing the birds'' election of a king.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A very tall unnamed male figure is said to touch the skies, cook rice at a
    distance, cross several miles in one step, leave foot- and knee-like impressions
    in rocks, fetch the moon for his children, and die after being struck by a meteorolite.
  category: action
  evidence_refs:
  - ev:1
