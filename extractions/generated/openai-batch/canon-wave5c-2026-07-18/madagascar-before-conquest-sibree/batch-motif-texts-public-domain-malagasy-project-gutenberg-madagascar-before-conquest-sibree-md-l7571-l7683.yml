candidate_motifs:
- id: motif:1
  label: supernatural or giant footprints in stone
  taxonomy_refs: []
  basis: The passage explicitly links Imerina belief to a wider footprint tradition
    and identifies rock cavities as Rapeto's supposed giant footprints.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only one local example and does not narrate a full myth
    about Rapeto.
- id: motif:2
  label: plants and roots as efficacious ritual objects
  taxonomy_refs: []
  basis: The passage records a victory plant, a feared household tree, and a root
    rite for a first-born child's benefit.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The examples are brief ethnographic notes, not a single connected narrative.
- id: motif:3
  label: ordeal poison testing guilt through substitute animals
  taxonomy_refs: []
  basis: Tangena poison is described as testing guilt or innocence and sometimes being
    given to dogs or fowls instead of the accused person.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly identify the ordeal as divine judgment,
    so no divine-judgment taxonomy reference is assigned.
- id: motif:4
  label: house blessing through directional placement
  taxonomy_refs: []
  basis: Red earth is placed at the middle post for new year first fruits, and a cord
    is stretched from southwest to northeast sacred corner to obtain blessing.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage lists practices but does not explain their cosmology beyond
    blessing and first fruits.
- id: motif:5
  label: waterway taboo preventing ordinary travel technology
  taxonomy_refs: []
  basis: Superstitious dread prevents canoes from being used on the Fanindrona river
    despite the practical danger and inconvenience.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The reason for the canoe taboo is not explained in the passage.
- id: motif:6
  label: death as bird-flight and ghostly whirlwind
  taxonomy_refs: []
  basis: The bier is called bird's house, possibly from the spirit flying away, and
    the whirlwind is supposed to consist of ghosts of the dead.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The bird-flight explanation is introduced as possible by the source, so
    interpretive confidence is limited.
- id: motif:7
  label: royal death euphemism and sacred funerary substitution
  taxonomy_refs: []
  basis: The dead sovereign's death, corpse, burial, tomb, and coffin are all named
    with specialized sacred terms different from ordinary usage.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage emphasizes sacred terminology rather than a mythic episode
    of royal legitimacy.
- id: motif:8
  label: disease omen predicting locusts
  taxonomy_refs: []
  basis: A catarrh outbreak is interpreted by local people as a sign that locusts
    are near, and locusts appear shortly afterward in the reported account.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The source presents this as a coincidence and gives no broader omen system.
- id: motif:9
  label: sympathetic witchcraft through footprint dust
  taxonomy_refs: []
  basis: Charms mixed with dust from a person's footstep are believed to cause that
    person rabdia disease.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not describe a specific practitioner story or ritual
    sequence beyond the causal belief.
