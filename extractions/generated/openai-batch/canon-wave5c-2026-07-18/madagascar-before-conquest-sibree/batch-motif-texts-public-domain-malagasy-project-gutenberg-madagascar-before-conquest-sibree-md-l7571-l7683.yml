canonical_text:
  quote: ''
  summary: 'The passage collects notes on Malagasy folk belief and custom: giant footprints
    attributed to Rapeto; plant, tree, root, and charm practices; the tangena ordeal;
    birth, new-year, house-blessing, eating, and river taboos; Hova death and royal
    funerary terminology; locust omen interpretation; and witchcraft using footstep
    dust.'
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Imerina preserves a trace of a widespread belief in
    footprints of supernatural beings, giants, mighty men, and gods.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rapeto is described as a traditional chief of the Vazimba whom popular imagination
    has magnified into a giant, and roadside rock cavities north of Antananarivo are
    supposed to be his footprints.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Owners of fighting bulls formerly held a plant called tsivalondriana in their
    hands to ensure victory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hardwood tree called hazotokana was believed to break the rice-pans if any
    part of it was brought into a house.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father of a newly born first child formerly held a verikitia root over
    his head outside the house and dashed it westward on the ground for the child's
    benefit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the tangena ordeal, poison was sometimes given to dogs or fowls instead
    of the accused person, and the animals' response served as the test of guilt or
    innocence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says charms were believed able to make the animals used in the
    tangena ordeal die, with dog-related charms named in the text.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Although the tangena ordeal had been abolished by treaty, the passage reports
    its continued belief and use during an epidemic fever in 1878, with deaths and
    government punishment following.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Among the Bara, husbands and elder sons are said to perform what is required
    at a birth, and the mother remains in the house for four days after childbirth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the new year, red earth from a specified spot was put at the foot of the
    middle roof-supporting post and called santataona, meaning first fruits of the
    year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On certain occasions diviners directed a cord to be fastened from the southwest
    corner of the house to the northeast sacred corner as a means of obtaining blessing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage distinguishes Tanala eating customs by region and says the Zafimanelo
    lock their doors at meals so that hardly anyone sees them eating.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A superstition against putting a canoe on the Fanindrona river is described
    as an obstacle to travel, requiring goods to be ferried on water pitchers with
    swimmers beside them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Hovas, the bier for carrying a corpse is called a bird's house,
    and a whirlwind is supposed to consist of ghosts of the dead.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: For a dead Hova sovereign, ordinary terms for dying, corpse, burial, and tomb
    are replaced by specialized sacred terms, including a silver coffin called the
    silver canoe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: During a Betsileo fever episode, a catarrh epidemic led local people to say
    that locusts were near, and the passage reports that locusts appeared within the
    week.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Mixing charms with dust on which a person had trodden was believed to cause
    that person a disease called rabdia.
  category: action
  evidence_refs:
  - ev:10
