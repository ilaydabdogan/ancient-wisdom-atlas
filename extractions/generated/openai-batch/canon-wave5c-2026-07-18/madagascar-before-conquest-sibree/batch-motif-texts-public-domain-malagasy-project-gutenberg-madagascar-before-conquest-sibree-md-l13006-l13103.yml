canonical_text:
  quote: ''
  summary: The passage describes Tankarana funerary customs, including wrapping and
    exposing the dead, burning resins, tightening bindings until only bones remain,
    placing remains in hollowed tree-trunk coffins, depositing coffins on solitary
    islands or in rock hollows with provisions, and renewing coffins when decayed.
    It also describes a specific coffin from Nosy Loapasana, its ornamentation and
    contents, notes a formal resemblance to Philippine wooden sarcophagi, and describes
    a different chiefly procedure involving mummification, anointing a coffin, collection
    of corpse liquid, and slaves anointing themselves with it.
  language: English
  quote_policy: summarized
