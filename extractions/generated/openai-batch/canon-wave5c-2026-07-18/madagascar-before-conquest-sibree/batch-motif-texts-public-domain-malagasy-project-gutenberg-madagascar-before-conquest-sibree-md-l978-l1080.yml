  summary: The passage surveys recent European exploratory journeys and mapping work
    in Madagascar, then describes the usual route from the eastern port of Tamatave
    toward Antananarivo. It emphasizes primitive transport conditions, palanquin travel
    with bearers, a coastal stage between lagoons and ocean, a canoe stage at Andevoranto,
    hilly vegetation zones, and a difficult forest crossing that rises toward the
    interior highland.
