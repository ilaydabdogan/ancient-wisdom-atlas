  summary: The passage describes Malagasy royal and chiefly name taboos, their effects
    on vocabulary and dialects, reverence shown toward sovereigns and royal property,
    rules about royal spatial precedence, and posthumous renaming and veneration of
    chiefs and ancestors among Sakalava and southern Malagasy populations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that tabooing words because they occur in chiefs' names
    was less extensive among the Hova than among other Malagasy tribes, partly because
    the Hova had one sovereign rather than many petty chiefs or kings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that western tribes with many petty but independent and
    absolute kings experienced considerable change in spoken language.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakalava chieftains are described as objecting to names or terms that sound
    like their own names or names of family members.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Rataratsa's mother was named Ravahiny, the term vahiny was forbidden
    for other persons and a substitute term, ampainsick, was instituted for 'stranger.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says it is improper to use the sovereign's name frequently or
    lightly in conversation, and that the royal name has a kind of sanctity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Royal property is treated with special reverence: sitting or stepping on
    a case containing royal property is improper, and passers-by must move aside and
    remove hats when the queen''s property passes.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other buildings should not be compared to royal palaces; firing a gun toward
    the palace is treated as a threatening or defiant act; and the sovereign must
    sit in the highest place in public assembly.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Among the Sakalava, chiefs' names are changed after death, and uttering the
    names they bore while living is described as a crime.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sakalava posthumous chiefly names are described as beginning with Andrian
    and ending with arivo, with examples given for chiefs formerly called Raimosa
    and Mikala.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage cites reports that similar posthumous naming and avoidance of
    living names existed among southern and south-western Malagasy populations, together
    with invocation and veneration of ancestral souls.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
