canonical_text:
  quote: ''
  summary: The passage describes funeral practices among several Malagasy groups,
    including keeping corpses in houses, lamps at the corpse's head, coffins in woods
    or roadside burials, prayers at marked stones, special and secret night burials
    for chiefs, cloths, food, paper amulets with Arabic writing, white flags, tomb
    structures, body placement, and a belief that decomposition liquids from chiefs
    can give birth to a colossal sea-serpent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Betsimisaraka, dead bodies are kept in houses for a long time, and
    decomposition products are collected in a vessel and buried at a distance where
    relatives erect a stone and later come to pray.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lamp burns day and night at the head of the Betsimisaraka corpse, and the
    widow remains at the funeral couch while the corpse is exposed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Betsimisaraka coffins are made from hollowed-out tree trunks with roof-shaped
    lids and are placed in a dense wood in regular order.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Articles belonging to the deceased, especially a bottle of rum, are placed
    at the head of the Betsimisaraka coffin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some Betsimisaraka families raise coffins on a stage, build a shed over them,
    or place the corpse inside a barrel-like hollowed tree trunk closed at both ends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the death of a Betsimisaraka chief, interment occurs immediately by night,
    and the news is kept from the people until later.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among the Ranomena, corpses are placed on the roadside, with a hole to receive
    decomposition liquids and a rock marking the place where children of the deceased
    come to pray.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ranomena cemeteries are placed deep in the woods and are visited only at interment.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Roandriana chiefs of the Tambahoaka, Taimoro, and Tanosy are interred at night
    one or two days after death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the lying-in-state of these chiefs, reddish-brown cloths are hung,
    a lamp burns at the corpse's head, and food is placed beside the bed or bier on
    the first day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Relatives attach small strips of paper bearing cabalistic signs and Arabic
    words to the arms of the deceased chief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: News of the chiefly death is kept secret outside the royal village until a
    month later, when a white flag is raised at the house where the corpse lay.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The tombs of Roandriana chiefs are called by the same word used for royal
    residences; among the Tanosy they include two stone slabs and a circular palisade.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Bodies of Roandriana chiefs are wrapped in a lamba rather than placed in a
    coffin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Common free people are interred in coffins placed at the road edge in Antaimoro
    areas or in the woods in Antanosy areas.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Commoner tombs are trenches lined with stones, closed by a stone slab, and
    marked with a white flag on a pole.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: A woman disgraced for violating caste requirements is placed transversely
    at the feet of her relatives rather than by their side.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Men are placed on the bier on the right side, women on the left, and the head
