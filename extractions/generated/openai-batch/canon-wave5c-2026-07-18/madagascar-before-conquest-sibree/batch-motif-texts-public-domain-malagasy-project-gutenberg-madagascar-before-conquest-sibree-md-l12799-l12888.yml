canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy calendrical divination and sikidy practice:
    weekday names are said to derive from Arabic and Hebrew terms; each day has an
    associated number used in san-andro rites; burials, sacrifices, diagnoses of danger,
    and illness forecasts are governed by good or unlucky days, day numbers, color
    and social correspondences, and combinations of sikidy columns.'
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the native weekday names are of Arabic origin for
    the first five numerals and the sixth day, while the seventh is a modified form
    of the Hebrew Sabbath.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each day-name has an associated number, and these numbers are important in
    the practical part of san-andro.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the san-andro of the dead, burials were preferably performed on a good
    day; the day’s special number determined repeated actions such as stopping with
    the bier, throwing stones down, and carrying the corpse around the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the san-andro of the living, sacrifices used invocations referring to the
    day before yesterday rather than the day of offering; offerings could be brought
    only on the three good days, while sikidy could be performed on any day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The seven weekdays are assigned qualities or classes: Sunday to white things,
    Monday to green and blackish things, Tuesday to people with scars or smallpox
    marks, Wednesday to women and female things, Thursday to slaves, Friday to nobles
    and red things, and Saturday to young people and young things.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man consulting a diviner on Sunday could be told that his trouble came from
    a white stone, milk containing ghosts, or bewitchment by a white-haired woman;
    on Thursday, the trouble could be attributed to a slave or lead to a warning about
    slaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The tasik'andro identifies a day of special danger of illness through vintana
    by using sikidy column combinations; if certain combinations resemble Tale, the
    man represented by Tale is in danger on a specified weekday.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that sikidy and vintana were once powerful in Madagascar
    but that their influence was passing away.
  category: attribute
  evidence_refs:
  - ev:7
