literal_observations:
- id: obs:1
  text: On the western coast, confusion in terms is attributed to chieftains prohibiting
    particular words from being used with their accustomed meanings, after which local
    people reportedly would not acknowledge the former senses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this cause of change and uncertainty applies less to place-names
    in the central and eastern districts, where taboo is said to affect names of objects
    and actions more than place names.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author argues that the name Madagascar is probably not native, citing
    lack of a Malagasy root and the consonant combination sc or sk as contrary to
    the language.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The island was formerly termed by the people Izao rehetra izao, translated
    as “This whole,” and the passage connects this with a belief that an insular nation’s
    own island is the principal part of the world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In and after the time of Radama I, the island was also described as Ny anwon'
    ny rtaka, translated in the passage as “The [land], in the midst of the flood.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: One old designation given for the country is Nbsin-ddmbo, translated as “Island
    of wild-boars,” with the explanation that wild boars were the largest wild creatures
    of the forests.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A cited early German work reports a derivation in which the island was to
    be called Magadaxo, later corrupted into Madagascar, but the author states that
    whether this contains historical fact is difficult to decide.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says Arabic geographers applied various names to the island, including
