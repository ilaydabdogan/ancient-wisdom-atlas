  summary: The passage surveys Malagasy hill, mountain, island, settlement, and village
    names, grouping them by meanings related to pleasant qualities, steepness, defensive
    fosses, enclosures, volcanic fire or lava, animals and birds, insects and honey,
    personal or royal associations, social groups, numbers, and miscellaneous nouns,
    adjectives, and verbs whose naming reasons are often uncertain.
  language: English with Malagasy terms
  quote_policy: summarized
