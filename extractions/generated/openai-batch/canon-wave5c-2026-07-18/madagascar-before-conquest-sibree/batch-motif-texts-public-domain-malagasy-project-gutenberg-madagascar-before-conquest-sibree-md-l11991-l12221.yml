  quote: ''
  summary: 'The passage explains parts of Malagasy sikidy divination: figures appearing
    in named columns are interpreted as answers, warnings, remedies, or indications
    of required faditra; repeated or unique figures have named meanings; and when
    ordinary correspondences fail, diviners use further operations such as Sikidy
    tokana and Lofin-tsikidy.'
