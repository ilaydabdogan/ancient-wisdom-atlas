  quote: ''
  summary: The passage discusses Malagasy place-names as preserving local, tribal,
    family, sacred, and historical information. It notes traditions about Rabiby/Ralambo
    as an early Imerina king and ancestor who slew a wild boar and first discovered
    beef was edible, and it comments that ox-flesh may once have been eaten only in
    religious service. It also mentions place-names connected with sacred shrines,
    sacred trees, God or Creator, tribal divisions, districts, rivers, mountains,
    and a giant named Rapeto said to have performed great feats of strength.
  language: English with Malagasy names and terms
  quote_policy: summarized
