canonical_text:
  quote: ''
  summary: A numbered ethnographic description of Malagasy and Hova gestures of respect,
    submission, royal etiquette, beckoning, pointing, greeting, and grief, including
    several Malagasy terms and the author's cross-cultural notes.
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When passing in front of a superior or someone due respect, a person bends
    the body low, extends the right hand nearly to the ground, and may say a permission-to-pass
    formula.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The permission-to-pass words are also used on public paths when passing someone
    sitting at a door, window, or elevated seat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hovas are described as scorning people who neglect this politeness formula
    and gesture.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In presenting kàsina, described as the dollar of allegiance, or another present
    to the sovereign or royal representative, the speaker extends both hands with
    palms outward, bends downward and forward, and raises the hands toward the addressee
    to about head level.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The phrase miUla-pàladàla is glossed as literally meaning to lick the sole
    of the foot; the passage says the act formerly functioned as a token of respect
    from slaves to masters, wives to husbands, and inferiors to superiors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Customs connected with royalty include shaving the head at a sovereign's death,
    wearing the lamba below the armpits at royal funerals, and turning aside and baring
    the head when royal property is carried along.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes Malagasy beckoning with palm down and fingers moving
    inward, and Hova pointing by motioning with the mouth, head, and lower lip.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The passage says nose-rubbing or nose-pressing takes the place of kissing
    among Malagasy people, while handshaking is described as not native and as adopted
    under foreign influence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Betsimisaraka women are described as clasping their hands on their heads as
    a sign of grief while bewailing the perceived loss of children sent to school.
  category: action
  evidence_refs:
  - ev:8
