canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy beliefs and customs concerning chiefs:
    their curses and blessings are thought to have inherent sacred power; accused
    persons may undergo self-imprecatory acts involving a chief''s hand or house;
    dead chiefs are said to become God and receive reverence and supplication; words
    forming chiefs'' names become fady and are replaced in ordinary speech; some royal
    families have fady birds or animals; and in some groups a serpent called fanany
    is believed to arise from a chief''s corpse and embody the departed spirit as
    protector.'
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are described as afraid when cursed by a chief and glad when blessed,
    because they suppose the words will be fulfilled.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs are said to possess power in their uttered words like that of God,
    working through inherent virtue rather than through soldiers or servants.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An accused person who denies wrongdoing may be told to lick or kiss the back
    of a chief's hand, or to measure the chief's house, while invoking evil on himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the accused person is guilty, the invoked curse is believed to return on
    him; if innocent, he remains unharmed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief is said to have sacred power that works of itself to convict secret
    fault.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: When chiefs die, they are said to become God and to be able to bless living
    subjects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a deceased chief's name is mentioned, words identifying him with God
    are placed before it and a formula about the speaker's mouth, rock, teeth, and
    blood is added after it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before clearing weeds and rubbish from a chief's grave, people first kill
    oxen and make supplication with outstretched hands to the deceased.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Words or parts of words that form chiefs' names are made fady, or tabooed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When an ordinary word becomes part of a royal name, that word is replaced
    in daily speech by another term, as with the chrysalis renamed after Queen Rasoherina
    and the dog hypothetically renamed after a chief called Ramboa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Certain birds and animals are fady to some Sakalava chiefs and their families,
    including a grey or sooty parrot for one Vêzo royal family and a lark-heeled cuckoo
    for one Menabe chief family.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says some have thought the royal-family animal and bird fady may
    be a relic of totemism, but also says the subject needs further investigation.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among the Betsileo and some other tribes, putrid liquid from chiefs' corpses
    is said to produce a serpent called fanany, understood as an embodiment of the
    departed spirit that lives near the tribe and protects it.
  category: sequence
  evidence_refs:
  - ev:8
