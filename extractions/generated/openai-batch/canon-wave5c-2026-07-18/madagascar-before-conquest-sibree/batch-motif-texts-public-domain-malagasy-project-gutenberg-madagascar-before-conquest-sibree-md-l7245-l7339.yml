  summary: The passage describes Malagasy gesture and sign practices, including a
    Malagasy term for blessing glossed as “blowing water,” compared by the author
    with a Samoan sickness ceremony in which family members confess and spurt water
    toward the sick person to revoke imprecations. It also records Hova and Betsileo
    gestures of greeting, astonishment, defiance, welcome, humility, royal salutation,
    supplication, repentance, enumeration, and object-based representation in discourse.
