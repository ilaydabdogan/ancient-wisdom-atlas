  summary: The passage describes late-October preparations in Antananarivo and central
    Madagascar for the rainy summer season, the Malagasy naming of that season as
    thunder-time, the development and dangers of thunderstorms, rainfall amounts,
    water erosion in the capital, agricultural activity after rain, hail damage to
    crops and animals, and the reported use of charms against hail.
  language: English
