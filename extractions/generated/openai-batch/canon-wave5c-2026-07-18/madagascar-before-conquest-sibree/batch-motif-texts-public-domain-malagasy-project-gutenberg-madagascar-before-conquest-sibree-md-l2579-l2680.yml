literal_observations:
- id: obs:1
  text: As the rainy season approaches, people work in rice-fields, repair houses
    and roofs, continue sun-dried brick or clay building, and repair watercourses
    and river banks to reduce flood risk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Summer is identified as November through February, the hot and rainy season,
    with little rain during the rest of the year.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Malagasy name for the season is glossed as “thunder-time,” because heavy
    rain is usually accompanied by thunderstorms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the rains begin, clouds gather in the evening, lightning flashes at
    night, and later dense dark clouds, thunder, forked lightning, wind, and heavy
    rain arrive in sequence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Heavy thunderstorms are described as dangerous, especially in the open or
    in houses without lightning conductors; the passage gives an example of lightning
    killing a college student and a nearby slave while a child survived with burns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Short intense rainfall on the steep rocky hill of the capital turns roads
    into rushing torrents and cascades and erodes highways.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The annual rainfall average for Antananarivo is given as 52 inches, with December
    and January described as the wettest months.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thunderstorms usually occur in the afternoon; after rain, early mornings are
    bright, vegetation is refreshed, and people cultivate crops on sloping hillsides.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hail frequently falls during thunderstorms and can damage rice crops, sometimes
    stripping a rice-field of every grain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Charms against hail are said to have had a prominent place in older popular
    beliefs and to still be trusted and used by some people.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Large hailstones can kill sheep and small animals left unsheltered, and are
