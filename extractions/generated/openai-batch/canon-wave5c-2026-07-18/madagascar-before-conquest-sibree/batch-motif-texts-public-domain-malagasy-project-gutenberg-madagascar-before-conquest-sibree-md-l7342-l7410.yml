  quote: ''
  summary: The passage describes Malagasy signs, gestures, and symbolic acts involving
    the lamba, bodily postures, public speech gestures, salutation, pointing, mimicry
    games, mourning actions, and tabu or ownership markers made with sticks, grass,
    palanquin poles, roads, wood, and cloth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman plying her trade may be identified by going through the streets with
    her face covered by her lamba, and a stranger was reproached for walking with
    her face covered like a harlot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Covering the lower half or more of the face with the lamba is described as
    a sign of sulkiness or sullenness, though it may also occur with laziness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Covering the mouth is described as indicating modesty or shame, often accompanied
    by uncovering the feet and lower legs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a public assembly a speaker giving assurances of loyalty and obedience
    may dance, flourish a spear or sword, and throw off the lamba to express rage
    at and defiance of an imaginary enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the end of a period in a public speech, speakers may jump from the ground
    and stamp down with both feet together to emphasize what they are saying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Friends walking together do not go arm-in-arm, but may go hand-in-hand or
    place a hand around the other's shoulder or waist.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Betsileo people saluting a superior are said to bend forward, make a scrape,
    and tug at the forelock, unlike the Hova gesture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When pointing to a distant object, Malagasy people are described as pointing
    higher than Europeans would, toward the heavens in that direction rather than
    toward the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the custom called mampitaha, one wife imitates another to show that she
    is equally clever with hands and feet; young girls are also observed playing the
    game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Women receiving news of the death of a near relative may throw themselves
    flat on the ground, creep toward the messenger, roll in dust, and tear their hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The kiddy is described as a sign of ownership, possession, or protection,
    and as a mark of tabu or tapu, usually made by a tall upright stick with grass
    fastened at the top.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Bearers may tie grass around one end of a palanquin pole before a journey
    to signify that they are engaged for it and will claim to carry it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: A road or path may be marked tabu by placing a stick or sticks across it,
    signifying that those behind are to avoid it.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Referenced symbolic acts include a piece of wood sent as a refy measure, a
    bullock killed on a large lamba so that no blood fell outside it, a lamba later
    sent with a hole cut from the middle, and symbolic teaching attributed to Andriamampandry.
  category: sequence
  evidence_refs:
  - ev:12
