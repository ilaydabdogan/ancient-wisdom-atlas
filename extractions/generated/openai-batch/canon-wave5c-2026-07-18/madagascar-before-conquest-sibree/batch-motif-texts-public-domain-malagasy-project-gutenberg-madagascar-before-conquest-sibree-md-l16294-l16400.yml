  text: Mr. J. T. Last discovered a mammalian skull in a marsh at Ambolisatra on the
    south-west coast of Madagascar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dr. C. J. Forsyth Major identified the skull as belonging to a large extinct
    lemuroid animal named Megaladapis madagascariensis.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described lemuroid skull was longer and larger than those of living lemurs,
    and the animal is estimated as nearly three times the size of any existing lemur.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dr. Major inferred from associated vertebrate remains that some animals in
    the group may have been seen by humans at a relatively recent date.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bones of several small Madagascar hippopotamus species were found on the south-west
