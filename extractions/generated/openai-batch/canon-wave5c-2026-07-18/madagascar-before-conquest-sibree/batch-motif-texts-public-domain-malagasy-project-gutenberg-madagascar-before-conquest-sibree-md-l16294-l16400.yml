  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Madagascar hippopotami are described as about two-thirds the size of African
    hippopotami and as believed to have been contemporaneous with the earliest human
    inhabitants of the island.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same locality as the lemuroid skull also yielded bones of swine, river-hog,
    and a slender-legged zebu form.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage concludes that Madagascar’s present paucity of large indigenous
    mammals was not always characteristic of its fauna.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Eggs and bones of the giant extinct bird Aepyornis maximus were discovered
    in Madagascar, and its bones indicated a struthious bird allied to ostrich-like
    forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Aepyornis eggs are described as exceeding previously known eggs in size,
