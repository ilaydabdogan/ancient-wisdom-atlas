  quote: ''
  summary: The passage summarizes late nineteenth-century discoveries and classifications
    of extinct or subfossil Madagascar fauna, including a large lemuroid skull named
    Megaladapis madagascariensis, several small hippopotamus species, swine and zebu
    remains, and numerous remains of giant extinct birds including Aepyornis and Mullerornis.
