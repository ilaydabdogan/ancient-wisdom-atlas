canonical_text:
  quote: ''
  summary: The passage is an appendix on Betsileo place-names. It lists town-name
    examples, explains that compounds ending in -arivo, meaning “thousand,” are frequent
    and associated with wealth and higher-status feudal estate centers, distinguishes
    some Fenoarivo names as Ambaniandro/Hova or government-colonist rather than properly
    Betsileo, and notes that -ony compounds concern water or confluence terminology.
    A footnote attributes the appended paper to Rev. Charles T. Price and mentions
    later works by M. Grandidier and W. C. Pickersgill on Malagasy place-names.
  language: English with Malagasy terms
  quote_policy: summarized
