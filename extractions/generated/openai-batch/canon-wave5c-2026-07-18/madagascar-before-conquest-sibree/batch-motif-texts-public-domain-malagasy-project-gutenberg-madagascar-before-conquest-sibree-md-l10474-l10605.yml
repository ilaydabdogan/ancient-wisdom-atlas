canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Ifara creates an inaccessible precipice,
    tricks Itrimobe into planting his spear and holding a rope, and lets him fall
    to his death. Stranded on the rock, she asks a crow and a hawk to carry her to
    her parents' well, but they refuse; a Kio/Reo bird accepts and places her in a
    tree above the well. A slave-girl repeatedly mistakes Ifara's reflection in the
    water for her own face and breaks waterpots; after she reports a voice like Ifara's,
    Ifara's parents come, reunite with her, and disown the sisters who deceived her.
    The passage then begins a fable in which personified body parts dispute which
    of them is senior.
  language: English
  quote_policy: summarized
