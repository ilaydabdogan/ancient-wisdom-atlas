canonical_text:
  quote: ''
  summary: The passage gives Betsileo and related Malagasy specialized vocabulary
    used for chiefs, chiefly bodies, speech, illness, funerals, corpses, tombs, and
    burial. It explains that tabooing chiefly names may have helped produce replacement
    words, describes sacralized funerary language and objects for deceased chiefs,
    notes different terms for dead commoners and chiefs, and states that Betsileo
    chiefs were regarded as far above common people, almost as gods, with curses believed
    to be unalterable. A footnote identifies scarlet as a royal color in Madagascar.
  language: English with Malagasy terms
  quote_policy: summarized
