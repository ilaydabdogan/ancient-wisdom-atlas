  text: The passage says several special body-part terms describe the functions of
    the parts, such as light-giving, hearing, taking, and treading, and suggests that
    tabooing words in chiefs' names may have influenced such specialized vocabulary.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists words specially applied to chiefs, whether old or young,
    for a house, illness, nursing, funeral singing, a bier, lying in state, a tomb,
    and burial.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poles used to carry a chief's corpse to burial are called sacred wood,
