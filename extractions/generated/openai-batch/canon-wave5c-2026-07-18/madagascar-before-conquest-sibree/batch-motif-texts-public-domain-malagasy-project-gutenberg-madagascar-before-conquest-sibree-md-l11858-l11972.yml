canonical_text:
  quote: ''
  summary: The passage describes how a Malagasy mpisikidy erects the sikidy divination
    by arranging beans, seeds, or dots in named columns; derives later columns by
    parity rules; validates the arrangement through the Andriamanitra column; and
    then begins procedures for answering questions or identifying remedies.
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sikidy arrangement is described as figures placed in columns; the diagram
    uses dots instead of beans or seeds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mpisikidy fills the first four columns by taking random handfuls of beans,
    removing them two by two, and placing either one or two beans in each square according
    to the remainder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first four columns are named Tale, Harena, Fahatelo, and Vohitra, and
    one of them can represent the person or thing for whom or for which the sikidy
    is made.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: 'The remaining eight columns are filled by combining earlier figures square
    by square: an odd result receives one bean, and an even result receives two beans.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage gives a fixed sequence of named combinations, ending with Andriamanitra
    and Tale forming Trano.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the sikidy is erected, it is worked to answer questions, identify causes
    of evils, and indicate cures, medicines, or charms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ordinary sikidy is said to deal properly with questions, though some other
    kinds prescribe remedies without a question.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The first check after erection is the figure in the column named Andriamanitra,
    translated as God.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Only eight of the sixteen figures are said to agree with Andriamanitra; these
    are called the Nobles or Kings of the sikidy, while the others are called Slaves.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: If a Slave figure enters the Andriamanitra column, the sikidy is invalid and
    must be broken up and begun again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The reason given for invalidity is that the sikidy has not done proper honour
    to God and cannot be expected to tell truth in His name.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the Andriamanitra check, one of the first four columns is selected to
    represent the question or its referent.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The subsequent procedures are divided into sikidy of identical figures, different
    figures, and combined figures.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: For the sikidy of identical figures, the operator identifies the figure in
    the question-representing column and then examines other figures except the other
    first-four columns.
  category: action
  evidence_refs:
  - ev:11
