canonical_text:
  quote: ''
  summary: The passage describes Malagasy systems of divination and luck attached
    to lunar days, moon-stations, house orientation, birth days, protective naming,
    and planetary weekdays. It explains that days could be good, bad, indifferent,
    or suitable for special purposes; that strong vintana could make a child dangerous
    or vulnerable; that diviners and names could avert danger; that parts of a Hova
    house corresponded to named days or months and had ritual restrictions; and that
    weekday san-andro names and characters were connected with the Seven Planets and
    compared with Arabic, Latin, and European planetary day-name systems.
  language: English
  quote_policy: summarized
