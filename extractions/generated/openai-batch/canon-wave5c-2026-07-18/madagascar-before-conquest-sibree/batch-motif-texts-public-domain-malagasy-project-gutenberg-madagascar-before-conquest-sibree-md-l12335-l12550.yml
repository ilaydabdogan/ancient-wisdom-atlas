canonical_text:
  quote: ''
  summary: The passage describes several Betsimisaraka forms of sikidy divination,
    including a remainder method using grass stalks and the Ati-pako method for enabling
    anonymous return of stolen property. It then explains vintana and san-andro as
    systems of destiny and auspicious timing tied to birth date, Zodiac constellations,
    lunar stations, month names, weekday names, and the Seven Planets. Diviners or
    day-declarers determine a child's vintana and are described as socially powerful
    because they know, interpret, and remedy destiny.
  language: English, with Malagasy and Arabic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Betsimisaraka are said to have at least six simpler kinds of sikidy besides
    the systematic kind previously described.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One simple procedure uses an indefinite number of grass stalks, removes them
    two by two, and interprets whether one or two remain according to a rule decided
    beforehand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ati-pako is described as a way to recover stolen property without detecting
    the thief by having servants or employees contribute items to a common heap.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The common heap in the Ati-pako procedure gives the thief an opportunity to
    return the stolen thing secretly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vintana is invoked in examples of illness, business failure, and an unmarried
    woman's pregnancy as an explanation for misfortune or conduct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage characterizes vintana as an invisible power felt everywhere and
    compares it to Greek and Roman fatum.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person's destiny is said to depend on the day and partly the time of birth,
