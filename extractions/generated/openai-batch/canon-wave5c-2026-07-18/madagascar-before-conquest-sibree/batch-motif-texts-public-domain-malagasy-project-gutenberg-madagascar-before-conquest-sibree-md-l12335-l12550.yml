  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Malagasy year is described as lunar, and both sun and moon are said to
    govern days of the week.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The Malagasy week is described as having Arabic day names and being under
