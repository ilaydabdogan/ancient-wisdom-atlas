  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mpamintana or mpanandro inquire into a child's birth day or time in order
    to determine the child's vintana and its influence on destiny.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the Malagasy days of the month represented the twenty-eight
