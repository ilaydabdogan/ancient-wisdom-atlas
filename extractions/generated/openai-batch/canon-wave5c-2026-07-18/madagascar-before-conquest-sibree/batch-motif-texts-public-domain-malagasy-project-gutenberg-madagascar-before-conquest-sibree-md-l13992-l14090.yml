  text: Upright stones near graves in the tract between Isindrandahy and Ambositra
    are described as finely dressed, squared, and carved, unlike rough undressed blocks
    common in Imerina.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hova tombs in Imerina are described as vaults made from large undressed blue
    granite slabs, with stone shelves for wrapped dead bodies, a stone door with pivot
