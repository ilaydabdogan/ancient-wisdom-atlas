canonical_text:
  quote: ''
  summary: The passage is a travel and ethnographic description of Malagasy tombs
    and burial memorials between Isindrandahy, Ambositra, Fianarantsoa, and Ikangara.
    It describes Hova tomb construction, upright stone memorials including vatolahy,
    carved wooden and stone posts, memorials to early Betsileo rulers or chiefs, an
    old tree near the memorials, later destruction of a memorial group by a Hova governor,
    and numerous roadside tombs with carved monuments.
  language: English
  quote_policy: summarized
literal_observations:
