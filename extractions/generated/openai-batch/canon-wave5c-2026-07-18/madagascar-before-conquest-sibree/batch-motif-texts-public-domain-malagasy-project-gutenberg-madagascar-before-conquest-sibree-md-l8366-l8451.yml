canonical_text:
  quote: ''
  summary: The passage gives translated examples and commentary on Malagasy oratory,
    symbolic speech, moral admonition, mortality, tomb imagery, impermanence, wisdom,
    and animal similes. A husband asks the public to help bring Rafara home, using
    a series of symbolic comparisons of loss, humility, and destructive natural forces.
    Other pieces urge pleasure while alive because death and the tomb are final, compare
    human life to trees that grow and are cut down, praise wisdom and advice, and
    note frequent animal and bird similes in admonitions.
  language: English
  quote_policy: summarized
