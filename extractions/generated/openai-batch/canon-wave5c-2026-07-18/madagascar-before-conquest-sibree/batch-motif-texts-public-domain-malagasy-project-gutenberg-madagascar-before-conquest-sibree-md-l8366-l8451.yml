  text: The second speech compares the speaker's difficulty to a nearly caught fowl
    flying into long grass, a bird carried off by flood, and a bull escaping to a
    high mountain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks the people to tell Rafara that he will be humble, without
    obstinacy, and will agree to what she has done.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker pairs Rafara with images of storm, hail, thunderbolt, and whirlwind,
