  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: One conundrum describes many shields and spears that cannot protect wife and
    children; the answer is a lemon tree, referring to its fruits and spines.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage describes conundrum games in which the proposer first names from
    a dozen to thirty things, then the rest of the party guesses them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first described game uses vague descriptions for insects, birds, and household
    objects, including the people as adornment of the sovereign, guns as the people's
    horns or protection, a big house as the town's top-knot, and a tadpole changing
    to a frog.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The second described game treats parts of an ox enigmatically, including its
    teeth as God's pavement, its eyes as two lakes at the foot of a tree, its lips
    as continually fighting but never separating, and its skin as a blanket worn day
    and night.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The third described game gives answers including ginger, honey, AntandnaAvo
