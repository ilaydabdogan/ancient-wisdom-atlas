- id: obs:4
  text: One conundrum identifies something living on dainties but never becoming fat
    as a lampstand fed with fat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: One conundrum arranges earth, a person, dry grass, water, and earth again;
