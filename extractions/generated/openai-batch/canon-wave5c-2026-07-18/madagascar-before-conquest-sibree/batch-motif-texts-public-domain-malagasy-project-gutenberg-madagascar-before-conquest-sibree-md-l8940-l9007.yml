  summary: The passage lists Malagasy conundrums and answers involving household objects,
    tools, plants, animals, water vessels, and body parts. It also describes conundrum
    games in which a proposer lists many enigmatic descriptions and the rest of the
    party guesses their referents, with examples from games about mixed objects, parts
    of an ox, and places or household elements.
  language: English with Malagasy terms
