  quote: '"Dead is Granny Mrs. Moon-dead-by-day-but-living-by-night"'
  summary: The passage describes a Malagasy children's game in which one child is
    treated as a dead granny, mourned, made to appear in dreams, and then raised and
    celebrated. It also describes children's Fandroana new-year customs involving
    procession, clean clothing, fruit, water, polite speeches, singing, and dancing,
    followed by examples of counting songs that use punning or numbered objects.
