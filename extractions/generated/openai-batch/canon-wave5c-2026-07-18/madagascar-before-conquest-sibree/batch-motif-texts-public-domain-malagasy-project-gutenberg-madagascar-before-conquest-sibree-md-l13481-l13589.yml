canonical_text:
  quote: ''
  summary: The passage describes Hova tomb construction, memorial stones, handling
    of corpses, purification and mourning customs, royal mourning, corpse-turning
    and rewrapping ceremonies, and Betsileo cave burial practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hova tomb building is described as important communal work involving relatives,
    friends, and slaves who leave other occupations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Five large stone slabs are prepared for the tomb vault; dried cow-dung lines
    are set on fire, cold water is applied, and the slabs are levered up and dragged
    to the tomb site.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The work of moving tomb stones is accompanied by feasting and rejoicing, and
    many oxen are killed to feed helpers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hova tombs are positioned to attract attention, sometimes opposite the family
    head's house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Imerina, pillars or slabs of stone are erected in memory of deceased relatives
    and are named Tsangambato or Fahatsiarovana.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Hova wrap the dead in reddish-brown lamba, often without coffins, and
    carry them to the tomb on a bier.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hova formerly placed skulls of oxen killed at funerals on or around the
    tomb; the passage says this is still practiced by several other named groups but
    is now abandoned among the Hova.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After returning from a funeral, leading mourners wash themselves and purify
    their clothes with water containing a silver coin and blessed by prayers to God;
    participants also receive sprinkling with this water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mourning observances include dishevelled hair, altered dress, men without
    hats and with growing beards, limited washing, dirty clothing, and prohibition
    of dancing and singing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the end of mourning, relatives share a meal and receive purification by
    sprinkling with water consecrated to God.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'When the sovereign dies, mourning is stricter: people shave their heads,
    avoid beds and chairs for a year, turn mirrors to the wall, and stop most labor.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hova families practice a ceremony called miaindika, described as turning corpses
    on one side in the tomb so they do not remain too long in one position.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The corpse-turning ceremony includes invited relatives, best clothing, music
    before the procession, visiting the family tomb, turning the dead, and wrapping
    them in new lamba.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: An observed procession with violins and drums moved the bones of a Hova woman
    of rank from one husband's tomb to another, after she had alternated between two
    tombs for several years.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Betsileo bury the dead in subterranean caves reached by a trench; corpses
    are placed on mats and covered with cloth, while rich people may have roof-lidded
    coffins covered with colored stuffs.
  category: action
  evidence_refs:
  - ev:11
