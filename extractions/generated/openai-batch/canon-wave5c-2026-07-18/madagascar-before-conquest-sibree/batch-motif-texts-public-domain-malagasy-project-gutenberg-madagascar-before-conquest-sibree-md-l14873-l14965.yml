  quote: ''
  summary: 'The passage records missionary observations in Madagascar: interruptions
    during preaching, a former royal-death custom requiring widespread head-shaving,
    and discomforts of staying in native houses, including vermin, domestic animals,
    and soot that Malagasy inhabitants regarded as a sign of an old family.'
  language: English
