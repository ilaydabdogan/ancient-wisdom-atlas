  quote: ''
  summary: The passage describes Malagasy sikidy divination using beans or seeds represented
    by dots. It lists sixteen Hova names for figures formed by arrangements of ones
    and twos, explains their construction, notes Arabic and astrological associations
    for some names, and describes sixteen columns or places in which figures are arranged
    when working the oracle. It also notes the roles of the diviner and inquirer and
    says many column names are ordinary Malagasy words, while several are Arabic-derived.
