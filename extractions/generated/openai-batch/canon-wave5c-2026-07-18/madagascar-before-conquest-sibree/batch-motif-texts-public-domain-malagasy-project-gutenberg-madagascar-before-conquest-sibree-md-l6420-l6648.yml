literal_observations:
- id: obs:1
  text: A Malagasy proverb compares the sovereign to the sky, which cannot be measured,
    and to the sun, which cannot be contended with.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A new royal house for Queen Rasoherina was constructed with principal dimensions
    based on the queen's own outstretched-arm fathom, or refy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rajaonary, a student from North Betsileo, reported that the Betsileo used
    many special words for chiefs and wrote an essay on the subject.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Betsileo account says chiefs' houses are treated as sacred or specially
    set apart, and people may enter only after leave from the chief or after being
    summoned.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: After entering a chief's house, a person must not push forward north of the
    hearth or stand idly, but must sit quietly and respectfully south of the hearth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief's drinking-tin, spoons, plates, and similar objects cannot be handled
    or put to the lips; water is poured into the hand from above for drinking.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A chief's bedstead is reserved for a chief, and a mat on which a chief sits
    must not be trodden on or sat on by anyone else.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Furniture associated with the chief is warned over with the word andapa, glossed
    as belonging to the palace, so that receivers take care of it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Objects in ordinary people's houses may also be kept from ordinary use if
    the chief has used them or might require them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Betsileo account divides special words for chiefs into classes, including
    words for the family of chiefs from birth until maturity and words for elderly
    chiefs.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:11
  text: Special words for children of chiefs include separate terms for children,
    eating, plate or dish, farewell, bearing offspring, dead, and corpse.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: For elderly chiefs, ordinary words for old, adult man, adult woman, head,
    eye, ear, and hand are replaced by special words with glosses such as sacred,
    Hova or prince, Hova or princess, brains, torch, listening, and taker.
  category: speech
  evidence_refs:
  - ev:8
