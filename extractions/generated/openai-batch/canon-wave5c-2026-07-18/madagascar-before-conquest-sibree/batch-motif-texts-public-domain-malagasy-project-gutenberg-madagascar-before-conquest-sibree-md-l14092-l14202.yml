canonical_text:
  quote: ''
  summary: The passage describes several kinds of Malagasy tombs and memorials near
    Ikangara and along the road southward, including stone tombs, carved wooden posts,
    granite blocks, iron horn monuments, and platforms for ox skulls. It then explains
    the symbolic importance of the humped long-horned ox, the bull, and horns in Malagasy
    proverbs, royal speech, songs, circumcision observances, tomb markers, house architecture,
    chiefly ritual authority, and royal salutations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two large tombs are described as square structures of small flat stones, about
    twenty to twenty-five feet across and about five feet high, surrounded by carved
    posts and rails with vase-shaped tops at the corners.
  category: object
  evidence_refs:
  - ev:1
