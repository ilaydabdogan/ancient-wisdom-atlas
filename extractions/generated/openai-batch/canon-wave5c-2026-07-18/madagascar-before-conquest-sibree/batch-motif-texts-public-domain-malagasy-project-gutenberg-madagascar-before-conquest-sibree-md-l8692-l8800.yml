canonical_text:
  quote: ''
  summary: 'The passage gives examples of Malagasy oratory using analogies, proverbs,
    and symbolic images: praise for friends'' good deeds, admonition of a man avoiding
    unpaid Queen''s service, counsel against evil speech, and a note on indirect attribution
    through ''they say.'' It then states that Malagasy symbolism extends to actions,
    compares this to Hebrew prophetic symbolic acts, and introduces a historical diplomatic
    exchange between Andrianimpoina and a Betsileo chief using kinship language, cloth
    imagery, and a measured piece of wood.'
  language: English
  quote_policy: summarized
