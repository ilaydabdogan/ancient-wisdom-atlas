- id: obs:1
  text: The passage states that some language groups have special classes of words
    used only when speaking of sovereigns or chiefs, including their persons, actions,
    surroundings, and honors in life and after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Imerina, specialized words are said to be used for the sovereign, often
    ordinary words with a special meaning when applied to the sovereign.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several terms are listed for a living sovereign or royal family, including
    a term glossed as “golden gun,” a term glossed as “first,” a familiar term used
    for the queen, and a term for royal family members glossed as the sovereign’s
    “liver” or “inside.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among some tribes, chiefs are called “water channels,” with the explanation
