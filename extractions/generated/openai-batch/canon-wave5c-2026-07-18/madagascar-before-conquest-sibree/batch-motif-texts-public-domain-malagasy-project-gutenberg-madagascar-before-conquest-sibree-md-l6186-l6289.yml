  summary: The passage describes specialized Malagasy vocabulary for sovereigns and
    chiefs, especially terms for royal illness, death, corpse, burial, divine status,
    and tomb construction. It also notes comparable chiefly terminology among different
    Malagasy groups and says similar royal/chief word classes occur in several language
    groups.
  language: English with Malagasy terms
