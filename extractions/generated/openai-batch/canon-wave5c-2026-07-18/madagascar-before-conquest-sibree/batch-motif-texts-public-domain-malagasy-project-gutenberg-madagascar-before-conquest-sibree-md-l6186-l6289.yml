  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Malagasy king or queen is said not to be called “ill” but “rather warm.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Malagasy king or queen is said not to be said to “die,” but to “retire”
