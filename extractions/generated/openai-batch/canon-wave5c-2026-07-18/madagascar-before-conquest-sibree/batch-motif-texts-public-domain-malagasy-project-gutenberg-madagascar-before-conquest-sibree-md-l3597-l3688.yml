  summary: The passage describes winter famadihana, in which corpses of deceased relatives
    are wrapped in fresh silk cloths and sometimes moved to new tombs; large weekly
    Hova Malagasy markets around Antananarivo and their goods, including enslaved
    people for sale; and the summer night sky, including Malagasy names or glosses
    for the Milky Way, the Pleiades, Orion's belt, and Venus as morning star.
  language: English with Malagasy terms and glosses
