canonical_text:
  quote: ''
  summary: The passage gives the end of a frog-and-serpent etiological tale; a fable
    in which Sugar-cane asks Rice for friendship and Rice refuses because Rice remains
    itself through many hardships while Sugar-cane becomes sugar and rum; and the
    beginning of a trickster tale in which Ikotofetsy and Imahaka present false idols,
    exploit a coming rainstorm, and frighten the people.
  language: English
  quote_policy: summarized
