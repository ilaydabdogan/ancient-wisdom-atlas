canonical_text:
  quote: ''
  summary: The passage first describes Malagasy number wordplay, counting rhymes,
    and unlucky numbers based on sound associations. It then introduces Betsileo marvellous
    or bogey stories and summarizes several beings, especially the Songomby, a swift
    ox-sized man-eater associated with dens and child exposure, and the seven-headed
    Fanany, said to arise from human intestines or corpses, especially those of noble
    descent, and to receive offerings after being identified by name.
  language: English with Malagasy terms
  quote_policy: summarized
