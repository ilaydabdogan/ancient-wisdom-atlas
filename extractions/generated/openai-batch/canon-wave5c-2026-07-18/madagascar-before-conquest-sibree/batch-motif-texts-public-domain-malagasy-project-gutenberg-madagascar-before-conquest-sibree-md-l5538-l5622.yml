canonical_text:
  quote: ''
  summary: The passage contrasts settled central and eastern populations with more
    nomadic Sakalava groups, describing pastoral habits and village abandonment after
    death because of fear of malign influence from the departed. It notes a Sihanaka
    practice of moving the dangerously ill outside the village to a temporary hut.
    It discusses Malagasy place-names, including dual names from Hova military posts,
    and explains names and functions of locations in and around Antananarivo, including
    royal, judicial, assembly, consecration, execution, market, hill, lake, and agricultural
    sites.
  language: English
  quote_policy: summarized
