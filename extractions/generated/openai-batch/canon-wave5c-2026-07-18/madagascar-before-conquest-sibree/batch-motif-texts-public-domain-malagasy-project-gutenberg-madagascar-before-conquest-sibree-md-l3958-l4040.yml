canonical_text:
  quote: ''
  summary: 'A traveler describes the crater lake Tritriva, its steep walls, dark water,
    and surrounding volcanic landscape. A bearer fetches water from the lake and recounts
    local legends: two lovers became side-by-side trees after entering the lake together;
    their branches are said to bleed when broken; a local clan reads the lake water''s
    discoloration as a death omen; and the lake was formerly inhabited by a seven-headed
    serpent that moved to another volcanic lake.'
  language: English
  quote_policy: summarized
