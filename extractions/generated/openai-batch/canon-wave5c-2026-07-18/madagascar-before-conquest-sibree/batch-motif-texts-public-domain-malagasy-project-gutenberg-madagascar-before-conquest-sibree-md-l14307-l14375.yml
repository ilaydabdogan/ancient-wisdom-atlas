    an especially well-preserved carved memorial pillar near Ivohitrombo with a wooden
    stage and ox skulls and horns; the Betsileo name and etymology for such memorial
    pillars; an elaborately carved central post in a chief's house; and incised decorative
    patterns on portable objects such as gourds, fifes, and tobacco boxes.
