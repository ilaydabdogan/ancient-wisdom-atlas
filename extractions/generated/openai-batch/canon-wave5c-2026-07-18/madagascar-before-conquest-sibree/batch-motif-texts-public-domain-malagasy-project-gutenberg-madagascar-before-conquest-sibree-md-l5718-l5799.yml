literal_observations:
- id: obs:1
  text: Many village-names include Malagasy terms for homestead, fosse or trench,
    and field.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that at least one fosse surrounds every old village and
    homestead, and that several deep trenches are often found one within another.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A few village-names refer to roads or paths, including places at crossroads
    and one name translated as being in the mud.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Several village-names are derived from situations on river banks, including
    branching waters, cataracts, rapids, separating streams, still waters, lakes,
    promontories, brown water, and river-mouths.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: One village-name is explained as complaining of a lack of water.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The element nosy is usually translated as island, but the passage says it
    often means rising ground standing up from marshes and rice-fields and more or
    less surrounded by them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some Imerina village-names include the province name plus a descriptive word
    and may memorialize additions of territory or boundary changes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The central Malagasy habit of assembling at large open-air markets gives names
    to many villages according to the weekday on which the market is held.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Town and village names include animal words such as crocodile, leech, dog,
    goat, crab, and spider.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Compounds with the word for ox are described as especially frequent, with
    examples referring to oxen, ox-horn, ox-head, ox-town, and oxen; one name is interpreted
    as referring to good pastures, and another to milk.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The word fahitra denotes a sunken pen or fold in which cattle are kept and
    fattened, and it enters many village-names, especially where such pens were numerous,
    large, or made by a famous former chief.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A few villages take names from a prominent or numerous tree or plant growing
    nearby, with examples involving gourds and lemons.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Common personal village-names are derived from chieftainship and often include
    words for sovereign and prince or noble.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Some villages are said to preserve the name of a former famous king or chieftain.
  category: relationship
  evidence_refs:
  - ev:6
