  summary: The passage describes Antananarivo's difficult rocky streets, older wooden
    and rush architecture, fires, the end of a custom forbidding stone or clay buildings
    after the Queen and Government accepted Christianity, the introduction of brick
    and stone construction, and prominent royal, religious, educational, medical,
    and scientific buildings in the capital.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Road-making and travel in Antananarivo are described as difficult because
    naked rock and steep gradients are common, with only about two main roads in the
    city.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Houses are described as standing in individual compounds rather than adjoining
    one another, with access to some houses by low walls and narrow steep rocky stairs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earlier city proper is described as having been built entirely of wood,
    rush, and bamboo, under a custom that did not allow stone or clay buildings within
    its limits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Older houses of nobles and wealthier people are described as having massive
    timber framing, thick upright planking, steep roofs, and long crossed gable-timbers
    called horns.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the old building materials were combustible, fires were frequent and
    sometimes burned twenty, thirty, or even a hundred houses at one time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the Queen and Government's acceptance of Christianity
    in 1868 ended the old building custom, after which old timber houses almost disappeared
    from the city.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: An ancient royal house printed as B^sdkana is described as preserved in the
    palace yard, where a deceased sovereign's corpse lies in state and the building
    is draped in scarlet cloth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The introduction of sun-dried brick and tiles and the erection of stone Martyr
    Memorial Churches are said to have changed building practice in Imerina and Betsileo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The city is described as containing hundreds of two- and three-storied brick
    houses and many public buildings of stone, with burnt brick becoming more common.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The largest royal palace, Manjakamiadana, is described as a three-storied
    timber structure surrounded by triple stone verandah and arches, with corner towers,
    lightning-conductors, and a gilt copper eagle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The gilt copper eagle on Manjakamiadana is explicitly described as a bird
    used as a kind of national emblem.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Other named palaces include the Tranovhla or Silver house, Mandnipisba, and
    Bhdkana, with Bhdkana described as the most ancient and venerated of all.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The palace courtyard includes the Chapel Royal, and the wider capital includes
