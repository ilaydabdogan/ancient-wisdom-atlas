canonical_text:
  quote: ''
  summary: Chapter opening and travel notes describe a November 1883 journey from
    Mahanoro toward Antananarivo/Imerina during the Franco-Malagasy war. The passage
    describes the travel party, filanjana conveyances and bearers, coastal and lagoon
    scenery, Beparasy village, a Betsimisaraka cemetery, tombs, a village circumcision
    memorial, and canoe travel through waterways.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the Franco-Malagasy war of 1883-1885, the route to the capital by way
    of Tamatave was closed for many months, making the Mahanoro and Mananjara roads
    usual routes for foreigners entering the interior.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The narrator states that he came up to Imerina by the Mahanoro route in November
    1883 and is giving the substance of daily journey notes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The travel party used native filanjana, described as light open palanquins,
    carried by strong Malagasy bearers, eight assigned to each person in two sets
    of four.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The roads are described as footpaths made by generations of bare native feet,
    crossing hills, bogs, and streams as encountered.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The party’s overnight accommodation and supplies included huts of rush or
    wood, mats, rice, fowls, stores in tin boxes, and portable stretchers with watertight
    bedding containers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The party consisted of the narrator, his wife, his two-year-old daughter,
    and Mr. Houlder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The filanjana is explained as a shoulder-carried conveyance made from poles
    and a suspended seat; ladies’ filanjana are described as oblong basket-like conveyances
    with rofia materials and sometimes a hood against sun and rain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The first stage went north along sandy land between coastal trees and lagoons,
    with wooded country, low hills, higher hills toward the interior, Traveller’s-trees,
    Pandanus, and large arums in shallow water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: After more than four hours of steady marching, the party reached Beparasy,
    described as a village with nearly one hundred houses.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a small Betsimisaraka cemetery, corpses were observed wrapped in mats,
    enclosed in planks, and fixed on a stage four or five feet above the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Near the village were tombs of a different form, resembling a house-roof and
    enclosed by a double line of pointed stakes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the village centre stood a post with two long horn-like points at the top
    and the mouldering remains of an ox-skull; local people identified it as a circumcision
    memorial.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next morning the party travelled by canoe through a narrow creek, a broader
    lagoon reach, another narrow channel, and then a broad lake, while observing large
    arums and Pandanus.
  category: sequence
  evidence_refs:
  - ev:8
