canonical_text:
  quote: ''
  summary: Two jealous sisters test whether others consider Ifara prettier than they
    are, strip her clothing, and trick her into gathering a monster's vegetables.
    The monster Itrimobe captures Ifara and fattens her to eat her. A clothed mouse
    gives Ifara escape advice in exchange for rice. Ifara flees south with objects,
    leaves a plantain-tree stem as a decoy, and throws a broom, egg, and cane that
    become obstacles while Itrimobe pursues and overcomes them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two sisters are angry because Ifara is prettier and say that a prince
    or noble seeking a wife would choose Ifara rather than them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters invite Ifara to go play and plan to ask people which of the three
    is best looking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman and an old man each say Ramatoa and Raivo are good looking but
    Ifara is better looking than either.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the beauty judgments, the sisters remove Ifara's lamba and then her
    underclothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Itrimobe is described as an immense monster, half human and half beast, man-eating,
    and having a frightfully sharp tail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When asked who is prettiest, Itrimobe gives the same answer as the old woman
    and old man, identifying Ifara as prettiest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sisters decide not to kill Ifara directly and instead plan for Itrimobe
