canonical_text:
  quote: ''
  summary: 'The passage concludes a fable in which the Belly settles a dispute over
    seniority among personified body parts and is accepted as eldest. Editorial commentary
    explains the Malagasy semantic range of the word for belly and explicitly compares
    the fable’s main idea with Aesop and St. Paul. The passage then gives a fable
    of a speaking little antsaly bird: a man stones, kills, cooks, and eats it despite
    warnings; the bird continues speaking from inside him; its parents find it, tear
    open the man’s belly, recover their child, and the man dies. The excerpt ends
    by introducing Rapeto as a fabulous figure associated with Ambohidrapeto.'
  language: English
  quote_policy: summarized
