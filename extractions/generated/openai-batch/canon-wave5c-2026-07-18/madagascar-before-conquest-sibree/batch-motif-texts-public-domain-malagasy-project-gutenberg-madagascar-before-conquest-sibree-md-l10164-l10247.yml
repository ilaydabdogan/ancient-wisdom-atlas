canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy reported creatures: the Ldloinena/Ldlimena,
    an ox-like aquatic animal with red horns possibly connected by the narrator to
    memories of hippopotamus remains; a note on Vily, a serpent associated with boas
    and native accounts; the Angalapona, a human-like water-dweller living dry in
    an underwater cave, connected with divination and reported encounters; and the
    Siona, a human-like wilderness creature that takes unattended goods, warms at
    fires, is covered with lichen, and is feared as a fate for some ill or deranged
    persons.'
  language: English
  quote_policy: summarized
