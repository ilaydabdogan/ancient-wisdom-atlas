literal_observations:
- id: obs:1
  text: Rice is cut with a straight-bladed knife, and cut stalks are laid in long
    curving narrow lines so that one sheaf covers the ears of the next to slow drying
    and prevent grain loss.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The threshing-floor is described as a square or circle of hard red earth,
    cleared of weeds, plastered with mud, and usually placed on sloping or rising
    ground near the rice-field.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sheaves are piled around the threshing-floor, and handfuls of rice are beaten
    on an upright stone fixed in the ground instead of with a flail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unhusked rice is carried to the owner's compound in baskets and stored in
    round holes lined with straw and covered with a flat stone and earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of April and beginning of May, many people are occupied with harvest
    work, and slaves and poorer people carry freshly cut grain or baskets of unhusked
    rice along roads and paths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spilled grain along roads attracts rats and mice, and the Fody or Madagascar
    cardinal-bird is said to take toll from the rice-crop and sometimes damage it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rice-stalks are spread out to dry in the sun and are also placed on the tops
    of clay boundary walls of compounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Christian congregations have Harvest Thanksgiving services, decorate churches
