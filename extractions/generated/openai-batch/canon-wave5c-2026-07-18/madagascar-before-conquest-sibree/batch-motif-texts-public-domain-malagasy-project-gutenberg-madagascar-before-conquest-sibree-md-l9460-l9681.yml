canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy children''s songs and games: a
    passing-under game with joined arms and a red Cardinal-bird house refrain; two
    Sakoda call-and-response plays including songs about an absent husband, funeral
    wrapping, lost beads, and frog-like leaping; Hedgehogsteps, in which children
    imitate an animal''s movement; Kibokaboka, a leper-tag game with touching, spitting,
    stones, and a verbal denial; a back-carrying game; and a moonlit Star-killing
    play using sheep dung and a song aimed at a bright star.'
  language: English with Malagasy terms
  quote_policy: summarized
