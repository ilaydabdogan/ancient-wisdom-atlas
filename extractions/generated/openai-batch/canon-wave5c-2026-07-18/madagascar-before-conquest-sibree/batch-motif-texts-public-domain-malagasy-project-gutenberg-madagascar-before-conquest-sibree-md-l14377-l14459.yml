canonical_text:
  quote: ''
  summary: The passage describes Betsileo carved memorial posts, tomb ornaments, and
    carved domestic objects; the author discusses incomplete documentation, weathering
    and cultural change threatening the carvings, preservation proposals, visual comparisons
    with Polynesian, Mangaia, and Nicobar ornamentation, and uncertainty about any
    origin tradition or religious or symbolic meaning. A later discussion note reports
    an opinion that the ornaments may once have had religious significance and observes
    thirteen rays in the circles.
