canonical_text:
  quote: ''
  summary: 'The passage describes a royal Malagasy funeral: the late king''s corpse
    is moved between palaces in a heavy wooden coffin, placed beneath a gold canopy
    while mourners lament, and then brought to a newly built mound-like tomb. A silver
    coffin, treasures, clothing, weapons, money, and precious objects are deposited
    with the body. Favorite bulls and horses are killed during the rites. Royal female
    mourners view the body, lament the king''s departure, and the body is transferred
    from the wooden coffin into the silver coffin.'
  language: English
  quote_policy: summarized
