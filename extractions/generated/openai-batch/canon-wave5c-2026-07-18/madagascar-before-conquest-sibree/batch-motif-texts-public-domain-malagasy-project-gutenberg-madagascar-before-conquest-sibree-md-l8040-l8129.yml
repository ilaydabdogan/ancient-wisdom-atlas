canonical_text:
  quote: "“regard them as signs of what will happen to them”"
  summary: The passage describes Malagasy interpretations of dreams as omens, including
    methods for neutralizing evil dreams, examples where dream content resembles the
    predicted event, examples where the meaning is reversed, and examples where no
    correspondence is apparent.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Malagasy are described as noticing dreams and regarding them as signs
    of future events.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Malagasy are described as being troubled by dreams and considering natural
    causes for them in order to counteract evil forebodings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After an evil dream, the reported consoling speech assigns the dream to winter
    chatter, summer streams carrying it away, spring dry soil absorbing it, or autumn
    satiation making it purposeless chatter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage classifies dream meanings as sometimes linked by similarity, sometimes
    by contradiction or reversal, and sometimes by no apparent correspondence.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
- id: obs:5
  text: Examples with apparent similarity include failing to cross a river and submitting
    to the call of the dead as signs of death, and the dead bringing medicine to an
    ill person as a sign of recovery.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other examples with apparent similarity include blood as a sign of fighting,
    meeting the Sovereign as a sign of high position, a lost spoon as a sign of famine,
    and buying a large spoon as a sign of a fruitful season.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Examples of reversed meaning include a lucky trading dream signifying loss,
    eating with the dead or dreaming of a tomb signifying long life, and finding or
    not finding a lost object in dreams signifying the opposite outcome.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Further reversed examples include a green tree as a sign of death, an ill
    person appearing better as a sign of long illness, crossing a crocodile-filled
    river as a sign of prosperity, and returning home in a dream while far away as
    a sign of dying on the road.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote states that the Malagasy have a strong belief in life after death
    and cites Andrianampoinimerina as saying that his flesh would be buried but his
    spirit and mind would remain with his subjects and Radama.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Examples with no apparent correspondence include flying as a sign of death,
    catching fish as a sign of calamity, red oxen fighting or fire as signs of being
    conquered by enemies, and red soil as a sign of poverty.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Further examples with no apparent correspondence include falling from a precipice
    or crossing dirty water as signs of illness, drinking brandy as a sign of recovery,
    fog as a sign of losing oxen, and mice pursuing the dreamer as a sign that somebody
    will take away his wife.
  category: relationship
  evidence_refs:
  - ev:6
