canonical_text:
  quote: ''
  summary: The passage describes Malagasy children's games. Children gather in moonlight,
    tease absent companions, and play Rasarindra, a chase game with a robber, a protective
    children's mother, and a youngest child called a lamb. It then describes two Soamiditra
    gateway games involving tall children as a gateway, lines of smaller children,
    clapping or hand-joining, alternating songs of invitation and refusal, food lists,
    locust imagery, and an entry song naming a doorway of a golden prince.
  language: English with Malagasy terms and song lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are described as calling companions out to play when there is bright
    moonlight and then choosing a spacious piece of ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children who do not come to play are mocked with songs about eating, cooking
    pots, gravy, and separation like lepers; the indoor children answer by referring
    to their fat fowls.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Rasarindra, the players stand in a row with lambas tightly girded around
    the waist, tallest in front and younger or weaker children behind, each holding
    the dress of the one in front.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Rasarindra, one of the biggest players is chosen to catch the rest and
    is called the robber; another big player is chosen as the children's mother to
    care for the little ones.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The robber asks for named players, then asks for the little lamb; the youngest
    child at the end of the line bleats, and the robber tries to catch the youngest
    and then the others while the children's mother protects them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Soamiditra No. 1, two of the tallest children face each other to form a
    gateway, clap hands, and sing, while the smaller children form a line, stoop,
    sing locust lines, and enter the gateway.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Soamiditra No. 2, the children use the same arrangement while two tall
    players and the rest sing alternately, with invitations and refusals connected
    to rice, meat, fowls, other foods, and fruits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the food and fruit sequence in Soamiditra No. 2, the little ones enter
    noisily while singing about the doorway of a golden prince and entering three
    times.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A reported variant has children join hands, the first two leading with an
    invitation to come, and the whole body answering that they will not go there.
  category: speech
  evidence_refs:
  - ev:9
