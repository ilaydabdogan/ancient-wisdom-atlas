canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy euphemistic and ceremonial language around
    death, especially royal death: mourners “offer tears,” a sovereign is “hidden”
    rather than buried, a royal coffin is called a “silver canoe,” tomb closure is
    “stopping up the sun,” and public mourning involves prohibitions and altered terms
    for ordinary activities. It also lists euphemisms for dead relatives and ordinary
    dead, including going to become ancestors, and notes similar euphemistic speech
    for dreaded smallpox and circumcision rites.'
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a sovereign’s corpse is lying in state, women from their divisions or
    tribes are expected to come in relays to mourn, and the ceremonial mourning is
    described as presenting or offering tears rather than by the usual mourning term.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sovereign is not said to be buried but hidden, and the massive silver coffin
    used for many recent Hova kings or queens is called the silver canoe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the expression silver canoe is treated as preserving
    a memory of an earlier period when the Hova were coast-dwelling or island people
    and buried their dead in an old canoe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that Sakalava, Betsimisaraka, and other coastal Malagasy
    peoples still have the custom of burying their dead in an old canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the royal corpse has been placed in its final resting place and the tomb
    entrance is closed, the act is called stopping up the sun; the sovereign is identified
    as the sun, the light and warmth of the people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some coastal tribes speak of the death of chiefs as the king reclining or
    leaning on one side; the same word is used in Imerina for the afternoon decline
    of the day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: General mourning at a sovereign’s death is expressed by the phrase that heaven
    and earth are turned upside down.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: During mourning for a Malagasy king or queen, the passage says that heads
    had to be shaved, hats and umbrellas were forbidden, clothing was restricted,
    and singing, dancing, musical instruments, and many crafts were prohibited.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Necessary agricultural work and markets could continue, but they were renamed
    with indirect terms such as going into the country, settling down in the fields,
    meetings, places of resort, or sorrowful markets.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Royal relatives are not said to be dead but absent or missing; dead friends
    and relatives are described as gone, faint, exhausted, fallen, laid down, lost,
    finished, or gone to become ancestors.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A footnote records a poetic expression comparing the dead to salt fallen into
    water that cannot become salt again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage extends the same type of euphemistic expression to feared smallpox,
    calling it greatly deserted or using an expression meaning be far away; it also
    notes a euphemism for circumcision ceremonies as cutting the navel.
  category: speech
  evidence_refs:
  - ev:8
