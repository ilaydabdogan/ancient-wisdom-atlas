  quote: ''
  summary: The passage describes several Malagasy sikidy divination rules. Specific
    figures or column combinations indicate outcomes, remedies, charms, substitutory
    sacrifices, directions for finding lost or stolen things, and days when an expected
    event will occur. The rites involve beans, rice, reeds, herbs, trees, a white
    hen, milk, pumpkin shell fragments, children, and divinatory mappings of house
    space to compass directions and months.
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One listed sikidy figure denotes that a thing can be done seven times without
    hindrance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One listed figure requires throwing away a cooking-pot full of rice and is
    associated with likely richness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the figure called Mahatsangana, its beans are applied to a reed of the
    same length as the person for whom the sikidy is worked, and the reed is then
    thrown away to bring good luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: One listed figure is described as an excellent charm against gun-shot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: For another figure, the beans are mixed with an herb called tambinbana; the
    sick person licks the mixture six times, and it is then put on the top of the
    sick person's head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: For the figure called Hiloka, or guilt, six beans are placed on six rice-husks,
    which are then thrown away as a faditra.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: For two other listed figures, a tree called andrarezina, and a white hen with
    a tree called fotsinanalidry, are prescribed as the faditra.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Unique figures in other columns usually suggest answers to questions and often
    give remedies against evils indicated by the answers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the figure Saka occurs in the column Trano, five beans are mixed with
    milk, placed into fourteen pumpkin-shell fragments, given to fourteen children,
    and followed by a rice-pot action from which the sterile woman eats.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some miscellaneous sikidy practices primarily aim to remedy evils, obtain
    prophylactics, or find times and directions for where something will be found
    or happen.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rules are listed for charms against gun-shot, for trade, for love, against
    vomiting, against dislike of food, against food having a ghost in it, and for
    bringing back a semi-departed spirit.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Andron-tany practice is described as an art for finding the direction
    in which to seek a lost, stolen, or strayed thing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old native houses are described as running north and south, with a single
    door and window on the west side, and with the twelve months assigned to twelve
    compass points around the house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Andro fotsy practice is described as identifying days on which something
    expected or sought for will happen; in the example, certain columns indicate Wednesday.
  category: action
  evidence_refs:
  - ev:8
