  text: About thirty or forty miles south of Ankaratra there are about a dozen conical
    hills without craters; V6tov6rona is described as 350 feet high, with a slope
    over 50 degrees and nepheline-hornblende-phonolite rock.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another low conical knob named V6tov6rona lies north-north-east of Ankaratra
    and west-south-west of Antananarivo; it consists of olivine-basalt, has small
    lava outflows, and is described as probably the core of an old volcano.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mandridrano, west of Lake Itasy, and the neighbourhood of B^tafo are said
