canonical_text:
  quote: ''
  summary: The passage narrates travel from the coast toward the interior highlands
    of Imerina, describing hills, forests, rice valleys, villages, rain, an ascent
    through cuttings and ferns, a difficult bridge crossing over deep water, and arrival
    at Mantasoa. It then describes the ruined Mantasoa workshops built under M. Laborde
    during Queen Ranavalona I's reign, their water-powered machinery and furnaces,
    and the forced labor imposed on Malagasy Christians during the persecution of
    1836-1861, followed by their welcome of Radama II's accession as a time of liberty.
  language: English
  quote_policy: summarized
