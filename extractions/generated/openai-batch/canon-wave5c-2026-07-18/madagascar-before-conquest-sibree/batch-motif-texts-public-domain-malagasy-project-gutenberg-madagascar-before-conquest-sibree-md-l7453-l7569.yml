canonical_text:
  quote: ''
  summary: 'The passage catalogs Malagasy animal-related customs and superstitions:
    ox and bull rituals, restrictions on meat, legendary cattle at a royal burial-place,
    disease omens associated with certain animals, whale explanations for earthquakes,
    and Betsileo beliefs concerning the fanany, a reptile-like being linked to the
    life or spirit of dead nobles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sakalava of Menabe seldom kill red oxen for food, but at circumcision
    festivals they kill a bull and seat the child on the animal's back during the
    customary invocation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The royal tribes of Maroseranana and Andrevola are said to have sometimes
    used human sacrifices instead of ox sacrifices.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Zafy Raminia will not eat flesh unless the animal was killed by a member
    of their own tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Analavory, described as a burial-place of extinct kings, a herd of cattle
    is said to gather annually at the Fandroana; fat cattle die by themselves, while
    lean cattle led by an ancient cow leave and return the next year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same Analavory report says that shouting there would bring rain even on
    a dry day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The word for ox is said to be equivalent to 'chief' or 'head,' and the bull
    is held sacred among the Sakalava.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The remains of one of a former queen's fighting bulls were found wrapped in
    a red lamba when foundations for a royal courtyard gateway were dug at Antananarivo.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Sihanaka, seeing the black moth called kakabomaso or the bird called
    vorondreo is believed to make a person liable to disease.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A hare-lipped cow and two rabbits owned by a native evangelist were considered
    taboo by local Sihanaka people and feared as causes of sickness and calamity if
    they remained.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Among the Hovas, earthquake shocks were explained by sayings that whales were
    turning over or bathing their children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Betsileo belief described here says the life or spirit of nobles or princes
    enters a creature called fanany or fandny, variously described as a worm, lizard,
    serpent, snake, or intermediate reptile.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The fanany is said to originate in liquid exuding from a tightly bound corpse
    and is then carried to water, which becomes taboo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When a suspected fanany is found, chief people assemble, ask whether it is
    the fanany of a named person, accept head movement as an affirmative answer, coax
    it onto a clean cloth, set ox blood before it, hold a feast, and carry it back
    to the tabooed water.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The fanany is said never to die; if decapitated or cut in halves, the missing
    part is renewed, while anyone injuring it will die.
  category: attribute
  evidence_refs:
  - ev:11
