canonical_text:
  quote: ''
  summary: The passage opens a chapter on Malagasy divination and fate. It describes
    sikidy as a widespread divinatory system used to discover hidden matters, predict
    future good or evil, diagnose and remedy misfortune, and avert danger. It summarizes
    beliefs about diviners, expiatory substitutes called faditra/aditra, and fate
    or vintana as connected with stars, birth times, auspicious times, days, months,
    and constellations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A system of divination called Sikidy or Sikify is described as practiced by
    almost all the tribes of Madagascar and known to European residents for more than
    two centuries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rev. Lars Dahle is named as the recent investigator whose findings are being
    summarized by the author.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sikidy is described as a means to look into the future, detect secret enemies
    or dangers, and find out a person's expected good or evil lot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says sikidy does not merely leave a person to destiny but undertakes
    to avert dreaded evils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In cases of sickness, the diviner is said to seek the cause of the evil and
    the means of removing it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that even if a person's spirit has left, diviners do not
    give up in despair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Faditra/aditra are described as expiatory things ordered by a diviner to be
    thrown away to prevent or avert an evil, often resembling the evil in name, shape,
    or number.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: If sikidy produced the result 'two deaths,' two locusts were to be killed
    and thrown away to prevent the death of two people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: If sikidy produced the result 'sick,' a piece of the tree called Hazo marary,
    or 'sick tree,' was to be used as faditra.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Diviners were called Ny masina, 'the sacred ones,' in Imerina and Betsileo,
    with the term described as implying strength and superhuman power rather than
    sanctity alone.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In outlying provinces diviners are said to be called ambiasa or ombiasy, a
    term identified in the passage with Arabic ambia, 'prophet.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The word sikidy is described as including both the investigation of what is
    secret and the art of finding a remedy when needed.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Vintana is described as a man's destiny depending on times declared by the
    stars at birth, and also as the fitness or unfitness of certain times for actions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that vintana rests on astrology, and that days and months
    are supposed to be connected with constellations.
  category: relationship
  evidence_refs:
  - ev:6
