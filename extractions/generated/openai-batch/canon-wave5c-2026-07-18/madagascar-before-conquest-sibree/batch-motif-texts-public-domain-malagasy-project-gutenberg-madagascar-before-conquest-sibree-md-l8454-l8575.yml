canonical_text:
  quote: ''
  summary: 'The passage presents Malagasy oratorical and proverbial pieces: a dialogue
    in which a bereaved person denies signs of sorrow until revealing that her child
    is dead; a fatalistic saying on the inevitability of death; a boast that personifies
    celestial and natural powers as kin, subjects, and weapons; a boasting exchange
    between two named men; moral commentary on native sayings; a warning from the
    stillness of a crocodile; and brief references to animal-observation pieces about
    eels and birds.'
  language: English with Malagasy terms and names
  quote_policy: summarized
