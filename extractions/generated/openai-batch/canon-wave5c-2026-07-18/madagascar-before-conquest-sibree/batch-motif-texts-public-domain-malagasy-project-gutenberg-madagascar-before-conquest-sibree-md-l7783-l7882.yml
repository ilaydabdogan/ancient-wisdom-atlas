canonical_text:
  quote: ''
  summary: The passage describes Malagasy fady, including universal, family, individual,
    place, class, sickness, and medicine-related prohibitions, with examples involving
    hemp, pork, lard, village objects, Lake Alaotra, nursing mothers, sick persons,
    foreign medicines, and a child's acceptance of a picture. It then introduces popular
    Malagasy superstitions, especially good omens involving dropped portions of food
    that predict obtaining other foods.
  language: English with Malagasy terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The use of hemp, whether as cloth or for smoking, is described as universally
    tabooed, while rum is said not to be abstained from in the same family- or tribe-wide
    manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many Sihanaka are described as rigidly abstaining from pork, avoiding lard-related
    ointment, refusing suspected pork loads, and avoiding cookware used for pork,
    while still eating wild boar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Families or clans are described as inheriting their own fady, including extra
    weekday restrictions, bans on selling eggs or inherited property, and prohibitions
    involving foods, tobacco, insects, birds, and certain woods for fuel.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Separate villages and places have fady; at Imerimandriso, broken-rim water-pots,
    insufficiently dried rushes, and an imperfect grass head-pad for carrying a water-pot
    may not be taken into the town.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Water is said to have fady; carrying lard across Lake Alaotra is said to ensure
    rough weather, and oil is treated as related enough to lard to be dangerous there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nursing mothers are told to avoid the flesh of unseparated calves lest they
    mourn children as cows mourn calves; they also avoid a named banana until the
    baby can pronounce it and may not look at a child's corpse. Young women refrain
    from rice on a certain yearly day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Medicine-related fady are described as onerous, sometimes involving many pots
    of leaves and roots kept boiling, and sickness commonly involves abstaining from
    chicken before medicine is taken.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: For the sick, fady include avoiding certain foods, excluding visitors with
    non-one-piece garments or freshly plaited hair, not answering someone outside
    the house, not looking at sunrise, sunset, or red things, and not lying down at
    sunset; traders from Imerina add abstinences for foreign medicines.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A recently noticed fady states that a child must not accept a picture lest
    European ghosts follow it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author states that many Malagasy beliefs described in this section resemble
    beliefs found in Europe and elsewhere, and says good omens often concern food
    and riches.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: The dropped-food omen examples form a sequence in which falling sweet-potato,
    potato, manioc, maize, rice, or beef predicts obtaining another food, ending in
    honey in the excerpt.
  category: sequence
  evidence_refs:
  - ev:11
