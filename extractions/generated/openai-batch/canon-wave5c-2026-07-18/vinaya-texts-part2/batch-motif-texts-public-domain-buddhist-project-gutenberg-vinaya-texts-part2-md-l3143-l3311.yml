canonical_text:
  quote: ''
  summary: 'The passage recounts several Vinaya episodes: the Blessed One and the
    Bhikkhu-sangha receive a meal from a Brahman, who later brings promised fresh
    tila seeds and honey; rules are given for accepting food during scarcity; a family
    sends hard food for the Sangha with reference to Upananda; the Blessed One travels
    to Savatthi; Sariputta has fever and says lotus stalks helped; Maha Moggallana
    instantaneously travels to Mandakini lake, where Nagas assist in gathering edible
    lotus stalks.'
  language: English
  quote_policy: summarized
