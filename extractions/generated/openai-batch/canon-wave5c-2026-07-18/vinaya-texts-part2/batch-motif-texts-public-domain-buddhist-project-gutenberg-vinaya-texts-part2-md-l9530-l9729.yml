canonical_text:
  quote: ''
  summary: 'The passage records several Vinaya rulings on cloth and robes: taking
    property on trust from a qualified friend, allowing cloth for water-strainers
    and bags, determining which requisites may be kept or handed over, setting a size
    limit for robes to be handed over, repairing patched robes, permitting mixed torn
    and untorn robe construction, and introducing a case of a monk wishing to give
    robes to his parents.'
  language: English translation with Indic terms
  quote_policy: summarized
