canonical_text:
  quote: ''
  summary: The Blessed One rebukes a monk for wrongly understanding the Dhamma and
    not renouncing a sinful doctrine. He directs the Saṅgha to impose the Ukkhepaniya-kamma
    so that the monk will not eat or dwell with the community. The text then summarizes
    legal and procedural cases for this act, narrates that the monk leaves the Order
    after the sanction, records the complaint of moderate monks and a further rebuke,
    and gives instructions for revoking the disciplinary act.
  language: English
  quote_policy: summarized
