canonical_text:
  quote: ''
  summary: The passage gives Vinaya rules about lawful and unlawful communal acts.
    It treats expulsion for a monk who refuses to acknowledge an offence, then presents
    Upali asking the Blessed One whether specific acts by a complete congregation
    are valid. The Blessed One states that acts performed without required presence,
    response, confession, or proper matching of procedure are unlawful, while properly
    matched acts performed according to procedure are lawful.
  language: English
