canonical_text:
  quote: ''
  summary: 'The passage records a sequence of Vinaya allowances and restrictions for
    medical treatments and implements: nasal medicine, nose-spoons, aroma-pipes and
    their containers, oil decoctions with limits on strong drink, vessels for medicine,
    sweating and steam treatments, medicinal waters and baths, bloodletting with a
    horn, and foot ointment. Several rules arise after illness, practical difficulty,
    luxury objects, contamination, or intoxication.'
  language: English translation with Pali terms in notes
  quote_policy: summarized
