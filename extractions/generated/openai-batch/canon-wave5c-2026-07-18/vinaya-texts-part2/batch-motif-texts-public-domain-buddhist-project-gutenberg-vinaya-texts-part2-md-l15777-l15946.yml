  quote: ''
  summary: An English translation of Vinaya disciplinary rules explains how probation
    is interrupted, postponed, and resumed, and then applies similar procedures to
    Manatta or penance. A probationer approaches another monk with prescribed robe
    arrangement, posture, joined palms, and formulaic speech. Upali later asks the
    Blessed One about interruption of Manatta, and four causes are listed.
  language: English
