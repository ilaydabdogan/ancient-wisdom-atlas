canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rules and cases about robes donated to the Saṅgha
    after the rainy season: how robes are to be divided, when a solitary monk may
    appropriate them, how senior monks interpret eligibility before the Kaṭhina ceremony,
    and how Upananda is rebuked for taking robe shares in places where he did not
    spend the rainy season.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed Bhikkhu spent the rest of the year alone, and the matter was reported
    through the Bhikkhus to the Blessed One.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One prescribes that robes should be divided with the Saṅgha present,
    and permits a solitary Bhikkhu to appropriate robes intended for the Saṅgha under
    stated conditions.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: If another Bhikkhu arrives before appropriation or before the lot is cast,
    he receives an equal share; if he arrives after the lot is cast, an equal share
    need not be given if the others do not wish it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brothers Isidasa and Isibhatta spent the rainy season at Savatthi,
    went to a village, and the people there made gifts of food and robes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Resident Bhikkhus asked Isidasa and Isibhatta whether they would accept a
    share of robes, and the Theras answered that the robes belonged to the residents
    until the Kaṭhina ceremony had been performed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three Bhikkhus at Rājagaha received robes given to the Saṅgha, reflected that
    the smallest Saṅgha consists of four persons, and consulted senior Theras at Pāṭaliputta.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Upananda of the Sakya race accepted robe shares in multiple places after spending
    the rainy season at Savatthi, and returned with a great bundle of robes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Other Bhikkhus questioned Upananda, some became indignant, and the Blessed
    Buddha rebuked him and declared that one who spent the rainy season in one place
    must not accept a robe share in another place.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: Upananda later spent the rainy season alone in two residences with the stated
    intention of obtaining many robes, and the Bhikkhus referred the question of his
    robe portion to the Blessed One.
  category: action
  evidence_refs:
  - ev:10
