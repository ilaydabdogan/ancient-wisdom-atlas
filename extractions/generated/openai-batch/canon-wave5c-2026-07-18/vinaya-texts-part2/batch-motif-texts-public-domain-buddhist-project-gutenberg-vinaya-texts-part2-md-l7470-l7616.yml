canonical_text:
  quote: ''
  summary: Civaka returns to Rajagaha and offers his first earnings and retainers
    to Prince Abhaya as payment for his upbringing; Abhaya tells him to keep them
    and live in Abhaya's residence. King Seniya Bimbisara suffers from a bleeding
    fistula and is mocked by the queens; Abhaya recommends Civaka, who heals the king
    with one anointing. The restored king offers ornaments from his five hundred wives,
    but Civaka instead accepts an office serving the king, the royal household, and
    the Bhikkhu community headed by the Buddha. A Rajagaha householder has had a head
    disease for seven years after other physicians failed and predicted his death;
    a merchant petitions the king to send Civaka. Civaka negotiates the fee, asks
    whether the patient can remain lying in several positions for seven months each,
    ties him to a bed, cuts the scalp, and extracts two worms, one small and one large.
  language: English translation; source language not supplied in metadata
  quote_policy: summarized
