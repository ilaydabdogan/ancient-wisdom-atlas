canonical_text:
  quote: ''
  summary: The passage ends a disciplinary case concerning suspension for refusing
    to atone for a fault, then begins a case concerning Ariṭṭha, a monk formerly described
    as a vulture tormentor, who maintains a doctrine that practices declared by the
    Buddha to be impediments do not obstruct spiritual attainments. Other monks challenge
    him and cite many similes in which lusts are described as painful, dangerous,
    and obstructive. Ariṭṭha refuses to abandon the doctrine. The monks report the
    matter to the Buddha, who convenes the Bhikkhu-saṅgha and questions Ariṭṭha; Ariṭṭha
    reaffirms his view.
  language: English
  quote_policy: summarized
