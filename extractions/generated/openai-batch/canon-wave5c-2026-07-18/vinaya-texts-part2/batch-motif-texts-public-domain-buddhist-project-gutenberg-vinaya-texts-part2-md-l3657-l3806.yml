canonical_text:
  quote: ''
  summary: The passage gives rules forbidding Bhikkhus to eat several kinds of animal
    flesh, including horse, dog, serpent, lion, tiger, panther, bear, and hyena. It
    includes a petition by the serpent king Supassa that monks not eat serpent flesh
    because some serpents might harm them. It then narrates the Buddha's journey to
    Andhakavinda with a large community of Bhikkhus, a Brahmana's delayed opportunity
    to offer food, his preparation of rice-milk and honey-lumps, and the Buddha's
    teaching on the tenfold merit and benefits of giving rice-milk.
  language: English
  quote_policy: summarized
