canonical_text:
  quote: ''
  summary: The passage gives Vinaya procedures for a Bhikkhu who has committed two
    Saṅghādisesa offences concealed for two months. It treats variations involving
    awareness, recollection, doubt, witting and unwitting concealment, the validity
    of probation imposed by the Saṅgha, liability to Manatta, and cases where shame
    leads a Bhikkhu to ask for further probation after receiving too short a probation.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu who has committed two Saṅghādisesa offences concealed for two months
    may ask the Saṅgha for probation for the offence of which he is aware; if he later
    becomes aware of the other offence, he asks for a further two-month probation
    for that offence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives parallel procedural variations for cases where one offence
    is recollected and the other is not, or one offence is not doubtful and the other
    is doubtful.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When one offence was concealed wittingly and another unwittingly, a learned
    Bhikkhu states that probation is valid for the witting concealment but invalid
    for the unwitting concealment, and that the Bhikkhu is liable to Manatta for the
    latter offence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The learned Bhikkhu is described as versed in traditions, acquainted with
    tradition, a custodian of the Dhamma, Vinaya, and Matikas, and as clever, discreet,
    wise, modest, sensitive, and willing to learn.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another case, a Bhikkhu who concealed two Saṅghādisesa offences for two
    months asks for and receives only one month of probation, then shame overcomes
    him and he asks what he should do.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bhikkhus report the matter to the Blessed One, who directs that the Saṅgha
    impose a further month of probation; the Bhikkhu should undergo probation for
    two months from that date.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A later section restates the pattern in which a Bhikkhu undergoing probation
    is overcome by shame and asks the Saṅgha for a further month of probation for
    two offences concealed for two months.
  category: sequence
  evidence_refs:
  - ev:6
