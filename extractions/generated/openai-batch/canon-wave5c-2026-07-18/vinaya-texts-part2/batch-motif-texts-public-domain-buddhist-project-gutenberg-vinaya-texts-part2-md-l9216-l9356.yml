canonical_text:
  quote: ''
  summary: 'Visakha explains to the Lord the practical and spiritual reasons for requesting
    eight lifelong boons: food for incoming and outgoing Bhikkhus, suitable food and
    medicine for the sick, food for those attending the sick, a constant supply of
    congey, and bathing dresses for Bhikkhunis. She says these provisions prevent
    weariness, delay, sickness, death, and shame. She further explains that remembering
    deceased monks who may have benefited from her gifts will produce gladness, joy,
    peace, bliss, moral exercise, and wisdom in herself.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An incoming Bhikkhu may become weary while seeking alms, especially when he
    cannot take direct roads and does not know where food can be procured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visakha wants to provide lifelong food for incoming Bhikkhus so that they
    can travel without weariness, take direct roads, and know where food can be procured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An outgoing Bhikkhu who seeks alms for himself may be left behind by the caravan,
    arrive late, and set out weary; provided food is said to prevent these outcomes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sick Bhikkhu who does not obtain suitable food may have worsening sickness
    or may die; suitable diet is said to prevent this.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Bhikkhu attending the sick may be delayed while seeking food, bring food
    to the invalid late, and miss his own opportunity to eat; provided food is said
    to prevent this.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sick Bhikkhu who does not obtain suitable medicines may have worsening sickness
    or may die; provided medicines are said to prevent this.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Blessed One is said to have allowed the use of congey at Andhakavinda
    because of ten advantages, and Visakha wants to provide a constant supply of congey.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bhikkhunis bathe naked at the same river landing-place as courtesans, who
    ridicule their chastity; the Bhikkhunis become confused, and Visakha asks to provide
    bathing dresses for them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bhikkhus who spent the rainy season in various places are expected to come
    to Savatthi and ask the Blessed One about the rebirth and destiny of deceased
    Bhikkhus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The Blessed One is expected to explain that a deceased Bhikkhu attained one
    of several states: the fruit of conversion, the state of the Sakadagamins, the
    state of the Anagamins, or Arahatship.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Visakha expects that recalling a deceased Bhikkhu's prior enjoyment of one
    of her provisions will give rise in her to gladness, joy, peace, blissful contentment,
    rest of heart, moral exercise, and wisdom.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The requested supports are described as eight boons asked of the Tathagata.
  category: speech
  evidence_refs:
  - ev:9
