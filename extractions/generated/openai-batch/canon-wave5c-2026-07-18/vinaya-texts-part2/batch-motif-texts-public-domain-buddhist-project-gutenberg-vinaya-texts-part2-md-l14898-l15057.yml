canonical_text:
  quote: ''
  summary: 'The passage gives formal procedures for appointing a companion messenger
    to help Sudhamma ask pardon from a householder, including repeated requests and
    a bodily posture for confession if pardon is withheld. It then reports that Sudhamma
    obtained pardon. The passage next introduces suspension acts for a monk who does
    not acknowledge or atone for an offense: Channa refuses to acknowledge a fault,
    moderate monks report this, the Buddha rebukes the conduct, and he directs the
    Saṅgha to suspend Channa from eating or dwelling with the community and to proclaim
    the suspension from residence to residence.'
  language: English translation with Pali terms
  quote_policy: summarized
