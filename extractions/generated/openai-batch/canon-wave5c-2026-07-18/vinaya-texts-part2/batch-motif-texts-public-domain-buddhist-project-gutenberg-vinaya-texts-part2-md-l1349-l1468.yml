canonical_text:
  quote: ''
  summary: The passage recounts how Soṇa Kuṭikaṇṇa, attendant of Mahā Kaccāyana in
    Avanti, repeatedly asks to leave household life, receives ordination after persistence,
    and later obtains higher ordination only after a difficult three-year effort to
    assemble ten Bhikkhus. After the rainy season, Soṇa wishes to see the Buddha face
    to face; Mahā Kaccāyana permits him to go, instructs him to bow to the Buddha,
    and asks him to request permission for higher ordination in Avanti with fewer
    monks because the region has few Bhikkhus. The passage also begins a description
    of the region’s rough black soil trampled by cattle.
  language: English with transliterated Pali names and terms
  quote_policy: summarized
