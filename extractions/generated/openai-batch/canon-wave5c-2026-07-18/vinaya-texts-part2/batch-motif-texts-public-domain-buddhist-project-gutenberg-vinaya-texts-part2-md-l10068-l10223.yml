canonical_text:
  quote: "“Whosoever, O Bhikkhus, would wait upon me, he should wait upon the sick.”"
  summary: The passage gives rules about robe portions for a monk who divided the
    rainy season between residences, then narrates the Blessed One and Ananda caring
    for a sick monk abandoned by other monks. The Blessed One instructs the Saṅgha
    that monks must care for the sick, lists qualities of patients and caregivers,
    and addresses the bowl and robes of a monk who died while being nursed during
    travel.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A monk who spends the rainy season in two residences in order to obtain many
    robes is to receive robe portions according to where he spent half or the greater
    part of the season.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sick Bhikkhu with a bowel disturbance was lying in his own evacuations in
    his abode.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sick Bhikkhu had no one waiting upon him because he was considered of
    no service to the other Bhikkhus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One and the venerable Ananda encountered the sick Bhikkhu while
    going around the sleeping-places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ananda fetched water; the Blessed One poured water over the sick Bhikkhu;
    Ananda wiped him down; together they lifted him and laid him on his bed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One convened the Bhikkhu-saṅgha and questioned the monks about
    the sick Bhikkhu and the absence of care.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Blessed One told the Bhikkhus that if they do not wait upon one another,
    no one else will, and that one who would wait upon him should wait upon the sick.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage assigns care of a sick monk to his preceptor, teacher, pupils,
    fellow residents, or, if none are present, to the Saṅgha; failure to do so is
    said to incur a dukkaṭa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Five qualities make a sick person difficult to wait upon, including not doing
    what is good for him, not taking medicine, not informing the nurse about the disease,
    and being unable to bear severe bodily pains; the contrary qualities make him
    easy to wait upon.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Five qualities make a nurse incompetent, including inability to prescribe
    medicines, ignorance of suitable diet, serving out of greed rather than love,
    revulsion at removing evacuations, saliva, or vomit, and inability to teach or
    encourage the patient with religious discourse; the contrary qualities make one
    competent.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Two Bhikkhus were travelling on a high road in Kosala; at a residence one
    fell ill, and the Bhikkhus there nursed him until he died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the travelling Bhikkhu died, other Bhikkhus took his bowl and robes
    to Savatthi and reported the matter to the Blessed One.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Blessed One states that, upon a Bhikkhu’s death, the Saṅgha becomes owner
