canonical_text:
  quote: ''
  summary: A householder pursues the Blessed One and a large company of Bhikkhus with
    food, cows, and cowkeepers, serves them in a desert place, and asks that monks
    be allowed to carry journey supplies. The Blessed One permits cow products and
    specified provisions while rejecting acceptance or seeking of gold. A following
    passage introduces Keniya the ascetic, who hears the Buddha praised as an enlightened
    teacher and considers what gift to bring, recalling ancient Brahmanical rishis
    who accepted drinks despite food restrictions.
  language: English translation with transliterated Pali names and OCR artifacts
  quote_policy: summarized
