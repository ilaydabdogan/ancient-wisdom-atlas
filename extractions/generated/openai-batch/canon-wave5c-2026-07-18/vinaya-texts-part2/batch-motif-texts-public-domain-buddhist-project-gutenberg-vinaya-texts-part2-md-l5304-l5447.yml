- id: obs:1
  text: The Blessed One travels from Bhaddiya toward Ariguttardpa/Ariguttarapa with
    a company of one thousand two hundred and fifty Bhikkhus, without informing the
    householder named in OCR-variant form as Me;/^aka.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The householder commands slaves and servants to load salt, oil, rice, and
    hard food, and commands one thousand two hundred and fifty cowkeepers to come
    with one thousand two hundred and fifty cows to supply fresh milk wherever the
    Blessed One is found.
  category: action
  evidence_refs:
  - ev:1
