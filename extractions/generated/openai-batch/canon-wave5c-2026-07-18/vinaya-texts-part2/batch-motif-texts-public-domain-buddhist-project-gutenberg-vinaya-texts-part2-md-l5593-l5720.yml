canonical_text:
  quote: ''
  summary: The passage first gives a benediction pronounced by the Blessed One for
    Keniya the ascetic, ranking ritual, social, and cosmic chiefs and culminating
    in the Saṅgha as chief. It then narrates the Blessed One’s journey to Kusinara
    with Bhikkhus, the Mallas’ compact requiring all to welcome him, Roja the Malla’s
    reluctant welcome from fear of a fine, Ananda’s request that Roja become devoted,
    and Roja’s subsequent desire to visit the Blessed One after the Blessed One suffuses
    him with love.
  language: English translation with Pali/Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One pronounces a benediction on Keniya the ascetic in verse form.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The verses name a sequence of chiefs: fire sacrifice among offerings, Savitthi
    among sacred verses, king among men, ocean among waters, moon among constellations,
    sun among heat-givers, and the Saṅgha among conquering ones who long after good.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After pronouncing the benediction, the Blessed One rises from his seat and
    departs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One travels from Apaṇa toward Kusinara with a company of two hundred
    and fifty Bhikkhus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mallas of Kusinara establish a compact that anyone who does not go out
    to welcome the Blessed One must pay a fine of five hundred pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Roja the Malla tells Ananda that he came to welcome the Blessed One because
    of fear of the fine, not because he is much moved by the Buddha, the Dhamma, or
    the Saṅgha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ananda is sorrowful at Roja’s words and asks the Blessed One to act so that
    Roja becomes devoted to the doctrine and discipline.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One suffuses Roja with a feeling of love, after which Roja seeks
    the Blessed One from dwelling-place to dwelling-place and apartment to apartment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Roja’s seeking is compared to a young calf following the cows.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bhikkhus instruct Roja to approach the closed dwelling quietly, enter
