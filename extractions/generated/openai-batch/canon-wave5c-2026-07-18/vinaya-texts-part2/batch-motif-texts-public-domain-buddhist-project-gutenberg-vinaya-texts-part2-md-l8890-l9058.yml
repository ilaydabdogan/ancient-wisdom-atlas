canonical_text:
  quote: ''
  summary: A Vinaya passage describes complaints about monks wearing extra suits of
    robes. The Blessed One prohibits extra robe suits, then permits Ananda to keep
    one for up to ten days while waiting for S^riputta, directs extra robes to be
    made over to robe-less monks, approves repairs to torn robes with slips and patches,
    and later accepts Visakha's invitation to a meal with the Bhikkhu community.
  language: English
  quote_policy: summarized
