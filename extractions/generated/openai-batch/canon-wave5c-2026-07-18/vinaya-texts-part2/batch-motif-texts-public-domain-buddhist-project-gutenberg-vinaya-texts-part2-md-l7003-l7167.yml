canonical_text:
  quote: ''
  summary: The passage gives Vinaya cases about Bhikkhus after the Kathina ceremony
    taking a robe, traveling between residences, deciding whether to return, and retaining
    or losing a claim to a share in the Kathina distribution based on residence and
    robe conditions. It then opens the eighth Khandhaka on dress, locating the Buddha
    at Rajagaha and describing Vesali as prosperous, with many buildings, pleasure
    grounds, lotus-ponds, the courtesan Ambapalika, and a Rajagaha merchant who visits
    Vesali.
  language: English translation with Indic terms in transliteration
  quote_policy: summarized
