  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A comfort-seeking Bhikkhu plans to try several residences, remain if one is
    comfortable, and return if none is comfortable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After going beyond the boundary, the comfort-seeking Bhikkhu decides to have
    the robe made up there and never go back.
