canonical_text:
  quote: ''
  summary: A Vinaya disciplinary passage forbids lofty or luxurious reclining items,
    fine animal skins, ox-skins, the use of any skins, inducing another to kill a
    living being, and entering villages wearing shoes. It also gives limited permissions
    for sitting on lay-arranged skin-covered seats, for skins used only as bindings,
    and for a sick monk who needs shoes.
  language: English translation with a brief romanized Pali note embedded in the supplied
    passage
  quote_policy: summarized
