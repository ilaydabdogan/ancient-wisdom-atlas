canonical_text:
  quote: ''
  summary: The passage records Vinaya allowances for sick Bhikkhus to use and store
    several categories of medicines, including astringent decoctions or roots, leaves,
    fruits, gums, salts, and chunam, with use limited by necessity and improper use
    classed as a dukkaṭa offence. It also narrates the case of the venerable Belaṭṭhasīsa,
    whose diseased scabs caused his robes to stick to his body; other Bhikkhus moistened
    the robes with water, and the Blessed One responded by allowing chunam and related
    materials, plus a pestle and mortar.
  language: English translation with transliterated Indic terms
  quote_policy: summarized
