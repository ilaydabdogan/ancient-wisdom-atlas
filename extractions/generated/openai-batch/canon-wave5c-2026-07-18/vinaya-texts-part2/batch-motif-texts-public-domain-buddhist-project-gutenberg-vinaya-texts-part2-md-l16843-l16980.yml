canonical_text:
  quote: ''
  summary: The passage gives monastic disciplinary rules for cases in which a Bhikkhu
    under probation, liable to Manatta discipline, undergoing Manatta discipline,
    or pending rehabilitation changes state, commits further Saṃghādisesa offences,
    conceals offences, throws off the robes, or receives upasampada again. Consequences
    include interruption of probation, being thrown back to the beginning of probation,
    inclusive probation measured by duration of concealment, Manatta discipline, and
    rehabilitation procedures.
  language: English with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a Bhikkhu undergoing probation goes out of his mind, becomes weak in mind,
    becomes diseased in sensations, or is suspended for specified disciplinary failures,
    no probation occurs for him while that condition lasts; after recovery or restoration,
    the original probation remains obligatory.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage treats throwing off the robes and other changes of state as interrupting
    major disciplinary proceedings, including probation, liability to Manatta, Manatta
    discipline, and fitness for rehabilitation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a Bhikkhu undergoing probation commits numerous definite Saṃghādisesa offences
    that are not concealed, he is to be thrown back to the commencement of his probation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a Bhikkhu undergoing probation commits numerous concealed Saṃghādisesa
    offences, he is to be thrown back to the commencement of probation and given inclusive
    probation measured from the first concealed offence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same treatment of further offences is applied to cases where the offences
    occur while the Bhikkhu is liable to Manatta discipline, undergoing Manatta discipline,
    or pending rehabilitation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a Bhikkhu who committed numerous Saṃghādisesa offences without concealing
    them throws off the robes, later receives upasampada again, and does not conceal
    the offences, Manatta is to be imposed on him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If offences were concealed before or after the renewed upasampada, probation
    is imposed according to the duration of concealment, followed by Manatta.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage explicitly enumerates groups of cases, including forty cases of
    interruption to a major disciplinary proceeding and thirty-six cases of fresh
    offences committed while under probation or related states.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:5
