canonical_text:
  quote: ''
  summary: A Vinaya narrative recounts how Kassapa-gotta, a resident monk at Vasabha-gama,
    hospitably receives visiting monks, later stops providing some provisions, is
    wrongly expelled by them, travels to the Buddha for judgment, is declared innocent,
    and returns while the visiting monks become remorseful and decide to confess.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buddha is said to dwell at Campa on the brink of the lotus-pond Gaggara.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kassapa-gotta resides at Vasabha-gama in Kasi and is described as bound to
    that place by religious duties, working so that capable monks might come and the
    residence might prosper.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A group of travelling monks arrive at Vasabha-gama, and Kassapa-gotta prepares
    seats, water for washing their feet, a foot-stool, and a towel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kassapa-gotta meets the travelling monks, takes their bowls and robes, offers
    drinking water, and provides a bath, rice-milk, and hard and soft food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The travelling monks judge Kassapa-gotta to be good-natured and decide to
    stay at Vasabha-gama because of the provisions he gives them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After thinking that the travelling monks are rested and know their way, Kassapa-gotta
    stops providing rice-milk and hard and soft food for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The travelling monks interpret the stopped provisions as anger, assemble,
    accuse Kassapa-gotta of an offence, and ask whether he sees the offence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kassapa-gotta says there is no offence for him to see, and the travelling
    monks pronounce expulsion against him for refusing to see the alleged offence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kassapa-gotta is uncertain whether there is an offence and whether the expulsion
    is valid, so he travels to Campa to ask the Buddha.
  category: action
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:10
  text: The Buddha declares that Kassapa-gotta has committed no offence, is not guilty,
    has not been expelled, and that the expulsion sentence is unlawful, objectionable,
    and invalid.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kassapa-gotta accepts the Buddha’s instruction, respectfully salutes him,
    walks around him with his right side toward him, and returns to Vasabha-gama.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The travelling monks become remorseful, describe Kassapa-gotta as pure and
    guiltless, and decide to go to the Buddha to confess their sin.
  category: sequence
  evidence_refs:
  - ev:11
