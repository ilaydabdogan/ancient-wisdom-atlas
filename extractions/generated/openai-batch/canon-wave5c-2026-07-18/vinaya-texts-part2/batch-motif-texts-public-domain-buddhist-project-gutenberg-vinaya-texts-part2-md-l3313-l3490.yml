  text: Maha Moggallana presented the edible lotus stalks to Sariputta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sariputta ate the lotus stalks, his fever abated, and many stalks remained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One allowed a monk who had eaten and refused further offered food
    to eat things growing in woods and ponds even if they were not leftovers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Savatthi, fruit was plentiful, but the monks would not eat it because there
    was no one to make it allowable.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Blessed One allowed monks to eat fruit without seed, or no longer having
    seed, without someone present to make it allowable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Blessed One journeyed from Savatthi to Rajagaha and stayed at the Veluvana
    in the Kalandaka-nivapa.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A certain monk was suffering from a fistula, and the physician Akasa-gotta
    lanced it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Akasa-gotta invited the Blessed One to look at the monk's orifice and compared
    it to the mouth of an iguana; the Blessed One kept silence and turned away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Blessed One called a meeting of the Bhikkhu-sangha and asked whether there
    was a sick monk in that monastery and what his illness was.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Blessed One rebuked the monk for allowing a surgical operation in that
    part of the body, saying the skin was tender, the wound difficult to treat, and
    the knife difficult to guide.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Blessed One prohibited monks from allowing a surgical operation in that
    part of the body and assigned a thullaccaya offence for doing so.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the surgical operation had been forbidden, the Chabbaggiya Bhikkhus
    used a clyster; the Blessed One then prohibited operations within two inches around
    the anus and prohibited clysters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: At Benares, the layman Suppiya and laywoman Suppiya were described as devout
    supporters who gave, acted, and served the fraternity.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Suppiya the laywoman went from monastery to monastery and cell to cell asking
    which monks were sick and what she should procure for them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A sick monk who had taken a purgative asked Suppiya for broth, and she promised
    to procure it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Suppiya ordered a pupil to find meat; he searched through Benares but found
    none because cattle killing was interdicted that day.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Suppiya thought the sick monk's illness might increase or he might die if
    he did not get broth, and that it would be improper to fail after promising.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: Suppiya took a knife, cut a piece of flesh from her thigh, and gave it to
