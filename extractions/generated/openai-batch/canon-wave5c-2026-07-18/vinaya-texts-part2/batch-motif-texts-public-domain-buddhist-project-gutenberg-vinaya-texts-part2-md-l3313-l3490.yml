canonical_text:
  quote: ''
  summary: 'The passage recounts Maha Moggallana and a Naga moving between the Mandakini
    lake and Jetavana to obtain edible lotus stalks, which Sariputta eats and thereby
    has his fever abate. It then gives several Vinaya rule-origin episodes: allowances
    for certain foods and fruits, prohibitions concerning surgical treatment near
    the anus and clysters, and the beginning of a story in Benares where the laywoman
    Suppiya, unable to procure meat for broth promised to a sick monk, cuts flesh
    from her own thigh.'
  language: English
  quote_policy: summarized
