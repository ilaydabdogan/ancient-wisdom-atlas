- id: obs:1
  text: Maha Moggallana vanished from the bank of the Mandakini lake and appeared
    in Jetavana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naga also moved from the Mandakini lake to Jetavana and, after causing
    Maha Moggallana to receive edible lotus stalks, returned to the Mandakini lake.
  category: action
  evidence_refs:
  - ev:1
