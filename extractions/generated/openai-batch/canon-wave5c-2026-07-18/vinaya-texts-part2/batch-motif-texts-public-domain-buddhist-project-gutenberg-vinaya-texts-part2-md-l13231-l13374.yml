canonical_text:
  quote: ''
  summary: A monastic legal passage describes the Saṅgha proceeding after settlement,
    then has the venerable Upali ask the Blessed One whether concord may lawfully
    be re-established without inquiry or only after inquiry. The Blessed One says
    that concord declared without investigation is unlawful and only in the letter,
    while concord declared after inquiry is lawful and both in spirit and letter.
    Upali then respectfully asks in verse what kind of Bhikkhu is most wanted in communal
    affairs, consultations, business, and trials; the reply describes a morally blameless,
    learned, eloquent, humble, legally knowledgeable Bhikkhu as worthy of leadership.
  language: English
  quote_policy: summarized
