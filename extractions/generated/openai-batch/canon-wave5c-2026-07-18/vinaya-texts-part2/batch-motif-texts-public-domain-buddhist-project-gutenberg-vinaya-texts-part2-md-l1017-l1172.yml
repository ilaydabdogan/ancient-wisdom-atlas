canonical_text:
  quote: ''
  summary: The passage reports complaints about Bhikkhus' conduct with cattle, their
    use of cattle-drawn vehicles, the difficulty caused for a sick monk by a vehicle
    prohibition, and the Chabbaggiya Bhikkhus' use of luxurious reclining furnishings.
    The Blessed One responds by issuing prohibitions and by allowing transport exceptions
    for sick monks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People complain that Bhikkhus have acted improperly with heifers and calves,
    including touching animals and killing young calves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One prohibits catching heifers by horns, ears, dewlaps, or tails,
    mounting them, touching their privy parts with lustful thoughts, and killing calves,
    with offenses named for violations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chabbaggiya Bhikkhus are described as having themselves carried in vehicles
    yoked with cows and bulls in mixed arrangements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: People compare the mixed-yoked vehicle practice to what is done at the Feast
    of the Ganga and the Mahi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One tells the Bhikkhus not to have themselves carried in vehicles
    and states that doing so is a dukkaṭa offense.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sick Bhikkhu traveling through the Kosala country toward Savatthi sits down
    at the foot of a tree after leaving the road.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sick Bhikkhu refuses an offered cart because he fears offending against
    the vehicle prohibition.
  category: action
  evidence_refs:
  - ev:5
