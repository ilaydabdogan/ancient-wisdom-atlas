canonical_text:
  quote: ''
  summary: A merchant reports Vesali's prosperity through the courtesan Ambapali and
    persuades King Seniya Bimbisara to authorize a courtesan in Rajagaha. Salavati
    is installed, becomes pregnant, conceals the pregnancy, gives birth to a boy,
    and orders him abandoned in a basket on a dust-heap. Prince Abhaya finds the living
    infant near gathered crows, has him taken to the palace and nursed, and the child
    receives names connected with being alive and being fostered by a prince. Later
    Jivaka asks about his parents, decides to learn an art, goes to Takkasila, studies
    medicine for seven years, and is told by his teacher to search for any plant that
    is not medicinal.
  language: English
  quote_policy: summarized
