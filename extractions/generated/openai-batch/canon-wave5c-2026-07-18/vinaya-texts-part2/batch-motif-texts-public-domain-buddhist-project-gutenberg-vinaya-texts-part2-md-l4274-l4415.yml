canonical_text:
  quote: ''
  summary: After fragmentary notes on doctrinal terms, the passage recounts the Blessed
    One's statement about Pataliputta's future greatness and three dangers; the Magadha
    ministers Sunidha and Vassakara invite and feed him and the Bhikkhus; he recites
    stanzas about supporting upright persons and honoring deities; the ministers name
    a gate and ferry after Gotama; at the overflowing Ganges he and the Bhikkhus cross
    instantaneously while others seek rafts; he utters a saying contrasting wise crossing
    with basket rafts; at Kotigama he teaches that failure to grasp the four Noble
    Truths causes long wandering in transmigration.
  language: English translation with Pali/Sanskrit transliterated terms
  quote_policy: summarized
