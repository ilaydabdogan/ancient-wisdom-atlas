canonical_text:
  quote: ''
  summary: The venerable Sona departs from Maha Kaccayana and travels to Savatthi,
    where he salutes the Blessed One at Jetavana. The Blessed One instructs Ananda
    to prepare a sleeping-place for the newly arrived monk. Ananda infers that the
    Blessed One wishes to share the same Vihara with Sona and prepares the sleeping-place.
    After both the Blessed One and Sona spend most of the night in the open air and
    enter the Vihara, the Blessed One asks Sona to speak the Dhamma.
  language: English
