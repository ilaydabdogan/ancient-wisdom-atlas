canonical_text:
  quote: ''
  summary: The passage gives monastic rules concerning forbidden robe colors, entitlement
    to robe gifts after the rainy season, ownership of robe portions when monks leave,
    die, are suspended, or are disqualified, distribution when divisions arise in
    the Saṅgha, and a case in which Revata sends a robe to Sāriputta through another
    monk.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People object to monks wearing robes of certain uniform colors, and the Blessed
    One rules that such robes are not to be worn, with a dukkaṭa offence for wearing
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists cases in which monks who have spent the rainy season depart,
    leave the Order, die, declare changed status, become suspended, or are described
    as disqualified before a robe gift has fallen to the Saṅgha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a monk has spent the rainy season and goes away before a robe gift has
    fallen to the Saṅgha, his portion is still to be allotted if a suitable person
    is present to receive it on his behalf.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a monk leaves the Order, dies, becomes a novice, abandons the precepts,
    or becomes guilty of an extreme offence before the robe gift, the Saṅgha becomes
    owner of the robe portion that would have fallen to him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a monk is mad, mentally unhinged, in bodily pain, or suspended for specified
    refusals before the robe gift, his robe portion is still to be allotted if a suitable
    representative can receive it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a monk is identified with specified disqualifying statuses or grave offences,
    the Saṅgha becomes owner of the robe portion that would have fallen to him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same rules are stated to apply after a robe gift has been made to the
    Saṅgha but before division among individual members.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When divisions arise among the Saṅgha before robes have fallen to them, donors
    may give the water of presentation to one party and the robes to another or the
    same party while intending to give to the Saṅgha; in those cases the robes belong
    to the whole Saṅgha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If donors intend to give to only one party, the robes are the property of
    that party.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: If divisions arise after the robe gift has been made but before division,
    an equal share is to be given to all at the division.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Revata sends a robe to Sāriputta through another monk, but the intermediary
    takes the robe himself in trust on Revata; Sāriputta later says he knows nothing
    about that robe.
  category: sequence
  evidence_refs:
  - ev:7
