canonical_text:
  quote: ''
  summary: 'A Vinaya passage records practical allowances and restrictions for monks:
    sieves for chunam; raw flesh and blood in a case of a non-human disease; eye ointments,
    ointment boxes, lids, holders, cases, bags, and carrying straps; prohibitions
    on gold and silver ointment containers and sticks after public criticism; and
    a small amount of head oil for Pilindava/''/''/^a''s headache.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An allowance is made for a chunam sieve and, when very fine chunam is needed,
    for a cloth sieve.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A certain Bhikkhu with a disease described as not human is nursed by his teacher
    and superior without recovery; he then goes to a place where swine are slaughtered,
    eats raw flesh, drinks blood, and his sickness abates.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the case is reported, the Blessed One allows raw flesh and blood for
    a disease not human.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu with eye disease is carried out by other Bhikkhus to ease himself;
    the Blessed One sees this and asks about the disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Blessed One allows eye ointments, including black collyrium, rasa ointment,
    sota ointment, geruka, and kapalla, and also allows several perfumes for grinding
    into ointments.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Pulverised ointments placed in pots and saucers become sprinkled with herb-powders
    and dust, and an ointment box is allowed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The A'/zabbaggiya Bhikkhus carry gold and silver ointment boxes; people criticize
    them as like those still living in the world, and the Blessed One forbids such
    boxes while allowing boxes made of other listed materials.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Because ointment boxes lack lids, lids fall off, and boxes fall, the Blessed
    One allows lids, thread fastening, tying the lid to the box, and sewing boxes
    on with thread.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: When Bhikkhus rub ointment on with their fingers, their eyes are hurt, and
    the Blessed One allows a stick or holder for applying ointment.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The A'/zabbaggiya Bhikkhus keep gold and silver ointment-sticks; people again
    criticize them as worldly, and the Blessed One forbids such holders while allowing
    holders made of other listed materials.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: When ointment-sticks fall and become rough, and when Bhikkhus carry ointment
    boxes and sticks in their hands, the Blessed One allows a case, a bag, and a shoulder
    strap or thread.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: The venerable Pilindava/'/'/^a has a headache; the Blessed One allows a little
    oil on the head, but the disease becomes no better.
  category: sequence
  evidence_refs:
  - ev:13
