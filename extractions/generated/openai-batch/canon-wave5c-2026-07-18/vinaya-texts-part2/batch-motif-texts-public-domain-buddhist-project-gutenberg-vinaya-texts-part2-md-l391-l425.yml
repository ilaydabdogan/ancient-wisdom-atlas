canonical_text:
  quote: ''
  summary: 'The venerable So;^a visits the Blessed One, bows, sits to one side, and
    speaks. He describes a Bhikkhu who is an Arahat as one whose Asavas are rooted
    out, whose task is accomplished, whose burden is laid aside, whose fetter of craving
    for future existence is broken, and who is set free by insight. He says such an
    Arahat reaches six things: renunciation, love of solitude, kindness of heart,
    destruction of craving, destruction of thirst, and freedom from delusions. The
    next paragraph introduces a possible thought about attainment being for the sake
    of faith merely, with editorial notes on Pali terms and parallel textual patterns.'
  language: English with Pali terms
  quote_policy: summarized
