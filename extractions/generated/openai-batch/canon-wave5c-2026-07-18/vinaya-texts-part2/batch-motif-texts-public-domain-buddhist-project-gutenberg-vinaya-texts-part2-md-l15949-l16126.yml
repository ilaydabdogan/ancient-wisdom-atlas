canonical_text:
  quote: ''
  summary: 'The passage gives procedural rules for monastic discipline: Udayi commits
    a first Saṅghadisesa offence, either unconcealed or concealed for one day; the
    Buddha directs the Saṅgha to impose Manatta, probation, and later rehabilitation
    through formal petitions, repeated speeches, motions, and approval by silence.
    Introductory notes also state that some chapters repeat earlier chapters with
    substitutions.'
