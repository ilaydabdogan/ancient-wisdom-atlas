canonical_text:
  quote: ''
  summary: The passage lists the proper conduct required of a Bhikkhu under an Ukkhepaniya-kamma
    for not acknowledging a fault, including loss of communal privileges and restrictions
    on association. It then narrates the case of a named Bhikkhu subjected to this
    action, his movement among residences where hospitality is withheld, his return
    to Kosambi, his compliance and request for release, and the Blessed One's instruction
    that the Saṅgha revoke the disciplinary action.
  language: English translation with Pali terms
