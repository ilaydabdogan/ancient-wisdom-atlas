canonical_text:
  quote: ''
  summary: At Savatthi in Jetavana, about thirty Paṭheyyaka Bhikkhus who live austerely
    are traveling to visit the Blessed One but cannot arrive before the Vassa period,
    so they remain at Saketa. After three months and the Pavāraṇā, they travel through
    rain, gathering waters, and swamps; their robes are drenched and they are weary.
    They salute the Blessed One, who greets them, asks about their welfare and concord
    during Vassa, hears their report, gives a religious discourse, and prescribes
    the Kathina ceremony.
  language: English translation with Pali terms
  quote_policy: summarized
