canonical_text:
  quote: ''
  summary: A king restored to health offers Jivaka a boon and sends him an exceptional
    suit of Siveyyaka cloth. Jivaka considers only the Blessed One or King Bimbisara
    worthy of the cloth. The Blessed One becomes physically ill and asks for a purgative.
    Ananda consults Jivaka, who first advises rubbing the Blessed One with fat, then
    administers a mild purgative through drug-infused blue lotuses. Jivaka calculates
    that a bath will complete the treatment; the Blessed One knows this private thought
    and orders warm water. After bathing, the Blessed One is fully purged and later
    restored. Jivaka then brings the cloth to the Blessed One and asks for a boon,
    which the Blessed One asks him to state first.
  language: English
  quote_policy: summarized
