canonical_text:
  quote: ''
  summary: An elderly Bhikkhu directs his sons to collect ingredients from householders
    so that congey can be prepared for the arriving Blessed One and his company. After
    the congey is offered, the Blessed One asks its source, rebukes the act as unlawful
    instigation, and institutes disciplinary rules. The passage then records further
    rulings about fruit as food, seedlings growing across Saṅgha and private property
    boundaries, and a general criterion for deciding what is lawful when something
    has not been explicitly disallowed.
  language: English
  quote_policy: summarized
