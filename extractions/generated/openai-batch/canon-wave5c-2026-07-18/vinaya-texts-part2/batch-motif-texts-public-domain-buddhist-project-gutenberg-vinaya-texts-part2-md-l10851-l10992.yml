canonical_text:
  quote: ''
  summary: A group of Bhikkhus travels to the Blessed One and admits that they expelled
    a resident Bhikkhu without cause. The Blessed One rebukes them, prohibits such
    expulsion, and identifies it as an offence. The Bhikkhus confess and promise restraint;
    the Blessed One accepts the confession and states that progress in discipline
    involves recognizing wrongdoing, making amends, and refraining thereafter. The
    passage then describes improper official acts by the Bhikkhus of A'ampa/T^ampa,
    complaints by moderate Bhikkhus, and the Blessed One's ruling that unlawfully
    performed or procedurally defective official acts are invalid and should not be
    performed.
  language: English
  quote_policy: summarized
