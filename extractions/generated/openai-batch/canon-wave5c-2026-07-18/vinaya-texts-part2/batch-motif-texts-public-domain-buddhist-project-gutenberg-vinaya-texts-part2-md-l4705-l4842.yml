canonical_text:
  quote: ''
  summary: The Blessed One explains to Siha in what sense he teaches action, annihilation,
    contemptibleness, Vinaya, Tapas, freedom from return to the womb and rebirth,
    and confidence. Siha asks to take refuge, is urged to consider carefully, contrasts
    this caution with other teachers, and repeats his refuge. The Blessed One then
    advises Siha to continue giving food to the Niganthas, which Siha says increases
    his faith because it contradicts reports of exclusive gift-seeking.
  language: English
  quote_policy: summarized
