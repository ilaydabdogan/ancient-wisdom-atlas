canonical_text:
  quote: ''
  summary: Ro^a the Malla visits the Blessed One, receives progressive instruction
    and the teaching of suffering, its cause, cessation, and the path, and gains the
    eye of truth. He asks to be sole provider of requisites for the Order, but the
    Blessed One permits receipt from him and from others. Ro^a later supplies missing
    potherbs and meal through Ananda's mediation; the Bhikkhus hesitate, and the Blessed
    One authorizes them to accept and use such food. The passage then begins a new
    episode in which the Blessed One travels from Kusinara to Atuma with two hundred
    and fifty Bhikkhus, where an elderly former barber and his two skilled sons are
    introduced.
  language: English
  quote_policy: summarized
