canonical_text:
  quote: ''
  summary: 'The passage lists Vinaya cases concerning Bhikkhus after the Kathina ceremony:
    leaving a district, crossing a boundary, seeking or expecting robe gifts, deciding
    whether to return, having robes made, hearing news of suspension, and the resulting
    grounds on which Kathina privileges are suspended. It also begins a case of a
    traveling Bhikkhu guarding his claim to a share in robes and being questioned
    by other Bhikkhus about his Vassa residence and robe share.'
  language: English
  quote_policy: summarized
