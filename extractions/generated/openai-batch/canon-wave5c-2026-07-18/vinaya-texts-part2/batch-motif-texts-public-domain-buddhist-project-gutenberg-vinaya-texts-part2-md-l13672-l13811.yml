    one failed in conduct regarding transgression, and one failed in opinion regarding
    principal matters of opinion.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another stated set of three censurable Bhikkhus includes one who speaks in
    dispraise of the Buddha, one who speaks in dispraise of the Dhamma, and one who
    speaks in dispraise of the Saṅgha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Bhikkhu against whom Ta^^aniya-kamma has been carried out is said to have
