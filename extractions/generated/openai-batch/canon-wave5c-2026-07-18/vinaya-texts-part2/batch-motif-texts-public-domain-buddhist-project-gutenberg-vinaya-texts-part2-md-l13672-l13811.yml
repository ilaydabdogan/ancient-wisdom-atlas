canonical_text:
  quote: ''
  summary: The passage lists classes of Bhikkhus against whom the Saṅgha may carry
    out Ta^^aniya-kamma, including makers of strife, morally or doctrinally failed
    monks, and those who disparage the Buddha, Dhamma, or Saṅgha. It then gives duties
    and restrictions for a Bhikkhu under this action. Finally, it narrates that the
    Saṅgha carried out the action against followers of Paṇḍuka and Lohitaka; after
    they conducted themselves properly, became subdued, and sought release, the matter
    was reported to the Blessed One, who instructed that the action be revoked.
  language: English
  quote_policy: summarized
