canonical_text:
  quote: ''
  summary: The Blessed One gladdens a Brahma by stanzas, leaves, and later addresses
    the Bhikkhus after a religious discourse, allowing them to partake of rice-milk
    and honey-lumps. People hear of this allowance and prepare solid rice-milk and
    honey-lumps early in the morning. A note explains the term for edible rice-milk
    or rice pudding made with milk.
