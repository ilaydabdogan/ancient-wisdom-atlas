canonical_text:
  quote: ''
  summary: A newly converted minister invites the Buddha and 1,250 Bhikkhus and prepares
    a large meal with meat dishes. The Bhikkhus eat little because they had already
    eaten rice-milk and honey-lumps elsewhere, angering the minister. After serving
    them angrily, he feels remorse and asks the Buddha whether he has made merit or
    demerit. The Buddha tells him that his invitation and offerings produced much
    merit and gained him the inheritance of heaven. The Buddha then rebukes the Bhikkhus
    and lays down a rule against eating rice-milk elsewhere after being invited. A
    following episode begins with the Buddha traveling with 1,250 Bhikkhus and meeting
    Bela///^a Ka/^/'ana, who has carts full of sugar and wishes to give each Bhikkhu
    a pot of sugar.
  language: English translation
  quote_policy: summarized
