canonical_text:
  quote: and until she rose up it was not exhausted.
  summary: The passage describes demonstrations of inexhaustible food, money, and
    rice by members of Mendaka the householder's household before a minister and fourfold
    host; the minister reports the matter to King Bimbisara. The Blessed One travels
    to Bhaddiya with many Bhikkhus. Mendaka hears his reputation, visits despite criticism
    from Titthiyas, hears preaching, takes refuge, invites the Buddha and Bhikkhu
    community for a meal, and later his household also visits, hears preaching, and
    takes refuge. Mendaka serves the community and promises daily food while the Blessed
    One remains at Bhaddiya.
  language: English
  quote_policy: quoted
