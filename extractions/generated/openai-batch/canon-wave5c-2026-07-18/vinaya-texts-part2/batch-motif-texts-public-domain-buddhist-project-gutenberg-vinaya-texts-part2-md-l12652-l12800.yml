canonical_text:
  quote: ''
  summary: The passage gives stanzas on appeasing hatred through not-hatred, restraint,
    conciliation, wise companionship, and solitary practice when no wise companion
    is found. The Blessed One then visits Bhagu, receives hospitality, teaches him,
    and travels to the Eastern Bambu Park, where Anuruddha, Nandiya, and Kimbila welcome
    him. The Blessed One asks whether they live in concord, without quarrels, like
    milk and water mixed together, and they affirm that they do.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stanzas say that people who nurse thoughts of being reviled, beaten, oppressed,
    or robbed do not have their hatred appeased.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stanzas say that people who do not nurse such thoughts have their hatred
    appeased, and that hatred is appeased by not-hatred rather than by hatred.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stanzas say that those who know they must keep themselves under restraint
    have their quarrels appeased.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stanzas say that even people whose bones are broken, who destroy lives,
    rob cattle and treasures, or plunder realms may find conciliation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stanzas say that a person who finds a wise, righteous, constant companion
    may walk with that companion, overcoming dangers, happy and mindful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stanzas say that if no wise companion is found, a person should walk alone,
    with similes of a king leaving a conquered realm and an elephant in the elephant
    forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: After pronouncing the stanzas in the assembly, the Blessed One goes to Balakaloṇakara-gama,
    where Bhagu is dwelling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bhagu sees the Blessed One approaching, prepares a seat, brings water for
    washing feet, a foot-stool, and a towel, meets him, and takes his bowl and robe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Blessed One sits, washes his feet, and asks Bhagu whether all is well,
    whether he finds his living, and whether he obtains food without too much trouble;
    Bhagu answers affirmatively.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Blessed One teaches, incites, animates, and gladdens Bhagu by religious
    discourse, then goes to the Eastern Bambu Park.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the Eastern Bambu Park, a park-keeper tells the Blessed One not to enter
    because three noble youths accustomed to comfort and ease dwell there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Anuruddha tells the park-keeper not to keep off the Blessed One and announces
    to Nandiya and Kimbila that their teacher has arrived.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Anuruddha, Nandiya, and Kimbila go to meet the Blessed One; one takes his
    bowl and robe, one prepares a seat, and one brings water, a foot-stool, and a
    towel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Blessed One asks Anuruddha whether the three live in unity and concord,
    without quarrels, like milk and water mixed together, looking at each other with
    friendly eyes; Anuruddha answers that they do.
  category: speech
  evidence_refs:
  - ev:7
