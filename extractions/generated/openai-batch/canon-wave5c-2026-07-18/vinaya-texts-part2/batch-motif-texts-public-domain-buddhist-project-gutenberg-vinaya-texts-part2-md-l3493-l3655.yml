canonical_text:
  quote: ''
  summary: A laywoman named Suppiya gives her own flesh as meat for a sick monk, hides
    her wound, and is later brought before the Buddha, whose sight heals the wound.
    The Buddha praises the existence of pious donors but rebukes the monk for eating
    without inquiry and prohibits eating human flesh and unidentified meat. Further
    rules prohibit monks from eating elephants' flesh after public criticism during
    a famine; the next case begins with horses' flesh.
  language: English
  quote_policy: summarized
