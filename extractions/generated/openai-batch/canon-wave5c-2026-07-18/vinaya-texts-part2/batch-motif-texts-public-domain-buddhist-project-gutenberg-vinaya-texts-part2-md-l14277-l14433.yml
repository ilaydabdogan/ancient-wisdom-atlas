canonical_text:
  quote: ''
  summary: 'The passage gives a Vinaya disciplinary procedure: the Buddha instructs
    Sariputta and Moggallana to go to Ki/?a Hill with other monks and carry out the
    Pabbajaniya-kamma, an act of banishment from that place, against followers of
    Assa^i and Punabbasu. It then states the formal steps of warning, reminding, charging,
    presenting a motion before the Saṅgha, repeating the motion, and approving by
    silence, followed by categories of conduct for which the act may be carried out.'
  language: English translation with Pali technical terms
  quote_policy: summarized
