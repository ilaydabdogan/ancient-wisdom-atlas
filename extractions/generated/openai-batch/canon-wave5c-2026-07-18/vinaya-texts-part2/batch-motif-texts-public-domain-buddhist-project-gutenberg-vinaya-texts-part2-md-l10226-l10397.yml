canonical_text:
  quote: ''
  summary: The passage gives monastic rules for assigning the robes, bowl, and other
    property of a monk or novice who has died, especially to those who cared for the
    sick. It also records prohibitions against nakedness and certain ascetic garments
    identified with Titthiyas, followed by notices about improper robe colors, shapes,
    decorations, and accessories worn by the Chabbaggiya monks.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk who waited upon the sick is instructed to report to the Saṅgha that
    a monk has completed his time and that his robes and bowl are present; a formal
    motion assigns those items to those who cared for the sick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a certain Sāmaṇera completed his time, the decision and formal act are
    said to be the same as in the preceding case.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Bhikkhu and a Sāmaṇera cared for a sick Bhikkhu until he completed his time,
    and the Blessed One prescribed that a Sāmaṇera who waits upon the sick receive
    an equal portion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a wealthy Bhikkhu died, the Blessed One stated that the Saṅgha becomes
    owner of his bowl and robes, assigns the robes and bowl to the sick-attendants,
    divides small property among the Saṅgha present, and leaves large property to
    the Saṅgha of the four directions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A certain Bhikkhu came naked to the Blessed One and argued that nakedness
    promoted moderation, contentment, eradication of evil, suppression of passions,
    graciousness, reverence, and zeal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed Buddha rebuked the naked Bhikkhu and prohibited Bhikkhus from
    adopting nakedness as the Titthiyas do, assigning a grave offence to anyone who
    does so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same prohibition formula is applied to garments of grass, bark, phalaka
    cloth, hair, wild animal skin, owl feathers, and antelope skins with the hoofs
    left on; these are described as symbols used by the Titthiyas.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Bhikkhu wearing cloth made of akka plant stalks is rebuked, and Bhikkhus
    are prohibited from dressing in akka stalks; the same rule is repeated for cloth
    made of makaci fibre.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Chabbaggiya Bhikkhus are said to have worn robes entirely in several colors,
    robes with various kinds of skirts or decorations including flowers and cobra
    hoods, jackets, dresses of the Tiriṭaka plant, and turbans.
  category: object
  evidence_refs:
  - ev:9
