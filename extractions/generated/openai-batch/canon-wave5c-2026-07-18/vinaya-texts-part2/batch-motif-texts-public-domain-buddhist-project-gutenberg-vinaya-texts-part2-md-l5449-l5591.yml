canonical_text:
  quote: ''
  summary: The passage contains an editorial note on named rishis, then a Vinaya narrative
    in which Keniya the ascetic prepares and offers drinkables to the Blessed One
    and the Bhikkhu community. The Blessed One instructs the Bhikkhus to receive the
    drinks, gives Keniya religious discourse, and later silently accepts Keniya’s
    repeated invitation to a meal. The Blessed One then authorizes specified drinkables
    for the Bhikkhus. Keniya prepares sweet hard and soft food at his hermitage, and
    the Blessed One and the Bhikkhus come, sit, and are served.
