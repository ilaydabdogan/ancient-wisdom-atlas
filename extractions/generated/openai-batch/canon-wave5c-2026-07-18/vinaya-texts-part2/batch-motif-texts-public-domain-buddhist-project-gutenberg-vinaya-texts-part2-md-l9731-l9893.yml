canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya rulings about robes: robes may be given to parents
    without voiding a gift of faith; a monk whose robe was stolen after he entered
    a village wearing only waist cloth and nether garment prompts a prohibition; Ananda
    repeats the act through thoughtlessness; allowed reasons are listed for laying
    aside garments; and rules are given for robes offered to a solitary monk during
    Vassa when donors intend them for the Sangha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One allows Bhikkhus to give robes to their parents and states
    that a gift of faith is not to be made of no avail.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A certain Bhikkhu deposits his robe in Andhavana and enters the village for
    alms wearing only his waist cloth and nether garment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thieves carry off the deposited robe, and the Bhikkhu becomes ragged and ill-clad.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the matter is reported, the Blessed One prohibits entering the village
    dressed only in waist cloth and nether garment and assigns a dukkaṭa offence for
    doing so.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The venerable Ananda enters the village for alms in waist cloth and nether
    garment through thoughtlessness and acknowledges this when questioned by other
    Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Five reasons are given for laying aside the robe: sickness, the appointed
    rainy-season time, needing to cross a river, a vihara securely fastened with a
    bolt, and performance of the Kathina ceremony.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The same five reasons are applied to laying aside the waist cloth and the
    nether garment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Five reasons are given for laying aside the rainy-season garment: sickness,
    needing to go beyond the boundary, needing to cross a river, a bolted vihara,
    and the rainy-season garment being not made or unfinished.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Bhikkhu who keeps Vassa alone receives robes from people who say they give
    them to the Sangha; he reasons that the lowest number for a Sangha is four and
    considers taking the robes to Savatthi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Blessed One states that the robes are the solitary Bhikkhu's own until
    the Kathina ceremony has been performed and prescribes this as the rule for such
    cases.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
