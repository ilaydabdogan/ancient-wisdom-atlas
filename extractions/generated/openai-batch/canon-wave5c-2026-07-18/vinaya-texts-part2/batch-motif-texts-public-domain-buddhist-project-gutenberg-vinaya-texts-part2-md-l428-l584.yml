canonical_text:
  quote: ''
  summary: The passage describes a fully emancipated Bhikkhu whose mind is not possessed
    by sensory objects and is compared to an unshaken rock or mountain. The Blessed
    One comments on proper disclosure of insight, then permits Soṇa and the Order
    to use shoes with one lining while forbidding shoes with multiple linings. The
    passage ends with people objecting to the Chabbaggiya Bhikkhus wearing slippers
    of single bright colors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu in whom the Asavas are rooted out is said not to regard himself
    as having further work to do, and to attain renunciation, solitude, kindness of
    heart, and the destruction of craving through the destruction or absence of lust,
    ill-will, and delusions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speech rejects possible suspicions that such attainments arise from seeking
    gain, hospitality, fame, or dependence on works.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a Bhikkhu is fully emancipated in heart, visible, audible, smellable,
    tastable, tangible, and mental objects may enter the sense paths but do not take
    possession of his mind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The emancipated Bhikkhu's mind is described as undefiled, firm, immovable,
    and able to see how impressions pass away.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A mountain of solid rock is used as a simile: wind and rain from the four
    directions do not make it shake, tremble, or quake.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rock simile is applied to the fully emancipated Bhikkhu, whom shapes,
    tastes, sounds, smells, touch, and wished or unwished things cannot make tremble.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Blessed One says that young men of worth make their insight known by speaking
