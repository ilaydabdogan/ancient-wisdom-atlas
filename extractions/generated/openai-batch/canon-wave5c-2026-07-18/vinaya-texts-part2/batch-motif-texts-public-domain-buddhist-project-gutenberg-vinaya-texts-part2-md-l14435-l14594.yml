- id: obs:2
  text: The Bhikkhu-Sangha, with Sariputta and Moggallana at its head, goes to Ki/a
    Hill and carries out the Pabbajaniya-kamma against Bhikkhus who are followers
    of Assa^i and Punabbasu.
