canonical_text:
  quote: ''
  summary: The passage first lists further kinds of Bhikkhus characterized by wrong
    conduct. It then describes the Bhikkhu-Sangha, led by Sariputta and Moggallana,
    performing the Pabbajaniya-kamma against followers of Assa^i and Punabbasu at
    Ki/a Hill. Those monks reject discipline, revile the Sangha, depart, and leave
    the Order. Moderate monks report this to the Blessed One, who convenes the Sangha,
    confirms the report, rebukes the conduct, and instructs that the Pabbajaniya-kamma
    not be revoked except according to procedure. A later section introduces the Patisaraniya-kamma,
    the Act of Reconciliation, by narrating Sudhamma’s relationship with A'itta the
    householder, the arrival of elder monks at Ma////ikasanda, Sariputta’s religious
    discourse to A'itta, and A'itta’s meal invitation, accepted by the Theras in silence.
  language: English
  quote_policy: summarized
