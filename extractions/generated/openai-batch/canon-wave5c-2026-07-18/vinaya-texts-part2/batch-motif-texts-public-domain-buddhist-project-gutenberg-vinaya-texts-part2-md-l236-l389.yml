canonical_text:
  quote: be steadfast in evenness of determination
  summary: Sona injures his feet through strenuous walking meditation and considers
    returning to lay life and wealth. The Blessed One perceives this thought, appears
    at the Sitavana grove, questions Sona about lute strings, and teaches that effort
    should be neither too tight nor too loose. Sona follows the instruction, attains
    Arahatship, and thinks of declaring his insight before the Blessed One.
  language: English
  quote_policy: quoted
