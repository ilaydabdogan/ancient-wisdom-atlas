canonical_text:
  quote: ''
  summary: A donor named in OCR-corrupted form as Bela///a Ka... offers sugar. The
    Blessed One instructs him to distribute it to Bhikkhus and then to people who
    eat the remains of the Bhikkhus' food. Remaining sugar is ordered to be thrown
    away on grass-free ground or sunk in lifeless water; when sunk it hisses, bubbles,
    steams, and smokes. The frightened donor approaches the Blessed One, hears a graduated
    teaching and the doctrine of suffering, its cause, cessation, and path, obtains
    the Eye of Truth, and takes refuge. A later rule allows sugar for the sick and
    sugar-water for the healthy, before the Blessed One travels to Pataligama with
    many Bhikkhus.
  language: English translation with OCR-corrupted Indic names
  quote_policy: summarized
