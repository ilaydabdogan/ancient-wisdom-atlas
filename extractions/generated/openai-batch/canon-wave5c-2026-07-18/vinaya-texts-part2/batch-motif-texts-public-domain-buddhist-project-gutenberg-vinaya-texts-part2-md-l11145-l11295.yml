canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya regulations for lawful communal acts: correct
    order of proposal and formal recitation, required presence of qualified voting
    Bhikkhus, conveyed consent, absence of protest, quorum sizes for different official
    acts, invalidity when certain ineligible persons fill quorum positions, and distinction
    between ineffectual and effectual protests in the assembly.'
  language: English translation with Pali technical terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lawful act by a complete congregation requires the proposal to be made first,
    the act to be performed afterward with the required formal recitation or recitations,
    enough entitled voting Bhikkhus present, conveyed consent from those who must
    declare it, and no protest from the present Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes a ñattidutiya act using one kammavācā from a ñatticatuttha
    act using three kammavācās.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Five sizes of Bhikkhu Saṅgha are listed: four persons, five persons, ten
    persons, twenty persons, and more than twenty persons.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lawful and complete four-person Bhikkhu Saṅgha may perform official acts
    except upasampadā ordination, pavāraṇā, and abbhāna.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A lawful and complete five-person Saṅgha, ten-person Saṅgha, twenty-person
    Saṅgha, and Saṅgha of more than twenty persons each has different stated entitlement
    to perform official acts, with fewer exceptions as the quorum increases.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: An official act requiring four, five, ten, or twenty persons is said to be
    no real act and not to be performed if an ineligible category of person occupies
    the required numbered place in the congregation.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A person poised in the air by supernatural power is listed among persons who
    cannot validly serve as the fourth member for an act requiring four persons.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A congregation including certain persons under, or due for, parivāsa, mūlāya
    paṭikassanā, mānatta, or abbhāna-related discipline cannot validly institute the
    relevant proceedings or confer abbhāna when such a person fills the specified
    quorum place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The protest raised in the assembly by listed ineligible categories, including
    a Bhikkhunī and a sikkhamānā, is declared ineffectual.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The protest of a healthy Bhikkhu who belongs to the same communion and stays
    within the same boundary is introduced as effectual in the supplied passage.
  category: speech
  evidence_refs:
  - ev:7
