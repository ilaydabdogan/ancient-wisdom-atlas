canonical_text:
  quote: ''
  summary: Sagata announces the arrival of eighty thousand overseers, prepares a shaded
    seat for the Blessed One, and displays superhuman aerial wonders at the Blessed
    One's request. After Sagata declares the Blessed One his teacher, the overseers
    shift their reverence to the Blessed One. The Blessed One teaches them in sequence
    and they attain the Eye of Truth, praise the teaching, and take refuge. Sona Ko/ivisa
    then seeks and receives ordination into the houseless life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sagata disappears from before the overseers, appears before the Blessed One,
    and reports that the overseers have come to visit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One tells Sagata to prepare a seat in the shade of the house;
    Sagata takes a chair, reappears before the overseers, and prepares the seat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One comes out of the house and sits on the prepared shaded seat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The eighty thousand overseers bow before the Blessed One, sit to one side,
    but inwardly give more respect to Sagata than to the Blessed One.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One perceives the overseers' thoughts and asks Sagata to show
    them a greater wonder beyond human power.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Sagata rises into the air, walks, stands, sits, lies down, emits smoke and
    fire, and disappears in the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After showing various wonders in the open sky, Sagata falls with his head
    at the Blessed One's feet and says that the Blessed One is his teacher and he
    is the disciple.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The overseers reason that if the pupil is powerful, the master must be greater,
    and they give more inward respect to the Blessed One than to Sagata.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Blessed One gives an ordered discourse on giving, righteousness, heaven,
    the dangers of lusts, the advantages of renunciation, and then the doctrine of
    suffering, its origin, cessation, and the path.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The overseers obtain the pure and spotless Eye of the Truth while sitting
    there; the passage compares their receptivity to a clean cloth taking dye.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The overseers praise the teaching with images of setting upright what was
    overturned, revealing what was hidden, showing a way to the lost, and bringing
    a lamp into darkness; they take refuge in the Blessed One, the Dhamma, and the
    fraternity of Bhikkhus.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: So;/a Ko/ivisa thinks that lay life is not easy for a wholly pure life of
    holiness and considers cutting off hair and beard, putting on yellow robes, giving
    up the world, and going forth into the houseless state.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: So;/a Ko/ivisa requests ordination from the Blessed One, receives the pabbajja
    and upasampada ordinations, and then dwells in the Sîtavana grove.
  category: action
  evidence_refs:
  - ev:9
