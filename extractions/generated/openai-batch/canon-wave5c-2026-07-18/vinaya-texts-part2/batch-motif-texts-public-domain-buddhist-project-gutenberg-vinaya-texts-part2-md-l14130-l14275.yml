    at Ki/a Hill, the rejection of a dignified visiting Bhikkhu by local people, a
    lay-disciple’s hospitality and petition for the residence to be restored, the
    visiting Bhikkhu’s report to the Blessed One at Savatthi, and the Blessed One’s
    assembly inquiry and rebuke.
