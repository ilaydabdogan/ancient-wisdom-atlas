canonical_text:
  quote: ''
  summary: The passage gives disciplinary procedures for Bhikkhus who have committed
    and concealed Saṅghadisesa offences. Udayi is repeatedly subjected to Manatta,
    inclusive probation, return to the beginning of probation, and eventual rehabilitation.
    Further anonymous cases specify how probation is calculated when multiple offences
    have been concealed for different periods, including a case involving two offences
    concealed for two months.
  language: English
  quote_policy: summarized
