  summary: The Blessed One rebukes Bhikkhus about footwear and respect toward teachers
    and superiors, establishes offenses for improper wearing of shoes, and permits
    foot coverings or other aids in specific practical situations involving illness,
    soiled seats, darkness, thorns, and walking to an assembly. The passage ends with
    Chabbaggiya Bhikkhus walking in wooden shoes at dawn while speaking loudly about
    worldly topics.
