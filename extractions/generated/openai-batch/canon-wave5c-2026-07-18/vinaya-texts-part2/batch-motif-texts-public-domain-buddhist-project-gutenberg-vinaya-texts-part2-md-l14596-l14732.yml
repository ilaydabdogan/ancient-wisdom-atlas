canonical_text:
  quote: ''
  summary: A'itta the householder invites the venerable Sudhamma to a meal with the
    Thera Bhikkhus, but Sudhamma refuses after perceiving a slight. At the prepared
    meal Sudhamma criticizes the absence of tila seed cake, and A'itta responds with
    a hen-crow-chicken parable. Sudhamma says he has been abused and decides to leave
    for Savatthi to report to the Blessed One. The Buddha rebukes Sudhamma for censuring
    a faithful donor and instructs the Saṃgha to perform an Act of Reconciliation
    requiring Sudhamma to obtain the householder's pardon.
  language: English
  quote_policy: summarized
