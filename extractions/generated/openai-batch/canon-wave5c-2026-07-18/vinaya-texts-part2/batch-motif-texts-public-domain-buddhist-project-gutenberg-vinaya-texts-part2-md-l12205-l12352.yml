canonical_text:
  quote: ''
  summary: A Brahmin chaplain recognizes the queen-consort of Dighiti of Kosala as
    carrying a future Kosala king and arranges, through King Brahmadatta of Kasi,
    a martial sight and sword-washing water for her. She gives birth to Dighavu, who
    is sent outside the town for safety and learns the arts. Dighiti and his queen,
    living in disguise near Benares, are betrayed by Dighiti's former barber. Brahmadatta
    orders their public humiliation and execution. Dighavu sees his parents being
    paraded, and Dighiti gives him a cryptic instruction ending with the teaching
    that hatred is appeased by non-hatred. The parents are taken out by the southern
    gate, quartered, and their pieces scattered to the four quarters.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmin domestic chaplain sees the queen-consort approaching, rises, adjusts
    his robe to cover one shoulder, raises joined hands to her, and three times declares
    that a Kosala king dwells in her womb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmin tells the queen not to despond and says she will see, at sunrise,
    a four-host army in armour on auspicious ground and will drink water in which
    swords are washed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmin tells King Brahmadatta that signs require the next morning's army
    array and sword-washing, and Brahmadatta orders his attendants to do what the
    chaplain says.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The queen obtains the promised sight and sword-washing water, later gives
    birth to a boy, and the boy is named Dighavu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: King Dighiti fears that Brahmadatta will kill him, his consort, and Dighavu
    if they are found, so he causes Dighavu to live outside the town, where Dighavu
    learns all arts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dighiti and his consort live near Benares in a potter's dwelling, disguised
    as wandering ascetics.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Dighiti's former barber sees the disguised royal couple and reports their
    location to King Brahmadatta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Brahmadatta orders Dighiti and his consort to be brought before him, bound
    with strong ropes, shaven, paraded with drumbeats, led out by the southern gate,
    cut into four pieces, and thrown to the four quarters.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dighavu enters Benares and sees his parents bound, with arms tied behind their
    backs, shaven, and being led around with loud drumbeats.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Dighiti tells Dighavu not to look long or short and says that hatred is not
    appeased by hatred but by not-hatred.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The people hear Dighiti's words, call him mad, and he replies that the clever
    will understand.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the procession, the people take Dighiti and his consort south of the
    town, cut them into four pieces, throw the pieces to the four quarters, station
    soldiers there, and leave.
  category: sequence
  evidence_refs:
  - ev:10
