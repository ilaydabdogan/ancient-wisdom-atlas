canonical_text:
  quote: ''
  summary: The passage gives rules for when a Kathina ceremony is duly held and when
    Kathina privileges are suspended. It states that the official distributor must
    be a single person, lists conditions for robe materials and ritual completion,
    requires ratification by the whole Sawgha dwelling within the boundary, lists
    eight grounds for suspension of privileges, and gives case examples involving
    a Bhikkhu taking a robe, leaving, crossing the boundary, deciding whether to return
    or finish the robe, a robe being spoiled, and news of district-wide suspension
    being heard.
  language: English translation with Pali transliteration notes
  quote_policy: summarized
