canonical_text:
  quote: ''
  summary: 'Opening of Mahavagga V: the Blessed Buddha dwells at Vulture''s Peak near
    Ra^aoraha. King Seniya Bimbisara of Magadha rules eighty thousand townships and
    summons So;^a Ko/ivisa, a delicately nurtured se///^i''s son from Aampa whose
    feet have hair on their soles. So;^a''s parents instruct him how to sit before
    the king so his feet can be seen; he is carried in a palankeen, bows before the
    king, and sits cross-legged. After instructing the eighty thousand overseers in
    worldly matters, Bimbisara sends them to the Blessed One for instruction in eternal
    matters. The overseers go to Vulture''s Peak and ask the attendant Sagata for
    an audience; Sagata tells them to wait while he informs the Blessed One.'
  language: English
  quote_policy: summarized
