  quote: ''
  summary: In the Sixth Khandhaka on medicaments, the Blessed One observes that monks
    are ill from a hot-season sickness and consults Ananda. After meditating, he prescribes
    five medicaments, later broadens their permitted use, and gives rules for animal
    fats, medicinal roots, grinding tools, and astringent decoctions for sick Bhikkhus.
