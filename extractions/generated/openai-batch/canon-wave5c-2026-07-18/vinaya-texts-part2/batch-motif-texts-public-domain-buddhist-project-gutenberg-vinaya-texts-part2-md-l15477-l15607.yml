- id: obs:1
  text: The passage is set while the Blessed Buddha is staying at Savatthi in the
    Jetavana, Anathapindika's Grove.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhikkhus placed on probation were accepting reverence, service, salutation,
    respect, seats, sleeping-places, water for the feet, foot-stools, foot-towels,
    carrying of bowl or robe, and shampooing from regular Bhikkhus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moderate Bhikkhus were annoyed, murmured, became indignant, and questioned
    how probationary Bhikkhus could accept such treatment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The matter was reported to the Blessed One, who convened a meeting of the
    Bhikkhu-saṅgha and asked whether the report was true; the Bhikkhus answered that
    it was true.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed Buddha rebuked the conduct and said it would not conduce to the
    turning back of those who had been converted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed Buddha prescribed that a Bhikkhu placed on probation must not
    accept the listed reverence and services, and that one who does so is guilty of
    a dukka/a offence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Blessed Buddha prescribed that probationary Bhikkhus should perform the
    listed courtesies, duties, and services for one another according to seniority.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Five things are declared permissible to probationary Bhikkhus according to
    seniority: the Uposatha ceremony, the Pavaraṇa ceremony, a share in robes for
    the rainy season, a share in things dedicated to the Saṅgha, and food.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A probationary Bhikkhu is told not to confer the Upasampada.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A probationary Bhikkhu must not walk in front of or sit down in front of a
    regular Bhikkhu, and must be given and content himself with the worst seat, sleeping-place,
    or room belonging to that company of Bhikkhus.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A probationary Bhikkhu must not visit families supporting a regular Bhikkhu,
    devote himself to forest life, devote himself to living on alms personally received,
    or have alms brought out to avoid recognition as a probationary monk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A probationary Bhikkhu must announce his status when arriving at a residence,
    to an incoming Bhikkhu, at Uposatha and Pavaraṇa meetings, and, if sick, through
    a messenger.
  category: speech
  evidence_refs:
  - ev:8
