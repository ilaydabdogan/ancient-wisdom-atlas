canonical_text:
  quote: ''
  summary: 'A Vinaya passage describes probationary Bhikkhus accepting honors and
    services from regular Bhikkhus. After complaints by moderate Bhikkhus, the Blessed
    Buddha convenes the Bhikkhu-saṅgha, rebukes the conduct, and prescribes rules
    for probationary Bhikkhus: they must not receive such services, must serve one
    another according to seniority, may participate in specified communal matters,
    must accept lower seats and lodgings, must avoid certain practices, and must announce
    their probationary status in specified settings.'
  language: English
  quote_policy: summarized
