canonical_text:
  quote: ''
  summary: The passage lists conditions under which a disciplinary Ta^^aniya-kamma
    should not be revoked, states that the next chapter gives the converse cases,
    prescribes a formal procedure for revocation through petition and silent assent
    of the Sa;;^gha, and begins a case concerning the monk Seyyasaka, whose conduct
    causes other Bhikkhus to complain to the Blessed One.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu under Ta^^aniya-kamma is said not to be eligible for revocation
    when he performs specified acts such as conferring upasampada, giving nissaya,
    providing himself with a samanera, accepting the office of exhorting nuns, or
    exhorting nuns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikkhu is said not to be eligible for revocation when he repeats the offence
    for which the act was carried out, commits a similar or worse offence, or finds
    fault with the proceeding or the Bhikkhus who carried it out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eight additional actions are listed as preventing revocation, including objections
    to a regular Bhikkhu's participation in Uposatha or Pavarana, inhibiting a junior,
    initiating censure, asking leave to rebuke, warning or reminding another Bhikkhu
    about an offence, and associating with the Bhikkhus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage marks eighteen cases in which there should be no revocation and
    then identifies a following chapter as the exact converse, ending with eighteen
    cases in which revocation should occur.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For revocation, the followers of Pa;^^uka and Lohitaka are instructed to go
    before the Sa;;^gha with upper robe over one shoulder, bow at the feet of elder
    Bhikkhus, squat, and raise joined palms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The petitioners are instructed to say three times that they were subjected
    to Ta^^aniya-kamma, are conducting themselves rightly, have become subdued, seek
    release, and request revocation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A discreet and able Bhikkhu is instructed to lay the matter before the Sa;;^gha
    as a formal motion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sa;;^gha's decision procedure is stated as three announcements in which
    approval is indicated by silence and disapproval by speech; the revocation is
    declared carried because the Sa;;^gha is silent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The venerable Seyyasaka is described as stupid, indiscreet, full of faults,
    devoid of merit, and living in lay society in unlawful association with the world.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other Bhikkhus are described as worn out by repeatedly applying probationary
    and rehabilitative disciplines to Seyyasaka; moderate Bhikkhus complain and the
    matter is reported to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
