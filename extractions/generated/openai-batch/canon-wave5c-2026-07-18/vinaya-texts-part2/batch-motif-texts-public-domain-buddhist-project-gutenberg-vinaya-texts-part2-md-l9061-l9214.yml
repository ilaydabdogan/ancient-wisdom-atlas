canonical_text:
  quote: ''
  summary: During a world-encompassing storm of rain, the Blessed One tells the Bhikkhus
    to let themselves be rained upon. Visakha, a lay donor, sends a slave girl to
    announce a meal; the girl mistakes the robe-less Bhikkhus for naked ascetics.
    After the Bhikkhus dress and withdraw, the Blessed One miraculously appears with
    them at Visakha's mansion, where she feeds them, marvels that they are not wet
    despite floods, and asks permission to provide eight lifelong gifts, including
    rainy-season robes and bathing robes for nuns, citing the impropriety of nakedness.
  language: English
  quote_policy: summarized
