canonical_text:
  quote: ''
  summary: A Vinaya passage gives procedural rules for appointing a Saṅgha store-room
    and custodians, protecting the store-room keeper, distributing surplus cloth fairly,
    assigning special portions by travel need, compensation, and lots, and regulating
    robe dyeing and drying with approved materials and tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learned, competent Bhikkhu is to proclaim a formal motion before the Saṅgha
    to appoint a named Vihara as the Saṅgha store-room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cloth in the Saṅgha store-room was not protected, and the Blessed One prescribed
    appointing a qualified Bhikkhu who knows what is protected and what is not to
    take charge of the store-room.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chabbaggiya Bhikkhus expelled a Bhikkhu who had charge of a store-room
    from his place, and the Blessed One prohibited such expulsion as a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Saṅgha store-room was over-full of clothes, distribution by the whole
    assembled Saṅgha caused bustle, and the Blessed One prescribed appointing a qualified
    Bhikkhu to distribute the clothes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prescribed distribution procedure includes sorting the clothes, estimating
    them, making shares according to higher or lower value, counting the Bhikkhus,
    dividing them into groups, and assigning portions; Samaṇeras receive half a portion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Bhikkhu going across a river or desert is to receive the portion due to
    him, and a greater portion may be given if he gives compensation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Portions of cloth are to be assigned by casting lots made of grass-blades
    after making any defective portion even.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Dyeing cloth with cow-dung or yellow clay produced badly coloured robes,
    and six kinds of dye were prescribed: dyes made from roots, trunks of trees, bark,
    leaves, flowers, and fruits.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Unboiled dye made cloth ill-smelling, so boiling dye, using small dye-pots,
    placing basins under pots, and testing dye by dropping it into water or onto a
    nail were prescribed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: To avoid upsetting pots, lacking storage vessels, and tearing cloth against
    vessels, the passage prescribes a dye-ladle or long-handled scoop, jars and bowls
    for dye, and a large dyeing trough.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dyed cloth spread on the floor became dusty; grass was prescribed, the grass
    was eaten by white ants, and then a bamboo peg or rope was prescribed for hanging
    cloth, though hanging it in the middle caused dye to drip down both sides.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Many rules in the passage follow a repeated sequence in which a problem is
    reported to the Blessed One and he gives a prescription.
  category: sequence
  evidence_refs:
