  quote: ''
  summary: An editorially noted, textually confused Vinaya passage enumerates disciplinary
    cases for a Bhikkhu who has committed numerous named offences. The cases distinguish
    concealment and non-concealment of offences before and after renewed upasampada,
    then repeat the pattern for awareness, recollection, certainty, and for conditions
    involving novice status, mental weakness, loss of mind, diseased sensations, and
    recovery.
