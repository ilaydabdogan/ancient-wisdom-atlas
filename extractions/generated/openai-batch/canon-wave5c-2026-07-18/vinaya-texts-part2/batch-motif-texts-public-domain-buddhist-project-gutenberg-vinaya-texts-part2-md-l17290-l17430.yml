canonical_text:
  quote: One of them conceals, the other does not conceal it.
  summary: A Vinaya disciplinary passage classifies cases in which one or more Bhikkhus
    have committed Sanghadisesa, mixed, or minor offences. It distinguishes concealed
    and unconcealed offences, gives penalties involving confession, probation, Manatta
    discipline, and being dealt with according to law, and marks concealment over
    the watches of the night as becoming a concealed offence after sunrise.
  language: English translation with Pali disciplinary terms
  quote_policy: quoted
