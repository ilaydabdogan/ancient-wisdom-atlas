canonical_text:
  quote: ''
  summary: The passage first gives a formal procedure for the Saṅgha to appoint a
    vihāra as a kappiya-bhūmi. When cooking and other noisy work take place there,
    the Blessed One forbids that use and permits specified kinds of kappiya-bhūmi.
    After the sick venerable Yasoja’s medicines are damaged or stolen when kept outside,
    the Blessed One permits a duly chosen kappiya-bhūmi for storing medicines. The
    passage then introduces the householder Mendsika or Meṇḍaka of Bhaddiya-nagara
    and describes miraculous powers held by him, his wife, his son, his daughter-in-law,
    and his slave. King Seniya Bimbisara sends a minister with a fourfold host to
    verify the report; the minister witnesses Mendsika’s grain-filling miracle and
    asks to see the wife’s power.
  language: English
  quote_policy: summarized
