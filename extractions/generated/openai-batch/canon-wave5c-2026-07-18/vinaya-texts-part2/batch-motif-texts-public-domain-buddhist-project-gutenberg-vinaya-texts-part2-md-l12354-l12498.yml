canonical_text:
  quote: '"For not by hatred ... is hatred appeased; by not-hatred ... hatred is appeased."'
  summary: Young Dighavu performs funeral rites for his parents, enters Benares under
    another role, gains King Brahmadatta's trust through music and service, isolates
    the king during a hunt, considers killing him in revenge, but repeatedly sheathes
    his sword after recalling his father's instruction against hatred. The king then
    wakes in fear from a dream of Dighavu attacking him with a sword.
  language: English translation
  quote_policy: quoted
