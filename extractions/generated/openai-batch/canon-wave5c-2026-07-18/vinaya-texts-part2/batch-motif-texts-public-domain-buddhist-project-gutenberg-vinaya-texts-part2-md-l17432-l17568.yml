  quote: ''
  summary: The passage presents Vinaya disciplinary cases involving Bhikkhus guilty
    of Saṅghādisesa offences, including concealment or non-concealment, requests to
    the Saṅgha for probation, being thrown back to the beginning of probation, imposition
    of Manatta, rehabilitation, and whether the offender is purified depending on
    lawful or unlawful communal proceedings. It also enumerates variations of these
    cases.
