canonical_text:
  quote: ''
  summary: The passage describes the Blessed One directing the Saṅgha to impose the
    Nissaya-kamma, an act of subordination, on the Bhikkhu Seyyasaka, the prescribed
    procedure for that act, Seyyasaka's subsequent reform through association with
    good companions, and the revocation of the act. It then introduces the Pabbaganiya-kamma,
    the act of banishment, by listing the conduct of Bhikkhus who followed Assail
    and Punabbasu on Ki/a Hill, including flower-making, social contact with women
    of respectable families, use of drink and adornments, music, dancing, and games.
  language: English
  quote_policy: summarized
