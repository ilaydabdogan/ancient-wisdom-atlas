  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those followers plant, water, gather, and arrange flowers and have others
    do these acts; they make flowers into nosegays and several kinds of wreaths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: They take or send wreaths to wives, daughters, young women, sisters-in-law,
