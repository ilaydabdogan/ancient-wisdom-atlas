canonical_text:
  quote: ''
  summary: The excerpt contains an editorial note linking chapters to the Mahaparinibbana
    Sutta, followed by an account of Pataligama lay-devotees visiting the Blessed
    One, inviting him and the Bhikkhu community to a rest house, preparing it, and
    seating themselves around him. The Blessed One teaches householders about losses
    that follow wrongdoing. A later excerpt recounts Siha the general deciding to
    visit the Blessed One without asking the Niganthas, traveling from Vesali, asking
    whether accusations about the doctrine of action are accurate, and receiving a
    qualified answer.
