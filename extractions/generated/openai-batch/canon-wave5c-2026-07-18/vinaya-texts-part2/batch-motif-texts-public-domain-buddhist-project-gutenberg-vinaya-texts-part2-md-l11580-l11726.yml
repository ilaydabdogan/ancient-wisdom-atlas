canonical_text:
  quote: ''
  summary: A Vinaya passage presents Upali asking the Blessed One about lawful communal
    acts, including formal legal decisions and ordination. The Blessed One distinguishes
    lawful matching of acts to eligible recipients from unlawful mismatching, then
    gives procedural cases for disciplinary actions against various kinds of monks
    and for revoking a sentence when conduct improves.
  language: English translation with Pali legal terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Upali asks whether a complete congregation lawfully performs acts such as
    granting sativinaya, granting another vinaya procedure as printed, granting abbhana,
    and conferring upasampada ordination when each is given to the proper recipient.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One answers that such properly assigned acts are lawful according
    to Dhamma and Vinaya and that the Sangha does not trespass against the law in
    that case.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One states that if a complete congregation gives a procedure to
    someone for whom a different procedure ought to be given, the act is unlawful
    against Dhamma and Vinaya and the Sangha trespasses against the law.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A litigious, contentious, quarrelsome, disputatious Bhikkhu who repeatedly
    raises questions before the Sangha is presented as a case for proceeding with
    ta^^aniyakamma under varying conditions of legality and congregational completeness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: An editorial note describes the disciplinary exposition as arranged through
    five categories and says the arrangement is called a wheel, or cakka.
  category: other
  evidence_refs:
  - ev:10
- id: obs:6
  text: An ignorant, unlearned Bhikkhu who is a constant offender, cannot discern
    offences, and lives in lay society is presented as a case for nissayakamma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Bhikkhu who leads a life hurtful to the laity and devoted to evil is presented
    as a case for pabba^aniyakamma.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Bhikkhu who abuses and reviles lay people is presented as a case for pa^isara/ziyakamma.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Bhikkhu who has committed an offence and refuses to see that offence is
    presented as a case for expulsion for refusal to see the offence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Bhikkhu under ta^^aniyakamma who behaves properly, lives modestly, aspires
    to be clear of his penance, and asks for revocation may have the sentence revoked
    by the other Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:9
