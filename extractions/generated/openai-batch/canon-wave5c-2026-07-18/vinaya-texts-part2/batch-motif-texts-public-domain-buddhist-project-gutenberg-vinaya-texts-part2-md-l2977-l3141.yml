canonical_text:
  quote: ''
  summary: The passage gives monastic food rules and subsequent allowances. The Blessed
    One prohibits eating food kept or cooked indoors or cooked by monks themselves,
    then modifies allowances when monks face uncertainty, scarcity, theft, vermin,
    pressure from others, and fatigue while traveling. Later, a Brahman invites the
    Buddha and the Bhikkhu-saṅgha to a meal after receiving fresh tila seeds and honey.
  language: English
  quote_policy: summarized
