canonical_text:
  quote: ''
  summary: A monastic offence is disputed, an expulsion is pronounced, and the expelled
    monk gathers supporters. The opposing groups contest the validity of the expulsion.
    A monk reports the matter to the Buddha, who declares that the Saṅgha is divided
    and instructs the expelling monks not to impose expulsion when doing so would
    cause discord, separation, and schism in the Saṅgha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed Buddha is said to dwell at Kosambi in the Ghositārāma.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A certain Bhikkhu and other Bhikkhus disagree over whether a committed act
    is an offence, and their views later reverse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The other Bhikkhus pronounce expulsion against the Bhikkhu for refusing to
    see the act as an offence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The expelled Bhikkhu is described as erudite, learned in the Āgamas, Dhamma,
    Vinaya, and Mātikā, and as wise, modest, conscientious, and anxious for training.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The expelled Bhikkhu tells his companions that he is not guilty, that the
    sentence is invalid, and asks them to be his partisans according to Dhamma and
    Vinaya.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The expelled Bhikkhu also sends a messenger to companions and friends among
    Bhikkhus throughout the country, gaining further supporters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The expelled Bhikkhu’s partisans approach the expelling Bhikkhus and argue
    that the Bhikkhu is not guilty and that the expulsion sentence is invalid.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The expelling Bhikkhus answer that the Bhikkhu is an offender, that the sentence
    is valid, and that the partisans should not follow him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The partisans continue to stand on the side of the expelled Bhikkhu and follow
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Bhikkhu goes to the Blessed One, salutes him, sits near him, and reports
    the dispute and the continued support for the expelled Bhikkhu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Blessed One declares that the Bhikkhu Saṅgha is divided, rises, and goes
    to the Bhikkhus who pronounced the expulsion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Blessed One tells the expelling Bhikkhus not to pronounce expulsion against
    a Bhikkhu merely because it occurs to them to do so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Blessed One instructs that if expelling a learned and conscientious Bhikkhu
    would produce altercations, discord, separations, and schisms in the Saṅgha, the
    Bhikkhus should refrain from expulsion out of awe of causing divisions.
  category: speech
  evidence_refs:
