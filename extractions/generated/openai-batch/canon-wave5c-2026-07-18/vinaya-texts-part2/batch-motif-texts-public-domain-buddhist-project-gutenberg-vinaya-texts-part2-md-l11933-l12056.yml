canonical_text:
  quote: ''
  summary: 'A Vinaya passage describes a disciplinary dispute around an expelled Bhikkhu:
    proposed ritual and social separation, the Blessed One''s instruction to avoid
    schism by acknowledging an offence when appropriate, separate ritual acts by factions
    within and outside a boundary, rules for belonging to another communion and restoration
    to the same communion, and the outbreak of quarrels and blows among Bhikkhus.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhikkhus who had pronounced expulsion consider withholding Pavaraṇa, official
    acts, shared seats, rice-milk, dining-hall seating, shared dwelling under one
    roof, and seniority duties from the expelled Bhikkhu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated concern attached to the proposed exclusion is that the matter will
    cause divisions and schisms among the community.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One rises from his seat, goes to the partisans of the expelled
    Bhikkhu, and sits on a seat prepared by them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One tells the partisans not to assume that an offence need not
    be atoned for by saying they are without offence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One says that if a Bhikkhu trusts other Bhikkhus as learned, rule-knowing,
    and not acting from longing, malice, delusion, or fear, he should acknowledge
    the offence on their authority to avoid causing divisions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The partisans of the expelled Bhikkhu hold Uposatha and perform official acts
    at the same place within the boundary, while the expelling Bhikkhus go outside
    the boundary to hold Uposatha and perform official acts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Bhikkhu from the expelling group reports the two groups' different ritual
    locations and acts to the Blessed One.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Blessed One says that official acts performed by either group at the same
    place within the boundary are lawful, unobjectionable, and valid if performed
    according to the rules about natti and anussavana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Blessed One explains that the two groups belong to different communions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Bhikkhu is considered to belong to another communion either by making himself
    belong to another communion or by complete-congregation expulsion for refusal
    to see an offence, atone for an offence, or renounce a false doctrine.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Bhikkhu reacquires belonging to the same communion either by making himself
    belong again to that communion or by complete-congregation restoration after expulsion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bhikkhus involved in altercations, contentions, and quarrels behave improperly
    in gesture and word in the dining-hall and amid houses, and come to blows.
  category: action
  evidence_refs:
  - ev:6
