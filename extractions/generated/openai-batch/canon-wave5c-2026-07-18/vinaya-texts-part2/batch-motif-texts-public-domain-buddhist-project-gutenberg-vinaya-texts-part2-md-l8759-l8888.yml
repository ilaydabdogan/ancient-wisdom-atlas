canonical_text:
  quote: ''
  summary: 'The Blessed One journeys from Rajagaha toward Vesali, sees Bhikkhus carrying
    excessive robes, and considers setting a limit on monastic dress. At Vesali, during
    cold winter nights, he tests the use of robes against the cold through the watches
    of the night. He then reasons that Bhikkhus affected by cold can make use of three
    robes, gives a religious discourse, and allows three robes: a double waist cloth,
    a single upper robe, and a single under garment. The passage then begins to describe
    the A''/fabbaggiya Bhikkhus using the allowance to keep different suits for different
    activities, but the supplied text breaks off.'
  language: English
  quote_policy: summarized
