canonical_text:
  quote: ''
  summary: A Vinaya passage records a dispute over a robe sent by Revata, then gives
    rules attributed to the Blessed One for whether a robe-carrier rightly takes or
    keeps a robe in trust under different wording and death cases. It then lists eight
    grounds for receiving robe gifts and gives rules for distributing such gifts among
    monastic recipients.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The venerable Revata says that he sent a robe in the charge of a Bhikkhu to
    a Thera and asks where the robe is.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unnamed Bhikkhu replies that he took the robe himself in trust upon Revata.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The matter is reported to the Blessed One.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a robe is sent with the wording “Give this robe to such and such a Bhikkhu,”
    a carrier who takes it in trust on the sender is treated as acting rightly, while
    taking it in trust on the intended recipient is treated as wrong.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the carrier hears on the way that the sender has died, keeping the robe
    as the property of the deceased sender is treated as right, while taking it in
    trust on the intended recipient is treated as wrong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the carrier hears on the way that the intended recipient has died, keeping
    the robe as the property of the deceased recipient is treated as wrong, while
    taking it in trust on the sender is treated as right.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the carrier hears that both sender and intended recipient have died, keeping
    the robe as the deceased sender’s property is treated as right, while keeping
    it as the deceased recipient’s property is treated as wrong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the sending formula is “I give the robe to such and such a Bhikkhu,”
    the decisions from the preceding cases are stated to be reversed.
  category: speech
  evidence_refs:
  - ev:4
  - ev:9
- id: obs:9
  text: 'The passage lists eight grounds for receiving a gift of robes: gift to the
    boundary, to a Sangha under agreement, on a declaration of alms, to the Sangha,
    to both Sanghas, to the Sangha that spent the rainy season at the place, to a
    specified number, and to a single Bhikkhu.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A gift to the boundary is divided among all Bhikkhus who have come within
    the boundary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A gift to both Sanghas is divided into equal halves between the two Sanghas
    even when one group has many members and the other has only one.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A gift to a specified number is determined by those present for specified
    offerings such as congee, rice, hard food, robes, bedding, or medicine; a gift
    to a single Bhikkhu is addressed to a named individual.
  category: relationship
  evidence_refs:
  - ev:8
