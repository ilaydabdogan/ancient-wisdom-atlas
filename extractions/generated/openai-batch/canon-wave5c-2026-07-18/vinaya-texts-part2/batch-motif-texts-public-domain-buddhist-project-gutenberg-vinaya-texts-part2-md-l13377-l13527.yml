canonical_text:
  quote: ''
  summary: A disciplinary passage from the Cullavagga describes quarrelsome monks
    who encourage disputes in the Saṅgha, the complaint brought by modest monks, the
    Blessed One's rebuke, and the formal procedure for carrying out the Taṇḍaniya-kamma/Act
    of Rebuke, including conditions under which such an act is invalid.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One is staying at Jetavana, in the grove of Anathapiṇḍika.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The followers of Pa////uka and Lohitaka are described as makers of strife,
    quarrelsome, makers of disputes, given to idle talk, and raisers of legal questions
    in the Saṅgha.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those followers approach other similar Bhikkhus and encourage them not to
    turn back, to discuss loudly and at length, and not to fear their adversaries.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: As a result, disputes that had not arisen came into being, and disputes already
    arisen became more heated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Modest Bhikkhus become annoyed, murmur, become indignant, and report the matter
    to the Blessed One.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One convenes an assembly of the Order of Bhikkhus, asks whether
    the report is true, and is told that it is true.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Blessed Buddha rebukes the conduct as improper, unsuitable, unworthy of
    a Samaṇa, unbecoming, and harmful to conversion and the increase of the converted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Blessed One gives a religious discourse contrasting faults such as discontent,
    wishing for much, love of society, and sloth with virtues such as contentment,
    wishing for little, faith, reverence, and zeal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the discourse, the Blessed One instructs the Saṅgha to carry out the
    Taṇḍaniya-kamma, the Act of Rebuke, against those Bhikkhus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The prescribed procedure requires warning the accused, reminding them of the
    rule, charging them with the offense, and having a discreet and able Bhikkhu lay
    the matter before the Saṅgha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The formal motion is to be stated and repeated a second and third time; those
    who approve remain silent, and silence is treated as the Saṅgha's approval.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Taṇḍaniya-kamma is said to be against Dhamma and Vinaya if not carried out
    in a full qualified assembly according to law and justice in the presence of the
    litigants, or if carried out without hearing the accused or without the accused
    confessing guilt.
  category: other
  evidence_refs:
  - ev:6
