canonical_text:
  quote: ''
  summary: The passage gives Vinaya rules for Bhikkhus who have committed Sa7;2ghadisesa/Sa;;2ghadisesa
    offences, especially where the offender is unaware, forgetful, or uncertain about
    the degree of offences and the time elapsed. It prescribes probation of complete
    purification or ordinary probation in listed cases. It also states that a Bhikkhu
    who leaves the Order or becomes a Sama;^era while under probation does not undergo
    probation during that status, but the original probation remains binding if he
    later receives upasampada.
  language: English translation with Pali terms
