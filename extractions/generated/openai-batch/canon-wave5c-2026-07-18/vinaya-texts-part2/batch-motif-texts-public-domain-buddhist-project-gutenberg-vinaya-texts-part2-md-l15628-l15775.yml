canonical_text:
  quote: ''
  summary: 'The passage lists rules for a Bhikkhu placed on probation: restrictions
    on travel between residences and non-residences, restrictions concerning communities
    different from his own, permitted travel to same-community Bhikkhus when reachable
    the same day, deferential conduct toward regular and senior or disciplined Bhikkhus,
    invalidity of communal disciplinary acts when a probationer is part of the meeting,
    and a question from Upali to the Blessed One about interruption of the probationary
    period.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu placed on probation is forbidden to go from a place where Bhikkhus
    are living to a place where no Bhikkhus are living, unless he goes with a regular
    Bhikkhu or in time of danger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The movement restriction is applied through permutations of residence and
    non-residence, depending on whether Bhikkhus are or are not living there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A probationer is forbidden to go to places where there may be Bhikkhus of
    communities different from his own, subject to the same exceptions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A probationer ought to go to a place where Bhikkhus of the same community
    are living if he knows he can get there that same day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A probationer must not dwell under one and the same roof with a regular Bhikkhu,
    whether in a residence, a non-residence, or either kind of place.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: On seeing a regular Bhikkhu, the probationer is to rise and offer his seat,
    and must not sit on the same seat or in a higher position than the regular Bhikkhu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A probationer must not walk up and down on the same or higher cankama when
    a regular Bhikkhu is walking there or on a lower walking place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same conduct restrictions are extended to relations with a senior probationer
    and with Bhikkhus in several disciplinary statuses, including those thrown back,
    liable to Manatta, undergoing Manatta, or eligible for rehabilitation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A meeting that includes a probationer performs an invalid act if it places
    a Bhikkhu on probation, throws him back to the beginning of probation, subjects
    him to Manatta discipline, or rehabilitates him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The section marks the conclusion of ninety-four duties incumbent on a probationer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Upali asks the Blessed One in what case the probationary period can be interrupted;
    the Blessed One begins an answer by saying there are three ways of interruption.
  category: speech
  evidence_refs:
  - ev:8
