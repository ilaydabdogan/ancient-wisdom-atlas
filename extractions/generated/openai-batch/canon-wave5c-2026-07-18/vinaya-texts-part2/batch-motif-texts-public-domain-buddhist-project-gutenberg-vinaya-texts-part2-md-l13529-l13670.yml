literal_observations:
- id: obs:1
  text: A Ta^^aniya-kamma is said to be against the Dhamma and Vinaya and difficult
    to settle when carried out despite no fault, for a Para^ika or Sawghadisesa offence,
    or after the fault has been confessed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Ta^^aniya-kamma is also treated as invalid when carried out without warning
    the accused person, without calling the accused person to remember whether the
    offence was committed, or without convicting the accused person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Ta^^aniya-kamma is also treated as invalid when not carried out in a properly
    constituted and conducted meeting, when carried out without justice, or when carried
    out without the presence and approval of all Bhikkhus belonging to the particular
    circuit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that these combinations make twelve cases of a proceeding
    against the law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Ta^^aniya-kamma is said to be in accordance with the Dhamma and Vinaya and
    easy to settle when carried out in a full assembly of qualified persons, according
    to law, in the presence of litigant parties, after the accused person has been
    heard, and after the accused person has confessed guilt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the opposites of the twelve invalid propositions are
    laid down as twelve cases of a proceeding according to law.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sa;;/gha may carry out the Ta^^aniya-kamma against a Bhikkhu characterized
    as a maker of strife, quarrelsome, a maker of disputes, given to idle talk, and
    a raiser of legal questions in the Sa;;/gha.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sa;;/gha may also carry out the Ta^^aniya-kamma against a Bhikkhu described
    as dull, stupid, full of faults, devoid of merit, or living in lay society in
    unlawful association with the world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Further grounds for the proceeding include failure in morality, failure in
