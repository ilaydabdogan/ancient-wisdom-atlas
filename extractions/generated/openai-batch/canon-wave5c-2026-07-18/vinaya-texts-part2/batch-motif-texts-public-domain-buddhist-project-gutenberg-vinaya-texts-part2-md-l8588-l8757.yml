canonical_text:
  quote: ''
  summary: 'The passage gives practical robe and cloth-handling rules for Bhikkhus:
    how to tie, hang, dye, rinse, and smooth cloth; it prohibits certain yellowish
    robes after public criticism. It then narrates the Blessed One seeing the divided
    Magadha rice fields, asking Ananda to make robes of a similar pattern, Ananda
    doing so, and the Blessed One praising Ananda and enjoining torn-piece robes with
    specified seams and pieces.'
  language: English
  quote_policy: summarized
