  summary: 'The passage and notes describe a Vinaya procedure for Kathina cloth and
    robes: communal ownership by the Saṅgha, formal handover to an appointed Bhikkhu,
    approval by silence, later distribution of robes, and a list of preliminary cloth-working
    acts that do not by themselves make the Kathina ceremony duly held.'
