canonical_text:
  quote: ''
  summary: A Vinaya passage gives rules about footwear. The Chabbaggiya Bhikkhus wear
    colored, ornamented, and animal-skin-adorned shoes, prompting complaints and prohibitions
    from the Blessed One. A limping Bhikkhu with blistered feet is offered lined shoes
    by a lay-disciple, leading to an allowance for lined shoes when cast off by others,
    while new lined shoes remain forbidden. The passage then contrasts the Blessed
    One and elder Bhikkhus walking unshod with the Chabbaggiya Bhikkhus walking shod,
    prompting complaint and rebuke.
  language: English translation with embedded romanized Pali notes
  quote_policy: summarized
