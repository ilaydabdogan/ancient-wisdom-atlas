canonical_text:
  quote: ''
  summary: Siha, a general, hears distinguished Licchavis praising the Buddha, Dhamma,
    and Sangha and wishes to visit the Blessed One. Nigantha Nataputta discourages
    him by saying Gotama denies the result of actions and teaches non-action, and
    Siha's desire abates. After repeated praise, Siha resolves to go without the Niganthas'
    consent, leaves Vesali with five hundred vehicles, continues on foot where carriages
    cannot pass, respectfully approaches the Blessed One, and asks whether the accusation
    is true. The Blessed One answers that certain descriptions of his teaching can
    be true in specific senses, and explains that his teaching of non-action means
    not doing unrighteous actions by deed, word, or thought and not producing evil
    mental conditions.
  language: English translation with transliterated Indic terms
  quote_policy: summarized
