canonical_text:
  quote: For not by hatred, my dear Dighavu, is hatred appeased; by not-hatred, my
    dear Dighavu, is hatred appeased.
  summary: Young Dighavu has an opportunity to kill king Brahmadatta of Kasi, who
    killed his parents and took his family’s kingdom, but the two grant each other
    life and swear not to harm one another. Dighavu explains his father’s deathbed
    counsel as a teaching against prolonged hatred and revenge. Brahmadatta restores
    Dighavu’s royal possessions and gives him his daughter. The Blessed One applies
    the story as an admonition to quarrelling Bhikkhus, urging forbearance and mildness;
    when the admonition is resisted, he leaves and later speaks verses about noisy
    divisions in the Sangha.
  language: English
  quote_policy: quoted
