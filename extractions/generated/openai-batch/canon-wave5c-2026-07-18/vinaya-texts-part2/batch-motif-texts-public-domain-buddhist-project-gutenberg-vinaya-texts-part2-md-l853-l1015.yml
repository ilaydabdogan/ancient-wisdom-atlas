canonical_text:
  quote: ''
  summary: A Vinaya passage narrates several cases of monks using prohibited or improper
    foot-coverings. Wooden shoes are forbidden after they cause harm to insects and
    disturb meditation. Leaf shoes made from young palmyra and bamboo are forbidden
    after plants are damaged and laypeople complain. Various ornamental foot-coverings
    and ornamented shoes are forbidden after monks neglect instruction, morality,
    concentration, and wisdom. Fixed clogs for privy, urinal, and rinsing use are
    allowed. The passage ends with a new case in which the Chabbaggiya monks mistreat
    heifers crossing the Aciravati River.
  language: English
  quote_policy: summarized
