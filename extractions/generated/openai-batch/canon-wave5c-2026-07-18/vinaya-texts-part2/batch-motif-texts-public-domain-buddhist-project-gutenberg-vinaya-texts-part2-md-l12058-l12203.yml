canonical_text:
  quote: ''
  summary: A Vinaya passage describes public criticism and internal concern over quarrelling
    Bhikkhus, the Blessed One's instructions for conduct when divisions arise, a failed
    attempt to stop harsh disputes, and the beginning of a former-time story about
    the wealthy king Brahmadatta of Kasi conquering the poorer king Dighiti of Kosala,
    who flees with his queen, lives in disguise, and seeks help when the pregnant
    queen has a dangerous craving involving an armoured army and sword-washing water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are annoyed and complain that Sakyaputtiya Samanas have altercations,
    contentions, quarrels, and come to blows.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Bhikkhus hear the complaints, and moderate Bhikkhus also become annoyed
    and complain about the quarrelling Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bhikkhus report the matter to the Blessed One; he asks whether it is true,
    they answer that it is, and he rebukes them and gives a religious discourse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One says that when divisions have arisen in the Sangha and unlawful
    conduct and unfriendliness prevail, the Bhikkhus should sit separately and resolve
    not to behave improperly in gesture or word and not to come to blows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One says that when divisions have arisen but lawful conduct and
    friendliness prevail, the Bhikkhus may sit down together, one by one from each
    side.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bhikkhus involved in altercations, contentions, and quarrels wound each other
    with sharp words in assemblies and are unable to settle the question.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A certain Bhikkhu asks the Blessed One to go to the quarrelling Bhikkhus out
    of compassion; the Blessed One consents by remaining silent and goes to them.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: After sitting on the prepared seat, the Blessed One tells the Bhikkhus that
    there should be no altercations, contentions, disunion, or quarrel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Bhikkhu adhering to the party who were wrong asks the Blessed One to be
    patient, to quietly enjoy the bliss he has obtained, and says responsibility for
    the dispute will rest with them alone; this exchange occurs twice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a former-time story, Brahmadatta of Kasi is described as a wealthy king
    ruling a great realm, while Dighiti of Kosala is described as a poor king ruling
    a small realm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Brahmadatta goes to war with Dighiti after setting the four hosts of his army
    in array; Dighiti decides he cannot withstand the attack and flees with his queen-consort.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Brahmadatta conquers Dighiti's troops, vehicles, realm, treasuries, and storehouses
    and takes possession of them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Dighiti and his consort go to Benares and dwell near the town in a potter's
    dwelling, in disguise as wandering ascetics.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Dighiti's queen-consort becomes pregnant and longs at sunrise to see an armoured
    army with four hosts arrayed on auspicious ground and to drink the water in which
    swords were washed.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Dighiti says that distressed people like them cannot obtain such an army or
    sword-washing water; the queen says she will die if she does not obtain it.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Dighiti approaches a Brahmana who is Brahmadatta's domestic chaplain and Dighiti's
