canonical_text:
  quote: "“like milk and water (mixed together)”"
  summary: The passage describes Anuruddha, Nandiya, and Kimbila telling the Blessed
    One that they live in concord, give up individual will, share monastic duties
    silently, and regularly sit together in religious discourse. The Blessed One then
    goes to Parileyyaka and dwells alone at the foot of the Bhaddasala tree, reflecting
    that solitude is pleasant after conflict with contentious Kosambi monks. A noble
    elephant likewise leaves its crowded herd, serves the Blessed One with water and
    food, and also finds ease in solitude. The Blessed One utters that the noble human
    and noble elephant have harmonizing minds in their delight in dwelling alone in
    the forest. Later, Kosambi lay-devotees decide to withdraw honors and food from
    the Kosambi monks so that they will leave, return to the world, or propitiate
    the Blessed One.
  language: English
  quote_policy: quoted
