canonical_text:
  quote: ''
  summary: Lay-devotees of Kosambi withdraw marks of honor and alms from the Kosambi
    Bhikkhus. The Bhikkhus decide to go to Savatthi to settle their question before
    the Blessed One. Sariputta and other leading disciples ask how to behave toward
    the contentious monks. The Blessed One instructs Sariputta to side with those
    right according to the Dhamma and gives paired criteria for recognizing wrong
    and right statements about Dhamma, Vinaya, the Tathagata’s teaching, practice,
    ordinances, and classifications of offences. Mahapajapati Gotami is told to hear
    the Dhamma on both sides and accept the party that is right according to the Dhamma.
    Anatha-pindika begins to ask the same question.
  language: English
  quote_policy: summarized
