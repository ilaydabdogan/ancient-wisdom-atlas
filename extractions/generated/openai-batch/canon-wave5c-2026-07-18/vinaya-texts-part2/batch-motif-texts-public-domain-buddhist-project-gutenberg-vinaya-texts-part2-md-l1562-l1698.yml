canonical_text:
  quote: ''
  summary: 'The venerable Soṇa recites the Book of the Eights before the Blessed One
    and is praised. He explains that although he long saw the danger of the passions,
    household life delayed him. The Blessed One utters a doctrinal verse about seeing
    the danger of the world, understanding Truth, and delighting in the pure word.
    Soṇa then bows and conveys Mahā Kaccāyana’s message concerning conditions in the
    Southern country and Avanti. The Blessed One permits adaptations for border countries:
    a reduced quorum for upasampadā ordination, thick-lined shoes, constant bathing,
    animal-skin coverlets, and acceptance of robes sent to a named absent monk, with
    the ten-day rule beginning only when the robes reach him.'
  language: English translation with Pali terms
  quote_policy: summarized
