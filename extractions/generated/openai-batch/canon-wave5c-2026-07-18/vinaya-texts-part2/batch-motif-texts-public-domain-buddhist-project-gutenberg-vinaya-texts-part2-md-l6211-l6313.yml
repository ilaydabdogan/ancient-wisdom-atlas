canonical_text:
  quote: ''
  summary: The passage explains the Kathina as cotton cloth donated for the Sangha,
    made into robes and formally made common property for distribution under eligibility
    rules. It describes donor presentation, collective robe-making, post-ceremony
    privileges, restrictions and suspensions, and notes later practice in Burma and
    Ceylon.
  language: English, with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kathina is described as a stock of cotton cloth provided by the faithful
    to be made into robes for the Sangha during the ensuing year.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cloth is to be dyed, sewn, made into robes, and formally declared common
    property available for immediate distribution on one day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated object of the same-day procedure is to keep the Sangha or a quorum
    present so that material intended equally for all is less likely to be divided
    unequally among a few.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brethren who kept the Vassa within the district or residence and took part
    in the Pavarana are entitled to share in the distribution.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A layman wishing to give a Kathina to the whole community presents the cloth
    in the early morning to a properly constituted meeting of the Sangha, after which
    the Kathina ceremony is performed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: All Brethren living within the boundary must be present and take part in making
    the cotton cloth into robes; if completion before day's end is in danger, even
    senior or revered Bhikkhus must assist.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of the rainy season of Vassa, some Bhikkhus' previous robes may
    be worn out, while a Kathina donation may not yet have been offered.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a Kathina is offered and the ceremony is duly performed, each Bhikkhu
    has a right to supply actual needs from the robes made from the Kathina, and the
    need or choice may arise later.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'After the Kathina ceremony, five privileges are described: going for alms
    to uninvited households, going for alms without the usual set of three robes,
    going for alms in a body of four or more, possessing as many robes as wanted,
    and having whatever robes come to hand belong to the eligible Bhikkhus.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The five privileges are said to be suspended by any one of eight things mentioned
    later in the rule sequence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage notes that in Burma and Ceylon robes are usually provided according
    to rules for gifts to particular Bhikkhus, though the gift of a Kathina remains
    not uncommon.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note relates one Kathina privilege to an exception to the Patimokkha rule
    concerning alms-going, explaining that freer intercourse between Bhikkhus and
    laity might help prevent a shortage of robes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage introduces the dedication formula by saying that a learned, competent
    Bhikkhu should proclaim it.
  category: speech
  evidence_refs:
  - ev:10
