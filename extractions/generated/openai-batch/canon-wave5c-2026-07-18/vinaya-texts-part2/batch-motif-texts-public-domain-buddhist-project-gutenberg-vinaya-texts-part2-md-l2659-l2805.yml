canonical_text:
  quote: ''
  summary: King Seniya Bimbisara asks about giving a park-keeper to the venerable
    Pilindavaccha; after inquiry the Blessed One allows Bhikkhus to accept a park-keeper.
    The king later forgets his promise, then gives five hundred park-keepers after
    being told five hundred nights have elapsed, and a village associated with them
    grows up. During a feast in that village, a poor park-keeper's daughter cries
    for a garland and ornament; Pilindavaccha has a grass chumbat tied around her
    head, and it becomes an unmatched gold chaplet. People report this to the king
    as suspected theft, and the park-keeper's family is put in bonds. Pilindavaccha
    then goes to the king and asks why the family has been bound.
  language: English
  quote_policy: summarized
