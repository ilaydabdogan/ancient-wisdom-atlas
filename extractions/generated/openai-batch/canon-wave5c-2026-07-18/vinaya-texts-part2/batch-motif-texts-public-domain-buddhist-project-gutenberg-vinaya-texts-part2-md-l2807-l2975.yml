canonical_text:
  quote: ''
  summary: A venerable monk performs a miracle making King Seniya Bimbisara's palace
    gold, leading to the release of a park-keeper's family and to lay donations of
    five medicines. The medicines are stored in excess by monks, prompting public
    criticism and a rule limiting storage to seven days. Subsequent episodes clarify
    allowances for molasses mixed to make it firm, beans, salt sour gruel, and a gruel
    prepared for the sick Buddha; Ananda is rebuked for keeping and cooking ingredients
    indoors and cooking on his own accord.
  language: English
  quote_policy: summarized
