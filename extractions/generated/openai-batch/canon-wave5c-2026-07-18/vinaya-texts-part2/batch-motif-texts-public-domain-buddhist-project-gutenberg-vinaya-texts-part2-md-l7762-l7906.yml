canonical_text:
  quote: ''
  summary: A physician receives payment after a cure, is summoned by King Pajjota
    through King Bimbisara, disguises ghee as a decoction to treat Pajjota's jaundice,
    anticipates danger from the cruel king, obtains permission for free movement,
    flees on the she-elephant Bhaddavatika, delays the pursuing slave Kaka with medicated
    myrobalan and water, and returns to Rajagaha where Bimbisara approves his refusal
    to return.
  language: English translation with OCR/transliteration artifacts
  quote_policy: summarized
