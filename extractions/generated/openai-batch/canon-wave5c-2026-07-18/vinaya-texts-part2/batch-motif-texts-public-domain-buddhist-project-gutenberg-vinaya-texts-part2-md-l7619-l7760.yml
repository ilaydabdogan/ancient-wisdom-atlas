canonical_text:
  quote: ''
  summary: The passage recounts two medical episodes involving Jivaka. In the first,
    after describing a small worm that would have caused a householder’s death, Jivaka
    closes and treats a head wound, makes the patient remain lying down through three
    seven-day periods, reveals that he expected recovery after that time, and receives
    payment for himself and the king. In the second, the son of a Benares householder
    suffers intestinal entanglement after tumbling; his father petitions King Seniya
    Bimbisara for Jivaka, who travels to Benares, performs abdominal surgery, shows
    the twisted intestines to the patient’s wife, repairs them, and the son recovers.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doctors had identified a small worm connected with the householder’s wound
    and had predicted that it would reach the brain on the seventh day and cause death;
    Jivaka says they saw this correctly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jivaka closed the sides of the wound, stitched the skin on the head, and anointed
    it with salve.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After successive seven-day intervals, the householder said he could not remain
    lying on one side, then the other side, then his back for seven months, and Jivaka
    redirected him each time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jivaka told the householder that he had spoken as he did because otherwise
    the householder would not have lain down even that long, and that he knew beforehand
    the householder would recover after three times seven days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After recovery, the householder offered all his possessions and to become
    Jivaka’s slave; Jivaka refused this and requested one hundred thousand kahapanas
    for the king and one hundred thousand for himself, which the householder paid.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The son of the Benares householder injured or entangled his intestines while
    amusing himself by tumbling, and afterward could not digest rice-milk or food
    or ease himself normally; he became lean, disfigured, discoloured or yellow, with
    visible veins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Benares householder went to Rajagaha and asked King Seniya Bimbisara to
    order Jivaka to cure his son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: King Seniya Bimbisara ordered Jivaka to go to Benares and cure the householder’s
    son, and Jivaka accepted the order and went.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jivaka examined the son’s appearance, ordered people to leave the room, drew
    a curtain, tied the son to a pillar, placed his wife in front of him, and cut
    through the skin of the belly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Jivaka drew out the twisted intestines, showed them to the wife, explained
    the illness, disentangled the intestines, put them back, stitched the skin together,
    and anointed it with salve.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Benares householder’s son regained his health before long.
  category: sequence
  evidence_refs:
  - ev:9
