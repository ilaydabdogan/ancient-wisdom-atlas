canonical_text:
  quote: ''
  summary: A Vinaya passage recounts how Civaka, after receiving costly cloth from
    kings, offers garments to the Blessed One and requests their acceptance. The Blessed
    One accepts, teaches, and issues allowances permitting Bhikkhus to wear lay robes,
    use particular garments, and use six kinds of robe materials. Lay people rejoice
    and give many robes for merit. Later rulings clarify that Bhikkhus may have both
    lay robes and rag robes, and that Bhikkhus who did not wait for others collecting
    cemetery rag robes are not entitled to a compulsory share.
  language: English translation with Pali/transliterated terms
  quote_policy: summarized
