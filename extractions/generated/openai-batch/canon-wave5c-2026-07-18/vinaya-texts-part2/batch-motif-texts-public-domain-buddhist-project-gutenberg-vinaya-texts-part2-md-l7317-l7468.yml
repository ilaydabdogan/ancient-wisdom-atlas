canonical_text:
  quote: ''
  summary: Jivaka Komarabhacca completes his medical training by searching around
    Takkasila and finding nothing that is not medicinal. After receiving a little
    travel money from his teacher, he departs for Rajagaha, runs out of funds at Saketa,
    and seeks a patient to cure. He treats the householder's wife, who has suffered
    seven years from a head disease that other physicians failed to cure. After negotiating
    no payment until recovery, he administers ghee boiled with drugs through her nose.
    She recovers after one treatment and Jivaka receives substantial gifts from her
    household.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jivaka accepts his physician-teacher's order, takes a spade, searches around
    Takkasila for a yojana on every side, and reports that he found nothing that was
    not medicinal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The physician-teacher tells Jivaka that he has completed his learning and
    gives him a small amount of money for the journey home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jivaka sets out for Rajagaha, but his travel money is spent on the way at
    Saketa; he thinks the route is wild, with little water and food, and decides to
    seek money for the journey.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife of the setthi at Saketa has suffered for seven years from a disease
    in the head; many renowned physicians have failed to restore her health after
    receiving much gold.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jivaka asks people in Saketa who is sick and whom he should cure, and he is
    directed to the setthi's wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The door-keeper conveys messages between Jivaka and the setthi's wife; she
    initially doubts a young physician, and Jivaka requests no payment before recovery.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jivaka observes the setthi's wife's appearance, requests one pasata of ghee,
    boils it with various drugs, has her lie on her back, and administers the medicine
    through her nose; the butter comes out through her mouth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The setthi's wife has the expelled ghee collected with cotton, explains it
    can be reused for servants' feet or a lamp, and assures Jivaka that he will not
    lose his fee.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jivaka removes the seven-year head disease with one nasal administration of
    medicine, and the restored woman's family gives him money, servants, and a coach
    with horses.
  category: sequence
  evidence_refs:
  - ev:9
