  quote: ''
  summary: The passage enumerates conditions under which a Kaṭhina ceremony has not
    been duly held, including incomplete robe preparation, defective decisions or
    gifts, postponement or abandonment, omitted robe categories or robe parts, improper
    multiple presiding Bhikkhus, and ratification by a Saṅgha other than the whole
    community within the boundary. It then opens a question about when the ceremony
    has been duly held.
