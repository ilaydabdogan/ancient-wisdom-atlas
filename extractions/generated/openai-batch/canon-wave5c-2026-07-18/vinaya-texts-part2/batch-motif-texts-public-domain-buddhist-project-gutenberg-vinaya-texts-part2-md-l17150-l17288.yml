literal_observations:
- id: obs:1
  text: The passage lists combinations of prior and later certainty or uncertainty
    about offences, together with concealment or non-concealment, and assigns the
    same penalty referenced from an earlier chapter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text marks the end of one hundred cases in which Manatta is imposed after
    a change of state in a guilty Bhikkhu; a note explains the cases as a combinatorial
    expansion from earlier chapters.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Bhikkhu undergoing probation who commits multiple Saṃghādisesa offences,
    does not conceal them, throws off the robes, and later receives upasampada without
    concealing the offences is to be thrown back to the beginning of probation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the same Bhikkhu conceals the offences after renewed upasampada, he is
    to be thrown back to the beginning of probation and given inclusive probation
    measured from the first concealed offence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a probationary Bhikkhu conceals multiple Saṃghādisesa offences before throwing
    off the robes, the penalty includes being returned to the start of probation and
    inclusive probation; the same judgment applies if concealment also occurs after
    renewed upasampada.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: For offences of which some had been concealed and some not concealed before
    the robes were thrown off, the passage gives four combinations of later concealment
    and non-concealment and states the same judgment applies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage treats cases where the Bhikkhu is aware of some offences and unaware
    of others, conceals known offences, does not conceal unknown offences, then throws
    off the robes and receives upasampada again; the penalty is stated to be the same
    as in the prior section.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Bhikkhu liable to Manatta, undergoing Manatta, or fit to be rehabilitated
    who commits non-concealed Saṃghādisesa offences, throws off the robes, and receives
    upasampada again is subject to the same rules as a Bhikkhu undergoing probation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage begins a case in which a Bhikkhu fit to be rehabilitated commits
    non-concealed offences and then becomes a Sāmaṇera, goes out of his mind, becomes
    weak in mind, or becomes diseased in sensations; the supplied passage ends before
    this case is completed.
  category: sequence
  evidence_refs:
  - ev:9
