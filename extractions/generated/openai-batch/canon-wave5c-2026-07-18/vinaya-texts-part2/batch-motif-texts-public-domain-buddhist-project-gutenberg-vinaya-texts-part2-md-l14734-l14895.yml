canonical_text:
  quote: ''
  summary: The passage gives a formal procedure for carrying out the Paṭisāraṇīya-kamma
    against the Bhikkhu Sudhamma after he censures a faithful lay householder and
    supporter of the Saṅgha. It lists grounds for this disciplinary act, states that
    related procedural material is repeated from the Tajjanīya-kamma, narrates Sudhamma’s
    failed attempt to obtain the householder’s pardon, and gives instructions for
    appointing a companion messenger to help him seek pardon.
  language: English translation with transliterated Indic terms and OCR artifacts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu subject to the procedure is first to be warned, reminded of the
    rule, charged with the offence, and then brought before the Saṅgha through a formal
    statement by a discreet and able Bhikkhu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sudhamma is said to have put down and lowered by censure a householder named
    A'itta or /ifitta in the OCR text, who is described as faithful, believing, and
    a donor, provider, and supporter of the Saṅgha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Saṅgha carries out the Paṭisāraṇīya-kamma with the instruction that Sudhamma
    is to ask and obtain pardon from the householder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The formal motion is repeated, and approval is indicated by silence when those
    who disapprove are invited to speak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The text lists conduct toward laity as grounds for the procedure, including
    bringing loss or harm, depriving them of dwellings, reviling and finding fault,
    and causing division among them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Additional grounds include speaking to laity in dispraise of the Buddha, the
    Dhamma, or the Saṅgha, putting laymen down by censure, and failing to fulfil a
    promise made to the laity according to the Rules.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the procedure is carried out, Sudhamma goes to the place printed with
    OCR forms resembling MaX'/{7^ikasa;/^a or Ma/'/7/ikasa;^^a, but, being greatly
    troubled in mind, cannot ask and obtain the householder’s pardon and returns to
    Savatthi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Other Bhikkhus ask Sudhamma whether the householder has been induced to pardon
    him, and they report the matter to the Blessed One.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Blessed One instructs the Saṅgha to appoint a companion messenger for
    Sudhamma to help ask and obtain the householder’s pardon.
  category: speech
  evidence_refs:
  - ev:7
