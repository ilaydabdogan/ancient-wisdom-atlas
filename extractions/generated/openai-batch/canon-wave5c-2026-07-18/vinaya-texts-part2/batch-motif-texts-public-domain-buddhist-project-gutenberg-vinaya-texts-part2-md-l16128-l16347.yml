canonical_text:
  quote: ''
  summary: 'The passage gives repeated disciplinary cases involving the venerable
    Udayi: after committing and sometimes concealing Saṅghādisesa offences, he reports
    the matter, the Bhikkhus inform the Blessed One, and the Saṅgha is instructed
    to impose probation, Manatta, return to the beginning of a disciplinary term,
    inclusive probation, or rehabilitation according to the stage of the process.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
