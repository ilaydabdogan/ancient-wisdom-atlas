canonical_text:
  quote: ''
  summary: The passage gives Vinaya procedural rules for when a protest in an assembly
    is effectual, when expulsion is duly or unduly pronounced, when restoration after
    expulsion is duly or unduly granted, and when expulsion for refusing to acknowledge,
    atone for, or renounce something is unlawful.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A protest raised in an assembly is described as effectual when notice of the
    protest is given at the meeting under the stated condition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage divides expulsion into duly and unduly pronounced cases when expulsion
    had not previously been pronounced against a person.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Saṅgha pronounces expulsion against a pure, guiltless Bhikkhu, the
    expulsion is described as unduly pronounced.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the Saṅgha pronounces expulsion against an ignorant, unlearned Bhikkhu
    who is a constant offender, cannot discern offences, and lives in lay society,
    the expulsion is described as duly pronounced.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage divides restoration into duly and unduly granted cases when restoration
    had not previously been granted to a person.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Restoration granted by the Saṅgha to a eunuch or to a person who has furtively
    attached himself to the Saṅgha is described as unduly granted.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Bhikkhu may be reproved by the Saṅgha, by a number of Bhikkhus, or by a
    single person and asked whether he sees an offence, should atone for an offence,
    or should renounce a false doctrine.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:8
  text: When there is no offence or false doctrine to acknowledge, atone for, or renounce,
    and the Bhikkhu denies that there is one, expulsion for refusal is called an unlawful
    act.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: When there is an offence and the Bhikkhu says that he sees it, expulsion for
    a pretended refusal to see that offence is called an unlawful act.
  category: relationship
  evidence_refs:
  - ev:10
