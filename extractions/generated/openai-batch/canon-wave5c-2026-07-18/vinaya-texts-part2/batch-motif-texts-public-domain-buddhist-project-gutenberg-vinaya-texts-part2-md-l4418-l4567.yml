canonical_text:
  quote: ''
  summary: The passage first states that failure to understand the Four Noble Truths
    has caused long wandering through transmigration, while grasping them ends craving
    and further birth. It then narrates Ambapali’s visit to the Blessed One, her invitation
    to him and the Bhikkhu fraternity for a meal, her refusal to yield that invitation
    to the Licchavis, the Blessed One’s comparison of the splendid Licchavi company
    to Tavatiṃsa gods, and Ambapali’s later gift of her grove to the monastic fraternity.
    The passage ends by introducing an assembly of distinguished Licchavis praising
    the Buddha, Dhamma, and Saṅgha, with Siha the general present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that not understanding and grasping the Noble Truths of suffering,
    its cause, its cessation, and the path to cessation led the speaker and the Bhikkhus
    to wander long in transmigration.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that the Noble Truths are now understood and grasped, craving
    for existence is rooted out, what leads to renewed existence is destroyed, and
    there is no more birth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ambapali hears that the Blessed One has arrived at Kotigama, prepares magnificent
    vehicles, rides from Vesali, alights when the ground is no longer passable for
    carriages, approaches the Blessed One, salutes him, and sits nearby.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blessed One teaches Ambapali by religious discourse; she asks him to take
    the next day’s meal with her together with the Bhikkhu fraternity, and he consents
    by remaining silent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After understanding that the invitation has been accepted, Ambapali rises,
    salutes the Blessed One, passes around him with her right side toward him, and
    departs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Licchavis of Vesali also prepare magnificent vehicles and travel to visit
    the Blessed One; the passage describes groups of them by dark, fair, red, and
    white colors, with corresponding clothes and ornaments.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ambapali drives up against the young Licchavis, and the passage specifies
    the contact as pole to pole, yoke to yoke, wheel to wheel, and axle to axle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the Licchavis ask Ambapali why she drives against them, she says she
    has invited the Blessed One and the Bhikkhu fraternity for the next day’s meal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Licchavis offer Ambapali a hundred thousand to give up the meal; she refuses,
    saying she would not give it up even if offered all Vesali with its subject territory.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Licchavis snap their fingers and say that they have been outdone and out-reached
    by Ambapali.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Blessed One tells Bhikkhus who have never seen the Tavatiṃsa gods to gaze
    at the company of Licchavis and compare that company to a company of Tavatiṃsa
    gods.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Licchavis invite the Blessed One and the Bhikkhu fraternity to the next
    day’s meal, but he says that he has promised to dine with Ambapali.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Ambapali prepares excellent food in her park and gives Ambapali grove to the
    fraternity of Bhikkhus with the Buddha at its head; the Blessed One accepts the
    Arama.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Many distinguished Licchavis sit assembled in the town-hall and praise the
    Buddha, the Dhamma, and the Saṅgha; Siha, the Licchavi general-in-chief and a
    disciple of the Nigaṇṭha sect, is present.
  category: setting
  evidence_refs:
  - ev:10
