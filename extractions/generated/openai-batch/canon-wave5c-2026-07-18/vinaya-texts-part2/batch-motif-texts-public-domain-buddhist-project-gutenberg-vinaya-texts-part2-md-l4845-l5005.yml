canonical_text:
  quote: ''
  summary: The passage recounts Siha the general receiving teaching, inviting the
    Blessed One and the Bhikkhu fraternity to a meal, public accusations by Niganthas
    that an ox was killed for the meal, Siha’s denial of intentional killing, and
    the Blessed One’s rule against knowingly eating meat killed for that purpose.
    It also recounts the revocation of food allowances previously made during scarcity
    once Vesali has abundant food, and the designation of an outside storage site
    when donors’ provisions are threatened by a storm-cloud.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Siha receives instruction from the Blessed One and invites him and the fraternity
    of Bhikkhus to eat with him the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One accepts Siha’s invitation by remaining silent, and Siha salutes
    him, passes around him with his right side toward him, and departs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Siha orders a man to see whether meat is available and later orders excellent
    food prepared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many Niganthas move through Vesali publicly accusing Siha of killing a great
