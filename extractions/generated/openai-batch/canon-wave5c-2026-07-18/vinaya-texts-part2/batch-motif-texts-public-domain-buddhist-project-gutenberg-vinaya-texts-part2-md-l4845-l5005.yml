  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An unnamed man informs Siha of the accusation, and Siha replies that the Niganthas
    are telling falsehoods and that his group would not intentionally kill a living
    being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Siha serves excellent hard and soft food with his own hands to the Bhikkhu
