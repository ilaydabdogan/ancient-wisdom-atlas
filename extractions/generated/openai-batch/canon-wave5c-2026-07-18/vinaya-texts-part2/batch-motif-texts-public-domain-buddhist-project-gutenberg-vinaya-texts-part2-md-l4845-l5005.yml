  text: Vesali is described as well provided with food, with a good harvest and easy
    alms.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Blessed One reflects that rules allowed during scarcity are still being
    used in a time of abundance and asks Ananda whether the Bhikkhus still use them.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The Blessed One forbids from that day forward several food practices previously
    allowed in scarcity, including eating food kept or cooked indoors and taking picked-up
    food, assigning offences or legal handling for violations.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Country people bring salt, oil, rice, and hard food on carts, form a laager
