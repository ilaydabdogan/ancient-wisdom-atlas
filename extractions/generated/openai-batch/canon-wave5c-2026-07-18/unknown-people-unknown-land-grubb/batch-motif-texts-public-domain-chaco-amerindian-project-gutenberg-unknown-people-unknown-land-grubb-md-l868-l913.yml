  summary: 'The passage recounts dangers connected with entry into the Chaco interior:
    a starving man is killed with clubs; two men survive Ibareta’s River Pilcomayo
    expedition and are guided to safety by an Indian; a later search for Ibareta fails;
    and the narrator is ordered to enter the interior for mission investigation, choosing
    to go without armed protection.'
