canonical_text:
  quote: ''
  summary: The narrator describes how Indigenous people and some Paraguayans interpreted
    his presence and actions, often attributing witch-doctor powers to him. The passage
    lists powers believed of him, including control over weather, sickness, game,
    secrets, the future, and communication with the dead. It also recounts that local
    witch-doctors allegedly plotted against him by magic after he planned a cart-road
    into the interior, while a friend warned him and he proceeded despite the danger.
  language: English
  quote_policy: summarized
