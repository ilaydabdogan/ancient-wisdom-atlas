  quote: ''
  summary: 'The passage describes preparations for a feast: trees are prepared as
    brewing vats, invitations are sent, food is gathered, guests are received, bodies
    are painted and decorated, the Kyiaya/Kyaiyn begins with gourd rattles and wordless
    chants, a ritual dance and jumping sequence is performed around food before eating,
