  summary: The passage recounts a first-person narrator’s attempt to discover and
    expose concealed drinking at Mechi’s village. After a covert inquiry and later
    confrontation, the narrator reports that women and sober men had hidden drinking
    vessels and intoxicated men. The passage then generalizes about efforts to combat
    drunkenness with some government cooperation, and briefly transitions to sickness
    cases governed by witchcraft, including an old woman placed outside while burial
    preparations begin.
