canonical_text:
  quote: ''
  summary: 'The narrator recounts several attempts to disprove local beliefs about
    witch-doctors: a supposedly deadly root eaten safely by a reputed wizard and then
    by the narrator; a claimed charm against bullets refused when tested; a feared
    witch-beetle captured and put in the narrator''s mouth; and a night journey for
    water at a place feared as spirit-haunted. In each case, observers explain the
    narrator''s safety by treating him as a witch-doctor or spirit-scarer rather than
    abandoning the beliefs.'
  language: English
  quote_policy: summarized
