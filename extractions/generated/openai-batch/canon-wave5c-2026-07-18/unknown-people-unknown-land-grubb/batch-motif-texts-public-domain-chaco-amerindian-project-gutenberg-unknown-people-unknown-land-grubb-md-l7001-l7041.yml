canonical_text:
  quote: ''
  summary: The narrator argues against a threatened killing and is permitted to take
    a child away after some support from a young chief and two young men. At the village,
    people refuse to help nurse or feed the child, including the child's sister, and
    forbid the narrator from obtaining goat milk. The narrator gives the child rice-water.
    Villagers then say the narrator cannot stay because the mother's ghost will come
    looking for the child.
  language: English
  quote_policy: summarized
