  text: The narrator vows to leave the country and refuses to associate with men he
    describes as capable of a cruel murder; others answer that he is a stranger with
    no right to interfere.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young chief and two young men support the narrator and say he has powers
    unknown to their people, so he may be able to rear the child and ward off the
    mother's wi'ath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a long argument and the onset of darkness, the group allows the narrator
    to take the child, and he leaves with the child in his arms while the others finish
    funeral rites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the village, men and women abuse the narrator, and the child's sister,
    about eighteen years old, is also abusive toward him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator says the child has had practically no nourishment that day; he
