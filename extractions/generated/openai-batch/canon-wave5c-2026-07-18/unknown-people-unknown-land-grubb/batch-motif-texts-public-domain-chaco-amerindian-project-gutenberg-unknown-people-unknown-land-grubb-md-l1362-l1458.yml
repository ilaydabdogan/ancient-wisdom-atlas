canonical_text:
  quote: ''
  summary: The narrator recounts returning to Riacho Fernandez, learning that Indians
    had stolen goods from an English company store, and deciding to seek restitution.
    Despite warnings, he travels inland with an old Indian guide, confronts the culprits
    at Neantamama, negotiates compensation in skins and feathers, resists demands
    to join only their clan, and returns the compensation to the English company.
  language: English
  quote_policy: summarized
