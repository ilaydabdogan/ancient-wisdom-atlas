  summary: A first-person teacher counsels a pupil about moral weakness, temptation,
    atonement, divine help, and the possibility of living rightly. Years later the
    teacher learns that the pupil, later identified as Philip, resolved on that day
    to follow the advice and became the first convert. The narrator concludes that
    Christian sympathy won him and adds that it is mistaken to think heathen peoples
    lack moral codes or aspiration.
