  summary: Historical account of early European exploration and colonization around
    the Rio de la Plata, Paraguay River, and Chaco; several expeditions seek silver,
    conquest, or subjugation; expedition leaders and missionaries are killed or fail;
    later military and Jesuit activity is noted around the Pilcomayo.
