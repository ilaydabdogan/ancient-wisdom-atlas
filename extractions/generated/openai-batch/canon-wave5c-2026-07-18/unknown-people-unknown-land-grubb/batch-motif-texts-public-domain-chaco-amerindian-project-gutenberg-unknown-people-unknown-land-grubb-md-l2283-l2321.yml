canonical_text:
  quote: ''
  summary: 'The passage describes a swamp-edge village where inhabitants garden, fish,
    hunt waterfowl, eat water-snakes, and warm themselves by fires. It then describes
    an isolated forest village struck by virulent smallpox: sufferers lie helpless
    while vultures wait in nearby trees, relatives grieve and bury the dead in the
    forest, the narrator states that they believe in a dark shade-land rather than
    bodily resurrection, and sick men carry a dead comrade for burial while collapsing
    from exhaustion.'
