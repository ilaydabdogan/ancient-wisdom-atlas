  summary: 'The passage presents a series of rumours and reputed beliefs about Chaco
    tribes and the interior: warnings that explorers would be killed, allegations
    of skull-cups, blood-catching, foot-burning, dragging and heart-removal tortures,
    beliefs that foreigners would not survive, reports of a populous interior town,
    and legends of a horned race.'
