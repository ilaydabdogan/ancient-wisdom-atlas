canonical_text:
  quote: ''
  summary: The narrator, discouraged about forming a mission, meets four known men
    from the west who confirm that his goods are intact and agree to help him return
    inland. After debate in the camp, others also accompany him. The narrator later
    reflects that this meeting enabled the mission's eventual establishment. Subsequently,
    his hut burns, most property is lost, an old woman rescues a powder case from
    the flames, and the narrator temporarily adopts local dress, receives adornment
    and an additional name, and settles at Thlagnasinkinmith, where medical treatment
    of an ill woman gives him prestige despite lingering distrust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator is dispirited, doubts his ability to form a mission, recalls
    earlier Jesuit failures, and contemplates returning to the river.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four men arrive from the west, and the narrator goes to meet them before they
    communicate with the camp people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator recognizes the four men as Yokseyi, another celebrated chief,
    a witch-doctor who had served as guide, and a man who had previously tried to
    steal his goods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visitors report that they have seen the narrator's things in his hut and
    that they are going to the river to barter feathers and skins.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A pipe is passed around, the group smokes briefly in silence, and the four
    visitors agree to return with the narrator and help with his goods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the camp, discussion and angry words follow; Pinse-apawa and some of the
    camp people then agree to go, and the party travels inland, where the narrator
    finds his goods intact.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator states that meeting the four men prevented him from abandoning
    the mission attempt and later connects them and their clan with the first adherents
    to the Christian Church in the interior.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: While preparations are being made at Neantamama for a move to Thlagnasiukinmith,
    the narrator's hut catches fire in dry conditions and most property cannot be
    saved because of heat and smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old woman rushes forward, retrieves a small case of powder from near a
    hut wall, and places it at a safe distance before other powder tins explode and
    the hut collapses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Because his property, including clothes, boots, watch, and other belongings,
    is consumed, the narrator temporarily travels in local fashion with only a blanket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Indians decorate the narrator with necklaces and an ostrich-feather head-dress
    and give him the additional name Tathnawu-lamum, glossed as 'a dandy.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator suffers from insects and lack of boots, receives sheep-skin sandals
    from one Indian, and later receives replacement European clothing.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: At Thlagnasinkinmith, a site is cleared, native-style buildings and two palm
    huts are erected, and gardens are planted.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The narrator still perceives distrust and fear among the natives; his treatment
    of an old woman with fever is followed within hours by apparent improvement and
    increased prestige, and the chief's infant child later falls sick.
  category: sequence
  evidence_refs:
  - ev:9
