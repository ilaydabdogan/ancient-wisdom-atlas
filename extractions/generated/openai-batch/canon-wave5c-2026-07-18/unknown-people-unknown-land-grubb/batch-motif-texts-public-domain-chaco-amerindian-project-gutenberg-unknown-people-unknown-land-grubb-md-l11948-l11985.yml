  quote: ''
  summary: 'The passage argues that the Mission sought to open the land, change native
    customs and laws, and win people as Christian disciples. It reports that after
    twenty-one years of small staffing, the author believes the Lenguas can receive
    Christianity and form a self-supporting missionary Church. It then describes changes
    attributed to the Mission: safer travel for white people, construction of cart-tracks
    for Mission bullock-carts, peace replacing tribal war, and the establishment of
    an English cattle-ranch company employing Indians and Paraguayans in the interior.'
