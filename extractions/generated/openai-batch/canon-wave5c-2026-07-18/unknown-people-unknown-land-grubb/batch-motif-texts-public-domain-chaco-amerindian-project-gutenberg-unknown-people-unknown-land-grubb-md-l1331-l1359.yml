canonical_text:
  quote: ''
  summary: The first-person narrator guards his belongings at night after fearing
    theft; two figures try to reach his baggage and flee when he shouts. The next
    morning he asks the Chief for guides to travel five days west to the war Chief
    Yahoyispuk's village. No one volunteers until a witch-doctor accepts the promise
    of a marked pair of cotton trousers, with payment deferred until the journey is
    completed. They then set off and eventually arrive.
  language: English
