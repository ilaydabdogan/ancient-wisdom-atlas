canonical_text:
  quote: ''
  summary: A first-person narrator describes the death and burial of an old man, Ataiwanam,
    at Thlagwakhe. The villagers invite the narrator to join the burial party and
    ask him to speak at the grave because they believe his words may have power with
    spirits. Afterward, the narrator persuades them not to abandon or destroy the
    village and arranges an exchange to spare the dead man's goats. The villagers
    nevertheless take precautions against the dead man's ghost by moving shelters
    behind the narrator's hut and altering a hut entrance to mislead the ghost. During
    the night, panic erupts after the ghost is reportedly seen entering the narrator's
    hut; villagers accuse the narrator of communicating with the dead and consider
    killing him.
  language: English
  quote_policy: summarized
