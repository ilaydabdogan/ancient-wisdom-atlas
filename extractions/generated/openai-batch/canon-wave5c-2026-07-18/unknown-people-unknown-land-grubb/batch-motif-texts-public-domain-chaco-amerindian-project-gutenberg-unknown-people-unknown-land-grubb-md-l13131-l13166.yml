  summary: Appendix IV introduces outside testimony from unsolicited letters about
    the Paraguayan Chaco Mission. A visitor letter describes a decision to visit the
    South American Missionary Society station while waiting in Villa Concepcion, gives
    the station's Indian name and location near rivers in the Chaco, notes its development
    under Mr. W. Grubb, and describes the visitors' reception by local Indians who
    initially feared white intrusion but then greeted them as expected missionaries.
  language: English
