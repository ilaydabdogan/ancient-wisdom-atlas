  quote: FINAL STRUGGLE OF WITCH-DOCTORS
  summary: The narrator describes returning to an unsettled village, deliberately
    refusing public welcome, gathering information through Philip, and summoning Pinsetawa,
    a leading witch-doctor accused of having impersonated or served as the reported
    “chief ghost” by disturbing Philip’s roof at night. Pinsetawa affirms reports
    of ghosts and devils and says the people were alarmed.
