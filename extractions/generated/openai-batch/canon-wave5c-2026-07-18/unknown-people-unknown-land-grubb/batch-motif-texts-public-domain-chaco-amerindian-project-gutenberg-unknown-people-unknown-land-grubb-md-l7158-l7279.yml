canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of Chaco Indian feasts:
    their social and religious role, seven named or categorized feast types, rites
    for girls and boys coming of age, seasonal celebrations, marriage, funeral, war,
    visitor and hunting feasts, nocturnal feast settings, ritual objects, dance patterns,
    and reported decline or modification of some customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes periodic feasts as important Chaco Indian gatherings
    with both religious and social elements, usually held for special occasions or
    to welcome unexpected visitors.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage enumerates seven feasts or feast categories: Yanmana for a girl’s
    coming of age, Wainkya for a boy’s coming of age, Kyaiya for seasonal points,
    war, marriage, visitor, and funeral feasts.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Yanmana, the girl sits in a specially constructed booth with one or
    two girl companions, is ornamented, adopts the longer skirt of a woman for the
    first time, and is said to cease being a child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Yanmana includes women dancing with canes topped with deer hoofs, an old
    woman chanting and moving in the center, men rattling gourds, and boys in ostrich
    plumes and masks representing evil spirits who are driven off by women when they
    near the girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Wainkya is named from drums beaten by relays of men day and night; the
    drums are made from wet deer-hide stretched over clay pots containing different
    amounts of water, and wrestling is also part of the feast.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the Kyaiya, men alone dance and play games, while a man in the center points
    to the four cardinal points; the passage links the feast to spring, summer, and
    autumn food or harvest occasions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The marriage feast includes a pretended stealing of the bride by the bridegroom,
    hiding outside the village, pursuit by young men who fail to capture him, and
    water poured by women on the returning pursuers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The funeral feast takes place after a month of mourning, aims to cheer the
    bereaved, and is associated with the belief that the departed ghost has hovered
    nearby and will now leave the district.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The war feast features trials of strength and skill intended to rouse the
    people toward courageous deeds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Feasts are also held for arriving guests, successful hunts, or other rejoicing;
    women gather roots, vegetables, and fruits, while men hunt and fish to supply
    food.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Except for the first two feast types, feasts are held at night from sunset
    to sunrise; large fires, palm-leaf torches, body paint, ornaments, and feather
    headdresses are described.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that some feast customs had changed before the author’s
    arrival, with the marriage feast reportedly extinct among the Lenguas and the
    funeral feast practically died out.
  category: other
  evidence_refs:
  - ev:12
