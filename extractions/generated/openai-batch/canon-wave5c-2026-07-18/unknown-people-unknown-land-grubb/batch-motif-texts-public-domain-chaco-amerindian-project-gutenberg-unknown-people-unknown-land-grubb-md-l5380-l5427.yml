canonical_text:
  quote: ''
  summary: 'The passage gives several reported dream episodes: a spirit in horned
    beetle form enters a sleeper and is later extracted by a witch-doctor; a man dreams
    of eating a kala water-fowl and connects this with a taboo affecting his young
    child’s sleep; another man dreams of seeing his aunt’s ghost at a well, frightening
    the village. A caption also describes a Lengua witch-doctor and the caraguata
    plant’s rain-water.'
  language: English
  quote_policy: summarized
