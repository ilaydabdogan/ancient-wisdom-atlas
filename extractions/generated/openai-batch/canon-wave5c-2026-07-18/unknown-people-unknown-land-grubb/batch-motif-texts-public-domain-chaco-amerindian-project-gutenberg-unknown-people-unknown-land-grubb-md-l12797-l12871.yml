  quote: ''
  summary: The passage describes Chaco dry-season collection and nesting behavior
    of lungfish, similar mud-burrow nesting by eels, several frog breeding patterns
    including suspended leaf-and-jelly nests that release tadpoles into pools, and
    locust swarms that darken the sky and strip trees of leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the dry season, lungfish are dug out of the ground with sharp wooden
    stakes; a small breathing hole at the top of the burrow reveals the fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lungfish nest is described as an obliquely slanting tunnel in swamp mud,
    roughly lined with fragments of water-weeds, with eggs placed at the end of the
    burrow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The female lungfish lays eggs and then swims away, taking no further care
    of the offspring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male lungfish lies in the passage leading to the eggs and defends the
    nest with strong teeth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The male lungfish remains in the nest from egg-laying until the young are
    ready to leave, a period of about seven weeks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The eel in the same swamps is described as having similar nesting habits:
    mud-burrow nests and a male that guards the developing eggs.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Frogs are very noticeable in the Chaco, with many species and loud calls on
    wet nights.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: One frog species lays eggs after rain in temporary pools, and the eggs hatch
    within twenty-four hours.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A climbing tree-frog makes a suspended nest from leaves pulled together and
    cemented with gelatinous egg-cases, with jelly plugs forming floor and roof.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tadpoles in the tree-frog nest fall in viscous drops from the softened nest
    into the pool below; one observed nest released over three hundred tadpoles in
    forty-five minutes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A locust swarm first appears like a long reddish dark cloud, then darkens
    the sky, fills the air with wing noise, settles on trees, and strips them of leaves.
  category: sequence
  evidence_refs:
  - ev:9
