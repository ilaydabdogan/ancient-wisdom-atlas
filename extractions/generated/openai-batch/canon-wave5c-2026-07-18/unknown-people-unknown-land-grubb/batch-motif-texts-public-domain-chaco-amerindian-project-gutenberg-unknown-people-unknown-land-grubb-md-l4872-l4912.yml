canonical_text:
  quote: ''
  summary: The passage describes kilyikhama as beings distinct from humans and says
    the author has partially equated the term with fallen angels. It then describes
    the shade-world, where departed human souls continue their earthly form, character,
    status, kinship, and tribal life in disembodied form. A murdered infant’s spirit
    is said to remain a child and not be feared. A murderer of someone from his own
    tribe is executed, his body burned, and ashes scattered; this prevents his spirit
    from taking human form and excludes it from ordinary spirit society. Departed
    souls continue activities such as hunting, travel, and gardening in spiritual
    form.
  language: English
