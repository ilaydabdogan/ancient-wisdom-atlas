canonical_text:
  quote: ''
  summary: A first-person narrator reports that an old wizard or witch-doctor spread
    a false supernatural account of a river-crossing incident. The passage then describes
    a travel party leaving a settlement, packing goods, riding and walking through
    dry terrain, hunters providing game, women and the narrator extracting water from
    thorny caraguata plants, communal cooking at camp fires, a later search for foul
    water near a dry stream bed, and a captioned image of honey extraction from a
    tree using smoke.
  language: English
  quote_policy: summarized
