  summary: 'An ethnographic prose passage describes warfare among Chaco peoples: historical
    conflicts with Guarani, Spanish settlements, Paraguayan troops, and neighboring
    tribes; an account of fighters sacrificing themselves in a cavalry encounter;
    captive-taking; causes of inter-tribal war; and a mobilization procedure using
    red arrows that signify blood.'
