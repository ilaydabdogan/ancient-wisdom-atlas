canonical_text:
  quote: ''
  summary: 'The passage describes practical medical knowledge attributed to wizards
    or witch-doctors, including plant medicines, snake-bite treatments, massage, wound
    treatment, and prognosis. It then describes burial rites: a sunset funeral, preparation
    and carrying of the body to the forest, seated placement in a grave, the belief
    that death is caused by kilyikhama or hostile wizardry, the wizard''s diagnosis
    of the bodily location of the cause of death, and the removal and neglect of a
    dying person once recovery is considered impossible.'
  language: English
  quote_policy: summarized
