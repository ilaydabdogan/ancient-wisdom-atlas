  summary: 'The passage describes warfare tactics attributed to the Indians: intelligence
    gathering, messengers, night advances, pre-dawn attacks, assigned duties after
    victory, use of cover and mobility, treatment of captives, and a detailed account
    of an attack on a Kisapang village using terrain, canoes, and ambush positions.'
  language: English
