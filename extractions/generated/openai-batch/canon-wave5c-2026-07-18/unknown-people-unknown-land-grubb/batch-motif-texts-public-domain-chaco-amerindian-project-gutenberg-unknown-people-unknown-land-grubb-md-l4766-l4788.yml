canonical_text:
  quote: ''
  summary: The passage describes a reported belief that the hereafter contains only
    slight pleasure and pain, making future life unattractive; life is coveted and
    death feared. It further says the Creator is believed not to take interest in
    human affairs and receives no worship, while people try to avoid consequences
    of wrongdoing and ward off malignant kilyiJchama. The passage also notes ordinary
    social affections and a desire to satisfy desires without trouble.
  language: ''
