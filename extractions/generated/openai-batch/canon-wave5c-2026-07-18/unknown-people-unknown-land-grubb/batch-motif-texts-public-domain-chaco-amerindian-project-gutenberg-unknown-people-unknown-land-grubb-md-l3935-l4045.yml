canonical_text:
  quote: ''
  summary: 'During travel, the narrator describes a marriage arrangement, a naming
    custom tied to childbirth, and a night camp around a fire. An older man making
    fire-sticks tells a tradition explaining the origin of fire: in early times people
    ate raw food until a hunter discovered a bird using hot sticks to cook snails
    near a swamp and tree. The hunter took the fire-sticks to his village, where people
    kept the fire alive and cooked for the first time. The bird, unable to make more
    fire, became angry and created thunder and lightning as revenge; thunder is explained
    as the thunder-bird’s continuing anger. The passage also includes a description
    of contemporary fire-making by friction and the narrator’s comment that the people
    can make fire and are not especially afraid of storms.'
  language: English
  quote_policy: summarized
