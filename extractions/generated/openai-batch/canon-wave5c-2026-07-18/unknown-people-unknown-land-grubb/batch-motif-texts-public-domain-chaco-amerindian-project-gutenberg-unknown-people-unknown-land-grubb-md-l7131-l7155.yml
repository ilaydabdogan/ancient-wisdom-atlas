  quote: baptized it just before death by the name of Hope
  summary: A narrator reports that a rescued little child’s sister asked him to bring
    the child back into her care. The child died about six months later; before death
    she was baptized with the name Hope and then buried in the Chaco on the banks
    of the Paraguay. The narrator regrets the death, saying that if she had lived
    she might have helped save other motherless children, but her death convinced
    the Indians that similar rescue attempts were futile and that their own method
    of disposing of motherless children was best.
