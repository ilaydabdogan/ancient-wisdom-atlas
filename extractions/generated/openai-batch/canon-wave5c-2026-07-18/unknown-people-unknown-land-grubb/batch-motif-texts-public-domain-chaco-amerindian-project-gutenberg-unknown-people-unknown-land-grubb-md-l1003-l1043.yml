canonical_text:
  quote: ''
  summary: 'The narrator explains a strategy for entering and working among the local
    Indigenous people: he plans to project superiority and authority, avoid signs
    of fear, avoid gaining favor through gifts, and respect local customs only where
    they do not obstruct his plans. He expects witch-doctors or wizards to oppose
    the mission, describes them as feared by chiefs and people, and decides to confront
    their threats and claimed powers openly. He hopes the people will regard him as
    superior to the wizards and as able to impart knowledge that the witch-doctors
    lack.'
