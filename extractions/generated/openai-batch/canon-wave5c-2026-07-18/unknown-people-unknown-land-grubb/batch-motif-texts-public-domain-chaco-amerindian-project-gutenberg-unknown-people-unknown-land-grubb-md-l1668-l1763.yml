canonical_text:
  quote: ''
  summary: The narrator recounts a child's death and the father's suspicion, a suspected
    poisoning of the narrator's tea kettle, a conflict over sending men to fetch provisions,
    a chief's threat of punishment, the submission of a resistant young man, and a
    later episode in which Pinse-apawa detects alcohol in the narrator's medicinal
    quinine mixture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child with acute bronchial pneumonia died after the narrator judged it beyond
    hope of recovery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child's father believed the narrator could have saved the child and referred
    to an earlier case involving an old woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator later found unidentified plant leaves floating in a boiling kettle
    that served as his teapot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people questioned about the leaves denied knowing anything about them
    or what plant they were.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After finding the leaves, the narrator cleaned and refilled the kettle and
    stayed beside it until his tea was made.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator needed provisions from the river and selected men to carry loads;
    all obeyed except Kyitkuk-paisiam.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kyitkuk-paisiam objected to going, asked what he would receive, and complained
    that the journey and burdens would be difficult.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator publicly mocked Kyitkuk-paisiam as a girl and told him to weave
    blankets, after which he went away angry and sulking.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A chief asked why the narrator did not beat Kyitkuk-paisiam and then threatened
    to beat him with a stick if he spoke that way again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator states that the chief was among the few who still claimed a right
    to corporal punishment and that broader chiefly authority had declined.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kyitkuk-paisiam later came to the narrator fully armed and defiant, but then
    said he would follow the men and bring out the narrator's goods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator says he opposed the people's use of foreign liquor and avoided
    it himself.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Pinse-apawa entered while the narrator was drinking a quinine mixture containing
    a small amount of alcohol and said it smelled like foreign liquor.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The narrator motioned Pinse-apawa to be silent and offered him some of the
    mixture if he promised not to tell the others.
  category: action
  evidence_refs:
  - ev:11
