  summary: In a memoir episode headed “A Murderous Attack,” the narrator explains
    that local people misunderstood his furlough to England as a permanent departure.
    Poit, entrusted with cattle and goods, concluded the narrator would not return,
    treated the property as his own, and tried to conceal the shortage when the narrator
    returned in autumn. A caption identifies W. Barbrooke Grubb and says the photograph
    was taken shortly after Poit’s attempt to murder him.
