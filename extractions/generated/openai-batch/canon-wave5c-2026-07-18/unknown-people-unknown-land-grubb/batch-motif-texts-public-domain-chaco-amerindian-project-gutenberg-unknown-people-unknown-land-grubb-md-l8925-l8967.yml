canonical_text:
  quote: ''
  summary: The narrator describes efforts to gain Indigenous trust through acts of
    goodwill, such as yielding horses to fatigued people and sharing blankets, while
    also arguing that love must be combined with strictness and justice. In a swamp-crossing
    episode, the narrator dismounts so a woman with two children can ride and then
    urges younger mounted companions to do the same for weaker relatives and friends.
  language: English
