canonical_text:
  quote: "“He won’t recover, he will die. You are killing him.”"
  summary: A missionary narrator describes rising hostility during a boy’s illness.
    Local opponents blame the missionaries for keeping and treating the boy, accuse
    them of killing another chief and trying to kill the sick boy, and send a deputation
    of ten men to demand that the boy be taken to the village for their own treatment.
    The narrator and companions refuse, and the deputation threatens further trouble
    through the boy’s father and a larger party.
  language: English
