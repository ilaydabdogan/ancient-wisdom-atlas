canonical_text:
  quote: ''
  summary: The passage describes funeral rites said to vary by circumstances of death
    while retaining fixed purification, graveside words, plants, and grave posture.
    It details destructive rites, body interventions, objects placed in wounds, beliefs
    that heated stones and an armadillo claw seek the person responsible for the death
    or trouble, burial facing west toward an afterlife abode, graveside questioning
    or attestation, and punishment of a man whose statement appeared to cast doubt
    on a burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rites vary according to circumstances of death, but the purification ceremony,
    graveside words, plants laid on the grave, and body position are described as
    unvarying.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Burning the village and destroying the deceased person's property are described
    as customary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some cases hot embers are placed beneath the corpse's feet and on the head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the trouble is located in the head, the skull is battered with clubs
    after burial; when located near the heart, arrows may be shot into it or a stake
    may pin the body to the side of the grave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In dropsy cases, the body is shot at, a bunch of herbs is held by the burial
    conductor, then burned, and each burial participant swallows some smoke.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A common rite involves cutting open the side and inserting heated stones,
    an armadillo claw, dog bones, and sometimes red ants into the wound before closing
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rite of inserting objects is said to be efficacious only before actual
    death or immediately after death, while the spirit is still supposed to be near
    the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The heated stones are believed to receive knowledge from the soul of the dying
    or dead person about the originator of the trouble.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The stones are believed to ascend into the Milky Way and later descend as
    shooting stars upon the author of the evil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Indians are described as frightened by falling stars because they fear
    vengeance for evils they may have caused.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The armadillo claw is believed to burrow underground, find the culpable wizard,
    enter into him, and destroy him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author states that the parts played by the dog's bones and red ants cannot
    be interpreted.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the rites, the body is placed in the grave seated and facing west.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The western-facing burial posture is linked by the author to the idea that
    the future home of the people lies westward in cities of the dead.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the grave is filled, plants including some aloe-like plants are laid
    above it, and officiants stand around the grave while the leader points to each
    person and appears to ask a question that others answer.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A man who had attended a woman's burial later said he had seen her; her relations
    killed him, and this was not counted as murder.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The author infers that the man's statement offended because it appeared to
    question the woman's death and burial and the proper performance of required rites.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
