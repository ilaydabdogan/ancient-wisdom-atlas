  quote: ''
  summary: The narrator recounts surviving an arrow wound attributed to Poit, reviving
    himself in river water, extracting the arrow-head, concealing his tracks, reaching
    a path, lying under an algaroba tree expecting death, being found and taken to
    a village, receiving care, accidentally drinking water mixed with blood washed
    from his shirt, and fearing burial alive when villagers speak of his likely death.
  language: English
  quote_policy: summarized
