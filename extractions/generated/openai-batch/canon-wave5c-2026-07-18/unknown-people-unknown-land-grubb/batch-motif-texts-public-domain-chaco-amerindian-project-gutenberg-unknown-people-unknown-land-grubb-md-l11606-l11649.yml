canonical_text:
  quote: ''
  summary: The first-person narrator taunts a figure called “The Father of Cats,”
    then questions a village witch-doctor and the Chief's son about their absence
    during a disturbance. The narrator uses a snake-and-fire simile to accuse them
    of evasion. An Orator with inflamed eyes asks for medicine; the narrator sarcastically
    denies medical competence and challenges the Orator's witch-doctor status, though
    a staff member later treats his eyes. The narrator then gathers local people and
    sets compensation or labor penalties for those who disturbed the peace.
  language: English
