canonical_text:
  quote: ''
  summary: The narrator explains Poit's alleged motives and actions after misusing
    entrusted property. The account links Poit's fear of being called to account with
    a reported dream in which the narrator accused and shot him. The passage describes
    beliefs about dreams, weapon use after killing or witchcraft rites, hidden medical
    remedies, substitution of iron-headed arrows for the dreamed gun, isolation from
    carriers, and a planned jaguar-attack explanation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Poit expected the narrator not to return, killed some entrusted cows, disposed
    of goods in his care, and sought influence among his people and chiefly status.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's return from furlough dismayed Poit because he would have to
    account for his stewardship; the narrator says Poit was later proved to have stolen
    mission money and Professor Graham Kerr's gun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that local Indigenous people place strong trust in dreams
    and allow dreams to control actions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: According to the passage, Poit had related a dream in which the narrator met
    him in an open forest space, accused him of misappropriating property, and shot
    him with a gun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Poit interpreted the dream as a clear warning and, in the narrator's account,
    sought to reverse the dreamed outcome by dealing with the narrator as the dream
    showed the narrator dealing with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states that a weapon used in certain witchcraft rites or in taking
    a man's life must not afterward be used for another purpose, and gives this as
    the reason Poit stole a gun rather than use his own or a borrowed one.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After attention was raised over the lost gun, Poit abandoned it where another
    Indigenous person might find it, while trying to maintain an appearance of friendship
    and fidelity toward the narrator.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator says Poit needed to separate him from carriers because additional
    witnesses would make the secret more likely to be discovered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Poit hid the narrator's medical stores by the roadside because he believed
    in the potency of the remedies the narrator carried.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the last village where Poit and the narrator spent a night together, Poit
    exchanged wooden-headed arrows for iron-headed arrows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrator reports a belief that if the dreamed proper article cannot be
    obtained, the nearest equivalent should be used; in this case an iron-headed arrow
    served as the nearest equivalent to the dreamed gun.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator says Poit preplanned a jaguar-attack story and selected a road
    leading to a place similar to the dream setting, also described as a jaguar quarter
    and unlikely to be visited by wandering Indigenous people.
  category: setting
  evidence_refs:
  - ev:9
