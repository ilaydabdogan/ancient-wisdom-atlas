canonical_text:
  quote: ''
  summary: The narrator describes an incident in which meat blamed on a dog is found
    in a man's blanket, then generalizes about lying to protect friends, exaggerated
    false confessions under pressure, honesty, debt repayment, respect for reserved
    resources, unattended property in deserted villages, and perceived kindness among
    the Lengua/Indian people as observed by the narrator.
  language: English
  quote_policy: summarized
