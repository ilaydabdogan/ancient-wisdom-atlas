canonical_text:
  quote: ''
  summary: A hunting passage describes a camouflaged pit trap, then recounts a hunter
    who climbs a hollow tree for honey and is trapped between a jaguar below and wasps
    above until companions kill the jaguar with arrows. The men take the jaguar skin
    and fat, eat the fat by fires, joke about the incident, and the passage closes
    by noting the practical importance of hunting for food.
