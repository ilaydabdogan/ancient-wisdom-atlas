canonical_text:
  quote: ''
  summary: The narrator describes an earlier instance in which an unnamed party obeyed
    and approved a kind action. He then recounts employing men from a western village
    under an agreement of food in exchange for work. A young Chief refuses to work
    but attempts to eat with the others. The narrator invokes his teaching that able-bodied
    men should earn their living, removes the Chief from the pot, and overturns the
    food when the other men hesitate to eat without him. The men later resume work
    and eat quietly; the Chief leaves angrily. The Indians acknowledge the justice
    of the work-for-food arrangement and the narrator reports no further trouble on
    that issue.
  language: English
