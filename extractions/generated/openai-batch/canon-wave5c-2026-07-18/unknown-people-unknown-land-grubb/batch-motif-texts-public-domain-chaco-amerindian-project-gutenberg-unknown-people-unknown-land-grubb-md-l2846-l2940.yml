  text: Wooden ear-discs are worn as ornaments, chiefly by men.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children’s ear lobes may be pierced at varying ages with a thorn or bone needle,
    with grass or a thin stick inserted to keep the wound open.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ear-discs are enlarged with age; when removed, the stretched lobe may hang
    nearly to the shoulder, and the gap may be filled with palm-leaf or tied hair.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Witch-doctors decorate ear-discs with polished tin shaped as stars or crosses,
    and some use imported mirror pieces on the discs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Witch-doctors profess to see the shadow of a spirit passing out from or entering
    into the person on whom they are operating.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: Armlets are made from lamb’s skin with wool or from coils of yellow palm-leaf
    and are wound round the biceps.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Feather anklets are made from rhea wing feathers bound on a string, often
    dyed pale pink, and worn as ornaments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Feather anklets are considered a safeguard against snake-bite because the
    snake may strike the feathers rather than flesh.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pottery vessels, including water-jars, cooking-pots, and shallow dishes, are
