  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pots are made without a wheel by adding rolls of clay to a base and smoothing
    them with a freshwater mussel shell dipped in water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Completed pottery is sun-dried, fired with fuel piled around it, left unglazed,
    and marked while hot with quills, palo santo chips, and gums.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some broken old pottery bears thumb-like scorings that are said to be the
    work of spirits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Pipe bowls may be clay or wood, and wooden bowls may be carved as figures
