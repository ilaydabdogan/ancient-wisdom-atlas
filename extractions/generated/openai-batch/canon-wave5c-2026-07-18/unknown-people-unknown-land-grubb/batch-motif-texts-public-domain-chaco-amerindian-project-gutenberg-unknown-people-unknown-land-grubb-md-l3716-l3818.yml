canonical_text:
  quote: ''
  summary: A first-person travel account describes severe storm travel, flooded huts,
    ants, spoiled stores, a local community relocating after a death because they
    feared the dead man's spirit, and a later night river crossing where a witch-doctor
    says dogs refused the water because they saw a devil at the crossing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator, Mr. Grubb, and an Indian travel on horseback through lightning,
    rain, darkness, and flooded ground to reach the toldo at midnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The huts are flooded, and ants swarm over the travellers and sting them when
    they enter the larger hut.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rain continues for a week, wet clothing and baggage cannot be dried, stores
    are spoiled, and food is short.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On arriving at the station, the narrator finds no Indians there, notices fires
    near the forest, and later receives Indians bringing live fire-brands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Indians have burned their booths and retreated to the forest because a
    man died and they fear his spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Indians urge the narrator and companion to sleep at their village, but
    the narrator says they prefer to stay and have no fear of the dead man's ghost.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the morning, Pinse-apawa is surprised that the narrator and companion are
    unharmed and have slept despite the belief that the dead man's ghost is prowling
    nearby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrator escorts the Archdeacon to the river, riding an Indian horse bareback
    with a simple bridle arrangement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: On a later return journey at night, an old witch-doctor and his son accompany
    the narrator near the head waters of the River Fernandez and suggest another ford.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the crossing, two dogs refuse to follow the narrator into the water; after
    crossing, the companions ride quickly into the forest, and the narrator becomes
    unable to tell where he is.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The witch-doctor says there was a devil at the crossing, that the dogs had
    seen it, and that this explained their refusal to enter the water.
  category: speech
  evidence_refs:
  - ev:9
