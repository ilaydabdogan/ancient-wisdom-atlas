  summary: The passage describes Lengua clothing, raw-hide equipment, and personal
    ornaments, including blankets, hunting girdles, sandals, bags, tobacco pouches,
    feathered head-dresses, shell-button necklaces used as money, and necklaces made
    from seeds, bones, shells, or sheep teeth. One red feathered head-dress is described
    as a charm against the evil spirit of the swamps.
