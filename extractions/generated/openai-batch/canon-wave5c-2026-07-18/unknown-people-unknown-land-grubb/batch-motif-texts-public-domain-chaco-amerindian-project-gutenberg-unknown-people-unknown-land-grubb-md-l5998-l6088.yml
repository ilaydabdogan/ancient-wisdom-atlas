canonical_text:
  quote: ''
  summary: The passage describes wizards or witch-doctors as weather arrangers, forecasters,
    storm-raisers, crop specialists, ghost-layers, spirit-exorcists, and handlers
    of alleged possession. It repeatedly presents their ritual claims alongside observation,
    calculation, or the narrator's skeptical interventions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wizard is said to arrange weather for his clansmen, especially rain, and
    delays firm predictions until weather signs make success likely.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wizard's chief rain charm is killing a certain kind of duck and sprinkling
    its blood upward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wizards observe plants, animals, the sky, and other phenomena to reach conclusions
    about local events.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wizards calculated the return of bullock-carts using watering places, road
    conditions, drivers, bullocks, loads, and departure dates; their predictions failed
    or became erroneous when information was withheld.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sorcerers are held to be able to raise storms, and one man was reported to
    have caused disastrous rains.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator challenged the storm-raiser claim by noting that the alleged
    maker of the storm suffered hut damage and garden loss from it; the listeners
    accepted the point as reasonable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When recourse to a garden spirit has failed, the witch-doctor may examine
    a crop, attribute a poor crop to an evil spirit, or spit on a promising crop and
    assure people of a good harvest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chief duties of the witch-doctor include laying ghosts, driving off spirits,
    exorcising kilyikhama in possession cases, assisting wandering souls back to bodies,
    and recognizing spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a ghost is thought to haunt a village, the wizard and assistants may
    chant for about an hour to induce the restless being to leave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In an alleged possession case, a woman lay on the ground and threw herself
    about violently while four men held her limbs and the wizard bent over her trying
    to drive out spirits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator treated the woman with strong liquid ammonia applied to her nose
    on a handkerchief, producing an immediate effect and astonishing the people.
  category: sequence
  evidence_refs:
  - ev:7
