  quote: ''
  summary: The narrator describes suspicion that a reported hostile threat from the
    Kisapang was a pretext. The local men fire warning shots, later return with three
    deer and no sign of enemies, and then are made to return unused ammunition. When
    the amount is short, the narrator accuses them of using the ammunition on deer,
    demands the hides as compensation, and says they admit the stratagem failed.
