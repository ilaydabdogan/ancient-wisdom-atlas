  summary: The passage summarizes historical expeditions and missionary attempts in
    the Pilcomayo/Chaco region, including river ascents, forced retreats after Indigenous
    attacks or threats, Crevaux's ambushed expedition with one boy survivor, an 1883
    armed expedition, later steamer expeditions halted by lack of water, and Jesuit
    efforts among Chaco tribes.
