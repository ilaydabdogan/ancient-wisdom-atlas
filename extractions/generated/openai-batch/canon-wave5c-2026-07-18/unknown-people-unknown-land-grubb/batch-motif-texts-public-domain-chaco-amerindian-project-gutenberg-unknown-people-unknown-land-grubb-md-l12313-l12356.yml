literal_observations:
- id: obs:1
  text: Padre Patino penetrated far up the river in 1721 but retreated after an attack
    by Toba Indians in which he lost several men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Padre Castanares later made a similar journey up the Pilcomayo with a similar
    result, and Don Felix De Azara ascended the river for a short distance in 1785.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expeditions of Magarinos and v. Nivel attempted to descend the river from
    Bolivia in 1843-44 but were forced to return because large numbers of hostile
    Indians menaced them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Crevaux began from Tarija in February 1882 with fourteen companions and encountered
    Indians who appeared friendly enough that he reportedly removed the strikers from
    his men's rifle locks to prevent firing from alarming them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: On April 27, Crevaux's party was ambushed while marching in single file; the
    party was clubbed to death, and only one boy survived to tell the story.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The 1883 Bolivian expedition consisted of nearly two hundred well-armed men,
    accompanied by Dr. Thouar, and reached the River Paraguay after privations and
    a battle with eight hundred Indians.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Later Pilcomayo expeditions by Thouar, Fontana, Feilberg, and Storm used steamers,
    penetrated varying distances up the river, and were eventually halted by want
    of water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The expedition under Olaf Storm entered the Pilcomayo on January 1, 1890,
    left in autumn of the same year, and is described as the most fruitful in results.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jesuits, including Dobrizhoffer and his companions, made an attempt to reduce
    some Chaco tribes during 1749-67.
  category: action
  evidence_refs:
  - ev:8
