  summary: The passage closes a section on a rebellion associated with witchcraft
    and states that many ringleaders later became Christians. It then introduces a
    chapter reflecting on mission work, arguing that conversion cannot be compelled,
    that missionary teaching and education alter Indigenous views of life, weaken
    old fears and customs, and produce a difficult transition between old and new
    beliefs. The author describes the Chaco Mission as shaking former customs and
    public opinion, with some people following the new course and many others left
    uncertain or careless. The passage also notes that contact with Europeans whose
    conduct appears morally inferior undermines respect for Europeans and creates
    obstacles for missionary work. A caption identifies a Hathpang-Lengua one-stringed
    fiddle with a bow.
