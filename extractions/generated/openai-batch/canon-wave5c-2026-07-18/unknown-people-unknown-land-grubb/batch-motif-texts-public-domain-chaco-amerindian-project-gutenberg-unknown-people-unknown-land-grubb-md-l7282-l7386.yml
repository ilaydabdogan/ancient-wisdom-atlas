canonical_text:
  quote: ''
  summary: The narrator describes night-time Indian feasts, especially a Kyaiya planned
    at a Chaco village in December 1892. The passage gives the night setting, village
    environment, the narrator’s stay with a witch-doctor, a captioned description
    of a masked dance at a Yanmana feast, and communal planning for a Kyaiya involving
    food gathering, fishing, hunting, and joking speech.
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that night is always selected for these celebrations and
    connects night with heat avoidance, concealment, witchcraft after sunset, religious
    character, and visual effect from camp-fires and moonlight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator selects a Kyaiya held in Chaco midsummer, December 1892, at Kilmesakthlapomaap,
    about one hundred miles by road from the River Paraguay and the nearest point
    of civilization.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The village is described as an open space shaded by large algaroba trees,
    facing north, with a swampy stream, woods, and tall palm trees to the south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator stays as guest of the witch-doctor Waitkyaingwahik, called “Cow-nose,”
    and sleeps in his booth with a deer-skin, palm-log pillow, blanket, and mosquito-net.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A caption describes the “Sowalach” as a dance of the Yanmana feast performed
    by lads who issue from the forest feathered and masked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the “Sowalach” description, the dancers move in a serpentine formation,
    and women protect the honored girl by dancing around her, chanting loudly, and
    often douching the lads with gourds of water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes wrestling contests in which throwing is chiefly done
    by manipulation of legs and feet, and one form involves a line of about twenty-five
    men gripping belts while another group attempts to break the line.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One night, villagers discuss whether to hold a Kyaiya because algaroba beans,
    fish, palm-cabbages, and deer are available.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Young lads begin practising for the dance, girls laugh, and men with a few
    older women discuss feast details in groups.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The committee assigns women to collect algaroba beans and palm-cabbage, older
    men to fish, and younger men to hunt game.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When asked what he will hunt, the narrator says he will kill the sheep, prompting
    jokes from others about dangerous sheep and his need to escape them.
  category: speech
  evidence_refs:
  - ev:10
