literal_observations:
- id: obs:1
  text: The loom is made from two upright forked branches, an upper cross-pole, and
    a lower pole near the ground, with a hole often scooped for the yarn ball to pass.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman sits on the ground and passes a ball of wool over the top pole, catches
    it, passes it under the lower pole, and repeats this until the warp is complete.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Loops of wool and a fine cane are used to separate alternate warp strands,
    and a smooth pointed stick battens the woof thread into place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Blanket patterns include checks, circles, angles, jabiru-leg designs, and
    designs imitating snakes’ skins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Districts have distinctive patterns or colors, and a visitor’s locality can
    be recognized by his blanket.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Woollen waist-belts, satchels, head-bands, bracelets, and sleeveless shirts
    in an adjoining tribe are woven on a smaller loom.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Suhin and Toothli tribes in the Western Chaco are noted for fine-textured
    blankets, which are difficult to procure and may be exchanged for a mare or a
    gun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cotton is seldom used by the Lenguas as a substitute for wool, but is more
    common among tribes farther west and north.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: String is obtained from caraguata plant fibers and made into satchels, net-bags,
    waist-bags, and hammocks; the fiber is stripped, tied in bunches, and dried in
    the sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Spinning is done on the naked thigh, and the number of strands varies according
    to the intended strength or purpose of the thread.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dyed string carries varied and intricate patterns, and close, raised, ribbed
    sleeveless shirts worn in the West serve as armor against slanting arrow-heads.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bone and hard-wood needles are used in bag-making, while netting is done without
    a mesh-stick, using finger and thumb instead.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Both sexes make string, but the manufacture of blankets and other articles
    is described as women’s work.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A woman’s ordinary garment is a skin petticoat, with a large skin mantle used
    in very cold weather; materials include nutria, sheep, small deer, fox, goat,
    and sheep skins.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Skin garments are made by scraping off hair, softening folds with a sharp
    snail-shell, rubbing surfaces together, applying wood-ashes and water, sewing
    hides together, and painting fringed ends red.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Women make their own, their husbands’, and their children’s garments, and
    a large blanket can take four months to complete alongside other daily duties.
  category: relationship
  evidence_refs:
  - ev:10
