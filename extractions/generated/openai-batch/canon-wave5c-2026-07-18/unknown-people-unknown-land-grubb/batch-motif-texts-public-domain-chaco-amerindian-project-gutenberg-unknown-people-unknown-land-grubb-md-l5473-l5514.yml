canonical_text:
  quote: ''
  summary: The passage first connects a man's troubling dream with remembered wrongdoing
    over a marriage matter. It then describes a belief that during dreams the soul
    may wander from the body and face danger. A reported dream tells of a man's spirit
    being seized by a gigantic kilyikhama near the village, a smaller kilyikhama running
    toward the body, and the soul escaping at the edge of a forest and returning to
    the village. The passage further states that a kilyikhama may enter the abandoned
    body, while the displaced soul waits for a witch-doctor's chant announcing the
    usurping spirit's expulsion and safe return. The narrator adds that the body's
    life continues during the soul's dream absence and describes this as a body-mind-spirit
    combination.
  language: English
  quote_policy: summarized
