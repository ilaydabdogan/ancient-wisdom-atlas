canonical_text:
  quote: ''
  summary: The passage describes a group as courageous when facing known dangers in
    hunting or combat but fearful of unknown danger. It then gives an anecdote in
    which the narrator, robbed of grease, asks a village Chief for help; the Chief
    reports a dog was seen with grease, but the Chief's son publicly denies this and
    implicates his father. The passage closes by describing superstitious fear and
    jealousy as strong social traits.
