  summary: The passage describes religious instruction requiring orderly conduct,
    an elderly man who smokes during discourse and tries to conceal it under a blanket,
    his remark that he did not think the Spirit would see him, and later language
    misunderstandings in which station Indians learn English expressions, including
    an elderly man's use of “Good-night” instead of “Amen” at the end of prayer.
