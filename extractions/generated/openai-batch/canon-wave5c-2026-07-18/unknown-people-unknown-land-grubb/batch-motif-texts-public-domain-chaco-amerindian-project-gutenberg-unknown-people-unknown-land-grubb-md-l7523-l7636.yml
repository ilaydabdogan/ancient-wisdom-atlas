    with the dance chant and merriment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At sunrise, gourds were held aloft and rattled vigorously to signify that
    festivities were over until the following evening.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After sunrise, tired participants selected shady places, often under trees,
