  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some young men engaged in wrestling contests and other dances while the Kyaiya
    continued steadily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Maning dance, dancers formed a circle with arms interlaced around waists;
    girls joined behind by holding waist-belts, and the chant and step gradually became
