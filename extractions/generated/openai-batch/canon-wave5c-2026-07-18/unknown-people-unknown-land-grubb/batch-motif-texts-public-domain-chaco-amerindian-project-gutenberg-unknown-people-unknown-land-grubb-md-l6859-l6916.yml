canonical_text:
  quote: ''
  summary: The passage describes mourning rites after death, including black face
    paint, hair cropping, seclusion, impurity, hot-water purification, a fire-circle
    with singing and dragonfly impersonation, and return to village life. It also
    describes reduced or absent rites for snake-bite deaths, infanticide, and executed
    murderers; taboo on naming the dead; procedures when burial is delayed; and an
    example of an old woman subjected to a stone or mutilation rite before she was
    actually dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near relatives mourn by painting the face black with charcoal streaks representing
    tear courses, cropping the hair short, covering the head, and wailing during the
    first night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mourners enter the new village muffled, live apart for a month, eat alone,
    do not share the common pot, and are considered unclean until the mourning period
    ends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the end of mourning, the bereaved undergo purification with hot water,
    after which the funeral feast begins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bereaved stand outside their hut and wail while a fire is made; friends
    join them, stand around, and sing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: All circle the fire while singing, and boys dressed as dragonflies perform
    antics that cause merriment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the fire-circle and dragonfly performance, purification is complete,
    mourning ends, and the bereaved are allowed to re-enter common village life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In deaths from snake-bite, only ordinary rites are observed.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: In cases of infanticide, the child is simply buried without rites and without
    mourning beyond the mother's death-wail.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: An executed murderer is not mourned; ashes from the funeral pyre are scattered
    to the four winds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The instruments used in an execution are shown blood-stained to the murdered
    person's relatives to prove vengeance, then buried because they can never be used
    again.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The name of a dead person is never mentioned; if reference is necessary, the
    person is called “he who was.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: If death occurs too late for burial that night, rites considered necessary
    may be performed at once, and the body is carried some distance from the village
    until burial the next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the illustrative case, an old woman was carried away for a stone rite,
    left overnight, and later found away from where she had been placed, with ground
    torn up and finger-tips lacerated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The narrator states that the old woman could not have been dead when the mutilation
    rites were carried out and describes her as left alone at night with pain and
    supernatural fears.
  category: other
  evidence_refs:
  - ev:8
