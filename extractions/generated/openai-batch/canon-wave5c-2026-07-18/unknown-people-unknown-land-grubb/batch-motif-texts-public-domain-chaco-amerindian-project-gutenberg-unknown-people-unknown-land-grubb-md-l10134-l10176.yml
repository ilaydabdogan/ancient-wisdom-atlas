canonical_text:
  quote: "“I still had no suspicions that he was playing me false”"
  summary: The narrator travels with Poit while Indian carriers fail to arrive. Poit
    appears unusually preoccupied, suggests explanations for the carriers’ absence,
    guides the narrator toward Makthlatimes, and later proposes that the carriers
    deserted because they feared trouble connected with the trip to Toothli country.
    The narrator accepts this as possible and remains pleased with Poit’s loyalty,
    without suspecting deceit.
