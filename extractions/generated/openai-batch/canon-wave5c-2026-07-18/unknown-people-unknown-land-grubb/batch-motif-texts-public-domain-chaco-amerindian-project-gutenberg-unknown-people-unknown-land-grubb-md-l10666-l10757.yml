canonical_text:
  quote: ''
  summary: The narrator, weakened by a wound and suspicious of danger, leaves the
    wood and diverges from the track. Indian companions track him, bring honey, obtain
    a horse, and help transport him. A caption describes a photograph of Keamapsithyo/Philip
    being treated by some Indians as a stolen soul-image, and feather anklets as protection
    from snake-bite. Later, mission companions arrive, the wound is dressed, and Keamapsithyo
    nurses the narrator through the night before further travel toward Mechi’s village.
  language: English
