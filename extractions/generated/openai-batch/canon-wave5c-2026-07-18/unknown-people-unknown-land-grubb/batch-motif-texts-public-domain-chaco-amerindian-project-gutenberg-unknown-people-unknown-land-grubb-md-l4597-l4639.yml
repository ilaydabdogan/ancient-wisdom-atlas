  summary: The narrator describes Indigenous images of an ideal state superior to
    earthly conditions, then discusses reluctance to explain mythological ideas directly.
    He says Indigenous interlocutors often evade questions or profess ignorance, but
    become interested when a possible explanation is suggested. He gives an example
    involving questions about differences in human skin color and his explanation
    of sunburn and covered skin.
