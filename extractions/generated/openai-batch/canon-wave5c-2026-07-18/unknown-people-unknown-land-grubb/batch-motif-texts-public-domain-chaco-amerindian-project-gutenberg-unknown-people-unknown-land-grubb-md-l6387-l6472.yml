canonical_text:
  quote: ''
  summary: The narrator reports accounts of witch-doctors apparently producing pumpkins
    from spat seeds, explains the performance as a trick using hidden pumpkins and
    confederates, and describes performing simple conjuring tricks to demonstrate
    deception. The passage also recounts claims that Adolpho Henricksen was killed
    by sorcery, later attributed to Caingua wizards, and a reported plan by witch-doctors
    to kill the narrator by a wasting illness rather than violence because of fear
    of his enraged spirit. The narrator safely returns with a bullock-cart and makes
    remarks about improved provisions that reportedly irritate the wizards.
  language: English
  quote_policy: summarized
