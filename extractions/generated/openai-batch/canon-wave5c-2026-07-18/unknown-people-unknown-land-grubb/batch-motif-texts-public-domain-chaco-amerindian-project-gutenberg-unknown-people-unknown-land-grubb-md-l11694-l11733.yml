canonical_text:
  quote: ''
  summary: In a church address on the day a new lamp is hung, Philip attacks witchcraft,
    contrasts darkness with increasing light and understanding, accuses witch-doctors
    of being influenced by evil spirits and the devil, says they paid for a better
    light to aid worship and teaching about the True Light, predicts their loss of
    power, and tells dissenters to live beyond the River Monte Lindo. The narrator
    evaluates Philip as zealous but lacking a full grasp of Christian liberty, likens
    his anger to that of early disciples wishing for heavenly fire, and says the address
    had a salutary and partly prophetic effect.
  language: English
