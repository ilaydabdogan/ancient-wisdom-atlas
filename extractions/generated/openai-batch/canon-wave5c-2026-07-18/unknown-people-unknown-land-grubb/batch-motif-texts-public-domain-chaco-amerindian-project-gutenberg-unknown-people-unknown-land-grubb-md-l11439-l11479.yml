canonical_text:
  quote: ''
  summary: A missionary narrator recounts a tense confrontation over a sick boy. A
    chief and associated witch-doctors say they only want to watch over the boy, while
    Christian boys warn that they intend customary harmful practices. Supporters are
    gathered, the chief denies being a witch-doctor, asks for prayer, and leaves angrily
    when the narrator refuses to retract the accusation. The household keeps watch
    overnight. The next morning a messenger is sent for Mr. Grubb, Dr. Lindsay, and
    Philip, and this is said to spoil the opponents' plans.
  language: English
  quote_policy: summarized
