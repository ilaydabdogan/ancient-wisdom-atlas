canonical_text:
  quote: ''
  summary: 'The passage describes the organization of a mission-related settlement
    at Waikthlatingmangyalwa: regular work hours, school, informal services, restrictions
    on feasts and intoxicating drink, and rules for transport. It also notes that
    many Indigenous residents outwardly followed the rules while still desiring older
    habits, sometimes leaving under pretexts and resuming them away from the station.
    Captioned images describe a bird’s nest and a hidden forest still for fermenting
    beer.'
