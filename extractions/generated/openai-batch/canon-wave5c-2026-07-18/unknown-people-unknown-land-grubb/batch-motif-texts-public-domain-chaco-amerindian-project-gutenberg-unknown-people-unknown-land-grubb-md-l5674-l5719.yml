  quote: ''
  summary: 'The passage records beliefs about celestial and atmospheric phenomena:
    an obscured sun is treated as angry; the Milky Way is associated with kilyikhama,
    bird-forms, bodily entry, and burial stones; whirlwinds are treated as passing
    spirits; the setting sun and moon are said to seek food; the red moon, new moon,
    solar halo, and Pleiades are linked with blood, marriage, battle, spring, feasting,
    and cited comparative traditions.'
