  summary: The passage describes Lengua reed-mat shelters built on stick frameworks,
    their adjustment for heat, rain, and wind, and their arrangement in village lines.
    It also notes a Lengua woman completing a clay water-jar with a half-gourd vessel
    nearby. When moving to a new site, the Indians abandon or burn grass-houses, while
    women roll up and carry the reed matting with other possessions. The passage ends
    by noting that some Chaco industries are declining as British manufactured goods
    reach Indian villages.
