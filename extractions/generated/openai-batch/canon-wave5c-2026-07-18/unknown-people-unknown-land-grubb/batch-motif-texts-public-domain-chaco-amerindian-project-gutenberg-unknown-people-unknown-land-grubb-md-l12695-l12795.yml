canonical_text:
  quote: ''
  summary: 'Natural-history passage describing Chaco forest and swamp animals: armadillos
    caught by tracking them to burrows, the great ant-eater’s body and defenses, seasonal
    swamp conditions and birds, and the lungfish’s wet-season life, human capture,
    dry-season burrowing, prolonged fasting, and survival below parched ground alongside
    a similar eel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Armadillos live among forest undergrowth and are caught alive by Indians who
    follow their tracks into burrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great ant-eater is described as large, long-tailed, long-snouted, strong-clawed,
    clumsy in gait, and able to defend itself with its forelegs and claws.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The swamps appear as dry, short-grass plains in the dry season and become
    water-filled, densely vegetated areas in the rainy season.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The swamps are described as homes for many wild birds, including ducks, storks,
    herons, chaja, jacana, ibises, and other birds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The lungfish is abundant in Chaco swamps, forms an important part of the natives’
    food supply, lives in water during the wet season, breathes air with lungs, and
    is speared by Indians.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: The lungfish is hard to see in thick weeds and reddish water, but movement
    in reeds can reveal it to hunters; males are often speared while lying in nests
    guarding young.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: When swamps dry, the lungfish makes a burrow in soft mud, lies with its tail
    curled over its head, and keeps access to air through a narrow opening.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The lungfish remains in its burrow until the next rainy season and can endure
    at least eighteen months without food by storing and slowly reabsorbing fat, especially
    from the tail.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The narrator notes that living fish can exist below the baked dry-season plain,
    and that a kind of eel, Symbranchus, passes the dry season in a similar way.
  category: setting
  evidence_refs:
  - ev:10
