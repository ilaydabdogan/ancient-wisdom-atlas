  summary: The passage describes compact terms made with native communities at mission
    stations, including limits on feasts, prohibitions on infanticide and intoxicating
    liquor, work obligations, mail-carrying duties, cart-track maintenance, and maintenance
    of peace. It then describes a rule against killing cattle without permission,
    two breaches of that rule followed by gun-related injuries, and a later refusal
    by a native man to kill Mission cattle until assured that the narrator had authorized
    it.
