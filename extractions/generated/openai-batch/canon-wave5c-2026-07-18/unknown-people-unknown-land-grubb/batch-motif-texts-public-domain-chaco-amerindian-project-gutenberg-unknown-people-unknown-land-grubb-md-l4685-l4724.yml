  quote: the beetle formed man and woman from the clay
  summary: The passage recounts a tradition in which a beetle creates a man and woman
    from clay from its hole, sends them onto the earth joined together, separates
    them after they appeal for relief from persecution, and gives them power to reproduce.
    The first-created powerful beings become disembodied, and the beetle withdraws
    from active governance while two races remain antagonistic. The passage then describes
    beliefs in a Creator, the immortal soul, and evil personifications called Idlyikhama,
    and compares the beetle as a creative symbol to the Egyptian scarabaeus.
