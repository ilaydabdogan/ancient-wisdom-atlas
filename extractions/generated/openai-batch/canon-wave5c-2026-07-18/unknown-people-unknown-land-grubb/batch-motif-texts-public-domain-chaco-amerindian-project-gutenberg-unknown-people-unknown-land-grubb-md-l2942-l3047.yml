literal_observations:
- id: obs:1
  text: A pipe may be lit with a fire brand; a woman commonly takes the first draws
    before passing it to the owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fire may also be obtained by friction with two sticks or, occasionally, with
    flint and steel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fire-sticks are cut from a tree called hapin, described as flowering every
    fourteen days from October to March in a normal season.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire-making technique uses a notched short stick, a longer rounded drill-stick,
    downward hand pressure, and tinder or a pipe to receive the smouldering powder.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gourds are abundant in the Chaco and are used as substitutes for pottery,
    including vessels for water and food and receptacles for small belongings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Certain gourds are made into rattles used at feasts and by witch-doctors during
    exorcism of evil spirits and related rites.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some rattles are modified with needles through the sides so that seeds strike
    them and produce different notes when swung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gourds may be engraved with natural objects, animals, attempted representations
    of evil spirits, and topographical scenes including roads, paths, trees, rivers,
    and villages.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Lengua musical instruments listed in the passage include a bamboo flute, bone
    whistle, flat wooden neck whistle, drums made from cooking pots and skins, and
    a crude one-string fiddle.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The fiddle uses a palm-log body, a horse-hair string, a wooden wedge, caraguata
