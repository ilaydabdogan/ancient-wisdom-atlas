  summary: The passage introduces a Lengua doll caption, then narrates Poit's condemnation
    and execution by his own tribesmen after an attempted killing of the narrator.
    The narrator emphasizes the unusual unanimity of the execution, links the affair
    to religious beliefs and witch-doctors, describes proof shown to missionaries,
    and recounts Poit's flight into the woods, fear of spirits, capture, and plea
    that he should be spared as one of the people.
