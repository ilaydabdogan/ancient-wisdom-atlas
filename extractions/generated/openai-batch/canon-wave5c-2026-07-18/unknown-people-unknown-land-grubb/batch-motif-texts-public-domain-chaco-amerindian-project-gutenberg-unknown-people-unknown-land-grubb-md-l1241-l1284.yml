  summary: A first-person foreign visitor enters the village of Kilmesakthlapomap
    despite reluctant guides, finds the villagers feasting, and assertively directs
    several villagers to arrange his horse, camp, fire, food, and water. The villagers
    later say his conduct would have been intolerably rude from one of their own people,
    but in a defenceless stranger it made them suspect occult power; they decide to
    watch and test him that night.
