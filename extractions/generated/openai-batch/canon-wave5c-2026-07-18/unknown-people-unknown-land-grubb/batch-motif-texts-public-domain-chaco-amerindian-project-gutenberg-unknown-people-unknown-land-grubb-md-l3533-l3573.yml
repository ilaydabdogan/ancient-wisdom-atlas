  summary: The passage describes animals hunted or encountered by Indigenous people
    in the Chaco region, with special attention to jaguars. It notes wax models of
    an anteater carrying its young, lists several other animals, contrasts the less-feared
    puma with the respected jaguar, reports a fatal jaguar attack on a honey-hunting
    mission Indian, gives an Indigenous explanation for man-eating jaguars as old
    and starving, describes the danger of hunting jaguars, and outlines a pit-and-lasso
    jaguar trap placed on a forest path marked by spoor.
