canonical_text:
  quote: ''
  summary: 'The passage gives several ethnographic anecdotes about moral conduct:
    a bereaved chief leaves a death-associated place and later dies after deliberately
    taking snakebite; a traveler saves food gifts for his family; people aid a snake-bitten
    stranger; companions give clothing, a blanket, and warmth to the narrator; and
    a canoe bowman tries to help Mrs. Stirling ashore politely.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Indian Chief loses his wife, leaves the place associated with her death,
    and travels east to the River Paraguay with his daughter and followers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that abandoning a place where a death has occurred is
    described as an Indian rule, while also attributing deeper grief to this chief.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the chief's only daughter dies in the new encampment, the chief begins
    a return journey west and reaches Sohoyamathla.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Sohoyamathla the chief seeks a venomous snake, allows it to bite him in
    several places, refuses help, and dies soon afterward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A far-distant Indian visitor receives sugar and four hard biscuits from the
    narrator, eats one biscuit and one lump of sugar, and saves the rest for his mother,
    wife, and little child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitor keeps the food gifts for loved ones despite a long westward walk
    described as about one hundred and fifty miles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When an Indian is bitten by a snake, even as a stranger at a distant village,
    natives may hurry to assist, sit up for one or two nights, and try to save his
    life without personal gain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Thlagnasinkinmith, while the narrator is wet and shivering, a chief near
    the fire gives him a fairly dry shirt and insists that he wear it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On wet banks of a stream, an Indian companion gives the narrator his own blanket,
    moves the fire nearer, and remains exposed to the cold until the narrator insists
    on sharing the blanket.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a canoe landing, an Indian in the bow prepares to help Mrs. Stirling ashore,
    notices his hands are dirty with fish fat, attempts to clean or cover them, and
    then offers his help.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator states that Indians look for politeness in return.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator concludes that the Indians' moral condition should not be directly
