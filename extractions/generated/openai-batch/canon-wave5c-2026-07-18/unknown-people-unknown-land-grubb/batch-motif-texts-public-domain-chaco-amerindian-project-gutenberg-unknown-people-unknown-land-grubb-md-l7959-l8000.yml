canonical_text:
  quote: "“ Ikhawe mintime inningkoo” (That is not our custom)."
  summary: The passage describes a people as emotionally restrained except under provocation,
    physically courageous, jealous, and strongly conservative in customs, clothing,
    greetings after absence, and language. It gives examples of refusing foreign customs,
    preferring native costume among their own people, avoiding immediate notice of
    close relatives upon return to a village, and coining compound words for introduced
    items rather than adopting foreign words.
  language: English; includes one quoted Indigenous-language phrase with translation
    supplied in the passage
  quote_policy: quoted
