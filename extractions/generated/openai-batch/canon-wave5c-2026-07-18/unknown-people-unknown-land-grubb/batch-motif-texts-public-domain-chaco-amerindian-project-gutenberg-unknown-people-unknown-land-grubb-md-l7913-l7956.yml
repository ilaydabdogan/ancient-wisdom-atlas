  summary: The passage shifts from remarks on self-support to a chapter on general
    characteristics. The narrator rejects a simple stereotype of Indigenous peoples
    of the New World, emphasizes diversity among Indigenous peoples, identifies reserve
    before strangers and suspicion of foreigners as common traits, and then describes
    the Chaco peoples he has studied as conservative, lighthearted, amiable, humorous,
    friendly, and self-controlled.
