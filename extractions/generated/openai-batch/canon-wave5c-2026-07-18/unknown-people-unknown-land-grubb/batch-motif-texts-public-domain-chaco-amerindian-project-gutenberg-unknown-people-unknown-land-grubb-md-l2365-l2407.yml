literal_observations:
- id: obs:1
  text: During drought, gardens cease producing, swamps and rivers dry, fish are unavailable,
    some kinds bury themselves in mud, and eggs await rains before life becomes abundant
    again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The necessity of obtaining livelihood is said to force the Indian to wander.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A restless spirit or inherited habit is said to make it difficult for the
    Indian to remain long in one place.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dread of ghosts and spirits is said to be powerful, and a haunted place must
    be abandoned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When food and opportunity allow, the Indian is described as moving from clan
    to clan, feasting and making merry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Children are described as enjoying life and playing games resembling those
    of children elsewhere.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Unless a feast, ghost scare, visitors, sickness, or another stirring event
    occurs, the Indian generally retires between 9 and 10 p.m.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sleep preparation includes making up the fire, pulling a skin mat toward it,
    joining several mats, using a palm-log as a pillow, and covering with a blanket
    if cold or troubled by mosquitoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Unless it is raining, people are said to sleep outside under the blue vault
    of heaven.
  category: setting
  evidence_refs:
  - ev:7
