  quote: ''
  summary: The passage recounts that after a husband left, local law was said to require
    the killing of a child born to the deserted woman. The narrator and companions
    warned chief people not to destroy the child and received assurances, but after
    the child was born, a boy later reported that a visiting witch-doctor killed the
    infant at night for payment. The child’s grandfather reportedly buried the body
    beneath a bottle-trunk tree before dawn, and the community did not know how the
    narrator learned of the act.
