canonical_text:
  quote: ''
  summary: 'The first-person narrator describes several encounters with local wizards
    or witch-doctors: one publicly ejects live insects or similar creatures from his
    mouth; another, called Red head, treats a feigned arm pain by spitting, sucking,
    and producing fish-bones; and another specializes in extracting small imported
    needles from afflicted people. The narrator presents these as tricks, exposes
    hidden objects, and describes efforts to oppose witchcraft practices.'
  language: English
  quote_policy: summarized
