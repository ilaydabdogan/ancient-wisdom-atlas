canonical_text:
  quote: ''
  summary: The narrator leaves a travelling party with one Indian guide to visit a
    hunting camp. They endure severe thirst, reject putrid water, later find drinkable
    muddy swamp water, and reach the hunters' camp. The narrator uses a pocket compass
    to make a sketch-map, and an old man interprets the compass needle as a captured
    little blue devil pointing toward the narrator's northern home. Later the narrator
    hears of relatives suffocating a suffering old man to hasten his death, and he
    later travels toward a large feast.
  language: English
  quote_policy: summarized
