  summary: The narrator describes an episode near Thlagwakhe during an influenza epidemic.
    A critically ill woman is left behind when the village moves to a new site. After
    a messenger reports her death, the narrator returns and finds her covered with
    reed matting while burial preparations and purification water-pots on the fire
    are underway. He removes the matting despite protests and finds the woman still
    alive, looking at him and speaking faintly.
