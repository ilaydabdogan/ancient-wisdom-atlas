canonical_text:
  quote: ''
  summary: 'The first-person narrator describes several encounters with wizards or
    witch-doctors: one reacts fearfully to a strong bottled medicine; dreamers are
    said to need a wizard when their souls are obstructed by spirits, and wizards
    are believed to see spirit shadows in metal ear-disc mirrors; boys use masks to
    frighten a famous wizard; an alarm-clock frightens a chanting witch-doctor; and
    wizards are described as using sucking cures, blood-producing tricks, disease
    treatments, and reported conjuring of small creatures.'
  language: English
  quote_policy: summarized
