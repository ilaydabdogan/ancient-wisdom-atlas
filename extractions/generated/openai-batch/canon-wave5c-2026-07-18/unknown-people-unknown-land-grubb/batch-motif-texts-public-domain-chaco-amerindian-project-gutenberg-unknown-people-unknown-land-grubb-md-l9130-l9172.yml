  quote: ''
  summary: The narrator reflects on humility in missionary teaching, cites St. Paul
    as an example, and recounts a New Year's Day conversation with Keamapsithyo/Philip
    beside a stream. The narrator urges Philip to abandon heathenism and follow Christ.
    Philip replies that his past sins are too strong and too numerous for him to believe
    Christ could forgive him, while assuming the narrator is different because he
    is good. The narrator responds by admitting his own sins, including sins of intention,
    and refers to both local theories and Christ's teaching about the will.
