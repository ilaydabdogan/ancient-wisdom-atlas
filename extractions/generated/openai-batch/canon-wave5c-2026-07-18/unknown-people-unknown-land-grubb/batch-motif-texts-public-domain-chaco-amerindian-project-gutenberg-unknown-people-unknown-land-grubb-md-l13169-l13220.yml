  summary: The passage presents outside testimony about Mr. Grubb’s mission work in
    the Chaco. Arnold H. Schoch describes settlements, Indian villages, support for
    Grubb’s Mission, and the title “Pacificador del Chaco.” Pedro A. Freund reports
    a survey expedition for a mission station and emphasizes safe travel, Indian assistance,
    absence of firearms, and changed relations with local villages.
