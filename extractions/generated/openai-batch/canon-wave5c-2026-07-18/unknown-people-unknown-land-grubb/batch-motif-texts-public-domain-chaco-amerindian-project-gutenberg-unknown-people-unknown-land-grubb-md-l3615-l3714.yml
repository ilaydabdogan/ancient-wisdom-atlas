canonical_text:
  quote: ''
  summary: The passage opens a travel chapter in which the first-person missionary
    narrator explains that mission work among the Lenguas required moving among villages,
    learning the language, and adopting local ways. He describes establishing temporary
    headquarters, welcoming Archdeacon Shimield with a large feast, acquiring a bullock-cart,
    enduring food scarcity, observing pipe-exchange etiquette, leaving property with
    village chief men, and attempting to continue a journey during a violent storm.
  language: English
