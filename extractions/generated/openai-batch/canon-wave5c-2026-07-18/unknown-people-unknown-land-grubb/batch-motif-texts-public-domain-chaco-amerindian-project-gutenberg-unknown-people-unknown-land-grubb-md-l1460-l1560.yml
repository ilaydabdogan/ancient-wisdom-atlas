canonical_text:
  quote: ''
  summary: The first-person narrator describes settling among Indians at Neantamama
    in a separate grass-thatched hut, hanging sun-dried meat from the rafters, catching
    a named man, Alligator Stomach, entering through the hut wall at night, and hearing
    his excuse that he came to protect the meat from dogs. The narrator then recounts
    an earlier episode at Riacho Fernandez in which the old Chief and others brought
    vegetable gifts, but were later discovered digging potatoes from the narrator's
    garden, apparently to present them back to him. The passage continues with plans
    for a permanent village at Thlagnasinkinmith, the narrator's trip to Concepcion,
    rumors that entrusted property had been stolen, a correction that the property
    remained safe, and the Indians' refusal to continue associating with him.
  language: English
  quote_policy: summarized
