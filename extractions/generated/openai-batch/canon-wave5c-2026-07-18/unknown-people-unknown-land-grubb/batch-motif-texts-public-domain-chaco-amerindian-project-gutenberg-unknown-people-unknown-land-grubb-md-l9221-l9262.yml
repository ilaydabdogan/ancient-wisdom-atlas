canonical_text:
  quote: ''
  summary: The passage is a missionary discussion of Chaco Indians' moral code and
    religious ideas. It says they regard both sinful acts and sinful intentions as
    wrong, are deeply interested in the spiritual world and human destiny, and possess
    beliefs that Christian teachers could use when preaching. The writer compares
    this method to St. Paul's speech at Mars Hill, then describes missionary use of
    an Indigenous theory that all things were created by a great power symbolized
    by a beetle. The missionaries also taught that original knowledge of the Creator
    had been lost or distorted and restored through revelation to an ancient people.
    The passage closes by noting a Chaco theory of powerful beings preceding humanity
    and a belief in numerous spiritual hosts.
  language: English
  quote_policy: summarized
