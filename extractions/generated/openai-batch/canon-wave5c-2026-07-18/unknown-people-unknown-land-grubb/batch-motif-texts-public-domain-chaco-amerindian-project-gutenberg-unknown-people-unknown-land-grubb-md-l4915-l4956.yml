canonical_text:
  quote: ''
  summary: The passage contrasts kilyikhama, which are said to seek possession of
    bodies in forms such as insects or small animals, with aphangak, which are generally
    not thought to enter living bodies except in an indistinct idea of seeking reincarnation
    as a newborn by displacing the child's natural spirit. It also describes recognition
    of an aphangak by its former bodily appearance and gives an example of an informant
    who heard, but did not see, an aphangak coughing near a wood in the dark; questioning
    led the narrator to identify it as a recently deceased man.
  language: English
  quote_policy: summarized
