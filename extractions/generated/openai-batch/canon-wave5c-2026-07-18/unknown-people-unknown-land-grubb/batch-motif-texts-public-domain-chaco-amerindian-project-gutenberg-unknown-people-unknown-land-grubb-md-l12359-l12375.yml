  summary: 'The passage summarizes Protestant missionary and exploratory activity
    in the Chaco region: Captain Allen Gardiner attempted unsuccessfully to settle
    among the Tobas in 1845; decades later the South American Missionary Society established
    a mission among Chaco Indians under Adolpho Henrieksen; later explorers Ibareta
    and Boggiani operated in different parts of the region and were massacred by Indians.'
