  summary: The passage is missionary commentary on Indigenous people in a transition
    between older beliefs, mission Christianity, and settlement life. The author says
    some Indians leave mission influence for settlements and are then mislabelled
    as Mission Indians; acknowledges that some mission-trained converts fail; urges
    white settlers to cooperate with missionaries; describes many Indians as doubtful
    and questioning former beliefs; and predicts divergent outcomes between practical
    Christianity and moral/social decline.
