canonical_text:
  quote: the dead hover about for a time after dissolution
  summary: The narrator reports an incident at Riacho Fernandez meant to illustrate
    a belief that the dead remain nearby for a time after death. At night in an abandoned
    hut, Indian companions hear a sound near an extinguished cooking fire and identify
    it fearfully as an aphangak, associating it with the ghost of an Indian whose
    bones the narrator had recently buried nearby. The narrator investigates, finds
    nothing but the dead fire, and later suggests the sound may have been caused by
    branches rubbing together.
  language: English
