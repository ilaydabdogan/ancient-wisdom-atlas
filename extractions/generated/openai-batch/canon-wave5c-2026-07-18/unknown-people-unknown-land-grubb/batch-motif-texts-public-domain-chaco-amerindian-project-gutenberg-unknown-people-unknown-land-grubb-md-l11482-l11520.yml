canonical_text:
  quote: ''
  summary: A sick baptized boy named Paisiam-amaak/Andrew dies after his father keeps
    vigil with him. The father and watchers flee because they fear the boy's spirit.
    A funeral is held later that morning. The village is unsettled, with reports of
    ghosts, damaged roof portions, figures behind houses, and whispered conversations.
    The narrator then states an opinion that witch-doctors had poisoned recently baptized
    men, while also reporting a medical suggestion of possible appendicitis and local
    suspicions of poisoning.
  language: English
