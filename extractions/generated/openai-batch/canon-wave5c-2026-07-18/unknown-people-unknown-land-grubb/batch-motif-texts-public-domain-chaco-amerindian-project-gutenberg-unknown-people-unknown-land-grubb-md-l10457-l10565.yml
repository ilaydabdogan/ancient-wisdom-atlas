canonical_text:
  quote: ''
  summary: An injured narrator receives supplies and sends a message toward the Mission
    station. Visitors predict that he cannot survive, select a shaded burial place,
    and repeatedly ask him not to die during the night. The narrator explains that
    they fear his spirit if he dies at night and that their custom would allow burying
    a person alive before sunset when night death seems likely. He tries to prove
    that he remains alive and resists swooning. At night they set up his mosquito-net
    and a bough fence, then withdraw to avoid his possible spirit. The next morning
    he attempts to travel but is too weak to continue.
  language: English
  quote_policy: summarized
