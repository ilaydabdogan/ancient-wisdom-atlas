  summary: The passage explains the people's communal clan life as a response to forced
    movement into an inhospitable plain, war pressure, and the need for companionship
    and sharing. It then describes a narrated intervention against the communal system,
    the formation of smaller kin-based clans with property, social discouragement
    of non-producers, opposition to marriages with indolent men, and support for protecting
    acquired property.
