  summary: The passage contains testimonial material from an appendix praising the
    English Mission and Mr. W. B. Grubb in the Paraguayan Chaco. It credits them with
    making land commercially valuable, establishing inland stores for exchange with
    Chaco tribes, encouraging Lengua people away from nomadic life toward pastoral
    and industrial pursuits, and enduring hardships in missionary work.
