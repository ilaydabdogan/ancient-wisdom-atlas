  summary: The narrator camps away from a village with a baby, improvises a sheltered
    bed, washes and wraps the child, makes a fire, and plans improvised infant food
    for a journey to the River Paraguay. He asks for guides, but the villagers refuse.
    He fears they may imagine the dead woman's ghost and kill the child to propitiate
    the mother; the departure is delayed ten days amid anxiety.
