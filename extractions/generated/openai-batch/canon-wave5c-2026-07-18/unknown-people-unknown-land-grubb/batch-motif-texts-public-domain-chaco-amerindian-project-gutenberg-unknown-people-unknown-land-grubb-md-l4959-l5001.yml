canonical_text:
  quote: ''
  summary: 'The passage reports beliefs and practices concerning spirits and the afterlife:
    indirect questioning is used to identify a deceased spirit; a killer of an outsider
    is said not to fear the victim’s spirit in the afterlife because he will be among
    his own people; clan and tribal life are described as continuing after death;
    the soul is said to linger near the village for about one month before passing
    to the realms of the dead; and the belongings and animals of the deceased are
    destroyed for use in the afterlife and to prevent haunting.'
