canonical_text:
  quote: ''
  summary: After surviving Poit's attack and returning to the mission area, the narrator
    reports that local people believed or suspected he had died and been resuscitated,
    perhaps with a non-human soul animating his body. The passage also describes plans
    to kill Poit, anxious reactions at the mission station, avoidance of exorcism
    rites, and later fearful encounters in which people question who is inside the
    narrator's body.
  language: English
