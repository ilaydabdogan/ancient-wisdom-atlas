  summary: The narrator introduces a discussion of religion by warning that Indigenous
    informants are often reticent, indirect, and sometimes accommodating to an interlocutor’s
    expectations. He says he can only report statements he has heard, despite contradictions,
    and tentatively compare them with observed life. He frames the material as useful
    but fallible for comparative study of primitive beliefs, and notes that Indian
    religious symbolism may seem childish to outsiders, just as his own society uses
    poetic images such as harps and streets of gold.
