canonical_text:
  quote: they term the creator beetle aksak
  summary: The narrator discusses the Chaco use of the term aksak, linking it to authority,
    remote ancestry, evil spirits, the creator beetle, and a powerful ancient figure
    associated with the Pleiades. He interprets a report about the Abipones' descent
    or creation from their 'grandfather the devil' as a version of a tradition in
    which humans were created by the beetle. The passage ends with a report that some
    Indians describe countries among the stars resembling their own land, with forests
    and lakes.
