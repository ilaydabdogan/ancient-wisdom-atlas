canonical_text:
  quote: ''
  summary: 'The passage describes courtship and marriage customs: partner choice,
    matrilocal residence with the husband joining the wife''s people, marriage on
    approval until childbirth makes the union binding, monogamy as the stated norm,
    exceptional polygamy and polyandry attributed to demographic imbalance from war
    and captivity, and one condemned Lengua case of a woman with two husbands. An
    inserted caption describes Lengua women''s clothing.'
  language: English
  quote_policy: summarized
