canonical_text:
  quote: ''
  summary: 'The narrator describes mission policy toward Indigenous feasts, including
    temporary encouragement, food contributions, restrictions on beer, duration, and
    conduct, and requiring visitors to arrive before the feast. The passage then describes
    social changes among Christian natives and begins a chapter summarizing Chaco
    Indian social organization: common land, limited personal accumulation, common
    access to natural products, wide hospitality, universal hunting obligations, limited
    chiefly authority, no inheritance law, clan responsibility for children, and child
    liberty.'
  language: English
  quote_policy: summarized
