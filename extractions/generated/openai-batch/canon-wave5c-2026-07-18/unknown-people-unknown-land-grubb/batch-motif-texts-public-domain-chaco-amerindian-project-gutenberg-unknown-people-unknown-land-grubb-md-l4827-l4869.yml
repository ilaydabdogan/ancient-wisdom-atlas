canonical_text:
  quote: ''
  summary: 'The passage describes several kilyikhama spirits: a thieving spirit blamed
    for losses, spirits invoked for hunting and gardening, and a most terrible forest-associated
    spirit whose appearance foretells death. It reports belief in unseen or heard
    supernatural presences, witch-doctors aided by some spirits, and a theory that
    kilyikhama seek human bodies by possession or by replacing the soul during dreams.
    It also states that these spirits are not venerated as deified human souls and
    that their origin is unclear.'
  language: English
  quote_policy: summarized
