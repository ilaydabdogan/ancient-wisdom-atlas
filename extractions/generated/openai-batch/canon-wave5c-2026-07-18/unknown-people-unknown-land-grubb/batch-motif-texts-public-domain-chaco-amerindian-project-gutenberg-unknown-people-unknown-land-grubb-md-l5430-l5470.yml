  summary: 'The passage describes reactions to dreams among the people observed by
    the narrator: a group fears sleeping after a dream involving a ghost, an old man
    uses a gourd and chant to scare the ghost away, and the narrator speculates on
    mundane prompts for the dream. It then recounts a journey interrupted by flooding
    and a feast visit, where one man refuses to go because a reported threat of murder
    is believed on the basis of a dream.'
