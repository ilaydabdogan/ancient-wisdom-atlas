canonical_text:
  quote: ''
  summary: 'The passage describes several practices presented by the narrator as charms
    or superstitions: using a roadside plant to make a departing man turn back; preserving
    writing for charms connected with Europeans; using plants, duck blood, red head-coverings,
    and wax animal images in hunting or rain-related rites; attributing south-wind
    influence to the narrator; pushing away rain by gesture and cries; and holding
    a firebrand toward the obscured sun.'
  language: English
  quote_policy: summarized
