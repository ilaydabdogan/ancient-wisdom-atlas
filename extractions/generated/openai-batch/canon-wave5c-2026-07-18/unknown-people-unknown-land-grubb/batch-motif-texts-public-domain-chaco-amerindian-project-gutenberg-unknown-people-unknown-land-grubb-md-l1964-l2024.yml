canonical_text:
  quote: ''
  summary: 'The passage reports beliefs and traditions attributed to Lengua people:
    deceased souls continue a similar life in a spirit-world, seek friends and ancestors,
    and may travel toward distant cities across other tribal territories. The narrator
    speculates that such beliefs may preserve memory of connection with ancient Peru
    or Bolivia, or Inca/Peruvian origins. The passage also reports a tradition of
    hidden treasure in a rock-cut hillside passage, and captions describe ornaments,
    a fishing charm against the swamp “Kilyikhama,” and the wainkya initiation of
    boys into manhood and warrior status.'
  language: English
  quote_policy: summarized
