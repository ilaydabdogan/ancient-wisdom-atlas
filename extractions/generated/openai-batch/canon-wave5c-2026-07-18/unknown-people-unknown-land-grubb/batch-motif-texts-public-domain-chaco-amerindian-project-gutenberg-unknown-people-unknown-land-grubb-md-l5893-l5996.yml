  text: Mission adherents are described as discussing dreams, ghost-stories, and witch-doctor
    tricks around fires with amusement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man requires a prospective bride to stop obscene language, learn to
