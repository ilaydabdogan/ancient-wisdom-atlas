canonical_text:
  quote: ''
  summary: The passage describes Mission adherents discussing dreams, ghosts, and
    witch-doctors; an incident in which a young man tests a prospective bride's Christianity
    by sending her alone at night to fetch swamp water; and an account of wizards
    or witch-doctors, their attributed powers, village role, guarded knowledge, training
    through fasting, isolation, visions, animal consumption, secrecy, trance, soul-wandering,
    and charms.
  language: English
