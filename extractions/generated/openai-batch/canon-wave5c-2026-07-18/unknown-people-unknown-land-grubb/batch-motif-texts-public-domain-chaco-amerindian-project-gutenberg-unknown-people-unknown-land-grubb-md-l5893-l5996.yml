  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Training to become a witch-doctor includes severe fasting, abstention from
    fluid, eating certain herbs, solitude, and experiences of seeing spirits, ghosts,
    and visions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The training also includes eating live toads and some kinds of snakes, and
    devouring plucked little birds so that their whistling power is supposed to pass
    to the witch-doctor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the initiatory stage, candidates are instructed in mysteries under a
    pledge of secrecy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some wizards are said to sit in a strained position, fix their gaze on a distant
