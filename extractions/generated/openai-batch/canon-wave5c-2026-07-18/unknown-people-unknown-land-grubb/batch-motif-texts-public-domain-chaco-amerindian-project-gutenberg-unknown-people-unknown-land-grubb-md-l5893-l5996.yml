  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that women seldom leave the village after dark and are
    usually accompanied by a man when fetching water at night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man would have refused marriage if the girl had failed the ghost-test.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Conjurors are reported as believed able to inflict disease and death, cure
