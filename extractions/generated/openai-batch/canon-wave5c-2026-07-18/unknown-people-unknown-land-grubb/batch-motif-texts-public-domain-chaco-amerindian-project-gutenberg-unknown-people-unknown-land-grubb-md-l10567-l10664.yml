  summary: The wounded narrator is helped eastward, meets Wischi-apkyitkya-aptawa
    returning in mourning, learns of Poit's fabricated jaguar story and flight, receives
    care at villages, hears a vow of revenge against Poit, and later fears possible
    ambush while left alone in a small wood.
