  summary: The narrator recounts a dispute over missing cattle, later stating that
    the cattle had been in the village and had been eaten. He then travels to a frontier
    Lengua village, becomes ill with malaria, delays departure after Poit and others
    advise him to wait for the dew to dry, and accepts Poit's suggestion to send the
    men and kit ahead while Poit prepares breakfast and seeks better weapons.
