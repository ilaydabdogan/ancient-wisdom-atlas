canonical_text:
  quote: ''
  summary: 'The narrator describes Poit''s condemnation and execution: a pyre is prepared,
    he is given an intoxicating drink, two executioners kill him, and his body is
    burned and the ashes scattered. The narrator then explains the mission party''s
    refusal of revenge or compensation, the effect this had on local perceptions,
    and begins to summarize Poit''s motives as rooted in ancestral belief, property
    obligations, and misunderstanding of the narrator''s departure.'
  language: English
  quote_policy: summarized
