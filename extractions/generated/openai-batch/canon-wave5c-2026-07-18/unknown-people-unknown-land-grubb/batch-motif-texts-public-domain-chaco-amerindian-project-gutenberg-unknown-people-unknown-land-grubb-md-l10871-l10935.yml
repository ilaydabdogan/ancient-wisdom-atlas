canonical_text:
  quote: ''
  summary: A party of Kisapang visitors is brought before the narrator and introduced
    to him as the body of Yiphenabanyetik. The narrator reports that local Indians
    believed he had died but were uncertain whether he was a living embodiment of
    his former self. He recovers slowly, receives medical treatment after an arrow
    wound, returns to the Chaco, is physically checked by skeptical Indians, and links
    the episode to subsequent interest in Christianity and the first baptisms of two
    Lengua converts.
  language: English
  quote_policy: summarized
