canonical_text:
  quote: ''
  summary: 'The narrator reconstructs Poit''s alleged plan after shooting at him:
    Poit would avoid villages, report the narrator''s death at the Mission station,
    delay any search, and rely on scavengers, animal tracks, and an arrow near the
    body to corroborate his story. The narrator then notes that Poit fled without
    making sure of the victim''s death, contrary to an asserted local custom of finishing
    a killing by battering the head. A report says Poit was frightened, horrified,
    and driven away by supernatural fear.'
