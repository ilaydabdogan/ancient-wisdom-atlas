canonical_text:
  quote: ''
  summary: A first-person narrator describes a night of danger after being suspected
    of dealing with a ghost following a burial. The passage explains local fear of
    graves at night, a dream of a ghost that stirred collective alarm, accusations
    of calling up the dead, a prior punishment connected with allegedly inadequate
    burial rites, and post-funeral purification and destruction rites involving water,
    fire, ashes, property, animals, booths, and hurried departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator judged the situation dangerous, avoided argument, and thought
    his safety depended on staying quiet or getting out of the way temporarily.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people are described as dreading a grave at night, and even witch-doctors
    are said not to go near one at night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator offered to walk toward the grave to demonstrate that there was
    no spirit, but he was brought back before going far.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old man said the narrator could offer to go toward the grave because he
    had already had an interview with the ghost and had powers as a wizard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator later heard that an old woman’s dream, in which she saw the ghost,
    had caused the uproar among people already anxious about remaining in a place
    after a death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that attempts to deal with ghosts of the departed were
    strongly resented and could be punished with extreme severity.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator says burial rites and ceremonies were expected to prevent the
    spirit from having cause to revenge itself and that the accusation against him
    was that he had called up the ghost.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a previously mentioned case, a man said he had seen a woman after burial;
    the narrator reports that this was understood as implying either actual non-burial
    or inadequate rites leaving an apparition hovering, and the man was put to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the return of the funeral party, clay pots of water stood on fires; the
    participants drank hot water and washed themselves all over.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Palo santo wood was burnt and carried around the village, and ashes of the
    village fires were collected into a hole and buried.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The deceased person’s property was burnt, owned animals were generally killed,
    booths were burnt to the ground, and the funeral party hurried away fearfully
    in the night.
  category: sequence
  evidence_refs:
  - ev:8
