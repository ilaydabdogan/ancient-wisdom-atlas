  summary: The passage describes a period after Poit’s death in which witch-doctors
    and Christian missionaries are portrayed as competing for influence. Three tested
    young men are baptized at Waikthlatingmangyalwa. The narrator says this and the
    presence of other baptism candidates anger the opposing party, especially the
    witch-doctors. A station chief dies from snake-bite, and the missionaries are
    blamed. The witch-doctors are then said to have resolved to find an opportunity
    to stop the progress of Christianity.
