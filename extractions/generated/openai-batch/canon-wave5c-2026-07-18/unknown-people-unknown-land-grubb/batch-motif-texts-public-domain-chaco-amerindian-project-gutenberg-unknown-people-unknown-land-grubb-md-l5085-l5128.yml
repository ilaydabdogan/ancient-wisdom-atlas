canonical_text:
  quote: ''
  summary: 'The passage reports beliefs about where souls go after death: a spirit
    road is prepared according to the believed location of a person''s deceased ancestors;
    Guarani souls are said to retire to forest country around the Falls of La Guayra
    to join ancestral souls; three general views are listed, including wandering shades,
    a westward journey to cities of the dead, and an underground world. The passage
    also reports that many animals share immortality, while fish and serpents are
    excepted, and that dogs and horses are not killed except after the owner''s death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A route or road for a spirit is described as being prepared according to the
    direction from which the person was thought to have originally come, with the
    narrator's deceased ancestors believed to be in the east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the Indians had received the narrator as one of their own people, they
    did not suggest enticing his spirit to leave their country while he was in a dying
    condition in one of their villages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chaco Indians are reported to believe that the souls of Paraguayan Guarani
    Indians retire to the forest country around the great Falls of La Guayra on the
    Alto Parana in Brazil in order to consort with ancestral souls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage lists three views of the soul''s future abode: the aphangak wandering
    disconsolately with kindred spirits, the soul moving west to cities of the dead,
    and the dead inhabiting a world beneath the earth.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that the lower creation, except fish and serpents, is supposed
    to share immortality with human beings, and it names birds, cattle, carnivora,
    the dog, jaguar, horse, ostrich, and thunder-bird as figures in shade-world beliefs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage reports that an Indian will not kill his dog or horse, even when
    mercy-killing might be expected, except after the owner's death.
  category: action
  evidence_refs:
  - ev:6
