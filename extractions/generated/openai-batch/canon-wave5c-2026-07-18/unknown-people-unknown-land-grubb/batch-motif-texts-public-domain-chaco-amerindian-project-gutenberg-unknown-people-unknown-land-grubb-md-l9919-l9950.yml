  quote: ''
  summary: The narrator describes planning a new mission in the West-south-west Chaco
    before leaving for England in 1896. He has prepared a cart-track, taken a bullock-cart
    partway toward Mechi’s village, and built a hut as a half-way house. He authorizes
    an Indian adherent named Poit to make preparatory arrangements during his absence,
    giving him cattle and barter goods, and instructing him to establish his clan,
    make a garden, trade for livestock, encourage people to gather near the mission,
    and communicate station rules including a ban on native beer.
  language: English
