canonical_text:
  quote: ''
  summary: The passage recounts Bakkula’s newborn survival after being swallowed by
    a fish and recovered unharmed, followed by a dispute that makes him heir to two
    families. It then presents a dialogue in which King Milinda asks how the Buddha
    can both discover an unknown way and perceive an ancient path walked by previous
    Buddhas. Nagasena answers that the old way had vanished after previous Buddhas
    disappeared and was made passable again by the Buddha, using an analogy of a hidden
    Gem of Sovereignty appearing to a new sovereign.
  language: English
  quote_policy: summarized
