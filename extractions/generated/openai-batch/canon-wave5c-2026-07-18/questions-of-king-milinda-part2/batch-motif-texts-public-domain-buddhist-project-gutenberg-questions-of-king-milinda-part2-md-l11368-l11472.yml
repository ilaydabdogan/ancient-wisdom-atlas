canonical_text:
  quote: ''
  summary: The passage contrasts an unfit person who takes monastic vows and receives
    social punishment and postmortem torment with a fit vow-taker who receives honor,
    doctrinal attainments, and imagery of royal consecration and emancipation. It
    also begins a simile involving service rendered to a consecrated Kshatriya king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A preceding analogy states that a person base in lineage who places himself
    in the seat of sovereignty transgresses beyond his proper limits; this is applied
    to an unfit person taking vows.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unfit vow-taker is described as having evil cravings, hypocrisy, greed,
    attachment to food, and desire for material gain or worldly fame, while lacking
    attainments and conduct consistent with membership in the Order.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The unfit vow-taker incurs a twofold punishment: disgrace and exclusion in
    this world, and torment in the next life.'
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The next-life torment occurs in the great Avi/ti purgatory, described as a
    hundred leagues deep and covered with fierce blazing flames, where the sufferer
    rises and falls for myriads of years like a foam-bubble in a boiling sea.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: After release from that purgatory, the offender becomes a mighty Preta in
    the outward form of a monk, with a lean, dark, diseased body, hunger and thirst,
    a mouth no larger than a needle, no refuge, and wandering wails over the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fit vow-taker is described as having reached the attainments, having conduct
    consistent with the Order, desiring little, being content and secluded, full of
    faith, entering the Order from belief, and seeking release from old age and death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fit person takes vows with the idea of upholding the faith and is said
    to deserve twofold honor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fit vow-taker is loved by gods and men and is compared to desired or beneficial
