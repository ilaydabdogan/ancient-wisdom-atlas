    a wishing-gem, a white sunshade, and the fruits of Arahatship.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fit vow-taker attains mastery over enumerated Buddhist disciplines and
    knowledges, including meditations, struggles, roads to sainthood, moral organs
    and powers, wisdom forms, and the Noble Eightfold Path.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The fit vow-taker is called an anointed king, and a pure white sunshade of
