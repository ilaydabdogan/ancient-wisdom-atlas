canonical_text:
  quote: ''
  summary: 'Nagasena answers King Milinda by describing qualities that a strenuous
    Bhikshu should take from the tortoise, bamboo, bow, crow, and monkey: solitude,
    sense-restraint, conformity to the Buddha''s teaching, flexible conduct with brethren,
    vigilance, sharing of lawful gifts, and choosing a worthy teacher.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tortoise is described as digging a hole in the ground and dwelling alone;
    the Bhikshu is instructed to give up worldly gain, honour, and praise and to live
    alone in quiet solitary places such as groves, woods, hills, caves, and grottoes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tortoise is described as withdrawing its head and limbs into its shell
    when it sees someone; the Bhikshu is instructed to close the six sense-doors,
    cover the mind in self-control, and continue in mindfulness and thoughtfulness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bamboo is described as bending in the direction of the gale; the Bhikshu
    is instructed to conduct himself according to the ninefold teaching of the Master
    and lawful, blameless things.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bow is described as well-made, balanced, and bending equally from end
    to end; the Bhikshu is instructed to bend easily in accord with brethren of every
    seniority and not repel them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The crow is described as going about apprehensive, suspicious, watchful, and
    guarded; the Bhikshu is instructed to go about watchful, self-possessed, and with
    senses controlled.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The crow is described as eating whatever food it sees while sharing with its
    kind; the Bhikshu is instructed to share lawful gifts, including the contents
    of his begging-bowl, with virtuous co-religionists.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The monkey is described as taking up abode in a mighty branched tree in a
    lonely place, a sure refuge; the Bhikshu is instructed to choose a modest, amiable,
    righteous, learned, venerable, and admonishing friend as teacher.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage is framed as questions from King Milinda to Nagasena about qualities
    to be taken from named animals, a plant, and an object.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
