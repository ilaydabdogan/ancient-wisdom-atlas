canonical_text:
  quote: ''
  summary: A dialogue contrasts vice and virtue through crop metaphors and worldly
    analogies of quick effectiveness. Nagasena argues that vice appears quickly in
    this life because legal penalties expose it, while the karmic fruit of both vice
    and virtue appears in future births, with virtue ultimately more powerful. A new
    dilemma asks whether offerings dedicated to departed relatives benefit the dead;
    Nagasena distinguishes rebirth states and says only some Pretas benefit, while
    the givers themselves also gain profit.
  language: English
  quote_policy: summarized
