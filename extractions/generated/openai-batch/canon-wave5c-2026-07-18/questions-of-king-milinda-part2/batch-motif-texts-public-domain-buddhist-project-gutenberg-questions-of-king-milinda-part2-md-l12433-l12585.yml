canonical_text:
  quote: ''
  summary: 'The passage gives didactic animal analogies. A fragmentary verse mentions
    no further womb-entry and asks a god to rain. Nagasena answers the king by explaining
    two panther qualities and three tortoise qualities that a strenuous Bhikshu should
    imitate: seeking solitude for insight, refusing wrongly obtained food, extending
    love and pity to all living creatures, withdrawing into meditation when evil inclinations
    arise, and rousing from meditation to struggle against evil dispositions.'
  language: English
  quote_policy: summarized
