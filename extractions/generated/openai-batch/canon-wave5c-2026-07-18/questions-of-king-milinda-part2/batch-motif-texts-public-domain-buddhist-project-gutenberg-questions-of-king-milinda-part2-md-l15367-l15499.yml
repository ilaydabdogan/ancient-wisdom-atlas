canonical_text:
  quote: ''
  summary: 'The passage presents didactic analogies in which a strenuous Bhikshu is
    instructed to adopt selected qualities of the hunter, fisherman, and carpenter:
    knowing the right time, rejoicing in a contemplative object, drawing up spiritual
    fruits by knowledge, renouncing worldly baits for greater gain, cutting off evil
    dispositions, and forsaking useless theses to reach a state void of lust, malice,
    and dullness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hunter is said to know the right time for his work, and the Bhikshu is
    told to know the right time to retire and to come out of retirement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter rejoices when he sees a deer and thinks he will get it; the Bhikshu
    is told to rejoice at seeing an object for contemplation and to think that by
    it he will grasp the specific idea sought.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A verse attributed to Moghara^a says that a recluse with mind bent on Nirva/^a
    and an object to guide his thoughts should be joyful in hope of gaining his uttermost
    aim.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fisherman draws up fish on his hook; the Bhikshu is told to draw up the
    fruits of Sama/^aship by knowledge, and to the uttermost.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fisherman obtains great gain by sacrificing very little; the Bhikshu is
    told to renounce the mean baits of worldly things and thereby gain mighty fruits
    of Sama/^aship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A verse attributed to Rahula says that one who renounces the baits of the
    world gains a state void of lust, anger, and sin, freedom from cravings, the fruits
    of the stages of the Excellent Way, and six modes of insight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The carpenter saws wood along the line of a blackened string used as a guide.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bhikshu is told to stand on righteousness as a basis, hold the saw of
    knowledge in the hand of faith, and cut off evil dispositions according to the
    doctrine laid down by the Conquerors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The carpenter discards the soft parts of wood and takes the hard parts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bhikshu is told to forsake useless theses and wrong views, learn the real
    nature of the constituent elements of individuality, and reach a state void of
    lusts, malice, and dullness.
  category: sequence
  evidence_refs:
  - ev:6
