canonical_text:
  quote: ''
  summary: The passage presents two doctrinal dilemmas in dialogue form. King Milinda
    asks Nagasena why an Arahat has no mastery over the body and why ordinary people
    suffer both bodily and mental pain while an Arahat suffers bodily pain only. Nagasena
    answers with lists and similes involving the body, land, an ox tied by a weak
    rope, a post of contemplation, and a noble tree. A following dilemma asks whether
    a layman who unknowingly committed a Para^ika offence before entering the Order
    can enter the Excellent Way; Nagasena answers that he cannot because the cause
    for grasping Truth has been destroyed. The passage closes with a quoted teaching
    that remorse obstructs the heart and prevents comprehension of Truth.
  language: English
  quote_policy: summarized
