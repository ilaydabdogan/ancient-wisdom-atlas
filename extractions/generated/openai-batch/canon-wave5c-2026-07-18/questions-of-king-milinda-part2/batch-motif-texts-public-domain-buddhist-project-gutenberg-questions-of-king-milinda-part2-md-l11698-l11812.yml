canonical_text:
  quote: ''
  summary: The passage describes the thirty graces of a disciple who has practiced
    thirteen vows across former births, including love, faith, contemplative bliss,
    purity, freedom from rebirth, and emancipation. It then presents Sariputta as
    an exemplary renunciant who entered the Order, practiced the vows, and, according
    to a cited Anguttara Nikaya saying, set rolling the chariot-wheel of the kingdom
    of righteousness after the Buddha. The king praises Nagasena's explanation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disciple of the Noble Ones is described as having undertaken and practiced
    thirteen vows in former births and as being endowed with thirty graces.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed graces include affectionate love, destruction of evil, an end to
    pride and self-righteousness, stable faith, contemplative refreshment, and a sweet
    savour of righteous life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The disciple is said to be dear to gods and men, honored by gods and men,
    and esteemed by Arahat Noble Ones and by enlightened, wise, and learned persons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The disciple is described as free from attachment to this world or the next,
    attentive to even tiny offences, rich in the wealth that is the fruit of the Path,
    and living without a home in austerity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that the disciple has destroyed the net of evil, the possibility
    of rebirth in five future states, the five obstacles, the seven evil inclinations,
    and the Great Evils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sariputta the Elder is described as the best man in the ten thousand world
    systems except for the Teacher of the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sariputta is said to have accumulated merit through endless ages, been reborn
    in a Brahman family, relinquished sense pleasures and wealth, and entered the
    Order according to the Conqueror's teaching.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sariputta is said to have restrained actions, words, and thoughts by the thirteen
    vows and to have attained exalted virtue in this life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Blessed One is quoted as saying that no other man after him sets rolling
    the chariot-wheel of the kingdom of righteousness as well as Sariputta.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king calls Nagasena's explanation excellent and says that the Buddha's
    ninefold word, exalted conduct, and highest attainments are wrapped up in the
    virtues that result from keeping the vows.
  category: speech
  evidence_refs:
  - ev:5
