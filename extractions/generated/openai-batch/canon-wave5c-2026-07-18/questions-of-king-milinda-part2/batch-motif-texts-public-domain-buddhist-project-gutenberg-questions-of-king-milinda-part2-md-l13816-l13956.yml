canonical_text:
  quote: ''
  summary: The passage presents analogies in which Nagasena, answering the king, describes
    qualities a strenuous Bhikshu should take from the sun, Sakka, and the sovereign
    overlord. It also preserves the end of a moon analogy and includes supporting
    verses attributed to Vangisa and Subhuti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage fragment says brethren should be like the moon when visiting
    the laity: outwardly and inwardly composed, like strangers on a first visit, and
    retiring in the laity''s presence.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks Nagasena about seven qualities of the sun; the first analogy
    says that as the sun evaporates all water, the strenuous Bhikshu should dry up
    all evil inclinations within himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second sun analogy says that as the sun dispels darkness, the strenuous
    Bhikshu should dispel the darkness of lust, anger, dullness, pride, heresy, evil,
    and unrighteousness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The third and fourth sun analogies say that as the sun is always in motion
    and has a halo of rays, the strenuous Bhikshu should be ever thoughtful and have
    a halo of meditation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fifth sun analogy says that as the sun warms multitudes of people, the
    strenuous Bhikshu should rejoice the world of gods and men through conduct, virtue,
    duty, meditative attainments, moral powers, wisdom, mindfulness, struggle against
    evil, and paths to saintship.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sixth sun analogy says that as the sun is terrified by Rahu, the demon
    of eclipses, the strenuous Bhikshu should arouse anxiety and fear when seeing
    beings entangled in evil life, rebirth in states of woe, punishment in purgatory,
    and evil inclinations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The seventh sun analogy says that as the sun makes manifest evil and good,
    the strenuous Bhikshu should make manifest moral powers, wisdom, mindfulness,
    struggle against evil, paths to saintship, and temporal and spiritual qualities.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A verse attributed to Vangisa compares the rising sun making pure and impure,
    good and bad forms plain, with a Bhikshu bearing the scriptures in mind and making
    the Noble Path manifest to people blind in ignorance.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king asks about three qualities of Sakka; Nagasena says that as Sakka
    enjoys perfect bliss, the strenuous Bhikshu should rejoice in the perfect bliss
    of retirement.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The second and third Sakka analogies say that as Sakka fills the gods around
    him with joy and feels no discontent, the strenuous Bhikshu should keep the mind
    detached, alert, tranquil, joyful, zealous, and not discontented with solitude.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: A verse attributed to Subhuti says that since renouncing the world according
    to the teaching, no thought of lust or craving care has arisen in the speaker's
    breast.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The king asks about qualities of the sovereign overlord; Nagasena says that
    as the overlord gains popular favor through liberality, affability, justice, and
    impartiality, the strenuous Bhikshu should please and gladden the brethren, rulers
    of the Order, and laity of either sex.
  category: speech
  evidence_refs:
  - ev:12
