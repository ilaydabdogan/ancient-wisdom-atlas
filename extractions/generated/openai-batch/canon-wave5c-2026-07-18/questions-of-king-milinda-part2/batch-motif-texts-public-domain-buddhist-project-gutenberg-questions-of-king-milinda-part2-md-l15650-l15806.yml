canonical_text:
  quote: ''
  summary: 'A dialogue passage in which a king asks Venerable Nagasena about qualities
    a strenuous Bhikshu should take from a sunshade, a rice field, medicine, and food.
    Nagasena answers through similes: the sunshade models moral elevation, thoughtfulness,
    and protection from harmful views and passions; the rice field models disciplined
    cultivation and fruitful benefit to supporters; medicine models freedom from inner
    corruption and antidotal action against mental poisons; food models support, growth
    in virtue, and desirability. The passage ends by introducing a new question about
    the archer, whose answer is not included in the supplied text.'
  language: English
  quote_policy: summarized
