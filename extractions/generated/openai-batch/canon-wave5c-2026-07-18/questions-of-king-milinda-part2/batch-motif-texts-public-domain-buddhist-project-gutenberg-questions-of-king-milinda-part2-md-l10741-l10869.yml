canonical_text:
  quote: ''
  summary: The speaker addresses the king and says he will explain the matter by reasons
    drawn from experience and knowledge. He then enumerates many places, sermons,
    miracles, and assemblies connected with the Blessed One, reporting large numbers
    of lay disciples, living beings, gods, Brahma gods, and deities who attained understanding
    of the Four Truths or knowledge of the Dhamma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker tells the king that, like a writing-master who supplements written
    signs with an explanation, he will bring reasons from experience and knowledge
    to analyze and settle the matter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Sāvatthi, many lay disciples of the Blessed One are described as walking
    in the paths, with a specified subgroup established in the fruit of the third
    path.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the foot of the Gaṇḍamba tree, during the double miracle, a large number
    of living beings are said to have understood the Four Truths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several named discourses are reported as occasions on which innumerable celestial
    beings attained knowledge of the Four Truths.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Rājagaha, many devout lay disciples are described as walking in the Paths.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Further events at Rājagaha and other locations include the taming of Dhanapāla
    the great elephant, the Parāyana discourse, the Indasāla cave, the first preaching
    of the Dhamma at Isipatana, preaching in the heaven of the Thirty-Three, and the
    descent from the world of the gods at Saṅkassa; each is linked with large numbers
    of beings attaining knowledge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Kapilavatthu among the Sakyas, the preaching of the Buddhavaṃsa and the
    Mahā Samaya Suttanta are associated with uncountable gods attaining knowledge
    of the Dhamma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A final list of assemblies and named occasions is given, and each is associated
    with eighty-four thousand beings attaining knowledge of the Dhamma.
  category: sequence
  evidence_refs:
  - ev:5
