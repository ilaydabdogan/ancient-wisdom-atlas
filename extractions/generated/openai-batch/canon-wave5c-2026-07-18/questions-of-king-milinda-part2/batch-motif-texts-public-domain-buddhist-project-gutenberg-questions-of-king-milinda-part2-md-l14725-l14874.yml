  summary: A dialogue passage presents several animal analogies. Nagasena explains
    to the king how a strenuous Bhikshu should imitate selected qualities of the Pez/ahika
    bird, house-pigeon, owl, Indian crane, and bat in relation to solitude, communal
    protection, nonattachment, the destruction of ignorance, preaching about purgatory
    and Nirvana, and harmless conduct among householders.
