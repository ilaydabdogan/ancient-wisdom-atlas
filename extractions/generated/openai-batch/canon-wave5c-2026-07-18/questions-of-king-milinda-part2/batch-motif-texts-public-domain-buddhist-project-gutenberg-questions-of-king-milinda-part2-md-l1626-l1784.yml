canonical_text:
  quote: ''
  summary: 'The passage contains several dilemmas posed to Nagasena. C''otipala, born
    among unbelievers, reviles the Tathagata but later comes to know Buddha virtues,
    renounces the world, gains meditative powers, and is assured of rebirth in Brahma
    heaven. A second dilemma concerns Ghatikara the potter: his roofless dwelling
    remains dry while rain falls on Kassapa the Tathagata''s hut. Nagasena explains
    that Ghatikara rejoiced when his thatch was used for the Tathagata''s hut and
    gained merit, while the Tathagata remained unmoved by discomfort and refrained
    from self-created requisites so that donors could gain merit and so that Buddhas
    would not be accused of living by miracles. The excerpt ends by introducing a
    further dilemma about the Blessed One calling himself both a Brahman and a king.'
  language: English translation with Indic names and terms
  quote_policy: summarized
