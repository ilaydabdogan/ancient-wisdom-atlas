canonical_text:
  quote: ''
  summary: Nagasena answers the king by listing qualities that a strenuous Bhikshu
    should take from the tree, rain, diamond, and hunter. The tree models fruitfulness,
    shelter, and impartial shade; rain models cleansing, cooling, growth, protection,
    and filling with Dhamma; the diamond models purity, non-alloying, and association
    with excellent companions; the hunter models indefatigability and fixed attention.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tree is described as bearing fruits and flowers, casting shadow over people
    who come beneath it, and making no distinction in the shadow it gives.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikshu is told to bear the flowers of emancipation and fruits of Samaṇaship,
    receive attendants kindly, and nourish equal love toward robbers, injurers, enemies,
    and those like himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A verse attributed to Sariputta names Devadatta, Angulimala, an elephant set
    loose, and Rahula as recipients of the sage's equal-mindedness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rain is described as laying dust, allaying ground heat, making vegetation
    grow, protecting plants in the hot season, and filling rivers, reservoirs, lakes,
    caves, chasms, ponds, holes, and wells with water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bhikshu is told to lay down evil dispositions, soothe gods and men with
    love, cause faith to grow, protect his condition of Samaṇaship through thoughtfulness,
    and pour down the rain of Dhamma for those longing for instruction.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A verse attributed to Sariputta says the Great Sage goes to a person ripe
    for enlightenment, even from afar, and gently guides him to the path of Truth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The diamond is described as pure throughout, unable to be alloyed with another
    substance, and set together with costly gems.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bhikshu is told to be pure in livelihood, not mix with wicked men as friends,
    and associate with persons of higher excellence and with jewel-treasures of advanced
    religious attainment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Sutta Nipata verse cited to the Blessed One says the pure should associate
    with the pure and dwell harmoniously and wisely.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hunter is described as indefatigable and as keeping attention fixed on
    the deer.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bhikshu is told to be indefatigable and keep attention fixed on the particular
    object that is the subject of his thought.
  category: speech
  evidence_refs:
  - ev:7
