canonical_text:
  quote: ''
  summary: In a sequence of dilemmas, the king asks Nagasena about modes of production,
    dead Yakkhas, and why the Tathagata laid down rules gradually rather than all
    at once. Nagasena answers by classifying beings and phenomena by origin, describing
    Nirvana as independent and knowable by mind, affirming that dead Yakkhas leave
    remains in animal and vermin forms, and explaining that the Tathagata delayed
    promulgating rules to avoid frightening prospective entrants into the Order.
  language: English translation with transliterated Pali/Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king asks which things are called Karma-born, cause-born, season-born,
    and what is none of these.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena says conscious beings are Karma-born; fire and seed-grown things
    are cause-born; earth, hills, water, and wind are season-born; and space and Nirvana
    exist independently of Karma, cause, and seasons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena says Nirvana cannot be described as produced, temporal, or perceptible
    by the bodily senses, but can be perceived by the mind by a fully attained disciple
    with a pure heart.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king says his perplexity has ended after consulting Nagasena.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king asks whether demons or Yakkhas exist, whether they leave that condition,
    and why their remains or corpse odour are not found.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena says Yakkha remains are found and that the remains of bad Yakkhas
    can be seen as worms, beetles, ants, moths, snakes, scorpions, centipedes, birds,
    and wild beasts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king says only someone as wise as Nagasena could have solved the puzzle
    about dead demons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king lists earlier teachers or doctors who composed complete treatises
    on disease, including its rise, cause, nature, progress, cure, treatment, and
    management.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king asks why the omniscient Tathagata did not lay down the whole code
    of rules at once, but instead laid them down as occasions arose after wrongdoing
    had become known.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Nagasena says the Tathagata knew the rules would have to be laid down, but
    chose to establish each rule as the occasion arose, with a religious discourse,
    after the evil became manifest.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Nagasena says the Tathagata avoided laying down all the rules at once because
    people might fear the difficulty, refrain from entering the Order, distrust his
    words, and become liable to rebirth in states of woe.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The king praises the greatness of the Tathagata's omniscience.
  category: speech
  evidence_refs:
  - ev:10
