canonical_text:
  quote: ''
  summary: The passage ends a verse wishing that others suffer no loss in virtues,
    possessions, family, strength, beauty, or joy. It then presents similes in which
    Nagasena explains to the king qualities a strenuous Bhikshu should take from a
    leech, a serpent, and a rock-snake. The leech teaches firm adherence to a meditation
    subject and drinking the draught of emancipation; the serpent teaches progress
    by knowledge, avoidance of unrighteousness, and urgent escape from wrong thoughts;
    the rock-snake teaches endurance of hunger and moderation in food, even with only
    a few mouthfuls and water. The next chapter introduces the road spider simile
    but does not explain it in the supplied range.
  language: English
  quote_policy: summarized
