canonical_text:
  quote: ''
  summary: 'The passage presents similes of the ocean, sea, fire, and earth as models
    for Buddhist disciples or a strenuous Bhikshu. The ocean’s fixed shore models
    obedience to regulations; the sea’s inability to be filled, and a fire’s inability
    to be satisfied, model continual hunger for instruction. Nagasena then answers
    the king’s question about five qualities of the earth: sameness amid pure and
    impure things, lack of adornment, solidity, tireless bearing of beings and places,
    and freedom from fawning and ill-will.'
  language: English
  quote_policy: summarized
