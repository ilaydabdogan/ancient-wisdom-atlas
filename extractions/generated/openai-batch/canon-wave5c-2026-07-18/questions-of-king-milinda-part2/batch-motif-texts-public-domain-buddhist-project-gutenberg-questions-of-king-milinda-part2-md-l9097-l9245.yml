canonical_text:
  quote: ''
  summary: The excerpt opens Book V, “The Problem of Inference.” King Milinda visits
    Nagasena and asks whether Nagasena or his teachers have seen the Buddha. When
    Nagasena answers no, Milinda argues that there is no clear evidence that the Buddha
    existed. Nagasena responds with a parallel question about ancient Kshatriya founders
    of Milinda’s royal line, whom neither Milinda nor his instructors have seen. Milinda
    says their royal insignia remain and prove they lived. Nagasena then argues that
    the Buddha’s own “royal insignia,” namely lists of Buddhist practices and qualities
    culminating in the Noble Eightfold Path, likewise allow gods and humans to know
    by inference that the Buddha existed. A verse describes the liberated one bringing
    multitudes safely ashore from a sea of woe. Nagasena begins a further illustration
    of an architect who builds an ideal, fortified, well-provisioned city and then
    departs; later the city becomes prosperous and full of many classes of people.
  language: English
  quote_policy: summarized
