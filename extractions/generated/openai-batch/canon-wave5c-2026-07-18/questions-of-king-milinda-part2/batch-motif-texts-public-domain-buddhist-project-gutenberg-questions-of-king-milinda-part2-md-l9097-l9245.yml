  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena states that, by these remaining signs, the world of gods and humans
    can know and believe by inference that the Blessed One once lived.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A verse says that the liberated one, in whom the Upadhis, lusts, sin, and
    Karma have ceased, brought great multitudes safely ashore from a sea of woe, and
    that his former existence can be known only by inference.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Nagasena’s illustration, an architect selects a pleasant, faultless, even,
