  summary: The passage reports textual references to King Milinda and to figures connected
    with the Milinda tradition. It notes an Avadana in which the Buddha tells Indra
    that King Milinda will erect a stupa at Pataligrama. It also discusses a quoted
    Mahavamsa-like verse in which the thera Assagutta brings sixty thousand monks
    from the Vattaniya Hermitage in the Vindhya Desert through the sky and descends
    there, comparing it with an extant Mahavamsa line about the thera Uttara bringing
    sixty thousand bhikkhus from the same hermitage.
