  text: Ghee is described as having beautiful color, pleasant perfume, and pleasant
    taste; these qualities are compared with qualities of Nirvana.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mountain peak is described as lofty, immovable, inaccessible, unable to
    support plant growth, and free from desire to please or resentment; these traits
    are compared with Nirvana.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king asks whether one who orders his life aright realizes something already
    produced or first produces it and then realizes it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena answers that neither alternative applies, while stating that the
    principle of Nirvana exists.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king asks Nagasena to make the point plain because people are bewildered,
    perplexed, and doubtful.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nagasena says that the peaceful, blissful, delicate principle of Nirvana is
    realized by wisdom by one who orders his life aright, as a pupil masters an art
    through a teacher’s instruction.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nirvana is said to be known by freedom from distress and danger, confidence,
    peace, calm, bliss, happiness, delicacy, purity, and freshness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man burning in a blazing furnace escapes by violent effort into a cool place
    and experiences supreme bliss; this is compared with realizing Nirvana after the
    heat of the threefold fire has gone out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man in a pit filled with corpses, ordure, and refuse escapes by violent
