canonical_text:
  quote: ''
  summary: In a dialogue, the king asks Nagasena about qualities and the temporal
    status of Nirvana. Nagasena explains Nirvana through analogies of ghee, a mountain
    peak, a pupil mastering an art, escape from a fiery furnace to a cool place, escape
    from a pit of corpses to a corpse-free place, and escape from armed enemies to
    a secure refuge.
  language: English
  quote_policy: summarized
literal_observations:
