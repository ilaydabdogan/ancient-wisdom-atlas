canonical_text:
  quote: ''
  summary: The passage concludes a dilemma about the Bodisat's penance by explaining
    that hunger and thirst, among twenty-five weakening qualities, affected his body
    and prevented proper devotion to destroying the Asavas. It states that the Bodisat
    had pursued perception of the Four Noble Truths through many births, wondered
    in his final birth whether there was another way to Buddha wisdom, and had entered
    meditative absorption as an infant under a Jambu tree. The king accepts Nagasena's
    answer. A new dilemma then begins, in which the king asks whether virtue or vice
    is stronger; Nagasena answers that virtue is stronger, and the king objects by
    citing criminals and punishments.
  language: English
  quote_policy: summarized
