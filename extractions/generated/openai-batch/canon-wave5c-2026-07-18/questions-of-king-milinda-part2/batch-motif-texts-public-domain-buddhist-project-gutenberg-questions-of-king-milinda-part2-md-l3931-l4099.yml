canonical_text:
  quote: ''
  summary: In a dialogue, Nagasena explains to King Milinda that an offence can obstruct
    comprehension of the Truth even when the offender is unaware of it. He uses similes
    of seed, rock, earth, air, fire, water, poison, and a snake, and cites a king
    of Kalinga unable to pass the Tree of Wisdom. The passage then begins a new dilemma
    comparing a guilty layman and a guilty member of the Order, listing qualities
    that still distinguish the guilty recluse.
  language: English
  quote_policy: summarized
