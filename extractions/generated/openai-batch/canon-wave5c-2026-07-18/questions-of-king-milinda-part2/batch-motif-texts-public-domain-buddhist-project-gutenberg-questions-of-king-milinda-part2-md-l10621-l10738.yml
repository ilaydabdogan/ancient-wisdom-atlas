canonical_text:
  quote: ''
  summary: The passage opens Book VI, “The Dhutangas.” King Milinda sees forest bhikkhus
    keeping severe vows and also householders at home enjoying the fruits of the Noble
    Path, which raises doubt about the value of vows. He asks Nagasena whether lay
    householders surrounded by family, sensual pleasures, adornment, and wealth can
    see Nirvana. Nagasena replies that innumerable laymen have done so, and says he
    will analyze the question by bringing together passages from the Buddha’s teaching,
    comparing them to rainwater from varied land flowing into the ocean.
  language: English
  quote_policy: summarized
