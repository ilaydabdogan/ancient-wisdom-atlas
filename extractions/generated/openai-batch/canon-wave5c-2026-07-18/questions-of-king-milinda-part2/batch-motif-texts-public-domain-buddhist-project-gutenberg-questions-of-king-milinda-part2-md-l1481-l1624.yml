canonical_text:
  quote: ''
  summary: The passage concludes a dilemma about Lomasa Kassapa by comparing his love-induced
    madness to a madman's actions and arguing that acts done while out of one's mind
    are pardonable. It then begins another dilemma contrasting Six-tusks the elephant
    king, who respects the yellow robe while in pain, with G'otipala the young Brahman,
    who reviles Kassapa the Buddha; Nagasena explains G'otipala's abuse as arising
    from his unbelieving, Brahma-worshipping family surroundings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A madman is described as entering a fiery furnace, taking hold of a venomous
    snake, approaching a rogue elephant, plunging into great waters, going through
    mud, thorns, and precipices, eating filth, and going naked in the streets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the sight of A'andavati the princess, the Bodisat is said to have gone
    out of his mind and then acted as previously described.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nagasena argues that an evil act done by one out of his mind is not treated
    as a grievous offence in the present world or in its future fruit; the king says
    a madman guilty of a capital offence would be beaten and set free.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lomasa Kassapa the Rishi is described as losing command of himself through
    love for A'andavati and offering the great sacrifice called the Drink of Triumph,
    with much blood from slaughtered beasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After returning to his natural state, Lomasa Kassapa again renounces the world,
    regains five powers of insight, and becomes assured of rebirth in the Brahma world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king accepts Nagasena's explanation of the Lomasa Kassapa dilemma.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A cited verse about Six-tusks the elephant king says that, while suffering
    pain and after perceiving the yellow robe as the badge of a recluse, he thinks
    that one who wears the outward garb of Arahats should be held scatheless and sacred
    by the good.
  category: sequence
  evidence_refs:
