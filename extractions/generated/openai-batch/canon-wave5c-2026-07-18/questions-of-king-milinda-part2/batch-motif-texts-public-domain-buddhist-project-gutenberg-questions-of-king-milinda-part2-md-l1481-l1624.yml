  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The king frames a double-edged problem: if the Bodisat as an animal respected
    the yellow robe, then G''otipala''s abuse seems false; if G''otipala''s abuse
    is true, then Six-tusks''s respect seems false.'
  category: speech
  evidence_refs:
  - ev:7
