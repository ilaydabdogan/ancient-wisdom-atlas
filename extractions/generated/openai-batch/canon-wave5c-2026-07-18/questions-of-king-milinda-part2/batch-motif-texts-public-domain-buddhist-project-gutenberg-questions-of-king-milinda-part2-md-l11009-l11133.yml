canonical_text:
  quote: ''
  summary: The passage explains that lay people who realize Nirvana have already trained
    in former births through the thirteen vows. It compares this prior training to
    an archer training pupils and to a doctor learning from a teacher before treating
    the sick. It states that truth is not perceived without purification by vows,
    and then presents many similes for the character produced by vow-keeping, including
    earth, water, fire, wind, medicine, ambrosia, arable land, a wishing-gem, a boat,
    refuge, mother, father, friend, and lotus.
  language: English
  quote_policy: summarized
