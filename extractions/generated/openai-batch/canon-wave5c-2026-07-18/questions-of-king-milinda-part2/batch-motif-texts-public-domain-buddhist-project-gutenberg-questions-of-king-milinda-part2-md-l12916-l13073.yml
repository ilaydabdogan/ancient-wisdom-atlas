canonical_text:
  quote: ''
  summary: Nagasena explains to the king how a strenuous Bhikshu should take qualities
    from a ship, anchor, mast, and pilot. The ship conveys people across, bears waves
    and whirlpools, and journeys over the great ocean; these are applied to crossing
    existence, enduring evil inclinations and social praise or blame, and penetrating
    the Four Truths. The anchor steadies the ship and sinks rather than floating;
    these are applied to steadfastness amid lust, malice, and dullness, and humility
    amid support and praise. The mast carries the ship’s equipment; this is applied
    to continuous mindfulness and self-possession. The pilot navigates day and night
    and knows what is in the sea; these are applied to regulating the mind and discerning
    good from evil.
  language: English
  quote_policy: summarized
