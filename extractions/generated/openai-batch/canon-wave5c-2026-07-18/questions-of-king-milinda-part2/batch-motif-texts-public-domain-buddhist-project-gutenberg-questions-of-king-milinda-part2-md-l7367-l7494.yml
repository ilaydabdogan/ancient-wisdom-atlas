canonical_text:
  quote: ''
  summary: In a dialogue, the king argues that every death occurs at its appointed
    time. Nagasena distinguishes death in due season from death out of due season,
    listing examples such as starvation, thirst, snake bite, poison, fire, drowning,
    and wounds. He then explains that some deaths occur through the working of former
    evil deeds, with people dying by the same means they once used to kill others.
  language: English
  quote_policy: summarized
