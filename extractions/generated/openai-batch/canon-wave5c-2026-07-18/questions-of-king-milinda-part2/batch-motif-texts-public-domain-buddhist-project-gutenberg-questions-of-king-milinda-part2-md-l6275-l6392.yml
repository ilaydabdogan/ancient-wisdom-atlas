canonical_text:
  quote: ''
  summary: A Mara-associated god attempts to divert the Bodisat from his purpose by
    promising the Wheel-treasure, the Seven Treasures, universal dominion, and many
    heroic sons. Nagasena explains to the king that the promise was a lie meant as
    temptation and that the Bodisat would not have turned back, because he had understood
    impermanence, suffering, and no-soul, had destroyed attachment, and was on his
    final birth toward Buddhahood. Irreversible water flow and impossible cosmic reversals
    are used as analogies for the Bodisat’s unturning resolve.
  language: English
  quote_policy: summarized
