canonical_text:
  quote: ''
  summary: A dialogue considers whether a recluse has any advantage over a layman
    if both can attain Arahatship. Nagasena answers that supreme attainment, insight,
    and conduct win Arahatship, while renunciation remains immeasurably advantageous
    and enables swift accomplishment. A following dilemma asks why the Bodisat abandoned
    severe asceticism as ineffective for wisdom, yet the Tathagata later exhorted
    disciples to exert themselves and overthrow the armies of the Evil One.
  language: English translation with Pali terms in notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A challenge asks what distinction remains between layman and recluse if a
    layman observing vows can reach Arahatship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena says the person who has reached Supreme Attainment bears the palm,
    and that either a layman or a recluse who attains supreme insight and supreme
    conduct can win Arahatship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena says the recluse is the lord and master of the fruit of renunciation,
    and that renunciation has many immeasurable advantages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The value of renunciation is compared to a wish-conferring gem whose price
    no one can measure.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The immeasurability of renunciation is compared to the impossibility of counting
    the waves in the great ocean.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The recluse is described as content with little, joyful, detached from the
