    straight, and unstained.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Bodisat is described as having practiced unmatched austerity, exertion,
    battling against evil, routing the armies of the Evil One, abstinence in food,
    and austere life.
  category: action
  evidence_refs:
  - ev:8
