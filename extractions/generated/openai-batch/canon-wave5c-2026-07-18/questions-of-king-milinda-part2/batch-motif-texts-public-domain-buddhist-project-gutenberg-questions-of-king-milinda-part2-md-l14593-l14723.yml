canonical_text:
  quote: ''
  summary: 'The passage gives monastic instructions through animal analogies. A bhikshu
    is told to be content with food or lack of food, supported by a cited saying about
    Maha Kassapa. The A''akravaka bird supplies three qualities: lifelong constancy
    to its mate, satisfaction with water-plants without loss of strength or beauty,
    and doing no harm to living beings. These are mapped to persistence in thought,
    contentment with what is received, and non-violence with compassion. A cited A''akravaka
    Jataka verse reinforces non-harm. The Pe?2ahika bird supplies an analogy of jealousy:
    as the bird is jealous of her mate, the bhikshu should be vigilant against evil
    dispositions through mindfulness and self-control.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A strenuous bhikshu is instructed not to be alarmed if he gets no food and,
    if he does get food, to eat without craving, faintness, or sinking, with awareness
    of the purpose of eating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One is cited as praising Maha Kassapa for being content with whatever
    food he receives and for not acting improperly for the sake of alms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The A'akravaka bird is said never to forsake its mate until the close of life;
    the bhikshu is told never to give up the habit of thought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The A'akravaka bird is said to feed on Sevala and Pa/zaka water-plants, be
    satisfied with them, and lose neither strength nor beauty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bhikshu is told to find satisfaction in whatever he receives; if he does
    so, he does not decrease in meditation, wisdom, emancipation, insight connected
    with emancipation, or goodness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The A'akravaka bird is said to do no harm to living things; the bhikshu is
    instructed to lay aside cudgel and sword and to be modest, pitiful, compassionate,
    and kind to living creatures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cited A'akravaka Jataka verse describes a person who does not kill, destroy,
    oppress, or cause taking from others, and whose kindness to living things leaves
    peace undisturbed by wrath.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Pe?2ahika bird is described as being jealous of her mate and refusing
    to nourish her young.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bhikshu is told to be jealous of evil dispositions arising within him,
    to put them away by mindfulness into self-control, and to dwell at the door of
    the mind in self-possession concerning the body.
  category: action
  evidence_refs:
  - ev:6
