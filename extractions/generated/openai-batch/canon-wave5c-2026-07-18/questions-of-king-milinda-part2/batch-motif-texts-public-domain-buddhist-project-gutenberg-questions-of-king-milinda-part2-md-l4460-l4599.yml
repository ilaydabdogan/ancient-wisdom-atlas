canonical_text:
  quote: ''
  summary: Nagasena answers the king’s question about why monks engage in recitation,
    inquiry, building work, and offerings if the goal is freedom from obstructive
    mental states. He explains that such activities assist those whose minds require
    gradual means, using similes of reaping a field with or without a fence, reaching
    fruit on a mango tree by supernatural power or by a ladder, and accomplishing
    business alone or with helpers.
  language: English
  quote_policy: summarized
