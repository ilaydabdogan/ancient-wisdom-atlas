    subject is described as becoming free from passion, malice, dullness, pride, wrong
    views, and evil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The liberated practitioner is described as crossing the ocean of Samsara,
    stemming the torrent of cravings, cleansing the threefold stain, entering the
    city of Nirvana, and emancipating the mind in Arahatship.
  category: sequence
  evidence_refs:
  - ev:2
