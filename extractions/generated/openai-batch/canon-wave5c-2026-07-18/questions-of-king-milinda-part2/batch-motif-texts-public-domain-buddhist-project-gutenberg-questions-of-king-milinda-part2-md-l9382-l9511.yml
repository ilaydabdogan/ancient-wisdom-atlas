  text: The Blessed One is said to have made known meditation subjects including impermanence,
    absence of an abiding principle, impurity and danger of the body, freedom from
    passion, peace, death, corpses in decay, execution grounds, love, pity, sympathy,
    and equanimity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
