canonical_text:
  quote: ''
  summary: The passage presents teachings of the Blessed One through market metaphors.
    Meditation subjects are called a bazaar of flowers; the practitioner who takes
    a subject for meditation is said to overcome defilements, cross the ocean of Samsara,
    and enter the city of Nirvana. A verse urges taking Karma as the price and buying
    an object for thought. The king then asks Nagasena about the Buddha's perfume
    bazaar and fruit bazaar. The perfume bazaar is explained as categories of virtue
    whose goodness spreads through the world like fragrance, surpassing physical perfumes.
    The fruit bazaar is introduced, but the excerpt ends before its full list is given.
  language: English
  quote_policy: summarized
