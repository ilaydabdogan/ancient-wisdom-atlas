  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cited verse attributed to Sariputta says that a man with evil in his heart,
    inert, wicked, and knowing little of the sacred words should not be one’s companion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bull never forsakes its own stall, and the Bhikshu is told never to abandon
    his own body despite its impermanent nature and dissolution.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bull that has taken the yoke bears it through ease and pain, and the Bhikshu
