canonical_text:
  quote: ''
  summary: 'Nagasena answers the king by giving animal analogies for qualities a strenuous
    Bhikshu should adopt: the deer avoids danger and bad company; the bull remains
    steadfast, bears the yoke, thirsts for instruction, and accepts admonition; the
    boar seeks water and lies in a trough as analogies for love-meditation and contemplation;
    the elephant crushes the earth and looks straight ahead as analogies for crushing
    evil and disciplined gaze.'
  language: English
  quote_policy: summarized
