canonical_text:
  quote: ''
  summary: 'The passage explains the value of keeping the vows through an extended
    sequence of similes: it protects, purifies, guides out of rebirths and defilements,
    leads toward Nirvana, reveals the nature of phenomena, wards off evil dispositions,
    dispels ignorance, and produces virtues. It then compares Arahats seeking the
    virtues of vow-keeping to ordinary people seeking necessary supports such as food,
    medicine, a boat, refuge, teacher, king, or wishing-gem. A final list pairs everyday
    functions of objects and persons with corresponding benefits of the character
    produced by keeping the vows.'
