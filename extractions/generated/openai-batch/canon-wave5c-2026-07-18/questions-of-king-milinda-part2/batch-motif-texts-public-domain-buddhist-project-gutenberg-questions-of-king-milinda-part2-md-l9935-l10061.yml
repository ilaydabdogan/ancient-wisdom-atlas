canonical_text:
  quote: ''
  summary: 'The passage explains two metaphorical jewels of the Blessed One: the fourfold
    jewel of discrimination and the sevenfold jewel of wisdom. A Bhikkhu adorned with
    these qualities enters assemblies confidently, answers doctrinal and linguistic
    puzzles, dispels doubt, and is compared to a well-armed warrior. Wisdom is further
    described as a jewel or diadem acquired through good actions and as illumination
    that dispels darkness among gods and humans.'
  language: English
  quote_policy: summarized
