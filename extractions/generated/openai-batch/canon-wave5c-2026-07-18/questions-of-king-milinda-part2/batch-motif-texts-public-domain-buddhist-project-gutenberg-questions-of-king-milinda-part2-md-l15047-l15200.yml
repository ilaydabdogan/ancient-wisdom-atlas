canonical_text:
  quote: ''
  summary: The passage presents a sequence of analogical teachings. A road spider's
    net models guarding the six sense doors and cutting off evil thoughts. A child
    at the breast models pursuing one's own good, supported by a cited exhortation
    to Ananda. A land tortoise avoiding water models seeing danger in carelessness
    and preserving earnestness, supported by a Dhammapada verse. A mountain height
    models concealment of others' faults, emptiness of defilements, solitude, purity,
    and association with noble ones, supported by a Sa.myutta Nikaya stanza. The next
    topic, the tree, is introduced only by a question.
  language: English
  quote_policy: summarized
