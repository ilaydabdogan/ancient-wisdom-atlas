canonical_text:
  quote: ''
  summary: A dialogue uses several similes to explain why entry into the Order is
    offered to those not yet purified. The Tathagata is said to have placed ambrosial
    medicine and ambrosial food in his religion for beings afflicted by sin and craving;
    those who refuse to drink or eat remain responsible for returning to a lower state.
    Further similes compare renunciation to a bathing tank and to a physician’s medicine,
    both of which would be useless if restricted to those already clean or healthy.
  language: English
  quote_policy: summarized
