- id: obs:4
  text: The king accepts Nagasena's statement at the end of the problem on virtue
    and vice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king asks about dreams seen by men and women, including pleasant and evil
    dreams, dreams of things seen or unseen, things done or not done, peaceful and
    terrible dreams, near and distant matters, many shapes, and many colours.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nagasena defines a dream as a suggestion coming across the path of the mind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Nagasena lists six kinds of people who see dreams: those of windy, bilious,
    or phlegmatic humour; those dreaming by the influence of a god; those dreaming
    by their own habits; and those dreaming by prognostication. He says only the last
    kind is true.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For a prognostic dream, Nagasena says the mind does not seek the omen and
    no one else tells it; the prognostication comes of its own accord into the mind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena compares prognostication entering the mind to a looking-glass that
    does not seek a reflection and is not given a reflection by another, but receives
    an object reflected within its sphere.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nagasena says that the same mind which sees the dream does not know what auspicious
    or terrible result will follow; after the omen occurs, the dreamer tells others,
    and they explain its meaning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nagasena compares dream interpretation to marks, pimples, and eruptions arising
    on a body; fortune-tellers observe their location and declare a result, although
    the marks themselves do not know what event they bring about.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'A note gives examples of dream contents associated with the six dream classes:
    journeys through space, fire and conflagrations, water, good or bad things according
    to a god''s kindness or malignity, what the dreamer has seen or heard, and future
    gain or loss.'
  category: other
  evidence_refs:
  - ev:9
