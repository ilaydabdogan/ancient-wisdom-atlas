canonical_text:
  quote: ''
  summary: 'The passage concludes a discussion of virtue and vice by explaining merit-transfer
    and by comparing the remorseful wrongdoer to a drop of water swallowed by a dry
    river bed. It then begins a dilemma on dreams: the king asks what dreams are,
    Nagasena defines a dream as a suggestion crossing the mind, classifies six kinds
    of dreamers, says only prognostic dreams are true, and explains prognostic dreams
    through similes of a mirror receiving a reflection and bodily signs interpreted
    by fortune-tellers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that merit from a good deed can be transferred or wished
    for others, and that giving it away does not diminish but increases goodness.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who does evil is described as filled with remorse, unable to get
    away from the thought of the evil, without peace, miserable, burning, hopeless,
    wasting away, and overwhelmed by woe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The remorseful wrongdoer is compared to a drop of water that falls on a dry
    river bed and is swallowed up where it falls.
  category: relationship
  evidence_refs:
