canonical_text:
  quote: "“this body that I bear with me is my last, I am the supreme Healer and Physician.”"
  summary: A king raises a dilemma about bodily disease in the Buddha and Bakkula
    being named chief among healthy disciples. Nagasena replies that both statements
    are correct by distinguishing particular excellences among disciples from the
    Buddha’s comprehensive supremacy. He explains Bakkula’s bodily health as the result
    of a previous-birth aspiration and past healing acts performed as an ascetic.
  language: English
  quote_policy: quoted
