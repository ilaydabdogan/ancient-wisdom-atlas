canonical_text:
  quote: ''
  summary: 'The passage presents similes in which a Bhikshu is instructed to model
    inner discipline on a sovereign overlord, a white ant, and a cat: suppressing
    unwholesome ideas, examining conduct daily, guarding with self-possession, covering
    the mind with righteousness and self-restraint, seeking self-possession, and contemplating
    the origin and end of five groups of individuality.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sovereign overlord is said not to allow robber bands to form in his realm;
    the Bhikshu is instructed not to allow lustful, angry, or cruel ideas to arise
    within him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sovereign overlord is said to travel through the whole world to its ocean
    boundary examining evil and good; the Bhikshu is instructed to examine himself
    daily regarding acts, words, and thoughts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sovereign overlord is described as protected within and without; the Bhikshu
    is instructed to keep self-possession as a door-keeper against subjective and
    objective evil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The white ant is said to work only after making a roof over itself and covering
    itself; the Bhikshu is instructed to cover his mind with righteousness and self-restraint
    as a roof while on his alms round.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The result stated for the Bhikshu who covers the mind in this way is that
    he passes beyond all fear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The cat is said to frequent caves, holes, and interiors of storied dwellings
    only in search of rats; the Bhikshu is instructed to seek self-possession in village,
    woods, foot of trees, or empty house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The cat is said to crouch down while pursuing prey; the Bhikshu is instructed
    to remain conscious of the origin and end of five groups of individuality arising
    from clinging to existence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The five groups are listed as form, sensation, ideas, mental potentialities
    or confections, and self-consciousness.
  category: object
  evidence_refs:
  - ev:6
