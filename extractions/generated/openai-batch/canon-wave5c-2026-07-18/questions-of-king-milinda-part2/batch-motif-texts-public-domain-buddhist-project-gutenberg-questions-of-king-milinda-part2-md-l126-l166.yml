canonical_text:
  quote: ''
  summary: The passage discusses the relative accuracy and extent of Chinese, Tibetan,
    and Pali textual versions associated with the Milinda. It reports scholarly analysis
    by Sylvain Levi and Specht, noting that a later Chinese version is closer to the
    Pali but that both Chinese versions contain only a small portion. It then argues
    that the Milinda begins with an elaborate introduction recounting Nagasena and
    Milinda’s previous-birth meeting, their present lives, and their preparation for
    a major religious encounter, and uses an architectural analogy to question whether
    such a large introduction was originally intended for only a short work.
  language: English
  quote_policy: summarized
