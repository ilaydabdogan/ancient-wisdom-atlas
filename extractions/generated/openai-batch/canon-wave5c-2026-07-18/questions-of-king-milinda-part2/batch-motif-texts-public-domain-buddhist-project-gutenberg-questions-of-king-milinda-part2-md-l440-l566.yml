canonical_text:
  quote: ''
  summary: The passage introduces doctrinal parallels between the Katha Vatthu and
    the Milinda on the question of whether a soul exists. It summarizes Nagasena's
    use of similes, notes related Buddhist canonical treatments, gives a historical
    account of soul-beliefs as subtle internal images and external souls in natural
    things, and describes the Brahmajala Suttanta as a net rejecting many hypotheses
    about souls and the world.
  language: English
  quote_policy: summarized
