canonical_text:
  quote: ''
  summary: 'The passage concludes an explanation of why the Tathagata may be called
    a king: he receives homage, rewards strenuous conduct with deliverance, disciplines
    transgressors, and proclaims righteous regulations in continuity with ancient
    Buddhas. Nagasena states that the reasons for calling the Tathagata both Brahman
    and king are too numerous to enumerate fully, and the king accepts his answer.
    A new dilemma then begins concerning gifts to the Buddha: King Milinda cites the
    Buddha''s refusal of gifts obtained by sacred chanting, but contrasts this with
    the Buddha''s preliminary discourse that begins with giving and leads gods and
    men to offer alms, which disciples consume.'
  language: English
  quote_policy: summarized
