canonical_text:
  quote: ''
  summary: Nagasena states that many gods and humans, though laypersons living at
    home, realized Nirvana. The king asks why extra vows are needed if laypeople can
    realize Nirvana without them, using analogies of medicines, weapons, ladders,
    beds, caravans, boats, service, and wells. Nagasena replies that the vows have
    twenty-eight inherent good qualities, that those who keep them gain eighteen qualities,
    and that ten kinds of individuals are worthy of their advantages.
  language: English
  quote_policy: summarized
