canonical_text:
  quote: ''
  summary: 'The passage gives analogies for monastic discipline: a pilot sealing steering
    gear is compared to guarding the heart; a sailor working diligently on a ship
    is compared to mindful effort toward liberation; and several qualities of the
    sea are compared to rejecting evil, concealing attainments, choosing virtuous
    companions, and not transgressing precepts.'
  language: English
  quote_policy: summarized
