- id: obs:3
  text: The author states that the canon of the three Piṭakas was settled in the valley
    of the Ganges and adhered to in Ceylon, Burma, and Siam, but should not be called
    Ceylonese, Burmese, or Siamese.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the Milinda was never incorporated in the canon of
    the three Piṭakas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that many Buddhist books were composed in several languages
    outside the canon, but that no new canon in the European sense was formed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author rejects references in European books to a later canon supposedly
