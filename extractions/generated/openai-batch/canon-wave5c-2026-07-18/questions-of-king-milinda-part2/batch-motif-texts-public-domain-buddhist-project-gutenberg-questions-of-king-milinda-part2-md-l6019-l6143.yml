canonical_text:
  quote: ''
  summary: The passage concludes a discussion of Vessantara by comparing his fame
    and righteousness to a mountain bonfire and the fragrance of Naga tree blossoms,
    explaining why his children could not be kept as slaves. Vessantara instructs
    his son about ransom prices for himself and his sister and commands obedience
    to the Brahman unless payment is made. The king praises Nagasena for resolving
    the dilemma. A new dilemma begins concerning whether all Bodisats undergo penance;
    Nagasena answers that only Gotama did and explains differences among Bodisats
    while affirming the sameness of Buddhas in key qualities.
  language: English
  quote_policy: summarized
