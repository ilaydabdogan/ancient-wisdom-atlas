canonical_text:
  quote: |-
    By the javelin
    of my knowledge will I slay all my evil dispositions.
  summary: 'The passage gives a set of archer similes for the disciplined Bhikshu:
    aiming, straightening arrows, practicing at a target, and practicing early and
    late are compared to zeal, mindfulness, sense-restraint, contemplation of impermanence,
    and meditation. It then closes the riddle and reports cosmic signs, divine applause,
    and public homage to Nagasena after the king and Elder finish their questions
    and answers.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The archer is described as planting both feet, steadying the body, arranging
    arrows and quiver, closing one eye, and taking aim with the thought that he will
    hit the target.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The strenuous Bhikshu is instructed to ground zeal in righteousness, maintain
    kindness, restrain the senses, close the six doors of the senses and mind, and
    think of slaying evil dispositions with the javelin of knowledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The archer carries a vice for straightening bent arrows; the Bhikshu is told
    to carry mindfulness and thoughtfulness to straighten crooked and shifty ideas.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The archer practices at a target; the Bhikshu is told to practice by contemplating
    impermanence, sorrow in individuality, lack of an abiding soul, bodily ailments,
    dependence, and disintegration.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bodily frame or individuality is described as unstable, not a refuge,
    not a cave of security, empty, dangerous, insubstantial, a source of pains, food
    of evil and of the Evil One, and liable to rebirth, old age, disease, death, grief,
    lamentation, and despair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The archer practices early and late; the Bhikshu is instructed to practice
    meditation early and late, and a verse attributed to Sariputta says that sons
    of the Buddha gain the fruits loved by Arahats by not neglecting thought about
    the bodily frame.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the fifth riddle, the riddle of the archer, ends,
    and then summarizes the handed-down and not-handed-down Questions of Milinda.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the king and the Elder finish the puzzles and solutions, the earth shakes
    six times to its ocean boundary, lightning flashes, gods pour flower-rain from
    heaven, Maha Brahma applauds, and a roar like a storm in the deep is heard.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king's five hundred high ministers, inhabitants of Sagala, and women of
    the king's palace bow before Nagasena with clasped hands raised to their foreheads
    and then depart.
  category: action
  evidence_refs:
  - ev:6
