  summary: 'The passage first lists further similes in a table of contents, then gives
    didactic similes in which Nagasena compares an ass and a cock to qualities a strenuous
    Bhikshu should cultivate: not resting in sloth, rising and acting promptly, performing
    duties around the Dagaba, entering solitude, and treating food only as bodily
    support for the higher life.'
