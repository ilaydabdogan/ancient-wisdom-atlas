canonical_text:
  quote: ''
  summary: 'The passage concludes an explanation of premature death by comparing it
    to a crop destroyed before harvest by a hail-storm and by listing bodily and external
    causes of untimely death. The king praises Nagasena''s use of reason and simile.
    A new dilemma asks whether wonders occur at the burial mounds of all deceased
    Arahats. Nagasena answers that wonders occur at some but not others, and explains
    three sources: a living Arahat''s resolve concerning his own future mound, gods
    acting out of pity to strengthen faith, and believing human devotees placing offerings
    with a resolve. If no wonder occurs, one should infer liberation from the remembered
    purity of conduct. The next dilemma begins by asking whether all who regulate
    their lives attain insight into Truth; Nagasena says some do and some do not,
    and begins with the case of animal birth.'
  language: English translation
  quote_policy: summarized
