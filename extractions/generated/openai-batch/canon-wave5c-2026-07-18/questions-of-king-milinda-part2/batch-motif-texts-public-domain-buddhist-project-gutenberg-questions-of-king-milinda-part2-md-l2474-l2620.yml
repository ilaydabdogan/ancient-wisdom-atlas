canonical_text:
  quote: Self-dependent for his knowledge is the Tathagata, without a master
  summary: A dilemma is raised about the Buddha saying he had no teacher while also
    saying that A/ara Kalama had been his teacher. Nagasena resolves the issue by
    distinguishing worldly teachers of the Bodisat before awakening from the absence
    of any teacher above the Tathagata in transcendental wisdom. Five pre-awakening
    teachers are listed, including Brahmans who read his birth marks, Sabbamitta,
    an unnamed god who prompted the Great Renunciation, A/ara Kalama, and Uddaka son
    of Rama.
  language: English translation
  quote_policy: quoted
