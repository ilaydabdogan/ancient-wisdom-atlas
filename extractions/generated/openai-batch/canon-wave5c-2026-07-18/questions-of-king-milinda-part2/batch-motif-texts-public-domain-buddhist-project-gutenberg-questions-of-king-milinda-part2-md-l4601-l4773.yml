canonical_text:
  quote: ''
  summary: The passage explains Asavakkhaya as the destruction of the Asavas and notes
    Sariputta's final freedom from them. It then presents a dialogue in which the
    king questions Nagasena about the teaching that a layperson who attains Arahatship
    must either enter the Order that same day or die. Nagasena says such a person
    cannot admit himself, because self-admission would be theft, and explains with
    similes of weak digestion, grass under a rock, and a weak man unable to bear a
    kingdom. The next dilemma asks whether an Arahat can be thoughtless or commit
    offences; Nagasena says Arahats are not careless but may commit rule-based offences,
    and begins distinguishing ordinary moral breaches from breaches of the Order's
    rules.
  language: English with Pali terms
  quote_policy: summarized
