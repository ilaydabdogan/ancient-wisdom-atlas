canonical_text:
  quote: ''
  summary: 'The passage gives a series of animal exempla in a dialogue: the rat models
    attentive seeking, the scorpion models knowledge held ready as a weapon, the mungoose
    models love as an antidote before entering a hostile world, the old male jackal
    models acceptance of any food without disgust or discrimination, and the deer
    models forest and open-sky ascetic dwelling. Named elders and the Blessed One
    are cited as authorities. The excerpt also begins with a verse advising present-world
    conquest rather than seeking future rebirth or heaven.'
  language: English
  quote_policy: summarized
