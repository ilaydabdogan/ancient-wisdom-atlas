canonical_text:
  quote: ''
  summary: In a dialogue, Nagasena argues to the king that water has no soul or being.
    Sounds made by boiling water are explained as effects of heat, just as a drum
    without a soul makes sound through human effort. Nagasena further argues that
    if water were alive it would make sounds under all kinds of pressure, including
    pressure from elephants, ships, and giant fish, but it does not. The king praises
    the solution as discriminating and apt.
  language: English
  quote_policy: summarized
