canonical_text:
  quote: ''
  summary: The passage praises keeping the vows as leading to renunciation, wisdom,
    peace, and Nirvana. It then warns that an unfit, greedy, hypocritical person who
    takes the vows will suffer disgrace and expulsion in this life, torment in Avici
    purgatory in the next life, and later existence as a suffering Preta in monk-like
    form. An analogy compares this to an unfit low-born man receiving royal consecration
    and undergoing severe punishments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Keeping the vows is described as attaining many qualities, including protection
    from fears, instruction in renunciant life, quietude and insight, Nirvana, closing
    evil states, dispelling ignorance, allaying the threefold fire, and producing
    sevenfold wisdom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The advantage of keeping the vows is described as immeasurable, unequaled,
    great, extensive, deep, broad, weighty, worthy, and mighty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person with evil cravings, hypocrisy, greed, bodily appetite, desire for
    gain or fame, and unfitness for the outward signs of Arahatship is said to take
    the vows.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The unfit vow-taker is said to incur a twofold punishment and to suffer loss
    of whatever good may be in him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In this world the unfit vow-taker receives disgrace, scorn, blame, ridicule,
    suspension, excommunication, expulsion, and rejection.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the next life the unfit vow-taker suffers torment in the great Avici purgatory,
    described as a hundred leagues deep and covered with hot, scorching, fierce, fiery
    flames.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Within Avici purgatory the punished being rises and falls for myriads of years,
    moving upward, downward, and across, compared to a foam-bubble in a boiling sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After release from Avici, the punished being becomes a mighty Preta in the
    outward form of a monk, with a lean, dark, wounded, maggot-ridden body, burning
    stomach, tiny mouth, thirst, no refuge, and no protector.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Preta wanders over the earth groaning, weeping, crying for mercy, and
    wailing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An analogy states that an unfit, low-born man who receives royal consecration
    suffers mutilation, torture, being eaten by dogs, impalement, beheading, or other
    punishments.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The stated reason for the royal claimant's punishment is that he is unfit,
    has not properly attained royalty, and is inappropriate, unworthy, and unsuitable
    for it.
  category: relationship
  evidence_refs:
  - ev:6
