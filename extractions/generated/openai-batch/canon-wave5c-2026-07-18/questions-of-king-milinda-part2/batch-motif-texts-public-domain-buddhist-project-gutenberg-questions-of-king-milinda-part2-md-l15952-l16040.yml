canonical_text:
  quote: ''
  summary: King Milinda becomes joyful, loses pride and doubt, praises Nagasena for
    solving difficult questions, asks pardon, and declares himself a supporter of
    the faith. He and his men honor Nagasena; the king builds and gives him a monastery,
    supports him and the Arahat Bhikshus with requisites, later hands the kingdom
    to his son, renounces household life, gains insight, and attains Arahatship. Closing
    verses praise wisdom, the removal of doubt, the Tranquil State, and honoring the
    wise.
  language: English
  quote_policy: summarized
