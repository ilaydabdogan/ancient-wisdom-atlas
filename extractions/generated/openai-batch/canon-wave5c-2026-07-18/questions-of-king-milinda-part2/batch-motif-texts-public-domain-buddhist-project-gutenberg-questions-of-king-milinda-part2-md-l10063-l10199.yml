canonical_text:
  quote: ''
  summary: The king asks Nagasena what the Buddha's bazaar of all merchandise is.
    Nagasena explains it as the Buddha's teachings, relics, sacred mounds, and Order,
    where desired benefits such as high birth, wealth, health, wisdom, heavenly glory,
    and Nirvana are bought with Karma and religious observances. He then describes
    the inhabitants of the Buddha's City of Righteousness as learned reciters, preachers,
    ascetics, meditators, path-attainers, Arahats, and those free from passions who
    live austerely and look toward Nirvana.
  language: English with transliterated Pali terms
  quote_policy: summarized
