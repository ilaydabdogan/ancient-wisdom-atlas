canonical_text:
  quote: It always burns fiercely, O king, never gently.
  summary: The passage closes a prior dilemma about the method of laying down rules,
    then presents two dialogues in which the king asks Nagasena about the sun. Nagasena
    says the sun always burns fiercely, but clouds, fog, smoke, and eclipses can allay
    its heat. He then explains seasonal variation by saying that dust, pollen, clouds,
    gales, and rains obstruct the sun in the hot season, while the cold season leaves
    the rays clear and unobstructed.
  language: English
