canonical_text:
  quote: ''
  summary: A dialogue considers whether gifts obtained through taxation or causing
    sorrow can still produce happiness and rebirth in bliss. The king objects that
    Vessantara's giving of his wife and children was excessive and censurable. Nagasena
    argues that exceedingly great giving is praised, supports the point through many
    analogies of extraordinary qualities, and states that Vessantara became the Buddha
    through such mighty giving.
  language: English
  quote_policy: summarized
