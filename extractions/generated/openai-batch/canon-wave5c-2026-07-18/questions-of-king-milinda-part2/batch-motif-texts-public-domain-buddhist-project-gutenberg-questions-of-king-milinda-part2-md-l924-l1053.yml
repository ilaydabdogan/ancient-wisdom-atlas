canonical_text:
  quote: ''
  summary: Nagasena reconciles sayings attributed to the Blessed One about restraint
    in eating and the Buddha's own eating. He explains that restraint regarding the
    stomach prevents grave misconduct and supports insight, renunciant fruits, attainments,
    and higher knowledge. Devadatta is cited as a negative example, and a self-restrained
    parrot fledgling as a positive example that moved heaven and brought Sakka down.
    Nagasena distinguishes ordinary practitioners, compared to sick persons needing
    treatment, from the perfected Tathagata, compared to a naturally pure diamond
    needing no polishing. The king accepts. The passage then opens the next dilemma
    by juxtaposing the Buddha's self-description as supreme healer with Bakkula's
    distinction in bodily health.
  language: English
  quote_policy: summarized
