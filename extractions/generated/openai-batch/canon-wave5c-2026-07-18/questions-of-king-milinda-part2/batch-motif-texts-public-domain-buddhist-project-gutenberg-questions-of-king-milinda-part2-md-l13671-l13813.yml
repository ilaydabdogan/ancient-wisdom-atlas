canonical_text:
  quote: ''
  summary: Nagasena answers the king by listing five qualities of space and five qualities
    of the moon that a strenuous Bhikshu should cultivate. Space is used as a model
    for being ungraspable by evil dispositions, contemplating impermanence, fearing
    rebirth, having boundless righteousness and knowledge, and clinging to nothing.
    The moon is used as a model for increasing virtue, ruling one's will, solitude,
    displaying righteousness, and visiting invited lay families for alms with restraint.
    The passage cites the Blessed One's exhortation to Rahula and a Samyutta Nikaya
    saying about visiting laity like the moon.
  language: English
  quote_policy: summarized
