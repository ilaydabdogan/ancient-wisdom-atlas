canonical_text:
  quote: ''
  summary: 'The passage gives similes comparing qualities of the elephant and the
    lion to qualities a strenuous Bhikshu should cultivate: homelessness, meditative
    immersion, careful mindfulness, purity of mind, movement along the paths of saintship,
    righteousness, independence from worldly dependence, orderly alms practice, non-storage
    of food, and non-craving. It also quotes a verse on restraint in action, speech,
    and mind.'
