canonical_text:
  quote: ''
  summary: Nagasena explains to the king that ten worldly bonds prevent people from
    renouncing or cause them to return, but the Bodisat had broken through them. In
    response to the king’s question about the value of the Bodisat’s penance before
    full knowledge, Nagasena lists socially despised conditions and says the Bodisat
    undertook penance as earnest action while maturing knowledge. The passage then
    quotes the Bodisat’s recognition that severe penance would not bring the desired
    insight and his question whether another way to wisdom might exist; Nagasena begins
    a list of mental qualities that weaken the mind.
  language: English
  quote_policy: summarized
