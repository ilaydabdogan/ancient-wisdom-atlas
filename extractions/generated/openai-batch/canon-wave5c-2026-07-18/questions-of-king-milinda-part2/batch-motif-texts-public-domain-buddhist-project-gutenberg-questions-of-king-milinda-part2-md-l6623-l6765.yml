canonical_text:
  quote: ''
  summary: A king challenges Nagasena by contrasting immediate visible punishments
    for wrongdoing with fewer visible rewards for virtue. Nagasena answers with ancient
    and current-period examples of donors and observant persons who gained divine
    glory, wealth, status, or healing in their present lives. The king counters with
    mass punishments, a catastrophic war, a scene of headless corpses dancing after
    a great slaughter, and the case of the Kosala king whose unequalled giving did
    not bring present-life reward.
  language: English
  quote_policy: summarized
