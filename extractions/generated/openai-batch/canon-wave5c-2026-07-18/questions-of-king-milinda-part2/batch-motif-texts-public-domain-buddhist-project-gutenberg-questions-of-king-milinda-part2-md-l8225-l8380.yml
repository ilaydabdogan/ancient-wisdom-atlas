canonical_text:
  quote: ''
  summary: In dialogue with the king, Nagasena argues that Nirvana is unalloyed bliss
    even though the quest for it involves bodily and mental hardship. He supports
    this with analogies to the pursuit of sovereignty and the pursuit of knowledge,
    where painful preliminaries are distinct from later enjoyment. A new dilemma then
    asks whether Nirvana’s form, figure, duration, or measure can be made clear; Nagasena
    replies that it has nothing similar and uses the ocean’s immeasurable water and
    creatures as an analogy for an existing condition whose measure cannot be stated.
  language: English
  quote_policy: summarized
