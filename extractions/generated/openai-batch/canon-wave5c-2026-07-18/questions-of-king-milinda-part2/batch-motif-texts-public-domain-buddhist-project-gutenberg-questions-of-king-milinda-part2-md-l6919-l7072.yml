canonical_text:
  quote: ''
  summary: In a dialogue, the king asks Nagasena whether offerings and moral acts
    can benefit the departed, and whether evil deeds could likewise be dedicated to
    them. Nagasena says good deeds can be shared but evil deeds cannot, explaining
    with analogies of gifts, exiting a chamber, water, mountains, lamps, irrigation,
    rain, and a deep pool. He distinguishes the limited effect of vice from the expansive
    and shareable abundance of virtue.
  language: English
  quote_policy: summarized
