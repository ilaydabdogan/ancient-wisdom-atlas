  summary: The passage completes an analogy about many kinds of people entering a
    well-built city and inferring the skill of its architect. It then applies the
    analogy to the Blessed One, describing him as having overcome Mara, dispelled
    heresy and ignorance, raised the torch of Truth, reached Buddhahood, and built
    a City of Righteousness whose architectural features are named as virtues and
    teachings. The passage ends with the king asking Nagasena about the Buddha's flower
    bazaar.
