canonical_text:
  quote: ''
  summary: 'The passage gives animal-based instructions for a strenuous Bhikshu: like
    a cock blind by night, he should avoid attending to sensory delights; like a cock
    that does not desert its home, he should not abandon presence of mind; like a
    squirrel using its tail as a cudgel, he should repel sin with self-possession;
    and like a female panther said to conceive only once, he should resolve not to
    enter future life after contemplating the sufferings of rebirth and transmigration.
    Several authoritative verses and sayings are cited in support.'
  language: English
  quote_policy: summarized
