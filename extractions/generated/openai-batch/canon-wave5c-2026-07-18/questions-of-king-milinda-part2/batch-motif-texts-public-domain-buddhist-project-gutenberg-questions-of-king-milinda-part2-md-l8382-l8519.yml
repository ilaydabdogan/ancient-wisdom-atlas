canonical_text:
  quote: ''
  summary: A dialogue between the king and Nagasena treats the Formless Ones as beings
    whose form, figure, duration, and size cannot be explained, then applies that
    model to Nirvana as an existing condition that cannot be measured or described
    in such terms. The king asks whether any quality of Nirvana can be made evident
    by metaphor, and Nagasena lists analogical objects before explaining qualities
    of lotus, water, and medicine, with a transition to ocean qualities.
  language: English
  quote_policy: summarized
