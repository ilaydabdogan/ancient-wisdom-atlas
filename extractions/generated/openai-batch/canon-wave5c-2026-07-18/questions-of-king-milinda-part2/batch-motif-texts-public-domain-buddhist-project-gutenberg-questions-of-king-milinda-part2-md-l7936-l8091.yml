  summary: The passage states that certain persons, including a child under seven,
    cannot attain insight into the Truth. King Milinda questions why an infant, apparently
    free from defilements, cannot attain insight. Nagasena answers that the infant
    mind is weak and unable to grasp the great principle of Nirvana, illustrating
    this with similes of Sineru mountain, the broad earth and a tiny drop of water,
    weak fire and darkness over the world, and a Salaka trying to swallow an elephant
    king.
