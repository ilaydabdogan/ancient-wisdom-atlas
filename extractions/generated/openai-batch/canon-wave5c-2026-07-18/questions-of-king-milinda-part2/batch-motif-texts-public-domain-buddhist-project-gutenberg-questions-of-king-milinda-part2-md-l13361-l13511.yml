canonical_text:
  quote: ''
  summary: 'The passage includes an opening note about a woman who rejects Ajivaka
    ascetics and a verse comparing true recluses to unmoved earth. It then presents
    a dialogue in which the king asks Nagasena about qualities a bhikshu should take
    from water and fire: water models purity, refreshment, cleansing, desirability,
    and non-harm; fire models burning away evil dispositions, severity toward defilements,
    zeal, impartiality, and dispelling ignorance with knowledge. The passage ends
    by introducing a question about wind.'
  language: English
  quote_policy: summarized
