canonical_text:
  quote: ''
  summary: Nagasena explains to the king how one who orders life rightly perceives
    birth, old age, disease, death, and the insecurity of repeated becoming. Through
    analogies of terror and refuge, mud and a clean place, heated iron, a fiery furnace,
    and a lost traveller finding a path home, the passage describes the mind turning
    toward peace, no becoming, and Nirvana, culminating in the realization of Arahatship.
    The king accepts the explanation.
  language: English
  quote_policy: summarized
