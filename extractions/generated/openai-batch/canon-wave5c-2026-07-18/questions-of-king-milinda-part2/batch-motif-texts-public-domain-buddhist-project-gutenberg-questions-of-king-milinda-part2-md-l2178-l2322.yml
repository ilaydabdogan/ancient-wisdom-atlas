canonical_text:
  quote: ''
  summary: The passage distinguishes wrong and right verbal intimation by monks concerning
    needed goods, gives Sariputta's rejection of medicine obtained through breach
    of silence, explains the Buddha's refusal of Kasi-Bharadvaja's alms, describes
    gods infusing the Sap of Life into the Buddha's food at every meal, and begins
    a dilemma about the Buddha's post-enlightenment inclination toward peace rather
    than teaching despite aeons of perfected omniscient wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A verbal intimation is called wrong when a monastic's words cause listeners
    to bring goods from their stores; true members of the Order will not use goods
    obtained in that way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sariputta, while ill at night, answered Moggallana about what medicine would
    help him, obtained medicine through that breach of silence, and rejected it to
    avoid compromising the rule about livelihood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A monastic in need may rightly tell related or previously inviting families
    that he needs medicine; goods obtained that way are said to be usable by true
    members of the Order.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tathagata refused alms from Kasi-Bharadvaja the Brahman because the offering
    was presented as a test or puzzle intended to draw him out and convict him of
    error.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king asks whether gods infused heavenly Sap of Life into the Tathagata's
    bowl at every meal or only into two dishes, tender boar's flesh and rice porridge
    boiled in milk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena answers that gods infused the Sap of Life into each morsel whenever
    the Tathagata ate, comparing this to a royal cook pouring sauce over the king's
    food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Veranja, when the Tathagata ate dried barley cakes, the gods moistened
    each cake with the Sap of Life, and his body was fully refreshed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king praises the gods as fortunate and zealous in caring for the Tathagata's
    body and accepts Nagasena's explanation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A new dilemma states that the Tathagata perfected omniscient wisdom over immense
    aeons for the salvation of great masses of people.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The same dilemma contrasts this with the claim that just after attaining omniscience,
    the Tathagata's heart inclined toward rest in peace rather than proclamation of
    the Truth.
  category: sequence
  evidence_refs:
  - ev:9
