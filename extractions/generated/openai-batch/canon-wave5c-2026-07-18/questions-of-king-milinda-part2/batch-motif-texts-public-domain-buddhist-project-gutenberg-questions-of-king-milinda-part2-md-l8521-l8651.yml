canonical_text:
  quote: ''
  summary: 'In a question-and-answer dialogue, King Milinda asks Nagasena to identify
    qualities of Nirvana that resemble qualities of the ocean, food, space, the wish-conferring
    gem, red sandalwood, and, at the end of the passage, the skimmings of ghee. Nagasena
    answers by listing analogies: the ocean is empty of corpses, boundless, home to
    mighty creatures, and blossoming with waves; food supports life and removes hunger
    and suffering; space is unborn, unobstructed, unsupported, and infinite; the wishing-gem
    satisfies desires, delights, and shines; red sandalwood is hard to get, fragrant,
    and praised by the good.'
  language: English
  quote_policy: summarized
