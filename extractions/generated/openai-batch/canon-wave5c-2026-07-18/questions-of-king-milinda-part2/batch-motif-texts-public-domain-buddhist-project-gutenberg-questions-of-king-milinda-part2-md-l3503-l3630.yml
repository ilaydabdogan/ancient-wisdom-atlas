canonical_text:
  quote: ''
  summary: A dialogue uses a sequence of similes to explain why admitting only those
    already advanced on the path would make renunciation useless, and why those who
    leave the Order nevertheless reveal the greatness, purity, exclusiveness, and
    difficulty of the religion of the Conquerors. The similes include a feast for
    those already full, an unworthy man unable to sustain a kingdom, water not adhering
    to a lotus, the ocean casting out a corpse, and clumsy archers failing at hair-splitting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker asks whether well-fed people would gain advantage from a milk-rice
    charity feast from which hungry people were excluded.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king answers that such people would gain no advantage because they had
    already obtained elsewhere what they would seek at the feast.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says that if only laymen already in the first stage of the Excellent
    Way were received into the Order, the benefit sought in renunciation would already
    have been gained elsewhere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker states that those who return to the lower state manifest five
    good qualities in the religion of the Conquerors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A poor, low-born, unwise man who comes into possession of a great kingdom
    is said to be unable to support the dignity and to be overthrown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: People without distinction, merit, or wisdom who renounce according to the
    religion of the Conquerors are said to return to the lower state because they
    cannot bear that renunciation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Water that falls on a lotus is said to flow away and not adhere because the
    lotus is pure from any spot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Deceitful and treacherous people admitted into the religion of the Conquerors
    are said not to find a standing-place in it and to return to the lower state.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The great ocean is said not to tolerate a dead corpse, but to bring it to
    shore and cast it onto dry land.
  category: action
  evidence_refs:
  - ev:6
