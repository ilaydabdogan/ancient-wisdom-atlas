canonical_text:
  quote: ''
  summary: 'The passage presents a dialogue in which the king asks Nagasena about
    the Buddha''s jewel bazaar. The answer describes doctrinal jewels made known by
    the Blessed One: right conduct, meditation, knowledge, emancipation, insight from
    assurance of emancipation, discrimination, and the sevenfold wisdom of Arahats.
    The jewel of right conduct is explained through forms of discipline and is said
    to make a bhikkhu shine beyond worldly jewels. A verse exhorts listeners to pay
    Karma and buy Buddha-gems. The jewel of meditation is then described through meditative
    states and by the simile of bad thoughts flowing away like water from a lotus
    leaf.'
  language: English
  quote_policy: summarized
