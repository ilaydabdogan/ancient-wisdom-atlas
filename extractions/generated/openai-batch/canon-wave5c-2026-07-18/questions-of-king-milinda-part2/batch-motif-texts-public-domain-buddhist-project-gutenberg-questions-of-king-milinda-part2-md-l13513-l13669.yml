canonical_text:
  quote: ''
  summary: The passage gives analogical instruction for a strenuous Bhikshu through
    qualities of wind and rock. Wind models delight in meditation, overcoming evil
    dispositions, mental movement among transcendental things, carrying righteousness,
    and homelessness. Rock models firmness, independence, preventing evil dispositions
    from taking root, rising through knowledge, and remaining neither elated nor depressed.
    The passage includes citations to Buddhist verses and editorial notes on parallels.
  language: English translation
  quote_policy: summarized
