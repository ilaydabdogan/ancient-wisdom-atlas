canonical_text:
  quote: ''
  summary: The king asks Nagasena why the Tathagata, after maturing omniscience for
    the salvation of beings, hesitated to proclaim the Truth. Nagasena answers that
    the Doctrine was profound and beings were difficult to teach, and that all Tathagatas
    proclaim the Dhamma when Brahma requests it, because Brahma's reverence leads
    the world of gods and men to revere the teaching.
  language: English
  quote_policy: summarized
