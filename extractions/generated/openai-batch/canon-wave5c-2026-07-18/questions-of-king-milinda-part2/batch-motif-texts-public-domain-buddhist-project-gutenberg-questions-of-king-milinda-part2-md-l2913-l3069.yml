canonical_text:
  quote: ''
  summary: Nagasena answers a dilemma about whether the Order becomes superior to
    the Tathagata by receiving a gift. He uses a royal gift analogy, explains that
    the Tathagata had his property given to the gift-worthy Order, and cites sayings
    and verses that exalt the Buddha as supreme among gods and men. King Milinda accepts
    the answer. The passage then begins the next dilemma on whether laymen or recluses
    can reach the Supreme Attainment and Arahatship.
  language: English
  quote_policy: summarized
