canonical_text:
  quote: "“Nirva;za is all bliss, O king. There is no intermingling of pain in it.”"
  summary: The passage closes one dilemma with Nagasena saying that an infant under
    seven cannot attain insight of the Truth. A new dilemma asks whether Nirvana is
    entirely bliss or partly painful. Nagasena says Nirvana is pure bliss. The king
    objects that seekers of Nirvana endure bodily and mental exertion, restraint,
    suppression of sleep, sense-control, and renunciation, unlike worldly people who
    enjoy sense pleasures. Nagasena answers that such pain belongs to the preliminary
    seeking of Nirvana, not to Nirvana itself, and begins an analogy with the bliss
    of sovereignty and the hardships of kings suppressing frontier revolt. Editorial
    notes also discuss an unidentified insect and compare a tale to Aesop’s frog-and-bull
    fable.
  language: English translation with transliterated Pali/Sanskrit terms
  quote_policy: quoted
