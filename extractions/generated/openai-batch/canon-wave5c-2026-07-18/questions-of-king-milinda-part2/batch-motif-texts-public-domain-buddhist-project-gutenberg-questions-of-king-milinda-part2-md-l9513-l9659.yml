  text: The passage names this metaphorical offering of attainments as the Blessed
    One's bazaar of fruits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Four Noble Truths are described as drugs or antidotes made known by the
    Blessed One, freeing hearers from rebirth, old age, death, grief, lamentation,
    pain, sorrow, and despair.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The listed Buddhist disciplines are described as medicines by which the Blessed
