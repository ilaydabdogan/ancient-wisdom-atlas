  text: An ambrosia made known by the Blessed One is said to besprinkle gods and men
    as men anoint a king on coronation day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ambrosia is identified as meditation consisting in active attention to
    corporeal things, and those who feed on that active attention are said to feed
    on ambrosia.
  category: speech
  evidence_refs:
  - ev:7
