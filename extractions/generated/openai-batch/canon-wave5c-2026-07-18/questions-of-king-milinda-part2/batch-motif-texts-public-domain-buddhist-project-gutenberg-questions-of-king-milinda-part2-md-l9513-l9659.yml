canonical_text:
  quote: ''
  summary: 'Nagasena answers the king by describing several metaphorical bazaars of
    the Blessed One: fruits bought with Karma, antidotes identified with the Four
    Noble Truths, medicines identified with Buddhist disciplines that purge faults,
    and ambrosia identified with mindful attention to corporeal things, each leading
    to liberation from rebirth, aging, death, and suffering.'
  language: English
  quote_policy: summarized
