canonical_text:
  quote: "“The Tathagata ... is the discoverer of a way that was unknown.”"
  summary: Nagasena explains that the Buddha did not create the eightfold way but
    rediscovered and restored an already existing path that had become ruined and
    hidden. A second dilemma concerns the Buddha’s claim of former non-harm and the
    account that, as Lomasa Kassapa, he caused many creatures to be killed in the
    Drink of Triumph sacrifice; Nagasena explains this as an act done while overcome
    by lust at the sight of Candavati.
  language: English
  quote_policy: quoted
