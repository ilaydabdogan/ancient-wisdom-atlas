canonical_text:
  quote: ''
  summary: A king challenges Nagasena on how Nirvana can be realized through a path
    while not being produced by a cause. Nagasena distinguishes causes for realization
    from causes of origin, using analogies of going to the Himalaya, crossing the
    ocean to the further shore, and knowing wind exists though it cannot be shown
    by color or form. He states that Nirvana is uncompounded, not sense-perceptible,
    but perceptible to the mind by an attained disciple with a pure heart. The king
    accepts the explanation.
  language: English
  quote_policy: summarized
