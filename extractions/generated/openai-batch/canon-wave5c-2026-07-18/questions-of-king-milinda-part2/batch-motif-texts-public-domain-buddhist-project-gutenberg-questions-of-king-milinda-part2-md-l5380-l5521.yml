canonical_text:
  quote: ''
  summary: A dialogue asks whether all Bodisats give away wives and children or only
    Vessantara. Nagasena answers that all do so, with the wife consenting and the
    children lamenting because of their age. The king objects by recounting Vessantara
    binding and giving his children to a Brahman despite their cries. Nagasena defends
    the act as exceptionally difficult and famous across gods, men, and other beings,
    showing Bodisat qualities such as non-greed, non-clinging, self-sacrifice, and
    renunciation. The king then asks whether a gift that causes sorrow can produce
    happiness and rebirth in bliss; Nagasena argues yes by analogy to transporting
    a virtuous disabled person in a carriage, even though the bullocks are pained.
  language: English
  quote_policy: summarized
