canonical_text:
  quote: ''
  summary: A dialogue explains why the Tathagata can be called both Brahman and king.
    He is called Brahman because evil qualities are suppressed, because he is emancipated,
    cultivates supreme qualities, maintains ancient instruction, enjoys ecstatic meditation,
    and knows the course of births. The name is said to arise from emancipation and
    enlightenment under the Tree of Wisdom, where the Buddhas overthrew the armies
    of the Evil One and attained omniscient knowledge. He is called king because he
    rules and guides the world in righteousness, over the ten thousand world systems,
    and raises the white Sunshade of Sovereignty as a sign of fame, glory, and emancipation.
  language: English
  quote_policy: summarized
