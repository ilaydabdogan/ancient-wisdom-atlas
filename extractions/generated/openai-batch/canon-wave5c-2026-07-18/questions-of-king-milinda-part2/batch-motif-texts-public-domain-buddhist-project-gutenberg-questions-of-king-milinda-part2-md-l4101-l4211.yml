canonical_text:
  quote: It is not alive, O king, there is no soul or being in water.
  summary: A doctrinal exchange describes ten reasons a recluse purifies gifts, argues
    that even a guilty Samana can sanctify donors' gifts, and cites a Nikaya verse
    that the giver sanctifies a gift to an unrighteous recipient. The king praises
    Nagasena's use of reasons and similes. A new dilemma asks whether boiling water's
    sounds imply life or suffering; Nagasena denies any soul or being in water and
    attributes the sounds to heat, while false teachers are said to accuse Buddhist
    ascetics over this issue.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage lists ten ways in which a recipient purifies a gift, including
    wearing an invulnerable coat of mail, being shorn with a renunciation mark, belonging
    to the brethren, taking refuge in the Buddha, Law, and Order, dwelling in a lonely
    spot, seeking the teaching, preaching Dhamma, being destined for the island of
    truth, believing the Buddha chief of beings, and keeping the Uposatha day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A thoroughly fallen and guilty Samana is nevertheless said to sanctify the
    gifts of supporters of the faith.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sanctifying effect is compared to water washing away dirt, boiling water
    putting out a blazing fire, and food allaying hunger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A quoted teaching says that when a good man gives righteously earned property
    to an unrighteous recipient with confidence in good fruit, the gift is sanctified
    by the giver.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king praises Nagasena for answering an ordinary question with reasons
    and similes and compares the effect to giving the hearer the sweet taste of the
    nectar of Nirvana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king asks whether boiling water that hisses and simmers is alive, playing,
    or crying out under torment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena answers that water is not alive and contains no soul or being; its
    sounds are caused by the shock of heat from fire.
  category: speech
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:8
  text: False teachers are described as rejecting cold water on the ground that water
    is alive, warming water for tepid foods, and accusing the Sakyaputtiya Samanas
    of injuring souls of one function.
  category: speech
  evidence_refs:
  - ev:7
