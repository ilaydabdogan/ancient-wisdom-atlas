canonical_text:
  quote: ''
  summary: A dialogue between Nagasena and a king discusses whether any gift should
    be withheld from a worthy recipient. The king lists gifts disapproved in the world,
    then concedes that faithful donors give many things, even kingdoms and their own
    lives. Nagasena uses this to defend Vessantara, who gave his wife and children
    to a Brahman for the sake of spiritual treasure, arguing that the requested thing
    should be given. The passage includes analogies of requested water versus food,
    and of Vessantara's life as something shared by many like cooked meats or a fruit-bearing
    tree.
  language: English
  quote_policy: summarized
