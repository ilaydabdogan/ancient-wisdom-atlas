canonical_text:
  quote: ''
  summary: The passage continues an allegorical description of the Blessed One's City
    of Righteousness by assigning civic and commercial titles to different kinds of
    Bhikkhus according to their practice, teaching, virtue, knowledge, and vigilance.
    It then argues that the existence and greatness of the Blessed One can be known
    by inference from this ordered City of Righteousness and from the far-reaching
    waves of the Good-Law, as one infers a city founder from a well-planned city or
    the sea's extent from its waves.
  language: English
  quote_policy: summarized
