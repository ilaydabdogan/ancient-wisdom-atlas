canonical_text:
  quote: ''
  summary: Nagasena answers the king's questions about dreams, explaining that dreams
    occur neither in full waking nor deep sleep but in a light middle state called
    “monkey's sleep.” He describes deep sleep and trance as states in which the mind
    is inactive, uses mirror, darkness, sun, fog, and forest analogies to explain
    this, and then begins a new dilemma on due-time and premature death using ripe
    and unripe falling fruit as an analogy.
  language: English
  quote_policy: summarized
