canonical_text:
  quote: by their backsliding is not the religion of the Conquerors put to shame
  summary: Nagasena explains to the king that some renouncers fail because the Four
    Truths are subtle and the restraints of the religious life are many. Through similes
    of battle, damaged jasmine flowers, a fading rice plant, a flawed wish-conferring
    gem, and partly rotten sandalwood, he argues that backsliders do not disgrace
    the religion because steadfast members remain virtuous and beneficial. The king
    praises Nagasena's successive analogies.
  language: English
  quote_policy: quoted
