canonical_text:
  quote: ''
  summary: Nagasena argues that two Buddhas cannot arise simultaneously because the
    Buddha is scripturally described as peerless and because singular greatness characterizes
    Buddhas and other mighty entities. A second dilemma asks why the Buddha instructed
    Maha-Pajapati Gotami to give a rainy-season wrapper to the Order rather than to
    himself; Nagasena explains this as an act of mercy intended to elevate the Order
    after the Buddha's departure, without making the Order superior to the Buddha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nagasena says that if two Buddhas appeared at the same time, scriptural statements
    calling the Buddha chief, best, peerless, and without rival would become false.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena states that it is a natural characteristic of Buddhas that only one
    Buddha should arise in the world, because of the greatness of all-knowing Buddhas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists the broad earth, the ocean, Sineru, space, Sakka, Mara,
    and Maha-Brahma as mighty or great things that are each only one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Milinda says Nagasena has discussed the puzzle well by simile and reason,
    and accepts the answer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buddha tells Maha-Pajapati Gotami to give a rainy-season cloth wrapper
    to the Order, saying that presenting it to the Order pays homage both to the Order
    and to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: King Milinda questions why the Buddha did not receive the wrapper himself
    if he is greater and more worthy of gifts than the Order.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena says the Buddha redirected the gift not because gifts to him were
    fruitless or because he was unworthy, but out of kindness and mercy so the Order
    would be highly regarded after he was gone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nagasena compares the Buddha's action to a father publicly exalting his son's
    real virtues in an assembly so the son will be honored in the future.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena says the gift did not make the Order superior to the Buddha, comparing
    this to parents anointing, bathing, or shampooing children without the children
    becoming superior to the parents.
  category: relationship
  evidence_refs:
  - ev:7
