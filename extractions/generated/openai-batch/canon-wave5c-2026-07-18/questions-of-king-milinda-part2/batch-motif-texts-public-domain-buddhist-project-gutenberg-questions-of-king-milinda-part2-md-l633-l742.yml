literal_observations:
- id: obs:1
  text: 'The passage lists five modes or states: full enjoyment of the five senses,
    the First Dhyana as enquiring mental abstraction, the Second Dhyana as undisturbed
    bliss without enquiry, the Third Dhyana as mental peace beyond joy, pain, and
    enquiry, and the Fourth Dhyana as that peace with purity.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Professor Garbe is reported as identifying the first persons attacked in a
    list as followers of the Sankhya, while the passage cautions that the view is
    better described as one later developed into or becoming fundamental to Sankhya.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage describes the relevant scheme as a systematic condemnation of
    forms of soul-theory concerning two points: the soul and the world.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Milinda's discussion of how the Divine Eye can arise in a man is compared
