canonical_text:
  quote: ''
  summary: A teacher addresses a king through a series of analogies. An arrow, a struck
    brazen vessel, and crops may reach their natural end or due season when unobstructed,
    but may be stopped or destroyed by an intervening cause. These examples are used
    to explain death in old age as occurring in the fullness of time and death before
    one's time as resulting from disease, hunger, thirst, fire, water, sword, or other
    intervening conditions.
  language: English
  quote_policy: summarized
