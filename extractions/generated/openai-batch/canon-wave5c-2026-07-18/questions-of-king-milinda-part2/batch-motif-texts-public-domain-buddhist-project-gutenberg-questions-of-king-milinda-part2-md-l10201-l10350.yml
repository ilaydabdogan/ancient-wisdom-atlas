  quote: ''
  summary: The passage enumerates spiritual practitioners and Bhikkhus who dwell in,
    or hold named offices within, the Blessed One's City of Righteousness. It describes
    attainments, knowledge, self-restraint, powers of Iddhi, alms-seeking discipline,
    insight into rebirth, preservation of tradition, and mastery of Vinaya, using
    civic and royal office imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those walking in the path, standing in its fruits, still learning with hope
    directed to the utmost goal, and those classed as stream-enterers, once-returners,
    non-returners, and Arahats are said to dwell in the City of Righteousness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some inhabitants of the City of Righteousness are described as skilled in
    undisturbed self-possession, contemplation on sevenfold wisdom, insight, and bearing
    the words of the Dharma in their hearts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some inhabitants are described as skilled in the Steps to Iddhi, rejoicing
    in Samadhi, devoted to the Great Struggle, possessing sixfold wisdom, and having
    the power of flying through the air.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some inhabitants are described as having downcast eyes, measured speech, guarded
    senses, self-restraint, and training according to the supreme Dhamma.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhikkhus who carry excellent knowledge in their hearts and keep the royal
    chariot-wheel of the kingdom of righteousness rolling are called Commanders of
    the Faith in the Blessed One's City of Righteousness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bhikkhus with Iddhi are said to travel through the air, move without support,
    shake the broad earth and the waters on which it rests, touch the sun and moon,
    transform themselves, and make firm resolutions and aspirations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bhikkhus who have taken extra vows, desire little, are content, beg from hut
    to hut like a bee moving from flower to flower, go into the woods, and attain
    Arahatship are called judges in the Blessed One's City of Righteousness.
  category: relationship
  evidence_refs:
  - ev:7
