canonical_text:
  quote: '"Virtue, O king, is the place."'
  summary: In a dialogue, the king asks Nagasena whether Nirvana is stored in any
    spatial location. Nagasena denies that Nirvana is located in any direction, yet
    affirms that it exists and can be realized through right conduct, careful attention,
    and grounding in virtue. He illustrates this with analogies of fire arising from
    rubbed sticks and royal treasures appearing to a rightly conducting sovereign.
    He then states that a virtuous person can realize Nirvana anywhere, just as a
    sighted person can see the sky and horizon wherever he may be.
  language: English
  quote_policy: quoted
