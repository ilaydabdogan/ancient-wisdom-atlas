canonical_text:
  quote: ''
  summary: Nagasena explains that the path to Buddhahood remained valid even when
    the Bodisat's extreme disuse of food caused weakness; failure lay in food deprivation,
    not in exertion or the path. He supports this with analogies of a hasty traveler
    on the earth and an unwashed robe near water. In a second dilemma, the king objects
    that admitting insufficiently prepared lay disciples leads to backsliding and
    public blame of the religion. Nagasena replies with analogies of a dirty man who
    refuses to bathe in a pure tank, the good law as a bathing tank of emancipating
    water, and a sick man who refuses a skilled physician's treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nagasena states that the same path was the one by which the Bodisat attained
    Buddhahood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodisat reduced food intake until he took nothing, became weak in mind,
    then returned gradually to solid food and attained Buddhahood before long.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nagasena says all Tathagatas reached the insight of omniscience by the same
    path, and he compares food to the support on which beings live at ease.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nagasena says the earlier failure to attain Buddhahood at once was not due
    to exertion, power, or battle against evil, but to disuse of food.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: A hypothetical man who follows a path in great haste collapses or becomes
    unable to move; the king agrees the fault is not in the broad earth but in the
    man's zeal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nagasena compares the matter to a man who wears a robe and never has it washed;
    the fault is not in the water, which is ready for use.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The king says the doctrine is pure and excellent, and argues that a mere lay
    disciple should not be admitted into the Order before attaining the Fruit of the
    First Path because such people may backslide and prompt public criticism of the
    religion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A hypothetical dirty man comes to a bathing tank full of pure clear cold water
    but turns back without bathing and remains dirty; the king says people would blame
    the dirty man, not the tank.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nagasena says the Tathagata has constructed a bathing tank of the good law,
    full of excellent waters of emancipation, in which beings polluted by sin can
    wash away sins.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nagasena says that if someone enters the religion but does not regulate life
    according to it and returns to the lower state, the person is blamed rather than
    the system.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A hypothetical sick man visits a physician skilled in diagnosis and possessing
    an effective cure, but refuses treatment and goes away still ill; the king says
    the sick man would be blamed.
  category: sequence
  evidence_refs:
  - ev:6
