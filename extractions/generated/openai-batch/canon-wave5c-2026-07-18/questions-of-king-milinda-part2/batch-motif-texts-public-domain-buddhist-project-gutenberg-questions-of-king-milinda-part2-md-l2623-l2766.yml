canonical_text:
  quote: ''
  summary: The passage begins with an editorial note about a Chinese source in which
    a Devaputra speaks to the Bodisat at the Renunciation. The main dialogue then
    presents King Milinda asking Nagasena why two supreme Buddhas cannot arise in
    one world at the same time if all Buddhas teach the same doctrine. Nagasena answers
    that a world system can bear only one Buddha, using analogies of an overloaded
    boat, a satiated man given another meal, and an overfilled cart. He adds that
    two Buddhas would produce disputes among followers divided by allegiance.
  language: English
