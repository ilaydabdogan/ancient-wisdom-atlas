canonical_text:
  quote: ''
  summary: 'The passage gives a series of similes explaining how the Buddha''s greatness
    and the greatness of the Dhamma may be known by inference: mountain height from
    peaks, elephant size from footprint, a lion''s roar from fear, rain from a watered
    earth, released waters from mud, and flowering trees from fragrance. Nagasena
    then compares his exposition to a garland maker arranging flowers of virtue, and
    the king praises the exposition.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men infer the height of Himalaya from its towering peaks; likewise, when they
    see the Buddha's Mount-of-Righteousness as steadfast, calm, and beyond lusts,
    evil, and Karma, they infer the Hero's power.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men infer the size of an elephant king from its footprint; likewise, seeing
    the footprint of the Buddha, called the elephant of men, they infer Buddha's glory.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Living beings crouch in fear at the roar of the king of beasts; other teachers
    are described as breaking and flying in fear when a king of truth utters sublime
    words.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A well-watered, green earth indicates that rain has fallen; a rejoicing and
    peaceful multitude indicates a rain that stilled their hearts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A soaked and muddy earth indicates a great mass of released waters; a host
    once dazed by the mud of sin is described as swept down in the Dhamma's stream,
    left in the sea of the Good-Law, and plunged in ambrosial waves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A sweet perfume pervading the countryside indicates flowering giant forest
    trees; the perfume of righteousness pervading earth and heavens leads to the inference
    that a Buddha once lived.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nagasena says many more examples and metaphors could show the Buddha's greatness,
    and compares the Blessed One to an immeasurable heap of flowers of virtue and
    himself to a garland maker stringing them together.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king says he is satisfied with Nagasena's varied exposition of the problem
    of inference.
  category: speech
  evidence_refs:
  - ev:8
