  summary: The passage describes the qualifications of one who takes ascetic vows
    to uphold the faith, the honor and attainments gained by such a practitioner,
    and the thirteen dhutanga vows. It uses images of water, royal sovereignty, and
    disciplined dwelling practices to describe purification, emancipation, and recluse
    attainment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses a king while explaining who is fit to undertake the
    vows.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The qualified person is described as fit, attained, consistent with membership
    in the Order, content, secluded, zealous, resolute, without guile or deceit, not
    ruled by appetite, not seeking gain or fame, faithful, and desiring release from
    old age and death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person with those qualities who takes the vows to uphold the faith is said
    to deserve twofold honor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vow-taker is described as near and dear to gods and men and is compared
    to desirable or helpful things such as jasmine flowers, food, cool water, medicine,
    a chariot, a wishing-gem, a white sunshade, and the fruits of Arahatship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The practitioner is said to gain mastery over enumerated religious disciplines
    and attainments, including earnest meditations, roads to saintship, moral powers,
    forms of wisdom, the Noble Eightfold Path, quietude, insight, fruits of recluse
    life, discrimination, knowledge, and higher wisdom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner is described with royal imagery as an anointed king over
    whom the pure white sunshade of emancipation is borne.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The thirteen purified vows are said to let a person bathe in the mighty waters
    of Nirvana and enjoy the delights of religion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The vows are said to lead to transcendental ecstasy, Iddhi powers, hearing
    distant human and divine sounds, knowing others' thoughts, remembering previous
    births, watching the rise and fall of others from birth to birth, and perceiving
    the origin of and escape from sorrow and the stains of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The thirteen vows include wearing rag robes, possessing only three robes,
    living by begging, begging house to house in order, eating once a day at one sitting,
    eating from one vessel, refusing excess food, dwelling in the woods, dwelling
    at the root of a tree, dwelling in the open air, dwelling in or near a cemetery,
    not changing the sleeping mat or bed once spread, and sleeping in a sitting posture.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: One who undertook and fulfilled the thirteen vows in former births is said
    to acquire the results of recluse life, including peace and bliss.
  category: sequence
  evidence_refs:
  - ev:6
