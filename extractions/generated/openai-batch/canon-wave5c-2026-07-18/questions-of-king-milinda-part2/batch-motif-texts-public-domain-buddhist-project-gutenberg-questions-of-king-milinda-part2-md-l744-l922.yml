canonical_text:
  quote: ''
  summary: In Book IV, Chapter 5, King Milinda asks Nagasena to resolve an apparent
    contradiction between sayings that praise the homeless life of a recluse and sayings
    that encourage building pleasant dwelling-places for learned men. Nagasena answers
    that the homeless ideal concerns the recluse's own mode of life, while the building
    of common dwelling-places is praised as a gift and as a practical support for
    the Order. A new dilemma then begins concerning restraint in food and a quoted
    statement that the Buddha once ate from a full bowl and more.
  language: English
  quote_policy: summarized
