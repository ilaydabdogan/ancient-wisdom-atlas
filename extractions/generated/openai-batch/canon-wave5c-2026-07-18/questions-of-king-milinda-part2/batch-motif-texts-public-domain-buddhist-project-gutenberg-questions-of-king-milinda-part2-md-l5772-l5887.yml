canonical_text:
  quote: ''
  summary: 'The passage explains that Vessantara, called the king of givers, sought
    Buddhahood and the insight of the Omniscient Ones by giving away all possessions,
    his wife and children, himself, and even life. It emphasizes that he gave his
    wife and children to a Brahman not from hatred or dislike, but because Buddhahood
    was dearer to him. After the gift he grieves intensely in a leaf hut, and the
    passage gives two reasons for the act: to keep his practice of giving unbroken
    and because he expected the children would eventually be freed and ransomed by
    their grandfather.'
  language: English
  quote_policy: summarized
