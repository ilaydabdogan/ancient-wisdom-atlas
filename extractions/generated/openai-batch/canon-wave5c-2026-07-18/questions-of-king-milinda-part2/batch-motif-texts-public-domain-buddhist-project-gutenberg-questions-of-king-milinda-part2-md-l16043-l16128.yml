  summary: An editorial 'Additions and Corrections' section for Part I lists amendments,
    alternative translations, cross-references, and brief notes. Items include references
    to Nagasena, Buddha’s foresight of Tissa the Elder, doctrinal cases involving
    death, rebirth, and time, the preferred translation of Upasampada as initiation,
    a cauldron simile involving water, rice, and a fireplace, and a note on king Sivi
    and his new eyes.
