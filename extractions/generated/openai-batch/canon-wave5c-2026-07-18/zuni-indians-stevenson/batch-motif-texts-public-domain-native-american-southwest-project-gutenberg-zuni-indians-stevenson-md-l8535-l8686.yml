candidate_motifs:
- id: motif:1
  label: Offerings and prayers exchanged for rain
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes offerings to the Council of the Gods, ancestors,
    and lake or spring contexts accompanied by prayers for rain, including kia'etchiwe,
    fire sticks, te'likinawe, food, and burning fiber.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage is ethnographic description of ritual action; the motif label
    should not be expanded into a broader theory of sacrifice without additional evidence.
- id: motif:2
  label: Tortoises as water-dwelling otherselves
  taxonomy_refs:
  - duality
  basis: Tortoises are explicitly called otherselves, are sought ritually, and are
    said to emerge through doors from deep-water homes in the lake.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: medium
  cautions: The term otherselves is present in the passage, but the passage does not
    fully explain the ontological relation between participants and tortoises.
- id: motif:3
  label: Sacred waters linked by underground roads
  taxonomy_refs: []
  basis: A spring is said to have an underground passage to the lake, and Ko'thluwala'wa
    is said to be connected with all sacred springs and lakes by underground roads.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy motif precisely matches this local sacred-geography
    pattern.
- id: motif:4
  label: Seasonal festival preparation through repeated prayers
  taxonomy_refs:
  - seasonal_cycle
  basis: The participants who will personate the Council of the Gods and Sha'lako
    in the coming autumn offer at the lake the prayers they will repeat at the Sha'lako
    festival.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports a specific autumn festival linkage, not a complete
    seasonal-cycle narrative by itself.
- id: motif:5
  label: Sacred fire production governed by taboo and rain consequence
  taxonomy_refs: []
  basis: Fire is produced by wood friction in a controlled sequence; breath must not
    be blown on the burning fiber because this would offend the Council of the Gods
    and prevent rain, and the burning fiber is offered into a spring with a rain prayer.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The fire is not described as destructive; it should not be mapped to a
    world-destroying-fire motif.
- id: motif:6
  label: Repetition of four in ritual objects and water homes
  taxonomy_refs: []
  basis: The passage states that four holes in the lake walls are homes of the tortoises
    and that each participant plants four te'likinawe to ancestors.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage gives repeated uses of the number four but does not explain
