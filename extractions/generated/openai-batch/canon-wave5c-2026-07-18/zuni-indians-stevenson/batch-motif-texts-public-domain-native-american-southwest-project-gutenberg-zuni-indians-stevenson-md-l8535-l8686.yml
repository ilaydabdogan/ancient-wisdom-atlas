canonical_text:
  quote: ''
  summary: The passage describes ritual actions around caves, mountain shrines, a
    lake, tortoises, offerings, rain prayers, dancing, morning gathering of cat-tails,
    and sacred fire production by wood friction. Personators, Ko'yemshi, Ko'mosona,
    Ko'pekwin, Hunters fraternity members, Badger clan members, and other named participants
    make or handle offerings, seek tortoises called otherselves, and observe restrictions
    connected with rain.
  language: English with Zuni terms and song transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the Ko'mosona and party are in a cave, personators of the Council of
    the Gods and Sha'lako deposit te'likinawe at a shrine on a western mountain summit
    where beads and many plume offerings are present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'yemshi make offerings at a shrine on their mountain and come over the
    trail singing a song that includes references to mountain sheep, gopher, going
    up, and coming down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Both parties gather on a hill east of the lake; the Ko'mosona and Ko'pekwin
    remove clothing, tie up hair, secure necklaces, and suspend sacks from their necks
    for tortoises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Great Father Ko'yemshi gives a kia'etchine to the Ko'pekwin, and the director
    of the Hunters fraternity gives one to the Ko'mosona.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because the ground is marshy, the Ko'mosona and Ko'pekwin approach the lake
    on hands and feet, compared in the passage to frogs, and deposit weighted kia'etchine
    or kia'etchiwe in the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kia'etchiwe are offered to the Council of the Gods with prayers for rain
    and for tortoises, called otherselves, to come out through doors from deep-water
    homes; four holes in the lake walls are said to be the tortoises' home.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ko'pekwin deposits old fire sticks into the lake after coating them with
    lake mud and notching the horizontal stick; the sticks are made from giant yucca
    stalks broken, not cut, from the plant, and he prays for much rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Others near the lake plant four te'likinawe to their ancestors; later, participants
    deposit food, and future personators of the Council of the Gods and Sha'lako offer
    prayers that they will repeat at the Sha'lako festival.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After dancing and retiring for the night, the Ko'mosona, Ko'pekwin, and two
    Ko'pi'lashiwanfli return nude to the lake in the morning, gather cat-tails, distribute
    them, and the pe'kwin retrieves the fire sticks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ko'mosona sends most of the party to look for tortoises using the words
    summarized in the passage as a search for 'our otherselves'; only Hunters fraternity
    members may strike a tortoise with a rabbit stick, while others pat them and tie
    a string around the neck when the head projects.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A spring called the house of the deer is described as a favorite tortoise
    place; an underground passage is supposed to run from the spring to the lake,
    and Ko'thluwala'wa is said to be connected with sacred springs and lakes by underground
    roads.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: After returning from the lake, participants make a sacred fire by wood friction
    using cedar fiber and a horizontal stick with mud at the drilling points; a broken
    circle of named participants forms around the fire-making.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The drill use begins with the Ko'mosona and passes to the Ko'pekwin, after
    which those two do not touch it; the passage says the damp sticks require a long
    time and that a spot touched by the drill must not be worked again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: When fire is produced, the burning fiber is fanned by hand motion; breath
    must not be blown on it because this would offend the Council of the Gods and
    there would be no rain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A cedar brand is ignited from the burning fiber, and the fiber is thrown into
    the spring with a prayer for rain; a note states that the Ko'mosona's Badger clan
    status gives him privilege to use the fire drill.
  category: sequence
  evidence_refs:
  - ev:11
