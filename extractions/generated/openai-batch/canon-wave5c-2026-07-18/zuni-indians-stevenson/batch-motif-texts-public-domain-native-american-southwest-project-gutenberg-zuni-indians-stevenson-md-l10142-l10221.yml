canonical_text:
  quote: with a prayer that she may inhale the sacred breath of life
  summary: The passage describes a Zuni ceremonial sequence involving A'shiwanni,
    corn baskets, women personating Yellow and Blue Corn maidens, dancers who carry
    and return yellow and blue corn, prayers with corn passed before the dancers'
    lips, repeated dances by girls and a youth, and the later construction of a bough-covered
    ham'pone in a sacred dance court.
  language: English with Zuni terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The first body of A'shiwanni sit in line on the south ledge around the room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two large Apache baskets contain ears of yellow corn, and two contain blue
    corn; the yellow corn is identified as symbolic of the Yellow Corn maiden and
    the blue corn as symbolizing the Blue Corn maiden.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The personator of the Yellow Corn maiden sits behind the yellow corn baskets,
    and the personator of the Blue Corn maiden sits behind the blue corn baskets;
    each has a pottery meal basket in front of her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The 'kia'potiikwe dance at sunrise, first on the Sho'ko'we side carrying yellow
    corn and afterward on the 'Hla'hewe side carrying blue corn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The yellow corn is given to the dancers by the Yellow Corn maiden personator,
    and the dancers are led to the floor by the Blue Corn maiden personator.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before the yellow corn is exchanged for the blue, the Shi'wano"kia takes the
    clasped hand of each dancer while the corn is between the hands and passes the
    corn before the dancer's lips three or four times with a prayer for inhaling the
    sacred breath of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note states that yellow is the color for the north and that the Yellow Corn
    maiden represents that region; blue is the color for the west and the Blue Corn
    maiden is its representative.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Girls acting as 'Hla'he and Sho'ko o'tiikwe gather in an adjoining room and
    come forward eight at a time, with the ya'pota in the middle of the line.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girls and youth repeat the earlier corn-carrying performance, receiving
    and returning first yellow corn and afterward blue corn, while the corn is again
    passed before their lips.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dance continues except during the noonday feast until named participants
    arrive about an hour before sunset and take the floor; these dances occur on three
    alternate days in the house of the Shi'wano"kia.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the seventh morning, the A'wan a'mosi, with vicars and selected men, construct
    an extensive ham'pone in the Si'aa'te'wita sacred dance court in front of a ceremonial
    house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ham'pone uses heavy poles, beams, canvas, spruce boughs, cedar boughs,
    and a south wall formed mainly of spruce; named personators gather and place the
    boughs.
  category: object
  evidence_refs:
  - ev:6
