  summary: At a beautiful lake south of present Zuni, the Gods of War decide to stop.
    Ma'we remains there, while 'Hli'akwa refuses and travels southwest to a high mountain
    guarded by angry white and black bears. Ma'we makes her home in the lake, and
    the Gods of War choose a mountain rising from the lake. Footnotes describe submerged
    sacred vases threatened by dam construction and Zuni pilgrimages to 'Hli'akwa's
    hidden home to collect turquoise, using plumes and sacred meal to pacify the guardian
    bears.
