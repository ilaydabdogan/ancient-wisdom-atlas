canonical_text:
  quote: ''
  summary: The passage describes alternating plaza dances involving the Arrow order,
    Great Fire fraternity, and circle dancers; the handling of swords and gifts to
    a novice; and ceremonies of the Po"sikishi, or Division of the Spruce Tree. The
    order makes prayer plumes to Na'ke'e and the Beast Gods, sings for safe tree swallowing
    and for cold rains and snows, collects and plants small trees with feathers and
    a flint arrow, observes rules tied to corn growth, whispers to a rhombus and flute,
    and later gathers, marks, smokes, suspends, and offers food before an altar near
    pine trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Arrow order leaves the plaza, musicians change song; the circle
    dance is performed before the appearance of the 'Hle'wekwc, and the Great Fire
    fraternity and circle dancers alternate in the plaza throughout the day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Great Fire fraternity returns to the ceremonial chamber for the last
    time, swords are handed to the 'Hlem'mosona and placed by the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity father gives the novice four prayer plumes, four ears of corn,
    and calico; the wife of the fraternity father bathes the novice's head and hands
    and later carries food and the washing bowl to the novice's house as gifts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Po"sikishi order currently has two female members, and the trees handled
    by them are described as smaller than the others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tree swallowing is said to occur only at initiation in the 'Hle'wekwe fraternity,
    but in the Great Fire fraternity it is not dependent upon that rite; the festival
    is synchronous with two fraternities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the order convenes, members and novices each make three prayer plumes
    to Na'ke'e, while officers also make plumes for the Beast Gods of the six regions;
    plumes are gathered into baskets and a kia'etchine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Participants sing to Na'ke'e with a wooden drum and no rattles, beginning
    with a request that their throats not be made ill when swallowing the tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The following morning they sing six songs, one to the Beast God of each of
    the six regions, to intercede with the rain-makers for cold rains and snows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A deputy 'Hlem'mosona leaves with the kia'etchine, followed by a warrior whirling
    the rhombus; female members sprinkle meal on the group of plumes, and another
    man leads briefly north of the village while sprinkling meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two small trees, one pine and one pinon, are collected and deposited; each
    tree receives an undertail banded turkey feather, and a flint arrow attached to
    a shaft is placed between the trees when they are planted on the roof by the hatchway.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: After a roof ceremony over the trees, members sprinkle the trees with meal
    each morning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: During ceremonies in the fraternity chamber, feet must be kept close together
    and arms must not be extended outward or upward except when using the sword or
    sprinkling meal; the stated consequence of disobedience is that corn would be
    stunted.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The flutist and a warrior sit on sheepskins in the middle of the floor; the
    warrior whispers to his rhombus and the flutist whispers to his flute.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the third morning the 'Hlem'mosona selects a director and five others to
    collect pine trees south of the village; each tree is marked with three dots for
    eyes and mouth before being hewn.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The pine trees are carried on men's backs, slid down the ladder through the
    hatchway into the ceremonial room, received with animal-like yells, smoked through
    the boughs, and suspended from the ceiling with the eyes-and-mouth sides upward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Before a feast is eaten, food from all the bowls is placed before the altar
    by a warrior and divided by him into five heaps.
  category: action
  evidence_refs:
  - ev:9
