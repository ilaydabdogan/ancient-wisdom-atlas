canonical_text:
  quote: ''
  summary: The passage describes the 1896 night ceremonies of ten Ko'yemshi after
    the arrival of the Sha'liiko. The Ko'yemshi carry seed in fawn skins, sing at
    houses, dedicate a house through deposits of te'likinawe, meal sprinkling, wall
    markings, plumes, seed offerings, directional gestures, reciprocal smoking, a
    long litany, a feast, and dances continuing after midnight.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten Ko'yemshi closely follow the Sha'liiko on their arrival at the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'yemshi wear white garments and carry sewn fawn skins containing seed
    and pink-colored gourd rattles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: They form groups at the base of outer ladders of houses entertaining a Sha'liiko,
    sing, joke at times, and then go to the house they are to dedicate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the house, the Great Father Ko'yemshi deposits te'likinawe under the ladder,
    and his pe'kwin sprinkles meal over them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the room, the Ko'yemshi are sprinkled with meal and empty the contents
    of their fawn skins into a basket by the altar as a gift to the house host.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Father runs meal down each wall with four fingers, and the pe'kwin
    strikes the lines with a bunch of yucca baccata.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A ladder is held by six men while the Great Father ascends and attaches two
    te'likinawe to the symbol of the house of the clouds; the pe'kwin then sprinkles
    meal over the ladder and plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The master of the house seats each god after placing his hands on the god's
    shoulders and motioning him to the six regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Ko'yemshi sit in line on the west side of the room opposite ten men from
    the Pi'chikwe and Ta'kiakwe clans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Yucca fire sticks with live coals are used to light reed cigarettes filled
    with native tobacco; each participant takes six whiffs, waves the cigarette to
    the six regions, and passes it to the person opposite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The masks of the Ko'yemshi are put back so their faces are exposed during
    the smoking sequence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Great Father recites a litany for two hours, and the others respond with
    'A'thlu'.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The prayer is said to vary according to different versions of Sa'yatasha,
    the Sha'lako, and Ko'yemshi concerning the migrations of the A'shiwi from Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Ko'yemshi say that their children will remain for five days, dance in
    the houses, go to the home of the gods in the east, leave te'likinawe, return
    to Ko'thluwala'wa, and bring many kinds of seeds next year if given food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: After a feast and smoke, the Ko'yemshi dance while holding paired te'likinawe
    sticks, one blue for the Sun Father and one yellow for the Moon Mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Most Ko'yemshi visit the houses of the Sha'liiko and dance there, while members
    of the Little Fire fraternity continue dancing with bodies decorated in white
    kaolin.
  category: action
  evidence_refs:
  - ev:7
