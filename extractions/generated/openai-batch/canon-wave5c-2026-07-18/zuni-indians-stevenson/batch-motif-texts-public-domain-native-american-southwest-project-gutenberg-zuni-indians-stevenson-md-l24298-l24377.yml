- id: motif:2
  label: healing followed by potential initiation
  taxonomy_refs:
  - initiation
  basis: A person restored to health by the Hle'wekwe may request permission to join,
    and initiation is controlled by the fraternity's winter ceremonial calendar.
  evidence_refs:
