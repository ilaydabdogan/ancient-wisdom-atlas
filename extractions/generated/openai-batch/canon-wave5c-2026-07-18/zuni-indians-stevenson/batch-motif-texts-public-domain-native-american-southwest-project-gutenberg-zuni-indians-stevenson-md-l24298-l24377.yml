canonical_text:
  quote: ''
  summary: The passage describes notes on ceremonial conduct, Hle'wekwe directors,
    a healing rite for an invalid using corn meal, songs, eastward prayer to Pleiades
    and Orion, medicinal vomiting, red-root tea, and prayer plumes for deceased fraternity
    members. It then describes how a restored person may request membership, with
    winter-only initiation, clan-linked offices, and child members participating in
    dances and winter house-to-house walks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An authorial note states that the writer had not observed rites among the
    Zunis or other studied tribes involving conditions of unchastity, while certain
    ceremonies and dances included suggestions of improper conduct.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The fraternity is described as having two directors at the time observed:
    an aged retired man who presided ex officio and an active director who replaced
    him.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A parent or relative of an invalid gives a corn husk of meal to a chosen doctor,
    who notifies the fraternity warrior, who then notifies each member to attend at
    night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Members go from the ceremonial chamber to the invalid's house with rattles
    and sing; relatives of the invalid may be present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A basket containing the corn husk of meal is placed on the floor; after a
    song, each fraternity member takes a pinch of meal and passes the hand with meal
    up the invalid's larynx to the chin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each member leaves the house, faces east, prays to the Pleiades and Orion
    for the invalid's restoration, and throws the meal toward the east.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After three additional songs, all leave except the chosen doctor and one selected
    woman of the fraternity; the family also withdraws.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Early in the morning a freshly gathered white-blossomed medicine plant is
    brought, a fraternity woman brings a pot, the attendant woman prepares medicine,
    and the invalid drinks three large gourdfuls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The doctor tickles the invalid's throat with a feather, causing vomiting;
    the material ejected is carried some distance from the house and must not be emptied
    nearby.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The treatment is repeated for four mornings, followed by a warm red-root tea
    on the fifth morning and the three succeeding mornings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The doctor and associate each deposit two prayer plumes to deceased members
    of the fraternity and remain with the patient until after the morning meal on
    the eighth day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A person restored to health by the Hle'wekwe may request permission to join
    by handing the doctor meal wrapped in a corn husk with an eagle plume attached;
    if the request is in summer, initiation waits until a later winter ceremonial.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Certain fraternity offices are assigned to specified clans, including the
    sword director, deputy, other offices, and warrior.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Because the Bear clan had few representatives, a boy and an older girl were
    brought into the fraternity; the boy asked to be excused, but his mother insisted
    on his duty.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The boy later participated enthusiastically with a small rattle, kept time
    in the dance, and did not flinch from cold midnight walks in January and February
    snow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A note says nonmembers would not enter the patient's room while the medicine
    was there, and the doctor's and associate's meals were served in a separate room.
  category: setting
  evidence_refs:
  - ev:10
