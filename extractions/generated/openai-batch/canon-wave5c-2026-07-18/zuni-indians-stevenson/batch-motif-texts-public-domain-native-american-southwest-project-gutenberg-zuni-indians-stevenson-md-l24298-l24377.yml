- id: motif:3
  label: ritual offering and prayer for restoration
  taxonomy_refs:
  - sacred_exchange
  basis: Meal is presented to the doctor, used by members in prayer for the invalid,
    thrown eastward, and later prayer plumes are deposited to deceased fraternity
    members.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage shows offerings and prayers, but it does not explicitly frame
