  confidence: high
  cautions: This is a social-ritual pattern rather than a motif family in the supplied
    taxonomy.
- id: motif:6
  label: child obligation within ritual membership
  taxonomy_refs:
  - initiation
  basis: Two children are brought into the fraternity; the boy asks to be excused
