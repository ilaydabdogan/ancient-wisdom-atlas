- id: motif:4
  label: seasonally bounded ceremonial membership
  taxonomy_refs:
  - seasonal_cycle
  basis: The fraternity is said to hold only winter ceremonials, so a summer request
    for initiation must wait through winter and into another winter.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The evidence concerns ceremonial scheduling rather than a full mythic
    seasonal cycle.
- id: motif:5
  label: clan-defined ritual authority
  taxonomy_refs: []
  basis: Specific offices in the fraternity are assigned to named clans, and child
    members are added partly because one clan has few representatives.
  evidence_refs:
