  summary: The passage describes a ceremonial installation of elder and younger brother
    Bow priests. A sun priest makes a symbolic meal painting at sunrise; ritual authorities
    instruct and bless the novice; prayers request good hearts, rain, food, and communal
    welfare from the Sun Father, the Gods of War, and Kok'ko A'wan, with explicit
    denial that the rite addresses enemies.
  language: English
