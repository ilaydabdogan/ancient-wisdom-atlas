canonical_text:
  quote: ''
  summary: 'The passage describes preparations and ritual actions around a winter-solstice
    ceremonial context: a Hopi resident makes plume-and-pine offerings with prayers
    for rain, crops, health, and long life; household members prepare through bathing,
    hair washing, food restrictions, adornment, and fraternity attendance; members
    of the Chu''pawa ki''wi''sine gather for a midnight calendar-related ceremonial
    in which the shi''wanni arranges offerings, medicine plants, meal crosses, a stone
    cougar, and numerous animal fetishes.'
  language: English
  quote_policy: summarized
