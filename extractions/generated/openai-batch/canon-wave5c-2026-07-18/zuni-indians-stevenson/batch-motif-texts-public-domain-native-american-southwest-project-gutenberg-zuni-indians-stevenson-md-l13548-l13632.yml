  label: ANNUAL FESTIVAL OF THE SHA'LAKO / MIXOK CEREMONIES / TWENTY-THIRD ANNUAL
    REPORT PL. LVIII / ALTAR OF UHUHUKWE (EAGLE DOWN FRATERNITY); lines 13548-13632
