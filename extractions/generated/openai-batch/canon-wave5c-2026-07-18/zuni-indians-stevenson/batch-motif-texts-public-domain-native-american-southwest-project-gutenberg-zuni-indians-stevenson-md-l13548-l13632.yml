canonical_text:
  quote: ''
  summary: The passage describes a sequence in which ceremonial figures perform plume
    planting and ladder actions, receive the Sha'liiko and Council of the Gods, conduct
    prayers and meal-sprinkling at the Kla'kwemosi's house, control visitor access
    to a ceremonial chamber, and display an U'huhukwe altar with animal figures, medicine
    objects, eagle plumes, cloud, lightning, celestial, rainbow, moon, and firmament
    imagery. It also notes a line of meal, deerskins, robes, and blankets arranged
    near the altar where the gods sit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sa'yatasha, Hu'tutu, and the Yii'muhakto repeat plume planting and other ceremonies
    at the ladder and then ascend the ladder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A body of A'shiwanni, the Ko'rnosona, the Ko'pekwin, and two A'pi"h'ishiwanni
    remain at He'patina to receive the Sha'liiko, who follows after the Council of
    the Gods, and then go to the Kla'kwemosi's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Kla'kwemosi's house, the Council of the Gods is met on the roof by
    the Kla'kwemosi, his wife and daughters, and the mo'sona of the U'huhukwe fraternity,
    who pray and sprinkle meal upon the gods before preceding them below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: White visitors try to reach the ceremonial chamber, are ordered away, and
    one man declares that no American shall enter; the Kla'kwemosi reproves the man
    and escorts the guests into the chamber to sit near the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The altar stands at the west end of the long room and includes stone animal
    figures, medicine items, bear's feet, eagle-wing plumes, a flute, a sacred meal
    basket, a medicine bowl, food, a human image in stone, and an Apache basket of
    te'likinawe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The altar is constructed from slabs and tablets of wood and is decorated with
    lightning-maker faces, black rain clouds, cumulus cloud symbols, birds, directional
    cougars, lightning symbols, the sun, morning and evening stars, white clouds,
    the rainbow, the moon, A'chiyala'topa, the star of the four winds, eagle tail
    plumes, and blue-green firmament color.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A line of meal extends from the altar to the ladder and to the east end of
    the room, with three cross lines; deerskins lie north of the altar, and robes
    and blankets cover a ledge where the gods sit.
  category: setting
  evidence_refs:
  - ev:7
