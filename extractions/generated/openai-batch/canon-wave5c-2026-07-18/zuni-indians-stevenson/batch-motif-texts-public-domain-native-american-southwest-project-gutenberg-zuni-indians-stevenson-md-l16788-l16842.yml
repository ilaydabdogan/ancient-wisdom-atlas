canonical_text:
  quote: ''
  summary: 'The passage describes postpartum care and a dawn newborn rite: a meal
    line is laid as a path of life, the child is carried with an ear of corn and faced
    east toward the Sun Father, prayers are offered for the child, juniper water and
    yucca suds are prepared for washing, the child is bathed and rubbed with ashes,
    condensed milk is given, and the young mother''s hair is washed after prayer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After birth, the mother's milk was absent or refused by the infant, and the
    child was fed condensed milk for nourishment.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: At first light, a line of meal, described in the passage as symbolic of the
    path of life, was sprinkled from the house to the place where the child would
    first observe the Sun Father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The doctress, accompanied by the young mother and paternal grandmother, carried
    the infant with an ear of corn held close to its head; the corn had been beside
    the infant since birth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The doctress stooped, held the child facing east, and prayed for the child's
    health, happiness, goodness of heart, and long life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Juniper-steeped water was placed in a bowl near the fireplace, yucca root
    was pounded, and yucca suds were made and warmed with hot juniper water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The physician held the infant with its head to the east while the paternal
    great-grandmother and paternal grandmother stood on either side of the bowl; the
    young mother sat nearby and did not take part.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Suds were held while the doctress prayed to A'wonawil'ona, the Sun Father,
    and the Earth Mother for blessings to come to the child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the prayer, suds were placed and patted on the child's head, and the
    head was thoroughly washed; the eyes were carefully bathed and the nose pinched
    many times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child was bathed with warm juniper water, then rubbed over the entire
    body with ashes instead of being dried with other material.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The infant was fed condensed milk from a spoon and responded with satisfaction,
    pleasing the paternal grandfather and others present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young mother's hair was loosened and washed with yucca suds after a prayer
    by the doctress, with female relatives participating.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the mother's hair washing, the doctress removed the remainder of the
    mother's sand bed and carried it in a blanket to the far end of the room.
  category: action
  evidence_refs:
  - ev:6
