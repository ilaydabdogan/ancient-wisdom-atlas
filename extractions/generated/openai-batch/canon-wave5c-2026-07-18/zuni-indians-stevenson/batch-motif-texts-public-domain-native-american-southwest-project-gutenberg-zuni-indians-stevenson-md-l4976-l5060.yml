candidate_motifs:
- id: motif:1
  label: communal hunt conducted with gods or god personators
  taxonomy_refs: []
  basis: The passage describes gods or god personators notifying the village, leading
    or taking part in procession, and participating in the rabbit hunt alongside human
    participants.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: This is extracted as a passage-level ritual pattern, not as a cross-cultural
    comparison.
- id: motif:2
  label: offerings exchanged for hunting success and rain
  taxonomy_refs:
  - sacred_exchange
  basis: Bread, meal, corn, food offerings, and meat are offered with prayers for
    game, hunt success, and rain.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage describes ritual offerings and petitions; it does not explicitly
    theorize exchange beyond the prayers and offerings.
- id: motif:3
  label: game mother or goddess sends animal children
  taxonomy_refs:
  - mother_goddess
  basis: The Cha'kwena asks the goddess she personates to send many of her children,
    identified as rabbits, and others ask the mother of game to send her children.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not clarify whether the goddess personated by the Cha'kwena
    and the mother of game are identical or distinct.
- id: motif:4
  label: fire-mediated consecration and feeding of gods
  taxonomy_refs:
  - sacrifice
  basis: Bread and later rabbit meat are cast into flames as food for the gods, rabbit
    sticks and tail fur are brought into contact with fire, and firebrands are central
    to the hunt sequence.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage uses the language of food for gods and offerings, but does
    not itself use the analytic term sacrifice.
- id: motif:5
  label: first-kill blood rite for puberty and fertility
  taxonomy_refs:
