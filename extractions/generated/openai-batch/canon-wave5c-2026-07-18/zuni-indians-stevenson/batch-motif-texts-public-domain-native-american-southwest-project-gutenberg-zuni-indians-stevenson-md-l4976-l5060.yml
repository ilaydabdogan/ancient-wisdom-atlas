canonical_text:
  quote: ''
  summary: The passage describes a Zuni/A'shiwi rabbit hunt ceremony involving Sa'ya'hlia
    and other gods or god personators, village preparation, directional chasing, fire
    offerings and prayers, killing and collection of rabbits, a first-rabbit blood
    rite connected with girls' puberty and fertility, post-hunt handling of rabbit
    bodies, offerings to gods, ceremonial cooking, night dancing, and a final encircling
    movement by the Cha'kwena.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sa'3'a'hlia identified as blue horn deposits a reed cigarette in a deep
    place in the river bed west of the village, returns, and joins three associates.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sa'ya'hlia and other gods go through the village to announce that the
    hunt has arrived and call on people to prepare; they use giant yucca on those
    who do not get out of the way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants hasten to have their hair done after washing it in yucca suds;
    the passage states that no one can take part in a religious ceremonial without
    first having the hair washed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some participants are mounted and others are on foot; if a god personator
    wants to mount, a mounted person dismounts, puts on the mask, and the personator
    takes the saddle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Maidens ride behind fathers or brothers during the procession.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Separate Sa'ya'hlia parties are chased from one Sal'imobiya to another, and
    the gods advance by stages until all reach the San'iakiakwe in timbered country.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A low tree is set on fire near the base, and the fraternity, gods, and others
    cast bread into the flames with prayers as food for the gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The San'iakiakwe make invocations to deceased fraternity members for aid in
    the hunt; the Cha'kwena prays to the goddess she personates to send many children,
    identified as rabbits, to the Zunis; others pray to the mother of game and rain-makers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: All except the gods pass their rabbit sticks through the flames for success
    in the hunt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A large circle is formed around the preserve; the Cha'kwena and San'iakiakwe
    remain inside and use firebrands to drive rabbits from hiding places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Rabbits are killed by gods and others with rabbit sticks; women collect rabbits
    killed by gods and return to the circle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: If a god and a man are involved in a missed or successful rabbit strike, whipping
    occurs according to the outcome; women who fail to catch rabbits by hand receive
    four strokes across the back from the gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The first rabbit killed has its nose cut and is handed to the Cha'kwena by
    a maiden; the Cha'kwena rubs the bleeding nose down the inner sides of her legs
    for Zuni girls' puberty and childbearing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After the first hunt, women carry slain rabbits to the director and deputy
    of the San'iakiakwe; tail-tip fur is put into firebrands for future hunting success,
    and rabbits are laid with heads east and facing south before prayer and meal sprinkling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Most rabbits are conveyed to the ceremonial chamber of the first body of A'shiwanni,
    laid with heads east, and given an ear of corn between the forepaws before prayer,
    meal sprinkling, and a feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Rabbits presented to the first body of A'shiwanni are stewed in ceremonial
    vessels, and at sunrise the meat is cast into the fire with a prayer inviting
    gods to eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Si'sikia flays his rabbit and fills the skin with cedar bark, places meal
    in the filling as a heart, runs a hollow reed from the mouth through the filling,
    and puts gypsum in the eye sockets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After the hunt, the gods pass around the village before entering He'kiapawa
    ki'wi'sine; there is dancing in the six ki'wi'siwe, and the Cha'kwena, led by
    the Ko'mosona, encircles the village and proceeds north to deposit food offerings,
    though the passage breaks off before the sentence is complete.
  category: sequence
  evidence_refs:
  - ev:10
