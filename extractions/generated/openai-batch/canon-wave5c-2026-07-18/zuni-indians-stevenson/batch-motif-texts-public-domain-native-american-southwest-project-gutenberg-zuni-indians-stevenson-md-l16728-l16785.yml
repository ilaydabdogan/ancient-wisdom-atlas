canonical_text:
  quote: ''
  summary: 'An ethnographic account describes birth and postpartum procedures: prayers
    for the child''s long life and health, a sand bed, an east-west meal line, corn
    ears, blankets, a stool and basket-tray covering, family participation, the child''s
    first vigorous cry, dawn bathing with warm water and ashes, postpartum treatment
    of the mother, and explanatory notes on Zuni beliefs about lifespan, ashes, and
    healing after laceration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a prayer, the doctress raises a cotton cloth and sprinkles a line of
    meal from east to west over the sand bed; the passage states this is symbolic
    of the straight path the child must follow to receive blessings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child is laid on the sand bed, with a single ear of corn placed at its
    left side, and the maternal grandmother covers the child with a small blanket
    given by herself.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The doctress strikes a small stool against the floor at the head of the bed,
    sets it on its side, and uses an inverted Apache basket tray with cloth and blanket
    coverings over the child's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother-in-law prepares the mother's bed with heated sand, places an ear
    of corn with three plumules to the left of the bed, and food is set beside the
    young mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During a shared meal, the child gives its first vigorous cry, which delights
    those present, especially the paternal grandfather.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At first sunlight the next morning, the doctress bathes the infant with warm
    water using a gourd and her mouth, washes the face and head, and rubs ashes on
    the face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The paternal grandmother folds a blanket over the doctress's extended legs,
    and the doctress places the infant on it with the head against her upturned feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The doctress sprinkles the infant's breast with water while praying for long
    life and health, bathes the child, and then rubs ashes over the entire body.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: After the bath, the infant's wrapping cloth is changed, a blanket warmed by
    the fire is placed around the child, and the infant is laid on a fresh sand bed
    prepared by the paternal grandmother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young mother watches the bathing and wrapping of the infant with interest,
    then receives treatment with warm root tea, powder, and abdominal manipulation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young mother sits by the fire while a fresh sand bed is prepared for her;
    later the infant is placed to the breast but does not obtain nourishment despite
    persistent effort.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage's note states that Zunis believe the span of life is marked out
    at birth, while still praying to A'wonawil'onu for health and long life.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage's note states that ashes are used during the first year and are
    associated by Zunis with exfoliation and depilation.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage's note states that in aggravated laceration cases male theurgists
    are called, though the described case used tea and powder for four days and appeared
    healed after the eighth day.
  category: other
  evidence_refs:
  - ev:9
