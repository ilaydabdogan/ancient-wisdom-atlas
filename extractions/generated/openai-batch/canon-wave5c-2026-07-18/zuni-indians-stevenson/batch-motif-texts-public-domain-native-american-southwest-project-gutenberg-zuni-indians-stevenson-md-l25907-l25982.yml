- id: ev:6
  type: summary
  locator: lines 25907-25982, medicine water
  quote_or_summary: The 'Hlem'mosona places the 'hle'et'tone on a meal-sprinkled ledge,
    shakes pollen from eight eagle plumes into medicine water, gives the water from
