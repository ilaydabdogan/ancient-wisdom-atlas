canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial sequence involving the 'Hle'wekwe,
    et'towe, novices, ritual custodians, music, prayers for rain and snow, the handling
    of sacred objects, medicine water administered to household members, meal offerings
    for purification and long life, and reference to waking as a child in Ko'thluwala'wa
    after death.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hle'wekwe and dancers leave for the house where the et'towe were placed,
    while some guests enter the ceremonial chamber in drunken revelry and those associated
    with the fetishes perform their duties seriously.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four et'towe are positioned side by side in baskets of meal on a ledge on
    the north side of the room, with named clan custodians, bearers, and other attendants
    seated near them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mu'waiye, their a'mosi, and a'mosono"kla sit quietly through the night
    on the south ledge opposite the et'towe, with occasional movement by an a'mosi
    to the 'Hle'wekwe chamber.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the 'Hlem'mosona arrives carrying the 'hle'et'tone, eight 'Hle'wekwe
    sit east of two boxes and play notched sticks while others gather near the boxes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old women lift the et'towe from baskets and hand them to the et'towe-bearers;
    the 'Hlem'mosona hands the 'hle'et'tone to a woman of the fraternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The et'towe-bearers and two men with bows and arrows form a line facing east;
    two novices stand before the line, also facing east, while wives of fraternity
    fathers stand behind the novices with hands on their shoulders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Notched sticks with deer-leg bones accompany song and rattle while the et'towe
    are waved downward and not upward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stated reason for the downward motion is that prayers are for cold rains
    and snows to fall to prepare Earth Mother for the embrace of Sun Father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At sunrise the singing ceases, the 'hle'et'tone, bows, arrows, and et'towe
    are returned to designated custodians or baskets, and the objects are carried
    back to houses where they are kept.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the 'Hle'wekwe ceremonial chamber, the 'Hlem'mosona places the 'hle'et'tone
    on a ledge sprinkled with meal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The 'Hlem'mosona shakes pollen from eight eagle plumes into medicine water
    and administers the water from a shell to each household member, including infants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the drinking of medicine water, the drinker says “father,” and the
    'Hlem'mosona replies “child.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each participant takes meal in the left hand, waves the hand around the head
    four times from left to right, and throws the meal upon the et'tone for physical
    purification and good health.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Meal is also taken with the right hand and sprinkled on the et'tone with the
    prayer that one may not die, but grow old and sleep, to wake as a little child
    in Ko'thluwala'wa, where the Zunis go temporarily after death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Women of the paternal and maternal clans of the novices bring large bowls
    of food, preparing the room for an elaborate feast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the conclusion of the prayers over the 'hle'et'tone, We'wha addresses the
    assemblage in the presence of the guests of the night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: A footnote states that accidents seldom happen from swallowing the sword,
    but death sometimes results and is attributed to a bad heart or to the person
    having been touched by another.
  category: other
  evidence_refs:
  - ev:9
