- id: ev:7
  type: summary
  locator: lines 25907-25982, meal prayers
  quote_or_summary: Participants wave meal in the left hand around the head four times
    and throw it on the et'tone for purification and health; meal from the right hand
    is sprinkled so one may grow old, sleep, and wake as a little child in Ko'thluwala'wa
    after death.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:8
  type: summary
  locator: lines 25907-25982, feast and address
  quote_or_summary: Women of the paternal and maternal clans of the novices bring
    large bowls of food for an elaborate feast; after the prayers, We'wha addresses
    the assemblage in the presence of guests.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
