- id: motif:1
  label: Novice initiation within a ritual fraternity
  taxonomy_refs:
  - initiation
  basis: The passage explicitly identifies two novices, places them before an east-facing
    ritual line, and describes attendants touching their shoulders during song, rattle,
    and handling of sacred objects.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives a ceremonial episode rather than a full initiation narrative.
- id: motif:2
  label: Rain and snow prayers for Earth Mother and Sun Father union
  taxonomy_refs:
  - sacred_marriage
  - seasonal_cycle
  basis: The downward movement of et'towe is explained as prayer for cold rains and
    snows to fall, preparing Earth Mother for the embrace of Sun Father.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states a ritual explanation but does not elaborate a mythic
