canonical_text:
  quote: ''
  summary: 'The passage describes preparations and a night ceremonial of the ''Hle''wekwe:
    openings are made for observation, novices and clan members take assigned places,
    masked comic performers appear, dancers move in lines with eagle-wing plumes,
    members perform sword swallowing while dancing, drinks are consumed through the
    night, and the ceremony ends when the morning star appears.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fifth morning, plastering is removed from doors and windows, and stone
    slabs are removed from wall spaces used for observation into the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rooms adjoining the ceremonial chamber are prepared for special guests and
    for people preparing costumes or amusement before the night ceremonial.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the evening, two novices sit on the north ledge, with the woman to the
    right of the man; fraternity members, female members, clan women, and guests occupy
    designated places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Privileged guests and family women observe the ceremonial chamber through
    interior windows, a door, and an opening made by removing large stone slabs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Five masked characters enter the ceremonial chamber in deliberately ridiculous
    dress, perform songs and caricatures, receive applause, and then visit the house
    where the four et'towe are placed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the choir begins, the novices rise; catchers stand behind them with hands
    on their shoulders, and women stand beside them clasping hands before taking clan-based
    dancing positions.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Female dancers hold eagle-wing plumes, form two lines, and move sidewise east
    and west while members of the 'Hle'wekwe dance between the lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The 'Hlem'mosona, the aged warrior, and other members swallow swords while
    dancing; one man holds two swords in his throat, and on several occasions swords
    are run down one another's throats during violent dance motions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The novices remain standing through the night ceremonial; the male novice
    becomes exhausted, and a blanket is placed under his feet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Popcorn water and red medicine are drunk during the night; whisky is also
    brought to choir members and later dealt in the back room by family members.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The appearance of the morning star above the horizon signals the end of the
    chamber ceremonies, and the aged warrior closes the dance holding the po'nepoyanne,
    bow, and arrows.
  category: sequence
  evidence_refs:
  - ev:7
