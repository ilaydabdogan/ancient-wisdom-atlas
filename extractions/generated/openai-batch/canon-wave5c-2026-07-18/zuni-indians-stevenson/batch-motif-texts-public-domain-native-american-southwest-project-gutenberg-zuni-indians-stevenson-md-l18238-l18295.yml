canonical_text:
  quote: ''
  summary: The passage describes the sacred use of the sho'liwe game for rain, the
    preservation and transfer of ceremonial reeds and related ritual objects, an exchange
    by which a southern rain priest acquired the game, and a player's winter-solstice
    reception of sacred reeds, plumes, medicine, songs, and dawn washing preparations
    from his uncle, a rain priest of the west.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sho'wekwe fraternity is described as having degenerated from its original
    form into a body of professional gamblers, while the game remains played sacredly
    for rain by priests and others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Personators of the Ko'vemshi were chosen from fraternities at large rather
    than from the director's own fraternity after the Sho'wekwe changed from its former
    condition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ceremonial reeds are old, carefully preserved, rarely brought out, and may
    be obtained as a privilege by a person who has lost heavily at the game in order
    to recover possessions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Only the rain priests of the south, the west, and the one who goes last into
    retreat for rains are said to have the game of sho'liwe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A rain priest of the south acquired the game by giving a fine buckskin and
    many turquoise to a rain priest of the west.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The medicine given with the game to the rain priest of the south is said to
    be gone, although he pretends still to possess it, and he is said always to lose
    the game.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator lost beads, blankets, and other things while gambling with new
    reeds and then went to his uncle, the rain priest of the west, seeking sacred
    reeds to win back valuables.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An original set of reeds belonging to the younger God of War is kept in the
    house of the narrator's uncle, the rain priest of the west.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator first visited his uncle in May and was told to return at the
    winter solstice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the winter solstice the uncle gave the narrator reeds, a rhombus, and two
    prepared prayer plumes with specified feathers, beads, cords, and measurements.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The uncle gave the narrator a little black and a little white medicine to
    rub on his hands before play.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The uncle taught the narrator four old songs during the night and instructed
    him to shut his mouth and sing the songs with his heart before speaking to his
    opponent and before playing.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: At sunrise the uncle's wife and daughter entered; the daughter prepared yucca
    suds, the narrator sat facing east, the wife placed her hands on his shoulders,
    and the uncle dipped two eagle-wing plumes into the suds four times.
  category: sequence
  evidence_refs:
  - ev:8
