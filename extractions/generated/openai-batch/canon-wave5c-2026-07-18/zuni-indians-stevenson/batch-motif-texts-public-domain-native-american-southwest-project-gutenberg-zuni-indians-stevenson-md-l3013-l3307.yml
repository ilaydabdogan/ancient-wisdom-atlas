canonical_text:
  quote: ''
  summary: Ritual song stanzas describe coming out from the Fourth World, carrying
    a grandchild or great-grandchild on the speakers' backs, moving along a road by
    springs, seeing prairie-dog girls and women enter a place below, calling for rains
    and seeds, invoking a great-grandfather duck from an old dance village by sacred
    mountains, and reaching the ki'wi'sine, where the addressee ascends a ladder,
    enters, sits or stands, and sees fathers or rain priests seated and calling for
    rains and seeds. The passage ends with a repeated hastening refrain.
  language: English translation with Zuni text and glosses
  quote_policy: summarized
