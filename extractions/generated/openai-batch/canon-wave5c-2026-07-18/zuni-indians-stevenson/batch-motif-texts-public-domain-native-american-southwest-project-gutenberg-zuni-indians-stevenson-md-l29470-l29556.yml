canonical_text:
  quote: ''
  summary: 'The passage notes that songs of the fraternity were reported to be in
    Pima rather than Zuni, then describes parts of a Shumaakwe ceremonial sequence:
    plume dancing, ash sprinkling for purification, washing of grinders with yucca
    suds, repeated grinding and dancing over several days, feasting, distribution
    and use of medicine, a plaza dance around a planted tree with bread placed in
    its branches, inhalation of sacred breath, and a final movement in which Sai''apa
    awaken and carry off sleeping Shumaikoli with flaming cedar brands.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer reports discovering that the fraternity songs were in Pima rather
    than in the Zuni tongue, and the fraternity officers were annoyed by the discovery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the fraternity's origin and association with the Pimas
    remain subjects for further learning, and mentions a report by Friar Marcos de
    Niza about an old Cibolan Indian among the Pimas under a conditional identification
    of Cibola and Zuni land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dance procession uses plumes; the acting Great Mother follows alone with
    an eagle plume while the group moves around the room in an ellipse from west to
    east with raised steps and outstretched arms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunset the a'kwamosi sprinkles dancers with altar ashes four times, throws
    ashes out the door, and the participants inhale a sacred breath; the passage states
    that the ash sprinkling is for physical purification.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Male dancers pass their hands over their own bodies and rub the faces, arms,
    lower legs, and backs of their female partners, while avoiding touching their
    breasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two sets of grinders stand in a north-south line at the east end of the room;
    each grinder's forelock and hands are washed with yucca suds by a female vis-a-vis
    while the a'kwamosi stands behind each grinder with hands on the shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The grinding ceremonies are repeated on following days; male fraternity members
    work in the director's fields and later receive a feast from the director's wife
    and family, with female members first serving and then feasting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the seventh day grinding and dancing are repeated; after the sunset dance,
    invited grinders and dancers receive cornhusk packages containing sun-dried cakes
    of freshly prepared medicine, and later medicine is rubbed on limbs and medicine
    water is administered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The morning after the midnight dance, a tree is planted in the center of Si'aa'
    te'wita, and the appearance of the gods in the plaza occurs as previously described.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the plaza dance, men and women form growing concentric circles, eventually
    including about 150 dancers, moving right to left while men sing with drum accompaniment;
    at sunset all inhale the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The two Sai'apa climb ladders to compel rooftop spectators to join the dance
    and collect loaves of bread, placing the bread in the tree and in its upper forks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Shumaikoli precede the Sai'apa over the eastern road and are supposed
    to sleep at Shu'mlnkla; the Sai'apa follow with flaming cedar brands, awaken them,
    catch them by the waist, and carry them to Chi'pia.
  category: sequence
  evidence_refs:
  - ev:9
