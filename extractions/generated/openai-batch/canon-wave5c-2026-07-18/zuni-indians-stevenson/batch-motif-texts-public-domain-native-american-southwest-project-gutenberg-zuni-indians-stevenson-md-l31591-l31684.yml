canonical_text:
  quote: ''
  summary: 'An ethnographic description of a Zuni Bow priesthood-related ceremony:
    youths form a raised hand passage over an excavation; the victor and elder brother
    carry scalp-bearing cedar twigs along a meal line; officials receive, embrace,
    and pray over participants; prayer plumes, meal, and bread are offered at ant-hills
    and in the excavation; the group processes back to the village with scalps; the
    village and plaza are circled in fours; cedar bark, an arrow with a scalp fragment,
    and bodily gestures are used in purification and in a final northward arrow shot
    toward the Navaho homeland.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two youths are directed to stand north and south of the mounds and clasp left
    hands with raised arms over the excavation; the northern youth is of the Deer
    clan and the southern youth is of the Bear clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victor and the elder brother step on crossed yucca, pass along the meal
    line and under the clasped hands, and each carries a cedar twig with pieces of
    scalp and a fluffy eagle plume attached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the passage under the hands, the cedar twigs are received by the pa'mosona
    and an aid and are later laid on the ground southwest of the mounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priest of the pa'ettowe embraces the victor, the Kia'kwemosi embraces
    the elder brother, the pair reverse places and are embraced again, and prayers
    are repeated by priests before further embraces by A'shiwanni.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The i'tatononakwe place their left arms through the right arms of the victor
    and the elder brother; paired participants visit two ant-hills near the meal mounds
    and plant prayer plumes at the hill apexes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women's sticks are black and offered to the rain-makers, while men's sticks
    are red and offered to the Gods of War for the destruction of the enemy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women divide prayer meal with their companions and sprinkle it over the plumes
    and ant-hills; the women do not speak on this occasion, while the men pray aloud
    and deposit prayer plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Warriors and then the populace pass over the meal line and under the hands;
    the passage explains this as stepping over the sacred road of meal to the home
    of the ants so that they may keep their lives during travel or war.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pa'mosona deposits wafer bread as a food offering to the ants in the excavation
    and destroys the mounds by drawing earth into the opening with his left foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the return to the village, the i'tatononakwe must not look right or left
    and move the scalps ahead of them with the left foot, never the right foot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The return procession includes the victor, elder brother, elder brother Bow
    priest, Ant fraternity, A'pr'lashiwanni, scalp custodian, aid, vice pa'mosono'kia,
    and populace; rifle and pistol shots and the war whoop accompany the procession.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Except for the scalp-kickers, each person carries a bit of cedar bark in the
    left hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The village is encircled four times from right to left in coil fashion until
    the group reaches the large plaza, where women and children join and four concentric
    circles are formed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the plaza, the scalp-kickers lift the scalp-bearing twigs with the left
    hand, wave them, and hand them to the pa'mosona, who faces west.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The pa'mosona attaches a bit of scalp to the arrow of the elder brother Bow
    priest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The elder brother Bow priest passes around the inner circle four times from
    left to right, moving the arrow successively over ankles, above knees, by waists,
    and over heads, with the stated purpose that hearts be pure and know no fear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: At each return to the starting point, participants expectorate on cedar bark
    and carry it around the head four times from left to right for physical purification.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After the fourth movement, all males give the war whoop and the elder brother
    Bow priest shoots the arrow containing the scalp bit to the north, identified
    as the home of the hated Navaho.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: The closing setting is the plaza at night, described as bathed in moonlight.
  category: setting
  evidence_refs:
  - ev:9
