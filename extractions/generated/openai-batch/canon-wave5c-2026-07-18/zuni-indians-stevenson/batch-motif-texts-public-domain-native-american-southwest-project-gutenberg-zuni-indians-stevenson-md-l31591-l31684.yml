candidate_motifs:
- id: motif:1
  label: Initiation through ritual passage and purification
  taxonomy_refs:
  - initiation
  basis: The passage locator identifies the larger context as a ceremonial initiation
    into the Bow priesthood, and the described actions include passage under clasped
    hands, movement over a sacred meal road, ant-hill offerings, fourfold circling,
    arrow contact over bodies, and cedar-bark purification.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The extraction reflects an ethnographic ritual sequence rather than a
    narrative myth episode; local ceremonial meanings should be reviewed by a specialist.
- id: motif:2
  label: Sacred offering to named nonhuman and divine recipients
  taxonomy_refs:
  - sacred_exchange
  basis: The ceremony includes black sticks offered to rain-makers, red sticks offered
    to Gods of War, meal sprinkled over plumes and ant-hills, and wafer bread deposited
    as food for the ants.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: 'The passage uses offering language, but only one explanatory reciprocal
    purpose is explicit: preserving lives in travel or war through the road to the
    ants'' home.'
- id: motif:3
  label: Purification after handling enemy scalps
  taxonomy_refs: []
  basis: Scalp-bearing twigs and a scalp fragment are handled in a ritual sequence;
    the elder brother Bow priest moves the arrow over participants so their hearts
    may be pure and without fear, participants use cedar bark for physical purification,
    and the scalp-bearing arrow is shot north toward the Navaho homeland.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage describes the purification acts explicitly, but the broader
    doctrinal interpretation of scalp handling is not supplied here.
- id: motif:4
  label: Fourfold circular procession and bodily marking by levels
  taxonomy_refs: []
  basis: The village is circled four times, four concentric circles are formed, and
    the priest makes four passes around the inner circle with the arrow at ankles,
    knees, waist, and head.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The number four and circular movement are literal in the passage; symbolic
    meaning beyond the stated purification and fear-removal purpose is not elaborated.
