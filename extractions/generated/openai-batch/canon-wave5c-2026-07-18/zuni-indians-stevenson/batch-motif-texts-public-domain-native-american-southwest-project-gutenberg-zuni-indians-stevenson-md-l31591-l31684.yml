  quote_or_summary: The party returns to the village; the i'tatononakwe do not look
    right or left and move the scalps with the left foot. The ordered procession includes
    named ritual groups and populace, accompanied by shots and war whoops; all except
    scalp-kickers carry cedar bark in the left hand.
