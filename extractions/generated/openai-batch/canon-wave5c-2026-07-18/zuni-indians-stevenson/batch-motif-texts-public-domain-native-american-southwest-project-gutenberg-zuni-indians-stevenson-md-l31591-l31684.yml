- id: ev:8
  type: summary
  locator: 31668-31680
  quote_or_summary: The scalp-kickers lift and wave the scalp-bearing twigs, hand
    them to the west-facing pa'mosona, and the pa'mosona attaches a scalp bit to the
    elder brother Bow priest's arrow. The priest passes four times around the inner
    circle, moving the arrow at ankles, knees, waist, and head so hearts may be pure
    and know no fear.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
