  quote_or_summary: 'Participants pass over the meal line and under the hands; the
    passage explains: "They step over the sacred road of meal to the home of the ants"
    for safety in travel or war. The pa''mosona deposits wafer bread for the ants
    and destroys the mounds with his left foot.'
