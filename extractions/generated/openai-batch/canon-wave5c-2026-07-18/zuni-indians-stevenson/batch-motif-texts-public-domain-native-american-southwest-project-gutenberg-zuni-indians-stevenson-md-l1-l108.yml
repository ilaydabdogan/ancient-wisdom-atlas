canonical_text:
  quote: ''
  summary: The introduction describes Southwestern ruins, a proposed sequence of settlement
    movement from valleys to cliff refuges, then mesas, then valleys again, and gives
    an account of Zuni social distinctiveness, religious philosophy, morning prayer
    to the rising sun, ethical speech requirements, breath prayers through plume offerings,
    dependence on gods for rain and nourishment, and limited Roman Catholic influence.
    It ends by noting the 1879 expedition to Zuni.
  language: English
