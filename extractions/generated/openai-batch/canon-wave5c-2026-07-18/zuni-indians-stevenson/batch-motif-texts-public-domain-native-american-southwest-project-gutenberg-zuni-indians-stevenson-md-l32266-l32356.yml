canonical_text:
  quote: ''
  summary: 'Ethnographic description of A''pi''tlashiwanni ritual procedures: preparation
    of feathered gourd sprinklers; making, feathering, guarding, and ceremonial placement
    of wood idols of the elder and younger Gods of War; arrangement of plume wands
    and other objects on meal paintings; all-night songs, sunrise handling of a divided
    scalp, and morning assembly of priests and water-bearers.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kia'kwemosi completes prayer plumes and adds fresh plumes to two long-necked
    gourd jugs fitted with reed sprinklers; the jugs are later placed on a meal painting
    and carried by water-bearers or sprinklers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wood idols of the Gods of War are completed on the eleventh day; U'yuyewi
    is made by an aged Deer clan member, while Ma'sai'lema and its appointments are
    made by members of the Bear clan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warriors go separately to the two houses and place two prayer plumes upright
    in the yucca belt around each image.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunset the image of the younger God of War is carried hidden under a blanket
    to the house of the maker of U'yuyewi, and the two effigies are set near each
    other facing east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Additional prayer plumes are added until the idols are almost hidden; the
    images are guarded until midnight and then carried with their belongings to the
    warriors' ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pe'kwin receives the images separately with ceremony and stands them beside
    a meal painting on the west end of the room.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elder war-god idol is placed on the northwest corner of the painting,
    the younger on the southwest corner, with each idol's paraphernalia placed behind
    it and plume wands in line before it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Plume wands before U'yuyewi include red sticks offered to the Gods of War
    to destroy enemies of the world and black sticks offered to deceased warriors
    for rains; wands before Ma'sai'lema are colored for the six regions and are for
    destruction of enemies of the six regions.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Three po'nepoyanne, a Whlan'na, the Kia'kwemosi's et'tone, the two gourd jugs,
    and mi'wachi are placed on or near the meal painting, meal line, and cloud symbol.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: An all-night ceremonial is held in the chamber, during which epic songs of
    the Gods of War are sung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At sunrise the pa'mosona removes a divided scalp from its elevated position
    in the plaza, attaches it to a pole, and plants it in the northwest corner of
    the plaza.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A similar meal painting is expected on the north side of the plaza at sunrise,
    although the observed pe'kwin completed it later in the morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: By 9 o'clock the first body of A'shiwanni, except named absent priests, is
    assembled; the A'shiwanni wear pure white, while the two 'kia'punakwe are elaborately
    dressed and described as supposed virgins.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: A note states that these images are made only at initiation and at the winter
    solstice, with different woods selected for the two occasions.
  category: other
  evidence_refs:
  - ev:8
