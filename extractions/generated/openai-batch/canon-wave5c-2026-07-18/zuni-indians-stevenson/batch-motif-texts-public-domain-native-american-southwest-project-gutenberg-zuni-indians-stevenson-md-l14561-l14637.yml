canonical_text:
  quote: ''
  summary: The passage describes general dress and objects carried by male and female
    leaders of Zuni ceremonial dances, then describes the entry, regalia, instruments,
    accompaniments, and dance movements of the He'mishiikwe, who are received by a
    house host and accompanied by masked boys and other maskers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In religious dances, the plaza or chamber is entered in file, led by a man
    or woman described as the leader of the dancers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman leader wears conventional best dress, with attention to white deerskin
    moccasins and leggings, a white blanket bordered in red and blue, an eagle plume
    tied to the forelock, and she carries a mi'li and meal basket.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women appearing in ceremonials add ko'hakwa, turquoise, and coral beads to
    silver ornaments, and finery may be borrowed from family, clan members, or friends.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male leader's dress varies and may include velvet knee breeches, a black
    wool shirt over a white cotton shirt, a silver belt or red silk scarf, moccasins,
    and leather leggings; apparel directly associated with the anthropic gods is excluded.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In cold weather, the male leader may wear a blanket; a line of micaceous hematite
    below the eyes denotes office, and he carries a mi'li and meal basket with an
    eagle plume tied to the forelock.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The leader is not included in the number of dancers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The He'mishiikwe are met at the entrance by the host of the house, who carries
    a meal basket, throws out a line of meal before himself, and leads the dancers
    down the room.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each He'mishiikwe has purple-colored body and limbs and wears a white embroidered
    kilt, sash, red belt, fox skin, tortoise-shell rattle, blue yarn with bells, and
    dance moccasins.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The He'mishiikwe dancing in line do not wear masks on this occasion, although
    a few maskers appear with each party of dancers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each He'mishiikwe carries a spruce twig in the left hand and a pink gourd
    rattle in the right; a rectangular hide drum wrapped with rope is also described.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dancers enter in single file, raise the right foot high, balance on the
    left foot, and this step is described as common in dances where anthropic gods
    are personated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the north end of the room on the west side, the dancers remain in file,
    face north, hold their arms slightly bent, and move with the right foot while
    balancing on the left.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Four masked boys accompany the He'mishiikwe, sit on the west ledge, and two
    play notched sticks during parts of the dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The dancers shake rattles, wave both hands left and right, bend forward, turn
    east, stamp four times, wave five times, bend lower, stamp eight times, and turn
    facing north again.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
