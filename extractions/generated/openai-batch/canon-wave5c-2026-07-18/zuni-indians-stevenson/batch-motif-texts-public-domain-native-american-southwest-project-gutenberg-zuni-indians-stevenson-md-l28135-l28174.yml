canonical_text:
  quote: ''
  summary: The passage describes a ritual sequence involving trees, la'showawe, feathers,
    meal, swords, prayers, repeated fourfold actions, physical purification, hopes
    for health, cold rains, snows, and crops, followed by washing and gift-giving
    for a novice and the deposition of trees in a mesa fissure with sword ends pointing
    east.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meal is held in the left hand for physical purification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trees are passed four times and sprinkled, then passed again four times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each person catches the la'showawe or la'showanne of each tree in the left
    hand, draws a quick breath, and does not let go until the neighbor has caught
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The 'Hlem'mosona returns to the middle of the floor, prays, and again passes
    the trees before the order.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Participants catch the la'showawe and pass feathers through the mouth so that
    medicine left in the mouth from the swords may adhere to the plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants pick off one or two buds, with effort made to get spruce or piñon
    buds according to the wish for a male or female child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The 'Hlem'mosona addresses the people with hopes for happiness, health, cold
    rains, snows, and bountiful crops, then instructs them to throw up their arms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two small trees are placed with the larger ones, and the 'Hlem'mosona unwraps
    the arrow point from the shaft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Each member of the Sword order takes a sword with a feathered handle in the
    left hand, expectorates four times on it, and waves it around the head four times
    from left to right for physical purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sword is separated from the handle, and the 'Hlem'mosona places the swords
    in a skin, wraps the skin, and lays it in a box.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The following morning the novice's head is washed by the wife or daughter
    of the fraternity father, who gives the novice four prayer plumes, four ears of
    corn, and calico.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The trees, including the two small ones, are carried by a different set of
    men to the top of a mesa north of the village and dropped into a deep fissure,
    with the sword ends pointing east.
  category: action
  evidence_refs:
  - ev:5
