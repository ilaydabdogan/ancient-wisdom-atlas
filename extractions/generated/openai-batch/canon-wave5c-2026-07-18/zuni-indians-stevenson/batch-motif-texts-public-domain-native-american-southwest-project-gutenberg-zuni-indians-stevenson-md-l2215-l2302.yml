candidate_motifs:
- id: motif:1
  label: divine animal-form assumption
  taxonomy_refs:
  - shapeshifter
  basis: Pau'tiwa leaves the ki'wi'sine for Ko'thluwala'wa and assumes duck form;
    the note states that gods assume forms other than their own when coming from Ko'thluwala'wa.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Only one explicit animal form, duck, is described in this passage.
- id: motif:2
  label: directional rain-invocation circuit
  taxonomy_refs:
  - seasonal_cycle
  basis: Each Corn Maiden is moved through the four roof corners and cardinal directions
    while eagle plumes are waved so that rains of each direction and all the world
    may fall on I'tiwanna; the broader passage later links the Corn Maidens to crop
    growth.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The available taxonomy has no exact rain-making category; the seasonal-cycle
    reference is based on the crop-growth context, not on a full annual calendar narrative.
- id: motif:3
  label: sacred transfer of corn substance from maidens to regional authorities
  taxonomy_refs:
  - sacred_exchange
  basis: Each Corn Maiden rubs off part of her being and leaves it with a designated
    authority, who thereby becomes possessor of a named color of corn.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The transfer is explicit, but reciprocal exchange terms are not stated.
- id: motif:4
  label: offering sent to divine council through water
  taxonomy_refs:
  - sacred_exchange
  basis: The pe'kwin gathers meal from the cloud symbol, places it in a sacred meal
    basket, and throws it into the river to go to Ko'thluwala'wa as an offering to
    the Council of the Gods.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage identifies the act as an offering, but does not describe a
    response from the divine council.
- id: motif:5
  label: return of crop-associated maidens for growth dance
  taxonomy_refs:
  - return
  - seasonal_cycle
  basis: After material left by the Corn Maidens is planted and the corn grows a foot
    high, the A'shiwanni request the Corn Maidens to come again and dance so that
    the corn might grow.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The return is ritual and agricultural rather than a complete departure-and-homecoming
    narrative.
