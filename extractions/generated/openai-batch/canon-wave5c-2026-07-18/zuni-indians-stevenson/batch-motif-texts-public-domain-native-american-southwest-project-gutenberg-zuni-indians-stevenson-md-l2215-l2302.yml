canonical_text:
  quote: ''
  summary: 'A sequence of Zuni ceremonial actions is described: Pau''tiwa enters and
    leaves the ki''wi''sine after smoke and meal rites and resumes duck form; Corn
    Maidens are brought through roof, directional, sprinkling, and greeting rites;
    each Corn Maiden leaves part of herself with a regional ritual authority, producing
    named corn colors; meal from a cloud symbol is sent by river as an offering to
    the Council of the Gods; and the Corn Maidens are later requested to return and
    dance for the corn''s growth.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin enters the ki'wi'sine, sits north of the meal painting, and Pau'tiwa
    follows a path by the meal line and cloud symbol before sitting behind the meal
    painting with the A'shiwanni.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin smokes a cigarette in brief whiffs and waves it upward over Pau'tiwa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each shi'wanni sprinkles Pau'tiwa's mask with meal; Pau'tiwa then moves down
    the south side of the room throwing meal before him and ascends the ladder from
    the west side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After leaving the ki'wi'sine, Pau'tiwa returns directly to Ko'thluwala'wa
    and, west of I'tiwanna, again assumes duck form; the note states that gods assume
    other forms when they come from Ko'thluwala'wa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Corn Maidens ascend one by one to the roof of the ki'wi'sine, where Bi'"si'si
    awaits them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each Corn Maiden stands at the four roof corners, faces the corresponding
    cardinal direction, and is turned by Bi'"si'si with two eagle plumes so that rains
    from that direction and from all the world may fall on I'tiwanna.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Each Corn Maiden descends into the ki'wi'sine through the hatchway while Bi'"si'si
    waves feathers over her back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Corn Maidens pass up the meal line and sit on a ledge north of it; the
    pe'kwin dips two eagle-wing feathers six times for the six regions into medicine
    water and sprinkles the elder sister Yellow Corn Maiden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Bi'"si'si appears in the ki'wi'sine, greets the A'shiwanni as great fathers,
    receives their reply wishing good to come to him, and leaves for Lu'kiana'kiaia'.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The six named Corn Maidens accompany designated ritual authorities to their
    homes: Yellow with the Kia''kwemosi, Blue with the Shi''wanni of the West, Red
    with the Shi''wanni of the South, White with the Shi''wanni of the East, Multicolored
    with the Shi''wanni of the Zenith, and Black with the Shi''wanni of the Nadir.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each Corn Maiden bathes, rubs her body from head to foot, and leaves what
    she rubs off with the shi'wanni she accompanied; those recipients become possessors
    of the corresponding colors of corn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Corn Maidens return to their home at Ke'yatiwa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The pe'kwin gathers the meal of the cloud symbol with eagle plumes, deposits
    it in a sacred meal basket, and throws it into the river as an offering to the
    Council of the Gods at Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After what the Corn Maidens left has been planted and the corn has grown a
    foot high, the A'shiwanni request the Corn Maidens to come again to I'tiwanna
    and dance so that the corn might grow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The pe'kwin is sent for the Corn Maidens and returns with them at sunset to
    the O'he'wa ki'wi'sine, where the A'shiwanni and Divine Ones have assembled.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The A'shiwanni sit behind a meal cloud symbol made by the pe'kwin, who draws
    an eastward meal line from it and decorates the line with mi'wachi and other sacred
    objects.
  category: action
  evidence_refs:
  - ev:9
