canonical_text:
  quote: ''
  summary: 'Ethnographic prose describes beliefs and practices surrounding witchcraft:
    fear of being conjured, protection of infants, suspicion of socially vulnerable
    persons, witches associated with night and animal forms, illness or death leading
    to accusations, theurgists searching for guilty witches, and capital punishment
    for convicted witches. The passage also recounts a reported killing of an accused
    woman and introduces forthcoming witchcraft stories from a Badger clan member.'
  language: English
  quote_policy: summarized
