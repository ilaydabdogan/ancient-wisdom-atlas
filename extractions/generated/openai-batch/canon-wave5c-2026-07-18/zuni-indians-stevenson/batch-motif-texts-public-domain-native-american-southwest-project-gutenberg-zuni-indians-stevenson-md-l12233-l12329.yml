canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence: masked god figures cross
    a bridge and enter a ki''wi''sine; Ko''yemshi greet and entertain; masks and wreaths
    are removed; the Kia''nakwe assemble for songs, prayers, food preparation, inhalation
    of sacred breath, and yucca whipping for protection; food is prepared and deposited
    in the river for departed Kia''nakwe; green paint is ground and applied to dance
    moccasins; the Kia''nakwe rehearse the next day''s dance with rattles and a horseshoe
    formation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each god figure crosses the bridge over the river south of the village, halts,
    and is greeted with the others by nine Ko'yemshi on the bank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The procession moves through village streets and enters the Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nine Ko'yemshi spend the afternoon going house to house and performing comedy;
    the tenth Ko'yemshi is with the party of dancers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After prayers, masks with spruce wreaths are removed and placed on a sheepskin
    in an adjoining room north of the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kia'nakwe disband for refreshment and later return; the priest sits in
    the northwest corner, two warrior directors sit at his left, and others group
    on the north side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The priest, two warriors, and deputy place he'we in basket trays, and the
    priest makes four flat corn-husk packages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Twelve songs are sung with short intermissions; after each song a prayer is
    repeated aloud and the sacred breath of A'wonawil'ona is inhaled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At their own request and for protection against bad dreams, two members are
    whipped with yucca across each arm and ankle by a warrior of the Kia'nakwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A group of deer-scapula and tortoise-shell rattles lies near the basket trays,
    and wrapped packages of plumes and other items are near the priest.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The priest empties one tray into another, prays, blows tobacco smoke over
    the food, divides the food into three parts, and gives packages to the chiefs
    of the warrior gods and to his deputy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The chiefs and deputy go to the river and deposit the contents of their packages
    in the water as food for the departed Kia'nakwe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Green paint is prepared from copper ore and boiled piñon gum; water and squash
    seed are added while two young men grind the mixture on a paint stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Singers retrieve pairs of dance moccasins through a small doorway and hand
    them to the paint-grinders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Thirty-six pairs of dance moccasins are repainted by placing paint in the
    mouth and expelling or spreading it over the moccasins; one man becomes sick from
    the paint.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Kia'nakwe rehearse the dance, hold rattles, form an elongated horseshoe,
    and begin with the priest and his deputy walking abreast toward the west.
  category: sequence
  evidence_refs:
  - ev:7
