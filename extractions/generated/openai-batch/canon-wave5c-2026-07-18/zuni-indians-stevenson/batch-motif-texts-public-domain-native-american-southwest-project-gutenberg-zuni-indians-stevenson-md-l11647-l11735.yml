canonical_text:
  quote: ''
  summary: An ethnographic description of performers representing Navahos during a
    Zuni crop thanksgiving festival. A principal boy-and-girl dance pair, one boy
    personating a girl, dances between two files while carrying eagle-plume ornaments.
    A comic masked performer with old American clothing and a pistol jokes, answers
    questions, burlesques the dancers, and causes laughter. In the ki'wi'sine, a circular
    floor opening symbolic of the entrance to the innermost world is exposed and later
    receives food and plumes. Girls conceal their faces with wraps and are later selected
    to dance, briefly uncovering their faces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the warriors leave, a party representing Navahos appears and forms into
    two files.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The principal dancers are described as two boys, one personating a girl; the
    personating girl wears a black velvet waist, red calico skirt, red-painted moccasin
    tips, Navaho-style hair, and red cheek spots, while the other boy has white spots
    on his body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal pair stands apart, runs toward one another until nearly meeting,
    passes, turns, and repeats the same dance figure without variation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The principal pair carries triangular pieces made of slender sticks ornamented
    with white fluffy eagle plumes, one in each hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other members of the party sing in Navaho while the principal pair dances,
    and the men wear artificial black goat's-wool mustaches; the passage explains
    the mustache as ridicule of Navahos.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:6
  text: In the Chu'pawa ki'wi'sine, girls wearing black wraps conceal their faces
    and resist efforts to expose them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The circular floor opening in the ki'wi'sine is explicitly described as symbolic
    of the entrance to the innermost world, and food and plumes are later deposited
    within it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: A masked comic figure crouches west of the fire altar, moves an old pistol
    violently, moves his head with his hand, makes jokes, and is joked with by the
    men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men of the ki'wi'sine pass lighted cigarettes to the dancers, who smoke socially.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In dialogue with Nan'nahe, the masked figure says he has no living parents
    or siblings, knows no work skills, claims to have killed a sleeping American and
    taken his pistol, trades a ribbon for melons, gives an account of a wristlet,
    and unsuccessfully tries to discharge the pistol by pushing the trigger forward.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the Navaho dancers leave, the masked figure is asked to dance; he falls,
    burlesques the dancers, responds to encores, pretends to be lame, speaks in Hopi
    in a squeaky voice, and later causes laughter when his foot misses a ladder rung.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A young men's choir sings at the west end of the room, and its leader selects
    girls to dance; the girls protest, uncover their faces during the dance, and quickly
    conceal them again afterward.
  category: sequence
  evidence_refs:
  - ev:8
