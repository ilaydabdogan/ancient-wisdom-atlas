candidate_motifs:
- id: motif:1
  label: Initiation into a ritual fraternity after healing
  taxonomy_refs:
  - initiation
  basis: The passage describes admission after healing, a novice, a fraternity sponsor,
    fixed-day preparation of plumes, convening of the fraternity, ritual restrictions,
    collection of materials, procession, and prescribed novice actions.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is an ethnographic ritual description rather than a mythic
    narrative; motif assignment is based on the described ceremonial structure.
- id: motif:2
  label: Offerings to dead members and divine beings for ritual efficacy
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer plumes and food are given to deceased fraternity members and officers,
    and plumes are prepared for the Gods of War and lightning-makers so they will
    intercede with rain-makers for rain.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text reports offerings and requested intercession, but does not explicitly
    formulate a reciprocal contract.
- id: motif:3
  label: Ritual purity taboo with bodily cactus punishment
  taxonomy_refs:
  - initiation
  basis: Continence is required across the initiation period, and violation is said
    to cause cactus needles to fill the offender's flesh and kill him; women are also
    avoided during the ceremonial.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The cactus-needle consequence is stated in the passage, but its broader
    mythological interpretation is not explained here.
- id: motif:4
  label: Sacred plant shrine and ritually controlled harvest
  taxonomy_refs: []
  basis: The cactus bed and isolated cactus plant at Corn mountain are fraternity
    property, offerings are placed at the plant, and cactus is collected only through
    directed, prayed-over, and counted ritual procedures.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied motif-family taxonomy label precisely matches this plant-harvest
    pattern.
- id: motif:5
  label: Rain-seeking rite through intercession and material collection
  taxonomy_refs:
  - sacred_exchange
  basis: The fraternity prepares offerings for divine intercessors, prays for rain
    at the large cactus, and collects willow and cactus as part of the described ceremony.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage links the rite to rain prayers, but does not fully explain
    the causal or symbolic theology of the materials.
