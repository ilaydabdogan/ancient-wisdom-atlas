canonical_text:
  quote: ''
  summary: The passage describes a Cactus fraternity shrine at Corn mountain, its
    ritually protected cactus bed and important isolated cactus plant, procedures
    for joining the fraternity after healing, offerings of prayer plumes to deceased
    members and deities, continence and avoidance taboos, and multi-day initiation
    actions involving plumes, sacred meal, la'showanne, willow, yucca, cactus collection,
    rain prayers, processional singing, medicine applied to cactus, and the novice's
    bodily positioning near an anthill.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shrine of the Cactus fraternity is located in an arched cave in the western
    wall of Corn mountain, with many prayer plumes deposited there and a cactus bed
    below it treated as fraternity property.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One isolated, symmetrical cactus plant is described as especially important,
    and offerings are placed at its base and on it when cactus is to be collected.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a boy is restored to health by a fraternity member, the boy's father
    brings sacred meal to the healer; if an adult man is cured, he asks to join himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man appealed to prepares four prayer plumes as offerings to deceased fraternity
    members, and the novice is told to deposit them to the north, west, south, and
    east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Continence is required from the giving of the plumes until the fifth day after
    the closing ceremonies; breaking it is said to cause cactus needles to fill the
    flesh and death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the initiation described, the fraternity prepares prayer plumes for
    the Gods of War and the lightning-makers so they will intercede with the rain-makers
    to send rain on Zuni.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The director prepares additional plumes and a la'showanne with cotton cord
    and turquoise; the deputy takes these to the cactus bed, winds the cord around
    the isolated cactus like a web, plants plumes, and deposits food for deceased
    officers.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: A small cactus is cut, brought home in the deputy's left hand, given to the
    director, and placed at the hatchway on the roof of the ceremonial chamber before
    a tablet altar is erected.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the ceremonial no woman is to be touched, spoken to, or looked upon;
    a woman bringing food stamps on the roof and disappears before the food is received.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A member is sent to collect long willow switches, prayers are offered and
    meal is sprinkled before cutting them, and yucca pieces are distributed to indicate
    cactus-collection tasks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Corn mountain a la'showanne is attached to the large cactus, meal is sprinkled,
    prayers for rain are made, cactus is cut, and piles of cactus are covered with
    cedar branches, wrapped, and carried home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: East of Zuni, willow and cactus bearers meet the director, deputy, warrior,
    novice, and fraternity father; the two groups sing different songs and advance
    slowly toward one another.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In a wash, the cactus-party director takes out the cactus piece for the novice
    and ejects medicine from his mouth over it; the novice then places one foot on
    a deserted anthill, faces his head south, and bares and raises his left shoulder.
  category: action
  evidence_refs:
  - ev:10
