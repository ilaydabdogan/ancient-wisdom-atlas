  text: Some potters are said not to use patterns in molding or decorating, and many
    pueblos have undecorated pottery finished in plain red or black.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ware is made of yellowish clay; vases are placed in the sun, washed with
    a red ocher solution, and repeatedly polished with a stone while kept moist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After polishing, a vessel is placed again in the sun for a short time before
    final baking in the oven.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Black coloring is produced by leaving selected vessels in ovens covered with
    loose manure so that a smothered fire creates dense smoke absorbed by the pottery;
    no black pigment is used.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Even where surface decoration is not attempted, potters model water jars,
    bowls with fluted edges, imitations of birds and beasts, and other figures.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: For Zuni pottery firing, an outdoor spot is selected and a windless day is
    preferred, except when it is the regular time for baking pottery during summer
    solstice ceremonies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pieces to be fired are raised on stones, and an oven of dried manure from
    sheep and goat pens is built around and over them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fire is managed first for gradual heating and then for intense heat until
    baking is complete, usually after one or two hours.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bit of wafer bread is deposited in each vase so that the spirit of the vase
    may be fed with the bread’s spiritual essence.
  category: action
  evidence_refs:
  - ev:5
