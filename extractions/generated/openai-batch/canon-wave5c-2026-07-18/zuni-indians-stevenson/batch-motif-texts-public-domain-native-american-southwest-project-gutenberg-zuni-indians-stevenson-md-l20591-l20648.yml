canonical_text:
  quote: "“A bit of wafer bread is deposited in each vase”"
  summary: 'The passage describes Pueblo and Zuni pottery practices: clay vessels
    are dried, washed with red ocher, polished, baked, sometimes blackened by smoke,
    shaped into varied forms, fired outdoors in a manure-built oven, and supplied
    with wafer bread so that the vase’s spirit may be fed.'
  language: English
  quote_policy: quoted
literal_observations:
