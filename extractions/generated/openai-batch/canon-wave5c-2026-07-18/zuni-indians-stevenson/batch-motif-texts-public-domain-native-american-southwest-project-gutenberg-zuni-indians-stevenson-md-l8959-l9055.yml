  label: TWENTY-THIRD ANNUAL REPORT PL. XXI / IDOL OF AHAYUTA (ELDER GOD OF WAR) /
    WINTER DANCES OF THK KOK'KOKSHI / A'SHIWANNI (RAIN PRIESTHOOD); lines 8959-9055
