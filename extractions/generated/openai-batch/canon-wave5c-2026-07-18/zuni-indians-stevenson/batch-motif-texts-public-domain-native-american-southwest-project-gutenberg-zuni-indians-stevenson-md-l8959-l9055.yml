canonical_text:
  quote: ''
  summary: The passage describes the A'shiwanni rain priesthood, its six-region organization,
    the central ceremonial house, and the et'tone sacred objects. It gives the et'tone's
    reported origin from the undermost world, describes its water, toad, seed, reed,
    clay, cotton, bead, and arrow-point components, and explains its clan custody,
    sealed storage, and a photographed opening of one sacred chamber.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rain priesthood is described as consisting of fourteen A'shiwanni, the
    elder and younger Bow priests, and the Shi'wano'kia, identified as Priestess of
    fecundity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six A'shiwanni are called Kia'kwe a'niosi, or directors of the house; the
    house is said to mark the middle of the world, with a room supposed to be directly
    over the center of the world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shi'wanni of the North is presented as the head of the priesthood and
    is referred to as the Kia'kwemosi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The six regions are listed in order as North, West, South, East, Zenith, and
    Nadir, with the center always subsumed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The A'shiwanni are described as doing no secular work and as having the special
    duty to fast and pray for rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Each shi'wanni except the Shi'wanni of the Zenith possesses an et'tone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The et'tone is said to have descended directly from a shi'wanni who brought
    it in a basket held to his breast from the undermost world to the outer world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The et'tone is dual, consisting of a 'kia'ettone and a chu'ettone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: The 'kia'ettone consists of four hollow reeds containing water; the larger
    reed also contains a diminutive toad.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The ends of the 'kia'ettone reeds are closed with blackish clay said to come
    from the undermost world and with native cotton.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: The chu'ettone consists of eight hollow reeds filled with edible seeds known
    to the A'shiwi; originally the reeds contained only kia'sanna.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Each group of reeds is wrapped with native cotton cord; the free end on the
    'kia'ettone is said to symbolize a toad tail, and beads and an arrow point are
    attached or placed with the et'tone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:13
  text: The et'tone is described as sacred and carefully guarded.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: After clan division, the sacred objects became associated with the clans chosen
    by their possessors; when not held by a shi'wanni, an et'tone remains in the care
    of a woman of the parent clan, with the office passing through women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: When not in use, each et'tone rests in a sealed vase in a special windowless
    chamber, and the door is kept sealed except on specified ritual occasions.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: Two et'towe are said to have come from the conquered Kia'nakwe and to have
    been brought by a boy who, with his sister, was adopted by the A'shiwi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: An aged woman caring for those fetishes is said to be a direct descendant
    of the foster mother of the brother and sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: A family allowed the sacred room to be opened briefly, guarded against intrusion,
    photographed, and then closed and sealed again with plaster.
  category: sequence
  evidence_refs:
  - ev:8
