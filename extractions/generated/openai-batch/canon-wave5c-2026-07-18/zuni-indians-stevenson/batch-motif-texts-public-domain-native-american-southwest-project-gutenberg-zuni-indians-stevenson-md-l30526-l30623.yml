comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the Zuni special order as historically derived
    from the Hopi Snake fraternity through the transfer of medicine secrets and paraphernalia
    to an elder nephew living at Zuni.
  claim_level: historical_contact
  target: Hopi Snake fraternity and the Zuni Hopi-derived order within the Little
    Fire fraternity
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The account is limited to the passage's reported lineage and does not
    independently verify the historical transfer.
- id: claim:2
  claim: The Hopi-derived order and Zuni Mystery medicine orders are compared as having
    the same healing function of extracting disease, while using different diagnostic
    and extraction methods.
  claim_level: same_function
  target: Zuni Mystery medicine orders and the Hopi-derived Zuni order
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: high
  limitations: The comparison is functional only; the passage emphasizes differences
    between sucking or meal-location methods and touch/hand extraction.
- id: claim:3
  claim: The Hopi salt-gatherer's report suggests a parallel fire-jugglery pattern
    in Hopi practice involving being cut to pieces and cast into fire, comparable
    to the Zuni-reported dismemberment-and-fire performance.
  claim_level: same_motif
  target: Hopi village fire scenes described by the aged salt-gatherer
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on a single reported statement within the passage,
    and the events are described as jugglery rather than as a narrated myth.
