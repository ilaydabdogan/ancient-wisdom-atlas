    abiding place of the Council of the Gods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: An aged salt-gatherer from Hopi told the observer that fire scenes occurred
    in his own village and that he himself had been cut to pieces and cast into the
    fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Five men of the fraternity have an additional medicine form said to come from
