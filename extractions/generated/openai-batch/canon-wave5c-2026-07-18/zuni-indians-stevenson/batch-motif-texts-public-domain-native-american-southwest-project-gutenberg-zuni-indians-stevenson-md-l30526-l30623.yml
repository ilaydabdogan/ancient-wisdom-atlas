canonical_text:
  quote: ''
  summary: The passage describes a Zuni fire-related ceremony with yarrow medicine
    bathing to prevent burns, reports remembered jugglery involving apparent dismemberment,
    fire, restoration, and long life, and explains a Hopi-derived secret medicine
    order within a Zuni fraternity, including its transmission, healing practice,
    secrecy, and comparison with Hopi feats.
  language: English, with Zuni and Hopi terms
  quote_policy: summarized
