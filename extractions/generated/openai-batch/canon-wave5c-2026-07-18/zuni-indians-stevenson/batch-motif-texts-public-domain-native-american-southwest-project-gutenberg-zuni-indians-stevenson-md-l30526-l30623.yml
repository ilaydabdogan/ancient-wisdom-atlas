  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Hopi director, while ill, sent for his elder nephew and instructed him in
    medicine secrets, giving him medicine bags, fetishes, and related items to carry
    to Zuni.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The elder nephew later invited four fellows, organized the order, fully initiated
