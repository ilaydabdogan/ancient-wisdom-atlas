  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Hopi-derived order extracts disease attributed to witchcraft.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage contrasts Zuni Mystery medicine extraction by sucking or meal-location
