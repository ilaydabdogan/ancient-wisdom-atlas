canonical_text:
  quote: ''
  summary: 'The passage describes Zuni Kor''kokshi and related winter dances: dancers
    process through ki''wi''siwe, present reed cigarettes and kia''etchine, deposit
    ritual items in landscape locations, distribute seeds, administer medicine water,
    sprinkle masks and dancers, prepare additional dances with offerings to all gods,
    conduct dawn river-bank rites, and continue solar observations connected with
    summer solstice ceremonies.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After prayers, dancers form a single file facing north and dance; a Sha'liiko
    personator carrying a kia'etchine presents the kia'etchine and a reed cigarette
    to the chief wor'li, prays, and returns to the dancers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kia'etchiwe are kept in selected homes until after the morning meal and then
    deposited in places associated with ki'wi'sine regions, including a spring, an
    arroyo or canyon, a cornfield, a westward road, a farther point on that road,
    and a river bed west of the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dancers may be masked or unmasked at the director's choice, but Ko'yemshi
    must wear masks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bodies of dancers tour other ki'wi'siwe and give one reed cigarette to each
    wor'li of a ki'wi'sine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After visiting dancers leave a ki'wi'sine, a wor'li distributes seeds from
    a sack to those present, including women and children; the seeds are taken home
    and planted the coming season with seeds given by the Ko'loowisi and apart from
    other seeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fraternity director gives medicine water to unmasked dancers and others
    present, sprinkles masks by dipping two eagle plumes into the water, and all dancers
    are sprinkled with meal at the close of each dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ki'wi'siwe are expected to present the Kor'kokshi in regular succession,
    but the order can change if a head wor'li is occupied with fraternity duties.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kor'kokshi dances are described as highly sacred; the rain-makers are
    both personated and spiritually present, and the sacred dance court is described
    as both temple and theater.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: For later winter dances, a wor'li requests a dance, songs are composed, four
    te'likinawe are made and planted to Kok'ko A'wa, and on the fourth afternoon a
    reed cigarette is presented to the Great Father Ko'yemshi or a fraternity director
    to request Ko'yemshi for the dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At dawn, dancers go to the river bank, deposit tortoise-shell rattles, put
    on masks, sprinkle meal, pray, return to the village, and dance in the four plazas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During summer solstice ceremonies, the pe'kwin continues daily visits to a
    petrified stump to offer meal and prayers to the rising sun, observes Great mountain
    from the Ma"sakia shrine, and the summer solstice is indicated by the setting
    sun striking a point on a mesa northwest of Zuni.
  category: sequence
  evidence_refs:
  - ev:8
