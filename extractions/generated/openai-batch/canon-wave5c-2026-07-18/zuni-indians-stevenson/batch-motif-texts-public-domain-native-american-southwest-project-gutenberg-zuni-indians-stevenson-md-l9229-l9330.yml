canonical_text:
  quote: ''
  summary: The passage describes the installation ceremonial for an associate shi'wanni
    of the north, including gathering in the Kla'kwemosi ceremonial chamber, formal
    greetings and seating, removal of moccasins, preparation of a deerskin with pollen
    and bead lines, and related details of a pe'kwin installation involving a sun
    symbol, meal lines, moral exhortation, and prayers for blessing, rain, food, health,
    and preservation from death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An appointee is received as an associate shi'wanni through an elaborate installation
    ceremonial.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described ceremony began about midday on December 13, 1896, in the ceremonial
    chamber of the Kla'kwemosi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man to be installed was described as a nephew of the Kla'kwemosi, a member
    of the Dogwood clan, married, and apparently not over 20 years old.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Groups entering the chamber greeted those present, received responses in order,
    and removed moccasins after entering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kla'kwemosi acted as master of ceremonies until the younger brother Bow
    priest arrived.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An associate shi'wanni spread a large blanket near the first body of A'shiwanni
    and placed a white buckskin on it with the head to the east.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A straight line of corn pollen was sprinkled from one extremity of the deerskin
    to the other, ending at the center of the mouth portion of the skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Necklaces of coral, turquoise, and ko'hakwa beads were placed over the pollen
    line to form a slight ridge.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the pollen-and-bead line is symbolic of the road of
    life and truth, to be followed to win the favor of A'wonawil'ona.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: For a pe'kwin installation, a sun symbol is made in the center of the deerskin,
    and the pollen-and-bead line is broken by the disk.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The pe'kwin sun symbol includes a blue-green disk, three black dots for eyes
    and mouth, a black-and-white enclosure symbolizing the house of the clouds, and
    four pollen lines from the disk's periphery.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A line of meal extends from the deerskin to the chamber entrance and is crossed
    near the skin.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the pe'kwin installation description, the novice stands on the deerskin
    while the A'shiwanni and others stand on the cross line of meal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The novice is urged to perform his duty, follow the straight road of the Sun
    Father, remove evil or discontent from his heart, and keep to the path of truth
    and virtue.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The sun priest prays for continued blessings, for the Sun Father not to send
    the rainbow to call the rain-makers away, for food and clothing for all people,
    for freedom from great sickness, and for preservation from death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The sun priest also addresses prayers to Ko'hakwa, called white shell mother
    of the sun, and Ma'we, called salt sister to the sun.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Later in the ceremony, each person removes the head-kerchief before participating;
    the pe'kwin takes the novice's hand, and the novice stands facing east with a
    foot on each side of the pollen-and-bead line.
  category: sequence
  evidence_refs:
  - ev:10
