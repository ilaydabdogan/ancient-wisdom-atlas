canonical_text:
  quote: ''
  summary: The passage describes a sequence of shrine visits and offerings, annual
    selection and appearance of Ko'yemshi/Ko'vemshi personators, their night entry
    and speeches in the village, an announcement that ancestral beings will arrive
    invisibly in ghost form, and an explanation that masks allow gods or spirits to
    abide temporarily in personators while mediums can see ghosts.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten days after the visit to Hii'lon kwa'ton, the same party goes to Pa'nitonin'kwl
    in the afternoon and deposits te'likinawe; further visits follow at ten-day intervals
    to A'ne 'hlawa an te' kiapoakwi, Sus'ki a'shoktakwi, and A'kohanna ti'nakwi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the return by early moonlight, the Council of the Gods proceeds quietly
    a short distance ahead of the others, and songs of the Ko'yemshi and Sha'liiko
    personators are heard before the men are visible.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A'kohanna ti'nakwi is described as a group of white sandstone pinnacles sacred
    to the Council of the Gods; two rocks bear perpendicular line markings, one with
    twenty-nine lines and the other with twenty-eight.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the line markings were said to denote the number of
    years the late Ko'mosona and Ko'pekwin held office, but adds that the statement
    requires substantiation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ko'vemshi are chosen annually in regular succession from named fraternities;
    the Great Father is designated at the winter-solstice ceremonial and chooses his
    fellows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'vemshi appear in the village on the night after plumes are planted
    at A'kohanna ti'nakwi; they are supposed to come from Ko'thluwala'wa, but their
    starting point is He'patina, a shrine symbolic of the Middle of the world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ko'vemshi cross the river at the southwest corner of the town and announce
    that the Council of the Gods will come in four days and the Sha'liiko in eight
    days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The village is illuminated by fires in the houses, glowing windows, outdoor
    ovens, and fire issuing through oven doors before the Ko'vemshi stand as a group
    in the large plaza.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Several named Ko'vemshi speak in the plaza, making announcements about fighting,
    the coming dance, food, women, wives, and other obscene or socially transgressive
    remarks.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The pe'kwin says that in eight days his people, identified as ancestors, will
    come from Ko'thluwala'wa and A'witen te'hula, including old men, mothers, children,
    infants, and the unborn.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The pe'kwin says the visitors will see the Zunis, but the Zunis will not see
    them, because the visitors will not be in flesh but in the ghost self.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that in old times people from Ko'thluwala'wa and A'witen
    te'hula appeared in flesh, but their presence caused great mortality among the
    A'shiwi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the mortality, beings of the ghost world decided to come only in spirit,
    and the gods instructed people to wear masks like theirs so that spirits would
    come and abide for a time in personators.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Zunis have mediums with superior sight who see ghosts.
  category: attribute
  evidence_refs:
  - ev:8
