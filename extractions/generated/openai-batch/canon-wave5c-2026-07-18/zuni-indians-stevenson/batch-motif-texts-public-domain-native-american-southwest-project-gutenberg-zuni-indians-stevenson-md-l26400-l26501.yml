canonical_text:
  quote: A ceremonial to cure a sore and badly swollen throat
  summary: The passage describes a Zuni curing ceremonial for an invalid with a sore
    and swollen throat. Deity personators enter the patient's room, circle and treat
    the patient's body with sacred meal and yucca, use a mask in a spitting action,
    dance through the night, and at dawn make fire and administer medicine from a
    bowl.
  language: English with Zuni terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The described rite is presented as a ceremonial for curing a sore and badly
    swollen throat, observed in 1891.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kok'ko 'hlan'na, Shits'ukia, and Kwe'lele arrive near sunset, ascend to the
    roof of the invalid's house, and signal that the patient should be placed on a
    pallet in the middle of the floor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The patient is a young man whose half-reclining body faces east and is supported
    by his chosen fraternity father; attendance is limited to the patient and members
    of the order.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male and female order members sit on opposite sides of the room, and blankets
    create a dressing room for the god personators at the east end.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The god personators stamp and dance on the roof before descending through
    the hatchway into the chamber below around dusk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shits'ukia carries giant yucca and a rhombus; Kwe'lele carries yucca, fire
    sticks, and an unlighted cedar brand; Kok'ko 'hlan'na carries giant yucca in each
    hand and is led by Shits'ukia.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A female order member holding her mi'li and sacred meal basket sprinkles meal
    and leads the gods from the roof into the room, where they pass from left to right
    and encircle the patient four times while the choir sings with rattle and pottery
    drum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shits'ukia draws lines of meal across portions of the patient's body, and
    Kok'ko 'hlan'na follows those lines with yucca; Kwe'lele passes around the patient
    unless chosen by the patient, in which case roles are reversed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The meal and yucca treatment is applied across the shoulders, waist, knees,
    back, arms, and upturned palms in repeated ordered movements.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kok'ko 'hlan'na removes his mask and hands it to the fraternity father, who
    places it over the invalid's head; the invalid expectorates through the mask's
    small mouth hole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the initial treatment, the three gods retire behind the curtain, remove
    their masks, and return to sit; most members leave for the evening meal, while
    selected participants and the invalid are served in the chamber by the invalid's
    female relatives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Around nine o'clock order members return; different male members personate
    the three gods during the night, while female members wear the dress of other
    gods without masks, and the night is spent in dancing.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At dawn three order members make fire with Kwe'lele's fire sticks in the center
    of the room where the invalid had reclined earlier.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: While fire is made, the director bathes Kwe'lele under each knee with medicine
    from a medicine bowl; a cedar brand is lit from the produced fire, dipped in medicine
    water, and the invalid drinks medicine from the bowl.
  category: action
  evidence_refs:
  - ev:10
