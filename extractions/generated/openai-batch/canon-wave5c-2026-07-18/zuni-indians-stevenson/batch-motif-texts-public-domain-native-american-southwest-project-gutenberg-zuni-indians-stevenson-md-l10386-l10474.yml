canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Zuni rain ceremony: reciprocal requests
    between the Hla''hewe and Sho''ko''we choirs; preparation of feathered corn objects;
    prayers to Great Mother corn, divine and ancestral beings, Pau''tiwa, and Sun
    Father for rain and fertility; offerings through a floor opening identified as
    an entrance to the undermost world; arrival and outfitting of four kia''punakwe;
    collection of spring water from two sites; and alternating dances by the two ceremonial
    sides until midnight.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After corn preparation, the Hla'hewe mo'sona instructs each mi'laiilapo'na
    of his side to ask the Sho'ko'we choir to work for the Hla'hewe; the replies are
    made in very low voices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sho'ko'we choir prepares hla'we by surrounding ears of corn with attached
    materials including cotton cord, eagle feathers, plumes from birds of the six
    regions, white sage blossoms, cotton cloth, and a small crook with la'showawe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hla'hewe choir sings while the Sho'ko'we choir works; the song addresses
    A'wan Sita, Great Mother corn, describes dressing her children in feathers and
    sacred blankets, and asks for many of her children in another year.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the hla'we are completed, they are laid across baskets of corn, and
    the Sho'ko'we mo'sona requests that the Hla'hewe choir work for them; Hla'hewe
    members prepare hle'we by attaching a feather- and sage-covered ear of corn to
    a tablet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sunset, members of the first body of A'shiwanni deposit four te'likinawe
    and six colored grains of corn beneath the floor through a circular opening described
    as symbolic of the entrance to the undermost world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sunset offerings are made to the Council of the Gods and deceased A'shiwanni
    of the six regions for rains, and to Pau'tiwa so that the sun may embrace the
    earth and make her fruitful.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Four kia'punakwe come to the ki'wi'sine, accompanied by men of the Dogwood
    and Corn clans, and are led by the pe'kwin to seats at the west end of the room.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The two youths and two maidens wear ceremonial dress and ornaments; each carries
    a perfect ear of corn secreted in a sash.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The pe'kwin gives each kia'punona six te'likinawe with attached ala'showanne
    and region-colored butterflies; maidens receive cloud vessels and ears of corn
    for sprinkling water, while youths receive gourd jugs with reed sprinklers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Hla'hewe-side kia'punakwe collect water from Kianayalto spring in the
    foothills of Corn mountain and deposit te'likinawe with prayers for rain and earth's
    fruitfulness.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Sho'ko'we-side kia'punakwe visit a small spring north of Zuni, deposit
    te'likinawe with similar prayers, and bring water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the kia'punakwe leave, the mi'laiilapo'na of the Hla'hewe side dance
    with hla'we, and the mi'laiilapo'na of the Sho'ko'we side dance with hle'we; the
    two sides alternate until midnight to choir music with rattle and drum.
  category: action
  evidence_refs:
  - ev:12
