canonical_text:
  quote: ''
  summary: Ethnographic description of eleventh-day dances involving ceremonial dress,
    weapons, procession through village spaces, dance around a scalp pole, mock flight
    from Navaho fire, an all-night public dance, and preparation of prayer-plume offerings
    to the Gods of War by A'shiwanni and Bow priests.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the eleventh day, the ha'shiya dance first in a chamber on the west side
    of the plaza and afterward in the plaza, wearing elaborate dress and spread-eagle
    tail headpieces for the first time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The o'tulasho'nakwe dance is repeated on the eleventh day; its leader carries
    a spear with raven plumes and an eagle tail feather, while other male participants
    carry guns, pistols, hatchets, or hammers if they can obtain them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Girls in the dance wear black gowns, white red-and-blue-bordered blankets,
    white buckskin moccasins, leggings, and usual hair arrangement; men and women
    wear many bead necklaces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The o'tulasho'nakwe begins before 5 o'clock in the house of the elder brother
    Bow priest, forms a square, performs a meander figure with a hop step, and includes
    male singing, women's arm movements, and a male gesture made while singing for
    the enemy's destruction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dancers, with a drummer west of them, move through the village in single
    file and dance at the sacred dance court, before the house of the Shi'wanni of
    the East, and in plazas where spectators gather.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At dusk the o'tailasho'nakwe disperse and the pu'mokiaklanawe enter the plaza
    from northeast and southwest entrances, facing each other in two lines of fifty
    and dancing sidewise across the plaza.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pu'mokiaklanawe group includes men, women, and children of both sexes
    and all ages; the men carry bows and arrows, guns, or pistols, and firearms are
    fired repeatedly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After crossing the plaza, the dancers move around the scalp pole in two broken
    opposing circles with the drummer inside the inner circle, while firearms and
    clubs are brandished and drumming and singing continue.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some dancers leave by the western covered way; after one member fires a gun,
    they run back up the street, saying they are fleeing from the fire of the Navaho,
    and spectators deride them as cowards.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After this dance, a crier calls the populace to come close around the pole
    and dance; people, including young children, scramble for places, the circle becomes
    large, and the dance continues until dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the eleventh day, the first body of A'shiwanni prepare prayer plumes in
    the ceremonial chamber of the Kia'kwemosi, each making four, while the elder and
    younger brother Bow priests each make four offerings to the Gods of War.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The prayer plumes are made with measured tapered sticks, feathers, cotton
    cord, black paint, red paint, olive shells from a war bracelet, male-bird plumes,
    corn-husk wrapping, and yucca-thread ties.
  category: object
  evidence_refs:
  - ev:5
