canonical_text:
  quote: ''
  summary: The passage describes a sequence of Zuni ceremonial actions involving Pau'tiwa,
    other gods or personators, offerings of meal, plumes, a symbolic cotton-loop blanket,
    the arrival and departure of 'Cha'kwena, admonishing and healing actions by other
    gods, fire-centered encounters with the 'Hle'lele, dances, seed distribution,
    repeated visits, and food offerings placed in the river for all the gods.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pau'tiwa sprinkles meal through the hatchway, rises, and kicks a twig four
    times with his left foot; the passage states this is symbolic of the treatment
    of Navaho scalps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shits'ukia leads the movement while whirling a rhombus and is followed by
    the pe'kwin and Kwe'lele.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the ki'wi'sine, the ladder is sprinkled with meal and Pau'tiwa repeats
    the deposition of te'likinawe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the northwest corner of the village, a woman of the Dogwood clan presents
    Pau'tiwa with a ha'kwani and recites a prayer for food and clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The three gods leave the village by the western road and are said to go to
    Ko'thluwala'wa; in practical terms they go to a river bend, disrobe, and have
    their masks and paraphernalia brought back under blankets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pe'kwin accompanies the gods briefly, hands plumes to Pau'tiwa to deposit
    on the road to Ko'thluwala'wa, and then returns to the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four Sa'ya'hlia remain in the He'iwa ki'wi'sine to receive the 'Cha'kwena
    after Pau'tiwa's departure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pregnant women hurry to look upon the 'Cha'kwena so that they may pass through
    parturition safely and without pain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The 'Cha'kwena descends into the He'iwa ki'wi'sine, sits by the Sa'ya'hlia,
    speaks briefly, and is visited by Kia'nakwe personators from Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The 'Cha'kwena follows a route through the sacred dance plaza and prays for
    the people's health, increase, game, and crops.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The A'toshle remain in town, announce that the gods will come four times,
    scold adults, and frighten children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sa'ya'hlia whip people who wish to be cured of headaches and bad dreams,
    using large bunches of yucca.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The 'Hle'lele arrive late at night; fires and bonfires burn throughout the
    village, people pelt the 'Hle'lele with coals, and the 'Hle'lele call for more
    fire, calling the coals beautiful flowers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Dancing continues in all the ki'wi'siwe until after midnight, when the gods
    depart by the western road.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Sal'imobiya bring baskets of seeds into each ki'wi'sine and give seeds
    to each person present; the passage states that the seeds will yield bountifully
    if the recipients have good hearts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The visits, dances, and seed distribution are repeated every fourth night
    until four visits have been made.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Each member of the Ko'tikili carries food to the road to Ko'thluwala'wa, prays
    for rain to fructify the earth, and empties the food into the river as offerings
    to Kok'ko A'wa, all the gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After the whipping, the Sa'ya'hlia return at midnight, are sprinkled with
    meal by the Ko'pi'lashiwanni, and depart by the western road with the 'Hle'lele.
  category: sequence
  evidence_refs:
  - ev:10
