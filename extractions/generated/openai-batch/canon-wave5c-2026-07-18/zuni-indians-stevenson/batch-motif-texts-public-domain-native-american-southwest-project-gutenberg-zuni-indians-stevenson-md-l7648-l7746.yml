- id: ev:5
  type: summary
  locator: lines 7697-7704
  quote_or_summary: The 'Cha'kwena moves through the sacred dance plaza and prays
    for the people's good health, increase, more game, and bountiful crops.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in request metadata.
- id: ev:6
  type: summary
  locator: lines 7705-7718
  quote_or_summary: The A'toshle announce that the gods will come four times, scold
    adults, and frighten children; the Sa'ya'hlia whip cure-seekers for headaches
    and bad dreams with bunches of yucca.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in request metadata.
- id: ev:7
  type: summary
  locator: lines 7719-7730
  quote_or_summary: The 'Hle'lele arrive late; fires and bonfires burn in the village,
    people throw coals at them, and they call for more fire, referring to the coals
    as beautiful flowers.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in request metadata.
- id: ev:8
  type: summary
  locator: lines 7731-7737
  quote_or_summary: Dancing continues until after midnight, the gods depart by the
    western road, and the Sal'imobiya distribute seeds in each ki'wi'sine; the seeds
    are expected to yield bountifully if recipients have good hearts.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in request metadata.
- id: ev:9
  type: summary
  locator: lines 7738-7743
  quote_or_summary: The Sal'imobiya visits, dances, and seed distributions repeat
    every fourth night until four visits are complete; Ko'tikili members carry food
    to the road, pray for rain and earth's fruitfulness, and empty the food into the
    river for Kok'ko A'wa.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in request metadata.
- id: ev:10
  type: summary
  locator: lines 7744-7746
  quote_or_summary: After the whipping, the Sa'ya'hlia return at midnight, are sprinkled
    with meal by the Ko'pi'lashiwanni, and depart over the western road with the 'Hle'lele.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
