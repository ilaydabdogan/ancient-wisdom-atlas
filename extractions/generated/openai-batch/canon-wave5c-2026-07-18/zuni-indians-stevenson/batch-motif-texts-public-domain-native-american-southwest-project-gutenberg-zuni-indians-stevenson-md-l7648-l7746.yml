  quote_or_summary: Four Sa'ya'hlia remain to receive the 'Cha'kwena; her personator
    must be a man of the Badgei clan, pregnant women look on her for safe and painless
    parturition, and Kia'nakwe personators visit her.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
