  quote: ''
  summary: 'The passage describes Zuni basketry: ordinary coarse baskets made from
    local plant materials, their uses for carrying, saddlebags, winnowing, and collecting
    grasshoppers, and the purchase of finer bread baskets and ceremonial trays from
    Apache, Hopi, and other Native groups, with Apache baskets especially valued.'
