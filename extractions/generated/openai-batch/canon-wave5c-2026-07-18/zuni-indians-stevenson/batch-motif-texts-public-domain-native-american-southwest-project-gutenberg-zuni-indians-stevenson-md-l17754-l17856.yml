canonical_text:
  quote: ''
  summary: The passage describes a Zuni ritual race organized through ki'wi'siwe and
    Bow priesthood leadership. Participants are aligned with elder and younger Gods
    of War, priests place feather-cord la'showanne near the road of the Gods of War,
    warriors use marked gaming sticks, meal is sprinkled with prayers for rain, runners
    follow a prescribed route, draw breath from the plumes to run like a tireless
    bird, kick sticks into the river so they may go to Ko'thluwala'wa, and the la'showawe
    are buried with prayers to rain-makers.
  language: English with Zuni terms
  quote_policy: summarized
