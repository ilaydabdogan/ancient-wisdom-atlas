canonical_text:
  quote: ''
  summary: The passage describes procedures for entering a Zuni fraternity by invitation,
    including the exchange of meal, corn husk, cotton cord, and eagle feather; gestures
    and prayers toward six regions; later redistribution of meal to female clan members;
    sunrise sprinkling; an all-night dance; rehearsal gatherings; and details about
    feather offerings, offices, dancers, and ritual staffs used in winter solstice
    and circle-dance contexts.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A member of the fraternity may invite a person to join; adults are addressed
    directly, while a child's parents are addressed for a child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the invitation is accepted, the invited person gives the solicitor meal
    wrapped in corn husk with a white fluffy eagle feather attached by white cotton
    cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After receiving the meal package, the solicitor becomes the invited person's
    fraternity father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fraternity father and novice stoop with bended knees while holding the
    package and hands in a prescribed way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The fraternity father moves the novice's hands to the six regions with a prayer
    and receives the meal package.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: On the previous day in the following year, the fraternity father removes the
    eagle feather, places it in another husk, sprinkles meal on it, ties the husk,
    and keeps it temporarily at home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The fraternity father visits females of his own clan and of his paternal parent's
    clan, giving each a pinch of meal with prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Recipients wrap the meal in corn husk and sprinkle it outdoors at daylight
    toward the rising sun the following morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Recipients of the meal are expected to attend and take part in an all-night
    dance on the fifth night of the ceremonial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: Before the ceremony, the fraternity gathers in a ceremonial chamber to rehearse
    songs, which begin near midnight.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: Earlier parts of rehearsal evenings were formerly used for telling tales,
    but the passage says current grievances had displaced that practice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The first stroke of the drum signals the choir to begin after the director
    is notified about village conditions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Feathers are described as conspicuous in Zuni worship, and the 'Hle'wekwe
    make la'showawe from small wing feathers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The 'Hlem'mosona carries the la'showawe to the North kiva on the tenth morning
    of the winter solstice ceremonies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Kia'kwemosi chooses young men and girls to serve as directors and directresses
    for the Mu'waiye and for six members of the Bow priesthood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The tehl'nawe is described as a slender staff with ends painted for the six
    regions, seeds, corn husk wrapping, feathers, a miniature war club, bow and arrows,
    shell, shield, cotton network, and red pigment.
  category: object
  evidence_refs:
  - ev:6
