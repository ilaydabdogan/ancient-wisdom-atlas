canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni crop-thanksgiving ceremony: four warriors
    are ritually prepared with arrow points, bows, medicine, and tobacco; girls are
    adorned with feather wands, animal and plant ornaments, jewelry, and arrows for
    a dance; ritual smoking and head-waving occur; processions move to the plaza where
    girls dance before seated warriors and choirs; finally a man representing a buffalo
    appears, dances between the girls, clasps one girl, and exits amid spectators''
    enthusiasm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A member of the Ant fraternity removes arrow points from a sack and places
    one in the mouth of each of four men with a prayer; the arrow points are to remain
    in their mouths until the warriors return to the chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bow and arrow are laid before each man after four equidistant lines of kaolin
    paste are applied to each bow and hawk down is attached to each line.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two A'pi'Tlashiwanni chant before the seated men while a choir sings; the
    A'kwamosi of the Ant fraternity gives each warrior a draft from the medicine bowl
    with a shell and a reed filled with tobacco.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each warrior takes a bow, arrow, and feather wand and leaves the chamber;
    two go to Up"sannawa ki'wi'sine and two to Chu'pawa ki'wi'sine, each pair preceded
    by a member of the Bow priesthood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The text says Up"sannawa ki'wi'sine represents the side of the elder God of
    War, while Chu'pawa ki'wi'sine stands for the younger God of War.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Young men in the ki'wi'siwe adorn girls about ten years old for the dance,
    dressing them with moccasins, a black woven gown, and a white embroidered cotton
    kilt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Feather wands are fastened upright to the girls' heads; their adornments also
    include a leather headband, carved wooden horn, artificial squash blossom, fox
    skin, yarn tassel, beads, coral, turquoise, ko'hakwa necklaces, and a spread turkey
    tail.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each girl carries an arrow in her right hand and manipulates it during the
    dance; the text states that this signifies that Zuni arrows may destroy the Navahos.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Reed cigarettes are handed to the scalp custodian and another warrior, lighted,
    returned, smoked by the donors, waved around the donors' heads, and then thrown
    on the floor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Warriors, preceded by choirs and followed by girls, proceed to the plaza;
    the warriors stoop or sit while the girls dance before them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The girls' dance is described as resembling hummingbirds hovering over blossoms,
    with outspread arms and feet scarcely touching the ground.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: During the ceremony of the last four warriors, a man representing the buffalo
    appears with face and body colored black, a black sheepskin wig, a deerskin kilt
    with bells, a Hopi sash, and a rattle.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The buffalo man dances between two lines of girls, darts away while shaking
    a rattle, clasps one girl in what the text calls an obscene manner, returns to
    dance, and finally leaves the plaza amid spectators' enthusiasm.
  category: action
  evidence_refs:
  - ev:7
