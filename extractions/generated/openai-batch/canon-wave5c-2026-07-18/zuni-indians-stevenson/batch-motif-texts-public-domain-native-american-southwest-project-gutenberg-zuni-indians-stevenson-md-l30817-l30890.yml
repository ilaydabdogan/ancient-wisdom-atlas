canonical_text:
  quote: ''
  summary: An initiation rite is described in which an older brother Bow priest circles
    a novice with cactus and calls on directional Ku'pishtaya. The group proceeds
    to the village and ceremonial chamber, where stone knives, cactus, willows, a
    prayer plume, and altar objects are arranged. Medicine water is consecrated with
    music, rhombus-whirling, songs, and stones placed in water. Officers and members
    dance and place cactus or willow switches before parts of the novice's body while
    praying for rain, health, and a pure heart; the novice then dances alone with
    cactus before the day's rites end.
  language: English
  quote_policy: summarized
