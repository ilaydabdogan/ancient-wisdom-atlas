canonical_text:
  quote: ''
  summary: The passage describes completion and ritual use of a mi'li fetish, rules
    and substitutions for membership in warrior-related fraternities, and a calendar
    of Zuni fraternity meetings involving healing, initiation, fire practices, weather
    prayers, plant medicines, and ritual authority under directors and the sun priest.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mi'li of the order of Mystery medicine is completed with straw, cord, shell,
    beads, and cotton cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The theurgist holds the mi'li and repeats a long prayer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theurgist passes the mi'li four times over the recipient's mouth so she
    may draw sacred breath from the fetish, then tells her to receive her father;
    the text says that a male would be told to receive his mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the father's fetish is completed, the young theurgist weeps, sighs,
    and says he has pleased his mother but offended his gods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Ko'shi'kwe and A'pi'lashiwanni are described as not divided into orders
    like other fraternities.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Membership in the 'Ko'shi'kwe is associated with valorous deeds such as killing
    an enemy, while A'pi'lashiwanni membership is said to have required killing an
    enemy and bringing in the scalp.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because intertribal wars ceased and scalps became unavailable, some men without
    combat experience are received into the A'pi'lashiwanni using an old hairless
    scalp from the scalp house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Most fraternities hold synchronous meetings for eight days and nights at the
    winter solstice, when the sick are healed and sword swallowing, fire play, and
    jugglery are practiced; initiation does not occur then.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Suds are made in a bowl of water with a reed and crushed or broken root to
    symbolize snow clouds while prayer is made for cold rains and snows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Outside these solstice meetings, fraternity meetings usually last one day
    and one night unless there is initiation, in which case they convene for four
    days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage lays out a yearly sequence of meetings, including January Mystery
    medicine initiation and healing, February Fire order meetings, March meetings
    of Little Fire and Cimex, a summer solstice rain invocation, August and September
    plant medicine preparation, and October and November initiation and healing.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:12
  text: The A'pi'lashiwanni act as warriors and guardians of altars and fetishes at
    winter and summer solstice meetings.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Meeting dates are normally fixed by a director, but the Shu'maakwe director
    is under the pe'kwin, or sun priest, and the fraternity may convene only at his
    command.
  category: relationship
  evidence_refs:
  - ev:10
