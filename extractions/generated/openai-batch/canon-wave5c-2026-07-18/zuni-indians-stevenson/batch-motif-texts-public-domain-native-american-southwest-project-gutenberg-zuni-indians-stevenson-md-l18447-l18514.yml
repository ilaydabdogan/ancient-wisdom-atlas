canonical_text:
  quote: ''
  summary: 'The passage describes implements and ritual procedures for a game called
    I''yankolo''we: painted wooden cups, a stone ball and disk, medicines, seasonal
    timing, consultation with a rain priest, preparation of a room with prayer meal,
    public announcement, selection of players and watchers, and offerings folded into
    corn-husk packages.'
  language: English with Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rain priests and theurgists are said to propitiate their gods for their own
    good, their people's good, and the good of all the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The game implements include four quaking-aspen wooden cups, a stone ball,
    a white-and-black stone disk, and 106 straws.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cups are painted white with kaolin, with black paint on the bottoms extending
    up the sides.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The black paint is said to have come from the undermost world and is mixed
    with water, medicine, and powdered micaceous hematite called star medicine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gaming ball is touched with white paint and wrapped in cotton cord, or
    else the whole ball is painted white.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says the game formerly used four wooden deer with side openings
    large enough to contain the ball instead of cups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: I'yankolo'we is played only in January, February, and March, mostly in February,
    and once begun must continue without interruption to the close.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man wishing to play calls at sunset on a rain priest of the West, East,
    Zenith, or Nadir and is told to return at night with wafer bread, precious beads,
    and prayer meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The rain priest brings out an ancient gaming ball after a female household
    member sweeps the inner room.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rain priest makes four parallel north-south lines of prayer meal by the
    north wall and places the ball midway on the westernmost line for the night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The rain priest gives the man wafer bread, a corn-husk tobacco cigarette,
    powdered mythical medicine plant, and a piece of banded gypsum.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: A member of the governor's staff announces from the housetop that the game
    will be played the following night and names the leader.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The leader selects three associate players and four watchers, described as
    seers who choose the hidden cups.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The leader and head watcher place corn husks on the floor, and those present
    deposit turquoise, white shell beads, micaceous hematite, red hematite, and corn
    pollen in them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Each participant places a reed cigarette in one package, then folds each husk
    and its offerings into a rectangular package.
  category: action
  evidence_refs:
  - ev:7
