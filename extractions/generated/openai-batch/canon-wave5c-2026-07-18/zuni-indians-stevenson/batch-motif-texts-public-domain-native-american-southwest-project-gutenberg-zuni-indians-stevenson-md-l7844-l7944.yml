canonical_text:
  quote: ''
  summary: The passage describes Zuni winter dance practices involving A'toshle, Ko'yemshi,
    Sha'liiko, Mu'luktakia gods, Kor'kokshi announcements, prayer plumes, tobacco
    smoking toward the six regions, offerings of meal, requests for rain, corn, food,
    children, and the collection of dancers, corn, and cultivated seeds.
  language: English with Zuni ritual terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dances occur in the ki'wi'siwe on the fourth night, and gods appear in
    the plaza on the fifth morning after Pau'tiwa announces their coming.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'toshle do not dance in the plazas but go about the village and are later
    joined by some Ko'yemshi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blank cartridges are sometimes fired by a man of the house at the A'toshle;
    the passage states this symbolizes the Navaho being frightened away or killed
    and kept from Zuni homes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When an A'toshle falls as if dead, a house door is closed on him, and he soon
    rises and walks away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: At other times A'toshle and Ko'yemshi are shot in a ritual action that the
    passage states symbolizes the killing of game, and the shooter is expected to
    be successful in hunting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The supposed game is carried into the house, placed on a floor blanket with
    head east and facing south, covered with an embroidered sacred blanket, sprinkled
    with meal by those present, and identified to children as a deer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Personators of the gods return at dusk to the ki'wi'sine, remove their masks,
    put on ordinary dress, and return home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each chosen Sha'liiko, with his younger brother, plants four te'likinawe in
    an arm-depth excavation on the western road, with prayer meal sprinkled in before
    the excavation is covered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the day after the last performances, the Ko'pekwin makes four te'likinawe
    and plants them in his cornfield to the Council of the Gods and the rain-makers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two Mu'luktakia gods from the He'iwa ki'wi'sine visit other ki'wi'siwe and
    announce that the gods will come on the fourth night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A reed cigarette of native tobacco is lit, waved to the six regions with puffs,
    passed to the two gods, and returned to the wor'li before being placed in a basket
    tray.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When asked why they have come, the gods say they come so the people may raise
    much corn and food, have many children, be happy, and prepare for the gods on
    the fourth night.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The gods repeat a long prayer in an archaic tongue that includes an account
    of their coming to this world, migrations, and springs passed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The elder brother god draws four parallel meal lines east and west and places
    a cigarette and corn-husk package of meal on the south line.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the gods leave, those present smoke the cigarette and wave it to the
    six regions for rain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The two announcer gods deposit te'likinawe on riverbanks in an arm-depth excavation
    to the Council of the Gods and the rain-makers, after meal is sprinkled in and
    the excavation is covered.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Two dance talkers in each ki'wi'sine collect dancers, and two men from He'iwa
    collect corn and cultivated seeds in blankets while ritual officers prepare te'likinawe
    for the Council of the Gods.
  category: action
  evidence_refs:
  - ev:10
