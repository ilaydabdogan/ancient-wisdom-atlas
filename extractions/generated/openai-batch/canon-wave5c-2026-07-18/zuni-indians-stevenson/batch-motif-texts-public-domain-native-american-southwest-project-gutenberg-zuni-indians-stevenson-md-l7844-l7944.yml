candidate_motifs:
- id: motif:1
  label: seasonal arrival of gods in winter dance cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage locates the Kor'kokshi rites in winter, states that gods come
    on the fourth night, and refers to the great gods coming in the middle of the
    year.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage is descriptive and does not provide a mythic narrative beyond
    the ceremonial schedule.
- id: motif:2
  label: ritual exchange with gods for rain, crops, food, children, and happiness
  taxonomy_refs:
  - sacred_exchange
  basis: Humans give te'likinawe, meal, and tobacco actions to gods or divine councils,
    while the gods state that they come so people may raise corn and food, have children,
    be happy, and receive rain-directed rites.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The exchange is inferred from ritual sequence and stated divine purpose;
    the passage does not frame it as a contract.
- id: motif:3
  label: ritual mock killing and revival or game transformation
  taxonomy_refs:
  - death_rebirth
  basis: A'toshle may fall as if dead and then rise, or be treated as game carried
    into a house and identified as a deer.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: low
  cautions: The passage explicitly describes symbolic firing and game-killing; a full
    death-and-rebirth motif is only partially supported.
- id: motif:4
  label: offering deposition in earth for divine and rain-making recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe are planted in excavations, a cornfield, and riverbanks to the
    Council of the Gods and rain-makers, with meal sprinkled before covering the excavation.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage names the recipients and actions but does not explain all
    meanings of the deposited items.
