canonical_text:
  quote: ''
  summary: 'The passage describes evening and night scenes at a Sha''liiko festival
    in Zuni: selected observers watch dances from private inner rooms; drinking and
    liquor trading occur outside the ceremonial chamber and in inner rooms; dancers
    receive medicine water after dances; the Sha''liiko appears; at midnight a feast
    is held, food is deposited under an outside ladder by the Sha''liiko personator
    and alternate, and dancing continues until daylight.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large Zuni house has a private hallway and inner rooms from which selected
    observers watch ceremonies through large wall openings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women and children sit on chairs and boxes to watch, young men socialize with
    girls between dances, and men smoke, chat, and take turns observing the dance
    or entering the ceremonial room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the night advances, drinking occurs; the passage states that whisky is
    not served in the ceremonial chamber and that care is taken to conceal the source
    of intoxication from non-Indians.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Whisky peddling is described as beginning weeks before the Sha'liiko festival,
    with liquor carried in kegs small enough to hide under a blanket.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Zuni traders sell or exchange whisky to Navaho visitors, and the passage gives
    examples of a pony and jewelry being traded for small quantities of whisky.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Inner rooms said to be for the elect are also used for liquor trading, and
    emissaries are sent to bring in people who want liquor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After each dance, participants receive medicine water administered with a
    shell from a bowl by the maker of medicine water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the dancers leave the house, the Sha'liiko appears on the floor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dancing is suspended at midnight for an elaborate feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Food is deposited under the ladder outside the house by the personator of
    the Sha'liiko and his alternate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the feast, dancing continues until daylight, when the ceremonies close
    to resume later in the morning.
  category: sequence
  evidence_refs:
  - ev:5
