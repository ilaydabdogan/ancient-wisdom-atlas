canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Zuni ceremonial actions: silent retreat
    and unspoken prayer for rain, preparation of plume offerings, a Ko''yemshi/Du''michimchi
    procession in which women pour water mixed with sacred meal over them as a rain
    prayer, meal painting and sacred object placement, preparation of tobacco-filled
    reeds, and night invocations by the Great Fire fraternity to divine beings for
    rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A jug of water is placed by a floor painting and later emptied into a medicine
    bowl and drunk on the closing night by those present.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party in retreat rarely speaks, sings little until the last night, and
    directs silent prayers to the Sun Father and the u'wannami.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the Shi'wano'kia is nursing, an infant is brought in, fed, and carried
    away in silence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the eighth day several A'shiwanni, Bow priests, officials, and god-personators
    gather to prepare te'likinawe in ceremonial chambers.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Each person present makes four offerings to the Council of the Gods, and each
    person who will personate a god makes four additional offerings to the god represented.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ko'yemshi, then called Du'michimchi, leave the house nude except for a
    small black loincloth, with loose hair, proceeding in file while each holds the
    loincloth string of the one ahead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women on house tops pour water mixed with sacred meal over the Du'michimchi
    with a prayer for rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After drying, the Du'michimchi put on masks, visit house tops, tour the village,
    return to the ceremonial chamber, resume their dress, and renounce the name Du'michimchi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near sunset the Ko'mosona makes a meal painting, places sacred objects around
    it, and prays for rains to fructify the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Ko'mosona and Ko'pekwin each prepare three reeds filled with native tobacco,
    color them black, wrap each in a corn husk, and deposit them in an Apache basket
    by the meal painting.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Members of the Great Fire fraternity, each carrying a rattle, sing invocations
    to named beings and ask their intercession with the u'wannami for rain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The song closes at midnight with the drawing of the sacred breath of A'wonawil'ona,
