canonical_text:
  quote: ''
  summary: An observer describes a boy's medicine performance over an invalid girl,
    including meal, roots, dramatic bodily actions, a claimed extraction of disease,
    and burial of a corn husk. After interrogation, escape, recapture, and a second
    trial led by Nai'uchi, the boy gives a story about hereditary witches, ancestral
    plume offerings, winter-solstice gatherings to prevent precipitation, animal transformation
    through yucca implements, four lamps in an inner room, cactus needles used to
    kill, and hidden prayer plumes in his mother's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A substance associated with insanity was placed south of meal, and three bits
    of good medicine were placed north of the meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy sang very quietly, took a bite from a root south of the meal, chewed
    it, ejected it upon his hands, and rubbed his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy distorted his face, spun around, jumped, shook his body violently,
    rushed to the invalid, pulled at her arms, and ran his hands over them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The invalid girl was held by her father and brother while she tried to scream
    and release herself and showed terror when the boy approached.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: After swallowing a small quantity of another medicine, the boy became rational
    in demeanor, touched the girl's lips with his own, and the narrator says he pretended
    to draw disease from her heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy ejected into his hand what he claimed to have drawn from the girl's
    heart, deposited it upon meal, and compelled the girl to swallow three bits of
    good root medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boy offered a long prayer, sprinkled meal upon the supposed extracted
    material, gathered the meal into a corn husk, and buried the husk west of the
    village with the girl's grandfather.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Warriors interrogated the boy until early morning; the writer intervened to
    end the ordeal; the boy later escaped, was captured after hard riding, and was
    returned to the sufferer's house for another trial.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nai'uchi rejected the boy's repeated story and said he would keep the boy
    talking until he spoke the truth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy stated that his father, mother, and sister were witches, that he belonged
    to the family of original witches, that his grandfathers were wizards, and that
    he had plume offerings brought to this world by witch ancestors.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The boy said witches gathered in his mother's house at the winter solstice
    from all over the country to prevent rains and snows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy said ancient plume offerings held to the heart, yucca strings crossed
    over the breast, and jumping through a yucca hoop empowered people to become dogs,
    cats, coyotes, hawks, crows, and owls.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy said the witches gathered in an inner room of his mother's house where
    four ancient lamps hung, one on each wall, and that they made the rain-makers
    angry so the rain-makers would not work.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The boy claimed he could assume the form of a cat, pass through a small hole,
    fill his mouth with cactus needles, shoot them through windows, and destroy life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The boy said he had packages of ancient prayer plumes used to convert people
    into other forms; when the warriors demanded to see them, he said they were in
    his mother's ancestral house, and later said they were secreted in the wall of
    an adjoining room.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
