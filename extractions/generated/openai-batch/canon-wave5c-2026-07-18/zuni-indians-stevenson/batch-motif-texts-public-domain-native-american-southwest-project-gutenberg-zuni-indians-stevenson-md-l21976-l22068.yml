  confidence: high
  cautions: The narrator explicitly characterizes the extraction as pretense and later
    calls the event a farce; extract as a narrated ritual pattern, not as verification
    of efficacy.
- id: motif:2
  label: Shapeshifting by ritual implements
  taxonomy_refs:
  - shapeshifter
  basis: The boy says plume offerings, yucca strings, and a yucca hoop empower transformation
    into dogs, cats, coyotes, hawks, crows, and owls for quick and hidden movement.
  evidence_refs:
