candidate_motifs:
- id: motif:1
  label: Ritual extraction and disposal of illness
  taxonomy_refs: []
  basis: The boy pretends to draw disease from the girl's heart, places the supposed
    material on meal, gathers it into a corn husk, and buries it west of the village.
  evidence_refs:
