canonical_text:
  quote: ''
  summary: The passage describes two related ceremonial performances involving eagle
    feathers or plumes being passed through flame, reduced to charred bits, manipulated
    by dancers, and then made to reappear. It also describes the Little Fire fraternity's
    altar setting, costumes, procession, meal markings, masked Ko'yemshi participation,
    animal-like performance, and visitation of houses blessed by the Sha'lako.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The A'kwamosi, identified as maker of medicine water, brings a basket of eagle
    feathers tied in pairs to the director beside the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The director sings, holds up a bunch of feathers, dances, and gives the feathers
    to one of the Ko'yemshi.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: One Ko'yemshi passes the feathers through a lit lamp flame, returns with charred
    bits, dances while pressing them to his breast, and then gives the remainder back
    after failing to accomplish the effect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another fraternity member passes the charred bits through the flame, presses
    them to his body while dancing and singing, and two white plumes appear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the 1896 Little Fire fraternity performance, the altar remains with mi'wachi,
    medicine water bowls, baskets of multicolored corn grains, and a small flute.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Twenty-four fraternity members prepare for a dance and reappear with bodies
    decorated in white kaolin representing heavens, prey animals, and lightning; the
    lightning symbol is restricted to specified members.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ko'yemshi remove their moccasins, put on masks, cast off blankets, and
    reveal ragged black kilts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fraternity forms a file led by a woman carrying a meal basket and mi'li;
    the last man is the pe'kwin of Shu'maakwe and wears an eagle plume through his
    nose as a badge of high office.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nai'uchi carries a basket tray with a white painted gourd, red cotton, white
    eagle plumes, and also carries two eagle-wing plumes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: After circling the room and forming an ellipse, the fraternity and Ko'yemshi
    dance and then visit six houses blessed by the Sha'lako.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the first house, meal is sprinkled, a blanket is spread in the center of
    the ellipse, and Nai'uchi makes a meal disk with a four-line cross before placing
    the basket tray on it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the pe'kwin whispers to Nai'uchi, he moves like an animal, stooping
    and growling, while others cry out as if warning of a wild beast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The pe'kwin plucks plumes from the gourd, passes them through the fireplace
    flames, returns with charred bits, dances in a cowering posture, and the plumes
    reappear.
  category: action
  evidence_refs:
  - ev:9
