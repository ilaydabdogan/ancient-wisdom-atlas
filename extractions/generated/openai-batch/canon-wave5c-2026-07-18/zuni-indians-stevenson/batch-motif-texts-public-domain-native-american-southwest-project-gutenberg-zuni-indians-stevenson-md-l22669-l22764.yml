canonical_text:
  quote: ''
  summary: The passage describes procedures for joining Zuni esoteric fraternities
    associated with Mystery medicine and other orders. It details sacred meal offerings,
    gifts between novices and fraternity fathers, requirements for joining Fire, Sword,
    It'sepcho, and Pa'yatamu orders, compulsory initiation rules connected with plumes
    and meal lines, and symbolic meanings assigned to the et'tone and mi'li, including
    Earth Mother, rain, vegetation, and life-giving power from A'wonawil'ona. A note
    compares sucking cures and sand painting practices to wider practices outside
    Zuni contexts.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mode of joining different esoteric fraternities connected with healing
    through Mystery medicine is described as substantially the same.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A restored patient usually joins the fraternity of the theurgist who performed
    the cure, but this is not obligatory; the cost of the required gift may cause
    the person to join another order first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person desiring to join prepares sacred meal made from white corn, turquoise,
    and micaceous hematite, places it in a corn husk, folds and ties it, and carries
    it to the curing theurgist; for a young child, a parent carries it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The theurgist carries the sacred meal package at night to one of the compass
    points, makes an excavation, and sprinkles the contents into it as an offering
    to the Beast Gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes that sucking to cure disease is not confined to the Zunis
    and is described as common among aboriginal peoples of the world with minor differences.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes comparative examples of sand painting or sand design practices
    in India and mentions Arizona ceramic sprinkling cups and Renaissance powdered-marble
    table borders.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anyone acceptable to a fraternity may join the Fire and Sword orders, whose
    ceremonials are said to be for rains and snows rather than for healing the sick.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father of the chosen fraternity gives a blanket to a male novice and a
    woven dress to a female novice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The It'sepcho order is joined after membership in the Fire and Sword orders
    unless the person already belongs to Mystery medicine; its fraternity father gives
    the novice a woman's belt worn by men in ceremonials.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Pa'yatamu order exists only in the Little Fire and Cimex fraternities
    and may be joined only by male members of the Mystery medicine order.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: For four days before initiation, each novice wears a fluffy eagle plume attached
    to the hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Accidentally touching a plume-wearing member of the Fire and Sword orders,
    or stepping on or within meal lines drawn on the ceremonial chamber roof, obliges
    the offender to join the order.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: For the Ne'wekwe Mystery medicine order, touching the plume wearer on specified
    body parts compels the offender to join; a similar rule is stated for the Shu'maakwe
    fraternity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Shu'maakwe fraternity is said not to practice Mystery medicine, and its
    medicine is said to have come from the Shumai'koli rather than from the Beast
    Gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A Mystery medicine novice gives a finely dressed deerskin to the fraternity
    father, who gives a mi'li to the novice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The et'tone is described as a very sacred object of the A'shiwanni and as
    symbolizing Earth Mother, rains, vegetation, and physical nourishment.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The mi'li is described as symbolizing life-giving or soul power from A'wonawil'ona,
    the supreme bisexual power, who is called breath of life and life itself.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: Breath from the plumes of the mi'li is described as conveying life from A'wonawil'ona,
    and an ear of corn and other seeds are placed beneath the plumes.
  category: attribute
  evidence_refs:
  - ev:9
