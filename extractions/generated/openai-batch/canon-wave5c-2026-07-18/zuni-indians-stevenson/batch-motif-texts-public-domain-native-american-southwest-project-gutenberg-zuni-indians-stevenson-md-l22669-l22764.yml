- id: claim:1
  claim: The passage states that sucking to cure disease is not confined to the Zunis
    and is common among aboriginal peoples of the world, differing only in minor details.
  claim_level: same_function
  target: Sucking cure practices among aboriginal peoples of the world
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an authorial generalization in the passage and is not supported
    here with detailed examples or independent evidence.
- id: claim:2
  claim: The passage compares sand painting or sand design practices by noting that
    people in India design gods in sand on the ground by sprinkling, while also discussing
    possible sprinkling cups from Arizona.
  claim_level: visual_similarity
  target: Indian sand designs and Southwestern dry painting or sand painting practices
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The note itself says the writer cannot say how widespread the observance
    is, and the OCR-corrupted passage limits precise extraction.
