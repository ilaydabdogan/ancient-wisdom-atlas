canonical_text:
  quote: ''
  summary: The passage describes Ne'wekwe ceremonial participants receiving a noxious
    ritual dose, the dress and objects of the Kok'ko 'hlan'na and fraternity members,
    dose administration involving Ko'yemshi attendants, subsequent revelry and taboo
    performances, mimicry of Catholic and military outsiders, and a brief transition
    introducing the Hunters fraternity and its Fire order.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child identified as the daughter of the Kia'kwemosi participates in an ordeal
    and does not flinch, though the dose is described as taken with aversion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants are said to eat offal and drink urine so that their intestines
    will not be destroyed by the hot medicine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The observer states that the dose is given and received with the same seriousness
    as Christian churches observe their most sacred sacraments.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Kok'ko 'hlan'na wears specified garments and ornaments and carries bunches
    of split giant yucca and a feather wand wrapped with corn husks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thirty men and five boys are present; most have ash-colored body paint, one
    has black paint with white bands, and the men have marked backs and arranged hair
    or skullcaps.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each male participant carries a baton wrapped with cotton cord, colored in
    bands, finished with turkey plumes, and furnished with a single grain of corn
    described as symbolic of the baton’s heart.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women and girls wear conventional dress with white Hopi blankets, moccasins,
    and hair arranged like the men’s.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kok'ko 'hlan'na administers the morsel while moving in a dancing motion,
    whips a man with yucca switches, and passes the dose through a Ko'yemshi attendant
    to the designated recipient.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some recipients divide the morsel with another person by mouth-to-mouth transfer;
    children accept it as a religious duty but do not appear to relish it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the god’s absences from the plaza, revelry includes a wool-bag game
    between Ne'wekwe and Ko'yemshi and the emptying of urine vessels over one another.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the Kok'ko 'hlan'na’s final departure, the passage says the performances
    are intended for amusement and that women and girls of the fraternity leave the
    plaza.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men compete in buffoonery and in eating or handling repulsive materials; the
    passage also reports violence toward mice and dogs and consumption of animal organs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Ne'wekwe are described as mimics who ridicule strangers, especially a
    Catholic priest and an army officer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A youthful member is called a “Catolico santo,” carried in procession, and
    seated between two torches at a mock altar made with blankets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The following section introduces the 'San'iakiakwe, also called Sus'kikwe,
    as a fraternity with Hunters and Fire orders; the Fire order handles live coals
    and rubs them over their bodies but does not eat fire.
  category: relationship
  evidence_refs:
  - ev:8
