canonical_text:
  quote: ''
  summary: 'The passage describes second-night ceremonies of a Zuni crop-thanksgiving
    festival: nighttime preparations, body painting and ornamenting, line and ellipse
    dances, singing with rattle and drum, Navaho and old-Zuni personations, comic
    burlesque, a warrior dance led by a Bow priest, and all-night movement of musicians,
    dancers, and god personators from house to house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: By 9 o'clock participants prepare for the night's ceremonies; warriors assemble
    only in the Chu'pawa and Mu'he'wa, while members of other ki'wi'siwe wear the
    dress of anthropic gods and dance in dwellings while singing songs made for the
    occasion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Ant fraternity chamber and two other rooms, paints, robes, and ornaments
    are scattered while participants are decorated for the dance.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:3
  text: Men of the Ant fraternity paint their bodies white to represent animals, snakes,
    and the heavens; women paint their lower legs and arms white.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Participants wear yucca wreaths, eagle plumes, necklaces, and, for women,
    turquoise strings in the ears; men place wreaths and feathers on the women's heads.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dancers first form two parallel lines, then an ellipse with a woman to the
    left of each man; they dance from left to right while men sing and women remain
    silent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The choir stands on the east side and sings with rattle and drum accompaniment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After dancing in the house, the dancers go in file to the Chu'pawa ki'wi'sine,
    form an ellipse, pray aloud, dance, and then form two lines again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A group of men and one five-year-old child representing Navahos appear on
    the roof; all except the child carry rattles, and the child personates a Navaho
    girl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Navaho personators call through the hatchway to the dancers below, receive
    replies, and then go to the roof of the Mu'he'wa ki'wi'sine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Young women with heads covered by blankets are present in the Chu'pawa ki'wi'sine;
    several are made to remove their wraps and dance between the lines of the Ant
    fraternity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Three youths personate decrepit old Zuni from To'wa yal'lanne, or Corn Mountain;
    they hobble with staffs and wear ragged clothing and long unkempt hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old-Zuni personators carry props including a stone ax, tin tweezers, bows,
    and arrows.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Navaho dancers descend by ladder one by one, form double file, repeat the
    previous evening's dance, and perform a song described as a prolonged burlesque
    of the Navahos.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The trio of old-men personators tries to dance with stiff movements and makes
    comic jokes; one addresses the writer as mother, causing laughter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The A'pi'^ashiwamri, led by the elder brother Bow priest, appear with white-painted
    limbs, kilts, and feathered head ornaments, and repeat their dance from the previous
    evening.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: One girl present has her blanket taken from her and is made to join the A'pi'^ashiwamri
    dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: After the warriors leave, the Chu'pawa choir sings; musicians, dancers, and
    god personators pass through covered ways and streets all night as they go from
    house to house to dance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: A note states that an unnamed character was adopted from the Hopi Indians,
    plays no part in the thanksgiving rites, and is introduced for amusement.
  category: other
  evidence_refs:
  - ev:2
