candidate_motifs:
- id: motif:1
  label: Ritual solicitation of rain and bounty
  taxonomy_refs:
  - sacred_exchange
  basis: The passage explicitly says the Sha'liiko personators dance for great rains
    and a bountiful earth; it also describes prayer, meal-sprinkling, shell-blowing
    for rains and good hearts, and rhombi whirled for clouds to gather.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an ethnographic ritual description, not a narrative myth; the
    taxonomy link is descriptive and should be reviewed.
- id: motif:2
  label: War-victory enactment with absent enemy offering
  taxonomy_refs: []
  basis: The victor and his elder brother carry red wafer bread described as offered
    to a deceased enemy; the fall of the baskets is said to indicate killing the foe,
    and the speakers declare the Navaho destroyed.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents a ritual enactment and quoted speech; it does not
    by itself support broader historical claims about conflict.
- id: motif:3
  label: Sacred-center painting guarded and approached by prayer
  taxonomy_refs: []
  basis: The passage repeatedly places figures, guards, dancers, prayers, meal sprinkling,
    and concealed rites around the cloud symbol or meal painting.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The relationship between the cloud symbol and the meal painting appears
    close in the passage but should not be over-identified without surrounding context.
- id: motif:4
  label: Ritual personation of giant couriers to rain-makers
  taxonomy_refs: []
  basis: The passage identifies participants who will personate the Sha'liiko, described
