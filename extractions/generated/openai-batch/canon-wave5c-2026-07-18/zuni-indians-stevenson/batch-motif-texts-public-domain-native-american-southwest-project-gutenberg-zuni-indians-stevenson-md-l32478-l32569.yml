canonical_text:
  quote: ''
  summary: The passage describes a Zuni plaza ceremony involving guarded ritual objects,
    a cloud symbol or painting, ha'shiya dancing led by pa'mosono'kia officials carrying
    red grass bunches, armed pu'mokiakianawe dances, Sha'liiko personators carrying
    spruce boughs for a rain dance, prayers and meal offerings before a meal painting,
    a concealed priest blowing a shell for rain and good hearts, Bow priests whirling
    rhombi for clouds, and a war-victory enactment with red wafer bread offered to
    a deceased enemy and placed near a scalp pole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named ritual figures stand on the east and west sides of a cloud symbol while
    warriors sit along each side of the painting and other warriors guard objects
    with long spears.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pu'panakwe are positioned on each side of the plaza to provide music for
    the ha'shiya dancers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pa'mosono'kia and the vice pa'mosono'kia lead ha'shiya dancers from opposite
    sides and each carries a red-colored grass bunch that is waved around the head
    four times from left to right.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grass bunches are later deposited at Shop'hlua yal'liikwi, described as
    a shrine to the Gods of War north of the village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Armed pu'mokiakianawe enter from the northeast and southwest, dance in opposing
    lines, and pray before the meal painting at the close of their dances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who will personate Sha'liiko carry spruce boughs, are led by two warriors,
    dance for great rains and a bountiful earth, and pray before the painting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pu'mokiakianawe repeat dances through the day; after each dance they gather
    before the meal painting to sprinkle meal and pray.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The priest of the 'su'hlan'na is covered by four buckskins before the meal
    painting and blows a great shell for rains and good hearts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The elder and younger brother Bow priests stand east and west of the painting
    and each whirls a rhombus for the clouds to gather.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The victor and the victor's elder brother carry basket trays of red he'we
    wafer bread on their heads while moving among dancers and speaking about meeting
    the Navaho.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the bread baskets fall, the passage says this indicates the killing of
    the foe, and the speakers declare that the Navaho has been destroyed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The pa'mosona and vice gather every scrap of the fallen bread, dancers catch
    at the bread with their mouths, and the baskets are later placed by the scalp
    pole.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
