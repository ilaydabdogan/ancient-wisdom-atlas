- id: motif:4
  label: Ritual opening of an underworld door for rain-makers
  taxonomy_refs:
  - world_center
  basis: A small excavation before the fire altar is identified as the entrance to
    the undermost world, and meal is thrown through the hatchway while calling on
    water moss to open the door so rain-makers may be present.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage supports a vertical-world portal; the world_center taxonomy
    is applied cautiously because the text does not explicitly call the place a world
    center.
- id: motif:5
  label: Directional ritual orientation
  taxonomy_refs: []
  basis: The leader waves meal to the four regions, later waves hands to the six regions,
    and dancers orient east and then north before dancing.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
