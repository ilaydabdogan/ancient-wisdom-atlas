candidate_motifs:
- id: motif:1
  label: Seasonal rain and fecundity dance
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage frames winter dances around seeds, corn, fecundity, rain-makers,
    and prayers for rain and many seeds.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The taxonomy label captures seasonal and fertility functions, but the
    passage is an ethnographic ritual description rather than a narrative seasonal
    myth.
- id: motif:2
  label: Sacred exchange through offerings and prayers
  taxonomy_refs:
  - sacred_exchange
  basis: Food is deposited in the river for grandparent figures, sacred objects are
    sprinkled with meal, cigarettes and meal are ritually offered, and prayers request
    rain, seeds, and prosperity.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not state a contractual exchange; the motif is inferred
    from reciprocal offering-prayer structure.
