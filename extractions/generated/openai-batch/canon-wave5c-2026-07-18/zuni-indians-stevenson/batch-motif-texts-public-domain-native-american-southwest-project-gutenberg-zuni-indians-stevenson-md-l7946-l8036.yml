  label: Masked divine visitation and personation
  taxonomy_refs: []
  basis: The gods are announced as coming; Kor'kokshi personators handle masks, enter
    the village masked, and dance in plazas and ki'wi'siwe.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
