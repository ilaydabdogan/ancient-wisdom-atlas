canonical_text:
  quote: ''
  summary: The passage describes seed preparation, food offerings, announcement of
    the coming gods, masked Kor'kokshi dances, prayers for rain and prosperity, distribution
    of seed sacks, an underworld-door rite at the ki'wi'sine hatchway and fire altar,
    smoking and seed-prayer actions by elders, and women's food and meal offerings
    during the winter dances.
  language: English with Zuni ritual terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Returning seed-gatherers combine corn and seeds, measure them equally into
    five parts, put them in five sacks, and place them before a fraternity altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the Ko'tikili, including women, deposit household foods into the
    river for na'nakwe and ho'takwe, glossed as grandfathers and grandmothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Mu'luktakla announce that the gods will come that night, after which people
    and Kor'kokshi personators go to eat and then gather at a head wor'li's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that female Kor'kokshi represent women who belonged to
    the Ko'tikili when alive and symbolize fecundity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kor'kokshi personators go to the river bank with blankets covering their masks;
    each places a tortoise-shell rattle on the ground, places the mask on it, sprinkles
    the sacred objects with meal, and prays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kor'kokshi pray to rain-makers to come to the people, dance, and make
    rain, and they address the Sun Father and Council of the Gods for life, a good
    heart, corn, sheep, clothing, abundance, and happiness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kor'kokshi come masked to the village, dance in four plazas, and then
    retire to the He'iwa ki'wi'sine to dance.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: After the Kor'kokshi dance and sing, five goddesses each take a sack of seeds,
    and the Sha'liko/Kor'kokshi receives reed cigarettes wrapped in a corn husk and
    a pinch of meal before leading the dancers to other ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At each ki'wi'sine roof, the leader waves meal to the four regions and throws
    it through the hatchway toward a small excavation before the fire altar, described
    as symbolic of the entrance to the undermost world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The leader calls for water moss to open the door, and the passage explains
    that the water-moss world is next above the undermost world, so that opened access
    lets rain-makers be present in the ki'wi'sine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Kor'kokshi descend the ladder, make the circuit of the room, form a single
    file facing east, turn north, and begin dancing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cigarette bearer gives meal and a cigarette to the chief wor'li, waves
    the wor'li's hands to the six regions, and prays that the Great Fathers bring
    rain and seeds; a goddess deposits a seed sack, elders pray with it, and the cigarette
    is lit, smoked, and passed along the line.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Women of the adjoining house and their friends give food to dancers when the
    Kor'kokshi are absent and sprinkle the gods with meal.
  category: action
  evidence_refs:
  - ev:8
