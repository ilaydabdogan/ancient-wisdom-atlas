canonical_text:
  quote: ''
  summary: The passage describes the hierarchical government of Zuni, in which religious
    bodies, especially the first body of A'shiwanni, nominate and judge civic officers.
    It recounts procedures for appointing a governor with a cane in the plaza and
    narrates an 1891 public proceeding in which a governor accused of theft was deposed
    by the first body of rain priests after speeches in the plaza.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Zuni government as hierarchical and involving several
    religious groups, including the A'shiwanni or Rain priesthood.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dominant authority is identified as the first body of A'shiwanni, composed
    of eight men and one woman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The civic branch consists of a governor with four assistants and a lieutenant-governor
    with four deputies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first body of rain priests nominates the civic officers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Public notification of a governor's appointment occurs in the large plaza,
    where the governor's cane is handed to the appointee.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The governor is elected for one year, may be reelected, and may lose office
    for proper cause; the same applies to members of his staff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The governor and staff handle secular affairs that do not require the judgment
    of the first body of rain priests or of the Bow priests; capital punishment is
    under the jurisdiction of the Bow priests.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In 1891, a conference was held between the rain priest of the North and an
    associate rain priest concerning whether the governor was worthy of office.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The associate rain priest was directed to inform members of the first body
    of rain priests that a meeting would be held in the house of the Priestess of
    fecundity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Seven days after the meeting, a hundred or more men, most past middle life,
    gathered in the large plaza.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the plaza gathering, the elder brother Bow priest sat on a ledge on the
    north side of the plaza, with the governor's assistants on either side, and the
    governor sat opposite him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Mexican adopted into the tribe accused the governor of stealing Zuni horses
    and trading them to Mexicans for sheep.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The governor resented the accusation and gave a lengthy speech described as
    dignified, independent, and determined.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The elder brother Bow priest spoke in favor of dismissing the governor and
    was listened to with interest.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: When a younger man spoke to a neighbor during the elder brother Bow priest's
    speech, the Bow priest stopped, stared at him without speaking, and the interruption
    ceased.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The first body of rain priests acted as judges and announced that the governor
    was deposed; the governor, his friends, and others left the plaza in silence.
  category: sequence
  evidence_refs:
  - ev:8
