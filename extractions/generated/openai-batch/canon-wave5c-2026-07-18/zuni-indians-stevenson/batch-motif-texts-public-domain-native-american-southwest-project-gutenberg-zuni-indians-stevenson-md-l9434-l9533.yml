canonical_text:
  quote: ''
  summary: 'The passage describes Zuni rain-priesthood materials and rites: plume-stick
    offerings convey breath prayers to gods and are linked to cloud and rain-making;
    te''likinawe are prepared with measured sticks, plumes, cords, colors, and regionally
    coded materials; sacred paint use is seasonally regulated. It then describes Nai''uchi,
    Shi''wanni of the Nadir, during a winter retreat in which prayers for rain, an
    elaborate meal and pollen painting with a cloud symbol, and the arrangement of
    fetishes, stones, a flute, obsidian knives, and arrow points are performed.'
  language: English with Zuni terms
  quote_policy: summarized
