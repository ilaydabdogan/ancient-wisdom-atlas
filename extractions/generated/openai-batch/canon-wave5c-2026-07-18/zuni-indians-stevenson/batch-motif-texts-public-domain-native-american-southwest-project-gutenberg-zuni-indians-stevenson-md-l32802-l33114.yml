canonical_text:
  quote: ''
  summary: 'The passage lists southern Road of Day shrine names, describes post-scalp-ceremonial
    shrine rotation and placement of elder and younger Gods of War idols with prayer
    plumes and meal offerings, explains seasonal placement rules for rain at winter
    solstice, and gives notes on associated place traditions: a miraculous flour sack
    and bread-making grandmother, Ko''loowisi the Plumed Serpent seen above flood
    waters, a wool-covered mountain, iconography of U''yuyewi/God of War images, an
    ancient cave shrine, and a crater at Zuni Salt Lake regarded as the present home
    of the Gods of War.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Road of Day section names a southern route or road and a sequence of named
    mountains or shrines, including Te'wan ko'han o'nan pii'nina, Shi'akia, Eagle's
    Nest Mountain, Sack of Meal Hanging Mountain, Twin Mountain, Whitewash Mountain,
    Face Mountain, and Wool Mountain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a scalp ceremonial, the shrines are taken in rotation; the idol of the
    elder God of War is placed north of the road of day and the idol of the younger
    God of War south of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The image is set up, prayer plumes are planted in rows on each side at right
    angles to the image, paraphernalia are arranged, and meal is sprinkled from the
    idol outward between the prayer-plume lines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the winter solstice and other peaceful rain-oriented occasions, both gods
    bear the name A'havuta; at this season the elder god is deposited on U'hana yallanne
    and the younger on To'wa yallanne, because a north-side placement of U'yuyewi
    would anger the rains and winds and bring too much cold.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note says two girls from Shun'te'klaya were gathering grasses for baskets
    to hold prayer plumes when they met the elder God of War, who invited them to
    his mountain-top house; there they saw a small sack of flour hanging from a tree,
    and the grandmother of the gods made a large basket of bread from a very small
    quantity of flour.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note explains Face Mountain by saying the face and head of Ko'loowisi, the
    Plumed Serpent, were seen above the waters there by the A'shiwi, who were on To'wa
    yallanne to escape the great flood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note explains Wool Mountain by saying the Gods of War killed many mountain
    sheep there, and the grandmother swept sheep wool from the house down the mountain
    side until the mountain was covered with wool.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The plate description identifies U''yuyewi images and associated carved or
    represented items: hands of the gods, a war club, an earthly arrow, a serrated
    cloud tablet, a crescent, a full moon opening, a star cross, a lightning arrow,
    and umbilicus projections.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: One plate shows idols of the God of War removed from an ancient cave shrine
    in the west wall of To'wa yallanne and placed outside to be photographed.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that the A'pi'lashiwanni have many shrines dedicated to
    the Gods of War and that the most sacred spot may be the crater in the volcanic
    cone at the Zuni Salt Lake, which is supposed to be the present home of these
    gods.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage gives a general statement that Zuni gods are visible in heaven,
    earth, and waters under the earth, and that they bless the good and punish the
    wicked.
  category: attribute
  evidence_refs:
  - ev:10
