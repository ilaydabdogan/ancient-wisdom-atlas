canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Kor''kokshi ceremonial dances and
    preparations: night dancing between locations, daylight anointing and fasting,
    body painting, distribution and return of tortoises and rattles, a morning visit
    involving cat-tails, meal-sprinkling, flute-playing, prayer, deposition by a cloud
    symbol, and a footnote on later tortoise offerings.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Officers of the Great Fire fraternity remain in a house while the wife, family,
    and clan relations serve food; others go home to eat, and all gather later in
    the evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kor'kokshi prepare in the ki'wi'sine for the dance, and masks are discarded
    for the night dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ko'mosona leads the Kor'kokshi, carries a mi'li and meal basket in his
    left hand, and sprinkles meal with his right hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kor'kokshi dance alternately four times in the Ko'pekwm's house and the
    ki'wi'sine, with the Great Fire fraternity and Ant fraternity providing music
    in different locations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At daylight the Ko'mosona anoints each Kor'kokshi with mud on the breast,
    right palm, and sole of the right foot, says that he does not wish them to eat
    or drink, and a fast is observed until noon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'mosona applies pinkish clay paint to men personating Kor'kokshi gods
    and yellow paint to the eight goddesses, after which participants paint specified
    body parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ceremonial dress is put on, tortoises are distributed as available, others
    carry gourd rattles, and a bowl containing tortoises remains near the middle of
    the floor.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Ko'yemshi visit Si'aa' te'wita in the early morning, each carrying cat-tails
    and a rattle; the cat-tails are presented to the Priestess of fecundity and then
    handed to the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kor'kokshi procession includes thirty gods, including twenty-eight Kor'kokshi
    and two younger brothers of Pau'tiwa, and eight goddesses.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Kor'kokshi dance in He'kiapa and Ko'china plazas before going to Si'aa',
    and their arrival at Si'aa' te'wita signals the Kia'kwemosi to play his flute.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Kia'kwemosi descends, sprinkles meal on goddesses, gods, and their cat-tails,
    receives cat-tails from them, sprinkles meal down the Ko'mosona's mi'li, and offers
    a prayer.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Kia'kwemosi returns to the ceremonial chamber and deposits the cat-tails
    by the cloud symbol on the floor.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote says that after the ceremonial the tortoises are taken home, hung
    by the neck, boiled, and partly used as medicine or deposited in the river with
    shell and turquoise beads as offerings to the Council of the Gods.
  category: sequence
  evidence_refs:
  - ev:11
