canonical_text:
  quote: ''
  summary: The passage describes preparations for the annual Sha'lako festival, including
    winter-solstice selection of personators and hosts, blessing of new or reconstructed
    houses, use and later collection or planting of te'likinawe, organization of house
    repair and construction labor, and an 1884 reconstruction of the Kia'kwemosi ceremonial
    house. It also lists ceremonial figures present during the work and describes
    their dress, objects, joking, discipline of workers, and social activity around
    house building.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During winter-solstice ceremonies, persons are chosen to personate the Council
    of the Gods, the Sha'liiko, and the Ko'yemshi, and hosts are selected to entertain
    these beings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Eight new or reconstructed houses are ritually blessed: one by the Council
    of the Gods, six by a Sha''liiko, and one by the Ko''yemshi.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A large te'likinane is kept in the house of each man who will entertain the
    Sha'liiko; at intervals his and his wife's clans gather while he holds it and
    prays for life, health, and happiness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the close of the Sha'liiko festival, the Ko'yemshi collect and deposit
    the te'likinawe, except for the one given to the host of the Council of the Gods,
    which Sa'yatsisha takes home and later plants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the ceremonial house of the Kia'kwemosi is repaired, the people of his
    clan do the work, and the pe'kwin appoints the workmen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several gods are said to be present during repair work to make sure all hands
    keep at work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Houses to be constructed or remodeled must be ready before the coming of the
    Sha'liiko.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In 1884 the ceremonial house of the Kia'kwemosi was reconstructed after lightning
    destroyed the house and caused the death of his sister, who had occupied it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Zunis are reported as saying that the sister had no love in her heart
    for her brother and that lightning never destroys the good of heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The room of the et'tone of the Kia'kwemosi, described as immediately over
    the center of the world, was not disturbed by the lightning.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the described occasion there are two Sa'ya'hlia, three A'toshle, four Ko'yemshi,
    and three members of the Ne'wekwe present.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sa'ya'hlia carry bows and arrows, tortoise-shell rattles, and bunches
    of giant yucca; the A'toshle also carry giant yucca, and are supplied with large
    stone knives.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The Ne'wekwe are said to be supposed to assist the laborers but mostly eat
    filth and play the fool.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Ko'yemshi run over the housetops and engage in jokes and nonsense, while
    the Sa'ya'hlia drive delinquents to work and the A'toshle threaten naughty or
    disobedient children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The house building is also described as pleasurable social activity, with
    women gossiping, men joking, and youths and maidens laughing.
  category: setting
  evidence_refs:
  - ev:8
