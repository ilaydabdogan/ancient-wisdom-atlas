candidate_motifs:
- id: motif:1
  label: Initiation into Ko'tikili
  taxonomy_refs:
  - initiation
  basis: The passage explicitly calls the sequence an involuntary ceremonial initiation
    of the Zuni boy into the Ko'tikili and describes sacred breath, gifts, godfather
    sponsorship, post-ceremony rites, and later vows.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives an ethnographic description of one ceremony rather than
    a narrative myth episode; interpretation should remain tied to the stated initiation
    frame.
- id: motif:2
  label: Sacred breath transmission
  taxonomy_refs:
  - sacred_exchange
  basis: Gods blow four times on plume wands and pass them before children's lips
    to give sacred breath, and participants later inhale breath from the bird fetish.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy label 'sacred_exchange' is broad; the passage describes transmission
    of breath more directly than reciprocal exchange.
- id: motif:3
  label: Serpent as source of water and seeds
  taxonomy_refs:
  - serpent
  - sacred_exchange
  basis: Ko'loowisi is presented as a serpent through whose body and mouth sacred
    water and mixed corn are delivered to ritual officials and then to children and
    godfathers.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage also notes concealed handling of water, corn, and grass, so
    the extraction records the ritual presentation without assuming a theological
    explanation beyond the text.
- id: motif:4
  label: Agricultural blessing through sacred gifts
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: Sacred water, long grass, and mixed corn received in the ceremony are used
    with stacked corn or planted separately in the coming spring.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states the subsequent agricultural uses but does not explicitly
    explain them as blessing, fertility, or seasonal renewal.
- id: motif:5
  label: Concealment of ritual mechanism from children
  taxonomy_refs:
  - forbidden_knowledge
  basis: The whistle used with the bird fetish is hidden under a blanket, and the
    children's eyes are covered so they do not know the long grass does not come from
    the serpent's mouth.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage supports concealment from children, but 'forbidden_knowledge'
    is a broad taxonomy category and may overstate the ritual context.
