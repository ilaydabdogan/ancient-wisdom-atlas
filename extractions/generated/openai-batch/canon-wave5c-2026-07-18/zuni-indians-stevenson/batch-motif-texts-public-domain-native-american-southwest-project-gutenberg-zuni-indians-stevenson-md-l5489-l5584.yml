canonical_text:
  quote: ''
  summary: The passage describes a ceremonial sequence in which gods or their personators
    enter the ki'wi'sine, use plume wands to give sacred breath to children, stage
    the announcing bird fetish Su'ti'ki, bring the serpent Ko'loowisi to distribute
    sacred water, corn, and long grass, and conclude with the return of masks, bathing,
    feasting, and a sunrise visit by the initiated boy to his godfather. The passage
    explicitly identifies the whole as an involuntary initiation of a Zuni boy into
    the Ko'tikili, with vows to be assumed later.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred embroidered blanket, another blanket on a ledge, strings of beads,
    and a red, black, and green yarn belt are placed at the west end of the room.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: U'poyona enters the ki'wi'sine first by walking down the ladder, while other
    gods somersault into the room and hop like frogs around the mounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When each god reaches the appropriate mound, the gods jump onto the mounds,
    remove plume wands, and move to the children seated between their godfathers'
    extended knees.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each god blows four times on the plume wand and passes it before a child's
    lips, described as giving the child the sacred breath of the god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the plume-wand ceremony, most gods depart by the western road, while
    Shu'laawi'si, lSi"sikia, and Great Father Ko'yemshi go to O'he'wa ki'wi'sine for
    similar ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The bird fetish Su'ti'ki is carried to a roof, made to run back and forth
    on a pole by cords, and accompanied by a hidden whistle so that it seems to chirp
    and warble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Those in the ki'wi'sine, including the children, inhale breath from the sacred
    bird fetish while the man with the whistle blows out his breath four times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bird-fetish ceremony is repeated at O'he'wa ki'wi'sine, and the two men
    with the bird fetish then leave by the western road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ko'loowisi is carried to the hatchway as a serpent, water from To'seluna spring
    is secretly emptied into its body, and water pours from its mouth into bowls held
    by ritual officials.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mixed grains of corn of different colors are put into Ko'loowisi and received
    from its mouth in baskets by the same recipients who receive the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Long grass from the spring is thrown through the hatchway while the children's
    eyes are covered so they do not know it does not come from the serpent's mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each child receives a bowl containing sacred water from Ko'loowisi, a handful
    of mixed corn, and a roll of long grass; godfathers also receive some of the gifts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The water is drunk by the boy and his immediate family and is also used to
    sprinkle stacked corn; the long grass is deposited with the stacked corn, and
    the seeds are planted separately in the coming spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the ki'wi'sine ceremonies, the gods deposit plume wands and food in
    a large excavation west of Zuni, cover it, return to the village with masks hidden
    under blankets, and return masks to their keepers with prayers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Before the feast, each god personator removes all clothing except the breechcloth
    and is bathed by women of the family.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: At sunrise after initiation, the child goes to his godfather's house; the
    godfather's wife bathes his head, and the godfather gives him four ears of corn
    and te'likinawe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The godfather carries the child to Ku'shilowa, removes the plume from his
    hair, plants it in the earth, and the child deposits his te'likinawe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The passage explicitly closes by identifying the ceremony as an involuntary
    initiation of a Zuni boy into the Ko'tikili, with the godfather mainly responsible
    and future vows required of the boy.
  category: other
  evidence_refs:
  - ev:9
