canonical_text:
  quote: ''
  summary: An ethnographic description of a fifth-day family rite in which an associate
    shi'wanni and relatives plant te'likinawe prayer plumes in a melon patch for divine,
    ancestral, fraternity, rain, agricultural, health, and longevity petitions, followed
    by fasting and household restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the morning of the fifth day, snow covered the earth, valley, and mesa
    walls while devotees in bright clothing went to and returned from a sacred mission.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described party included the male head of the house, identified as an
    associate shi'wanni, his wife, in-laws, children, other relatives, and the writer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The associate shi'wanni handed the writer te'likinawe made for her and said
    she must make offerings such as men make.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party went to the associate shi'wanni's melon patch, where he made an
    excavation about 14 inches square and about 14 inches deep using an old saber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After corn husks were removed from the te'likinawe and prayer meal was sprinkled
    in the excavation, participants planted te'likinawe without further formality.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each man deposited one blue-stick te'likinane to the Sun Father and four black-stick
    te'likinawe to his ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife's younger brother, as a member of the Great Fire fraternity, planted
    offerings to Po'shaiyanki, Po'shaiyanki's younger brother or fellow, the Cougar
    of the North, the Sun Father, and the Moon Mother.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The offering to Po'shaiyanki had a miniature crook attached, described as
    symbolic of longevity; the other offering had a miniature corn planter bound to
    it to bring much corn in the coming year.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some te'likinawe had pendent la'showawe, described as one or more plumes attached
    to cotton cord; those with la'showawe carried prayers for rains, while those without
    were for clouds and other things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each female, including a child of 4, planted one yellow-stick te'likinane
    to the Moon Mother and three black-stick te'likinawe to her ancestors; each infant
    offered one or two black-stick te'likinawe to its ancestors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wife and elder daughter of the associate shi'wanni, as members of the
    Shu'maakwe fraternity, deposited te'likinawe to Shumai'koli, Sai'apa, the ettone,
    and deceased members of the fraternity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each person took meal, held it near the lips, repeated a prayer for health,
    long life, many clouds, much rain, food, and raiment, and sprinkled the meal thickly
    over the plumes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The babies had their hands dipped into the meal and held over the plumes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The plumes remained uncovered until sunset the following day so that the Sun
    Father, passing over the road of day, could receive prayers breathed upon the
    meal and into the plumes; the spiritual essence of the plumes was said to convey
    the breath prayers to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The excavations were later covered so that no one could discover the earth
    had been disturbed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the te'likinawe were deposited, animal food or grease could not be eaten
    or touched for four days, with specified exceptions; the first body of A'shiwanni
    had to fast from animal food and grease and observe continence for ten days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: During the post-planting period there was to be no trading, no ashes or sweepings
    taken from the house, and no artificial light outside the house.
  category: sequence
  evidence_refs:
  - ev:9
