canonical_text:
  quote: ''
  summary: The passage describes a Zuni rabbit hunt rite involving personators of
    the Kok'ko, child naming and initiation, visits by pregnant women to 'Cha'kwena,
    food and seed offerings, masked dances, directional plaza movements for rain,
    and a fire-bearing procession along the western road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rabbit hunt with personators of the gods occurs every four years after
    'Kiaklo's village visit, and may also occur more often during great drought.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A'shiwanni and elder and younger brother Bow priests meet overnight, and a
    warrior of the Hunters fraternity announces that a Kok'ko hunt will occur in four
    days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who will personate the gods prepare te'likinawe, meet in their ki'wi'siwe,
    rehearse songs, and smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: "'Sísikia and the Ko'yemshi go through the village asking for boys to be initiated
    into the Ko'tikili; mothers present young male children and request that they
    be named."
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Girls are named by 'Sísikia and the Ko'yemshi only when they are to join the
    Ko'tikili.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pregnant women visit 'Cha'kwena, who is personated by a man, wash pinkish
    paint from her limbs, receive te'likinawe, and deposit them at the mother rock
    below Corn mountain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note identifies 'Cha'kwena with a deceased female warrior of the Kla'nakwe
    who carried her heart in her rattle and was keeper of all game.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: "'Cha'kwena, wearing a face mask, passes through the village saying she will
    give the people the game of the world, and receives food donations."
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sal'imobiya of the six regions announce that they will bring all seeds
    to the people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After sunset the gods go over the western road and deposit collected corn
    in the river for the gods at Ko'thluwala'wa; other food is returned to the village
    and eaten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The night before the hunt, the 'San'iakiakwe assemble, and masked personators
    of the gods dance with rattle, drum, and song.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: "'Cha'kwena enters the plaza, repeatedly starts from its center toward the
    four directions, and circles the plaza four times; the passage states that the
    circle symbolizes the world and is performed so rain-makers may cause rain to
    fall on Zuni."
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: "'Cha'kwena sits on a sacred embroidered blanket crossed with sacred meal,
    and the sun priest motions her toward six regions and attaches a red fluffy eagle
    plume to her scalp lock."
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Bow priests make fire with fire sticks, cedar-fiber torches are lit, and
    Ko'yemshi carrying torches set fire to grass and vegetation during the procession
    on the western road.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Sal'imobiya and other named gods proceed behind 'Cha'kwena and take positions
    at intervals, including the yellow Sal'imobiya of the North and blue Sal'imobiya
    of the East.
  category: sequence
  evidence_refs:
  - ev:8
