canonical_text:
  quote: ''
  summary: The passage describes a Cha'kwena/Ku'yapali'sa ceremony involving prayers
    for childbirth, child survival, fertility, offerings, house-to-house food collection,
    and a deposit of offerings at a river bank. It then begins a section on the coming
    of Ko'loowisi, the Plumed Serpent, describing preparations by god-personators,
    collection of wood, fraternity arrangements, a sacred spring errand for water
    and grass, and the physical construction of the Ko'loowisi fetish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cha'kwena repeats prayers at cardinal points for safe parturition, child survival,
    maturity, and women's fertility.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gods appear for successive evenings in village streets and dance at night
    in ceremonial spaces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cha'kwena spends four days on a bed after the food deposit, and women who
    have lost children may remain in the ki'wi'sine on a prepared sand bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman bathes and dresses the goddess in new garments, beads, wrist adornments,
    moccasins, mask, gourd rattle, te'likinawe, and fawn skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cha'kwena proceeds from the ki'wi'sine with Ko'mosona, four Sa'ya'hlia, Ko'pekwin,
    and two Ko'pi"lashiwanni, visits houses, extends te'likinawe four times, receives
    bread, and is sprinkled with meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men who hunt large game give te'likinawe for success in hunting, and Ku'yapali'sa
    is named as original owner of all game.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A'shiwanni and women who wish to become mothers make te'likinawe offerings
    to Ku'yapali'sa with long prayers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food from the fawn skin is deposited with te'likinawe and prayer meal in an
    excavation in the river bank, prayers are offered, the opening is covered, and
    Cha'kwena removes her mask.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Persons who will personate gods for the coming of Ko'loowisi spend much of
    the preceding eight days in He'klapawa ki'wi'sine and collect wood during the
    first seven mornings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sal'imobiya from other ki'wi'siwe meet with younger brothers or fellows to
    decide which fraternities will be invited, and the Great Fire fraternity must
    be in He'klapawa for the occasion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each god-personator selects a young man, provides him with a gourd jug, and
    sends him to To'seluna, a sacred spring at Ojo Caliente, for water and tall grass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young men return to join the god-personators at a point west of the village,
    where Ko'loowisi has been secretly taken by its priest or keeper.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Ko'loowisi figure is a deerskin serpent-shaped fetish with painted scale
    designs, cottonwood spine and ribs, a plumed heart, red tongue, teeth, gourd head
    with plumes, and fox-skin-wrapped throat.
  category: object
  evidence_refs:
  - ev:8
