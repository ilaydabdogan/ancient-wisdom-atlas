canonical_text:
  quote: ''
  summary: 'The passage describes a sequence within a Zuni rain ceremony: sacred objects
    are handled and prayed over, dancers and choirs perform, A''shuwahanona enacts
    a hawk-associated dance, eagle plumes are tied to trees to carry breath-prayers
    to rain-makers, a night fire protects Corn maidens, and dawn rites with corn,
    cloud symbols, feathers, meal, and continued dancing petition for rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After prayers, sacred objects are transferred from their bearers to the elder
    brother Bow priest and then to the pe'kwin, who prays to the Sun Father for health,
    happiness, long life, and blessing through the life of A'wonawilo'na.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin moves two he'kupowanne in a circle, draws sacred breath from them,
    places them in a large serrated bowl, and covers them with an embroidered kilt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ushan'ashute are dressed and painted like the he'kupowanhak'tona, carry
    specially prepared he'kupowanne, repeat the ceremony in detail, and dance with
    musical accompaniment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Shiwano'kia and other bearers of the mi'wachi bless the ushan'ashute with
    life-givers and leave the plaza by the eastern covered way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A'shuwahanona first appears dressed like sho'lipsimonthle'ona with differences
    in plumes and moccasins; he has hawk medicine in his mouth and carries hawk plumes
    in both hands.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 'Hla'hewe choir sings the Shuts'ina yai'na, described as a song of the
    hawk and an invocation that the dancers and singers may not become tired.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two A'wan mosono'kia accompany A'shuwahanona to the plaza, one before him
    and one after him; one later pushes him back so that he dances longer in the center.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: A'shuwahanona dances with violent arm and leg motions, strikes one plume with
    the other, waves plumes over groups, and repeats plume gestures toward the earth.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: At one moment during A'shuwahanona's plume ceremony, all expectorate so that
    they may have good hearts and much strength for the song and dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder brother Bow priest ties a white fluffy eagle plume to each tree
    with cotton cord so the plume may convey breath-prayers to the u'wannami, the
    rain-makers, to water the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A pottery bowl is removed from the coals at dark, and a large fire is lit;
    the legend says a light must be kept so the Corn maidens may be watched and protected.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At earliest dawn, the pe'kwin leads a man of the Frog clan to the hám'pone,
    where the man sits behind the cloud symbol facing east, holds corn, a feathered
    miniature crook, and te'likinawe, and prays for rain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At sunrise, te'likinawe associated with the mi'laiilapo'na and mi'wachi fall
    over in obedience to the Frog clan man's command.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before and after sunrise, groups of 'kia'potiikwe girls are led to the plaza;
    a leader throws a line of meal before her, and each girl carries a hle'we moved
    toward the earth during the dance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The dancers and musicians continue without ceasing from sunrise until 9 o'clock,
    and the dancers must not return until the cloud symbol is bathed in sunlight.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A footnote states that women leaving the hám'pone at night are attended and
    that sleeping during the drama would offend the addressed gods.
  category: other
  evidence_refs:
  - ev:10
