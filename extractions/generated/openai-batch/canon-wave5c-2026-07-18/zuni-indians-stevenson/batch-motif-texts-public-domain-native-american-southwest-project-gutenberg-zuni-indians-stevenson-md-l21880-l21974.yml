canonical_text:
  quote: ''
  summary: A theurgist completes a ritual treatment of a sick girl, after which an
    accused boy is tried before warriors. The girl and her family accuse him of causing
    her trembling by touching her hand. Under pressure, the boy narrates that a Santo
    Domingo Galaxy fraternity director taught him and a companion secret witchcraft
    medicines, including love philters conveyed by hand contact and a counteracting
    root. He describes plume offerings, a sudsy medicine bath, orientation away from
    the sun, and an earlier use of the medicine on two water-bearing maidens who became
    violently disordered and died. The warriors demand proof; roots are produced,
    and the boy prepares sacred meal for a requested manifestation before the passage
    breaks off.
  language: English
  quote_policy: summarized
