  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy says that in Santo Domingo a Galaxy fraternity director asked whether
    he and a companion wanted to learn the secrets of witchcraft, and that they followed
    him at midnight to an inner room.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The director is said to take many medicines from two round hide cases and
    ask what kind of medicine the boys desired.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy says he and his companion chose love philters to captivate girls,
    and the director placed root medicine for each of them in separate bowls.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The director instructs them to bite off a small quantity of root, chew it,
