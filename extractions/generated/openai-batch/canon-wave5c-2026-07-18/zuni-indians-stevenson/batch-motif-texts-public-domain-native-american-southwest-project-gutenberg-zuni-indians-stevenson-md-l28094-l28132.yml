canonical_text:
  quote: ''
  summary: The passage describes plaza and chamber ceremonies involving dances with
    trees, sprinkling meal on trees and an altar, swallowing a tree sword, use of
    medicine water to protect participants' throats, placement of black seeds in each
    mouth, and handling of two small trees and an arrow in time with song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plaza ceremonies are stated to be identical with those described for the
    Sword order, and the ceremony includes three dances with trees in the plaza.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the close of each dance the party returns to the ceremonial chamber; the
    leader places her meal basket near two trees by the hatchway, and participants
    sprinkle the trees with meal before descending.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each participant pulls his tree after him and lays it in the middle of the
    floor with the knife pointing east and the tree's “eyes” looking upward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a rest, the dancers sprinkle meal over the altar and return to the plaza
    to dance and swallow the tree sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the third dance, the trees are returned to an elevated position near
    the ceiling, and swords with feathered handles are used in the closing dance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the final return to the chamber, members take meal in their left hands
    and stand around the room near the wall; the drummer stands west of the fireplace.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Hlem'mosona administers medicine water, giving each person a draft while
    all sing with rattle and drum accompaniment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Hlem'mosona sprays each person's throat with medicine water from his mouth
    so that the larynx may not suffer from sword swallowing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hlem'mosona places one small sweet black seed from a corn husk into each
    person's mouth and returns the husk to the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hlem'mosona brings in two small trees and an arrow from the hatchway,
    stands in the middle of the chamber facing east, moves them up and down in time
    with the song, and passes to each person.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note says that swallowing the sword carved from the trees is dangerous,
    that spectators become enthusiastic, and that only those of wicked heart can be
    injured.
  category: speech
  evidence_refs:
  - ev:7
