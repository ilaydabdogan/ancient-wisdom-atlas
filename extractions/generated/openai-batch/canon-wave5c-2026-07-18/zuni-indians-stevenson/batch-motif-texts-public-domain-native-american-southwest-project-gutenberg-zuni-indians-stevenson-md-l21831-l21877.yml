canonical_text:
  quote: ''
  summary: The passage recounts an ethnographic scene in a house where an accused
    youth is held during a court proceeding in the presence of an afflicted girl.
    Relatives restrain and comfort the patient while a Galaxy-fraternity theurgist
    prepares consecrated water, sacred meal, fetishes, ashes, eagle plumes, and directional
    signs; prays to gods of the six regions for diagnostic and healing power; sprinkles
    and rubs the patient; and performs an extraction-like act at her chest.
  language: English
