canonical_text:
  quote: ''
  summary: The passage describes how the A'shiwi received clan names at Hanlipinkia,
    how names and totems were selected from objects seen at the time, how fraternity
    offices became linked to original clans, how the Dogwood clan first prepared prayer
    plumes, and how Yanowwuluha divided the Dogwood clan through a choice involving
    two eggs that hatched into a raven and a macaw.
  language: English
  quote_policy: summarized
