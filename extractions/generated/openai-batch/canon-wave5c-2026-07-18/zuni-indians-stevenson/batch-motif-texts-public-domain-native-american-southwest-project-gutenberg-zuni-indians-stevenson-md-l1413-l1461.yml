  text: At Hanlipinkia, the A'shiwi received their clan names.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During migrations, the A'shiwi traveled in groups, and the Divine Ones decided
    that the people should be gathered into clans and told each group to take a name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some groups chose names including Dogwood people, Corn people, and Sand-hill
    Crane people; the crane name was selected because the bird was flying by at the
    time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each clan name was chosen from an object seen at the time, and each clan's
