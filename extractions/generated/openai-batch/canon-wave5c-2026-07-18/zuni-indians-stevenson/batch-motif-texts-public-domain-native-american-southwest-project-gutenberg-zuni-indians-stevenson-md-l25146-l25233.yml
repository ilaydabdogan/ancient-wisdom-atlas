canonical_text:
  quote: ''
  summary: 'The passage describes access difficulties faced by the observer in a ceremonial
    house, then gives a detailed account of a Zuni ''Hle''wekwe ceremonial movement
    from chamber to plaza: ritual objects are carried by a maiden and clan girls,
    accompanied by bow-bearing men; prayer plumes are offered for snow; boxes, notched
    sticks, deerleg bones, meal, corn pollen, a spruce twig, and a prepared basket
    are arranged; musicians from a specified kiva play notched sticks under the stated
    control of Beast Gods while the objects and bows are moved in time from dawn until
    sunrise.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The observer occupied the upper story of the ceremonial house; We'wha helped
    detain an old father below and released the observer when he barred her door,
    while the old man warned that the observer would bring calamity to herself and
    the household.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The 'Hlem'mosona placed the 'hle'ettone in the hands of a maiden whose hands
    had been rubbed with sacred meal; the maiden wore ordinary dress, a white embroidered
    blanket, and bare feet and lower limbs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two men, each carrying an archaic bow with arrows in the right hand, accompanied
    the maiden from the ceremonial chamber to the plaza in single file, with the girl
    between them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four girls in ordinary dress with black blankets over their shoulders joined
    the procession, each bearing a mu'et'towe belonging to a specified clan.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: Members of each et'tone-bearer's household and clan, and members of the 'Hle'wekwe
    fraternity, were required to offer four prayer plumes to the et'tone for snows,
    with offerings made to each of the four regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two decorated boxes were placed end to end east of the center of the plaza,
    with six notched sticks on them, each crossed with a deerleg bone.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The a'kwamosi planted a small spruce twig near the southeast corner of the
    larger box, described as symbolic of vegetation, and sprinkled meal over it while
    praying for snows and longevity for his people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A handleless purple wicker basket made by a female member of the 'Hle'wekwe
    was filled with finely ground meal, smoothed into a mound, crossed with corn pollen,
    topped with a white fluffy eagle plume, and deposited under the larger box.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three men from the O'he'wa ki'wi'sine sat west of the boxes on wadded blankets
    and played the notched sticks with deerleg bones.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:10
  text: The music was said to be controlled by the Beast Gods, with the musicians
    serving merely as their agents.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The musicians wore upper leg skins of bear or cougar over their lower arms
    while performing the notched-stick music.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bone movements over the sticks were performed in repeated fourfold patterns
    and rapid back-and-forth motions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The songs were described as the same as those sung in the circle dance in
    the closing scene of the scalp ceremonial, though here their harmony was obscured
    by the grating noise of bones on sticks.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The et'towe and bows and arrows were moved downward in time with the song
    from dawn until sunrise, or until sunlight struck the plaza.
  category: sequence
  evidence_refs:
  - ev:9
