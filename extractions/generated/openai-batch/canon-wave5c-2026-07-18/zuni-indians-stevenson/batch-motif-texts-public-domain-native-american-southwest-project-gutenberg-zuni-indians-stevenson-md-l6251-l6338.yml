candidate_motifs:
- id: motif:1
  label: regenerative treatment of a plucked ritual bird
  taxonomy_refs: []
  basis: The eagle is plucked and then treated with white corn and kaolin; the passage
    explicitly explains corn as promoting plume growth and kaolin as promoting whiteness.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: This is an ethnographic ritual description, not a narrative myth; no broader
    taxonomy ref is assigned.
- id: motif:2
  label: new-year sacred fire and crop-abundance prayers
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The new-year fire-maker collects cedar from every house, donors pray for
    bountiful crops in the coming year, and the collected fuel and coals are used
    for a sacred fire at sunset.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The seasonal and exchange elements are explicit, but the passage does
    not provide a mythic origin narrative for the rite.
- id: motif:3
  label: meal and plume offerings to deity images
  taxonomy_refs:
  - sacred_exchange
  basis: The pe'kwin and Bow priests sprinkle meal on the War God idols and place
    te'likinane in their belts before prayers and procession.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage describes ritual offerings but does not state a reciprocal
    divine response.
- id: motif:4
  label: sacred sound instrument for rain-maker enthusiasm
  taxonomy_refs:
  - seasonal_cycle
  basis: The Bow priests whirl rhombi during offerings, and the note says this instrument
    is whirled among Pueblo tribes to create enthusiasm among rain-makers.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: low
  cautions: The rain-maker function comes from a note about Pueblo usage generally,
    not an explicit statement that rain-makers are present in the described scene.
