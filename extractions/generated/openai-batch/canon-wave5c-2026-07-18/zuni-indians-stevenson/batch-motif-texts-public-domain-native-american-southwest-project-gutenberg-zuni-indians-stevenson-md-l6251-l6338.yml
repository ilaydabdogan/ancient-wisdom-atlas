canonical_text:
  quote: ''
  summary: The passage describes a fourth-day eagle-plucking rite in a shi'wanni household,
    preparation of bread for following feasts, collection of cedar and coals by the
    new-year fire-maker for a sacred fire, the pe'kwin's meal painting and placement
    of plume objects, and midnight offerings to the idols of the Gods of War, including
    meal sprinkling, plume-stick offerings, rhombus whirling, prayers, and the beginning
    of a procession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An eagle kept in a cage is brought into a room under a heavy blanket and held
    on a blanket by men grasping its feet and head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ear of white corn is placed east of the eagle while the eagle's head is
    oriented west.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eagle is plucked, and the removed feathers are deposited in an Apache
    basket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elder daughter washes eagle plumes in water, holds them near the fire
    to dry, and rubs them with powdered kaolin to whiten them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger daughter mixes kaolin with water in a small bowl and places the
    bowl north of the eagle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stepson bites grains from the white corn, takes kaolin mixture into his
    mouth, and a man directs the mixture into the eagle's mouth; the remainder is
    thrown over the eagle and rubbed on places where white plumes should grow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that corn is used so the plumes may grow soon, as corn
    comes up, and kaolin is used so the plumes may be white.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old shi'wanni sits near the fire with piles of plumes and a basket of
    plume sticks, attaches sorted plumes to sticks, breathes on each completed te'likinane,
    and offers a prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After plucking, the eagle is carried under the blanket back to its cage, where
    it remains until another plucking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bread for later feasts is prepared elaborately; shaped light bread is baked
    in ovens on the fourth night before a ten-day ceremonial period restricts oven
    use.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At noon on the fourth day the new-year fire-maker collects a cedar fagot from
    each house, and the person giving wood offers a prayer for bountiful crops in
    the coming year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fire-maker deposits collected wood in the He'iwa ki'wi'sine, entering
    and leaving through the roof hatchway each time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the last wood load, the fire-maker obtains coals from the house directly
    east of the ki'wi'sine, deposits them at the fire altar, arranges wood in a square
    log-cabin form, and the fire is lit at sunset as a sacred fire not to be touched.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At sunset the pe'kwin makes a meal painting at the west end of the ki'wi'sine
    and later places the kia'etchine on the painting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At midnight the idols of the Gods of War are brought to the ki'wi'sine, and
    the pe'kwin sprinkles meal first on the elder idol and then on the younger idol.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The elder and younger Bow priests each place a te'likinane in an idol's belt,
    sprinkle meal on both idols, take positions north and south of the sun priest,
    and whirl rhombi.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: After prayers, a procession begins with the pe'kwin leading and sprinkling
    meal as he proceeds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: A note describes the rhombus as two slender wooden slats attached by a string
    and says that among Pueblo tribes it is whirled to create enthusiasm among rain-makers.
  category: object
  evidence_refs:
  - ev:11
