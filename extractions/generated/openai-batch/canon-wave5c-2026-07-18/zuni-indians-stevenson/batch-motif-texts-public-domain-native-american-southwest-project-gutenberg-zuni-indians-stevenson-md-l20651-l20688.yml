literal_observations:
- id: obs:1
  text: A belief is reported that if a pregnant woman looks at a piece of pottery
    while it is in the process of “tiring” as printed, the pottery will be marred
    with a black spot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Zunis use this belief to account for blemishes caused
    by the smoking of pottery.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Much modern pottery is decorated with animal forms, with an attempt to depict
    them as animals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Birds and animals on ancient ware are described as highly conventionalized,
    so that only the initiated can determine the original motive.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A very old vase is described as decorated with conventionalized butterfly,
    cloud, and rain symbols.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Zuni silversmith is said to prefer the Mexican dollar because of its purity
    over the United States silver dollar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Native silver is said not to be known to the Zunis at the present time, and
    Zuni sages claim their people did not work in silver or copper before the presence
    of the Spaniards.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: With crude implements, the silversmith manufactures ornaments for bridles,
    silver belts and buttons for men, and silver beads, bangles, and rings for women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The silversmith's furnace, bellows, dies, and other workshop items are described
    as home-made except for files and hammers, and the silversmith is also the blacksmith
    and general utility man of the village.
  category: attribute
  evidence_refs:
  - ev:4
