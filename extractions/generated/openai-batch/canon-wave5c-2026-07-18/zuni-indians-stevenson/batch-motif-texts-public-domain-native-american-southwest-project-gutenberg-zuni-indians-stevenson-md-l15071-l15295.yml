canonical_text:
  quote: ''
  summary: The passage describes women and children bringing meal offerings to the
    house of the Ko'yemshi masks; a morning procession of Little Fire fraternity members
    and Ko'yemshi to the Si'aa' te'wita; the Kia'kwemosi forming crosses of meal,
    seating the Ko'yemshi, praying, and marking masks with meal; the placement and
    later planting of te'likinawe; and public offerings of bread, flour, animals,
    and other foods to the retiring Ko'yemshi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women and children of the paternal clans of the Ko'yemshi carry baskets of
    meal to the house where the Ko'yemshi masks are kept and where a feast is to be
    held.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the meal is transferred into a vessel belonging to the woman of the
    house, the bearer takes a pinch from the apex and reserves it to sprinkle upon
    the Ko'yemshi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the Little Fire fraternity, led by a woman of the fraternity, precede
    the Ko'yemshi in file to the Si'aa' te'wita.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi are wrapped in heavy blankets, wear moccasins, carry te'likinawe,
    have rolls of canvas on their backs, and have fawn skins filled with seeds for
    distribution in the ki'wi'sine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The group passes four times around in a circle before the Kia'kwemosi forms
    a cross of meal on the ground; the passage states that the cross is symbolic of
    the four regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kia'kwemosi places his hands on the Great Father Ko'yemshi, motions him
    to the four regions, and seats him on the meal cross; the process is repeated
    for the other Ko'yemshi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kia'kwemosi draws a line of meal upward over each mask and prays; members
    of the Little Fire fraternity sprinkle each mask with meal and leave the plaza.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each Ko'yemshi places his te'likinawe in an opening in front of the ki'wi'sine,
    removes it late at night, and later plants it in an excavation west of the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Kia'kwemosi sprinkles meal on the Ko'yemshi, throws a line of meal up
    the ladder, and leads the Great Father and the other Ko'yemshi into the ceremonial
    chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men and women crowd the plaza with offerings for the retiring Ko'yemshi; women
    first bring corn and wheat flour and light bread, and later men bring dressed
    sheep, watermelons, and other food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At a later point the Ko'yemshi descend to the Si'aa' te'wita, unroll their
    canvases, and deposit bread they have received.
  category: sequence
  evidence_refs:
  - ev:6
