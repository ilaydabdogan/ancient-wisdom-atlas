canonical_text:
  quote: ''
  summary: The passage describes parts of a Zuni fraternity ceremonial, including
    distribution of plumes and ritual notifications, selection of women to hold et'towe,
    preparation for a 1892 initiation of a youth and maiden, gathering and stacking
    wood, careful handling of a dangerous medicine plant, sealing and preparing the
    ceremonial chamber, placement of swords and novice-related offerings, feasting
    obligations, and repeated drinking of medicines, including an emetic used to prepare
    participants for sword reception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plumes are worn attached to the hair from this time until the close of the
    ceremonial as an insignia of office.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: La'showawe are distributed among people selected for choir service, among
    selected Bow priesthood members, and to the 'Hli'u'mosona as notification that
    fraternity swords will be moved to the ceremonial chamber in six days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two women of the fraternity are chosen to hold two et'towe of the 'Hle'wekwe
    in the plaza on the fifth day, and are told that in ten days they shall bear the
    mother et'tone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies the described event as a ceremony in 1892 initiating
    a youth and a maiden.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the first day, each male member brings a burro's pack of wood, which is
    deposited before the house and carried to the roof of the ceremonial chamber for
    stacking, mainly by female members and women of the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wood-stacking time is described as merrymaking, when girls and women may
    play practical jokes on elders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A medicine plant is collected outside the village and not brought to the pueblo
    until the room is prepared, because its infectious qualities are said to be transmitted
    by the plant, by those near it, and by inhaled fumes after uprooting.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before the medicine is prepared, the ceremonial chamber is emptied, the floor
    washed, the walls whitened, and openings into adjoining rooms plastered so that
    fumes cannot enter and harm the uninitiated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fraternity convenes in the evening, the swords are deposited in the ceremonial
    chamber, and the choir sings before the group disbands at midnight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two men acting as fraternity fathers to the novices provide sheep for
    the feast, either from their herds or by purchase.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the following morning, a fraternity father carries a corn-husk-wrapped
    plume and meal package to the ceremonial chamber, sprinkles meal on the west ledge,
    lays the husk on the meal, and places the 'Hlem'mosona's sword beside it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A medicine plant with white blossoms, identified as an emetic, is boiled in
    a dedicated pot under the supervision of two elderly women of the organization.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Each member drinks the warm tea from the boiled medicine plant, vomits into
    a large bowl, and the bowl contents are carried a short distance from the village
    by a female member and emptied.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The emetic medicine is taken on the first four mornings to enlarge the throat
    and prepare the stomach for receiving the sword.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A separate medicine made by boiling a reddish root is drunk hot each evening
    and is regarded as harmless to the uninitiated and useful for stomach trouble
    or headache.
  category: object
  evidence_refs:
  - ev:9
