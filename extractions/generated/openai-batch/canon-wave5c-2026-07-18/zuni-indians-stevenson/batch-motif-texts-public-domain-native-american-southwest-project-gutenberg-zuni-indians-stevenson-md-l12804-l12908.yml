canonical_text:
  quote: ''
  summary: 'The passage describes Mixok ceremonies following the winter solstice:
    appointment and rehearsal of divine personators, preparation of te''likinawe offerings,
    gathering of cottonwood, repetition of ceremonies associated with the pe''kwin,
    deposition of offerings at springs or shrines with meal and precious materials,
    prayer, head-washing, continence, and restricted nighttime observances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Minor ceremonies occur each month after the winter solstice; personators are
    appointed, meet twice monthly to rehearse songs, and deposit te'likinawe at shrines
    in the last quarter of the moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In January the chosen Sa'yatasha visits the house of the new A'wan ta"chu
    Ko'yemshi, and the two remain together until late at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The personator of Sa'yatasha gathers cottonwood at Nutria, and the six personators
    of the Sha'lako also gather cottonwood for their te'likinawe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sa'yatasha carries a small bundle of cottonwood to the house where the Ko'yemshi
    masks are kept and where the Great Father Ko'yemshi awaits him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Father Ko'yemshi selects nine fellows and asks them to assemble
    at his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those who are to personate the Council of the Gods go to the house of Sa'yatasha,
    who asks Shu'laawi'si whom he has chosen as ceremonial father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shu'laawi'si brings his chosen ceremonial father, holds the te'likinawe given
    by the pe'kwin during winter solstice ceremonies, and repeats with the father
    the ceremony said by the pe'kwin over him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Ko'yemshi assemble at the Great Father Ko'yemshi's house, where he repeats
    with each of his nine fellows the ceremony with his plume offering that the pe'kwin
    held with him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The next morning the groups prepare te'likinawe; most men make four, while
    A'wan ta"chu Ko'yemshi makes three because he already has one from the pe'kwin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Ko'yemshi te'likinawe sticks are black and bear eagle plumes and feathers
    from birds of the six regions; the Council of the Gods sticks are black except
    for Sa'yatasha's yellow stick from the pe'kwin and bear turkey plumes, an eagle
    plume, and feathers of birds of the six regions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The completed offerings are placed in basket trays, and each man's head is
    washed at home by his wife or another female family member.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: At U'hana 'kianakwi, Moss spring, Sa'yatasha digs an excavation with an ancient
    corn planter and sprinkles in meal combined with turquoise, white shell beads,
    and abalone shell.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Each man deposits his te'likinawe in the excavation, sprinkles them with meal,
    and prays; Sa'yatasha then covers the excavation with earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Continence is required for four following days, and the personators spend
    nights until midnight in assigned houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Ko'yemshi deposit their te'likinawe in an excavation by a spring where
    many concretion fetishes are present.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: The February spring is described as a retired spot south of Zuni; an elder
    brother Bow priest states that no non-member of the Ko'tikili had previously visited
    it.
  category: speech
  evidence_refs:
  - ev:7
