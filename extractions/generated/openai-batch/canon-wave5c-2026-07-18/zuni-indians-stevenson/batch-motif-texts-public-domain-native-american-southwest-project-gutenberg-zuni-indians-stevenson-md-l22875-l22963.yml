canonical_text:
  quote: ''
  summary: 'The passage describes the secret disassembly and reconstruction of a sacred
    mi''li or mi''wachi: an ear of corn containing seeds, sealed with earth paste,
    set in a buckskin cup, clothed with cotton, adorned with plumes, and accompanied
    by prayer. Several elements are explicitly described as symbolizing the four regions,
    the four quarters, and aspects of the Corn Mother.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual specialist was persuaded to take apart and reconstruct two mi'li
    or mi'wachi, observing secrecy during the work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The specialist used blackish earth said to have come from the undermost world,
    together with piñon gum and yucca fruit cement, to close a cavity in the corn
    cob after replacing seeds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before working, the specialist removed his head-kerchief and moccasins and
    prayed silently to A'wonawil'ona and the Beast Gods that he not be punished for
    desecrating the sacred mi'wachi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that preparing a mi'li without the appropriate ceremony
    is sacrilege, and says the specialist shed tears while taking apart and repairing
    the objects.
  category: attribute
  evidence_refs:
  - ev:1
