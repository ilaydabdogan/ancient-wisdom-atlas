  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mu'waiye advance in coordinated time and are followed by choir members,
    a drummer, and a choir of about 100 men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The et'towe and 'hla'we bearers circle the boxes four times, and the persons
