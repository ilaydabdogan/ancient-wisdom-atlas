  summary: The passage describes plate captions and a ritual sequence involving Mu'waiye
    dancers, choirs, fetish bearers, et'towe, ancient 'hla'we, 'hlu'sipowe, meal,
    corn pollen, feather plumes, fourfold circling, prayers, purification, and deposition
    of ritual objects in a Badger clan house.
  language: English with untranslated Zuni terms
  quote_policy: summarized
