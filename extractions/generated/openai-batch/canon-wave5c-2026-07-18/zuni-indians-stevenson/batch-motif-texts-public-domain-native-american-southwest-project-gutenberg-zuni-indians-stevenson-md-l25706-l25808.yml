  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a Badger clan house, four aged women receive the et'towe; the et'towe are
    placed in meal-filled flat baskets in a north-south line, and ancient 'hla'we
    are laid across the baskets with tips pointing east.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mu'chailiha'nona and each fetish bearer carry meal in the left hand four times
    around the head and sprinkle it over the et'towe; meal is then taken in the right
    hand and sprinkled over the fetishes with a prayer for rains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The 'hlu'sipone is described as made like the ancient 'hla'we, with white-painted
    stems, white duck feathers, and seeds wrapped in cotton at the ends.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Mu'waiye complete the fourth circuit, spectators line the streets,
    and the dancers continue by a specified route to the house where the et'towe are
    deposited.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When each girl is relieved of her 'hlu'sipone, it is placed with an ancient
    'hla'we; both are passed before her lips while she inhales all that is good from
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: An old woman removes feather ornaments from the hair of each Mu'waiye and
    ties them to the ancient 'hla'we associated with her 'hlu'sipowe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Mu'waiye and choir use meal from the meal basket in the left hand, carry
