canonical_text:
  quote: ''
  summary: 'The passage describes a Sha''liiko/Sha''lako ceremonial sequence: excavations
    are made after the Sha''liiko take positions; personators and named ceremonial
    figures deposit te''likinawe or te''likinane offerings in numbered excavations
    and sprinkle meal; the Council of the Gods processes, is sprinkled with prayer
    meal, deposits offerings near a cornfield, and removes masks and paraphernalia;
    Sha''lako personators with effigies run to excavations and make offerings to directional
    Sha''lako.'
  language: English
  quote_policy: summarized
