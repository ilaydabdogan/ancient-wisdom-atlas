canonical_text:
  quote: ''
  summary: 'The passage describes ritualized preparation and early procedures for
    a Zuni game: eating before a fast during play, face-greasing and hematite application,
    placement of game implements in the plaza, consultation with the rain priest''s
    gaming ball as an omen, a black-or-white disk choice, burial of plants and precious
    offerings beneath the playing area, and silent prayers or songs addressed to crow,
    owl, and the Gods of War.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Players, watchers, and the rat man are told to eat before the game because
    they must not eat or drink while the game is played.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four players and four watchers gather near the fireplace and apply bear or
    cougar grease around the eyes, then place red hematite over the grease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The leader and his party take the west side of the plaza, while the opposing
    players sit on the east side near the old Spanish church.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The game is deposited on the west side of the plaza with cup openings toward
    the east, and the stone disk, ball, and straw counters are placed on the cups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first leader visits the rain priest to retrieve a gaming ball left on
    lines of meal; its movement to particular lines is read as indicating victory
    or uncertainty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leader lifts the stone beside the rain priest, draws a breath from it,
    puts it inside his shirt, says good-bye, and returns to the plaza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A watcher asks the opposing head player to choose the black or white side
    of the stone disk, then throws the disk up; the exposed side determines which
    party receives the game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the first leader keeps the game, he gives one cup to each of three players
    and keeps one; the four players face the cardinal points.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The four players sit by a sand pile under a large blanket, and a hole is dug
    where the sand had been; a bunch of plants is placed in the excavation with its
    tops level with the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each player makes a small excavation before him and deposits a small corn-husk
    package of precious offerings, including a la'showanne.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The leader buries an ancient ko'hakwa bead, a valuable piece of fine turquoise,
    and a black stone bead in separate holes near his position; the ko'hakwa and turquoise
    are required to stand upright.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each player holds his cup to his mouth and offers a silent prayer; the explanation
    says, "We sing with our hearts, not with our lips."
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The songs are addressed to crow and owl, with explanations that crow can hide
    corn in the mountains and find it later, and owl can carry a ball hidden in its
    claw.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Songs are also addressed to the Gods of War.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the songs, the leader rubs together the ball from the rain priest and
    the ball of the game, draws a breath from the two balls, returns one ball to his
    breast, and places the other in the game procedure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A note states that some Zuni balls are claimed to be marked with an owl's
    foot because the owl had stolen and hidden a ball in its claws at Hiin'lipinkia.
  category: other
  evidence_refs:
  - ev:8
