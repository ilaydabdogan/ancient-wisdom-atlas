canonical_text:
  quote: ''
  summary: The passage describes synchronized ceremonials of the 'Hle'wekwe and the
    Sword order of the Great Fire fraternity, including a regalia procession, a dance
    with sword swallowing, the carrying and placement of the 'hle'et'tone sacred fetish
    on meal, an inventory of ritual objects shown in an illustration, and the preparation,
    prayer, and planned spring deposit of a bundled prayer-plume offering called a
    kia'etchine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonials of the 'Hle'wekwe and of the Sword order of the Great Fire
    fraternity are described as synchronous and combined in elaborate dances.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An hour before sunset on the third day, five members of the Great Fire fraternity
    in regalia precede a warrior of the 'Hle'wekwe to the chamber of the 'Hle'wekwe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the chamber, the participants dance and swallow swords.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the dance, 'Hle'wekwe visitors return bearing prayer plumes and ha'kwawe
    that they have made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hlem'mosona carries the 'hle'et'tone in a flat basket partially filled
    with meal, along with two stone fetishes and two ancient small bows and arrows,
    to the chamber of the 'Hle'wekwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The 'Hlem'mosona sprinkles meal with his right hand while moving from one
    house to the other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the ceremonial chamber, the 'Hlem'mosona places the sacred fetish on a
    thick bed of meal on the west ledge under the wall decoration.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ritual group shown in the illustration includes the et'tone, corn husks
    with fluffy eagle plumes, skins of bears' feet, feather objects, ancient bows
    and arrows, stone fetishes, medicine bowls, a prayermeal basket, water vessels,
    and a vase of popcorn water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Since 1902, the 'Hle'wekwe have added a tablet altar similar to those used
    by other fraternities to the ritual group.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each person wraps his own prayer plumes together, after which the 'Hlem'mosona
    groups them with the offering of the Shi'wanni of the West into a kia'etchine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ha'kwawe are wrapped around the base of the kia'etchine and held by a
    cotton cord.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The kia'etchine is sprinkled with meal and prayed over by all members of the
    fraternity before being carried toward a spring for deposit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note says the 'hle'et'tone is covered with native cloth, has an ear of corn
    placed on it, and is covered or obscured by prayer plumes, bead necklaces, white
    cloth, and te'likinawe.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A note defines the kia'etchine as a number of prayer plumes wrapped together
    at the base.
  category: object
  evidence_refs:
  - ev:10
