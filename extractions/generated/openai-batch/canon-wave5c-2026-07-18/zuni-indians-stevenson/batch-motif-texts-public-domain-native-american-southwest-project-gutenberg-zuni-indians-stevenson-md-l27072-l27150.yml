canonical_text:
  quote: ''
  summary: The passage describes a night healing and ritual performance in which male
    and female theurgists treat patients by sucking, using crystal and eagle plumes,
    and displaying objects said to have been extracted from illness. Extracted materials
    are deposited before an altar, in a bowl, or into fire; meal is sprinkled outside
    with prayer. Some theurgists wear bear foot skins and personate animals. Later,
    novices stand behind fraternity parents, move in formation with eagle plumes,
    and receive consecrated water from a shell administered by the a'kwamosi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five male and two female theurgists begin working on patients, and the number
    on the floor grows to about twenty.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Theurgists suck at patients, sometimes with four theurgists working on one
    man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Objects such as pebbles, yarn, and a large stone are presented as extracted
    from the writer's forehead or by a Sia guest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sleeping during the performance is described as disrespectful to the Beast
    Gods, except for young infants.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At times the theurgists dance in groups or in parallel lines, facing south
    and north while moving from west to east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Little Fire fraternity theurgist and three followers use a crystal, eagle
    plumes, trembling motions, sucking, and body distortions in attempts to locate
    and remove disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stones, bits of old cloth, yarn, and strings are displayed as extracted material;
    male theurgists show the material and make an exclamation.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Extracted material is usually placed in a large bowl before the altar, but
    the first extracted material is usually thrown into the fire; the theurgist then
    takes meal and leaves to sprinkle it outside with prayer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some theurgists wear bear-foot skins on one or both hands, throw their bodies
    forward, growl, wrangle, and appear like the animals they personate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At about half past 3 the healing performance pauses, and novices line up behind
    fraternity parents who extend eagle plumes over their shoulders.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife or sister of the fraternity parent stands behind the novice with
    hands on the novice's shoulders during the movement.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The novices receive consecrated water from the a'kwamosi, administered from
    a shell.
  category: action
  evidence_refs:
  - ev:9
