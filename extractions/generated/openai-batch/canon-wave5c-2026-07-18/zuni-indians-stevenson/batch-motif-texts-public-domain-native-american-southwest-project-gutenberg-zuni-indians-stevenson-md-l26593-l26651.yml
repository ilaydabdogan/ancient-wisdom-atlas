canonical_text:
  quote: ''
  summary: The passage describes preparation and first-night arrangement of the altar
    of Ma'ke 'Hlan'nakwe, translated as the Great Fire Fraternity. Participants grind
    pigments, prepare prayer plumes, complete a sand painting with a square and raincloud
    imagery, place fetishes before the altar, deposit food before the altar, return
    for the evening, bring ritual objects, arrange themselves by gender and role,
    prepare invalids and novices, paint body parts white, and seat named functionaries
    around the altar.
  language: English with Zuni terms
  quote_policy: summarized
