canonical_text:
  quote: ''
  summary: 'The passage describes observed childbirth and postpartum care: bathing
    with prepared water, wrapping and cradling an infant in a turquoise-adorned cradle,
    maternal recovery, care for an unmarried young mother, and transport and treatment
    of a severely injured young mother after childbirth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A doctress placed a bowl of juniper water containing yucca suds near a sand
    heap and bathed the young mother by pouring water over her with a gourd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first young mother remained clothed during the bath, was not dried with
    a cloth afterward, changed garments, wrapped herself in a heavy blanket, and sat
    near the room’s warm area after walking barefoot on a cold stone floor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A grandfather attached buckskin thongs and loops to a new cradle given by
    the paternal uncle Mauretio; the cradle had one round turquoise where the infant’s
    head would rest and three turquoises below near the neck rest.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the cradle was completed, the child was strapped to it with cloth and
    blanket wrappings tied in two places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first young mother’s pulse is reported as steady, she was later sitting
    up and sewing, and the infant took the mother’s milk for the first time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An unmarried sixteen-year-old mother received the same attentions as if the
    child had been born in wedlock, and the writer did not observe a ceremonial difference
    because of illegitimate birth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The unmarried girl’s relatives were tender with her while regretting her conduct,
    and her brother, identified as an associate shi'wanni or rain priest, acted kindly
    toward her and was pleased with the infant.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another case, an eighteen-year-old first-time mother’s infant was strangled
    by the umbilical cord at birth, and her father and Nai'uchi brought her to Zuni
    through a severe rainstorm in a covered wagon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nai'uchi examined the injured young mother, removed diseased tissue, and the
    writer had the injured parts bathed with a diluted carbolic acid solution while
    urging use of fresh aseptic gauze instead of a filthy cloth.
  category: action
  evidence_refs:
  - ev:5
