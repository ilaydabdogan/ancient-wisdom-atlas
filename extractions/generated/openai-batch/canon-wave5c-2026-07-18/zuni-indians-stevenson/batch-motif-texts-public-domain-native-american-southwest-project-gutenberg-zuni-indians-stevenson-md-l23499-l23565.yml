  text: On the evening of October 28, the woman narrator was passing the ceremonial
    chamber and noticed a half circle of white meal before the entrance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many Indians protested against her entering, but she passed through the doorway
    before their cries and threats could be heard inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity members looked up from their meal in surprise, then made the
    visitor welcome and invited her to sit and eat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: An elaborately decorated tablet altar stood at the west end of the room, and
    a bar representing the Galaxy extended above it across the room with two figures
    of Pa'yatamu standing on it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Galaxy bar included cloud symbols, seven stars representing Ursa Major,
