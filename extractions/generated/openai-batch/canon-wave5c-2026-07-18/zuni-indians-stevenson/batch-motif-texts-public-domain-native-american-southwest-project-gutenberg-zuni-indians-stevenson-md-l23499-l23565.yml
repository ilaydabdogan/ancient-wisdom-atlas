canonical_text:
  quote: the animal was converted into stone at the time when the great fire spread
    over the earth
  summary: A woman enters the Ne'wekwe ceremonial chamber despite protests, is welcomed
    to a meal, observes a decorated altar and Galaxy bar with celestial, bird, cloud,
    plume, and animal elements, sees a large stone animal fetish accidentally exposed
    before the altar, and later learns that it is regarded as the great father of
    Mystery medicine and was said to have become stone during a great fire over the
    earth.
  language: English
  quote_policy: quoted
literal_observations:
