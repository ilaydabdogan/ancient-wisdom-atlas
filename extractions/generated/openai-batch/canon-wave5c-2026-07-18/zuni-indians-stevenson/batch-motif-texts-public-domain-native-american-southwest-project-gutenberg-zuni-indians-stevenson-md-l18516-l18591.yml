canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparations for a game: prayers for success,
    rain, crops, food, livestock, and long life; preparation and application of te''nas''sali
    with water; watchers sent to a shrine and to an outdoor offering place; omens
    interpreted from lights, sounds, and animals; offerings sent to a rat man; and
    a visit to a rain priest who sings to rain priests of the four regions.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The leader's prayer addresses Gods of War, rain-makers, the sun, moon, stars,
    and A'wonawil'ona for game success, long life, bad luck for the other side, rain,
    crops, food, horses, and sheep.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A buckskin sack of te'na'sali is opened; water from a gourd is placed in a
    corn husk and mixed with powdered plant using the tip of banded gypsum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If present, a rain priest dips a stone into the mixture and applies it to
    the leader's ears and across the face under the eyes; the leader repeats the act
    with the rain priest and others.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that placing te'na'sali in the ear and under the eyes is
    to ensure seeing and hearing unusual or mysterious things and sounds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a still interval, the leader gives a corn-husk package containing a
    cigarette to the first watcher, who is instructed to visit the most eastern shrine
    of the elder God of War and ask him to come.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the shrine, the watcher deposits offerings, prays to A'hayuta to come to
    the plaza for the next day's game, sprinkles a line of meal as a road for the
    god, and tells A'hayuta to wait until the next day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The other three watchers travel together to a chosen cardinal point, carry
    corn-husk packages, make an arm-deep excavation about two miles from the village,
    deposit offerings, and pray to deceased i'vankolo'we players for game success,
    rain, and good things.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The watchers cover the excavation, sit and listen, then repeat the listening
    at farther points four times; they are told not to turn around or look back if
    they hear steps or sense something unusual.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A moving star, lightning, mysterious fire, or bright light on the earth indicates
    that the watcher's side will win; an owl or coyote indicates the other side will
    win; a summer bird indicates success for the watcher's side; a mocking bird or
    snow bird indicates trouble or possible fighting and injury with the game ball.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The leader distributes corn-husk packages and wafer bread to three other players,
    carries the te'na'sali sack and cigarette, and sends another package to the rat
    man for help collecting straws to win counters in the game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The leader and three associates visit the rain priest's house, remove moccasins
    and head-kerchiefs, deposit wafer bread and husk packages in a basket tray, and
    return the te'na'sali sack to the rain priest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The rain priest sings four songs to named rain priests of the four regions,
    asking for rain, seeds, good things, long life, and sleeping to awake in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:8
