canonical_text:
  quote: ''
  summary: An introductory ethnographic narrative describes the expedition's visit
    to the Pecos ruin, observations about water-storage structures, travel to Zuni,
    cooperation and resistance among Zuni officials and populace, collection of ceremonial
    and church objects, and logistical aid used to transport the collection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party visited the ruined pueblo of Pecos, where an old church, interior
    carvings, and a chamber wall bearing a colored hand-and-arm impression were observed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some circular wall remains near Pecos had been described as estufas or fire
    houses, but the passage reports that they were probably reservoirs for storing
    snow during droughts.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Laguna people used similar stores of snow and that
    Laguna women wore a path into sandstone while carrying water from distant springs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The journey to Zuni depended on transportation and other assistance from military
    officers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Along the old Fort Wingate road, walls, stone implements, and pottery fragments
    were found as evidence of former settlement.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Zuni, native priests and other officials welcomed the party; after a council
    and explanation of the visit, they promised aid.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Six months were spent studying religion and sociology, surveying, taking photographs,
    and collecting ceremonial objects, fetishes, stone implements, fabrics, foodstuffs,
    and pottery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two saint images and portions of an old Catholic altar were in Mauritio's
    custody; a council of religious and civil officers decided that the objects could
    go to the National Museum in Washington for preservation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Priests and high officials favored photographing ceremonials, while the populace
    opposed having masks and rituals carried away on paper.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Because of popular opposition, few ceremonial camera pictures were made, and
    altars and masks were sketched in color without the people's knowledge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage describes the resulting assemblage as a large and valuable collection,
    especially of fetishes and sacred vessels.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: When transport was inadequate and military resources were limited by the Ute
    war, General Buell assigned wagons to hasten the collection's movement to the
    railroad.
  category: sequence
  evidence_refs:
  - ev:10
