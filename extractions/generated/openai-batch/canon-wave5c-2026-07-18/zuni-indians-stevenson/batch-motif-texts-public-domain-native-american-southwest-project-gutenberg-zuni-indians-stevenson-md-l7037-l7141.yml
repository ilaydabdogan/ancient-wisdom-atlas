canonical_text:
  quote: ''
  summary: 'The passage describes timed ritual actions around the tenth and fourteenth
    days: a night visitor marks a hatchway with meal to signal the close of a fast;
    ritual officials and fraternities prepare plume offerings; selected men collect
    spring water with jugs, meal, and rhombi; water is poured into medicine bowls
    with prayers for rain, seeds, lightning, thunder, age, and eventual awakening
    in Ko''thluwala''wa; officials decide future god personations and house blessings;
    and a distinct meal painting and fire altar are used.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the tenth day, the dance director of each ki'wi'sine waits with associates
    for the midnight arrival of the Kom'ha'likwi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kom'ha'likwi avoids light and public view, ascends to the roof, throws
    meal through the hatchway, marks four meal lines on its crossbar, and leaves by
    the western road.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four meal lines indicate that after four days ashes may be carried outside
    or the fast closes; one line is rubbed off each day by the dance director.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the fourteenth day, named ritual officials prepare te'likinawe for the
    Council of the Gods, six Sha'lako, four Sa'ya'hlia, and Bi'^si'si, with additional
    quadrennial offerings to 'Kiaklo and the Kla'nakwe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Fire fraternity is assembled in the ki'wi'sine, and its director
    sends two members to collect water from 'Kla'ftanaknana spring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A gourd water jug is covered with cotton cord netting and has four fluffy
    white eagle plumes attached.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: One water collector carries meal and throws it before him while proceeding
    to the spring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The second Great Fire fraternity water collector carries four te'likinawe
    and whirls a rhombus while following the first man to the spring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the spring, the te'likinawe are deposited and the jug is filled with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Ko'mosona selects a man of the Deer clan and a man of the Corn clan to
    visit 'Kiap'kwena spring; the Deer clan man leads.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Deer clan and Corn clan men each carry a similar jug, five te'likinawe,
    and a rhombus; the offerings are for the Council of the Gods and, for the Corn
    clan man, also the Sha'lako.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: If the Deer clan and Corn clan men become weary, they sprinkle meal before
    them with a prayer to the Council of the Gods for strength of heart and limb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After returning, water from the jugs is poured into medicine bowls with prayers
    requesting water, seeds, rains, lightning, thunder, and white-haired old age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage explains an unspoken wish to be happy with the fruits of the earth,
    live to old age, sleep rather than die, and awake in Ko'thluwala'wa, the abiding
    place of the Council of the Gods.
  category: other
  evidence_refs:
  - ev:5
- id: obs:15
  text: On the fourteenth day, ritual officials consult about who will personate certain
    gods and who will entertain the Council of the Gods and Sha'liiko in the coming
    autumn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The privilege of entertaining is sought by men wishing to build or renovate
    homes, and eight new houses are always to be blessed by the gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: Before sunset on the fourteenth day, the Ko'pekwin makes a meal painting distinct
    from the cloud-symbolic painting of the fourth day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The former meal painting belongs to the Gods of War and must appear only in
    connection with them, while the latter is used in reference to the Kok'ko.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:19
  text: A large fire burns on the fire altar day and night during the fourteenth day.
  category: setting
  evidence_refs:
  - ev:7
