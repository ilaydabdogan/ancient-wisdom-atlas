canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Zuni Great Fire Fraternity ceremony:
    directional sprinkling, prayer, meal offerings, medicine water, altar preparation,
    body painting, the presence of Beast Gods in theurgists, dances before the altar,
    fire handling by a Sia Fire fraternity guest, healing of the sick, and a delayed
    third night caused by objections to flash photography.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After ashes are sprinkled to the six regions, people stand and pray aloud
    except those described as really ill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members gather near the altar to sprinkle meal and receive medicine water
    from the a'kwamosi; women later return home, while men remain in the ceremonial
    chamber and make prayer plumes and mi'wachi for novices the next morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the second night, most men have white zigzag body markings described as
    symbolic of lightning and wear yucca ribbon wreaths; female theurgists wear conventional
    dress, red eagle plumes, and white paint on parts of their limbs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The altar and floor before it are white with meal, and a meal line crossed
    four times extends from the altar to the ladder.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Beast Gods are said to pass over the meal line to be present in the bodies
    of the theurgists, while animal fetishes by the altar influence their spiritual
    presence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After water is consecrated, a warrior dances before the altar with eagle-wing
    plumes, dips the plumes in medicine water, and sprinkles the altar and the six
    regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Theurgists dance wildly before the altar, dash about, and growl like the beasts
    they represent; two female theurgists join them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The warrior whirls a suspended cloud cluster surmounted by A'chiyala'topa
    so that clouds may gather over Zuni, and he also sprinkles the altar, choir, and
    women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Sia guest belonging to the Fire fraternity stamps in the fire, bathes himself
    in live coals, rubs a coal on his throat and breast, and places it in his mouth;
    others of the Fire fraternity also handle coals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: As the night wanes, the dance becomes louder, wilder, and faster; women participate,
    mothers move infants' fists in time with the music, formations break, and dancers
    heal sick people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The a'kwamosi stands by the altar keeping time with plumes and later gives
    medicine water to Sia guests and to members, who sprinkle the altar with meal
    before the women leave with babies and the men remain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the third night, the ceremony is delayed by attempts to make flash-light
    pictures; the fraternity objects, and officers prevent interference.
  category: sequence
  evidence_refs:
  - ev:9
