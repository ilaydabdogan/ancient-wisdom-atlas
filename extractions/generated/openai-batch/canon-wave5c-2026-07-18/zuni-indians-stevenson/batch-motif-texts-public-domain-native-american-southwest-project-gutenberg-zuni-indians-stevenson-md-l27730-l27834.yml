canonical_text:
  quote: ''
  summary: The passage describes a Zuni ritual sequence involving an Arrow order novice,
    arrow swallowing, processions and dances around an altar and the boxes of the
    'Hle'wekwe, later sword swallowing including a serpentiform sword, participation
    by women of the Sword order, prayer to named beings for cold rains and snows,
    and a concluding circle dance with music, rattles, and swords.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After arrows are distributed, the 'Hlem'mosona stands near the east wall,
    the novice moves to the middle of the floor facing east, and the drummer stands
    near the south wall west of the fireplace.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The participants dance once in an ellipse around the altar and return to their
    places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'Hlem'mosona swallows an arrow facing east; others repeat the act, and
    the novice makes four unsuccessful efforts to swallow the arrow after the fraternity
    father moves an arrow before the novice's shoulders, mouth, and head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party goes to the Si'aa' te'wita, with the drummer preceding; the leader
    carries a meal basket and po'nepovanne and sprinkles meal, while each dancer carries
    bows, arrows, an arrow to swallow, and a rattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boxes of the 'Hle'wekwe are encircled four times before shouting, arrow
    waving over the boxes, and arrow swallowing facing east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Arrows and swords are held horizontally to the mouth with the head erect,
    then pushed down the throat as the head is gradually moved backward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One man first fails to swallow his arrow, waves it over the boxes, and then
    succeeds; groups of two face cardinal points while swallowing arrows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The arrow dance is repeated three times in the plaza, with retirement to the
    ceremonial chamber after each dance; after the third dance, arrows are received
    and swords are issued.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the sword sequence, the 'Hlem'mosona prays before the boxes, swallows
    a sword with two others, and later prays and swallows a serpentiform sword.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a later dance, the Arrow order is joined by women of the Sword order, a
    warrior of the 'Hle'wekwe appears with the 'Hlem'mosona, and the sword swallowing
    is arranged by groups facing different cardinal directions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the close, the 'Hlem'mosona collects the swords while holding prayer plumes
    and prays that A'uhiyala'topa and the Beast Gods will intercede with the rain-makers
    for cold rains and snows.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the prayer, participants form a broken circle, musicians play notched
    sticks and sing, the drummer stands north of the plaza, and dancers shake rattles,
    sing, and jump toward the center holding swords.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note states that the arrows are not individual property but belong to the
    order and vary in size and form.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note states that the Great Fire fraternity has a po'nepovanne similar to
    the one of the 'Hle'wekwe.
  category: relationship
  evidence_refs:
  - ev:11
