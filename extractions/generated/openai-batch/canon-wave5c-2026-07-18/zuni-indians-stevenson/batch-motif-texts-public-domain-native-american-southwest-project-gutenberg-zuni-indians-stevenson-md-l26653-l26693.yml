- id: obs:1
  text: After assembly, three fraternity parents distribute meal from corn husks to
    each person, who receives it in the left palm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male members, followed by women, sprinkle meal over the altar and fetishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The si'kwamosi makes a cross of meal on the stone floor near the altar; the
    cross is stated to be symbolic of the four regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The medicine bowl is placed in the center of the meal cross, with prey-god
    fetishes at the points and additional fetishes for Zenith and Nadir beside the
    eastern tip.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A song begins with rattle accompaniment; a woman sets a vase of water by the
    a'kwamosi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The a'kwamosi raises the medicine bowl six times and prays to the Beast Gods
    of the six regions while a warrior beats time with eaglewing plumes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the medicine bowl is returned to the cross, the drum is struck, water
    is dipped from the vase, and the warrior whirls a rhombus to call clouds to gather
    quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Water is dipped six times and held over the medicine bowl while prayers are
    offered to the appropriate Beast God; six fetishes are dropped separately into
    the bowl, and meal is sprinkled into the water to complete the consecration.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The a'kwamosi dips eagle plumes into the consecrated water and sprinkles the
