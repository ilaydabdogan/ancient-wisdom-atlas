canonical_text:
  quote: ''
  summary: 'The passage describes a ritual sequence at an altar: meal is distributed
    and sprinkled; a meal cross representing the regions is made with a medicine bowl
    and fetishes; water is consecrated with prayers to Beast Gods of the six regions,
    rattles, drum, eagle plumes, and a rhombus calling clouds; food is carried to
    the river for the Beast Gods; and ashes from the fireplace are cast toward six
    directions for physical purification.'
  language: English
  quote_policy: summarized
