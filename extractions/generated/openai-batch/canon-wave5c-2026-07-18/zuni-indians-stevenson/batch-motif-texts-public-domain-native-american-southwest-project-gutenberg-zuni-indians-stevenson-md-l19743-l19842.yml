canonical_text:
  quote: The salt is not only necessary to their physical comfort, but it has a sacred
    value to them beyond price.
  summary: The passage describes the return of Zuni salt-gatherers, the reception
    and household handling of salt, ritual placement of named corn ears and salt crystals,
    prayer-meal sprinkling, rubbing infants and adults with salt, bathing the gatherers,
    and later appearances of Ma'lokat'si, Ko'hakwa, the Sun, and the Morning and Evening
    stars with their masks and directional movements.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When the salt-gatherers come near home, they make signal fires, and villagers
    begin watching for their return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several fires are lighted nearer the village before the salt-gatherers' voices
    and song are heard; the party is warmly greeted, especially by religious and civil
    officers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pedestrians carry two ears of corn called Father Corn and Mother Corn, covered
    with mud from the salt lake, together with a slab of salt crystal in baskets;
    other members manage burros laden with sacks of salt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each salt-gatherer goes to his own door; salt is unloaded and conveyed into
    houses, and the passage states that salt has both physical and sacred value.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the elder brother Bow priest's house, salt is deposited on canvas, formed
    into an oval mound with a lengthwise depression, and a salt slab and named ears
    of corn are placed in the center area with tips pointing east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The daughter of the house covers the corn and part of the salt with a woman's
    woven wrap, removes it while those present pray, and all present sprinkle the
    sacred objects with meal from a prayer-meal basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Infants in houses where salt has been brought are carried to salt heaps; mothers
    spit upon their limbs and rub them with salt so the children may be strong, and
    adults rub salt on their own hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each salt-gatherer's head is washed in yucca suds and his body is bathed by
    a female family member; later the salt is stored in jars and the corn ears are
    placed with stacked corn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ma'lokat'si appears in Zuni with Ko'hakwa, the Sun, and the Sun's two heralds,
    identified as the Morning and Evening stars.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ma'lokat'si is described as sister to the Sun Father, while Ko'hakwa is described
    as Mother of the Sun, with a home in the great waters of the West; a note cautions
    that this expression should not be taken to mean that the Sun was born of Ko'hakwa.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
