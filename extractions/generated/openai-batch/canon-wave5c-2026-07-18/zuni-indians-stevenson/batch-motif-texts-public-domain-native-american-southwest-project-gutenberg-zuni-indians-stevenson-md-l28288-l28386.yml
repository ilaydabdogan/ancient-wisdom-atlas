canonical_text:
  quote: ''
  summary: 'The passage describes part of an initiation/healing ceremonial: an a''kwamosi
    consecrates water with eagle plumes and invocations to animal powers; offerings
    are sent to the Beast Gods; dancers sprinkle the altar and directions; sick attendees
    gather; performers use plumes, ashes, bear claws, and illusion; medicine water,
    prayers, and gifts to novices close the described sequence at daylight.'
  language: English
  quote_policy: summarized
