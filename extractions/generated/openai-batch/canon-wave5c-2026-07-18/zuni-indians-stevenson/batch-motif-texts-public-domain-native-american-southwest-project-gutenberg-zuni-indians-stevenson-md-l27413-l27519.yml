canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Great Fire fraternity ceremonial sequence:
    two small trees are positioned and used in prayer; dancing, sword swallowing,
    and fire handling occur; a square dry painting maps surrounding countries and
    the Zuni center and depicts Na''ke''e and his younger brother; blemishes in the
    painting are read as death omens; dancers draw sacred breath from the trees; prayer
    plumes and meal are deposited at a hidden sacred place associated with Na''ke''e''s
    disappearance into the earth; on the fifth day pollen, figure hearts, corn grains,
    and sand from the painting are collected or deposited; and a novice receives a
    blanket bearing a sun emblem.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two small trees with face marks are kept near the altar and later placed at
    the hatchway, with one identified as pinon on the west side and the other on the
    east side; their face symbols are oriented east.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eight officers stand around the trees while the flutist plays, the warrior
    whirls a rhombus, and the 'Hlem'mosona prays and sprinkles meal on the trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ceremonial sequence includes continuous dancing, sword swallowing, and
    an elaborate display of playing with fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A square dry painting is made on the floor near the altar using yellow sand,
    with its sides measured by hand spans.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dry painting's north, west, south, and east lines are said to symbolize
    the Hopi, Navaho, Mexican, and Rio Grande countries, while a corn-pollen line
    through the center symbolizes the Zuni country as the heart and center of all.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dry painting contains two human figures representing Na'ke'e and his fellow
    or younger brother, with lightning lines, a war pouch mark, corn-pollen heart
    spots, eagle-wing feathers, blue-yarn garter lines, and corn grains on crosses
    indicating stars.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After completion, the dry painting is protected by stones at the corners,
    crossed wood, and a white embroidered blanket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the painting is uncovered at night, a blemish near the pollen line is
    said by the 'Hlem'mosona to predict deaths among his people, while a blemish near
    another line predicts deaths among the people of the country indicated by that
    line.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The two small trees are brought down from the hatchway, drawn before each
    dancer's face with prayer, and each dancer draws a sacred breath from them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At midnight the 'Hlem'mosona deposits prayer plumes and meal in an arm-depth
    excavation with prayers to Na'ke'e, then covers the cavity with stone and earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The plaza spot is described as especially sacred to the Great Fire fraternity
    because Na'ke'e is supposed to have disappeared into the earth there, and sitting
    on nearby ladder or roof locations is prohibited when the fraternity is present.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the fifth day the 'Hlem'mosona collects pollen from the center line, while
    men and women collect pinches from the heart of each figure, which the passage
    calls good medicine for fecundity; corn grains from the painting are also collected
    and planted apart from other corn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After altar objects are removed, meal and sand from the dry painting are gathered
    with eagle plumes into a bowl and the contents are deposited in the river.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A novice sits on a blanket-covered box, receives a blanket gift with a sun
    emblem from the fraternity father, and the fraternity father's wife stands behind
    the novice with both hands on the novice's shoulders.
  category: action
  evidence_refs:
  - ev:11
