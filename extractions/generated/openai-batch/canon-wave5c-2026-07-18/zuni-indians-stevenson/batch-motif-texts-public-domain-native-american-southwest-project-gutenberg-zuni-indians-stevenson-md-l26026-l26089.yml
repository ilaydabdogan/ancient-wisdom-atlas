canonical_text:
  quote: ''
  summary: Ethnographic passage describing post-feast handling of tehl'nawe staves
    by the 'Hle'wekwe/Sword Swallowers, deposition at Gods of War shrines placed at
    cardinal directions, prayer-plume offerings for rain, snow, crops, health, and
    post-initiation rites involving a feast, corn planting, and yucca-suds head washing.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a morning feast, tehl'nawe staves are carried by members associated
    with the A'pi-lshiwanni to their homes and later to shrines of the Gods of War
    at the four cardinal points.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shrines are described as about a mile and a half from Zuni, on elevated
    ground, built of rock, and having east-side openings covered by stone slabs.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The south shrine is described as superior to the others, horseshoe-shaped,
    built of flat stones, with a dome-like top and prayer plumes visible inside when
    the slab is removed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tehl'nawe for the Zenith and Nadir are deposited at the east shrine, and
    staves taller than shrine walls are placed outside against the walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hle'wekwe deposit prayer plumes inside these shrine walls in January
    and February; older plumes remain until moved aside to make room for others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: La'showawe worn by specified A'pi-lshiwanni and Mu'waiye participants are
    made into prayer plumes after closing ceremonies, with paternal parents or brothers
    preparing those for women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some plumes are planted in fields with prayers to rain-maker warriors and
    deceased How priesthood members; others are offered in the field to A'wan 'Si'ta,
    the Great Mother, for rains, fructification, snows, and winter rains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Four days afterward, each fraternity father prepares sheep for a feast for
    his newly initiated child, while household women bake meal and flour and novice
    families prepare meal and gifts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The newly initiated member accompanies the fraternity father east of the village
    and deposits initiation prayer plumes to the rain-makers of the 'Hle'wekwe for
    snow, winter rain, plentiful crops, health, and happiness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Four ears of corn given to novices at initiation are kept until planting time
    and then planted with other corn; after plume planting, the novice's head is bathed
    in yucca suds and a feast is held.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A footnote identifies the rain-maker warriors as lightning-makers who assist
    rain-makers with lightning arrows.
  category: attribute
  evidence_refs:
  - ev:6
