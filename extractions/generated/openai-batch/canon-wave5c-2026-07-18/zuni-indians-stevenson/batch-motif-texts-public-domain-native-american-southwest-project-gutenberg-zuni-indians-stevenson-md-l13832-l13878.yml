canonical_text:
  quote: ''
  summary: The passage describes preparation of a fraternity altar with meal designs,
    mi'wachi, a crossed meal line, a meal basket, and consecrated medicine water before
    the chamber receives the gods. It then describes Sha'liiko effigies, masks, costumes,
    personators, managers, attendants, and the evening movement of six Sha'liiko to
    Hiil'ona kwi, where A'shiwanni pray and sprinkle meal over them before the Sha'liiko
    proceed to a ceremonial ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before sunset, an altar of 'Siin'iakiakwc, identified as the Hunters Fraternity,
    is erected at the west end of a large room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mo'sona of the fraternity prays over a bowl of meal and makes a cloud
    design of meal before the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cloud design is formed with two scallops filled with meal, and a line
    of meal extends from between the scallops.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Six mi'wachi are placed in a line between the two front tablets of the altar.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The meal line is continued down the floor to the ladder and crossed with meal
    eleven times; a meal basket is then placed by the altar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The maker of medicine water consecrates the water, after which the chamber
    is described as ready to receive the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Sha'liiko effigy is a hoop-skirt structure carried by a slender pole and
    includes a triangular opening through which the bearer sees.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A fox skin and a collarette of raven plumes complete the base of the Sha'liiko
    mask.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The personator of the Sha'liiko and his fellow wear specified ceremonial dress,
    including deerskin hoods, layered shirts, kilts, deerskin wraps, a sash, a woman's
    belt, yellow leg paint, blue yarn tassels, and dance moccasins.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: An ancient stone hatchet with handle and a quantity of prayer meal are carried
    in the belt of each Sha'liiko personator and fellow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the gods come to the village in the evening, the effigies are carried
    by Sha'liiko wor'we, or managers, rather than by the personators.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each Sha'liiko effigy is accompanied by a personator, the personator's fellow,
    and other members of the ki'wi'sine to which the personator belongs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Six Sha'liiko with attendants stop at Hiil'ona kwi, identified as Ant place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Ant place, the first body of A'shiwanni meet the Sha'liiko, pray, and sprinkle
    meal over the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the A'shiwanni return to the village, the Sha'liiko run back and forth
    and then proceed to the ceremonial ground on the south bank of the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A note states that the writer was unable to observe the indoor ceremonies
    of the Sha'liiko gods in 1879 because she was housed with the Council of the Gods.
  category: other
  evidence_refs:
  - ev:8
