canonical_text:
  quote: ''
  summary: 'The passage describes Zuni ceremonial rehearsals and rites: a circle dance
    involving girls and young men, distribution of la''showawe, an Achiyala''topa
    dry-color image with arrows and offerings that gives oracles, a roof meal-line
    action, washing, and a medicine-bowl ceremony petitioning for snow and winter
    rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A circle around two boxes is enlarged by adding girls; some require persuasion
    or are forced into place, and youths or young men then join beside chosen girls
    with clasped hands for a dance lasting more than an hour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the dance, girls gather in the northwest corner while young men bring
    them water and chat with them; musicians at the boxes pray by drawing breath from
    a stick and deer-leg bone before leaving the chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'Hle'wekwe repeat the dancing during the last three rehearsal nights,
    and the Sword order of the Great Fire fraternity appears on the fourth and sixth
    nights, with sword-swallowing and fire feats mentioned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth rehearsal night, the a'mosi of the Mu'waiye distribute la'showawe
    received from the sun priest to the Chu'pakwe choir by breathing on each object,
    touching it to the recipient's lips, tying it to hair on the left side of the
    head, and repeating a short prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At daylight on the fifth morning, a man makes a dry-color picture of Achiyala'topa
    on the stone floor before a meal cloud symbol; the arrangement includes a meal
    line, black border, eight arrow points, a stone fetish, a corn-pollen line from
    heart to mouth, and a crystal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the corn-pollen line is symbolic of truth and that
    the crystal symbolizes purity of heart.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the fraternity is absent, the aged man of the Bear clan watches the Achiyala'topa
    figure; he sees arrows move, later finds them closer together with strands of
    hair between them, and receives whispered oracles and disclosures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On this occasion the oracle warns that a proposed railroad would make the
    earth tremble, rouse the et'towe from quiet, anger them, and cause them to prevent
    rains and snows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The 'Hlem'mosona draws a meal line around the roof area over the ceremonial
    chamber, and ancient tehl'nane with accompanying sticks are placed outside the
    meal line on the northeast corner of the roof.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men bathe and later go in couples to the roof to wash from a large gourd of
    water before decorating themselves for the outdoor dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The 'Hlem'mosona places an ancient medicine bowl and gourd jug of spring water
    near the middle of the floor; male members sit on the south side and women on
    the north side.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Holding a sword, the 'Hlem'mosona deposits a'thlashi in the bowl while male
    members sing prayers for snow and winter rains; a song asks the Beast Gods of
    the six regions to intercede with the rain-makers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The 'Hlem'mosona adds pinches of plant medicine to the bowl, pours water from
    the gourd jug six times, places eight eagle plumes across the bowl with tips to
    the east, sprinkles four corn-pollen lines, places the bowl and jug by the cloud
    symbol, and all present drink red-root medicine.
  category: sequence
  evidence_refs:
  - ev:7
