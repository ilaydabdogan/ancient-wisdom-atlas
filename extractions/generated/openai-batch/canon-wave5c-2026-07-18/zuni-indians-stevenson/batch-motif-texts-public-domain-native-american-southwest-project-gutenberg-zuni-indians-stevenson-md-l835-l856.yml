canonical_text:
  quote: '"We are in quest of the Middle place,"'
  summary: The passage describes several peoples separating from or traveling with
    the A'shiwi, the Coconino Pimas following fox tracks to water and settling in
    a canyon, an encounter with a rain priest, and the Mu''kwe encountering A'shiwi
    who say they are seeking the Middle place before the Mu''kwe later migrate and
    settle on mesas.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Two Mexicans, described as man and wife, appeared in this world when the A'shiwi
    arrived and remained with them for some time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Coconino Pimas stayed with the A'shiwi long enough to teach them songs
    that later descended to the Shu'maakwe fraternity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Navahos separated from the others, and the Coconino Pimas were the last
    to leave the vicinity of li'mikianakate'a.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During their journey the Coconino Pimas were very thirsty, could not find
    water, discovered fox tracks, and followed them because they believed the tracks
    would lead to water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fox tracks led the Coconino Pimas into a deep canyon called Coconino,
    where they remained and built permanent homes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some A'shiwi went with the Coconino Pimas to the canyon and became permanently
    separated from their people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Coconinos met a shi'wanni, identified parenthetically as a rain priest,
    of a strange people at the depth of the canyon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Mu''kwe person discovered a village, visited it, and asked the A'shiwi there
    where they came from and where they were going.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The A'shiwi in the village replied that they were in quest of the Middle place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After a time, all the Mu''kwe except the Corn clan moved west and then east.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After many struggles with enemies in valleys and canyons, the Mu''kwe built
