canonical_text:
  quote: ''
  summary: The passage describes a Zuni crop-thanksgiving festival held after harvest,
    organized by the Bow priesthood with participation by other ritual groups. It
    details the preparation and distribution of color-coded tobacco cigarettes tied
    to directions, the summoning of young women for dancing, song composition and
    prayers to the Gods of War, and the gathering of Bow priesthood members with warrior
    wands symbolizing the heart or seat of life. A plate caption also identifies a
    cave shrine of Pa'yatamu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies idols removed from a shrine for photographing and
    names the cave shrine of Pa'yatamu.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The O'wixahai'ye ceremony has no fixed date, depends on the harvest, and occurs
    after crops are gathered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony is described as an annual occurrence of the Bow priesthood, with
    the Ant fraternity also taking part because of its relation to that priesthood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the elder brother Bow priest decides the festival time, he requests
    a meeting of the first body of A'shiwanni with the scalp custodian and deputy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The A'shiwanni assemble in the house of the Priestess of fecundity and each
    makes a reed cigarette filled with native tobacco, painted the color of the assigned
    region, and wrapped in a corn husk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder and younger brother Bow priests make two additional cigarettes and
    give them to the scalp custodian and his deputy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kia'kwemosi collects the cigarettes and tells the scalp custodian to find
    suitable men from each ki'wi'sine to notify people of the festival and select
    girls for the dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The scalp custodian's assistant selects men from the South, East, and Nadir
    ki'wi'siwe, while the scalp custodian selects men from the North, West, and Zenith.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The scalp custodian and assistant keep their cigarettes at home for seven
    nights; on the eighth night they take them to their ki'wi'siwe, light them, and
    all present take a whiff before other cigarettes are distributed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Selected men notify young women to assemble in the south and west ki'wi'siwe;
    the girls gather for four nights and dance, but do not sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Song-makers compose songs for four nights; the adopted songs give thanks for
    the harvest and for respite from the Navaho, and prayers are addressed to the
    Gods of War for the enemy's destruction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Members of the Bow priesthood gather in their ceremonial chamber, bringing
    warrior wands and placing ready wands in an Apache basket with feather ends radiating.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The warrior wand has a slat foundation zigzagged to symbolize lightning, colored
    blue-green, marked with medicine, and covered with eagle plumes and other feathers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Different wands have distinctive bases or attachments, including red or black
    cloth, bird feathers, abalone shell, or crystal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: The wands are usually worn on the top of the head extending backward and are
    said to symbolize the heart or seat of life.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The elder brother Bow priest places a package of commercial tobacco in the
    basket containing the plumes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A'wan 'Si'ta, called Great Mother and mistress of the ceremonial chamber,
    grinds meal for the warriors at a mill at the east end of the room.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: A note states that O'winahui'ye had been annual until after 1896 and was held
    in 1902 for the first time in several years.
  category: sequence
  evidence_refs:
  - ev:10
