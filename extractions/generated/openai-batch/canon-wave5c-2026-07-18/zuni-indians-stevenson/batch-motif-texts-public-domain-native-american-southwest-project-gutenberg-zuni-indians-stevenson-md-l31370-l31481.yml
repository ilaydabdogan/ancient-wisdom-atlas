canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial sequence involving meal-covered
    mounds, a crossed meal-and-yucca pattern interpreted as chaparral cock tracks
    and ant homes, the arrival of a victor and elder brother bearing a divided scalp,
    preparation of scalp pieces with juniper, pigment, and eagle plumes, planting
    of prayer plumes, social smoking, feathered reed cigarettes offered to the Gods
    of War, flint-kindled lighting of cigarettes, preservation of remnants, and a
    public procession to the mounds with song.
  language: English with Zuni terms
  quote_policy: summarized
