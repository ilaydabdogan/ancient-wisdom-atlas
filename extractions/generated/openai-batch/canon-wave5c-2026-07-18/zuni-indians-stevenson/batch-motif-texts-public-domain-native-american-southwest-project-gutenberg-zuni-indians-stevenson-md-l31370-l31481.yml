  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The crossed yucca is stated to indicate tracks of the chaparral cock leading
    to the house of the ant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mounds are stated to symbolize homes of the Gods of War, and the square
