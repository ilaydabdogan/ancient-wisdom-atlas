canonical_text:
  quote: ''
  summary: The passage describes the close of an altar rite with prayers, meal, animal
    fetishes, and dismantling of the altar, then describes a February initiation ceremonial
    of the U'huhukwe with fire play, appearances by anthropic gods, public chases
    and gymnastics, jugglery involving a yucca rope and blue mush, prayers for snow
    to the six regions, and enforcement of attendance by an aged member with a flaming
    brand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men assemble before the altar and pray after light comes through the eastern
    window; women go outside to pray to the Sun Father, then return to sprinkle meal
    on the altar and pray.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kia'kwemosi, rain priest of the North and a member of the U'huhukwe, removes
    animal fetishes from before the altar, blows meal from them, and gathers them
    into his arms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Owners of the mi'wachi collect the fetishes, the altar is bared, and the altar
    is later taken apart and stored for future use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The February ceremonial includes initiation into the Mystery medicine order
    and is described as similar to the prior meeting, with added fire play and more
    jugglery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the third and fourth days, fraternity members appear in the street and
    on housetops with blazing cedar-fiber brands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Three He'hea and six Na'wisho anthropic gods appear; only the He'hea go to
    the U'huhukwe ceremonial house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The He'hea gods have nude bodies covered with white kaolin, lines drawn through
    the paint, and a yellow crescent painted on each back.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the He'hea enter the ceremonial chamber they are pelted with fire from
    cedar brands, escape to the street, and are chased by men and women with flaming
    brands up ladders to roofs, where they are pelted again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gods climb a pole and perform gymnastics on ladders and on a horizontally
    suspended pole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men and women of the fraternity pelt one another with fire, including the
    face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two men of the fraternity run about a thousand yards in a meander while carrying
    flaming masses of cedar fiber.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The male runners are nude except for black woven breechcloths; women wear
    ordinary dress, knitted leggings, and go barefoot.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: At night in the ceremonial chamber, a yucca rope apparently passes through
    another person's body while held by a man at each end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A basket tray of blue mush balls is examined as pliable, raised and waved
    to the six regions with prayers for snow, then found hard as stones, and later
    found pliable again after prayers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The U'huhukwe and Ha'lo'kwe are described as especially expert jugglers in
    Zuni.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: On the closing evening, an aged white-haired member enters the house of a
    tardy woman with a flaming brand and starts her out before it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The tardy woman is described as hourly expecting to become a mother, but she
    is not allowed to omit her duty to the fraternity.
  category: relationship
  evidence_refs:
  - ev:10
