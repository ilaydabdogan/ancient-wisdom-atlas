canonical_text:
  quote: ''
  summary: 'The passage describes the Zuni A''shiwanni or rain priesthood: restricted
    et''towe objects, female preparation of prayer meal, clan-based eligibility and
    succession, appointment procedures involving Bow priests, the status of the Shi''wanokia,
    and an impeachment of a pe''kwin blamed for drought and crop failure. It emphasizes
    purity of heart as necessary for effective rain prayers.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife is described as fearful because discovery of a breach of trust involving
    her husband and mother would place their lives in danger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two et'towe are said to rest undisturbed in sealed vases in their chambers
    after the priestly divisions to which they belonged ceased to exist.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Except for the Shi'wanni of the Zenith, each shi'wanni has a corps of associates
    including a woman; the shi'wanni possessing the Kia'nakwe et'towe has no female
    associate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women associated with the A'shiwanni grind white corn into coarse prayer meal,
    which is mixed with crushed turquoise, white shell, and abalone shell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priesthood is confined to families and clans, with vacancies normally
    filled by a son or brother of the shi'wanni, preference being given to the eldest
    son, though exceptions exist.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Shu'maakwe et'tone is described as distinctly different from the others,
    and songs over it are said to be in the Pima tongue.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:7
  text: In appointments, the shi'wanni whose division has the vacancy effectively
    selects the person, and the Kia'kwemosi formally asks the elder brother Bow priest
    to notify the appointee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder brother Bow priest is described as powerful and revered in Zuni,
    especially among the first body of A'shiwanni, and as the earthly representative
    of the elder God of War.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Shi'wanokia is present at meetings, remains silent during appointments,
    and may speak when impeachment is suggested.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Shi'wanokia denounced a pe'kwin, attributing droughts and crop failure
    to his impure heart and suspecting him of sorcery; he was impeached and removed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A young man selected to replace the removed pe'kwin declined after his mother
    wept and warned that a mistake might cause him to be condemned as a sorcerer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note states that purity of heart is vital because otherwise prayers for
    rain would avail nothing, and clouds are described as the greatest boon in the
    arid land.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The A'shiwanni are described as concerned about finding eligible successors
    for the Kia'kwemosi and pe'kwin.
  category: relationship
  evidence_refs:
  - ev:9
