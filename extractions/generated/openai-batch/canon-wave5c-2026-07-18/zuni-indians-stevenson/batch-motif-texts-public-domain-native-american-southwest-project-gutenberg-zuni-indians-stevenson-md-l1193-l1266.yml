canonical_text:
  quote: ''
  summary: The passage describes a ritual dance and drumming led by named figures,
    the summoning of beings from the earth, a four-day conflict between the A'shiwi
    and the Kia'nakwe, prayers for rain to strengthen A'shiwi weapons and weaken the
    enemy's weapons, the arrival of divine allies, the capture and escape of several
    gods, and the dressing of the captive Kor'kokshi in female attire before a Kia'nakwe
    dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named gods request Kow'wituma, W'ats'usi, and To'na O'si to gather around
    a pottery drum and dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man of the Coyote clan is provided with a drumstick of the kind used for
    pottery drums.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants form a broken circle around the drum group, with each man accompanied
    by a woman of his paternal clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Kow'wituma's command, the Coyote clan man strikes the drum four times and
    then beats it rapidly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Seven beings come from the depths of the earth and take places in the group
    after the drumming.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The circle moves slowly with measured steps while participants sing, with
    Kow'wituma leading as keeper of the songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After four songs or stanzas, To'na O'si strikes the drum four times with his
    claws, causing the enemy's hearts to tremble with fear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The A'shiwi, accompanied by Divine Ones, advance to meet the enemy, identified
    as the Kia'nakwe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The A'shiwi call the Kia'nakwe white people because they wear mi'ha, described
    as white cotton embroidered blankets.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:13
- id: obs:10
  text: The fighting continues for four days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Kia'nakwe close their nostrils with raw cotton because of sulphurous odors
    emitted from the bodies of the A'shiwi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At night the Kia'nakwe return to their village, while the A'shiwi return to
    Han'tlipinkia and dance and pray through the night for rain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Kia'kwemosi send the Divine Ones to Ko'thluwala'wa to ask whether A'wan
    ta'chu Ko'yemshi can tell anything about the enemy and to implore the Council
    of the Gods to cause rainfall.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The requested rainfall is intended to strengthen A'shiwi yucca-fiber bowstrings
    and weaken enemy bowstrings made of deer sinew.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The A'shiwi secure arrows for the battle with the Kia'nakwe on Ko'yemshi mountain.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Heavy rains come on the third morning after the A'shiwi prayers, and the A'shiwi
    meet the enemy again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The A'shiwi forces are strengthened by the Kok'ko, present at the request
    of U'yuyewi and Ma'sai'lema, who are recognized as Gods of War.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Ku'yapali'sa, the Cha'kwena, walks in front of her army shaking her rattle.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: 'Ku''yapali''sa captures four gods from Ko''thluwala''wa: Kor''kokshi, I''sepasha,
    a Sa''va''hlia, and a Sha''lako.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: The captured gods escape, but all except the Sha'lako are recaptured; the
    Sha'lako is not caught because he runs like a hare.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: The Kia'nakwe hold a dance in which the prisoner gods appear in celebration
    of their capture.
  category: action
  evidence_refs:
  - ev:14
- id: obs:22
  text: Kor'kokshi is described as angry and unmanageable, and Ku'yapali'sa has him
    dressed in female attire before the dance.
  category: action
  evidence_refs:
  - ev:14
