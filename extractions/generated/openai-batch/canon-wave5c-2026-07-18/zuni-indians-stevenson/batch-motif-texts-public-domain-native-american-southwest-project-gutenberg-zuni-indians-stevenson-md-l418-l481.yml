  quote: ''
  summary: The passage describes Zuni accounts of lightning-makers, rain-makers, divine
    appeals for water, cloud and wind signs, water-vase symbolism, thunder as a stone
    game, symbolic seed gifts, and the Sun as father and first cause.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ku'pishtaya are described as lightning-makers, mighty warriors, and controllers
    of lightning arrows; each has a deputy and a courier.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: "'Kianil'ona is described as the greatest Zuni ancestral god and as sitting
    in state in Ko'thluwala'wa, where the Council of the Gods appeals to him for water."
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Male gods sprinkle with plume sticks dipped in gourd jugs of water, while
    female gods use vases; heavy rains are said to be produced by pouring water directly
    from vases.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The u'wannami are sent by the Council of the Gods to designated points to
    water the earth according to Zuni supplications.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: 'The passage assigns meanings to cloud forms: cirrus clouds indicate the u''wannami
    passing about for pleasure, while cumulus and nimbus clouds indicate that the
    u''wannami will water the earth.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Smoke offerings may produce clouds, but the daily life of the A'shiwanni must
    avoid offending the Council of the Gods, which can withhold rain-making power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Su'ni-a'shiwanni send cold winds from the northeast and northwest to drive
    away cloud masks, while summer winds from the southwest and southeast are described
    as the breath of the u'wannami from the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage states that the people frequently invoke the rain-makers, that
    water vases are covered with cloud and rain emblems, and that water in a vase
    symbolizes the life or soul of the vase.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A note identifies springs of the six regions as owned by 'Kianil'ona, described
    there as owner of springs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Communication among the Ku'pishtaya of the six regions is described as a courier
    chain passing messages from one regional ruler to another.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that Zunis have no fear of lightning because the Ku'pishtaya
    never destroy the good in heart; a person struck by lightning is said to have
    possessed a bad heart.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Thunder is said to be produced by rain-makers gaming with stones while the
    Ku'pishtaya shoot their missiles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Seeds distributed by personators of ancestral gods are treated as symbols
    of desired blessings and are received and planted with reverence as if they came
    from the god of seeds in the undermost world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sun is referred to as father and ancient one; the moon is his sister,
    the Sun Father has no wife, all peoples are called children of the sun, and unexplained
    matters are attributed to the Sun Father.
  category: relationship
  evidence_refs:
  - ev:7
