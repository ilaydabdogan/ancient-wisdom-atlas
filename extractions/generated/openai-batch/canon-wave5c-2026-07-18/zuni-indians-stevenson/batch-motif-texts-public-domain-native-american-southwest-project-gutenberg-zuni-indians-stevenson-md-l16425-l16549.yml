canonical_text:
  quote: ''
  summary: 'The passage describes Zuni reproductive and childbirth-related practices
    and beliefs: shrines and objects used by couples desiring sons or daughters; a
    medical-divinatory episode in which a pregnant woman is said to have bewitching
    worms removed; a case where a woman who drank from the sacred spring of Ko''loowisi
    is told she carries a serpent but later bears a boy; beliefs about anthropic gods
    whose yucca switches can induce childbirth; shells worn to influence a child''s
    sex; a white pebble used after childbirth for the child''s teeth; and additional
    observations about gestation, twins, triplets, abortion, and late pregnancy symptoms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shrine for parents desiring sons is described as standing on a low mound
    in a narrow valley and containing a raised stone slab with three stones upon it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three stones at the sons' shrine are said to symbolize male generative
    organs, with the longer stone pointing east.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a daughter is desired, one or both members of a couple may visit a stone-walled
    enclosure by the trail to the peach orchards, and the woman breaks bits from two
    projecting rocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The broken rock bits from the daughter-seeking enclosure are powdered, put
    into water, and drunk by the woman; a daughter is expected if the heart is good.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nai'uchi is said to have drawn two objects from a pregnant woman's abdomen
    and identified them as mother and child worms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The worms were interpreted as evidence that the woman had been bewitched and
    as a danger that would have eaten the child and caused its death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A later report within the passage says a woman associated with a witch touched
    the pregnant woman's abdomen and that the worms were cast in at that time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A pregnant woman who had drunk water from the sacred spring of Ko'loowisi
    was told by Nai'uchi that she was carrying a serpent rather than a child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The writer examined the woman and stated that Nai'uchi was mistaken; the woman
    later recovered and bore a healthy boy.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The boy born after the Ko'loowisi episode received the nickname Little Ko'loowisi.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: It is believed that if Sa'ya'hlia or Sal'imobia strike a pregnant woman with
    yucca switches, parturition will immediately result.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pregnant women are described as keeping out of reach of the yucca when these
    gods appear in the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A spiral shell is worn in a woman's belt when a boy is desired, and another
    variety of shell is worn when a girl is desired.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: After childbirth, a white pebble is taken into the mother's mouth and pressed
    against her teeth so that the child's teeth may be white and strong.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Nai'uchi would not visit his granddaughter for several days after her confinement
    because he feared old arrow wounds would frighten the infant and make it cry and
    not sleep.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Zuni theurgists are reported as saying that gestation takes ten months for
    a male child and nine months for a female child.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Twins are described as uncommon and triplets as very rare; triplets are attributed
    to embraces in immediate succession.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: A theurgist examined a young pregnant woman, said she was carrying three children
    and would die if they fully developed, and produced premature birth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: Women are described as generally continuing their duties until labor, with
    swelling of feet, hands, and sometimes face noted shortly before confinement.
  category: attribute
  evidence_refs:
  - ev:10
