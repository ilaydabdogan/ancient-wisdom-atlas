canonical_text:
  quote: ''
  summary: The passage describes a night ceremonial sequence involving baskets before
    an altar, prayers for rain, seeds, and game, deity speech about travel and return,
    offerings and feast foods, fire-lit smoking, a litany with rhombi, masks placed
    on deerskins, meal-sprinkling prayers, a concealed food deposit under a ladder,
    pre-dawn chanting and directional gestures, and a final note about Sha'laako gods
    being received and going to dedicate houses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two baskets are removed from the altar, held by the Kia'kwemosi and the pe'kwin,
    and passed down the line in a specified order without one basket passing over
    the other.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each shi'wanni draws a breath of the basket contents and prays for rain, seeds,
    rats, rabbits, and other game.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods speak of going to Ko'thluwala'wa, leaving their children for five
    days, having them dance in houses, going east, leaving te'likinawe, returning
    to Ko'thluwala'wa, asking for food, and bringing seeds next year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The pe'kwin places before the altar baskets containing gifts of Shu'laawi'si
    and Sa'yatasha; rats and rabbits are described as offerings to the host and are
    later cooked and eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young man dressed in white sits by a large fire and uses a cottonwood-root
    rod to furnish light for ceremonial reed cigarettes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A low litany is intoned by the gods and answered by the A'shiwanni while two
    Bow priesthood members stand before the altar and whirl rhombi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the prayer, the A'shiwanni sit near the fire and personators of the
    gods remove their masks and place them on dressed deerskins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women bring fifty-six large bowls of stew and other foods and arrange them
    in lines in the room.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife of the Kia'kwemosi and a male member of her family sprinkle meal
    upon the altar, offer grace over the food, and invite the people to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shu'laawi'si takes he'we with food from each vessel and leaves through the
    roof hatchway, followed by Sa'yatasha and Hu'tutu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shu'laawi'si deposits food in an excavation under the ladder before the house;
    Sa'yatasha plants plumes and scatters meal; Hu'tutu stamps on the meal; the opening
    is later covered with slab and earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the three gods return and the feast is consumed, masks are donned again;
    Sa'yatasha and Hu'tutu stride until the morning star rises, and Sa'yatasha and
    the pe'kwin chant on the roof.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The pe'kwin carries a meal basket and throws meal before himself and Sa'yatasha
    as they proceed toward the altar.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sa'yatasha carries bow and arrows and a deer-scapula rattle, sprinkles the
    altar with meal, repeats a prayer through the room, and performs a gesture facing
    east with one hand toward the eastern heavens and the other backward toward the
    earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The mask is removed and placed on deerskins by the altar; a morning repast
    follows, and the personators rest until the ceremonies resume.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Sha'laako are said to be met across the river by A'shiwanni, the Ko'mosona,
    and the Ko'pekwin, who pray and sprinkle meal on the gods, after which each Sha'laako
    goes to the house he is to dedicate.
  category: sequence
  evidence_refs:
  - ev:10
