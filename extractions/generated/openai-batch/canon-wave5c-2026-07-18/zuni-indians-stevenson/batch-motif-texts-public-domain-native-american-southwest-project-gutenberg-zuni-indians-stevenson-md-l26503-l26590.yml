canonical_text:
  quote: ''
  summary: A ritual treatment is described in which masked gods and fraternity officers
    attend an invalid. Kwe'lele passes fire-making implements and a string of four
    bread cakes over the patient, places the bread at the heart, and departs with
    the other gods. The patient eats three pieces of bread and gives the fourth to
    a dog, whose eating is said to absorb the disease. The patient is washed with
    yucca suds, receives corn, prayer plumes, and a gift, and becomes a member of
    the order of Kok'ko 'hlan'na. A feast and gifts to the fraternity father follow.
    The passage then begins a separate section on initiation into the order of O'xaya'nakia.
  language: English
  quote_policy: summarized
