canonical_text:
  quote: ''
  summary: The passage describes Sha'lako personators and alternates running among
    excavations to deposit and sprinkle te'likinawe with meal, the pursuit and capture
    of a deer-like effigy as a sign of hunting success, the closing handling of effigies
    and paraphernalia, and an explanation that the ceremonial dramatizes courier communication
    among priest rain-makers of the six regions to bring abundant rains. It then describes
    post-ceremonial races and the daylight appearance of Ko'yemshi, who visit rooftops
    sprinkling meal, singing, dancing, and acting comically.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sha'lako personators and alternates run from one excavation to another and
    deposit te'likinawe in a set order.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The planted plume offerings are sprinkled with meal in the same order in which
    they are deposited.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: All the Sha'lako appear on the field at once, run rapidly, and then leave
    in single file for their dressing room, each accompanied by a wor'li and an alternate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Young men pursue the departing Sha'lako effigies, and when an effigy is caught
    the bearer throws it on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The catcher of an effigy exclaims that he has killed the deer, sprinkles the
    effigy with meal, and prays for hunting success.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that catching the effigy indicates success in the coming
    hunt and that people compete to capture the so-called deer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Sha'lako personators and alternates deposit te'likinawe in the same excavations
    where the Council of the Gods planted offerings; the wor'we fill the openings
    and later take apart the effigies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the ceremonial is performed to bring rains to fructify
    the earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rapid running is described as a dramatization of services performed by
    the Sha'lako as couriers of the priest rain-makers of the six regions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The prayers ask for rains from all quarters, swollen rivers and streams, enlarged
    lakes, overflowing wells, and the fullness of the earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the ritual participants leave, Navahos and Zunis enter the formerly
    forbidden field and hold equestrian and foot races.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the Sha'lako disappear, the ten Ko'yemshi personators emerge, visit
    housetops, sprinkle meal, sing, dance, and act comically with support from women
    inside the houses.
  category: action
  evidence_refs:
  - ev:7
