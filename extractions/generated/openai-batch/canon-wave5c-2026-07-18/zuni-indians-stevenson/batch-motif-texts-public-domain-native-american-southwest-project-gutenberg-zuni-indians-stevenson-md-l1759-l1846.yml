canonical_text:
  quote: ''
  summary: The passage describes Kla'nakwe markings and a corn-related ritual by the
    A'wan 'Si'ta; an account of Yellow Corn survivors becoming Black Corn people through
    medicine fumes, a sacred et'tone, rain-singing, friendship, and adoption into
    the A'shiwi; the Plumed Serpent fetish and serpent chamber painting; and the founding
    of I'tiwanna at the Middle of the world as indicated by Kian'astepi, with associated
    sacred et'tone and shrine locations.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kla'nakwe are described as having one half of the face red and the other
    white, divided diagonally; the passage says the mark later disappeared from descendants,
    though an aged priest remembered a very old woman so marked.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'wan 'Si'ta, described as a direct descendant of the Kla'nakwe, bathes
    the head of each dance participant and draws an ear of corn four times over the
    top of the head while speaking of the Corn people and the straight road of the
    Sun Father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A boy and girl, grandchildren of the old man, are found sitting by a meal
    symbol of clouds, with ears and nostrils closed with raw cotton, inhaling fumes
    from a vessel containing sunflower and other medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man says they had been Yellow Corn people, that the A'shiwi had destroyed
    or driven off all but them, that medicine saved them, and that their corn became
    black, after which they were called Black Corn people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some A'shiwi wish to kill the survivors, but the Kla'kwemosi says they may
    have an et'tone; the old shi'wanni says he cannot be killed because he possesses
    great things and points to his et'tone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Black Corn shi'wanni enters retreat for four days and sings songs for
    rain, and much rain falls; afterward the Kia'kwemosi places his et'tone in a room,
    sings for four days, and his songs also bring much rain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two ritual specialists become fast friends, and the old priest and his
    family are adopted into the A'shiwi tribe; his et'tone later remains with descendants
    identified as Black Corn people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old priest is described as keeper of the fetish Ko'loowi'si, the Plumed
    Serpent, and as having the privilege of painting an elaborate serpent on the wall
    of the chamber where an et'tone is kept.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The A'shiwi leave Ma"sakia because they decide it is too far east for the
    center of the world, then build Hal'ona.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: "'Kian'astepi, identified parenthetically as Hydrotrechus remigis and said
    to have come from the south, spreads his legs and declares the Middle of the world
    to be directly beneath his heart; I'tiwanna is built at the indicated place."
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The et'tone of the Kia'kwemosi is said to rest in a room west of and below
    the ceremonial chamber, at the spot over which Kian'astepi's heart rested, and
    therefore at the Middle of the world.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: He'patina, a shrine southwest of the village, symbolizes the Middle of the
    world; the Middle place where the et'tone rests is said to be too sacred to mention
    except by the Kiakwe amosi.
  category: setting
  evidence_refs:
  - ev:7
