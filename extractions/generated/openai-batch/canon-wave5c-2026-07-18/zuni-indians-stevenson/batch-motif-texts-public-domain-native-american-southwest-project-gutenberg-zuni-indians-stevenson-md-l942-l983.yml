canonical_text:
  quote: ''
  summary: The Corn maidens, who had traveled unseen with the A'shiwi from the undermost
    world, are discovered by two witches at Fog Place. The witches ask their identity,
    learn they have no corn, and give distinct ears of corn or seeds to ten maidens,
    assigning crop identities and sister-rank roles. The elder sister arranges the
    maidens in two east-facing lines for an all-night dance with their corn under
    a described bower. The witches observe, then continue migrating with the A'shiwi
    without telling them about the Corn maidens, who remain at Fog Place and bathe
    in dew or mist without drinking it.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Corn maidens came unseen and unknown with the A'shiwi from the undermost
    world and stayed with them until four years at Shi'pololo kwi, Fog Place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two witches discovered the Corn maidens sitting under an outdoor covered place
    described as a pine-bough pavilion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The witches asked who the maidens were; the maidens identified themselves
    as Corn maidens and said they had no corn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The witches said Corn maidens should have corn and gave the first maiden a
    yellow ear of corn, naming her the Yellow Corn maiden and greater elder sister.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The witches gave blue, red, white, multicolored, black, and sweet ears of
    corn to other maidens and assigned corresponding Corn maiden identities; the Blue
    Corn maiden was named a younger sister and one of the leaders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The witches gave squash, watermelon, and muskmelon seeds to three maidens
    and named them Squash, Watermelon, and Muskmelon maidens, each as a younger sister.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After receiving the corn, the elder sister said she and her sisters would
    dance with their corn and arranged them in two lines facing east to see the coming
    forth of the Sun Father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The maidens danced all night under a bower described with cedar walls, a cumulus-cloud
    roof, and a western-spruce fringe.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The witches watched the dance through the night, then resumed migration with
    the A'shiwi in the morning without speaking to them about the Corn maidens.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Corn maidens remained at Fog Place, where they bathed in dew or mist but
    did not drink it.
  category: action
  evidence_refs:
  - ev:5
