canonical_text:
  quote: ''
  summary: 'The passage describes concluding actions in a Zuni scalp ceremonial: idols
    are kept overnight in a ceremonial chamber with warrior singing; the pa''mosona
    removes a scalp from a pole and, with assistants and warriors, places scalps in
    a pottery vase in the scalp house; red cigarettes, red bread, partly smoked cigarettes,
    and plume offerings are deposited; special rules govern the preparation of red
    bread; at daylight the victor and his elder brother deposit idols of U''yuyewi
    and Ma''sai''lerna/Ma''sai''lema at their shrines, with an explanation that Sun
    Father assigned north and south domains to the two gods.'
  language: English
  quote_policy: summarized
