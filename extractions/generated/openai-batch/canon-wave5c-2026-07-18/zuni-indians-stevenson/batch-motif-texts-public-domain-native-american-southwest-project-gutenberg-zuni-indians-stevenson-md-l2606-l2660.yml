canonical_text:
  quote: ''
  summary: The passage reports that the A'shiwi fled a great flood to a high mesa
    called To'wa yal'lanna or Corn Mountain, where a cave in the mesa wall represented
    the Middle of the world and was said to have held hidden sacred objects. When
    the flood waters nearly reached the mesa summit, a son and daughter of the Kla'kwemosi
    were dressed, adorned, and cast into the sea as a sacrifice; the waters receded
    and the youth and maiden became the columnar Mother rock. The passage then describes
    the A'shiwi return to the valley, rebuilding of villages, later Navaho and Apache
    attacks, and one retaliatory ambush of Navahos at a dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The A'shiwi were compelled by a great flood to seek refuge on a nearby mesa,
    named To'wa yal'lanna from the amount of corn they carried from the lowlands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the stay on the mesa, a cave in the southwest wall took the place of
    He'patina in symbolizing the Middle of the world; the Zunis also claim sacred
    objects were hidden there during the Spanish conquest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Although the mesa stood hundreds of feet above the valley, the waters rose
    nearly to the summit, and the A'shiwi feared being swept from the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The A'shiwi decided that human sacrifice was necessary to appease the angry
