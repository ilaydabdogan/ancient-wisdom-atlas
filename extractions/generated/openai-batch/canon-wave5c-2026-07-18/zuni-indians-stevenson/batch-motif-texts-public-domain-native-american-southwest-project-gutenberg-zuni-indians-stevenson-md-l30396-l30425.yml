canonical_text:
  quote: ''
  summary: 'The passage describes the close of a Zuni fraternity ceremonial sequence
    at dawn: paired performers sprinkle the altar and four regions, dance before the
    altar, and repeat the sprinkling with medicine water. Women sprinkle meal toward
    the rising sun, candles are extinguished so first light enters from the east,
    and men and women pray before the altar to the Sun Father. Novices enter a sand-painting
    circle, the painting is destroyed as their limbs are bathed with sand, medicine
    water is administered, altar objects are removed, and the novices receive ritual
    items and later plant prayer plumes away from the village.'
  language: English
  quote_policy: summarized
