canonical_text:
  quote: symbolized the Middle of the world
  summary: The passage describes a shrine at Water-cress spring with cave-rock markings,
    hand impressions, masks, a Plumed Serpent, animal and god figures, pits, and seats.
    It then lists monthly visits to named springs and mountain-base shrines, identifies
    a cave shrine as the former Middle of the world for the A'shiwi, and describes
    preparations forty-nine days before the Sha'lako, including knotted cords, prayers,
    deposits of te'likinawe, rehearsals, a calendar dispute, and the removal of an
    accused personator from office.
  language: English with Zuni terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A short, steep climb above Pi'kiaia'kiana leads to a cave rock with a projecting
    ledge and stone roof.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hand impressions made with brownish-red paint appear at the ends of the cave-rock
    arch and near the center.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rock bears black-painted masks of anthropic gods, including a central
    Ko'yemshi mask figure with pits for eye and mouth holes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ko'loowisi, identified in the passage as the Plumed Serpent, extends nearly
    the whole length of the rock, with its head to the south and black-painted teeth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Other rock figures include cougars, game animals, and the god O'lolowishkia
    with conspicuous generative organs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Near each end of the rock are twelve pits said to indicate different springs
    of the Council of the Gods.
  category: object
  evidence_refs:
  - ev:1
- id: obs:7
  text: A separate stone with the mask of Sa'vatasha cut on it is described as a seat
    for that god's personator; other stone seats and a large Sha'liiko stone with
    a pitted geometrical figure are also described.
  category: object
  evidence_refs:
  - ev:1
- id: obs:8
  text: From March through October, named springs and shrine places are visited, several
    at the bases of named mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: A cave above Hal'on kwa'ton is described as the shrine that symbolized the
    Middle of the world to the A'shiwi when they lived on To'wa yal'lanne.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: Forty-nine days before the coming of the Sha'lako, ceremonial officials assemble
    at sunrise in the Kia'kwemosi ceremonial chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The pe'kwin and Ko'pekwin each tie forty-nine knots in a white cotton cord,
    and a turquoise or ko'hakwa bead is placed near the first knot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: One cord is given to the personator of Sa'yatiisha and the other to Great
    Father Ko'yemshi; the two go to Ku'shilowa and pray.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The same evening Hal'on kwa'ton is visited by the Council of the Gods, Ko'yemshi,
