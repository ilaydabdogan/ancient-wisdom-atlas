canonical_text:
  quote: ''
  summary: 'The passage describes a ceremonial sequence in the ki''wi''sine: a priest
    presents feathered te''likinawe offerings to selected god personators and prays
    for rain, corn, water, long life, and good things. Shits''ukia and Kwe''lele appear
    on the roof in detailed paint, dress, and masks, then later descend and reappear
    with cooked sweet corn, which they throw to the gathered populace. The passage
    also notes a winter-solstice rule against eating meals in the ki''wi''sine, linked
    to the coming of rains.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men entering the ki'wi'sine take seats on a plank extended between boxes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin first addresses the personator of Shu'laawi'si and presents him
    with an appropriate te'likinawe offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The offering sticks are described by length, color, and attached feathers;
    Shu'laawi'si's stick is black with yellow, blue-green, red, and white spots, while
    most others are yellow and the Ko'yemshi stick is black.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The priest clasps the hands of the chosen personator and prays for rain, corn,
    much water over the earth, long life, and all good things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The te'likinane is passed several times before the recipient's face so that
    he may draw sacred breath from the plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The same presentation ceremony is repeated with Sa'yatasha, Hu'tutu, the two
    Ya'muhakto, A'wan ta"chu Ko'yemshi, and Bi'"si'si.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After receiving the te'likinawe, the chosen personators leave the ki'wi'sine;
    the personator of Sa'yatasha takes most of the te'likinawe to his home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shits'ukia and Kwe'lele perform on the roof of the ki'wi'sine during the day
    and walk about while crowds gather in the plaza and on housetops.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: Shits'ukia is painted white, wears specified garments and ornaments, has a
    mask with lightning, a cornstalk, deer tails, and colored wheels symbolizing corn
    and squash blossoms, and carries a rhombus and yucca.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kwe'lele is painted black with white upper legs, wears specified garments
    and ornaments, has a black mask with plumes and white paper bells, and carries
    yucca and fire sticks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ladder into the ki'wit'sine bears a horizontal bar described as symbolic
