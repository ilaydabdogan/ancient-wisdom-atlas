  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Songs of the Great Fire fraternity are heard within while the two gods are
    on the roof.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Near the end of the afternoon, Shits'ukia and Kwe'lele descend into the ki'wi'sine
