canonical_text:
  quote: ''
  summary: The passage describes Zuni pottery manufacture, including women’s early
    training in the craft, partial loss of knowledge about pottery and rock-carving
    symbols, customary clay sources, ritual actions performed by We'wha while obtaining
    clay at Corn Mountain, gender restrictions around the clay bed, prayers and silence
    associated with successful pottery, and hand-building and decorating techniques.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pottery manufacture is described as a major Zuni industry, with most women
    acting as potters and children learning the craft beside their mothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that few people fully understand symbols on modern pottery,
    and that many symbols on ancient pottery and rock carvings are not deciphered
    by the people.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Black clay for pottery is obtained from Corn Mountain and also from mesas
    near Ojo Caliente and Pescado, and custom restricts pottery clay to these localities.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people declare that the clay will not be exhausted because Mother Earth
    will supply it while they remain pure of heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a stone heap, We'wha picked up a small stone, spat on it, carried it around
    her head, and threw it over one shoulder onto the heap so that her strength would
    not leave her while carrying clay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: We'wha visited the shrine at the base of the mother rock and deposited a torn
    piece of her blanket in a tiny pit as an offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When nearing the clay bed, We'wha indicated that Mr Stevenson must remain
    behind because men never approached the spot.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: We'wha told the writer to remain quiet, saying that talking would cause her
    pottery to crack in baking and that constant prayer was needed for the clay to
    appear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: We'wha hoed the hard soil while murmuring prayers to Mother Earth, rejected
    much of the clay, tested lumps with her fingers, gathered about 150 pounds, and
    carried the load down the mesa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says pottery is made without a wheel, lathe, or revolving support,
    using a discarded water-vase bottom and a trowel made of gourd or pottery fragment.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Clay is ground, mixed with pulverized pottery and water, kneaded, tested by
    fingers and tongue, and stored covered until needed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A vessel is formed from a hollowed ball and successive strips of paste, then
    joined and smoothed with a trowel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Completed utensils are sun-dried, often painted white, polished, and decorated
    with yucca-needle brushes and mineral or plant-mixed pigments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A footnote states that the men who collect clay are the few who adopt woman's
    dress and do woman's work, and that these persons are referred to as women.
  category: attribute
  evidence_refs:
  - ev:9
