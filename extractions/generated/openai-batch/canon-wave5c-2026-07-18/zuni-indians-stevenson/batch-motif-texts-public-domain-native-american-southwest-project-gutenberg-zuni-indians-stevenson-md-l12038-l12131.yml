canonical_text:
  quote: ''
  summary: 'Ethnographic account of Zuni crop-thanksgiving ceremonies: dawn prayer
    to the rising sun, repeated plaza ceremonies with white-painted warriors, public
    gift throwing, women bringing food baskets and sacred meal, evening east-west
    processions, disease-removal and washing rites using cedar bark, eagle-wing feathers,
    and yucca suds, followed by a description of the quadrennial Kok''ko ko''han or
    white-gods dance connected with the Kia''nakwe ghost people and propitiation for
    their destruction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At daylight, participants assemble in the plaza and offer prayers to the rising
    sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremonies in the Mu'he'wa ki'wi'sine are described as the same as those
    in the Chu'pawa, and later ceremonies repeat those of the previous day.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The warriors' bodies are painted white to represent animals, snakes, and the
    heavens, and they wear white kilts or buckskin kilts, white cotton sashes, fox
    skins, war pouches, dressed hair, and hawk down on faces and heads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kia'kwemosi is present and stands at the right of the pe'kwin, identified
    as the sun priest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A first body of A'shiwanni sits on a ledge covered with robes and blankets
    while spectators crowd the terraced house tops; Navaho visitors are also present
    in the plaza setting.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Objects are thrown from the house tops to people below, causing scrambling
    and wrestling; police remove people who use unfair tactics such as tripping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dancing girls continue dancing while women from the warriors' families and
    clan connections bring baskets of food, set them behind the warriors, and sprinkle
    the warriors with sacred meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After each warrior couple completes the sacred plaza ceremonies, the warriors
    put on ordinary clothing and throw the basket contents to the crowd; Nai'uchi,
    elder brother Bow priest, gives calico, ribbon, food, and items of clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At evening, two warriors with the Up"sannawa ki'wi'sine choir go east, while
    two warriors with the Chu'pawa ki'wi'sine choir go west; the western party forms
    facing lines near the Chu'pawa ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rows of men and women stand on nearby roofs holding cedar bark, while a Ne'wekwe
    theurgist walks between the warrior lines and passes eagle-wing feathers down
    each warrior's body to carry off disease while praying.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: During the disease-removal rite, those on the house tops expectorate three
    times on the cedar bark and carry it from left to right around the head while
    praying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the rite, participants separate and have their heads washed in yucca
    suds by appropriate women; the footnote says the washing includes prayers for
    health, prosperity, and a good heart, and that hands and arms are also washed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Kok'ko ko'han, called the white gods, are connected in the passage with
    the Kia'nakwe having been clothed in white and having slept under white blankets;
    the blankets are said to be supposed by the Zunis to have originated with the
    Kia'nakwe.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that the Kia'nakwe ghost people are angry with the Zunis
    for their destruction and that a quadrennial ceremony of propitiation is performed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The outdoor part of the ritual in the Si'aa' te'wita sacred dance plaza is
    reported as identical in details across observations made in 1884 and later occasions.
  category: sequence
  evidence_refs:
  - ev:9
