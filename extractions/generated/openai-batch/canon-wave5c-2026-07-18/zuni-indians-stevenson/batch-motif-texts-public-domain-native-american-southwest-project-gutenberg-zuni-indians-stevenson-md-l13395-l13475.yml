canonical_text:
  quote: ''
  summary: Ethnographic description of a Zuni ceremonial sequence in which Shu'laawi'si
    and other named gods visit village excavations, deposit te'likinawe, sprinkle
    meal, and pray to directional rain-makers. The passage also describes He'hea masks,
    color-coded offerings for six regions, the procession of the Council of the Gods,
    regalia of Sa'yatasha and Hu'tutu, and a blue ring identified as a world and longevity
    symbol.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shu'laawi'si returns to the village, preceded by his ceremonial father, and
    is joined at the town by three He'hea gods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The He''hea masks are described in two styles: two masks have reddish-brown
    dyed sheep''s wool and red peppers, while the third is black with black sheep''s
    wool; lines from the eyeholes are said to symbolize rain, and each mask has a
    lynx skin at the base.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shu'laawi'si visits each excavation, deposits te'likinawe, sprinkles meal,
    and prays.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The excavations and offerings are associated with rain-makers of six regions:
    South with red plume sticks, East with white, North with yellow, Zenith with white
    dotted in colors, Nadir with black, and West with blue.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage notes that this visitation sequence does not follow the order
    usually given for the six regions: north, west, south, east, zenith, and nadir.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sa'yatasha, Ya'muhakto attendants, Hu'tutu, Sal'imobiya figures for Zenith
    and Nadir, and Hle'laxhoktipona follow Shu'laawi'si and visit each excavation
    in the same order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sa'yatasha wears white and deerskin garments, an embroidered kilt and sash,
    leggings, moccasins, anklets, a bow wristlet, necklaces, a war pouch, and a cougar-skin
    quiver; Hu'tutu is said to be dressed the same way.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sa'yatasha and Hu'tutu carry bunches of deer scapulae in the right hand and
    a bow, arrows, and te'likinawe in the left.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among the carried te'likinawe is a miniature game object consisting of a slender
    stick and a ring; the ring is identified as a world symbol and a symbol of longevity
    and is colored blue for A'wonawilo'na.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The exposed portions of the two Ya'muhakto bodies are dyed purple with the
    berry of Berberis fremontii.
  category: attribute
  evidence_refs:
  - ev:9
