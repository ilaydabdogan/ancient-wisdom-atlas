canonical_text:
  quote: small circular hole, symbolic of the entrance to the undermost world
  summary: 'The passage describes a Zuni ceremonial handling of deer or antelope brought
    from a hunt: a matron receives the hunter with sacred meal, the game is placed
    on sheepskins with its head east near a floor cavity for prayer plumes, and old
    plumes are sent by river toward Ko''thluwala''wa. It also describes a Hopi-adopted
    Zuni dance using game-animal masks, a leader personating Le''lentu with a flowering
    te''nas''siili plant, dancers eating the flowers, and a closing scene in which
    a cottontail is shot.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When a deer or antelope is brought from the hunt, villagers announce the hunter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The matron of the hunter's home meets him with a basket of sacred meal, sprinkles
    some on the game, and throws a line of meal before her as she returns, with the
    hunter following.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After entering the house, the hunter places the game temporarily on a sheepskin
    until ceremonial participants arrive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ceremonial participants are described as members of the household, the
    order of the 'Siin'iakiakwe, and members of the Coyote clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The game is transferred to another sheepskin with its head toward the east,
    near a small circular hole in the stone floor described as symbolic of the entrance
    to the undermost world.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prayer plumes to the te'nas'siili, described as a mythical medicine plant
    eaten by game, are buried in the floor hole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Prayer plumes can be offered only when household members belong either to
    the 'Siin'iakiakwe fraternity or to the Coyote clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before new prayer-plume offerings are deposited, earlier offerings are removed
    from the cavity and cast into the river to be carried to Ko'thluwala'wa, described
    as the abiding place of the Council of the Gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After prayer plumes are deposited, the hole is plastered over; the passage
    identifies this as an example of concealing sacred objects in cavities in dwellings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The 'Siin'iakiakwe possess the blossoms and roots of the te'nas'siili because
    it is considered good medicine for game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: A dance in Zuni is said to have been adopted from the Hopi Indians, and its
    masks represent heads of different game animals from elk to hare.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The leader of the dances personates Le'lentu, identified as the Hopi god of
    music, butterflies, and flowers, and bears a tray or bowl containing a flowering
    te'nas'siili plant.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: The artificial plant has paper blossoms that the author visually compares
    to Chinese paper blossoms; when the plant is set down in the plaza, dancers gather
    around to eat the flowers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Men personating game make animal-like and graceful movements, appear at intervals
    during the day, and the scenes close with a man shooting a little cottontail,
    which appears to cause grief to the other animals.
  category: sequence
  evidence_refs:
  - ev:6
