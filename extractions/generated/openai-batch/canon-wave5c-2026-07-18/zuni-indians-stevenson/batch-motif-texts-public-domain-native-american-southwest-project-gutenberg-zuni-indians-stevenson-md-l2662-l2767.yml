canonical_text:
  quote: There are six ki'wi'siwe, dedicated to the six regions.
  summary: The passage describes Zuni ki'wi'siwe as above-ground stone ceremonial
    chambers for anthropic worship, outlines their official hierarchy, names six chambers
    dedicated to six regions, gives an etiology for the name O'he'wa, states that
    ceremonial chambers ideally extend east-west in relation to the Sun Father, and
    explains dance direction, rain-ceremony coordination, and paired elder/younger-brother
    classifications for Kor'kokshi dances.
  language: English with Zuni terms
  quote_policy: quoted
