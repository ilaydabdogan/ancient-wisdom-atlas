canonical_text:
  quote: ''
  summary: 'The passage describes multi-day Shumaakwe ceremonial activity: dancing
    before an altar with inhalation of sacred breath, prayers and meal offerings,
    preparation of masks, paraphernalia and prayer plumes, the arrival of a Shumai''koli
    god with two Sai''apa attendants, detailed descriptions of their masks and regalia,
    movement to the ceremonial house, extinguishing of burning cedar brands, and fourth-night
    body decoration by fraternity members.'
  language: English
  quote_policy: summarized
