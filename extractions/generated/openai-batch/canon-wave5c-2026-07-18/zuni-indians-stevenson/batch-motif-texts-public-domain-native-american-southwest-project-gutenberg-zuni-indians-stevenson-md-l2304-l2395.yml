  quote: with prayers for rains to come from the six quarters of the world
  summary: A ritual sequence seats Corn maidens along a meal line, gives them region-colored
    te'likinawe, brings water from a middle-world shrine and springs, sprinkles the
    maidens, has them dance to choirs, guards them overnight under a constructed shelter,
    and at daylight brings Pa'yatamu and Little Fire fraternity members to the plaza
    with flutes and a medicine bowl.
  language: English
  quote_policy: quoted
