  type: summary
  locator: 8174-8188
  quote_or_summary: At dawn on the last day of plume deposition the pe'kwin announces
    summer solstice from the ceremonial house roof, faces the rising sun, is believed
    to repeat Sun Father’s words, and asks people and Bow priesthood to make offerings
    to named celestial, rain, and lightning-associated beings.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Evidence summarized from supplied passage; rights_status metadata not
