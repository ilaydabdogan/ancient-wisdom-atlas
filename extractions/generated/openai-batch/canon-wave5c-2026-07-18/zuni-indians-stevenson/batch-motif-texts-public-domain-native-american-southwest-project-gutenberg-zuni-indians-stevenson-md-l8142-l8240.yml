- id: ev:6
  type: summary
  locator: 8200-8216
  quote_or_summary: Fraternities convene day and night; altars are erected and embellished
    with mi'wachi and fetishes; medicine water is consecrated; root suds symbolize
    clouds; te'likinawe are prepared for the Council of the Gods; prayer songs are
    offered to Beast Gods, Ku'pishtaya, u'wannami, and Pa'yatamu with rattle and flute.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Evidence summarized from supplied passage; rights_status metadata not
