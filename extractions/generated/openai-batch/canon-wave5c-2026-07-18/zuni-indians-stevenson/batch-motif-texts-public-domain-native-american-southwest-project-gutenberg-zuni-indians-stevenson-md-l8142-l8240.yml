  type: summary
  locator: 8189-8199 and note
  quote_or_summary: Two days before solstice the first body of A'shiwanni, Ko'mosona,
    and Ko'pekwin prepare te'likinawe; a note says deceased Bow priesthood members
    become lightning-makers and work with Ku'pishtaya, chief of lightning-makers.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Evidence summarized from supplied passage; rights_status metadata not
