canonical_text:
  quote: ''
  summary: 'The passage describes Zuni summer-solstice observances: a sunset sign
    on a mesa, the pe''kwin''s notifications and repeated plume offerings, a public
    proclamation attributed to communication with the Sun Father, pre-solstice fraternity
    vigils and prayers, pottery making and firing, and post-solstice offerings taken
    to a spring followed by retreat.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun is observed striking a certain point of a mesa at sunset for five
    consecutive days, and this is described as the Sun Father resting five times in
    succession during his daily journeys.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first observation, the pe'kwin informs the elder brother Bow priest,
    who notifies the first body of A'shiwanni; they gather that evening in the ceremonial
    chamber of the Kia'kwemosi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pe'kwin makes four te'likinawe in pairs for the Sun Father and Moon Mother;
    the sun sticks are blue, the moon sticks are yellow, and they are planted at a
    shrine on Yiil'lan 'hlan'na.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A repeated fourth-morning sequence alternates te'likinawe offerings to deceased
    a'pekwin in the pe'kwin's field with offerings to the sun and moon on Yiil'lan
    'hlan'na.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At early dawn on the last day of depositing plumes, the pe'kwin announces
    from the roof of the Kia'kwemosi's ceremonial house that summer solstice will
    occur eight days later.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: While facing the rising sun, the pe'kwin is believed to repeat words given
    to him by the Sun Father and to have direct communication with the Sun Father
    at this season.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pe'kwin asks the people to make te'likinawe for the Sun Father, Moon Mother,
    and rain-makers, and asks the Bow priesthood to make te'likinawe for Ku'pishtaya
    and associated rain-making Bow priesthood beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the solstice, priestly groups and fraternities prepare te'likinawe,
    erect altars, embellish them with mi'wachi and fetishes, consecrate medicine water,
    and make root suds described as symbolic of clouds.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: At night, prayer songs are offered to Beast Gods, Ku'pishtaya, u'wannami,
    and Pa'yatamu, accompanied by rattle and later flute, with no drum used.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the three days after solstice, pottery is made and decorated; on the fourth
    day pottery is fired, and a bit of wafer bread is deposited in each piece because
    its spiritual essence is believed to feed the object's spirit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the fifth day after solstice, A'shiwanni prepare offerings for the Priestess
    of fecundity, the sun, moon, rain-makers of the six regions, and deceased predecessors;
    the offering bundle is carried to a spring and sunk in the water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the spring, the Kia'kwemosi fills a gourd water jug while his associate
    whirls a rhombus; afterward the Kia'kwemosi enters retreat for eight nights with
    associates and the Priestess of fecundity.
  category: sequence
  evidence_refs:
  - ev:9
