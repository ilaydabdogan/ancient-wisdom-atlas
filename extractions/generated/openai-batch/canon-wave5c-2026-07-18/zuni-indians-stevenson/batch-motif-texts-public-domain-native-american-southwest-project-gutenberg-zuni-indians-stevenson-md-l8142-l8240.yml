- id: ev:7
  type: summary
  locator: 8217-8225
  quote_or_summary: For three days pottery is made and decorated; on the fourth day
    it is fired and the village is ablaze at night. Wafer bread is placed in each
    piece to feed the spirit of the object.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Evidence summarized from supplied passage; rights_status metadata not
    supplied.
- id: ev:8
  type: summary
  locator: 8226-8236
  quote_or_summary: On the fifth day after solstice, A'shiwanni prepare offerings
    for the Priestess of fecundity, sun, moon, rain-makers of six regions, and deceased
    predecessors; the offering bundle is carried by the Kia'kwemosi and his first
    associate to a spring in lava beds and sunk in the water.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Evidence summarized from supplied passage; rights_status metadata not
