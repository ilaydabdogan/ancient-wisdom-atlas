candidate_motifs:
- id: motif:1
  label: solstice observation and seasonal rite
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage centers on observing a solar sign before summer solstice, announcing
    the solstice, and carrying out ritual sequences before and after it.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is ethnographic description rather than a narrative myth;
    motif assignment is to ritual pattern.
- id: motif:2
  label: offerings exchanged with celestial, rain, divine, and deceased recipients
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe are repeatedly prepared and deposited for Sun Father, Moon Mother,
    rain-makers, Ku'pishtaya, Council of the Gods, deceased priests, and deceased
    predecessors.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage does not state an explicit reciprocal outcome except prayer
    and invocation; exchange is inferred from offering and prayer structure.
- id: motif:3
  label: ritual water and cloud-making for rain-related powers
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The rites include medicine water, cloud-symbolic root suds, prayers to rain-makers,
    offerings to rain-makers of six regions, spring immersion of an offering bundle,
    and drawing spring water in a plumed gourd jug.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not narrate rainfall occurring; the motif is limited
    to rain-oriented ritual actions and symbols.
- id: motif:4
  label: direct communication from solar deity through priestly proclamation
  taxonomy_refs: []
  basis: The pe'kwin faces the rising sun and is believed to repeat words given by
    the Sun Father, with direct communication attributed to him at this season.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No broader doctrinal explanation is provided in the passage.
- id: motif:5
  label: crafted object treated as spirit-bearing and fed
  taxonomy_refs: []
  basis: A bit of wafer bread is put into each piece of pottery because its spiritual
    essence is believed to feed the spirit of the object.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage only describes pottery in this specific solstice-season context.
- id: motif:6
  label: deceased ritual specialists as weather or lightning agents
  taxonomy_refs: []
  basis: Offerings are made to deceased sun priests and deceased predecessors; a note
    says deceased Bow priesthood members become lightning-makers and work with Ku'pishtaya.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:8
  confidence: medium
  cautions: The lightning-maker transformation is given in a note about deceased Bow
    priesthood members and is not elaborated in the main ritual sequence.
- id: motif:7
  label: post-offering retreat with sacred water vessel
  taxonomy_refs: []
  basis: After the spring offering and filling of a plumed gourd water jug, the Kia'kwemosi
    enters retreat for eight nights with associates and the Priestess of fecundity.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not explain the internal meaning of the retreat or the
    et'tone.
