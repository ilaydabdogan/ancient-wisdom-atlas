canonical_text:
  quote: ''
  summary: A Zuni native account describes ritual specialists defending a mesa settlement
    by blowing medicine held in shells toward attackers, a priest averting a later
    attack by sending a message, a sorcerer’s failed attempt to harm a sick associate
    of the shell keeper, the burial of dangerous medicine and tiny shells, the continued
    presence of a great shell, later Zuni descent from Corn mountain, construction
    of a fortified village, and limited effects of Catholic ritual on Zuni religious
    life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An enemy force was advancing up the mesa when the keeper and his deputy came
    forward after being called a fourth time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The keeper and deputy wore only breechcloths, had red-painted bodies and limbs,
    black-painted faces, eagle down on forehead and chin, red eagle plumes tied to
    the scalp lock, and yucca anklet and wristlet wreaths.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each theurgist filled a tiny shell with medicine, placed the shell in his
    mouth, and approached the edge of the mesa unarmed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people cried out for the theurgists not to advance, and the theurgists
    replied that they were not afraid.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The theurgists blew the medicine-containing shells toward the enemy; the enemy
    staggered, fell, and nearly the whole army was destroyed, while survivors retreated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lagunas later appeared and made a fire, after which the Zunis received information
    that another attack was expected.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Spanish priest wrote a charcoal message on deerskin saying he was safe,
    loved the Zunis, and wished to remain with them, then threw it down the mesa side
    to be received by the Spaniards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After reading the message and learning the priest was safe, the Spaniards
    made no attack and sent clothing and other things to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A sorcerer put medicine around the roof of a sick associate of the keeper,
    but when he tried to descend through the hatchway he lost his strength and could
    not move.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sorcerer admitted that he had put medicine there because he wished the
    sick man to die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sick man warned the sorcerer not to repeat the act and said he could find
    him out and destroy him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sick man’s sister placed the medicine and the tiny shells in a water vase
    and buried it in a hole on a knoll at the base of the mesa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that only the great shell remains, that it would be used
    with medicine in an attack, and that in ceremonials it is only blown because using
    the medicine would kill all the people.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: After dwelling a long time on Corn mountain, the Zunis descended and scattered
    over the valley.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Raids by Navajos and Apaches forced the Zunis to build the present village
    on a knoll at the remains of old I'ti wanna.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The village houses were compactly built in stacked groups, with ladders to
    the roofs drawn up in case of attack.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: A church was built in the new village, and the Zunis became interested in
    Catholic ritual especially because they were allowed to use their own symbols
    in decorating the churches.
  category: sequence
  evidence_refs:
  - ev:8
