- id: obs:4
  text: A man and wife offended the fraternity; while they slept together on a grass
    blanket, the Hle'wekwe lifted them in the blanket and tossed them far north, where
    they multiplied and became giants called Su'ni-a'shiwanni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hle'wekwe went east to Shi'papolima, home of Po'shaiyanki, and were brought
