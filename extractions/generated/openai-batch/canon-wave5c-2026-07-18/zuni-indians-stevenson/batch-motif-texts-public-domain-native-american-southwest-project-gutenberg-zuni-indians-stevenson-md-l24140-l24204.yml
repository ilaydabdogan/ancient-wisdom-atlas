  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At To'vakwi the Hle'wekwe built a village, placed their et'towe and sacred
    prayer plumes on cloud symbols of meal, prayed, and the earth was soon covered
    with snow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two Hle'wekwe officers went to the mountains for deer instead of hunting rabbits,
