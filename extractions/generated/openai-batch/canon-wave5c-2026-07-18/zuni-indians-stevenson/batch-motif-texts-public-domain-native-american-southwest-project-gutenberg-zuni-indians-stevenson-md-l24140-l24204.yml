canonical_text:
  quote: ''
  summary: A plate description explains map symbols for the route of the Hle'wekwe
    Wood Fraternity in quest of the Middle Place, including hail, roads, celestial
    markers, and a route of the Kla'nakwe. The narrative then recounts the fraternity
    casting away an offensive couple who become northern giants, visiting Shi'papolima
    and receiving instruction in sword swallowing, returning with Beast Gods as warriors,
    using prayer plumes and meal cloud symbols to bring snow at To'vakwi, and locating
    A'shiwi people through smoke seen from a mountain.
  language: English
  quote_policy: summarized
