  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that not an atom of food is wasted by the Zunis.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: He'vahoniwe is described as a common Zuni bread made from corn mush, salt,
