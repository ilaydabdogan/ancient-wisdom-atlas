canonical_text:
  quote: No word must be spoken above a whisper
  summary: The passage describes Zuni bread making, especially he'we wafer bread and
    he'vahoniwe. It covers the sourcing and preparation of sandstone baking slabs,
    the use of fire, squash seed oil, pinon gum, pine and juniper, a whisper-only
    rule during slab dressing, preparation of corn meal and batter, coloring and baking
    methods, variants, and reuse of leftover bread bits.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Zuni women are described as taking special pride in good bread; he'we wafer
    bread is identified as a household staple.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: He'we is baked on gray sandstone slabs cut from a quarry at the base of To'wa
    yal'lanne, glossed as Corn mountain; men or boys bring the slabs home and women
    then take charge of them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The baking slab is supported over a hearth fire, heated gradually, blackened
    with oil from chewed squash seeds, rubbed with melted raw pinon gum, and brushed
    with pine and juniper twigs.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: During the dressing of the slab, no one present is supposed to speak above
    a whisper; a raised voice is said to make the stone crack during polishing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer reports seeing a stone cracked in two places; because no one had
    spoken aloud, the conclusion given was that the worker had a bad heart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Corn for he'we is crushed, toasted, milled through increasingly fine stones,
    cooked into mush, and mixed with batter; lime water may be added to make the bread
    bluish-green.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The maker spreads the mixture thinly by hand from right to left over a heated
    slab; the sheet bakes quickly, is cooled, then may be warmed and rolled or folded
    before being piled in baskets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: He'we may also be colored red with amaranthus grown in gardens.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Variants of he'we may use bean paste, untoasted meal, and salt; leftover bits
    are saved, toasted, crushed, and later warmed in grease or moistened with water
