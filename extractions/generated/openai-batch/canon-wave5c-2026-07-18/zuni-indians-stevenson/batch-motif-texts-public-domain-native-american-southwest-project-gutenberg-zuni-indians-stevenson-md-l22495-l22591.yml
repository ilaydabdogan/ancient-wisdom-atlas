candidate_motifs:
- id: motif:1
  label: Directional animal intercession for rain
  taxonomy_refs: []
  basis: Four animals associated with four directions are summoned, adorned with plumes,
    and asked to intercede with rain-makers for rain.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a ritual account, not a generalized cosmological
    explanation of the directions.
- id: motif:2
  label: Ritual fire power mistaken for sorcery
  taxonomy_refs: []
  basis: The director lights a torch and distant fires through medicine-breath; observers
    classify the act as sorcery, while practitioners identify it as learned Corn clan
    ritual knowledge.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The text contrasts accusation and denial but does not independently adjudicate
    the practice.
- id: motif:3
  label: Initiation and transmission of fraternity secrets
  taxonomy_refs:
  - initiation
  basis: A'shiwi are initiated further into Little Fire rites, Mu'kwe initiate some
    A'shiwi into secrets, and Bow priests' authority is described as conferred through
    initiation.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: Different fraternity contexts are grouped here because the passage itself
    treats them within a sequence on fraternity origins.
- id: motif:4
  label: Quest for a long-looked-for god guided by music
  taxonomy_refs:
