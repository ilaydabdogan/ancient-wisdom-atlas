canonical_text:
  quote: ''
  summary: A ritual director summons four directional animals, gives each an eagle
    plume, and asks them to intercede with rain-makers. He then uses medicine and
    breath to light a torch and distant fires, leading observers to accuse him and
    his followers of sorcery. The passage then relates A'shiwi association with Mu'kwe/Corn
    clan rites, Little Fire fraternity initiation, an alternate account of Mu'kwe
    seeking the god Le'lentu/Pa'yatamu, several fraternity affiliations and origins,
    the divine founding of the Bow priesthood, and the opening of a recent Struck-by-lightning
    fraternity origin account.
  language: English with Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The director holds an unlighted torch and four red fluffy eagle plumes while
    dancing and calling for the Cougar of the North.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cougar of the North, Bear of the West, Badger of the South, and White
    Wolf of the East each appear, receive a plume on the back of the neck, and are
    asked to intercede with the rain-makers for rain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director chews Corn clan medicine, lights his torch by blowing medicine-breath
    on it, and extends the burning brand to make fires at great distance in four regions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Observers accuse the director and his followers of being sorcerers; the accused
    group denies this and says the practice was taught by Mu'kwe fathers of the Corn
    clan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The offended A'shiwi leave their people, join the Corn clan, remain with them
    for four time periods, travel to the Mu'kwe settlement, build a village beside
    Walpi, and name it Shi'wona after their own village in the Middle place of the
    world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During their stay with the Corn clan, and after their return, the A'shiwi
    are further initiated into and observe rites of the Little Fire fraternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In an alternate version, a Mu'kwe party searches for the god Le'lentu, finds
    him at a spring near Corn mountain, and is guided there by music; the A'shiwi
    Gods of War also discover Pa'yatamu at the same place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The god is described as short, with his head crowned by flowers of a mythical
    plant bearing six-colored blossoms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mu'kwe members of the Little Fire fraternity initiate some A'shiwi into secrets,
    and cotton brought by the Mu'kwe is spun and woven into shirts that novices present
    to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Rattlesnake and Cimex fraternities are described as branches of other
    fraternities, and the Cactus fraternity is said to have been adopted from the
    Hopi Indians.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bow priesthood is said to have been created by the Gods of War at Halona;
    elder and younger brother Bow priests fill the gods' places in direct succession
    and are regarded as infallible through initiation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Membership in most of the named fraternities is described as open to Zunis
    of both sexes above about four or five years of age.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Struck-by-lightning fraternity is said to stand among the other organizations,
    and a woman of the fraternity is said to have treated Nai'uchi before his death.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the opening of the Struck-by-lightning story, five men and two women in
    one house at Nutria in 1891 are made senseless by lightning; one man recovers
    first and initially thinks the others are dead.
  category: sequence
  evidence_refs:
  - ev:10
