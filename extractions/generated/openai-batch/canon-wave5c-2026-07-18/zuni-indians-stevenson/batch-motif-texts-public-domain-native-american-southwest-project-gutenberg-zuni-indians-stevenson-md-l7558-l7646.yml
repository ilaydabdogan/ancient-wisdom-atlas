canonical_text:
  quote: ''
  summary: The passage describes Pau'tiwa approaching the Zuni village with plume
    wands, te'likinawe, a small game object, and a twig described as suggestive of
    a Navaho scalp. He circles the village four times, deposits offerings in concealed
    wall recesses at houses associated with directions and vertical points, prays
    and sprinkles meal, then ascends the ladder of the He'iwa ki'wi'sine, throws the
    scalp symbol inside, and deposits additional plume wands while marking four lines
    of meal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five men of the Sun clan are seen coming over the plain south of the village,
    while Pau'tiwa comes separately from the south, east of the group, and alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pau'tiwa carries plume wands, bunches of te'likinawe, a diminutive game of
    si'kon tikwane with a blue hoop, and a twig described as suggestive of a Navaho
    scalp with crow and owl feathers attached.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pau'tiwa walks slowly and circles the village four times in a coil-like course,
    with the final circuit through the streets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a house on the east side of the village, a matron removes a stone slab
    that conceals a wall recess before Pau'tiwa arrives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Sun clan man and two Dogwood clan men are identified for the occasion as
    Pau'tiwa's father and elder and younger brothers; the younger brother helps detach
    te'likinawe for deposit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The deposited te'likinawe are offerings to the sun and moon, with a blue stick
    for the sun and a yellow stick for the moon.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The offerings are stated to be for the increase and perpetuation of vegetable
    and animal life, especially that of the Zunis.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Pau'tiwa deposits plumes with prayers, sprinkles them with meal from his belt,
    and proceeds to other houses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After Pau'tiwa leaves the east-side house, the matron seals the wall recess
    with plaster so that no trace of the excavation remains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The deposition ceremony is repeated at houses on the north, west, and south
    sides of the village and at two inner-street houses for the zenith and nadir.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At sunset Pau'tiwa goes to the He'iwa ki'wi'sine, is received at the base
    of the outer ladder by Shits'ukia, Kwe'lele, and the pe'kwin, and ascends while
    meal is sprinkled.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: On reaching the roof, Pau'tiwa throws the symbol of the Navaho scalp into
    the ki'wi'sine, which indicates that the song must cease.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Facing east, Pau'tiwa separates two plume wands for two men connected with
    a forthcoming Sha'lako event and deposits them with four smaller te'likinawe while
    praying.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Pau'tiwa draws four lines of meal on the hatchway log; the text states that
    this means the gods will come four times, referring to the Salimobiya bringing
    seeds from Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:13
