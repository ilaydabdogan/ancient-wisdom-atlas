candidate_motifs:
- id: motif:1
  label: Tabooed sight and approach to sacred waters
  taxonomy_refs:
  - forbidden_knowledge
  basis: 'The lake is treated as restricted: the guide fears divine offense and death,
    and the passage states that looking on the waters without Ko''mosona permission
    brings death in four days.'
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage concerns forbidden
    viewing and visitation rather than forbidden knowledge in a narrow sense.
- id: motif:2
  label: Food offering to departed ancestors for intercession
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The guide fasts to save bread, burns it in the camp fire, and prays to the
    dead to intercede with the Sun Father and Kok'ko A'wan for his people and the
    world.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage calls the act an offering and prayer; applying 'sacrifice'
    is a broad motif-family classification.
- id: motif:3
  label: Sacred lake as house of the departed and divine council
  taxonomy_refs: []
  basis: The guide calls the waters the house of his departed fathers, and priests
    claim that clay comes from the house of the Council of the Gods in the lake depths.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage does not
    describe an afterlife journey or mapped route.
- id: motif:4
  label: Sacred substance tied to rainfall
  taxonomy_refs: []
  basis: The pinkish clay near the lake is prized, and Zuni belief is reported that
    parting with even a small portion would prevent rain from falling on the land.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage reports the belief but does not describe a full rainmaking
    rite.
- id: motif:5
  label: Concealment of unauthorized sacred visitation
  taxonomy_refs: []
  basis: The guide fabricates a detailed alternative story to prevent other Zuni travelers
    from suspecting that the party visited Ko'thluwala'wa.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The act is protective concealment in this passage; no trickster or deception
    taxonomy is assigned.
- id: motif:6
  label: Mountain as sacred origin and divine dwelling
  taxonomy_refs:
  - cosmic_mountain
  basis: A note identifies Kor'kokshi mountain as the legendary origin place of a
    first ancestral god and goddess and another mountain as the home of the Ko'yemshi
    and a place of war-god preparation.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage calls the mountains landmarks and sacred locations, but does
    not explicitly present a cosmic-mountain doctrine.
