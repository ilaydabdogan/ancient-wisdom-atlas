canonical_text:
  quote: ''
  summary: The passage describes a visit to the sacred lake Ko'thluwala'wa. An old
    Zuni guide fears divine punishment for approaching or looking at the lake without
    authorization, later prays near the water, offers prayer meal and saved bread,
    and explains the lake as the house of departed fathers. The passage also records
    beliefs about clay from near the lake, rain, divine beings in the lake depths,
    secrecy about the visit, and punishment by religious authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr Stevenson, the writer, and an old Indian guide travel toward Ko'thluwala'wa,
    which is described as a sacred spot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The guide initially declares that the party must not go to the lake and must
    be persuaded to guide them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The guide says the marshy ground was made by gods who did not wish the party
    to approach the lake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The guide says that if he guides them to the lake he will offend the gods
    and will surely die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: A belief is stated that anyone who looks on the waters of the lake without
    special permission of the Ko'mosona will die in four days.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The party camps half a mile from Ko'thluwala'wa, and the guide refuses to
    accompany them when they remount to visit the lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the party circles the lake, they find the guide near the water engaged
    in prayer, with his headkerchief removed, his right hand extended toward the setting
    sun, and prayer meal being scattered toward the lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The guide says he is happy and content to die because he has looked upon the
    waters of the house of his departed fathers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The guide approaches the lake on foot because the sacred ground must not be
    desecrated by the tread of beasts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The guide burns bread that he had saved behind a tree, praying to the dead
    to intercede with the Sun Father and the Kok'ko A'wan for his people and all the
    world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The guide observes a strict fast in camp so that his food can be offered to
    the departed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Pinkish clay collected near the lake is prized by the Zuni, who are said to
    believe that parting with even the smallest portion would stop rain from falling
    on the land.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Priests claim that the pinkish clay comes from the house of the Council of
    the Gods in the depths of the lake.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The guide refuses to touch the clay and asks that it not be seen in Zuni.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When two Zuni travelers appear, the guide diverts suspicion by telling a fictitious
    account of a visit to St John and pottery found in a cave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that unauthorized visiting of the lake is punished by death
    within four days through the anger of the gods and by corporal punishment or possible
    death by order of the Ko'mosona.
  category: other
  evidence_refs:
  - ev:8
- id: obs:17
  text: A note states that the director of the Hunters and his deputy alternate in
    quadrennial visits to Ko'thluwala'wa.
  category: other
  evidence_refs:
  - ev:9
- id: obs:18
  text: A note states that Kor'kokshi mountain is, according to a Zuni legend, the
    place where a first ancestral god and goddess originated, and that another mountain
    is the home of the Ko'yemshi and a place where the Gods of War prepared for attack.
  category: setting
  evidence_refs:
  - ev:9
