canonical_text:
  quote: ''
  summary: 'The passage describes Zuni pueblo house form and construction: terraced
    stone-and-adobe dwellings clustered around plazas, status-related residence levels,
    gendered building tasks, children carrying water, roof and entrance structures,
    internal connections, selenite light openings, chimneys made from cooking vessels,
    and plastering/whitewashing techniques.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pueblo is described as terraced, with houses built one upon another so
    that one roof may serve as the floor or yard of the dwelling above.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The houses are made of stone and adobe and are clustered around plazas, with
    covered ways and streets also mentioned.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage links wealth and official position with residence in lower houses;
    people of more modest means live above them, and poorer families generally occupy
    the uppermost stories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women are said to delight in house building, especially plastering, and to
    regard plastering as their special prerogative.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men lay stone foundations, build walls, and place large roof-supporting logs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The roof construction sequence includes logs, cross-laid willow boughs, brush,
    and an earthen covering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Little girls assist by bringing water from the river in small water vases
    carried on their heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The houses have outer doors, while roof hatchways with ladders serve as additional
    entrances.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Older entrances are described as circular openings through thick round stone
    slabs, closed by round stone slabs held with strong pole props.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Interior doors allow much of the older village to communicate internally without
    going outside the communal structure.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Small wall openings for light are filled with irregular pieces of selenite.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Chimneys are made from perforated cooking utensils stacked and cemented together,
    and worn-out cooking pots may be stored for later chimney use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Exterior and interior walls are covered with reddish-brown earth-and-water
    plaster applied by hand in semicircles, with water applied from the plasterer's
