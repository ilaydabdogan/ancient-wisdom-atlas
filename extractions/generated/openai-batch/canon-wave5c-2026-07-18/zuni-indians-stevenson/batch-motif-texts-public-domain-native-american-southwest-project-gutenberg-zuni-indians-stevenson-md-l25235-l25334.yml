canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Zuni ceremonial actions: processional
    departure and return of object-bearers, prayers and breath drawn from ritual implements
    and meal, the appearance and procession of the Hle''wekwe with specified body
    paint and regalia, a continuous dance including sword swallowing by adults and
    children under fraternity fathers, and a return to the ceremonial chamber where
    participants draw breath near a sand-painted figure before it is erased from the
    four cardinal points to the center.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the music ceases, the party leaves the plaza in single file by the western
    way; the bearer of hle'ettone and two men with bows and arrows return to the Hle'wekwe
    ceremonial chamber while others go to the house from which they came.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Musicians draw bones lightly over notched sticks, bring the bones to their
    mouths, draw a breath from them, repeat a prayer aloud, and return the bones to
    the box.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small basket of meal is removed from under the larger box; each musician
    prays, brings the basket close to the lips, draws a breath from it, and the basket
    is returned under the box.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The et'towe and bows and arrows are brought to the plaza again; the hle'ettone
    is carried by another girl, the bows and arrows are held by others, an additional
    musician is present, and the second ceremony is otherwise identical to the first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hle'wekwe appear with nude bodies, yellow paint on specified body parts,
    black native wool kilts, yucca wreaths, plumes, and other regalia; the Hlem'mosona
    has distinct white clothing and large plumes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Hle'wekwe drummer, identified as a warrior to the fraternity, precedes
    the female leader, beats the wooden drum, and takes position on the east side
    of the plaza.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The female leader carries the fraternity mi'li and a basket of meal in her
    left hand and sprinkles meal before her with her right hand as she advances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The procession enters from the western street, passes south of the boxes,
    circles by east, north, and west, and completes the circle before the sword swallowing
    begins.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Dancers carry rattles in the right hand and swords with feathered handles
    upward in the left while musicians play notched sticks and fraternity members
    sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hlem'mosona steps out near the boxes, dances before them, faces east,
    and runs a sword down his throat while the dance continues.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other members repeat the sword swallowing; some men swallow multiple swords,
    one woman swallows two at once, and fraternity fathers swallow swords when children
    or juvenile members do not perform the full act.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the early morning dance, the Hle'wekwe return to the ceremonial chamber,
    group around the painting of A'chiyula'topa, place their hands near the figure,
    bring their hands to their lips, and draw a breath.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A female member erases the painted figure by brushing sand from the four cardinal
    points to the center with a tepi, then brushes the sand into her left hand and
    deposits it in a blanket on a male member's left arm.
  category: action
  evidence_refs:
  - ev:8
