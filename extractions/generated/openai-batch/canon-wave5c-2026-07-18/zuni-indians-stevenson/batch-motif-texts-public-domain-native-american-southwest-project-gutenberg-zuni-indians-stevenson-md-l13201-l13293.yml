canonical_text:
  quote: ''
  summary: The passage describes large-scale preparations for the Sha'lako festival,
    including corn grinding, dancing, songs for rain and crops, food preparation,
    a sunset prayer, a feast, and a departing-guest rite using hearth ashes for a
    newborn child. A note reports that two original grinding songs were given when
    Corn maidens first danced at shi'pololo, while other songs were borrowed from
    neighboring Pueblo communities during crop failures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Work on new houses is hurried so the houses will be complete in time for the
    Sha'lako festival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wagonloads of colored corn are brought from farming districts, and women of
    the household and related clans prepare for feasts on a large scale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the described wealthy house there are eight mills and sixteen grinders.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An aged woman who is said to know the two original grinding songs sits before
    the mills and leads or teaches the grinders in song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While one set of maidens grinds, another set dances to a choir of eight young
    men using a drum and rattles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A crone places ears of corn in the hands of dancers and repeats a short prayer
    at each presentation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dancers move in a line and join a song that is a supplication for much
    rain and bountiful crops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the close of the dance the maidens return the corn to the crone; she draws
    breath from it and presents it to the dancers, who draw the sacred breath from
    the corn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Corn is toasted near the fireplace, ground through additional mills, and made
    into fine meal; wafer bread and stews are prepared in adjoining rooms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A young mother with an infant born the previous night remains near the fireplace
    through the noise of rattles, drum, and song until the feast ends.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before sunset the western door is opened; as the sun sets behind the mountain,
    the grinders and dancers stop and a prayer to the setting sun is offered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the dance, guests are invited to a feast with stew, peaches, and bread,
    and the hostess and her daughter keep the vessels replenished.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Departing female guests receive a bowl of steaming stew to carry home, while
    the young men are not given this favor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before leaving, each guest takes ashes from the mill-room fireplace, passes
    them three times around the newborn's head, then throws the ashes outside with
    a prayer for the child's health and long life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note states that the two original grinding songs were given to the Zuni
