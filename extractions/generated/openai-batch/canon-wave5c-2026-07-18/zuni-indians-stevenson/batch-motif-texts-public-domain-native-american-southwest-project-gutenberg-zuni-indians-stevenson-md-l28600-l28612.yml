  summary: The passage describes the Ha'lo'kwe or Ant Fraternity, listing its four
    orders and explaining that broom straws are used to brush pebbles from an invalid's
    body after the pebbles have been brought to the surface by theurgists. It also
    notes the fraternity's male and female membership and states that only men belong
    to the A'chiya order.
