- id: claim:1
  claim: The coyote's mythic assignment to eat only blood is explicitly linked in
    the passage to the coyote fetish sus'ki being dipped into deer blood, supporting
    a same-function relation between the narrative decree and ritual fetish feeding.
  claim_level: same_function
  target: coyote fetish sus'ki deer-blood practice described in the passage
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage myth-ritual linkage only; it does not establish
    historical contact or external comparison.
- id: claim:2
  claim: The abstention of Pau'tiwa, Shits'ukla, Kwe'lele, and the four Sa'ya'hlia
    from the collected water is linked to whether the Council of the Gods waters the
    earth, supporting a same-function relation between ritual restriction and divine
    watering.
  claim_level: same_function
  target: water-drinking and abstention rite described in the passage
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the functional relation but supplies no external
    comparative tradition.
