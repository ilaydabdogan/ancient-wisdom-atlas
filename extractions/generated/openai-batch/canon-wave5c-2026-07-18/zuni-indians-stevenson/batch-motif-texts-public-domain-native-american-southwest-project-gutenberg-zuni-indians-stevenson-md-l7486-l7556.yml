canonical_text:
  quote: ''
  summary: 'The passage narrates Shits''ukla feeding gods through a night fire, summoning
    animal figures, testing their food choices at an enclosed deer house, and assigning
    lasting food rules after success or failure. Pau''tiwa and Shits''ukla release
    the game from their enclosure to live over the earth, and Kwal''ashi people are
    transformed into ravens after objecting. The passage then describes associated
    ritual actions: corn distribution with yucca and hooting, and a water-drinking
    rite with named administrators, kinship address, abstainers, and a rule that divine
    watering of the earth depends on the abstainers not drinking.'
  language: English with Zuni terms
  quote_policy: summarized
