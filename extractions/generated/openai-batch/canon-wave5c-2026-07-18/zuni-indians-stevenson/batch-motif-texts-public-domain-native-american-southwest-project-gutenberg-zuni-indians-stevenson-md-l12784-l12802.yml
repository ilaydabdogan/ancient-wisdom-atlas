canonical_text:
  quote: The Sha'lako festival is the great autumn celebration
  summary: The passage describes a meal-related ceremony in which food wrapped in
    corn husks is given to the man who will personate Sha'lako and to his fellow,
    then carried to the river and deposited for the Kok'ko A'wan, the Council of the
    Gods. It then characterizes the Sha'lako festival as a major autumn celebration
    marked by extensive feasting, hospitality to visitors, and the presence of Navajo
    guests whom the Zunis often regard as unwelcome.
  language: English
