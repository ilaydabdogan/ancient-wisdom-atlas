canonical_text:
  quote: ''
  summary: The passage describes the Little Fire fraternity and its Cimex branch,
    including a schism narrative, periodic fire displays connected with the lighting
    of the first fire by the Sun Father, and detailed altar and dry-painting arrangements.
    It then describes part of a four-day initiation ceremonial, including chamber
    decoration, prayer plumes, meal sprinkling, ritual objects, and an embellished
    altar with cloud, celestial, animal, lightning, rain, and serpent imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Little Fire organization is described as having many members, including
    wealthy pueblo members; Nai'uchi is identified as the fraternity's warrior and
    a leading medicine man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Little Fire fraternity's most elaborate fire display is said to occur
    once in four years, connected with the lighting of the first fire by the Sun Father
    according to Hopi belief; because of a division, members participate in the great
    fire dance only once in eight years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A schism in the fraternity is attributed to a man and woman whose conduct
    was censured; the man stayed with the parent fraternity and the woman joined the
    new body, later named Cimex after its chamber was found infested with cimex.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Cimex altar includes a medicine bowl on each side of a meal line, a prayer-meal
    basket south of the line, and a large shell on the meal line.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Cimex dry painting shows bears of the four regions, with the western bear
    followed by her cub; the green ground is said to represent the vegetation of the
    world, and borders and a blocked circle denote cloud houses of the four regions
    and of the world.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The initiation into o'Naya'xakia is described as a four-day ceremonial of
    the Little Fire fraternity and as one of its most elaborate ceremonies apart from
    the quadrennial ceremonial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the first day, the ceremonial chamber wall is decorated with a blue frieze
    edged with black cloud symbols, the north wall has a blue-green cougar painting,
    the altar is arranged, and prayer plumes are prepared for Beast Gods and deceased
    fraternity members.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the night ceremony, each arriving member is greeted, removes moccasins,
    advances to the altar, sprinkles meal, and hands his or her mi'li to an officer
    who places it by the altar.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fully embellished altar has carved and painted cloud-symbol tablets, faces
    of the Sun Father and Moon Mother, Awiyalatopa, lightning-makers with a dragonfly
    below, morning and evening stars, painted cougars, and a carved rattlesnake.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Principal objects listed near the altar include corn, giant yucca, an eagle
    dry painting, medicine bowls, prayer-meal baskets, bowls for ground medicine,
    food offerings, arrow points, crystals, plume offerings, a warrior pouch, bear's-foot
    skin, animal and cut-stone fetishes, and flutes.
  category: object
  evidence_refs:
  - ev:10
