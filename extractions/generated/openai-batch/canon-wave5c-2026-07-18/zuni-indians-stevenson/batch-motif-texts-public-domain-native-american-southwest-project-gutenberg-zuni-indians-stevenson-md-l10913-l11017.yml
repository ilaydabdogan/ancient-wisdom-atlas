canonical_text:
  quote: ''
  summary: A ceremony segment describes distribution of corn, burial of plume offerings
    for deceased A'shiwanni, the Mu'luktiikia bringing and planting spruce trees,
    preparation and entry of female dancers, ya'pota personifying the Great Father
    of corn with corn and spruce regalia, processional dancing with hla'we while meal
    is cast, songs asking Sun Father to embrace Earth Mother so she may yield fruits,
    and women passing mi'li before dancers' mouths so the dancers draw breath from
    it.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn described as blessed by the gods is distributed to several participant
    groups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kla'kwemosi deposits four tc'likinawe in a northern excavation, and the
    Shi'wanni of the Nadir deposits four in a southern excavation to the deceased
    A'shiwanni; the plumes are covered with earth and traces of the excavations are
    obliterated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mu'luktiikia reappear through the eastern covered way with four spruce
    trees, each carried by two of the gods or god-personators.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One spruce tree is placed midway in front of the ham'pone, and three are placed
    at the south end while the Mu'luktiikia dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After leaving the plaza by the west entrance, the Mu'luktiikia go toward Ko'thluwala'wa;
    the passage states that in reality they remove the regalia of the gods they personate
    near a river bend, and two men bring back masks and paraphernalia hidden under
    blankets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Female dancers remain in the house of the Shi'wano'kia until needed, then
    four for each side are led through the eastern covered way and dressed by members
    of their respective choirs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ya'pota personifies A'wan tii'Vhu, identified in the passage as Great Father
    of corn, and is dressed with items including a white embroidered kilt, fox skin,
    a concealed perfect ear of corn, spruce twigs, eagle plumes, white paint, moccasins,
    beads, and bells.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each dancer, including ya'pota, holds a hla'we in each hand, and the dancers
    proceed in file to the plaza led by an A'wan mosono'kk!a who throws meal in a
    line before her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dancers form facing east, then form in file facing south, and repeat these
    movements with occasional turns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The songs of the 'Hla'hewe are described as entreating Sun Father to embrace
    Earth Mother so that she may give the fruits of her being.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Five women in black dresses and blanket wraps pass a mi'li before each dancer's
    mouth, and each dancer draws a breath from it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the dance, the hla'we are received by the mi'laiilapo'na, and the A'wan
    mosono'kk!a lingers briefly, dances slowly back facing east, and deposits her
    hla'we in a basket.
  category: sequence
  evidence_refs:
  - ev:7
