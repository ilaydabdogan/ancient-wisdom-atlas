canonical_text:
  quote: ''
  summary: A Zuni guide identifies a sacred Kia'nakwe ruin, fears divine punishment
    for visiting without proper permission, and points out springs and a game corral
    associated with Ku'yapalisa/Cha'kwena. He then presses to reach the salt lake,
    described as the Salt Mother, performs prayer-meal rites at first sight of the
    volcanic peak called the home of the Gods of War, and the passage describes the
    salt lake as a shared salt source, sacred mother, and neutral refuge for several
    tribes.
  language: English
  quote_policy: summarized
