canonical_text:
  quote: ''
  summary: 'Ethnographic description of portions of a Shu''maakwe initiation ceremonial:
    evening assembly in a ceremonial chamber, removal and return of offerings, food
    offerings to gods, choir music, Sai''apa god personation dances, prayers and inhalation
    at the altar and fetishes, second-day addition of masks to the altar, a returning
    woman''s meal-and-plume rite, and a circle dance whose break is explicitly described
    as a road or passageway of life.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members gather in the ceremonial chamber in the evening near a low fire; women
    entering take seats on the north ledge.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deputy a'kwamosi and another officer take corn-husk offerings from behind
    the altar, and a warrior carries food from near the altar to the river to offer
    it to the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A youth distributes gourd rattles to the choir, and the choir begins singing
    with rattle and pottery-drum accompaniment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young man personating one of the Sai'apa gods dances in the center of the
    floor, stamping, spinning, balancing on one foot, and at times standing before
    the altar to inhale the sacred breath of the fetishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the first dance, women sprinkle meal and inhale sacred breath before
    the altar; men sprinkle the altar, pray, and the fraternity adjourns for the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the second day masks and other paraphernalia are completed; additional
    objects are placed on the altar, three masks are deposited before it, and other
    masks are covered with a white embroidered blanket on the ledge behind the altar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the second night the director, deputy, a warrior, other officers, four
    novices, women, girls, the Great Mother, and the choir occupy specified places
    in the chamber.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the first stanza of the second-night song, two men carry away food placed
    before the altar to offer it to the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman of the fraternity returns after absence, removes her moccasins, receives
    meal from each of the four novices, wraps it in a husk package, receives a prayer
    plume from her fraternity father, and goes to Ku'shilowa to plant plumes and sprinkle
    meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the second-night dance, a circle of twenty dancers moves from left
    to right; the passage states that a break in the circle is symbolic of the road
    or passageway of life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two young men who are to personate Sai'apa gods stand in the center of the
    circle, remove their clothing, fasten buckskin fringes tipped with conical tin
    around their waists, and dance back and forth while the circle moves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the circle dance, dancers pass to the altar and inhale the sacred breath
    of life; later, Sai'apa personator dancing continues with balancing, jumping,
    hopping, and cries, and a warrior, an aged woman, and two girls participate in
    related dance movements.
  category: sequence
  evidence_refs:
  - ev:7
