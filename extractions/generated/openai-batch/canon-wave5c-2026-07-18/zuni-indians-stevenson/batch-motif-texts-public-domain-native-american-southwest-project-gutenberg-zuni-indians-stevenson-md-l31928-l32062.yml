canonical_text:
  quote: ''
  summary: 'The passage describes portions of an A''pi''tlashiwanni ceremonial sequence:
    dressed participants process from a chamber to the plaza, a pole with a scalp
    attached is raised, prayers and dances occur around the pole, later dances involve
    east-west groups and named representatives, Eagle clan members prepare ceremonial
    food, a single-file dance is compared to a great serpent and said to be for destroying
    the enemy, and shell and turquoise are prepared as offerings to the Gods of War.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants are described with white embroidered kilts tied across the shoulders,
    precious-bead necklaces, native blue yarn around the wrists, and in some cases
    white blankets bordered in blue and red.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The 'si'hakoshona'kwe and their fellows leave the chamber abreast, remove
    cedar twigs from over the doorway, and carry cedar twigs, bows, and arrows in
    their left hands while holding a single arrow in the right hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A procession forms two lines as it emerges from the chamber; the o'tailasho'nakwe
    dance back and forth between the lines to song and drum music.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Several girls aged about six to ten join the procession on the way to the
    plaza after being placed there by their mothers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the plaza, a pole with a scalp attached is raised by the pa'mosona and
    his vice; while the scalp is tied to the pole, the elder brother Bow priest calls
    to people on housetops and in the plaza to join the dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the pole is placed, the pa'mosona and his aid stand close by it and
    pray.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The party from the ceremonial chamber dances around the scalp pole in two
    concentric circles for about an hour, with the o'tailasho'nakwe dancing between
    them and the drummer standing near the pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A circle around the pole is gradually enlarged as people of both sexes and
    all ages join; the dancing continues through the night and is the only plaza dancing
    on the sixth day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: On the seventh day, pu'panakwe with pottery drums group on east and west sides
    of the large plaza, one party representing Vyuyewi and the other Ma'sai'lema.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Two ha'shiya dance before each choir, and the pu'mokiakianawe, described parenthetically
    as hatchet-bearers, also dance in the plaza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Members of the Eagle clan assemble to prepare corn meal and flour; the corn
    and wheat for the ceremonial are described as the gift of the victor's father,
    who belongs to the Eagle clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Girls and younger women grind and remove corn from the cob, crones toast corn
    after coarse milling, and the work is accompanied by a drum and five young male
    singers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After sunset, corn meal and flour are carried to the victor's house, where
    each grinder receives a bowl of stew or basket of bread from the hostess.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The o'tailasho'nakwe dance before the elder brother Bow priest's house, around
    the village, and in the plaza, moving in single file like a great serpent; the
    writer calls it the meander dance and says it is for destruction of the enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: On the ninth day, the elder brother Bow priest grinds bits of shell and turquoise
    beads to be offered to the Gods of War.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The pa'mosona and vice pray over drums; one drum is opened and placed in the
    northeast corner of the room, while another is carried to the plaza.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Eight girls, four for each side, gather in two houses to prepare for the pu'mokiakianawe
    dance, with necklaces and other ornaments added to their apparel.
  category: action
  evidence_refs:
  - ev:7
