- id: obs:8
  text: The passage says that illnesses not caused by wounds and not readily yielding
    to treatment may be attributed to a foreign element thrust into the body.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Worshiped animals are described as healers who act through the agency of theurgists.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Theurgists are described as having no power in themselves against sorcery
    and needing to pass under the influence of the Beast Gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ceremonial action before the altar and animal fetishes is said to induce the
    spirit of the animal to enter the theurgist's body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The afflicted part may be discovered by holding a quartz crystal before the
