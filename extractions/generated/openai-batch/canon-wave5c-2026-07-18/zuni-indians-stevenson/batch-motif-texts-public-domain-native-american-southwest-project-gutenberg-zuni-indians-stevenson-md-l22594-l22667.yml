canonical_text:
  quote: ''
  summary: The passage recounts a lightning-strike incident in which several people
    recovered, Catalina was treated with powdered wood from a lightning-struck tree
    and an arrow point, and the group fasted, washed, deposited prayer plumes to the
    lightning-makers, and organized the Struck-by-lightning fraternity. It then describes
    Zuni explanations of illness, animal-associated theurgic healing, extraction of
    disease by sucking, initiation into Mystery medicine, and dry paintings used in
    medicine practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several people returned to consciousness after being stunned, but Catalina
    and the Xavaho guest were exceptions at first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Xavaho guest had a badly burned body, lived, and lost his reason.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who had been struck by lightning in the previous year came to Nutria
    and administered medicine to those who had been stunned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Catalina was restored using powdered charred wood from a tree struck by lightning,
    with an arrow point bound over the powder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The group returned to Zuni, stayed four days in Catalina's lower room, and
    observed a strict fast with only a little prayer meal in water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the fourth night, the heads of the afflicted were washed in yucca suds
