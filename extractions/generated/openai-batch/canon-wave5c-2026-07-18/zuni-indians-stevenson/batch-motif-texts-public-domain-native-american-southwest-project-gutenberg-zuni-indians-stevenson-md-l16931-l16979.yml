  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: As a rule, women walk little during menstruation and are not expected to bring
    water from the well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During menstruation women employ themselves with indoor work, usually weaving
    or grinding.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women sit or kneel over heated sand spread thickly on the floor, with robes
    and blankets arranged to cover the sand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A heated stone is worn in the belt and hot juniper tea is frequently drunk
    during menstruation.
  category: action
  evidence_refs:
