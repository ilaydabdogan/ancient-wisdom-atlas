  text: The passage states that Zuni marriage usually occurs at very young ages and
    that girls frequently marry before puberty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a girl is not married when she reaches womanhood, her mother informs the
    paternal grandmother, or the paternal aunt if the grandmother is not living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The paternal grandmother returns with the mother, and the girl accompanies
    the grandmother to her dwelling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the grandmother's dwelling the girl labors all day grinding corn.
  category: action
  evidence_refs:
