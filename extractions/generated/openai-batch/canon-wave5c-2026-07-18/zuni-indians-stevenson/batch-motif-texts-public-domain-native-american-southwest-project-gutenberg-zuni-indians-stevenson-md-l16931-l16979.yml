- id: obs:5
  text: In the evening the girl returns home carrying a bowl of meat stew prepared
    and presented by the paternal grandmother, who returns with her.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports a belief that hard work at the dawn of womanhood prevents
