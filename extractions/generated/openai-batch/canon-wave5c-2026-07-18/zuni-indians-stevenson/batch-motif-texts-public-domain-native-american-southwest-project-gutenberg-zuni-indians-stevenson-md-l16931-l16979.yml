canonical_text:
  quote: ''
  summary: 'The passage describes Zuni puberty and menstruation customs: an unmarried
    girl reaching womanhood is taken to her paternal grandmother''s dwelling to grind
    corn all day and returns with stew; the passage explains beliefs about labor and
    menstrual pain, ordinary menstrual practices involving restricted movement, indoor
    work, heated sand, heated stone, and hot teas, and a guarded root medicine said
    to suspend menstruation.'
  language: English
  quote_policy: summarized
