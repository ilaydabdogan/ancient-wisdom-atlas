canonical_text:
  quote: ''
  summary: Ethnographic prose describes Zuni crop varieties, spring-fed irrigation
    at Ojo Caliente, ditch management, field guarding, seasonal residence at farms,
    harvesting, grain storage, famine reserves, and women's gardens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn occurs in many colors, beans show similar variety, and corn and wheat
    are raised in Nutria, Pescado, Ojo Caliente, near Zuni, and elsewhere.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Remote fields are often not irrigated, and corn is planted in clusters to
    improve development in arid land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each of the three farming districts is irrigated from a spring; To'seluna
    spring at Ojo Caliente is described as deep, clear water at the base of a low
    limestone mountain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The spring is said to have water rising from the earth with enough force to
    keep a person from touching bottom, and an anecdote reports a loaded burro sinking
    and disappearing there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two ditches extend from To'seluna spring, and the main ditch may be dammed
    with earth banked between tree boles to send more water into the higher ditch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The master of the ditch performs damming at the request of those needing water
    from the higher ditch; the governor settles rare water disputes and is responsible
    for fair distribution.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1904, men working under the master of the ditch made a temporary ditch
    to water a woman's elevated garden, requiring both main ditches to be dammed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Melons, squashes, and gourds are grown near cornfields; ripening fields are
    guarded with rude shelters and scarecrows because of ravens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many Zunis live in farming-district houses during the summer and remain into
    autumn; some live permanently at farms while still attending ceremonies in Zuni.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: After harvest, corn is brought home, spread on roofs, husked, and stacked
    carefully in storage rooms; husking is described as a social frolic.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wheat is harrowed, threshed by animals, winnowed in baskets, and stored in
    stone-slab bins or large pottery jars.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A storage room may contain both sacred objects and objects of little or no
    value.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Zunis aim to keep a year's grain supply untouched as protection against
    crop failure; starvation has sometimes led them and neighboring tribes to seek
    aid.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Women raise onions, chillis, amaranthus for coloring wafer bread, and condiment
    herbs in small protected gardens.
  category: action
  evidence_refs:
  - ev:10
