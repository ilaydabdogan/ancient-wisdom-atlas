canonical_text:
  quote: ''
  summary: The passage describes preparations for the Zuni Sha'lako festival, including
    swept streets, ritual excavations, household fires, spectators, masked god personators,
    restricted mask preparation, punishments for ritual violations, and a 1879 ceremony
    in which Shu'laawi'si and other Council of the Gods personators deposit prayer
    plumes and receive meal offerings at He'patina, a shrine described as symbolic
    of the Middle of the world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the festival day, streets are swept and excavations are made in different
    parts of town and under the ladder way of each house to be consecrated; loose
    earth forms a mound beside each opening, and a stone slab is placed west of each
    excavation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fires are blazing in every house, and the narrator states that this denotes
    an important occasion because firewood is usually used economically.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: House tops are crowded with dressed men and women from Zuni and other pueblos,
    while Navahos gather on horseback south of the village to see the gods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The personators of the Council of the Gods and the Sha'lako leave Zuni at
    the rising of the morning star for A'kohanna ti'nawki, where a fire is lighted
    and prayers and songs are rehearsed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Masks and paraphernalia are conveyed under blankets; masks are stripped of
    plumes when not in use, repainted before being worn, and prepared solemnly with
    only initiated persons present.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: If someone enters while masks are being prepared, the person is to extend
    each ankle and arm in sequence to be struck with bunches of giant yucca.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that unpunished viewing of Sha'lako masks in preparation,
    Navahos pressing too near, or a personator speaking to a woman may be understood
    as reasons why a Sha'lako falls while running.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Sha'lako personator must not speak to a woman from the time he enters Zuni
    until he leaves; if he does, four Sa'va'hla each give him four strokes with giant
    yucca.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The festival takes place in November, on varying days, and the ritual is said
    to vary little from year to year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Shu'laawi'si, preceded by his ceremonial father, goes to He'patina, described
    as symbolic of the Middle of the world, and deposits prayer plumes in the lower
    chamber of the shrine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ceremonial father carries a tray of prayer plumes, a mi'li, and a sacred
    meal basket, and sprinkles meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Shu'laawi'si is described as black-bodied with colored spots and a similarly
    decorated mask, wearing or carrying a seed-filled fawn skin, rabbits and rats,
    necklaces, prayer plumes, and an unlighted cedar-fiber firebrand.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Shu'laawi'si sprinkles meal into the six excavations, recrosses the river,
    and joins the other Council of the Gods personators at He'patina.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At He'patina the Council of the Gods is met by A'shiwanni, Ko'mosona, Ko'pekwin,
    and two Ko'pi'lashiwanni, who pray and sprinkle the gods with meal before the
    god personators deposit prayer plumes in the lower apartment of the shrine.
  category: action
  evidence_refs:
  - ev:7
