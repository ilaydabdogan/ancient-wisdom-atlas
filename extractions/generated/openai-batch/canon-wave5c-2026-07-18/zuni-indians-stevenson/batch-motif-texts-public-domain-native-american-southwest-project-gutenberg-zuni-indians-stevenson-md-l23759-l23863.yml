canonical_text:
  quote: ''
  summary: The passage describes ceremonial images, altars, songs, wall paintings,
    hunting fetishes, sacred shooting targets, deer-trapping procedures, animal impersonation,
    prayer plumes, and a prayer of thanksgiving associated with the 'San'iakiakwe
    / Hunters fraternity.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An initiation painting is described as a white disk with black concentric
    circles blocked in white, a central spread eagle, surrounding game, and scattered
    corn grains; the circles are stated to symbolize the house of the clouds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fraternity has a tablet altar similar to those of other fraternities and
    a second altar capped with eagle-tail plumes.
  category: object
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:3
  text: Songs of the order invoke gods for power over game, give thanks after game
    is captured, and address animals and birds that prey upon game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ceremonial chamber extends north and south; on ceremonial occasions the
    tablet altar is set at the north end.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Permanent wall pictures show cougar, gray wolf, lynx, coyote, and certain
    birds pursuing or killing game animals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hunting fetishes are individual property, pass from father to son, and are
    carried by the hunter; different animal fetishes are used for different kinds
    of game or protection.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hunter carrying an owl wing feather takes it into his mouth, expectorates
    toward discovered game, and advances slowly; success is linked in the passage
    to having a good heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arrows are shot into a vertical fissure in an inaccessible rock on the west
    wall of To'wa yal'lanne, Corn mountain, to insure success in the hunt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A sacred blue-gray deer pictograph on a mesa face is shot at by passing hunters;
    success is said to be inevitable when an arrow strikes the mark.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Zunis say their ancestors made the sacred deer pictograph during migrations
    from the far northwest when the world was new.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: When skins are needed for ceremonial masks or fetishes, game must be smothered
    rather than shot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Each huntsman places five prayer plumes in each deer trap, three for Kok'ko
    A'wan and two for ancestors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two hunters wear painted shirts and deer-head skins, and imitate deer as closely
    as possible, including browsing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If a trapped deer is not killed by the fall, men smother it by pressing the
    nostrils while offering a prayer to A'wohawil'ona thanking rains, seeds, and the
    mysteries or sacred breath of life.
  category: sequence
  evidence_refs:
  - ev:8
