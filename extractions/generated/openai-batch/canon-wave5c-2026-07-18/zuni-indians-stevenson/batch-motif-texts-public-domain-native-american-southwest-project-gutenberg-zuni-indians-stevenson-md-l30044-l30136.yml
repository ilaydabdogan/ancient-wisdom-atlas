canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial sequence involving the elder brother
    Bow priest, warriors, dancers, novices, medicine grinders, fire, medicine water,
    striking with rods and yucca, a bear-foot skin, prayers, baptism-like washing,
    food placed before an altar, and a later chamber scene with masks of anthropic
    gods suspended on a cord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother Bow priest orders an old woman guarding the fire to stir
    the embers, removes regalia, and places items beside or before the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother Bow priest puts his right arm into live coals, lights bunches
    of corn husks, and scatters sparks over men, women, and babies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women are struck on faces and bodies with burning husks, and the elder
    brother Bow priest asks others to whip him with the burning husks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elder brother Bow priest puts burning husks into his mouth and chews them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A rod is wetted with medicine water; people anticipating strokes have their
    bodies bathed with the water; the elder brother Bow priest and a man exchange
    blows with rods, and one rod breaks into three pieces.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second warrior brings yucca baccata and strikes several men and the elder
    brother Bow priest, who receives blows across extended arms and chest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After each yucca blow, the man holding the yucca covers his mouth and gives
    an animal-like call.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The elder brother Bow priest places a bear's foot skin over his right hand
    and runs the claws up and down the body of his brother warrior.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The dance continues, then the elder brother Bow priest and associate warrior
    stop dancing and put on cotton shirts, trousers, and head-kerchiefs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Male and female novices leave the chamber under an officer's guidance to offer
    prayers to the Sun Father at sunset.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two women carry large bowls of water into the chamber at sunset; a third woman
