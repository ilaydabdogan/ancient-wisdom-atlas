canonical_text:
  quote: ''
  summary: A ritual procession carries fetishes, a shell, idols, and paraphernalia
    of the elder and younger Gods of War into the ki'wi'sine. The objects are placed
    on a meal painting, songs are sung, and overnight ceremonies honor the Gods of
    War so they may intercede with rain-makers for rain. At sunrise the idols are
    taken to their respective homes, arranged with their paraphernalia, and approached
    with prayers, meal sprinkling, food, and bead offerings. Footnotes describe the
    pa'ettone fetishes, the elder God of War idol and its cloud symbolism, objects
    made for a facsimile display, and Nai'uchi's healing practice during the idol's
    stay in the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The procession includes a priest of the pa'ettone carrying his fetish, a priest
    of the su'hlan'na carrying a shell, the Kia'kwemosi carrying his et'tone, Deer
    clan men carrying the elder God of War idol and paraphernalia, and Bear clan men
    carrying the younger God of War idol and paraphernalia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder and younger brother Bow priests walk at the right side of the file
    and each whirls a rhombus while proceeding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After entry into the ki'wi'sine, the fetishes and idols are placed on a meal
    painting, with the pe'kwin depositing the idols and paraphernalia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The A'pi'liishiwanni are present as a body and sing a song identified as one
    sung after sunset in the closing scene of the scalp ceremony.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ceremonies in the ki'wi'sine continue through the night, and the Gods of War
    are honored so that they may intercede with the rain-makers for rains to fructify
    the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At sunrise the elder and younger brother Bow priests carry the idols to their
    respective homes, each accompanied by a warrior bearing games and paraphernalia;
    each idol is placed at the west end of a large chamber with paraphernalia arranged
    about it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the elder brother Bow priest and associates place the idol and belongings
    in position, they pray and sprinkle meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder brother Bow priest's family and many outside visitors pray to the
    gods, make offerings of precious beads, and sprinkle sacred meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A little food is deposited south of the idol before the elder brother Bow
    priest breakfasts with his family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The pa'ettone are described in a note as sacred fetishes of the A'pi'liishiwanni
    that protect them from the enemy.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note states that the old idol of the elder God of War came from a shrine
    on To'wayal'linne, Corn mountain, and that its white top with black rectangles
    signifies a white cloud cap with black rain clouds, called the house of the clouds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note states that tablets, staffs, a war club, te'likinawe, a feather bow
    and arrow, and games were made by named ritual or clan participants to create
    a facsimile of the elder God of War idol as it appeared in the elder brother Bow
    priest's house at winter solstice.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: During the idol's stay in the house, Nai'uchi treats patients by pretending
    to extract the cause of disease, wrapping the ejected material in a husk, and
    carrying it from the house; the note says this practice is connected with his
    membership in other esoteric fraternities rather than with the Bow priesthood.
  category: action
  evidence_refs:
  - ev:9
