canonical_text:
  quote: ''
  summary: At the close of the ha'shiya dancing, the si'hakoshona'kwe return to the
    ceremonial chamber. Cedar twigs with scalps are placed over the door before they
    enter. They are received by the A'pi"lashiwanni, smoke tobacco, then drum and
    sing. A newly appointed pa'mosono"kia arrives in ordinary dress, followed by two
    dancing girls in black gowns, who are afterward elaborately dressed; the passage
    breaks off while naming who dresses them.
  language: English with Zuni terms
