literal_observations:
- id: obs:1
  text: After the birth, doctresses and the paternal grandmother continued attempts
    to produce respiration by pressing the nostrils, blowing into the mouth, manipulating
    the chest, moving the arms, and keeping warm cloths around the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A faint sign of life caused rejoicing, but another hour passed before respiration
    gave real hope for the child's life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boiled pinon gum was chewed, mixed with mutton grease, rolled on the stone
    floor, and placed around the umbilicus with carded wool over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The infant's wrapped umbilical cord was drawn through an opening in fluffed
    carded wool, and the abdomen was covered with warmed cotton cloth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water was dropped on the infant's scrotum, and the doctress rubbed and manipulated
    the genital area; the nose, mouth, and eyes were also manipulated.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The infant was wrapped in cotton cloth and a small blanket held in place with
    yucca strings over the shoulders, breast, and lower legs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young mother stood over a urinal, held a heated stone in place with her
    belt, sat on a ledge, and later drank unsweetened commercial tea.
  category: action
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:8
  text: Two women removed a sheepskin containing lochial discharge; the maternal grandmother
    covered the discharge with sand, swept it into a cloth, and carried it out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The father-in-law and mother-in-law brought damp sand; a doctress heated sand
    with hot stone slabs and shaped it into a mound with depressions for the infant's
    body and head and a ridge for the neck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two ears of corn had been brought by the mother-in-law, but neither was a
    perfect ear; one had three plumules described as symbolizing fecundity, and the
    other was a single ear.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The single ear of corn was held pointing upward behind the infant's head by
