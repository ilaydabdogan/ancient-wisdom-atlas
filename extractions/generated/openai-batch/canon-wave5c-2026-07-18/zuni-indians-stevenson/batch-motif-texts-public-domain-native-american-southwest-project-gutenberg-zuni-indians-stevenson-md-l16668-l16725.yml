  summary: The passage describes post-birth care for a newborn who initially does
    not breathe adequately, including resuscitation efforts, umbilical dressing with
    pinon gum, handling of the infant's body, wrapping, postpartum care for the mother,
    removal of birth discharge, preparation of a heated sand bed, use of corn ears
    and prayer meal, and a prayer to a named recipient whose name appears truncated
