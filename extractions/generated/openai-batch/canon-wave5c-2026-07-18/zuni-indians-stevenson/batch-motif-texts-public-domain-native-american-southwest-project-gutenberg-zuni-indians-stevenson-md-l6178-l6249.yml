canonical_text:
  quote: ''
  summary: The passage describes preparation of ritual idols and paraphernalia for
    the elder and younger Gods of War, including clan-specific responsibilities, materials,
    offerings, watchers, and prayers. It also recounts an explanatory saying in which
    two gods identify deer and bear as their fathers, and describes selection of the
    sacred-fire maker for the new year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Preparation of certain idols and games is confined to the Deer and Bear clans,
    with an explanation attributed to the elder brother Bow priest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the explanatory saying, two gods travel about the country, and the elder
    says the deer is his father while the younger says the bear is his father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Images are carved from po'la at this season; for the scalp ceremonial they
    must be made from lightning-struck ii'shekia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seven members of the A'pi"lashiwanni are assigned by the elder brother Bow
    priest to make paraphernalia for the elder God of War, and seven are assigned
    by the younger brother Bow priest for the younger God of War.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Warriors make a tablet, staff, shield, serrated projection with plumes, miniature
    weapons, war club, and plume stick for the idols.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: All varieties of seeds are placed in a cavity before the serrated projection
    is inserted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The plumes attached to the projection are said to carry valuable prayers to
    the gods for rain.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The completed idols are decorated with yucca fiber, yucca cord, raw cotton,
    cotton cord, and an abalone shell.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: When completed, the idols are stood facing east near the north end of the
    room where they were fashioned.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Deer clan man and a Bear clan man act as sentinels or special watchers over
    the idols until they are taken to the He'iwa ki'wi'sine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Many people offer prayers and sprinkle the gods with meal; members of the
    A'piakishiwanni leave a te'likinane in the belt of each idol.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The maker of the sacred fire of the new year is chosen by the Kia'kwemosi
    and notified by the Ko'pekwin shortly after sunrise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Ko'pekwin carries prayer meal wrapped in corn husks, clasps the selected
    person's hands, delivers a message, and prays.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The office of fire-maker is filled alternately by a member of the Badger clan
    and a child of that clan.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The fire-maker often, but not always, becomes the personator of the god Shu'laawi'si
    in the following autumn's Sha'liiko ceremonial.
  category: relationship
  evidence_refs:
  - ev:11
