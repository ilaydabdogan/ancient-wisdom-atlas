canonical_text:
  quote: ''
  summary: After an arrow-shot representing enemy destruction, scalp fragments are
    fastened to a long pole and the pole is planted in the plaza center. The pole,
    victor, and elder brother are placed under touch restrictions and guarded. Bow
    priesthood members and others circle the village four times in coil fashion, feast
    in a ceremonial chamber, and the populace dances around the scalp pole through
    the night for twelve nights. A note explains the coil as a Zuni seal associated
    with A'shiwi passage and land ownership.
  language: English
  quote_policy: summarized
