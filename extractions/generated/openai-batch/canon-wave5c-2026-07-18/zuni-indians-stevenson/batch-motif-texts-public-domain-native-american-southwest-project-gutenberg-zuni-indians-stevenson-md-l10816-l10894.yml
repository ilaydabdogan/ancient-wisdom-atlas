canonical_text:
  quote: ''
  summary: A rain-ceremony passage describes choirs, flutists, clan-qualified women
    leaders, mi'laiilapo'na attendants, ritual seating and placement of baskets and
    te'likinawe, an overnight vigil, sunrise dressing of eight kia'potiikwe dancers,
    two plaza dances led by A'wan mosono"kla who cast meal, and a subsequent appearance
    of eight Mu'luktiikia who dance, drop colored corn of the six regions, and leave
    before A'shiwanni gather and deposit corn into two square excavations.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hla'hewe and Sho'ko'we choirs each sing, the Sho'ko'we choir is accompanied
    by flutists, and after each song a prayer is repeated aloud.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the songs, participants take seats while the mi'laiilapo'na keep their
    places on robe- or blanket-covered boxes or chairs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each side has an A'wan mosono"kla seated in front with a deputy or younger
    sister behind her; the 'Hla'hewe side leader must belong to the Dogwood clan,
    and the Sho'ko'we side leader must belong to the Corn clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mi'laiilapo'na on the 'Hla'hewe side place baskets and te'likinawe to the
    left, while those on the Sho'ko'we side place them to the right; additional baskets
    and te'likinawe are set in front of the ham'pone and midway.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: After the songs all remain quiet until morning and are watched by the elder
    and younger brother Bow priests to prevent sleeping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At sunrise eight 'kia'potiikwe, after sleeping two nights in the house of
    the Shi'wano'kia, come to the ham'pone and are dressed by members of the two choirs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The 'kia'potiikwe are dressed with mi'ha garments, white buckskin moccasins
    with black soles, necklaces, blue and red yarn wrist ornaments, loose hair with
    bangs over the face, and a headpiece called 'hlelh'ponc.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each 'kia'potiikwe receives two 'hla'we, is led to the plaza by the 'Hla'hewe-side
    A'wan mosono"kla who throws meal, faces east while dancing, and dances to the
    'Hla'hewe choir.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the first dance, each dancer returns, hands the 'hla'we to a mi'laiilapo'na,
    receives two 'hle'we, goes around to the Sho'ko'we side, and is led by the Sho'ko'we-side
    A'wan mosono"kla who sprinkles meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When dancing for the Sho'ko'we side, the 'kia'potiikwe have additional music
    from the flutists.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the dances, the girls are stripped of their regalia and return home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Eight Mu'luktiikia, described as certain anthropic gods, arrive by the eastern
    covered way after the Ko'mosona has ordered them to appear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Mu'luktiikia dance in the center of the plaza, turn first one way and
    then another, drop grains of corn of the colors of the six regions from white
    embroidered sashes, and disappear by the western covered way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The A'shiwanni gather the corn, and each shi'wanni drops six grains, one of
    each regional color, into each of two square excavations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The north excavation was made by the Kia'kwemosi and the south excavation
    by the pe'kwin in the early morning.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: A note states that the foremost woman on the north side represents the elder
    sister Yellow Corn maiden, and the foremost woman on the south side represents
    the younger sister Blue Corn maiden.
  category: relationship
  evidence_refs:
  - ev:4
