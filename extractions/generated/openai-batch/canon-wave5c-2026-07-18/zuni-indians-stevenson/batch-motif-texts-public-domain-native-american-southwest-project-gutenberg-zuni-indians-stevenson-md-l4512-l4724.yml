canonical_text:
  quote: ''
  summary: 'A ritual-history passage recounts an ancestral route: Kiiiklo looks to
    the six regions, sees roads, chooses the middle road, and calls for singing. The
    text then lists many named stopping places, especially springs and water places,
    each followed by the formula of getting up and moving on. Notes identify the itinerary
    as the travels of the ancients from Ko''thluwala''wa to I''tiwanna and as part
    of the A''shiwi quest for the Middle place. Additional notes explain place-name
    origins involving stolen rain plume wands, sacred springs, and Sha''lako gods
    appearing through a spring.'
  language: English with Zuni terms and glosses
  quote_policy: summarized
