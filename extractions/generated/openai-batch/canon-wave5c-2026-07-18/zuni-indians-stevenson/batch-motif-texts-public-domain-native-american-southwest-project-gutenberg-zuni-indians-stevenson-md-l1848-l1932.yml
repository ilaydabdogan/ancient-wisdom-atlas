canonical_text:
  quote: ''
  summary: Pau'tiwa appoints 'Kiaklo to narrate to the A'shiwi the history of their
    coming into the world and their quest for the Middle place. 'Kiaklo announces
    that the ancestral gods will arrive and instructs the A'shiwi to build six chambers,
    one for each region. The gods arrive masked; their masks are examined and copied.
    A fraternity for personating the gods is organized, officers are appointed, the
    A'shiwi are assigned among the six chambers, and named groups of beings are distributed
    among directional chambers. A note states that male children must become members
    of the fraternity and receive initiation in a quadrennial dramatization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pau'tiwa, described as director-general of the Kok'ko, wants the A'shiwi to
    be personally acquainted with their gods and to learn about their coming to the
    world and later migrations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pau'tiwa chooses 'Kiaklo as narrator, and 'Kiaklo travels from Ko'thluwala'wa
    to I'tiwanna on the backs of the Kd'yemshi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: "'Kiaklo relates the history of the A'shiwi coming to this world and their
    quest for the Middle place, then announces that the ancestral gods will come in
    eight days."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: "'Kiaklo instructs the A'shiwi to build six chambers, one for each of the
    six regions, dedicated to the Kok'ko."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The A'shiwi build the six ki'wi'siwe before 'Kiaklo reappears; he visits each
    chamber, announces the coming of the gods, and departs by the western road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man of the Dogwood clan examines 'Kiaklo's mask and later makes a similar
    one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A first body of A'shiwanni and others gathers in the north ki'wi'sine to greet
