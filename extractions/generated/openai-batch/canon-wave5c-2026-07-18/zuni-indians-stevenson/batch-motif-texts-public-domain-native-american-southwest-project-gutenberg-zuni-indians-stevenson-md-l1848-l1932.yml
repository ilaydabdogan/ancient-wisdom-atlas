  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pau'tiwa's mask is examined by Kia'kwemosi of the Dogwood clan, who later
    makes a counterpart of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The director of the Ne'wekwe fraternity examines and copies the mask of A'wan
    ta'chu Ko'yemshi, and other members copy the remaining nine Ko'yemshi masks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A'wan ta'chu Ko'yemshi asks for officers for a fraternity by whom the gods
    should be personated, and Kia'kwemosi appoints men of Deer and Badger clans to
    named offices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The newly appointed Ko'mosona divides the A'shiwi among the six ki'wi'siwe,
    and masked beings and groups are assigned among the directional chambers.
  category: sequence
  evidence_refs:
  - ev:5
