canonical_text:
  quote: ''
  summary: The passage describes reported Shu'maakwe ceremonial features compared
    with Shumai'koli performances among the Mopi/Hopi, the transfer of Laguna Shumai'koli
    masks to Zuni custody, and a Zuni ceremony combining initiation of a woman and
    girl with the first bringing-out of those masks. It details chamber preparations,
    procession of masked gods from Ku'shilowa, spectators and novices awaiting them,
    meal scattering, charm handling, directional Shumai'koli and Sai'apa figures,
    doorway striking with burning brands, dancing, entry into the chamber, removal
    of masks, and a feast. The final lines introduce the Little Fire Fraternity and
    its four orders.
  language: English with Zuni/Hopi terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that some Shu'maakwe features were not observed by her at
    Zuni but were seen in Shumai'koli performances among the Mopi/Hopi, and that Zuni
    descriptions accorded with scenes observed in Hopi villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ya'ya male characters create amusement at sunset by grabbing men's wrists
    and separating a circle of dancers; women go home before the Ya'ya are put in
    blankets and dropped through a hatchway into a ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shu'maakwe director and an associate visited Laguna to receive six Shumai'koli
    masks after all people privileged to use them had died; the masks were wrapped
    and brought to Zuni on burros.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The described ceremonial has two stated occasions: initiation of a woman
    and a young girl into the fraternity, and first bringing-out in Zuni of the Laguna
    Shumai''koli masks.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the ceremonial chamber, six Shumai'koli and three Sai'apa masks lie
    on a large blanket north of the chamber, before the altar; regalia are arranged,
    men sing with a rattle, and a woman leader sits facing east.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman leader and charm-bearer proceed to Ku'shilowa; two Shumai'koli and
    two Sai'apa masks are carried there under blankets, and the passage states that
    these gods live in the east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Zuni spectators gather on house tops and streets; fraternity fathers and novices
    stand west of the ceremonial house entrance, with the men looking east and the
    woman and girl looking downward.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the procession, the female leader carries her mi'li and meal basket in
    her left hand and throws meal with her right; the charm-bearer follows, manipulating
