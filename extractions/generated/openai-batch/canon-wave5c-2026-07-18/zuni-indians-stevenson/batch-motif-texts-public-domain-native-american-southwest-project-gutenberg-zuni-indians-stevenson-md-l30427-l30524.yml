canonical_text:
  quote: ''
  summary: 'An ethnographic description of the Zuni Cimex fraternity sun dance: its
    four-year alternation with the Little Fire fraternity, a belief that original
    fire was a gift of the Sun Father, the collection and piling of juniper over an
    offering-filled excavation, preparation of coals, procession and attire of participants,
    sprinkling with medicine water, and the passage of dancers, including novices,
    through the coals.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonial is described as celebrated once every four years in March by
    the Little Fire and Cimex fraternities alternately; the passage also reports a
    belief that original fire was a gift of the Sun Father and was lit by the sun's
    rays.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fraternity convenes on March 2 and holds a four-night ceremonial; on the
    third day ten men bring juniper from woods south of Zuni and deposit it in the
    ceremonial chamber before it is carried out at the rising of the morning star.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A circular excavation with a smaller central excavation is made; prayer plumes
    and medicine are deposited in the smaller excavation and covered with earth before
    wood is piled in and over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wood pile is burned until coals remain; two Cimex members rake, scatter,
    beat, gather, brush, and pack the coals into a mound, after which the plaza is
    swept.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dancers arrive from the ceremonial chamber to the plaza in single file,
    led by a woman who stands immediately before the sprinkler.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:6
  text: The sprinkler is described with special clothing and ornaments; the passage
    explicitly says that a blue-green band on his kilt symbolizes the vegetation of
    the world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Male dancers carry large unpainted gourd rattles, eagle-wing plumes, and corn-husk
    packages of meal; the two novices carry red and black blankets described as gifts
    from their fraternity fathers and also carry quantities of prayer plumes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women dancers wear black dresses with white blankets bordered in red and blue,
    have red-colored eagle plumes tied to the forelock, and carry eagle-wing feathers
    and corn-husk packages of meal in the left hand.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men sing and shake rattles while the dancers circle the coal bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sprinkler approaches the coals and sprinkles them with medicine water
    from a bowl, using a feather wand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the sprinkler sprinkles a dancer, the dancer leaves the line, dances
    around the fire, sprinkles meal over the coals, jumps into the coals, dances briefly,
    and returns; the action is then repeated with the next dancer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says the two young novices appear especially ready to jump into
    the coals; the time spent in the burning bed varies, women remain for less time
    than men, and all dancers pass through the fire before retiring to the ceremonial
    chamber.
  category: sequence
  evidence_refs:
  - ev:8
