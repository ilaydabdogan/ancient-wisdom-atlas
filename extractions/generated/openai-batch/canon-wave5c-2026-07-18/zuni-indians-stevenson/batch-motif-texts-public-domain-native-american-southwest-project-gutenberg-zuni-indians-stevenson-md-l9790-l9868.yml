canonical_text:
  quote: ''
  summary: 'The passage describes the close of a ritual sequence: participants bathe
    with suds and drink consecrated water; the shi''wanni and associates remove, clean,
    wrap, and return fetishes and other objects; meal and pollen are cast into river
    water to go to Ko''thluwala''wa; some fetish owners depart; heads are bathed;
    a feast is served after a portion of food is cast into fire for ancestral gods.'
  language: English
  quote_policy: summarized
