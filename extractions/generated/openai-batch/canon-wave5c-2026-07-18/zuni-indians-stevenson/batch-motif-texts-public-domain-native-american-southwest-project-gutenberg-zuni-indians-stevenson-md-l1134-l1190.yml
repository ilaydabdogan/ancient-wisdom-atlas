canonical_text:
  quote: '"The Sun is our father."'
  summary: The A'shiwi encounter a hostile village after two scouts kill women by
    a stream. During an unsuccessful battle, Kow'wituma and Wats'usi ask Sun Father
    for replacement warriors. Heavy rain animates a mountain cascade, which in the
    sun's embrace bears twin children from foam. The diminutive divine twins identify
    Sun as father and Laughing water as mother, are asked to fight, and agree to join
    the A'shiwi against the enemy blocking the quest for the Middle place of the world.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The A'shiwi travel less than a day's journey from Ko'thlu wala'wa to the place
    later called Han'lipinkia, where smoke is seen in the distance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kia'kwemosi says the smoke indicates a village, and the Divine Ones send
    two members of the Ne'wekwe ti'kili to go ahead and seek a trail after the men
    initially refuse because they are fighting men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two dispatched men see two women washing buckskin on a stream bank and
    kill them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people of the village from which the smoke came learn of the killing,
    become enraged, attack the A'shiwi, and fight them for two days without the A'shiwi
    succeeding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kow'wituma and Wats'usi grow weary from fighting and ask Sun Father to send
    two others to replace them as warriors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sun Father causes heavy rain; the mountain-side cascade changes its motion,
    is described as caught in the sun's embrace, and bears twin children who issue
    from foam.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kow'wituma and Wats'usi see two little figures on the basin water and recognize
    them as divine in origin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The firstborn, U'yuyewi, says that Sun is the twins' father and Laughing water
    is their mother; the twins are described as newborn and diminutive.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wats'usi asks the twins to work for him in fighting; the firstborn says he
    is very small and does not know how to fight, while the brothers each suggest
    the other knows more.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wats'usi says the enemy leader Cha'kwena continues to move before her army
    shaking a rattle even after many arrows have pierced her heart, and he says the
    A'shiwi cannot continue their quest for the Middle place of the world until the
    enemy is conquered or destroyed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The newborn gods of Laughing water agree to join the A'shiwi, saying they
    may or may not destroy the enemy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In peace both twins bear the name A'hayuta; in war the elder is called U'yuyewi
    and the younger Ma'sai'lema.
  category: attribute
  evidence_refs:
  - ev:7
