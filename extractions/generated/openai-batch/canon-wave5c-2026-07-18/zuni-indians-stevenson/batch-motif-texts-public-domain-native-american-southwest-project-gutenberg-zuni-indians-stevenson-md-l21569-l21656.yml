canonical_text:
  quote: ''
  summary: The passage reports several Zuni accounts of illness attributed to witchcraft,
    shamanic diagnosis and extraction of intrusive objects, sorcerers using whirlwind
    or bird-plume powers, punishment of convicted witches, a crossed-arrows sign for
    a friend killed by mistake, and a buried charm said to have caused crop destruction
    by grasshoppers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sick narrator returns from the missionary's house to the mother's home,
    where a shaman is summoned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman is said to use the power of the Beast Gods and pinches of sacred
    meal to open the windows of the narrator's body and discover the illness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shaman declares that the narrator has been bewitched and commands foreign
    materials in the body to come up through the mouth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The shaman says he sees bits of blanket, yarn, and calico from the missionary's
    household inside the narrator; the ejected material is too putrid for the narrator
    and mother to distinguish, but visible to the shaman.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The narrator suspects an old one-eyed woman of bewitching her out of jealousy
    over her time at the mission.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: In a separate throat illness, the theurgist says a witch has shot a stone
    into the sufferer's throat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The theurgist prays to the Beast Gods, presses hard on the throat, calls with
    power, extracts the foreign matter, and casts the stone into the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A wizard paints his body red, paints white scalp-knot marks on his breasts
    and knees, puts yucca wreaths on wrists and ankles, and enters a whirlwind headfirst.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The whirlwind is described as a friend of witches and carries the wizard to
    the great river of the west and back in one day.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: The wizard goes to steal plume offerings deposited by rain priests and carried
    by butterflies attached to the plume sticks to the great river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The whirlwind drops the wizard near Zuni; a youth accuses him of being a sorcerer,
    follows him, and tells the story.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Dogwood-clan wizard is tried by the Bow priesthood, convicted, suspended
    by the arms without food, and dies after one night and a day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A note states that accused witches are hanged by the elbows from a beam of
    the old church and may be struck on the head with a war club if death does not
    occur when desired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Another wizard attaches crow and owl plumes to his head to gain crow-like
    quick sight and owl-like night travel, then flaps his arms and leaves Zuni after
    people are asleep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The plumed wizard visits the Apaches and tells them to come in four days to
    destroy the Zunis.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: A Zuni wood-gatherer hears a cry like an owl but human, recognizes the man
    as a Zuni, and accuses him of being a sorcerer because of the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The sorcerer asks not to be betrayed, offers blankets and beads, and says
    that when the Apaches come he will go out and have them kill him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: On the fourth morning the wood-gatherer hears an ax striking on rock as the
    witch's signal, goes out, and finds that the Apaches have killed the sorcerer
    and left the body on crossed arrows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: A Navajo explains that Apaches and Navajos place a mistakenly killed friend
    on crossed arrows so that people know a friend rather than an enemy has been killed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: All crops in the Zuni farming district of Pescado are destroyed by grasshoppers
    that make the air black.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: A man digging in the field discovers a buried bundle attributed to a witch
    or wizard, containing blue and red beans, a grasshopper, ground corn meal, wheat,
    and other seeds wrapped in white cotton cloth, red calico, and buckskin.
  category: object
  evidence_refs:
  - ev:8
