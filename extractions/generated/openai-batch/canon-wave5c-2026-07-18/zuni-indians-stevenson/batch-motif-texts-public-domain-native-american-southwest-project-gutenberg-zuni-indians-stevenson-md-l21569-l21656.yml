candidate_motifs:
- id: motif:1
  label: Illness caused by bewitchment and diagnosed by ritual sight
  taxonomy_refs: []
  basis: The shaman uses sacred meal and Beast-God power to see into the body and
    declares the patient bewitched.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The account reports a belief narrative; no broader taxonomy ref is assigned
    from the available list.
- id: motif:2
  label: Intrusive disease object extracted through ritual command
  taxonomy_refs: []
  basis: Foreign textiles and a stone are described as intrusive objects in the body
    or throat and are commanded or extracted by ritual specialists.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The two illness episodes differ in details and should not be merged beyond
    the shared extraction pattern.
- id: motif:3
  label: Jealous person suspected of bewitching the fortunate
  taxonomy_refs: []
  basis: The narrator suspects the old one-eyed woman because she was jealous of the
    good times at the mission.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The text presents the suspect as the narrator's thought, not as a confirmed
    identity.
- id: motif:4
  label: Theft of sacred rain-priest plume offerings by occult journey
  taxonomy_refs:
  - sacred_theft
  basis: The wizard uses the whirlwind to travel to the western river and steal plume
    offerings deposited by rain priests.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The available taxonomy ref captures the theft of sacred offerings, but
    the passage frames the act as witchcraft rather than heroic theft.
- id: motif:5
  label: Whirlwind as vehicle and ally of witches
  taxonomy_refs: []
  basis: The whirlwind is called the friend of witches, carries the wizard, and later
    drops him near Zuni.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage personifies the whirlwind's action but does not provide a
    full independent myth of the whirlwind.
- id: motif:6
  label: Exposure and execution of a sorcerer after public accusation
  taxonomy_refs: []
  basis: A youth accuses the whirlwind-traveling wizard, reports him, and the Bow
    priesthood convicts and suspends him until death.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives legal-ritual practice as reported context, not a complete
    judicial narrative.
- id: motif:7
