canonical_text:
  quote: ''
  summary: 'The passage describes Zuni uses of A''neglakya: restricted collection
    with prayer-plume offerings, narcotic use before a painful operation, and a nocturnal
    rain-priest ritual for identifying a thief. It also describes purging, head washing,
    gifts, shared food, medical payment customs, and the beginning of a pneumonia
    treatment involving a cougar fetish and medicine bags.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A'neglakya is said to belong to rain priests and to directors of the Little
    Fire and Cimex fraternities, and only those to whom it belongs may collect it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Before collecting the plant, four prayer plumes are made and offered: one
    to A''neglakya, one to A''neglakya''si''sa, and two to ancestors; they are planted
    arm-deep in an excavation at daylight.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nai'uchi administered the narcotic before operating on a woman's breast abscess
    with a flint lancet; the patient slept through the operation and appeared free
    of drug effects when awake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A'neglakya is sometimes administered by a rain priest when a person wants
    to recover stolen property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The theft-recovery ritual takes place at night in an inner dark room without
    fire or light; the man wears new clothing but no head-kerchief or moccasins.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rain priest places a bit of A'neglakya root in the man's mouth and says
    that the medicine is given so the man may become intoxicated and see the robber.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the night, the rain priest listens from another room, does not smoke,
    and treats the name called out by the intoxicated man as the thief's name.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: At daylight, the rain priest wakes or leads the man to the front room, sits
    with him facing east, reports what was heard, and the man denies remembering the
    night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Warm water is given four times to induce vomiting so that the A'neglakya taken
    the previous night may be expelled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rain priest returns with his wife and other female family members, who
    prepare yucca suds and wash the man's head while he kneels and the priest sits
    behind him with hands on his shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The rain priest gives four tied ears of corn, calico, and other presents;
    the corn is to be planted separately, and food prepared during the night is eaten
    by those present.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the rite, the property-loser goes to the named person's house and demands
    the property; if guilty, the accused returns it for fear of offending A'neglakya.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A Zuni doctor is paid for treating a patient outside the ceremonial chamber,
    but no charge is made when treatment occurs during an esoteric fraternity meeting;
    the doctor generally does not treat his own family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: In a pneumonia case, an officiating theurgist prevented other treatment, requested
    a basket tray, took the patient's hand, and placed a cougar fetish and small medicine
    bags in the basket.
  category: action
  evidence_refs:
  - ev:6
