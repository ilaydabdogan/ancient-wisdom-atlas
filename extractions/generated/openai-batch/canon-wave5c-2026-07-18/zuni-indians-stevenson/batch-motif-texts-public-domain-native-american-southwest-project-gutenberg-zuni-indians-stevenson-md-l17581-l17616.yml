canonical_text:
  quote: the knots in the blanket were cut so that the spirit might pass out
  summary: 'The passage describes a Zuni mortuary preparation: the remains are wrapped
    in a blanket with clothing placed beside them; a rain priest washes, paints, and
    decorates the face and head with cotton, water, black pigment, pollen, and a cotton
    hood; family members pray, sprinkle meal, say farewells, and bury the remains;
    knots in the blanket are cut at the grave for the spirit to pass out; kin then
    wash family members'' hair and hands. A final truncated note links delayed burial
    of belongings and prayer plumes to the Sun Father''s passage over the road of
    day.'
  language: English
  quote_policy: quoted
literal_observations:
