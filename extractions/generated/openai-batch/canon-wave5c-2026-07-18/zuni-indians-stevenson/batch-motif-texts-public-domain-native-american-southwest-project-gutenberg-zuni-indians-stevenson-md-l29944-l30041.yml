canonical_text:
  quote: ''
  summary: The passage describes a ceremonial sequence involving dancers, choir, officials,
    novices, medicine water, altar sprinkling, and prayer. On the third day fraternity
    fathers prepare items for novices while women grind directional medicines associated
    with beast powers, using shell, root, eagle plumes, bowls, and stone knives. The
    grinding is followed by removal of some adornments, a change of dress, line dancing
    with eagle plumes and red feathers, and the elder brother Bow priest's bear-like
    movements before the choir and women.
  language: English
  quote_policy: summarized
