  text: At midnight the players leave silently for a ruined church and graveyard,
    where the leader deposits offerings for deceased players and takes earth from
    south of the central cross.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the graveyard visit, a rain priest asks the leader what he heard while
