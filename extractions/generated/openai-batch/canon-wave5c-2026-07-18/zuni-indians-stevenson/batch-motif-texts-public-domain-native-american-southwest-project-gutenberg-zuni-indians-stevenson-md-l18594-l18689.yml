canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparations for a game: rain-priest prayers
    and applications to players, offerings to deceased players at a ruined church
    and graveyard, a report of contact with the dead, cigarette smoke directed to
    the six regions, visits to Corn Mountain, offerings to a wood rat and the younger
    God of War, gathering ritually addressed plants, preparation of a plant-and-stone
    bundle, arrows bound to watchers'' feet, and a meal served by women of the leader''s
    household.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Songs associated with the game are said to belong especially to the rain priests
    and to be for rain and fructification of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rain priest prays over a basket tray, applies water-mixed te'nas'sali to
    the ears and faces of four stooping players, and gives them wafer bread, husk
    packages, and a cigarette.
  category: action
  evidence_refs:
  - ev:1
