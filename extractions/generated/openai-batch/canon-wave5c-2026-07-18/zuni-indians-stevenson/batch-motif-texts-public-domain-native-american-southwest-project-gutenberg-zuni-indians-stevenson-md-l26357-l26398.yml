canonical_text:
  quote: ''
  summary: The passage describes the Zuni order of Kok'ko 'hlan'na, its associated
    gods and healing power over swelling illnesses, a story in which Kok'ko 'hlan'na
    and Shumai'koli test dangerous medicines on one another, and a procedure for joining
    the order through invitation and a meal gift wrapped in a corn husk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The order is known as Kok''ko ''hlan''na and is associated with three gods:
    Kok''ko ''hlan''na, Shits''ukia, and Kwe''lele, who are said to live in the east
    near Shi''papolima, the home of Po''shaiyiiuki.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The order can be joined only when the gods are summoned to the village by
    an illness that produces swelling, and they are not to be called until other attempts
    at cure have failed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the story, Shumai'koli traveled from west to east and met Kok'ko 'hlan'na;
    the two questioned each other about identity and purpose.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kok'ko 'hlan'na said he had medicine that could quickly kill a man, rubbed
    it over Shumai'koli's body, and Shumai'koli swelled all over for four or five
    days before asking for the medicine to be removed.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Shumai'koli covered Kok'ko 'hlan'na with his medicine, after which Kok'ko
    'hlan'na's arms, legs, and body twisted like ropes and he asked for the medicine
    to be removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the medicines were removed, Kok'ko 'hlan'na shook hands with Shumai'koli,
    said Shumai'koli's medicine was better, called him elder brother, invited him
    to his house, and the gods have since lived near one another.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a member wants another person to join the order, he invites him; if the
    invited person accepts, he carries meal wrapped in a corn husk to the member,
    who becomes his fraternity father, unless the novice already belongs to another
    fraternity order.
  category: sequence
  evidence_refs:
  - ev:7
