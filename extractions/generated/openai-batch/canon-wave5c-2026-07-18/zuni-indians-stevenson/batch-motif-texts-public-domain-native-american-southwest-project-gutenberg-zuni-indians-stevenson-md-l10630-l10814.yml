canonical_text:
  quote: THLA'HEWE CEREMONY FOR RAIN
  summary: The passage describes a Zuni Thla'hewe rain ceremony diagram, its participants,
    ritual objects, cloud and rain decorations, flutes placed over a bowl containing
    Pa'yatamu medicine, corn and te'likinawe baskets, and the clothing and facial
    markings of priests, choirs, flutists, and women personating Corn maidens.
  language: English with Zuni terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A figure caption identifies the positions of named participants and ritual
    items in the Thla'hewe ceremonial, including Bow priests, Shi'wanni, boys and
    girls, a sun priest, a priestess of fecundity, choirs, flutists, baskets of corn,
    te'likinawe, trees, bowls, coals, and deposits in excavations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cup-like objects are described as having outer sides decorated with yellow,
    blue, red, black, and white cloud symbols, inner sides painted with butterflies
    and dragonflies, and scalloped edges tipped with fluffy white eagle plumes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Flutes are laid across a serrated bowl decorated with rain symbols on a white
    ground; the bowl contains medicine of Pa'yatamu described as made from flowers
    of a mythical medicine plant, hearts of butterflies, and dragonflies.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The A'shiwanni wear white cotton shirts and trousers with red silk headbands;
    the elder and younger brother Bow priests add war pouches to this dress.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two choirs wear individual combinations of cotton or calico clothing,
    turban-like silk scarfs, and many beads.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mo'sona of the Thla'hewe choir has a line of micaceous hematite below
    the eyes; the mo'sona of the Sho'ko'we choir has corn pollen under the right eye
    and micaceous hematite under the left, with the pollen said to signify fasting,
    prayer, and continency for one night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The flutists wear elaborately trimmed shirts, velvet knee breeches, moccasins,
    buckskin leggings, ribbons, beads, and necklaces; each has pollen under the right
    eye and micaceous hematite under the left.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The pollen line on the flutists is said to indicate that they sing the songs
    of Pa'yatamu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The A'wan a'mosi and their fellows dress similarly to the flutists, but their
    hair is arranged differently and silk bandanas are worn; their faces are streaked
    with micaceous hematite after returning from their morning meal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The A'wan a'mosono"kia personating the Yellow and Blue Corn maidens wear ordinary
    dress with a bordered white blanket, sash, beads, styled hair, and a white eagle
    plume; a plumule ear of corn symbolic of A'wan 'Sita, Great Mother corn, is carried
    in the back of the sash but hidden by the mi'ha.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Other mi'lailapo'na wear black embroidered dresses, blanket wraps, ordinary
    hair arrangements, and white moccasins with black soles.
  category: attribute
  evidence_refs:
  - ev:10
