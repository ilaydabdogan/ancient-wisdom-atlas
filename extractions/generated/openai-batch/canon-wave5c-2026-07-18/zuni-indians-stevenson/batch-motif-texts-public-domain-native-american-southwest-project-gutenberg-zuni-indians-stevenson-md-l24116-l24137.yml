canonical_text:
  quote: ''
  summary: The passage explains a Zuni interpretation of a stone etching associated
    with the 'Hle'wekwe fraternity. It identifies pictographic marks as a migration
    route, a detour for medicinal plants, mesas and mountain peaks, a water basin,
    Ursa Minor, elapsed years, and an ancient Shi'wi figure. A note adds that Zuni
    tradition places nativity in the far northwest and that both the 'Hle'wekwe and
    combined priesthood believe snow was unknown until brought by the 'Hle'wekwe et'towe
    on a northern journey.
  language: English with Zuni terms
  quote_policy: summarized
