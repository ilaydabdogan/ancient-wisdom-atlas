canonical_text:
  quote: ''
  summary: The passage describes an altar of the Ha'lo'kwe, initiation actions at
    an ant-hill with prayer plumes, and a curing rite for disease attributed to ant
    gods. The patient is placed on a white blanket in a ceremonial chamber, meal lines
    are laid out for ants or their spirits, and theurgists invoke colored directional
    ant deities and sometimes Beast Gods to gain power to see disease and brush pebbles
    from the body. A fourth-morning novice rite at a deserted ant-hill and offerings
    to A'chiyala'topa are also described.
  language: English
  quote_policy: summarized
