canonical_text:
  quote: ''
  summary: The passage describes plaza ceremonials involving Ko'yemshi, Ne'wekwe,
    and Kor'kokshi dancers; clowning, burlesque, and filth-drinking by Ne'wekwe; a
    rain-maker personation element; rules and an example concerning voluntary initiation
    and ki'wi'sine membership; and calendric reckoning by seasons, months, the sun,
    and named mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eight Ko'yemshi remain in the plaza and are joined by members of the Ne'wekwe
    fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ne'wekwe are described with ash-colored body paint, black facial curves,
    ash-colored skullcaps with corn-husk rosettes, black-wool breechcloths, black
    yarn, blankets, and batons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: During intervals in the Kor'kokshi dancing, the Ko'yemshi and Ne'wekwe entertain
    spectators with buffoonery, but become serious when the dancers return and attend
    to the Kor'kokshi regalia.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Women watch the ceremonials from houses, elevated galleries, housetops, and
    blankets on the south side of the plaza.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Ko'yemshi warrior whirls a rhombus during the dancing and calls on the rain-makers
    to gather; the Kor'kokshi are described as their personators.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the fifth dance, food is brought and eaten by the Ne'wekwe; one Ne'wekwe
    drinks and gargles urine from a bowl, places it in the northwest corner, and it
    is drunk again after the dancers leave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the sixth dance, Ne'wekwe lay aside batons, use a drum, burlesque absent
    dancers, bring a full urinal from a house, drink from it, invert the emptied vessel
    over a head, lick falling drops, smash the bowl, and act intoxicated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the seventh appearance of the Kor'kokshi, the dancers briefly form a file
    facing west before forming a line facing north; after the dance, they leave by
    the western street.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A boy undergoing voluntary initiation into the Ko'tikili joins the ki'wi'sine
    of his godfather, while an adult man may sometimes leave one ki'wi'sine for another
    and later return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that improper conduct with the wife of a fellow-member
    can lead to expulsion and seeking admission to another ki'wi'sine, though expulsion
    efforts may fail.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: In the example, a ki'wi'sine director and the Ko'mosona demand dismissal of
    a guilty man; when overruled, they and three others leave and join the Chu'pawa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The calendar section states that the year is divided into two seasons of six
    months, and each month into three ten-day parts.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The calendar section marks solstices by the rising or setting sun in relation
    to named mountains, including Corn mountain and Great mountain.
  category: sequence
  evidence_refs:
  - ev:10
