canonical_text:
  quote: ''
  summary: The passage describes Shu'maakwe fraternity offices and clan requirements;
    a nose-septum piercing ceremony involving blood, archaic wood, eagle plumes, continence,
    and a concluding wood-rat meal; the director's status as rain priest and possession
    of an et'tone; medicinal plant preparations; and the invitation of non-member
    women to dance and grind medicines, accompanied by a gift of meal in a corn husk.
  language: English with Zuni terms
