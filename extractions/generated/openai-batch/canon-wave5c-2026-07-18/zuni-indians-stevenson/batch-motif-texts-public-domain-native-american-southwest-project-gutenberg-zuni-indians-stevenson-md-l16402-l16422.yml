canonical_text:
  quote: ''
  summary: 'Ethnographic description of natal customs: before a child is born, petitioners
    visit rock shrines on Corn mountain, make deposits or offerings, and pray for
    a desired daughter or son with specified virtues and future roles. A note describes
    vulva symbols and excavations at the base of the rock and gives an authorial comparison
    to phallic worship.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before a child's birth, when a daughter is desired, the husband and wife may
    visit the Mother rock on the west side of To'wa yal'lanne, sometimes accompanied
    by a doctress or female relative.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the daughter-desiring rite, the pregnant woman scrapes a small quantity
    of the rock into a tiny purpose-made vase and deposits it in one of the rock cavities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The participants pray that the desired daughter will be good, beautiful, virtuous,
    a beautiful weaver, and skilled in pottery-making.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a son is desired, the couple visits a shrine higher on the side of the
    mountain, in a fissure in the same rock.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the son-desiring rite, the couple sprinkles meal, deposits te'likinawe,
    and prays that a son be born, become distinguished in war, and after death become
    great among ancestral gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A source note states that the base of the rock is covered with a'sha, identified
    parenthetically as vulva symbols, and is perforated with small excavations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A source note adds an authorial comparison between the described practice
    or symbolism and phallic worship among aboriginal peoples.
  category: other
  evidence_refs:
  - ev:7
