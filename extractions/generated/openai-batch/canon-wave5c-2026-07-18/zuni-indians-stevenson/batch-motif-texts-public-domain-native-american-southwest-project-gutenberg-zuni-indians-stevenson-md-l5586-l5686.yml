canonical_text:
  quote: ''
  summary: The passage describes a witnessed voluntary initiation into the Ko'tikili.
    Boys sit with godfathers in the He'iwa k'iwi'sine while masked Sa'ya'hlia and
    Ko'yemshi perform ritual actions with giant yucca. A Sia youth receives an extended
    form of the rite, including covering with blankets and canvas, repeated whipping,
    meal sprinkling, and attachment of an eagle plume. Other novices undergo a shorter
    whipping. The godfathers cover the boys' eyes while the Sa'ya'hlia remove masks,
    after which the initiates learn that the supposed gods are men. Each initiate
    receives a rain-maker's mask, participates in striking the masked gods, and is
    warned not to reveal initiatory secrets concerning the masks.
  language: English with Zuni ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Voluntary initiation is said to occur when a boy is 12 or 13 years old, and
    the boy decides for himself while elders impress the importance of the step.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The He'iwa k'iwi'sine contains many people, including boys to be initiated,
    godfathers, rain priests, Ko'mosona, Ko'pekwm, Sa'ya'hlia, and Ko'yemshi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four Sa'ya'hlia stand on the north side of the room wearing masks with long
    goat's-wool hair tied with yucca ribbons, and the Ko'yemshi hand each one a bunch
    of giant yucca.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Sia youth is included for initiation so that the Sia Indians may use the
    Ko'yemshi masks they possess; he is accompanied by a rain priest and two theurgists,
    and the director of the Shu'-maukwe fraternity serves as his godfather.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sia youth receives a more extended ceremony because he has not received
    involuntary initiation in Zuni.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sia boy is bent forward, covered with folded blankets and canvas, led
    by his godfather, and accompanied by two women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sa'ya'hlia strike the Sia boy repeatedly across the back with giant yucca,
    while the Ko'yemshi count the blows aloud and provide fresh bunches of yucca.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: One woman who accompanies the boy bends forward and receives one stroke of
    yucca from each Sa'ya'hlia.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the third whipping, the boy and godfather sprinkle meal from a cornhusk
    on the Sa'ya'hlia, and the godfather attaches a nutty eagle plume to the boy's
    hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: For ordinary voluntary initiation, a blanket and deerskin are used; the novices
    pass once before the four Sa'ya'hlia and receive four strokes from each with giant
    yucca.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After whipping, each boy returns to his godfather, who covers the boy's eyes
    while the Sa'ya'hlia remove their masks; the Ko'yemshi do not remove theirs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Each initiate receives a rain-maker's mask from his godfather, and the mask
    becomes personal property and is buried after the initiate's death.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the godfathers uncover the boys' eyes, the novices discover that the
    supposed gods are men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Four boys receive masks and yucca from the Sa'ya'hlia and strike each god
    on the right arm, left arm, right ankle, and left ankle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After all boys have been initiated, the gods replace their masks, and godfathers
    and shi'wanni are struck over the limbs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Ko'mosona warns the boys that if they reveal the initiatory secrets, especially
    those connected with the masks, their heads will be cut off with a stone knife.
  category: speech
  evidence_refs:
  - ev:9
