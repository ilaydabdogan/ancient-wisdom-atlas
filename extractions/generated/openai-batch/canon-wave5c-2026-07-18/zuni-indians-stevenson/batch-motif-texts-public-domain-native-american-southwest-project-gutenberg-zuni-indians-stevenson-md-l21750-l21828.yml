  text: Near midnight, the narrator was told that a man accused as a wizard was to
    be put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nai'uchi, described as a great theurgist and elder brother Bow priest, refused
    to withdraw his verdict and stated that he would hang the wizard because the man
    had killed his child.
  category: speech
  evidence_refs:
  - ev:1
