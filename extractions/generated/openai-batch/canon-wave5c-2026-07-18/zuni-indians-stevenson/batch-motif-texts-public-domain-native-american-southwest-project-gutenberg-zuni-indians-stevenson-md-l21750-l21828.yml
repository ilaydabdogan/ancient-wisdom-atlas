  text: The narrator persuaded Nai'uchi to delay the hanging until the following night
    after promising not to send for soldiers or inform on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The accused man sat in an upper room of his house with his ill wife and his
