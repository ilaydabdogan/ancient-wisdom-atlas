canonical_text:
  quote: ''
  summary: The narrator describes intervening when Nai'uchi, an elder brother Bow
    priest and theurgist, intends to hang an accused wizard whom he blames for his
    child's death. After obtaining a delay, the narrator visits the accused man and
    his grieving family, then convenes a court in which she declares the man's sorcery
    power removed, leading to his release. The passage then introduces another witchcraft
    trial involving a sick 12-year-old girl and a youth accused because he had been
    seen romping with her and holding her hands; Bow priesthood members are summoned.
  language: English
  quote_policy: summarized
