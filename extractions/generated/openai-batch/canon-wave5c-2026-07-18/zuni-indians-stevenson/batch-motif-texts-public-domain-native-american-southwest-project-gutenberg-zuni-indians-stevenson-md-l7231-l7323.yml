canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence at Ku''shilowa and in
    the ki''wi''sine: firebrands and meal are arranged, plume offerings are buried,
    prayers ask for rain, snow, warmth, crops, seeds, and clothing, household sweepings
    and ashes are deposited in fields with prayers for their return as food, named
    figures dance and remain in the ceremonial house, the fire tender is washed for
    purification and longevity, and te''likinawe are presented to designate persons
    for ritual offices and divine personation.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party proceeds to Ku'shilowa, where the fire tender and Kwe'lele place
    burning brands, the Ko'pekwin runs a meal line between them, and participants
    take specified positions facing east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those grouped at the back sprinkle meal on the gods and draw in the sacred
    breath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The te'likinawe are deposited in a circular excavation made by Pau'tiwa's
    ceremonial father; the fire tender separates his corn from them, and the father
    covers the offerings with earth so that no trace remains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Plume offerings are made to named sacred recipients, and prayers ask for rain,
    snow, warmth from the Sun Father, abundant fruits and seeds from mother earth,
    and raiment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the party leaves the ki'wi'sine, families clean their houses; female
    family members deposit sweepings and ashes with live coals in fields, address
    them as returning in one year as corn or meal, sprinkle meal, and pray.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The te'likinawe associated with household sweepings and ashes are kept for
    ten days and then deposited in the fields.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the party returns to the ki'wi'sine, the Great Fire fraternity sings
    with rattle and drum while the four Sa'ya'hlia, Shits'ukia, and Kwe'lele dance
    until after sunrise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kwe'lele brings his extinguished firebrand back to the ki'wi'sine and later
    deposits it on the road to Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A paternal aunt or woman of the father's clan washes the fire tender's head
    with yucca suds and bathes his body for purification and longevity, with the stated
    aim that he may not die but sleep and awake in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pe'kwin selects te'likinawe for persons chosen for offices, and presentation
    to the elder brother Bow priest is accompanied by paired kinship terms spoken
    by receiver and giver.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Presentation of te'likinawe indicates that chosen persons must go to the ki'wi'sine;
    the named appointments include several divine personators, with additional quadrennial
    offices in every fourth year.
  category: relationship
  evidence_refs:
  - ev:8
