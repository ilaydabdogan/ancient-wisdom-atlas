  summary: The passage describes preparation of plant medicines, placement of grinding
    stones near an altar, ritual dressing and positioning of female grinders, grinding
    of plants and mineral materials into medicine cakes, song and dance accompaniment,
    and actions by the a'kwamosi involving meal, eagle plumes, medicine water, altar
    sprinkling, fetishes, a whirling crossbar, and a dance formation.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plant materials, including roots, wild sage, flower tips, and squash blossoms,
    are prepared, separated, cut, and placed in bowls; one plant is kept fresh with
    a small quantity of water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six old, worn grinding stones or mills are placed on the north side near the
    altar on skins and cloths, with space for kneeling grinders.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The a'kwamosi gives meal to each female and prays over each; the meal is later
    used when the women go to the altar to pray and sprinkle it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Six grinders are dressed and adorned with a mi'ha, white fringed sash, loosened
    hair tied with a red garter, an eagle plume, silver ornaments, and necklaces of
    ko'hakwa, turquoise, and coral.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Each girl is led separately to a mill by the a'kwamosi while holding the tips
    of eagle-wing plumes that he carries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After positioning each girl, the a'kwamosi places hands on her shoulders and
    motions her to the six regions, including forward and back movements for Zenith
    and Nadir.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An aged woman and an aged man sit before the mills with mixed plants and small
    bowls of turquoise and ko'hakwa, supplying the grinders and rearranging their
    ornaments as needed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: With song and rattle accompaniment, turquoise, ko'hakwa, root medicine, wet
    plants, and sometimes additional water are ground by the girls into a medicine
    that is later shaped into cakes and placed in bowls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'When a second group begins grinding, the music changes: a drum is added to
    rattles, the songs become faster and martial in character, and a youth in the
    choir listens in order to learn them.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before the altar, the a'kwamosi keeps time with his feet and eagle plumes,
    dips the plumes into medicine water, touches them to four serrated points of a
    bowl, motions for Zenith and Nadir, sprinkles the altar, fetishes, and crossbar,
    and keeps the crossbar whirling.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Five men and ten women begin dancing in groups of three, each group having
