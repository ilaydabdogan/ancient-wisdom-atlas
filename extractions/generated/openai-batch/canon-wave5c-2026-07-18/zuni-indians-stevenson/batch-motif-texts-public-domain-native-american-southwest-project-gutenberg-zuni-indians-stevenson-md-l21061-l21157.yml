canonical_text:
  quote: ''
  summary: The passage describes Zuni medical practice as combining practical plant
    medicines, massage, antiseptics, surgery, and theurgic treatment. It presents
    some diseases as foreign life or medicine shot into a person by witches, treated
    through Beast Gods and theurgists, including crystal diagnosis. It discusses Datura
    stramonium, called a'neglakya, as a narcotic, wound medicine, and aid for rain
    priests who commune with birds and spirits of the dead. A legend explains the
    plant as transformed from a brother and sister banished into the earth by Divine
    Ones after they continually saw and reported everything.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zuni therapeutics are described as not wholly occult and as including legitimate
    drugs administered both with and without prayers or incantations.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old women and professional male or female theurgists are said to administer
    medicines; old women know various plant medicines.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some medicines are used according to a doctrine of signatures and with prayers
    or ceremonies; others are associated with Beast Gods, snake medicine, ant medicine,
    the feathered kingdom, and a mythical plant with blossoms of the colors of six
    regions.
  category: object
  evidence_refs:
  - ev:2
