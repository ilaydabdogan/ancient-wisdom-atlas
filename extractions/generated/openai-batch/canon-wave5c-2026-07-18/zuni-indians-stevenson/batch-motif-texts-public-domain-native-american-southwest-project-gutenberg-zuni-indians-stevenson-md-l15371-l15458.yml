    ribbons, moccasins, eagle-wing feathers, and a Ne'wekwe baton.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bi'si'si crosses the plaza, climbs a ladder, and enters the k'iwi'sine to
