canonical_text:
  quote: ''
  summary: The passage describes plaza performances by members of the Galaxy fraternity,
    a comic melee involving the Ko'yemshi, aid from Cactus fraternity members using
    willow switches, a Bow priest's directional gesture with the willows, and the
    return of dancers carrying food. It then describes Bi'si'si's solitary arrival,
    attire, and announcement of the mo'lawe, followed by details of a k'iwi'sine setting
    with fire, meal symbols, medicine water, field fetishes, and a consecration by
    the Ko'mosona. Footnotes add contextual information about Bi'si'si and the personation
    and selection of mo'lawe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four men and three boys of the Galaxy fraternity perform in the plaza; their
    bodies and faces are painted ash-color, and they wear ash-colored skullcaps with
    ribboned corn husks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hide drum wrapped with rope is used, and the leader in mimicry carries a
    piece of goat hide as a mi'li.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Galaxy fraternity performers pass around the plaza, join in a Navaho dance,
    and burlesque the personators of the Zuni gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The dance breaks into a melee between the Ko'yemshi and Galaxy fraternity
    members, during which Ko'yemshi seize skullcaps and trousers, and a boy kicks
    the hide drum against a Ko'yemshi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Cactus fraternity member brings long willows, a woman throws another bunch
    of willows from a housetop, and a general switching occurs while the drum continues.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder brother Bow priest gathers all the willows, waves them to the six
    regions, and carries them from the plaza through the eastern covered way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ko'yemshi examine the man who was foremost in the fight and say nothing
