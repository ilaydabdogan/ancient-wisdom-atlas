canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial sequence involving a flayed bear
    brought to the pueblo, consecration and decoration of its skull, deposition of
    the skull at a shrine, preparation and deposition of prayer plumes by ritual officers,
    selection of a personator of Pau'tiwa/Kom'ha'likwi, and a procession west of the
    village to plant plume offerings near water while praying for rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Navahos brought a flayed bear to the pueblo and presented it to the mo'sona
    of the Ha'lo'kwe fraternity, who convened the fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The altar was erected, medicine water was consecrated, the bear was butchered
    and cooked during the night, and members sang and danced.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear skull was placed in a flat basket containing a meal cross identified
    in the passage as symbolic of the four regions, with the top of the head facing
    east.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Participants dipped ceremonial eagle plumes into yucca suds and brought them
    over the skull; the skull was washed, painted black and yellow, spotted with micaceous
    hematite, and given fluffy eagle plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The decorated skull was sprinkled with medicine water and meal, and all present
    sprinkled meal upon it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skull was carried to To'mapa, a shrine in the west wall of To'wa yaK-lannfi,
    where the note says skulls of prey animals of the six regions are deposited.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Prepared te'likinawe were arranged in a flat basket with plume ends radiating,
    and the skull was placed in the center.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman who washed the skull carried it, followed by four fraternity officers
    singing with a rattle and wearing deerskin hoods associated with Sha'liiko personators.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The first body of A'shiwanni gathered on the eighth day, prepared te'likinawe,
    and deposited some at sunset on the ninth day in a spring or water pocket associated
    with the Kok'ko viewing the earth from the undermost world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the ninth day named officials prepared te'likinawe; the Corn clan and its
    children assembled to choose a personator of Pau'tiwa, called Kom'ha'likwi at
    this time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The head of the Corn clan presented prayer meal wrapped in a corn husk to
    the chosen personator and prayers were offered for a good heart and for rain to
    fructify the earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pau'tiwa is said to appear three times annually in Zuni, with the personator's
    clan affiliation varying by ceremonial occasion and alternate years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Five members of the Sun clan, five members of the Corn clan, and the personator
    made te'likinawe to the Council of the Gods; the Ko'mosona grouped and wrapped
    the offerings and handed them to the Kom'ha'likwi to plant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A procession went west of the village carrying a shell-and-turquoise mixture;
    at the riverbank an excavation was dug with an ancient corn planter until water
    was reached, the te'likinawe were deposited, meal was sprinkled, prayers for rain
    were made, and the opening was filled.
  category: action
  evidence_refs:
  - ev:9
