candidate_motifs:
- id: motif:1
  label: Consecration and shrine deposition of a prey-animal skull
  taxonomy_refs: []
  basis: The bear skull is placed on a directional meal cross, washed, painted, plumed,
    sprinkled with medicine water and meal, and carried to a shrine where skulls of
    prey animals of the six regions are said to be deposited.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes treatment of a bear already brought flayed; it does
    not state that the bear was ritually killed as a sacrifice.
- id: motif:2
  label: Ritual offerings to divine beings through prayer plumes
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe are made to Pau'tiwa, the Council of the Gods, and in relation
    to the Kok'ko; they are deposited or planted with meal and prayers, including
    prayers for rain.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy link to sacred_exchange is general; the passage describes
    offerings and prayers but does not formulate an explicit bargain.
- id: motif:3
  label: Water place as access point between divine underworld and earth
  taxonomy_refs: []
  basis: A spring or water pocket is described as the place through which the Kok'ko
    view the earth from the undermost world; a later plume-planting rite also requires
    digging until water is reached.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly state that the riverbank excavation has
    the same cosmological function as the spring or water pocket.
- id: motif:4
  label: Annual ceremonial personation of a deity
  taxonomy_refs:
  - seasonal_cycle
  basis: Pau'tiwa is said to appear three times annually in Zuni, with different clan
    requirements for the personator depending on the ceremonial occasion and alternate-year
    selection.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage uses the language of personation; it should not be expanded
    beyond the described ritual appointments.
- id: motif:5
  label: Rain-making plume planting
  taxonomy_refs:
  - sacred_exchange
  basis: After a procession west of the village, the Kom'ha'likwi deposits te'likinawe
    in a water-reaching excavation; participants sprinkle meal on the plumes and pray
    for rains.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The rite is clearly connected to rain prayer, but the passage does not
    explain the full theology of causation.
- id: motif:6
  label: Directional and regional ordering of ritual objects
