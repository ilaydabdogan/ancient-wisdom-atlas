canonical_text:
  quote: ''
  summary: Kow'wituma appoints Ya'nowwuluha/Yii'nowwuluha as pe'kwin, deputy to the
    Sun Father, after he identifies concealed et'towe. Six named birds of the North,
    West, South, East, Zenith, and Nadir stand on a meal line, sing for rain and lightning,
    and are declared his et'towe. Ya'nowwuluha is installed as Shi'wanni of the Zenith;
    prayers and songs continue for eight days and nights, and houses are begun on
    the ninth day. The passage then describes the A'shiwi's bodily features after
    coming to this world, their alteration and bathing at A'wisho, and the later arrivals
    of the Mu'kwe/Hopis, Coconino Pimas, and A'pachu/Navahos from the undermost world
    through three worlds.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kow'wituma asks Ya'nowwuluha about concealed et'towe, accepts his answer,
    and says he will make him pe'kwin to the Sun Father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six named birds, associated with North, West, South, East, Zenith, and Nadir,
    take places in succession on the meal line and sing for rains and lightning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kow'wituma tells Ya'nowwuluha that the birds shall be his et'towe, after which
    the birds fly away to their homes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ya'nowwuluha is moved into the line as Shi'wanni of the Zenith and pe'kwin
    to the Sun Father.
  category: action
  evidence_refs:
  - ev:4
  - ev:9
- id: obs:5
  text: Prayers and songs over the et'towe continue for eight days and nights; before
    houses exist, each shi'wanni makes a place for his et'tone with four stone slabs,
    and on the ninth day houses of reeds and earth are begun by direction of the Divine
    Ones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The A'shiwi are described at their coming to this world as having short hairless
    tails, long ears, webbed hands and feet, moss-covered bodies and heads, and a
    horn-like tuft on the front of the head.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the A'shiwi move to the spring called A'wisho, the Divine Ones cut off
    tails and ears, cut the webbed hands and feet with stone knives, and the people
    bathe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Mu'kwe/Hopis, Coconino Pimas, and A'pachu/Navahos arrive in four-year
    intervals after the A'shiwi, and all are said to come from the undermost world
    through three worlds to this world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Divine Ones give the Mu'kwe a message from the Sun Father and instructions
    for reaching the outer world, while the Mu'kwe themselves cut the trees by which
    they ascend.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mu'kwe do not make a cloud symbol on the ground or sing when they reach
    this world, because they do not have the Divine Ones to teach them; later the
    Divine Ones cut their webbed fingers and toes and amputate their tails.
  category: action
  evidence_refs:
  - ev:8
