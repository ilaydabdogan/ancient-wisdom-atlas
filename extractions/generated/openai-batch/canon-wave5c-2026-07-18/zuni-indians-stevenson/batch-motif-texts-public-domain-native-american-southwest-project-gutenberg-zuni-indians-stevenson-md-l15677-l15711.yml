canonical_text:
  quote: ''
  summary: After te'likinawe are planted, participants separate for clan washing,
    Bi'sisi returns to the ki'wi'sine, offerings and corn are distributed in an ordered
    sequence to named ceremonial recipients, Bi'sisi's hair is taken down, ritual
    objects are returned or removed, meal from the meal painting is deposited in a
    floor opening identified as symbolic of the A'shiwi emergence, and participants
    carry gifts home and end a fast with specified exemptions.
  language: English with Zuni terms
  quote_policy: summarized
