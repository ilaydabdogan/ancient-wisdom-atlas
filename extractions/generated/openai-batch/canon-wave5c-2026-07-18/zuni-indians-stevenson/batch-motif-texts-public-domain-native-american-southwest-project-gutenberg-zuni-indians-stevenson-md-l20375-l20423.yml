canonical_text:
  quote: ''
  summary: 'The passage describes Zuni clothing care and hairdressing practices: wool
    garments are washed with yucca-root suds, cotton garments may be worn until decayed,
    and fresh garments may be reserved for ceremonies. It then describes social hairdressing,
    vermin removal, men''s and women''s hairstyles, tools and bindings used in arranging
    hair, and the use of women''s bangs to cover the face, with an explanation that
    a woman''s face should not be exposed to men''s gaze.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Woolen garments of home manufacture are occasionally washed in suds made from
    yucca glauca root on the river bank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cotton clothing is described as being worn by both poorer and better-class
    people until it falls apart from decay caused by filth; fresh garments used for
    ceremonies are later worn again until fully used.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that no one dresses his own hair; women comb men's hair
    and one another's, with an enamored lover or bridegroom sometimes acting as hairdresser.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A favorite pastime is described as sitting outside the house, searching hair
    for vermin, cracking each specimen between the teeth, and throwing it from the
    mouth rather than eating it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hair is parted from ear to ear over the crown with a fine straw; the front
    falls in heavy bangs over the forehead while the back hair is brushed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tied bunch of broom corn is used as both a broom and a hairbrush.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A long string is drawn around the hair at the nape of the neck, held by the
    person whose hair is being dressed, and then used while the hair is brushed, folded,
    and bound.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: For men's hair, the hairdresser wraps the strings around hair formed into
    a bow, may use the tongue to smooth hairs into place, and wraps the bow with a
    red woven garter or red yarn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the hairdresser finishes, the man separates the bangs, brushes both
    sides back with his hands, and ties a head-kerchief or silk band around his head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women wear the back hair in a similar manner but as a queue rather than a
    bow, with the queue wrapped in garter or yarn; in certain ceremonies, previously
    braided hair falls down the back in a wavy form.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women or girls separate bangs by finger manipulation; the bangs may fall to
    the lower lip on one side while hair is caught behind the ear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In dancing, grinding, and other ceremonies, women's bangs fall over the face.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage reports the Zuni explanation that it is not well for a woman's
    face to be exposed to men's gaze.
  category: speech
  evidence_refs:
  - ev:6
