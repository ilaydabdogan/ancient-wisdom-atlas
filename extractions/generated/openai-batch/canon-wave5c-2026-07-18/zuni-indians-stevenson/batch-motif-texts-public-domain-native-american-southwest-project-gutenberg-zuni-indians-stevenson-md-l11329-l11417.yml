canonical_text:
  quote: Go with the tire and plant your plume offerings.
  summary: 'The passage describes closing portions of a Zuni rain ceremony: fire,
    corn, plume offerings, a cloud symbol, baskets, meal, medicine water, prayers,
    directional field deposits, and shrine offerings are used in ritual actions requesting
    rain and agricultural fertility.'
  language: English with Zuni ritual terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man of the Badger clan lights a cedar stick from the remaining fire and
    carries it to a spring north of the ruin Ma'sakia with four ears of corn and te'likinawe
    offerings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the Badger clan man leaves the plaza, the Sho'ko'we choir sings an instruction
    to go with the fire and plant plume offerings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the spring, the Badger clan man excavates a hole and deposits te'likinawe
    with prayers to the gods and the ancients of his clan, asking rain for Earth Mother
    so she may yield fruits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Badger clan man returns with the corn and remaining cedar stick, throws
    the wood into the smoldering fire, and keeps the corn at home until the next planting
    time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: When sunlight falls on the cloud symbol, the mi'wachi and lines of te'likinawe
    fall at the command of the man of the Frog clan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants place baskets on their heads and remain in position until seats
    are removed and the Shi'wanni of the West sprinkles all participants with meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Flutists form a line facing east, Bow priests whirl rhombi at either end of
    the dancers, the flutists pray aloud, and baskets are removed from heads and placed
    in line.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Kla'kwemosi administers medicine water from a medicine bowl with a shell;
    recipients eject it onto their hands and rub it over their bodies for physical
    purification.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The pe'kwin stands west of the cloud symbol facing east and closes the ritual
    with prayers for rains to fructify the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man of the Frog clan gathers meal from the cloud symbol into his blanket
    and deposits it in the river to be carried to Ko'thlmvala'wa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Women carry baskets home, place 'hla'we and 'hle'we in corn stacks, keep basket
    corn separate for the coming year's planting, and plant te'likinawe in the field
    after the morning meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The he'kupowanhak'tona and sho'lipsimonthie'ona accompany the pe'kwin to fields
    north, west, south, and east of the village, where te'likinawe are deposited to
    the Council of the Gods to gather directional rain-makers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At this season, flutists make offerings at a seldom-visited shrine dedicated
    to Pa'yatiimu in the south wall of a mesa east of Zuni.
  category: setting
  evidence_refs:
  - ev:6
