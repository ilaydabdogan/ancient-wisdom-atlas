canonical_text:
  quote: ''
  summary: 'The passage describes plate captions and ethnographic notes on Shi''wannakwe
    ritual objects and traditions: a dry painting and masks; a small image revered
    as A''wan Si''ta, the Great Mother, guarded by an Eagle clan woman and ritually
    handled at an altar with eagle-wing plumes and bead offerings; a dressed deerskin
    with pictorial writings about the A''shiwi coming into this world and migrating
    to the Middle place; the loss or removal of duplicate sacred items; and the fraternity''s
    reputation for bringing rain during a drought caused by an elder brother Bow priest
    identified as a witch.'
  language: English
  quote_policy: summarized
