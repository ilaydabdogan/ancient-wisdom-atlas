  quote: ''
  summary: The passage gives a recited route through named places and springs, ending
    at the Middle place, where the speaker addresses the A'shiwi and speaks of fathers
    meeting them on the road and giving life-giving breath from A'wonawil'ona. Editorial
    notes explain place names, the Middle-of-the-world shrine, masked divine impersonation
    and sacred breath transfer, and the ritual circuit in which 'Kiaklo repeats the
    sacred story in multiple kivas, drinks popcorn water through a reed in the mask,
    and returns westward.
