canonical_text:
  quote: ''
  summary: A ritual dialogue names rain-and-crop fetishes and addresses great fathers
    and great mothers. Speakers discuss sitting perfectly still for precious days
    so that their hearts may speak with the gods of the inside water place, identify
    the Sun priest as knowing the place for this retreat, finish prayer plumes for
    reception by the Council of the Gods, recount the great fathers passing between
    mountains to find the Middle of the world, and summon Kiaklo as a knowledgeable
    man.
  language: English translation with Zuni transcription
  quote_policy: summarized
