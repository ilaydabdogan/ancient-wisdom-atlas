  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the fifth morning the youth appears from his grave; after another four
    days of heavy rain, the girl comes from the earth on the fifth morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The witches plant all the seeds in wet earth; the next morning the corn is
