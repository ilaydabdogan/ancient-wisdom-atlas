canonical_text:
  quote: ''
  summary: While the A'shiwi are at A'wisho, the Divine Ones organize fraternities
    and the emergence from the underworlds continues. Two witches, a man and wife,
    come forth with seeds and demand to go with the people to the Middle place of
    the world. They offer corn and other precious things in exchange for two children
    of the Kia'kwemosi, whom they kill so that rain may come. After rains and burial,
    the youth and maiden return from the grave or earth. The witches plant seeds in
    wet ground, producing rapidly maturing corn and other foods. Raven, owl, and coyote
    eat the crops and make them palatable. The Divine Ones then teach fire making
    and cooking.
  language: English
  quote_policy: summarized
