canonical_text:
  quote: ''
  summary: A ritual sequence is described in which the pe'kwin leads assembled gods
    into a plaza, lays colored meal lines and a meal circle to order the gods by directional
    positions, and children carried by godfathers are struck by gods with giant yucca.
    Children are taken into the ki'wi'sine, receive plumes, sacred water from a spring
    bowl, and contact with sand figures or a sand painting. Four Sa'ya'hlia stand
    on meal crosses symbolizing the four regions, turn through the directions, and
    strike the children in ordered counts. The godfathers later take the children
    home for a feast, while the gods gather, arrange corn delivery, divide into two
    bodies, and enter ki'wi'siwe by descending headfirst through hatchways to a fire
    altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin leads the gods from He'kiapawa ki'wi'sine to Si'aa' te'wita after
    their feasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A line of meal is sprinkled from the plaza entrance to the He'iwa ki'wi'sine,
    and a meal circle is formed at the base of the ladder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The main line of meal is crossed at equal intervals with differently colored
    meal lines associated with the six regions to mark the gods' positions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods are placed in an ordered line facing north, each standing with hands
    on shoulders on a cross line of meal.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The child is carried on the back of his godfather and wears a cotton shirt,
    blankets, and canvas in place of former bison robes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: As godfathers pass before the gods, the children are struck four times by
    each god with bunches of giant yucca; the Ko'mosona and Ko'pekwin do not take
    part in the whipping.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After passing the gods, the godfather enters the meal circle and ascends the
    ladder to the roof of the ki'wi'sine with the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Inside the ki'wi'sine, la'showanne are removed from sand figures and tied
    to the child's head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The director of the Great Fire fraternity gives the child a drink from the
    spring, dipping the water with an old shell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Children step on the sand painting and have their breasts and other body parts
    touched with sand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The children are seated in the plaza with godfathers behind them; women of
    the godfather's household stand beside each child and hold canvas that conceals
    the child.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: A square made of four meal crosses is formed in the plaza, and the passage
    states that these crosses symbolize the four regions.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Four Sa'ya'hlia stand on the meal crosses, face different directions, turn
    leftward, and make a circuit of the four regions.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: Each Sa'ya'hlia passes the children and strikes each child with increasing
    counts from one to four strokes according to the cross from which the Sa'ya'hlia
    comes.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The four Sa'ya'hlia form a north-facing line and strike each child four times
    while the child is carried on the godfather's back.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: After the striking sequence, the godfather takes the godchild home, where
    they join in a feast.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: The gods later assemble, arrange corn to be delivered by the Ko'loowisi, divide
    into two bodies, and go to two ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: Most of the gods enter the hatchway headfirst and descend the ladder in an
    inverted manner to the fire altar, ending with a somersault into the room.
  category: action
  evidence_refs:
  - ev:16
