canonical_text:
  quote: ''
  summary: The passage describes ceremonial movements and offerings after Shalako-related
    plaza dancing. Figures leave the plaza and return to the ki'wisine after receiving
    corn from gods; dancers repeatedly bring corn to officiating priests. The dancers
    are said to go east to visit gods and return by a northern route, while the described
    action places participants at Ku'shilowa depositing te'likinawe. Members of the
    Ko'tikili carry masks and eight te'likinawe, planting four to Kok'ko A'wa and
    four to Ko'yemshi. Personators of the mo'lawe gather at Ku'shilowa while chosen
    women carry watermelon and seed offerings.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bi^si'si goes to the ki'wisine, and the Ko'mosona and Ko'pekwm leave the plaza
    after receiving corn from the Mu'luktakia gods and return to the ki'wisine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plaza contains several lines of dancers in brilliant dress moving rhythmically
    until about half past 3 o'clock.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each time the dancers come, they bring corn that is received by officiating
    priests and carried to the ki'wisine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the dancers leave the plaza for the last time, they are said to go to
    Chi pia' in the east to visit the anthropic gods and then return to Ko'thluwala'wa
    by a northern route.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A figure caption identifies the action of depositing prayer plumes at Ku'shilowa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The participants visit Ku'shilowa, just beyond the eastern side of the town,
    where they deposit their te'likinawe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: All members of the Ko'tikili visit Ku'shilowa during the afternoon, each carrying
    a Kor'kokshi mask and eight te'likinawe; four are planted to Kok'ko A'wa and four
    to Ko'yemshi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those absent from Zuni or unable to go must have their masks and offerings
    carried by others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: While personators of the mo'lawe gather at Ku'shilowa, chosen women gather
    at the southeast point in the village carrying watermelon and seed offerings on
    their backs, held by blankets around their waists.
  category: action
  evidence_refs:
  - ev:5
