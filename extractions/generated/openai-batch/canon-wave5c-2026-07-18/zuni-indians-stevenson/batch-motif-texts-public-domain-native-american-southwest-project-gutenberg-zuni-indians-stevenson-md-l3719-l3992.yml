canonical_text:
  quote: ''
  summary: The passage narrates the A'shiwi emerging from inner worlds while carrying
    precious rain and crop fetishes. Water temporarily clears for their passage, the
    elder brother speaks of seeking the Middle of the world, and the people follow
    a road through named springs and places. The passage also names ancestral figures
    who know many things and are associated with making rivers and Ko'thluwala'wa
    mountain.
  language: English with Zuni terms and interlinear glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two wish for the rain priest of the East, who hastens while carrying precious
    things, including rain and crop fetishes, clasped to his breast.
