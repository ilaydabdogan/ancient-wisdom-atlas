canonical_text:
  quote: ''
  summary: The passage describes masked dancer groups and gods appearing in the plaza,
    their costumes and mask iconography, ritual sprinkling with sacred meal, the collection
    and receipt of corn offerings, prayers by ritual officials, and a note reporting
    that Na'tashku was adopted from the Hopi and has an identical Hopi mask.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wa'tem'la are the first dancers to appear in the plaza, coming from a
    newly dedicated house facing east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the gods in the Wa'tem'la group are the u'wannami, described as rain-makers,
    Na'tashku, and Na'wisho or O'lolowishkia, described as possessor of many deer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: O'lolowishkia is said to sweeten bread by micturating upon meal, and the penis
    is represented by a gourd with pendent white eagle plumes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ko'mosona approaches O'lolowishkia and prays while sprinkling the mask and
    artificial penis with sacred meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mu'Iuktakia wear embroidered kilts, fox skins, sleigh bells, strings of
    black and white corn, necklaces, and carry a plume-and-spruce staff and a gourd
    rattle.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The He'mishiikwe follow the Mu'Iuktakia to the plaza; their dress is similar,
    but their masks and surmounting tablets differ.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The He'mishiikwe tablet iconography is explained as including the sun, squash
    blossoms, different colors of corn, and a rainbow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each party of dancers brings ears of corn to the plaza, and the A'shiwanni
    collect the corn and carry it into the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'A note explains rain-related mask elements: bear claws as footprints in soft
    earth, lightning from cloud houses, eagle down as clouds, and dragonflies as suggestive
    of rain.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports that the Zunis assert Na'tashku was adopted from the Hopi,
    and that a Hopi sketch shows an identical mask.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Kia'kwemosi, his associate, and the Shi'wanni of the West sprinkle the
    Wa'tem'la with meal and pray before returning to the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The pe'kwin, the younger brother Bow priest, and the Ko'pekwin receive ears
    of corn from dancers, recite prayers to donors, and later return after praying
    and sprinkling gods with meal.
  category: action
  evidence_refs:
  - ev:9
