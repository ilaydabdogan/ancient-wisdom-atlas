canonical_text:
  quote: ''
  summary: The passage describes a multi-day Zuni fraternity ceremonial sequence involving
    dawn roof prayers with meal, music and dancing, sword swallowing, cold-water bathing,
    emetic drinking, food and contact restrictions, preparation and deposition of
    offerings and prayer plumes, wall decorations of celestial and deity figures,
    and later rites involving ha'kwani and rain-maker prayer plumes.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each morning at first daybreak, fraternity members ascend to the housetop
    in groups of two or three, offer short prayers, and cover a foot-sized spot with
    meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the last group descends, drum and rattle are heard, song begins, and
    dancing follows; during indoor dances the sword is continually swallowed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After one dance the men ascend to the roof to sing and then go to the river
    to bathe, breaking ice if necessary; a note describes dancers plunging into icy
    water and passing barefoot through frozen streets.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Women and children bathe from large bowls on the roof of the chamber between
    9 and 10 in the morning, and songs continue each night until the rising of the
    morning star.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the men return from river bathing they drink an emetic, vomit, and then
    take the morning meal; relatives bring food to the hatchway.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Continence and abstention from listed foods are required during the ceremonies
    and for four days afterward, and fraternity members must not touch or be touched
    by nonmembers until after sunset of the fifth day.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: On the first morning, male members prepare six te'likinawe each, assigned
    to the 'hle'et'tone, the mu'et'tone, deceased fraternity members, and Kok'ko A'wan;
    two men later deposit these offerings in a spring at the black rocks with prayers
    for snows and cold rains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The spring at the black rocks is identified as the place into which the original
    'Hlem'mosona is supposed to have disappeared.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The west wall of the ceremonial chamber is decorated with sun and moon symbols,
    A'chiyala'topa, Beast and Snake Gods, Pleiades, and Orion; snakes and stars are
    painted on the wall, and a cloud symbol of meal is made on the floor.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the second day, after the early morning dance, dancing stops until sunset
    while te'likinawe are prepared; after the sunset dance there is eating, smoking,
    chanting, and later dancing to rattle and drum.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the third day, each member makes five prayer plumes to deceased members
    of the fraternity, and dancing occurs during day and night; on the third and fourth
    nights the fraternity dances in the house where the Mu'waiye rehearse.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the fourth day, male members again make prayer plumes, a woman makes ha'kwani
    cotton loops symbolic of a sacred white blanket, and later selected participants
    make prayer plumes to the rain-makers and ha'kwani at the house of the 'hle'et'tone.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A fraternity member of the Dogwood clan receives a prayer plume from the Shi'wanni
    of the West and carries it to the chamber of the 'Hle'wekwe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note explains the food abstentions by referring to the fraternity's journey
    over the northern route to shi'piipolimn, where they subsisted on game because
    it was too cold for fruits of the earth.
  category: other
  evidence_refs:
  - ev:11
