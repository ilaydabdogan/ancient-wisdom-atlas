canonical_text:
  quote: ''
  summary: 'The passage describes Zuni mortuary handling of a deceased woman: washing,
    application of meal, cutting hair locks, dressing and wrapping the body, sprinkling
    meal, carrying the body to the grave, eastward head placement, burial, and post-burial
    cleansing. It also records a belief concerning burning hair of a deceased friend
    and inhaling the smoke, and begins a notice about the death and life of We''wha,
    a notable person described as a man wearing women''s dress and referred to as
    she.'
