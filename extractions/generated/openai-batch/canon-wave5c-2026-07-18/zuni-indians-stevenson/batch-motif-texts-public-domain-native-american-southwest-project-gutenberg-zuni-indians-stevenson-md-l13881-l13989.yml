canonical_text:
  quote: ''
  summary: 'The passage describes the Sha''lako ceremony: ritual running on a prepared
    ground, procession to houses, depositing te''likinawe and meal, placement of the
    effigy near an altar, ascent by ladder to a symbolic cloud house, litany and prayer,
    sprinkling with medicine water, dancing by performers and the giant effigy, and
    prayers by visitors at the altar and effigy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prepared ground is described as the last camping place of the Zunis during
    migrations in quest of the Middle of the world, and it is watered and stamped
    level and smooth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Six Sha''liiko are present: four stand at sides of the ground while two run
    back and forth; each takes a turn running before they proceed to separate houses
    after dark.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a house, the personator and his alternate deposit te'likinawe under the
    ladder and sprinkle meal while attendants sing with rattle accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The party is led into the house by the master of the house, his wife and daughters,
    and the mo'sona of the officiating fraternity, who carries his mi'li and a meal
    basket and sprinkles meal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inside the ceremonial room, the medicine water maker sits by a medicine bowl
    at the north side of the altar, and members of the fraternity are grouped on the
    south side.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Sha'liiko figure is placed on a blanket rug north of the altar, with its
    pole set into a small circular opening in the stone floor, while a blanket screens
    the placement.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The personator deposits seeds as a gift to the host and marks four meal lines
    on each of the north, west, south, and east walls; the alternate strikes the meal
    lines four times with giant yucca.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A ladder is held by five men while the personator ascends, attaches two te'likinawe
    to the symbolic house of the clouds fastened to the rafters, and is accompanied
    by choir, rattles, drum, flute, and a rhombus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ceremony repeats depositing offerings in the floor beneath and standing
    on a corn-husk package; the alternate sprinkles meal and the medicine water maker
    beats time with eagle plumes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After a litany, the Sha'liiko says that his children will stay five days,
    dance in the houses, go to the home of the gods in the east, leave te'likinawe,
    return to Ko'thluwala'wa, receive food, and bring seeds next year.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The medicine water maker dips plumes into the water, sprinkles toward the
    north and then toward each of the six regions, and touches the wet plumes to the
    lips of the personator and alternate.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The alternate dances, four members of the Hunters fraternity join him, and
    the personator enters the effigy behind a blanket before the giant god joins the
    dance.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The bearer of the effigy must dance with bent knees and needs an attendant
    to prevent stumbling or collisions because he cannot see through the blanket opening.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Each personator of a god is said to have the spirit of the represented god
    abiding with him for the time being.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Visitors entering the Sha'liiko houses, except dancers, go to the altar and
    effigy to pray and sprinkle meal.
  category: action
  evidence_refs:
  - ev:15
