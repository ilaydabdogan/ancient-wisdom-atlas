canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence: fraternity members sing
    with rattles; Bear clan men hold ritual implements; Mu''chailiha''nona enters
    with et''towe and hla''we bearers from the eastern covered way; he carries a basket
    of meal marked with pollen as the four regions and said to come from the undermost
    world; he sprinkles meal while eight maidens follow carrying ancient hla''we and
    mu''et''tone; the Mu''waiye then enter dancing sidewise with detailed ceremonial
    dress.'
  language: English
  quote_policy: summarized
