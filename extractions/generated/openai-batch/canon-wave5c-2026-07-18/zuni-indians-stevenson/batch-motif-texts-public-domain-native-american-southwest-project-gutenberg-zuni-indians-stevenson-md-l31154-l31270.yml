canonical_text:
  quote: ''
  summary: The passage describes the Zuni Bow priesthood scalp ceremonial as an initiation
    rite, explains trophy requirements and later use of stored scalps, lists appointed
    ritual roles and kinship rules, and narrates a sunrise ant-hill offering with
    prayers and rifle discharges by the pa'sewikla.
  language: English with Zuni terms and translated prayers
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The organization is said to celebrate two festivals: a scalp ceremonial or
    initiation of the victor, and an annual October harvest dance of thanksgiving
    for crops.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Killing an enemy alone is not sufficient for membership in the A'pi"lashiwanni;
    the victor must bring a scalp and at least part of the enemy's buckskin apparel
    as trophies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A warrior who did not take a scalp could still receive recognition by joining
    the Ko'shi'kwe, or Cactus, fraternity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After scalping had virtually ceased, the scalp ceremonial continued every
    three or four years by command of the elder brother Bow priest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated reasons for continuing the ceremony are to please the Gods of War
    so they will intercede for rain, and to prevent the organization from becoming
    extinct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: For these later ceremonies, scalps are taken from a scalp vase where trophies
    have long rested, and the ceremony is described as identical with one performed
    after a victor returned with a fresh scalp.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The elder brother Bow priest notifies the scalp custodian, arranges an elder
    brother for the victor, and chooses two warriors and two Coyote clan men to act
    as the pa'sewikla.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The number and identity of scalp-washers and scalp-kickers depend on the number
    of scalps and on paternal kinship rules; odd numbers of scalps require division
    because of a stated dual system.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the described 1894 ceremony, the pa'sewikla leave the pueblo on horseback,
    spend the night north of the village, return at sunrise, and stop at the first
    ant-hill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the ant-hill, two warriors hold olive shells near the mouth, two others
    hold shell-bead strings, and one stooping man whispers a prayer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The prayer calls on the Sun Father rising from his night house and on gods
    of the six regions to arise and come forth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Shells and shell strings are deposited at the apex of the ant-hill while ants
    of different colors and the six regions are addressed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The prayer mentions colored A'hayuta, named beings, an arrow-storm wind, an
    enemy coming from ambush, a Navajo being killed, and the sacred breath of day.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: After the prayer sequence, the men fire rifles, halt repeatedly for spoken
    formulas, fire further shots, and proceed to the north side of the pueblo.
  category: sequence
  evidence_refs:
  - ev:11
