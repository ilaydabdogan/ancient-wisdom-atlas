canonical_text:
  quote: ''
  summary: 'The passage classifies higher powers into seven heads: universal, celestial
    anthropic, a stellar/celestial class represented by carvings and paintings, terrestrial,
    subterranean anthropic powers not personated, subterranean anthropic powers represented
    by masks and one serpent-form image, and terrestrial/subterranean zoic gods. It
    names powers and describes functions including giving life, light, warmth, vegetation,
    self-gift, protection against witchcraft effects, and intercession.'
  language: English
  quote_policy: summarized
