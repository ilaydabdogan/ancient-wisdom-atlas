  quote: ''
  summary: The passage describes a secret escorted visit to a mountain cave shrine,
    the temporary removal and photographing of sacred objects identified as images
    of Pa'yatamu, the presence of te'likinawe with plumes, the return of the objects
    to the cave, and the community excitement after the party was discovered descending
    the mountain.
  language: English
