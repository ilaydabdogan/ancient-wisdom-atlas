  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Quantities of te'likinawe with plumes were found in the cave and in crevices
    in the roofing rocks, along with many older examples lacking plumes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: After photography, the officer and the writer returned the sacred objects
    to their places in the cave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The party was discovered while descending the mountain, information was carried
    to the village, and there was great excitement when the writer and companions
    returned.
  category: sequence
  evidence_refs:
  - ev:5
