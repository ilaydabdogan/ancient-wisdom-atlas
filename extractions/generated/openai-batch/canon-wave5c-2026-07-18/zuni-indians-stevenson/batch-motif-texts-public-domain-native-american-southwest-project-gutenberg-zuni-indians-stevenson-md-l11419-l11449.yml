literal_observations:
- id: obs:1
  text: Directors of the Little Fire and Cimex fraternities delegated two members
    of the Flute order, one an officer, to accompany the writer to a sacred spot and
    instructed them to maintain secrecy about the visit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party traveled indirectly and presented the trip as a pleasure ride rather
    than going directly to the sacred locality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the climb was long and the cave had become too shaded for photography,
    objects from the shrine were removed and placed in sunlight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The aged officer objected strongly and begged that the images of Pa'yatamu
    not be taken from the place where they had long rested.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The photographed figures were arranged in line on a ledge below the shrine
