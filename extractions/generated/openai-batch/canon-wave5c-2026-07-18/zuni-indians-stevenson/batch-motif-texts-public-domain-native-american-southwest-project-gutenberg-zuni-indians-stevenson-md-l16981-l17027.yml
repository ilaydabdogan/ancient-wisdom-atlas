canonical_text:
  quote: ''
  summary: 'The passage describes Zuni marriage customs: courtship through a man’s
    request to visit a girl’s house, parental consent, a meal and instruction in marital
    duties, a five-night stay with work for the bride’s family, approval by the groom’s
    parents, exchanges of a dress, corn meal, deerskin, and wheat, residence at the
    bride’s mother’s house, a sleeping restriction for the couple, and general statements
    about monogamy, polygamy, and divorce.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man pleased with a girl meets her on the road, states his admiration, and
    asks permission to go to her house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the girl favors the suitor, she says she will first speak to her father
    and mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the girl’s parents are willing, the man accompanies the girl to her home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the girl’s home, the mother seats the visitor and directs the daughter
    to bring food and place it on the floor before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After bringing the meal, the girl sits facing the visitor while he eats and
    the parents talk to him about the duties of a husband to a wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father tells the man to work hard, watch sheep, cut wood, and plant and
    cut grain; the mother tells him to be kind and good to his wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man remains at the house for five nights, sleeps alone outside the general
    living room, and works for the family during the day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the sixth morning, the man goes to his parents’ house, tells them where
    he has been, and receives approval if they are pleased with the match.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: When the groom returns from visiting his parents, he carries a dress as a
    present from his mother to the intended daughter-in-law.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bride receives the dress, grinds corn into flour, and the next day carries
    the meal in a basket on her head to the groom’s mother’s house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The bride presents the meal to her mother-in-law, who thanks her, seats her,
    and gives her bread and meat if available.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before the bride leaves, the father-in-law gives her a folded deerskin for
    moccasins; the basket is filled with wheat by the mother-in-law and the deerskin
    is laid on it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bride and groom return to the bride’s mother’s house, where they make
