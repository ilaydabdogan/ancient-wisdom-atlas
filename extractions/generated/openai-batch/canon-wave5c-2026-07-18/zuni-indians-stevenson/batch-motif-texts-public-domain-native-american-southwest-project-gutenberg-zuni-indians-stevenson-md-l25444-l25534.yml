canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence involving the ''Hle''wekwe
    and the Great Fire fraternity: groups circle and face boxes in the plaza, women
    remove a basket of meal, novices and catchers appear, sword-swallowing specialists
    perform directional circuits and prayers, an aged warrior appears in a mask, novices
    are chased and whipped with willow switches, and participants enter a ceremonial
    chamber where related clans are present. A brief opening statement names animal
    warriors, the Pleiades, and Orion as warriors of the Sun Father.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that animal warriors labor for the Sun Father on earth,
    while the Pleiades and Orion are important celestial warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ritual parties repeatedly turn toward boxes in the plaza; the female leader
    of the 'Hle'wekwe precedes others, and the Sword order of the Great Fire fraternity
    forms a circle around the boxes while spectators watch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two women of the 'Hle'wekwe remove a basket of meal from the larger box after
    musicians tip it toward them; a note says the basket is later deposited at Ma'sakla
    in an excavation at the base of the ruin mound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A male and female novice of the 'Hle'wekwe appear with catchers who are also
    called their fathers; their clothing and positions near the plaza walls are described.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The 'Hlem'mosona and a 'Hle'wekwe warrior enter the dancers' circle carrying
    swords; the warrior also carries six swords in a cougar-skin quiver.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The 'Hlem'mosona swallows swords, makes circuits to the six regions and cardinal
    points with stamping, hooting, and crying, and later he and the warrior face west,
    swallow swords, wave them over the boxes, and pray.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: An aged warrior dons a mask described as unlike god-personator masks but similar
    to a common falseface, returns to the plaza, and causes amusement.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Six 'Hle'wekwe, including two women, enter carrying long slender willows;
    this signals the novices to run after passing the right hand around the head three
    times and throwing a la'showanne of four fluffy eagle plumes to the ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: Catchers and switch carriers pursue the novices; some switch carriers strike
    spectators, and whipping of the novices stops at the ladder to the ceremonial
    chamber hatchway.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: Inside the ceremonial chamber, the clans of the two fraternity fathers and
    their paternal Turkey clans crowd ledges while the fraternity forms lines at the
    west end of the room.
  category: setting
  evidence_refs:
  - ev:11
