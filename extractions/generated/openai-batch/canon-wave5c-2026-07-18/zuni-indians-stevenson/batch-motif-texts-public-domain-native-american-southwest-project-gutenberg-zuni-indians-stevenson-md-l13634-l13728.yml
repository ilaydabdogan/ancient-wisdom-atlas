- id: motif:1
  label: Offerings exchanged for rain, crops, health, and long life
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes offerings of meal, seeds, plumes, and other objects,
    accompanied by prayers for rains, good crops, health, long life, and good outcomes
    for the household.
  evidence_refs:
