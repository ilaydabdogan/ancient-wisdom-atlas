canonical_text:
  quote: ''
  summary: 'The passage describes a Sha''lako-related U''huhukwe fraternity ceremony
    around an altar: singers, flutist, A''shiwanni, named gods, basket offerings,
    wall markings, te''likinawe plumes for Sun Father and Moon Mother, a rafter device
    called the house of the clouds, prayers for rain, crops, health, long life, offerings
    placed through a covered floor opening symbolic of the fourth world, seed symbolism,
    closing enemy-related prayers, stamping, and seating of the gods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of the U'huhukwe fraternity form a choir on the south side of the
    room near the west end, and the fraternity flutist sits behind the altar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'shiwanni stand in line and sprinkle the gods as the gods pass meal up
    the line to the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kia'kwemosi and the pe'kwin each hold a flat basket; Shu'laawi'si empties
    contents from his fawn skin into the pe'kwin's basket and lays rabbits and rats
    over it, while the other gods deposit seeds from their belts into the Kia'kwemosi's
    basket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two A'shiwanni wave their baskets to the six regions and deposit them before
    the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Sa'yatasha and Hu'tutu stamp back and forth, and Sa'yatasha marks four downward
    meal lines on the north, west, south, and east walls; Ya'niuhakto runs a bunch
    of yucca downward over the lines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sa'yatasha mounts a low platform and attaches two te'likinawe, one blue for
    the Sun Father and one yellow for the Moon Mother, to a painted wooden device
    fastened to a rafter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The painted rafter device is described as symbolic of the house of the clouds
    and as present in every house blessed at the Sha'lako festival.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: During the placement of the te'likinawe, the choir sings with rattle and drum,
    the flutist plays behind the altar, and a warrior of the fraternity whirls the
    rhombus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The plumes are placed with prayers for rains, good crops, health, long life,
    and other good things associated with the pure breath of life and A'wonawil'ona.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After Sa'yatasha steps down, Ya'niuhakto and then the other gods sprinkle
    the te'likinawe with meal and pray while rattles are shaken.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sa'yatasha deposits offerings through a circular opening beneath the stone
    floor directly under the cage; the openings are described as symbolic entrances
    to A'witen te'hula, the fourth world, and are carefully covered when not open
    for such occasions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A small game object with attached la'showawe, grains of corn of the colors
    of the six regions, and several kinds of crop seeds are deposited as seeds in
    the earth; offerings below are described as symbolic of the seeds of life, and
    offerings above as symbolic of life itself.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Prayers are offered for seeds to grow into life, for rain and much corn, and
    for the children of the house to mature without disease, grow old, and sleep to
    awake in Ko'thluwala'wa rather than die.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After each god has sprinkled meal into the opening and prayed, the music ceases,
    the warrior puts away the rhombus, and the gods stand with the left foot on a
    small corn-husk package while praying that enemies may succumb to their children.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Kia'kwemosi seats each god on the north side of the chamber by placing
    his hands on each one's shoulders and motioning him to the six regions.
  category: action
  evidence_refs:
  - ev:8
