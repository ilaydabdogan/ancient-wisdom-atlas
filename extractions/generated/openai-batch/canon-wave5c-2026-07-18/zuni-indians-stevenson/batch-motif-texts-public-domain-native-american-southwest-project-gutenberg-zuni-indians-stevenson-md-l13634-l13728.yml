- id: motif:2
  label: Seeds in the earth as life renewal
  taxonomy_refs:
  - seasonal_cycle
  basis: Seeds and colored corn are placed in the earth; the passage explicitly says
    the lower offerings symbolize the seeds of life and the upper offerings life itself,
    followed by prayers that seeds grow into life and that rain and corn increase.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: Seasonal renewal is inferred from agricultural seed and rain symbolism
    directly described in the passage; no annual crop-cycle myth is narrated here.
- id: motif:3
  label: Ritual chamber linked to sky, directions, and fourth world
  taxonomy_refs:
  - world_center
  basis: The ceremony links the room to the six regions, four walls, a rafter-mounted
    house-of-clouds device, and a floor opening described as symbolic entrance to
    A'witen te'hula, the fourth world.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  confidence: medium
  cautions: The text does not explicitly call the chamber a world center; the taxonomy
