canonical_text:
  quote: ''
  summary: 'The passage presents plate captions, then describes Zuni food customs:
    treatment of guests, animals eaten or not eaten, native corn-based drinks including
    one used ceremonially and during rain-priest fasts, favored introduced drinks,
    two daily meals, meal vessels and eating practices, and a pre-meal act in which
    adults place bits of food in the fire with prayer as an offering to the dead;
    when strangers are present, this grace is omitted publicly and food is instead
    set aside covertly.'
