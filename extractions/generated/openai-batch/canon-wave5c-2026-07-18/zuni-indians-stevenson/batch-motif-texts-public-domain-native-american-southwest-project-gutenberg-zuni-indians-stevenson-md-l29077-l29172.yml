canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions in a Shu''maakwe initiation
    ceremonial: body painting and dress, the Sai''apa personators, root chewing and
    rubbing to prevent fatigue, music, placement of pebble fetishes, water rites directed
    to the six regions, consecration of medicine and cloud bowls, smoke and sprinkling
    rites, circular dancing, production of suds called clouds, masked personation
    of the Shumai''koli of the North, nighttime visits to other ceremonial chambers,
    silence, and the positioning of novices with women in a hand-linked line.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants assist one another in careful body painting; paint is applied
    with the fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Female members paint lower arms, hands, lower legs, and feet white.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two men and a boy who personate the Sai'apa are painted white from neck to
    toe and are described as appearing nude during indoor ceremonials, with a stated
    injunction that apparel be dispensed with by their personators.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women wear black-wool dresses embroidered in blue, red belts, bare necks,
    and many necklaces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each participant receives a bit of root from the a'kwamosi, chews it, ejects
    it into the hands, and rubs it on self and others to avoid fatigue in the dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A pottery drum with hide covering, rattles, a flute, and a rhombus accompany
    songs during the rite.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A vase of water, a cloud bowl containing bits of root, and a medicine bowl
    are arranged near the altar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The a''kwamosi places six pebble fetishes for fructification: four around
    the medicine bowl and two for Zenith and Nadir east of it, while offering prayers.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The deputy a'kwamosi waves gourdfuls of water to the six regions with prayers
    for rain, waves the gourd in a circle symbolic of the whole world, and pours water
    into the medicine and cloud bowls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The a'kwamosi consecrates the water in the medicine bowl by dipping in pebble
    fetishes and other items, while the deputy places root bits into the cloud bowl
    and rapidly whips the water with a reed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The a'kwamosi draws smoke from a corn-husk cigarette six times and blows it
    into the bowl of water, then waves the cigarette toward the altar, the six regions,
    and in a circle, and briefly places the lighted end in his mouth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cloud-maker repeats the cigarette rite over the cloud bowl and continues
    making clouds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The a'kwamosi dips eagle plumes into consecrated water and sprinkles the altar
    while chanting a prayer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Men and women form a circle and dance from left to right while the three Sai'apa
    dance back and forth inside the circle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The cloud-maker makes suds in the cloud bowl, returns fallen suds to the mass
    with his reed, and later throws suds over the altar while chanting in low tones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The master of ceremonies removes a yellow-faced mask from behind the altar
    and carries it concealed in new cotton cloth for the man dressing to personate
    the Shumai'koli of the North.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Shumai'koli of the North emerges from the dressing room, steps inside
    the circle, and dances.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: After the dance closes, most participants leave to visit other ki'wi'siwe,
    while the master of ceremonies, the Great Mother, four novices, two Sia guests,
    and the writer remain in silence.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: Upon the a'kwamosi's return, he chants before the altar; the four novices
    stand in line with five women alternating with the men and clasping hands with
    entwined fingers, with the novices' hands above.
  category: action
  evidence_refs:
  - ev:12
