canonical_text:
  quote: ''
  summary: The passage describes a Zuni healing ceremony over a young man with small
    pox, led by the Kia'kwemosi with assisting theurgists using medicine water, eagle
    plumes, sacred meal, prayers to Beast Gods, and four-night invocations of directional
    winds. It also explains the secrecy and authority associated with the rite and
    gives an origin account for the Rattlesnake Fraternity as a division of the U'huhukwe
    after a broken medicine bowl, spilled medicine water, and an overturned rattlesnake
    carving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man with small pox had not been cured by previous theurgists, so the
    Kia'kwemosi was appealed to as a theurgist of the r'huhuhwe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr Stevenson and the writer entered after finding the door guard asleep; an
    officiating theurgist said their presence would be fatal to the invalid, but they
    remained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The room was dimly lit by an old Zuni lamp, and the Kia'kwemosi sat in the
    center facing east with medicine water, eagle plumes, and sacred meal before him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The patient partially reclined on a blanket on the north side of the room,
    supported by his mother, while two theurgists acted under the Kia'kwemosi's direction.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: One assisting theurgist held eagle-wing plumes; another sprinkled medicine
    water from his mouth onto the patient's nude body and waved plumes over him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Kia'kwemosi placed pinches of sacred meal on spots over the patient's
    body and called on the Beast Gods to give him power to draw the disease to one
    of the meal spots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rite continued for four nights, with the Cougar of the North, Bear of
    the West, Badger of the South, and Wolf of the East each appealed to for a directional
    wind to heal the sick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Only the mother, doorkeeper, and officiants were present; the Kia'kwemosi's
    prayers were not to be heard by other persons or the desired power would not be
    granted.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the Kia'kwemosi officiated as a member of the order
    of Mystery medicine, not as rain priest, though his high priestly position gave
    additional power because the rain priests must be pure of heart.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Rattlesnake Fraternity is described as a division of the U'huhukwe, created
    after a member broke a medicine bowl, spilled the medicine, overturned a rattlesnake
    carving, and a quarrel led to division.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The division was called Rattlesnake because the carved snake fell and was
    bathed in spilled medicine water, and because the fraternity quarreled like angry
    snakes; the two fraternities are said to have the same functions.
  category: relationship
  evidence_refs:
  - ev:8
