canonical_text:
  quote: ''
  summary: The passage describes a Zuni fraternity ceremony with invited guests, distribution
    of sacred meal and medicine, consecration of medicine water, offerings to the
    Beast Gods, ash sprinkling with plumes, six-region sprinkling, healing dances,
    and the departure, decoration, return, and dancing of novices during an initiation
    sequence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of the A'pial;ishiwanni may attend meetings of all fraternities, and
    other invited persons may attend and participate in healing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Guests from the Shu'maakwe fraternity, guests from the Little Fire fraternity,
    and two theurgists from Sia are received and seated in the ceremonial room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacred meal is given from corn husks into the left palm, and medicine from
    corn husks is taken into the mouth, expectorated on the body, and rubbed over
    the body with the right hand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Meal is sprinkled on the altar; food is carried away from before the altar;
    the a'kwamosi makes a cross of meal for the medicine bowl and raises the bowl
    to signal the choir.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two participants return after offering food to the Beast Gods, sprinkle meal,
    and pray near the altar before the consecration of the medicine water is completed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The a'kwamosi sprinkles medicine water on the altar with plumes, and a female
    theurgist gathers ashes from the fireplace and places them before the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two men lift ashes with plumes, move down opposite sides of the room in an
    elliptical course, sprinkle the people with ashes, manipulate and strike their
    plumes, and utter an exclamation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ashes are sprinkled to the East, North, West, South, Zenith, and Nadir, and
    the six-region sprinkling is repeated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women dance in a line, more dancers and theurgists appear, and theurgists
    heal sick people before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Because invited guests are present, the novices leave at midnight to be decorated;
    each fraternity parent is preceded by the corresponding fraternity child, and
    the Great Mother carries kaolin mixed with water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The novices return with their fraternity parents, with limbs painted white,
    red belts, hawk down on white paint, kaolin on the chin and upper lip, and owl
    and raven feathers fastened at the wrist with yucca ribbons.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the white paint circle with hawk down on the head
    is symbolic of the clouds of the world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the novices return, song and dancing resume; the director dances before
    the altar, twists and bends, growls like an animal, and draws disease from invalids.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A warrior stands by the altar holding eagle plumes, the novices dance in line,
    theurgists alternate healing and dancing, and the choir grows louder except during
    a brief rest.
  category: sequence
  evidence_refs:
  - ev:8
