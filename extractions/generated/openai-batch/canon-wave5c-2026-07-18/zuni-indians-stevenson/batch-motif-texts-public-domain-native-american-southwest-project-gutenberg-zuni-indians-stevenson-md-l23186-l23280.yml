canonical_text:
  quote: ''
  summary: The passage describes bathing, dress, etiquette, abstinence, plume handling,
    adornment, and sunrise closing rites for novices in Zuni Mystery medicine fraternity
    ceremonies, including ritual washing, feathers, paint, corn, prayer plumes, gifts,
    and inhaling sacred breath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women bathe in a corner of the general living room while keeping or using
    cotton garments so that they are not exposed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men present during the women's bathing are described as appearing unconcerned
    with the ablutions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For ceremonials, women's necks and arms are bare; men wear cotton clothing
    in the chamber and usually only a woven breechcloth in dances; both sexes remove
    moccasins on entering the chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ceremonial chamber etiquette requires greeting and seating newcomers, and
    sleeping is prohibited except for extremely aged members described as almost sacred.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the ceremonial closes, each member's head is washed in yucca suds, and
    continence is observed during the ceremonials and for four days afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A novice wears a plume for four days while observing continence and abstaining
    from animal food and grease; the fast continues four days after initiation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fraternity father removes the novice's plume at Ku'shilowa, ties it to
    a yucca blade, sprinkles it with meal, prays for long life and a true heart, and
    deposits it on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After returning, the member elect goes to the fraternity father's house, where
    the wife or daughter bathes his head, and he is then feasted without animal food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Novices sit on the north side near the altar, then cross to the south side,
    usually near the fireplace, where fraternity fathers adorn them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Mystery medicine adornment includes brownish-red coloring for males, kaolin
    on limbs and face areas, woven garments, and crossed owl and raven feathers on
    wrists and legs.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: The passage states that the feather placement relates to being up early with
    the raven and going about at night without fear like the owl; it also states that
    down over kaolin is symbolic of clouds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: After adornment, invited female guests hold the novices' hands; in some cases
    the wife and elder sister of the fraternity father sit on the novice's left and
    right.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At sunrise closing ceremonies, novices are seated on blanket-covered boxes
    facing east, with a wife or sister of each fraternity parent standing behind and
    resting hands on the novice's shoulders.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: A vase of water and a bowl containing yucca root are set before each novice,
    with makers of suds standing beside them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Each novice receives gifts from the altar, including mi'li, four ears of corn
    tied with yucca ribbon, prayer plumes, and eagle-wing plumes with a red fluffy
    eagle feather emblem.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Before each gift is presented, it is drawn four times across parts of the
    head and before the mouth, and the candidate inhales sacred breath.
  category: action
  evidence_refs:
  - ev:9
