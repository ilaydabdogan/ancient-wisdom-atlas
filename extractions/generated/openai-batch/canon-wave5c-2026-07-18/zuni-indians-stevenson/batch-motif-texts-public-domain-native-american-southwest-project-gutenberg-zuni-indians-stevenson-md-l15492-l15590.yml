canonical_text:
  quote: ''
  summary: 'The passage describes portions of Zuni ceremonial activity following the
    Sha''lako festival: women race with offering baskets to Ku''shilowa; Bi''si''si,
    the pe''kwin, Pau''tiwa, Ko''yemshi, mo''lawe, Bow priests, and other officers
    conduct processions and rites involving meal, masks, feathers, smoke, water, directional
    turning, shrine deposition, roof-corner crosses, whistles, baskets, and ladders.'
  language: English with Zuni ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man of the Ai'vaho'kwe clan throws a line of meal toward Ku'shilowa and
    commands selected women to run.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women run to Ku'shilowa and place baskets containing offerings in a line
    on the ground at the place where the Corn maidens are said to have stood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bi'si'si descends a ladder face forward, goes through the eastern covered
    way with the pe'kwin, and returns at sunset with Pau'tiwa and mo'lawe attendants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pau'tiwa is masked, dressed in white embroidered blankets, and carries a gourd
    jug of water whose neck is filled with grass.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mo'lawe carry baskets on their heads containing a watermelon and seeds,
    and they carry te'likinawe and mi'li in their hands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Father Ko'yemshi meets the procession at the eastern covered way,
    and the procession crosses the plaza in file.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The pe'kwin sprinkles meal while proceeding to the ki'wi'sine, Pau'tiwa prays
    at the hatchway, and Bi'si'si pats Pau'tiwa on each side with eagle-wing feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pe'kwin lights a cigarette at the fire altar with cedar fiber and blows
    smoke six times over Pau'tiwa's mask and six times over the jug of water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those present sprinkle meal over Pau'tiwa's mask and the water jug, and Pau'tiwa
    later leaves by the western way while his mask is sprinkled with meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pe'kwin places his hands on Bi'si'si's shoulders, turns him to the six
    regions, seats him, and prays over him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Shi'wanni of the Nadir proceeds with assistants carrying the jug and a
    lighted cedar brand, whirls the rhombus, empties the jug's water into a rain vase
    at He'patina, deposits te'likinawe, and returns to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Pau'tiwa leaves the plaza, Ko'yemshi leads mo'lawe around in a circle,
    stopping four times; meal crosses are made at the four roof corners of the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the roof corners, Bi'si'si blows a hidden whistle and taps a mo'lawa with
    eagle-wing plumes as the mo'lawa turns; the sequence is repeated at four corners,
    and the Kia'kwemosi receives the basket before the mo'lawa jumps to the ladder
    while being whipped on both sides.
  category: sequence
  evidence_refs:
  - ev:8
