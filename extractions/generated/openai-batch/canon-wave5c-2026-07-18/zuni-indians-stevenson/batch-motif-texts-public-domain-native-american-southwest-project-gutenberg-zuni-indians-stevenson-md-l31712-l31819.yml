canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni post-scalping victory ceremonial sequence:
    rejoicing dance and prayers to the Gods of War, food and contact taboos for the
    victor and attendants, four nights of seclusion, preparation and deposition of
    prayer plumes, a fifth-day scalp-pole episode, making of war regalia from enemy
    apparel, ritual bathing, and formal choirs with drums for the elder and younger
    Gods of War.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dance and song rejoice in the destruction of the enemy; mothers lead young
    children to the dance and pray to the Gods of War to give enemy lives to the Zunis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victor avoids animal food, grease, salt, hot food, and sexual intercourse
    for ten days; the continence rule is attributed to the command of the Gods of
    War.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The victor, elder brother, and scalp-kickers observe shorter shared restrictions,
    including distance from the fireplace, not removing clothing during four nights,
    not smoking, not being touched, and not receiving items directly by hand.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: During the first four nights the victor, elder brother, and scalp-kickers
    stay in the ceremonial chamber apart from women; warriors assemble, sing, and
    brandish the war club.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The victor and Bow priesthood members make eight prayer plumes as offerings
    to the Gods of War; the plumes are paired and deposited on ant-hills at the four
    cardinal points, with similar repetitions on later days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the fifth day the victor's elder brother stands by the scalp pole for six
    hours, is hindered by the crowd when leaving, and returns with meat and melons
    that cause scrambling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A buckskin war pouch, wristlet, and skullcap with hawk plumes are described
    as badges of office or honor; the pouch and wristlet are said to be made from
    enemy apparel, and arrow points are added for further scalps up to eight.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the fifth morning the scalp-kicker and his aid bathe the victor's whole
    body with cold water, washing his blood-stained hands for the first time since
    the scalping, while he remains away from the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At noon on the fifth day, eight selected singers form two choirs at opposite
    ends of the Bow ceremonial chamber, one for the elder God of War and one for the
    younger God of War, using archaic pottery drums and drumsticks, including one
    marked with a lightning zigzag.
  category: setting
  evidence_refs:
  - ev:9
