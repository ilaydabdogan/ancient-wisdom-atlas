canonical_text:
  quote: ''
  summary: 'The passage describes night and morning ceremonies of a Zuni fraternity:
    participants dance and swallow sword/tree elements, officers deposit prayer plumes,
    water is consecrated in a medicine bowl with plumes, buds, fetishes, directional
    gestures, flute, rhombus, rattle, drum, and song, and participants process to
    an altar to petition for rain before washing, painting, and preparing for an outdoor
    dance.'
