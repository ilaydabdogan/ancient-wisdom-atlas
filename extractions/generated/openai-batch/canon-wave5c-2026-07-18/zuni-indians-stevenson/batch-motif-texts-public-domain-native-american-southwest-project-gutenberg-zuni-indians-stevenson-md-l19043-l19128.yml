canonical_text:
  quote: ''
  summary: The passage describes several Zuni games, including a circle-catching game
    played in the sacred dance court, a jumping-file game accompanied by songs about
    youths, birth, hunting, rain, and springs, and several stone, stave, disk, and
    board games with stated rules.
  language: English with Zuni terms and transcribed song words
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ya'chuni sa'wanni game is described as played in the sacred dance court
    by the Ko'vemshi and the Galaxy fraternity between dances.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Ya'chuni sa'wanni, men form a clasped-hand circle around one player in
    the middle, who tries to catch one of the others as they jump around; a caught
    player takes the middle place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The final Ya'chuni sa'wanni contestants hop on one foot, and the remaining
    player must hop to the grouped players before putting the other foot down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The song for Ya'chuni sa'wanni repeats words the Zunis are said not to understand
    and believe came from the Ko'yemshi gods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Kiash'tuwiwi, two files of men hold each other around the waist, the leaders
    clasp hands, and the groups jump about the plaza or form opposing lines and jump
    back and forth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leaders' songs in Kiash'tuwiwi tell stories of youths of old and of how
    their fathers fell in love with their mothers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: One sung youth comes from his mother, receives a bow and arrow reeds from
    his grandfather, kills many deer near the cornfield, and fasts because heavy rains
    follow his successful hunt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another sung youth describes experience before birth, sees a little light,
    discovers a road by which he may come into the world, and decides not to remain
    in his mother's womb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The second youth's parents and grandparents rejoice at his birth; when older,
    he receives a bow and arrows from his grandfather, hunts deer near the cornfield,
    and rain waters the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chorus of Kiash'tuwiwi compares rupture of the membranes to violent rains
    that make springs flow through holes in rocks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ta'sholwe uses colored staves, forty small stones arranged as a four-segment
    circle, a central disk, and markers moved by throws; markers may be said to be
    killed, and the winner must reach the opening called a doorway or spring.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tan'kalawe uses a stone disk thrown in relation to a line and a corncob or
    stone stake, with win or loss determined by where the disk lands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A'wef'laknawe, glossed as 'stones kill,' uses small flat stones of different
    colors and a stone slab or ground board with geometrical markings.
  category: object
  evidence_refs:
  - ev:8
