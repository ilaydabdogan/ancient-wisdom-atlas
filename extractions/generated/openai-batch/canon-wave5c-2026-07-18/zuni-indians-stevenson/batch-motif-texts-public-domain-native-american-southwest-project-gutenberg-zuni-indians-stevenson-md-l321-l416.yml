canonical_text:
  quote: ''
  summary: The passage acknowledges people who assisted the writer and then introduces
    Zuni conceptions of the universe. It describes a spiritualized natural world,
    the earth as a mother-source of plant and animal sustenance, the dead as providers
    of water, post-mortem destinations and transformations, rain-makers collecting
    water and ascending with breath plumes, cloud masks through which rain is poured,
    and smoke or fire offerings associated with cloud production and rain-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts the author's characterization of civilized man's analytical
    understanding of natural phenomena with primitive man's analogical, mystical,
    and symbolic understanding.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Celestial bodies, mountains, rocks, flora, and the earth are described as
    possessing spiritual life for the aboriginal man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Zunis are said to symbolize many life-nourishing things as mother, and
    the earth is described as the source of vegetal matter and game.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Zunis are said to believe that the earth is supplied with water by their
    dead of both sexes and all ages above infancy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Infants are said to reach maturity soon after going to the undermost world,
    described as the place from which the Zunis came.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The deceased are said always to go first to Ko'thluwala'wa, Dance village,
    the abiding place of the Council of the Gods, and often return there to dance
    in the great dance house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Deceased members of the A'pi''lashiwanni, or Bow priesthood, are described
    as an exception who join the Ku'pishtaya and become lightning-makers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The u'wannami, or rain-makers, are said to be controlled and directed by the
    Council of the Gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Shadow people are described as collecting water in vases and gourd jugs from
    the six great waters of the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The rain-makers are carried by steam from springs to the upper plane when
    supplied with breath plumes, and Zuni individuals make these offerings monthly
    at full moon.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The rain-makers pass over the upper plane, hidden from people below by cloud
    masks, and pour water through the cloud masks rather than the clouds themselves
    falling as rain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Clouds are said to be produced by the breath of the gods and smoke, and larger
    smoke offerings are said to give greater inducement for rain-makers to work.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: At summer solstice, a torchbearer is described as setting fire to everything
    in his way from Ko'thluwala'wa to Zuni; greater smoke offering is associated with
    heavier cloud masks.
  category: sequence
  evidence_refs:
  - ev:12
