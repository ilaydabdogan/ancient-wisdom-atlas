canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial healing performance associated
    with the Great Fire Fraternity or Mystery medicine order. Participants use eagle
    plumes, medicine water, fire, meal, prayer, dance, extraction of supposed harmful
    objects from patients, burial of extracted matter, and fourth-night wall and body
    decorations involving animal paintings and hematite or white paint.
  language: English with Zuni terms
  quote_policy: summarized
