canonical_text:
  quote: ''
  summary: The passage describes preparatory washing, gifts, and offerings connected
    with the Zuni sho'liwe game; explains the split reed implements, their association
    with elder and younger Gods of War, the method of throwing and scoring; and notes
    a ceremonial rain-priest use of the game without personal gain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl prepared suds; others rubbed suds over the narrator's head with plumes;
    the girl and the uncle's wife washed the narrator's hair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle gave the narrator four ears of corn, colored yellow, blue, red,
    and white, tied together, and enough calico for a shirt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The uncle said the gifts were given so the narrator might receive such things
    from the man with whom he played.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The uncle instructed the narrator to carry four prayer plumes to an arroyo
    where debris from running water had collected and plant them to the Gods of War.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near the selected place for depositing the plumes, the narrator whirled a
    rhombus, later returned it to the uncle, kept the sho'liwe until the anniversary
    of the loss, won back the lost articles, and returned the sho'liwe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each player takes the side of one of the Gods of War; four split reed pieces
    are used, two for the elder God of War and two for the younger God of War.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The reeds have black coloring, daubs, markings, and sometimes dots that denote
    the whole day, parts of the day, sunrise, sunset, first light, and sometimes eyes
    and mouth of a face.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The reed arrangement differs according to whether the representative of the
    elder or younger God of War plays; the reed crossing the others is called the
    thrower.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The reeds are thrown upward against an inverted basket covered with cloth
    or blanket and fall to a blanket spread on the floor; an outdoor version suspends
    the basket from tripod poles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Specified concave or convex sides and crossings determine whether a trick
    is won, lost, or goes to the opponent; silver buttons are the favorite chips.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sho'liwe is described as a favorite lot game of professional gamblers, but
    rain priests play it for rain without thought of personal gain.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When rain priests play, buckskins replace the cloth covering and floor blanket,
    the floor skin has its head to the east, and a portion of a circle, quadrant,
    or octant is drawn on the skin.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note says play must begin on the same day of the month as the loss, may
    continue until the summer solstice, must not occur while rain priests are in retreat
    for rains, and may be repeated another year while the player purifies the heart.
  category: sequence
  evidence_refs:
  - ev:4
