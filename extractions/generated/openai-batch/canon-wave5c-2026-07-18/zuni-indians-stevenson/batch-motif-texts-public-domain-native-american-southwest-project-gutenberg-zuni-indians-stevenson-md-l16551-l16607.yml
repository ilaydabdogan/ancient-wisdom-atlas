canonical_text:
  quote: ''
  summary: The passage gives an ethnographic medical account of Zuni childbirth and
    postpartum conditions, including laceration, fever, breast abscess, uterine trouble,
    infant feeding, medicinal teas, and treatment by doctresses, surgeons, and male
    theurgists. It also describes one breast operation using Datura stramonium as
    a narcotic, briefly compares Sia childbirth ceremonies with Zuni ceremonies, and
    begins a typical observed labor case.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Laceration of the perineum is described as frequent in Zuni childbirth practice,
    and the writer says it occurred in three labor cases observed in 1896-97.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says high fever may be present at such times; milk leg is rare;
    breast abscess is not uncommon; and a surgeon is called when doctresses fail to
    bring relief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A breast abscess operation observed by the writer was performed by Xai'uchi,
    who administered Datura stramonium, used a lancet, removed pus, applied powdered
    medicine, and bound a soiled cloth over the wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The patient in the breast operation was said to regain consciousness gradually,
    later reported knowing nothing of the operation and having beautiful dreams, and
    was healed within a week.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer reports not having discovered blindness after confinement or convulsions
    before or after confinement among Indian tribes, while uterine trouble after bearing
    children is described as uncommon among Zuni women.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the uterus protrudes, a surgeon is called to replace it; the passage
    says only two or three male theurgists undertake such cases, with Nai'uchi named
    as the principal practitioner.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The child is placed to the breast within ten hours after birth, and efforts
    are made to make it draw milk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hot tea made from toasted juniper twigs and berries steeped in boiling water
    is drunk from the beginning of labor and afterward; the passage says drinking
    it earlier in pregnancy is believed to make the child very dark.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hemorrhage is described as uncommon but treated with a tea made by pouring
    boiling water over corn smut, said to have the same effect as ergot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Sia childbirth ceremonies described elsewhere are
    much more elaborate than those of the Zuni.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A typical labor case observed by the writer began at midnight on October 20
    in the printed/OCRed date, with a wife not more than fifteen years old showing
    approaching parturition and suffering until six o'clock the following evening.
  category: sequence
  evidence_refs:
  - ev:7
