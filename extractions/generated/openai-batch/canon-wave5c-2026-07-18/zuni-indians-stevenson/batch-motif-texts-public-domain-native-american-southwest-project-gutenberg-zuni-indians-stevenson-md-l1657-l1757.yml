canonical_text:
  quote: ''
  summary: The passage describes the A'shiwi resuming an eastward quest for the Middle
    of the world with divine companions; the disappearance and later ritual personation
    of the Ne'wekwe fraternity director; the survival, self-identification, reception,
    and adoption of a Kia'nakwe brother and sister; explanatory notes on sacred springs;
    and the beginning of the A'shiwi arrival at He’shota’yalla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The main body of the A'shiwi continues eastward in a quest for the Middle
    of the world after obstacles are removed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Divine Ones and the Gods of War, described as born of Laughing water,
    accompany the A'shiwi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The director of the Ne'wekwe fraternity disappears through Lu'kiana 'kiai'a
    and becomes musician and jester to the Sun Father, accompanying the Sun Father
    in daily travels over the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before his disappearance, the Ne'wekwe director instructs his people that
    a fraternity member should personate him annually, and that he would then be present
    in spirit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Kia'nakwe brother and sister escape death by hiding in a cave and survive
    for a long time on meal ground from remaining corn and on rats trapped by the
    boy and prepared by the girl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brother proposes leaving to seek kind people; the sister fears they will
    be killed, and the brother says it is better for both to die than to live longer
    alone.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A youth from Kiap'kwena sees the brother and sister, asks who they are, and
    receives identifications from them as the last Kia'nakwe and as Mi'kianakwe, or
    Corn people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy holds two et'towe to his breast, and the girl shows two ears of white
    corn from her dress when identifying themselves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kia'kwemosi responds with compassion, receives the two survivors, says
    they are the same as the To'wakwe, and tells them to live with his people as children
    who will marry and have children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman of the Corn clan is selected to adopt the Kia'nakwe brother and sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: An alternate version says the boy finds Ojo Caliente, returns to tell his
    sister, and the two go to the village, where the boy calls on the Kia'kwemosi
    and is kindly received.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The explanatory note describes sacred springs at Ojo Caliente, including a
