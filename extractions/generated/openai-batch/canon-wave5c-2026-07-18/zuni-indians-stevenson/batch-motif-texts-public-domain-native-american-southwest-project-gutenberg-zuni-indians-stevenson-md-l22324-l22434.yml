canonical_text:
  quote: ''
  summary: 'The passage narrates origin traditions for Zuni fraternities: the Divine
    Ones name fraternities and give medicines and songs; at Shi''papolima they transform
    holders of Mystery medicine into animal guardians of regions and into rattlesnakes
    and ants; Po''shaiyanki and associates initiate A''shiwi and other fraternity
    members into Mystery medicine, fire practices, sword swallowing, and healing orders;
    a Stone Knife order is explained by a descending stone knife; ritual medicines,
    altars, and paintings are distributed; and Shumai''koli gods appear to a clan
    man and describe their underworld origin and migration route.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shi'wannakwe and Ne'wekwe are described as allied because of the close
    relation of two original couples, with Shi'wannakwe regarded as elder brother
    of Ne'wekwe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Divine Ones named a third fraternity San'iakiakwe, also called Sus'kikwe
    or Coyote, and a fourth fraternity Hle'wekwe or Wood people; they gave medicines
    and songs to each fraternity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the A'shiwi settled at Hal'ona, the Divine Ones visited Shi'papolima
    and met Po'shaiyanki, his associates, and men holding the secrets of Mystery medicine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Divine Ones declared that guardians were needed for the six regions and
    the whole world, and that humans could not fill the places because beings with
    cunning of scent and sight were needed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men possessing the secrets of Mystery medicine were changed into a cougar
    for the North, a bear for the West, a badger for the South, a white or gray wolf
    for the East, an eagle for the Zenith, and a shrew for the Nadir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other men were converted into rattlesnakes to preside with wisdom over the
    six regions, and others into ants whose houses would be scattered over the earth,
    becoming zoic gods of the A'shiwi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Divine Ones requested Po'shaiyanki, Na'ke'e, and others to accompany them
    to Hal'ona and initiate the A'shiwi into the mysteries of O'naya'nakia, or Mystery
    medicine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The makers of medicine water of the Shi'wannakwe and Ne'wekwe fraternities
    were initiated into Mystery medicine and afterward initiated others of their fraternities.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Divine Ones formed a fraternity composed of Na'ke'e, his wife, and another
    man; these initiated others into Mystery medicine and eating large coals of fire,
    and the organization was named the Great Fire fraternity with Na'ke'e as original
    director.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Na'ke'e received knowledge of sword swallowing from A'chiyala'topa, described
    as a being with wings and a tail of knives, and initiated members of his fraternity
    into a Wood people order using wooden swords.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Hle'wekwe fraternity traveled northward and then eastward to the home
    of Po'shaiyanki, stayed at Shi'papolima for four years, and returned after the
    holders of Mystery medicine secrets had been converted into beasts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another man was initiated into Mystery medicine and into playing with fire,
    though not eating it; he initiated others into a fraternity named U'huhukwe in
    reference to eagle down.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kow'wituma and Wats'usi chose two men whom Po'shaiyanki initiated into medicine
    for disease caused by human witchcraft and disease caused by angry ants; their
    fraternity was named Hii'lo'kwe and also called A'chiya or Stone Knife, without
    receiving the secrets of fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Some officers say the Knife order began when a stone knife descended from
    the gods above through the ceremonial chamber hatchway; at initiation the knife
    is passed before the lips rather than swallowed.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Po'shaiyanki distributed beast god medicines, tablet altars, and sand or dry
    paintings to the fraternities.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: One night Shumai'koli gods and a sai'apa appeared without masks to a man of
    the Po'yi'kwe clan, said their present home was Chi'pia near Shi'papolima, and
    said they originally came from the undermost world by a northern route eastward
    to Shi'papolima and then Chi'pia.
  category: sequence
  evidence_refs:
  - ev:12
