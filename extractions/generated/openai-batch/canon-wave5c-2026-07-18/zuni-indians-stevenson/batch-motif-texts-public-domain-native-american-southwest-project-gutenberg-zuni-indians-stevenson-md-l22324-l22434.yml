candidate_motifs:
- id: motif:1
  label: initiation into secret medicine fraternities
  taxonomy_refs:
  - initiation
  basis: The passage repeatedly describes initiations into O'naya'nakia, Mystery medicine,
    coal eating, fire play, sword swallowing, and healing orders, followed by initiates
    initiating others.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives institutional origins and ritual authorizations, not
    a single quest narrative.
- id: motif:2
  label: humans transformed into animal or zoic beings
  taxonomy_refs:
  - shapeshifter
  basis: Men possessing Mystery medicine secrets are changed by the Divine Ones into
    directional beasts, rattlesnakes, and ants.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The transformation is imposed by divine agents; the passage does not describe
    voluntary shapeshifting by the men themselves.
- id: motif:3
  label: animal guardians of cosmic regions
  taxonomy_refs: []
  basis: Specific animals are assigned to North, West, South, East, Zenith, and Nadir,
    with rattlesnakes presiding over the six regions.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No supplied taxonomy reference exactly names a directional-guardian motif.
- id: motif:4
  label: fire mastery as fraternity initiation
  taxonomy_refs:
  - initiation
  basis: The Great Fire fraternity is tied to eating large coals of fire; another
    fraternity is tied to playing with fire; fire secrets are specifically withheld
    from Hii'lo'kwe.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage records ritual abilities and exclusions without giving detailed
    performance narratives.
- id: motif:5
  label: sacred object descending to authorize an order
  taxonomy_refs: []
  basis: Some officers say a stone knife descended from gods above into the ceremonial
    chamber, indicating that the Knife order should be created.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is reported as one account by some officers, not as the only origin
    account in the passage.
- id: motif:6
  label: underworld-origin gods with migration route
  taxonomy_refs: []
  basis: The Shumai'koli gods and warrior state that they originally came from the
    under-most world and traveled by a northern route eastward to Shi'papolima and
    Chi'pia.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage reports origin and movement but does not describe the full
    emergence episode.
