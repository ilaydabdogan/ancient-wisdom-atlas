  quote: ''
  summary: 'The passage describes preparation of a corn ear for a fetish: it must
    be perfect, can be straightened with fire, breath, and binding to a rod, and missing
    grains can be attached from another ear with cement. The repaired ear is dampened
    with the mouth and cleansed with water. A following fragment identifies a son
    as an associate shi''wanni, a theurgist in the Little Fire fraternity, and a fraternity
    father to several persons; a note says a thin fetish was deposited in the United
    States National Museum.'
