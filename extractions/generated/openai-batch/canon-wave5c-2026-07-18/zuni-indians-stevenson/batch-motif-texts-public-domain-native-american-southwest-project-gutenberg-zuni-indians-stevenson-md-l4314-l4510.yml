canonical_text:
  quote: ''
  summary: The passage gives ritual invocations of multiple gods and beings, including
    directionally colored deer-scapula gods, masked and staff-bearing gods, the Plumed
    Serpent, Suti'ki, Si'sikla, and the Ko'yemshi. It then narrates instructions from
    Pau'tiwa, 'Kiaklo's emergence, his looking to the six regions and calling grandfathers
    to carry him, the Ko'yemshi coming from their mountains to the lake, and 'Kiaklo's
    selection of the middle road while recounting ancient travels toward the Middle
    of the world.
  language: English with Zuni terms and transcriptions
  quote_policy: summarized
