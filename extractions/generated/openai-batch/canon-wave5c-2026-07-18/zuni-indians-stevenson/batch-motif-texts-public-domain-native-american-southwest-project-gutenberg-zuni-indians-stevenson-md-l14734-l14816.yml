canonical_text:
  quote: ''
  summary: 'The passage describes sequential ceremonial actions: spectators are punished
    for speaking Spanish; a Hopi-associated dance occurs; masked Ko''yemshi and members
    of the Ant fraternity process with ritual objects; an open ellipse and meal diagram
    are formed; and a disk called a small sun is used in an omen concerning the host''s
    household, corn abundance, and the wife''s fidelity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four spectators are whipped across the ankles and arms for speaking Spanish
    in the presence of personators of anthropic gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nan'nahe, identified as a Hopi Indian married to a Zuni woman, shows special
    enthusiasm in a dance because other dancers are only partly drilled in the song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dancers wear Hopi kilts, silk scarves, dance moccasins, porcupine-quill
    anklets, and two people outside the dancer line wear improvised Hopi masks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi arrive masked, wrapped in blankets, with goatskins on their
    feet, fawn skins over the shoulder, te'likinawe, and gourd rattles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the te'likinawe are two longer sticks, one blue for the sun and one
    yellow for the moon.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ko'yemshi masks are covered with meal from sprinklings received at other
    houses.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sixteen male members of the Ant fraternity precede the Ko'yemshi, led by the
    female head of the dedicated house; their bodies are painted white to represent
    stars and animals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The director carries a basket containing six painted wooden disks described
    as symbolic of the house of the clouds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The procession forms an ellipse with a gap that must not be closed; the gap
    is said to symbolize the road of life, rain, and the sun.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The director drops six pinches of meal for the six regions, forms a meal disk
    and a southward meal line, waves the mi'li to the six regions, and raises and
    lowers it six times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The director calls one disk a small sun and instructs the host to place it
    next to the heart of the warrior.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The director states that if the disk remains at the warrior's heart, the host
    and his wife's hearts are good and they will have corn and other things in the
    coming year; if it falls, the wife's heart desires another man.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When the host places the disk at the warrior's heart, it falls to the floor,
    and the host leaves believing his wife is unfaithful at least in her heart.
  category: sequence
  evidence_refs:
  - ev:9
