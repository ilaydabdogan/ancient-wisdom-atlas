canonical_text:
  quote: ''
  summary: The passage recounts the A'shiwi opening a game corral after capturing
    a village, describes the Kla'makla ruin and offerings there, narrates a post-conquest
    thanksgiving ceremony involving a drum, earth-emerging beings, and scalps, and
    describes a later drought threat caused by a witch stealing prayer plumes before
    they reached the Sun Father; the Divine Ones recover and replant the plumes, averting
    calamity.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After capturing the village, the A'shiwi opened the gates of the corral in
    which all game had been kept by 'Cha'kwena.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'shiwi told the game that the doors of the world were open and that the
    animals could roam, find grass and springs, and bear young; the passage says game
    has roamed over the earth since then.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kla'makla is described as an extensive ruin south of Zuni, near the trail
    to the Zuni salt lake, on a black-rock canyon wall with many cold clear springs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Zufiis identify an additional enclosure at the ruin as the corral where
    'Cha'kwena kept all game; the passage says she allowed game to graze during the
    day while the young waited in wall niches.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hundreds of te'Hkinawe offered by the Zufiis to the departed Kla'nakwe dotted
    the canyon walls near the springs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the conquest, the A'shiwi formed around the drum at Hiin'lipinkia, the
    seven beings were again called from the earth, Ku'vapiili'sa's scalp was divided,
    and the earlier pre-battle ceremony was repeated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The post-conquest songs were thanksgiving songs for the scalps, which the
    passage says bring good fellowship between the deceased enemy's ghost self and
    the A'shiwi, and therefore much rain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: U'yuyewi and ^la'sai'lema declared that this ceremony must always occur after
    an enemy is scalped.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The beings who came from the earth instructed that, in future repetitions,
    the pottery drum must first be struck with enough force that they would hear and
    be present invisibly to ensure correct singing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: While the A'shiwi were still at Hiin'Mipinkia, drought threatened starvation
    after repeated supplications to the Council of the Gods for rain remained unanswered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The A'shiwi discovered that te'Hkinawe deposited by the Kia'kwemosi and others
    had been stolen by a witch before the Sun Father received the prayers breathed
    into the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Divine Ones recovered the stolen te'likinawe, which were planted again,
    and the calamity was averted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A note states that Hiin'lipinkia, glossed as a place of stealing, received
    its name from the described occurrence, and that A'shiwanni avoid reference to
    the stealing of the te'Hkinawe.
  category: setting
  evidence_refs:
  - ev:7
