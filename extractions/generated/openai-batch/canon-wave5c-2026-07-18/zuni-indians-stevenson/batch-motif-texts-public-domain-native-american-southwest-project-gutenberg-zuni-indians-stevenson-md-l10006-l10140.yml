canonical_text:
  quote: ''
  summary: The passage lists participants in a Zuni ceremonial drama, explains how
    offices are selected and notified, states lineage, clan, virginity, and abstinence
    requirements for several roles, and describes the making, presentation, wearing,
    and later field-planting of feather cords called la'showawe. It also describes
    choir rehearsals and dawn assembly positions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage enumerates ceremonial participants for two sides, including directors,
    dancers, water-sprinklers, a Frog clan man, a plume-waver, Corn Maiden personators,
    a corn symbolizer, singers, a drummer, and flutists.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several listed roles are explicitly described as impersonated by males, females,
    youths, or maidens.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pe'kwin, elder brother Bow priest, and A'wan mo'sona are named as authorities
    who select or notify different categories of participants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sunset-dancer virgin roles are described as children or grandchildren
    of the first body of A'shiwanni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The he'kupowanhak'tona, ushiin'ashute, and sho'lipsimonthle'ona must abstain
    eight days from animal food and salt; the 'kla'punakwe must abstain four days
    from animal food and salt.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage states that if the sunset-dancer virgins are not virgins, the
    green corn would be destroyed by worms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The A'shiwanni feast, retire from the Shi'wano"kia's house at midnight, sleep
    at home until dawn, and then gather again in her house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The la'showawe are made from one tail feather and one wing feather of the
    mountain bluebird, joined at the quill ends in a V shape and wrapped with cotton
    cord.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Feathers given to men are from the male bird, and feathers given to women
    are from the female bird.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder brother Bow priest brings selected officials and dancers to the
    Shi'wano"kia's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The pe'kwin presents a la'showanne to each brought participant and speaks
    a formula asking for a good heart, good thoughts, one tongue, and rain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The la'showanne is attached to the left side of each recipient's head by cotton
    cord and a strand of hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The la'showawe are later planted in the fields with te'likinawe on the morning
    after the close of the drama.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The two choirs practice in separate houses after notification and later assemble
    at dawn in different corners of the Shi'wano"kia's house.
  category: sequence
  evidence_refs:
