canonical_text:
  quote: ''
  summary: The passage narrates the discovery of the Corn Maidens near Shi'pololo
    by Kow'wituma and Wats'usi, their invitation to I'tiwanna to dance for rain and
    corn growth, Pa'yatamu's frightening desire for the Yellow Corn Maiden, the maidens'
    flight to Ke'yatiwa, and their concealment in a spring by gods in duck form.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The witches who were with the A'shiwi did not mention their meeting with the
    Corn Maidens.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the A'shiwi settled at I'tiwanna, Kow'wituma and Wats'usi went deer
    hunting and discovered the Corn Maidens near Shi'pololo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Corn Maidens were dancing under a ham'pone and had remained in the same
    place since the departure of the A'shiwi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each Corn Maiden held a hla'we in each hand; the hla'we came from the under
    world and consisted of white plant stalks with delicate white plume-like leaves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Divine Ones reported what they had seen to the A'shiwanni, who wanted
    the Corn Maidens to come to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pe'kwin to the Sun Father was delegated to bring the Corn Maidens so that
    they might dance for rains and corn growth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Yellow Corn Maiden and four sisters accompanied Kow'wituma, while the
    Blue Corn Maiden and four sisters accompanied Wats'usi to the O'he'wa ki'wi'sine,
    where they sang and danced briefly without rattles, drums, or singers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: At midnight the Corn Maidens were led to a ham'pone of waving corn in the
    sacred dance court, where a meal painting of cloud symbols had been made on the
    ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the dance, the A'shiwanni and Divine Ones fell asleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pa'yatamu arrived, sat at the northeast corner of the ham'pone, considered
    the Yellow Corn Maiden the most beautiful, and wished to embrace her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Corn Maidens understood Pa'yatamu's thoughts, became afraid, stopped dancing,
    drew close together, and planned to run away after he slept.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A note describes Pa'yatamu as diminutive, crowned with flowers, carrying a
    flute that causes flowers to bloom and draws butterflies, and dwelling at a rainbow-covered
    entrance near a mesa.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: When Pa'yatamu slept, the Corn Maidens ran away at the first light of the
    morning star to Ke'yatiwa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the flight, Pa'yatamu and later the A'shiwanni and Divine Ones awoke,
    found the maidens gone, searched, and did not find them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Ke'yatiwa, the Yellow Corn Maiden sent the Black Corn Maiden to Ko'thluwala'wa
    to report their fears; A'wan ta'chu Ko'yemshi and Pau'tiwa returned with her in
    duck form and hid the maidens in the spring by spreading their wings over the
    waters.
  category: sequence
  evidence_refs:
  - ev:7
