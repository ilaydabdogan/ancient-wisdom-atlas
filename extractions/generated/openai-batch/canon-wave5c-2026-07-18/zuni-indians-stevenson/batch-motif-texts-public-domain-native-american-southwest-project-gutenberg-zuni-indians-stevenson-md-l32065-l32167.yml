canonical_text:
  quote: ''
  summary: 'Ethnographic description of a Zuni plaza ritual: two parties of girls
    and attendants are positioned at northeast and southwest entrances as representatives
    of U''yuyewi and Ma''sai''lema; officials and warriors perform rain prayers with
    meal, tobacco smoke, drum, and war clubs; costumed dancers perform repeated figures
    around or near a scalp pole, including gestures referring to Navahos and a comic
    appearance by two men as United States troops; afterward the public dances in
    expanding circles around the scalp pole.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sets of four girls are led to northeast and southwest plaza entrances
    by the pa'mosona and vice pa'mosona, with men of the pu'moklaklanawe awaiting
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The northeast party is said to represent U'yuyewi and the southwest party
    Ma'sai'lema; the passage states that the Sun Father allotted land north and south
    of the road of day to these two figures respectively.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pa'mosona seats himself with assistants and then sprinkles meal over a
    drum and hooped drumstick, prays for rain, lights a corn-husk tobacco cigarette,
    puffs smoke into the meal, and prays again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other ritual participants smoke or wave cigarettes toward the drum, and the
    music begins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Warriors and named male participants join the song while keeping time with
    war clubs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some pu'mokiakianawe wear elaborate regalia and carry wooden hatchets with
    horsehair locks described as symbolic of a scalp.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dancers start from diagonal corners of the plaza in couples; women alternate
    with pu'mokiakianawe and warriors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The women place their left hands to the backs of the men, which the passage
    interprets as indicating that the Navahos have fled; after the parties meet west
    of the scalp pole, the hands and weapons shift to the right, indicating that the
    Zunis have no fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One dance figure is repeated four times; on the last repetition two men dressed
    as United States troops appear behind the dancers and remain until the dance closes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later dance figure has couples separate and pass between lines in a manner
    explicitly compared to the Virginia reel; this figure is also repeated four times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the pu'mokiakianawe leave the plaza, a governor's aid calls for the
    people to dance around the scalp pole and for someone to bring a drum.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Twelve young men begin a small circle around the pole; the circle grows into
    concentric circles that fill the plaza by night, with songs and war whoops.
  category: sequence
  evidence_refs:
  - ev:7
