canonical_text:
  quote: ''
  summary: The passage describes a post-initiation feast, the movement of boys with
    godfathers, Sa'ya'hlia actions involving yucca, a plaza dance by Kor'kokshi rain-maker
    personators of gods and goddesses, meal sprinkling by a leader, and a later voluntary
    initiation of boys into the Ko'tikili by Sa'ya'hlia and Ko'yemshi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an initiation, a feast is served in the ki'wi'sine, with food brought
    to the roof hatchway by families of the Sa'ya'hlia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the feast, boys pass out one by one with their godfathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sa'ya'hlia go to the plaza during the Kor'kokshi dance, run up a ladder
    and over housetops using yucca, and women are whipped to cure bad dreams.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The plaza contains thirty-one Kor'kokshi u'wannami, identified in the passage
    as rain-maker dancers; seven are goddesses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those personating women wear specified clothing, jewelry, hair arrangements,
    white face masks with black beards, eagle plumes, and carry spruce twigs in both
    hands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those personating male gods have painted limbs, dance clothing and ornaments,
    blue-green rectangular masks with black beards, gourd rattles in the right hand,
    and small spruce twigs in the left.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dancers are led by a man of the ki'wi'sine who carries a mi'li and a meal
    basket in the left hand and sprinkles meal with the right.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dancers enter the Si'aa' te'wita from the western way, leave by the eastern
    covered way, form lines, and shift orientation during the dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The leader prays and sprinkles each Ko'yemshi with meal while the dancers
    continue song and dance to rattles, reversing formation several times with a uniform
    stamping step.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the Kor'kokshi dance and retire, four Sa'ya'hlia brandish giant yucca,
    clear people from their path, retire to the He'iwa ki'wi'sine, and with two Ko'yemshi
    pass assembled boys through voluntary initiation into the Ko'tikili.
  category: sequence
  evidence_refs:
  - ev:6
