canonical_text:
  quote: The walls were completely covered with pictographs
  summary: The passage describes a journey by the writer and Zuni companions to the
    concealed sacred place called Han"lipinkia or Hun'lipinkla. It records difficult
    desert travel, lack of water, ruins, artifacts, springs and water pockets, a fissure
    and narrow canyon with pictographs and potholes, and a statement that the Gods
    of War, U'yuyewi and Ma'sai'lema, are supposed to have been created in an arched
    niche there.
  language: English
  quote_policy: quoted
