canonical_text:
  quote: ''
  summary: 'Ethnographic description of ceremonies in the Little Fire fraternity room:
    visiting Ko''tikili dancers perform before an altar with rattles, yucca, and offerings;
    cigarettes, sacred meal, and medicine water are shared; men, women, and an infant
    pray and sprinkle meal; novices remain in the ceremonial room; a dry painting
    with a galaxy-symbolizing wall is prepared; and the elder brother Bow priest distributes
    medicine and sunflower powder.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group at the Little Fire fraternity house tells stories and smokes before
    the fraternity convenes; the floor is sprinkled by a man who ejects water from
    his mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sixteen Ko'tikili members enter in single file, advance toward the altar,
    face south, and dance back and forth from west to east and east to west.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Twelve dancers carry gourd rattles, while others carry food wrapped in corn
    husks as offerings to the Kok'ko awa; all carry yucca bunches and wear yucca head
    ribbons, dressed deerskins, moccasins, and tortoise-shell rattles on the right
    leg.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dancers sing and dance to rattles and a skin drum; a notable movement
    involves circling gourd rattles around the head while shaking them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At midnight, dancers sit on the north side of the room and receive cigarettes
    lit by Little Fire fraternity members; donor and dancer each take whiffs before
    the dancer continues smoking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dancers approach the altar, take meal from a basket, sprinkle the altar,
    pray, and return to their seats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The a'kwamosi carries a bowl of medicine water and gives holy water from a
    shell to dancers and then to Little Fire fraternity members, including women and
    children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the visiting dancers leave, fraternity men pray and sprinkle sacred
    meal before the altar; women then pray and sprinkle meal, and one mother guides
    an infant's hand to take and sprinkle meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women return home, while men and novices sleep in the ceremonial room; meal
    around the altar is swept away, and mi'wachi feathers are cleaned of meal and
    replaced.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the fourth day, men prepare a dry painting about five feet south of the
    altar; it includes a disk, a raised basin-like wall said to symbolize the galaxy,
    and red, white, and black materials over ordinary sand.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before the evening ceremony, the room is lit by a fireplace before candles
    are lighted; men sit in a circle and on ledges, women recline in their area, novices
    remain in former positions, a young girl sleeps nearby, and a flute player stands
    behind the altar.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The elder brother Bow priest joins the circle, men split yucca and prepare
    wreaths, wristlets, armlets, and garters, and the Bow priest distributes prepared
    medicine in corn husks and deerskin pouches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sunflower powder is distributed by the elder brother Bow priest to male members
    only; the passage ends before explaining its use.
  category: sequence
  evidence_refs:
  - ev:10
