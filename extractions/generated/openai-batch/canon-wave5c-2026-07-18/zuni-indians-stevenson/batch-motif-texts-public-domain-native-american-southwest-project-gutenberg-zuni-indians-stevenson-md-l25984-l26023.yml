canonical_text:
  quote: ''
  summary: A prayer or address describes preparation for membership in the Hle'wekwe
    fraternity, emergence from dark lower worlds to the light of the Sun Father, ancestral
    movement through named places, and instructions involving an ancient sword and
    rain or snow offerings. The passage then summarizes closing feast actions, offerings
    to dead fraternity members, and the storage of ceremonial objects and fetishes.
  language: ''
