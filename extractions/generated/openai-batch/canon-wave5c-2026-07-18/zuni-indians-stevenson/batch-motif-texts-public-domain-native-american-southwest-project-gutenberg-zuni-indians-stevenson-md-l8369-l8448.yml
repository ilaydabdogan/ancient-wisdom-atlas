canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparation for a pilgrimage to Ko''thluwala''wa:
    participants distribute cigarettes, gather and carry te''likinawe and other ritual
    objects, leave the village in procession, camp after filling canteens at a spring,
    divide at a fork in the road, ascend mountains, and deposit offerings in a summit
    cave. It also reports a priestly claim about an inner passage from the cave to
    the Council of the Gods in the depths of a lake, followed by the narrator''s skeptical
    inspection of the cave.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Remaining cigarettes are distributed to Sha'liiko wor'we of other ki'wi'siwe,
    and each Sha'liiko wor'li carries a cigarette home in a corn husk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those making or aiding the pilgrimage gather in ceremonial places or start
    from homes, and the Ko'yemshi collect te'likinawe before proceeding to the Mu'he'wa
    ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ko'mosona divides the kia'etchine; he and the Ko'pekwin receive te'likinawe,
    including clan-made offerings, and place them in deep back baskets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ritual equipment includes a long-necked gourd jug with a black sprinkling
    stick, cotton netting, four white eagle plumes, a cotton cord handle, a crooked
    stick described as symbolic of longevity, and prayer meal carried in the belt.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Prayer meal is thrown in a line before the travelers, and two Ko'pi'liishiwanni
    whirl rhombi to call clouds to gather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great Father Ko'yemshi, his nine fellows, the ceremonial father and personator
    of Shu'laawi'si, and personators of Sa'yatiisha, Hu'tutu, Ya'muhakto/Yii'muhakto,
    and the Sha'liiko each carry te'likinawe to the Council of the Gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The party leaves the village about 8 o'clock in the morning, barefoot and
    in new ordinary dress, with the Ko'mosona leading and named ritual figures following
    in an ordered procession.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After sunset the travelers fill canteens at a spring, ascend a mountain, camp,
    eat, and dance; the next morning they continue to a fork where the Ko'yemshi take
    one trail and the Ko'mosona and others take another toward Kor'kokshi mountain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ko'mosona and Ko'pekwin, each with a Pi'alashiwanni, enter a summit cave;
    one attendant carries a torch, and te'likinawe are deposited in the cave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The text reports that priests declare a direct passage from the cave to the
    Council of the Gods in the depths of a lake, with four chambers along the way;
    the narrator then reports an 1881 inspection that found a shallow cave passage
    and many te'likinawe.
  category: speech
  evidence_refs:
  - ev:7
