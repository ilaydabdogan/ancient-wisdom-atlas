literal_observations:
- id: obs:1
  text: The Ko'shi'kwe hold three meetings annually, and novices must wait for a regular
    meeting to join.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The A'pi"l;ishiwanni have a scalp ceremonial for initiation once in three
    or four years at the will of the elder brother Bow priest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The A'pi"l;ishiwanni scalp ceremonial is depended on to bring rains in cases
    of severe drought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The A'pi"l;ishiwanni have an annual thanksgiving festival called the Harvest
    dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hle'wekwe hold regular meetings in January and February, and a name presented
    for membership must be held over for a year before admission.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Wood order, called Sword swallowers of the Great Fire, meets at the same
    times as the 'Hle'wekwe, and each fraternity has warrior or warriors from the
    A'pi'lashiwanni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Most fraternities are notified of meetings by a warrior who goes house to
    house and announces that the director wants the fraternity to meet; the addressed
    member replies that it is well.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The 'Hle'wekwe are notified through Kia'kwemosi, rain priest of the North,
    and the Shu'maakwe are notified by the sun priest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Members of all fraternities gather semimonthly in the ceremonial chamber to
    prepare prayer plumes that they offer to their gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tablet altars are often placed for the semimonthly prayer-plume occasions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Men prepare offerings for fraternity children of the opposite sex and for
    boys not old enough for voluntary initiation into the Ko'tikili.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When a woman loses a fraternity father, a male member of that father's clan
    presents meal wrapped in corn husk, lays it in a man's palm, prays, and announces
    that the man has been chosen to fill the deceased father's place.
  category: sequence
  evidence_refs:
  - ev:6
