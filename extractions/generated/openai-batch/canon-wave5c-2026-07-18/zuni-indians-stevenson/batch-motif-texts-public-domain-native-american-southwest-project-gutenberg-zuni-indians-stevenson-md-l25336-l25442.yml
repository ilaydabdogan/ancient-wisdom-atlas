canonical_text:
  quote: ''
  summary: The passage describes Zuni ceremonial actions involving deposition of medicine
    and plume offerings at a spring, directional sword-swallowing by the 'Hlem'mosona,
    prayers and meal offerings, transfer and waving of tehl'nawe/tehl'nane staffs,
    an open circle dance, entry of the 'Ille'wekwe with repeated sword swallowing,
    a prayer for rain, snow, long life, and awakening in Ko'thluwala'wa, followed
    by the arrival of the Great Fire fraternity.
  language: English with Zuni ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boiled root medicine, a la'showanne plume cord with feathers and a shell bead,
    and sand are deposited in a spring at black rocks where the original 'Hlem'mosona
    is said to have disappeared; words are spoken sending the offering to a home identified
    with the Zenith and A'chiyalii'topa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a feast and rest, the 'Hlem'mosona goes alone to the plaza before spectators
    while musicians play and sing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The 'Hlem'mosona faces north and swallows his sword, repeats the act at west,
    south, and east, and at the east swallows the sword three times for East, Zenith,
    and Nadir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before each sword-swallowing act in the circuit, the 'Hlem'mosona stops at
    cardinal points and stamps several times; the sword swallowing at the six regions
    is repeated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hlem'mosona faces east, prays to the Sun Father, sprinkles meal eastward,
    and returns to the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the 'Hlem'mosona leaves the plaza, the musicians pray aloud, wave deer-leg
    bones over boxes, and draw a breath from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A woman of the fraternity ascends to the roof, secures the tehl'nawe, carries
    them to the outside ladder, and hands them to someone below.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder brother Bow priest appears from the eastern covered way, leading
    six members of the Bow priesthood, each with a tehl'nane, while he carries the
    ancient staff.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tehl'nane bearers and others form a circle that must never be entirely closed;
    they move with slow, even steps from left to right while the tehl'nawe are waved
    up and down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dancers do not sing; men, women, youths, and maidens gradually join the
    circle, clasping hands except where a tehl'nane is held by a warrior.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two a'mosi and two a'mosono'kla direct the dance and wear described ceremonial
    clothing, plumes, ornaments, and accessories; each director carries yarn and a
    needle to fasten girls' blanket wraps.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The circle dance continues until the 'Ille'wekwe arrive from the western street;
    the dancers then group in the northeast corner of the plaza.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The 'Ille'wekwe pass six times around the boxes and swallow swords after the
    first circuit; several stand before the boxes and swallow swords simultaneously.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the last circuit, the 'Hlem'mosona waves swords over the boxes and prays
    to named animal, celestial, and divine beings for intercession with the Council
    of the Gods for cold rains, snows, and long life for the Zuni.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The prayer asks that the Sun Father give the people long life so that they
    may not die but sleep and awake in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: During the prayer all hold their swords with points upward, and when it ends
    each draws a breath, described as all that is good, from his sword.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The rattles and drum of the Sword order of the Great Fire fraternity are heard,
    and the Great Fire fraternity follows after the 'Ille'wekwe with the same step.
  category: sequence
  evidence_refs:
  - ev:8
