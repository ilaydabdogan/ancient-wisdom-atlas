canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence involving novices of
    the Great Fire fraternity: gifts, feather attachment, prayer plumes, corn, repeated
    passing of plume and swords over the novices, sword swallowing by members, a feast,
    plaza dances, removal and storage of tehl''nawe, formation of meal crosses at
    sunset, inversion of painted boxes with reference to a tradition about beast god
    warriors, and a repeated Bear clan performance using baskets, notched sticks,
    and deer-leg bones.'
  language: English with Zuni terms
  quote_policy: summarized
