canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Shu''maa''kwe ceremonial sequence: an
    intense fire display with husks and cedar brands, prayers before an altar, removal
    and planting of a feather-adorned tree in the plaza center, dancing and feasting,
    appointed youths and maidens procuring dancers, appearances of Shumai''koli and
    Sai''apa figures with charm-bearers, departure of some god-personators at sunset,
    and preparations of medicine with plants, meal, bowls, and altar objects in the
    ceremonial chamber.'
  language: English
  quote_policy: summarized
