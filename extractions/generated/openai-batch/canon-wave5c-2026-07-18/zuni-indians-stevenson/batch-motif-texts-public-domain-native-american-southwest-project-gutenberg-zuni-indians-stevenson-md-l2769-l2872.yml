canonical_text:
  quote: ''
  summary: The passage describes rules for Kor'kokshi dances around the summer and
    winter solstices; assemblies of ritual personators and fraternities; rain and
    crop-thanksgiving dances; initiation into the Ko'tikili for male children and
    rare female members; birth-based affiliation with a ki'wi'sine; and a command
    from Pau'tiwa, conveyed by Kiaklo, that the gods give children the sacred breath
    of life so they may enter the dance house at Ko'thluwala'wa after death before
    proceeding to the undermost world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ki'wi'sine furnishes the Kor'kokshi after the return from Ko'thluwala'wa
    or Kiap'kwena at the summer solstice and this begins the winter Kor'kokshi dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named ritual authorities may request repeated Kor'kokshi dances, but the passage
    states limits of no more than four winter days and only one night and day in summer,
    attributed to the command of the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first summer Kor'kokshi dances occur when the Ko'mosona and his party
    return from pilgrimage; ki'wi'siwe take sexennial turns furnishing dances, with
    night dances in the Ko'mosona's ki'wi'sine and the Ko'pekwin's house and day dances
    in the plazas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Personators of the Council of the Gods and the Ko'yemshi gather in the Ko'pekwin's
    house, while Sha'liiko personators and related attendants usually assemble in
    the Ko'mosona's ki'wi'sine.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Fire fraternity always assembles in the Ko'pekwin's house for the
    summer solstice ceremonies, while the Ko'mosona may choose the fraternity that
    performs in the ki'wi'sine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kor'kokshi remove masks in the ki'wi'sine in summer; in winter they go by
    the western road to remove masks and disrobe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dances for rain and crop thanksgiving may occur at farming districts, followed
    by walking to Zuni, retiring to a ki'wi'sine, night dancing, plaza dancing the
    next day, and departure over the western road.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: All male children must be received into the Ko'tikili to enter the sacred
    dance house of Ko'thluwala'wa after death, and involuntary initiation allies the
    child to one of the ki'wi'siwe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women may join a ki'wi'sine under certain conditions, but initiation into
    the Ko'tikili is described as rare.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A girl thought to have been frightened by a divine personator may be instructed
    by that personator and later undergo Ko'tikili initiation with infant boys; the
    personator becomes her ceremonial father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports four female Ko'tikili members in 1902 and states that
    these women take part in masked dances by personating goddesses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A child's ki'wi'sine is decided at birth through the husband of the doctoress
    who receives the child; this husband serves as godfather in involuntary and voluntary
    initiation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The initiatory ceremonies are said to be commanded by Pau'tiwa, who sent Kiaklo
    to notify the A'shiwi that the gods would come in eight days to give children
    the sacred breath of life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The stated purpose of receiving the sacred breath is that after death the
    children may enter the dance house at Ko'thluwala'wa before proceeding to the
    undermost world from which they came.
  category: sequence
  evidence_refs:
  - ev:8
