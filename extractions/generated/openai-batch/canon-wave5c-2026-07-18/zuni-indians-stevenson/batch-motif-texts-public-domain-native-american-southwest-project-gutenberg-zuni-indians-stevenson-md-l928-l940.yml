  quote: quest for the Middle of the world
  summary: The A'shiwi journey over soft earth for many years, building and abandoning
    villages as they seek the Middle of the world. They leave settlements because
    of the corruption of their dead and the unbearable odor of their own bodies. Repeated
    divisions send some people north and others south, which the passage says accounts
    for ruins along both sides of their line of march.
