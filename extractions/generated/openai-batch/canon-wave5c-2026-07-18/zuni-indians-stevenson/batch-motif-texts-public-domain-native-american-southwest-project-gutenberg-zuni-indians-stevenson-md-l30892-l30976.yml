  quote: ''
  summary: The passage describes early-dawn bathing and medicine preparation, dressing
    for dances, a sunrise procession and prayer in the plaza, preparation of painted
    bodies and cactus with medicinal materials, and a second plaza dance involving
    movement toward directions and striking on the left shoulder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At early dawn, participants other than specified officers go to a well, make
    a small fire, heat water, wash their heads in yucca suds, and bathe their bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice goes with the fraternity father to the father’s house, where heated
    water is used for washing the heads and bodies of both the father and novice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife may heat water, but the man and wife do not speak to each other and
    the man does not look at his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The leader of the song and his alternate remain in the ceremonial chamber
    to prepare medicine and later bathe there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Participants chew native squash seeds and burr seeds, eject the mixture into
    their palms, and rub their bodies to prevent injury from cactus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For the first dance, participants wear black woven breechcloths, yucca wreaths,
    fluffy eagle plumes tied to the forelock, and go barefoot.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Most participants carry bunches of willows; the director carries a po'nepoyanne
    and leads the others toward Si'aa' te'wita.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The group proceeds in file, waves willows, moves with slow measured steps,
    chants low-toned prayers to the new day, and is accompanied by light drumming.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: At sunrise in the plaza, the group forms an ellipse, dances twice around,
    turns inward at the director’s signal, and the director prays while holding the
    po'nepoyanne upward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The director’s prayer asks for good health, pure hearts, favor with the gods,
    and good for the people and all peoples.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Before a second plaza visit, bodies are painted white with kaolin containing
    the chewed seed mixture; the passage says this medicine is the property of the
    Gods of War.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The elder brother Bow priest has black and white facial paint, hawk down dots
    described as symbolizing clouds, and a bit of down on the nose.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Other participants have brownish-red faces, micaceous hematite lines and spots,
    elaborate clothing and ornaments, loose hair tied at the neck, yucca wreaths,
    and red-colored eagle plumes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: The two warriors wear war pouches.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:15
  text: The leader of the dances and his fellow apply the chewed mixture to each cactus
    piece, rub the cactus with long fluffy eagle plumes, and sprinkle hawk down over
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Cactus pieces are placed in the hands of the pe'kwin and distributed to another
    officer and to the warriors; officers also carry willows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: On the second plaza visit, the group enters through the eastern covered way,
    passes around the east side to the north, dances twice around, stands in an ellipse,
    and dances for a time.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:18
  text: A sequence of runs is made toward the West, South, and East, and in circles
    indicating the Zenith and Nadir; followers strike runners over the left shoulder
    before they rejoin the dancers.
  category: sequence
  evidence_refs:
  - ev:6
