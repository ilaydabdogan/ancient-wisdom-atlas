canonical_text:
  quote: ''
  summary: The passage describes Kia'nakwe ceremonial dancing led by a priest and
    pe'kwin, the use of masks and repeated village dances, head washing by twelve
    Corn clan women with yucca suds and corn, a feast following a fast, a food packet
    deposited in the river for the Kia'nakwe, distribution of colored corn for next
    year's planting, a litany and further masked dance, and the collection and preparation
    of offerings for the A'shiwanni and for transport to the ceremonial house of the
    keeper of the Whlan'na.
  language: English with Zuni ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The priest and the pe'kwin exchange repeated ritual calls while bending their
    knees.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dancers' voices, rattles, file formation, and changes of facing direction
    accompany the dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest and pe'kwin walk back and forth stiff-kneed, halt and bow when
    they meet, and the dance stops after four passes before being repeated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After returning to the ki'wi'sine, the Kia'nakwe spend the night smoking and
    talking; at daylight masks are brought out and at sunrise paraphernalia is donned
    for dances at the priest's dwelling and in the plaza.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremony of dancing at different points and passing around the village
    is repeated four times, with returns to the ki'wi'sine each time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Twelve women of the Corn clan assemble in the ki'wi'sine, wash the heads of
    the priest, officers, and Kia'nakwe with yucca suds, and an ear of corn is rubbed
    four times on the top of the priest's head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wives and daughters of the personators bring bowls of food and coffee to the
    entrance of the ki'wi'sine after first washing their heads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The feast is enjoyed after the personators of the gods have fasted since the
    previous evening.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After eating, each man gathers bits from each bowl onto he'we, binds the folded
