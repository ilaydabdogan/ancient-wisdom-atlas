  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: One Chu'pakwe fills an Apache basket with colored corn and gives about a pint
    to each of the twelve Corn clan women to plant in the coming year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before the women depart, the priest stands in the middle of the room with
    his te'likinane and recites a litany while others respond.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Contributions for the first body of A'shiwanni include deer, antelope, corn,
