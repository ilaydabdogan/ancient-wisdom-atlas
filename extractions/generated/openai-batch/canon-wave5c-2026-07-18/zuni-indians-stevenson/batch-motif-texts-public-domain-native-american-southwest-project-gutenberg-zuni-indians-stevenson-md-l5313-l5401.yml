canonical_text:
  quote: ''
  summary: 'The passage describes a ceremonial sequence connected with children’s
    initiation: sand paintings and mounds are prepared for personated gods; selected
    gods drink spring water and are instructed by the sun priest to strike people
    except protected categories; pottery and baskets are destroyed with anti-Navaho
    cries; Ko''yemshi respond to a rabbit effigy’s request for food by collecting
    offerings from children’s homes; food is redistributed for feasting; and godfathers’
    la''showanne are placed on sand-painting figures according to bean colors and
    six regions before preparation for involuntary initiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes between different men who personate ritual beings,
    and says that some men present are spectators rather than the men who will personate
    the gods when children are initiated into the Ko'tikili.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A director of the Great Fire fraternity remains by the sand painting while
