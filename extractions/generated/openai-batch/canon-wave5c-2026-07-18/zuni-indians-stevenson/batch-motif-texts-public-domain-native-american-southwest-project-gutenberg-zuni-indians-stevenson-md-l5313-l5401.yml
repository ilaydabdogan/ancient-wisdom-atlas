  text: Fifteen sand mounds are made in each of two ki'wi'siwe for fifteen gods who
    are personated.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Named personated gods are assigned to Chu'pawa or O'he'wa, while Shu'laawi'si,
    'Si"sikia, and A'wan ta"chu Ko'yemshi go from one ki'wi'sine to the other.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shu'laawi'si, led by his ceremonial father and joined by two An'nahoho, proceeds
    to He'iwa, where water from the spring is dipped with an ancient shell attached
    to a cottonwood stick and given to each to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The water is said to be drunk to make the gods angry, and the pe'kwin instructs
