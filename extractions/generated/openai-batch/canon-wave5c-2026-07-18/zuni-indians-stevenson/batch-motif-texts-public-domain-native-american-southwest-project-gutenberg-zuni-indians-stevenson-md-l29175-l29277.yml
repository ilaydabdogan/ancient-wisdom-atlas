  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The novices stand whenever a Shumai'koli is present and sit when the god retires,
    while their clasped hand motion continues.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: As the expected time of the morning star approaches, participants repeatedly
