canonical_text:
  quote: ''
  summary: A segment of a Shu'maakwe initiation ceremony describes novices receiving
    sacred breath, repeated mouth-contact rites with corn dipped in medicine water,
    dances by Shumai'koli and Sai'apa figures, a wooden charm manipulated before a
    god, plume and hand passes over novices, sequential appearances of directionally
    colored Shumai'koli, watching for the morning star, and a dawn fire/corn-husk
    pelting action. The passage also reports an authorial comparison to a similar
    Hopi practice involving the charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The a'kwamosi takes an ini'li from the altar, prays, and passes it before
    the mouth of each novice, who draws sacred breath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novices keep their clasped hands in motion with only brief pauses; women
    relieve one another while attending the novices.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Shumai'koli of the North backs out of the dressing room, turns like a
    top, and is joined by an officer carrying a bowl of medicine water and an ear
    of corn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officer dips the ear of corn into the medicine water and puts it to each
    novice's mouth; each novice stops hand movement when the lips are touched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the corn is passed to the four novices, the medicine bowl and corn are
    placed near the altar, and the officer later prays before two novices whom the
    Shumai'koli had omitted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A young man carries a wooden charm shaped like a bar from the suspended altar
    form and manipulates it before the Shumai'koli; the passage says it appears to
    have mystic control over the Shumai'koli. The bearer also carries an unlit cedar-fiber
    brand.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Three Sai'apa come to the floor and dance; the youngest, a lad, dances violently
    for a long period and attempts turns while poised on each foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dancers of both sexes join the Sai'apa and dance until fatigue compels them
    to retire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dancers rub suds from the cloud bowl on their legs to prevent fatigue.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before leaving the floor, each dancer passes eagle-wing plumes four times
    over the lips of each novice and then repeatedly passes the right hand over the
    dancer's own face and over parts of the novice's body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The remaining Shumai''koli appear separately in order: West with a blue face
    mask, South red, East white, Zenith all-color, and Nadir black; the cloud decorations
    on the mask faces differ.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The corn-and-medicine-water mouth rite is repeated with each Shumai'koli appearance
