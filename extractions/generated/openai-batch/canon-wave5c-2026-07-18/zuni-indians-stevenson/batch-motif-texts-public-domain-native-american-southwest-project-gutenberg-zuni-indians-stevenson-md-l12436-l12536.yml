canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Zuni crop-thanksgiving ceremonial
    sequence: repeated dancing by the Kia''nakwe, comic interludes by Ko''yemshi,
    presentation and transfer of offerings to the A''shiwanni and other ritual authorities,
    prayers and rattle gestures, movement of gifts to a ceremonial chamber, offerings
    for deceased predecessors, and the allotment and flaying of a buck.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kia'nakwe dance four times in the plaza, return to the ki'wi'sine for
    about twenty minutes, then return to the plaza and dance four more times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the Kia'nakwe are absent from the plaza, nine Ko'yemshi amuse the audience
    through jokes, mimicry, mock fear, and games.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At four o'clock the Kia'nakwe return with gifts for the A'shiwanni and form
    a broken ellipse with its apex on the east side of the plaza.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kia'nakwe priest carries loose corn of several colors, and his deputy
    carries a basket tray of feathers arranged on raw cotton.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The A'shiwanni and named ritual officers form a line facing east on the west
    side of the plaza.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ko'yemshi and members of the Chu'pawa ki'wi'sine remove burdens from the dancers;
    the basket trays are held by the A'wanta'chu Ko'yemshi and his deputy because
    the baskets must not touch the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The text states that if the baskets were placed on the ground, the seeds would
    be unfruitful.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a dance, burdens and baskets are returned to the Kia'nakwe priest and
    deputy, then basket trays are received by the Kia'kwemosi and his pe'kwin and
    transferred to the Shi'wano"kla.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Long prayers are spoken by four persons personating the Kia'nakwe while they
    stand face to face with their Zuni prototypes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kia'nakwe priest and deputy speak in the Sia tongue, described in the
    passage as archaic Zuni, while the warriors speak in the modern tongue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each dancer deposits his burden on one of two blankets, and Ko'yemshi bring
    watermelons from the house of the keeper of the great shell to a heap near the
    ceremonial chamber ladder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After all offerings are made, dancers and leaders grasp rattles with both
    hands; following a prayer, they wave the rattles in a right-to-left circle, inhale,
    then shake the rattles as song and dance begin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the dancers leave, the A'shiwanni carry the gifts up the ladder to their
    ceremonial chamber and spread the offerings on the floor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Shi'wano"kia collects birds and plumes from the packages while the A'shiwanni
    sit smoking in the southeast corner of the room.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Baskets of te'likinawe made during the afternoon are present and are to be
    offered to deceased predecessors of the A'shiwanni and to priests of the Kia'nakwe.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: A buck among the offerings is allotted to the Kia'kwemosi, and the Shi'wanni
    of the Nadir flays the animal while others hold its legs.
  category: action
  evidence_refs:
  - ev:9
