canonical_text:
  quote: ''
  summary: 'A ritual sequence is described: makers of two idols enter a chamber; warriors
    fall silent and take positions; the elder brother Bow priest whirls a rhombus
    and calls for rain; ritual objects, fetishes, and images are returned or distributed;
    participants leave in ordered couples for the plaza; they dance and place the
    objects on a meal painting, with the image of U''yuyewi set on the east side.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the makers of the idols of U'yuyewi and Ma'sai'lema enter the chamber,
    the warriors stop chatting and laughing and remain silent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warriors stand on the north side of the room, the Ah'shiwanni remain at
    the west end, and the elder brother Bow priest stands south of and before the
    painting.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother Bow priest whirls a rhombus and calls for rains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the rhombus stops, the pe'kwin returns mi'wachi from the painting to
    their owners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The et'tone of the Kia'kwemosi and a large shell are placed in two baskets
    lined with raw cotton, while other fetishes are divided among certain warriors.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pe'kwin removes objects from the north and south sides of the painting
    and hands the image of U'yuyewi to the elder brother and the image of Ma'sai'lema
    to the victor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The group leaves the chamber and proceeds to te'wita 'hlan'na in couples,
    with an ordered procession led by the elder brother Bow priest whirling the rhombus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the plaza, all except the A'shiwanni form a single file and dance before
    the objects are placed on the meal painting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The image of U'yuyewi is stood on the east side of the meal painting in the
    plaza.
  category: setting
  evidence_refs:
  - ev:6
