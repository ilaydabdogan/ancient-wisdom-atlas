canonical_text:
  quote: ''
  summary: 'The passage describes Ko''yemshi and associated fraternity ceremonial
    actions: a disk is manipulated before a mi''li and placed at a warrior''s heart;
    participants joke and dance; the director prays over and waves the mi''li to six
    regions; an 1879 ceremonial preparation includes body paint, altar objects, masks,
    medicine water, corn, eagle plumes, and visiting dancers; a head-kerchief gift
    is exchanged; and the Ko''yemshi are visually transformed after donning masks.'
  language: English
  quote_policy: summarized
