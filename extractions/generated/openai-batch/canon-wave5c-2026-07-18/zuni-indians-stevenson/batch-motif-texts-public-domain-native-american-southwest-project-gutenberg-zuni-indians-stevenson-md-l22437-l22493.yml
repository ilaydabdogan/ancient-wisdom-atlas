canonical_text:
  quote: ''
  summary: The passage recounts origins and transmissions of several fraternities
    through visits, initiations, masks, medicines, songs, and Hopi-Zuni ritual contact.
    Gods initiate selected men and leave masks, forming or extending fraternities;
    a separate Little Fire or It'sepcho order is described as adopted or transmitted
    from Hopi/Mu'kwe people to A'shiwi/Zuni initiates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man invited six Shiiinai'koli, together with their warriors, from Chi'pia
    to HaTona; on a second visit the gods wore masks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The six gods initiated a Po'vi'kwc clan man into secret medicine for convulsions
    and limb cramps and taught him songs said to have been given by the Sun Father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods left masks with the initiated man, who initiated others and formed
    a fraternity named Shu'maakwe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Great Fire fraternity was assembled in its ceremonial chamber, three
    named gods appeared from Chi'pia.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each of the three gods initiated a man into secret medicine for swellings
    and left masks with the men, who then initiated others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Little Fire fraternity is described as not belonging to the fraternities
    organized at Hal'ona or Itiwana and as generally believed by Zuni sages to have
    been adopted from the Hopi Indians.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The main body of Mif'kwe or Hopis left the Corn clan and settled on three
    mesas, while the Corn clan remained at an earlier village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two A'shiwi or Zunis, one from the Badger clan and one from the Frog clan,
    visited the Corn clan; the passage says Frog clan members could kill deer and
    antelope by throwing the medicine of the San'iakiakwe fraternity upon the game.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The two A'shiwi were welcomed by the Mu'kwe of the Corn clan, observed the
    feats of the Little Fire fraternity, requested initiation, and were admitted by
    the mo'sona into It'sepcho, glossed as Jugglery.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The fraternity is said to have divulged only one order, for which the two
    A'shiwi paid nothing; on their return, eight others were initiated, making ten
    members in all.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The It'sepcho order is described as transmitted from the Hopi Indians and,
    according to Zuni belief, as existing among the A'shiwi before the organization
    of the fraternities by the Divine Ones at Hal'ona.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note reports that investigation supported the sages' account that members
    of this fraternity were among Zunis who had separated from their people to live
    with Hopis.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: After certain A'shiwi moved from To'wa yal'lanne, Corn mountain, to Shun'te'kiaya,
    those initiated into It'sepcho danced in the plaza before their people.
  category: action
  evidence_refs:
  - ev:10
