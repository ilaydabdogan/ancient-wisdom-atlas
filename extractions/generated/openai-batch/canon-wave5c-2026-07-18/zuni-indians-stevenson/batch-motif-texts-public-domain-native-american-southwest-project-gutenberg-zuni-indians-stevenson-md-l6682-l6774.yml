canonical_text:
  quote: ''
  summary: The passage describes Zuni restrictions concerning firelight, a fire-tender's
    duties during a festival, the former central role of village fire, the divine
    status of fire, the preparation and deposition of te'likinawe offerings, initiation
    rules governing who may make them, and a household scene in which adults and children
    prepare or learn ritual actions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shi'wanni expresses distress that a woman went outside at night with a light,
    saying this will cause him to have no crops for four years while rains fall around
    others' fields.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shi'wanni asks whether the light was a lamp or candle and says a lantern
    might have been better because its light would have been partly housed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the morning of the fifth day, the fire-tender covers the coals on the fire
    altar in the ki'wi'sine with ashes, goes home for breakfast, deposits his individual
    te'likinawe, and returns to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire-tender rekindles the fire from coals, covers coals before sleeping,
    gathers cedar for the fire altar, and leaves the ki'wi'sine only to eat or gather
    wood until the festival closes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Food must not be taken into the ki'wi'sine for ten days; breaking this rule
    is said to bring crop destruction by crows and mice and danger of death.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says no perpetual fire is now kept in any pueblo ki'wi'siwe, and
    explains that in earlier times wood scarcity and danger in travel made a central
    village fire necessary.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The central fire formerly warmed priests, furnished coals for lighting other
    fires, cooked food, and conveyed the spiritual essence of food to the gods.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage states that fire is a goddess, second in importance only to the
    sun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: From the fifth to the eighth day the pueblo is busy with grinding, songs,
    and food preparation; on the eighth day more extensive te'likinawe preparations
    occur.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Only those who have received voluntary initiation into the Ko'tikili may fashion
    the sticks or attach the plumes for te'likinawe, though women sometimes color
    the sticks.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A woman who has severed her connection with the U'huhukwe fraternity must
    prepare offerings for it after instruction by her fraternity father.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Each Ko'tikili member deposits te'likinawe to the sun, moon, Council of the
    Gods, game animals, birds of the six regions, birds of summer, birds of winter,
    and Po'shaiyanki for domestic animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A Hopi man resident in Zuni and Hopi visitors prepare te'likinawe described
    as quite different from those offered by the Zuni.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In Jose Palle's room, household members prepare te'likinawe; his wife makes
    te'likinawe for the U'huhukwe fraternity, and children handle plumes and learn
    dance actions with a plume and rattle.
  category: action
  evidence_refs:
  - ev:10
