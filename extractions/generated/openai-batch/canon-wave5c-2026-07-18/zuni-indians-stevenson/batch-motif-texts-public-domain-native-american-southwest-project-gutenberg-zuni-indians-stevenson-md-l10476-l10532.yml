canonical_text:
  quote: ''
  summary: The passage describes clan affiliations for ceremonial youth and maidens,
    the return of water-bearing parties from springs with young cornstalks, placement
    of water and cornstalks around a cloud symbol, rain-related actions using rhombi,
    flute, tobacco smoke, song, water sprinkling, prayer, and the beginning of a procession
    led by a Bow priest carrying symbolically painted ritual objects, followed by
    the pe'kwin strewing sacred meal.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Ceremonial youths and maidens are assigned by clan affiliation: the ''Hla''hewe-side
    participants are connected with the Dogwood clan, and the Sho''ko''we-side participants
    with the Corn clan; the next festival is said to require the same clan pattern.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The 'kla'punakwe return shortly before midnight with water from visited springs,
    each party escorted by a member of the A'pi'lashiwanni, or Bow priesthood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each 'kiapuno'na brings young cornstalks with roots in addition to vases of
    water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pe'kwin receives the cornstalks, stands them on each side of the cloud
    symbol, and places water vases and jugs on meal circles associated with that symbol.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder and younger brother Bow priests stand on opposite sides of the cloud
    symbol and whirl rhombi for the rain-makers while the Kia'kwemosi plays a smaller
    A'shiwanni flute.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man of the Frog clan smokes native tobacco and puffs smoke into the medicine
    water and over the water vessels and green corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Both choirs sing with the stated aim that the earth may be abundantly watered.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two 'kla'punakwe sprinkle water from gourd jugs over the cloud symbol, surrounding
    objects, green corn, corn baskets, and each person present; the female 'kla'punakwe
    repeat the sprinkling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a long prayer by the pe'kwin, a procession forms to proceed to the ham'pone
    in the Si'aa'te'wita.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder brother Bow priest leads the procession carrying his mi'li and a
    kilt with a broad blue-green band described as symbolic of the vegetation of the
    world.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The kilt includes sho'liwe designs made with yucca-splint squares, yellow
    and black coloring, a diagonal line interpreted as the road of the Sun Father,
    eagle plumes, arrow reeds, and a gaming stick with plumes.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The yellow color is explained as indicating the north country under the care
    of the Kia'kwemosi, while the black is explained as symbolic of the earth under
    the care of the Shi'wanni of the Nadir.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The pe'kwin follows the elder brother Bow priest carrying a sacred meal basket
    and throwing meal in a line before him; the passage notes that he does not possess
    a mi'li because he is not a member of the O'naya'nakia.
  category: action
  evidence_refs:
  - ev:8
