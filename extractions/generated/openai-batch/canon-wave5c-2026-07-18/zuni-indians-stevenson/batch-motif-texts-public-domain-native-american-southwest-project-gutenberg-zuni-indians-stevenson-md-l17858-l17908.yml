canonical_text:
  quote: ''
  summary: The passage describes Zuni clan races for rain, including preparation of
    decorated gaming sticks, clan symbols painted on runners, a Bow priest marking
    the starting line and starting the race with prayer and meal thrown four times
    eastward. It distinguishes religious rain races from betting races. It also describes
    a man seeking racing success from a rain priest of the west or south, a night
    gathering around a cloud symbol and sacred fetishes, offerings, four ears of corn,
    song prayers to the rain-makers, and the giving of a prayer plume at sunrise.
  language: English with Zuni terms
  quote_policy: summarized
