  summary: The passage gives prayers and ritual descriptions from Zuni rain-priesthood
    ceremonies. It invokes rain-makers for showers, clouds, thunder, crop growth,
    food, life, and happiness; describes meal sprinkled along a fetish line; recounts
    prayers to Sun Father and the use of a meal road, prayer plumes, thunder stones,
    te'likinawe, gourd jugs, spring water, cloud symbols, women's offerings, and songs
    of thanksgiving.
  language: English with Zuni terms
