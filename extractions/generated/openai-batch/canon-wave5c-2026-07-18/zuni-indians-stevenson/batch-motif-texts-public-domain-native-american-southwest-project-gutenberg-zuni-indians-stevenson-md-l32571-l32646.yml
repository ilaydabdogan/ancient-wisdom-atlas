canonical_text:
  quote: ''
  summary: 'The passage describes the closing-day plaza ceremonies around a scalp
    pole: dancing, arrow gestures before a cloud symbol, gifts waved over a meal painting
    and distributed, two files of women bringing food, prayers and sacred-breath gestures,
    food deposits in baskets near the scalp pole, fasting participants eating after
    arrows are removed from their mouths, and a final sharing of food with the populace
    and other ceremonial groups.'
  language: English
  quote_policy: summarized
literal_observations:
