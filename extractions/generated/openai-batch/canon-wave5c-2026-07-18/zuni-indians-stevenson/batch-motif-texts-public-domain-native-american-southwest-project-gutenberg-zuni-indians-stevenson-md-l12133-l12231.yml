canonical_text:
  quote: ''
  summary: 'The passage describes preparations and public appearance of Kia''nakwe
    personators in a crop thanksgiving festival: masks are softened, decorated, and
    kept secret; archaic songs in the Sia language are rehearsed; performers assemble
    south of Zuni, paint their bodies, put on masks and sacred blankets, and approach
    the village; leaders, warriors, directors, and captive figures are described by
    dress, masks, colors, and carried ritual objects.'
  language: English with Zuni and Sia terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kia'nakwe personators are stated to be members of the Corn clan and Chu'pawa
    ki'wi'sino.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ten days before the ceremony, hide masks that cover the head are taken from
    storage, filled with damp sand, shaped, and placed along the north ledge of a
    room in the priest or director's dwelling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mask decoration begins five days after the masks are taken from storage; four
    days are spent decorating the masks and preparing paraphernalia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Secrecy is observed during preparation, and only people with duties may enter
    the room.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Twelve ceremonial songs are described as archaic by the Zunis and as being
    in the Sia tongue, which is identified as the language of the Kia'nakwe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants frequently meet during the summer after field work to rehearse
    the songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Before appearing, the Kia'nakwe personators and their prisoners assemble two
    miles south of Zuni, paint their bodies with pinkish clay, dress in mi'hawe and
    masks, and return to the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men, women, and children fill housetops to see the approaching gods as they
    come from the southern hills singing a low chant.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The priest leads the procession, followed by his deputy; they wear white clothing
    and blankets with four dark fluffy eagle plumes attached front and back in a square
    form.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The priest and deputy carry tortoise-shell rattles, a pottery meal basket,
    and te'likinawe, and their masks have a spruce collarette tipped with popcorn.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two directors of the warriors of the six regions wear dressed deerskins, bow
    wristlets, tortoise-shell rattles, bows, and arrows.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ko'thlama is the first captive seen; he wears a woman's black dress, exposed
    white-painted neck and arms, a face mask, and carries a deer-scapula rattle and
    three ears of corn tied with yucca ribbons and te'likinawe.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sa'ya'hlia is another captive and wears a reddish-brown ornamented deerskin
    with a sun emblem on the back, a painted cotton-cloth mask with lynx-skin beard,
    corn-husk teeth, gray goat's wool, and a red fox skin around the neck.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: It'sepasha, called game-maker, is the last captive seen in the line and is
    identified as one of the ten Ko'yemshi.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: There are six warriors of the Kia'nakwe for six regions, with masks in colors
    assigned to North, West, South, East, Zenith, and Nadir.
  category: relationship
  evidence_refs:
  - ev:8
