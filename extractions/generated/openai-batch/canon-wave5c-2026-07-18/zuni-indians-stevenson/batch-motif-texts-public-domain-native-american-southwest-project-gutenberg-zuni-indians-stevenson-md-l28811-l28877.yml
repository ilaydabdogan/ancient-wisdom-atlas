canonical_text:
  quote: ''
  summary: 'The passage describes a Shu''maakwe initiation ceremony: members prepare
    and erect an altar, work on masks and prayer plumes, arrange fetishes and ritual
    objects, consecrate medicine, seat officers and novices, pray over meal in corn-husk
    packets, have novices draw breath from the meal, distribute meal to members, and
    depart to Ku''shiloa to plant prayer plumes and sprinkle meal. Notes mention septum-worn
    plumes in other fraternity ceremonies and a reported Hopi and early Japanese use
    of mole in ceremonials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The early part of the day is spent repainting and erecting the tablet altar,
    working on masks, and preparing prayer plumes; in some cases women paint their
    own plume sticks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At 3 p.m. the a'kwamosi draws a cloud symbol with meal at the base of the
    altar, and members in Zuni gather in the ceremonial chamber, except for one woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Members who possess a mi'li hand them to an officer, who temporarily places
    them in a basket tray; the fetishes later stand in line before the altar and have
    zigzag sticks symbolic of lightning within the plumes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother Bow priest, described as a warrior to the fraternity,
    leaves after the meal painting and returns to formal greetings as if he had not
    previously been present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An aged woman places two boxes and two home-manufactured stools in a north-south
    line before the altar; the warrior and other officers take seats, and those present
    remove moccasins except for one woman with an injured left foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The a'kwamosi consecrates medicine with concretion fetishes sacred to the
    field, while a choir sings with rattle and pottery drum; the a'kwamosi sprinkles
    the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The director sits near the altar on the north ledge, and a female member beside
    him deposits a basket of prayer plumes in the northwest corner of the room.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Four male novices are present; male members, female members, boys, girls,
    and women sit in specified areas of the chamber.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The four novices sit on the boxes and stools, and the first four officers
    sit before them on wadded blankets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each officer places a corn-husk package of meal in the right hand of the novice
    opposite him, clasps that hand with both hands, recites a long prayer, and holds
    the husk to the novice's mouth so the novice may draw a breath from the meal while
    praying.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The a'kwamosi repeats a litany to which all respond, and the passage says
    that sacred breath is drawn at its close.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The novices pass to everyone present and give each person a pinch of meal
    from the corn husk; recipients wrap and tie the meal in corn husk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Each member starts for Ku'shiloa, identified as red earth east of the village,
    to plant prayer plumes and sprinkle meal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A note states that wearing plumes through the septum is not confined to Shu'maakwe
    ceremonials and may be displayed in ceremonies of other fraternities where the
    person holds membership.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note reports that bits of charred mole were taken into the mouths of members
    during the night in a Hopi fraternity ceremonial, and that mole was understood
    to have been used in ceremonials by early Japanese.
  category: other
  evidence_refs:
  - ev:9
