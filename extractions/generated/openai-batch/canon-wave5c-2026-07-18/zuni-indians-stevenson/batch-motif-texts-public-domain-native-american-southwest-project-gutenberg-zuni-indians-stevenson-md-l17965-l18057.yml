  quote: ''
  summary: The passage describes how a betting race is arranged, ritually prepared,
    accompanied by offerings to divine and ancestral recipients, interpreted through
    sounds and animal omens, and surrounded by communal wagering.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The betting race is arranged by one man approaching another, then publicly
    announced from a house top by a civil officer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those wishing to run gather at the houses of the two managers; each side has
    the same number of runners, varying from three to six.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: One side represents the elder God of War and the other side represents the
    younger God of War.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each manager summons a rain priest to his house for the night before the race.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rain priest prepares corn-husk packages with prayer meal, bits of white
    shell, and turquoise beads, places them with broken wafer bread, prays for success,
    draws four breaths from the tray contents, and says that they are ready.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each runner receives broken wafer bread and one corn-husk package from the
    rain priest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The runners representing the elder God of War go north of the village, while
    the other runners go south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the north and south points, runners deposit package contents and bread
    into excavations as offerings to the Gods of War and ancestral gods, after which
    the openings are covered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After depositing offerings, the runners sit still and listen for sounds they
    suppose come from the departed; when such a sound is heard, they thank the grandfathers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Mockingbird song, owl hooting, sounds from the dead, and whistling wind are
    interpreted as signs concerning likely success or failure in the race.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: An individual runner may make additional offerings of beads or food at an
    arroyo or at a place where a renowned past runner was killed, then listen repeatedly
    for signs from the deceased.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At sunrise each runner sprinkles an offering of precious beads and meal to
    the lightning makers of the six regions for success.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Runners exercise in the early morning, eat breakfast, avoid coffee, and afterward
    take only a small quantity of wafer bread and water until the race.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: By afternoon, bettors place possessions in the plaza, and the two managers
    arrange matched articles from two heaps into one consolidated heap of stakes.
  category: action
  evidence_refs:
  - ev:9
