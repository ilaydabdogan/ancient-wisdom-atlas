canonical_text:
  quote: ''
  summary: The passage describes festival episodes in which Ko'vemshi or Ko'yemshi
    jesters burlesque dancers, give dolls and corn to a girl and her mother, amuse
    spectators by covering a dog with blankets, and assist amid public gift-throwing
    by returning dancers. The dancers and Ko'yemshi then leave the plaza, disrobe,
    and have masks and paraphernalia carried back covered from view. The festival
    closes, to recur in four years; gifts are taken to the A'sliiwanni, and cooked
    game portions are placed in the river as offerings to the deceased Kia'nakwe,
    described as angry gods requiring appeasement.
  language: English
  quote_policy: summarized
