  text: Two Ko'yemshi approach a little girl; one carries a doll, and the other carries
    a basket containing a doll and boiled ears of corn tied with yucca ribbons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother places her arms around the child; the Ko'yemshi speak with the
    child, ask questions, and give the doll to the child and the basket with doll
