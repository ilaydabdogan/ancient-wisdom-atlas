canonical_text:
  quote: ''
  summary: The passage describes a sacred crater lake associated with the Gods of
    War, graded access for Bow priesthood members according to scalp-taking, descent
    by a sacred path, offerings at shrines and in the lake, prayers made by a guide,
    sunrise salt-gathering rites, and the treatment of Father corn and Mother corn
    after being covered with salt-bearing clay.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crater lake is described as a highly sacred place with cold water, hot-water
    jets, water in which a person cannot sink, and waters considered useful for rheumatism
    by those who have tested them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Entry into the crater is restricted: only Bow priesthood members who have
    taken four scalps may enter; fewer scalps allow only graded ascent partway up
    or to the top of the mountain.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Members of the Bow priesthood who go to the house of the Gods of War must
    descend by a path said to have been traveled by those gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder and younger Bow priests are described as living representatives
    of the Gods of War and, at the water's edge, separate and make the circuit of
    the lake in opposite directions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A square shrine on the east side of the lake is set apart for the elder and
    younger brother Bow priests and contains prayer plumes, miniature war clubs, batons,
    shields, bows and arrows, and other offerings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Beads and other valuable offerings had formerly been deposited along the lake
    shore and in a nearby spring, but the passage says the coming of whites caused
    the Zunis to avoid offerings of commercial value.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A guide initially refused to descend into the crater because he was not a
    member of the Bow priesthood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the crater lake, the guide gave meal to Mr. Stevenson and the writer, asked
    them to breathe a prayer and scatter the meal on the waters, and sang a low chant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The guide's prayer addressed the Sun Father and the Gods of War, then asked
    the Salt Mother and ancestral warrior gods of the six regions to intercede, and
    also invoked health and prosperity for his people and all people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At sunrise after the salt-gatherers arrive, Bow priests and warriors visit
    the supposed home of the Gods of War in the depths of the crater; the rain priest
    deposits plume offerings to the Salt Mother; and Great Father Ko'vemshi plants
    prayer plumes for the Council of the Gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After plume planting and prayers, participants enter the lake with a blanket
    or cloth and scrape salt crystals from the lake bed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Each man has two ears of corn called Father corn and Mother corn, covers them
    with salt-bearing clay from the lake bed, places them with plume offerings among
    stored corn, and later deposits them in the river when the cobs have lost their
    grains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that no corn heap must be without Father corn and Mother
    corn, and that no Indian would dare part with the parent corn because of fear
    of the Salt Mother's wrath.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: An ear of corn with a direct line of grains is said to have special significance
    for parent corn because it is symbolic of the straight path of life its possessor
    should follow.
  category: attribute
  evidence_refs:
  - ev:9
