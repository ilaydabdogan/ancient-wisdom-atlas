canonical_text:
  quote: ''
  summary: The passage first gives an ethnographic and ceremonial note on the ko'thlama,
    a male figure adopting woman's dress and women's work, including the personator
    of Kor'kokshi in a Zuni thanksgiving dramatization. The battle narrative then
    describes the A'shiwi praying and dancing while rain weakens enemy bowstrings.
    Kow'wituma prays to the Sun Father and learns that Ku'yapali'sa's heart is in
    her rattle; when the rattle is pierced or struck, she dies, causing her people
    to panic. The A'shiwi capture the village, release three gods, and the gods return
    to Ko'thluwala'wa. An alternate version says the Sun Father gives turquoise rabbit
    sticks to Ma'sai'lema, and one strikes the rattle. The Kia'nakwe flee into black-rock
    waters, which Kow'wituma seals with stone slabs; their ghost selves go to Ko'thluwala'wa,
    while a brother and sister survive by hiding in a cave.
  language: English with Zuni terms
  quote_policy: summarized
