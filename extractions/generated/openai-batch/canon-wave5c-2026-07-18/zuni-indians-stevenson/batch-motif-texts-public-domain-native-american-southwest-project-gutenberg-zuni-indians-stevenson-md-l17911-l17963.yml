canonical_text:
  quote: ''
  summary: 'The passage describes ritual preparation for a man seeking success as
    a runner or at stakes: a prayer plume, yucca-suds washing, instruction by the
    rain priest, ascent to a marked mesa, stone actions connected with breath and
    luck, passage over a looped rock course called a luck line, and prayers with meal
    and crushed precious materials offered to the Gods of War before a long run back
    to Zuni.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A black prayer plume is described with soft turkey-leg feathers, feathers
    from birds of the six regions, a soft turkey-leg feather attachment, and an old
    ko'hakwa bead on its cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife of the rain priest prepares yucca suds; those present place suds
    on the man's head with prayers; then the wife of the rain priest washes his hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rain priest instructs the man on the course to follow for success as a
    runner or at the stakes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One of two mesas with rock markings must be ascended, and the runner begins
    and ends running at a distance from the village so that people will not suspect
    the run.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near a stone heap below the mesa summit, the runner takes a small stone in
    each hand, spits on the left-hand stone, moves it around his head, and throws
    it on the heap to be rid of tired breath and begin with new breath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the mesa summit, a rock running course has six loops explicitly said to
    symbolize cumulus clouds of the six regions, with a second stone heap beyond the
    line.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The runner places the right-hand stone at the near end of the line and pushes
    it under his right foot over the course; success requires carrying it to the end
    and casting it on the second stone heap.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Completing the luck line makes the man confident of winning a race or risking
    high wagers; partial completion makes him cautious in betting.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The run continues to a shrine, where prayers are offered and meal mixed with
    crushed turquoise, ko'hakwa, and abalone shell is sprinkled to the Gods of War
    for good luck in the race.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the shrine, the runner follows a course directed by the rain priest
    down the mesa, over the Ojo Caliente road, around to the south, and back to Zuni,
    covering about 25 miles.
  category: sequence
  evidence_refs:
  - ev:7
