canonical_text:
  quote: ''
  summary: The passage describes parts of initiation rites involving suds, plumes,
    washing, a mi'li and sacred breath, diminishing choir and drum, gifts, and food
    preparation. It then describes Shi'wannakwe fraternity rules, origin instructions
    from the Divine Ones, its three orders, a celestial dry painting with Galaxy,
    sun, and moon symbols, rubbing Galaxy meal on the novice, carrying the meal and
    prayer plumes to a shrine, offerings to rain-makers, the Galaxy, and Beast Gods,
    and a Fire order initiation involving coals and yarrow medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fraternity parents dip plumes into bowls of suds and deposit the suds on novices'
    heads, beginning at the south end; Mystery medicine members repeat the act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Candidates' heads and hands are washed by those who prepared the suds, and
    the hair is wiped by the mother or sister of the fraternity parent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each fraternity parent removes his mi'li from the altar, passes it four times
    downward before each novice's mouth while sacred breath is drawn, and then applies
    it to the left side of the face, crown of the head, and right side of the face.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The choir gradually diminishes until one singer besides the drummer remains,
    and the voice and drum die away when members come forward with their mi'wachi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bowl in which the novice's head is bathed is given to the novice.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women from the fraternity father's family and the candidate's family exchange
    gifts such as flour and cornmeal; women of the fraternity and male members' families
    furnish and prepare ceremonial food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Shi'wannakwe and 'San'iaklakwe do not observe the winter solstice fast
    from animal food because they received direct instructions from the Divine Ones
    not to observe it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Shi'wannakwe must not eat jack rabbit at any time.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The Shi''wannakwe fraternity has three orders: O''naya''nakla, It''sepcho,
    and Ma"ke.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Shi'wannakwe novice usually appears before the fraternity on the fourth
    night, escorted from home to the ceremonial chamber by the fraternity father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The initiation dry painting is described as associated with celestial worship
    rather than directly with worship of beasts of prey.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The dry painting includes an outline of a tablet altar, a mi'wachi, a line
    of meal, the Galaxy made of meal and charred corncob outline, and sun and moon
    symbols.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The sun and moon emblems are made of corn pollen, burnt corncob, crushed turquoise,
    and other mineral colors; lines from the disks denote rays of the sun.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Shi'wannakwe initiation, meal from the Galaxy symbol is rubbed on the novice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The meal is gathered in corn husks and carried with prayer plumes to the Shi'wannakwe
    shrine on a knoll southeast of Zufii.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The shrine has a stone slab with sun and moon etchings; the novice plants
    prayer plumes a few feet southwest of the slab.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: The prayer plumes are offerings to rain priest rain-makers, sun priest rain-makers,
    Yu'pia'hlan'na, and the Beast Gods; the Beast Gods are supplicated to intercede
    with the others.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: In Fire order initiation, the novice sits in the center of the floor and rises
    when the fraternity father is ready to place coals in his mouth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Yarrow medicine is taken beforehand to prevent burning and is placed into
    the novice's mouth directly from the fraternity father's mouth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The passage states that the Shi'wannakwe possess a rough stone carving of
    a female, but the description is incomplete in the supplied passage.
  category: object
  evidence_refs:
  - ev:9
- id: obs:21
  text: A note says the male gender is applied to the Galaxy.
  category: attribute
  evidence_refs:
  - ev:10
