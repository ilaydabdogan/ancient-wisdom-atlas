canonical_text:
  quote: ''
  summary: 'The passage describes ceremonies held on the fifth night after the Sha''lako
    festival in Koman Luna''s house: masked dance preparations, song-prayer instruction
    in Laguna and Acoma languages, spectator arrangements, ritual washing after dances,
    social disorder caused by alcohol, and the entrance of twenty-one men personating
    the He''mishikwe with rattle and drum.'
  language: English
  quote_policy: summarized
