  text: An elaborate display is said to be made for five consecutive nights by order
    of the gods and by representatives from all of the ki'wi'siwe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described dances took place in 1891 on the fifth night after the Sha'lako
    arrived in Koman Luna's house.
  category: sequence
  evidence_refs:
