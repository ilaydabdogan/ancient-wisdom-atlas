canonical_text:
  quote: ''
  summary: The passage describes mortuary treatment for We'wha, including dressing
    the body, public viewing, burial, food offerings to fire, prayer plumes, deposition
    of clothing and a mask at a riverbank, and destruction or retention of possessions.
    It then describes Nai'uchi's final illness and death, including attendance by
    family and theurgists, Indigenous treatments involving witch-attributed objects
    and lightning-associated wood, intervention by a Government physician, burning
    of wrappings, attribution of death to that treatment, and non-administration of
    prescribed medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: We'wha's body was dressed in fine clothing, blanket wraps, a bordered blanket,
    carefully arranged hair, silver necklaces, turquoise earrings, and bangles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: We'wha's death was treated as a calamity, and the remains lay in state for
    viewing by allied clan members, rain priests, theurgists, others, and children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the blanket was closed, renewed grief occurred, and the foster mother
    fell unconscious to the floor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two brothers carried We'wha's remains to the grave, and the sisters made food
    offerings to the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The foster brother prepared prayer plumes, and a small procession deposited
    clothing, a mask, and prayer plumes west of the village on the river bank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The foster mother gathered We'wha's remaining possessions for destruction;
    many gifts and photographs were to be destroyed, while some framed pictures were
    retained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nai'uchi is identified as rain priest of the Nadir and as having long been
    elder brother Bow priest.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two days before his death, Nai'uchi held the writer's hand and asked her to
    remain with him; the passage identifies these as his last sentences.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two theurgists of the Little Fire fraternity, including one woman, watched
    Nai'uchi near his pallet along with children, grandchildren, and others dear to
    him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A doctress had lanced Nai'uchi's right foot, cut his scalp, extracted two
    small green peaches said to have been shot in by a witch, and applied powdered
    wood from a tree struck by lightning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The doctress is described as a member of the Lightning fraternity, which possessed
    a specific for people who become unconscious and fall.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Government physician examined the right foot, found it ulcerated to the
