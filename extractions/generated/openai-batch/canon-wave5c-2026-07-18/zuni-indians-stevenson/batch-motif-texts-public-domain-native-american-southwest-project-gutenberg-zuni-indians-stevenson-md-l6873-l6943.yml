canonical_text:
  quote: ''
  summary: 'A Zuni ritual sequence is described: fetishes are transferred into baskets,
    meal is sprinkled, tobacco smoke is blown over plumes and fetishes, prayers and
    songs are performed to beings of six regions, and the rite is said to seek rain
    and fertility for the earth. The passage also notes a Sia-language prayer song
    and concludes with the return of fetishes and ritual objects after sunrise.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man removes fetishes one by one from sacks and gives them to the shi'wanni,
    who places them with other fetishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shi'wanni sprinkles a cross of meal in a larger basket and handles each
    package of the tena'sali separately before depositing fetishes in the basket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A smaller basket is set between the larger basket and a large fetish of a
    cougar, with la'showawe arranged to fall over it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A cigarette of native tobacco is lit, passed among participants, and the shi'wanni
    takes eight long whiffs, blowing smoke over the basket of plumes and fetishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Consumed cigarette stumps are deposited by the large stone cougar fetish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After a long litany and responses, the shi'wanni sprinkles meal over the cougar
    and basket of plumes and fetishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: All participants take meal from the basket, offer a short prayer, sprinkle
    the plumes and fetishes, and draw from them the sacred breath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A song led by the shi'wanni is addressed successively to beings of the six
    regions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The beings named include six directional women associated with north, west,
    south, east, zenith, and nadir, each with a color designation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Directional animals named in the ritual include Cougar of the North, Bear
    of the West, Badger of the South, White Wolf of the East, Eagle of the Zenith,
    and Shrew of the Nadir.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The songs and prayers are described as intended to bring rains to fructify
    mother earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The song closes at the rising of the morning star, which is said to announce
    the Sun Father coming from his house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the close, participants repeat a short prayer and inhale the sacred breath
    of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A note states that the prayer song was recognized as being in the Sia language
    and that the shi'wanni said the song came to them long ago.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the rite, stone fetishes are returned to buckskin medicine bags, the
    te'nas'siili is restored to a vase, and participants later return for te'likinawe
    to be planted in fields.
  category: sequence
  evidence_refs:
  - ev:7
