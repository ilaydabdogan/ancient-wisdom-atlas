canonical_text:
  quote: ''
  summary: The passage describes a ceremonial sequence connected with becoming or
    installing a Bow priest after an enemy has been defeated. The pa'mosona, or scalp
    custodian, receives the returning party, leads declarations and war whoops, handles
    cedar bark toward the six regions, receives small vessels of rain water and gourds,
    divides and deposits scalp pieces near a small fire and meal circle, and the victor
    with an elder-brother warrior shoots arrows into the scalp pieces and carries
    them with other ritual objects. A pe'kwin prepares an excavation and earth mounds
    north of the village.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The victor and the elder brother stand side by side, each flanked by a fellow,
    as a crowd gathers to receive the approaching party.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pa'mosona, identified in the passage as the scalp custodian, addresses
    the pa'sewikia and announces that the enemy has been met and will no longer breathe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The war whoop is repeated four times, with additional cries after the second,
    third, and fourth repetitions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pa'mosona asks who will become a Bow priest, who will kick the scalp,
    and who will wash the scalp; the answers name kin-like ritual relations such as
    younger mother, elder sister, younger father, and elder brother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pa'mosona expectorates on cedar bark, waves it to the six regions, throws
    it on the ground, and the pa'sewikia retire to their homes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The victor and the elder-brother warrior give the pa'mosona tiny vases filled
    with rain water and diminutive gourd dippers that had been given to them by the
    Kia'kwemosi.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pa'mosona takes a hairless piece of scalp from a black pottery vase kept
    in the scalp house, divides the scalp into two pieces, and deposits them at a
    secluded place north of the village with a vase of rain water and a gourd beside
    each piece.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pa'mosona makes a small fire between the two scalp pieces and sprinkles
    a large circle of meal around surrounding ridges; the passage says this symbolizes
    the enemy sitting around a camp fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The victor and elder brother go with bows and arrows to the prepared place,
    identify the camp fire as indicating an enemy, cut juniper twigs with an archaic
    stone knife, circle the meal in opposite directions, draw their bows, and each
    shoots an arrow into a scalp piece.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The arrows remain in the scalp pieces; each scalp piece is carried in the
    toga with the shaft over the heart region and feathered ends touching the chin,
    while the juniper twig, vase of water, and gourd are also transported.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the absence of the victor and elder brother, the pe'kwin makes an excavation
    north of the village and raises a mound of loose earth on each side of it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'A note states that the Gods of War are associated with mountain-top roofing,
    an extinct volcano crater as a permanent home, and color-coded six regions: north,
    west, south, east, zenith, and nadir.'
  category: attribute
  evidence_refs:
  - ev:3
