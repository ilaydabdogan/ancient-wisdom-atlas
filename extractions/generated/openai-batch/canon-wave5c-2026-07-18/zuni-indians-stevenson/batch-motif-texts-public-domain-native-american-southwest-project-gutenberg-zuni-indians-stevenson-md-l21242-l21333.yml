canonical_text:
  quote: ''
  summary: 'The passage describes several medical-practice incidents: a theurgist
    treats a fever patient with prayer, fetish medicines, water, a reed, bodily applications,
    diet restrictions, and appeals to the Beast Gods of the four regions; the patient
    is later moved to his mother''s house and treated by Na''iuchi and members of
    the Little Fire fraternity. A young girl''s illness is attributed by her family
    to witchcraft, leading to a summoned theurgist and a trial of an accused wizard,
    while the writer records symptoms, feeding, and recovery. A grandmother urgently
    calls Na''iuchi to a comatose infant, and he manipulates the child''s body while
    keeping it covered.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A theurgist prayed quietly, placed a fetish in a basket, mixed small quantities
