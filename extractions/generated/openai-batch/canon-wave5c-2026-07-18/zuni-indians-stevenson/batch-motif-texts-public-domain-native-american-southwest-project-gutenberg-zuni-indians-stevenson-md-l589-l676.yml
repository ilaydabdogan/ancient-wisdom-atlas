canonical_text:
  quote: ''
  summary: The passage recounts the creation of the A'shiwi in the undermost world,
    the Sun Father's creation of two divine sons, and their descent to bring the people
    upward. The Divine Ones make fire in darkness, use meal to make roads or guiding
    light, cut directional trees as ascent paths through successive worlds, and lead
    the A'shiwi to the outer world through a water-cleared opening as Evening Star
    rises.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shi'wanni and Shi'wano"kia are named as parents of the A'shiwi; the A'shiwi
    are said to be created in the undermost world and born as infants in rapid succession.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yatokia, identified as Sun Father, creates two sons, Kow'wituma and Wats'usi,
    by impregnating two bits of foam with his rays.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two Divine Ones ascend to Sun Father over a road of meal made by throwing
    meal upward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sun Father gives the Divine Ones a rainbow, lightning arrows, and a cloud
    shield, and directs them to bring his children from the undermost world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Divine Ones rend the earth with lightning arrows and descend into the
    fourth world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the A'shiwi ask who they are and where they came from, the Divine Ones
    answer, "The two come down."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The undermost world is dark; people cannot see one another, tread on one another's
    toes, live in holes in the earth, and eat seed grass.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kow'wituma makes fire by rubbing an arrow on a bow over dry grass, lights
    the grass, and carries it as a torch among the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some people cannot look at the fire, while others fall back in fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Divine Ones throw out lines of meal that produce light and guide travel
    toward the north, west, south, and east.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:11
  text: In the four directions the Divine Ones cut named trees and plant them as routes
    for the people to ascend through successive worlds.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:12
  text: The A'shiwi ascend from the fourth world through water-moss, mud, and wing
    worlds to the outer world, named as a light-of-day place.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
- id: obs:13
  text: The place of coming through to this world is described as an opening in the
    earth formerly filled with water, which disappeared and left a clear passage.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Divine Ones and the A'shiwi spend time in each world during ascent, and
    some A'shiwi left behind struggle after the others.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The A'shiwi have constant rainfall during the ascent and reach the outer world
    as Evening Star rises above the horizon.
  category: sequence
  evidence_refs:
  - ev:9
