literal_observations:
- id: obs:1
  text: After the sunrise dance, four dances occur in the plaza, and the fraternity
    retires to its ceremonial chamber at the close of each dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cactus is carried in the dances; in the fourth dance all carry large pieces
    of cactus in each hand.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mixture of squash blossoms and seeds is taken into the mouth of each member
    before leaving the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dancers sometimes leave the circle and use cactus to strike those nearby;
    members also run cactus through the mouth in a repeated manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Two warriors return with large pieces of cactus and engage in bouts, each
    showing indifference to pain inflicted by the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dancing and fighting with cactus continue outdoors until after sunset and
    later continue in the ceremonial chamber until sunrise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At sunrise, the fraternity father gives the novice a corn husk and leads him
    to a floor painting before the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The novice steps on the painting, faces the altar, faces east, turns around
    on the painting four times, and gathers grains of corn into the corn husk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The floor painting is described as a kaolin-colored disk on sand, with figures
    of the Ku'pishtnya of the six regions, a diagonal galaxy line, colored corn grains
    as stars, and cloud symbols.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The deputy administers medicine water while the director collects the painting
    sands with eagle-wing feathers and the hand.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:11
  text: The collected sands, cactus, switches, willows, yucca wreaths, and plumes
    are carried to the place where the novice was first struck with cactus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: An excavation is made; willows, cactus, yucca wreaths, and painting sands
    are deposited, prayer plumes are planted, and the excavation is covered with earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Back in the ceremonial chamber, the fraternity father tells the novice that
    he is now a cactus man and instructs him how to respond if a Kok'ko strikes him
    one to four times.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the ceremony, participants sleep alone on sheepskins with the wool side
    down; cactus needles continue to work out of the flesh, and squash seeds are chewed
    and rubbed on the wounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note states that cougar medicine is a root traded to the Zunis by Cochiti
