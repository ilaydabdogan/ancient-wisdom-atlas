canonical_text:
  quote: ''
  summary: 'The passage describes several medical cases and treatments: infants treated
    by a theurgist or doctor through manipulation and emetic medicine; massage and
    heated sheep-chip applications for rheumatism or heat-responsive ailments; a young
    girl with spinal injury and abscess whose Zuni doctor and an American doctor both
    attend her before her death; and the beginning of a case involving a Hopi man
    with a broken jaw and surgical removal of part of the jawbone.'
  language: English
  quote_policy: summarized
