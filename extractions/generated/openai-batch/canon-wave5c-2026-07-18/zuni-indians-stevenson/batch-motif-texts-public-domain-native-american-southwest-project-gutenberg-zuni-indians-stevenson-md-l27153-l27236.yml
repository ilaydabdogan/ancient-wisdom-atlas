canonical_text:
  quote: ''
  summary: The passage describes a ritual sequence involving novice healing instruction,
    dancing, ash sprinkling before an altar, distribution of medicine water, anointing
    and washing with yucca suds and plumes, gift-giving to novices, and fire-related
    performances in which coals and burning corn husks are handled or put into the
    mouth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a ceremony with novices, dancing resumes and the theurgists continue
    practicing upon the sick.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three young boys with white cotton breechcloths and white-painted bodies appear
    among the dancers; the dancers include women.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An adult novice is led onto the floor for a first lesson in healing; after
    the fraternity father touches a plume to part of an invalid's body, the novice
    sucks the spot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The adult novice pretends to put something from her mouth into the fraternity
    father's right hand, and he appears to drop an object into a bowl; during first
    instruction no object is seen and no sound is heard in the deposit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A younger child is carried on the back of her fraternity father and does not
    take part in healing because active medicine practice requires reaching the age
    of discretion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A boy about eight years old, previously initiated into the order of Mystery
    medicine but not yet active in it, is carried on a theurgist's back during violent
    movements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Great Mother collects ashes from the fireplace and heaps them before the
    altar; ash-sprinklers sprinkle the ashes and dance before the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The a'kwamosi administers medicine water from a bowl with a shell to men and
    women, and all sprinkle the altar with meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Novices sit facing east while yucca suds are lifted with eagle-wing plumes
    and placed on their heads; their heads are washed, prayer plumes and four ears
    of corn are given to them, and a mi'li is drawn by their lips, heads, and shoulders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that this ceremony closes initiation into the order of
    O'naya'nakla.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A theurgist who is also a member of the Fire division dips the quill ends
    of eagle plumes in medicine water, presses them to his bare breast, and then performs
    energetic beast-like dancing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The same theurgist takes a large coal from the fireplace, moves it between
    his hands while dancing, and puts it in his mouth for about thirty seconds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Other men and women join the fire performance with coals in their mouths;
    the coals are held from about thirty seconds to one minute and then tossed back
    into the fireplace.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: Later theurgists come forward in small groups, pelt the choir with live coals,
    light bunches of corn husks, shower sparks on the choir, and run the burning mass
    into the mouth.
  category: action
  evidence_refs:
  - ev:10
