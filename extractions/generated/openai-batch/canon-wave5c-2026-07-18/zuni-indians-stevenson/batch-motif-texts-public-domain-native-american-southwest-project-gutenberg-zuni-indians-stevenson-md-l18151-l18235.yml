canonical_text:
  quote: ''
  summary: The passage describes Zuni race-course stone heaps associated with the
    Gods of War, wagering practices in foot races, and the game sho'liwe. Sho'liwe
    is presented as an indoor gambling game of the Gods of War, with implements including
    split reeds, and is said in legend to have been played for rain by the Gods of
    War and rain priests. The rain priests organized the Sho'wekwe fraternity to play
    the game for rain. A later ceremonial account describes ancestral gods, rain priests,
    fraternities, Ko'yemshi songs and prayers, and alternating personation of the
    Ko'yemshi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Six stone heaps direct runners in their course; the passage says they were
    supposed to have been made by direction of the Gods of War, and that vases containing
    medicine of these gods were believed to be buried beneath the mounds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Race stakes may be held by one of the competitors or by a third party, and
    are heaped in the large plaza; winnings may be carried to the successful party's
    ki'wi"sine or divided among the runners of the winning side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Very young boys participate in foot races and follow elder rules about stakes;
    wagers are described as a regular element of the races.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Zunis commonly race Navahos and others, and that large
    stakes may include beads, silver belts, bridles, and blankets.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sho'liwe is identified as the second game on the list of games of the Gods
    of War and as a major indoor gambling game of the Zunis.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The listed implements of sho'liwe include four split reeds, a bowl-shaped
    basket, a buckskin, a blanket, pith or corncob core pieces, straws for counters,
    and chips usually made from silver buttons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A legend says sho'liwe was played for rain by the Gods of War and the rain
    priesthood while the A'shiwi were at Hiin'lipinkia.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rain priests measured the length of the reeds from the tip of the thumb
    to the tip of the middle finger when both were extended.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The rain priests considered sho'liwe effective for bringing rain and organized
    the Sho'wekwe, or Arrowreed people, to play the game for rain; ten men were named
    as original members.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the gods visited I'tiwanna, ancestral gods gathered in the ceremonial
    chamber of the Kia'kwemosi with rain priests, the Galaxy fraternity, and Sho'wekwe
    members.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Ko'yemshi gave their songs and prayers to the assembled fraternities,
    after which the Ne'wekwe and Sho'wekwe alternated annually in personating the
    Ko'yemshi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Great Fire and Cactus fraternities are described as more recent accessions
    to the personators of the Ko'yemshi.
  category: relationship
  evidence_refs:
  - ev:8
