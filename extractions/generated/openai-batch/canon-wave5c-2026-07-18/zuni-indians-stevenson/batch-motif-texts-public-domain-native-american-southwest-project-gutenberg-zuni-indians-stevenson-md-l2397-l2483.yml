canonical_text:
  quote: ''
  summary: The Corn maidens dance in the plaza and are later said to have disappeared
    because a great fire swept over the earth. After the A'shiwi settle at I'tiwanna,
    the diminutive Gods of War, U'yuyewi and Ma'sai'lema, play with turquoise rabbit
    sticks that wound and restore each other but kill A'shiwi youths. After their
    grandmother whips them, they warn her to flee and then set the world ablaze by
    shooting lightning arrows with rainbow bows into the Sun Father's burning crystal
    shield. The A'shiwi survive because their bodies retain iron hardness from the
    underworlds, while the Corn maidens, many animals, and birds are burned; some
    animals become stone and diminutive, explaining animal fetishes. A sand-hill crane
    is also burned while fleeing toward a mountain and remains visible as stone.
  language: English
  quote_policy: summarized
literal_observations:
