- id: obs:8
  text: U'yuyewi throws his rabbit stick and cuts Ma'sai'lema from throat to abdomen;
    after a war whoop and hand-pressing, Ma'sai'lema rises unharmed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Ma'sai'lema throws his stick and cuts U'yuyewi across the waist; after a war
    whoop and hand-pressing, U'yuyewi rises unharmed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: A'shiwi youths ask to use the rabbit sticks, but the Gods of War say the sticks
    and games are for themselves alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: After further persuasion, the Gods of War throw their rabbit sticks at A'shiwi
    youths, killing many of them immediately.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The mothers of the absent youths search for them, find their dead bodies,
    and become enraged.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The parents of the dead children inform the grandmother, who whips the Gods
    of War.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Gods of War tell their grandmother to hurry away because they intend to
    burn I'tiwanna, and later call for her to go farther because they intend to destroy
    everything in the world about them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The grandmother first goes to Ma'kiiaiakwi, a low mountain south of present
    Zuni, and then to the place occupied by Ma'we'sita, Salt Mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Gods of War shoot lightning arrows with rainbow bows into the heart of
    the burning crystal shield carried by the Sun Father, and the world immediately
    becomes ablaze.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The A'shiwi are not destroyed by the fire because their bodies still retain
    the hardness of iron from the condition in which they came from the underworlds
    to this world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: The Corn maidens are destroyed, and many animals and birds are burned; some
    animals are converted into stone and become diminutive.
  category: sequence
  evidence_refs:
