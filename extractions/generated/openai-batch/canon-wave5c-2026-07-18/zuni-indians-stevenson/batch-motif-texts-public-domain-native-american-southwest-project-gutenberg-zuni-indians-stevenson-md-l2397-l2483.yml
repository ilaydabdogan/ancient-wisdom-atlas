  text: The Corn maidens dance from daylight until night, moving from one side to
    the other and dancing in the plaza to music from choirs and trumpeters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maidens are led to the plaza by Yellow Corn maiden or Blue Corn maiden
    and hold beautiful hla'we in either hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Corn maidens never appear again to the A'shiwi after the described dance
    because they are destroyed by a great fire that sweeps over the earth.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:4
  text: After the A'shiwi settle at I'tiwanna, U'yuyewi and Ma'sai'lema live with
    their grandmother at Shop'hlua yallakwi near I'tiwanna.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: U'yuyewi and Ma'sai'lema are described as diminutive Gods of War, great in
    heroic deeds and also mischievous.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: U'yuyewi stands on the east and Ma'sai'lema stands opposite on the west while
    they play with games held to their breasts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Each brother has a turquoise rabbit stick that village boys observe with envy.
  category: object
  evidence_refs:
