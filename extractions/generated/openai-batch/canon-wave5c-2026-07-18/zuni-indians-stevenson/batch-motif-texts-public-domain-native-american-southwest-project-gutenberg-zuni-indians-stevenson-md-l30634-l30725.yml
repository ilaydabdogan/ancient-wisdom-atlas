canonical_text:
  quote: ''
  summary: The passage gives an origin account for the order of Pa'yatamu within the
    Little Fire fraternity. Gods of War discover Pa'yatamu playing flute at a spring
    near Shun'te'klaya while maidens grind and sing. Pa'yatamu is invited to perform
    for Little Fire ceremonies and Corn Maiden dances, transmits sacred breath through
    his flute, gives a flute and secret instruction to a fraternity member, and thereby
    founds an order whose members receive flutes and te'na'sali mixture. A note describes
    Pa'yatamu's flute as causing flowers to bloom and summoning butterflies, and describes
    the collection, preparation, and use of te'na'sali or sun medicine. The passage
    then begins a Cactus fraternity section with male membership and eligibility conditions.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that present Zunis generally believe the Little Fire fraternity
    originated with the Hopis, but do not credit the order of Pa'yatamu as coming
    from the Hopi; it also states that Zuni and Hopi ideas of the god of music are
    very similar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gods of War hear sweet music east of Zuni, approach the mesa Shun'te'klaya,
    and find that the music comes from a spring at the base of the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the spring, the Gods of War find Pa'yatamu playing his flute while eight
    beautiful maidens grind corn and sing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After returning to the village, the Gods of War report their visit and the
    music; during a Little Fire fraternity ceremonial, a member is sent to request
    Pa'yatamu's flute-playing while maidens grind medicine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pa'yatamu remains four days and nights, accompanying the maidens' songs with
    his flute as they grind; on the fifth morning he passes the flute to the lips
    of those present so they may draw sacred breath from it, then departs for Shun'te'klaya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a Corn Maidens dance, representatives of the Little Fire fraternity again
    invite Pa'yatamu; he arrives the night before, stays in the ceremonial chamber,
    sits near the dancers' pavilion at sunrise, and plays for dances called sho'kowe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before leaving I'tiwanna, Pa'yatamu gives his flute to a fraternity member
    and initiates him into the secret of playing it; Pa'yatamu never again appears
    to the fraternity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The initiated member later initiates nine other members, names the resulting
    order Pa'yatamu, becomes its director, and provides each member a flute modeled
    after the one given by Pa'yatamu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A novice receives a flute and the te'na'sali mixture from his fraternity father;
    the order plays during the Hla'hewe ceremonial, and prayer plumes offered to Pa'yatamu
    are described as longer and attractive.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note states that Pa'yatamu causes flowers to bloom with his flute and calls
    together the butterflies of the world.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The te'na'sali plant is described as bearing blossoms of the colors of the
    six regions and is collected once in four years, with prayer plumes deposited
    before collection.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Directors of the order of Pa'yatamu are said to combine te'na'sali flowers
    with hearts of butterflies and dragonflies, making sun medicine; the mixture is
    ground ceremonially at an altar while flutes are played, using shells and a cloud
    symbol of meal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The powdered te'na'sali is administered in small quantities to male fraternity
    members, while women are prohibited from having it; the passage also says it is
    taken into the mouth and spit on the body for psychic purification and when traveling
    to ensure the right course.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The Cactus fraternity section states that membership is confined to males
    and gives eligibility conditions involving killing an enemy without taking the
    scalp, recovery from wounds, being struck by cactus during an outdoor ceremony
    and caught, and a restriction on joining the Bow priesthood until four scalps
    have been taken.
  category: relationship
  evidence_refs:
  - ev:11
