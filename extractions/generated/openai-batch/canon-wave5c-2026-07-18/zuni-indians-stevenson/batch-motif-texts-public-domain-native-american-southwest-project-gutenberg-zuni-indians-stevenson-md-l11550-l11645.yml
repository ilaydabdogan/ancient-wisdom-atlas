canonical_text:
  quote: ''
  summary: 'Ethnographic description of a Zuni crop-thanksgiving festival sequence:
    Bow priests call and lead warriors in song, drumming, weapon dances, fire making,
    the adornment and participation of girls, procession to the plaza, Ant fraternity
    bear impersonation, lightning-marked A''pi''lashiwanni dances, and a Navaho-personating
    party.'
  language: English, with Zuni and Navaho terms transcribed in the passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother Bow priest leaves the chamber and calls through the streets
    for warriors to come to their post of duty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After seven members arrive, the younger brother Bow priest starts a song with
    drum accompaniment, and two warriors dance while each holds a war club.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother Bow priest sits near the fireplace, keeps time with the
    song and drum, holds a war club and pistol, and later beats time by hand while
    smoking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two girls are led into the chamber by men appointed by the scalp custodian
    and his alternate; the A'wan Si'ta brings live coals and makes a fire; the girls
    are dressed and adorned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the fire burns brightly, the warriors' songs grow louder and appeal to
    the Gods of War for enemies' lives, rain, and bountiful crops.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dancers leave the house and form two lines; girls or virgins hold arrows,
    the drummer walks in front, and young men and boys join, including boys carrying
    a stuffed horse leg, a stick and drumstick, and a doll.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The procession enters the large plaza with a war whoop, dances before many
    spectators, disperses after about an hour, and the elder brother Bow priest calls
    people to gather later to be happy and thankful.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The tSiin'iakiakwe, identified as the Ant fraternity, sing in the ceremonial
    chamber with rattle and drum; a bowl of medicine water is present, and a man and
    woman of the fraternity begin dancing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The male Ant fraternity dancer represents a bear, growls, jumps, carries eagle-wing
    plumes, wears an eagle feather tied to his forelock, and grabs at choir members'
    legs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The A'pi'lashiwanni enter in single file, their bodies marked in white kaolin
    zigzags that the passage identifies as lightning, and they carry bows, arrows,
    and war clubs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nai'uchi, identified as the elder brother Bow priest, performs animal-like
    actions, holds a live coal in his mouth, and runs an arrow down his throat while
    dancing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A party personating Navahos performs songs in the Navaho tongue; the warriors'
    dance alternates between an ellipse and a promiscuous group several times.
  category: sequence
  evidence_refs:
  - ev:7
