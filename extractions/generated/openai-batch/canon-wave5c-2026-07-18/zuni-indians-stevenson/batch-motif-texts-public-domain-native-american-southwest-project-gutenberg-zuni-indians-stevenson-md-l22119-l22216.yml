canonical_text:
  quote: ''
  summary: The passage recounts an accused youth producing or identifying prayer plumes
    and medicines linked to witchcraft. He claims one plume can offend rain-makers
    if inverted and can convert a person into animal form if worn over the heart.
    Under public pressure from Na'iuchi and the warriors, he confesses inherited witchcraft
    power and then declares that, after visiting his mother's camp and speaking with
    her, his power is gone forever. The objects are later given to the writer as proof,
    and the narrator comments on Zuni witchcraft accusations and punishment.
