canonical_text:
  quote: ''
  summary: The passage reports elder and younger brothers/Divine Ones sitting together
    in successive worlds to deliberate. In the dark interior, their fathers are nearby,
    their children are unhappy, and they seek light above. Notes explain that trees
    of the four regions served as means of ascent from lower worlds, and that the
    wing/sunbeam world showed the first glimpse of sunlight through an opening in
    the earth. The elder brother requests rain-priest fathers of the North, West,
    South, and East; after several requests, an unspecified masculine subject hastens
    with precious rain-and-crop fetishes held at his breast.
  language: English translation with Zuni transcription/terms
  quote_policy: summarized
