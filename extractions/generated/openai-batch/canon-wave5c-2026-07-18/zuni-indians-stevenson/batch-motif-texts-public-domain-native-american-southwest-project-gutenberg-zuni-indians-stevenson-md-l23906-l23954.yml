canonical_text:
  quote: ''
  summary: 'The passage describes ritual treatment of hunted game, especially a deer
    lying in state: a medicine bag and fetish are placed beside the animal, the fetish
    is fed with blood, the animal is ornamented and covered, songs and prayer meal
    are offered, the body is flayed and processed, portions may be consumed or used
    for masks, and a portion of all game is offered to the Beast Gods. It also recounts
    a warrior throwing live coals toward six regions to draw specific game animals
    near.'
  language: English
  quote_policy: summarized
