  basis: The passage is explicitly an initiation ceremonial; novices appear for the
    first time, are brought by fraternity fathers, decorated with yucca ribbons and
    eagle plumes, seated in a prescribed arrangement, and given a four-day restriction
    on animal food and grease.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage describes only selected ceremonies of the fourth night rather
    than the full initiation sequence.
