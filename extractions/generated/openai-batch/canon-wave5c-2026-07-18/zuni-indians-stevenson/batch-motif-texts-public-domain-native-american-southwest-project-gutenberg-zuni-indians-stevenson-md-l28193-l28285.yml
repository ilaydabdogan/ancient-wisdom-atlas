  taxonomy_refs:
  - sacred_exchange
  basis: Each fraternity child carries a large buckskin identified as payment to the
    fraternity father for initiation into the order.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The text states the payment plainly, but does not further explain its
    social or symbolic meaning.
