canonical_text:
  quote: CEREMONIAL OF INITIATION INTO O NAYA NAKIA
  summary: The passage describes part of an initiation ceremonial for O'nava'nakia,
    including preparation of prayer plumes, altar and fetishes, body decoration, seating
    of members and novices, buckskin payment to fraternity fathers, tobacco smoke
    over the altar, preparation of medicine water through prayers to six directional
    beings, placement and immersion of fetishes, and sprinkling of meal.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Members prepare prayer plumes in the ceremonial chamber on the first morning,
    and before sunset a tablet altar is erected with fetishes placed about it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fraternity has stone animal fetishes, including a bison image and a bear
    fetish, and also a rare human female figure.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fourth night, men and women have feet, legs, hands, and arms painted
    white; men also have white stripes or stars on the rest of the body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Participants wear micaceous hematite marks on the face, a red-colored fluffy
    eagle plume tied to the forelock, a yucca-ribbon wreath, and necklaces; men wear
    a bow guard on the left wrist.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women sit first on the north ledge and later gather on the south ledge east
    of the men; the passage states that the women do not use the rattle.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each fraternity father leads one or more fraternity children to the ceremonial
    chamber, and each child carries a large buckskin as payment to the fraternity
    father for initiation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Novices are decorated by their fraternity fathers with yucca ribbons at wrists
    and forehead and a fluffy eagle plume on the left side of the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The eagle plume tied to each novice is not to be removed until four days after
    the ceremonial; during that time animal food and grease cannot be eaten.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After decoration, novices sit in line on the north ledge, with the wife of
    the fraternity father on the left and the elder sister of the fraternity father
    on the right.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The a'kwamosi sits north of the altar, the deputy director south of it, the
    warrior before it beyond a mound of food for the gods, and the flutist behind
    it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Two corn-husk rolls containing native tobacco and prayer plumes are opened
    by the a'kwamosi, who makes cigarettes from the tobacco and husks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The a'kwamosi, deputy, and flutist smoke cigarettes and blow smoke over the
    altar and mi'wachi from the front and back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A woman brings a vase of water, and the a'kwamosi raises and lowers an empty
    medicine bowl six times while beginning a prayer song.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Six gourdfuls of water are used with prayers to the Cougar of the North, Bear
    of the West, Badger of the South, White Wolf of the East, A'chiyala'topa of the
    Zenith, and Shrew of the Nadir.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Six fetishes are taken from a leather pouch; each is raised six times and
    deposited at its appropriate compass point, with the Zenith and Nadir fetishes
    laid by the fetish of the East.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The a'kwamosi raises and lowers each fetish six times over the bowl and drops
    it into the bowl; afterward six pinches of meal are sprinkled into the bowl, each
    raised and lowered six times.
  category: action
  evidence_refs:
  - ev:12
