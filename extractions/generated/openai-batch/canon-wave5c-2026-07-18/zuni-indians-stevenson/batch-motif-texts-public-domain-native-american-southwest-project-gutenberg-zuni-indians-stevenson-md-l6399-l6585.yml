canonical_text:
  quote: ''
  summary: 'The passage describes ritual handling of the idol of Ahayuta, the elder
    God of War: corn, plumes, a feather bow and arrow, food, and other paraphernalia
    are bundled with the idol, carried through the village, and installed at a shrine
    in place of the previous year''s idol. A corresponding younger God of War idol
    is carried to another shrine and is distinguished by a lightning-like zigzag stick.
    The passage also describes deposits of prayer plumes and offerings by priests,
    fraternity officers, and households at shrines and fields, including a sun shrine
    at Ma''sakia and household field offerings planted after head washing with yucca
    suds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother Bow priest removes a corn-grain die from a game cup and
    gives it to the associate warrior, who wraps it in a corn husk while the cups
    are tied together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother Bow priest prays before the idol while holding plumes near
    its base, then places a feather bow and arrow, the idol with adornments, a rope
    with te'likinawe, and food into a deep basket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder brother Bow priest leaves the house carrying the basket and whirling
    a rhombus; the associate follows with remaining paraphernalia and also whirls
    a rhombus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the passage through the village, people stop the carriers to pray before
    the idol and sprinkle meal on it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the shrine on U'hana ySl'liinne, the previous year's idol is removed and
    the new idol is substituted with its paraphernalia.
  category: sequence
  evidence_refs:
  - ev:5
