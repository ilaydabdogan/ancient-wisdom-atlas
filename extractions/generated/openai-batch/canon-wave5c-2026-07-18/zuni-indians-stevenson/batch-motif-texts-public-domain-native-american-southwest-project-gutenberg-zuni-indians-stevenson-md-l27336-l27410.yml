canonical_text:
  quote: ''
  summary: A novice in a Great Fire fraternity ceremony fails to swallow a sword,
    so his fraternity father does it. Swords are placed near the altar, ritual medicines
    are distributed, and the novice undergoes a fire-eating rite with lit juniper
    splinters. On the second day, after songs for snow to the six regions, members
    collect and consecrate two young trees, gather buds for medicine, and describe
    the buds' use during pregnancy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The novice fails repeatedly to pass the sword down his throat, and his fraternity
    father swallows it instead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After praying before the altar, participants hand their swords to the Hlem'mosona,
    who places them on buckskin near the altar with the sword tips pointing west and
    folds the buckskin over the blades.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hlem'mosona gives blossoms and bits of yarrow root to members of the Sword
    order and to the novice; the medicine is chewed to protect the mouth when fire
    is eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman conducts the novice to the middle of the floor, turns him to face
    east, and moves his shoulders while dancers pass twice around the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hlem'mosona lights a bundle of juniper splinters, puts them into the novice's
    mouth, and after the fire is out draws them over the novice's shoulders, head,
    and mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fire-splinter ceremony is repeated four times by each member of the order,
    using a fresh bundle of splinters each time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the fire ceremony, the novice and his fraternity father pass once around
    the altar, all sprinkle the altar with meal and pray, and the warrior of the Fire
    division carries the partly burned splinters east of town to Ku'shilowa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the second day, after six songs are sung to the six regions for snow, two
    members of the Fire order go to collect two young trees, accompanied by rhombus-whirling
    and preceded by a man sprinkling meal north of the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The selected trees are about three feet high, one pinon and one another pine;
    three marks are made near the base on the east side of each tree to denote eyes
    and mouth.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The trees are cut with a stone knife, carried in the left arm to the ceremonial
    chamber, received there, and waved to the six regions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Hlem'mosona puffs native tobacco smoke in a reed over the trees and attaches
    a single white fluffy eagle plume to each tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Buds of spruce and pinon are collected separately; some are placed in medicine
    water, and the rest are distributed to the fraternity.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Women are described as especially wanting the bud medicine, which is eaten
    during pregnancy; pine buds are eaten if a boy is desired, and pinon buds if a
    girl is desired.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A member of the Great Fire fraternity says ordinary pine-branch buds are ineffective
    if the branch was not cut while the old songs of the Ma'ke Hlan'nakwe were sung.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage notes that, unlike in the Hle'wekwe fraternity, it is exceptional
    for a Great Fire fraternity novice to succeed on the first night in swallowing
    the sword.
  category: relationship
  evidence_refs:
  - ev:12
