canonical_text:
  quote: ''
  summary: 'The passage describes Zuni Great Fire fraternity and Sword division ceremonial
    actions: a sword-order performer purifies with medicine water and eagle plumes,
    dances, swallows a sword, and participates in healing; then a first-night initiation
    sequence is described in which a novice is brought to the ceremonial chamber,
    meal is offered and distributed, swords are prepared, dancers circle the altar,
    and members swallow swords and apply them ritually to the novice, who attempts
    to swallow the sword under guidance of his fraternity father.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man of the Pi'sinni'hle or Sword order appears wearing a war pouch,
    a head wand, and an eagle plume tied to the forelock.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man dips eagle-wing plume ends into medicine water, places them
    to his lips, and rubs them over his nude body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man takes a sword from behind the altar, dances before the altar,
    faces east, drops to one knee, and swallows the sword; the rite is repeated three
    times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A flutist sitting behind the altar puffs smoke on each side of it at intervals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Healing of the sick begins soon after the sword swallowing, and the sword
    swallower and two girls conclude the dance at midnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the first night of the Sword division ceremonial, a tablet altar is erected
    in the ceremonial chamber and members prepare prayer plumes among medicine boxes
    and plumes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The novice's father conducts the novice to a seat on the north side of the
    ceremonial chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eight officers of Fire division orders sit behind the altar with bundles of
    juniper splinters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a song with rattle and drum, each officer takes yarrow root and blossom
    into his mouth, expectorates six times upon the splinters, and deposits the bundle
    behind the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The novice gives a husk of meal to a member, who passes it to the chosen fraternity
    father with the message that the child wishes to join the order.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chosen fraternity father receives the meal, states a wish for the good
    heart and health of his son, and distributes meal to each person present.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The 'Hlem'mosona spreads a blanket, removes sword blades wrapped in old buckskin
    from a box, and places them in the center of the blanket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Members select marked swords, attach feathered handles, and then sprinkle
