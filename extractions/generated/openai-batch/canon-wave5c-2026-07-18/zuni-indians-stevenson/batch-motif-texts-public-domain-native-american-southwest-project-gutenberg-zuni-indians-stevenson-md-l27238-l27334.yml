    to sprinkle the altar.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The dancers pass in file around the altar, led by a female member carrying
    her mi'li and meal basket, followed by the 'Hlem'mosona, other officers, and the
    order at large.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A woman leads the novice to the middle of the room, faces him east, and stands
    behind him with her hands on his shoulders.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The female leader places her mi'li to the novice's right shoulder, head, left
