canonical_text:
  quote: ''
  summary: The passage lists Shi'wanni offices and associates by direction, number,
    clan, gender, and ritual function. Notes describe succession after deaths, deliberation
    about purity of heart, kin replacement of a female associate, N'ai'uchi's preparation
    of a grandchild for future office, a deputy to the Sun Father, and the ninth Shi'wanni's
    possession of an ot'tone connected to a Zuni legend about an aged Black Corn clan
    Shi'wanni and his family.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shi'wanni offices are listed for South, East, Zenith, and Nadir, with clan
    affiliation and associates named for several of them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Numbered Shi'wanni from seventh through sixteenth are listed with clan affiliations;
    many entries include first through fourth associates, and several fourth associates
    are specified as female.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
- id: obs:3
  text: The Shi'wanni of the Nadir is associated with the Eagle clan and has associates
    including a son of the Shi'wanni, a younger brother of the Shi'wanni, another
    Eagle clan associate, and a female Eagle clan associate.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tenth Shi'wanni is of the Chaparral Cock clan and is director of the Shu'maakwe
    fraternity; his associates include a deputy to the director, a maker of medicine
    water, a warrior to the fraternity, and a female great mother of the fraternity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A vacancy caused by the death of Lai'wa'silun'kla, Shi'wanni of the West,
    was not immediately filled because the A'shiwanni debated whether the first associate
    had a sufficiently pure heart; the son of the former Shi'wanni was later advanced
    to his father's position.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the death of the female associate, her place was filled by her mother's
    sister's daughter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: N'ai'uchi declared that no other member of the woman's immediate family should
    succeed her, citing her brother as a sorcerer and suspicions about her father,
    who held the office of scalp custodian in the Bow priesthood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A figure identified as Pe'kwlu, deputy to the Sun Father, is said to have
    no associate.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nai'uchi, as Shi'wanni of the Nadir, is preparing his grandchild, the daughter
    of his first associate, to fill the female-associate position after the present
    incumbent dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ninth Shi'wanni possesses the ot'tone, which is said to have been secured
    according to Zuni legend through an aged Shi'wanni of the Black Corn clan found
    with his wife and two grandchildren at He'shotiyalla, west of Itiwanna, and later
    allied with the A'shiwi.
  category: object
  evidence_refs:
  - ev:6
