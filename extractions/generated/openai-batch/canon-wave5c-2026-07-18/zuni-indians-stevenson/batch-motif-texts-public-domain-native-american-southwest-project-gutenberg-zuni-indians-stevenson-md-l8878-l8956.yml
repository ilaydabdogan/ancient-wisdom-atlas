canonical_text:
  quote: ''
  summary: The passage describes Kor'kokshi ceremonial dance cycles through four plazas,
    returns to ritual houses for rest, water, smoke, feasts, and head-washing, and
    identifies the close of summer solstice ceremonies as the beginning of Kor'kokshi
    dances for rain and crop growth.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cat-tail stems are afterward used by the A'uhiwanni for tc'likiimwe.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dancing, the dancers return to the ki'wi'sine, lay aside their masks,
    smoke, and rest briefly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dancing in the four plazas is repeated four times before noon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the fourth dance in the Si'aa' te'wita, the Ko'mosona leads the file of
    dancers and tells the Great Father Ko'yemshi that it is time to eat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After this dance, the Kor'kokshi are followed for the first time by the Ko'yemshi,
    who had previously waited in the Si'aa' te'wita.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Ko'mosona leads the Kor'kokshi to Mu'he'wa ki'wi'sine, while the Ko'yemshi
    follow the Ko'pekwin to his house; feasts are spread in both houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the day there is no dancing in the Ko'pekwin's house, and only the
    Ko'pekwin and the Ko'yemshi leave the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who are to personate the gods at the Sha'lako festival receive instructions
    in their duties in the He'iwa ki'wi'sine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Ko'mosona administers spring water from a shell after the water has been
    moved from a gourd jug into a medicine bowl.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the water rite, the Ko'mosona tells each recipient to drink; the recipient
    addresses him as father, and he replies as younger one, later addressing the group
    as his children.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Women of the Deer clan bring water vases to the thirsty men; women of the
    Badger clan carry water to the Ko'pekwin's house; women of both clans serve a
    feast.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After smoking and resting, the four-plaza dance cycle is repeated four times
    again, followed by another meal announcement, a second feast, smoke, and head-washing
    in yucca suds by women of the Deer and Badger clans.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage states that the summer solstice ceremonies are over and that this
    is the beginning of Kor'kokshi dances for rains to fructify the earth and make
    crops grow.
  category: other
  evidence_refs:
  - ev:12
