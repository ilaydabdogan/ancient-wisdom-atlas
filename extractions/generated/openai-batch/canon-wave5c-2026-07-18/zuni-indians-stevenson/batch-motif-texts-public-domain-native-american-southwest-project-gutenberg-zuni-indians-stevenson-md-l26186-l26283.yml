canonical_text:
  quote: ''
  summary: 'The passage describes procedures for a ''Hle''wekwe ceremonial sequence:
    selecting a director to collect spruce trees, offering meal and feathers, choosing
    a fraternity father for a novice, making the trees into sword-like ritual objects,
    applying root medicine, attempting and performing sword swallowing, carrying the
    trees to dances and later to a mesa for prayers for snow, rain, and health, and
    listing the Great Fire fraternity and its orders.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hlem'mosona may request a man to join the order; if he consents, the
    'Hlem'mosona selects a director and gives him meal wrapped later in a corn husk
    for the tree-collecting task.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A director and six fraternity men collect spruce trees south of the village;
    the director attaches a single fluffy eagle plume to a tall tree, speaks a request
    and payment formula, and the men sprinkle meal at the base before choosing and
    cutting trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The selected trees are supposed to be cut with an ancient stone ax, one tree
    for each order member and one for the novice, and are carried crosswise on the
    men's backs by forehead ropes while traveling on foot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: While the tree-collectors are absent, the 'Hlem'mosona asks the novice whom
    he wants as a fraternity father; after the novice says he does not know, the 'Hlem'mosona
    chooses one, gives him a meal bundle, and prays while clasping his hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fraternity father distributes a pinch of the meal to each woman of his
    clan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At sunrise the tree butt is worked into a sword; the director cuts the first
    chip with the stone ax, and each maker fashions the sword to be used in the dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each completed tree receives a feather la'showanne made of a turkey feather,
    an eagle plume, and feathers from birds of the six regions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tree director gives root medicine to each participant; they chew it and
    draw their swords through the mouth four times to coat them with the medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Most trees are hung to the rafters; the fraternity father makes a tree for
    the novice and one for himself, and the novice's tree is laid in the middle of
    the floor with its sword end pointing west.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: At sunset the fraternity, including women on the north side of the room, stands
    and sings; the singing includes songs for snows and rains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After receiving root medicine, the fraternity father leads the novice near
    the ladder; the novice attempts to swallow the sword but fails, and the fraternity
    father then swallows it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the fifth day, the trees are carried to the plaza and the sword ends are
    swallowed during dances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the dances and an early morning ceremony, the trees are carried by six
    different men to a mesa north of the village, laid with sword ends pointing west,
    sprinkled with meal, and accompanied by prayers for snows, rains, and general
    health.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: On the fifth morning, when the novice's head is bathed, the fraternity father
    gives the novice a small gift such as calico.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage identifies the Ma''ke 'hlan'nakwe, or Great Fire fraternity, as
    having three orders and lists several divisions of the Great Fire order, including
    Sword and Spruce.
  category: relationship
  evidence_refs:
  - ev:6
