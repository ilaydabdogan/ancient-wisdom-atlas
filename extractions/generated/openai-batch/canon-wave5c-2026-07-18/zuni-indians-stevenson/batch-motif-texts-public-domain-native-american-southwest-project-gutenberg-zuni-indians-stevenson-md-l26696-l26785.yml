canonical_text:
  quote: ''
  summary: The passage describes a fraternity altar ceremony in which novices dance,
    healers and Beast-God mediums treat patients by sucking out disease or evil and
    depositing it in a bowl, and the Great Mother, fraternity fathers, attendants,
    a warrior, and other theurgists perform ash, plume, sand-painting, heart-purification,
    prayer, and fourfold hand-waving rites around the altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine bowl is used to sprinkle those present, after which three novices
    dance in line before their seats, facing east and then west.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the novices is a very young child described as an energetic dancer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two men leave the choir, move in a skipping and hopping manner, gesture beast-like
    before the altar, and are described as becoming abiding places of the Beast Gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Theurgists treat invalids by sucking exposed body parts, ejecting supposed
    removed material into their hands, and depositing it in a large bowl watched by
    an aged woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After extracting disease, each theurgist coughs, receives water in a gourd,
    gargles, and expectorates into the bowl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Infants are among those considered ill, and mothers dance babies on their
    laps in time with the choir.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the healing ceases, the Great Mother gives ashes to officers and choir
    members; she and two fraternity fathers hold eagle-wing plumes in the right hand
    and ashes in the left while approaching the novices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The novices catch the tips of their fraternity parents' plumes; the youngest
    novice is raised and fastened to a fraternity father's back with cotton cloth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women attendants stand behind the novices, placing hands on their shoulders,
    while the group advances, turns, and the fraternity parents seat the novices before
    the altar facing east.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each fraternity parent places the novice's head back against the parent's
    bosom and covers the novice's eyes with the hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A warrior wearing a war pouch and plume wand dances before the novices, takes
    a mound from the sand painting, and applies material from the dry painting to
    each novice's heart.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The warrior returns to the novices, growling and gesturing, sucks at the heart
    where material was placed, waves the supposed extracted material, and deposits
    it in a bowl.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that the heart-sucking rite is for purification of the
    heart, and that each theurgist of the fraternity draws evil from the novices'
    hearts.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the conclusion, each novice is led to the altar to pray and then to a seat
    on the north side of the room; the warrior carries out the bowl of supposed extracted
    material.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A sprinkling of ashes for purification is repeated, and participants holding
    meal wave their hands four times around their heads from left to right when dancers
    strike ashes from their plumes.
  category: sequence
  evidence_refs:
  - ev:11
