canonical_text:
  quote: ''
  summary: A description of a Zuni gambling den, its secrecy and social disapproval,
    the writer's 1896 visit, ritual prayers to the Gods of War before play, and notes
    on the decline of the gambling house and differing explanations of sho'liwe, including
    a Zuni belief that Divine Ones and rain priests played it for rain soon after
    reaching this world.
  language: English
  quote_policy: summarized
