  text: The room is described as dimly lit by a small selenite window near the ceiling,
    with the hatchway covered by a straw mat and watched to prevent intruders.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The writer first visited the den in 1896 and found eight or ten men present
    who were annoyed by her unannounced arrival but relieved when told she came to
    observe the game rather than denounce them.
  category: sequence
  evidence_refs:
  - ev:3
