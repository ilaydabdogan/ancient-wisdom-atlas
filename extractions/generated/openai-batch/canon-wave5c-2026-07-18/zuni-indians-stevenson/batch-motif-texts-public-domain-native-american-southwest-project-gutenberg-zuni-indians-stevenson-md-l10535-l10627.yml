canonical_text:
  quote: ''
  summary: The passage describes the order of participants and ritual objects in a
    Thla'hewe rain ceremony procession, their movement into the ham'pone, and the
    placement of seed baskets, fire coals, vessels, meal, and a cloud-symbol arrangement
    by named ceremonial participants.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mi'laiilapo'na of the 'Hla'hewe and Sho'ko'we walk side by side, with
    each party led by its A'wan mosono"kia.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each mi'laiilapo'na carries a head basket containing corn and other seeds,
    two 'hla'we, two 'hle'we, and te'likinawe, covered with a white embroidered kilt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four A'shiwanni walk in file on one side of the mi'laiilapo'na, while a shi'wanni
    and the Shi'wano"kia, who carries a basket of seeds, are on the other side.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The younger brother Bow priest follows, and a Badger clan man walks near him
    carrying a pottery bowl hidden by a red blanket and containing coals from the
    fire altar in the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 'Hla'hewe and Sho'ko'we choirs and their drummers follow in ordered groups;
    the drummers carry vase-shaped pottery drums and hooped drumsticks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The flutists come next, led by their mo'sona and deputy, holding flutes to
    their lips but not playing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The procession passes under the eastern covered way to the ham'pone in the
    Si'aa' te'wita and proceeds to assigned places.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The elder brother Bow priest deposits his mi'li at the northwest corner of
    a meal-painted cloud symbol and lays a folded kilt on the symbol.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pe'kwin places his meal basket by the cloud symbol, receives jugs and
    rain vases from the 'kia'punakwe of both sides, and deposits them on the south
    and north sides of the cloud symbol.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The mi'laiilapo'na take positions facing east; A'shiwanni stand on the west
    side; choirs group at southeast and northeast corners; flutists stand outside
    the ham'pone.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The flutes are described as about 27 inches long.
  category: attribute
  evidence_refs:
  - ev:7
