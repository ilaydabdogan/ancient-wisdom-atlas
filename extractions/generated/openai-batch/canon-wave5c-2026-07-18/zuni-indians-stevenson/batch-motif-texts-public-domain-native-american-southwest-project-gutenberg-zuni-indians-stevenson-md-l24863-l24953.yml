- id: obs:1
  text: Before the Hle'wekwe drama is enacted, the Mu'waiye dance must be rehearsed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mu'waiye are personated by two maidens and a youth, who perform as their
    prototypes were supposed to have done when the Hle'wekwe were received after a
    long separation from the A'shiwi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kia'kwemosi selects which ki'wi'siwe will furnish the choir for the Mu'waiye
    dance, and rehearsals occupy six nights before the drama.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Participants enter and sit in arranged positions in a large room: the Mu''waiye
    on the north ledge, the choir on the south side, circle-dance girls on the south
    ledge west of the choir, and youths at the west end.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two white painted boxes decorated with figures are present toward the west
    end of the room before the dance.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
