  evidence_refs:
  - ev:5
- id: obs:7
  text: The three Mu'waiye have their eyes obscured by their bangs during the dance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dance begins with pottery drum and song, without a rattle, and includes
    lowering movements, arm extensions, violent downward hand motions, heel-raising,
    stamping, and later side-to-side travel.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: At the close of the dance, the smaller box is placed west of the larger one,
