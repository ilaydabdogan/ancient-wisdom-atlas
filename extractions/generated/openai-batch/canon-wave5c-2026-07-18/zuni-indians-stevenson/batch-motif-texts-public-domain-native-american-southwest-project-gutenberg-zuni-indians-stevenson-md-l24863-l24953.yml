canonical_text:
  quote: ''
  summary: 'The passage describes rehearsal and performance arrangements for the Mu''waiye
    dance before the drama of the Hle''wekwe: three personators dance with choir accompaniment,
    specific seating, costumes, corn-husk objects, drum music, and repeated movements.
    It also describes decorated boxes, notched sticks, deer-leg bones, preparations
    for Hle''wekwe arrival, and a woman leading fraternity members while sprinkling
    sacred meal. A footnote comments on initiation and sword-swallowing practice.'
  language: English
  quote_policy: summarized
