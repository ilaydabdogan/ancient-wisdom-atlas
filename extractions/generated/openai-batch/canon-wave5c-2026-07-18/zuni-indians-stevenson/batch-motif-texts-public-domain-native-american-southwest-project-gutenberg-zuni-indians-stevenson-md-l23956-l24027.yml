canonical_text:
  quote: ''
  summary: The passage describes a Zuni rabbit hunt held by order of the governor
    after the harvest as a religious thanksgiving. It includes preparations, purification
    by yucca hair washing, rabbits hung for hunters' luck, mounted hunters with rabbit
    sticks, prayers led by Ko'yemshi ritual officers at a knoll, thanksgiving and
    petitions for crops, health, rain, and ancestral blessing, and bread offerings
    cast into a cedar-tree fire to convey spiritual essence to the dead. A prefatory
    note states that after a rabbit's flesh is eaten its spiritual life returns to
    its spirit home and will return again to the people.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The recorded rabbit hunt is described as ordered by the governor and as religious
    in character.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunt occurs in the farming districts of Pescado, Nutria, and Ojo Caliente
    as thanksgiving for abundant crops immediately after corn and wheat are gathered.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men preparing for the ceremony had recently washed their hair in yucca suds,
    and the passage states that no one can take part in any ceremony without first
    washing the hair in yucca.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women were preparing a feast after the hunt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A jack rabbit and a cottontail were suspended from house beams for good luck
    to hunters by order of the Ko'yemshi and were not to be removed until after the
    hunt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the command, the village men mounted horses with rabbit sticks in hand;
    many carried two sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A young bride accompanied her husband on horseback after persuasion, though
    no Zuni women were otherwise to accompany the party.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a knoll, the Great Father Ko'yemshi, his deputy, and a man of the San'iaklakwe
    fraternity sat at the base of a piñon tree; the Great Father and deputy faced
    opposite directions and clasped hands.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hunters dismounted and sat around the three ritual figures while the Great
    Father whispered a long prayer; the deputy and fraternity man repeated an amen
    response at the close of each stanza.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the prayer, the Great Father brought the clasped hands to the deputy's
    mouth and then to his own mouth and inhaled a breath from him; the deputy then
    repeated the prayer while clasping the Great Father's hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The prayers are described as thanksgiving for crops and good health, with
    petitions that the ancients bless future crops, the people live, and they sleep
    to awake as little children in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ceremony at the knoll closed with a smoke in which all joined.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The two Ko'yemshi and the San'iaklakwe man walked to a previously prepared
    fire burning in a low, symmetrical cedar tree because, as stated, when the world
    was new the A'shiwi had no horses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Near the fire, the three men offered prayers to the dead and asked their ancestors
    to intercede with the Council of the Gods so that the rain-makers would water
    the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Bread was thrown into the flames with a call for the fire to eat and convey
    the spiritual essence of the food to the dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Hunters received bits of bread from the Great Father and threw them into the
    fire with prayers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: A prefatory note says that after the rabbit's flesh is eaten, its spiritual
    life returns to the spirit home, reports that it gave its flesh as food, and says
    it will return again to the people.
  category: speech
  evidence_refs:
  - ev:1
