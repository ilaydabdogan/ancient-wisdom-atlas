canonical_text:
  quote: ''
  summary: 'The passage describes a NK''WKKWK ritual sequence: distinctive plume-and-grass
    offerings are prepared for an initiation; a meal-and-black-pigment floor design
    is made near the altar; prayer plumes are smoked, sprinkled with consecrated medicine
    water, wrapped, and placed by the altar; the choir performs ritual, joking interludes,
    and fish-related song terms; all-night healing performances culminate at sunrise
    when Kok''ko ''hlan''na administers medicine to novices.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men formed groups and prepared plume offerings described as different from
    those of other fraternities because spears of grass were combined with the plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For an initiation, a parallelogram of white meal was made near the altar,
    enclosed with black, crossed by a transverse black line, and marked with black
    circle segments stated to be symbolic of rain clouds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Two black figures were delineated on the ground color: one representing Bi^si''si
    and the other representing his younger brother or fellow; horizontal black lines
    crossed the figures from head to feet.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the prayer plumes were completed, each man lit a reed filled with native
    tobacco, puffed smoke through the feathers, and repeated the smoking three times
    before the plumes were gathered into a basket tray by the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The choir sat at the southwest end of the room, women sat on the north side,
    the large animal fetish and flutist were behind the altar, and the a'kwamosi sat
    on the north side of the altar.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The a'kwamosi prepared medicine water, sprinkled each plume offering, and
    sprayed water over the plumes with water dipped by a shell; the director then
    wrapped the offerings in corn husks in groups of twos and fours.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: During interludes in the long ritual, joking speech named girls and assigned
    choir members as lovers; the Catholic priest was mimicked and the paternoster
    was repeated before joking at the expense of the church and priest.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
