  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'Healing ceremonies continued through the night, and at sunrise Kok''ko ''hlan''na
    appeared to administer medicine to three novices: a man, a woman, and a six-year-old
    girl.'
  category: sequence
  evidence_refs:
  - ev:9
