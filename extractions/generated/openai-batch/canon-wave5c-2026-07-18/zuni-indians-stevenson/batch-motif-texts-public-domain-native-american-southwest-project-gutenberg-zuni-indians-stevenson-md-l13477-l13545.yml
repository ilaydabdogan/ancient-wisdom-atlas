    the others.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: Shu'laawi'si plants plumes in the excavation under the ladder, ascends to
    the roof, and enters the house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: A note says that in 1896 the Sal'imobiya of the North and West were represented,
