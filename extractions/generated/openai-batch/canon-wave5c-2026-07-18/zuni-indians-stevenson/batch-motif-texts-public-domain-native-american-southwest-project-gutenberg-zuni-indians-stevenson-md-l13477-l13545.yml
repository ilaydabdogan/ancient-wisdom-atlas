canonical_text:
  quote: ''
  summary: The passage describes turquoise-set objects and ceremonial turquoise earrings,
    then gives detailed dress and attributes of several Zuni ceremonial gods or masked
    figures. It describes Sal'imobiya representing Zenith and Nadir, Hle'lashoktipona's
    costume and mask, and a ritual procession to six excavations where offerings are
    deposited or planted, meal is sprinkled and stamped, cries are uttered, and the
    group proceeds to a house.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shell with turquoise settings is described as smoothed, partly restored
    with newer turquoises, cemented with a preparation said to be piñon gum, and secured
    for the United States National Museum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage notes another rare specimen with similar setting, found in Chavez
    Pass, in the form of a toad.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hopi turquoise earrings are described as thin wooden slabs set with turquoise
    and attached by string through a bored hole, while Zuni earrings are described
    as strings of turquoise worn in the ears.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The turquoise earrings are said to be worn only on ceremonial and dance occasions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A described pair carry collections of te'likinawe in each hand, and a si'kon-ya'mune
    tikwane and small deer antlers in the left hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two Sal'imobiya are described as nude except for breechcloths and as representing
    Zenith and Nadir.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sal'imobiya of the Zenith has portions of the body blocked in six colors
    outlined in black, with yellow on the right upper arm and leg and blue on the
    left upper arm and leg.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sal'imobiya of the Nadir has an upper body half described as yellow and
    a lower body half as black, with yellow lower arms, legs, and feet and black upper
    arms and legs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Both Sal'imobiya wear spruce wristlets or anklets, a war pouch, and strings
    of black and white corn, and carry bunches of Yucca baccata in each hand with
    points held backward.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Hle'lashoktipona wears a white embroidered kilt, embroidered sash, woman's
    belt, pendent fox skin, and a mask with wooden serrated side projections.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hle'lashoktipona's mask is described as similar to that of Pau'tiwa and decorated
    with black goat's wool, unspun white wool, spruce, and white popcorn.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The gods proceed to excavations in an order associated with Shu'laawi'si.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sa'yatasha moves back and forth by an excavation in a trotting manner, deposits
    te'likinawe in it, and resumes his step.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hu'tutu plants plumes, and Sa'yatasha and Hu'tutu sprinkle meal over the plumes
    and in the street around the excavation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Two Ya'imihakto stamp the meal sprinkled in the street.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Sa'yatasha and Hu'tutu pass each other, stop, stamp, and cry a repeated 'Hu'
    tu tu' utterance at each of the six excavations where plumes are planted.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Other gods run and tramp around the excavations.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After leaving the sixth excavation, the group proceeds to the house where
