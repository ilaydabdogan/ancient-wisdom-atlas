canonical_text:
  quote: ''
  summary: The passage describes Ko'yemshi and fraternity ceremonies involving prayers,
    baskets, blankets, meal, plumes, gourds, rattles, mi'li, dance performances, ritual
    tricks, masked god-personators dancing through windstorms, an explanation that
    divine anger caused the winds because the Ko'yemshi were personated by a fraternity
    not speaking the old language, and subsequent preparation and placement of te'likinawe
    offerings grouped as kia'etchine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The director of the fraternity and the Great Father Ko'yemshi stand side by
    side before a basket, face east, and pray; afterward Nai'uchi takes the basket
    and the blanket is returned after meal is shaken from it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a second house a gourd is placed concave side upward in a basket; after
    failed attempts by Ko'yemshi to raise it with eagle-wing plumes, a fraternity
    member raises it with the quill ends of his plumes, drawing strong spectator response.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Little Fire fraternity appears in the plaza the following day; two members,
    identified as the director of the Shu'maakwe fraternity and his pe'kwin, have
    eagle plumes passed through the septum of the nose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi follow the fraternity in file, each with a rattle, while a woman
    leads the fraternity carrying the mi'li and a meal basket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nai'uchi makes a small cross of meal on a blanket, places the mi'li on it,
    secures the fetish with stones, and lays a large white-painted gourd rattle beside
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Two men selected from the spectators participate: one holds and taps the
    mi''li with eagle plumes while another shakes the white rattle close to the blanket.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When a fraternity member taps the mi'li with eagle plumes, grains of wheat
    pour from the plumes until about a quart is deposited on the blanket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Personators of the gods from different ki'wi'siwe appear in the plaza for
    five consecutive days in full ceremonial attire, including masks, and continue
    dancing despite wind, dust, and cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that unfavorable windstorms lead the dancers and singers
    to perform more vigorously and fervently in hopes of appeasing the gods' wrath.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: A rain priest explains that the Council of the Gods sends the winds because
    the Ne'wekwe fraternity personates the Ko'yemshi and does not speak the old language;
    he contrasts them with other personators who bring rain and good crops by speaking
    prayers in the old tongue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the day after the described ceremonies, the first body of A'shiwanni prepare
    te'likinawe; the Ko'mosona, Ko'pekwin, and two Ko'pi%tliishiwanni also prepare
    te'likinawe in the North ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The prepared te'likinawe are grouped into kia'etchine; one is carried by the
    Kia'kwemosi to the North ki'wi'sine and placed on a cloud symbol of meal made
    by the pe'kwin.
  category: action
  evidence_refs:
  - ev:5
