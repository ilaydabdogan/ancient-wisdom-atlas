candidate_motifs:
- id: motif:1
  label: Transformation of humans into animal guardians
  taxonomy_refs:
  - shapeshifter
  basis: The Divine Ones convert medicine men into Cougar, Bear, Badger, White Wolf,
    Eagle, Shrew, rattlesnakes, and ants with assigned guardian functions.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The transformation is performed by Divine Ones; the passage does not describe
    voluntary shapeshifting by the transformed beings.
- id: motif:2
  label: Culture-hero-associated followers become sacred guardians
  taxonomy_refs:
  - culture_hero
  basis: The transformed medicine men are associated with Po'shaiytinki / Po'shaiyanki,
    who is named as a culture hero in the passage.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Po'shaiytinki is named but does not act in this passage segment.
- id: motif:3
  label: Murdered woman returns as a ghost
  taxonomy_refs: []
  basis: After being killed and scalped, the woman is heard calling for her husbands
    and is identified by the Gods of War as the ghost woman who has come.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage describes a ghostly return, not a full bodily resurrection.
- id: motif:4
  label: Ritual rule derived from bird feather count
  taxonomy_refs:
  - initiation
  basis: A chaparral cock with ten tail feathers is found behind the altar, and U'yuyewi
    declares the ten-day fast and continency rule still observed after scalp-taking.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The initiation taxonomy link is strongest when read with the subsequent
    statement that the scene is dramatized during Bow priesthood initiation.
- id: motif:5
  label: Scalp-taking procession to center and pole display
  taxonomy_refs: []
  basis: The return party encircles Hal'ona four times while approaching the center,
