canonical_text:
  quote: ''
  summary: The passage describes the creation of Beast Gods from medicine men, the
    journey of U'yuyewi and Ma'sai'lema, their killing and scalping of a woman, their
    reception by ants, the appearance of the slain woman's ghost, the discovery of
    a chaparral cock whose ten tail feathers establish a ten-day fast, the return
    to Hal'ona with the scalp, the disappearance of Kow'wituma and Wats'usi into the
    earth, and the organization of the Bow priesthood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Divine Ones visit Shi'papolima and convert medicine men associated with
    Po'shaiyanki into Beast Gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Animal guardians are assigned to the north, west, south, east, zenith, nadir
    or earth, and other earth roles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: U'yuyewi and Ma'sai'lema begin a journey, see a beautiful woman, question
    her, and U'yuyewi invites her toward his house in the southeast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: U'yuyewi falsely tells the woman that his house is beautiful and brings her
    to a cave in the rocks, where she sleeps between the two brothers.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: U'yuyewi signals Ma'sai'lema, and each strikes the woman on the head with
    a club; she falls dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two take the woman's scalp and visit the houses of the Cougar, Bear, Badger,
    and Wolf, each of whom responds angrily or denounces the murder.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Shi'papolima, the ants receive the Gods of War kindly and seat them in
    a ceremonial chamber with an altar at the west end.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A voice asks for her husbands; the Gods of War identify it as the woman they
    killed, and after she enters they strike her again and throw her away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the second attack on the woman, tracks of a chaparral cock are found,
    and the bird is discovered behind the altar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: U'yuyewi counts ten tail feathers on the bird and declares that after taking
    a scalp a man must observe continency and avoid animal food, grease, and salt
    for ten days.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Close relations are established between the Gods of War and the ants, and
    U'yuyewi and Ma'sai'lema leave at sunset for Hal'ona carrying the Navaho woman's
    scalp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Hal'ona, the returning scalp-takers are met by Divine Ones and others,
    circle the village four times while drawing nearer the center, enter the large
    plaza, hoist the divided scalp on a pole, and spend thirteen days rejoicing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the last evening, a group forms around a pottery drum, a surrounding circle
    is made, seven beings are called by drum strokes, songs are sung, and Kow'wituma
    and Wats'usi disappear into the earth to dwell at the Zuni salt lake crater.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Bow priesthood is organized with U'yuyewi and Ma'sai'lema as first directors,
    and the scene is said to be dramatized when a victor is initiated into the priesthood.
  category: action
  evidence_refs:
  - ev:10
