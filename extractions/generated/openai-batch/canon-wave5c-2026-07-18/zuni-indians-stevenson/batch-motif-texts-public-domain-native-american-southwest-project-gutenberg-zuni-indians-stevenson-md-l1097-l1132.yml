canonical_text:
  quote: ''
  summary: The passage describes a river crossing in which children develop webbed
    hands and feet that the Divine Ones restore; a request that the Divine Ones descend
    into a lake for lost children; the creation of masks for newly created gods; a
    visit to Ko'thluwala'wa where masked gods speak about their mothers and their
    continuing life there; and the A'shiwi continuing their migration toward the Middle
    of the world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Divine Ones call to people who followed the 'Hle'wekwe across mystic waters
    and instruct women not to fear their children if the children pinch and bite while
    being brought safely across the river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children undergo no change except that their toes and fingers become webbed;
    the Divine Ones cut the webs with stone knives and restore the hands and feet
    to normal form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the rest of the people cross the river, the Kia'kwemosi asks the Divine
    Ones to descend into the lake and look after the lost children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A'wan tii'Vliu Ko'yemshi decides that the newly created gods should not appear
    outside the dance house without masks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A'wan tii'Vliu Ko'yemshi creates masks by touching his finger to his mouth,
    rubbing spittle on a small spot of the dance-house floor, and producing a mask
    each time the finger touches the floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Divine Ones enter Ko'thluwala'wa, they find the newly created gods
    wearing masks, which are then removed and placed at the gods' sides.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Divine Ones address the gods as children, and the gods ask to be told
    about their mothers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gods are told that their mothers refuse to be comforted; the gods reply
    that their mothers should not grieve because the gods are not dead, live and sing
    and dance in that beautiful place, and work for their mothers and all their people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gods say that when their mothers fall asleep, the mothers will wake in
    that place and return to the undermost world from which they came.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The gods ask the Divine Ones to look at and examine the masks; the Divine
    Ones look until they know the masks with their hearts, thank the gods as children,
    ascend, and report to the Kia'kwemosi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The A'shiwi remain for a time near Ko'thluwala'wa during a period described
    as one of personal communication with their gods, then continue traveling, building
    and deserting villages while moving toward the Middle of the world.
  category: sequence
  evidence_refs:
  - ev:7
