canonical_text:
  quote: ''
  summary: The passage describes second-day ceremonies in which A'shiwanni pray and
    smoke around tobacco, perform hand-clasping prayers, share cigarettes, offer food
    to ancestors through fire, exchange a breath gesture with visitors, assemble ritual
    objects including medicine water, baskets, arrow points, feather wands, pigments,
    and hawk down, sing a war-history song, and prepare Bow priests for an outdoor
    ceremony.
  language: English with Zuni ritual terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first body of A'shiwanni meets in the Shi'wano"kia's house around a small
    bowl of native tobacco, where they pray and smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two reeds are filled with tobacco and placed by the bowl with corn husks for
    cigarettes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kia'kwemosi holds two cornhusk cigarettes, clasps the scalp custodian's
    hands, and prays for the Sun Father to give good things and for deceased predecessors
    to send rain for bountiful crops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the prayer, the hands of the Kia'kwemosi and scalp custodian are reversed
    and the latter repeats a prayer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two reed cigarettes are lit and passed around, with each shiwanni taking
    a whiff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a whispered prayer and meal, each participant gathers bits of food on
    bread, which is thrown into the fire with prayer to the ancestors and a call for
    them to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The scalp custodian and the A'kwamosi of the Ant fraternity clasp hands and
    pray; their hands are then reversed and the A'kwamosi repeats a prayer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The A'kwamosi and scalp custodian perform a hand-and-breath gesture over Dr
    Tylor and later over the writer so that good may be drawn from one to the other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The A'kwamosi of the Ant fraternity is described as a very old man of the
    Sun clan who goes to a large chamber by the plaza to officiate.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the large chamber, A'pi'Mashiwanni, the first body of A'shiwanni, members
    of the Ant fraternity, a choir, and other priesthood members are arranged in specified
    parts of the room.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ritual objects in the room include an Apache basket with cloud designs and
    arrow points, feather wands with red and green ribbons, a second basket with arrow
    points and reed cigarettes, medicine water, hawks' breasts, kaolin, red pigment,
    and bear's grease.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the choir begins, each member holds and brandishes a pistol, bayonet,
    or war club in time with the song.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The song recounts valorous deeds of the Gods of War and people of old, fights
    with the Navahos, and instructions from the Gods of War about battle routes and
    mastering the enemy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The elder brother Bow priest and three other Bow priests take positions on
    the west side and are prepared by four members of the Ant fraternity for the outdoor
    ceremony.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Bow priests' preparation includes hair rolled into knots, clothing with
    moccasins and leggings, a war pouch, face applications of bear's grease and pigments,
    kaolin on parts of the face and head, and hawk down applied to the paste.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage explicitly says the hawk down applied to the paste is symbolic
    of the clouds of the world.
  category: attribute
  evidence_refs:
  - ev:9
