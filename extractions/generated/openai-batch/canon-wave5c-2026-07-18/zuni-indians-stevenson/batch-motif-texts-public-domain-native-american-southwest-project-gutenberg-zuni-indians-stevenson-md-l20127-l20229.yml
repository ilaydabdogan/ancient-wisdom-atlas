canonical_text:
  quote: ''
  summary: The passage describes Zuni food preparation and diet, including fried doughnuts
    adopted from Mexicans, hominy, roasted and popped corn, squash, native fruits
    and nuts, livestock and game. It notes ceremonial distribution of roasted corn,
    egg-related family-increase beliefs also attributed to the Navahos, and game offerings
    to Beast Gods as mediators between Zunis and anthropic gods.
  language: English, with Zuni food terms and some Spanish-derived terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doughnuts are said to have been adopted from Mexicans and are made from salted
    wheat-flour dough fried in boiling grease or lard, with a slender stick used to
    turn and lift them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hominy is described as a staple food made by boiling corn with wet ashes in
    water, stirring it for several hours, carrying it to the river, and thoroughly
    washing it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Roasted sweet corn is prepared in a deep cornfield excavation with cedar branches,
    coals, stones, and husked corn left overnight until after sunrise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Roasted corn may be dried for storage; when used in ceremonials the husks
    remain on during boiling and the corn is thrown to the populace by holding the
    pulled-back husks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Popped corn is made by toasting corn grains in bowls over coals and stirring
    them with cottonwood sticks until they pop and become white.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Youngsters are described as waiting near the popped corn for the first portion.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fresh squash is commonly roasted whole in ashes after an opening is made in
    the rind; it may also be stewed, and dried squash is boiled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Native fruits, including cactus fruit, yucca fruit conserve, peaches, and
    piñon nuts, are used or gathered as food.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Animal flesh is described as a large part of the Zunian diet, with cattle,
    goats, sheep, hogs, and chickens mentioned.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chicken egg whites are used for mixing paints for wooden objects, and whole
    eggs are sometimes eaten by men to bring them larger families; the Navahos are
    said to have the same superstition.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Meat parts including chitterlings, liver, heart, lights, brains, and blood
    pudding are eaten; mutton is everyday meat and beef may be sun-dried for winter
    use.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A stew is made by placing meat and water over the fire, adding cracked white
    corn, salt, kulantu, and chilli; meat may also be roasted before the fire in camp.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Game is described as an offering to Beast Gods intended to induce them to
    mediate between the Zunis and anthropic gods.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Deer meat is cut into strips, sun-dried, and preserved for ceremonials and
    guests.
  category: action
  evidence_refs:
  - ev:10
