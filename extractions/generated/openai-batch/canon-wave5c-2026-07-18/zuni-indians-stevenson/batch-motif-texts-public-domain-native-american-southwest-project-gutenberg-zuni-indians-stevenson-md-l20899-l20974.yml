canonical_text:
  quote: ''
  summary: The passage describes recent economic, architectural, religious, and educational
    changes at Zuni, including livestock losses and recovery, fencing and a government
    dam, altered attitudes toward sacred masks and other ritual objects, village changes,
    limited Christianization, and the schooling and English retention of Nina.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Zuni livestock decreased after depredations by Navahos, Mexicans,
    and some white settlers; sheep and goats were better protected by herders, and
    livestock later increased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wheat fields are described as largely protected by barbed-wire fencing, and
    a government dam under construction is expected by the narrator to address the
    Zuni problem of living.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In 1879, the narrator says a genuine Zuni mask could not be bought and bogus
    masks would not be made because of dread of offending the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1896 the writer collected nine masks through long acquaintance with priests
    and their attachment to her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the time described, less orthodox men are said to manufacture almost anything
    a collector might desire, including spurious ancient fetishes, masks, and altars
    sold as genuine or fraudulent objects.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The village is said to have changed since 1879: corrals were moved farther
    away, the old Spanish church walls were nearly gone, two church bells were kept
    by a Zuni theurgist, a lone cottonwood tree had disappeared, and streets were
    better kept.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator says adoption of foreign ways brought intoxication and trickery
    in dealings with white men, while the Zunis remained honest among themselves and
    secretive about religion and rituals.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the few who attended Christian services did not really understand
    them, and that Nina showed pride in her Protestant marriage certificate without
    real conception of Christianity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In 1904 Nina's marriage certificate was destroyed so that Nina and her husband
    would be rid of Christianity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The writer named Nina at age four, started her in school, obtained Nai'uchi's
    promise to compel attendance, and later recorded Nina's explanation that she remembered
    English by making two people of herself and talking to herself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Although a school had existed at the pueblo since 1876, only a few other Zunis
    are described as speaking any English in 1896.
  category: attribute
  evidence_refs:
  - ev:7
