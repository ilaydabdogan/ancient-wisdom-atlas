canonical_text:
  quote: ''
  summary: The passage contains plate headings and an ethnographic description of
    a three-day auction observed in 1896. An auctioneer arranges the sale in the great
    plaza, secretly places yellow blossoms under an inverted conical cooking vessel
    at the plaza center, and then sells goods brought chiefly by women. Goods include
    bowls and baskets containing foods. Purchasers pay immediately, vessels are returned
    to owners, and the elderly auctioneer receives no payment except invitations to
    eat.
