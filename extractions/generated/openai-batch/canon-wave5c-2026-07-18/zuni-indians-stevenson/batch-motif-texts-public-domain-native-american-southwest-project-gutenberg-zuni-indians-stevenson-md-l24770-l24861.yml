canonical_text:
  quote: ''
  summary: The passage describes work and food preparation during a fraternity ceremonial,
    an account of offerings associated with a deep spring and Ko'thluwala'wa, and
    an initiation sequence involving an emetic, feather and meal offerings, prayers
    to rain-makers, dancing, sword swallowing with root medicine, and a following-morning
    head washing in yucca suds.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Grinding of wheat and corn begins in the houses of fraternity fathers and
    novices on the fourth morning of the ceremonial.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder women remove corn from cobs, crones toast meal after the first mill,
    girls take turns at a line of mills, and an aged woman directs the grinders' singing
    while some alternate grinders dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women of the household prepare stewed meat and peaches and make he'we, described
    as wafer bread, for the workers' feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A note reports a claim that a spring is very deep and that the place below
    can accommodate deceased 'Hle'wekwe and beast warriors formerly associated with
    the fraternity, who receive plume offerings there and convey them to Ko'tliluwala'wa.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the fifth day, comparatively little grinding is done because people go
    in the afternoon to witness dances of the 'Hle'wekwe and Great Fire fraternities
    in Si'aa'. te'wita.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After sunset on the fourth evening, novices are escorted from their homes
    to the ceremonial chamber by their fraternity fathers, and women in charge of
    medicine fill bowls with an emetic for the candidates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each novice sits on a stool in the middle of the floor facing east, swallows
    the emetic, has the throat tickled with a feather to induce vomiting, and uses
    another bowl for the ejected matter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fraternity father opens a husk containing an eagle plume and meal given
    by the novice, drops feather bits into the bowl, prays for the novice's health,
    pure heart, and long life, and adds the meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fraternity father lifts the bowl, waves it to the six regions with a prayer
    to 'Ille'wekwe rain-makers for snow and winter rains, and deposits the contents
    in the river so the feather and meal may go to Ko'thluwala'wa and be received
    by the 'Ille'wekwe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the 'Ille'wekwe are constantly leaving the undermost world
    and moving back and forth from their spring to Ko'thluwala'wa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Male fraternity members sit or stand on the south side of the room, female
    members and novices on the north side, and during the first song women and novices
    keep time with interlocked fingers while rattles are used.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: A fraternity father asks the 'Hlem'mosona for the ancient sword of the original
    'Hlem'mosona and requests a medicine; a young man of the Corn clan removes a root
    from a sack and places it in the fraternity father's mouth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The fraternity father holds the ancient sword, leads a novice to the middle
    of the room, and both face north with the novice standing at the father's right.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: During singing and dancing, the fraternity father swallows the sword with
    the root medicine in his mouth, transfers the medicine mouth-to-mouth to the novice,
    and the novice runs the sword down his throat and withdraws it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: For the woman novice, the fraternity father repeats the ceremony; she puts
    the sword in her mouth but does not run it down her throat at this time, and the
    father does so in her stead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Afterward the candidate is escorted home; at daylight he goes to the fraternity
    father's house, has his head bathed in yucca suds, eats alone under dietary restrictions,
    and receives the bathing bowl as a gift.
  category: sequence
  evidence_refs:
  - ev:9
