canonical_text:
  quote: ''
  summary: The passage describes the Hla'hewe corn drama, a sacred A'shiwi/Zuni festival
    performed when corn is young, understood as a reenactment of the Corn Maidens'
    appearance and dance for rain, crop beauty, and food. It also describes special
    performances or proposed performances in response to drought concerns, the division
    of performers into two named parties, and the planning assembly in the house of
    the priestess of fecundity.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hla'hewe drama is described as enacted every four years in August when
    the corn is about a foot high.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drama is said to reproduce ceremonies held at the third appearance of
    the Corn Maidens before the A'shiwi and is regarded as one of their most sacred
    festivals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Corn Maidens are expected to dance so that rain will come, water the earth,
    beautify the new corn, and enable the earth to furnish food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Although the drama is required once every four years, it may occur more often
    by order of the first body of A'shiwanni.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A special 1890 performance is linked to the impeachment of a former pe'kwin
    for causing drought and to the need for the new incumbent to learn his important
    part in the drama.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Zunis are reported as saying the 1890 celebration brought so much rain
    that they danced all night in mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A later request to repeat the ceremony was first resisted because of concern
    that it would appear to be held for the writer's documentation, but the rain priest
    and elder brother Bow priest considered including it among additional ceremonies
    after Oraibi prisoners threatened drought.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dancers and choirs form two parties, one called Hla'hewe and the other
    Sho'ko'we, with the latter connected to the flute and to Pa'yatamu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first body of A'shiwanni assemble in the house of the priestess of fecundity
    to arrange the drama eight days in advance and select performers for nonpermanent
    parts; the priestess is present but silent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note identifies hla'ha as a rabbit-skin blanket and says the name signifies
    fecundity.
  category: attribute
  evidence_refs:
  - ev:7
