canonical_text:
  quote: ''
  summary: After the A'shiwi suffer loss of corn and food, the Gods of War seek the
    missing Corn Maidens through bird messengers and then through Bi'sisi. Bi'sisi
    discovers the Corn Maidens, travels to Pau'tiwa, and returns with associated gods
    and Corn Maidens. The A'shiwanni maintain a silent fasting vigil, and ritual arrangements
    with meal, cloud symbols, miwachi, and six colored te'likinawe organize the Corn
    Maidens by direction before a procession to I'tiwanna.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After four time periods at I'tiwanna, the A'shiwi suffer because witches destroy
    their corn and other food, and they call on the Gods of War for aid.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gods of War send the raven, owl, and hawk to search for the Corn Maidens,
    and each returns without finding them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Gods of War call on Bi'sisi, identified as musician and jester to the
    Sun Father, at the spring Lu'klana 'kiai'a; he agrees to find the Corn Maidens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bi'sisi and the Kia'kwemosi communicate in the ki'wi'sine without moving their
    lips; the passage says the words are spoken from the heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The A'shiwanni sit all night and all day in a fireless ki'wi'sine, without
    speaking, eating, drinking, or smoking, while directing their thoughts to the
    Corn Maidens and rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bi'sisi ascends a tall cottonwood tree, looks over the world, and sees one
    of the maidens in the far south through separated plumes of a duck's wing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note records an alternate version in which some A'shiwanni say Bi'sisi did
    not climb the cottonwood tree but traveled by Galaxy until he was over Ke'yatiwa
    and saw a maiden through duck feathers.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yu'pia'hlan'na, the Galaxy, bows to the earth to receive Bi'sisi and carries
    him to Ke'yatiwa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bi'sisi tells Pau'tiwa that the A'shiwanni wish the Corn Maidens to come to
    them; the Corn Maidens say they are afraid, and Pau'tiwa tells them they must
    go.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage repeats that in this exchange hearts speak to hearts and lips
    do not move.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bi'sisi returns toward I'tiwanna followed by A'wan ta'chu Ko'yemshi, Pau'tiwa,
    and the Corn Maidens; the gods and Corn Maidens remain at Ku'shilowa while Bi'sisi
    goes to the ki'wi'sine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the ki'wi'sine, the A'shiwanni sit at the west end behind a cloud symbol
    made of meal, with miwachi on the meal painting and a line of meal extending to
    the ladder.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'A basket holds six te''likinawe: yellow for the Yellow Corn Maiden of the
    North, blue for the Blue Corn Maiden of the West, red for the Red Corn Maiden
    of the South, white for the White Corn Maiden of the East, white dotted with all
    colors for the Every-color Corn Maiden of the Zenith, and black for the Black
    Corn Maiden of the Nadir.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: A note states that A'wan ta'chu Ko'yemshi and Pau'tiwa had assumed the form
    of ducks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: After announcing the Corn Maidens' arrival, Bi'sisi plants the six te'likinawe
    one after another in the order yellow, blue, red, white, every-colored, and black.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The gods are then in human form and sit south of the Corn Maidens, who stand
    in an east-west line.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Bi'sisi passes from left to right around Pau'tiwa and the Corn Maidens; A'wan
    ta'chu Ko'yemshi later circles them from left to right before a procession goes
    to I'tiwanna, followed by the Corn Maidens.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
