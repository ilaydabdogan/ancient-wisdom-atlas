canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni A''shiwanni rain-priesthood ceremony: meal
    crosses, a world-encircling meal circle, beads, medicine bowls, mi''wachi, tortoise
    shells, and a dual et''tone fetish are arranged on a cloud symbol. A newly ordained
    associate is ritually raised, joins in handling the dual fetish, and receives
    prayers. Water is apportioned, consecrated, mixed with meal, root, and fetishes,
    whipped into cloud-like suds, and sprinkled with eagle plumes. Music, rattles,
    meal sprinkling, and an all-night invocation call rain-makers to enter, ascend
    a ladder, and bring showers and rain.'
  language: English with Zuni ritual terms
  quote_policy: summarized
literal_observations:
