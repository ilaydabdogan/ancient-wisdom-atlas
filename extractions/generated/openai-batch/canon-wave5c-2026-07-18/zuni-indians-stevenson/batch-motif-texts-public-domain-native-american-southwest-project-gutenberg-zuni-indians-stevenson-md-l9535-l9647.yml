comparison_claims:
- id: claim:1
  claim: The passage itself compares the solemn placement of the et'tone and its ceremonies
    to administering the Holy Eucharist in the Roman Catholic Church, apparently as
    an analogy of sacred centrality and solemnity.
  claim_level: same_function
  target: Roman Catholic Holy Eucharist
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made by the passage's ethnographic narrator; it does
    not establish shared origin, doctrinal equivalence, or historical contact.
- id: claim:2
  claim: A note compares Zuni and Sia techniques for making ceremonial suds, saying
    Sia practitioners are more expert, apparently do not use the extra reed, and bank
    the suds higher.
  claim_level: visual_similarity
  target: Sia Indians' ceremonial suds-making
  evidence_refs:
  - ev:6
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The note compares a specific ritual technique and visual result only;
    it does not describe the full Sia ceremony or establish broader motif equivalence.
