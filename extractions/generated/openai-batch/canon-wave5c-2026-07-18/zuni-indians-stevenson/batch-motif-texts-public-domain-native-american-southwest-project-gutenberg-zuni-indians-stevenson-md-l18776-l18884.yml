canonical_text:
  quote: ''
  summary: The passage describes Zuni ritual games involving concealed balls, cups,
    straws, offerings, prayer meal, beads, shrines, and rain-related prayers. It also
    describes Ho'kiamonne and Let-pochiwe game implements and notes that Ho'kiamonne
    is offered to the Gods of War at the winter solstice and is played for rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A player places one cup over a ball, arranges other cups, packs sand around
    them, lights a husk cigarette, and puffs smoke over the cups while directing the
    cigarette toward six directions so that rain-makers will send rain on Zuni.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cup-and-ball game proceeds by watchers touching cups and paying or receiving
    counted straws according to which touch finds the ball; the players are repeatedly
    covered by a blanket while the cups and ball are reset.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A plant bunch remains at the center, the ball is always immediately over that
    spot, and the cups and sand are moved so that the center cannot be known.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the game returns to the first party, the leader speaks to the ball, telling
    it to go to its mother Ko'hakwa, identified as a nearby planted bead, and not
    to its father Hli'akwa, identified as Turquoise, and then to return soon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The game may continue for four or five days, and participants must not sleep,
    eat, or drink while it continues.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the game, the first leader removes all deposits except the black archaic
    bead, which remains permanently in the ground, and carries the other deposits,
    the game, wagers, and the rain priest's ball to his home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The leader places the game, offerings, money, and silver articles in a basket
    tray, sprinkles prayer meal over the basket and other wagers, and prays to the
    Gods of War, rain-makers, A'wonawil'ona, and deceased gamesters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The borrowed game is returned to its owner; offerings are deposited at the
    shrine of the younger God of War on Corn mountain, the la'showanne is placed in
    a medicine box, and the rain priest's ball is returned with a string of precious
    beads.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ho'kiamonne uses a yucca-ribbon ball and two slender sticks sharpened at one
    end and passed through corncob pieces with hawk plumes; players throw the sticks
    at the ball and try to penetrate it.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ho'kiamonne is described as a precious game of the Zunis, one offered to the
    Gods of War at the winter solstice, and it is frequently played for rain with
    sacred meal sprinkled before the ball is placed.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: In rain-playing Ho'kiamonne, the first person to penetrate the ball lifts
    it by the stick, draws a breath from it, and thanks the gods that the rains are
    soon to come.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Let-pochiwe uses pencil-like sticks, reeds, a longer reed called the chief,
    and feathers attached to each reed and stick; the genuine game of the Gods of
    War is said not to exceed seven implements.
  category: object
  evidence_refs:
  - ev:10
