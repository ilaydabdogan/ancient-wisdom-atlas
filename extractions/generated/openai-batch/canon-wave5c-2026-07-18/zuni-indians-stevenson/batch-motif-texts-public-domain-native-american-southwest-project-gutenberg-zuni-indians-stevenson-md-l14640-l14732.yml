canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of ceremonial dances: directional rattle
    movements, the entrance of Mu''luktiikia dancers with a bear-dressed boy, the
    appearance of ''Cha''kwena dancers with meal sprinkling, painted lightning designs,
    rattles, weapons, masks, and animal-like bear performers, followed by Wa''tom''la
    dancers who stamp and dance. The passage ends with the beginning of a statement
    that a Hopi dance is introduced.'
  language: English
  quote_policy: summarized
