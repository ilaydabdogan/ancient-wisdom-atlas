canonical_text:
  quote: ''
  summary: The passage describes the Ne'wekwe fraternity, its patron god Kok'ko 'hlan'na,
    traditions about Hik'si'si/Pa'yatamu, an encounter at Ashes spring in which the
    god gives ritual medicine instructions, initiation practices involving excrement,
    the spring setting and its soil, and public plaza appearances with Ko'yemshi.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ne'wekwe fraternity is said to embrace the orders of O'naya'nakia and
    It'sSpcho and to have Kok'ko 'hlan'na, called a Great god, as patron god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two other gods are reported to appear at times with the Ne'wekwe, while their
    relation to the fraternity is stated as uncertain by the writer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ne'wekwe is stated to have been one of four original fraternities organized
    soon after the A'shiwi came to this world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hik'si'si is reported to have had special qualifications and to have been
    appointed musician and jester to the fraternity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Ashes spring, Kok'ko 'hlan'na appeared to the Ne'wekwe and asked the mo'sona,
    or director, what medicine they had.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kok'ko 'hlan'na said their medicine was good but too hot if used alone and
    would destroy the intestines; he said he would give medicine to allay the burning
    qualities of the other medicine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kok'ko 'hlan'na instructed the Ne'wekwe to use human excrement together with
    their medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Since that time, Kok'ko 'hlan'na is personated at Ne'wekwe initiatory ceremonials
    and administers excrement to initiates and other members of the fraternity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the excrement is not given to invalids but is administered
    at initiation, when every fraternity member must receive it to keep bodies conditioned
    for the other medicine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kok'ko 'hlan'na invited Hik'si'si to live with him and to be musician and
    jester to the Sun Father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before disappearing in the waters of the spring, Hik'si'si told the fraternity
    to notify him with te'likinawe whenever they needed him, and the passage says
    he has since borne the name Pa'yatamu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The spring is described as marshy, with tall grass, little dark water, low
    walls, and a roof of poles, brush, and soil; its soil is used by the Ne'wekwe
    to decorate bodies and skull caps for ceremonials.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Members of the Ne'wekwe are said to appear in the plaza with the Ko'yemshi
    between dances of the gods and to play the fool generally.
  category: action
  evidence_refs:
  - ev:8
