  label: ritual commissioning through breath and wand
  taxonomy_refs:
  - initiation
  basis: Selected Sha'lako personators receive the plume wand through repeated breath
    gestures and prayers, then extend the rite to others in the community.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage describes appointment and empowerment for ceremonial roles;
    it does not use the term initiation.
- id: motif:4
  label: afterlife awakening and life-road prayer
  taxonomy_refs:
  - afterlife_journey_map
  basis: Prayers ask that people sleep rather than die and awake in Ko'thluwala'wa,
    and that the chosen person pass over his road to the end before that awakening.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives prayer formulae rather than a detailed map or narrative
    of an afterlife journey.
- id: motif:5
  label: underworld or fourth-world entrance in ritual setting
  taxonomy_refs: []
  basis: The circular floor hole is explicitly described as symbolic of the entrance
