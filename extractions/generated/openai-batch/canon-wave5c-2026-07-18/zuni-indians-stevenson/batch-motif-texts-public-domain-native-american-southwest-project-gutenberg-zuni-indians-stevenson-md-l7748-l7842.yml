- id: motif:2
  label: ritual transfer of sacred objects and blessings
  taxonomy_refs:
  - sacred_exchange
  basis: Wands and te'likinawe are handed over, received, carried, and offered, accompanied
    by prayers for rain, food, health, long life, and removal of disease.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  - ev:9
