- id: motif:1
  label: seasonal ritual cycle at winter solstice
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage marks the close of winter solstice ceremonies and then describes
    winter dances and preparations occurring on the following days.
  evidence_refs:
