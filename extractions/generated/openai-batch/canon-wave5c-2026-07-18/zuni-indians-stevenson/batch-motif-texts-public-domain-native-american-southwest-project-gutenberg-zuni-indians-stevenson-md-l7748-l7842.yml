canonical_text:
  quote: ''
  summary: The passage describes the close of winter solstice rites through depositing
    meal from a painting into a floor hole symbolizing the entrance to the undermost
    or fourth world, followed by preparations for winter Kok'kokshi dances. A Sha'lako
    ritual leader convenes men, transfers wands, appoints hosts and Sha'lako personators,
    breathes over plume wands, and prays for rain, corn, health, long life, and awakening
    in Ko'thluwala'wa. The appointed personators and householders extend the wand-and-breath
    rite to men, children, kin, neighbors, and clan members. The community then plans
    dances, prepares or borrows masks, and guests bring feathers and te'likinawe offerings
    with a prayer to remove disease.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Sa'ya'hlia leave the ki'wi'sine, the mi'wachi and other objects
    are removed from the meal painting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'pekwin gathers the meal from the painting and deposits it in a circular
    floor hole described as symbolic of the entrance to the undermost, or fourth,
    world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prayer for corn and the fruits of the earth accompanies the meal deposit,
    and the winter solstice ceremonies are closed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the day after the winter solstice ceremonies, around sunset, the chief
    Sha'lako wor'li summons older and more important members of his ki'wi'sine to
    meet at his house at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the meeting, the wor'li asks who will take the te'likinano and entertain
    the Sha'lako in his house, and a person volunteers to receive the wand and host
    the Sha'lako.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wor'li hands over the wand and prays for rain, corn, food, family health,
    continued life, and awakening in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The wor'li selects a man to serve as elder brother Sha'lako and gives him
    a plume wand composed of feathers of eagles' legs, ducks, and birds of the six
    regions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The wor'li blows breath upon the plume wand four times, draws it before the
    chosen man's mouth each time, and prays that he speak with one tongue, be gentle,
    be good to others, and receive rain, corn, food, clothing, long life, and awakening
    in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The four smaller te'likinawe left at each ki'wi'sine by Pau'tiwa are given
    to the chosen personator of the Sha'lako.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The wor'li selects a younger brother Sha'lako; the elder brother Sha'lako
    breathes four times on the plume wand, passes it before the younger brother's
    mouth, repeats the prayer, and then passes the wand before all men present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At sunrise the elder brother Sha'lako, accompanied by the younger brother,
    visits members' houses, including the youngest children, and passes the plume
    wand before each mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: While making the rounds, the elder brother Sha'lako selects four men to act
    as Mo'lawe, fruit and seed bearers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The wife and daughters of the man who will host the Sha'lako dance notify
    blood relatives, close neighbors, and clan people to come to the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The man of the house breathes four times upon his wand before each guest's
    lips, and the guest inhales what the passage calls the sacred breath or better
    part of the man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: On the fourth day after Pau'tiwa leaves plumes at the hatchways of the ki'wi'siwe,
    people meet at the chief Sha'lako wor'li's house to decide what dances to hold
    when masks are ready.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Companion ki'wi'siwe may dance together; guest dancers prepare their own masks
    and te'likinawe, make additional te'likinawe for the host ki'wi'sine, and may
    choose among the host ki'wi'sine's masks.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Ko'yemshi masks are obtained from a man of Eagle clan, but only seven may
    be borrowed; the masks of the Great Father, deputy, and warrior officers are not
    to be borrowed for this occasion.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: A guest carries two eagle-wing feathers associated with esoteric fraternities
    and four te'likinawe to be offered to deceased wor'we with the prayer to take
    disease from the people; the head wor'li receives the te'likinawe.
  category: action
  evidence_refs:
  - ev:9
