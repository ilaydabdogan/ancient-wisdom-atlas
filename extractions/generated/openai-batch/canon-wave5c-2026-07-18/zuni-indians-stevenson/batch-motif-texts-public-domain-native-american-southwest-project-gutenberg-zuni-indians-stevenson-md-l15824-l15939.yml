  quote: ''
  summary: Chronologic historical summary of Zuni encounters with Spanish officials,
    missionaries, neighboring peoples, raids, revolts, mesa refuge, resettlement,
    allegiance renewals, inscriptions at El Morro, and a knotted cord interpreted
    as recalling the 1680 rebellion device.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Spanish maestro de campo with priests and a small detachment was admitted
    to the summit of the Zuni mesa stronghold, and the Zunis promised peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Zunis left the mesa and began resettling their villages in the valley
    in 1635.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In 1670 Apaches or Navahos raided Hawikuh, killed the Zuni missionary Fray
    Pedro de Avila y Ayala with a bell while he clung to a cross, and his remains
    were recovered and interred at Halona.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the 1680 Pueblo revolt, Zunis killed their missionary, burned the church,
    and fled to Toaiyalone for more than twelve years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists Halona, Kiakima, Matsaki, and Hawikuh as occupied Zuni villages
    at the time of the 1680 revolt, while Canabi and Aquinsa had been abandoned earlier.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 1692 Diego de Vargas found the Zunis on the mesa, received their submission,
    and about 300 children were baptized.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In 1699 the governor visited La Purisima de Zuni, and the inhabitants renewed
    their allegiance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In 1703 harsh garrison treatment and lack of redress preceded the killing
    of three Spaniards; afterward some Zunis fled to the Hopis and others to Toaiyalone,
    and a Spanish captain removed the friar from Zuni.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In 1705 Padre Garaicoechea returned, induced the Zunis to come down from Toaiyalone
    and settle on the plains, and they renewed allegiance to Captain Roque Madrid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In 1705 Spaniards found a knotted cord, described as probably a quipu or calendar
    string, and associated it with a similar device used in 1680 to notify rebels
    and fix a rebellion date.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: In 1706 Hopis raided the Zunis; the Zunis then made an expedition against
    the Hopis, killed two, recovered seventy animals, and later aroused suspicion
    by asking that the garrison be removed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The 1707 and 1713 entries describe Zuni-Hopi diplomatic contact for peace
    or alliance alongside raids and opposition to Spanish authority.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:13
  text: Several Spanish officers or officials left inscriptions on El Morro while
    passing toward or through Zuni.
  category: action
  evidence_refs:
  - ev:1
  - ev:11
  - ev:13
- id: obs:14
  text: In 1713 a Zuni Indian was reported to have attempted to instigate Acomas and
