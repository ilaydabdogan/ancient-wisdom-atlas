canonical_text:
  quote: ''
  summary: 'The passage describes Zuni mortuary customs: burial or destruction of
    a deceased person''s belongings; burial of an initiation mask for a Ko''tikili
    member; planting prayer plumes with meal; post-burial purification; beliefs about
    the ghost remaining near the village for four nights before traveling to Ko''thluwala''wa;
    measures involving open doors, black corn, charcoal, fire, smoke, an ant-hill
    rite, and food offerings; and observed scenes of mourning and body preparation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Immediate family members go west of the village near the river bank and make
    an excavation for extra clothing and belongings of the deceased; most objects
    belonging to the dead are destroyed or buried.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the deceased belongs to the Ko'tikili fraternity, the initiation mask is
    heavily sprinkled with meal and buried with prayers in a small excavation near
    the larger one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A third excavation is made near the river, and tc'likinawe are planted in
    it; adults have four and children one or two, with infants' hands guided by their
    mothers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the plumes are placed, meal is sprinkled on them, the excavation is
    filled the next day, and all except infants drink warm water as an emetic for
    physical purification.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The ghost is believed to remain around the village for four nights after death
    and to start for Ko'thluwala'wa on the fifth morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the ghost's stay, the house door and hatchway are left ajar so it may
    pass in and out; a closed door would cause the ghost to scratch until it was opened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that shadow beings can be observed by seers and by others
    under certain conditions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: A rain priest recounts that after a woman sword-swallower died during a ceremony,
    her spirit troubled the household with rapping until live coals and piñon gum
    filled the room with smoke and rid them of it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Parents or sisters of a deceased person sleep beside the surviving spouse
    during the four nights the spirit is supposed to remain in Zuni.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A grain of black corn and a piece of charcoal are placed under the mourner's
    head to prevent dreaming of the lost person, whose ghost would appear if the sleeper
    awoke.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a husband or wife in the Ant fraternity dies, the survivor goes with
    a male relative to an ant-hill, faces west, sprinkles prayer meal, steps over
    the ant-hill left foot first, and a relative obliterates the ant-hill.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Food is thrown into the fire daily for the spirit, and on the fifth morning
    a large bowl of varied food is cast into the fire for the spirit's two-day-and-night
    journey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The spirit is said to reach a lake, descend a mystic ladder to meet the Council
    of the Gods, and then pass to the undermost world, described as the place of Zuni
    nativity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Mediums are said to have seen deceased Zuni dancing in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: In one observed mourning scene, a young husband, mother, father, and friends
    grieve beside the body of a young wife, whose head is to the east and whose face
    is covered with white cotton cloth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: In another body-preparation scene, a woman brought from Nutria is wrapped
    in a blanket tied with yucca strings; relatives dig the grave, prepare a fire
    with food items, untie the blanket knots, and wash the head and face with yucca
    suds.
  category: sequence
  evidence_refs:
  - ev:9
