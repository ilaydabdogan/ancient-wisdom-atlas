- id: obs:4
  text: A young man with a very sick wife reported seeing a queer-looking burro near
    his house before leaving for a fraternity meeting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man was told that a large cat had entered the house during his absence,
    and he concluded that a witch or wizard had been there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man encountered a man wrapped in a blanket in a nonlocal fashion,
    with his head sunk low, and identified him as a wizard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The vice pa'mosono'wkla was removed from office after being declared a witch,
    and her son was first tried as a wizard accused of causing many children's deaths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: While suspended by the arms, the son said his mother knew more than he did
    and that he acted under her influence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A neighbor accused the woman of stealing a buckskin sack, killing his mi'li,
    and depositing excrement in his house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Under threat, the woman said she sent her son to steal the sack, cut the heart
    of the mi'li, and deposit excrement in order to strengthen her medicine and bring
    death to the people of the house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The woman said she combined the heart of the mi'li with the hearts of a rattlesnake
    and a toad and shot the mixture into children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The warriors released the woman after she promised not to destroy another
    life, but the son was killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: The writer reports repeatedly observing theurgists working over patients and
    pretending to extract substances said to have been shot into bodies by witches.
  category: action
  evidence_refs:
  - ev:4
