candidate_motifs:
- id: motif:1
  label: Ritual preparation for swiftness and endurance
  taxonomy_refs: []
  basis: Before the race, runners apply medicines, chew humming bird medicine, receive
    an arrow point in the hair, and undergo ash purification to support endurance
    and speed.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an ethnographic ritual-athletic practice rather than a mythic
    narrative episode.
- id: motif:2
  label: Contest organized by paired divine sides
  taxonomy_refs:
  - duality
  basis: The two race sticks designate the sides of the elder and younger Gods of
    War, and each side's stick and offerings are deposited separately at named mountain
    shrines.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage gives elder/younger divine pairing and side designation, but
    does not elaborate a mythic relationship between the two Gods of War.
- id: motif:3
  label: Sacred exchange through wagers, offerings, and shrine deposits
  taxonomy_refs:
  - sacred_exchange
  basis: Wagered goods, good-luck parcels, prayer meal, bead offerings, and post-race
    shrine deposits are all integrated into the formal race sequence.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage describes offerings and prayers but does not explicitly state
    a negotiated exchange with deities.
- id: motif:4
  label: Purification before and after strenuous ritual action
  taxonomy_refs: []
  basis: Runners receive ashes for physical purification before the race and later
    drink warm water as an emetic, wash in yucca suds, and bathe.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The described purification is tied to the race ritual; broader symbolic
    meaning is not stated in the passage.
- id: motif:5
  label: Ritual circuit through named sacred landscape
  taxonomy_refs:
  - return
  basis: The race follows the road of the Gods of War, crosses and recrosses the river,
    returns to the base and plaza, and culminates in later deposits at Wool mountain
    and Corn mountain shrines.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The route is a race circuit rather than a narrated quest; the taxonomy
    reference to return is literal and should be reviewed.
