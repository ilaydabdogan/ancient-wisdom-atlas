canonical_text:
  quote: ''
  summary: The passage describes formal and informal Zuni ti'kwane stick races, including
    ritual bodily preparation with medicines, ashes, hair arrangement, painted sticks,
    betting practices, participation by managers, bow priests, wives of rain priests,
    spectators, and religious office holders, the race route across the landscape,
    victory prayers and breath gestures, offerings in prayer meal and beads, post-race
    cleansing, and deposits at mountain shrines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Runners remove clothing, put on a light kilt, take Shu'maakwe fraternity medicine
    into the mouth, eject it into the hands, and rub the body so they will not tire
    while running.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each runner bites and chews a root called humming bird medicine, ejects it
    into his hands, and rubs his body so he may be swift like the humming bird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bow priest folds and wraps each runner's hair into a long knob, places an
    arrow point in it to insure fleetness, and uses eagle-wing plumes to pass ashes
    down the sides of each racer and sprinkle ashes to the six regions for physical
    purification.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Medicine may be put into the stick paint and slipped under a runner's right
    index fingernail; people who notice a thumb pressed to the finger believe the
    medicine will bring success and may bet high on that side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wives of two rain priests remain in houses visited by their husbands,
    with parcels including blankets deposited beside them for good luck to the runners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Runners are accompanied to the base by managers and bow priests, while crowds
    gather, mounted men follow, and women remain in the village despite their enthusiasm.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two sticks designate the sides of the elder and younger Gods of War; each
    leader places a stick across his foot, sprinkles it with meal, cries readiness,
    and thereafter the stick must be managed with the foot rather than the hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The race proceeds over the road of the Gods of War, crosses and recrosses
    the river, returns to the base and plaza, and the first successful-party member
    to pass around the wager heap is called the hero of the hour.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Successful runners extend their hands toward the wager heap, bring the hands
    to the mouth, draw in a breath, and proceed to the manager's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The victor deposits his side's stick in a basket of prayer meal, and those
    present place offerings of bits of precious beads in the basket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wife of the rain priest takes the victor's hands and brings her clasped
    hands four times before his mouth while he draws breaths; the gesture is repeated
    before each runner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After prayers, the victor empties the basket contents, including meal, bead
    offerings, and the stick, into a corn husk and carries it home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After returning home, each runner drinks warm water as an emetic, may need
    massage to recover, and the next morning has his head washed in yucca suds and
    bathes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The elder God of War stick and contents carried from the manager's house are
    deposited at a shrine on Wool mountain, while the younger God of War stick and
    offerings are deposited on Corn mountain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Prominent religious positions do not prevent men from joining betting races;
    the Ko'mosonu, Director-general of the ki'wi'siwe, is described as a fleet and
    enthusiastic runner.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Informal ti'kwane races also occur, sometimes with stakes, but have little
    or no ceremony and much less excitement than formal races.
  category: attribute
  evidence_refs:
  - ev:11
