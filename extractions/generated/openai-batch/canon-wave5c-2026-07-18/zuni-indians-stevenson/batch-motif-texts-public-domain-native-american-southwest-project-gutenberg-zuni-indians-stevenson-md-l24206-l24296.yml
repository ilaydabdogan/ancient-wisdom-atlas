canonical_text:
  quote: ''
  summary: 'The passage recounts events concerning the ''Hle''wekwe at I''tiwanna
    and Top''apkwinna: a sacred spring with underground roads, reciprocal making of
    prayer plumes by rain priests and ''Hle''wekwe officers, rain and snow produced
    for four days and nights, explanations of snow''s value for corn, selection of
    sacred objects and ceremonial participants, reception of the fraternity with Beast
    Gods in a sacred plaza, prayers over et''towe for cold rains and snow, and concluding
    notes on the fraternity''s orders, meetings, seasonal restrictions, and medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Top'apkwinna, an original director of the 'Hle'wekwe disappeared in a spring,
    and the spring became a sacred spot associated with underground roads to Ko'thluwala'wa
    and the fourth or undermost world.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two officers of the 'Hle'wekwe visited their people at I'tiwanna and told
    the A'shiwanni that they wished to come to the Middle of the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kia'kwemosi and the two officers disputed which party should make te'likinawe,
    or prayer plumes, for rain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the A'shiwanni made and planted te'likinawe, clouds gathered from the
    four quarters, rain fell for four days and four nights, and rivers and lakes were
    filled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the two 'Hle'wekwe officers made and planted te'likinawe, white clouds
    appeared and snow fell for four days and nights, reaching halfway up house ladders.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kia'kwemosi objected that the 'Hle'wekwe et'towe and snow songs would
    prevent corn, and the 'Hle'wekwe director answered that snow cools the earth and
    later melts into it, strengthening corn before warm rains arrive.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Shi'wanni of the West and the 'Hle'wekwe director each made a te'likinane;
    both were planted at the spring, the director afterward disappeared into the spring,
    and rain filled the stream beds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kia'kwemosi chose additional et'towe from named clan sources, designated
    them mu'et'towe, and chose maidens as bearers of the et'towe and hla'we.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kia'kwemosi selected a Dogwood clan man carrying a sacred meal basket
    as Mu'chailihii'nona, and also chose two maidens and a youth called Mu'waiye to
    dance, with ki'wi'sine people to sing for them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Beast Gods accompanied the 'Hle'wekwe to I'tiwanna, where the first body of
    A'shiwanni met them and conducted them to the sacred dance plaza.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the plaza, some beast warriors played notched sticks with deer leg bones
    over inverted baskets placed on crosses of meal, while others sat in the center
    looking upward to the heavens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the plaza ceremonial, et'towe were placed in meal-filled baskets in
    the O'he'wa ki'wi'sine, and ritual specialists prayed over them so they might
    bring snows and cold rains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The 'Hle'wekwe director announced that for one night the et'towe would permit
    any amount of licentiousness, with each man giving a thumb-encircling string of
    beads to the woman of his choice, who would deposit it with the et'towe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The 'Hle'wekwe fraternity is described as having two orders, Sword and Spruce,
    two annual meetings in January and February, summer rituals that would freeze
    corn, and medicines especially good for sore throat.
  category: attribute
  evidence_refs:
  - ev:9
