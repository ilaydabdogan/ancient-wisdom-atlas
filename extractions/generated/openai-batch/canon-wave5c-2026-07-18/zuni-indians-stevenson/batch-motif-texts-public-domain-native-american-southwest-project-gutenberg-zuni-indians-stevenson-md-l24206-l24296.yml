candidate_motifs:
- id: motif:1
  label: world center as ritual destination
  taxonomy_refs:
  - world_center
  basis: The two officers say they wish to come to the Middle of the world, and the
    Kia'kwemosi says the Middle has been found.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not elaborate a cosmological map beyond the Middle of
    the world and the underground roads mentioned elsewhere.
- id: motif:2
  label: sacred spring as passage to the undermost world
  taxonomy_refs: []
  basis: The spring at Top'apkwinna is sacred because a director disappeared there,
    and underground roads are said to lead from it to Ko'thluwala'wa and the fourth
    or undermost world.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage states the association but does not narrate travel along the
    roads.
- id: motif:3
  label: ritual offerings produce weather
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer plumes are made and planted, after which rain or snow comes for four
    days and nights; later plumes planted at the spring are followed by much rain.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The taxonomy label is general; the passage's specific form is Zuni prayer-plume
    ritual.
- id: motif:4
  label: complementary warm rain and snow for corn growth
  taxonomy_refs:
  - seasonal_cycle
  basis: The director explains that snow cools the earth and melts into it, preparing
    corn to become strong before warm rains arrive; summer 'Hle'wekwe rites would
    freeze corn.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: This is presented as a ritual-agricultural explanation rather than a full
    seasonal myth cycle.
- id: motif:5
  label: sacred bundles or objects that bring snow and cold rain
  taxonomy_refs: []
  basis: Et'towe containing seeds for snow are valued, additional et'towe are chosen
    and designated, and specialists pray over them so they may bring snows and cold
    rains.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage does not fully define et'towe or describe their contents beyond
    the snow-seed association.
- id: motif:6
  label: animal or beast beings as ritual companions
  taxonomy_refs: []
  basis: Beast Gods accompany the 'Hle'wekwe to I'tiwanna, and beast warriors occupy
    ritual positions in the plaza.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not identify the individual Beast Gods or describe transformation.
- id: motif:7
  label: temporary ritual permission for licentiousness mediated by sacred objects
  taxonomy_refs: []
  basis: The 'Hle'wekwe director announces that for one night the et'towe will countenance
