canonical_text:
  quote: ''
  summary: An ethnographic account describes a young woman's prolonged labor, attended
    by female relatives and doctresses. Physical treatments, juniper tea, and a contemplated
    ritual intervention by officers of the Great Fire fraternity are described. The
    child is born male; the cord is cut and tied, the placenta is deposited in the
    river with a fertility prayer, and the mother bites a white pebble for the child's
    teeth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young woman in labor was confined in her mother-in-law's house, wore only
    the cainis under a heavy blanket, and lay on sheepskins near the south end of
    the room.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother-in-law, who was a doctress, sat beside the young woman but did
    not take a professional part; two grandmothers were present and concerned, while
    male relatives waited anxiously in an interior room and the husband was absent
    at his farm.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two summoned doctresses kneaded the abdomen, pressed on the back, and had
    the young woman brace her feet against a ledge and grasp a doctress's belt during
    pains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One doctress held the patient's nostrils and blew into her mouth, a treatment
    the passage says was supposed to force the child into the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Juniper tea was frequently drunk during the labor, and the membranes ruptured
    about an hour and a half before the birth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A doctress proposed summoning officers of the Great Fire fraternity, whose
    four songs addressed to the Beast Gods were used for hastening delayed delivery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mother-in-law supplied mutton, cotton, and calico as advance payment to
    the theurgists; they arrived just as the male child was being delivered and then
    departed with the medicine of the Beast Gods and their rattles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the birth, the young woman was turned on her back, kneaded, and held by
    two women while a doctress assisted the infant's emergence; another doctress cut
    and tied the umbilical cord, and the placenta passed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The placenta was placed in a bowl and carried away by the maternal grandmother,
    who deposited it in the river with a prayer that the young mother might have many
    children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The mother bit a white pebble so that the child's teeth might be strong and
    white.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A footnote states that each doctress present at childbirth aimed to bring
    the child into the world so that, if it was a boy, he would enter the ki'wi'sinC
    of her husband; the note adds that there was no evidence of unfairness among the
    doctresses.
  category: relationship
  evidence_refs:
  - ev:7
