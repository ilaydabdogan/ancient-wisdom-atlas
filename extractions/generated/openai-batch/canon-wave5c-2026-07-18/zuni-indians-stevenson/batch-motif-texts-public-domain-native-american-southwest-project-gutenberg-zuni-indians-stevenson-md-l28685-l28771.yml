candidate_motifs:
- id: motif:1
  label: ritual healing through symbolic manipulation of bound plant form
  taxonomy_refs: []
  basis: The healing rite uses a tied yucca square, songs, medicine, and bodily manipulation,
    with the untying of knots tied to the patient's survival.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a passage-level ritual pattern; no specific external taxonomy
    reference is supplied for tied-object healing.
- id: motif:2
  label: four-direction or four-winds ritual structure
  taxonomy_refs: []
  basis: The yucca square is made of four stalks and explicitly described as symbolic
    of the four winds; four songs and four knots structure the rite.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage specifies four winds but does not expand the cosmology beyond
    the rite.
- id: motif:3
  label: divine medicine received during sacred journey
  taxonomy_refs:
  - departure
  basis: In the origin legend, the Shumai'koli enter this world, travel under the
    Sun Father's command, and receive medicine that cures their feet.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents a divine-command
    journey rather than a full hero departure cycle.
- id: motif:4
  label: descent into still water as divine dwelling
  taxonomy_refs: []
  basis: The Shumai'koli descend into a body of water whose waters flow in no direction
    and are then said to live both there and at Chi'pia.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not explain the symbolic meaning of the non-flowing water.
- id: motif:5
  label: mask taboo with dangerous adhesion and madness
  taxonomy_refs: []
  basis: A four-day home restriction precedes wearing a Shumai'koli mask; violation
    is said to make the mask stick to the face, break the skin, cause madness, and
    result in death.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports this as a ritual danger but does not provide a broader
    narrative context.
- id: motif:6
  label: initiation into restricted ritual knowledge enabling divine impersonation
  taxonomy_refs:
  - initiation
  basis: The Sia youth is initiated into Ko'tikili, taught prayer-plume offerings
    and prayers, and thereby becomes able to impersonate Ko'yemshi.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: This is an ethnographic ritual account rather than a mythic initiation
    tale.
- id: motif:7
  label: interchange of rites and masks among Pueblo communities
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes Sia masks being given to the Zuni Shu'maakwe and Zuni
    specialists initiating and teaching a Sia youth in return.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The taxonomy reference is general and should not be read as implying a
    mythic exchange beyond the reported ritual transfer.
- id: motif:8
  label: culture hero located near divine dwelling
  taxonomy_refs:
  - culture_hero
  basis: Po'shaiyiinki is identified as a Zuni culture hero, with his home Shi'papolima
    located near Chi'pia, where the Shumai'koli are said to live.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Po'shaiyiinki is only mentioned briefly and does not act in this passage.
comparison_claims:
- id: claim:1
  claim: The passage reports that Shumai'koli masks are present in both Zuni-related
    Shu'maakwe contexts and in Hopi and Sia villages, indicating a shared or closely
    comparable Pueblo mask-personation pattern.
  claim_level: same_motif
  target: Shumai'koli mask/personation among Hopi and Sia villages compared with Zuni
    Shu'maakwe practice
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself raises uncertainty about which tribe originated
    these gods, and the statement about other Rio Grande Indians is presented as the
    author's inference.
- id: claim:2
  claim: 'The described exchange between Zuni and Sia ritual specialists supports
    a cautious comparison at the level of shared ritual function: masks, prayer plumes,
    initiation, and divine impersonation circulate as restricted ritual knowledge.'
  claim_level: same_function
  target: Zuni-Sia exchange of masks and Ko'yemshi impersonation knowledge within
    Pueblo ritual traditions
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the specific exchange described; it does not
    establish general historical origin for the rites.
