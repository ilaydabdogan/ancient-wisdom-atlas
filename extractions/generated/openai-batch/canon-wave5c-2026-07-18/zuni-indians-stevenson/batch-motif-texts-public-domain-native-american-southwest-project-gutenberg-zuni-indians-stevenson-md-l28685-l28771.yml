  quote: ''
  summary: The passage describes the Shu'maakwe fraternity, its healing rite for convulsions,
    its patron Shumai'koli gods and their origin legend, mask restrictions, and an
    exchange of masks and initiation knowledge between Zuni and Sia ritual specialists.
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shu'maakwe name is derived from a word for spiral shell and is associated
    with treating a convulsive twisting disease.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described remedy includes urine sprinkled on a heated stone with crushed
    medicine, followed by carrying an adult patient in a blanket to the fraternity
    chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fraternity altar is erected and a meal painting is made before it for
    the healing procedure.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The director makes a square from four central stalks of yucca, described as
    symbolic of the four winds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: During four songs, the director manipulates the yucca square over the patient's
    head, back, arms, breast, legs, and feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After rolling the square between his hands, the yucca is expected to drop
    apart into its four original pieces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that if the director fails to undo the four knots during
    the rubbing, the patient would die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fraternity has Shumai'koli of the six regions and attendant Sai'apa warriors
    as patron gods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Shumai'koli are said to live in Chi'pia, in the east near Shi'papolima,
    the home of Po'shaiyiinki.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The Shu''maakwe fraternity comprises two orders: Shumai''koli and Fire.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the origin legend, the Shumai'koli came to this world through Ji'mi'klanapk'iatea
    in the northwest and were commanded by the Sun Father to go to his house in the
    east.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sun Father gave the Shumai'koli and their companions two kinds of medicine
    for foot soreness, one to drink and one to use externally.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Shumai'koli and their people later moved by command to Chi'pia and later
    descended into a body of water whose waters did not flow toward any of the four
    directions.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage says the Shumai'koli live in both the waters and Chi'pia, with
    representatives of the six regions at each place.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: A man must remain four days in his home before wearing a Shumai'koli mask.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage states that failure to observe the four-day requirement would
    cause the mask to stick to the face, break the skin, and lead to madness and death
    in four days.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage reports that Shumai'koli masks are found in Hopi and Sia villages
    and that Sia masks were given to the Zuni Shu'maakwe fraternity.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:18
  text: A Sia youth was initiated into the Zuni Ko'tikili fraternity and taught offerings
