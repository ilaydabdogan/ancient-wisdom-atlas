canonical_text:
  quote: ''
  summary: 'The passage describes a sunset sequence in an extended Zuni ceremonial:
    a party deposits water jugs and prayer plumes at He''patina; dancing, meal sprinkling,
    rocking of idols and fetishes, spear movements, and cedar-bark purification occur;
    idols are removed and a circle is formed around a pottery drum and water-and-seed
    vessel; the text explains a Coyote-clan scalp-custodian succession and links the
    dance songs to seven beings, Divine Ones, and the Gods of War at Han''lipinkia;
    the final circle dance continues into twilight and ends in silence.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: As sunset approaches, the pe'kwin, elder brother Bow priest, and two 'kia'punakwe
    go through the southwest covered way to He'patina to deposit jugs of water and
    prayer plumes taken from the cloud symbol, then return within about thirty minutes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ha'shiya continue dancing; each set begins with bent knees to slow, soft
    choir music, after which the song becomes louder and faster and the dance intensifies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pa'mosono'kia and her vice wear mi'ha garments and white fluffy eagle
    plumes on the forelock and receive bits of cedar bark from the pa'mosona and his
    vice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first body of A'shiwanni sprinkle the meal painting and nearby objects
    with meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder brother Bow priest stoops behind the image of U'yuyewi and the younger
    brother Bow priest stoops behind the image of Ma'sai'lema, each placing his hands
    on the idol before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A warrior holds the po'nepoyanne, other fetishes are held by the pe'kwin and
    others, and the idols and fetishes are not lifted but gently rocked on the ground
    from right to left.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Two guardsmen move their spears in the same right-to-left manner until sunset,
    when dancing on each side of the te'wita ceases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The pa'mosono'kia, her vice, and others expectorate on cedar bark and wave
    it with their left hands around their heads for physical purification.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The idols and paraphernalia are removed from the painting and returned to
    the parties who brought them to the plaza.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A group forms at the center of the plaza by an ancient pottery drum that contains
    a decorated archaic vase filled with water and seeds; a larger circle forms around
    this group.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: The circle includes the victor, his elder brother, the other A'pi'lashiwanni,
    the first body of A'shiwanni, and women; hands are not held, but women catch hold
    of men's blankets.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: The passage reports that in the original ceremonial at Han'lipinkia, a son
    of the drummer associated with the Coyote clan held the scalps, later became drummer
    after his father's death, and another Coyote-clan man held the scalps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: In the dramatization described, the scalp holder is either of the Coyote clan
    or a child of the clan and continues to take the place of the deceased drummer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The songs accompanying the dance are said to be the same as those sung when
    seven beings appeared from the earth at Han'lipinkia by commands of the Gods of
    War.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: For the circle, each man's paternal aunt or nearest female relative on that
    side stands to his left and is referred to as elder sister.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: The circle dance continues into the gloaming until all songs given by the
    Divine Ones at Han'lipinkia have been sung; the step is slow, from left to right,
    and synchronized with the song.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: When the final dance ceases, all participants disperse quietly, and no one
    speaks.
  category: sequence
  evidence_refs:
  - ev:6
