canonical_text:
  quote: ''
  summary: 'The passage describes a ceremony of the Great Fire fraternity: male and
    female members prepare with specified body paint, clothing, feathers, beads, swords,
    rattles, plumes, and office-specific objects; a woman with a meal basket leads
    them in procession to the plaza; the fraternity dances around boxes associated
    with the Hle''wekwe, prays, reverses and swallows swords, faces multiple directions
    including zenith and nadir, and the leader collects, blesses, motions the swords
    toward the six regions, and redistributes them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the ceremony described is the same as one described
    elsewhere at the close of initiatory ceremonies of the order of O'naya'nakia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male members have chins painted black and streaked with white, explicitly
    described as symbolic of rain clouds with falling rain; other body areas are painted
    black, yellow, and white in specified patterns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Male members wear dance moccasins, beads, hair tied with red yarn or a red
    garter, a yucca wreath, eagle-tail feathers, parrot feathers, and necklaces, and
    they carry rattles in the right hand and swords in the left.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Specific officers or office holders carry distinctive items: a crooked prayer
    plume, a cloud-designed tablet with sun and star, and serpentiform swords described
    as denoting lightning.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Female members wear ordinary dress with moccasins, a folded mi'ha, turquoise
    earrings, necklaces, an eagle plume on the forelock, and carry a sword in the
    left hand and two eagle-wing plumes in the right.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A woman carrying a meal basket leads the dancers in single file through the
    southeastern covered way to the plaza and around an excavation where prayer plumes
    had been deposited the previous night to Na'ke'e.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Great Fire fraternity passes once around the boxes of the Hle'wekwe before
    dancing; musicians on notched sticks sit with bowed heads and do not play.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Each dance begins with a shout and continues with monotonous song while dancers
    alternately raise their feet and encircle the boxes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The 'Hlem'mosona leaves the moving circle, the dancers stop and resume together,
    reverse their swords, and the 'Hlem'mosona waves a serpentiform sword over the
    boxes and prays.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After praying, the 'Hlem'mosona swallows his sword; later groups of dancers
    also leave the circle and swallow swords, with some swallowing two swords and
    one man swallowing three.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Sword-swallowing groups face north, west, south, east, and directions identified
    as zenith and nadir; the Great Mother swallows two swords at once.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The dancers circle the boxes five times, swallowing swords each time.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The 'Hlem'mosona collects the swords, stands in the center facing east, prays,
    motions the swords to the six regions, and returns them to the dancers.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A footnote says a warrior wanted a lightning sword, but the 'Hlem'mosona objected
    because the warrior had not been a member long enough for the goodness of his
    heart to be tested.
  category: relationship
  evidence_refs:
  - ev:11
