  quote: ''
  summary: The passage explains Zuni winter solstice ceremonies. A phrase referring
    to the Sun Father reaching a middle place is interpreted as the shortest day of
    the year. The first collective planting of prayer plumes marks the solstice, and
    the winter celebration is assigned to a December date. The sun priest is responsible
    for calendrical calculation; a recent change of office and dispute in 1896 are
    described, including the dismissal of a former sun priest by the Priestess of
    fecundity and confirmation of the new sun priest's timing after discussion by
    rain priests and others. A note explains that the Sun Father is thought to pause
    at a southwestern point and then return on his course.
  language: English with Zuni terms
