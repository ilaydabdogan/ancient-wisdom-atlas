  claim: The passage presents a shared postmortem mi'li-processing pattern for the
    Mystery medicine order and Shu'maakwe, while distinguishing the divine recipients
    of prayer.
  claim_level: same_function
  target: Mystery medicine order and Shu'maakwe postmortem mi'li rites
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the passage only; it does not
    establish historical contact or broader distribution beyond the fraternities named.
- id: claim:2
  claim: The passage treats the mi'li or mi'wachi as a recurring fraternity ritual
    object across several groups, but with differing forms, associated orders, and
    rules for destruction or preservation.
  claim_level: same_motif
  target: Mi'li or mi'wachi use among Mystery medicine, 'Hle'wekwe, 'San'iakiakwe,
    Shu'maakwe, and Shi'wannakwe
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The shared term and object category are clear, but the passage emphasizes
    variation; identical function should not be assumed for all fraternities.
