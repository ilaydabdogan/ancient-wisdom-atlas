canonical_text:
  quote: ''
  summary: The passage describes Zuni fraternity ritual objects called mi'li or mi'wachi,
    their construction, divine associations, variant forms among several fraternities,
    and procedures after a member's death, including making prayer plumes, depositing
    them in a river, planting corn from a disintegrated object, or preserving and
    transferring the object.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Healing of the body is said to depend on the will of the Supreme Power, and
    the medicine of the Beast Gods is said to require blessing by A'wonawil'ona.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person initiated into the order of Mystery medicine possesses a mi'li constructed
    by the fraternity father in the ceremonial chamber while five songs are sung in
    the presence of members.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The songs used in constructing the mi'li are addressed to A'wonawil'ona, the
    Sun Father, the Moon Mother, the Beast Gods of the six regions, and A'chiyala'topa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When completed, the mi'li is placed by the altar until it is given to the
    novice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The 'Hle'wekwe has a Sword order but no order of Mystery medicine; it has
    one mi'li composed of an ear of corn, eight turkey-tail plumes, smaller bird feathers,
    and a po'nepoyanne, and it possesses an et'tone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: "'San'iakiakwe has no order of Mystery medicine, but each member has a mi'li
    made of an ear of corn surrounded by eight turkey-tail plumes; the fraternity
    was organized for the chase and was initiated into the mystery of playing with
    fire."
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Shu'maakwe has no order of Mystery medicine, but members with pierced nasal
    septa possess a distinct mi'li built over an ear of corn and covered with plumes
    attached to four slender prayer-plume sticks, with a la'showanne hanging from
    each tip.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Shu'maakwe mi'li includes a taller central stick with zigzag marking identified
    as symbolic of lightning, with blue coloring on the upper part and a white fluffy
    eagle plume at the tip.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: All mi'wachi are associated with A'wonawil'ona; the Shu'maakwe mi'li described
    has a base wrapped with white cotton cord and shell adornments called necklaces
    of the mi'wachi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The po'nepoyanne is described as a bundle involving an ear of corn, reeds
    containing pellets of epidermis from body rubbing, raw cotton, cotton cord, and
    wild-eagle wing feathers found by fraternity members.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the fourth morning after the death of a Mystery medicine member, the director
    takes apart the deceased person's mi'li, and each member prepares a prayer plume
    from its plumes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: As each prayer plume is completed, its maker prays to the Beast Gods for intercession
    with the rain-makers for rain, draws from the plumes the breath of A'wonawil'ona,
    and prays for happiness, long life, and awakening in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The director gathers the prayer plumes into a kia'etehine and deposits it
    in the river so that the spiritual essence of the plumes and prayers may be carried
    to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The same process is observed with the mi'li of a deceased Shu'maakwe, but
    the prayers are offered to the Shumai'koli gods for rains, happiness, and long
    life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a mi'li is disintegrated, seeds from the corn-cob cavity and grains from
    the cob are distributed to members of the order, who plant them in their fields
    in the coming year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Shi'wannakwe do not destroy their mi'wachi; a deceased member's mi'li
    is kept in his house until his son is old enough to join the fraternity, unless
    there is no son or the son does not wish to join, in which case the director chooses
    another recipient.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The writer reports receiving sacred objects from fraternities, including a
    Mystery medicine mi'li prepared by Nai'uchi and presented with the same prayer
    and ceremony as for a novice; Nai'uchi also lent his own mi'li briefly under a
    restriction on who could see it.
  category: relationship
  evidence_refs:
  - ev:9
