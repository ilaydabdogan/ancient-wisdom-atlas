candidate_motifs:
- id: motif:1
  label: Initiation through a consecrated ritual object
  taxonomy_refs:
  - initiation
  basis: Initiated persons possess a mi'li constructed in a ceremonial chamber with
    songs to named divine beings and later given to the novice; the writer's received
    mi'li is also described as presented with novice-like prayer and ceremony.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: This is a passage-level ritual description, not a full initiation narrative.
- id: motif:2
  label: Divine sanction of healing medicine
  taxonomy_refs: []
  basis: The passage states that bodily healing must come by the will of the Supreme
    Power and that the medicine of the Beast Gods has no value unless blessed by A'wonawil'ona.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No broader healing episode is narrated in this passage.
- id: motif:3
  label: Prayer offering carried to gods through plumes and river
  taxonomy_refs:
  - sacred_exchange
  basis: Prayer plumes made from a deceased member's mi'li are gathered into a kia'etehine
    and placed in the river so the spiritual essence of the plumes and prayers may
    be carried to the gods in connection with requests for rain, happiness, and long
    life.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy link to sacred exchange is interpretive; the passage gives
    prayers and deposit but does not frame it as exchange explicitly.
- id: motif:4
  label: Death-related ritual transition and hoped awakening
  taxonomy_refs:
  - death_rebirth
  basis: After a member's death, the mi'li is dismantled, prayer plumes are prepared,
    and prayers include that people may sleep to awake in Ko'thluwala'wa.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage records a prayer formula and rite, not a narrative of literal
    rebirth.
- id: motif:5
  label: Planting from a disintegrated sacred object
  taxonomy_refs:
  - seasonal_cycle
  basis: Seeds and grains from a disintegrated mi'li's corn component are distributed
    to members and planted in fields in the coming year.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The seasonal-cycle taxonomy is suggested by planting in the coming year;
    the passage does not elaborate agricultural mythic meaning.
- id: motif:6
  label: Transmission of a sacred object to an heir or chosen successor
  taxonomy_refs: []
  basis: The Shi'wannakwe preserve the deceased member's mi'li for his son if the
