canonical_text:
  quote: ''
  summary: The passage gives two Native accounts of the Zuni revolt of 1680. In the
    first, Zunis retreat to Corn mountain, poison springs, prepare missiles, use shells
    with magic medicine against Spaniards, and have a Spanish priest send a written
    message proving his safety. In Tu'maka's account, Zunis plan an armed church attack,
    spare the priest, return to Corn mountain, receive warning from Laguna Indians,
    and instruct them about poisoned water, water carried in hides, cedar twigs, and
    poisoned shells.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer says accounts of the revolt were obtained from an unnamed shi'wanni
    and from Tu'maka, a theurgist of an esoteric fraternity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the shi'wanni's account, after Pueblo Indians planned the revolt, the Zunis
    went to To'wa yal'liinne, identified as Corn mountain, and prepared for defense.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the way to the mesa, the Zunis poisoned springs and placed stones near
    the brink of the mesa for use as missiles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Spanish priest accompanied the Zunis to the mesa and is described as having
    adopted Zuni dress because he had no other clothing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Spaniards who came to avenge the supposed death of the priest were met by
    missiles from the mesa and by small shells filled with magic medicine from the
    keeper of the great shell and his deputy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rain priests prepared buckskin and asked the foreign priest to write that
    he was safe and beloved by the Zunis; the rolled skin was weighted with a stone
    and thrown down into the valley, after which the Spaniards retired.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tu'maka's account says that after the old church was built in I'ti wanna,
    a Spanish priest lived permanently at the village, and the Zunis came to believe
    that Spaniards intended to destroy them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Zunis told women and children not to attend services on a certain day,
    while men hid bows and arrows under blankets and went to the church.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In Tu'maka's account, the church doors were locked and those inside were killed
    except for the priest and one other; the priest was stripped of vestments and
    made to wear Zuni dress.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The keeper of the great shell is named as the leader of the revolt and said
    he had medicine to destroy the enemy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The keeper of the great shell declared that it would be best to return to
    To'wa yal'liinne for better protection from the enemy.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: While on To'wa yal'liinne, Zunis saw a distant fire; men sent to investigate
    found Laguna Indians, who warned that Spaniards and Indians would attack soon
    and said they had escaped from the Spanish march.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Zunis instructed the Laguna Indians to fill hides with water, avoid Zuni-country
    spring water because it would be poisoned, and hold cedar twig in their mouths
    for protection from poisoned shells.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: When the enemy was discovered approaching, the keeper of the great shell and
    his deputy were in their house; they were called three times to help but did not
    appear.
  category: sequence
  evidence_refs:
  - ev:13
