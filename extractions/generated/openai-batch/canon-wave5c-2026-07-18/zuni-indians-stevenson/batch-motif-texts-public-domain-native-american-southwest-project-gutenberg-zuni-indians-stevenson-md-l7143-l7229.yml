canonical_text:
  quote: ''
  summary: 'English ethnographic passage describing a ceremonial night in the ki''wi''sine:
    masked personators, initiated male spectators, enforcement of wakefulness, singing,
    smoking and popcorn water, watching for the Morning Star, kindling fire by friction,
    and a procession carrying meal, corn, offerings, firebrands, bows, arrows, and
    yucca.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Masks deposited by the meal painting are removed and worn by Sa'ya'hlia personators,
    who appear briefly as warriors in the village streets and then return to the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The personators of Shits'ukia and Kwe'lele wear their masks throughout the
    night and move continually without taking seats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The personator of Pau'tiwa appears after dark; his mask is removed and placed
    by the meal painting while he sits behind it between men of the Dogwood and Sun
    clans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male spectators who have passed voluntary initiation are permitted to enter
    the ki'wi'sine.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sa'ya'hlia, Shits'ukia, and Kwe'lele whip those found dozing or attempting
    to leave; no one may sleep or leave before morning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members of the Great Fire fraternity and of the He'iwa ki'wi'sine alternate
    in singing with rattle and drum accompaniment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: There is constant smoking, popcorn water is drunk, and no grease-contaminated
    article may be used to dip the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Songs and dancing continue until the Morning Star appears, watched for by
    men who ascend a ladder to the hatchway.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kwe'lele and the director of the order of Kok'ko 'hlan'na make fire by friction
    with fire sticks and crushed cedar fiber; the director produces sparks that ignite
    the fiber.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that breath must not be blown on the burning fiber because
    this would offend the gods and prevent rain.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Firebrands are lit, and a procession leaves the ki'wi'sine in a fixed order
    while participants carry ritual objects and sprinkle meal.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
- id: obs:12
  text: An authorial note reports that steel knives were used for fashioning te'likinawe
    and that silver spoons were used with popcorn water.
  category: object
  evidence_refs:
  - ev:5
