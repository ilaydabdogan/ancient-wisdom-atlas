canonical_text:
  quote: ''
  summary: The passage describes a sequence in the ki'wi'sine involving Bi'si'si,
    ritual officers, meal lines, offerings of fruit and seeds, silence, prayer, transfer
    of a whistle, sacred breath, greeting, distribution of consecrated water, deposition
    of te'likinawe for Corn Maidens and ancestral gods, and later removal of donations
    for the Ko'yemshi. A note states that the scenes dramatize the rediscovery of
    the Corn Maidens and re-creation of corn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small whistle used by Bi'si'si is described as made of vegetable matter
    and less than an inch long.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bi'si'si blows the whistle, stands west of the hatchway facing east, offers
    a short prayer, and follows the mo'lawa into the ki'wi'sine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ritual officers sprinkle meal along a meal line and place a basket containing
    watermelons and seeds near the mi'li of the Kia'kwemosi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bi'si'si stands with folded arms behind the meal painting, and no one speaks
    during this part of the ceremonial.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If anyone sleeps or dozes while Bi'si'si is in the ki'wi'sine, Bi'si'si must
    remain seated until the sleeper awakens.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The younger brother Bow priest lights cedar fiber at the fire altar when a
    cigarette is to be lit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bi'si'si deposits the whistle from his mouth into the right hand of his ceremonial
    father, who is described as director of the Ne'wekwe fraternity on this occasion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ceremonial father prays for rain and fruits of the earth, makes a circular
    hand motion symbolic of all the world, and joins the others in drawing the sacred
    breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bi'si'si speaks a greeting for the first time, the others reply, and the general
    silence is broken after he takes his seat by his ceremonial father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pe'kwin removes offerings from the basket and returns each offering to
    its owner.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ko'mosona administers consecrated water with a shell to the mo'lawe and
    then to other named ritual participants in a stated order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Recipients of the consecrated water address the Ko'mosona with kinship terms,
    and the Ko'mosona replies with kinship terms, including a different reply for
    the Bow priests.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After all have received water, the Ko'mosona sprays a mouthful of water through
    his teeth over those present and then drinks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Bi'si'si prays at the west end of the room and leads the mo'lawe out to Ku'shilowa
    to deposit te'likinawe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Bi'si'si's te'likinawe are offered to A'towa e'washtokii, identified parenthetically
    as Corn Maidens; each stick is colored for one of the six regions.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: The mo'lawe offer te'likinawe to all the ancestral gods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: A passage note states that the scenes in the ki'wi'sine are a dramatization
    of the rediscovery of the Corn Maidens and re-creation of corn.
  category: other
  evidence_refs:
  - ev:8
- id: obs:18
  text: After Bi'si'si and the mo'lawe leave the plaza, offerings are removed to the
    Ko'yemshi by clan members of the paternal parents of the Ko'yemshi, with each
    Ko'yemshi helping with his own gifts.
  category: action
  evidence_refs:
  - ev:9
