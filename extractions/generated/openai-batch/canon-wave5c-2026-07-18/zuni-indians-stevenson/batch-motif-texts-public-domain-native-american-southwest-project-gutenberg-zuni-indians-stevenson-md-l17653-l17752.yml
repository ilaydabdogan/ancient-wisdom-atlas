canonical_text:
  quote: Both of these games are for rain to water the earth that the crops may grow.
  summary: The passage introduces Zuni ceremonial games as religious and social practices,
    especially rain-bringing rites. It lists attributed origins for named games and
    describes the early preparations for an annual Ti'kwawe race, including Bow priesthood
    meetings, prayer-plume offerings to deities and deceased Bow priests, hidden deposits
    around the village, ceremonies through sunrise, and a public announcement of the
    race.
  language: English with transcribed Zuni terms
  quote_policy: quoted
