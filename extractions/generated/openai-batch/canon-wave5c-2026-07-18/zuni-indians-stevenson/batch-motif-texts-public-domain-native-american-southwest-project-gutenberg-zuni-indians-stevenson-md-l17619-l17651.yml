canonical_text:
  quote: ''
  summary: 'A mortuary sequence is described for Nai''uchi: his belongings are bundled,
    placed on a roof overnight, then carried with prayer plumes to a burial place,
    where excavations are made and meal is sprinkled over plumes after prayers. His
    mask is not buried because he had not worn it or danced with the personators of
    anthropic gods since his hair was cut while imprisoned after hanging a supposed
    witch; the mask will pass to a male family member. In''nocita fears the witch
    and possible spirit activity around the house, removes stones she suspects were
    placed by the witch, and asks for doors and windows to be fastened while the writer
    keeps watch by an open window.'
  language: English
  quote_policy: summarized
