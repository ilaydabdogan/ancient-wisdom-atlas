candidate_motifs:
- id: motif:1
  label: Departure during hunger to seek game
  taxonomy_refs:
  - departure
  basis: Shits'ukla leaves after hunger and lack of meat, deciding to travel west
    to look for deer.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The available taxonomy label is broad; the passage describes a hunting
    departure rather than a complete departure-return cycle.
- id: motif:2
  label: Lightning indicating the direction of hidden game
  taxonomy_refs: []
  basis: Shits'ukla chooses to go west because lightning came from that direction
    and later explains that he looked in the direction of the lightning and found
    the game.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly state that lightning is a divine sign;
    it is only used by Shits'ukla as a directional clue.
- id: motif:3
  label: Kinship and marriage provide access to game
  taxonomy_refs:
  - sacred_exchange
  basis: The Kwal'ashi father adopts Shits'ukla, offers him a daughter as wife, and
    then shows him the game; Pau'tiwa later promises another girl as wife when Shits'ukla
    brings deer.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: medium
  cautions: The first marriage is not explicitly framed as payment for game; the exchange
    pattern is clearer in Pau'tiwa's promise.
- id: motif:4
  label: Prey animal voluntarily offers itself
  taxonomy_refs: []
  basis: When Shits'ukla asks which game animal he should kill, an elk replies that
    he should kill it.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents the elk's consent plainly but does not elaborate
    a ritual context.
- id: motif:5
  label: Planned theft of all game to feed hungry people
  taxonomy_refs:
  - sacred_theft
  basis: Shits'ukla says he will steal all the game, and Pau'tiwa says he will be
    content with this because his people are hungry for meat.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Within this excerpt the theft is planned and approved but not yet completed.
- id: motif:6
  label: Rapid growth and ripening of planted corn
  taxonomy_refs: []
  basis: Pau'tiwa says the corn will be ripe in four days; by the next morning it
    is already more than a foot high, and Shits'ukla later expects it to be ripe enough
    to roast.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The rapid growth is narrated, but no explicit cause is given in the passage.
- id: motif:7
  label: Wiser seeker succeeds where eagle and hawk fail
  taxonomy_refs:
  - wisdom
  basis: Pau'tiwa says eagle and hawk were sent for game and returned without seeing
    it, but Shits'ukla is wiser than the others.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The wisdom label is based on Pau'tiwa's explicit statement; the broader
    motif function is limited to this comparison.
