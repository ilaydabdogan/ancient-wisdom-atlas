canonical_text:
  quote: ''
  summary: The passage narrates hunger among the gods of Chi'pia and the ancestral
    gods of the A'shiwi. Shits'ukla travels west toward the source of lightning to
    seek deer, meets two Kwal'ashi kwin'na sisters washing buckskin, is taken to their
    high mountain home, adopted by their father, and given the elder daughter as wife.
    The father shows him abundant game, including an elk that offers itself to be
    killed. Shits'ukla kills and dries meat, plants corn, carries meat to Ko'thluwala'wa,
    tells Pau'tiwa about finding the game, and says he will steal all the game. Pau'tiwa
    approves because his people are hungry, promises him another wife when he brings
    deer, and says eagle and hawk had failed to find game. Shits'ukla's corn grows
    rapidly, and he continues hunting and drying meat.
  language: English
  quote_policy: summarized
