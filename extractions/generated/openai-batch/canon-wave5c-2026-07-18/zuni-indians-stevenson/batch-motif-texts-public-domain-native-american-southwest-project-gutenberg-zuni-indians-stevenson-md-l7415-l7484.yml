- id: ev:1
  type: summary
  locator: 7415-7421
  quote_or_summary: The gods of Chi'pia are hungry for meat after a long absence of
    rain and a little lightning; Shits'ukla tells Kwe'lele he will seek deer, while
    the ancestral gods of the A'shiwi are also hungry. Shits'ukla and Kwe'lele are
    so hungry that they eat moccasins, and Shits'ukla eats deer-tail earrings before
    departing.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:2
  type: summary
  locator: 7421-7429
  quote_or_summary: Shits'ukla finds no game, goes west toward the source of lightning,
    travels barefoot and poorly clad with a little sweet corn meal and seeds, and
    on the fourth day reaches tall grass where two sisters are washing buckskin and
    hide it under a large pottery bowl.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:3
  type: summary
  locator: 7429-7439
  quote_or_summary: The sisters reveal the buckskin and invite Shits'ukla home. They
    are Kwal'ashi kwin'na, or Black raven people, living in a high mountain. The father
    and mother question his arrival; the household has much meat. The father adopts
    Shits'ukla, offers one daughter as wife, and Shits'ukla chooses the elder daughter,
    later sleeping with her on a deerskin bed.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:4
  type: summary
  locator: 7439-7445
  quote_or_summary: The father shows Shits'ukla game animals, naming elk, deer, antelope,
    rabbits, and rats; he greets them as children and they answer. Shits'ukla asks
    which he should kill, an elk says to kill it, and he kills and flays it. For four
    days he kills deer and dries the meat.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:5
  type: summary
  locator: 7445-7455
  quote_or_summary: Shits'ukla asks where to plant his corn, plants it, wraps meat
    in a skin, and goes to Ko'thluwala'wa instead of sleeping in the field. Pau'tiwa
    is delighted by the meat and asks where the deer were found; Shits'ukla says he
    followed the lightning and found his children, then recounts meeting the Kwal'ashi
    people.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:6
  type: summary
  locator: 7455-7467
  quote_or_summary: Shits'ukla says he will steal all the game and tells of planting
    corn. Pau'tiwa says the corn will be ripe in four days and approves stealing the
    game because his people are hungry. Pau'tiwa brings in a beautiful girl as promised
    wife when deer are brought, and says eagle and hawk had failed to find game but
    Shits'ukla is wiser.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
- id: ev:7
  type: summary
  locator: 7467-7484
  quote_or_summary: Shits'ukla returns to the field and finds the corn already over
    a foot high. He hoes and sings until sunset, returns to the Kwal'ashi people,
    reports the corn is high, remains four nights, goes daily to the cornfield, kills
    many deer, dries meat, and expects the corn to be ripe for roasting on the fourth
    day.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/zuni-indians-stevenson.md
  rights_note: Rights status not supplied in metadata; evidence summarized.
