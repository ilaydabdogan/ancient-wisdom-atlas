canonical_text:
  quote: ''
  summary: The passage describes A'shiwi rain priests from the lower world, their
    sacred et'towe, a cloud meal painting made by Kow'wituma and Wats'usi, an ordered
    nightlong rain-prayer gathering, the dawn appearances of the morning star and
    sun, and Kia'kwemosi's offering of prayer plumes to Sun Father and Moon Mother.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the lower world, the A'shiwi had rain priests, and six were assigned to
    the six regions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each shi'wanni possessed an et'tone, described as the most sacred of the rain
    priests' fetishes, and brought it to this world wrapped in a straw mat in a crude
    basket pressed to his breast.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A footnote says the etymology of et'towe is unknown but that the word implies
    an invariable bringer of good.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:4
  text: Kow'wituma and Wats'usi, called the Divine Ones, made a meal painting of cumulus
    clouds on the ground and road, and the A'shiwanni placed their et'towe on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The participants were seated in an ordered arrangement beside the road, which
    is explicitly described as a dividing line.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ya'nowwuluha, described as a man of great heart and wisdom, sat before the
    meal painting north of the line, while the A'shiwi gathered around the painting
    on the north, west, and south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The gathered people sang songs of the Divine Ones for rain and for the earth
    to abound in grass seed, described as the only food then known to the A'shiwi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The singing continued in low tones until midnight; the Divine Ones and A'shiwanni
    then left the et'towe in place, ate, slept awhile, returned to the painting, and
    resumed prayers.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: At dawn, the morning star appeared faintly through delicate showers; the people
    called it their father, and the Divine Ones identified it instead as the Sun Father's
    warrior who comes before him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the sun appeared, the people fell on their faces in fear, and the Divine
    Ones told them not to be afraid because it was their Sun Father.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kia'kwemosi went over the eastern road, planted prayer plumes sent by the
    Sun Father through the Divine Ones, and prayed by giving the plumes to Sun Father
    and Moon Mother.
  category: action
  evidence_refs:
  - ev:9
