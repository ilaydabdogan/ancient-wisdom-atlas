literal_observations:
- id: obs:1
  text: The Zunis are described as agricultural and pastoral people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fields are said not to be owned by clans, and the Zunis are reported to claim
    they never were clan-owned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man may cultivate an unappropriated strip of land and, once it is in his
    possession, may transfer it to someone within the tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Land is obtained from an owner by trade, and houses are disposed of in the
    same manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: An old woman owning two houses sold the front house, which annoyed her female
    children because they feared an added story would block their view of the street.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The landed property of a married man or woman is said to go after death to
    daughters; sons are the next heirs if there are no girls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children may give part of inherited property, or some benefit from it, to
    poor sisters or brothers of a man, especially sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Disputes over property distribution are usually settled by civil authorities
    and sometimes brought to the first body of A'shiwanni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After marriage, a man's field products are carried to the house of his wife's
    parents, which becomes his home after marriage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The stored property of each man may be removed only by the man and his wife,
    according to an unwritten law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A wife's grain from fields given by her father or mother is placed with her
    husband's grain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the death of an owner, horses, cattle, sheep, and blankets are divided
    among the girls and boys of the family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The mother's silver beads and turquoise earrings go to daughters, while the
    father's coral, white shell, and turquoise necklaces and earrings go to the eldest
    son.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Small gardens around the villages are tended exclusively by women and inherited
    by daughters.
  category: relationship
  evidence_refs:
  - ev:5
