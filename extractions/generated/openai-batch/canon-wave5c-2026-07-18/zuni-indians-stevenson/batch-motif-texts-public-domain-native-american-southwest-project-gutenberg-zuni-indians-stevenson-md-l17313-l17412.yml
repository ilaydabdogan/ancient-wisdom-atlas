canonical_text:
  quote: Mother, I am going to the other world.
  summary: Ethnographic account of We'wha's final illness and death, including family
    attendance, a theurgic healing attempt, preparation and use of prayer plumes for
    the dying, death while holding the plumes, and immediate postmortem washing, meal-rubbing,
    and dressing.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: We'wha is described as orphaned early, adopted by a sister of her father,
    a member of the Badger clan, connected through her foster mother with the Dogwood
    clan, and frequently called upon to repeat long prayers or say grace over feasts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During an autumn Sha'liiko/Sha'lako ceremonial at her home, We'wha had valvular
    heart disease but did much of the preparatory labor, including laying a stone
    floor, and was too ill to attend the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the ceremonial, the writer found We'wha crouching on a ledge by the
    fireplace at sunset; she said she could not breathe if she lay down and thought
    her heart would break.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: We'wha's family remained with her during her serious illness, and the children
    stopped playing, stood silently, and asked her to speak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nai'uchi, called the great theurgist, came three times and performed an extraction
    from the heart region, described as removing bits of mutton allegedly shot there
    by a witch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Nai'uchi's last visit, We'wha's foster brother prepared prayer plumes
    for her because the theurgist had said her time on earth was short.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: We'wha told the writer that she was going to the other world, that she would
    tell the gods about several friends, and that the writer should love and protect
    We'wha's people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The text states that the usual custom is for a family member to hold prayer
    plumes near the mouth of the dying person and repeat the prayer, but this practice
    was not followed in We'wha's case because she held the plumes herself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: We'wha clasped the prayer plumes, tried to speak, leaned forward with them
    tightly held, and died as the setting sun lit the western windows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After death, blankets were spread on the floor, the brothers laid the body
    on them, and the body was bathed, rubbed with meal, and dressed in white cotton
    trousers.
  category: action
  evidence_refs:
  - ev:8
