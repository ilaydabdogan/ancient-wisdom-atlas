canonical_text:
  quote: ''
  summary: Pau'tiwa sends 'Kiiiklo to I'tiwanna to recount the people's history after
    leaving the undermost world and to prepare them for the gods' blessing of male
    children. 'Kiiiklo is given a duck-skin seed rattle and is carried by ten Ko'yemshi.
    The passage then describes the custodians of this history myth, their rehearsals
    and offerings, and a quadrennial drama in which personators reenact the divine
    visit, visit shrines at dawn, change into ritual dress, and carry 'Kiiiklo to
    the village while singing of emergence from the fourth world, looking to six regions,
    and calling for rains and seeds.
  language: English with Zuni terms
  quote_policy: summarized
