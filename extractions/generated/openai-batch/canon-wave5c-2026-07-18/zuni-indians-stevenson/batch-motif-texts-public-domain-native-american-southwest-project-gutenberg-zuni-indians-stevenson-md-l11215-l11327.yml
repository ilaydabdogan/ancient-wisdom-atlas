canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Zuni rain ceremony: ritual objects are
    placed or returned; mi''wachi are passed before dancers'' mouths for breath of
    life; ceremonially dressed youths and maidens sprinkle corn baskets and dancers;
    Bow priests use a tobacco reed and whirl rhombi; a procession visits He''patina,
    a shrine identified as symbolic of the Middle of the world; water, cloud vases,
    and ears of corn are deposited there with prayers; the party returns to the plaza
    and resumes dancing.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ear of corn is placed in stacked corn in a house; two te'likinawe are deposited
    south of the village on the road to the Snake fraternity shrine; a crook is returned
    to the elder brother Bow priest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of the Frog clan is called by the pe'kwin to take part because he possesses
    songs for ruins that mi'wachi and te'likinawe obey; since he has no crook, he
    must borrow one.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: During dancing, mi'wachi bearers pass mi'wachi before the lips or mouths of
    dancers so that the dancers may inhale the breath of life, described as the breath
    of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The 'kia'punakwe appear in ceremonial dress, led by the pe'kwin, and sprinkle
    baskets of corn on both sides using reeds dipped in gourd jugs of water and ears
    of corn dipped in cloud vessels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 'kia'punakwe form a line in the plaza facing east behind the 'kia'potiikwe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder brother Bow priest passes a lighted reed filled with native tobacco
    to the flutists, who stop playing one after another to take a puff.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ten mi'wachi bearers pass their mi'wachi before dancers, flutists, and people
    in the ham'pone, with prayers for a pure heart, health, and long life from A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder and younger brother Bow priests stand on opposite sides of the dancers
    and whirl rhombi so that the rain-makers may gather together and water the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the rhombi cease, the 'kia'punakwe sprinkle the dancers and then, with
    the pe'kwin and Bow priests, leave the plaza by the eastern covered way to visit
    He'patina.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: He'patina is described as a shrine symbolic of the Middle of the world, with
    an under room, an upper chamber, cloud vases, a removable eastern slab, and stones
    on its roof.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A center stone on the shrine has a form resembling a helmet mask and is called
    the mask of the Sa'lamobiya, described as warrior gods and seed bearers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: North of He'patina is a small enclosure where the A'shiwanni deposit te'likinawe.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: At He'patina, the party circles the shrine four times toward the left while
    the Bow priests whirl rhombi, then halts before it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The 'kia'punakwe empty water from their vessels into cloud vases in the upper
    chamber of the shrine; after prayers, the pe'kwin deposits the water-containing
    vases in the lower chamber.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The ears of corn carried by the maidens are left with their emptied vases
    in the upper chamber, explicitly symbolizing rains impregnating the earth so that
    she sends forth fruits.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The ancient jugs are carried away as property of the Kia'kwemosi; two cloud
    vessels used by the maidens were made for the occasion by women of the Dogwood
    and Corn clans.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: On return to the plaza, the 'kia'punakwe enter the line of dancers alternating
    with 'kia'potiikwe; mi'wachi bearers again pass fetishes before dancers and the
    ham'pone; the Bow priests leave through the eastern covered way.
  category: sequence
  evidence_refs:
  - ev:10
