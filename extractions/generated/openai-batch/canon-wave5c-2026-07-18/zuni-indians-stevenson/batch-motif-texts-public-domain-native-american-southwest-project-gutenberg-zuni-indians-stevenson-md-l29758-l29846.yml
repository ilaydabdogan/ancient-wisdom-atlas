canonical_text:
  quote: ''
  summary: The passage describes a quiet pre-ceremonial gathering with war stories
    and smoking, followed by the crowded opening of an initiation ceremonial. A choir,
    five novices, an a'kwamosi, a chief warrior, and other participants assemble around
    an altar. Medicine water is prepared amid drum, rattle, and flute music. Prayers
    invoke directional animal powers, Sun Father, Moon Mother, and ancient ones for
    power to see disease and remove it. A note explains three Beast-God medicines,
    their mountain sources, colored prayer plumes, propitiatory offerings, collection,
    and ritual or illness-related use.
  language: English
  quote_policy: summarized
