  quote: ''
  summary: The passage describes the sun priest's observations of sunrise, offerings
    of prayer plumes to the sun, moon, deceased sun priests, ancestors, rain-makers,
    lightning-makers, and war gods, and preparations by priestly groups for winter
    solstice ceremonies. It also notes the ceremonial chamber associated with the
    sacred fetish over the center of the world.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun priest observes sunrise daily at a petrified stump east of the village
    and sprinkles it with meal while praying to the rising sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the sun rises over a specified point, the sun priest informs the elder
    brother Bow priest, who notifies the first body of A'shiwanni for a night meeting
    in the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pe'kwin prepares four te'likinawe for the Sun Father and Moon Mother and
    deposits them at a shrine on To'wa yal'liinne.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sun and moon sticks are paired; each group has a blue stick for the sun
    and a yellow stick for the moon, described as the sister of the sun.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The te'likinawe sticks have black-tipped lower ends, beveled tops with three
    black dots for eyes and mouth, and attached eagle feathers and bird plumes of
    the six regions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: At four-day intervals the pe'kwin alternates depositing te'likinawe at the
    sun shrine and planting te'likinawe in cultivated fields for deceased a'pekwin
    or predecessors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pe'kwin observes continency around the period of plume planting and fasts
    from animal food after offerings made to the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the final planting, the pe'kwin announces that the winter solstice will
    occur in ten days, when the rising sun will strike the Middle place and return
    over its traveled road.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The first four days are used by the first body of A'shiwanni to prepare te'likinawe
    in the houses of the Kia'kwe amosi.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Priestess of Fecundity prepares cotton-cord loops symbolizing a sacred
    white blanket, while her te'likinawe are made by the first body of A'shiwanni.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Kia'kwemosi and the Shi'wanni of the Nadir each make an elongated te'likinane,
    respectively for rain-makers of the six regions or whole world and for lightning-makers
    associated with deceased Bow priests.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The elder and younger brother Bow priests prepare offerings to the Gods of
    War and to lightning-makers of each of the six regions.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The grouped te'likinawe are bound together into a kia'etchine and placed on
    a meal painting in the North ki'wi'sine on the fourth evening.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: A note states that the sacred fetish of the Shi'wanni of the North rests in
    a room immediately over the center of the world.
  category: setting
  evidence_refs:
  - ev:14
