canonical_text:
  quote: ''
  summary: The passage describes a ceremonial return toward Zuni involving a sacred
    firebrand, water jugs from springs near Ko'thluwala'wa, rhombi whirled for rain,
    the setting of fires to make smoke, meetings with masked Kor'kokshi, dances in
    several plazas, and the placement of fire, water, tortoises, cat-tails, and fetishes
    at fraternity altars.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
