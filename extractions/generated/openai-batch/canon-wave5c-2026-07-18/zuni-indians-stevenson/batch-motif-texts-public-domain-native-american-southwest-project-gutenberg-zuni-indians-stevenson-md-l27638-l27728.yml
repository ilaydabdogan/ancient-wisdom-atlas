- id: obs:5
  text: On the fourth day of the winter solstice festival, the warrior prepared a
    reed with cotton, corn pollen, red coloring, plumes, and a bead, and the reed
    was passed among officers and males present with repeated prayers.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The prayer spoken over the reed asks for rains, corn, horses, animal food,
