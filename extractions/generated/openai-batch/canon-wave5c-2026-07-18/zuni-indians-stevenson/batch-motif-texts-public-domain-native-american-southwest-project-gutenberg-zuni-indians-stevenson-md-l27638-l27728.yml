canonical_text:
  quote: ''
  summary: A white arrow point enters the ceremonial chamber through the hatchway.
    The director of the Great Fire fraternity interprets it as a gift from A'chiyala'topa,
    attaches it to a reed shaft, succeeds on the fourth attempt in swallowing it to
    his heart, and institutes an all-male Arrow order. The passage then describes
    winter-solstice and February ceremonial actions involving a prepared reed with
    cotton, corn pollen, plumes, and a bead; prayers for rain, food, animals, and
    clothing; placement of the reed on a tall tree near a War God shrine on O'pompia
    mountain; and preparations for arrow swallowing, including washing, hair dressing,
    body paint, rattles, meal sprinkling, and receiving an arrow from the Hlem'mosona.
  language: English
  quote_policy: summarized
