  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The next morning the warrior took the reed to O'pompia mountain, went to a
    shrine dedicated to the younger God of War, climbed a tall tree nearby, and attached
    the reed to the topmost limb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the tree, the warrior prayed to the spirit of the tree to intercede with
    the rain-makers for cold rains and snows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the Arrow order ceremony, participants wash their heads, dress their
    hair with yucca, attach a red-dyed eagle plume and a wand, paint parts of their
    bodies white, add lightning lines, wear wristlets and a breechcloth, and carry
    rattles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each participant receives in his left hand the arrow he is to swallow from
