canonical_text:
  quote: ''
  summary: The passage describes ceremonial actions of the Ma'ke Thlan'nakwe involving
    rhombus and flute use to bring snow and rain, nocturnal wakefulness, meal sprinkling,
    food offerings to deceased fraternity members at the river, preparation of medicine
    water, sword making, and a sword-swallowing initiation sequence for a novice under
    a fraternity father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rhombus and flute are used at this time to bring snows and rains quickly;
    a cough triggers flute playing, rhombus whirling, standing, breathing, and meal
    sprinkling on the altar and trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members must not sleep after the night action begins; a nodding member is
    awakened with lighted husks or sticks, and members sing and dance until sunrise.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The 'Hlem'mosona expresses a wish that all be happy and tells the flutist
    and warrior to remain and make rains and snows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five appointed men carry five heaps of food to the river as an offering to
    deceased members of the fraternity while the warrior whirls the rhombus and the
    flutist plays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 'Hlem'mosona gives spruce and piñon buds to the a'kwamosi, who prepares
    medicine water intended to protect the throat from injury by the sword.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The medicine water receives six pinches of buds and six stone fetishes before
    consecration.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Swords are made on the fourth morning; a novice makes his own sword under
    instruction from his fraternity father, while a woman's sword is made by her fraternity
    father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The swords are fashioned at the butt of a tree, rubbed with cougar grease
    and red hematite, and polished with six stone knives colored for the six regions.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: A turkey-feather la'showanne is attached to the top of the tree from which
    the sword is made, and the tree is deposited at the east end of the room with
    the sword pointing east.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before the initiation sequence, officers and members sprinkle the altar with
    meal and pass around it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The 'Hlem'mosona gives the novice a sprig of medicine, runs the tree through
    the roof hatchway, swallows the sword at the end of the tree, and passes it before
    the novice's lips and shoulders.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The deputy, other officers, members, and the fraternity father repeat the
    performance; the novice attempts but fails to swallow the sword, and the father
    passes the sword before the novice's lips while the novice breathes.
  category: sequence
  evidence_refs:
  - ev:9
