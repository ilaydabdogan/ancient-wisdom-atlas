canonical_text:
  quote: ''
  summary: The passage describes several Zuni games, their implements, rules, winning
    conditions, betting or amusement contexts, and some ceremonial contexts. One game
    with a black zigzag lightning-marked rod, a yucca ring, and a racing stick is
    said to be played only by order of the Great Father Ko'yemshi and used exclusively
    to bring rain. Another game is played by Ko'yemshi and Ne'wekwe members during
    intermissions of dances of anthropic gods in the sacred dance court.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: OAMKS is described as played like sho'wiyaltowe, except that players sit and
    throw a shorter distance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One described game uses a bow, arrows, and an oval wad or roll of green corn
    husks, with arrows shot at the wad from about 40 or 50 feet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the corn-husk target game, a player covers the struck wad with a mound
    of earth while the others turn their backs, and may shape the mound to mislead
    the other players about the wad's location.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Players take turns shooting at the buried roll of husks; the player who strikes
    it wins and draws the husk out with the arrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In sa'ya't'ldhnawe, goat horns are placed in a line, and a running player
    throws a rabbit stick toward them; the number of horns struck determines success.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In sho'wiyaltowe, players throw arrows so that the feathers on one arrow shaft
    touch those of an arrow already on the ground; successful contact lets the thrower
    take arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Disputes in sho'wiyaltowe can arise over whether arrow feathers are touching,
    leading players to examine the arrows closely.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ptfkli annawe uses an interlaced corn-husk pad with two feathers, and its
    sound on the palm is compared to the tread of a jack-rabbit on frozen snow.
  category: object
  evidence_refs:
  - ev:9
- id: obs:9
  text: Ptfkli annawe is played for stakes, with players wagering on a set number
    of one-handed tosses; ten is specially associated with the game.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The rain-associated game uses a slender black-zigzagged rod said to symbolize
    lightning, a yucca-ribbon ring, and a racing stick.
  category: object
  evidence_refs:
  - ev:11
- id: obs:11
  text: The rain-associated game is played only by order of the Great Father Ko'yemshi
    and is used exclusively to bring rain; women and men play with different implements.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: Pti'pone is played by Ko'yemshi and Ne'wekwe members during an intermission
    in dances of anthropic gods in the sacred dance court.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:13
  text: In Pti'pone, sides exchange members when a player is struck with a wool-filled
