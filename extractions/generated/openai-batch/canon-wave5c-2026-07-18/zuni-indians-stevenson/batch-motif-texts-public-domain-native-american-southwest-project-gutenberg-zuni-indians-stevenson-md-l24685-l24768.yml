canonical_text:
  quote: ''
  summary: 'Ethnographic description of a Thlewekwe ceremonial sequence: a kia''etchine,
    prayer plumes, and spring water are carried and offered at a spring with prayers
    for cold rains and snows; regional animal-warrior personators participate; ritual
    staffs and prayer plumes are later presented in the ceremonial chamber and at
    a shrine to the Gods of War; the returned spring water is placed with sacred objects
    and consecrated the next morning.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is headed as material concerning dry painting, fetishes, and wall
    decorations of the Thlewekwe, identified parenthetically as the Sword Swallower
    Fraternity.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bearer of the kia'etchine carries a long-necked gourd water jug in his left
    hand and the kia'etchine in his blanket over his left arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A hearer, described as a man of the Ko'loktakwe clan, accompanies the spring
    party and personates the original director.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four men follow the bearer in a specified order and represent beast warriors
    of the four regions.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The four regional personators are named as Cougar of the North, Bear of the
    West, Badger of the South, and White Wolf of the East; their prayer-plume sticks
    are colored yellow, blue, red, and white respectively.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Hlem'mosona leads the party a short distance beyond the village, wears
    white meal and white plume symbolism connected to snows, carries a meal basket
    and the mi'li, and sprinkles meal while proceeding.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the spring, the leader deposits the kia'etchine on a rock, the party stands
    around it and prays, and meal is sprinkled upon the plumes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The leader lights a black reed cigarette with cotton ignited by flint sparks,
    puffs smoke over the kia'etchine, prays for cold rains and snows, and places the
    remaining reed into the plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The four other men attach stones to the kia'etchine, deposit it in the middle
    of the spring, and place the other prayer plumes among rocks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bearer fills the gourd jug with water from the spring, and the five men
    return to the ceremonial house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Members of the A'pi'Miishiwanni chosen to make six tehl'nawe, together with
    the elder brother Bow priest, visit the Thlewekwe ceremonial chamber, present
    staffs to the Hlem'mosona with prayers, and the warriors sprinkle meal and pray
    before the hle'ettorie.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The elder and younger brother Bow priests deposit prayer plumes to the Gods
    of War at a shrine north of Zuni, each carrying an ancient tehl'nane to the shrine.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the spring party returns, the gourd jug of water is handed to the Hlem'mosona,
    placed with sacred objects by the meal painting overnight, and consecrated by
    the Hlem'mosona in the morning.
  category: sequence
  evidence_refs:
  - ev:10
