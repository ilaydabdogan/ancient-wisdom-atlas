canonical_text:
  quote: ''
  summary: 'The passage describes preparations and ritual actions before the coming
    of the Council of the Gods and the Sha''liiko/Sha''lako: public announcements,
    house preparation, Ko''yemshi retreat and wood gathering, offerings at the Sha''lako
    shrine, symbolic sand mounds and meal lines denoting mountains and four regions,
    a night fire procession, a further retreat by personators, and food offerings
    to the dead in household flames.'
  language: English with Zuni ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin instructs people to work, complete houses, bring much wood, make
    moccasins and clothes, and have women whiten and beautify house walls for the
    gods who are to come.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pe'kwin announces that the Council of the Gods will come in four days
    and the Sha'liiko will come in eight days.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speakers proceed to several named plazas, form a circle with two in the
    ring, and repeat the speeches in each plaza.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ko'yemshi disappear on the western road, return carrying masks and other
    items under blankets, and enter a ceremonial chamber connected with the Great
    Father Ko'yemshi's fraternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ko'yemshi remain in the house for eight days except for nighttime announcements
    about the gods and wood collection; each morning nine go for wood while one remains
    in the chamber.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wood is brought using burros, deposited before the new house to be dedicated
    by the Ko'yemshi, and stacked by the women of the house and members of their clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the Ko'yemshi retreat no altar is erected and they do not dance; evening
    prayers and songs occur, food is served by women, and the Ko'yemshi must observe
    continence and avoid touching a woman's hand.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chief wor'li and associates meet with people and fraternity members; songs
    are rehearsed, te'likinawe are prepared, and at sunset the wor'we deposit offerings
    at the Sha'lako shrine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sha'lako shrine is described as the house of the Sha'lako, located at
    the base of A'kohanna ti'nakwi, and as a low-walled rectangular enclosure with
    stones placed as seats.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Personators of the Council of the Gods and Sha'lako hold a council at the
    Sha'lako shrine before the ceremonial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Special shrines for Sa'yatasha and Shu'laawi'si are described near A'kohanna
    ti'nakwi, with quantities of te'likinawe visible at Sa'yatasha's shrine and among
    rock crevices.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chosen father of Shu'laawi'si deposits heaps of pinyon wood at the western
    base of I'shana an te'kiapoa, at intervals between that knoll and A'kohanna ti'nakwi,
    and at Shu'laawi'si's shrine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ko'mosona and Ko'pekwin make two sand mounds, one on each side of Sa'yatasha's
    seat or shrine, to symbolize two mountains near Ko'thluwala'wa; the seat itself
    is described as symbolic of Ko'thluwala'wa.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The sand mounds are covered with prayer meal; a line of meal is extended eastward
    from the shrine and crossed four times with meal, denoting the four regions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: At night a party proceeds to A'kohanna ti'nakwi in a stated order including
    the ceremonial father of Shu'laawi'si, Shu'laawi'si, Sa'yatasha, Ya'muhakto, Hu'tutu,
    a second Ya'muhakto, Ko'mosona, Ko'pekwin, and two Bow priests.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The father of Shu'laawi'si carries live coals from the house of the personator
    of Sa'yatasha, and Shu'laawi'si lights wood at his shrine and ignites his cedar
    brand.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: After the ceremonies at A'kohanna ti'nakwi, Shu'laawi'si lights six heaps
    of wood and two piles at the knoll with his fire brand; the party reaches He'patina
    by midnight, where prayers are sung.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: After announcing the coming of the Sha'lako in four days, those who will personate
    the Council of the Gods and the ceremonial father of Shu'laawi'si retreat for
    four days, collect wood each morning, observe continence, and avoid looking upon
    a woman's face.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: A member of the governor's staff calls from a house top that all must offer
    food to the dead, and each family member deposits food in the flames of the fireplace.
  category: action
  evidence_refs:
  - ev:12
