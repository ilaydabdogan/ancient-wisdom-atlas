candidate_motifs:
- id: motif:1
  label: Preparation for divine visitation
  taxonomy_refs: []
  basis: The passage repeatedly frames labor, house beautification, wood gathering,
    and announcements as preparation for the coming of the Council of the Gods and
    the Sha'liiko/Sha'lako.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a descriptive passage-level pattern; no external comparison is
    asserted.
- id: motif:2
  label: Ritual retreat with continence and contact restrictions
  taxonomy_refs:
  - initiation
  basis: Both the Ko'yemshi and later the personators enter timed retreats, collect
    wood, and observe continence and restrictions involving women.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  confidence: medium
  cautions: The passage describes retreat and restriction but does not explicitly
    call the action initiation; the taxonomy reference is therefore cautious.
- id: motif:3
  label: Sacred offering to gods, shrines, and dead
  taxonomy_refs:
  - sacred_exchange
  basis: Te'likinawe are prepared and deposited at the Sha'lako shrine and visible
    at Sa'yatasha's shrine, and food is offered to the dead in fireplace flames.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:12
  confidence: medium
  cautions: The text presents offerings, but does not describe a reciprocal exchange
    or outcome; the taxonomy link is interpretive.
- id: motif:4
  label: Ritual mapping of sacred mountains and four regions
  taxonomy_refs:
  - cosmic_mountain
  - world_center
  basis: Sand mounds are explicitly said to symbolize named mountains near Ko'thluwala'wa,
    while a meal line crossed four times denotes the four regions.
  evidence_refs:
  - ev:9
  confidence: low
  cautions: The passage gives explicit symbolic geography, but does not itself use
    the terms cosmic mountain or world center; taxonomy links need human review.
- id: motif:5
  label: Processional ignition of ritual fires
  taxonomy_refs: []
  basis: Live coals are carried to a shrine; Shu'laawi'si lights shrine wood, a cedar
    brand, and a sequence of wood heaps along the route before prayers are sung.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a literal ritual pattern in the passage; no broader comparative
    claim is made.
- id: motif:6
  label: Food for the dead placed in household fire
  taxonomy_refs:
  - sacred_exchange
  basis: A public call instructs all to offer food to the dead, and each family member
    deposits food in the fireplace flames.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The offering is explicit; classification under sacred exchange is provisional
    because the passage does not elaborate its expected effect.
