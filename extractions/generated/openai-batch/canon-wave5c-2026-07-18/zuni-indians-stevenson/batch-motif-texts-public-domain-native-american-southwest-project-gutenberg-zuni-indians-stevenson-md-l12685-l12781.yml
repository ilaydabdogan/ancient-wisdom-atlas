canonical_text:
  quote: ''
  summary: The passage describes food preparation, house and field labor, visits by
    A'toshle and Ko'yemshi to inspect household conduct, ritual trials and instruction,
    bathing at the river, prayers with meal offerings, a peach-orchard incident, removal
    and concealment of masks, and harvest-time preparations and feasting connected
    with Sha'lako observances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women, maidens, aged women, girls, and two baking women prepare feast foods
    by grinding, toasting meal, husking corn, baking he'we, and stewing meat, corn,
    and chili.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two meals are served to workers, one at midday and one at sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A'toshle and Ko'yemshi visit houses to learn whether inmates perform their
    duties and to ask about the behavior of husbands, wives, and children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In visited houses, complaints are made about a lazy husband, a daughter who
    will not grind, a frightened young boy, and boys said to be uncleanly and unwilling
    to bathe.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The gods wave stone knives above a four-year-old boy and threaten to cut off
    his head if he is naughty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Boys are commanded to go to the river, where Ko'yemshi join them in bathing
    before returning to the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a long prayer, the family sprinkles the gods with meal and prays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man returning from a peach orchard with a burro laden with fruit is stopped
    and tried for working in the orchard instead of helping build the house of the
    Kla'kwemosi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The orchard man is allowed to go unpunished after supplying the party with
    peaches, which Ko'yemshi carry to their house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gods return to the ki'wi'sine, remove masks and apparel, and young men
    carry the masks and paraphernalia concealed under blankets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Families remodeling houses for the Sha'lako festival have men detailed at
    harvest time to work in their fields, and the workers return at sunset for a repast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a roof feast, food is placed in a line, twenty-one persons sit on each
    side, and wives with babies receive their husbands and help serve the meal.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some fathers at the roof feast play with their babies before tasting the meal.
  category: action
  evidence_refs:
  - ev:7
