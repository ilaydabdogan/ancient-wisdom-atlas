canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions in a Thla''hewe rain ceremony:
    a meal cloud symbol and medicine bowl are set out, te''likinawe offerings are
    prepared and placed in corn baskets, water is consecrated with six sacred concretions,
    participants sit in ordered groups, and ears of corn are prayed over, seeded,
    sealed, and returned to baskets.'
  language: English with transliterated Zuni terms
  quote_policy: summarized
