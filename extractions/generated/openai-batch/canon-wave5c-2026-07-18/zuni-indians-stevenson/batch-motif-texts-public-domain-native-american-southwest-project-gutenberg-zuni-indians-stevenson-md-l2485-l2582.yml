canonical_text:
  quote: ''
  summary: 'The passage narrates events at Kia''nanaknana spring after a world fire:
    Hli''akwa/Turquoise arrives and recounts how Bow priests and women were trapped
    and became rattlesnakes; Ma''we decides to go far away with Hli''akwa and the
    Gods of War; Ma''we assigns future care of the spring to the Frog clan; an associated
    spring-cleaning rite with bowls, prayer plumes, and prayers for rain and crops
    is described; Ma''we and Hli''akwa later assume bird form, and Ma''we creates
    a rock opening and a petrified eagle-plume monument.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The setting is Kia'nanaknana, described as a spring at the black rocks east
    of present Zuni and as the home of Ma'we'sita.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening locates the events four years after U'yuyewi and Ma'sai'lema set
    fire to the world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hli'akwa, identified as Turquoise from Wehl'hluwwalla/Santo Domingo, says
    he left because he was of no value there and had been given by Bow priests to
    women as payment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hli'akwa says one bird shot small stones from its mouth and another caused
    a rock to fall over the entrance to his home, leaving only a crevice for bread
    and water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people sealed inside died after four days and were discovered to have
    become large, short, thick rattlesnakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ma'we says she is too near her people to be of value and will go far away;
    the Gods of War address her as Mother and say they will go with her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before leaving, Ma'we asks a youth of the Frog clan that his people come in
    four years to put her house in good order; the passage says the Frog clan has
    cared for the spring since then.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The spring-cleaning rite is ordered by the pe'kwin and involves prescribed
    dress, bowls, la'showawe, and te'likinawe; the plumes are directed to deceased
    A'shiwanni and to u'wannami of the four regions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the cleaning, men enter the water, fill vessels, hand them to women,
    and descend the terraces as the spring is emptied and cleaned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the cleaning, bowls are set on terraces, and a weighted bundle of prayer
    plumes is cast into the shallow water with a prayer for rain, crops, happiness,
    and awakening in Ko'thluwala'wa rather than death.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: On leaving Kia'nanaknana, Ma'we and Hli'akwa assume bird form; Ma'we passes
    through a projecting rock, leaves an opening, drops an eagle plume from her hair,
    and the plume petrifies into a tall monument.
  category: action
  evidence_refs:
  - ev:8
