canonical_text:
  quote: ''
  summary: The passage describes the summer retreat of the Black Corn clan shi'wanni
    who keeps the et'tone, including the sacred chamber, serpent and cloud imagery,
    ritual sprinkling of meal, invocations, te'likinawe deposits, closing washing
    and feast, food offerings to fire with prayers for rain, and the 1891 sequence
    of A'shiwanni retreats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The et'tone of the Black Corn clan is kept in an old village house whose sacred
    fetish room is on the ground floor and entered by ladder from an upper chamber.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The sacred fetish room has walls decorated with cloud symbols, two Ko'loowisi
    or plumed serpents, and a sacred frog wearing a cloud cap with lightning, standing
    with each foot on a serpent tongue.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The retreat room is directly above the et'tone chamber and has a floor opening
    through which meal is constantly sprinkled during the retreat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At sunrise on the fifth morning, the shi'wanni and associates gather in the
    et'tone chamber, make a cloud symbol of corn pollen and white meal, and place
    the separated et'tone, other fetishes, and arrow points on it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For the three following days, the shi'wanni and associates descend to the
    chamber at sunrise, noon, and sunset to invoke the presence of the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the eighth and last day, a similar floor painting and more elaborate display
    are made in the upper room, consanguineous families gather for the night, and
    te'likinawe are planted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the morning the retreat closes, a second excavation is made near the first,
    te'likinawe are deposited, and both openings are covered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At sunrise after the retreat closes, the heads of the shi'wanni and three
    associates are washed by the female associate, followed by a feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The shi'wanni and associates place food in fine baskets, carry it to embers
    at the fireplace, and consign it to the fire with prayers to ancients of all regions
    and dead Zunis to water the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The passage states that the retreats of all the A''shiwanni have the same
    object: rains to fructify the earth, with only slight ceremonial variation.'
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A dated order of A'shiwanni retreats in summer 1891 lists successive retreats
    from June 26 through September 14.
  category: sequence
  evidence_refs:
  - ev:8
