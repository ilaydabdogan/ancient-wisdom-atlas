canonical_text:
  quote: ''
  summary: The passage describes an installation ceremony for a novice becoming an
    associate shi'wanni, involving handclasping, prayers, sacred breath, symbolic
    lines of pollen and beads, and later contact with a dual fetish. It then describes
    preparation and planting of te'likinawe plume offerings by the A'shiwanni, with
    meal, compass-point placement, offerings to deities and predecessors, and prayers
    involving Earth Mother, Sun Father, and lightning-makers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pe'kwin clasps the novice's hands, prays four times, brings the novice's
    hands to his mouth, breathes upon them, and moves them before the novice's mouth
    so the novice may receive the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sequence of shi'wanni, associates, officers, and fraternities takes the
    novice's hands in order, with the pe'kwin not releasing the novice until the next
    participant has taken the hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the last fraternity's warrior closes his part, the pe'kwin takes the
    novice's hands and conducts him to his place, keeping hold until the new associate
    shi'wanni is seated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An associate removes beads, gathers pollen from a buckskin into a corn husk,
    ties the package, gives it to the Kia'kwemosi, folds the deerskin, and removes
    the blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kia'kwemosi offers a long prayer; all present join in another prayer;
    the younger brother Bow priest repeats a similar prayer and additionally appeals
    to the Gods of War associated with the lightning-makers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The prayers ask that the incoming shi'wanni be pure of heart, live the straight
    life indicated by the pollen and bead line, please A'wonawil'ona, bring rain for
    seeds, and obtain long life ending in sleep and awakening young again in Ko'thluwala'wa.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator states that no other special instruction was discovered and that
    the symbolic lines over the deerskin seemed sufficiently meaningful without spoken
    words.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the long ritual, participants waiting their turn smoke commercial tobacco,
    and the Shi'wano'kia supply corn husks from an adjoining room.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ceremony lasts six hours; the new associate shi'wanni remains in position
    for four hours and is escorted to his dwelling by the elder and younger brother
    Bow priests.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At a later winter retreat, the dual fetish named 'kia'et'tone and chu'et'tone
    is placed in the new associate shi'wanni's hands so he may draw sacred breath
    from it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Te'likinawe plume offerings are described as a principal feature of Zuni worship
    and ritual, made in large numbers for gods, goddesses, fraternities, and organizations.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The first body of A'shiwanni make monthly offerings at compass points by excavating
    a hole, depositing toasted sweet-corn meal, prayer meal, and te'likinawe, and
    orienting the stick's face toward the east.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The elder and younger brother Bow priests make additional offerings to the
    lightning-makers of the six regions.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A prayer is made to Earth Mother to invoke Sun Father's embrace so that her
    children, identified as fruits of the earth, may be warmed into being; prayers
    are also offered to deceased predecessors.
  category: speech
  evidence_refs:
  - ev:11
