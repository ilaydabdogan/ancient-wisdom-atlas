canonical_text:
  quote: ''
  summary: 'The passage describes the 1891 morning Sha''lako ceremonies: a crowded
    village with visitors and disorder, the first and following Sha''lako processions
    with musicians, meal sprinkling, te''likinawe, river crossing, and the arrangement
    of personators, officials, blankets, excavations, and six-region paired ki''wi''siwe
    groups on the ceremonial ground.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Morning brings many visitors; houses have guests, nearly every pueblo is represented,
    Navahos are present, housetops are crowded, and streets are filled with pedestrians
    and equestrians.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports drinking, fighting, weapons being drawn, people falling
    from saddles or lying in streets, and native police clearing streets for processions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before midday the first Sha'lako with his retinue comes out from the house
    where he spent the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The procession is ordered with Pa'yatamu members, Little Fire fraternity members,
    an officer with mi'li and meal basket, the Sha'lako alternate carrying te'likinawe,
    the Sha'lako, and later ki'wi'sine members singing with four managers foremost.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men in the early part of the procession play sho'konna flutes, producing a
    deafening sound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An officer sprinkles meal on the Sha'lako, people on housetops throw meal
    on the effigy, and men crowd forward to sprinkle the gods with meal.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The Sha'lako procession crosses the river to the south bank; other Sha'lako
    parties follow in close succession, mostly without Pa'yatamu musicians.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: At the ceremonial ground the effigy bearers stoop on blanket rugs, face the
    village, and are arranged in an east-west line with affiliated groups behind them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ko'mosona, Ko'pekwin, two Ko'pialiishiwanni, and a body of A'shiwanni with
    associated officials stand west of the Sha'lako.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The diagram caption identifies square excavations where the Council of the
    Gods and the Sha'lako deposit te'likinawe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The ki''wi''siwe are paired as elder and younger brother and are assigned
    to six regions: North, West, South, East, Zenith, and Nadir.'
  category: relationship
  evidence_refs:
  - ev:8
