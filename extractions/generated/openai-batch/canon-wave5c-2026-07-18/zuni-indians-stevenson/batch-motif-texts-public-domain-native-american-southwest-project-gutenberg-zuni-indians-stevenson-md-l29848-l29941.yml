  label: TWENTY-THIRD ANNUAL REPORT PL. CXXII / ALTAR OF HA'LO'KWE (ANT FRATERNITY)
    BEFORE FETISHES ARE PLACED ON IT / SHU'MAAKWE / CEREMONIAL OF INITIATION INTO
