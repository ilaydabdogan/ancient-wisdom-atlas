canonical_text:
  quote: ''
  summary: 'The passage describes part of a Shu''maakwe initiation ceremonial: consecration
    of medicine water with sixfold actions, animal fetishes, sacred meal, plumes,
    music, and tobacco sharing; overnight arrangements for novices and fraternity
    members; second-day preparation and grinding of medicines associated with animals
    and directions; and the beginning of dancing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The a'kwamosi dips water from a vase six times, holds each gourd of water
    above a medicine bowl while praying, and empties it into the bowl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six animal fetishes, described as one for each of the six regions, are placed
    in relation to the medicine bowl and dropped into it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacred meal is sprinkled into the water six times, and eagle plumes are dipped
    into the medicine water and raised and lowered six times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the close of the medicine-water consecration, the flute and rhombus cease
    and are returned to their places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The a'kwamosi sprinkles the altar with the feather ends of eagle-wing plumes
    and strikes one plume with another at right angles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Song, rattle, and drum continue until midnight, when a corn husk filled with
    tobacco is passed to those present, each of whom takes a whiff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women except the female novice return home under escort; the female novice
    and other novices sleep on the floor in relation to their seats, while the remaining
    men sleep around the room.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Food is brought to the men by women of the fraternity and by women of their
    clans, while the men avoid eating at home during the ceremonial.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the second day, prayer plumes are prepared, smoking occurs, and medicine
    grinding begins in a room filled with fraternity members and women, some with
    infants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A girl pounds a mineral described as the medicine of the cougar and bear,
    then grinds it and places it in an eating bowl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Three stone mills are arranged on layered sheepskins, blankets, buckskins,
    canvas, and cotton cloth, leaving space for grinders to kneel.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two grinders are dressed with a white embroidered blanket, jewelry, necklaces,
    red hair tie, and an eagle plume, and are led to the mills by warriors holding
    eagle-wing plumes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A guide seats himself before a grinder and mill, holds the grinder's clasped
    hands, and waves them to the six regions with a prayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Male attendants place bowls of ground medicine, Badger and Wolf root medicine,
    and crushed sunflowers beside the mills.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Shell beads, te'nas'sali root, Cougar of the North root medicine, and later
    Bear, Badger, and Wolf medicines are ground while twenty men sing with rattle
    and drum.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A note reports the fraternity director's assertion that six additional plant
    medicines belong to beast gods of the six regions and are found in a crater of
    a mountain north of Laguna.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: After grinding ceases, dancing begins; a choir man dances an infant on his
    knee, and one man, three women, and two young girls open the dance.
  category: action
  evidence_refs:
  - ev:8
