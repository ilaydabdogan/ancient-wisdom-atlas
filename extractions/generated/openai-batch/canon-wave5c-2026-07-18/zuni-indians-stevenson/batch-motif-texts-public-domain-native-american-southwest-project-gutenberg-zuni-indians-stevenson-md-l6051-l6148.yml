candidate_motifs:
- id: motif:1
  label: Prayer-plume offerings for divine favor and water
  taxonomy_refs:
  - sacred_exchange
  basis: Prepared te'likinawe are offered to gods and other recipients with prayers
    for purity, clouds, rain, water, and favor for Zuni-land.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes offerings and desired benefits, but does not frame
    the exchange as a formal bargain.
- id: motif:2
  label: Winter ceremonial sequence with repeated night rites
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage locator identifies winter solstice ceremonies, and the passage
    describes a timed sequence of preparation days and eight nights of synchronous
    meetings.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The winter solstice identification comes from the supplied passage locator
    rather than from the body paragraph alone.
- id: motif:3
  label: Initiation status organizing ritual obligation
  taxonomy_refs:
  - initiation
  basis: The passage distinguishes boys with only involuntary initiation, boys without
    voluntary initiation, fraternity children, and concludes that there is no initiation
    during this season.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage concerns initiation status and obligations, but explicitly
    says no initiation occurs in the described ceremonies.
- id: motif:4
  label: Offerings to deceased predecessors and ancestors
  taxonomy_refs: []
  basis: Offerings are made to deceased fraternity members, predecessors of orders,
    deceased members at large, and household ancestors.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly matches ancestor or predecessor offerings.
- id: motif:5
  label: Longevity prayer as sleep and childlike awakening
  taxonomy_refs:
  - death_rebirth
  basis: The crook symbolizes longevity and is deposited with a prayer to grow old,
    not to die, but to sleep and awake as a little child with the ancients.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage presents this as prayer language attached to a symbolic object,
    not as a narrative of actual death and rebirth.
- id: motif:6
  label: Culture hero as offering recipient and civilizing donor
  taxonomy_refs:
  - culture_hero
  basis: Po'shaiyanki receives offerings and is identified in a note as the Zuni culture
