canonical_text:
  quote: ''
  summary: The passage describes the preparation and offering of te'likinawe prayer
    plumes during a ceremonial season. Offerings are directed to gods, the Council
    of the Gods, the sun and moon, Beast Gods, deceased members and ancestors, Po'shaiyanki,
    and other beings, with prayers for purity, clouds, rain, water, longevity, and
    favor for Zuni-land. It also describes fraternity chambers, ritual objects, rules
    for who prepares offerings for whom, eight nights of meetings with tablet altars,
    altar guardians, healing of the sick, and the statement that no initiation occurs
    during this season.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of te'likinawe is offered to the gods with prayers for pure hearts,
    cumulus clouds, fog-like clouds, lightning, rains, and much water in rivers and
    lakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that if the people's hearts are not pure, the Sun Father
    would not be expected to combine with the Council of the Gods in directing the
    u'wannami to favor Zuni-land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ko'mosona and associates prepare prayer plumes in a room adjoining the
    Mu'hewa ki'wi'sine, and the Ko'mosona has a long te'likinane offered to the Council
    of the Gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fraternity members, except those of the 'Hle'wekwe, gather in ceremonial chambers
    on the first day to prepare te'likinawe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ceremonial chambers are described as busy, with groups of men, medicine
    boxes, and plumes of many colors; members prepare offerings according to fraternity
    customs and orders, and some belong to multiple fraternities.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The A'pi'Mashiwanni prepare te'likinawe to the Gods of War and to predecessors,
    and members also prepare offerings for other fraternities in which they hold membership.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Members of mystery medicine orders make offerings to the sun and moon, deceased
    fraternity members, Po'shaiyanki, and Po'shaiyanki's fellow; some offering tops
    are marked with a Greek cross or serrated to symbolize cumulus clouds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A miniature crook and corn planter with la'showanne are grouped with offerings
    to Po'shaiyanki; the crook is explicitly said to symbolize longevity and is associated
    with a prayer to grow old and to sleep and awake as a little child with the ancients.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Officers of the mystery medicine order make te'likinawe to the Beast Gods
    of the six regions, to deceased predecessors of the order, and to deceased members
    at large; fraternities with patron gods make additional offerings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Offerings for boys who have only involuntary initiation into the Ko'tikili,
    and for women and girls, are made by fraternity fathers; the passage also describes
    how a woman's fraternity father may prepare offerings for her and for her fraternity
    child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Individual offerings are described by household and status: men make offerings
    to the sun and ancestors, females make offerings to the moon and ancestors, and
    infants make offerings only to ancestors.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the evening of the second day, most fraternities convene with tablet altars
    erected, while A'pi'Mashiwanni members go to their fraternities as guardians of
    altars and fetishes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The synchronous meetings continue for eight nights, with different sleep arrangements
    for women, children, and men; the fourth-night ceremonies continue through the
    night until after sunrise.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that the sick are healed during this season, but that there
    is no initiation.
  category: action
  evidence_refs:
  - ev:10
