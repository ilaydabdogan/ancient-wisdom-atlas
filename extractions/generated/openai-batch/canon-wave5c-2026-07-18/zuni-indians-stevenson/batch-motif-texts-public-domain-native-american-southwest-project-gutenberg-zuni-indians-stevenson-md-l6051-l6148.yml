  label: VOLUNTARY INITIATION INTO THE KO'TIKILI / WINTER SOLSTICE CEREMONIES / TWENTY-THIRD
    ANNUAL REPORT PL. XVIII / SUN PRIEST; lines 6051-6148
  start: '6051'
  end: '6148'
