canonical_text:
  quote: ''
  summary: The passage describes sacred objects of the Bow priesthood, the clan custody
    of a precious shell, and the ceremonial preparation of a victor and his elder
    brother through dress, meal transfer, face anointing, black paint, corn pollen,
    eagle down, arrow points, war gear, and prayer plumes. The passage itself explains
    parts of the decoration as cloud, rain, vegetation, and prayer symbolism.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The po'nepoyanne of the Bow priesthood is described as a corn element surrounded
    by reeds; six reeds are colored for regions and filled with corn grains of six
    colors and other seeds, while other reeds contain native tobacco.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The po'nepoyanne is covered or obscured with eagle plumes, cotton cloth, cotton
    cord, shells, and precious beads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Two po''nepoyanne belonging to the A''pi''tlashiwanni are mentioned: one
    is carried to battle and the other remains at home.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The su'hlan'na is described as a large shell very precious to the Zunis; its
    keeper and vice must be of the Badger clan, and its songs are said to be very
    old and known only to four Badger clan men.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The victor and his elder brother wear ceremonial clothing and ornaments, including
    buckskin, an embroidered sash, turquoise earrings, and elaborate necklaces.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder brother Bow priest places meal in the belts of the victor and his
    elder brother, and they carry it to two idol makers, one of the Bear clan and
    one of the Deer clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elder brother Bow priest anoints the faces of the victor and his elder
    brother with a paste made from fat of prey animals of the six regions and the
    rattlesnake; the kia'punakwe add red pigment and micaceous hematite.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pe'kwin uses a small black polished pottery vase said to contain black
    paint from the undermost world, and a medicine bag containing corn pollen.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pe'kwin paints the lower part of the face black and applies corn pollen
    to the upper part by stippling; a corn husk protects the black portion during
    the pollen application.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the face painting, a warrior of the Ant fraternity applies eagle down
    to the chin, upper lip, nose, forehead, and crown using kaolin paste.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that the decoration symbolizes purity of heart, prayers
    breathed into plume offerings, rain sent by deceased A'shiwanni, heavy rain clouds,
    vegetation, lighter clouds, and the clouds of the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The pe'kwin places an arrow point in each man's mouth, where it may not be
    removed until sunset.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The victor and his elder brother wear a deerskin hood with a plume wand, a
    war pouch, bow wristlet, war club, quiver, bow, and arrows; each quiver is checked
    for one arrow for each of the six regions.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The victor and his elder brother take their prayer plumes from the meal painting,
    and then all owners remove their prayer plumes after each warrior has deposited
    two.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A note states that the Bow priesthood alone among the Zunis kills the rattlesnake;
    the rattle is worn as an amulet for protection from enemies, and the snake fat
    or oil is rubbed on the face so the enemy will fear the wearer as he fears the
    snake.
  category: attribute
  evidence_refs:
  - ev:7
