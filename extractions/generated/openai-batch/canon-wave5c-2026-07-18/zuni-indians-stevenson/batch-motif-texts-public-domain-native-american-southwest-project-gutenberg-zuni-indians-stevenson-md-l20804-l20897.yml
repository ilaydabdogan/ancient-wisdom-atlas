canonical_text:
  quote: ''
  summary: The passage describes recent changes among the Zuni in architecture, household
    furnishings, laundering, weaving, dyeing, clothing, sewing, pottery, baskets,
    and food staples. It presents introduced tools and goods, the spread of laundering
    after initial instruction, and the replacement or decline of several older craft
    practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During Mr Stevenson’s first visit in 1879, window panes, candles, lamps, silversmiths’
    implements, and larger doors were introduced.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indians who helped make boxes for the Government collection received lumber
    for doors and were taught to make and hang the doors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Newer or renovated houses are described as having higher ceilings, stone construction,
    larger rooms, shingles across ceiling beams, and women still doing much house-construction
    work.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Large windows with curtains, locking doors, china closets, iron bedsteads,
    chairs, tables, stoves, and stove-baked bread are described as present or fashionable
    in some houses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Soap was introduced in 1879 for washing cotton clothes, and the writer undertook
    instruction in washing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The selected pupil, a man wearing woman’s dress, initially resisted washing
    and ironing but eventually became a paid laundryman.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The pupil criticized the writer’s washing method, saying she made a river
    on the floor, and then offered to take her place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Laundering later became extensive and was not confined to one sex; men washed
    their own clothes and women washed for themselves and their children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Zuni are described as selling wool and buying blankets and quilts, while
    earlier woven bed blankets are said no longer to be seen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tin-can weaving needles are described as replacing earlier bone needles, and
    the art of dyeing is described as virtually lost.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Men increasingly wear European dress when they can afford it, while women
    adopt new styles more slowly; some women sew and a few own sewing machines.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Artistic pottery is described as largely supplanted by china and glass dishes,
    and contemporary pottery is described as inferior and trade-oriented.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Zuni baskets are described as colored with diamond dyes in imitation of Hopi
    basket work, and Hopi basket coloring is also said to have been supplanted by
    diamond dyes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Flour, lard, yeast powder, coffee, and white sugar are described as staple
    articles, and wheat grinding is said to cease where flour can be bought.
  category: object
  evidence_refs:
  - ev:10
