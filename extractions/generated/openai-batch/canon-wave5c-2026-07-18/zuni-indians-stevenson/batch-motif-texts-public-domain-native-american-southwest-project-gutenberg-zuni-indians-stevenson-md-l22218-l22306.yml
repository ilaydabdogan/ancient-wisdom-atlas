canonical_text:
  quote: ''
  summary: 'The passage recounts several emergences through Ji''mi''klanapkiatea:
    earlier gods, Po''shaiyanki with associates and possessors of Mystery medicine,
    and later the A''shiwi. It describes Shi''papolima as the sacred home of Po''shaiyanki
    and the Beast Gods, guarded by stone cougars, and recounts the ritual creation
    of Bi''sisi from rubbed-off epidermis before the organization of the Shi''wannakwe
    and Ne''wekwe fraternities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the A'shiwi came to this world, other beings emerged through Ji'mi'klanapkiatea,
    which the passage locates in the far northwest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earlier beings traveled eastward by a northern route under the direction
    of the Sun Father to Shi'papolima.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After four years at Shi'papolima, the party of gods moved to Chi'pia, located
    in Sandia mountain, New Mexico.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods of Chi'pia are named as the group Kok'ko'hlan'na, including Sbits'ukia,
    Kwe'lele, six Shumai'koli for the six regions, and their Sai'apa warriors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four years after the gods came to this world, Po'shaiyanki, his associates,
    and possessors of the secret of O'naya'nakia emerged through Ji'mi'klanapkiatea
    and followed a northern route to Shi'papolima.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shi'papolima is described as sacred to the Zunis and as the home of Po'shaiyanki
    and the Beast Gods.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The entrance to Shi'papolima is described as being on a mountain summit near
    Cochiti, with two crouching stone lions or cougars, stone walls, a passageway,
    and a stone monument.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that nearby Indians had no history for the carvings other
    than that the lions were converted into stone when a great fire spread over the
    earth, while Zunis regard them as guardians of Po'shaiyanki's chosen place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Four years from Po'shaiyanki's nativity, the A'shiwi came through Ji'mi'klanapkiatea,
    and the Divine Ones organized four fraternities.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: While the A'shiwi were in the undermost world, two married couples rubbed
    epidermis from their bodies, rolled it into a ball, placed it on the ground, sat
    around it, sang, and shook rattles.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the ritual with the epidermis ball, a youth named Bi'sisi appeared dancing
    in place of the ball, and the A'shiwi soon began their ascent to the outer world.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The first fraternity, Shi'wannakwe, began with one of the couples who created
    Bi'sisi and was expanded through selection and initiation; the second fraternity,
    Ne'wekwe, began with the other couple, and Bi'sisi was chosen as musician and
    entertainer or harlequin.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
