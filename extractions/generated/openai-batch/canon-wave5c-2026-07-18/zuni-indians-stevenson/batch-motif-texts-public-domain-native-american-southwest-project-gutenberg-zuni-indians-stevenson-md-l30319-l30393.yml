canonical_text:
  quote: the spirits of the Cougar and Bear being present in their bodies
  summary: The passage describes a Shu'maakwe ceremonial sequence in which fraternity
    fathers and theurgists embody animal spirits, instruct novices, perform healing
    by sucking illness from invalids and depositing extracted material in a bowl,
    visit another fraternity chamber, bury the bowl contents, and conclude this excerpt
    with child dancing and sprinkling of medicine water toward the altar and cardinal
    points.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Fraternity fathers of novices, with Cougar and Bear spirits present in their
    bodies, appear on all fours, jump around the altar, and growl; they are joined
    by others bearing Badger and White Wolf spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animal-spirit performers invoke the continued presence of the Beast Gods
    and each takes a novice in charge; the little boy is carried on a fraternity father's
    back, while other novices are led by instructors through the people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The theurgists growl, make loud noises, throw themselves and the novices almost
    bodily on the floor, approach an invalid, and suck at a spot on the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the theurgists receive power through the Beast Gods
    to see into the body, detect disease, and bring it forth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A doctor raises himself, receives from his mouth what is described as supposed
    extracted material, and deposits it in a bowl guarded by an aged woman who has
    water and a gourd nearby.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After instruction, the novices, except for the small boy, make awkward attempts
    at healing the sick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Members of the choir, identified as members of the order of Mystery medicine,
    take turns practicing healing; an old woman with white hair is identified as the
    Great Mother of the fraternity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Cougar-associated theurgist takes his mi'li from the altar, moves it while
    invoking the Beast Gods for power, backs down the long room, and is followed by
    Bear-, Badger-, and Wolf-associated men to visit the Eagle down fraternity chamber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The elder brother Bow priest appears as the White Wolf, wearing a warrior
    plume wand and red-colored eagle feather, and sucks at the shoulders, limbs, or
    feet of invalids.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the party returns, the elder brother Bow priest removes the large bowl,
    brings it to the altar, waves it in a circle, carries it outside, empties its
    contents into an excavation, and fills the excavation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Two girls and a little boy whose body is painted to represent the heavens
    form a file and dance; the elder girl is at the north end, the younger at the
    south, and the boy is between them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The elder brother Bow priest dips eagle plumes into medicine water, sprinkles
    the altar, and then sprinkles north, west, south, and east.
  category: action
  evidence_refs:
  - ev:11
