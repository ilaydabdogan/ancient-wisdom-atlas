canonical_text:
  quote: ''
  summary: The passage describes ritual processions of the 'Hle'wekwe and the Sword
    order of the Great Fire fraternity, including dress, feathers, rattles, swords,
    sword swallowing around boxes, prayers to six regions, an accidental-touch offense
    resolved by a musician consenting to membership, and a later circle-dance preparation
    in which girls sprinkle meal over boxes and pray.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The 'Hlem'mosona follows a woman leader, wears white clothing with plumes,
    carries a sword in each hand, and precedes other officers and fraternity members.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The male fraternity participants wear black woven kilts, wristlets, necklaces,
    yarn with bells around the legs, carry gourd rattles in the right hand and swords
    in the left, and some carry multiple swords.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The swords are described as juniper, slightly curved, rounded at the end,
    and measured from fingertip to elbow; an aged warrior has a serpentiform sword
    tipped with an arrow point.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and girls wear ordinary dress with bare limbs and feet, carry eagle-wing
    feathers and swords, make hooting or animal-like sounds, shake rattles, and briefly
    sing before the instrumental music begins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The party moves in single file with slow, even steps around boxes and musicians,
    and the 'Hlem'mosona steps out, waves a sword before and over the boxes, faces
    east, and swallows it.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The sword swallowing proceeds in succession while dancing continues; fraternity
    fathers swallow swords for women who fail and for very young children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After forming an ellipse, the group passes around the boxes three times and
    swallows swords each time; the 'Hlem'mosona prays quietly, moves his sword to
    the six regions and over the boxes, and the fraternity leaves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A musician accidentally touches a dancer, which is called a grave offense;
    fraternity members require the musician to consent to membership to save the touched
    member from possible ills or death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sword order of the Great Fire fraternity arrives after the 'Hle'wekwe,
    also led by a woman, and swallows swords in groups of two or three before the
    boxes; its 'Hlem'mosona carries a crooked prayer plume said to be symbolic of
    longevity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the Great Fire fraternity leaves, the smaller box is placed north of
    the larger one; eight men from the O'he'wa ki'wi'sine play notched sticks, and
    girls of the circle dance sprinkle meal over the boxes and pray.
  category: sequence
  evidence_refs:
  - ev:8
