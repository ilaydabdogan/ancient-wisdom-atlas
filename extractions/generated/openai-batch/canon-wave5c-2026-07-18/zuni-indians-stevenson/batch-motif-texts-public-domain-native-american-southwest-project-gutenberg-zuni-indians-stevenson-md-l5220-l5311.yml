canonical_text:
  quote: ''
  summary: 'The passage describes a Zuni ceremonial sequence centered on the Ko''loowisi
    serpent fetish: its procession and installation, night dances by gods/personators,
    morning offerings of corn and seeds, an eastern-road rite involving masks and
    a woodpecker feather, Hii''shi/''Kiiiklo''s meal-sprinkling arrival and serpent
    encounter with dancers, and preparation of a dry painting with a spring bowl by
    the Great Fire fraternity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ko'loowisi fetish enters with its head passing through a tablet ornamented
    with cloud symbols; two spruce trees on each side cover most of the fetish, while
    the priest or keeper holds the tail and blows a great shell hidden by the trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ko'loowisi is accompanied by Pau'tiwa, the Sal'imobiya or warriors and seed-gatherers
    from the six regions, many other gods, men from Chu'pawa ki'wi'sine, and the bird
    fetish Su'ti'ki.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In He'kiapawa the Ko'loowisi is placed north of the altar with its head to
    the east; water jugs from To'seluna spring and grass from the spring are placed
    before it, and pictures of Ko'loowisi decorate the north and south walls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priest of Ko'loowisi and Pau'tiwa remain with the fetish, and the priest
    continually blows the shell so that the serpent appears to roar continuously.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The gods dance through the night, moving from one ki''wi''sine to another
    in the stated order of the regions: North, West, South, East, Zenith, and Nadir.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the rising of the morning star the gods gather in He'kiapawa and make offerings
    of corn and other seeds, each also presenting a plume wand; the director and deputy
    of the Great Fire fraternity receive the offerings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage assigns different corn colors to Sal'imobiya from different regions
    and also lists squash, gourd, multicolored corn, and sweet corn offerings by other
    named figures; plume wands are later planted on sand mounds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gods go over the eastern road, remove their masks, take a woodpecker-feather
    plume from their hair, attach it to coyote weed, replace the masks, and return
    to their respective ki'wi'siwe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hii'shi, identified on this occasion with 'Kiiiklo, arrives over the eastern
    road with Mu'luktiikia, Kia'nakwe, Sal'imobiya, Sa'ya'hlia, and usually Cha'kwena
    gods; Hii'shi sprinkles a line of meal and calls the others to follow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the He'kiapawa wall opening, the Mu'luktiikia dance while the head of Ko'loowisi
    protrudes at intervals and touches them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Later, members of the Great Fire fraternity prepare a sand or dry painting
    with a sand disk and an archaic bowl in the center, referred to as the spring.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The spring bowl contains water from 'Kla'nanaknan'na and may include mosses,
    fish, frogs, and a water snake if one can be secured; the water is dipped by a
    member of the Frog clan.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note states that the Cha'kwena mentioned here bear no relation to the previously
