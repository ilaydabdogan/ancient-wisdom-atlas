canonical_text:
  quote: ''
  summary: The passage describes a ceremonial dance with girls, choirs, drummers,
    cedar bark, prayers, and appeals to the Gods of War, followed by handling of drums
    and ritual objects. It then describes the fifth-day removal of scalps from a pole,
    the attire and offices of scalp-washers and their fellows, and the bathing, rubbing,
    and oral contact with the scalps for rain, courage, and war power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four girls stand before choirs at the east and west ends of the room and begin
    the dance after a sufficient number of girls has arrived.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girls wear black woven dresses, red belts, silver ornaments, and arranged
    hair; dancers at each end stand on rectangular wooden slabs with feet close together,
    arms hanging, and hands clasped.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drummers at the east and west ends exchange single drum strokes in response
    to a command that beings who appeared from below the earth should hear and be
    present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dance begins slowly and then intensifies; the girls keep time with knees
    and arms, turn to face the room, and repeatedly reverse the positions of their
    arms.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pa'mosona, vice pa'mosona, vice pa'mosono"kla, and choir members each
    hold a bit of cedar bark in the left hand.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At portions of the song appealing to the Gods of War to destroy the enemy,
    cedar bark is spit upon, carried around the head four times from left to right,
    and all expectorate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: No set of dancers remains longer than ten minutes; dancers return to seats,
    put on pi'toni and moccasins, and are replaced, while choirs pray at each change
    and after new dancers take position.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the dance closes, the pa'mosona and his vice place the drums in the
    center, remove the hides, and take from each drum crossed chaparral cock feathers
    and crossed yucca-leaf pieces indicating bird footprints; they hold these with
    cedar bark while praying and then return them to the drums.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fifth day the 'si'hakoshona'kwe receive the scalps from the pa'mosona,
    who with his vice removes them from the pole; the scalps remain attached to cedar
    twigs with fluffy eagle feathers in place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The scalp pole is uprooted rather than scaled and is stood against the church
    wall until the scalps will be attached again.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The scalp-washers and their fellows wear elaborate clothing and markings,
    including kem'poyanne and a streak of micaceous hematite across and under the
    right eye indicating officership.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The 'si'hakoshona'kwe and their fellows proceed to a secluded riverbank spot
    and bathe the scalps in yucca suds in an earthen cavity used as a basin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The scalps are rubbed with kaolin for rain, and a bit of scalp is taken into
    the mouth so that the Zunis may have brave hearts and the Gods of War may empower
    them to destroy the enemy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that if the victor has a good heart, killing the enemy
    brings much rain.
  category: speech
  evidence_refs:
  - ev:8
