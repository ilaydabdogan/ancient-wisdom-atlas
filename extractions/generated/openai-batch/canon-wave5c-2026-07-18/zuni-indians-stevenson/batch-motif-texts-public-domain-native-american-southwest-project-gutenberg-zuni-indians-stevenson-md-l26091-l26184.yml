- id: motif:2
  label: Ceremonial sword swallowing
  taxonomy_refs: []
  basis: Sword swallowing is performed by the 'Hlem'mosona, by a leader among the
    dancers, and in the 1897 exception by the 'Hlem'mosona and warrior.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly names sword swallowing; the extraction
