canonical_text:
  quote: ''
  summary: Ethnographic prose description of the February ceremonial of the 'Hle'wekwe,
    including variations from the January ceremonial, plaza dances, arrangement of
    boxes and ritual objects, sword-swallowing acts, prayers toward six regions, a
    blessing involving fraternity fathers and children, modifications after deaths
    in 1897, and the connected Kia'la'silo initiation ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The January ceremonial is said to be repeated in February with slight variation;
    if no members are to be received, initiation ceremonies are omitted and west-wall
    decorations are left off.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described costume includes a white embroidered kilt, white embroidered
    sash, woman's red belt, and fox skin pendent at the back instead of the January
    black breechcloth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fraternity dances once in the plaza after the early ceremony with the
    et'towe and then returns to the ceremonial chamber for the morning meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At noon two a'mosi of the circle dance enter the plaza by the western street;
    one carries a small purple wicker basket of meal and the other carries the tehl'nawe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tehl'nawe bearer stands southeast of the boxes; the leader places the
    basket in his hand, removes notched sticks and bones from the boxes, reverses
    the boxes, deposits the meal under the larger box, and leaves by the same route.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Three musicians arrive and sit by the boxes before the 'Hlem'mosona enters
    from the eastern covered way with the original sword and a sword with feathered
    handle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The 'Hlem'mosona repeats sword swallowing on a circuit, including repeated
    swallowing at six points or six regions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the six-region sword swallowing, the 'Hlem'mosona stands before the
    boxes, waves the swords over them to the six regions, prays, circles the swords
    over the boxes, brings them to his lips, and inhales what the passage calls the
    good in them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The musicians pray aloud during the sword-and-box prayer, while the retired
    'Hlem'mosona observes from the western entrance; after the 'Hlem'mosona leaves,
    the circle dance begins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before 2 o'clock the 'Hle'wekwe assemble in the plaza; women carry two eagle-wing
    feathers in the right hand and a sword in the left, while the most expert female
    sword-swallower carries a sword in each hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the third dance, the leader takes swords from his three fraternity
    children and swallows them in succession; he then runs four swords down his throat,
    leaves them there briefly, and withdraws them together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The plaza ceremony closes with the 'Hlem'mosona standing before the boxes,
    praying, waving swords over the boxes, and drawing sacred breath.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the last plaza dance, the 'Hle'wekwe form opposing lines in the room;
    each fraternity father puts his sword into his own mouth and then places its end
    in the mouth of his fraternity child for the stated purpose that the child may
    live to old age and later awaken as a little child in Ko'thluwala'wa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'The closing outdoor ceremony follows the January description with changes:
    two Bear clan men wear white buckskins, the male novice now sings among the singers,
    and a different Dogwood clan member leads the et''towe and ''hla''we bearers.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In January 1897, because of deaths connected with the fraternity, there was
    no plaza dancing and the only outdoor sword swallowing was by the 'Hlem'mosona
    and his warrior.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: In the 1897 indoor ceremony, a man acting as catcher sat on a chair with his
    hands on the shoulders of a young girl novice seated on a blanket at his feet;
    the fraternity stood in opposing lines and presented mi'ha, corn, and prayer plumes
    as previously described.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: The order of the Kia'la'silo, glossed as spruce tree, has a ceremony in February
    in connection with the described one and for the purpose of initiating a member.
  category: action
  evidence_refs:
  - ev:9
