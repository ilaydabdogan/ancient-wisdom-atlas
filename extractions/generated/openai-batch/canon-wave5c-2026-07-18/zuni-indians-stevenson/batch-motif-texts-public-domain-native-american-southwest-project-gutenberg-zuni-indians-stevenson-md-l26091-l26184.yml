- id: motif:3
  label: Six-region ritual orientation
  taxonomy_refs: []
  basis: The sword swallowing is repeated at six points or regions, and swords are
    waved over the boxes to the six regions during prayer.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explain the cosmological meaning of the six regions,
    so no broader directional taxonomy is assigned.
- id: motif:4
  label: Inhalation of sacred good or sacred breath
  taxonomy_refs: []
  basis: The passage says the swords are brought to the lips and the good in them
    is inhaled; later the 'Hlem'mosona draws sacred breath while praying over the
    boxes.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage describes the act but does not define its theology or symbolic
    mechanism.
- id: motif:5
  label: Life-extension and childlike awakening blessing
  taxonomy_refs:
  - death_rebirth
  basis: A fraternity father places a sword end in the mouth of a fraternity child
    so the child may not die, may live to old age, and may later awaken as a little
    child in Ko'thluwala'wa.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The mapping to death_rebirth is based on the stated wish for future awakening
    as a child; it is not a narrative death-and-return episode.
- id: motif:6
  label: Seasonal repetition of ceremonial cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage explicitly says the January ceremonial is repeated in February
