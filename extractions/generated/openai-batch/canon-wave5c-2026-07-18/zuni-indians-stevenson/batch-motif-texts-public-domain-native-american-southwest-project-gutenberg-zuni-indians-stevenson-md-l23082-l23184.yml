canonical_text:
  quote: ''
  summary: 'The passage describes Zuni fraternity practices: prayer-plume obligations
    and schedules, deposits in fields and shrines, a rattlesnake shrine rain invocation,
    field offerings of edible seeds, east-facing ceremonial chambers, multilingual
    songs and a legend involving A''pachu, Zunis, and Mu''kwe, decorated pottery drums,
    sectional tablet altars and dry paintings marked as not to be touched, altar officers,
    and ritual washing and bathing before ceremonials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who has severed her connection with the U'huhukwo fraternity must
    prepare plume offerings after instruction by her fraternity father and must deposit
    them as if she were still a member.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the fraternities, except the 'Hle'wekwe, make and deposit prayer
    plumes at new and full moons, at winter and summer solstices, on the death of
    a member, and at fraternity meetings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prayer plumes are deposited in fields, at fraternity shrines, and in other
    places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Great Fire, Little Fire, Cimex, Eagle Down, and Rattlesnake fraternities
    plant prayer plumes in April at a shrine south of Zuni dedicated to the rattlesnake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the rattlesnake shrine, the fraternities invoke snakes to intercede with
    the rain-makers to send rain upon Zuni; the offering sticks are colored red with
    black lines at one end to indicate the rattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Semimonthly prayer plumes are deposited in cornfields or melon patches, and
    in autumn fruits and edible seeds are buried in fields as thanksgiving offerings
    with requests for abundant supplies in the coming year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the full moon of October, an altar is erected in the ceremonial chamber
    and members sing until midnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fraternity ceremonials, except those of the Ko'tikili, are held in large ground-floor
    chambers that are arranged, when possible, east and west so the altar faces east
    and the first daylight enters through the eastern window.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Households clean and vacate rooms shortly before fraternity meetings, while
    nonmember family occupants may remain during rehearsals and daily activities;
    songs begin after nonmembers are presumed asleep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fraternity songs are reported in Zuni and several other named languages, and
    the passage says the Mu'kwe learned A'pachu songs from those people soon after
    they came to this world.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: According to the cited legend, A'pachu were initially friendly with Zunis
    and Mu'kwe after coming through Ji'ini'kianapkiatea, but a slight to Zuni a'mosi
    led the Zunis to attack and drive the A'pachu north.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fraternities' pottery drums are curled at the mouth, vase-shaped, white
    or cream in ground color, and usually decorated with cougars, bears, and snakes
    represented in combat.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tablet altars are made in sections, stored when not in use, and freshly decorated
    for ceremonials; altars and dry paintings are called tfsh'kwi, meaning not to
    be touched in the passage's explanation.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The a'kwamosi sits north of the altar, the pe'kwin sits south of it, and the
    flutist usually sits behind the altar while playing.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: Before and during ceremonials, care is taken in washing hair with yucca suds
    and bathing because an unclean person is described as offensive to tutelary gods;
    women of the family wash men's hair and one another's.
  category: action
  evidence_refs:
  - ev:10
