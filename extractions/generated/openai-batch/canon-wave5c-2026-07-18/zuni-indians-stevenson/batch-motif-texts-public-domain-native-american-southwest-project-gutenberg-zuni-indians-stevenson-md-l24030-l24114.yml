canonical_text:
  quote: ''
  summary: The passage describes a Zuni ceremonial rabbit hunt, including passing
    rabbit sticks through flames, prayers for success, killing rabbits, handling the
    first rabbit's blood with a fetish, household placement of rabbits with corn and
    meal, cooking rites meant to feed the rabbits spiritually, and washing blood from
    the hands over the fire. It then describes the 'Hle'wekwe separating from their
    people to seek the Middle of the world, carrying rain and crop fetishes that begin
    to bring snow, a route dispute, and a sandstone rock said to map their route,
    roads, mesas, and constellations.
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters pass rabbit sticks through flames and ask the gods to crown them with
    success before remounting and proceeding with the hunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ko'yemshi and a member of the 'Siin'iaklakwe lead the hunters for a distance,
    give the order to proceed, and the party divides into squads.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hunters surround and strike rabbits with rabbit sticks; the passage states
    that no rabbit appearing escaped the weapon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mr. Stevenson kills the second rabbit, and the Indians treat his success as
    evidence that his heart is with them and their people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Father Ko'yemshi dips his fetish into the blood of the first rabbit
    killed; the passage notes that this is not repeated by the other hunters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the hunt, rabbits are taken home and placed on their sides, heads to
    the east and facing south, with an ear of corn between the fore paws.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Household members sprinkle meal and pray that the beings of the rabbits may
    return home and send many more rabbits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dressed rabbits are prepared with crossed forelegs and bent hind legs,
    food is placed under the left foreleg, and the rabbits are laid on coals with
    heads to the east until the first crackling noise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage explains that the crackling marks the departure of the spiritual
    essence of the bread to feed the rabbits; if the rite is omitted, rabbits will
    not appear and cannot be secured.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The person dressing the rabbits washes blood from the hands over the fire
    by pouring water from the mouth; washing blood away from the fire is said to make
    rabbits go off and become uncatchable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The 'Hle'wekwe separate from their people at Han'lipinkia' and travel northward
    in quest of the Middle of the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The great ones of the 'Hle'wekwe carry two et'towe, described as rain and
    crop fetishes, which initially contain only seeds of water for rain and vegetation.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the et'towe are placed on cloud forms of meal with prayer plumes and
    prayers for rain are offered, snow comes instead; thereafter the seed reeds are
    said to bring the cold rains and snows of winter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man and wife dispute with the fraternity over whether to continue northward
    or turn southward and eastward.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Markings on a conspicuous sandstone rock near Zuni are declared by the Zunis
    to be a map of the 'Hle'wekwe route after separation, along with other roads,
    mesas, and constellations.
  category: object
  evidence_refs:
  - ev:9
