canonical_text:
  quote: ''
  summary: During a gathering in the ki'wi'sine, three young men select youths and
    present them to girls seated opposite them. Each girl may accept or reject a youth;
    if accepted, water is passed to him and then to her, and she bathes parts of her
    body while he remains at her feet. A girl may later choose a second youth and
    leave the ki'wi'sine with both. The passage then describes social disapproval,
    family grief, and punishment associated with a young woman who went to the ki'wi'sine
    and was accused of joining a disapproved group there.
  language: English
  quote_policy: summarized
