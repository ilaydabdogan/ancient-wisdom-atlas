canonical_text:
  quote: ''
  summary: The passage describes the annual Zuni journey to the salt lake to gather
    salt. Rain priests arrange and lead the journey; men prepare plume offerings for
    the Salt Mother and other sacred recipients, undergo washing and bathing, depart
    with public prayers, visit shrines, and travel to the lake. A later anecdote explains
    that a guide avoided nearby springs because they were considered the house of
    the white gods and should not be desecrated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The annual journey to the Zuni salt lake for gathering salt is described as
    an important event accompanied by elaborate ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rain priests gather in the ancestral chamber of the Kia'kwemosi to arrange
    the journey, and the elder brother Bow priest announces the departure from a housetop.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The announcement tells those needing salt to be ready to start in four days
    for the home of the Salt Mother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women do not go on the salt-gathering journey.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men who intend to visit the lake prepare plume offerings to Ma'lokat'si, described
    as the spiritual name for salt, and present them with a request to go to the Salt
    Mother and ask for part of herself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The salt-gatherers and three priests prepare offerings to the Salt Mother,
    Sun Father, Moon Mother, and Corn Mother; Bow priests prepare offerings to the
    Gods of War; Ko'yemshi personators prepare offerings to the Council of the Gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the morning of departure the pilgrims' heads are washed in yucca suds and
    their bodies are bathed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Zuni community watches the departure from streets and housetops and offers
    prayers for success and safe return.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The elder and younger brother Bow priests carry rhombi and offerings; the
    Great Father Ko'yemshi follows, sprinkling meal; the rhombi are whirled for the
    rain-makers to gather over Zuni.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The party travels toward the salt lake, crossing several mountain ranges,
    visiting shrines for offerings, and facing lack of water along the route.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Zuni guide avoided camping near springs because they were said to be at
    the house of the Kok'ko ko'han, or white gods, and a Zuni would not dare camp
    near the sacred spot.
  category: action
  evidence_refs:
  - ev:10
