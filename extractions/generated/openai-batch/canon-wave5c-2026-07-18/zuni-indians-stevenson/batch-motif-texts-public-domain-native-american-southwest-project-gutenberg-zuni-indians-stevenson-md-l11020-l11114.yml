canonical_text:
  quote: ''
  summary: 'Ethnographic description of a portion of the Thla''hewe rain ceremony:
    dancers process to the plaza with music; a song asks the Great Mother of corn
    for abundance in the coming year; a communal feast is served; special sunset dancers
    are dressed, painted with rain-cloud and crop-fertility symbolism, given corn-and-offering
    headpieces, and led east-facing to the plaza; the headpieces are later carried
    by men who pray and sprinkle meal.'
  language: English with Zuni terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants pass by the west wall to the Sho'ko'we side and proceed to the
    plaza, led by the A'wan mo'sono'kla of the Sho'ko'we side, with the Sho'ko'we
    choir joined by flutists.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dance is described as nearly the same as before, except that the 'hle'we
    are moved downward while the song asks the Great Mother of corn for many children
    during the coming year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the dance, participants return to the Sho'ko'we side, while those belonging
    to the 'Hla'hewe pass around to the south side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people who dressed the male dancer and girls disrobe them and prepare
    another set of dancers, led by the A'wan a'mosi of the two sides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After four sets of girls have danced, a feast is served with seventy-five
    large bowls of food and coffee placed in two rows in the ham'pone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Participants eat stewed mutton with chili and hominy, stewed peaches, wafer
    bread, and coffee; remaining food is distributed among the spectators.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women with children watch from windows or from blankets and robes on the south
    side of the court, while housetops are crowded with spectators in elaborate clothing
    and blankets.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: Dancing resumes after the feast, with each side having five dances before
    the arrival of the sunset dancers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The he'kupowanhak'tona and sho'lipsimonthle'ona appear before the uslian'ashiitc;
    the two girls are dressed behind a blanket held by the elder brother Bow priest
    and another shi'wanni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Kla'kwemosi assists with dressing the girls for a time, then the elder
    brother Bow priest completes the dressing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The he'kupowanhak'tona have their hair parted over the head and down the back,
    arranged over ceremonial wooden forms, and wrapped with native blue yarn.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: Sho'lipsimonthle'ona is dressed like ya'pota, with long strings of turquoise
    beads from his ears and three white eagle plumes down the back of the hair, but
    without an ear of corn in his belt.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:13
  text: One he'kupowanhak'tona partly reclines on blankets with her head held by a
    shi'wanni while the elder brother Bow priest covers her body with a white cotton
    cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The pe'kwin colors the chin and lower jaw black, first drawing a line across
    the face near the upper lip, and applies corn pollen to the upper portion of the
    face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The passage states that the black paint is symbolic of rain clouds and the
    pollen is symbolic of the fruits of the earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:16
  text: The face-decoration process is repeated with the other he'kupowanhak'tona
    and the sho'lipsimonthle'ona.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:17
  text: The pe'kwin prepares a he'kupowanne from an ear of corn and eight te'likinawe
    offerings secured in a mi'ha folded into a strip; the elder brother Bow priest
    makes a second he'kupowanne.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: The te'likinawe are described as offerings to the Sun Father, Moon Mother,
    and Corn Mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:19
  text: The two he'kupowanne are placed on the heads of the he'kupowanhak'tona, and
    shell beads, turquoise, and coral necklaces are heaped upon each package.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: Each he'kupowanhak'tona adjusts the he'kupowanne to balance it on her head
    before proceeding in file to the plaza with sho'lipsimonthle'ona between them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:21
  text: The girls carry 'hla'we, and the youth carries te'likinawe, a blue hoop identified
    as a world symbol, a folded kilt from the meal painting, and the Kla'kwemosi's
    mi'li.
  category: object
  evidence_refs:
  - ev:6
- id: obs:22
  text: The three are led to the plaza by the A'wan mo'sono'kla of the 'Hla'hewe side;
    the vice A'wan mo'sono'kla later appears and continues dancing after the others
    stop.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:23
  text: The three dancers must not turn their faces away from the east until they
    enter the ham'pone, and the he'kupowanhak'tona do not raise their heads for fear
    of dropping the he'kupowanne.
  category: action
  evidence_refs:
  - ev:6
- id: obs:24
  text: The pe'kwin removes the he'kupowanne from the he'kupowanhak'tona and hands
    them to two men, who carry them to the plaza, face east, pray, and sprinkle meal
    from a basket.
  category: sequence
  evidence_refs:
  - ev:7
