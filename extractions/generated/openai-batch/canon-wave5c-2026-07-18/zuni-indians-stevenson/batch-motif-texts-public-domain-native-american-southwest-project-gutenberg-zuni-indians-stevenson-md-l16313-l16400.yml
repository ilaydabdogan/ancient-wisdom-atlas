  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: Girls sometimes join pleasure dances.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: Older girls usually do not go about the village unattended; the well is the
