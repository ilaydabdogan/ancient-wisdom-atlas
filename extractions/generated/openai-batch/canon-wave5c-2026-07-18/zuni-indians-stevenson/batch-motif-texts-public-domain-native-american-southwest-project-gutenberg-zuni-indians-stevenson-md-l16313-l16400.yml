canonical_text:
  quote: ''
  summary: The passage describes Zuni household architecture, fireplaces, cooking,
    limited use of lamps, multigenerational domestic life, child behavior and play,
    girls' care for younger siblings and imitation of adult work, young men's games
    and dances including masks copied after Navaho masks and a dog dance, and courtship
    practices around visits to the well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A projecting wall in the room is placed to protect the fireplace from the
    doorway.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mantel commonly extends over part of the fireplace, supporting a masonry
    chimney through the roof, while the exterior chimney is made of old pottery vessels
    with perforated bottoms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cooking vessels are set on stones in the fireplaces, and food is also cooked
    in coals and ashes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One room in a dwelling of any pretension has a wide fireplace with a projection
    above it, used for ceremonial caldrons and wafer-bread baking on polished stone
    slabs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The room containing the special fireplace is also used largely as a storage
    room rather than being exclusively for cooking.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Candles are not used in a Zuni house, and ordinary lighting does not use lamps;
    a baked-clay lamp resembling a Roman lamp is used for certain ceremonials and
    gives little light.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The husband lives with his wife's parents, and several families may commonly
    live under the same roof.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the early evening, young mothers, fathers, grandmothers, children, and
    elders may gather in the general living room after daily work.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men are described as devoted to their children, especially babies.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: When a story is told by the grandfather or another group member, listeners
    old enough to understand show intense interest.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Children are described as rarely disobedient, nonquarrelsome in play, and
    careful not to disturb or touch others' belongings.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Boys at night enjoy running with burning brands made of fiber balls attached
    to slender poles.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Girls carry younger siblings on their backs, look after younger children,
    and imitate their mothers' work such as making pottery, weaving belts, and making
    bread.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Children are described as punctilious in attending ceremonial observances.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:15
  text: Young men favor games and impromptu dances and wear masks copied after those
    of the Navahos rather than ceremonial masks.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: In the dog dance, the performer picks money and silver buttons from the ground
