canonical_text:
  quote: ''
  summary: 'The passage describes Zuni mortuary customs: burial rather than incineration,
    beliefs about the dead as rain-makers, treatment of infants with unpierced ears,
    preparation of the body, mourning and announcement practices, churchyard burial
    arrangements, grave digging, past and present grave goods, and ritual bathing
    of a surviving spouse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Zunis are described as insisting on burial of the dead and rejecting incineration
    because incineration would stop rain and annihilate the being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead are identified in the passage as u'wannami, rain-makers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Infants buried with unpierced ears are said not to help water the earth; instead
    they carry baskets of toads and tadpoles and wear toads at their ears, so unpierced
    ears are pierced after death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Immediately after death the body is placed with the head to the east, washed
    with yucca suds, rubbed with corn meal, dressed, wrapped in blankets, and usually
    buried soon afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A gash is cut in each garment so that the garment's spirit may escape to serve
    the spirit of the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Death is announced through family and clan channels, and a fraternity father
    may notify the fraternity when present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women mourners enter, look at the corpse, and howl, while immediate family
    and close friends are described as remaining quiet in grief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Prayers are offered by those present, and meal is sprinkled over the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The body is seldom accompanied to the grave by mourners; bearers may go alone
    to the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The churchyard is used as a burial place, with men placed on the south side
    and women on the north, heads to the east.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Immediate male family members, excluding husband or father, dig the grave
    and bury the dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that valued possessions were formerly buried with the dead,
    but at present only occasional trifling articles are placed in the grave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After burial of a husband or wife, the surviving spouse is bathed by female
    relatives, with little fire in the fireplace and a cold-water body bath under
    a ladder.
  category: sequence
  evidence_refs:
  - ev:9
