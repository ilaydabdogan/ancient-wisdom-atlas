canonical_text:
  quote: ''
  summary: The passage describes Po'sikishi as a bird mime connected with the klii'lii'silo
    tree and notes that the sword used in the ceremony is fashioned at the tree's
    base. It lists offices of the Great Fire fraternity. An origin account says that
    two Great Fire fraternity members, from Eagle and Badger clans, went northeast,
    met the Ke'pachu, learned that they had similar language and knowledge of mystery
    medicine, sword swallowing, and arrow swallowing, then returned with Ke'pachu
    songs. The passage states that the Great Fire fraternity has since sung Ke'pachu
    songs and that certain offices are associated with Eagle and Badger clan affiliation.
    It then gives song texts labeled for mystery medicine and sword-swallowing ceremonies,
    with notes identifying Ke'pachu/Navaho terminology and the author's realization
    that the songs were not in Zuni.
  language: English with transcribed Zuni and Ke'pachu terms
  quote_policy: summarized
