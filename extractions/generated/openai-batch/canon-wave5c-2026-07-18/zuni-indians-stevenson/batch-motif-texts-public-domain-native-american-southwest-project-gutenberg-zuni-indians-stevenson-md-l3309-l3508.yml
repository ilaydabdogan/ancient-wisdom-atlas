canonical_text:
  quote: ''
  summary: The passage describes a ritual entrance by 'Kiiiklo into the Chu'pawa ki'wi'sine,
    with dialogue, a meal-line path, repeated song stanzas, and the beginning of a
    history myth. In the myth, the Zunis/A'shiwi come through a water-cleared opening,
    breathe the sacred breath of A'wonawil'ona, and are in the fourth blackness-of-soot
    world while elder and younger Bow-priest brothers deliberate, seek the light above,
    and cut trees associated with the four directions.
  language: English with Zuni terms and transliterated Zuni text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ko'yemshi carry 'Kiiiklo to the roof of the Chu'pawa ki'wi'sine and seat
    him on a blanket before he enters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: "'Kiiiklo and the Ko'yemshi exchange ritual speech: 'Kiiiklo announces entry,
    refers to dancing, and says he will come out in the morning; the Ko'yemshi reply
    with farewell and assent to dancing."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ritual assembly, including the first body of A'shiwanni, the Ko'mosona,
    the Ko'pekwin, the people of the Chu'pawa ki'wi'sine, the pe'kwin, and three organization
    members, is present to receive 'Kiiiklo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A line of meal extends from the base of the ladder to the north ledge of the
    ki'wi'sine and is crossed by four equidistant lines of meal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After descending, 'Kiiiklo stands at the base of the ladder and on each cross
    line while the Ko'yemshi repeat the twelfth stanza of the song four times; at
    the end he sits and repeats the history myth begun at sunrise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the history myth, the Zunis/A'shiwi come through a hole that is emptied
    of water for their passage and afterward fills with water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The emerging people inhale the sacred breath of A'wonawil'ona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The myth places the people in the fourth world, described as the blackness-of-soot
    world.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The great fathers, identified as Bow priests of the place, work for the people,
    and the elder brother wants his younger brother to join him in the work.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder brother points above to the light and says that this is what they
    are looking for.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The younger brother hastens, asks what the elder brother wants, and the elder
    brother says he has been thinking seriously of remaining for a time to aid his
    people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The elder and younger brothers cut down four trees associated with directions:
    pine of the north, spruce of the west, aspen of the south, and silver spruce of
    the east.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The elder brother states that in the fourth, undermost world, they sit down
    together to discuss serious subjects.
  category: speech
  evidence_refs:
  - ev:8
