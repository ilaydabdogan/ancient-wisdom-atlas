canonical_text:
  quote: All was shi'pololo (fog), rising like steam.
  summary: 'The passage summarizes a Zuni cosmogony and related ritual symbolism:
    primordial beings exist above and below; A''wonawil''ona creates clouds, waters,
    air or firmament, and vegetation; altar symbols, plumes, corn, fetishes, and breath
    relate to life and prayer; Shi''wanni creates the fixed stars and constellations;
    Shi''wano"kia creates Earth Mother.'
  language: English with Zuni terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Zuni ceremonies are described as clustered around a cosmogony that preserves
    beliefs and guides ceremonial actors and spectators.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the beginning, A'wonawil'ona, Sun Father, and Moon Mother existed above,
    while Shi'wanni and Shi'wano"kia existed below.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shi'wanni and Shi'wano"kia are described as superhuman beings who labored
    with hearts and minds rather than hands; their names are linked to rain priests
    and the Priestess of Fecundity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The primordial condition is fog rising like steam, and A'wonawil'ona creates
    clouds and the great waters with breath from the heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A'wonawil'ona is described as He-She, the blue vault of the firmament, the
