  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Through light, clouds, and air, A'wonawil'ona becomes the essence and creator
    of vegetation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A'shiwi altars are covered with cloud-related symbols, and plumes are used
    to waft prayers to the gods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: An ear of corn clothed in plumage, called mi'li, is identified as a symbol
    of life, and the et'tone sacred fetish of the A'shiwanni is also a symbol of life
    including rain and vegetation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Every Zuni is said to be taught that inhaling sacred breath from fetishes
    or breathing on prayer plumes involves receiving breath of life from A'wonawil'ona
    or wafting breath prayers to the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shi'wanni creates the fixed stars and constellations by foaming spittle in
