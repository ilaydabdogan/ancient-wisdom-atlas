canonical_text:
  quote: ''
  summary: Naiyenezgani is told that Golilisi has won people's daughters, sons, and
    wives through many gambling contests and has shut them away. The people ask Naiyenezgani
    to release them. Golilisi appears at sunrise with a najonc pole and challenges
    people to play. Naiyenezgani prepares hidden game equipment, refuses repeated
    invitations, then accepts the contest. Both sides wager groups of people. Golilisi
    uses a living hoop, but Naiyenezgani breaks the uncanny equipment and declares
    that proper implements should be used instead.
  language: English
  quote_policy: summarized
