  - ev:4
  - ev:5
  confidence: medium
  cautions: The text also presents the daughter as consenting to marriage and flight;
    'stolen' is the father's wording.
- id: motif:2
  label: helper wife protects husband during magical flight
  taxonomy_refs:
  - shapeshifter
  basis: The wife warns the husband, says she will help him many times, prepares the
    escape, and the pair use altered forms or disguises during pursuit.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage's wording mixes placed objects and transformed forms; the
    later turtle dove speech states the old-woman and black-log changes more explicitly.
- id: motif:3
  label: spittle left behind as a deceptive substitute
  taxonomy_refs: []
  basis: The wife directs both to spit before fleeing, and the note states that the
