canonical_text:
  quote: ''
  summary: A man marries the youngest daughter of an old man. The wife warns that
    her father and family are dead beings and that her father will try to kill her
    husband. The couple flee on a sorrel horse after placing spittle as a decoy. The
    father pursues them in a red wind. The wife uses disguises and later the couple
    cross water on a floating tree or log while refusing to look back at her calling
    family. Near the husband's people, the wife warns him not to be embraced; after
    a relative reaches toward him, he forgets her and prepares to marry another woman.
    Two turtle doves speak from a tree and recount the earlier flight, causing him
    to remember. He rejects the intended marriage and returns to the earlier wife,
    identified as the turtle dove.
  language: English
  quote_policy: summarized
