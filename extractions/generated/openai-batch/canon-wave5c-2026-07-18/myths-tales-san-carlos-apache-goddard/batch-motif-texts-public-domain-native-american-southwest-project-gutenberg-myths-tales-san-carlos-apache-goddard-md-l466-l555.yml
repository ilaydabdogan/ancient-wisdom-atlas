canonical_text:
  quote: ''
  summary: Naiyenezgani defeats a group by concealment, medicine, explosive fragments,
    and a club. He later disregards his grandmother's warning not to butcher a deer
    under a piñon tree, encounters a dangerous woman in the tree who calls him husband,
    flees from her, is hidden by his grandmother beneath a hearth, is found by the
    woman's divination, and delays her by requiring a bed and a house made with Douglas
    spruce poles from the cardinal mountains while he fashions large implements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Naiyenezgani produces a mirage so others cannot see him, moves around them,
    and appears close to a father and young ones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father and young ones look at Naiyenezgani in a line; his mind is affected,
    he nearly dies, and he recovers by putting life medicine in his mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Naiyenezgani places four explosive pieces in an encircling fire; fragments
    fly into the victims' eyes, blinding them, and he kills them with his club.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Naiyenezgani asks his grandmother about black-tailed deer, and she tells him
    not to butcher one under a piñon tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Naiyenezgani kills a deer on a distant mountain and deliberately drags it
    to the shade of a piñon tree before butchering it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While Naiyenezgani butchers the deer, cold water drips on him from above although
    the sky appears blue; he then sees a beautiful girl sitting on top of the piñon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The girl calls Naiyenezgani her husband, lifts her skirt, descends the tree,
    and is described as having teeth in her genitals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Naiyenezgani runs away dragging the deer's second stomach, and the girl chases
    him while continuing to call him husband.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Naiyenezgani throws tripe between himself and the pursuing girl; it forms
    radiating ridges that she must cross.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The grandmother hides Naiyenezgani in a hole beneath a thin stone, a replaced
    fire, and a boiling pot, then denies to the girl that a man has come there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The girl says her urine can locate her husband; the urine flows down radiating
    lines to the fire where Naiyenezgani is hidden.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The girl uncovers Naiyenezgani, grabs him by the arm, calls him husband, and
    urges him to hurry while the teeth in her genitals are described as grinding.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Naiyenezgani delays by saying he requires a grass bed in a house made of four
