canonical_text:
  quote: ''
  summary: 'The passage continues a tale in which two strange boys visit a camp, receive
    food and a house, and are attacked; one is killed while the other escapes by becoming
    a downy feather and returns to his grandmother. Two girls flee with a boy and
    are helped across a river by Heron, who then drops their pursuers into the water,
    where they become ducks. The fugitives later settle, exchange visits with Wildcat,
    and are guided by Coyote to join a larger camp. A new section titled “The Sisters
    are lured by a Flute (Second Version)” begins: two sisters hear pleasant singing
    while gathering wood, visit several animals who deny or claim the song, and finally
    hear a flute sound beyond a hill.'
  language: English
  quote_policy: summarized
