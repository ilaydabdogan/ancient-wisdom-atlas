canonical_text:
  quote: ''
  summary: A hunter repeatedly succeeds in killing deer after prayer and instruction.
    Ests’unnadlehi directs hunting and prepares food. The hunter prays to named beings
    for large deer, gives a prohibition concerning deer head and heart for menstruating
    women, and a hunting contest follows in which Panther Boy wins through a beard-hair
    act and by sending wind and Buzzard to hinder rivals. The narrator then gives
    customary hunting prayer formulas. The next section begins with two men setting
    out on an unsuccessful war raid and finding footprints near Black River on their
    return.
  language: English
  quote_policy: summarized
