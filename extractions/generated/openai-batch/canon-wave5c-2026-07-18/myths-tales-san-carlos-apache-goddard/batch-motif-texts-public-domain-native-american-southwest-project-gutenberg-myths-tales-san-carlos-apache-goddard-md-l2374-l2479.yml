canonical_text:
  quote: ''
  summary: 'The passage first describes an unnamed group, identified in the translation
    as Indians, living by raiding white people''s houses, taking blankets, shoes,
    cloth, and clothing, and regarding stealing as a good way to live. It then begins
    the story titled "The Deer Woman": Panther Boy, a great hunter living in the east
    and married to the daughter of G^ow^n/the Gan, leaves his wife to choose a new
    camp. He constructs and adorns a house with four directional colors, deer horns,
    deer-mouth blood, pillows, deer hair, and related materials, then makes directional
    mountain ridges, trails, springs, and footprints associated with deer substances
    and colors.'
  language: English
  quote_policy: summarized
