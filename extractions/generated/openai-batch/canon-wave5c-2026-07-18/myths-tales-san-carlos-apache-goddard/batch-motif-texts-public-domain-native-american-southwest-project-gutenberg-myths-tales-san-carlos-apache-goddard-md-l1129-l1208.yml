canonical_text:
  quote: ''
  summary: The supplied range closes a narrative in which Naiyenezgani defeats Golilisi
    in a wagered footrace around the earth, wins back his wife and other lost family
    members, and returns to his grandmother. It then begins a second creation account
    in which, after a primordial absence of people, earth, and black sky, makers discuss
    creation; the Sun makes a hummingbird messenger and the earth from rubbed-off
    cuticle; the earth is arranged with four directions and stabilized by whirlwinds
    and posts; and the black sky is made in the same way.
  language: English
  quote_policy: summarized
