canonical_text:
  quote: ''
  summary: Naiyenezgani and Golilisi compete in a hair-length wager on a ridge, which
    Naiyenezgani wins after following advice from a being at his ear. Golilisi then
    proposes a horse race around the border of the earth. Naiyenezgani, again advised
    by the being at his ear, borrows the Sun’s own black horse from his father after
    refusing several other horses. The contestants race at the edge of the world using
    flutes for rapid movement, and Naiyenezgani wins again.
  language: English
  quote_policy: summarized
