canonical_text:
  quote: ''
  summary: Ests’unnadlehi survives on floodwater inside a sealed turquoise vessel,
    emerges onto a barren sandy plain, and later conceives after repeated sunrise
    rites on a mountain. Her daughter Naljdilxiln conceives after dripping water enters
    her and gives birth to a boy, Naiyenezgani, who is described as smooth and unformed.
    The boy asks about his father, is warned that the father is dangerous, and travels
    by Spider’s thread toward the house of the Black Sun/Sun, where an inner woman
    warns him that his father kills those claiming to be his children. Editorial notes
    compare parts of the episode with Navajo, Jicarilla Apache, Pima, Zuni, and Biblical
    materials.
  language: English
  quote_policy: summarized
