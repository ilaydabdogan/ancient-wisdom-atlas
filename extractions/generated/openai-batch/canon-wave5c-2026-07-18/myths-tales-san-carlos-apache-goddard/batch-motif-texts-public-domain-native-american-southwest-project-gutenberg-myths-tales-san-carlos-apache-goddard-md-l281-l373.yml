canonical_text:
  quote: ''
  summary: A boy who calls the Sun his father is hidden by the Sun's wife, then revealed
    to the Sun. The Sun tests him with deadly tobacco and sky-fire ordeals in the
    four directions; the boy survives, including by becoming a downy feather and returning
    to his shadow. The first people acknowledge him as Na^enezgani, their grandson.
    At the Sun's request they form his incomplete body in a sweatlodge, equip him
    with obsidian garments and a warclub, give him a directive helper by his ear,
    and he returns to his grandmother.
  language: English
  quote_policy: summarized
