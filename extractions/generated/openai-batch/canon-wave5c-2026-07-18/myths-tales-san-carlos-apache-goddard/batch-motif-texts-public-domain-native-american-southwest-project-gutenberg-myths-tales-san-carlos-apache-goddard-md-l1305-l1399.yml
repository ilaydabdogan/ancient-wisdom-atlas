canonical_text:
  quote: ''
  summary: After the water has gone, an old woman emerges from a sealed tree, sees
    sand, follows a black bug that calls itself black water, and camps near a spring
    by mountains. People who have gone above hold council and plant seeds for the
    world below; when the owner of a rejected crooked hoe is included, all seeds grow
    and the old woman lives on the food. The woman later conceives after dripping
    water from a bluff enters her, gives birth to a girl after twelve months, cares
    for her, and instructs the girl to attempt a similar act with sunbeams.
  language: English
  quote_policy: summarized
