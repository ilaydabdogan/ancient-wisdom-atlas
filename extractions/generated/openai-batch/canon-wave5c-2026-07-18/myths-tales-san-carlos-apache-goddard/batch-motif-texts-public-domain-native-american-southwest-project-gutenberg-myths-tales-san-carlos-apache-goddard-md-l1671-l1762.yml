canonical_text:
  quote: ''
  summary: A boy named Naiyenezgani asks a woman named Ests’unnadlehi where his father
    lives and sets out despite being warned that the place is distant and difficult.
    Spider stops him with a web, calls him grandchild, and warns him about dangers
    and four approaches. At the father’s house, a girl recognizes him as her brother,
    while her mother initially denies that such a brother exists. The father returns,
    sees tracks, and tests the boy through smoking, black-water ordeals, and naming
    objects. The boy survives by turning into down, is accepted as the father’s son,
    is made to look like a man, asks for horses, and chooses a blue-gray horse. On
    the return, the father places him on a black cloud at the center of the sky and
    shoots him down with lightning; the boy returns to his grandmother, who sings
    a prayer for him.
  language: English
  quote_policy: summarized
