canonical_text:
  quote: "“You have killed all those who made trouble on earth. Now it has become
    a good place on this earth.”"
  summary: Naiyenezgani, guided by his grandmother and helped by animal allies, kills
    Delgit, Tsidaketisi, and Nakpdilgedi through stratagems involving tunnels, decoy
    animals, firedrill arrows, and a shadow-stabbing duel. His grandmother says the
    troublemakers on earth have been killed and renames him Naiyenezgani. The passage
    then begins a separate account set before people were made, with one man and one
    woman between earth and the black sky.
  language: English
  quote_policy: quoted
