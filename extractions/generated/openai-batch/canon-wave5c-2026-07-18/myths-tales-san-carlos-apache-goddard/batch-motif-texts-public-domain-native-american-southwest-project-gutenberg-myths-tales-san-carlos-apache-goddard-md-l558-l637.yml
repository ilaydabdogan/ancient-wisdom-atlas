canonical_text:
  quote: ''
  summary: The passage first describes a woman preparing a bed and house, then a husband
    using four artificial implements and a stone to break off teeth that consume the
    implements. It then describes Naiyenezgani seeking Delgit, receiving help from
    a hole-dwelling assistant who makes tunnels, killing the dangerous animal, distributing
    hair to bird-people, processing the animal's remains, and making a war coat from
    the hide.
