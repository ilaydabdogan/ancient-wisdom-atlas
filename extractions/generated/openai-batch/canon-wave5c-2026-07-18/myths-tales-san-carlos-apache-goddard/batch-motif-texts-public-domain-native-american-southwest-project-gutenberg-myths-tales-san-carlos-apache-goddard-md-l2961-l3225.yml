canonical_text:
  quote: ''
  summary: 'A sequence of Apache song or prayer fragments names a first-person speaker,
    Walks-on-the-water, colored directional mountains, echoes, smoke for a girl who
    became a deer, sky and celestial locations, deer that come down or are brought,
    colored footprints of mouth blood, medicine garments, and repeated instructions
    to walk out. The passage then begins a prose section on prayers for hunting deer:
    Ests’unnadlehi tells her grandchild to hunt; the hunter addresses Djingona’ai
    as father and Wind as brother while seeking a large male deer.'
  language: English
  quote_policy: summarized
