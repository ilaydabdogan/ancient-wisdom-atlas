canonical_text:
  quote: ''
  summary: The passage describes a flat, bare earth made by four named persons, their
    hunger, and a hummingbird messenger sent through a hole in the sky to people above
    who have food. The people below create an ascent path with a reed twisted with
    black metal and climb to the sky, leaving an old woman and a crippled man behind.
    After a smoking council, rain is ordered for thirty-two days to cover the earth
    with water. The old woman seals herself in a hollow sycamore tree with seeds,
    corn, grinding stones, and fire; the tree floats as the flood rises near the sky.
    Woodpecker and turkey survive by clinging to the sky, receiving changes to their
    tails.
  language: English
  quote_policy: summarized
