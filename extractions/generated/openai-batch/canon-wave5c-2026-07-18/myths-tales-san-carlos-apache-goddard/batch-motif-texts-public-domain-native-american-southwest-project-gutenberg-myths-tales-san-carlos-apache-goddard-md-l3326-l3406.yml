canonical_text:
  quote: ''
  summary: A note identifies the teller and mentions a similar White Mountain Apache
    account. In the narrative, two brothers follow tracks to a stone, camp, catch
    and cook a porcupine, and one brother becomes ill after eating. The ill older
    brother tells the younger to return and not look back, but the younger looks back
    from Yucca ridge, sees something strange where his brother had been, and reports
    trouble. A father sends messengers in four directions, and a company with medicine
    men searches along Black River. They follow a snake-like mark, travel beneath
    raised river water, find the lost man in nonhuman form, and a man with supernatural
    power restores him to human form using four rings. The company returns through
    named places associated with supernatural beings. At Gotalbakawadi, where supernatural
    beings live, different language peoples are made; after twelve nights of dancing
    without sleep, thirty-two languages are made and the peoples separate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prefatory note says the account was told by Albert Evans, who was said
    to know and practise the ceremony, and that a very similar account was obtained
    from a White Mountain Apache in 1905.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The trackers followed tracks that seemed to enter a large stone; one person
    said Stone Echo Girl had made the tracks and urged camping because sunset was
    near.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: While preparing to build a fire, one brother found a porcupine entering its
    hole; the brothers pulled it out with a sharpened stick, built a fire, heated
    small stones, and cooked the animal in ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One brother ate the cooked porcupine and the other did not.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After sleeping, the older brother said he was nearly dead and told the younger
    brother to go back without looking back, especially at Yucca ridge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The younger brother looked back at Yucca ridge, saw something strange moving
    where his brother had sat, ran back to Gotalbakawadi, and reported bad luck at
    Black River.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father sent messengers east, south, west, and north to call the people
    together; the assembled company traveled to Black River with sheet lightning for
    visibility.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Black River, medicine men could not find the seated man or his track, but
    they found a snake-crawl mark, concluded it had been made by the man, and followed
    it to the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: People claiming supernatural power could not raise the river water, but distant
    lightning raised it slightly, allowing the company to go downstream beneath the
    water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Far downstream they found the lost man, but he was not a human being.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man with supernatural power threw four rings at what had been a man, and
    the rings restored the body in stages until he was completely human again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the return, the company passed places called Tsexadecgij, meaning forked
    rock, and Tulittsogixalj, meaning yellow water spring; supernatural beings are
    said to live at these places and at Gotalbakawadi.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Gotalbakawadi the people were to make people who speak different languages;
    they danced twelve nights without sleeping, made names for various types, made
    thirty-two languages, and then separated.
  category: sequence
  evidence_refs:
  - ev:10
