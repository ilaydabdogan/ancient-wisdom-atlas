candidate_motifs:
- id: motif:1
  label: Aerial return from the sky assisted by bird chiefs
  taxonomy_refs:
  - return
  basis: Naiyenezgani wants to get back from the sky; bird chiefs give him shirts,
    train him to fly, and guide him down to earth.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives the return but not the earlier full ascent episode.
- id: motif:2
  label: Bird garment enabling flight
  taxonomy_refs:
  - shapeshifter
  basis: Naiyenezgani puts on multiple bird shirts and is then told to fly with the
    wings he has.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The text describes shirts and wings, but does not explicitly say his body
    fully changes form.
- id: motif:3
  label: Fourfold circular flight
  taxonomy_refs: []
  basis: The bird chiefs instruct him to fly around four times and say they will make
    four circles while flying.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not explain the meaning of the number four or of the
    circling.
- id: motif:4
  label: Monster-killer as culture instructor
  taxonomy_refs:
  - culture_hero
  basis: The same figure kills beings that prey on people and later teaches the Owl
    household proper human food and cleansing practices.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents adjacent episodes; broader cultural role should be
    checked against the larger text.
- id: motif:5
  label: Cannibal food in an affinal household refused with hidden advice
  taxonomy_refs: []
  basis: After marriage into the Owl household, the wife brings foods identified by
    the monitor as human brains, eyes, and flesh, and Naiyenezgani refuses them.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The monitor’s nature is not identified in this passage.
- id: motif:6
  label: Inexhaustible cornmeal as proper human food
  taxonomy_refs: []
  basis: Naiyenezgani gives a little cornmeal that never gives out and says it is
    the food human beings eat.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No origin of the cornmeal is given in the passage.
- id: motif:7
  label: Purification and household cleansing before new foodways
  taxonomy_refs: []
  basis: Before teaching cornmeal foods, Naiyenezgani directs the Owl household to
    wash with soapweeds, discard property, sweep, and bathe.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text narrates the actions but does not explicitly call them ritual
    purification.
comparison_claims:
- id: claim:1
  claim: An editorial note in the passage says the method of getting down may belong
    to another story about a man visiting the sky with large birds, and compares it
    with a Navajo Old Woman Bat version and a usual Apache form.
  claim_level: same_motif
  target: Sky-visitor descent story with large birds / Navajo Old Woman Bat and usual
    Apache form noted by Goddard
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note is explicitly cautious with 'perhaps'; the present narrative
    uses bird chiefs rather than Old Woman Bat, and the compared texts are not included
    in this passage.
- id: claim:2
  claim: An editorial note in the passage says some phases of the Owl-household incident
    are similar to the Deer-raiser incident in Matthews.
  claim_level: same_motif
  target: Deer-raiser incident in Matthews, as cited by Goddard
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The note only says 'some phases' are similar and gives no detailed
    parallel within the supplied passage.
