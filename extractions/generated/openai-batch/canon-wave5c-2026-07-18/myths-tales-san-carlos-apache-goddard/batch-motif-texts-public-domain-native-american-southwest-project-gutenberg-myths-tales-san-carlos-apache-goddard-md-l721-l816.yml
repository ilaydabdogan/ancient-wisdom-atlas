canonical_text:
  quote: ''
  summary: Naiyenezgani, stranded in the sky after killing beings who preyed on people,
    is aided by Eagle Chief, Chicken Hawk, Pelican Chief, and Raven Chief. They lend
    him bird shirts, train him to fly in circles, and guide his descent to earth.
    He returns to his grandmother. In a following episode, he comes to Old Man Big
    Owl's dwelling beneath a high rock, marries one of Owl's daughters, refuses food
    identified by his monitor as human flesh, orders the Owl household to wash and
    clean, and gives his wife inexhaustible cornmeal while teaching her to prepare
    human food.
  language: English
  quote_policy: summarized
