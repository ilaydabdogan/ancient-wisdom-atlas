canonical_text:
  quote: ''
  summary: Introductory material for Pliny Earle Goddard's collection states that
    the narratives are translations recorded during visits to the San Carlos Apache.
    It names two chief informants, classifies Apache myths into major origin/culture-hero
    narratives and ceremonial-origin narratives, notes a myth about a woman becoming
    a deer, distinguishes native tales from tales of European or Mexican origin, and
    states that the collection is not exhaustive.
  language: English
  quote_policy: summarized
