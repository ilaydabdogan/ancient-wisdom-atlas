canonical_text:
  quote: ''
  summary: A boy later named Naiyenezgani makes and tests an arrow, obtains flint
    after an attacking being runs at him, asks his grandmother about dangerous people-killers,
    follows information from a monitor by his ear, uses a blue fox and a yellow snake
    in an encounter with the cliff-kicking monster Tsidakelisi, kills Tsidakelisi
    with an obsidian club, and begins seeking Nagegani, a monster who kills by looking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: He begins without bow and arrows, finds reeds and a mulberry tree, and makes
    an arrow with a foreshaft and eagle plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A single feather and then two feathers fail in target practice against a cactus;
    with three feathers the arrow goes through the center.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: He asks his grandmother about flint; she tells him not to say that, and he
    goes far away until he finds flint.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: While he gathers flint pieces, Bee yilgai runs at him; he waits, thrusts with
    a dagger, and the being is broken to pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: He takes the flint pieces home, flakes a piece, and fixes it to the end of
    his arrow to make it sharp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He asks where the people-killers are, including the one who kicks people over
    a cliff, because of what the one sitting by his ear had told him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: His grandmother warns him not to speak of the cliff-kicking person because
    that person is dangerous and not to be mentioned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: He leaves under his own leadership with a blue fox as his pet and a yellow
    snake in the fold of his shirt, then enters a canyon trail between rock walls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: He finds a man lying against a cliff with one foot in the air; the man refuses
    to get up and let him pass.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The blue fox and Naiyenezgani avoid the man's kicks; Naiyenezgani repeats
    the passing action four times, and the man misses each time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Naiyenezgani throws the yellow snake near the man's head; the man says he
    fears that sort, and Naiyenezgani strikes him with an obsidian club, knocking
    him down from the cliff and killing him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The killed monster is named Tsidakelisi, and Naiyenezgani returns to tell
    his grandmother that he killed Tsidakelisi.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Naiyenezgani asks about Nagegani, described as one who kills people by looking
    at them; the monitor by his ear tells him where Nagegani lives, and he approaches
    the monster sitting with his children.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: An editorial note says the monitor is often explained as a fly or insect and,
    in some degree, as a guardian spirit; it also says wind serves Naiyenezgani similarly
    in Navajo myths.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: An editorial note says this version's trip to the sun concerns an adolescence
    ceremony and warrior equipment; it compares Hopi, Zuni, and Navajo versions in
    which two brothers visiting the Sun are war gods and the myth belongs to the warrior
    cult.
  category: other
  evidence_refs:
  - ev:12
