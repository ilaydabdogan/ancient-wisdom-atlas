canonical_text:
  quote: "“I am here because my wife is missing”"
  summary: A man later named Naiyenezgani arrives seeking his missing wife. A community
    says Golilisi has won their wives and people through gambling. After ritual preparation
    in a sweatlodge, Naiyenezgani defeats Golilisi in successive contests and wins
    the people back, then returns with his wife. In a following episode Ts’innagole
    carries Naiyenezgani through the air to a rock with her young; he questions and
    kills the young ones, hides, and strikes down Ts’innagole with one of Delgit’s
    knees.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A daughter of the house is sent through the village to summon people for a
    council, and the people smoke before asking why they have gathered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arriving man says he came from Gotalbakowadi after the sun’s beams were
    streaming from the east; Old Man Hawk says he did not come on foot because the
    distance is long.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man says his wife is missing, and the people identify another man sitting
    there as one who wins wives and people away in gambling.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people ask the arriving man for help, and he promises assistance the next
    morning.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: He directs that a sweatlodge be made, that good songs be sung, and that four
    kinds of wood be used to make poles for playing najonc; he sings twelve songs
    in the sweatlodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage names the helper Naiyenezgani and the opponent Golilisi; Naiyenezgani
    calls to nearby mountains and says his partner has come.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Naiyenezgani and Golilisi agree to play for the people; Golilisi is beaten
    in the najonc-pole contest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: They next test whose hair reaches farther across a dry stream bed, again wagering
    people, and Naiyenezgani wins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: They next try knocking over a tree; Golilisi cannot move it, while Naiyenezgani
    strikes it and the tree falls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: They run a footrace around a distant mountain; Golilisi wagers an arm and
    a leg, loses, and has one hand and one leg cut off.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After losing, Golilisi crawls into an old house, makes fire with a drill and
    dry grass, sets the house on fire, and speaks about being in a condition like
    someone with a broken arm or leg.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Naiyenezgani wins all the people back, starts home with his wife, and his
    grandmother is happy because he returns.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ts’innagole takes Naiyenezgani up, transports him through the air to her home,
    throws him down upon a stone, and carries him to her children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Naiyenezgani has Delgit’s knees concealed across his breast and Delgit’s blood
    under his blanket; after Ts’innagole throws him down, Delgit’s blood flows out.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The young ones say their mother returns when female rain falls, their father
    when male rain falls, and their brother when there is hail.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Naiyenezgani strikes the young ones on the side of the head, knocks them off
    the rock, covers himself with grass, and lies down.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: When Ts’innagole returns with another man, Naiyenezgani uses one of Delgit’s
    knees as a club and knocks her down from the cliff; he also knocks down another
    being that alights there.
  category: action
  evidence_refs:
  - ev:9
