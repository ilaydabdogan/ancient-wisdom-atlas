canonical_text:
  quote: ''
  summary: A boy completes several life-threatening tasks imposed by a chief after
    his brother reports claims about him. He fells a tree associated with a snake
    and is rewarded. Later, with a hawk’s guidance, he heals a rich man’s daughter
    by raising an iron screw in her head, and a baby is born after a black rattlesnake
    makes a noise. Finally, with help from a transparent white horse, he kills the
    monster Delgit and returns its tongue and hide as proof.
  language: English
  quote_policy: summarized
