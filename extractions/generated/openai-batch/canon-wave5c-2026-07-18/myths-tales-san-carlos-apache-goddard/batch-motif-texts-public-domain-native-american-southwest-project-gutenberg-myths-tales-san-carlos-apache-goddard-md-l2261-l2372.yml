canonical_text:
  quote: ''
  summary: 'The passage first continues a settlement-and-naming sequence: an unnamed
    speaker directs portions of a traveling people to live at landscape-marked places
    and gives each group a name. A new section, titled “The Development of Apache
    Culture,” describes the Indians as initially poor, lacking skins, rawhide, sinew,
    proper blankets, and moccasins; they use soapweed and bark, eat singed mice, and
    prepare mescal in an earth oven. They then learn to use deer and other animals
    for food and materials, make bows, arrows, sinew sewing, and moccasins. Finally
    they discover white people, steal burros, horses, and cattle, use their hides
    for moccasins and rawhide, and are said to live well and be happy.'
  language: English
  quote_policy: summarized
