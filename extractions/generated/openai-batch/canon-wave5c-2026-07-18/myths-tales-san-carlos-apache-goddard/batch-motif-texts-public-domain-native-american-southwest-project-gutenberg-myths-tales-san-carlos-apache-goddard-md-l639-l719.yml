canonical_text:
  quote: ''
  summary: Naiyenezgani asks his grandmother where Ts’innagole lives, is warned that
    it is dangerous, equips himself with Delgit’s bodily materials and bones, and
    travels out. A bird attacks him repeatedly, finally carrying him to its sky nest.
    The bird throws him onto a killing rock, but the prepared materials make it think
    he has died. Naiyenezgani rises, kills the young birds after questioning one about
    the weather and directions associated with the returning bird family, then ambushes
    and kills the returning birds as they bring human prey.
  language: English
  quote_policy: summarized
