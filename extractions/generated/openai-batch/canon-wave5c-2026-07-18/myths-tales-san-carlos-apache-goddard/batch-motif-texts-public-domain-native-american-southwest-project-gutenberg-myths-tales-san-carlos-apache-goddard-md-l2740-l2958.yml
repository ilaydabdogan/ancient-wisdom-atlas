canonical_text:
  quote: ''
  summary: A woman remains silent for four days, summons the people, directs that
    twelve tobacco tokens be sent to gather others, and sings deer songs through the
    night. She says she will go far north, asks that people pray to her where she
    lies down for the largest buck deer, and says a long-footed deer track will mark
    where she has gone. The following Deer Ceremony songs describe a four-direction
    hunting landscape with mountains of named materials, a house covered with deer
    skins from the four directions, deer horns, springs of colored red water, fawns,
    mouth blood markings, Panther Boy sending word for deer, a place where the Sun
    and Dipper face each other, and Panther Boy traveling with Walks-on-the-water
    over forked mountains.
  language: English
  quote_policy: summarized
