canonical_text:
  quote: ''
  summary: The passage concludes a Panther-Coyote episode in which Panther overtakes
    his former wife, removes Coyote’s children except one, confronts Coyote, and causes
    Coyote to die after swallowing heated stones and drinking water. It then begins
    a tale in which two sisters follow a pleasing flute sound, reject several birds
    as possible sources, find two boys and their grandmother, live with them for a
    time, and return home after sparks from the old woman’s fires annoy them. A note
    states that the tale was obtained among the Diegueños and is common among Yuman
    peoples.
  language: English
  quote_policy: summarized
