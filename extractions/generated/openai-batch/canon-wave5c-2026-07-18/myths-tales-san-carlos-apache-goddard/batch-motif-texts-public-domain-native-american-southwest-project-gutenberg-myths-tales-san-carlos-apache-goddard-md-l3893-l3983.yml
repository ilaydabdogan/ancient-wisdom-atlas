canonical_text:
  quote: ''
  summary: The passage contains the end of a river-crossing episode in which Pot sinks
    and Sack mourns; a tale in which a boy earns a non-decreasing loaf, a food-producing
    cloth, and a command-obeying hide, loses two items to a thieving old woman, recovers
    them through the hide, and later uses the hide against a chief who intends to
    hang him; and the beginning of a tale in which a younger brother prevents an older
    brother from killing a bullsnake and a hawk.
  language: English
  quote_policy: summarized
