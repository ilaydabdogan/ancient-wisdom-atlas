canonical_text:
  quote: ''
  summary: Two brothers encounter a starving horse; the younger saves it from the
    elder brother. Later the elder brother falsely reports to a chief that the younger
    boy has boasted he can survive a night in boiling metal. The chief orders the
    ordeal despite the boy's denial. The saved horse returns, speaks, and instructs
    the boy to use its blood before entering the boiling lead; the boy survives. The
    elder brother later falsely reports that the younger boy can permanently cut down
    a self-renewing cottonwood. The chief again orders the task. A bullsnake, also
    previously saved by the boy, comes to help by eating the tree's leaves so it cannot
    regrow.
  language: English
  quote_policy: summarized
