canonical_text:
  quote: ''
  summary: A boy hunts several animals for his grandmother, kills a deer under a Douglas
    spruce, and encounters a girl in the tree. He marries the Spruce Tree Woman, who
    tries to have four bears destroy him, but he kills them. While he is hunting,
    his wife is stolen by Golilisi. He follows tracks and is transported by his flute
    across successive mountain ridges before reaching a settlement and the house of
    the man he seeks.
  language: English
  quote_policy: summarized
