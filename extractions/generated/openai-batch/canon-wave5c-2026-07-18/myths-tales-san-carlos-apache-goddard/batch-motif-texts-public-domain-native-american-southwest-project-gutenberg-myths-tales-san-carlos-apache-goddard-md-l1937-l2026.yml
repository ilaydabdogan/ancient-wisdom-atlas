canonical_text:
  quote: ''
  summary: The supplied passage first concludes an episode in which Naiyenezgani is
    stranded on a rock, is carried down in a basket by Bat Old Woman under a warning
    not to uncover his eyes, causes a fall by looking, and restores her with life
    medicine. It then begins the first version of “Securing Fire,” where Martens hoard
    fire in tall pine trees, other people lure them down with a game, Coyote steals
    fire by igniting bark tied under his tail during a dance, and the fire is passed
    in succession to Night Hawk, Road-runner, Buzzard, and Humming Bird while the
    owners pursue and punish the carriers.
  language: English
  quote_policy: summarized
