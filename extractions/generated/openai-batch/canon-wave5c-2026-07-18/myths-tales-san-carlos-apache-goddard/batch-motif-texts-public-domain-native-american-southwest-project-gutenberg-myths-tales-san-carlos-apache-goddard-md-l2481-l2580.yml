canonical_text:
  quote: ''
  summary: A hunter establishes directional places for killing different kinds of
    deer, brings his wife to a newly made house, and repeatedly kills deer by stepping
    on blood footprints and shooting arrows through rings of named materials. He stores
    the deer meat on directional shades. The owners of the deer become angry and decide
    to visit the wife. Turquoise Boy goes wearing an animated deer head; the wife
    first sees him as deer-like and then as a man with the deer head hanging beside
    him.
  language: English
  quote_policy: summarized
