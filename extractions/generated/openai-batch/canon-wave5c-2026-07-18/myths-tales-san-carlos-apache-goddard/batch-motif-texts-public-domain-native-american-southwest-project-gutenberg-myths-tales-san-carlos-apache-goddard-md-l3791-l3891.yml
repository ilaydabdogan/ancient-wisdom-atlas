canonical_text:
  quote: ''
  summary: 'The passage contains the close of an eye-throwing tale in which Coyote
    imitates rabbits and loses his eyes in a tree, followed by a Tar Baby tale in
    which Fox is trapped by a pitch figure, tricks Coyote into taking his punishment,
    and Coyote is later deceived by Rabbit and by a grasshopper. It ends with a tale
    of personified Pot and Sack as woman and man: Pot breaks after jumping from a
    cliff and is repaired by Sack, while Sack burns in a large fire and is rescued
    and repaired by Pot.'
  language: English
  quote_policy: summarized
