canonical_text:
  quote: ''
  summary: Naiyenezgani's wife disappears while fetching water. He finds her water
    vessel, her tracks, and long male footprints; a monitor by his ear says Golilisi
    stole her. Naiyenezgani uses a flute to travel across four distant blue mountains,
    follows the trail to a canyon camp, and explains his search to the people there.
    The people say Golilisi arrived with a woman. Chiefs known for having seen many
    places are questioned about Talakqwa, Naiyenezgani's home; most deny knowing it,
    while Pelican(?) Chief says it is very far away and that Naiyenezgani did not
    travel on the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife goes a short distance from the house to get water, carrying her tos,
    and does not return after an unusually long time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Her husband finds only the tos by the water, her track, and two footprints
    of a man with a long foot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The one who sits by the husband's ear tells him that Golilisi stole his wife
    and that the pair went far away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Golilisi and Naiyenezgani are both said to have flutes with which they travel
    over the earth.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The monitor describes the abducted woman and Golilisi as having traveled in
    four stages to distant blue mountains before continuing on the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Naiyenezgani blows his flute four times, alighting at successive distant mountains
    where he sees his wife's tracks and the man's long footprints.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the four flute journeys, Naiyenezgani follows the trail on foot to a
    difficult canyon from which smoke is rising and learns that his wife was taken
    into the canyon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Near the camp's water trail, Naiyenezgani hides behind grass and throws a
    small stone into the water so that a girl fetching water notices him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The girl tells her father that the one who steals people is by the water;
    father and daughter repeat their opposing statements four times before the father
    investigates.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A company of men addresses Naiyenezgani as friend, asks why he did not come
    to camp as travelers should, and escorts him to the edge of a large camp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Naiyenezgani tells the camp people that someone there has taken a woman and
    that he followed her track to that place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The camp people reply that Golilisi came early that morning with a good-looking
    woman who might be the woman Naiyenezgani seeks.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Naiyenezgani says he came from Talakqwa, the people say they have never
    seen people from there and do not know any such place on earth.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Eagle Chief, Yellow-tailed Hawk Chief, and Raven Chief are summoned in turn
    because they claim broad knowledge of places, but each denies knowing Talakqwa.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: Pelican(?) Chief says that if the man came from Talakqwa since morning, he
    did not travel on the earth, and adds that Talakqwa is very far away.
  category: speech
  evidence_refs:
  - ev:12
