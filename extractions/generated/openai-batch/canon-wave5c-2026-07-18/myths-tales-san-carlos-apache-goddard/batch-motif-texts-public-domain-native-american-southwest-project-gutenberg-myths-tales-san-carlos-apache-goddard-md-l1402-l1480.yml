canonical_text:
  quote: ''
  summary: A girl, encouraged by her mother, lies where the rising sun's beams reach
    her; after her hips shake, her mother says the desired event has happened. After
    a twelve-month pregnancy she gives birth to a boy, who is named Tsitsinlgai, while
    the daughter is named Tubatc’istcine. The grandmother ritually cares for the boy,
    sings for him, makes arrows, and trains him to hunt. He kills mouse and rabbit,
    then is warned not to dress a deer under a Douglas spruce. He violates the warning,
    sees water fall, finds a maiden in the tree who calls him husband, and flees.
    The intestines he drops become gulches, and his grandmother hides him in a pit
    by the fire.
  language: English
  quote_policy: summarized
