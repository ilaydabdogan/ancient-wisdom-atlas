canonical_text:
  quote: ''
  summary: A woman offers a visiting man cornmeal mush and boiled deer meat, which
    he refuses; he asks instead for tips of shrubs that deer eat. After eating them,
    he persuades and coerces the woman to handle a deer head and skin. He throws deer
    parts on her, and she turns into a deer. He gives her a deer gait, makes her love
    him, herds her away after circling the house four times, and takes her toward
    the place where male deer live. The husband later traces footprints showing human
    and deer tracks and reports the woman's disappearance to the people.
  language: English
  quote_policy: summarized
