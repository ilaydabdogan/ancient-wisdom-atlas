canonical_text:
  quote: ''
  summary: A supernatural chief, identified in a note as Sun, provides foods, rain,
    calendar order, prayer pollen, languages, and instructions for people before going
    above the world. In the following tale, Coyote causes a rock to grow and strands
    Panther near an eagle nest; eagles take Panther to the sky, where he receives
    a wife and fights enemies, then returns with feather shirts and questions deserted
    household remains about how long the people have been gone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The supernatural chief makes fruits, vegetable foods, corn, agave, acorns,
    cactus foods, and promises rain for plant growth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supernatural chief makes day and night and arranges twelve months, divided
    into hot and cold parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief tells the people they should live happily on earth, says they will
    be his children, promises to look after them and pray for them, and says he will
    live on top of the sky.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief tells the people to pray to him, warns them to heed his words, says
    their speech and thoughts will be known to him, and says he will pass above the
    world daily and see them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief makes pollen for prayer, makes many languages, directs the people
    to scatter over the earth, and says he will go above to live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note identifies the previously unnamed individual as Sun.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Coyote, living with Panther, tells Panther about a good nest on a cliff and
    then speaks to the rock, telling it to grow up with Panther.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rock grows very high; Panther sees a fire below, cries, and sits in the
    nest with Eagle’s children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eagles fly down, put a feather shirt on Panther, and he flies up with them
    while they sing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the sky Panther finds many fruits, receives a wife, joins hawk people in
    warfare, and kills enemies described as pumpkins, melons, gourds, and bees.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: For Panther’s return, four kinds of feather shirts are put on him; the bird
    people fly beneath him as he descends and tell him not to let anyone see the feather
    shirts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Panther visits deserted dwelling places and questions charred fire remains,
