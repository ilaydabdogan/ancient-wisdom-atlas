canonical_text:
  quote: ''
  summary: The passage contains the conclusion of one fire-securing tale, a second
    version of securing fire, two versions of winning daylight, and the beginning
    of a clan-origin tale. Coyote and bird helpers obtain fire from its owners so
    that formerly fireless people receive it. Coyote also organizes dances or songs
    by which daylight is won from Owl and Bear, who prefer darkness. The passage ends
    with people migrating to a stream-side tree where half are designated as Tsjtenange.
  language: English
  quote_policy: summarized
