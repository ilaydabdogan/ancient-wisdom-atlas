canonical_text:
  quote: ''
  summary: The passage begins with a table of contents and then opens the first version
    of a creation myth. Four parentless primordial persons exist before people, earth,
    or sky. They confer about where to dwell, decide to make sky and earth, and Black
    Whirlwind forms the earth from cuticle taken from his breast. Colored whirlwinds
    help settle the earth in place. The makers then provide supports for the earth,
    create coyotes and bird-like human beings, and the passage ends with water covering
    the whole earth because those people were not good.
  language: English
  quote_policy: summarized
