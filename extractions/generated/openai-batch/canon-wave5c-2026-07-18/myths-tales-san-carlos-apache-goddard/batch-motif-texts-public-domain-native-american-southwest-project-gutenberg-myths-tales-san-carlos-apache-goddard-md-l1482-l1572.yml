canonical_text:
  quote: ''
  summary: A girl retrieves the boy she calls husband, gathers Douglas spruce from
    the four world quarters, and builds a circular house. The boy discovers that her
    vagina has teeth, breaks them with a white stone, cuts inside with an obsidian
    knife, and then agrees to marry her. The girl then tries to kill him by making
    four bears from her pubic hairs, but he tricks and kills the bears. Later the
    boy asks his grandmother about man-killing beings, sets out to kill them, and
    kills Nagegani by blinding him with exploding snakes thrown into the fire and
    stabbing him with a black knife.
  language: English
  quote_policy: summarized
