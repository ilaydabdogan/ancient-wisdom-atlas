  text: The younger of two girls gave birth to a boy by the roadside while returning
    home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy broke a quail's leg while hunting, repaired it with clay, and received
    information from the quail in return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The quail told the boy that people at the boys' home had eaten his father.
  category: speech
  evidence_refs:
