canonical_text:
  quote: ''
  summary: A narrative fragment recounts girls visiting a grandmother, a child born
    by the roadside, the child learning from a healed quail that his father has been
    eaten, and the child's escape through a gopher hole and across a river with help
    from a duck or old woman. A second tale begins with Coyote wishing water to rise,
    feigning death near a water place, drawing the Jack-Rabbit People and others into
    a dance, and later tricking Skunk in a race so that Coyote eats the flesh from
    a pile of bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls came to a grandmother, ground corn for her, and hid; the returning boys
    noticed marks on the ground made by the girls' buckskin dresses.
  category: sequence
  evidence_refs:
  - ev:1
