canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a chief testing knowledge of Delgit’s
    forked tongue, a boy reporting a man associated with his brother, and that man
    failing a blood-and-covered-metal procedure involving a poor white horse. It then
    begins “Magic Flight 1”: a stranger from a distant country visits a resident,
    later returns on horseback, tells the resident to follow the horse’s track, and
    the resident follows until the track vanishes at a high mountain. A raven on a
    tree warns him about the dangerous distant man and four intervening mountains,
    then agrees to carry him after receiving food, provided the man’s eyes are bound
    and he does not lift the bandage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief gathers people to ask whether anyone knows Delgit’s tongue, and
    an old man says the tongue is forked because he saw it when young.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy later thinks about his brother, concludes that his brother does not
    like him, and decides to report on him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy tells the chief that a man at a certain place has said he can do what
    the boy had done.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief summons the reported man and orders him to perform the alleged boast
    within four days, although the man denies making it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man brings a poor white horse, four vessels, and a knife, cuts the horse’s
    throat, and collects only enough blood to fill one vessel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man drinks some blood, washes in some, pours the remainder into metal,
    jumps in, and is covered; the next morning he is absent and nothing remains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the failed procedure, the people laugh and the boy continues to live
    happily.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: In the beginning of “Magic Flight 1,” a man travels far, comes among people,
    and later says he is from a distant country and will return again in a month.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stranger returns riding a horse; the resident says he wants to live with
    him and is told to follow the horse’s track after fifteen days.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The resident takes food, follows the horse’s track for a long distance, climbs
    a high mountain, and finds that the track has disappeared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A raven lights on a tree, speaks to the resident, asks where he is going,
    and warns that the sought man is far away, not good, and dangerous, with four
    mountains across the way.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The resident insists on continuing, offers his food to the raven, and the
    raven agrees to carry him close to the destination while binding his eyes and
    warning him not to raise the bandage.
  category: sequence
  evidence_refs:
  - ev:9
