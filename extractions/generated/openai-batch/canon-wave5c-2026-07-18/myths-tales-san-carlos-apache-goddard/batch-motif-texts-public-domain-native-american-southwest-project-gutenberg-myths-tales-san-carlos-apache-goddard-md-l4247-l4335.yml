canonical_text:
  quote: ''
  summary: A raven carries a man across successive mountain ridges toward a mountain
    where the man he seeks lives. The man is noticed by two daughters fetching water
    and is invited to the camp by their father, who assigns difficult work. The host
    orders him to level a mountain, plant it, make corn grow in one day, and return
    with corn. The youngest daughter brings food, puts him to sleep, completes the
    work with hand motions in four directions, and wakes him to gather the corn. The
    next day a horse-breaking ordeal follows; the horse speaks after being exhausted
    and says the man may choose one of twelve daughters. The passage ends as the twelve
    daughters stand in line and the man is blindfolded.
  language: English
  quote_policy: summarized
