canonical_text:
  quote: ''
  summary: A group identified as the Gans follows a woman's trail with the help of
    a named tracker. They find the woman among deer, separate and restore her to human
    form through a sequence involving feathers, a rope, arrows, and four rings. Later,
    after her return, she warns the people not to kill marked fawns and not to hunt
    on a black eastern mountain because she has given birth to fawns there. One man
    violates the prohibition, kills the fawns, and the woman grieves for them as her
    children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Gans discuss the matter and agree to go to the camp where the woman's
    track is to be found; they then rely on the named figure Gahnnjli’n to continue
    the trail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gahnnjli’n starts from where the woman had been sitting and trails her with
    forked or outspread fingers, following her to four places; at one place she had
    gone like a deer and encircled her camp four times.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Whirlwind is described as not good in his condition; the company sings for
    him and sends him back, after which they follow the trail without trouble.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The trail passes gaps and ridges named bacine, bailgaiye, tseltcee, and turquoise;
    near the turquoise ridge they hear songs or celebration from a canyon below.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gahnnjli’n says his downy feathers will find the woman in a herd of deer;
    the feathers settle on one in the middle of the herd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gahnnjli’n catches the one who had been a woman with a rope called yanadel,
    translated in the passage as “hanging from the sky.”
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: He shoots four arrows in succession, made of bacine, bailgaiye, tseltcee,
    and turquoise, and the noise frightens the deer away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rings of bacine, bailgaiye, tseltcee, and turquoise are thrown on the woman
    in sequence, restoring her human form progressively from head to full body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the company returns with her, the woman is described as wild.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman tells the people not to kill fawns with a white stripe between their
    hoofs and says that killing them will bring hardship.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that she gives this warning because she had given birth
    to fawns like those described.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: She also tells the people not to hunt on the black mountain standing at the
    east, because she had given birth to fawns there while gathering seeds; the people
    agree not to hunt there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: One man disregards the warning, goes to the black mountain, finds little fawns,
    kills them thinking they are deer young, ties them together, and carries them
    home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The woman recognizes the killed fawns as the ones to which she had given birth,
    cries, reproves the man, and then sits in her house crying for her children.
  category: relationship
  evidence_refs:
  - ev:6
