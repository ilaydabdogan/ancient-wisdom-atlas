canonical_text:
  quote: ''
  summary: The passage begins with an unnamed figure instructing people to select
    their own relatives. Naiyenesgani then asks for four girls and travels west, leaving
    three at named places and remaining with the fourth in the west. In the next story,
    Naiyenesgani goes among Pueblo Indians, repeatedly transforms their corn into
    snakes and back, is recognized as a medicineman, receives turquoise-covered clothing,
    and rescues Pueblo people taken into a sinking water-place by a monster. He drains
    the water with four colored hoops used at the four directions, silences a crane
    guard with a red stone, enters the place of the monster YeLagoLtsode, and uses
    smoke from a firedrill to drive captives out through four doors. A following story
    begins with a lake-dwelling monster fish that swallows Naiyenesgani; he sings
    inside it, cuts off its heart, and reaches the shore with it.
  language: English translation
  quote_policy: summarized
