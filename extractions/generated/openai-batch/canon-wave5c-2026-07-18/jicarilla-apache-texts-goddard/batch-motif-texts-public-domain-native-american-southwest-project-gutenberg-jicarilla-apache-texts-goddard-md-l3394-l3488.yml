canonical_text:
  quote: ''
  summary: A first-person hunting and travel narrative recounts seasonal deer hunting,
    repeated camp movements, sharing meat with visitors and Apache camp members, travel
    into Mescalero country, a nighttime move near soldiers, a search for water, and
    a later hunt in which the narrator and companions bring back deer and antelope
    meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In fall, the narrator goes deer hunting around Gallinas and Cebolla, kills
    a deer, and moves camp through several named places including TsekeL.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During winter, the narrator kills deer near camp, packs meat with horses,
    and remains camped in the area.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Navajo visitors come on horseback, eat meat at the narrator's camp, and carry
    some meat home.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring, the narrator says he will hunt once more, kills ten deer, brings
    meat on three pack horses, and goes to Misaye where his wife distributes meat
    and sinew to Apache people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A group travels from Tierra Amarilla through many named places into Mescalero
    country, camping near soldiers and among Mescalero people at Carrizo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A hunting party including Carilla camps near soldiers, nearly gets caught,
    and moves camp before daylight in rain after Carilla rides back at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the party separates into two bodies, they camp where there is no water;
    three people find a little standing water, but the main camp has moved away.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before daylight, the narrator and Luna go hunting together, find deer in timber,
    separate, and lose sight of each other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator climbs among trees to look around, misses deer because of the
    gun sight setting, later shoots a deer, butchers it, and puts the meat on a tree
    for later retrieval.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Near an arroyo, the narrator shoots seven deer, butchers them, retrieves a
    horse, and brings them back; other hunters also return with meat.
  category: action
  evidence_refs:
  - ev:8
