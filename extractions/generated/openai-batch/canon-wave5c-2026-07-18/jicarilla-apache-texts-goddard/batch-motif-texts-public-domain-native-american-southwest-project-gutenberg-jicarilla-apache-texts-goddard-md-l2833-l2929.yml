  confidence: high
  cautions: No supplied taxonomy family directly names this pattern.
- id: motif:2
  label: Concealed weapon reverses defeat
  taxonomy_refs: []
  basis: The Jicarilla appears to be tiring and is being carried toward the weapons,
    then remembers the knife suspended about his neck and uses it to stab the enemy.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the hidden knife action; broader trickster or deception
    classifications are not assigned.
- id: motif:3
  label: Scalp trophy followed by dance
  taxonomy_refs: []
  basis: The opening encounter ends with a scalp dance after a scalp is taken; the
    Ute battle also ends with scalps taken and a dance held at Cimarron.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage does not explain the dance beyond its occurrence.
- id: motif:4
  label: Failed peace mediation between facing battle lines
  taxonomy_refs: []
  basis: An old captive woman rides between two lines saying she came to make peace,
    but fighting begins before the peace effort succeeds.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not state why the attempt fails.
- id: motif:5
  label: Women mutilate the dead to protect warriors from pollution
  taxonomy_refs: []
  basis: The story shows an Apache woman mutilating a wounded enemy, and the note
    states this was customary among Apache women to prevent warriors from losing their
    luck by pollution.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The custom is given in an explanatory note; the passage gives only one
    narrated instance.
- id: motif:6
  label: Name explained by battle object
