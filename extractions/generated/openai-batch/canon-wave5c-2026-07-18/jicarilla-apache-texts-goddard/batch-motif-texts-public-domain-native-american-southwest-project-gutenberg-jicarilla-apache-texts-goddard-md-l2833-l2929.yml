canonical_text:
  quote: ''
  summary: The passage contains the end of a story about a Jicarilla scout and an
    enemy scout who negotiate by signs, lay down weapons, fight by hand, and end with
    the Jicarilla killing, scalping, and taking weapons from the enemy, followed by
    a scalp dance. It then gives a story in which an old captive woman attempts to
    make peace between Ute and enemy lines, but fighting begins; Ute defenders battle
    from behind piled property, an Apache woman mutilates a wounded enemy and removes
    his wrist guard, the Ute capture horses, kill enemies, take scalps, and hold a
    dance at Cimarron. Footnotes explain circumstances of testimony, a woman’s isolation,
    name giving, and a stated custom regarding women mutilating the dead to protect
    warriors from pollution. The passage begins a following story about the Ollero
    going on a buffalo hunt with loaned animals and capturing two buffalo calves with
    a lasso.
  language: English
  quote_policy: summarized
