canonical_text:
  quote: Raven had the buffalo all shut up.
  summary: The passage gives versions of a story in which Raven keeps buffalo hidden
    or confined and the people obtain their release through a disguised dog or through
    Raven’s smallest child removing a stone from an opening to the lower world. It
    then begins another story about a gambler with a speaking turkey who tries to
    cut a tree by a river, but the tree restores itself, and a talking god addresses
    him.
  language: English translation with OCR artifacts
  quote_policy: quoted
