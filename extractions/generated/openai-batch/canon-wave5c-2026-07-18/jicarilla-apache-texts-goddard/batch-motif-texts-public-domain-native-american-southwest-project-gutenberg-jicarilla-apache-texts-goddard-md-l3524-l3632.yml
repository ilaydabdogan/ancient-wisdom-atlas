canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of making a sinew-backed bow, constructing
    and ceremonially occupying a tipi, and preparing corn and other foods by roasting,
    grinding, boiling, baking in ashes, and serving. It includes communal tipi sewing
    and raising by women, fire-starting and singing by a medicineman, a feast, and
    spoken address to mush poured over a metate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A piece of bow wood is cut to length, shaved, covered at the middle with split
    yucca leaves, heated with ashes, and bent back while a foot presses the middle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rawhide is scorched and boiled in water to make glue; sinew is soaked, shredded,
    dried on a pole, applied to the roughened bow back, dried in the sun, and the
    bow is strung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seven buffalo skins are softened with brains, dried, arranged as a tipi cover,
    and sewn together with twisted sinew by many women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During tipi raising, many women hold the cover; one whistles; they pull the
    cover toward the center while saying, “Make it lap.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sticks are placed above the doorway, pegs fasten the bottom, two poles hold
    the smoke-hole flaps, and a place is dug for the fire.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The smoke hole is described with the body term “mouth.”
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A medicineman starts the fire with a firedrill while others are sitting about.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women prepare food for a feast; people gather in the evening; the medicineman
    begins singing about dark with help from others until dawn; they eat at midnight
    and again in the morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Leftover sinew from the sewing is tied with eagle down to the inside of the
    tipi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The tipi is described as used like a house, warm in winter, re-softened by
    hand when hard, folded, and packed on a horse when camp moves.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Corn is roasted in the ear, ground with a metate, stirred into hot water,
    cooked, served in bowls, and eaten from the hand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another preparation, sprouted wheat is ground and added after corn meal;
    sugar is added when the food is served.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Corn mush is poured into a snow hollow or onto a metate; when poured on the
    metate, people say to it, “Run far off from the stone,” and the passage says it
    does not run very far when told this.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Other foods described include peas and corn cooked with deer feet, roasted
    and ground peas made into soup, wheat dough and amole fruit placed in ashes, and
    roasted beans cooked as soup and eaten with bread.
  category: sequence
  evidence_refs:
  - ev:9
