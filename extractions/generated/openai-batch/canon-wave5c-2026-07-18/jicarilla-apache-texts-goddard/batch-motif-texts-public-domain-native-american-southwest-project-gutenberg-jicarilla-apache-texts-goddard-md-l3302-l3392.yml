  summary: A first-person account describes moving camps through mountain, river,
    lake, and canyon areas; singing for deer; coordinated deer and elk hunts; butchering,
    eating, drying, transporting, selling, and distributing meat; and attending feasts
    with Pueblo, Mexican, and Ute participants nearby.
  language: English
  quote_policy: summarized
