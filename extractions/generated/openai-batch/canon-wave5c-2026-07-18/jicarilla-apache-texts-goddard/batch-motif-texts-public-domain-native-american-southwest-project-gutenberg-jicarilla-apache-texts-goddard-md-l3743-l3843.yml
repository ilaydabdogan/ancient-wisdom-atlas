canonical_text:
  quote: ''
  summary: The passage combines a narrative of a victory dance, a burned tc'actcim,
    searches in the four directions, directional gods, eagle-down divination, and
    recovery of a buried girl, followed by descriptions of medicine, grizzly-dance,
    and adolescence ceremonies involving sand images, animals, songs, rattles, medicine,
    four-night dancing, supernatural food, prayer, pollen, and renewal.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people formerly lived at Tseyakinehl, where everything grew, and later
    went eastward to war on the plains.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After bringing home an enemy scalp, the people danced a victory dance and
    prepared a fire pit for cooking corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One girl remained at the fireplace after the dance, and attempts to drive
    her to the dancing place failed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: One of the tc'actcim jumped into the pit and was burned; the other tc'actcim
    searched for him without success.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Searchers went toward the east, south, west, and north and returned to the
    dancing place without finding the missing one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people called on supernatural beings on the earth for help, and a messenger
    brought named gods from the directions of sunrise, south, sunset, and north.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The girl was put into a hole, covered with a flat stone, and covered over
    with ashes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Eagle down on a stick was used while searching; when the searchers came over
    the fire pit, the feathers pointed toward it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The searchers listened to the ground and heard the burned one laughing below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The feathers later pointed toward the place where the girl was hidden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: XastcInyaLkldn stood with a flint sword, faced four directions in turn, made
    four striking motions toward the girl's direction, and drew her out of the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the medicine ceremony, smooth sand was spread out and eagle tail feathers
    were set around its border in a circle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Red, yellow, white, blue, pollen, and L'ectcic were prepared, and a clay vessel
    containing water was placed in the center.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Colors were strewn to make all animals on the earth, and participants checked
    that none were omitted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Patients sat in a row on the animal images while the medicineman shook a rattle
    and sang.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The patients cried, their hands and feet became distorted, the medicineman
    placed the rattle under their feet and on their hands, embraced them, and they
    got well after using the medicine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: A second description says the medicine ceremony begins with making a lodge
    and sand pictures of every kind of animal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: One ritual actor pounds an herb, rolls around like a grizzly, and says “wa.”
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The one who has supernatural power for the ceremony makes the patient well
    again.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: The tc'actclni and ts'anat'i are made, and women and men dance together for
    four nights.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The passage gives an injunction that the practice should not be discontinued
    as long as the world stands, and connects this to dancing four nights.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:22
  text: At the dance, cherries, yuccas, rabbits, bread, and a pot of mush are made;
    the mush becomes full and is finished in one night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:23
  text: The passage identifies the described fiesta as the grizzly dance.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:24
  text: In the adolescence ceremony, people come early in the morning to the holy
    girl, who becomes YoLkaiisdzan.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:25
  text: A young boy is brought, an old man comes, and old women gather, sit about,
    smoke, and pray for the girl and boy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:26
  text: The prayers ask for renewal, happiness, health, old age, strewn pollen, strewn
    L'ectcic, and pollen on the feet.
  category: speech
  evidence_refs:
  - ev:10
