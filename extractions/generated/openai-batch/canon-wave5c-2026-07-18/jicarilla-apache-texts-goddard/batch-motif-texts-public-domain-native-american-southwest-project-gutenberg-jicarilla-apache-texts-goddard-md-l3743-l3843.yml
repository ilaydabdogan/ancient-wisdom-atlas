candidate_motifs:
- id: motif:1
  label: directional quest for a missing being with supernatural helpers
  taxonomy_refs:
  - mystical_quest
  basis: Searchers go to the four directions, call on supernatural ones, and bring
    named directional gods to help find the burned tc'actcim and hidden girl.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage presents a search and supernatural assistance, but does not
    frame it as a quest in abstract terms.
- id: motif:2
  label: ritual detection of hidden persons
  taxonomy_refs: []
  basis: Eagle down on a stick points toward the fire pit and later toward the hidden
    girl, allowing the searchers to locate both.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage only describes
    this local divinatory action.
- id: motif:3
  label: person recovered from underground concealment
  taxonomy_refs: []
  basis: The girl is placed in a hole under stone and ashes, then is located and pulled
    out of the ground by a god using a flint sword and four-directional gestures.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not state that the girl dies, so death-and-rebirth or
    resurrection taxonomy is not assigned.
- id: motif:4
  label: fourfold directional ritual pattern
  taxonomy_refs: []
  basis: The narrative uses east, south, west/sunset, and north for the search and
    gods; XastcInyaLkldn faces four directions; the later dance lasts four nights.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage does not explicitly interpret the number four; the motif is
    identified from repeated literal structure.
- id: motif:5
  label: healing ceremony through sand images, animal totality, rattle, song, and
    medicine
  taxonomy_refs: []
  basis: The medicine ceremony makes all animals on earth in colored sand materials,
    seats patients on them, and heals them through rattle, song, embrace, drinking
    medicine, and applying medicine.
  evidence_refs:
  - ev:5
