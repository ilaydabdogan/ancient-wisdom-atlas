candidate_motifs:
- id: motif:1
  label: Danger rule for mishandling meat-transport gear
  taxonomy_refs: []
  basis: The passage gives a rule against throwing around feet and horse equipment,
    with the stated consequence that the horse may slip and fall.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as a rule rather than a narrative episode.
- id: motif:2
  label: Buffalo-attracting rite with material trace, powders, prayer, song, and responsive
    sign
  taxonomy_refs: []
  basis: Buffalo manure, pollen, L’ectcic, prayer, and four songs are used; buffalo
    bellow and the manure moves, followed by communal prayer for buffalo and meat.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No broader mythic explanation for the rite is given in this passage.
- id: motif:3
  label: Hunting prayer and animal-imitative buffalo dance
  taxonomy_refs: []
  basis: The prayer asks for buffalo to come near and for meat; participants sing
    and dance while making horn gestures on their heads.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly describe transformation into buffalo;
    it only describes dance gestures.
- id: motif:4
  label: Restricted eagle handling associated with illness
  taxonomy_refs: []
  basis: The note says that a person who does not know how must not touch eagles,
    and lists sickness and bodily symptoms if he does.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not specify the required knowledge or procedure.
- id: motif:5
  label: Infant washing, powdering, painting, and wrapping ceremony
  taxonomy_refs: []
  basis: The infant ceremony uses water, pollen, L’ectcic, red paint, a blanket, and
    a tying string in a described sequence.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not state the ceremony’s purpose beyond describing its
    actions.
- id: motif:6
  label: Affinal avoidance between mother-in-law and son-in-law
  taxonomy_refs: []
  basis: The passage states that mother-in-law and son-in-law are afraid of each other
    and that the man does not go close to her.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The note alludes to deer raiser but does not include the larger narrative
    context.
- id: motif:7
  label: Mortuary preparation with burial goods, horse killing, and hair cutting
  taxonomy_refs:
  - sacrifice
  basis: The burial account includes dressing and painting the body, placing goods
    with it, transporting it on a horse, covering the grave, killing and decapitating
    the horse, and relatives cutting hair.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage states that the horse was killed in the burial sequence but
    does not explicitly call it a sacrifice or explain its intended meaning.
