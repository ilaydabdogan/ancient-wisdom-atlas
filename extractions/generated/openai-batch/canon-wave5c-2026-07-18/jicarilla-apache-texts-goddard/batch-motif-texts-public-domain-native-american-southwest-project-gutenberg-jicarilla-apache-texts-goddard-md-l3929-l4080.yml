canonical_text:
  quote: ''
  summary: 'The passage gives short translated notes on rules and ceremonies: a warning
    against throwing meat-transport items because a horse may fall; buffalo ceremonies
    and prayers involving a medicineman, pollen, L’ectcic, smoke, song, dance, horn
    gestures, and hopes for meat; a warning about touching eagles without proper knowledge;
    an infant water-and-powder ceremony with red painting and wrapping; a custom of
    mother-in-law and son-in-law avoidance; and burial practices involving dressing
    the dead, grave covering, killing a horse, and relatives cutting hair. A bibliography
    follows and is not motif-bearing for this extraction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are told not to throw feet, saddle, saddle blanket, rope, or bridle
    around, because if these things are thrown about the horse may slip and fall.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the buffalo ceremony, buffalo manure is brought to the medicineman, who
    makes a level place, gathers men, scatters pollen, strews L’ectcic, prays, and
    sings four times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the medicineman sings, buffalo bellow from a distance, and the buffalo
    manure stands on edge, moves itself, and shakes off the L’ectcic.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people pray that buffalo may be near, that they may camp among them, have
    much to eat, and return to their own country with plenty of meat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the buffalo prayer, the speakers say they make smoke, expect many buffalo
    nearby, will go among them, kill many, camp among them, and bring meat home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: They sing and dance for buffalo, make horns on each side of their heads, make
    motions, and also sing for the young yellow calf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A person who does not know how is not to touch eagles; if he does, he will
    get sick, his arms and legs will draw up, he cannot walk, and his bones ache.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the infant ceremony, a vessel of water is set in the tipi; the performer
    stands west of it, strews pollen and L’ectcic toward the water, places both powders
    on the baby’s crown, rubs water on the baby’s feet and hands, and bathes and washes
    the baby.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The infant’s face, tying string, and blanket are painted red; the infant is
    wrapped in the blanket and tied with the string.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that a woman was afraid of deer raiser, and explains a
    custom in which a mother-in-law and son-in-law are afraid of each other and do
    not go close to each other.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the burial account, the dead person is dressed in moccasins, leggings,
    and other best property; people wail; the face is painted red; smaller property
    is placed in the blanket; and the corpse is placed on a horse led by kinsmen.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the grave, the body is placed in it, sticks and stones are put over it,
    the horse is killed and its head cut off, and relatives cut their hair.
  category: sequence
  evidence_refs:
  - ev:11
