canonical_text:
  quote: ''
  summary: A translated Jicarilla Apache account narrates fighting with American soldiers
    and allied groups, repeated camp movements, mountain refuge, starvation, peace-making
    with gifts, and the beginning of a following account in which Navajo steal Apache
    horses and Apache/Ute parties pursue and raid for horses and mules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Jicarilla were camped at Alora, and another large band was camped on the
    Chinadian; the Apache killed a cow that was wearing a bell.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: American soldiers demanded four chiefs, and the Jicarilla refused to give
    them up and moved camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the first fight, the Americans passed canteens, drank whisky, and then
    rode toward the Apache shooting; three Americans were killed and one Apache had
    a finger shot off.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a mountain east of Picuris, an American approached with a paper; an Apache
    took it and tore it up, and the person who handed it was shot in the arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the second fight, the Indians surrounded the soldiers; only two soldiers
    were left, four Apache were killed, and the Apache took arms and money from the
    soldiers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Apache moved through multiple named places, including the west side of
    the Rio Grande, El Rito, Vallecitos, Coyote, Conejos, Saikanyediye, the Arkansas
    branch near Pike's Peak and Pueblo, and a canyon where they mingled with the Ute.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A company composed of Mexicans, Pueblos, and soldiers followed and shot at
    the Indians while the Indians moved camp without anyone being killed in that episode.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Apache and Ute rode to a place where a Mexican was living, killed the
    people there, brought back a scalp, and danced with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: During later fighting east of Pueblo, the Apache climbed to the top of a mountain
    on foot and later moved westward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When soldiers, Mexicans, and Pueblo Indians fought them again, the Ute withdrew,
    and the Apache broke into small bands and scattered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Apache stayed in the mountains while Mexicans, Pueblos, and American soldiers
    fought them; many old women and children died of starvation.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Cangillon near Abiquiu, American soldiers made peace with the Apache and
    distributed goods from wagons; a dialogue states that only a reduced number remained
    and that they were nearly exterminated.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A source note says Casa Maria reported being about twelve or fourteen when
    the events happened and identified the American general O-idi as probably the
    man Americans called Kit Carson.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the following account, while the Apache camp was at Cimarron in springtime,
    the Navajo came and drove away their horses; the Apache pursued and recovered
    only poorer horses found standing one by one.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the fall, Ute and Apache together went after the horses and drove away
    horses of some Mexicans at KoLtsoye, also taking and hiding two mules in the brush.
  category: action
  evidence_refs:
  - ev:9
