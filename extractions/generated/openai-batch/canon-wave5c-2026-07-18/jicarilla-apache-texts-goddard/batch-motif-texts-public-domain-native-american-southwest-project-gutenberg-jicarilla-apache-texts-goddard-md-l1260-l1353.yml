canonical_text:
  quote: ''
  summary: A young man refuses an old man's pipe tobacco, then gives him cigarettes
    whose smoke affects the old man's body. Through repeated visits, cigarettes, tracks,
    a river crossing, and gathering corn and tobacco, corn is brought to the people
    and exchanged for deer. A woman then establishes traits and habitats of deer and
    turkeys, calls animals from the directions, kills many, and declares that people
    will live upon them. The next section begins a second version in which a man and
    a small turkey travel down the Rio Grande toward four difficult places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man repeatedly fills pipes with tobacco, blows smoke, and asks the
    young man whether he wants to smoke; the young man refuses each time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man smokes a cigarette tied to his belt and gives it to the old
    man after the old man says he wishes it were his turn to smoke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After inhaling the young man's smoke and being smoked against the soles of
    his feet and palms of his hands, the old man's legs straighten and he begins to
    get up.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Outside after one visit, only one footprint is visible; a note explains this
    as traveling with lightning.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:5
  text: The young man returns on successive evenings with cigarettes; after one later
    visit, two tracks are visible outside.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The old man says he does not think the visitor is a human being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man and woman walk across the river on top of the water, gather corn and
    tobacco, and the woman later wades back through the river with corn for her people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man gives corn to his father-in-law, and the father-in-law gives him the
    deer he possesses in return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old man is named DinideyiniLt’j^nne, glossed as “Game he raised,” and
    the other man is named AtdiLdeyeseLdli, glossed as “He floated down.”
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Deer eat the leaves from the woman's brush shelters, and the woman strikes
    the deer with a fire poker while saying deer will have a sense of smell.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman says turkeys shall live in the mountains and people will live upon
    them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The woman calls her children from the east, south, west, and north, describing
    them by shared horns, bodies, tails, and ears.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Animals come back from the north and west, surround the woman, and she kills
