candidate_motifs:
- id: motif:1
  label: Bird self-description as natural history explanation
  taxonomy_refs: []
  basis: Several bird figures speak in first person about their names, bodily markings,
    foods, habitats, voices, and repeated formulae such as their nature.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage gives descriptive speeches rather than an explicit origin
    episode for every feature.
- id: motif:2
  label: Animal provider with evening meat basket
  taxonomy_refs: []
  basis: Owl says his basket will be full of meat when the sun goes down, appears
    at evening with meat at two cedars, and gives it to a guest for children.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The source of the meat and the process by which the basket fills are not
    explained in the passage.
- id: motif:3
  label: Great hunter with overflowing meat and hides
  taxonomy_refs: []
  basis: Panther’s hunting fills the household with buckskin and drying meat, and
    Wolf later claims similar abundance and reliability as a meat provider.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: Panther’s success is narrated directly; Wolf’s success is presented as
    his own speech and may not be independently confirmed in this passage.
- id: motif:4
  label: Mind travel while body remains
  taxonomy_refs:
  - duality
  basis: The four men are said to go about with their minds while their bodies remain
    lying at Taos.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explain the mechanics or religious meaning of this
    mind-body separation.
- id: motif:5
  label: Four-direction inward attack
  taxonomy_refs: []
  basis: The four men take positions facing inward from the four directions and drive
    the enemy toward the center.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The scene is framed as a battle action; no explicit cosmological interpretation
    is supplied.
- id: motif:6
  label: Disbelieved messenger punished by authority
  taxonomy_refs: []
  basis: A messenger delivers a request to the governor, but the governor does not
    believe him and places a ball and chain on his ankle.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage ends before the consequences of the governor’s disbelief are
    shown.
