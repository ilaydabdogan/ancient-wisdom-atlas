canonical_text:
  quote: ''
  summary: 'The passage contains several short tales or self-descriptions: an unnamed
    tree-dwelling bird describes its powers, markings, bill, tree habitat, pitch-eating,
    and flight; Flicker and Lewis Woodpecker describe their names, bodies, voices,
    foods, and young; Owl describes a basket, a meeting place at two cedars, meat
    given to a guest for children, and feared features; Panther is described as a
    great deer hunter whose household has abundant meat and hides, while Wolf receives
    meat and claims similar prowess; the beginning of a tale about four men at Taos
    describes mind-travel while bodies remain on a platform, an attack from four directions,
    a messenger to the governor Old-woman-her-hand-white, and the governor’s disbelief
    and punishment of the messenger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed bird speaker says it has supernatural power, carries rotten pine,
    pulls off bark, has a red-painted face and a bill for carrying wood, pecks without
    headache, lives among trees, eats pitch, flies between tree tops, and sleeps in
    its house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Flicker names himself Gose and describes a long bill, red undersides of wings,
    blue legs, pinkish eye borders, and a loud voice liked by people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lewis Woodpecker names himself Niji, describes shining eyes, beads, a black
    coat, a red breast, a summer shout known to people, and says he raises children
    in a hole in a tree where the young eat insects.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Owl names himself Vi, says he carries a basket, frequents low gaps looking
    for people, and sings for them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Owl tells a guest that food lies in the basket; the guest says there is nothing
    in it, Owl says there is pemmican, and says the basket will be full of meat when
    the sun goes down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The guest comes to Owl at the place where two cedars stand and finds him at
    evening with a basket full of meat; Owl gives meat to the guest for his children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Owl says people fear him because of his eyes and yellow horns, and he quotes
    his own call.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Panther kills many deer, specifically big bucks, has a house full of buckskin,
    eats particular parts of the deer, and his wife and daughter dress hides.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Meat dries on trees near Panther’s house; Wolf visits, receives a hind quarter
    and pounded meat, and later his children eat the meat happily.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wolf claims that he too kills bucks, provides hind quarters, fat, buckskin,
    and deer meat, and that no one asks him for meat in vain.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Four men at Taos are said to lie on a shade while going about with their minds,
    their bodies remaining at Taos.
  category: action
  evidence_refs:
  - ev:10
  - ev:14
- id: obs:12
  text: The four men attack the enemy by taking positions facing inward from four
    directions, drive the enemy toward the center, kill them, burn their property,
    and return to Taos.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: After another enemy camp is found, a messenger is sent to the governor Old-woman-her-hand-white;
    the governor disbelieves the messenger and puts a ball and chain on his ankle.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
