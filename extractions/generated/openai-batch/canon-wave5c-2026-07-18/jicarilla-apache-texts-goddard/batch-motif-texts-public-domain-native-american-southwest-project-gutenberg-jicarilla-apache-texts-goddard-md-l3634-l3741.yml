canonical_text:
  quote: ''
  summary: The passage first describes preparing a fermented corn drink. It then gives
    an account of the origin of a medicine ceremony in which animals and painted ceremonial
    dancers perform for sick men, use ritual objects, make plants and a rabbit appear,
    and explain a prohibition against looking through the fence by recounting viewers
    turning into pine trees. A later eyewitness account describes two old men and
    painted dancers making corn grow, restoring and transforming mullers, distributing
    corn and bread, and making medicine for the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn is soaked, sprouted, dried, ground, mixed with heated water, strained,
    cooled, left to bubble in a barrel, and drunk after bubbling stops.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black Bear, Turkey, Rattlesnake, and other animals associated with fruits
    gather and celebrate a medicine dance for three sick men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony includes a fenced dancing ground, a dug hole, a basket covered
    with buffalo hide, and moccasins of the sick men tied together and used to beat
    the basket.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A singer shakes rattles made with buffalo tail and rattlesnake tails while
    another person beats on the covered basket with the moccasins; this is done for
    four nights.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a ceremony west of Taos, a brush fence blocks outside viewing, a mountain
    sheep leg bone is rubbed on a notched stick, and tc’actcini and ts’anat’i enter
    and dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage’s note describes tc’actcini as four figures painted with black
    horizontal stripes over white clay, and ts’anat’i as usually twelve figures covered
    with white clay, yucca bands, and eagle feathers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ceremonial figures place corn, cherries, and amole seed in a ground hole and
    place a rabbit tail in a clay pot; later the plants are mature and a live rabbit
    emerges.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: People who look through the ceremony fence from outside turn into pine trees,
    and this is given as the reason for not looking through the medicine corral fence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a later ceremony west of the Rio Grande opposite Taos, two old men conduct
    a ceremony for two persons, put corn in a deep hole, introduce painted dancers,
    build a large fire, and use a pot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dancers place corn in a pot set away from the fire; after poking the pot there
    is crackling and smoke, and after four circuits around the fire the pot is filled
    with corn and the corn grows leaves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dancers hold mullers toward the east, south, west, and north, break a
    muller and restore it, and later return with mullers that have become bread.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:12
  text: Corn and bread are distributed to the people, and the ceremony is said to
    make medicine good for all.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
