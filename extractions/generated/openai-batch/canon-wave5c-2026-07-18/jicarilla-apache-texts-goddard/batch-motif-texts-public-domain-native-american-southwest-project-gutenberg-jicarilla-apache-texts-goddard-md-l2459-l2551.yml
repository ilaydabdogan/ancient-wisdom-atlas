canonical_text:
  quote: ''
  summary: A messenger named Okadi is found restrained in jail after failing to return.
    A party returns toward Taos with horses and bells, repeatedly receives short camping
    directions from Old-woman-white-hands, and mocks him. Okadi later scouts the enemy,
    obtains food and water from them, and the attacking men move against an enemy
    camp divided by an arroyo. One side is killed with war clubs, while the non-fighting
    side is treated as friends. Goods and horses are distributed, Old-woman-white-hands
    is said to have become rich, and the four men return to their shade in one day.
  language: English
  quote_policy: summarized
literal_observations:
