canonical_text:
  quote: ''
  summary: The passage opens with an editorial note on varying accounts of two Apache/Navajo
    culture heroes, including variant parentage and their relationship to a grandmother
    figure. In the narrative, Owl and his wife try to boil and roast two boys, but
    the boys remain unharmed. They receive a hoop and pole and return to their grandmother.
    In the next episode, Naiyenesgani, aided by a partner, kills an Elk that had been
    killing people, takes its hide and other parts, and then uses the hide when confronting
    an Eagle that carries him to its young.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The editorial note reports varying versions: some say there is one person
    with two names, while others say there are two persons with different fathers,
    water and the sun; the mothers are also described in variant ways.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editorial note calls the figures culture heroes and says their names,
    birth, and exploits are Southwestern, with only a few particulars connected to
    northern twin-brother mythology.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Owl has the boys chopped up, placed in a pot, covered with water, and set
    by the fire to boil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Although the water boils, the boys stand at the bottom of the pot telling
    stories, and each jumps out when Owl's wife pokes into the pot with a stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Owl says the boys are using supernatural power so that they may not die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Owl orders the boys put in ashes to roast; they sit in the middle of the fire
