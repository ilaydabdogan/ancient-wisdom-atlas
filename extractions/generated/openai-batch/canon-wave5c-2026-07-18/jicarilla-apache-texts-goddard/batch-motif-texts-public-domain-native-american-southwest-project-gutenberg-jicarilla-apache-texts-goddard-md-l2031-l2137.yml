canonical_text:
  quote: ''
  summary: Coyote visits Buffalo, Elk, and a red-feathered bird and repeatedly tries
    to imitate their distinctive ways of providing food or appearing fiery, but his
    imitations fail or endanger him. A separate tale follows in which Coyote sends
    Turkey to be eaten by his family, but Turkey changes the message so that Coyote's
    family kills and eats the youngest child instead; Coyote then unsuccessfully pursues
    the turkeys as they fly from tree to tree. The passage ends with the beginning
    of another tale in which Coyote meets a small brown bird feathering arrows.
  language: English
  quote_policy: summarized
