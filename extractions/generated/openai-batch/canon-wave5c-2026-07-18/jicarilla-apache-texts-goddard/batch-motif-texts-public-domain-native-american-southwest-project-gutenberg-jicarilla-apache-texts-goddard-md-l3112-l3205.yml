canonical_text:
  quote: ''
  summary: The passage first records camp movements and buffalo hunting, then narrates
    a Ute who fights enemies alone, is shot through the chest, receives war-medicine
    by means of grama grass, smokes a pipe, and survives. The account continues with
    pursuit of the enemy, taking of property and horses, and a scalp dance. A following
    account describes Pesita and other conflicts involving shooting, injury, compensation
    by horse, ration disputes, a jailed man returned, and later peacemaking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group moved camp through named places, found buffalo, killed some, dried
    meat, packed it in parfleches on horses, and returned through named river locations
    toward Cimarron.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medicine ceremony with dancing took place east of Picuris, after which the
    Apache moved camp to the top of a mountain and then through several named camp
    places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Ute from the Cimarron camp went to town to buy whisky in canteens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Enemies coming from the east met the Ute, and he began fighting them while
    alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ute's people came to the fighting place on the Canadian River; the Ute
    was shot through the chest, held the horse's neck, fell, spit blood, and sat up
    after his medicine was untied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Medicine was placed in the Ute's mouth four times with a spear of grama grass.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ute asked for a pipe, smoked it, the blood stopped flowing, and a cloth
    was tied around his chest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pursuers went after the enemy; one enemy was killed, the retreating enemy
    threw away weapons and clothing, the Apache took property including horses, and
    they danced with the scalp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pesita and another Indian shot at each other; the other man was killed by
    an arrow, the Ollero came near Pesita's tipi, Pesita was shot through the thigh
    with a musket ball, and the Ollero left westward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Afterward Pesita gave them a good horse and they made friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Later, during a return for rations, Indians and Americans were involved in
    shootings, but the American agent did not want to fight and mutual shooting did
    not occur at that moment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a later shooting at the same place, one Indian was killed and another jailed;
    after a confrontation, the jailed man was returned and soldiers later made peace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During ration distribution, one man struck the Agent with a bone; shootings
    followed, the Agent went into his house and later came out with a hand wound,
    and the two sides approached without further attack.
  category: sequence
  evidence_refs:
  - ev:9
