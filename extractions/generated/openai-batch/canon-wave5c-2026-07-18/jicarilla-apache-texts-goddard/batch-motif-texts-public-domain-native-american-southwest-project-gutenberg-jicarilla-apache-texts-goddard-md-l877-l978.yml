  confidence: medium
  cautions: The passage gives a literal up-and-down route but does not explain the
    full cosmological structure of the destination or origin.
- id: motif:2
  label: theft and relay distribution of fire
  taxonomy_refs:
  - sacred_theft
  - trickster_boundary
  - culture_hero
  basis: Coyote takes fire from the dance with his burning tail, flees, and the fire
    is relayed through Duck, Dove, and Kingfisher before people everywhere secure
    fire and benefit from it.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy labels are interpretive; the passage itself states the taking,
    relay, and resulting origin or distribution of fire.
