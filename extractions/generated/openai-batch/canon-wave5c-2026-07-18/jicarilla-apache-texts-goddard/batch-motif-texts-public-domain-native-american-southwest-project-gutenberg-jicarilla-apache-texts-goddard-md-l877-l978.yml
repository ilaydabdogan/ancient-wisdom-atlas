canonical_text:
  quote: ''
  summary: The passage contains a Coyote fire-acquisition episode, the story titled
    “The Swallowing Monster,” and the opening of “The Man Who Helped the Eagles.”
    Coyote obtains knowledge of a vertical trail, uses a pinon tree, marks his face,
    steals fire with his tail at a dance, and passes the fire through bird carriers
    until people everywhere benefit from it. In the Swallowing Monster story, people
    camp near a spring, repeatedly find dead deer, flee a monster using personified
    camp tools as voice decoys, and are swallowed except for a little girl, whom Spider
    hides and protects before killing the monster. Spider’s wife later sabotages a
    swing, causing the girl to fall into water and become a frog. The next story begins
    with a poor Apache man who is fed by Pueblo Indians, lowered to an eagle nest
    on a sheer cliff, and then left there with two young eagles.
  language: English
  quote_policy: summarized
