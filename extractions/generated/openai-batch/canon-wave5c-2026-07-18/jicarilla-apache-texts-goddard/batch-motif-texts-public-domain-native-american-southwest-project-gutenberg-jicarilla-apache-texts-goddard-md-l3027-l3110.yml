canonical_text:
  quote: ''
  summary: The passage recounts travel by an Apache party through named places, aid
    from Maxwell, an expedition toward an enemy that ends in hardship and return,
    and a separate account in which a camp moves east, captures wild horses, mistakes
    buffalo for an enemy camp, loses meat and property to rising water, and resolves
    a conflict after a Ute takes horses belonging to a Texan.
  language: English
  quote_policy: summarized
