- id: obs:1
  text: A party rides through named places, sleeping at successive camps, and reaches
    Bosque where Maxwell lives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maxwell makes white turkey-tail feather war-bonnets, black leggings, and white
    shirts for the group.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party starts across the plains toward the enemy and camps at named places,
    including lakes and a place translated as “no water.”
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: They find signs of an enemy camp, including chopped bones, a horse killed
    at the water’s edge, and a woman buried below a ridge of rocks with stones piled
    above her.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Mexican removes the body from the grave, and other Mexicans take the woman’s
    clothes and bracelets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Snow, wind, cold, lack of wood, and exhausted provisions prevent the party
    from continuing; for two days they do not eat.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The party turns back, receives food and supplies from Maxwell, and returns
    to Cimarron without seeing the enemy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the following account, the camp moves east from Cimarron to the plains,
    secures antelope meat, surrounds wild horses, and catches twenty-three of them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three scouts report what they think is an enemy camp, but when the group approaches
    they find buffalo instead and kill many of them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rain upstream during the night raises the water over the camp and washes away
    much property and all the meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Ute rider takes horses belonging to a Texan, thinking they belong to the
