canonical_text:
  quote: ''
  summary: 'A ceremonial sequence for a boy and girl is described: they are seated
    behind the fire in a tipi, dressed and painted by a priest, led east at sunrise,
    made to run and return repeatedly, given further directional actions, and included
    in several days of smoking, prayer, singing, dancing, feasting, and final washing
    and painting. A separate observance describes how certain buffalo meat portions
    are cut away, with one thrown east and some not carried home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy and girl sit behind the fire in the tipi, with the girl on the south
    side and the boy on the north side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clothing and ceremonial items are placed in front of them, and the priest
    sprinkles them with L’ectcic and pollen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl is dressed with moccasins, leggings, shirt, beads, feathers, buckskin,
    and yellow face paint; the boy is dressed with moccasins, leggings, shirt, beads,
    feathers, quiver strap, and white face paint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunrise the priest goes east with the boy and girl and strews pollen and
    L’ectcic toward the sun in repeated arcs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman calls out readiness; the girl, with the boy behind her, runs forward
    and returns several times while the woman whistles into the girl's mouth after
    each return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pile of corn outside the tent is distributed by the girl to all the women
    using a horn spoon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy runs successively toward the east, south, west, and north, each time
    returning with grass and horse manure and placing them behind the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man addresses the boy about practicing herding horses on foot and
    prays that horses and property will favor him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Over several evenings and days, people gather for food, smoking, prayer, singing,
    dancing, and drinking tiswin.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: At dawn the priest removes the feathers from the boy and girl, their hair
    is washed with amole, their faces and heads are marked with red paint, pollen,
    and L’ectcic, and the people present are painted red.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In buffalo butchering, specific meat portions are cut away; a yellow piece
    from the back is thrown east and not carried home, biceps pieces are not carried
    home, and the remainder of the animal is used.
  category: sequence
  evidence_refs:
  - ev:9
