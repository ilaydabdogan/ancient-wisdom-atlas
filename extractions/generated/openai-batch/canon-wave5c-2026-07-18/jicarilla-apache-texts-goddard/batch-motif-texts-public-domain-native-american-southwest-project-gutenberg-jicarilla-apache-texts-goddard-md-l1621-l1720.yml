canonical_text:
  quote: ''
  summary: The passage contains Tale 26, in which a man is stranded when a rock rises
    to the sky, Coyote takes his wife, the man later descends, follows camp traces
    with help from speaking camp implements, kills Coyote by making him swallow hot
    stones wrapped in fat, and moves east with his wife. It also contains Tale 27,
    in which Coyote tricks Owl, takes Owl's arrows, disables Owl's returning club,
    kills Owl with his own arrows, and becomes feared. The passage ends with the opening
    of Tale 28, where two little antelopes are placed in Coyote's way and run off
    after he equips them for a race.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A company is on a journey when a rock with a man on it is raised to the sky;
    Coyote takes the man's wife and the other people move away, leaving the man on
    the rock.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a long time the man gets down from the rock and follows the trail of
    the people with whom he had camped.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man questions a fire poker, a pestle, a muller, and a hide-dressing stick
    at former campsites, and they answer how long ago the people moved away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man reaches the tipi and finds his wife while Coyote is away hunting;
    Coyote later returns with a deer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man has small stones heated in the fire and fat heated, then has Coyote
    swallow four hot stones wrapped in fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After swallowing the stones, Coyote remarks that he thought something was
    being done to him, runs, and falls dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man tells his wife to bathe; after she returns, they move their camp toward
    the east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A note says the San Carlos Apache have this story with Panther as the one
    whose wife is stolen and who later takes revenge, while the Jicarilla informant
    insisted the role was played by an ordinary Apache.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Owl has arrows and a club, and he kills and eats men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Owl sings that he is watching for men at a low gap.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Owl proposes that the one who vomits human flesh will kill men; Coyote has
    Owl shut his eyes, takes the meat Owl vomits, and places Coyote's grasshoppers
    in Owl's hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Coyote tells Owl that he eats people because he runs fast, then trims meat
    from Owl's leg and breaks the leg with a stone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Coyote takes Owl's arrows and leaves him only the club.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Owl's thrown club returns when called, but after Coyote says a thrown stick
    should remain where it falls, the club no longer returns.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Coyote sends Owl into the canyon, warns that black-painted arrows may kill
    him, goes around in front of him, and shoots Owl with Owl's own arrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After Owl's death, everybody is afraid of Coyote as he goes around killing
    people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Two little antelopes are placed in Coyote's way, and Coyote proposes a footrace,
    calling them his little nephews.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Coyote puts a panther-skin quiver on one antelope and a black bow on the other;
    the antelopes then run off side by side.
  category: action
  evidence_refs:
  - ev:10
