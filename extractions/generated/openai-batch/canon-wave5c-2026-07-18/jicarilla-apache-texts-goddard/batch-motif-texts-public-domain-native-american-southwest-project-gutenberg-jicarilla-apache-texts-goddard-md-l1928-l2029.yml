canonical_text:
  quote: ''
  summary: 'The passage contains several Coyote tales: Coyote deceives prairie dogs
    into dancing and kills many of them; Wildcat steals the cooked prairie dogs while
    Coyote sleeps; Coyote later takes revenge on Wildcat; Coyote and Beaver move each
    other away from their proper element; Kingfisher feeds Coyote by diving through
    ice, and Coyote’s attempted imitation kills him until Kingfisher restores him.
    Editorial notes compare two incidents with Blackfoot and Sia material.'
  language: English
  quote_policy: summarized
