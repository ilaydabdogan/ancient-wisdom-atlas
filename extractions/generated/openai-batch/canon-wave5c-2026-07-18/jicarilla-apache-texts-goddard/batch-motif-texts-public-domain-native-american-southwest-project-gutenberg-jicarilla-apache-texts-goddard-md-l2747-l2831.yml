canonical_text:
  quote: ''
  summary: The passage gives a brief note on Ute and enemy mutilation practices, a
    note on travois use, and a narrative of Apache travel, hunting, pursuit by enemies,
    armed encounters, burial observations, a mounted knife duel, a final fight in
    which an advance party is killed, one child is taken captive, and a later search
    party recovers bodies and arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that enemies sometimes removed Ute ears and fingers to
    wear, and that Ute people did the same; the Ute explanation given is that this
    would make enemies less strong and more easily frightened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note says the travois was used only for transporting the wounded and infirm,
    while loads were packed on horses after a practice adopted from Mexicans.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Apache party searched for buffalo, killed isolated bulls, divided into
    groups, found mule and horse tracks treated as evidence of enemies, and moved
    camp westward toward a named mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three Apache men turned back to hunt deer; enemies discovered them, took their
    horses, one man hid, one escaped through brush, and one was pursued.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pursued Apache dismounted near an arroyo, was shot in the back, pulled
    out the arrow while the arrowhead remained in his body, shot two enemies from
    their horses, and the enemies withdrew.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Apache searchers later found that stones marked by enemy blood had been turned
    over and bloody grass had been pulled up and thrown into brush.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A body had been placed on a platform on a small hill with the person's personal
    belongings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Near a creek, the Apache found signs of a large enemy camp where sheep had
    been killed and eaten; the enemies had gone toward mountains across the river.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: An advance party of seven Apache consisted of two men, two women, and three
    children; when they noticed travelers behind them, one man rode back to see whether
    they were Apache.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After seeing that the people behind were enemies, the man turned to ride away;
    when pursued and called to wait, he stopped, removed his clothes, put on a warbonnet,
    and challenged them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An enemy chief rode toward the Apache challenger; the two men drew knives,
    brought their horses close, tried to pull each other down, stabbed each other,
    and both died.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The enemies surrounded the remaining Apache; one man kept shooting, was not
    hit by many arrows or bullets at first, was later shot in the sole of the foot,
    killed many enemies, and was then killed near two white horses.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: All of the advance party were killed except one small child whose body was
    not found and who had been taken captive; the arms and legs of two children had
    been cut off.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A later Apache party found the bodies, gathered four large bundles of arrows,
    distributed some arrows among the Ute, and the Ute commented on the unusually
    large number of arrows.
  category: sequence
  evidence_refs:
  - ev:11
