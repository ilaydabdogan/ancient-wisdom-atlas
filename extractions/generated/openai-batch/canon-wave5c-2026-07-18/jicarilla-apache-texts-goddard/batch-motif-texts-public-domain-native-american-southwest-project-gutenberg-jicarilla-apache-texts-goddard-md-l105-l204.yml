  quote: ''
  summary: The supplied passage includes editorial comparative notes, a lower-world
    episode in which an old couple gives sleep-causing lice, a narrative of two chiefs
    involving a feast, wounding, healing, kinship, war, death, and mourning, and the
    beginning of a culture-hero episode in which Kubatc’istcine and Naiyenesgani receive
    a hoop-and-pole game from their father, the sun, disobey a northward prohibition,
    and enter Owl’s house.
