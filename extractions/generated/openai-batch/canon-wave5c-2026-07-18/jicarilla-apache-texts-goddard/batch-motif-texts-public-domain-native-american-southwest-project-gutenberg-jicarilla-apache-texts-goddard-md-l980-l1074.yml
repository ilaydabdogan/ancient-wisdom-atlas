canonical_text:
  quote: ''
  summary: The passage continues a tale in which DagonadeL is helped by eagle people,
    carried upward through a sky hole, rescued by Panther, and later fights hornet
    enemies with protective clothing. It then gives the tale of the Bear-Man, in which
    a killer wearing a bearskin and protective sticks is pursued and shot. The final
    section begins a tale titled “Releasing the Buffalo,” with a hungry camp, hoop-and-pole
    play, and Raven arriving with a quiver containing intestines, followed by comparative
    editorial notes.
  language: English
  quote_policy: summarized
