comparison_claims:
- id: claim:1
  claim: An editorial note treats this “Releasing the Buffalo” tale as comparable
    to Russell’s version, while noting that Russell’s version releases many other
    animals.
  claim_level: same_motif
  target: Russell version of the buffalo-release story
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only a brief editorial note and not the contents
    of Russell’s version.
- id: claim:2
  claim: 'The editorial note presents a Mescalero account as functionally similar:
    Coyote fails and Naiyenesgani succeeds in inducing the buffalo to leave the lower
    world.'
  claim_level: same_function
  target: Mescalero account of inducing buffalo to leave the lower world
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The same note says this story was not known to Western Apache and Navajo;
    details of the Mescalero narrative are not included.
- id: claim:3
  claim: The editorial note says the Blackfoot have a somewhat different version of
    this myth.
  claim_level: same_motif
  target: Blackfoot version of the buffalo-release myth
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The note gives no narrative details beyond calling the Blackfoot version
    somewhat different.
- id: claim:4
  claim: The editorial note suggests a Gros Ventre comparison involving buffalo retention,
    but notes that Raven is not connected there and that an old woman and her daughter
    are mentioned instead.
  claim_level: same_function
  target: Gros Ventre buffalo-retention tradition with old woman and daughter
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: low
  limitations: The comparison is limited to an editorial summary and explicitly marks
    a difference in agents.
