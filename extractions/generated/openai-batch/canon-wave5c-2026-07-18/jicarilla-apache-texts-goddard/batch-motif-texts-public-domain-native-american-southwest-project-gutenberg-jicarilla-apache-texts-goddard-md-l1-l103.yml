    horn materials for the ladders.'
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Whirlwind goes to the world above, reports much water, and a note says Black
    Whirlwind caused the water to dry up.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Beaver finds water receding in the upper world and piles dirt to retain it
    for thirsty children; Badger finds Beaver, goes into the mud, and both report
    that land is exposed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people ascend by the four ladders in sequence, and each ladder becomes
    worn out after use.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A feeble old woman and an old man remain behind; the people look back but
    do not take them out, and one of the pair says the people will come back to that
    person.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note identifies the old woman and old man as rulers of the world of the
    dead, reached by ghosts through the place of emergence; ghosts can pass down but
    cannot return because the ladders are worn out.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people move east along four parallel trails under four chiefs; the first
    and third bands have fighting, while the second and fourth return without trouble,
    and the people move back near Taos.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the start of the following section, Hiiven, as printed in the passage,
    divines whether people will die by throwing a hide-dressing stick and then a stone
    muller into water; after the stone muller does not surface, people begin to die.
  category: action
  evidence_refs:
  - ev:8
