canonical_text:
  quote: ''
  summary: The passage narrates an emergence in which people come upward by means
    of a growing mountain, central reeds, and four colored ladders. Scouts report
    water in the upper world; Beaver and Badger inspect the receding water and exposed
    land. The people ascend until the ladders wear out, leaving an old couple behind,
    later explained in a note as rulers of the world of the dead. The people then
    travel east on four parallel trails under four chiefs and return near Taos. The
    next section begins with a divination to determine whether people will die, after
    which death begins.
  language: English
  quote_policy: summarized
