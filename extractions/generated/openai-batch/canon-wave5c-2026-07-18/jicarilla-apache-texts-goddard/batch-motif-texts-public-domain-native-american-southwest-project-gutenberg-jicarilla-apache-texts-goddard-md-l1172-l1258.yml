canonical_text:
  quote: ''
  summary: A god helps a man make a hollow log from a tree, with tree-pecking birds
    hollowing it and Spider sealing it. The man travels downriver inside the log through
    dangerous river places. After landing, he lives beside the river, receives corn
    from his turkey in directional color rows, and sees rapid crop growth. He repeatedly
    observes a mysterious fire near a rocky ridge. Later he finds a girl at a mountain
    stream, uses a cicada's flute while unseen, follows her, and enters an opening
    in solid rock where an old woman is present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A god fells a tree, cuts a man-length section, replaces the remaining tree
    on the stump, and it joins again as if uncut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: Tree-pecking birds hollow the log until the man can fit inside, and the man
    gives beads to the birds that worked for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The god smooths the log with foam from the water, and Spider closes both ends
    of the log.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The god tells the man there are four bad places, puts the log with the man
    inside into the water, and the log floats downstream.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The log encounters a whirlpool, a waterfall, Pueblo Indians pulling driftwood,
    and much floating driftwood before landing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After landing, the man catches ducks, uses their feathers for a bed, eats
    the birds, and saves leg sinew for arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After four days the man sees his turkey at sunset, and the turkey walks with
    him along the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The turkey tells the man to clear ground and then produces rows of differently
    colored corn while facing or moving from the four directions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The planted corn grows rapidly over four days, and tobacco is later described
    as ripe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man repeatedly sees a fire near a rocky ridge in the evening, but when
    he goes there he finds no fire and no tracks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man uses a forked stick to align his sight of the fire and find the place
    again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A girl sits where a stream flows from the mountains and rubs a deerskin or
    buckskin.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man stands near the girl unseen and blows on a flute loaned by the cicada;
    the girl listens and searches for the cicada without finding it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The girl starts toward her home, sees the man, opens solid rock, and enters;
    the man follows and leaves his arrows by the door.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Inside the rock, a very old woman jumps up and runs out; the passage says
    she is afraid of her son-in-law.
  category: action
  evidence_refs:
  - ev:9
