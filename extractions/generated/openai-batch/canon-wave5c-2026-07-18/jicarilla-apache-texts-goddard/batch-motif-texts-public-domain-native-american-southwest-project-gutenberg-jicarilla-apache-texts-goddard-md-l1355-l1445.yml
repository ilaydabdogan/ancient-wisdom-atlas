canonical_text:
  quote: ''
  summary: A man and his turkey come to a new land. The turkey produces colored corn
    from the four directions, and the man plants corn and tobacco. The man follows
    repeated firelight to a woman's camp, exchanges corn and tobacco with her father,
    and becomes her husband. His in-laws guide him through a colored-blind hunting
    sequence. The father-in-law gives him many deer as property and says people will
    live on deer. Later the wife drives the deer away and strikes them above the nose,
    declaring that deer will always have a sense of smell.
  language: English
  quote_policy: summarized
