- id: obs:3
  text: The man plants the corn seed and also raises tobacco.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man repeatedly sees a fire blazing across the river at night; when he
    goes there by day at first, he finds no people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man eventually finds a woman rubbing hides in the water, follows her into
    a tipi, and is offered tobacco by her father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After contact with the girl, the turkey avoids the man and says that he smells
