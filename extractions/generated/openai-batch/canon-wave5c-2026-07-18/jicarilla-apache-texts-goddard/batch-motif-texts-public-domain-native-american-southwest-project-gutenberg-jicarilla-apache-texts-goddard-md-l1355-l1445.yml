  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man gives corn and later tobacco to the girl's father, who likes the gifts
    and asks for more tobacco.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman goes home with the man, returns bringing much corn, and the young
    man becomes her husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brother-in-law places the man at black, blue, yellow, and variegated hunting
    blinds while different animals run by.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man is instructed not to shoot the earlier animals, then to make motions
    four times before shooting the final animal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After killing the animal, the man turns its head toward the sun, butchers
    it, and gives the hide to his brother-in-law.
  category: action
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:12
  text: The father-in-law shows the man many tame deer and fawns, gives them all to
    him, and says all people on earth will live on deer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man and his wife live on a hill; the woman builds a fire, and deer gather
    around her and eat leaves from the brush shelter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: For four days the woman drives the deer away, but they return; she strikes
