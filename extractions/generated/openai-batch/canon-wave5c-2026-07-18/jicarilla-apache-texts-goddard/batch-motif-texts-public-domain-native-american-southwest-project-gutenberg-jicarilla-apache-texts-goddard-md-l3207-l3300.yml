canonical_text:
  quote: ''
  summary: The passage contains adjacent hunting accounts. A camp travels onto the
    plains for buffalo, kills many animals, then returns because arrows are depleted
    and enemy danger is feared. A section titled “A Successful Hunt” recounts a Taos-region
    camp moving east through many named places, obtaining buffalo, deer, elk, antelope,
    and other meat, and returning without hunger. A following first-person hunting
    account describes a small camp hunting on and near a mountain, killing animals,
    and sharing meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first account, a camp goes onto the plains in the fall for buffalo
    and camps at the Canadian River and other named places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buffalo bulls ahead of the herd are killed, and the chief tells the people
    to stay two days, prepare, and then move toward the buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men look from a hill, report buffalo in large numbers in all directions, ride
    among them, kill many, and bring back meat over several days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief says the arrows are gone and warns that, if enemies see them, they
    have nothing to shoot with.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because of the arrow shortage, the group turns back while some meat is still
    fresh, leaves flour behind, travels by day and night, reaches Cimarron in four
    days, and makes many arrows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the section titled “A Successful Hunt,” a camp in the mountains beyond
    Taos moves east through a long sequence of named places after buffalo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Taos-region hunting party obtains meat from deer, white-tail deer, elk,
    buffalo, antelope, and other animals, turns sunwise, comes back with meat, is
    not hungry, and camps by Taos.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the first-person hunting account, four tipis of people, including named
    companions, go hunting deer on the top of a mountain with only one gun.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two young men kill a cow and calf, the narrator kills a fawn, another young
    man kills an antelope buck, and the narrator later camps by a stream on the mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the rest of the group catches up, the narrator’s wife gives them meat,
    and they eat happily and shout.
  category: action
  evidence_refs:
  - ev:4
