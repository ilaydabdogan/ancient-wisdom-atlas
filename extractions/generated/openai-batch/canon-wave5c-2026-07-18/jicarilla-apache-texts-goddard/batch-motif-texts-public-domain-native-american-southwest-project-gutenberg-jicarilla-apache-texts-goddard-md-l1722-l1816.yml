canonical_text:
  quote: ''
  summary: The passage contains the end of one version and a second version of a tale
    in which antelopes take arrows from Coyote, followed by the beginning of a tale
    in which Coyote tries to make his own children spotted after questioning Deer
    about her fawns. In the arrow tale, Coyote pursues antelopes who outmaneuver him;
    in the second version, Coyote has stolen arrows from Owl and killed him, but Antelope’s
    children carry the bow and quiver away and become large antelope. In the spotted-children
    tale, Deer gives Coyote a fire-and-sparks explanation after he disbelieves that
    fawns are born spotted, and Coyote’s attempt to reproduce it kills his children.
  language: English
