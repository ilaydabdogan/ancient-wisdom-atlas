canonical_text:
  quote: ''
  summary: The passage narrates travel, buffalo hunting, a night horse raid by enemies,
    unsuccessful pursuit, capture of wild horses, return toward Cimarron, recurrent
    fighting and dancing after war returns, an expedition with Kit Carson against
    an enemy camp near the Canadian River, and the opening of a later expedition associated
    with Maxwell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party broke camp, traveled east by named stopping places to Red River,
    encountered a large buffalo herd, killed buffalo on successive days, and brought
    meat home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night an enemy group drove away half of the party's horses; the next day
    the party pursued them for two days but did not overtake them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People with extra horses lent them to people without horses for packing loads,
    while some men rode far out on each side watching for enemies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Watchers discovered a band of wild horses, alerted the main party, and the
    party surrounded, chased, and caught many near the south side of a dry lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A colt followed a wild horse closely; when the pursuing man finally caught
    and stopped that horse, the colt also stopped, and everyone laughed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Returning westward up Canadian River, the group again saw wild horses near
    Salt River, surrounded them, and caught two.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ollero went west to their own country, while the narrator's group camped
    on the other side of the Rio Grande by Cimarron, described as their country.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Enemies used to come after the narrator's group at Cimarron; the group says
    they were not afraid, went east to fight, sometimes left tired horses behind,
    and took enemy horses when enemies were killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the group returned with scalps, they camped around Cimarron, danced,
    and kept watch toward the east while dancing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Cimarron a force set out with Gidi, identified as Kit Carson, including
    Ute, Apache, soldiers, and Mexicans, described as four nations going after the
    enemy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Kit Carson expedition went down the Canadian River to HweLdibade, found
    many enemy tipis, sent men to observe, and saw campfires when near the enemy camp
    before daybreak.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Apache horsemen attacked two enemy camps, drove people from the upper
    camp to the lower camp, fought until night, and took away horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The battle account reports many soldiers killed, one Apache killed, two Apache
    wounded or struck, many enemies killed, and enemy tents and goods brought home
    on wagons.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: After the Kit Carson expedition, the party returned to Cimarron and danced
    until tired.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'The next section begins with an expedition led by Maxwell: fourteen Apache
    men went from there on horseback to Iciegedjinye and slept there.'
  category: sequence
  evidence_refs:
  - ev:9
