candidate_motifs:
- id: motif:1
  label: Trickster's prey plan kills his own child
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote captures turkeys and organizes their killing, but the youngest coyote
    child is killed instead of the turkeys.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not use the word trickster; the taxonomy link rests on
    Coyote's role and the reversal of his plan.
- id: motif:2
  label: Animal-person enters prey's body to kill it from within
  taxonomy_refs:
  - trickster_boundary
  basis: Porcupine crosses the water inside Buffalo and kills him by gnawing a blood
    vessel.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The episode is literal in the tale; broader trickster classification is
    interpretive and should be reviewed.
- id: motif:3
  label: Contest over a large animal carcass
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote and Porcupine dispute who will butcher and control the buffalo, using
    a jumping test and later deception over the meat.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The title explicitly frames the episode as a contention over Buffalo,
    but taxonomy assignment is broad.
- id: motif:4
  label: Apparent death followed by rising again
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Coyote kills Porcupine with a club, yet Porcupine jumps up afterward; after
    being killed again, Porcupine rises again and prevents the warning.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text gives no explanation of whether Porcupine dies, revives, feigns
    death, or is otherwise unharmed.
- id: motif:5
  label: Tree-top food promise becomes lethal trap
  taxonomy_refs:
  - trickster_boundary
  basis: Porcupine, sitting in a pine tree with the meat, tells Coyote's family to
    lie under a blanket and drops a backbone that kills them.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The tree and blanket are literal devices in the scene; larger symbolic
    meaning is not stated.
- id: motif:6
  label: Last surviving child lured to fatal fall
  taxonomy_refs:
  - trickster_boundary
  basis: Porcupine calls the remaining child into the tree, feeds him, directs him
    to a branch, and kicks it so he falls into a canyon.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is identified as a recurring-style motif only at the scene-pattern
    level; no external parallel is provided in the passage.
- id: motif:7
  label: Warning ignored and bodily substitute melts
  taxonomy_refs: []
  basis: Coyote receives pitch eyes and is warned not to lie in sunshine; he lies
    in sunshine, and the pitch melts down his face.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: No provided taxonomy family closely matches this warning-violation episode.
- id: motif:8
  label: Detached eyes become fruit and explain animal markings
  taxonomy_refs: []
  basis: The tale states that Coyote's thrown eyes became plums and that the melted
    pitch explains marks running from Coyote's eyes down his cheeks.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The etiological function is explicit for cheek marks and stated for plums,
    but broader symbolic interpretation is not supplied.
