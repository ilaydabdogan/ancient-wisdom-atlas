canonical_text:
  quote: ''
  summary: 'The passage contains three translated tales: Coyote causes his own child
    to be killed while trying to kill turkeys; Coyote and Porcupine contend over a
    buffalo killed by Porcupine, leading to the deaths of Coyote''s children; and
    Coyote loses his eyes, receives pitch replacements, and the tale explains cheek
    marks and plums. Editorial notes cite related versions, including a note that
    the eye-loss story is widely distributed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote finds turkeys rolling in dust, puts them in a sack, rolls with them
    twice, and carries them home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote tells his children to build a fire and asks them to consider what to
    do with the turkeys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children propose methods for killing the turkeys, including taking them
    from the sack one at a time or standing in a circle with clubs around the fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the turkeys are released near the fire, the youngest coyote rushes in
    among them and is the only one killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Porcupine sits where a buffalo trail crosses a stream and asks Buffalo to
    take him across.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: After rejecting several riding places on Buffalo's body, Porcupine crawls
    inside Buffalo to cross the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Porcupine gnaws off a large blood vessel inside Buffalo; Buffalo falls at
    the edge of the water, and Porcupine crawls out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Coyote hears Porcupine speak about finding flint to butcher the buffalo and
    suggests that the one who jumps over the buffalo should butcher all of it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Porcupine fails to jump over the buffalo, while Coyote jumps over the tail
    and begins butchering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Coyote gives the intestines to Porcupine to wash; Porcupine eats some, and
    Coyote kills him with a club after seeing food remnants in his mouth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Coyote leaves, Porcupine jumps up; Coyote's feces call a warning, and
    Coyote returns to kill Porcupine again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Porcupine rises again, he throws dirt into the mouth of the feces so
    they do not shout another warning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Porcupine carries the buffalo meat to the top of a pine tree and sits there
    to eat it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Coyote returns with his children and finds no meat; they lick up the blood
    beneath the tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Porcupine tells Coyote and his children to lie under a blanket so he can throw
    down meat; he drops the backbone, killing all except the youngest child.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Porcupine invites the remaining young coyote into the tree, feeds him buffalo
    neck glands, directs him to a slender branch, and kicks the branch so the child
    falls into a canyon and bursts.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Coyote takes out his eyes and throws them upward; at first they fall back,
    but later they catch on a tree.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: An unnamed person makes eyes for Coyote out of yellow pitch and warns him
    not to lie in sunshine.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: Coyote lies in sunshine; the warmed pitch runs down each side of his nose,
    explaining marks from each eye down his cheeks.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: The eyes that Coyote threw into the tree become plums.
  category: other
  evidence_refs:
  - ev:15
- id: obs:21
  text: An editorial note says the Coyote-loses-eyes story has wide distribution and
    mentions a Navajo account by Matthews.
  category: other
  evidence_refs:
  - ev:16
