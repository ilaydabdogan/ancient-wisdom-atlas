canonical_text:
  quote: ''
  summary: A war party fails to find the enemy and dies of thirst except for one man.
    The survivor rests under trees where ravens speak about men who killed buffalo.
    A prairie dog gives him water. He travels with a buffalo calf that grows, follows
    buffalo camps that appear as tipis by night and as buffalo traces by morning,
    and enters a buffalo social setting. A white buffalo chief refers to the man having
    married a brave man's wife and orders arrows and bows to be made. The man faces
    the largest buffalo and shoots the prepared arrows. A final speech names four
    rivers as the man's chiefs; an editor's note identifies these as sacred Jicarilla
    rivers.
  language: English
  quote_policy: summarized
