canonical_text:
  quote: ''
  summary: 'The passage contains several short translated tales and notes: a Coyote
    arrow incident; Coyote insulting and being chased by a rolling rock; Coyote and
    Mosquito obtaining wives under false pretences; Coyote falsely claiming hunting
    success by using blood; and Coyote escaping punishment by transforming into a
    girl, biting a judge, and taking money.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote shoots arrows into the underside of a limb where turkeys sit, cuts
    down the tree, recovers the arrows, and repeats this four times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote is shot with an arrow that passes through him and removes nearly all
    his body except a rim of hair; he explains that the hair on his back must have
    blown off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rock under a cliff says it will roll over Coyote; Coyote says it cannot
    do so and defecates and urinates on it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone rolls after Coyote over hills until he tires; Coyote then licks
    the stone clean and leaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote asks for a daughter in marriage after the father says he will give
    her to someone with large leg muscles; Coyote displays his leg muscles and receives
    the girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote claims a horse is his and later describes a horse with a panther-skin
    saddle blanket and rope tack, but he does not return with such a horse.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Mosquito comes to his wife at night, says he will hunt, returns with only
    blood, and says ravens ate the meat and bones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At sunrise Mosquito’s wife uncovers his face and sees that his mouth, arms,
    and legs are very slender; she leaves him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote makes his nose bleed, rubs blood on his face and hands, claims he killed
    many animals, and later returns without meat; the narration states he had been
    lying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Coyote is caught for lying and put in a sack, he is carried to a judge’s
    house and turns himself into a girl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the judge opens the bag, Coyote comes out, bites him, takes all the money,
    and throws money onto trees while going home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An editorial note identifies the Coyote-and-the-Mexicans tale as a Mexican
    folk tale told in Spanish by Mexicans in New Mexico.
  category: other
  evidence_refs:
  - ev:8
