canonical_text:
  quote: ''
  summary: The passage includes a Coyote-and-dog episode in which Coyote first helps
    a mistreated dog gain favor by staging the recovery of a stolen hen, then later
    gets drunk with the dog and causes the dog to be punished; the episode also explains
    spotted dresses and apple trees connected with money. It then gives a tale of
    men racing to marry a girl at the border of the world, where Heron carries Mole
    so that Mole arrives first. Another tale describes gambling footraces in which
    white-tailed deer beats antelope in the woods, and frogs defeat antelope on the
    plains by lining themselves from start to finish. A further section describes
    bird chiefs whose speeches affect clouds, hunting success, cold, and snow. The
    last included section begins Woodpecker's self-description of living among trees,
    pecking holes, raising children in them, and eating pitch.
  language: English translation
  quote_policy: summarized
