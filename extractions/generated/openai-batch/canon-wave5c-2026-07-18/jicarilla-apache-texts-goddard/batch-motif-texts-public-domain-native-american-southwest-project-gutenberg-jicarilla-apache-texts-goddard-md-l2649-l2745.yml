canonical_text:
  quote: ''
  summary: The passage narrates Apache and Ute movements involving Bosque, encounters
    with Navajo and soldiers, theft of horses, an attack on an enemy group returning
    from Santa Fe, capture of a woman, children, horses, and supplies, Ute scalping
    and trophy-taking, a gun accident wounding a Ute, extended dancing with the enemy
    scalp at Cimarron, and the beginning of a subsequent movement toward the Arkansas
    River.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Six Ute ride ahead near Bosque after dark and drive away four horses; two
    Ute seeking another horse encounter a Navajo, shoot him, and return with a saddled
    horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Soldiers are drawn up on horseback before a ditch; Apache and Ute dismount
    and advance with a raised flag.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The soldiers announce that they will fight whichever tribe fires first and
    then escort the Ute and Apache into Bosque with soldiers on each side.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Navajo at Bosque speak against the Apache and Ute and still wish to fight,
    but the soldiers prevent them from attacking.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Navajo trying to enter behind soldiers while the Indians are eating is discovered,
    shot, and killed by the soldiers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An enemy party returning from Santa Fe consists of two men, two women, and
    four children; Apache and Ute overtake them, kill one man, capture one woman and
    three children, and seize horses and packs containing food and whisky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Apache do not take the killed man's scalp because they say they do not
    know how; the Ute are said to know how.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ute asked to scalp the man race to the body, take the scalp, cut off the ears
    and fingers, and bring these back to camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One Ute cuts pieces of flesh from the scalp; some pieces are put in the fire
    and eaten, and others are rubbed on bodies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a noon stop a gun leaned against a rock fires without anyone touching it
    while a Ute sits on the rock singing and shouting, wounding him through the hip.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wounded Ute is moved away on poles fastened to each side of a horse and
    dragged along.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Cimarron the group holds the enemy's scalp and dances repeatedly through
    days and nights, stopping at intervals to eat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The next account begins with Apache and Ute camping together near Cimarron
    after a bear dance and moving through named places toward the Arkansas River.
  category: setting
  evidence_refs:
  - ev:9
