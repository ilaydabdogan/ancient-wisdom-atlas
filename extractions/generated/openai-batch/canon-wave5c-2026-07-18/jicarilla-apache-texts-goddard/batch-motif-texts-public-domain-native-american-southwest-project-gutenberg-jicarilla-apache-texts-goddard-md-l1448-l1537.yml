canonical_text:
  quote: ''
  summary: 'The passage closes a deer-origin narrative in which a mother-like figure
    releases deer, assigns them seasonal colors, and gives them bodily features. It
    then gives the tale of a lake-associated supernatural person: an old woman gives
    her son a present so he may become a medicineman; he provides antelope meat, gives
    the gift to a supernatural one, is cursed, and comes to live at the bottom of
    a lake. Later, a war party encounters a voice that shares buffalo meat, asks for
    smoke and an all-black horse, gives instructions for a horse raid, and tells them
    to make smoke toward his home by Sheep Horn Mountain when in need.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fawns or deer address a female figure as mother, ask her not to hit them,
    and say they belong to her; she replies that she likes her children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two fawns return to the female figure, then four return; she says she will
    turn them loose and later says four have destroyed her fence four times.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The female figure sends the deer away and tells them to go as far as they
    wish toward the south.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The female figure says she made the deer red in summertime, blue in fall,
    black in the middle of winter, and brown in spring, and that she made various
    parts of their bodies pretty, including black hoofs and nose-ends, white hips,
    and eyes made of coals.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note states that the deer myth is the foundation of a deer-hunting ceremony
    and that its substance is sung before a hunt.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: An old woman gives her boy a present so that he might become a medicineman;
    the people are camping on the plains with little food and are hungry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The son makes a corral near a river, gathers men to drive in antelope, and
    the antelope are killed; later antelope run in by themselves when whistled for,
    producing a large pile of meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old woman asks the son to return her gift; he says he has already given
    it to the supernatural one, and she curses him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After being cursed, the son leaves, comes to a place called “sticks swim around,”
    where tent poles stick out of the water, and the passage says he lives at the
    bottom of the lake.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that the lake was a regular place of offering and that Jicarilla
    people used to throw beads and other property into it when passing toward the
    buffalo hunting grounds.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: A large band going to war travels through the night and day, builds a fire
    in the evening, smokes the pipe, and hears a voice address them as its own people.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The speaker drops a big buffalo near the war party, says his breath gave out
    while carrying it, asks them to make smoke for him, and smokes with them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The speaker tells the war party that the enemy camp is close, asks them to
    bring him an entirely black horse with no white spot, gives them a forequarter
    of buffalo, and tells them to blow smoke toward his home at TcTcnaLcLie by Sheep
    Horn Mountain if they need anything.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The war party surrounds and drives off the horses; the all-black horse stays
    with the herd and then runs immediately to the lake when they pass the speaker’s
    home.
  category: sequence
  evidence_refs:
  - ev:12
