comparison_claims:
- id: claim:1
  claim: An editorial note says this monster-fish exploit is not known to other Southern
    Athapascan tribes, while Mooney reports a fish leaving the water and flying to
    secure prey; this supports only a cautious comparison of predatory fish episodes,
    not identity of the whole motif.
  claim_level: same_function
  target: Mooney account of a fish leaving the water and flying to secure prey
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: low
  limitations: The note explicitly says the exploit is not known to other Southern
    Athapascan tribes and gives only a brief parallel involving a predatory fish.
- id: claim:2
  claim: An editorial note links the incident of a monster who attacks passers-by
    to a similar incident in Matthews and to a San Carlos Apache recording, though
    not necessarily with a stream setting.
  claim_level: same_motif
  target: Matthews and San Carlos Apache similar incident of a passers-by-attacking
    monster
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: medium
  limitations: The note says the Matthews incident is similar but not associated with
    a stream, so the setting and details differ.
- id: claim:3
  claim: An editorial note identifies the toothed-vulvae episode as a widespread conception,
    supporting comparison with a broader motif family of toothed female genitals.
  claim_level: same_motif
  target: Widespread tooth-bearing female genital motif cited by the editor
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the local episode and a brief bibliographic
    note; it does not detail the cited parallels.
- id: claim:4
  claim: An editorial note says the danger of approaching or closing rocks is usually
    encountered on the journey to the sun, supporting comparison with a nearby journey-to-the-sun
    danger pattern.
  claim_level: same_motif
  target: Approaching-rocks danger on the journey to the sun in Matthews
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: In this passage the rocks guard arrow reeds at a canyon junction rather
    than being explicitly placed on a journey to the sun.
- id: claim:5
  claim: An editorial note says the grandmother YoLgaiisdzan is clearly identified
    with the moon and that Mescalero songs mention her under moon-related names, supporting
    a cautious comparison of the moon-associated grandmother figure across nearby
    Apache materials.
  claim_level: linguistic_similarity
  target: Mescalero songs naming the grandmother with moon-related names
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives names and identification but does not quote the Mescalero
    songs or narrate the same episode.
