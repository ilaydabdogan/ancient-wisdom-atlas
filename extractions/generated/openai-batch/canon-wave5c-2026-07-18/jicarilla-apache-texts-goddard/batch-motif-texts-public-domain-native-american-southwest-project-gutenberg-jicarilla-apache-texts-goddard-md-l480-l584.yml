canonical_text:
  quote: ''
  summary: 'The passage gives overlapping episodes about Naiyenesgani and dangerous
    beings: he escapes from a monster fish after removing its heart; the fish heart
    is assigned to celestial keeping, in one version by the sun and in another inside
    the moon through his grandmother; he removes a cliff-and-stream monster who kicks
    travelers into water; he neutralizes a woman or wife with toothed vulvae by using
    twisted sumac sticks; he makes safe dangerous arrow reeds guarded by closing rocks;
    and a child transforms into a bear, kills children, and hides his heart near oak
    trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first fish episode ending, Naiyenesgani cuts openings in the fish’s
    neck with an obsidian knife, exits carrying the heart, gives the heart to the
    sun, and the passage explains this as the reason fish have openings on the sides
    of the neck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first fish episode says Naiyenesgani returns to his grandmother, YoLgaiisdzan,
    and that a firedrill had blazed up and then died down.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:3
  text: In the second version, a monster fish swallows Naiyenesgani; while inside
    it he cuts off its heart, the fish swims to shore, and he exits through slits
    he cuts in the sides of its neck, taking the heart with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Naiyenesgani gives or offers the heart of the largest evil thing to his grandmother;
    the passage says the fish heart is held inside the moon and that the grandmother
    will carry it there as the moon rises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: TsedagediLlsdihi sits by a trail between a cliff and a stream, kicks passers-by
    into the water, and his children eat the victims, leaving red bones floating on
    the surface.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Naiyenesgani repeatedly feigns passage along the trail so that TsedagediLlsdihi
    misses him, then kicks the monster into the water; the monster’s children eat
    him and identify the meat as their father’s.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A woman or wife has teeth in her vulvae and had killed men with them; Naiyenesgani
    twists sumac sticks together, inserts the sticks first, the teeth cut the sticks,
    and he destroys the teeth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Arrow reeds stand at the junction of two canyons where rocks close on people
    who come for arrows; Naiyenesgani makes as if to pass four times, breaks off reeds,
    the rocks do not close, and he distributes the reeds so everyone has arrows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During children’s play, one child says he will be a bear, makes a dirt pile,
    makes claws from hide-working implements, digs a deep hole, and emerges progressively
    more covered with hair over four appearances.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After becoming bear-like, the child goes among the people killing children,
    then goes to the Navajo country and hides his heart near oak trees.
  category: action
  evidence_refs:
  - ev:8
