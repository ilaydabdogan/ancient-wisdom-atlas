canonical_text:
  quote: The heart of the world lies here.
  summary: Naiyenesgani assigns animals care over food resources, tells the people
    that their homeland is the heart of the world, describes a strong world shaped
    through rivers and mountains, warns that removal from this place will cause death,
    and departs to his grandmother. A second version recounts his killing of a rolling
    rock monster, his search for remaining bad things, his naming of Balgai, and his
    statement that he has killed the monsters and made foods for the people.
  language: English translation
  quote_policy: quoted
