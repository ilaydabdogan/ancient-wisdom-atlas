canonical_text:
  quote: ''
  summary: The named protagonist kills eagle parents at a rock and canyon after questioning
    their young. He then speaks lasting conditions over the young eagles. His grandmother,
    identified as bat, lowers him from a cliff in her basket. He gives her feathers
    but she repeatedly disregards his route instruction, the feathers are taken by
    birds, and he declares lasting poor traits for her. He then goes to a marsh where
    people have sunk, uses a four-direction sequence that makes the water disappear,
    enters, compels a monster to release the people, commands the monster or soft
    mud not to speak, and appoints four people to take charge.
  language: English translation
  quote_policy: summarized
