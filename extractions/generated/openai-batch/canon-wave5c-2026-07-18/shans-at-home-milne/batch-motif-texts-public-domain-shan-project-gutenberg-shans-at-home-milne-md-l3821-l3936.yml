canonical_text:
  quote: '"Here is your wife, you may take her"'
  summary: 'The passage describes Shan wedding customs: the bride''s delayed departure
    and ritual reluctance, her hand-over to the bridegroom, an elder''s witness rite
    with tea, salt, rice, and white wrist strings, a shared meal and bride payment,
    the procession to the groom''s house with lucky and unlucky signs, the bride''s
    reception into her husband''s family, first-night bedroom instructions, and later
    marital arrangements including divorce, second wives, and children as a bond.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The bride's father refuses the request for his daughter twice, saying he has
    changed his mind and wants to keep her longer; on the third attempt he fetches
    her or sends her mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride refuses to leave her bedroom, is begged by young married women to
    come to her waiting husband, hides her face, and weeps or pretends to weep; bridal
    tears are described as correct behavior.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father places the bride's hand in the bridegroom's outstretched hand and
    may say that she is his wife and he may take her; sometimes the transfer happens
    without words.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An elder leaves the house carrying small packets of tea, salt, and rice, holds
    them over his head, and calls on heaven and earth to witness the marriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The elder twists a white string seven times around the bride's left wrist
    and once around the bridegroom's right wrist; the strings are not tied, soon fall
    off, and are said to be of little importance after the ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage reports a comparison from Ibbotson's Panjab Ethnography in which
    a Kurmi bridegroom is first married to a mango tree and tied to it with thread,
    after which thread is used at his wrist; the author suggests this may be related
    to an ancient Shan custom.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The bridegroom leads the bride to a low bamboo table, they sit together on
    a mat, and they eat curry and rice before the guests; the remainder of the bride
    money is then paid.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The procession to the new home is ordered with the band first and the spouses
    not walking together; sometimes it begins northward and takes circuitous paths
    because northward departure is considered lucky.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If someone sneezes while the couple is leaving, they must return, sit again
    on the mat, and start afresh; a sneeze is considered unlucky for people going
    away.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Boiled rice is sometimes thrown on the couple to bring good fortune and a
    large family, while a paddy-bird or egret flying near either spouse is considered
    unlucky.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the groom's father's house, the bridegroom waits at the foot of the stairs,
    precedes the bride up the steps, takes her hand, and leads her to his parents
    at the doorway.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The bride usually kneels before her parents-in-law with palms together and
    may remove her turban and place it at their feet; she is then described as a daughter
    of the house who will share water-carrying and cooking work.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Before evening, an old woman escorts the bride to her bedroom, explains where
    the quilted mat wedding bed must be placed, and tells her that she must always
    sleep on the left side of the bed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The bedding is new and provided by the bride's father; the husband's pillow
    must be larger and higher than the wife's, and the pillows are stuffed with dried
    young paddy shoots.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: The bridegroom's bachelor friends try to keep him outside the house until
    the small hours, while the bride must not go to bed before he enters on the first
    night.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that Shan women may leave husbands, that divorce can follow
    a husband's taking a second wife, and that children often bind husband and wife
    together.
  category: relationship
  evidence_refs:
  - ev:13
