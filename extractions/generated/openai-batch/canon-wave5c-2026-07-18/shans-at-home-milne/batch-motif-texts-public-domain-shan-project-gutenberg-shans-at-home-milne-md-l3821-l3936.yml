candidate_motifs:
- id: motif:1
  label: Ritual reluctance before bridal transfer
  taxonomy_refs: []
  basis: The bride resists leaving the bedroom and displays expected tears before
    her father places her hand in the bridegroom's hand.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents this as wedding etiquette, not as mythic narrative.
- id: motif:2
  label: Marriage witnessed by heaven and earth
  taxonomy_refs: []
  basis: An elder holds tea, salt, and rice overhead and calls on heaven and earth
    to bear witness to the marriage.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No deity names or cosmological explanation are supplied beyond the witness
    formula.
- id: motif:3
  label: Wrist-thread marital marking
  taxonomy_refs: []
  basis: White strings are twisted around the bride's and bridegroom's wrists in specified
    numbers during the ceremony.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states the strings are not tied, soon fall off, and the custom
    has fallen into disuse in many places.
- id: motif:4
  label: Shared meal marking marital transition
  taxonomy_refs: []
  basis: The couple sit together on a mat near a low bamboo table and eat curry and
    rice before the guests before the bride leaves for the new home.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The text does not explicitly say the meal seals the marriage; it is part
    of the described wedding sequence.
- id: motif:5
  label: Auspicious and inauspicious signs during departure
  taxonomy_refs: []
  basis: Northward movement is lucky; sneezing and a nearby egret are unlucky; thrown
    boiled rice is intended to bring good fortune and a large family.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage reports local beliefs but does not explain their origin.
- id: motif:6
  label: Threshold incorporation into husband's household
  taxonomy_refs: []
  basis: The bride is led up the stairs to the groom's parents, kneels before them,
    and is described as becoming a daughter of the house.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a social rite of incorporation rather than a stated mythic initiation.
- id: motif:7
  label: First-night spatial hierarchy
  taxonomy_refs: []
  basis: The bride is instructed always to sleep on the left side of the bed, and
    the husband's pillow must be larger and higher than the wife's.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The meaning of left side and pillow size is not interpreted in the passage.
- id: motif:8
  label: Children as marital bond and co-wife kinship
  taxonomy_refs: []
  basis: The passage says children are a strong link binding spouses and that a first
    wife may treat children of a second wife as her own.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: This is a social pattern, not a mythic episode.
- id: motif:9
  label: Cited tree marriage with thread transfer
  taxonomy_refs: []
  basis: The cited Kurmi comparison describes a bridegroom first married to a mango
    tree, tied with thread, and then associated with leaves and thread at his wrist.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This motif belongs to the cited comparative passage, not to the main Shan
    wedding sequence as directly observed here.
comparison_claims:
- id: claim:1
  claim: The passage itself proposes a cautious resemblance between the Shan wrist-string
    wedding rite and a cited Kurmi mango-tree thread rite, because both involve thread
    used in a wedding context and attached to the bridegroom's wrist.
  claim_level: visual_similarity
  target: Kurmi bridegroom mango-tree and wrist-thread custom cited from Ibbotson's
    Panjab Ethnography
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The passage gives only a reported comparison and says the Shan survival
    is possible, not proven. The Shan rite as described has no tree, the strings are
    not tied, and the thread ceremony is said to be of little importance or disused
    in many areas.
