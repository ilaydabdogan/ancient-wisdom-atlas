canonical_text:
  quote: ''
  summary: The passage describes Shan children tending cattle, catching birds, eating
    in the jungle, observing a rule that spilled food makes a meal unlucky, tracking
    animals, communicating by distant calls, and returning home. It also describes
    Shan attitudes toward milk and smell, the increasing separation of boys' and girls'
    daily lives, girls' domestic and textile work, boys' monastic schooling, and vegetarian
    ascetic monks of the Mengkyaw order.
