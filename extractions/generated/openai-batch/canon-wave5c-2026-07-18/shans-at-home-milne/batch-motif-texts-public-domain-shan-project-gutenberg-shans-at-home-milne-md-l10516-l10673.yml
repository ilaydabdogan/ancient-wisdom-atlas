canonical_text:
  quote: ''
  summary: Kap-pa-ra and Ka-hseng reach the mountain palace of Hsa-pu-te-hsa. Her
    attendants warn that her gaze has caused suitors to die, and Kap-pa-ra faints
    when he sees her. In the palace he explains that he has come on behalf of his
    brother, King Hpung-ka-lit. Hsa-pu-te-hsa says previous suitors are turned to
    stone by the stairway; Kap-pa-ra pours magic water on the stones and restores
    them to life. Among the restored are the kings of the serpent country and the
    roc country, who reward him with daughters and alliance. Kap-pa-ra returns with
    Hsa-pu-te-hsa and his two wives, aided by Lord Sakya's gift of a magic bow and
    arrows. Meanwhile an ogress assumes the form of a beautiful doe and then a woman,
    lures Hpung-ka-lit, and becomes his wife. Kap-pa-ra later presents Hsa-pu-te-hsa
    to Hpung-ka-lit, who makes her chief queen.
  language: English
  quote_policy: summarized
