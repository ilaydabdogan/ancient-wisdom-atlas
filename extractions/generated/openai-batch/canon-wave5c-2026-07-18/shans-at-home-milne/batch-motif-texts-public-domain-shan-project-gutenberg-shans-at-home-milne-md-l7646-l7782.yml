canonical_text:
  quote: ''
  summary: The passage describes Shan medicines and charms, including herbal and animal-derived
    remedies, treatment of wounds and snake-bite, recognition of contagious disease,
    responses to epidemics, an old foundation-burial custom for protection, offerings
    and a trap for disease spirits, seasonal illnesses, malaria, massage, and infant
    convulsion treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Herbs and tree bark are prepared as medicines; bark may be boiled for an infusion
    or pounded into powder and sprinkled on wounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old men and women in villages are described as wise in spells and charms and
    knowledgeable about certain barks and herbs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The text says Shans recognize that some diseases, including sore eyes and
    small-pox, may be contagious or infectious, and burn the clothes of a person who
    died of small-pox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a serious epidemic, the sick may be left with a few old people while
    other inhabitants leave home, build huts in the jungle, and remain there until
    they think danger has passed; severe epidemics may lead to villages or towns being
    deserted and rebuilt elsewhere.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports an old custom of burying a man or woman alive under a
    palace or the gates of a new city so that the dead spirits would guard the place
    and keep sickness-bringing evil spirits away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Epidemics are said to be attributed to bad spirits travelling from one district
    to another, and offerings are placed for them beside a path.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A pole with a swivel is erected near a path so that the demon of rinderpest
    may be caught as it passes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Diarrhoea and dysentery at the beginning of the rainy season are associated
    in the passage with water from shallow wells and with ripe jack-fruit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Malaria is described as occurring at the beginning and end of the rains and
    as associated in some districts with swamps and stagnant water; mosquito curtains
    and quinine are mentioned in relation to fever.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Massage is described as a common cure, often performed with the feet while
    the practitioner steadies herself against a wall and walks on the patient’s body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For snake-bite, a string is tied tightly above the wound, someone tries to
    suck out the poison, and a paste of pounded spiders is placed on the bite.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Animal parts and remains are used as remedies or charms, including bird brains,
    snake fat, bat flesh, dried monkey blood, powdered tiger bones, bear claws, a
    wild boar tusk, and powdered rhinoceros horn.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Children under one year old are described as subject to convulsions, with
    massage using sesamum oil as the chief remedy.
  category: action
  evidence_refs:
  - ev:11
