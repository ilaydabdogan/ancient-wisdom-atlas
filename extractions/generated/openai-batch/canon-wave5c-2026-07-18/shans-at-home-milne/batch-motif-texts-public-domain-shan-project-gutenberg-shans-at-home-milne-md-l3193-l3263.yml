canonical_text:
  quote: ''
  summary: 'The passage describes Shan bodily markings, charms, and adornments: male
    leg tattooing as a marker of manhood and marriageability; tattoos and implanted
    metals as protections, love-charms, or wound-averting charms; discs bearing letters
    that symbolize animals associated with Gautama''s previous lives; female dress,
    leg rings, and hair practices as age/status markers; and the offering of cut hair
    to an image-house in hope of luxuriant hair in a future life.'
  language: English
  quote_policy: summarized
