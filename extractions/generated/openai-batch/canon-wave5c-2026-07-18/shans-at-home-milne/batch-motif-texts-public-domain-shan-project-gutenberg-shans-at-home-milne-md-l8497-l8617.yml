  - ev:1
- id: obs:3
  text: The moon is described as a silver-covered hare living in a crystal house with
    fifteen windows, resting on a chariot and traveling around Mount Meru.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The waxing and waning of the moon are explained by the opening and closing
