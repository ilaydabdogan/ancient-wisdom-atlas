  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A chief god on Mount Meru gives Sura three pellets, each of which grants immortality
    to whoever swallows it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sura swallows one immortality pellet and hides two under his pillow; the Sun
    and Moon later find the hidden pellets and each swallow one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Because all three swallow pellets, the Sun, the Moon, and Sura are said to
    be unable to die.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sura pursues the Sun and Moon in a dark chariot, overtakes them at times,
    fights them, and darkens their faces during eclipses; he is then defeated and
    they continue on their path.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A reported alternate explanation says a great frog tries to eat the sun or
