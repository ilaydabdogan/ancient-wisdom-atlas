canonical_text:
  quote: ''
  summary: The passage gives Shan explanations of the sun, moon, eclipses, lunar phases,
    rice and harvest omens, and Mount Meru. The sun is described as a golden bowl
    with a peacock in a crystal box on a flying chariot. The moon is a silver hare
    in a crystal house or box whose openings explain lunar phases. Lord Sura, a dark
    planet and brother of the Sun and Moon, pursues them after a dispute involving
    offerings and stolen immortality pellets; eclipses occur when he overtakes and
    fights them. The passage also describes Mount Meru as guarded by dragons, Galons,
    and ogres, encircled by mountains and sweet waters, and as the setting for nymphs,
    guardian combat, lightning, fire-like flashes, and water spray.
  language: English
  quote_policy: summarized
