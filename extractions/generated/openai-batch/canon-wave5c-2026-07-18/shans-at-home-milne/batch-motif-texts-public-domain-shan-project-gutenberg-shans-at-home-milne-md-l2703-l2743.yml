  summary: The passage describes men and boys capturing pigs and releasing them in
    the jungle; Shan children gaining merit by picking sacred lotus flowers for the
    temple; monks telling stories of a pre-Gautama Buddha whose steps produced lotus
    flowers; and boys in yellow robes making miniature pagodas near the monastery,
    which adults avoid stepping over out of religious respect.
