  quote: ''
  summary: A poor fisherman marries a poor girl described as very wise. On the way
    to set nets in the river, she agrees when he describes a crow as white and an
    egret as black. The couple works together, catches many fish, and becomes rich.
    Envious poor neighbours try to imitate them, but the second wife contradicts the
    same color statements; the couple quarrels and catches nothing.
