  summary: The passage describes a Shan custom concerning an unmarried dead girl,
    in which her coffin is knocked against a tree and she is said to be married to
    the tree so that she will not die childless in a next life. The narrator connects
    the tree with fertility and compares tree use in marriage rites in India and Kashmir.
    The passage also describes a horse presented to a monastery in the name of the
    dead, marked by a golden umbrella in the funeral procession, and notes the noisy,
    unstable character of a Shan funeral procession.
