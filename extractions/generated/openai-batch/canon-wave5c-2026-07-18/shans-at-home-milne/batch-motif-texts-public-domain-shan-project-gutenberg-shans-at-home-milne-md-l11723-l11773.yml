canonical_text:
  quote: ''
  summary: A wise and good crow is chosen king by the other crows. His wife asks for
    food from the human king’s table, and the crow-king tries to obtain it by attacking
    the servant carrying the royal meal. The servant captures the crow-king, but another
    crow, grateful for the crow-king’s past kindness, attacks the servant to save
    him. The second crow is captured and explains his motive to the human king, who
    praises gratitude, releases him, and orders daily food to be hung outside the
    palace for the birds.
