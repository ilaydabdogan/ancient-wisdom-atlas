canonical_text:
  quote: ''
  summary: The passage describes Shan medical beliefs, pregnancy and birth customs,
    handling of the umbilical cord and afterbirth, signs of good or bad fortune at
    birth, adoption and foster-mother practices, beliefs about toothache, sun and
    moon effects, triplets, celestial considerations in medicine, bodily elements,
    the changing seat of life, disease as soul-purifying, and disposal rules for nail
    and hair remnants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shans are described as trusting European medicines, Chinese drugs, and mineral
    remedies including powdered iron and sulphur.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul of a child is believed to enter the mother twenty to thirty days
    after conception, brought to earth by an attendant spirit, and swallowed after
    alighting on fruit or vegetable food while the woman eats.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During pregnancy, Shan women may eat soft clay to prevent sickness and are
    forbidden honey, very sour or sweet foods, strong chili or ginger spices, hot
    drinks, and papaw fruit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At birth, the mother or a wise woman helps; slow labor may be assisted by
    massage and hot water made by dropping hot stones into water for medicinal use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The umbilical cord is severed with a sharpened piece of newly cut bamboo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband remains nearby but outside the birth room; he receives the placenta
    and umbilical cord, washes them, rolls them in a banana leaf, and buries them
    under the house steps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Careful handling of the afterbirth is believed important for the child’s future
    health and happiness; the father’s smiling or frowning while burying it is linked
    to the child’s future temper.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Burying the afterbirth under the steps is believed to bring more children
    to the family, and a child born with the umbilical cord around its neck is considered
    very fortunate.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A caul is buried with the afterbirth without luck associations; moles except
    under the eye, hare-lip, and two thumbs on one hand are considered lucky or fortunate
    birth signs.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:10
  text: Twins are said to carry no superstition, while triplets are treated as a shameful
    or improper occurrence associated with non-human animal tendencies.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: After birth, the father and mother sleep in separate rooms for two or three
    months, and the mother follows a restricted first-month diet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a married woman dies leaving a young baby, a foster-mother is readily found
    and may adopt the child as her own; nursing an illegitimate baby is described
    as morally shadowing the foster-mother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Toothache is believed to be caused by a worm eating the teeth, with remedies
    including cloves, lime-tree leaves, and guava-leaf water.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: A wasting disease may be attributed to sleeping in full moonlight, and Shan
    doctors are said to consider the positions of the sun, moon, and stars before
    prescribing.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:15
  text: The body is held to be composed of earth, water, fire, and air, while the
    seat of life changes bodily location from day to day.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:16
  text: Shans are said to believe there are ninety-six diseases, and a patiently borne
    disease can purify the soul and count as a good deed after death.
  category: other
  evidence_refs:
  - ev:13
- id: obs:17
  text: Cut nail pieces should be burnt or buried and not fall through the floor;
    hair combings should not be stepped on but hidden in roof thatch or a bush.
  category: action
  evidence_refs:
  - ev:14
