  summary: A wise and good king of the doves warns his flock against leaving the jungle
    for abundant paddy lands. They ignore him and are caught in a net. The king instructs
    them to act together and lift the net by flying at the same time. Still trapped
    under the net after reaching the jungle, the king calls a mouse friend, who summons
    other mice to gnaw the net apart and free the doves.
