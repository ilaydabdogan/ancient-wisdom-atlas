  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ploughing is done in wet conditions, often before dawn, with an agriculturist
    guiding a buffalo that pulls the plough through soft mud under water.
  category: action
  evidence_refs:
  - ev:5
