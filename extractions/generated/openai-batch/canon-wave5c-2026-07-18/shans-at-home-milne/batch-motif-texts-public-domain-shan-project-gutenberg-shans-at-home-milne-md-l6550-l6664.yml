  quote: ''
  summary: 'The passage describes paddy cultivation in a Shan area before and during
    the rains: field burning, terracing, water diversion, nursery sowing, an offering
    of rice to the Spirit of the White Tiger, ploughing with buffalo, tool repair
    by Yunnanese Shans, and communal transplanting with a feast for helpers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Preparations for paddy planting begin in the month before the rains, with
    grass cut, dried, heaped, and burnt in the fields.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: Small paddy fields are bordered by low turf walls and arranged as terraces
    sloping toward the hills.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ashes are mixed with manure, and diverted streams flood each paddy field through
    channels and openings in the turf walls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Paddy seed is soaked in bags or closely woven baskets until it begins to sprout,
    then drained and sown thickly in a nursery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the time of nursery sowing, an offering of rice is made to the Spirit of
