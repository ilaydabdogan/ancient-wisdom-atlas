canonical_text:
  quote: ''
  summary: 'Ethnographic description of Shan practices for establishing a new household:
    securing a house site, testing soil and stream orientation, using rice-grain omens,
    choosing lucky lunar days for bamboo cutting and building, preventing spirit intrusion
    from jungle bamboo, making offerings to spirits in a tree, and setting the centre
    post where the rice omen was made.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Shan only son may continue living with his parents after marriage, while
    a man with many brothers builds a house for himself, often after marrying so his
    wife can help carry cut bamboo from the jungle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: New house sites are difficult to obtain because village sites are occupied
    and nearby paddy lands are held under hereditary rights; some young men seek hillside
    jungle land instead.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before applying for a site, the prospective householder examines whether the
    soil and nearby stream make the place fortunate for a house and garden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soil's scent is considered chiefly important, its color is also studied,
    and the soil should not contain two colors or two kinds of soil.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nearest stream should flow past the house toward the east or north, and
    a small stream may be diverted to do so.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: At night the young builder goes to the chosen site with five older men; each
    older man carries one grain of uncooked rice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The five grains of rice are placed on the ground in a diamond shape with one
    grain in the middle, then covered with an earthenware pot or hollow bamboo stem,
    weighted with a stone, and wrapped with a cloth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The future builder asks whether he should build there and next morning uncovers
    the grains to study their position.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the grains have not moved, the builder applies to the village headman for
    the land; if the grains have changed position, the site is abandoned and a new
    one is sought.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A lucky day for cutting bamboo must be chosen in the second half of the month
    when the moon is waning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states a belief that bamboo cut during the waxing moon is more
    likely to be attacked by boring insects and become rotten.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cut bamboos are carried with the root-end pointing toward the jungle where
    they grew and the tip pointing toward the house site so that evil spirits are
    not brought from the jungle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cut bamboos are soaked in water for days or weeks to harden them and prevent
    attacks by boring insects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A propitious day must be found to begin building, and the passage states that
    an unlucky day may cause builders to fall from the rafters and be hurt.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The chief builder, assisted by wise men of the village, discovers the lucky
    day for beginning the building.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Offerings of rice, tea, fruit, and flowers are placed on a scarlet tray under
    the nearest tree while spirits in the branches above are invoked; the food is
    left for the day and later removed and may be eaten.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When building begins, the hole for the centre post is dug exactly where the
    rice grains used to choose the site were placed, and the centre pole is set there.
  category: sequence
  evidence_refs:
  - ev:9
