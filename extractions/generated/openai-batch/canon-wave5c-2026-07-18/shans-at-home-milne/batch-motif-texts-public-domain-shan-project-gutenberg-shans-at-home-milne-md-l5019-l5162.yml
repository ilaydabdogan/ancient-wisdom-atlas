  text: In the evenings, religious subjects are discussed in Shan homes before neighbours
    depart around ten o'clock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ashes are heaped on the fire before bedding is spread and mosquito curtains
    are tied to wooden pegs in mat walls.
  category: sequence
  evidence_refs:
  - ev:1
