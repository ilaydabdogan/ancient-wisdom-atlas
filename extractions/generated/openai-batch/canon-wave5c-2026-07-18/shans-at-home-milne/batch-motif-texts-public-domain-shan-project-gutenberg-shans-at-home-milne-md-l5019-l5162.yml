  text: Someone recites a few lines concerning the changes and uncertainties of life
    before everyone goes to bed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dog howling in moonlight is allowed to howl because it may be its form of
    prayer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cats making noise are chased away because fighting cats are said to bring
    bad luck to the nearest house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women begin paddy pounding around four o'clock, after the second cockcrow
