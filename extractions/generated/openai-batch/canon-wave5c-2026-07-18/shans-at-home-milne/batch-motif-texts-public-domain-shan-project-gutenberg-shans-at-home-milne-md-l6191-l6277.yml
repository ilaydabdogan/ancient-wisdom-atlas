  summary: 'The passage describes Shan village and market life: reluctance to buy
    unnecessary goods, valuation of religion, scripture study, temperance, marriage
    by mutual affection, subsistence through cultivation, seasonal Yunnan caravans,
    abundant produce in bazaars, open-air market scenes, and a religiously grounded
    objection to killing animals despite the presence of meat markets.'
