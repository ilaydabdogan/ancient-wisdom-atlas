canonical_text:
  quote: ''
  summary: After a brief residual note that precious stones, gold, and silver may
    still remain in the earth, the passage tells the story of King Saw-von, his soothsayer
    Pau-surn-swan, and the great crocodile lord of the waters. The soothsayer gives
    a false rain prediction, is mocked by the king after a storm, blames the crocodile,
    and kills him by sending his spirit out of his sleeping body. The crocodile appears
    in the king's dream, accuses him of failing to protect him despite receiving a
    gem, and threatens to sink the kingdom into a lake. The king's spirit and the
    crocodile's spirit go to the infernal regions and then to the high heavens, where
    Sakya pacifies the crocodile by allowing him to remain in heaven and turning him
    into a rainbow, sometimes accompanied by his paler rainbow wife.
  language: English
  quote_policy: summarized
