canonical_text:
  quote: ''
  summary: An ogress wife falsely accuses Queen Hsa-pu-te-hsa and Prince Kap-pa-ra,
    assumes Kap-pa-ra's form, and causes the king to imprison him. Hsa-pu-te-hsa flees
    and receives from Sakya a two-string musical instrument that can heal illness
    and fulfill desires; she cures the old king of Hpa-wa-hti and is kept in his palace
    as a daughter. Sakya frees Kap-pa-ra, exposes the ogress, and kills her. The repentant
    king searches for Hsa-pu-te-hsa with a musical instrument, meets the Hpa-wa-hti
    prince riding a magic bow, and reaches Hpa-wa-hti, where Hsa-pu-te-hsa hears him
    play and sings to him.
  language: English
  quote_policy: summarized
