canonical_text:
  quote: ''
  summary: 'The passage describes Shan house construction and associated rites: setting
    and securing posts, expelling devils from post holes with saliva after betel chewing,
    making a final offering to spirits before thatching, reading a crow on the centre
    post as a good omen, blessing a new occupant, keeping a newly lit house fire burning
    for seven days, and bringing water, cooked rice, and green leaves from the old
    home for luck.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: House-post holes are dug at least a yard deep, posts are placed in them, and
    earth is rammed around them to make the house firm against winds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the post holes are completely filled, the builder and friends chew
    betel-nut with lime and spices to produce saliva.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men spit into each post hole; the passage says little devils under the
    house posts object to saliva, flee, and the hole is then quickly filled and pounded
    hard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the roof is thatched, each upright post is topped with bananas, flowers,
    and large banana leaves as an offering to spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A crow alighting on the centre post at this stage is considered a good omen,
    although crows and owls are otherwise described as unlucky birds.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the house owner comes to take possession, an old man welcomes him with
    a blessing for freedom from misfortune, anxiety, sickness, danger, and for happiness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A fire is lit in the entrance room and is not allowed to go out for seven
    days and nights.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: It is considered lucky to bring from the old home a pot of water, a pot of
    cooked rice, and green leaves that do not easily wither.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the pots brought from the old home are cracked or broken and their contents
    spill, very bad luck is expected.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A bamboo house is said to last about three years, after which it is pulled
    down, burned, and replaced with a new one.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Village people drag tree trunks for a monastery or chief's house without payment,
    regarding the work as meritorious or as work for their religion or chief.
  category: action
  evidence_refs:
  - ev:9
