canonical_text:
  quote: ''
  summary: 'The passage describes Shan funeral practices: water offerings, burial-ground
    rites with monks and water poured beside the grave, occasional rope assistance
    for the dead person''s spirit to journey north to Mount Meru, grave goods and
    memorial streamers, a seventh-day feast for the dead, special precautions for
    a woman who dies with an unborn child, burning of lepers'' bodies and shelters,
    special burial of lightning-struck persons, and clothing rules for natural versus
    sudden or violent deaths.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women offer water in the name of the dead to anyone who may be thirsty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the burial-ground, monks precede the bier, men follow it, and women remain
    kneeling at a distance rather than going to the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Monks recite Buddhist scriptures, and during the final recitation an earthenware
    bottle full of water is emptied slowly beside the open grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the water-bottle is empty, the coffin is lowered; sometimes it is raised
    and lowered several times, and a rope is pulled northward to help the dead person's
    spirit begin its journey to Mount Meru.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Implements of trade are not buried with the body, but rice, tea, tobacco,
    and sometimes a toy for a child may be placed in graves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the grave is filled, the bier and canopy are placed above it; most graves
    have no tombstone and are not visited, while memorial bamboos with streamers are
    set up near the monastery during festivals.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the seventh day after the funeral, another feast is held, and it is generally
    believed that the dead person's spirit returns, is present, or is aware of the
    feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The death of a Shan woman with her unborn child is described as the greatest
    misfortune for both families, and her spirit is believed to become a malignant
    ghost unless precautions are taken.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: In such a case, the unborn child is removed, and mother and child are wrapped
    in separate mats and buried without coffins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dead woman and baby are lowered through an aperture made in the side wall
    of the house, and the opening is filled with new mats so that the ghost may not
    know how to return.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lepers live in jungle booths or huts; when they die, their bodies are burned
    under the shelter where they lived, with wood added to destroy both body and dwelling-place.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A person killed by lightning is wrapped in a fine mat, placed standing in
    a well-shaped grave, and covered at the head with an inverted earthenware pot.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that Shans profess ignorance about the lightning burial
    custom, then reports possible medicinal use of the pot and a suggestion by W.
    W. Skeat concerning Malay beliefs about thunderbolts.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Clothes of someone who died naturally may be worn by others, but clothes of
    someone killed by murder, lightning, suicide, or sudden accident are generally
    buried with the body.
  category: object
  evidence_refs:
  - ev:12
