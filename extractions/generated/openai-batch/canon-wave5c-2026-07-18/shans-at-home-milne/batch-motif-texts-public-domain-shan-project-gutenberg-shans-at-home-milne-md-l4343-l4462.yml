comparison_claims:
- id: claim:1
  claim: The passage itself compares the lightning-related pot custom to an unspecified
    practice in certain parts of Africa in which a pot is placed in a lightning hole
    and later used for medicines, supporting only a cautious same-function comparison
    around lightning, pot, and medicine.
  claim_level: same_function
  target: unspecified African practice described in the passage
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The passage provides no precise African source community, and the Shan
    connection is presented as possible rather than established.
- id: claim:2
  claim: The passage reports W. W. Skeat's suggestion that placing a pot on the head
    of a lightning-struck person may keep the spirit down, linked to Malay beliefs
    that thunderbolts rise from the ground; this supports only a cautious functional
    comparison.
  claim_level: same_function
  target: Malay belief reported by W. W. Skeat in the passage
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: low
  limitations: The same evidence says Shans profess ignorance of the reason; Skeat's
    interpretation is explicitly a suggestion, not a reported Shan explanation.
