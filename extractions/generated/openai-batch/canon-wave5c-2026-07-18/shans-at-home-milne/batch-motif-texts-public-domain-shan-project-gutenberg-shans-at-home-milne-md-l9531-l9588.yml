  quote: ''
  summary: A crocodile's wife wants to eat a monkey's heart as a cure. The crocodile
    repeatedly lures a monkey with promises of fruit across the river, then reveals
    midstream that he intends to drown him. The monkey claims he left his heart in
    a tree and offers to fetch two hearts. The crocodile returns him to shore, where
    the monkey gives two figs that the crocodile's wife eats, believing them to be
    monkey hearts, and she is cured.
