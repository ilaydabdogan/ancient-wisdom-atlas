  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: In the heat of the day, birds and beasts sleep, while insects hum; butterflies
    move in sunny spaces and beetles may fall to the earth and mimic death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: As shadows lengthen, birds are heard and seen, including doves, pigeons, a
    peacock, jungle-cocks, and a jungle-hen with eight chicks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When approached, the jungle-hen flees into bushes; her chicks hide silently
    in separate places, and later she calls them back while moving in widening circles.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A bulbul finds melon and calls its mate; the pair is described by breast,
