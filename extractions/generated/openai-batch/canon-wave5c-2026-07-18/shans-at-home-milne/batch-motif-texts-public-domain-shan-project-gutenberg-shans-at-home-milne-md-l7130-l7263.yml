canonical_text:
  quote: ''
  summary: 'An English prose description of jungle terrain and animal life: forest
    succession through dead trees and creepers; Kachin hill-rice clearings and dammed
    valleys; monasteries and zayats along bridle paths; reports of leopards, tigers,
    bears, monkeys, insects, birds, and bats; and a detailed observation of a jungle-hen
    whose chicks hide and later return when called.'
  language: English
