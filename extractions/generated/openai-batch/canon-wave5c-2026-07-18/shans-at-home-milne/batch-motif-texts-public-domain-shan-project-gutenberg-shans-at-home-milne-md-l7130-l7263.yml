- id: obs:1
  text: Unspecified tunnel-builders make tunnels over dead trees and undermine them;
    wind-storms bring the trees down, creepers fall with them, and later trees spring
    up, are smothered by creepers, and die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kachins cut down and burn forest for hill-rice clearings; small valleys contain
    dammed streams and rice cultivation; monasteries and zayats may stand near larger
    bridle paths.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says leopards and tigers are rarely seen, but leopards are numerous
    and dreaded because cattle and ponies are killed near the jungle; trapped leopards
    may be speared and eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Shans describe a leopard attack as seizing prey by the throat, biting the
    jugular veins, drinking blood, and becoming unaware of sound while attached to
    the throat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A reported pony victim had deep neck incisions, no claw marks, no visible
