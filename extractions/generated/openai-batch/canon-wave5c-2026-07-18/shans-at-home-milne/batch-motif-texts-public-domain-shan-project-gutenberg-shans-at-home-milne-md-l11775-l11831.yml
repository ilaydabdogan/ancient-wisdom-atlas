canonical_text:
  quote: ''
  summary: A man herding cattle becomes lost in the jungle while looking for a strayed
    cow and falls into a deep hole. A monkey rescues him by lowering its tail and
    then asks to sleep on his lap before guiding him home. The man, disgusted by the
    monkey's face, strikes it with a stone. The wounded monkey still keeps its promise
    and guides him to the village from the trees by the drops of blood from its head.
    After the monkey returns to the jungle, the earth opens and swallows the man.
