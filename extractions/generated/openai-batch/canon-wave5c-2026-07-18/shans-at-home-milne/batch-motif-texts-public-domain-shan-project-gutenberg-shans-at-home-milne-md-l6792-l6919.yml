canonical_text:
  quote: Thou art now my child. I shall eat of thy fruit.
  summary: The passage describes Shan village practices and beliefs concerning cultivated
    plants, fruit trees, crop spirits, the White Tiger, cattle and buffaloes, animal
    calls, ponies, pigs, and the absence of goats or sheep in some districts. It includes
    auspicious planting, root orientation, offerings to bad spirits, claims of descent
    from the White Tiger, kinship language toward working animals, luck associated
    with piebald horses, and a taboo against riding mares.
  language: English
  quote_policy: quoted
