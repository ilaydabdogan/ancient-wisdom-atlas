  summary: The passage describes several Shan Buddhist monastic sects, contrasting
    their strictness, residence, worship practices, clothing, dietary allowances,
    and regional distribution. It then explains that Shan society is divided into
    two castes and that caste affects children's social interaction and schooling,
    including the choice of monastery for boys.
  language: English
  quote_policy: summarized
