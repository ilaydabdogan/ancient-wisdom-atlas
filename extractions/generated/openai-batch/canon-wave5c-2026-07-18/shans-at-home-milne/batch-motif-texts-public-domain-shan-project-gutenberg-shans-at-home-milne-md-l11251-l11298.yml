  quote: ''
  summary: A poor man buys oil to sell in a city lacking oil. While chasing an iguana,
    he digs at its hole and finds pots of gold and silver. He throws away his oil
    so he can carry the treasure, leaves the pots at a city house while visiting the
    market, forgets where he left them, and later finds only a day’s wages and a written
    note saying he has been paid for carrying another owner’s pots.
