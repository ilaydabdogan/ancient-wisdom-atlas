canonical_text:
  quote: ''
  summary: A prince learns the secrets of an ogre garden from his ogress wife, steals
    magical objects, and escapes on a flying horse. The ogress pursues him after resuming
    her ogre form; he blocks her with mountains and fire, and she dies in the flames.
    Returning home, he restores stolen eyes to his mother and her sisters with magic
    water, reveals the king's queen as an ogress through truth-revealing water, and
    destroys the ogres by breaking an urn containing their breath of life. The dead
    queen's body fills a valley, forming a mountain and an island.
  language: English
  quote_policy: summarized
