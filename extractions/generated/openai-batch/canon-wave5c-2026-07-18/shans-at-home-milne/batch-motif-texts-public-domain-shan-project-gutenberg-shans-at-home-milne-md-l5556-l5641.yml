canonical_text:
  quote: ''
  summary: 'The passage describes Shan religious festival practices: women praying
    at the temple, men performing solemn circular dances with music, boys imitating
    adult dancers before tattooing, festival booths and paper-animal processions,
    open-air fires and fire watch, Buddhist nuns, and Buddha images processed under
    golden umbrellas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Shan women never dance and that Shan men dance only
    in connection with a religious ceremony.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each small village is said to have at least one band, and men and women march
    with bands from surrounding districts to attend major festivals; Palaungs may
    attend Shan religious gatherings, while Kachins are said not to come down at these
    times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When women arrive at the festival village, they go to the temple to pray;
    men form a large circle in front of the monastery and dance for long periods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The male dancers circle slowly around musicians, move right to left against
    the course of the sun, bend and sway their bodies, wave their arms, and use steps,
    hops, and kicks while musicians keep a steady beat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dance is described as a serious and solemn affair for the participants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Boys before tattooing do not participate in the men's dance; they form small
    circles, use miniature instruments made from old oil tins, and imitate the gestures
    of fathers and older brothers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the three-day October festival, bands, drums, and gongs sound through
    the night; tired dancers shout together to signal that music should stop, but
    other circles continue or begin dancing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After resting, dancers go into the temple to pray before beginning to dance
    again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Festival open spaces contain booths and simple restaurants selling merchandise,
    food, sweet tea, sugar-sticks, and sweet biscuits.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Processions include paper animals whose heads and tails are moved by strings,
    with several men walking inside each animal.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: At holiday times, friends and relatives meet; zayats are crowded, and people
    in best attire sit around open-air fires smoking, cooking, and eating; watch is
    kept because accidental fire could burn the village.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Buddhist nuns are described as shaved-headed women in apricot or white toga-like
    garments; they fast, live morally, sweep and dust the temple and monastery, may
    adopt orphan girls as miniature nuns, take no vows, and may return to secular
    life.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Temples contain a central Buddha statue, smaller Buddha images, and sometimes
    kneeling figures of adoring disciples; when an image is presented to the temple
    it is processed through village streets under an open golden umbrella, and closed
    golden umbrellas stand behind monastery statues.
  category: object
  evidence_refs:
  - ev:8
