  quote: the four arms of the svastika represent the four petals of that flower
  summary: 'The passage describes Shan craft production and related objects: a coverlet
    design interpreted as sun, poppy, and svastika; indigo dyeing; bamboo hats; screw-pine
    waterproofs; lime made for betel chewing; pottery; silverwork including ornaments,
    weapons, pipe parts, and butterfly-shaped chatelaines; and professional scribes
    who write letters, copy Buddhist Scriptures, compose love songs, and make their
    own ink and reed pens.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A coverlet design is described as appearing to be an emblem of the sun; weavers
    call it the poppy and explain the four arms of the svastika as the four petals
    of that flower.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plain cloth is dyed blue by infusing indigo leaves in hot water, soaking cloth
    in the liquid, drying it in the sun, washing and drying it again, and repeating
    the process if a darker shade is needed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hats are made from giant bamboo leaf-sheaths and bamboo strips; they may be
    plain, decorated with gold and silver thread and spangles, and are worn over turbans
    with cords or silver chains.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Waterproofs are made from twi leaves, cut to even lengths and sewn in overlapping
    rows, and are worn on the shoulders or used by traders as basket coverings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lime is produced by placing limestone in one pit and burning wood in a connected
    second pit so that smoke and fire pass through the stones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lime is used with areca-nut and betel-leaf, and may be mixed with turmeric
    to make it red.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pottery is made from clay worked with water, shaped by hand on a stone wheel,
