  summary: The passage describes Shan boys making sand pagodas for merit, decorating
    them with flowers and paper pennons, and collecting abundant food for monks. It
    gives examples of monastery hospitality toward a bereaved Mohammedan policeman
    and a Hindu mendicant. The Hindu mendicant is described as a renouncer, traveler,
    religious interlocutor, singer of hymns, teller of Indian divine tales, and practitioner
    of severe penance. The monks compare his renunciation and penances with those
    of the Buddha/Gautama, while saying Gautama found a better path. The passage ends
    with a discussion between the chief monk and the guest about two great rivers,
    one called the River of Death.
