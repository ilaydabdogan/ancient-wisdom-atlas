canonical_text:
  quote: ''
  summary: The passage describes Kachins as feared by Chinese Shan children and as
    hill raiders who have abducted children and young people; it describes Shan children's
    games, toys, bathing, and a dead-snake practical joke; it then describes male
    tattooing as the marker of Shan manhood, including designs, pain, opium, and peer
    advice during the aftermath.
  language: English
  quote_policy: summarized
