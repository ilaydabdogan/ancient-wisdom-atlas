  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Shan children have no dolls, sometimes nurse puppies or kittens
    as pretend children, and girls also nurse smaller siblings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children bathe and play in streams, but Shans are described as cautious of
    strong currents and whirlpools in great rivers and usually swim close to the banks
    downstream.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children and grown-up people place a dead snake coiled as if alive near a
    path to frighten passersby, and a woman who discovers the joke may join them in
    waiting for another victim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Shan boy is considered to have reached manhood when he has been tattooed;
    before he endures the operation, his status is described as that of a child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The usual male tattooing covers both legs from waist to knee in dark blue
