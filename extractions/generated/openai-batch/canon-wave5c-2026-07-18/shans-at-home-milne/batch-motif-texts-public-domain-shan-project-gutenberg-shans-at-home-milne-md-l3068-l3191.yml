  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Kachins are described as hill people whose villages are on hilltops reached
    by steep, narrow paths, while Shans are described as lowlanders of plains or valleys.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Yun-nan Shan villages, watchers fire guns at intervals through the night
    to warn hill men that villagers are awake and watching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Girls play by throwing or flicking cowrie shells or fruit seeds into small
    holes in the ground; Shan children also use seeds, shells, sticks, stones, wooden
