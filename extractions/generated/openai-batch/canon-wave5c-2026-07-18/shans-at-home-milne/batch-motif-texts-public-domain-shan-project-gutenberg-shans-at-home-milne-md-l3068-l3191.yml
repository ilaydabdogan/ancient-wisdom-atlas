- id: obs:1
  text: Chinese Shan mothers silence crying children by warning that Kachins will
    hear them and come to take them away.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Kachins sometimes raid villages on the plains and take
