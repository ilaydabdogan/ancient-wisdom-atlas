canonical_text:
  quote: ''
  summary: 'The passage describes Shan marriage customs: typical ages for marriage,
    childhood play-vows, absence of betrothal ceremony, elopement to a temporary bamboo
    house when parents oppose a match, formal negotiations when parents consent, bride-price
    payments, women''s earnings and work, repayment rules at separation or remarriage,
    written release in divorce, child custody, and widow remarriage customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls are described as seldom engaged before fourteen, with an average marriage
    age about sixteen; men marry after sixteen, more often around eighteen or twenty.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a husband is expected to be older than his wife, and that
    no woman would marry a man she thought younger than herself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little children may jokingly promise to marry each other when grown, sometimes
    remain true to those vows, and the wife may continue to use the husband's childhood
    baby name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: There is said to be no betrothal ceremony; parents rarely force disliked marriages,
    but young people may elope if parental consent is refused.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For an elopement, the young man chooses a quiet place in the jungle near a
    stream and far from a village, and builds a temporary home for himself and his
    bride.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The temporary bamboo house is described as green inside and out, with green
    posts, green mat walls, a raised floor, a bamboo ladder, and enough height to
    keep fierce wild animals from entering.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Food for several days is provided before the bride is brought to the hidden
    green home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Runaway marriage is said to be no disgrace, and a girl living with a man in
    his house is regarded as his wife; the couple later returns to the village and
    abandons the little house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: With parental consent, the man asks the girl, then asks his mother or sister
    to tell his father; if satisfied, the father sends an elderly male friend to discuss
    the marriage with the girl's father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A sum is paid by the father of the bridegroom to the father of the bride,
    varying with the girl's qualities and the lover's wealth and position; the passage
    calls this a survival of marriage by purchase.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A girl determined to marry a poor man may help him pay the demanded sum; a
    woman's earnings are described as her own before and after marriage, with expected
    support for aged or unable parents in some circumstances.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women may weave, dye cloth, embroider, weave patterned cloth, or trade without
    loss of social standing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'The passage gives typical bargaining figures for the marriage payment: one
    hundred rupees suggested, half possibly accepted, with twenty-five paid at once
    and twenty-five on the wedding day.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: If a husband and wife separate without fault and the wife returns to her father's
    house, half the amount paid for her must be returned to the father-in-law; if
    she marries again, the new lover must repay the original amount to the first husband's
    father.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: If a man sends away a wife who has committed no fault, he cannot reclaim the
    money paid for her and must give her a written release before elders so she may
    marry again.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: In divorce, children may go to either parent, but very young children are
    always given to the mother.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: A widow who has remained in her father-in-law's house should pay him a small
    sum if she marries again; it is customary but not obligatory for her to marry
    her deceased husband's brother, with no payment required in that case.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage states that a Shan man does not marry his deceased wife's sister.
  category: relationship
  evidence_refs:
  - ev:11
