canonical_text:
  quote: ''
  summary: A childless wife wishes for a baby even as small as her thumb. Spirits
    hear her, and she bears a perfectly formed thumb-sized son named Little Thumb.
    He remains tiny but speaks and acts confidently, guides a mule from its ear, is
    bought by two men after advising his father to sell him, escapes through a rat-hole,
    sleeps in a snail shell, and later tricks robbers by making noise at a rich man's
    house so that the owner wakes and the robbers flee. The closing summary says he
    has many adventures, gains money for his parents, and returns home rich and successful.
  language: English
  quote_policy: summarized
