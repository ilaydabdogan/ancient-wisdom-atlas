canonical_text:
  quote: ''
  summary: 'The passage first tells how Prince Gautama, discouraged in his search
    for Truth, is admonished by Sakya, king of the spirits of the air, who takes squirrel
    form and models perseverance by trying to drain a lake with his tail. Gautama
    returns to his search and becomes the Buddha. A narrator then notes Indian/Shan
    and Hindu/Buddhist variants, including a Hindu version with Vishnu. The passage
    then begins another tale: twelve sisters catch fish despite a holy man''s teaching
    against taking life; after death they are reborn as a headman''s daughters and
    become a king''s wives. An ogress queen transforms herself with magical water,
    becomes the king''s favorite wife, steals the sisters'' eyes, falsely accuses
    them, and causes their exile. The sisters take refuge in a cave, where hunger
    leads them to agree to eat their own babies.'
  language: English
  quote_policy: summarized
