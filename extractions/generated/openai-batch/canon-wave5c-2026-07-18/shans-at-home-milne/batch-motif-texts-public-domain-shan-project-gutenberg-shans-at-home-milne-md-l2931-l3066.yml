canonical_text:
  quote: ''
  summary: An English ethnographic passage describes Shan children's games, girls'
    household and craft work, girls' oral learning of Buddhist scriptures, festival
    preparation of popped rice offerings for monks, flower and water placement in
    an image-house, colorful festival dress with English-word “charms,” affectionate
    cheek-kissing/smelling language, and girls' games including bear-named chasing
    and blindfold games.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys' rainy-season and windy-season pastimes include stilt-walking and kite-flying.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The game “Mak-nim” uses large beans set upright, and players try to knock
    down targets with another bean; in a harder form only one bean must be knocked
    down while others remain standing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boys climb trees, swing from banyan aerial roots, and play “Riding on Horseback,”
    in which two boys clasp wrists while a third sits astride.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Girls' work includes fetching water, washing clothes, cooking, spinning, weaving,
    and helping with family trades such as pottery, bamboo hats, paper-making, and
    cheroot rolling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that wealth and dress do not determine social welcome among
    Shan children and women in the described setting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Girls are described as unable to read or write, but as knowing many Buddhist
    scriptures by heart through hearing men and boys recite them aloud in the evenings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before major festivals, girls pop paddy in a pot over fire and prepare popped
    rice as food for monks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Girls carry popped rice to the monastery in a scarlet basket together with
    flowers and a bottle of water; the rice is given to monks, flowers are placed
    in a vase near the image-house door, and old vase water is replaced with fresh
    water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A young girl asks the narrator to interpret English-word “charms” ornamenting
    panels of her skirt; the narrator reads the reversed words and tells her they
    can do no harm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Girls walk hand-in-hand and may press their lips to friends' cheeks without
    a mouth kiss or lip sound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the same Shan word is used for “kiss” and “smell,”
    and gives a sweetheart expression translated as “How sweet you smell!”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Girls seldom play with boys except at a house where someone lies dead; there
    they play games with sticks, pebbles, beans, or seeds tossed and caught on the
    back of the hand.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Several girls' games are named for bears, including “Bears catching each other,”
