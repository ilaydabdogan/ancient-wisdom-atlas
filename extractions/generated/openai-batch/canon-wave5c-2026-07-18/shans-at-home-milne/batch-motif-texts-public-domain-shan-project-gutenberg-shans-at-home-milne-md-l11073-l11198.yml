canonical_text:
  quote: ''
  summary: A Shan king's second wife, identified as a witch, falsely accuses the chief
    queen of witchcraft. The queen is executed, becomes a golden turtle, is killed
    again at the witch's demand, and instructs her daughter to bury her bones. A tree
    grows from the buried bones, and the queen's spirit returns and is recognized
    by the king. The witch kills the princess with boiling water, is exposed, executed,
    and reborn as a flea on the dogs that ate her flesh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Shan king has two wives; the chief queen is described as good, and the second
    wife is described as a witch.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During fishing near the palace, the king and queen put fish into baskets,
    while the witch swallows her fish alive and later accuses the queen of doing so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king believes the accusation and orders the queen put to death under a
    law that witches may not live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After death, the queen becomes a royal golden turtle living in the stream
    near the palace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The witch, now chief queen, feigns illness using parched rice under a quilt
    and asks the king for the golden turtle to eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The little princess warns the golden turtle that the witch intends to kill
