  text: The witch orders the turtle dropped alive into a pot of water on the fire;
    the princess first rakes out the fire in pity, then obeys after her mother tells
    her to let her die.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At a feast, the witch and her friends eat the golden turtle and drop the bones
