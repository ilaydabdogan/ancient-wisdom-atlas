  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The king has the tree transplanted to the palace garden.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The spirit takes the form formerly worn by the queen, speaks to the king after
