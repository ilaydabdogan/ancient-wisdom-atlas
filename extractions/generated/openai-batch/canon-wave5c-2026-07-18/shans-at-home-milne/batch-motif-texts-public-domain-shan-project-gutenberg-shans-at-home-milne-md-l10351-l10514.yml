canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Shan animal tale in which a mischievous
    hare deceives a tiger, causes him to be burned, directs him into further injury
    by bees, and eventually escapes while the tiger dies. The tale explains tiger
    stripes, tiger face marks, buffalo neck marks, and why tigers attack cows but
    not buffaloes. The passage then begins a tale of Princess Hsa-pu-te-hsa of the
    Silver Mountain: Sakya, king of spirits, gives a king a dream commanding him to
    send his brother to seek the princess; the brother and a friend depart, receive
    guidance and warnings from hermits, approach the Silver Mountain, and receive
    life-restoring holy water from Sakya in the form of an old man.'
  language: English
  quote_policy: summarized
