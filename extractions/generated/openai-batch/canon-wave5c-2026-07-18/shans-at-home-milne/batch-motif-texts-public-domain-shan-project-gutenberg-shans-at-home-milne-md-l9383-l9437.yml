  summary: The passage introduces Shan folk-lore as a body of long, nested tales that
    often move among multiple heroes and heroines. It lists recurring tale elements
    including royal protagonists, ogres, magic objects, holy water, flying horses,
    Jataka-like stories, petrification, birth gifts, secluded princesses bearing children,
    color-marked countries, a lotus fairy who helps a poor lad, giant birds that eat
    or abduct people, and crocodiles as water guardians associated with rivers.
  language: English
  quote_policy: summarized
