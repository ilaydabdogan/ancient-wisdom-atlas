  summary: The passage introduces Shan metrical composition, presents an English rendering
    of a Shan peasants' song for the beginning of the rainy or religious year, analyzes
    some rhyme patterns, and lists Shan proverbs. The song describes seasonal rain,
    a sky-god named Hsang-Kyan, thunderbolts, mountain fires dying, animals and farmers
    in the rainy landscape, religious observance during the fasting season, water
    reaching rice fields, water-wheels, and women transplanting rice. The proverbs
    give practical advice about learning, labor, speech, deliberation, preparedness,
    secrecy, and proper conduct.
  language: English, with Shan line specimens
