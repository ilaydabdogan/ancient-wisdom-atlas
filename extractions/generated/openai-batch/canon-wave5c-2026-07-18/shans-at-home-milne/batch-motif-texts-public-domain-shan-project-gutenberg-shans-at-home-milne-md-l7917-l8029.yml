canonical_text:
  quote: There are many ways of telling fortunes.
  summary: The passage describes several Shan fortune-telling practices using water,
    rice, flowers, leaves, food taste after prayer to a spirit, and bamboo burned
    in fire; it then turns to a description of Northern Shan State government, chiefs,
    prior Burman overlordship, Kachin pressure, and British supervision after annexation.
  language: English
  quote_policy: quoted
