- id: obs:3
  text: A wife asking whether her absent husband will return names the nearest half
    of the bowl the home side, drops a grain of uncooked rice into the water, and
    treats rice settling on the home side as a sign that he will soon return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A girl asking whether she will marry a certain man drops a grain of rice into
    water; near-side sinking is treated as yes, and far-side falling as no.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A wife without news of an absent husband fills an earthenware vase with water,
    flowers, and green leaves; complete evaporation by the end of the week is treated
    as a sign that he is ill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man seeking a yes-or-no answer draws four lines on the ground, places cooked
