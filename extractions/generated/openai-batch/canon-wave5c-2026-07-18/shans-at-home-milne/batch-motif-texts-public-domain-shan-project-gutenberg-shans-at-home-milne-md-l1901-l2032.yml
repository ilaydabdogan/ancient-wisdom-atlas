canonical_text:
  quote: ''
  summary: The passage describes Shan infant appearance, the keeping and ritual use
    of first-cut hair, name changes meant to protect unlucky children from evil spirits,
    staged deceptions involving gender disguise, hiding in the jungle, sale as a found
    child, and simulated burial. It also describes the importance of the weekday of
    birth for later choices and the gradual piercing and enlargement of children's
    ears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The infant is described as initially light in complexion, with very dark-brown
    eyes, black hair, and a shaved head except for a tuft on the crown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first hair cut from the child is kept in a small bag and hung around his
    neck as a charm to stop night crying.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the child is ill, the hair bag may be soaked in water, and that water is
    used to wash the child or is given to him to drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A boy's first name is later changed when he becomes a schoolboy at the monastic
    school, where the chief monk chooses another name.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a delicate or accident-prone child, the name may be changed more than
    once to puzzle evil spirits, which the passage identifies as causes of illness
    and mischance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: An unlucky little boy may be dressed as a girl, given a girl's name, and called
    “Little daughter.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In another staged act, the mother hides the child under a bush in the jungle
    and publicly laments that the baby is lost, while others agree that a tiger has
    taken and eaten him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A friend later presents the child as a found baby, debates merit with the
    mother, and eventually sells the baby to her for one rupee; the child is then
    named “Little Rupee” or “Little Found-in-the-Jungle.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a further staged act, the father rolls the child in a mat and carries him
    to the cemetery, the mother follows crying, a small grave is dug, the child is
    laid in it with his face uncovered, earth is heaped over him, sacred passages
    are recited, and he is afterward taken home and renamed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The weekday of birth is described as influencing later life, including hair
    and nail cutting, house-building, garden planting, and marriage compatibility.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A baby's ears are usually pierced when a few weeks old, threads are left in
    the holes, and the holes are gradually enlarged over years for ear ornaments.
  category: action
  evidence_refs:
  - ev:7
