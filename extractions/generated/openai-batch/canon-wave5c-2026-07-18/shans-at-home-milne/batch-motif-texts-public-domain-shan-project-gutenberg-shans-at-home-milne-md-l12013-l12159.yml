canonical_text:
  quote: ''
  summary: A hermit restores a parrot to princely form and turns a stone back into
    a bale-fruit, warning the prince not to open the fruit until he reaches the palace.
    The prince opens it early in a garden, and a fairy girl emerges. He leaves her
    in a tree while he goes for an elephant. Mai-pom-san-ta sees the fairy's reflection,
    questions her, kills her, steals her clothes, and impersonates her. The prince
    is deceived and marries the impostor. Later an old gardener and his wife find
    a lotus-flower; a beautiful girl emerges from it, secretly cooks and cleans for
    them, is adopted by them, and makes petal-pictures showing the prince, the parrot,
    the fairy in the tree, and the murder by Mai-pom-san-ta. The pictures appear to
    most people as flower garlands and are bought by palace servants.
  language: English
  quote_policy: summarized
