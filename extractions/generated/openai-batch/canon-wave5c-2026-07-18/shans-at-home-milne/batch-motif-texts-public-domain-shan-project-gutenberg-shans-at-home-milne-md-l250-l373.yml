canonical_text:
  quote: ''
  summary: The passage describes travel conditions in the Shan States, including rest-houses
    and portable screens; local curiosity about safety-pins; initial fear of a camera
    as a spirit- or devil-containing box; examples of mutual misunderstanding about
    worship and prayer; difficulties eliciting religious explanations; confidence
    gained through medicine; anecdotes about mistaken remedies; gratitude from a Buddhist
    nun; and changing Shan attitudes toward photography after no ill effects were
    observed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Native rest-houses in the Shan States are described as clean, sometimes open-sided,
    and suitable for use with a portable opaque muslin screen to form an inner bedroom.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A village headman who received a large safety-pin spent an afternoon explaining
    its mysteries to a large group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many people were initially afraid of the narrator's camera and thought some
    kind of devil lived in it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the narrator shaded her eyes while looking into the reflex part of the
    camera, observers believed she was praying to a spirit in the box.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The narrator gives examples of mistaken interpretations of prayer: trade
    implements were said to be worshipped, though inquiry attributed the prayer to
    an unseen deity guiding the tools; a Burman thought a missionary family prayed
    to chairs.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that Shans may be hesitant or embarrassed when asked to
    talk about religion, and that such hesitation should not be read as ignorance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator says that medical help can win confidence, and that people in
    Asia have strong belief in European medicines.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kashmir coolies rubbed themselves with anchovy sauce, believing it was an
    English embrocation, and said the next day that they were cured.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Shan who had asked for a toothache remedy used red sealing-wax on his tooth
    and later asked to keep the medicine, saying the toothache had stopped.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Buddhist nun treated with permanganate of potash gave the narrator and her
    servants vegetables and fruit for days and came to say prayers in the narrator's
    bedroom.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Shans were initially nervous and unwilling to be photographed, but the
    next spring became willing and anxious after observing that previously photographed
    people had remained healthy.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A photograph of a buffalo working in rain required repeated attempts because
    of slippery rice-field paths, mud, a slipping camera stand, water, and a man fleeing
