canonical_text:
  quote: ''
  summary: 'The passage gives a legendary origin account for the Ngai-Lao: Sha-yih
    of the Lao Mountains conceives repeatedly after contact with a stake in water,
    later revealed as a dragon. Ten sons are born; the tenth, Kiu-Lung, remains when
    the dragon appears, is licked and named, marries along with his brothers into
    a set of ten daughters, and becomes chief. The passage then shifts to historical
    claims about Ngai-Lao relations with Chinese authorities, tribute, military actions,
    royal recognition by imperial seal and title, and the later Nan-chao kingdom''s
    organization and military equipment.'
  language: English
  quote_policy: summarized
