  quote: ''
  summary: A boastful hare challenges a water-snail to a race from a stream mouth
    to its source. The snail organizes other snails upstream to answer the hare's
    calls, making it seem as if the same snail is always ahead. The exhausted hare
    gives up, and the story explains why hares do not talk and avoid rivers and pools.
    A note says related forms are told across the East, with the water-snail always
    winning and sometimes racing a bird such as a kingcrow in Malay Peninsula folktales.
  language: English
