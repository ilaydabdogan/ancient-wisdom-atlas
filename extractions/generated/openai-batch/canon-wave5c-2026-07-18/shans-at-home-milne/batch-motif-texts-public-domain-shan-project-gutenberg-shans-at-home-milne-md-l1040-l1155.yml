  summary: 'The passage outlines early Mao Shan political origins, including a golden
    town administered by four Elders, then recounts a chronicle legend: Hkun-ai marries
    a dragon princess; she lays an egg from which Hkun-Tung-Hkam is born; the child
    is nourished by miraculous milk, brings prosperity, wins the Yun-nan king''s daughter
    by crossing a lake on his dragon mother''s back, returns to Mao in splendor, reigns,
    and is succeeded by his son.'
