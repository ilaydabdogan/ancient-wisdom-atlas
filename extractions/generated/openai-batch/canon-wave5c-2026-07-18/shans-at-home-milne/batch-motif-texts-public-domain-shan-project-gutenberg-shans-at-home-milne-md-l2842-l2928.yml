canonical_text:
  quote: ''
  summary: The passage reports Shan beliefs about the soul crossing rivers after death,
    with a coin placed in the mouth to pay a ferryman; a Hindu devotee and Shan monk
    discuss afterlife and language. It also describes moonlit telescope viewing by
    a monk, Hindu mendicant, and boys; speculation about seeing the hidden side of
    the moon from a spirit mountain; Shan constellation names; temporary novice robes
    for boys; and several boys' games.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shans are reported to believe that at death the soul goes to a river where
    a boat waits to carry it across, and friends place a coin in the dead person's
    mouth to pay the ferryman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another river must be crossed before the highest heaven is reached; people
    reach its shore, find their own way across, and experience the crossing as easy
    or painful, but all eventually get home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After communication difficulties among the Hindu devotee, the Shan monk, and
    the narrator, the Hindu says it is good that God understands all languages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: On moonlit evenings the chief monk comes with the Hindu mendicant and boys
    to view the moon through the narrator's telescope.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The visitors notice that they always see the same side of the moon and ask
    when they may see its other side; the narrator explains that the other side is
    always hidden from them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The monk says that if in a next life he is born into the spirit world and
    is on the spirit mountain, he hopes to remember this side of the moon so that
    he will know both sides.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The monk makes sure every boy looks through the telescope and takes trouble
    to hold it for small and large boys alike.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Several constellations are named differently from European and Arabic arrangements,
    including the Great Bear as the Elephant's Head, Leo as the Drinking-cup of the
    Cat, the Pleiades as the Fan, the Pole Star as the Head of the World, and Cassiopeia
    as the Snail.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The children are disappointed that stars do not look larger through the telescope
    and hope to see the literal Snail, Fan, or Cat drinking from its cup.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A boy who does not intend to become a monk wears the yellow robe only temporarily
    and returns to ordinary schoolboy status when he lays it aside.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Boys make turf islands, dam streams with stones and mud, build dams, and float
    small dug-out boats.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the top-spinning game, a top is spun to knock down other tops while remaining
    spinning itself.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Mischievous boys throw spinning tops across the bare toes of small girls carrying
    water-buckets, and girls respond by kicking the top away, holding it for ransom,
    or laughing.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Boys play a stick-and-bat game and cock-fighting, but the boys usually separate
    the cocks before serious injury occurs.
  category: action
  evidence_refs:
  - ev:12
