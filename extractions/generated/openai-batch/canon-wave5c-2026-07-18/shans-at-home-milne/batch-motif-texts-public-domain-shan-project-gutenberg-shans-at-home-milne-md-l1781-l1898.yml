    or place the child in other ways.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: A note says a Shan mother belonging to a ruling family is not permitted to
    give birth in a palace, with a room prepared beneath it or in a neighboring building.
  category: setting
  evidence_refs:
  - ev:10
