canonical_text:
  quote: A Shan baby is rich in having two fathers and two mothers.
  summary: 'The passage describes Shan beliefs and customs surrounding infants: spirit
    parents guarding the baby, the infant’s early perception of spirits, a thirty-day
    purification washing at running water, naming rites involving a water-filled pot,
    gifts, blessings, a sevenfold white thread around the wrist, and later childcare
    practices.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A Shan baby is described as having human parents and also a spirit father,
    Paw-Hpan, and a spirit mother, Meh-Hpan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit father and mother are said to watch over the baby as sentinels
    and keep bad spirits away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A baby smiling in sleep is described as a sign that the spirit parents are
    playing with him.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says a very young baby sees the spirit world, fairies, elves,
    sun- and moonbeams, and small spirits riding dust-specks, but ceases to see this
    world as he recognizes earthly things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thirty days after birth, the mother, father, baby, and any attending friend
    or wise woman go to a running stream for a ceremonial washing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the stream the mother washes herself, her hair, and the baby, and pours
    water over the hair of her husband and the woman who attended the birth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After this washing the mother is described as purified and able to bring bananas
    and rice to the monastery and resume household duties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that lustrations in running water or temple water are considered
    to cleanse mind and body, and that washing another person’s hands or hair can
    express gratitude.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the ceremonial washing, the parents hold a naming feast and guests drop
    small gifts, usually coins, into a large earthenware pot filled with fresh water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Guests avoid saying the baby is beautiful or big because such praise might
    bring bad luck, and instead offer blessings to the parents.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The water from the gift-filled pot is poured over the baby, and the wise woman
    places the money in the child’s hands while wishing health, happiness, and freedom
    from ninety-six diseases.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An old man or woman winds a white thread seven times around the child’s wrist
    and tells him the chosen name; the thread is not tied and soon falls off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage reports that in Siam a white thread around something is believed
    to keep it safe from evil spirits, and compares this with Shan cloth around demon-inhabited
    trees and Tibetan cotton around devil-altars.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Coins given to the child are pierced and hung on a silver chain worn around
    the neck until about six or seven years old; excess coins may be made into anklets
    or bracelets.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Where Burmese influence is present, the baby may sleep in a hanging basket
