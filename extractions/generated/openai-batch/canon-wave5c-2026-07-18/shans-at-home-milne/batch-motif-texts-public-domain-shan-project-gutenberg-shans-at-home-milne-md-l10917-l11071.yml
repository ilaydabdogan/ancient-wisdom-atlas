  quote: ''
  summary: A poor Shan woman raises Ai-kawk-ho, a child who is only a head but has
    extraordinary powers. He tends cattle, seeks to marry the King's daughter, fulfills
    the King's impossible demand for a supernatural tree, marries the youngest princess,
    reveals a hidden princely form, appears publicly on a flying horse, and later
    journeys to the spirit country after the King receives a dream-command from lord
    Sakya.
  language: English
