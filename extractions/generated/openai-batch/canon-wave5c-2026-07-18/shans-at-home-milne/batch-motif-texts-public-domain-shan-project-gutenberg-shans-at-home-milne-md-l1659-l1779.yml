canonical_text:
  quote: ''
  summary: 'The passage describes Shan beliefs and practices surrounding birth: babies
    are welcomed, children are linked to parental merit from previous lives, spirits
    are said to carry child-souls to mothers, a tale explains a calling jungle bird
    as a forsaken child transformed after death, mothers infer a baby''s past-life
    condition from pregnancy symptoms, newborns undergo bathing, dressing, feeding,
    and protective charm practices, and the mother rests beside a fire for nearly
    a month after childbirth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Shan baby is welcomed at birth; a boy is said to bring more gladness than
    a girl, but girl babies are not described as despised.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When several boys have been born, a mother may make a tiny baby-girl costume
    and hang it near the great Buddha in a monastery image-house so that good spirits
    who carry child-souls may see the message.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children are described as rewards for the parents' merit in previous existences,
    while childlessness is treated as a sign of deficient past merit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A story told to children says that a forsaken lost child called for his father
    until he died and became the paw-we bird.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that infanticide is practically unknown, adopted children
    become fully part of the family, and illegitimate children are not reproached
    for their birth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A mother interprets her own health, pain, sickness, or fever before birth
    as evidence of the baby's behavior or location in previous existences.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A newborn is patted, slapped, sprinkled with cold water, and, if still silent,
    held upside down and shaken in order to make him cry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After crying, the baby receives a first bath from a grandmother or wise woman,
    is dried, has his stomach bound with cloth, and receives a scarf or cap on his
    head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some caps are decorated with silver images and a silver basket for good luck;
    a large needle is attached in front to frighten bad spirits away.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before the first drink, the mother chews a peppercorn and rubs the baby's
    mouth with her saliva; afterward the baby is fed when he cries and may also be
    given rice pap.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A fire is lit near the mother after birth and kept burning for nearly a month
    to drive out bad humours.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother is described as resting for about thirty days, not cooking because
    she is considered unclean, while another woman cooks for husband and wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage explicitly says Shan postpartum 'roasting' is less intense than
    that of Burman women.
  category: relationship
  evidence_refs:
  - ev:7
