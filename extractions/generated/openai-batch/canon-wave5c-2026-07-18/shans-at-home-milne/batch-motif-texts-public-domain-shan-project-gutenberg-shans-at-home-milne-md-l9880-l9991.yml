canonical_text:
  quote: ''
  summary: A youngest sister saves her newborn son by deceiving her sisters with hidden
    portions of their own slain children. The baby, an embryo Buddha, is fed and protected
    by birds, holy men, and Sakya, then rapidly becomes a beautiful youth. Using a
    magic game-piece, he wins against village boys, the King, and ministers, requesting
    food and water for twelve women instead of money. An ogress Queen, fearing he
    is the hidden son, sends him with a letter ordering his death and consumption,
    but a holy hermit reads and replaces it with a letter ordering his marriage and
    honor. In the ogre country, the ogres obey the new letter; the ogre King gives
    him his daughter, transforms the court's appearance through a magic pool, and
    grants him the throne for seven days. A twelve-part palace garden is introduced
    at the end of the passage.
  language: English
  quote_policy: summarized
