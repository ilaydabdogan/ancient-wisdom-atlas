  summary: The passage describes young Shan children's household tasks, water-carrying,
    family accompaniment to monastery offerings, children's turbans including svastika
    designs, reverent etiquette before sacred images and monks, and an upper-tooth-loss
    custom in which the tooth is thrown onto the roof while asking mice to exchange
