  quote: ''
  summary: The passage introduces the book's aim to depict people in the Northern
    Shan States and describes the author's visits, travel routes from Bhamo to Namkham,
    pack animals, forest and river-crossing hazards, lodging arrangements, and the
    start of building a bamboo house near Namkham.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the book is intended as a series of pictures of people
    in the Northern Shan States as they appear in daily life, not as a full scientific
    description.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author first visited the Northern Shan States in 1906, later lived in
    Namkham, and says the chief object was to study the language of people known as
    Palaungs or Pales.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Palaungs or Pales are described as people from hill homes who descend
    to trade with Shans of the valleys and are said not to be allied with them in
    race or language.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Namkham is described as reachable by several routes, with the easiest route
    from Bhamo on the Irrawady River and a journey of about fifty-eight miles by bridle-path.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pack-ponies, mules, and elephants are described as means of carrying baggage
    from Bhamo to Namkham, with the elephant presented as advantageous for load carrying
    and photography.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author recounts riding a mule when stampeding oxen approached; the mule
    turned and fled down the path until an open space in the jungle was reached.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mimosa branches along the forest path are described as soft-looking but armed
    with sharp thorns that can scratch riders and tear clothes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The route from Bhamo is described as passing through rice-fields, banana and
    bamboo groves, thick forest, high ridges, views of mountains, ravines, Pankham
    village, and a military police station.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the Shwe-li River, ponies, mules, and cattle are made to swim across, ferry-boats
    carry passengers and luggage, and a loaded elephant can walk across if the river
    is not in flood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bungalows on the way to Namkham provide simple furnishings and some purchasable
    provisions, while travelers must carry items such as bedding, towels, knives,
    forks, and spoons.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Namkham the author stayed near the chief monastery in a native rest-house
    where pigs slept under the floor, then arranged for a bamboo house to be built.
  category: sequence
  evidence_refs:
  - ev:9
