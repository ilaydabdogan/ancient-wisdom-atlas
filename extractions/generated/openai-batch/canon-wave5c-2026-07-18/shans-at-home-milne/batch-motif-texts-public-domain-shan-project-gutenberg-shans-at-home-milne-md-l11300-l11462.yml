canonical_text:
  quote: ''
  summary: A queen of Kaw-sam-pi is carried away by a great bird after it mistakes
    her red satin covering for meat. Her son U-tain is born in a tree, rescued with
    his mother by hermits, later receives a magical twelve-stringed harp and royal
    tokens, and is recognized as king. His harp affects animals, humans, and spirits.
    A distant king uses a hollow wooden elephant to lure and capture him in order
    to obtain the harp. U-tain claims the harp requires a charm and is made to teach
    the king’s daughter behind a curtain. After discovering each other, U-tain and
    the princess fall in love and flee on an elephant, delaying pursuers with gold,
    silver, and gems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The queen is ill on the palace veranda, covered by bright red satin, when
    a great bird mistakes the satin for meat and carries her away in its claws.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird carries the queen many miles to a tree, where her son is born among
    the branches; after the baby cries, the bird has compassion and leaves mother
    and child there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two hermits hear the baby crying, see the queen holding the child in the tree,
    climb up, and bring both down to the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child is named U-tain, meaning “season of mist,” and grows up strong and
    brave in the jungle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A hermit says he learned from the stars that the king of Kaw-sam-pi is dead,
    and the queen identifies that king as her husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hermit gives U-tain a twelve-stringed harp, while the queen gives him
