canonical_text:
  quote: ''
  summary: 'The passage describes textile preparation and weaving equipment: posts
    are set outdoors for stretching thread from bobbins, the stretched thread is moved
    to a loom, heavy looms are kept beneath the living rooms where women work, and
    wooden or seed treadles are pierced, suspended by cords, and positioned under
    the foot during weaving.'
  language: English
  quote_policy: summarized
