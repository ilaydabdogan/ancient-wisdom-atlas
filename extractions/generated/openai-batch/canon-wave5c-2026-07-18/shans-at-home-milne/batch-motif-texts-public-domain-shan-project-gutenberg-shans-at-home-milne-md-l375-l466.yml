  summary: The narrator recounts a muddy travel mishap involving a buffalo and leeches,
    then describes Shan and Buddhist responses to English sweets, biscuits, conversation
    lozenges, and cameras. The passage continues with practical notes on photographic
    equipment and developing negatives while traveling, acknowledgments to helpers
    and translators, and thanks to the Shans for kindness during the narrator's stay
    at Namkham.
