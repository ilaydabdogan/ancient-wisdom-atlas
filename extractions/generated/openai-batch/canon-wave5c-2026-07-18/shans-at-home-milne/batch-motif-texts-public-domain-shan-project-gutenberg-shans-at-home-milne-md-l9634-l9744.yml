canonical_text:
  quote: ''
  summary: A chief forgets offerings to village and jungle spirits. The spirits consult
    a great crocodile who controls springs and clouds, and drought follows. A soothsayer
    identifies the crocodile as the cause and wounds it; the crocodile asks a hunter
    for help and promises reward. The hunter kills the returning soothsayer. Later
    seven fairies from a silver mountain in heaven descend to bathe in the lake. With
    the crocodile’s jewel rope, the hunter captures them and insists on taking the
    youngest. The youngest fairy is unhappy in the human world, is tied to a house-post,
    emits bright light, refuses food and water, and is eventually given to the king’s
    son, whose love causes her to forget her sisters and heavenly home.
  language: English
  quote_policy: summarized
