canonical_text:
  quote: ''
  summary: 'The passage describes Shan funeral practices: the unburied dead are watched
    day and night; mourners recount good deeds; guests feast; gifts are brought and
    later given to monasteries in the name of the dead so that merit may benefit the
    spirit in the next life. It details funeral presents, bright decorations, movement
    of the coffin from the house to the bier, processional roles of women, men, and
    monks, child and orphan funerals, and a truncated note on a custom for an unmarried
    young girl''s coffin or bier to be knocked against a tree on the way to burial.'
  language: English
  quote_policy: summarized
