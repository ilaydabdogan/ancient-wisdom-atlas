canonical_text:
  quote: ''
  summary: The passage describes embroidered memorial streamers on bamboo poles near
    Buddhist temples and monasteries. Designs may show pagodas, birds, and a boat
    crossing a river. The streamers and poles are raised in memory of the dead, with
    fruit and rice baskets attached. Participants kneel while an old man recites on
    the uncertainty and transitoriness of life. After the festival, the poles and
    cloth strips may be reused because their memorial purpose has been fulfilled.
  language: English
