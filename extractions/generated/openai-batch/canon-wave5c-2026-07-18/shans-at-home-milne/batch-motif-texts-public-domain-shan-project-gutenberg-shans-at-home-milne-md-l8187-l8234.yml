canonical_text:
  quote: ''
  summary: 'The passage describes several Shan legal and ritual practices: former
    murder fines, capital punishment carried out by multiple executioners who share
    the sin of killing, executioners tasting victims'' blood to avoid illness and
    death, soldiers biting bodies of enemies killed in battle, hunters eating raw
    portions of animals and offering blood to a spirit in a gun, and trials by ordeal
    in which candidates immerse their heads in water to reveal guilt or determine
    merit.'
  language: English
  quote_policy: summarized
literal_observations:
