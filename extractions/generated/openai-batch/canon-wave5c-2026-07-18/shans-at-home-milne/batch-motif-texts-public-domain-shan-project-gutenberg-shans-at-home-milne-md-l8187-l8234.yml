  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In capital punishment, more than one executioner assisted, and each tried
    to avoid giving the fatal blow so that the sin of killing would be distributed
    among several people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The condemned person was killed by repeated sword cuts, none individually
    sufficient to kill, and died from blood loss rather than one fatal blow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Executioners tasted the blood of their victims because they believed that
    failing to do so would soon bring illness and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In remote times, Shan soldiers bit the bodies of men they had killed in battle;
