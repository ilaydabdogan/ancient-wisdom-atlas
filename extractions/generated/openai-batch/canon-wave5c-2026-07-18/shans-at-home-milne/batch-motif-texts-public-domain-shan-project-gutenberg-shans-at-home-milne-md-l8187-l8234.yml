  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among Shans, trials by ordeal were said to occur to reveal a culprit and also
    to determine the best man in a competition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a new monastery or pagoda was to be built and several capable aspirants
