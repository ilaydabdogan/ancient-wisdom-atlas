  text: The passage states that murders are seldom among Shans, who are described
    as slower to anger than Burmans and not easily excited in disputes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Formerly, a convicted murderer could pay a fine whose amount varied with the
