canonical_text:
  quote: ''
  summary: A prince recognizes signs in flowers and has a young fairy girl brought
    from an old gardener's house. Mai-pom-san-ta accuses the fairy of being a witch,
    and the prince orders her killed. Before dying, the fairy prays that her eyes
    become two green parrots; after her execution, the parrots reveal the earlier
    deception, the fairy's lotus rebirth, and how the prince can recover her when
    she descends from the sky to bathe. The prince follows their instructions, retrieves
    the fairy, orders Mai-pom-san-ta killed, marries the fairy, and later rules with
    her.
  language: English
  quote_policy: summarized
