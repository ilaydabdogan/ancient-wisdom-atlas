literal_observations:
- id: obs:1
  text: The first five numbers are counted on the left hand by doubling fingers one
    after another with the forefinger of the right hand; five is shown by closing
    the whole hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Shan beckons with palm downward and moving all fingers; he points with the
    whole hand or, if both hands are full, with protruded lips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Uneducated Shans use oblong tally-boards with different sizes and positions
    of notches for two-anna pieces, four-anna pieces, eight-anna pieces, and rupees.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Monks teach schoolboys that the world is one of four great flat islands and
    that a sacred mountain stands in the middle of the islands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sacred mountain’s foundations rest on an enormous fish that usually sleeps
    holding its tail in its mouth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the fish wakes, bites its tail, and shakes in pain, the mountain and
    islands tremble, producing great earthquakes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Small shocks are explained as knocking by little men who live below the earth’s
    crust in a dark home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Shans feel a slight shock, they run out, kneel, and answer the little
    men by calling that they are present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At about eleven or twelve, boys may leave home temporarily, dress as monks,
    live in the monastery, and follow strict fasting rules.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A monk rarely leaves the monastery alone; little disciples follow in a file
    arranged by height and carry yellow paper umbrellas or palm-leaf fans.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boys are normally expected to look at the boy ahead and not let their
    eyes wander.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Because saving life is considered meritorious, boys may break the procession
    line to rescue a piglet from dogs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Some pigs take refuge in monastery courts, where they live unmolested and
    have young.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Pigs in the monastery may not be sold because a buyer might kill them for
    pork; when too numerous, a village council arranges a pig-hunt to catch them.
  category: sequence
  evidence_refs:
  - ev:9
