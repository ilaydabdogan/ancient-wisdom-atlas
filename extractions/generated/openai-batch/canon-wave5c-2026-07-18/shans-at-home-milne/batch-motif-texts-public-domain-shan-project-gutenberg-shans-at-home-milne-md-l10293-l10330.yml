canonical_text:
  quote: ''
  summary: A husband, wife, and two sons are driven by famine to wander in the jungle,
    where the family becomes separated. The weary husband sleeps at the forest edge.
    In a kingless land, the people decide that two oxen drawing a cart will select
    their ruler by stopping beside a man. The oxen stop beside the sleeping husband,
    and the people ask him to become king. As king, he remains sorrowful about his
    lost family, summons the people to a great feast, finds his wife and children
    in the crowd, and is reunited with them. The family lives happily, and the two
    sons later rule provinces.
  language: English
  quote_policy: summarized
