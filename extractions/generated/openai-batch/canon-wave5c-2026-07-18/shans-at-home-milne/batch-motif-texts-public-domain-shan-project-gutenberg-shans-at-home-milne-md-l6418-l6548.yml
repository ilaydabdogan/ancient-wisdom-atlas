  summary: The passage describes quarrels over pork taboo, a Muslim informant's flood
    story explaining why pigs are avoided, Shan agreement and oath practices using
    water, weapons, burned writing, and swallowed ashes, and brief descriptions of
    Chinese-border Shan wells, bridges, village water, rice agriculture, and Kachin
    raids.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Shan girl may provoke a Mohammedan by swinging pork against his hand; the
    quarrel escalates with insults and then resolves with mutual acknowledgment of
    mistake and renewed friendship.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Mohammedan in the Shan States explains his objection to pigs by recounting
    a story about Noah, the flood, and pigs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the story, Noah builds a large boat to preserve himself, his family, and
    all animals from great waters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boat is closed against the flood, has only one roof window, becomes dark,
    stuffy, foul-smelling, and cannot be cleaned.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Noah prays, and pigs are sent or made in answer to clean the boat; the narrator
    says this explains why pigs are not touched or eaten and why they work as village
    sweepers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: One agreement custom, called “Drinking the water of faithfulness,” repeats
    a bargain over water stirred with a dagger or sword point; two men drink the water
    and call heaven and earth to witness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Another agreement custom writes an agreement, burns it, sprinkles the ashes
    on water, and has each man swallow half while pronouncing a self-curse for noncompliance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A common oath formula is a wish to become a beast in the next life if the
    oath is false or broken.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Some wells in a Shan village near the Chinese border have stone or brick wellheads,
    stucco ornament, and carved stone monsters as guardians.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some stone bridges are guarded by stone animals holding balls; larger bridges
    and wells may have tablets naming the builder.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: In wet weather, streams run down village streets, where ducks, geese, pigs,
    and babies swim, splash, and play in muddy water.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rice or paddy is described as the staple crop and major production of the
    Shan States, easily stored and exported.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Kachins descend from mountain villages to carry off paddy and cattle from
    valley Shans.
  category: action
  evidence_refs:
  - ev:13
