    characteristics, animals, precious substances, Chinese or Burman borrowings, older
    inhabitants, migrant settlers, legends, physical features, products, occupations,
    landmarks, or political dominance. One brief place-name legend explains Mong-nai,
    “Grandmother town,” by saying old grand-dames lived in a nearby cave.
