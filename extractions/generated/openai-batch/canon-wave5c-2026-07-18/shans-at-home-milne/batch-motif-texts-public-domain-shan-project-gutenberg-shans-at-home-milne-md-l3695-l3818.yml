literal_observations:
- id: obs:1
  text: Dreams of items or actions such as coins, running water, bathing, snake or
    dog bite, the moon, boiling rice, downstream movement, descent, eating meat or
    sour fruit, or wearing new clothes are described as bad omens; loss of a turban
    in a dream is called the worst omen.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dreaming of holding the moon in the hand is described as extremely fortunate,
    and dreaming that one's hair has become white is taken to mean long life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before a marriage is completed, remarkable dreams of the bride, bridegroom,
    and their relatives are narrated to a wise man for judgment as omens of happiness
    or bad fortune.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thursday and Saturday are described as unlucky days for marriage, and weddings
    do not take place during fasting months or on monthly fast days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After a propitious day is chosen, the parents of the young people invite friends
    to wedding feasts, and guests arrive on the evening before the ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the wedding day the betrothed man and maid bathe in running water near
    their respective homes and are not expected to see each other until the afternoon
    ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wedding takes place at the bride's home; the bridegroom's parents are
