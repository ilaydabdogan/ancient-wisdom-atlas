  quote: ''
  summary: 'The passage describes Shan marriage customs: interpretation of dreams
    and omens before marriage, selection of lucky days, invitations and feasting,
    ceremonial bathing in running water, wedding dress, gift rules, the bridegroom''s
    procession to the bride''s house, food offerings in even numbers, and the elders''
    threefold request that the bride be brought to her husband.'
  language: ''
