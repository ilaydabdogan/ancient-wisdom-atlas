canonical_text:
  quote: ''
  summary: The passage describes Shan ordeal tests using water, fire, heated substances,
    rice, lamps, and candles to determine victory, innocence, or guilt; social beliefs
    about witches, wizards, wise people, a Buddhist monk credited with finding lost
    things, and people accused of the evil eye; and the beginning of a Shan cosmogony
    in which an earlier world is destroyed after successive suns appear and their
    heat kills all living creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a diving endurance trial, the person who remains under water longest wins;
    in a guilt test, the first man to surface is thought to be the culprit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other ordeals involve thrusting a finger into boiling water, thrusting a finger
    into molten lead, or licking hot metal; endurance, healing, or the tongue returning
    to normal determines the result.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Guilt tests between two suspected men include throwing rice into separate
    pots of boiling water, comparing equal lamps, and comparing equal candles; cooking,
    burn duration, or early extinction identifies innocence or guilt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Witches and wizards are described as wise folk who study the stars, know occult
    and mysterious matters, advise people, tell fortunes, compound medicines, and
    also do ordinary work.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Buddhist monk is said by local people to have the power to find lost articles;
    one reported case concerns a lost horse that returned at the time he predicted.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wise men and women are respected unless they acquire a reputation for having
    the evil eye; such people are shunned and may be expelled by village neighbours.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: People banished for the evil eye may live on village outskirts, go where they
    are unknown, or take refuge in Christian mission houses; evictors say Christian
    spells must be stronger than the evil eye.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cosmogony account is attributed to a Shan wise man, with other notions
    supplied by the chief monk of Namkham and other Shans, then translated into English.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Shans are reported to believe that the present world is incalculably old
    and that, long before it was created, another world existed with people, beasts,
    birds, fish, rivers, seas, and one sun.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: After a second sun appeared, trees, grass, and green herbs became gold-colored.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A third sun produced enough heat that beasts and men died, while women remained
    alive because of greater blessings and merit as mothers of saints and Bodhisats.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A fourth sun then blazed in the heavens, all women died, and no creature was
    left alive on the earth.
  category: sequence
  evidence_refs:
  - ev:10
