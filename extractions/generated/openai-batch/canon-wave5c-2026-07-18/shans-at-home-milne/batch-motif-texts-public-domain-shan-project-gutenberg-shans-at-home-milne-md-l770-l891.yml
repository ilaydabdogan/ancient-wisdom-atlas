canonical_text:
  quote: ''
  summary: The passage recounts Ngai-Lao political relations with China, focusing
    on Koh-lo-feng and I-mou-sun. Koh-lo-feng receives Chinese favor and royal title,
    fights Tibetans and Chinese forces, forms alliances, and sets up an explanatory
    stone inscription. I-mou-sun later changes allegiance from Tibet to China after
    advice from a captured Chinese ex-magistrate, makes a treaty with copies placed
    in religious, ancestral, natural, and imperial locations, attacks the Tibetans,
    and receives an imperial patent and gold seal amid elaborate royal and military
    ceremony.
  language: English
  quote_policy: summarized
