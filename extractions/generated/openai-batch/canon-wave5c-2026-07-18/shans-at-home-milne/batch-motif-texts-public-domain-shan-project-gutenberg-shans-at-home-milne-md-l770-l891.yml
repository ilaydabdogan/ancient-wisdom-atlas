    meaning Lord Lu the Glorious.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Koh-lo-feng, favored by the Chinese, brought southern Ngai-Lao principalities
    under himself, defeated the Tibetans, and was given the title King of Yunnan by
    the Imperial Government.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After a neighboring Chinese prefect deceived him, Koh-lo-feng killed the prefect,
