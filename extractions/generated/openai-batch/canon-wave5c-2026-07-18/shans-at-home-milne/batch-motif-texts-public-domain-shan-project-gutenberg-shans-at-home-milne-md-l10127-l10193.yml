canonical_text:
  quote: ''
  summary: A king confines his only daughter so no man can marry her. Sakya descends
    from heaven carrying the soul of a baby boy destined after many reincarnations
    to become a great Buddha; after judging the king and queen unworthy, he gives
    the soul to the sleeping princess. When she is found pregnant and protests innocence,
    her father exiles her to the jungle, where animals aid her and she gives birth
    at a hermit's cave. The child grows strong in the jungle and later becomes king.
    A following fable tells of an ass who walks with a lion, denies knowing other
    donkeys, and is rebuked with a moral about forgetting poor brothers when rich.
  language: English
  quote_policy: summarized
