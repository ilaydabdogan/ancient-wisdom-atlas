canonical_text:
  quote: ''
  summary: The passage describes women making long streamers attached to bamboos and
    raised in remembrance of the dead, notes a debated connection with serpent worship
    and beneficent serpent or dragon figures in Shan stories, and recounts a Shan
    origin story in which a poor widow gives the Buddha a narrow cloth she made from
    cotton bought with her last small coins; the Buddha praises her gift as the greatest
    because she gave all she possessed.
