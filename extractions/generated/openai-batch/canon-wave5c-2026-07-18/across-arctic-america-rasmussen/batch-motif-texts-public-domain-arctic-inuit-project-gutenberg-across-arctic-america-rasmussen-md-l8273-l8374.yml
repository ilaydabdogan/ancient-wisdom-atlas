canonical_text:
  quote: ''
  summary: A speaker explains the importance of varied amulets, recounts becoming
    an angakoq through silence, darkness, dreams, visions, and flying spirits, and
    describes Sila as an unseen world-supporting power that communicates through weather,
    sea, sunlight, calm, and children’s warnings. The narrator then reflects on the
    approaching loss of Eskimo religion and on shared culture across a wide Arctic
    region. Later, on a New York skyscraper, Anarulunguaq interprets the stone city
    as human-made mountains and wonders whether humans may be greater than Nature
    or Sila, even imagining the scene as another life after sudden death.
  language: English
  quote_policy: summarized
