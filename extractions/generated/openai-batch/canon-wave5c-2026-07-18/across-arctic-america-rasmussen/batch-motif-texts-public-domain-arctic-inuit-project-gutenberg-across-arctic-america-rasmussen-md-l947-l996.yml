canonical_text:
  quote: ''
  summary: 'The passage first describes a woman''s dress, including loose sleeves
    for warmth during blizzards and a brass forehead ornament. It identifies the woman
    shown as Ataguvtaluk, a survivor of famine. A narrated recollection follows: travelers
    find a snow shelter, a rifle, a gnawed human head, and the woman inside. She says
    she has eaten her husband and children. The travelers regard her as unclean, make
    a separate shelter for her, try to feed her frozen caribou meat, and turn back
    to Igdlulik to bring her to her brother. The passage states that she later remains
    alive and is married to the hunter Igtussarssua.'
  language: English
  quote_policy: summarized
