canonical_text:
  quote: ''
  summary: The narrator’s party receives encouraging news about nighttime overland
    travel and caribou moving northward. The party’s main difficulty is finding other
    people; they are told that following the Great Kazan River far enough inland may
    bring them to the Harvaqtormiut and then the Padlermiut near Lake Yathkied/Hikoligjuaq.
    The passage says families are difficult to locate because they follow the moving
    caribou. The party decides not to spend time among the Qaernermiut near Baker
    Lake, described as having long dealings with whalers, and instead turns toward
    the unknown interior.
  language: English
