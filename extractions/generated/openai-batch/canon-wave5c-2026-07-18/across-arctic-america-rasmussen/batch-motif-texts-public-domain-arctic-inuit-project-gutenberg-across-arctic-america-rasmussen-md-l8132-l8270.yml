canonical_text:
  quote: ''
  summary: The passage opens Chapter XXVIII, "Sila," with an epigraph attributing
    true wisdom to solitude, suffering, and privation. The narrator describes his
    last morning in Nome before leaving by steamer, then recounts a visit from Najagneq,
    an angakoq from Nunivak Island. Najagneq is described as a feared wizard, former
    prisoner, and troubled adversary of both whites and some of his own people. The
    passage reports his story that ten white horses served as helping spirits and
    were sacrificed one by one to save his life. It also records his remarks on solitude,
    darkness, inherited names, and the soul or life-power called yutir.
  language: English
  quote_policy: summarized
