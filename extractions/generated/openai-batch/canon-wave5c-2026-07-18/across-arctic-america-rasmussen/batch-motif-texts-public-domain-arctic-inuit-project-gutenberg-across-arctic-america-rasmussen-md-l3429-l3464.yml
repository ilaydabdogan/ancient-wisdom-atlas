  summary: Two children left alone during a song festival take a hairless caribou
    skin and a firestone. Fearing people, they consider becoming various animals but
    reject each form because humans could catch or kill them. They choose to become
    thunder and lightning, go up into the sky, and the story explains thunder as one
    child rattling the dry skin and lightning as the other striking sparks from the
    stone.
