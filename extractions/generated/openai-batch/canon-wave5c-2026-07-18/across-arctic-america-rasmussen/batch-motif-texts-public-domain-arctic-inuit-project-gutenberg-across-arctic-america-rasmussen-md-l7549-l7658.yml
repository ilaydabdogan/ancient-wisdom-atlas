canonical_text:
  quote: ''
  summary: The narrator's party approaches Emmatown after ice and lack of shelter
    make another village unsuitable. They arrive under the Danish flag and are met
    by local traders, an interpreter, and the frontier guard Allayeff. At the police
    station the narrator explains his errand and lack of passport, but Allayeff says
    he cannot grant permission and will send him under escort to the Governor at Wahlen.
    The narrator is taken to a Tchukchi village, placed on a dog sledge, and transported
    across wet tundra while his papers are held by the Tchukchi driver. The driver
    uses a dog-harpoon or flying whip to urge the dogs. Later the narrator reflects
    anxiously on the journey and encounters another Tchukchi traveler who asks about
    trade goods.
  language: English
  quote_policy: summarized
