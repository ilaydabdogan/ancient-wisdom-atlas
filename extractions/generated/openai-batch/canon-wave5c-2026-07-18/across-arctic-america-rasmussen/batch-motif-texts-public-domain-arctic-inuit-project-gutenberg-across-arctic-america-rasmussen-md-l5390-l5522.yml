canonical_text:
  quote: ''
  summary: Orulo recounts episodes from her life, including her mother's remarriages,
    her own movement between households, a severe famine after her eldest son's birth,
    and a happy return to Baffin Land after marriage. She then describes the Tivajuk
    or Great Rejoicing, a festival game of changing wives involving a snow dance hut,
    two central snow blocks, masked comic dancers called Servants of Joy, selection
    of women by men, chanting, circling the lamp block, and comic masking actions.
    The passage ends as another festival, Qulungertut, is named but not yet described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orulo says her mother was remarried to a younger man, was cast off when he
    took another wife, then married Aupila.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aupila went to Pond's Inlet with Orulo's mother to look for white men and
    whalers, leaving Orulo behind with another household.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orulo says she was passed from one household to another because one household
    had too many mouths to feed, until Aua found her and took her away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Orulo says that after Aua took her away she was happy and had seven children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: When asked about the worst event she remembered, Orulo describes a famine
    that came just after her eldest son was born.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: During the famine, hunting failed and wolverines plundered depots of caribou
    meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Atta spent the two coldest winter months hunting seal, sleeping only at odd
    moments in shelters on the ice near breathing holes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Orulo says the group nearly starved because Atta obtained only two seals during
    that period.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When asked about her happiest memory, Orulo says it was her first return to
    Baffin Land after marriage, when she was welcomed by people who had known her
    before.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Orulo describes herself in that memory as having formerly been poor, fatherless,
    and passed from hand to hand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Orulo says her husband came to challenge a man to a song contest, and that
    there were great feasts and gatherings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Tivajuk is identified as the Great Rejoicing and as a game of changing
    wives.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'For the Tivajuk, a large empty snow hut is built for dancing with two snow
    blocks in the middle: a jumping block and a lamp block.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: Two men called Servants of Joy wear masks; one is dressed like a man and one
    like a woman.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Servants of Joy wear intentionally tight, ill-fitting clothes in order
    to look funny and make people laugh.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:16
  text: Men and women assemble in the dance hut and wait for the masked dancers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The masked dancers leap in carrying a dog whip and a stick, jump over the
    jumping block, and chase all the men out of the hut.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: The masked dancers are supposed to be dumb; they do not speak, but communicate
    with gestures and occasional loud gasps.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:19
  text: After ensuring no men remain hidden among the women, the masked dancers go
    outside, where a man whispers the name of the woman he wants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:20
  text: The masked dancers return to the hut and touch the named woman under the sole
    of the foot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:21
  text: The masked dancers lead the chosen woman outside and then bring her back with
    the man who asked for her; the women are not to know who asked until they get
    outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: The returning man and woman must look solemn and pretend not to notice the
