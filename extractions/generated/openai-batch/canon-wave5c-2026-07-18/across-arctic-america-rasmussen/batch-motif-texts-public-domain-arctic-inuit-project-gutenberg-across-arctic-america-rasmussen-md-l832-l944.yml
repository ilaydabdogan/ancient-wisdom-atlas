canonical_text:
  quote: ''
  summary: Takornaoq hosts the narrator and Bosun in her hut, presents an infant named
    after a mountain spirit, sings a welcome song, observes a utensil-separation rule
    connected with infant care, gives a caribou carcass for the guests' dogs, and
    recounts stories about a former wizard husband and about a woman who survived
    by eating her kin and was later heard as a disembodied voice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Takornaoq takes the narrator to her hut, which is described as clean, decent,
    and chilly until a blubber lamp is lit.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Takornaoq sits between Bosun and the narrator while meat is put on to boil
    and says she is now married to both of them, while her loved husband is away on
    a journey.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Takornaoq takes a tiny infant from her aniaut, places it in a hareskin bag,
    and explains that the child is named Qasitsoq after a mountain spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The infant is not Takornaoq's own child but one of twins born to Nagsuk; Takornaoq
    says she bought the child for a dog and a frying pan and complains that she received
    the poorer twin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Takornaoq says she is of the Igdlulik from Fury and Hecla Strait and expresses
    pride in that origin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Takornaoq welcomes the visitors with an improvised song saying the strangers
    make the lands around her dwelling fairer and bring greatness to her house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the song, dinner is served, but Takornaoq does not join the meal because
    women with infant children in her tribe keep their cooking utensils separate from
    those of others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Takornaoq opens a small storehouse and gives a whole caribou carcass for the
    visitors' dogs, saying it is what her husband would do if he were home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Quivapik, one of Takornaoq's former husbands, is described as a reputable
    wizard and fighter who survived harpoon wounds to the eye and thigh because he
    was a great wizard.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Quivapik is also described as skilled at finding lost property and as having
    his own method for catching fish.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: In a fishing anecdote, Quivapik takes Takornaoq's line, swallows it with hook
    included, pulls it out through his navel, and afterward she catches salmon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Takornaoq says she once met a woman who saved her life by eating her husband
    and children.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: During a journey, Takornaoq's husband dreams that a friend is being eaten
    by his own kin; two days later the travelers hear strange hovering sounds like
    voiceless words.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The hovering voice says it can no longer live among humankind because it has
