canonical_text:
  quote: ''
  summary: The passage describes a wizard or Angakoq visiting the Land of Day and
    returning to report what he has seen; explains the postmortem routes of souls
    to the Narrow Land and to Takanalukarnaluk under the sea; and gives an account
    of a ritual journey undertaken when hunting fails. In that journey the wizard
    invokes helping spirits, the earth opens, the household sings with eyes closed,
    and the wizard descends under earth and sea to the Mistress or Mother of the Sea.
    He overcomes barriers, declares himself living, appeases her anger by turning
    her and smoothing her hair, persuades her to release animals, and returns, after
    which people confess breaches of taboo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the wizard is away, guests may sing old songs while keeping their eyes
    closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Land of Day, souls leave houses through walls or roofs, greet the newcomer
    as if he were dead, and turn away when he says he is still flesh and blood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After staying in the Land of Day, the wizard returns to earth and tells his
    companions what he has seen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Souls of people who died of sickness in a house or tent must first go down
    to Takanalukarnaluk under the sea and do penance before later going to the Land
    of Day or staying in the Narrow Land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Narrow Land is described as a coast land with abundant sea creatures and
    much hunting.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: When hunting fails and meat is scarce, the Angakoq seeks the Mistress of the
    Sea and tries to persuade her to release creatures she is holding back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the journey, the wizard sits on bare snow or bare earth, meditates, invokes
    helping spirits, and calls out that the way is ready and opening; those present
    answer in chorus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the helping spirits arrive, the earth opens beneath the wizard, sometimes
    closing again before the way is finally open; a voice recedes underground as he
    travels toward the Mistress of the Sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: While the wizard is gone, people in the house sing spirit songs, keep their
    eyes closed, extinguish the lamps, and may hear sighing and breathing of dead
    souls; the wizard's removed clothes may come to life and fly overhead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A song reserved for elders says the people are without food and hunting returns,
    stretch forth their hands, and call on one below in a hollow place to come up
    and force a way through.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Great wizards descend under the earth to the sea; at Takanalukarnaluk's house
    a wall before the entrance signals hostility, and the wizard must break it down.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Takanalukarnaluk's house is like a human dwelling but roofless, and the woman
    by her lamp can watch human dwellings from it.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: A large dog lies across the passage, shows its teeth, growls, and may gnaw
    bones of a still-living human being; the wizard must push it aside and enter.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: A guardian of souls in purgatory tries to seize the wizard but lets him pass
    after he says he is still alive and is flesh and blood.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The Mother of the Sea is seated with her back to the lamp and animals, a sign
    of anger, and her loose hair covers her face; the wizard turns her by the shoulder
    and smooths her hair.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: The wizard tells the sea figure that those above can no longer help the seal
    up from the sea; she replies that human sins and wrongdoing bar the way.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: After the wizard persuades and appeases her, she drops the animals one by
    one on the floor, and they disappear into the sea as a sign of coming rich hunting
    and plenty.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:18
  text: When the wizard returns to earth, those in the house are required to confess
    any breach of taboo they have committed.
  category: action
  evidence_refs:
  - ev:17
