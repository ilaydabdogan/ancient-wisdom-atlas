canonical_text:
  quote: ''
  summary: The narrator travels with Qaqortingneq to a Netsilingmiut camp. A line
    of seal skulls is explained as a directional sign based on a belief that seals
    follow the orientation of the slain seals' snouts. At the camp, weapons and snow
    knives are set near huts to keep away evil spirits. A returning son greets his
    mother by kissing her bared breast. Women who have borne children circle the newcomers'
    sledges to bind undesirable spirit entities that may have accompanied the visitors.
    The village wizard Niaqunguaq enters in trance, reports that his helping spirits
    revealed a food taboo violation, and describes several helping spirits, including
    a lemming with a human face that can take several animal forms.
  language: English
  quote_policy: summarized
