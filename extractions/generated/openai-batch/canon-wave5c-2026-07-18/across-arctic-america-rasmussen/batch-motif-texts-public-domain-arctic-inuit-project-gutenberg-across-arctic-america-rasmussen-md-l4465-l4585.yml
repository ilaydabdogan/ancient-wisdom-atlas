canonical_text:
  quote: ''
  summary: The passage describes the narrator's reliance on Aua, Orulo, and other
    Inuit wizards as sources for beliefs and tales. It recounts Anarqaoq's visions
    of spirits and a staged fight with evil spirits, Unaleq's belief in helping spirits
    and a dream-linked successful seal hunt, and Ivaluartjuk's role as a teller of
    many folk tales. It ends by noting Canadian Eskimo tale themes with Greenland
    counterparts, including an origin theme in which women find children among bushes
    at the beginning of the world.
  language: English
  quote_policy: summarized
