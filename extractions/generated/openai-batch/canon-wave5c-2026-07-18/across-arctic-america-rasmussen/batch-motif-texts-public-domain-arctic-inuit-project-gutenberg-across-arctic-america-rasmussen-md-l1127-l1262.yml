  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On moving day, household goods, caribou skins, clothing, pots, dishes, and
    utensils are brought through the passages and loaded onto sledges.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before departure, Mrs. Kuvdlo crawls out from an opening at the back of Kuvdlo's
    house carrying the newborn infant and waits in front of the hut for Aua.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Aua bares the infant's head, places his lips close to the child's face, and
