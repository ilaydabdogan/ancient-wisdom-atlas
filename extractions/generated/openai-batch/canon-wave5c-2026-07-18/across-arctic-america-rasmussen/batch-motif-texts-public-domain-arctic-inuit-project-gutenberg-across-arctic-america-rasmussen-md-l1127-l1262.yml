canonical_text:
  quote: ''
  summary: The narrator is led by Orulo through Aua's large connected snow-house household,
    observes its architecture, occupants, hospitality, and preparations for a move
    to hunt walrus. Just before departure, Mrs. Kuvdlo brings out a newborn infant,
    and Aua performs a first-journey ceremony with a morning formula meant to bring
    the child luck. Later, while watching for walrus at the ice edge, Aua speaks of
    an ancestral belief that humans could temporarily be animals and tells of a bear
    hunting walrus in a human-like way.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orulo leads the narrator into a connected group of five arched snow huts,
    passages, and storehouses that house sixteen people and allow movement without
    exposure to weather.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The interior walls have icicles formed by thawing and are lit by blubber lamps;
    the narrator compares the appearance to a cave of stalactites and notes thick
    caribou skins spread inside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orulo and the narrator move from room to room, shaking hands with members
    of Aua's extended household, including sons, relatives, children, Kuvdlo, Kuvdlo's
    wife, and a newborn infant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aua is described as the unquestioned master of his house, while he and his
    wife address others with kindness, humor, and good cheer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The visitors receive hot tea and a cooked hare and settle among caribou skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Discussion of walrus hunting leads to a proposed move toward Cape Elizabeth,
