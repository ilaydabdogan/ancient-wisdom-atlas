canonical_text:
  quote: ''
  summary: 'The passage introduces Orulo, Atja''s wife, as a diligent household worker
    who sews, maintains the snow hut, tends the lamp, prepares food, and helps neighbors.
    In a first-person frame, she tells memories from childhood: her mother''s temporary
    separation after childbirth, her father''s illness while the family was isolated
    at a place called the Mountain, her sighting of figures later identified as evil
    trolls and interpreted by her father as a warning of death, her brother Sequsu''s
    fatal secrecy about seeing evil spirits, and the laying out of her father''s body
    according to age-based directional rules for the dead.'
  language: English
  quote_policy: summarized
