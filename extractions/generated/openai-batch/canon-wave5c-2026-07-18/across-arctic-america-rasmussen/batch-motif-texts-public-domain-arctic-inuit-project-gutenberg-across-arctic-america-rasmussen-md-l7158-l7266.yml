canonical_text:
  quote: ''
  summary: The passage describes King Island dance houses and masks, Nunivak-region
    customs involving spirit masks and animal-human transformation beliefs, birth
    and death feasts with gift-giving, and ceremonial construction and consecration
    of a kayak using fasting, tabu, new clothing, and a lamp flame to drive away evil
    spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Islanders are described as living on a barren rock in the Bering Strait
    and as holding fast to ancient festivals, stories, and songs despite conversion
    to Roman Catholicism.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King Islanders sometimes hold summer song festivals; they are described
    as famous for dancing, and their village has old grass-overgrown dance houses
    reached through an entrance tunnel and hung with tambourines and masks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Nunivak-region discussion, masks are said to have a strongly developed
    spirit element, and many masks represent seals, birds, or beasts of prey with
    human faces.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief in a very slight distinction between animals
    and humans and in the power of animals to take human form.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each mask type is credited with a particular power and is said to assist the
    augakoq in invoking helping spirits, which are described as mediators between
    life and the supernatural.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a child is born, the parents give a feast for people from the surrounding
    area; the mother gives gifts to old men and women, and the husband is expected
    to have stored costly furs, garments, weapons, and implements for distribution.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Birth is described as so great a blessing that a man may give away all he
    possesses at the birth feast.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Similar feasts are held for the dead to prepare the way for them and keep
    them happy in the world beyond; these ceremonies last a week, include daily rites,
    and involve costly gifts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A kayak is built with ceremony and special rites intended to ensure safety
    and good hunting, and it is generally renewed each year because entering a new
    hunting season with old gear is considered unpropitious.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: While building a kayak, a man does not enter the women's house, remains isolated
    in the dance house or men's workshop, works fasting until evening, and observes
    forms of tabu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After completion, the kayak is consecrated on the first fine calm day; the
    family appears in new clothes, while girls are described as considered unclean
    for this rite.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At dawn the kayak is placed on the ground with new implements arranged on
    it; the man walks in front holding a lighted lamp, everyone steps around the kayak,
    and the flame is said to scare away evil spirits.
  category: action
  evidence_refs:
  - ev:6
