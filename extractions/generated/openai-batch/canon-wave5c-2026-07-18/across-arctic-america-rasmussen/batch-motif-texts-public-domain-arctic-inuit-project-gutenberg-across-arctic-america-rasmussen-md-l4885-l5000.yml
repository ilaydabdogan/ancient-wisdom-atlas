literal_observations:
- id: obs:1
  text: All living creatures are described as having souls, and animals slain for
    food or use are said to be affected by how their bodies are treated after death
    and by the manner of killing.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says many small rules apply to hunting, cooking, making clothes,
    and similar activities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person's name is said to derive from a deceased person, carry the namesake's
    qualities, and connect the living person with earlier bearers of the same name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Namesake-spirits are said to aid and protect a person who follows rule and
    rite, but to become inimical after transgression.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The caribou soul is said to detest things connected with sea creatures, so
    sea-hunting implements are left behind during caribou hunting and caribou-hunting
    footwear must not be used for seal or walrus hunting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Caribou handling includes restrictions involving women's contact, dogs gnawing
    bones, and the placement of meat and tallow under a stone near the kill site as
    an offering to the soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Walrus, seal, and salmon are assigned distinct food rules; salmon are classed
    as land meat and must not be eaten on the same day as seal or walrus meat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Igdlulik is described as having especially strict taboo because the Mother
    of the Sea met her fate there; she is said to hate caribou because they were not
    of her creation.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Whale, seal, and walrus meat must not be eaten on the same day as caribou
    and must not be in the same hut at the same time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Certain animals, including whale, ribbon seal, and bear, are said to require
    propitiation after death, with work stoppages and carcass parts hung together
    with implements.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Birth observances include amulets or hair arrangement, no assistance at the
    actual birth, seclusion of the woman, postpartum residence restrictions, and food
    restrictions for a year.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Death observances include relatives attending the body while the soul is believed
    to remain, prohibitions on work and grooming, purification procedures, exposure
    of the body with loose stones or a snow shelter, and miniature implements placed
    beside the corpse for use on the other side.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A recognized form of suicide by hanging is described as requiring solitude
    in the house, prescribed methods, and a lamp left burning so the body can be noticed
    when someone enters.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Mourning restrictions include a woman being regarded as unclean for a year
    after losing a near relative and a man being forbidden for a year to drive or
    strike his own dogs after losing his wife.
  category: action
  evidence_refs:
  - ev:10
