canonical_text:
  quote: ''
  summary: At the opening of Chapter XII, the narrator describes leaving companions
    on an Arctic spring March morning for a long sledge journey homeward. The travelling
    party consists of the narrator, Miteq, and Anarulunguaq. Miteq is described as
    a young Thule man, skilled hunter, driver, and cheerful companion. Anarulunguaq
    is described as Miteq's cousin, once nearly killed as a fatherless child but saved
    by her little brother's intercession, and now beginning a journey that will make
    her a famous woman traveller of her tribe. The equipment includes two long Hudson
    Bay type sledges with dog teams and loads.
