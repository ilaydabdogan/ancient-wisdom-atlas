  summary: A song titled “Avane's Song” voices a speaker searching in vain for caribou
    in the hills and recalling former success as an archer-hunter. A prose note states
    that women generally do not sing their own songs unless invited by an angakoq,
    but a woman impelled by a spirit may step from the chorus and sing from her own
    inspiration; two women are named as spirit-favored in this way.
