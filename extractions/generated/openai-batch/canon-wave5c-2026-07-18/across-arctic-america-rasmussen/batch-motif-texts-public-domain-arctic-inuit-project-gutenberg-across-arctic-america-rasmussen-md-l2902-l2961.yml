canonical_text:
  quote: ''
  summary: 'The passage describes Caribou Eskimo subsistence and travel: caribou are
    the principal game, while fish, birds, and small animals are taken by other methods.
    It contrasts kayaks, arrows, and spears with firearms, noting that firearms disturb
    caribou routes and have contributed to famine. It also describes seasonal travel
    difficulties, frozen rivers and lakes enabling movement, and Akilineq as a meeting
    place for obtaining timber and trading among distant groups.'
