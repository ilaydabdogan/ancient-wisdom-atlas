candidate_motifs:
- id: motif:1
  label: Caribou arrival marks seasonal transition and abundance
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage explicitly connects the announced arrival of caribou with the
    end of winter, summer, and abundance after a hard winter.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: This is an ethnographic travel narrative; the passage does not present
    the event as mythic ritual or cosmology.
- id: motif:2
  label: Lookout scouts announce the life-sustaining migration
  taxonomy_refs: []
  basis: Two sledges are sent to a lookout to watch for the caribou advance and return
    with the announcement that sets the camp in motion.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage reports practical subsistence behavior; any wider motif classification
    should be reviewed.
- id: motif:3
  label: Encounter with strangers mediated by marvel, trade, and shared meal
  taxonomy_refs: []
  basis: The passage describes astonishment at cameras, trade negotiations, and a
    communal meal offered by the travelers.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: No sacred or mythological exchange is stated; the pattern is social and
    ethnographic.
- id: motif:4
  label: Gesture of friendship before entry into camp
  taxonomy_refs: []
  basis: The man on the hill stretches out both arms, and the narrator explains the
    gesture as a sign that he is a friend before the travelers proceed to the camp.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Only one gesture is described; no broader ceremonial context is given.
- id: motif:5
  label: Violent acquisition of a bride after refusal
  taxonomy_refs:
  - stolen_beloved
  basis: The reported story says Igjugarjuk was refused permission to marry the woman
    and then killed her family members until only she remained.
  evidence_refs:
