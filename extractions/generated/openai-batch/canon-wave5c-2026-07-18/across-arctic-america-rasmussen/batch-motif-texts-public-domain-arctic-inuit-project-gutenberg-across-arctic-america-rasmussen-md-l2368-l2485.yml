canonical_text:
  quote: ''
  summary: The passage describes an expedition encounter with inland Inuit groups
    near the Kazan River and Hikoligjuaq. A camp awaits the caribou migration, scouts
    announce the caribou’s arrival, and the community rejoices because it marks the
    end of winter and the coming of summer abundance. The travelers proceed through
    caribou-filled country, river ice, eddies, and abandoned camps until a man signals
    friendship and they reach a small Padlermiut camp. The narrator then introduces
    Igjugarjuk, head of the party, recounts a violent story about how he obtained
    his first wife, and describes his Canadian government appointment as a special
    constable, followed by a reciprocal exchange of papers that establishes trust.
  language: English
  quote_policy: summarized
