  quote: ''
  summary: The passage presents two brief songs, commentary on derision songs and
    harmful speech, an anecdote of a marital quarrel and a foster-son's fatal reaction
    to angry words, then a ritual in which Kinalik the woman angakoq invokes helping
    spirits and Sila to clear dangers before a journey. The narrator stands on untrodden
    snow before Sila, Kinalik prophesies safety and hunting success, and the party
    later travels over frozen Lake Hikoligjuaq to a valley with budding willow.
  language: English
