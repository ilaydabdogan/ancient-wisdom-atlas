canonical_text:
  quote: ''
  summary: The narrator's party stops at snow huts on western Repulse Bay, where an
    old former angakoq explains his conversion to Roman Catholicism, loss of helping
    spirits, baptism, and the name Majulasut given to his converted kin. The party
    then travels overland by dog sledge, meets Constable Packett of the Royal Canadian
    Mounted Police, and later halts at the icebound vessel Fort Chesterfield near
    Wager Bay, where they receive hospitality and visit a nearby Netsilik settlement.
  language: English
  quote_policy: summarized
