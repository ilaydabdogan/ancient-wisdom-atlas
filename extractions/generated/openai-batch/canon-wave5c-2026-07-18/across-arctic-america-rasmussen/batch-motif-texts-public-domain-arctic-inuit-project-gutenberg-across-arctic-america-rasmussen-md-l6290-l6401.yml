canonical_text:
  quote: ''
  summary: The passage describes practical reuse of tent skins as frozen sledge runners,
    trade routes for obtaining iron and wood, and a remembered encounter between local
    Eskimos and the John Ross Expedition. Avdlilugtoq first sees the unfamiliar ship
    while hunting seal and mistakes it for a great spirit. Local men deliberate, approach
    armed, hide behind ice, then meet the white men after both sides lay down weapons.
    The meeting becomes friendly, includes gifts and cooperation, and later the ship's
    remaining materials are saved or left behind and reused as tools, weapons, sledges,
    kayaks, and harpoons.
  language: English
  quote_policy: summarized
