canonical_text:
  quote: ''
  summary: The passage describes a spring journey near the Magnetic Pole to locate
    shifting camps, the use of tracks, snow huts, and seal-skull offerings to follow
    hunters, and an encounter with a camp. The narrator then explains his attempt
    to acquire protective amulets through trade, arguing that their power remains
    with the original owners. A girl later brings amulets worn on behalf of a future
    son, and the passage describes a practice of girls wearing amulets for hoped-for
    sons because long wearing is said to increase power.
  language: English
  quote_policy: summarized
