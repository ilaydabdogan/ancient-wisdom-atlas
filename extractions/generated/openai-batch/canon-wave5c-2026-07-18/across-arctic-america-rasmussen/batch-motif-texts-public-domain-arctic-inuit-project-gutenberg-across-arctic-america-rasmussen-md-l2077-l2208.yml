canonical_text:
  quote: ''
  summary: The narrator describes waking after a blizzard, realizing the party had
    nearly reached Chesterfield, entering the settlement, hearing a church bell, receiving
    hospitality from Hudson's Bay Company staff and Roman Catholic missionaries, learning
    of police travel difficulties and a murder investigation, then departing in spring
    thaw toward Baker Lake, where Birket-Smith is waiting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After camping hurriedly in a blizzard, the party wakes in fine weather and
    sees tangled sledge tracks among reefs, islets, pressure ridges, and fissures.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party starts toward Chesterfield and discovers, by entering its own tracks,
    that it had nearly reached the settlement the previous night before turning away
    in the wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dogs scent human dwellings, and the party reaches a ridge from which it
    sees the colony, including Hudson's Bay Company houses, a warehouse, snow huts,
    and Mounted Police barracks across a creek.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wooden church with a slender tower stands by a small lake, and its bell
    rings for service while people move toward the open doors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mr. Phillips receives the narrator hospitably, offers lodging, and places
    an empty house at the party's disposal; Anarulunguaq keeps house, and the party
    lives on walrus meat stores.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the Mounted Police barracks, only a corporal is present; Sergeant Douglas
    is away investigating a dual murder, and patrol reports describe difficult travel,
    dog-food shortage, and starving Eskimos.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Roman Catholic Mission is led by Father Turquetil and two younger Jesuit
    priests; they host the narrator, and Father Turquetil is described as learned,
    bilingual in Eskimo and Latin, long resident, and respected by natives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: On May 3 the party separates and departs; mild weather, moist snow, fresh
    meltwater, exposed vegetation, berries, and ptarmigan mark the journey toward
    Baker Lake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: On May 12 the party reaches the little island in Baker Lake where Birket-Smith
    has been waiting; the place is described as a Hudson's Bay Company outpost and
    trade center for Barren Grounds Eskimos.
  category: setting
  evidence_refs:
  - ev:6
