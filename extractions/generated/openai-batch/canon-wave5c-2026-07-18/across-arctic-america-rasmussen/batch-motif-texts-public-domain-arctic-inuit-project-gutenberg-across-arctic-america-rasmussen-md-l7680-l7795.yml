canonical_text:
  quote: ''
  summary: The narrator describes being refused permission to land at East Cape in
    Siberia, being taken by an English-speaking trader-interpreter to Government House,
    presenting expedition papers and scientific aims to Soviet officials, and being
    blocked by the absence of a Moscow passport amid broader political tensions. Despite
    the obstruction, the officials behave courteously and the Governor eventually
    asks whether the mud-covered traveler is hungry.
