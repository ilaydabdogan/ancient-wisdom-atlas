  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator comments that local summer footwear made of light caribou skin
    wears out quickly on swampy or rocky ground.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the Kunuag River the group builds a large fire and roasts fresh meat on
    flat stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a group of three tents, the travelers find people on the verge of starvation
    and share caribou meat with them in a feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the meal, the local people produce a gramophone and play jazz tunes,
    which they say comfort both empty and full stomachs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Later travel is delayed by partial breakup of winter ice, crushed kayaks,
