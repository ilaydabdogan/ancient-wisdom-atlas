  text: Igjugarjuk is preparing for a trip down to Baker Lake when a young man named
    Equmeq arrives from the south in charge of a canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The party divides its transport plan: Birket-Smith and Bangsted are to go
    with the canoe party, Igjugarjuk will take the rest, and Miteq and the narrator
    will travel by sledge.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Local people regard sledging as dangerous or impossible at this season.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sledge journey crosses soft, wet, uneven ground and swollen streams, causing
    detours and reduced rations for travelers and dogs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Igjugarjuk repeatedly waits for the delayed sledge travelers and gives directions
    for the next day’s route.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A canoe carrying guns, ammunition, cameras, diaries, and other valuables drifts
    away after the party fails to pull it far enough ashore while trying to protect
    meat from dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator and Igjugarjuk pursue the drifting canoe through water and loose
