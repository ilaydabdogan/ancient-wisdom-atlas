canonical_text:
  quote: ''
  summary: The narrator observes a Padlermiut party arriving by sledge, including
    an elderly woman respected for tabu knowledge and wisdom. He asks Igjugarjuk,
    reputed as an angakoq, about religion and folklore, but Igjugarjuk denies such
    knowledge. The next day Igjugarjuk shows the narrator the region around Lake Hikoligjuaq,
    describes settlements and caribou-hunting changes, and states a belief that forest
    trees are living beings that cannot speak but may whisper and groan at night in
    a language humans do not understand. The passage also describes spring thaw, birds,
    caribou, hunting relics, and animals responding to the season.
  language: English
  quote_policy: summarized
