canonical_text:
  quote: ''
  summary: The passage describes inland Eskimo travel, winter snow huts, spring tents,
    scarcity and abundance, and includes traditions about living tree-folk and a short
    afterlife account in which heaven is a country with star-holes, weather falls
    through them, and the souls of dead humans and animals live under Tapasum Inua,
    the Lord of Heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Forests by lake shores are rarely visited because trees are regarded as living
    beings, and a tradition says tree-folk will not allow humans among them for more
    than ten nights.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Long journeys are made with small dog teams; men and women can harness themselves
    to sledges, and the inland people use very long, narrow sledges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The winter dwelling described for the inland Eskimo is an unheated snow hut;
    light is supplied by a primitive tallow dip made of moss and caribou fat, and
    the hut is protected by snow against blizzards.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A kitchen space called the iga is connected to the living room by a passage;
    food is cooked there when fuel is available, but people may have to eat frozen
    meat for days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Water is obtained by building near a lake and keeping a hole open in the ice,
    protected by a small snow hut above it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In May, melting snow huts are replaced by large caribou-skin tents with a
    smoke hole and an indoor fireplace.
  category: sequence
  evidence_refs:
  - ev:6
