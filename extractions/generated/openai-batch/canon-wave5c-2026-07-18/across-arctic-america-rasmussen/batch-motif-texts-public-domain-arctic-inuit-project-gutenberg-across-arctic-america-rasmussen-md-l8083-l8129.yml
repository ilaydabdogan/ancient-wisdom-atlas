canonical_text:
  quote: It was like looking into the promised land that one was not fated to enter.
  summary: The narrator is escorted back to the Teddy Bear and required to leave.
    The ship lies off East Cape because of ice, allowing a view of Novoqaq, its whale-bone
    building materials, boats, and walrus on the ice. Local young men and children
    approach the ship and some come aboard, but the narrator cannot stay. After the
    expedition returns to Nome and ends, a telegram reports that permission to land
    at East Cape had been granted, arriving six weeks too late.
  language: English
  quote_policy: quoted
