canonical_text:
  quote: ''
  summary: The passage gives a native account in which a man harpoons a giant fish
    whose struggles form waters near Teller and Port Clarence; after being killed
    and abandoned, the fish turns to stone and becomes King Island, with a rock hole
    identified as the hole cut in its snout. A second account tells of a Qavjasamiut
    girl who runs away after being scolded, is carried to King Island on an ice floe,
    survives by magic, and becomes the island’s first human inhabitant before others
    arrive from the mainland. The passage then describes King Island’s steep, inhospitable
    terrain and cliffside houses on supports and ropes.
  language: English
