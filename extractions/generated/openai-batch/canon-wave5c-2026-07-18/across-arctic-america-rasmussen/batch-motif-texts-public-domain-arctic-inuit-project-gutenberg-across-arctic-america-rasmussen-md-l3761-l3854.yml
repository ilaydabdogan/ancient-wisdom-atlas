canonical_text:
  quote: ''
  summary: A traveling party meets an inland caribou hunter and then a village group.
    The inland people ask questions about the sea and marvel at the visitors' sea-crossing
    and mutually intelligible speech. On the route they find the body of a woman lost
    in a previous winter blizzard while following her husband, Atangagjuaq, who had
    set out seeking aid during famine. The body is left untouched. The party continues
    to camp, where mourning quickly gives way to laughter as the men try skis for
    the first time.
  language: English
  quote_policy: summarized
