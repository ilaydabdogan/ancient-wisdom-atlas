candidate_motifs:
- id: motif:1
  label: Arduous journey with helpers and dog team
  taxonomy_refs:
  - departure
  basis: The narrator describes setting out after the first year with one dog team
    and two Eskimo companions and stresses the endurance of the same dogs and companions.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: This is a non-mythic expedition memoir passage; the taxonomy reference
    is only a formal narrative fit for setting out on a difficult journey.
- id: motif:2
  label: Companions as co-workers in the outcome of a journey
  taxonomy_refs: []
  basis: The narrator calls companions co-authors in one sense and says the Eskimo
    assistants had a larger share in the trip's outcome than he can show.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The passage supports a collaboration pattern, but it is not presented
    as a traditional mythic motif.
- id: motif:3
  label: Origin and dispersal from one stock
  taxonomy_refs: []
  basis: The passage states that tribes broke off from one original stock and later
    spread across the Arctic, with movements eastward and westward.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: medium
  cautions: This is the author's ethnographic-historical theory, not a narrated myth.
- id: motif:4
  label: Land-to-sea cultural transformation
  taxonomy_refs: []
  basis: The author concludes that all Eskimos were originally land hunters and that
    some later turned to hunting sea-mammals, retaining old myths while adding water-related
    folklore.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives a comparative folklore claim but does not provide the
    actual myth narratives.
- id: motif:5
  label: Seasonal movement of game shapes human movement
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage describes wide ranges in following seasonal game movement and
    movement to the coast possibly connected with following caribou.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: low
  cautions: The evidence is ecological and historical rather than ritual or mythic;
    the taxonomy fit is tentative.
- id: motif:6
  label: Abundant coastal Golden Age
  taxonomy_refs: []
  basis: The passage describes the Bering region, with abundant sea-animals, as a
    Golden Age for coastal people.
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The phrase appears in the author's historical interpretation and may be
    metaphorical rather than a traditional age-of-abundance motif.
