  limitations: This is reported as the author's conclusion; the passage provides no
    detailed comparative examples beyond language intelligibility and general folklore
    resemblance.
- id: claim:3
  claim: The passage advances a theory that Eskimos and Indians were once of common
    root, even though present customs appear very different.
  claim_level: common_inheritance
  target: Eskimo and Indian cultures as described by the author
