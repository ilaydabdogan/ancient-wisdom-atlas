  evidence_refs:
  - ev:5
- id: obs:7
  text: Anarulunguaq is described as the first Eskimo woman to travel widely and as
    a medal recipient; after the first year the narrator traveled toward Nome with
    one dog team and two Eskimo companions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author says he is mostly omitting theories about Eskimo origins from the
    story, while briefly stating some conclusions from the research.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage describes Eskimos as scattered from Greenland to Siberia along
    the Arctic Circle, numbering about 33,000, ranging seasonally after game, and
    separated into tribes that the author believes broke from one original stock at
    least 1500 years earlier.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The narrator says his Greenland dialect allowed understanding with all tribes,
