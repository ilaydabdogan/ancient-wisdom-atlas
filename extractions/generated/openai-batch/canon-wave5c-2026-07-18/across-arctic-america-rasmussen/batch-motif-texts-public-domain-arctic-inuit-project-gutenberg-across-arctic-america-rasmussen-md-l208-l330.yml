    stock, implying inherited language and tradition despite long separation.
  claim_level: common_inheritance
  target: Widely scattered Eskimo tribal traditions from Greenland to Siberia
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
