candidate_motifs:
- id: motif:1
  label: exchange as condition for transferred power
  taxonomy_refs:
  - sacred_exchange
  basis: The passage states that an amulet's activity does not operate for another
    unless something is given in return; it also describes luck passing with a harpoon
    head and Aua paying Qeqertuanaq with lifelong support for charms.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage describes practical rules of transfer and payment; it does
    not name a formal doctrine of sacred exchange.
- id: motif:2
  label: animal soul or animal part confers efficacy
  taxonomy_refs: []
  basis: Amulets consist of parts of animals' bodies, and their virtue is said to
    lie in the soul of the creature represented; examples include the raven's claw
    and animal-sinew comparisons in charms.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage treats this as amulet and charm efficacy rather than as a
    full narrative episode.
- id: motif:3
  label: secret inherited words of power
  taxonomy_refs:
  - wisdom
  basis: Magic words are fragments of old songs, lose power if known to others, can
    be bought or bequeathed, and in Qeqertuanaq's family were handed down from earlier
    generations.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The available taxonomy ref 'wisdom' is broad; the passage specifically
    concerns restricted ritual speech rather than generalized wisdom.
- id: motif:4
  label: turning from dark toward day
  taxonomy_refs:
  - duality
  basis: Two charm formulas instruct the speaker not to walk or look toward the dark,
    but to walk or turn the glance toward the day.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The contrast is formulaic within charms; the passage does not elaborate
    a cosmology of darkness and day.
- id: motif:5
  label: healing ascent to a mountain
  taxonomy_refs:
  - ascent
  basis: The words to a sick child direct the child to go up into the mountain and
    say that health and life will be found from the mountain's top.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: This is a verbal charm image, not a narrated journey or enacted ascent.
- id: motif:6
  label: calling game through prayer or charm
  taxonomy_refs: []
  basis: A charm asks beasts of the sea and plain to come and place themselves before
    the hunter in the early morning.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: No explicit exchange with the animals is stated in this passage.
