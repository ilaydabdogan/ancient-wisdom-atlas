  quote: The virtue lies in the soul of the creature represented
  summary: The passage describes breach and confession within a code of observances,
    the angakoq's intervention against spiritual danger, animal-body amulets and transferred
    luck, secret magic words inherited or exchanged, and several charms for travel,
    sickness, bleeding, and calling game.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A breach of regulations is repaired by immediate confession to fellows in
    order to ward off evil consequences; where danger from spirits and supernatural
    powers remains, the angakoq intervenes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The observances are described as mainly negative, intended to avoid disaster
    rather than to create positive advantage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: To obtain advantage beyond ordinary security, a person turns to amulets, charms,
    or spells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Amulets are mainly portions of certain animals' bodies sewn into clothing,
    and their power is attributed to the soul of the represented creature conveyed
    by certain body parts.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Igdlulik people are said to use fewer amulets than Netsilik people, while
    sharing the same idea of their purpose and effect.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:6
  text: A woman with a newborn infant may use a raven's claw as a fastening on the
    amaut strap, with the expected effect of giving the child later strength and hunting
    success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An amulet's inherent activity is said not to operate for a new holder unless
    that holder has given something in return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A young hunter may receive a harpoon head from an aged veteran, and the former
    owner's luck is said to pass with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sleeve linings from a successful hunter were fitted successively to a lad's
    tunics and were said to bring him caribou-hunting luck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Magic words are said to lose efficacy if made known to others; they are fragments
    from old songs that may be bought or bequeathed and must be heard only by their
    intended user.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Aua learned charms from Qeqertuanaq, whose family had handed them down for
    generations; as payment, Aua undertook to feed and clothe her for life, and the
    charms had to be uttered in her name.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a charm to lighten heavy loads, the speaker stands by the fore end of the
    sledge, looks ahead, speaks with Qeqertuanaq's mouth, invokes strong leg sinews,
    and turns from darkness toward day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A sickness charm may be uttered by a well person early in the morning before
    others are awake, using a child's inner upper garment and the speaker's own hood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Words addressed to a sick child tell the child that the mother's breasts are
    full of milk and direct the child to suck, drink, and go up the mountain to find
    health and life.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: A charm to stop bleeding identifies the blood with the little sparrow's mother
    and with blood from a piece of wood, then commands it to dry up.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: A charm for calling game asks beasts of the sea and plain to come and place
    themselves before the hunter in the early morning.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The passage states that these charms are used sincerely as prayers addressed
    to powers of Nature.
  category: attribute
  evidence_refs:
  - ev:13
