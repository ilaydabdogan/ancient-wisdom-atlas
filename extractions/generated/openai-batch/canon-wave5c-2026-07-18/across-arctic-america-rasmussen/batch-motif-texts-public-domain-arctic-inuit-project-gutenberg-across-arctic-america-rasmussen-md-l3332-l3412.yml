canonical_text:
  quote: ''
  summary: The passage contains two short narrative items. In the first, a widowed
    snow bunting rejects an owl's marriage proposal, and the owl attacks and mocks
    her. In the second, a maiden who refuses suitors is abandoned on an island with
    a dog, bears dog-children, takes vengeance on her father through them, and sends
    the offspring away on magically transformed kamik soles; some become white men
    and others become the ItqigdKt/Indians.
  language: English
  quote_policy: summarized
