canonical_text:
  quote: ''
  summary: The passage describes Anarulunguaq as a Greenlandic woman accompanying
    the expedition, then recounts an encounter with two armed local men, a move through
    a blizzard to their snow huts, and conversations with Orpingalik, an angakoq.
    Orpingalik shares legends, exchanges magic songs or spells with the narrator,
    gives hunting invocations and prayers, and is described as a poet whose songs
    are central to his life; the passage also notes his wife's song about their outlaw
    son.
  language: English
  quote_policy: summarized
