canonical_text:
  quote: ''
  summary: A young woman named Kuseq gives the narrator a skin bag of amulets removed
    from her clothing and explains several animal-part charms and their intended effects.
    After receiving trade goods, other people bring amulets until the narrator has
    a large collection. The narrator describes recurring amulets made from parts of
    animals that are believed to convey attributes or skills. A local medicine man
    later asks for locks of the narrator's hair as powerful amulets against future
    trouble with spirits, and the narrator distributes some hair and cloth pieces.
  language: English, with OCR corruption in the supplied passage
  quote_policy: summarized
