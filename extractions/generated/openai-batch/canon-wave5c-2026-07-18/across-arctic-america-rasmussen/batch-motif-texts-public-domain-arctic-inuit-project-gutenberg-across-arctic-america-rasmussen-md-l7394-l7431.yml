  summary: The passage describes Alaskan Eskimo culture in relation to neighboring
    Arctic and Northwest Coast peoples, focusing on hunting adaptations, seal netting,
    sea hunting, possible origins of methods near the Bering Sea, former territorial
    limits, contact with Tlingit and other North-west Indians, and possible or asserted
    borrowing of legends, raven myths, masks, and festival ceremonial.
  language: ''
