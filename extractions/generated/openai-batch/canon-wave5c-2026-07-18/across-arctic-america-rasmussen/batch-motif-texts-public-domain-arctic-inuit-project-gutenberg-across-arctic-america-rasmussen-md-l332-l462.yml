canonical_text:
  quote: ''
  summary: The passage presents theories about Eskimo migration, the Tunit, continuity
    of spiritual culture among tribes, and a proposed comparison between Eskimos and
    Glacial or Stone Age peoples. It then describes the 1921 expedition from Copenhagen
    via Greenland to Thule and Danish Island, the building of winter quarters, encounters
    with undisturbed wildlife, and the discovery of old Eskimo cairns and hunting
    shelters before first contact with local Eskimos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A migration from west to east is proposed as an explanation for ruins of permanent
    winter houses along the Arctic Coast between Greenland and Alaska.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that present Eskimos do not build those permanent winter
    houses, while people known as the Tunit did; it also states that Greenlanders
    are considered the original Tunit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some tribes are said to have remained in older interior locations, which is
    offered as an explanation for finding aboriginal Eskimos in the Barren Grounds
    and for continuity of spiritual culture among tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The migration theory is attributed to Prof. H. P. Steensby, and the narrator
    says the expedition's researches supported it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A second theory traces Eskimos back at least 25,000 years to a Glacial Period
    population living under similar arctic conditions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says material remains of Glacial or Stone Age culture are exactly
