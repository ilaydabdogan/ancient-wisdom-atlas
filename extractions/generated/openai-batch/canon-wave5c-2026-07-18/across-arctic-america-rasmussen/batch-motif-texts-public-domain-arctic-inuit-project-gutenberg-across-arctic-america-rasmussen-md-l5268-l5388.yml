  summary: A narrator recalls family deaths, omens, mourning restrictions, dreams,
    magical cures, and hunting life. Deaths are linked to hidden encounters with evil
    beings, a sounding bone, a dream warning, violation of a one-year post-death restriction
    involving caribou sinews, failed magical healing after eating forbidden blubber,
    and a spider descending as an omen before news of drowned kayakers.
  language: English
  quote_policy: summarized
