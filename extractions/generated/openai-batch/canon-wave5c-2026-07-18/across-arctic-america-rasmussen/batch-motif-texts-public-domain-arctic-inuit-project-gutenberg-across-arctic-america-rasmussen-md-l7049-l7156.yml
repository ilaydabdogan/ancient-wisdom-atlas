canonical_text:
  quote: ''
  summary: The passage gives a posted property notice signed by Avlaqana, then describes
    King Islanders, their Catholic mission connections, schooling concerns, a rejected
    relocation proposal, material culture, communal cave storage of frozen meat, and
    a month-by-month account of seasonal activities named for ice, hunting, light,
    animals, streams, and trade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A notice states that all property on the island belongs to the Eskimo and
    forbids taking or disturbing anything under threat of arrest and prosecution.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avlaqana is named as Chief of King Island in connection with the notice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King Islanders are described as Catholic church-goers who visit the Catholic
    Mission station at Nome and send children to school where possible, though the
    island lacks a suitable school site.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Board of Education proposed moving the population to St. Lawrence Island
    with provisions and reindeer-related inducements, but no family agreed to leave
    the island rock they called home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The community is described as neat and orderly with boats, kayaks, harpoons,
    and other implements, and as usually maintaining a winter meat reserve.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A cave near the village is used as a shared frozen meat store; it is deep,
    dark, entered by a narrow passage, requires torches, and the stored meat is marked
    by owner.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The text says the islanders’ names for the months give an idea of their manner
    of life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: October and November are associated with thin ice, return from the mainland,
    house-ordering, hill-climbing, and hunting seals and walrus on the north shore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: December through February are associated with dancing and feasting during
    stormy dark days, the sun turning and light returning, and hunting young-heavy
    seals at breathing holes and open water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: March through May are associated with preparation, ice breaking adrift, kayaks
    and implements being readied or used again, walrus appearing, flowing streams,
    snow clearing, and the earth coming alive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: June through September are associated with light nights, abundant game, sleeping
    walrus, winter meat procurement, fledglings and seabirds, marmots, berries, reindeer
    antler velvet, buying reindeer skins, and selling carvings and curios at Nome.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
