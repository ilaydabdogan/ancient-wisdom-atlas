canonical_text:
  quote: ''
  summary: The passage begins with a song in which a mother reflects on shame, her
    child’s flight from human dwellings, a killing, departure, friends on the ice,
    and an image of the earth becoming like a pointed mountain peak. The narrative
    then describes Rasmussen’s party leaving QrpingaSk/Orpingalik’s people, receiving
    a farewell formula about traveling with evil spirits, retrieving cached food,
    meeting Igsivalitaq the outlaw and his wife, hearing Igsivalitaq’s account of
    a homicide, and continuing to Arviligjuarmiut territory. It also summarizes the
    land, population, resources, place-name Arviligjuaq, and local manufacture of
    tools, fire-making materials, lamps, and implements under conditions of scarce
    wood.
  language: English with some Inuktitut terms and phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the song, the speaker asks whether she should be ashamed of a child she
    once bore and carried in her ainaut after news came of his flight from the dwellings
    of men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song speaker says her shame would be because the child did not have a
    flawless, wise mother, and says gossip and ill repute will now teach and follow
    him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The song speaker envies people who have many friends behind them, beckoning
    on the ice after a merry farewell feast before starting out.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The song speaker recalls a winter departure from an island, warm air, thawing
    snow, news of killing and flight, and then says the earth became like a needle-pointed
    mountain peak while she trembled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: On April 5 the traveling party leaves QrpingaSk and his people, who shout
    a farewell formula translated as a wish that all may travel with evil spirits
    in their train.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The travelers had bought cached fish, seal meat, and caribou; they found the
    fish and needed Igsivalitaq, called the outlaw, to locate the remaining meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Orpingalik warned the travelers to approach Igsivalitaq carefully, they
    found his hut empty, followed fresh tracks, reassured him that they meant no harm,
    and were welcomed by him and his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Igsivalitaq tells the narrator the circumstances leading to his homicide;
    the narrator advises him not to flee or resist Mounted Police and tries to teach
    the sacredness of human life, but this is weakened by Igsivalitaq’s reports of
    white men’s conduct in the Great War.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Under Igsivalitaq’s guidance, the party fills its stores from the seal and
    caribou depot and drives to a snow-hut camp in the fjord.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Arviligjuaq, translated as the Land of the Great Whales, is said to derive
    from hill formations that look like whales from a distance, not from actual whales
    in the water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Arviligjuarmiut are described as related to the Netsilik group but territorially
    separate; that winter they numbered fifty-four people in three settlements.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Arviligjuarmiut describe their region as plentiful because caribou, musk
    ox, seal, and fish provide alternate sources of food through the year.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Arviligjuarmiut make knives from yellowish flint, obtain fire from iron
    pyrites or firestone, catch sparks on moss tinder soaked in blubber, and procure
    soapstone for lamps and cooking pots.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Because wood is scarce and driftwood does not reach the fjord, the people
    make long harpoon shafts and tent poles from joined horn pieces, and harpoon heads
    from hard bear bone.
  category: object
  evidence_refs:
  - ev:6
