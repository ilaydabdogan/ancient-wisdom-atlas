canonical_text:
  quote: ''
  summary: The passage recounts a Tchukchi account of how some Tchukchis moved from
    reindeer hunting or herding to the coast, encountered Eskimos on Diomede Island,
    learned sea-hunting techniques, made peace through trade offerings after conflict,
    and became neighboring peoples at East Cape. It then summarizes traditions about
    Eskimo migration from Alaska and Bering Sea islands into Asia, linguistic observations,
    and a contrast between Siberian and American Eskimo conditions.
  language: English
  quote_policy: summarized
