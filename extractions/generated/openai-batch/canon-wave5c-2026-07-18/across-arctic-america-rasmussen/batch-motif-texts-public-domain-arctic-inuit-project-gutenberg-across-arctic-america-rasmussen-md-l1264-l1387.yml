  quote: ''
  summary: 'The passage describes a walrus hunt and communal return to a warm snow
    house, then records Aua''s answers to questions about religious matters: the story
    of Takanaluk Arnaluk, the Mistress of the Sea; the two destinations of dead souls;
    the aurora as the ball game of happy souls; and a ritual by which powerful angakoqs
    rise to visit the People of Day.'
  language: English
  quote_policy: summarized
