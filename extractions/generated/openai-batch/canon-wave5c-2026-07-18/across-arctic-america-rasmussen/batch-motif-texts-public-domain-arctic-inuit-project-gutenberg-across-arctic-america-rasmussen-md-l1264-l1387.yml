  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: At death, a human soul leaves earth and goes either to the People of Day in
    heaven toward the dawn or to the People of the Narrow Land under the sea; both
    places have happiness and enough food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Land of Day receives people who have been drowned or murdered; its inhabitants
    play football with a walrus skull, and this game is identified with the northern
