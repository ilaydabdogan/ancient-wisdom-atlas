  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aua tells a story described as the story of the goddess of meat from the sea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the story, a girl refuses marriage offers until a petrel disguised as a
    handsome young man entices her away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The girl's father rescues her, but the petrel pursues and raises a storm;
