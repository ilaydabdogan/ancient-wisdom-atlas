canonical_text:
  quote: ''
  summary: The narrator is hosted for a meal at the Governor's house, observes Soviet
    legal and leader imagery in the dining room, and is told by the Chief of Police
    that he must leave Siberia the next day. With limited time, he visits Russian
    traders and local native inhabitants with an interpreter. The traders describe
    economic ruin under Soviet restrictions, while Wahlen is described as mostly yarrangs
    inhabited by people living from the sea, with Tchukchis and East Cape Eskimos
    said to retain pre-contact lifeways.
  language: English
  quote_policy: summarized
