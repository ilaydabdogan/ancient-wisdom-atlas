canonical_text:
  quote: They bought some seal meat and blubber, and gave a knife in payment.
  summary: The passage records an Inuit reminiscence of Mangak, Terqatsaq, and Qavdlut
    encountering three ill white men on the west coast of King William's Land, trading
    seal meat and blubber for a knife, hosting them briefly, and inferring through
    signs that their ship was left on the ice and that they intended to go south overland.
    The narrator then comments on named witnesses and the reliability of such remembered
    encounters, describes bow-and-arrow target shooting at snow figures and musk ox
    hunting, and introduces Uvdloriasugsuk, a village head who had shot his violent
    brother after villagers decided the brother must be killed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mangak, Terqatsaq, and Qavdlut were hunting seal on the west coast of King
    William's Land when they heard shouts and saw three white men on the shore beckoning
    to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The encounter took place in spring, when open water along the shore prevented
    the hunters from reaching the men until low water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three white men are described as very thin, sunken-cheeked, ill-looking,
    clothed as white men, without dogs, and pulling their sledges themselves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The white men bought seal meat and blubber with a knife, and there was rejoicing
    on both sides over the trade before the white men boiled and ate the food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The strangers spent a night at Mangak's tent and returned the next day to
    their own small white non-skin tent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the parties could not understand each other's speech, they used signs;
    the Inuit party inferred that the strangers had once been many, were now few,
    had left a ship on the ice, and intended to go south overland; afterwards they
    were not seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Iggiararjuk is said to have named people present in the camp, and the narrator
    states that such native traditions accord with official expedition reports; other
    remembered white visitors include John Rae in 1847 and 1854.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the last day, sports included bow-and-arrow target shooting at life-size
    figures made of snow; arrows could strike with killing force at 100 metres, but
    accurate shooting was limited to about 20 to 30 metres.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator says most men possessed firearms, yet a previous autumn musk
    ox hunt near Lake Simpson had been carried out exclusively with bow and arrow,
    bringing down twenty or thirty animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Uvdloriasugsuk visited from a northwestern camp; he had shot his own brother,
    who is described as violent and as having killed one man and wounded others, after
    fellow villagers decided the brother must be killed and deputed Uvdloriasugsuk
    as executioner.
  category: sequence
  evidence_refs:
  - ev:7
