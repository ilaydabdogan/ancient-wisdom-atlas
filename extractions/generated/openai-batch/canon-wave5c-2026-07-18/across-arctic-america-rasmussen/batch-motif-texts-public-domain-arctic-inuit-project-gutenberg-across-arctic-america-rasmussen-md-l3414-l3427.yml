canonical_text:
  quote: ''
  summary: In an old time when all birds were white, the raven and the loon draw patterns
    on each other's feathers. The loon dislikes the pattern made by the raven and
    spits over the raven, making it black, which explains why ravens are black. The
    angry raven beats the loon's legs so badly that the loon can hardly walk, explaining
    why the loon is awkward on land. A parenthetical note says there is a Greenland
    version of the tale.
