canonical_text:
  quote: ''
  summary: The narrator hears shots while traveling over ice, sees a sledging party
    ahead, and is approached by a runner with a harpoon. He drives toward the runner,
    embraces him in Eskimo fashion, and discovers that the man understands Greenland
    Eskimo. The runner, Papik, leads him to an Akilinermiut caravan of men, women,
    and children. The narrator connects them with Greenland stories of people from
    behind the Great Sea, describes their clothing and mutual intelligibility, explains
    the expedition’s study purposes, introduces companions, and joins the Akilinermiut
    in abandoning their autumn journey long enough to build snow huts and celebrate
    the meeting.
  language: English
  quote_policy: summarized
