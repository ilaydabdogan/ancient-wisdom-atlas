  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: In a time of famine at Igdlulik, before there were wizards, a man announced
    that he would go down to the Mother of the Sea for the good of all.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After hiding behind skins, the man was seen almost gone below ground, with
    only the soles of his feet visible.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The man went down to the Mother of the Sea and returned with her good will
    and a grant of game for hunters, ending the dearth of food.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Since that event, angakoqs are said to have learned hidden things, helped
    others, and possessed a sacred speech not used for common matters.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: A novice angakoq had to give possessions to his instructor; at Igdlulik this
    could be a tent pole with a gull's wing attached as a sign of wishing to learn
    to fly.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The novice had to confess breaches of tabu before undergoing further instruction.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: Behind a curtain with his instructor, the novice submitted to extraction of
    the soul from his eyes, heart, and vitals, so it could be brought into contact
    with future helping spirits.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: The final initiation took place far from human dwellings, because spirits
    were approached only in the great solitude.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:19
  text: Some novices were entered into the profession before birth; Aua's mother declared
