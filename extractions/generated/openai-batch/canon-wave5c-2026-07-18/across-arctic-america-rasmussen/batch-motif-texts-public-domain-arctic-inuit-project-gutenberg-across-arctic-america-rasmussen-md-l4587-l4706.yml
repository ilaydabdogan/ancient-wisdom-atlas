canonical_text:
  quote: ''
  summary: The passage lists several brief Inuit or Arctic tale themes, including
    the origin of day and night, raven and goose, an abused fatherless boy aided by
    the moon, wife-eating, an all-beast soul, sun and moon as fleeing sister and pursuing
    brother, and children shut in a mountain. It then gives Aua's account of the origin,
    initiation, powers, helpers, sacred speech, and duties of angakoqs, including
    a primordial descent to the Mother of the Sea to end famine and later shamanic
    initiation practices involving gifts, tabu confession, soul extraction, solitude,
    helping spirits, ecstatic light, and song.
  language: English
  quote_policy: summarized
