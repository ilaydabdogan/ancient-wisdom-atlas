canonical_text:
  quote: ''
  summary: The narrator describes receiving useful regional information from Captain
    Cleveland, arranging for Freuchen to travel to Wager Bay, attending a dance, and
    then gathering geographic and traditional knowledge from an elderly local man
    later identified as Ivaluartjuk. Ivaluartjuk draws a detailed coastline map and
    supplies place names. The narrator notes that several names match Greenlandic
    ones familiar to him and that local people already know Greenland folk tales,
    regarding them as their own legends. The passage ends with the party leaving,
    Freuchen going south, and the narrator and Bosun following old sledge tracks.
  language: English
