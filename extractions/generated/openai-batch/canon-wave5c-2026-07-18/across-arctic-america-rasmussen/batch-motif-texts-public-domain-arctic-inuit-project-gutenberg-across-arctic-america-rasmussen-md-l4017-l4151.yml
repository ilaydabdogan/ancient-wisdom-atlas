canonical_text:
  quote: ''
  summary: The narrator contrasts winter and summer life around Chesterfield Inlet,
    describing caribou-skin clothing, later adoption of trade-station clothing and
    canvas tents, reluctance among inland people to hunt sea mammals despite abundance,
    and a stated inherited rule against mixing sea hunting with land or caribou hunting.
    The passage then recounts the expedition's travel toward Danish Island, the hiring
    and description of John Ell, delays from ice, reunion with Freuchen, and Mathiassen's
    later return from Southampton Island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In severe winter cold, soft caribou-skin clothing from head to foot enabled
    men, women, and children to move outdoors in all kinds of weather when food was
    available.
