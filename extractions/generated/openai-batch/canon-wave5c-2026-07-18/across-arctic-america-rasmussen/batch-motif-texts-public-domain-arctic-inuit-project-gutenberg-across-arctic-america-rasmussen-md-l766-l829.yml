  quote: ''
  summary: The passage describes an old woman, Takornaoq, fishing through thick lake
    ice. A puppy alerts her to the nearby travelers, and she flees with the puppy
    until the narrator pulls her onto a moving sledge. The narrator then discovers
    a small infant carried inside her clothing. They travel to her village of three
    snow huts and are introduced to local figures, including Inernerunassuaq, an old
    angakoq or wizard with a magic belt, and members of his family.
