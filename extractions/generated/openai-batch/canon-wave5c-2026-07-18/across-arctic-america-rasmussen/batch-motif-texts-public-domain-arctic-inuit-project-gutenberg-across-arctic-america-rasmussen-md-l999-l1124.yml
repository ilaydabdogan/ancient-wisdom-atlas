  summary: The narrator returns to headquarters on Danish Island, plans work in the
    Barren Grounds, notes ruins explained by local people as connected with Tunit
    giants, assigns expedition tasks, travels for provisions and hunting, and meets
    Aua, identified as an aogakoq, who guides him to a snow-hut village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator returns to headquarters on Danish Island excited about a first
    reconnoitring expedition and hopes to learn about the life, origins, and migrations
    of Eskimo tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Barren Grounds are described as bare, untimbered, isolated land between
    Hudson Bay and the Arctic Coast, with ice-filled northern waters, forests, and
    limited navigation as barriers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near headquarters, the party finds old cairns and rough stone shelters described
    as built by Eskimos of earlier days for caribou hunting with bow and arrow.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Local people explain that the ruins originated with a mysterious race of giants
    called Tunit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The expedition divides work among named members, while the narrator is assigned
    to study inland Eskimos with special reference to the spiritual side of their
    culture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The party has pemmican and canned goods but needs fresh meat, so the narrator
    goes with Miteq and two local natives toward Cape Elizabeth to look for walrus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the journey, the travelers hunt caribou on the ice in extreme cold,
    and bare hands stick to cold steel guns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On January 27, after a long cold day, the travelers want shelter rather than
    building it themselves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A long sledge appears from the darkness with fifteen white dogs and six men,
    and a small bearded man greets the narrator and points inland to snow huts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The man who greets the narrator is identified as Aua, the aogakoq.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Aua observes the narrator’s tired dogs, invites the narrator to change to
    Aua’s sledge, and directs a young man to attend to the narrator’s team.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The group races to a village by a big lake, where snow huts with gut windows
    give off a warm glow and women come out to greet them.
  category: sequence
  evidence_refs:
  - ev:10
