canonical_text:
  quote: ''
  summary: The narrator describes unimpressive angakoq performances, then reports
    Aua's explanation of taboo through examples of storm-obstructed hunting, hunger
    and cold in a household, and sickness in his aged sister. Aua says customs arise
    from fear of elements, famine, sickness, dead souls, and spirits, and that ancestral
    taboos are obeyed to live in peace. The passage then summarizes taboos around
    killed animals, including propitiatory handling and a strict distinction between
    land game and sea animals, each associated with its own mother.
  language: English
  quote_policy: summarized
