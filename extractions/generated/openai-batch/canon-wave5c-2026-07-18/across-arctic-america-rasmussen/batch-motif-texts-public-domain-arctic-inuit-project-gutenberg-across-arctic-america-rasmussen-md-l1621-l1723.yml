  summary: The narrator describes a southward sledge journey, a blizzard delay at
    Cleveland's place, and a detailed explanation of ice-shoeing sledge runners. The
    passage explains cold-weather problems with iron runners, earlier organic runner
    materials, the use of peat paste and water to hold an ice coating, and a flour-dough
    substitute later fed to dogs. An inserted caption describes a girl from Repulse
    Bay wearing a large fur hood.
  language: English
