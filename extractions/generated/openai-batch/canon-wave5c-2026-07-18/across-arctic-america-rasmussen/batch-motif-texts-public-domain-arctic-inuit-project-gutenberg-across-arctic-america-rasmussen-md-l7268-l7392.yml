canonical_text:
  quote: ''
  summary: The passage describes a first-seal gratitude distribution and a month-long
    autumn ribbon-seal festival involving gendered separation, tabus, bathing, sacred
    song-making in darkness and silence, craft preparation, an angakoq's noose ordeal
    and prophecies, fire-and-sweat purification, an eight-day feast with preserved
    seal bladders, return of bladders to the sea, gift exchange, moral resolutions,
    and the beginning of winter hunting. It ends with a brief demographic note on
    Eskimo populations.
  language: English
  quote_policy: summarized
