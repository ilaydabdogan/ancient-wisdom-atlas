canonical_text:
  quote: ''
  summary: The passage describes winter expedition circumstances, ethnographical and
    archaeological study of Central Eskimo/Tunit culture, and excavations at the ancient
    settlement of Naujan. It records the site setting, semi-subterranean stone-turf-whalebone
    houses, artifact materials, pottery fragments, kayak stands, absence of European
    trade items, and tentative dating based on land-level change.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several expedition members remained at or near Danish Island for most of the
    winter; Freuchen returned from an attempted January journey with frostbite, and
    Birket-Smith and Bangsted stayed at headquarters to look after him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says his winter tasks were to complete study and comparison of
    ethnographical collections and to add materials from another visit to people around
    Lyon Inlet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that there are no written sources for early Eskimo history
    and that archaeological excavation must be used to learn about earlier life, housing,
    clothing, and hunting.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Naujan is described as lying on the northern shore of Repulse Bay, near a
    trading station, with a name meaning “the place of the young seamews.”
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ancient settlement of Naujan is placed in a valley south of a lake and
    near a bay opening toward the shore.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Present-day Eskimos in the region are said to use only snow huts in winter,
    while Naujan contained remains of a different house type.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Naujan houses were built of stone, turf, and whale bones, partly underground,
    and are described as more substantial and warm than contemporary snow huts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that features of the site indicated the land had once lain
    about ten metres lower than at the time of excavation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A pair of stone kayak stands was found on a nearby island about fifteen metres
    above the sea; the passage says they would originally have been built at the water’s
    edge.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The house remains had fallen apart and were weatherworn, overgrown with grass
    and moss, making their original appearance hard to determine.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Artifacts from the ruins included bone, walrus tusk, caribou antler, flint,
    slate, soapstone, whalebone, some wood, cold-hammered copper, and one meteoric-iron
    harpoon point.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Three broken fragments of rough earthenware vessels were considered among
    the most valuable finds, although outwardly they seemed insignificant.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that no objects suggesting intercourse with Europeans were
    found; it specifically notes the absence of glass beads and identifies the only
    iron fragment as meteoric.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: The author tentatively discusses the age of the Naujan material by combining
    the absence of European trade evidence with land-level change, while explicitly
    calling the numerical estimate guesswork.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
