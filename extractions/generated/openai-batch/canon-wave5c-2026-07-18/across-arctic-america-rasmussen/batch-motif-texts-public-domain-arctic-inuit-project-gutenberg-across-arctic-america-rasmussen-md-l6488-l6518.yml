canonical_text:
  quote: two men came running up out of the blizzard in front of the hut
  summary: 'During a blizzard near Pelly Bay, two brothers arrive at a hut without
    sledges or dogs, carrying only snow knives. After being warmed and fed, they explain
    that they are from near the Magnetic Pole and are traveling with fox skins to
    trade for old guns. The elder brother, Qaqortingneq, is returning, and the narrator
    decides to accompany him to visit his tribe. Qaqortingneq introduces the rest
    of his party: two wives and a foster son, each described in terms of prior material
    exchange.'
