canonical_text:
  quote: ''
  summary: The travelers follow sledge tracks to a snow-hut settlement, unexpectedly
    encounter a dark-skinned girl in the household, learn her father was a cook from
    an American whaler, receive generous food and assistance from the Netsilik household,
    collect folklore from Inugpasugssuk, depart toward Chesterfield, and are separated
    by a sudden blizzard.
  language: English
  quote_policy: summarized
