canonical_text:
  quote: ''
  summary: 'The narrator says he wanted to follow local law. An interlocutor objects
    that shops are empty and ammunition cannot be bought. The narrator recounts a
    recent story: an American trader, told through an Eskimo intermediary that Russian
    authorities allowed him to land and trade at East Cape, went there and bartered,
    but was seized for illicit trading. Cash on his vessel was confiscated, though
    he escaped with his ship. The intermediary then crossed to complain that he had
    been made part of a bad-faith plot and was fined for insulting the authorities.'
  language: English
  quote_policy: summarized
