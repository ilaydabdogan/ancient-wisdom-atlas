canonical_text:
  quote: all her dolls had come alive; had turned into real men and women.
  summary: 'The narrator is led by Peter Cossigan into a large Tchukchi yarrang, observes
    its structure, interior work areas, hearth, lamps, tools, and women’s daytime
    work, and notes that the implements resemble Eskimo types while the language is
    not intelligible to him. In a discussion about relations between Tchukchis and
    East Cape Eskimos, an old man claims the Tchukchis are original inhabitants and
    tells an origin story: a constantly scolded little girl runs away with her dolls,
    settles in an unknown land, and one night finds that the dolls have become real
    men and women, from whom the Tchukchis are said to descend.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Peter Cossigan, described as married to a Tchukchi woman, leads the narrator
    into a large yarrang that is half hut and half tent, with a domed wooden framework
    covered in walrus hide.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The front room contains a fireplace in the middle of the floor with walrus
    meat cooking; the room is smoky despite roof ventilation holes, and a woman kneels
    by the fire tending a pot.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the hut is a small reindeer-skin tent fastened to the framework; people
    crawl under its heavy winter-skin sides, and it encloses the area corresponding
    to a raised sleeping place in an Eskimo hut.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the inner apartment, a young woman prepares sealskin; the space is very
    hot, has two blubber lamps burning, and has a wooden floor covered with walrus
    hide layers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The inner apartment serves as a women’s workroom during the day and a family
    bedroom at night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator observes that visible implements, including knives, tools, and
    drums, are the same type as those he had found among Eskimos, while he understands
    none of the language.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cossigan informs the narrator that women are generally in houses during the
    day doing cooking and needlework, while men are outdoors or hunting; Cossigan’s
    wife makes tea for guests.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old man says his people are the original inhabitants of the country and
    have nothing to do with the Eskimos.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the old man’s story, a little girl lives among strange people and has a
    mother who is always displeased with her work and scolds her.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The little girl runs away from home, taking all her dolls with her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The girl walks far to an unknown land, builds a shelter from the wind, and
    decides to live there.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: One night the girl wakes and finds that her dolls have become alive and turned
    into real men and women; from them, the Tchukchis are said to have sprung.
  category: sequence
  evidence_refs:
  - ev:10
