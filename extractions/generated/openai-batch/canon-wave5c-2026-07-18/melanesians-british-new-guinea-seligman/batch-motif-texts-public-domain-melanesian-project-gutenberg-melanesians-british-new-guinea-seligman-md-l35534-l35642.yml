candidate_motifs:
- id: motif:1
  label: Disease and death produced by magical plant substances
  taxonomy_refs: []
  basis: 'Several methods use plants or plant mixtures to cause fatal illness: chewed
    gom shoots, plants in food, a plant on a lime spatula, and a pellet of ginger
    and leaves.'
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage sometimes leaves unclear whether the reported substances are
    pharmacological poisons, magic, or both.
- id: motif:2
  label: Invisible sorcerer projecting harmful substance
  taxonomy_refs: []
  basis: The Milne Bay sorcerer makes himself rogau, apparently invisible, and spits
    chewed gom toward the victim without requiring contact.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The gloss of rogau as invisible is presented cautiously by the narrator.
- id: motif:3
  label: Only the inflicter can cure the magical illness
  taxonomy_refs: []
  basis: Both the gom account and the Tubetube/Kitai account state that only the sorcerer
    who produced or inflicted the illness can cure or remove it.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The motif is reported for these local accounts only; no broader distribution
    is established by the passage.
- id: motif:4
  label: Fatal touch by concealed magical pellet
  taxonomy_refs: []
  basis: In the Kitai account, the sorcerer hides a pellet between his fingers and
    touches the victim under a pretext, after which fatal illness follows.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The account is attributed to an informant from Kitai.
- id: motif:5
  label: Projected autonomous sending from the body
  taxonomy_refs: []
  basis: At Bartle Bay, disease and death are often attributed to a 'sending' projected
    from the body of a sorcerer or witch and thought to have a separate life after
    death.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The exact nature of the 'sending' is described through reported belief,
    not direct observation.
- id: motif:6
  label: Female-bodied harmful or protective power
  taxonomy_refs: []
  basis: The sending is most commonly projected from a woman's body, labuni exist
    within women and can be commanded by women who have had children, and a woman's
    petticoat worn next to the skin is said to protect a man in battle.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The connection between the petticoat custom and female bodily power is
    explicitly proposed as probable by the narrator rather than stated as a direct
    native explanation.
- id: motif:7
  label: Inheritance or postmortem continuation of a magical entity
  taxonomy_refs: []
  basis: The sending may pass to a woman's daughter after her death or pass with her
    aru to other worlds.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not describe the later actions of the sending after transfer
    or travel to other worlds.
- id: motif:8
  label: Shadow-being leaves sleeping body and re-enters
  taxonomy_refs: []
  basis: At Gelaria, labuni are shadow-like, emerge while the woman appears normally
    asleep, and later re-enter the body per rectum.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The processes causing emergence are stated to be unknown to the informant.
- id: motif:9
  label: Protective garment empowered by bodily contact
  taxonomy_refs: []
  basis: A woman protects a man in battle by throwing over him the short petticoat
    worn nearest her skin, and the narrator links this protection to fear of witchcraft
    and power in the woman's body.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The explanation is partly interpretive within the passage.
comparison_claims:
- id: claim:1
  claim: The Milne Bay gom account and the Tubetube/Kitai pellet account share the
    functional pattern that the sorcerer who causes the illness is the only one able
    to cure or remove it.
  claim_level: same_function
  target: Local accounts of magically inflicted illness and exclusive cure by inflicter
  evidence_refs:
  - ev:3
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is a within-passage functional comparison only; it does not establish
    historical contact or a broader motif distribution.
- id: claim:2
  claim: 'The Gelaria labuni is presented as a local named form of the broader ''sending''
    pattern described for Bartle Bay: a shadow-like entity associated with women''s
    bodies and projected or emerging from them.'
  claim_level: same_motif
  target: Bartle Bay 'sending' and Gelaria labuni
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage links them terminologically as 'sending' and labuni, but
    the available excerpt ends before completing what labuni produce.
- id: claim:3
  claim: The petticoat protection custom is compared in the passage with the female
    bodily power associated with witchcraft or sending.
  claim_level: same_function
  target: Female bodily power in petticoat protection and in sending/labuni beliefs
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The connection is framed by the narrator as probable, not as a fully
    demonstrated equivalence.
