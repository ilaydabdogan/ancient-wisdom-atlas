canonical_text:
  quote: ''
  summary: Ethnographic account of several reported methods by which disease and death
    are believed to be produced or cured through magic in Milne Bay, Tubetube, Bartle
    Bay, and Gelaria. Methods include chewed plants and spells, poison-like substances
    in food or on objects, contact with a hidden pellet, and a projected female-associated
    'sending' called labuni.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Milne Bay, Barau is presented as a general term for disease-producing magic.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young shoots of a tree called gom are chewed with muttered spells and are
    believed to become capable of causing death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sorcerer using gom is said to make himself rogau, glossed by the narrator
    as apparently meaning invisible, and then spits the chewed shoots toward the victim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gom shoots do not need to touch the victim, though the sorcerer tries
    to come close before spitting them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The victim is said to become ill after two or three days, lie by the fire
    in his house, worsen, and die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Only the sorcerer who caused the illness can cure the stricken person, by
    chewing another root and spitting it on the victim while muttering spells.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ginger may be mixed with gom shoots to increase their deadly quality.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Other plants, when mixed with a man's food, are said to cause vomiting and
    purging ending in death in one or two days.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another plant rubbed on a man's lime spatula is said to cause swelling and
    ulceration of the tongue in someone using lime with it, ending in death from exhaustion
    and inanition.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Tubetube it is asserted that the island has no sorcerers or medicine men,
    but neighbouring Basilaki and Kitai are said to have many.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tubetube deaths are said to be almost all due to magic of Basilaki people
    or other strangers, and a Basilaki man may be asked to help a sick person.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Kitai account, a sorcerer drinks salt water until purged, prepares
    a pounded mixture of ginger and leaves from two trees, and hides a pellet between
    his index and middle finger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Kitai sorcerer touches the victim with the hidden pellet under some pretext,
    after which the victim becomes feverish, feels cold, lies near a fire, sleeps,
    becomes comatose, and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: If the responsible sorcerer is identified, the sick person's friends may bribe
    him to heal the sick person; only the sorcerer who inflicted the disease can remove
    it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Tubetube term for a sorcerer or medicine man is given as gwanewa.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: At Bartle Bay, a frequent method of causing disease and death is described
    as a 'sending' projected from the body of a sorcerer or witch.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The 'sending' is said to lead a separate life after the death of the individuals
    in whom it is normally immanent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: The 'sending' is most commonly projected from a woman's body and after her
    death may pass to her daughter or, with her spirit or shade called aru, pass to
    the other worlds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: A woman is said to be able to save a man struck down in battle by throwing
    over him the short petticoat worn next to her skin.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The narrator connects the protective petticoat custom with fear of witchcraft
    and with power believed to reside in the woman's body.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:21
  text: At Gelaria, the 'sending' is called labuni; labuni exist within women and
    can be commanded by any woman who has had children.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:22
  text: The labuni is described as resembling a shadow and emerging from a woman who
    appears to be sleeping normally.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:23
  text: The labuni is said to exist in, or derive from, an organ called ipona in the
    flank, whose literal meaning is egg or eggs.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:24
  text: The labuni is said to leave the body and later re-enter it per rectum.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:25
  text: Labuni are described as shadow-like beings that wear a shorter petticoat than
    local women wear.
  category: attribute
  evidence_refs:
  - ev:11
