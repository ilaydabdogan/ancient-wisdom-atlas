canonical_text:
  quote: ''
  summary: 'The passage describes the fourth-day venedairi feast after burial: nightly
    grave fires, preparation and distribution of food, blackening and shaving of the
    widow, breaking and wearing of the dead man''s personal objects and hair in a
    mourning collar, the widow''s mourning costume and restrictions, food abstentions
    until the later ita feast, and food brought to the bisa and marked by hanging
    plant or animal remains.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fourth-day post-burial feast is named venedairi, with a Motu equivalent
    given as lahidaili; the later feast is named ita, with a Motu equivalent given
    as turia.
  category: other
  evidence_refs:
  - ev:11
- id: obs:2
  text: Until the fourth-day feast, fires were lit nightly on the grave as people
    gathered there; the dead man's wife and nearest relatives formerly slept around
    the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dead man's clansmen collected and cooked a large quantity of food and
    deposited it in front of the deceased's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Much of the food was given to the grave diggers, corpse carriers, and other
    helpers in the death ceremonies; the remainder was eaten by other men present.
  category: relationship
  evidence_refs:
