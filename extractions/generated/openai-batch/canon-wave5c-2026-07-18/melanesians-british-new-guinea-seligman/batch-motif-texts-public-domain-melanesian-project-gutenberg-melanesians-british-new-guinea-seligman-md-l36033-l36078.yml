canonical_text:
  quote: ''
  summary: 'The passage notes a referenced Taupota bariaua/modewa tree legend and
    glosses banaua as unusual, spiritual, or supernatural. It then lists Bartle Bay
    non-human beings believed to exist: Badabada, Yagarua, Taudombi, and Yoyo, describing
    their forms, habitats, and actions. It closes by reporting no cannibal beings
    except story ogres and no special garden or fertility spirits discovered by the
    author.'
