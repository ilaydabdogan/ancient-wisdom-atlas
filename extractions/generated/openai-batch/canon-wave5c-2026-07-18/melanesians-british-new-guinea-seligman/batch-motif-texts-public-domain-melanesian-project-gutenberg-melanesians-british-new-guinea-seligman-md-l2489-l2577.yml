canonical_text:
  quote: ''
  summary: The passage is an ethnographic introductory section. It describes physical
    measurements and migration inferences for people of Oroi and Diumana; reports
    Kabadi-Roro clubhouse resemblances; and emphasizes ceremonial right-left organization,
    especially the right front post of the dubu or clubhouse, among several Central
    District groups. It also notes geometric decorative designs, a Mekeo exception,
    an Elema parallel for right-left man-house division, and introduces hinterland
    hill and mountain groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author describes comparatively light-skinned and often wavy-haired people
    and identifies them as likely descendants of an immigrant stock, despite their
    own belief that they were inland people forced toward the coast.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Measurements are reported for 25 adult natives of Oroi and Diumana villages,
    including cephalic, nasal, and facial indices, height, skin color, and eye shape
    observations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dr Strong is cited as reporting that Kabadi clubhouses resemble Roro clubhouses
    in general features; Kabadi village, itsubu, and clubhouse names are said to show
    a strong Roro element.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Two distinguishing features are named for the group: greater ceremonial importance
    of the right side over the left, and predominance of geometrical designs in decorative
    art.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Clan chiefs of named tribes are responsible for the upkeep of the right front
    corner post of the dubu or clubhouse; the hereditary owner of that post is described
    as the hereditary clan chief.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Roro, the regular title for the clan chief is translated as 'chief
    of the right,' while the assistant is translated as 'chief of the left.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Clans of several Central District tribes are said to be divided into right
    and left halves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Sinaugolo, each kavi possesses two big corner posts and a big carved
    horizontal on one side of the dubu; the two kavi are said to belong on opposite
    sides of the village street and to be referred to by right and left terms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If one kavi became much weakened, the stronger kavi would assist it in hunting,
    fishing, and building.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author states that this chieftainship associated with right and left sides
    of the dubu or clubhouse is not found in Mekeo, as far as he knows.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: A footnote reports that Elema clan man-houses are divided into right and left
    halves, with men sleeping and eating on their own sides; the author uses this
    to caution that side division should not be regarded as essentially Melanesian.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The next group introduced is summarized as hill and mountain men of the hinterland,
    mostly or perhaps entirely speaking Papuan languages, but not matching the stature
    or bulky physique of certain named Papuan groups.
  category: attribute
  evidence_refs:
  - ev:7
