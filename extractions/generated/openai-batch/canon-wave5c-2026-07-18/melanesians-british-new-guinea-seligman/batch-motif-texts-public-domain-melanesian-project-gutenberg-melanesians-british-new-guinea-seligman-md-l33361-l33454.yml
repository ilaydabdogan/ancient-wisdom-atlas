canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Walaga feast associated with mango fruitfulness:
    moonlit speeches warn spirits away and instruct the crowd to keep peace; dancing
    and chanting occur around a mango pole; pigs are inspected and killed so that
    their cries are heard by the mango tree or mangoes; pork and vegetables are distributed
    by ritual officials; a chief climbs the mango pole and chants; the mango is later
    wrapped, moved, and hung in a sleeping house; participants continue fasting and
    abstinences.'
  language: English
  quote_policy: summarized
