canonical_text:
  quote: ''
  summary: The passage describes beliefs about sua, spirits of the dead, including
    their punishment of neglected funeral rites or broken custom, their possible help
    to living descendants, their appearances and messages in dreams, their feast-time
    presence at the dubu, food remnants or food-shadows associated with them, their
    connection with omens, and harmless forgotten dead appearing in the bush or as
    bluish flames.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sua of recently dead people are said to punish neglect or infringement of
    funeral rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sua are said especially to frequent the neighborhood of houses where a death
    occurred, which is presented as a reason for ceremonial desertion of such houses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dead person's sua is said not to hurt a relative unless annoyed, but a son
    lacking zeal for his father's funeral rites may be punished.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Infringement of tribal custom may cause the sua to smite an offender with
    sickness or bring bad luck in hunting or fishing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A husband of a dead Motu woman whispered to her in the grave, asking that
    she watch and protect them when they went inland hunting or to sea fishing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Children playing near a ceremonially deserted house may sicken, and food from
    a house where death recently occurred may cause sickness if eaten by non-family
    members.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sua are said to visit the dubu at feast time and, in one account, to eat the
    variva or shadow of the food hung up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: People may talk to sua on the dubu, and the sua may answer in dreams though
    not perceptible to waking senses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Charms may be brought to men during sleep by sua, and an old Koita sorcerer
    reported an angry spirit appearing while he slept and placing stones on his chest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bird and fish omens during hunting and fishing are said to be sent by the
    sua so that people know where to go and what to do.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Gaile, spirits of the dead may be seen in dreams before feasts and may
    say they will be with their descendants.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A person's sua appearing in dreams is said to look as the person did before
    disease, often painted and decorated for dancing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: A few fragments of food may be left on the dubu for the sua after the living
