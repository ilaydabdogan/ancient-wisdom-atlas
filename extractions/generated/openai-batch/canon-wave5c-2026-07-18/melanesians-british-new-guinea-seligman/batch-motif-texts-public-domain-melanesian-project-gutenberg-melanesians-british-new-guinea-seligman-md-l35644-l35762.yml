  summary: The passage describes disease and death attributed to labuni sorcery through
    a gidana disease-object, the treatment called gweri, payments to women believed
    responsible, a divinatory method for locating the sender, a comparative note on
    Maisin farum, and a male-associated agency called baravu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A gidana is described as a sliver or fragment of bone, stone, or coral; a
    fragment of human bone or a man's tooth is said to be especially potent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gidana is said to be thrown from a distance; its spiritual part enters
    the victim, though the medicine man may later remove it in material form.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person into whom the gidana has entered is said to ache all over, described
    as the whole skin hurting.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Labuni are said to produce sickness that is often, but not always, fatal,
    and people fear going out at night because of them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: If seen, a labuni is said to turn into a snake, wallaby, or bandicoot, wander
    in that form, and later resume human form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Labuni are said rarely to enter houses and to be frightened away by howling
    dogs, which can see them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Failure to find game while hunting may be attributed to a labuni crossing
    the track.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman might be bribed to send her labuni against an individual, even without
    a personal grudge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A sick person may identify a suspected female sender by guesswork or divination
    and give her food, pearl shells, and other valuables.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The process called gweri removes the gidana by massaging the body and sucking
    an imaginary lump out through closed hands; the extracted object is shown, crushed
    or broken, and thrown away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the gidana cannot be extracted, it is believed to have dissolved in the
    body, after which death surely follows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sender of a labuni is paid so that, after cure, she will not send the
