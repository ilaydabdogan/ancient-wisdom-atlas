canonical_text:
  quote: ''
  summary: 'Ethnographic description of the ita mortuary feast: food is collected
    and displayed at the dead man''s house, redistributed among relatives, and followed
    by the robumomomo ceremony in which the widow''s mourning is removed by changing
    clothing and washing with coconut water. A later hunting and remembrance meal
    ends with a speech releasing concern for the dead and disposal of the tobi. The
    passage also notes widower mourning practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ita feast is held after about six months, approximately the time required
    for a banana crop to ripen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man's kinsmen and the widow's relatives collect yams and bananas
    for the feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The collected food is made into piles in front of the dead man's house, and
    each pile is topped with green coconuts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some bananas and yams are boiled and placed in open pots beside the food heaps;
    after inspection, the providers distribute the food among relatives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The robumomomo ceremony is identified as the most important part of the ita
    and is said to relieve the widow of mourning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead man's brother's wife, and often his sister, enter the dead man's
    house carrying a clean ordinary petticoat for the widow to assume.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The attendants lead the widow down the house ladder to the food piles, remove
    her mourning ornaments, open green coconuts, pour the water over her, and rub
    her down to remove black pigment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the washing, the widow returns to the house; the bisa is burnt, but
    the tobi is not yet destroyed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The accompanying plate depicts attendant women about to remove the widow's
    yarasi; one holds a half coconut and another holds a brush, with vegetable piles
    shown before them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: About a month after the ita, clansmen hunt; a pig, kangaroo, or wallaby is
    brought to the village and left overnight in the dead man's house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next morning bananas are placed on the dead man's verandah, the meat and
    bananas are boiled in a large pot, and the cooked food is served on the verandah.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Villagers, including the dead man's clansmen but not his near relatives, eat
    the cooked food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the meal is finished, the dead man's brother speaks of eating in remembrance
    of the dead and says that they should no longer worry about him because he has
    ceased from among them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the speech, the tobi is cast into the bush at the border of the village,
    where it rots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that a complete widower's mourning costume is no longer
    worn in the Port Moresby villages; a widower usually blackens himself all over.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage states that in earlier times widowers wore cassowary feathers
    and special headgear with a long pendant down the back.
  category: attribute
  evidence_refs:
  - ev:8
