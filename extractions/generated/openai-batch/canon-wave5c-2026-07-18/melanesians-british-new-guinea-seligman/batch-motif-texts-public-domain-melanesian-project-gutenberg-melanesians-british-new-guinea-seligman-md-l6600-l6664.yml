  text: Vabukori is said not to make pots; its people buy pots from other villages
    by giving strings of ageva in exchange.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A string of ageva is said to buy about twelve pots.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tatana formerly obtained pots from Port Moresby, and although Tatana women
    were gradually acquiring pottery craft, most pots carried west by Tatana lakatoi
    were still bought with ageva made by Tatana people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The average number of men going in a lakatoi is given as twenty-nine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 1885 four lakatoi left Port Moresby, each carrying an average of 1628 pots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1903 the Kwaradubuna iduhu equipped a lakatoi named Bogebada, consisting
    of four asi and carrying 1294 pots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage calculates that if twenty lakatoi sailed in that year and each
