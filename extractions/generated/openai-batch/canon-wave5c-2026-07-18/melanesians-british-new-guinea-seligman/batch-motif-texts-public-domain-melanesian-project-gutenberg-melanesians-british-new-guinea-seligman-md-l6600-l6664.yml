    about twenty-five tons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ageva are described as pierced reddish shell discs made by chipping and grinding
    pieces of the lip of a marine bivalve.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Motu women are said to make pots in seven named shapes or sizes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Women of Tupeselei, Gaile, and Kapakapa are described as potters; their men
