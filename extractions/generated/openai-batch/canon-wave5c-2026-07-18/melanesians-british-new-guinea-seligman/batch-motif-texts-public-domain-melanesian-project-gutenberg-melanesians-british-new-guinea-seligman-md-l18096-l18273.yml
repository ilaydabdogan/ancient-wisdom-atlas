canonical_text:
  quote: ''
  summary: The passage describes Mekeo clubhouse institutions called ufu among the
    Biofa and Vee, rules about shared clubhouse names within pangua and ngopu groups,
    and examples of name changes. Some changes commemorate events or express social
    conditions; one change to Aungama, the black snake, publicly signals dangerous
    medicine against sorcerers. Other names refer to birds, ripples, trees, mountain
    peaks, wind, or hornbill, though the reasons for some names are unknown or uncertain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each local clan group, or pangua, possesses or formerly possessed at least
    one clubhouse called ufu by both Biofa and Vee; its function is compared with
    the Roro niarea, but the ufu are described as generally smaller and less elaborate.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: War chiefs and persons called experts may have their own ufu, but the passage
    states that these should bear the same name as the ufu of the lopia fda, so that
    each pangua adheres to a single ufu name.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:12
- id: obs:3
  text: The passage reports that formerly the ufu names of pangua belonging to a single
    ngopu group were said to be identical, and that changes in name were attributed
    to a wish to commemorate historical events.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Father Egidi is cited as concluding, after many inquiries, that the original
    ufu names of the ngopu groups included names printed as Maipa, Apiongai, Popungapi,
    and Oafua.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Some changed names are explained historically or socially: Laila commemorates
    a Jokea clubhouse where visitors were entertained, and Angopu, glossed as a village
    fallen into decay, was given because of the weakness of the builders'' pangua.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The ufu name of the Waiaka pangua at Inawi and Oriropetana was changed from
    Maipa to Aungama, the black snake Pseudechis, to signal that the clans had begun
    making medicine to defend themselves against sorcerers, mainly in an offensive
    way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: For some secondarily acquired ufu names the meaning or reason for change is
    unknown; Funguka is identified as a durable tree used for ufu piles, but the text
    says the reason for adopting that name could not be determined.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Among the Vee, the passage gives ufu names that are also names of mountain
    peaks, the north-west wind, and the hornbill.
  category: object
  evidence_refs:
  - ev:9
- id: obs:9
  text: The passage states that an ufu name is sometimes identical with the iauafangai
    or kangakanga name, but that this is not common; a table lists such cases.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:10
  text: A footnote reports a Mount Yule range example in which a settlement was named
    Inawi to remember admiration for Inawi village and the making of peace with Mekeo
    and the Government.
  category: sequence
  evidence_refs:
  - ev:11
