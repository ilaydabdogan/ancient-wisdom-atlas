canonical_text:
  quote: ''
  summary: The passage describes former Koita markets at Yarokasaka, especially trade
    between Gaseri and Koita villages; the exchange of foods, fish, and salt; armed
    attendance and occasional killings that could lead to revenge; a protected messenger
    procedure during blood-debt tensions; and credit practices including pig loans
    for the tabu feast, silent pressure for repayment, and the absence of interest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Markets were called wotogo by the Koita and utuka in Motu, and are described
    as no longer held and not formerly important in the Koita economy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A former market was held at Yarokasaka, near the junction of the Goldie and
    Laloki rivers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The market participants were the Gaseri, identified as a Koiari people, and
    certain Koita villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Gaseri brought bananas, yams, taro, and wallaby flesh to exchange for
    fish and salt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Informants stated that the Koita formerly made salt by evaporating salt water
    in shallow pots and fragments of larger pots in the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The market was said to occur at very irregular intervals and to have ended
    before the arrival of Europeans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: One trading party could send a message that in two or three days they would
    come to Yarokasaka ready to trade.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spears were always taken and carried at the market.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Trouble often occurred at the market, and it was not uncommon for a man to
    be killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a man was killed, the aggrieved tribe might seek revenge immediately
    or at a later market.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If trouble was anticipated, the tribe that had killed a man sent a messenger
    to the other tribe, choosing someone not connected with the family against whom
    there was a blood debt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The messenger went directly to the house of a clan chief in the village visited,
    stated the reason for his coming, and was then safe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Credit was freely given in almost all transactions and was seldom abused.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Special methods could be used to enforce certain payments.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: In tahutahu, the borrowing of pigs for the tabu feast, a lender could sleep
    one night in the borrower’s house if repayment lagged or if the lender needed
    a pig quickly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the lender slept in the borrower’s house, the borrower would try hard
    to repay the debt, even if repayment required borrowing from someone else.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Interest or usury is described as nonexistent.
  category: attribute
  evidence_refs:
  - ev:9
