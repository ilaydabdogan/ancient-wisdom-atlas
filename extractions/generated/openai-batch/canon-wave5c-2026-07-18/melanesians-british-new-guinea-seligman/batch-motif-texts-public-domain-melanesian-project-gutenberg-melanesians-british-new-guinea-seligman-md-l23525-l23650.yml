canonical_text:
  quote: ''
  summary: 'The passage first recounts the Lavarata clan deceiving the Aurana clan,
    taking valuables and implements, and leaving by sea inside a hollow tree trunk;
    this departure is linked to later canoe-making and to an explanation of white
    people at Taupota as Lavarata descendants. It then begins the tale of the Fig
    Tree: a sorcerous mother-in-law tricks a weakened young mother into climbing a
    fig tree, traps and dismembers her, while the children secretly milk their mother
    to feed the baby. After the mother dies, the children prepare to escape the hag
    by collecting stinging creatures and supplies, using a responsive gomida tree
    to reach a palm refuge.'
  language: English
  quote_policy: summarized
