canonical_text:
  quote: ''
  summary: The passage describes feuding and warfare among communities of south-eastern
    New Guinea and neighbouring archipelagoes. Raids by canoe, often at night, are
    presented as vengeance for homicide and may involve capture, killing, eating prisoners
    or slain people, looting, burning, and crop destruction. It also records war-party
    appearance, weapons, stealth practices, scouts, canoe tactics, village encirclement,
    and withdrawal after a single victim is taken.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Long feuds between communities are described as the commonest cause of homicide
    and as the usual context for warfare.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each hamlet-group is said to have had a traditional enemy, with fighting theoretically
    framed as vengeance for losses caused by that enemy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The warfare was carried on through raids made in canoes in Milne Bay and at
    Tubetube.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The stated objects of raids included carrying off captives and pigs as food,
    burning houses, and destroying coconuts, sugar-cane, and other vegetable food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says this warfare was almost always undertaken to avenge a specific
    homicide by the hostile community.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Night attack followed by rapid retreat to canoes is described as the usual
    method for killing or capturing an enemy while avoiding reprisals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The note says this form of fighting was distinguished at both places by extensive
    property damage and by eating prisoners and those killed in fighting.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says that sometimes people from communities without prior enmity
    were killed and eaten for food when immediate reprisals were not feared.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: War parties had no special war dress, but members were usually blackened all
    over and sometimes wore cassowary-feather plumes on the head.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each man carried one or more spears and a wooden sword called keripa; many,
    though not all, also carried shields.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: During a covert voyage, canoes landed one after another without speech, and
    no fire was lit if the expedition had to camp at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Brave men called Tau Tahutahuloro went ahead to spy on the enemy and report.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Two warriors called Boe led the early-morning advance, with one remaining
    forward while the other returned to signal the main body to advance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: If a guard saw a solitary enemy approaching, he returned to the warriors,
    who hid in the bush and then attacked to capture or kill the person.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Children and old men, although not fit to fight, guided the canoes to stop
    in front of the village and cut off retreat by sea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When close to the village, warriors divided into three or four parties, surrounded
    it, attempted surprise, captured and killed people, stole goods, damaged gardens,
    and burned the village.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Because the war was made to avenge one person’s death, the attackers often
    withdrew after capturing or killing one person, carrying the victim back to the
    canoes to eat.
  category: sequence
  evidence_refs:
  - ev:10
