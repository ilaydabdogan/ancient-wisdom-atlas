canonical_text:
  quote: The titles ovia itsipana and ovia awarina mean 'chief of the right' and 'chief
    of the left' respectively.
  summary: The passage describes hereditary chiefly offices, their right-left ceremonial
    placement in the clan clubhouse, chiefly peacemaking and taboo powers, the substitute
    and policing functions of the second chief, war-chief offices, and assistants
    to chiefs among Roro-speaking and nearby communities.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Each itsubit, or local group of an itsubu, is described as having a head man
    or chief called the ovia itsipana; next in dignity is the ovia awarina, though
    some weak itsubu lacked an acknowledged ovia awarina.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ovia awarina enforces the ovia itsipana's orders when necessary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The titles ovia itsipana and ovia awarina are glossed as chief of the right
    and chief of the left; both offices are hereditary and linked to positions to
    the right and left of the median line of the clan clubhouse during important ceremonies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ovia itsipana takes the principal part in ceremonies involving more than
    one itsubu and has the right to stop faction fights in his village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: To stop a fight, an ovia itsipana may stand between combatant lines, scatter
    lime from his gourd, and wave the leafy crown of a dracaena; an opposing ovia
    itsipana is expected by etiquette to assist by doing the same.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a friendly community invades to demand payment for bloodshed, the peace-seeking
    ovia itsipana advances with a spear, lime gourd, mahawa bag, and armshells, which
    are stated to be a sign of peace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the blood-payment peacemaking procedure, the peace-seeking chief tenders
    his spear to the opposing chief, who breaks it; the peace-seeking chief then breaks
    the opposing chief's spear, after which settlement is discussed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each ovia itsipana can pronounce a taboo on coconuts belonging to the local
    group of his itsubu, but not without prior consultation with old men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ovia awarina can act as a substitute for the absent ovia itsipana, may
    be left in charge of a settlement, is expected to consult the ovia itsipana before
    decisive action, and is responsible for policing, petty theft prevention, and
    theft-related quarrel adjustment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Roro-speaking communities are described as having one or more war-chiefs who
    lead in war and are distinguished from paiha chiefs, who are experts in battle
    magic.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The war-chiefs are said never to be clan chiefs, generally to be ovia awarina,
    and to have or have had a marea distinct from other marea.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Roro and Waima tribes, and probably among the Paitana, an ovia itsipana
    may have an assistant whose office is often hereditary but not chiefly, and whose
    duties are to be near the chief and help with ceremonies in the clubhouse.
  category: relationship
  evidence_refs:
  - ev:10
