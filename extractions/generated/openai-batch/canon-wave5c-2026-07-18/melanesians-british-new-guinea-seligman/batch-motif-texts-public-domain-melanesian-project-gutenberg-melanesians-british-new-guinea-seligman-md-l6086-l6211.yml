literal_observations:
- id: obs:1
  text: After the asi are lashed together to form the lakatoi, a ceremony of charming
    takes place at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lakatoi sorcerer burns a root from a certain wild plant with bits of cassowary
    claw and garfish snout in a potsherd and uses the smoke to fumigate the gunwale
    of the asi associated with the mats of the doritauna and baditauna.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fumigation is said to bring good luck and superior sailing powers; leaf
    parcels from the same wild plant are also fixed in gunwale holes to doubly ensure
    the result.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: The mast is made from a tree growing near high-water mark; its natural crook
    guides the halyards, and its cut roots are lashed to deck cross beams for stability.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sail captains make crabclaw-shaped sails in the village from plaited mats
    sewn together and attached to mangrove poles, measuring the two horns for equal
    length.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The anchor is a large stone in heavy lashings with a rattan cable; anchors
    are described as highly helaga, and nobody may step across the cable when the
    anchor is down.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When anchoring is necessary, three men, preferably blood or iduhu relations
    of the doritauna, continually watch the cable, with one in the centre keeping
    his hands on it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lakatoi are named according to the iduhu of the baditauna and doritauna, and
    if the two captains belong to iduhu with different lakatoi names, each half of
    the vessel takes a different name.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The lakatoi are decorated with iduhu toana clan badges called pepe, and a
    cowrie-shell framework ornament fits over the top of each mast.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Competitive trial sailings take place across Port Moresby harbour with sede
    beating, singing, girls dancing on the bow platform, and steersmen occupying the
    after-end platform.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: During trial sailings, the vessel reverses ends rather than going about in
    the usual manner, and the steersmen and girls change places.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The baditauna, doritauna, and sail captains do not take part in the celebration;
    young men of the constructing iduhu temporarily man the lakatoi, while mast captains
    also take part.
  category: relationship
  evidence_refs:
  - ev:11
