canonical_text:
  quote: ''
  summary: The passage describes regional trade in adze and axe stones, shell valuables,
    built-up canoes, pigs, tusks, European goods, and pots among Murua, the Marshall
    Bennets, the Trobriands, the D'Entrecasteaux area, Tubetube, Egum, and Wagawaga.
    It records values paid for stones and waga canoes, notes deferred or expected
    future payments, and contrasts Wagawaga's lack of sea-going trading canoes with
    its prosperity and imported valuables.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator states that limited time on Murua and disruption caused by mines
    prevented certainty about the value of ordinary adze and axe blades.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Adze and axe blades were exported both finished and roughly flaked; most rough
    stones are described as moving east from Murua to the Marshall Bennets, the Trobriands,
    and probably the Egum Group.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Gawa, some unground stones were formerly valued at one sapisapi belt or
    necklace, while thicker narrower stones were worth less; stones were commonly
    paid for in sapisapi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rough stones were partly or wholly ground in the Marshall Bennet Group and
    then used locally or exported to the Trobriands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
