canonical_text:
  quote: ''
  summary: The passage describes Trobriand accounts of the dead, called barom, going
    to Tuma and descending to an underworld place associated with Topileta. It describes
    Topileta’s appearance, household, and powers; variant views about souls in humans
    and animals; accounts of living persons’ barom visiting Tuma and returning; a
    prohibition on eating with the shades if one is to return; dream-communications
    from the dead; and a feast at which food is left for the spirits overnight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The shades of the dead are called barom and are said to go to Tuma, a small
    island north-west of the Trobriands, then descend into an other world below the
    earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the other world the dead find a track leading to the place of shades, which
    is associated with Topileta.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Topileta is said to have first sent men into the upper world and told them
    to take their totem animals with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Topileta is described as manlike but with huge continually flapping ears;
    another account says he is much larger than a mortal man and covered with tattoo.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Topileta lives with his wife Tenupanupaia, who looks after his garden.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Topileta is credited with magical powers, including causing earthquakes and
    making medicine that restores youth to himself, his wife, and children.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: All people are said to come at last to Topileta and to share equally in the
    other-world life regardless of their condition or conduct in this world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chiefs are said to retain their authority in Tuma, while Topileta is treated
    as distinct from dead chiefs and not clearly as an ordinary ruler over the dead.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: One Lobua account says Topileta asks the barom why they have died, and they
    answer that they do not know and have come to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some accounts attribute barom to pigs, dogs, birds, fish, shadows, and breath-associated
    life, while some Kiriwina men say only humans have barom.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A barom may leave the body without death, including in sleep, where its experiences
    may appear as dreams, or intentionally.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Marogus of Kavatari was said to lie motionless and scarcely breathing for
    seven days while his barom visited Tuma and saw Topileta, who sent him back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Marogus is reported to have said that in Tuma he saw and talked with shades
    of the dead who garden, marry, and have children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Living visitors to Tuma are said not to be able to return if they eat or smoke
    with the shades.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The dead are seen in dreams speaking in a whistling speech, inviting the living
    to visit Tuma and praising its crops and yams.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: At a feast held months after a death, food is cooked for the spirits, left
    overnight, and is often found partly or entirely gone in the morning.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The shades are said to know when much food has been gathered for the feast
    and to visit it at night.
  category: sequence
  evidence_refs:
  - ev:10
