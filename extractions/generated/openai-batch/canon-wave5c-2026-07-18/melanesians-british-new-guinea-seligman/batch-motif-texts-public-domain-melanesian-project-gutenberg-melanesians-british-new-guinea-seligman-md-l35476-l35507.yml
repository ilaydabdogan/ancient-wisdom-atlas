canonical_text:
  quote: ''
  summary: At Wagawaga, after the toreha, the hamlet that held it makes a small feast
    called dabadabagigira. Reserved pigs are killed and eaten, with portions cooked
    separately for women and men. Afterward, feast debris is thrown into the sea and
    women sweep the hamlet. The passage says this cleanup was described as practical,
    not part of the toreha ceremony, and not a sweeping away of spirits. The watara
    is left to decay, and Mr Giblin glosses dabadabagigira as meaning “sweeping the
    scraps away.”
  language: English
  quote_policy: summarized
