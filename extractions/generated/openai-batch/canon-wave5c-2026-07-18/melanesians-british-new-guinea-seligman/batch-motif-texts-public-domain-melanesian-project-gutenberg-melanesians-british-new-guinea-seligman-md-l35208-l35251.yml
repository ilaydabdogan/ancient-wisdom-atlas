canonical_text:
  quote: ''
  summary: The passage describes Wagawaga and Tubetube customs concerning houses formerly
    occupied by dead persons. At Wagawaga, conditions are said to resemble Tubetube,
    though a sister might possibly move into a dead sister's house. At Tubetube, examples
    show widowers or widows sometimes continuing in or leaving a spouse's house, while
    houses associated with the dead may be broken up, burned, or left to rot, especially
    when no children or close kin remain to occupy them.
