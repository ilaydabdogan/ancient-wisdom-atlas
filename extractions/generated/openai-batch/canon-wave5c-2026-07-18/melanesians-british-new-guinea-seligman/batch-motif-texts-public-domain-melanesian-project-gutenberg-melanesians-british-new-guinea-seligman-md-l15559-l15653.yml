canonical_text:
  quote: ''
  summary: 'The passage describes mourning and funeral customs: a dead chief''s hair
    and personal property may be displayed in a marea; a village mourns a chief by
    abstaining from work until coconut leaves are removed and a small feast is held;
    a cited Yule Island practice orients the corpse toward Mt Yule and drives away
    the spirit with herb-stroking, sticks, and torches; widows and widowers observe
    seclusion, concealment, route restrictions, bodily signs, food taboos, blackening,
    ornaments, and mourning garments; later feasts relax and finally end mourning;
    unusual noises in the dead person''s deserted house may be treated as the spirit''s
    return.'
  language: English
  quote_policy: summarized
