candidate_motifs:
- id: motif:1
  label: self-offering to animal followed by suicide
  taxonomy_refs: []
  basis: The girl strips off and gives ornaments, dog, petticoat, and then herself
    to a crocodile, which takes her.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage's note says the crocodile is not usually associated with suicide
    and may be incidental in this story.
- id: motif:2
  label: uncatchable floating head
  taxonomy_refs: []
  basis: After the crocodile takes the girl, her head floats near shore, repeatedly
    escapes a hand net, and remains impossible to catch.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The raconteur's explanation is not elaborated beyond calling it a bariaua
    head; no wider motif identification is supplied.
- id: motif:3
  label: non-coital or virgin birth of concealed child
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: The woman conceives without cohabitation and bears a child hidden in a tree;
    the footnote explicitly calls this a virgin birth.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The note also says she was viewed as a monstrosity; no divine parent is
    identified in the passage.
- id: motif:4
  label: anomalous body opening becomes mouth
  taxonomy_refs: []
  basis: The woman has only a hole in her head until painful feeding causes a face-hole
    to burst open and become her mouth.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly matches this body-transformation
    episode.
- id: motif:5
  label: hidden serpent-associated youth as husband
  taxonomy_refs:
  - serpent
  basis: The hidden son in the tree is first encountered through a long snake's neck
    and later as a handsome youth who marries the two girls; he is later called the
    snake husband.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly narrate a transformation from snake to
    human, so a shapeshifter classification is not asserted.
- id: motif:6
  label: warning about forbidden dangerous path ignored
  taxonomy_refs: []
  basis: The mother-in-law warns that the overgrown path is used by the Taumudukoro
    and may be deadly, but the young mother insists on taking it.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the danger as a path warning rather than as forbidden
    knowledge or initiation.
- id: motif:7
  label: dangerous affectionate nurse kills child
  taxonomy_refs: []
  basis: The Taumudukoro loves nursing young children but is prickly and hugs the
    baby until it bleeds and dies.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: Her action is affectionate in speech and behavior but lethal in result;
    the passage does not state malicious intent.
- id: motif:8
  label: fatal diving task with clam trap
  taxonomy_refs: []
  basis: After the child's death is reported, the husband directs the young mother
    to dive for a large clam, whose valves close on her hand and kill her.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The husband’s motive is implied by sequence but not explicitly stated.
- id: motif:9
  label: fire smell revealing childbirth to child-taking relative
