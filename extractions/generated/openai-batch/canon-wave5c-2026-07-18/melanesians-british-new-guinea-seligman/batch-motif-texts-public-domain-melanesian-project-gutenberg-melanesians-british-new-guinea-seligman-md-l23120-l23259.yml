canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a girl gives ornaments,
    a dog, her petticoat, and herself to a crocodile, after which her floating head
    cannot be caught. It then gives the Taupota story of Taumudukoro: a mouthless
    woman conceives without cohabitation, hides her child in a tree, gains a mouth
    through injury, and has two servant girls who later marry her son, a serpentine
    youth in the tree. One wife bears a child, takes the forbidden overgrown path,
    meets the prickly Taumudukoro in a cave, and loses her baby when Taumudukoro nurses
    it to death. The snake husband then directs the young mother to dive for a clam,
    which closes on her hand and kills her. The passage ends with the beginning of
    another Taupota tale about Buimoremore enchanters, a childbirth, and a warning
    not to put coconut husks on the fire lest the smell alert the female enchanter''s
    mother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl sings a verse three times, removes her ornaments one by one, throws
    them to a crocodile, then throws her dog, her petticoat, and finally herself to
    the crocodile.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crocodile snaps down the objects and takes the girl when she throws herself
    down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl's head floats away, is washed near shore, repeatedly leaps out of
    a hand net, and is said still to float about without being catchable.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Editorial notes state that the girl is an only daughter associated with her
    mother's ornaments, that questions about the head annoyed the raconteur, and that
    the crocodile is not usually associated with suicide in the district.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Taumudukoro story, a girl is born without a mouth and with only a hole
    in the top of her head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mouthless girl grows into a woman, conceives without cohabitation, bears
    a child, and hides the child in a hole in a tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Friends put food into the hole in the woman's head so quickly that the pain
    causes her to burst a hole in her face, which becomes her mouth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman asks two young girls to stay with her as servants, and later sends
    them with food for her son.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When food is taken to the tree, a long snake's neck comes out for it; on the
    next visit a bold girl enters the tree and finds a good-looking youth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Both young girls desire the youth, and he marries them both.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: One wife bears a son, and the mother-in-law warns the two wives that a well-worn
    path leads to the village while an overgrown cross track is used by the Taumudukoro
    and may lead to death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young mother chooses the overgrown track despite the warning, and the
    path leads to a steep valley with a rocky cave where the Taumudukoro lives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Taumudukoro is described as covered with horns and spines, very prickly,
    and loving to nurse young children.
  category: attribute
  evidence_refs:
