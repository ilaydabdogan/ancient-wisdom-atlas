canonical_text:
  quote: Twins excite no surprise or disgust, and are well treated.
  summary: 'The passage states that twins are accepted and well treated, and that
    twin-bearing is recognized as hereditary even after generational gaps. It then
    describes Koita land tenure: section and iduhu landholding, descent to children,
    allocation of additional garden land by chief and elders, communal clearing, non-sale
    and reversion of land, permitted gardening on another''s land with crop return,
    remedies for unauthorized planting, rights of way, and inter-section tensions
    or cooperation around hunting and grass burning.'
  language: English
  quote_policy: quoted
