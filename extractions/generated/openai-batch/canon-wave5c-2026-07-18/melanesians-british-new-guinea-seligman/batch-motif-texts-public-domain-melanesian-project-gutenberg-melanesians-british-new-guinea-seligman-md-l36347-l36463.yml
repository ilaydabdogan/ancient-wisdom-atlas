candidate_motifs:
- id: motif:1
  label: Soul or shade travels to a named otherworld
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage names Hiyoyoa and Bebweso as destinations of the dead and gives
    locations or routes, including Hiyoyoa under the sea and the Tubetube path via
    Yaruauneti to Bebweso.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: high
  cautions: The Wagawaga section says no details could be elicited about the road
    to Hiyoyoa.
- id: motif:2
  label: Otherworld as parallel social life
  taxonomy_refs: []
  basis: Hiyoyoa resembles the upper world; Tumudurere assigns gardens; Wagawaga and
    Tubetube shades have gardens, marriage, children, and food.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage provides practical social details but little narrative sequence
    beyond journey and residence.
- id: motif:3
  label: Living visitor to the otherworld returns
  taxonomy_refs: []
  basis: Wakuri, Tokeri, and Maritaiyedi are each described as living persons able
    to go to an otherworld and return.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage does not present these journeys as heroic quests; it reports
    local claims and ethnographic testimony.
- id: motif:4
  label: Food of the dead as a barrier to return
  taxonomy_refs: []
  basis: Hiyoyoa shades avoid feeding Wakuri at first because eating their food would
    prevent return, while Maritaiyedi is separately said to eat with shades and return
    without difficulty.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: Only the Wagawaga account explicitly says eating otherworld food would
    prevent return; the Tubetube account gives a contrasting case without explaining
    why return remains possible.
- id: motif:5
  label: Flooding wave from the otherworld
  taxonomy_refs:
  - flood_and_renewal
  basis: Tokeri predicts a great wave from Hiyoyoa that will flood the coast, sweep
    dwellings away, and be followed by Hiyoyoa appearing at the head of Milne Bay.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: low
  cautions: The prophecy is explicitly unfulfilled in the passage, and the account
    does not include a clear renewal or creation sequence.
- id: motif:6
  label: Dead appear in dreams restored to prime condition
  taxonomy_refs: []
  basis: Tubetube yaruyarua may appear in dreams, speak to dreamers, and appear in
    perfect physical condition regardless of the body's condition at death.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage reports the dream appearance but gives no extended dream narrative.
- id: motif:7
  label: Sacred or dangerous spirit hill
  taxonomy_refs: []
  basis: Bebweso is described as the place where yaruyarua persist and as a hill whose
    spirits would be angry and harmful if approached.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The evidence for approach-taboo is secondhand within the passage and brief.
