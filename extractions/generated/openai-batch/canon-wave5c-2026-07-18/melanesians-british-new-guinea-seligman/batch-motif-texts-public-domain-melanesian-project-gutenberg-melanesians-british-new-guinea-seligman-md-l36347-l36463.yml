canonical_text:
  quote: ''
  summary: The passage describes Wagawaga and Tubetube beliefs about souls or shades,
    named otherworld destinations, routes or means of reaching them, living visitors
    who return, dream appearances of the dead, otherworld food and gardens, and a
    prophecy of a wave from Hiyoyoa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, arugo denotes a dead person's spirit, shade, or soul and also
    a person's shadow or reflection; at death it leaves the body and goes to Hiyoyoa
    under the sea near Maivara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hiyoyoa is described as resembling the upper world, with day and night reversed
    relative to Wagawaga.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tumudurere lives on a hill in Hiyoyoa with his wife and children and is said
    to receive arriving shades and tell them where to make gardens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Living men and women are said to journey to Hiyoyoa and return; the arugo
    alone performs the journey, but Wakuri identifies himself with his arugo when
    speaking of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wakuri reaches Hiyoyoa by smearing bush medicine on his body, falling asleep,
    and awakening in Hiyoyoa; no details are given about the road or adventures on
    the way.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shades did not initially invite Wakuri to eat their food because eating
    it during an early visit would have prevented his return to the upper world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain shrubs were pointed out as having grown from plants brought back from
    the underworld.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tokeri, another person said to know how to go to Hiyoyoa, warned people to
    kill pigs and build houses in the bush because a great wave would come from Hiyoyoa
    and flood the coast.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Different communities responded differently to Tokeri's warning; when the
    prophecy did not come to pass, resentment arose and he was detained by the Government
    for a short time.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Tubetube, yaruyarua denotes the soul, spirit, life, and ghosts of the dead;
    such ghosts may appear in dreams, speak, and appear as the dead were in their
    prime.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The yaruyarua remains near a corpse until burial, is distinct from breath,
    does not age or die, and persists on Bebweso, a wooded hill on Duau.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tubetube yaruyarua travel from a headland by an imaginary or submerged reef
    called Yaruauneti, the step of shades, toward Bebweso.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Yaruyarua marry, breed, and make gardens like living people, and Maritaiyedi
    is said to have frequently visited the other world, eaten with the shades, and
    returned home without difficulty.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: People in part of Normanby Island also regarded Bebweso as an abode of spirits
    and warned that approaching it could anger the spirits and cause harm.
  category: speech
  evidence_refs:
  - ev:11
