canonical_text:
  quote: ''
  summary: The passage describes a mourning-ending ceremony in which ufuapie chiefs
    and dancers approach a mourning village, receive repeated food gifts, enter with
    drums and headdresses, continue dancing despite ritualized objections by the bereaved,
    receive and redistribute food, and participate in a feast centered on a bamboo
    food-hanging structure called kou. Formal speeches present the visitors as making
    the village warm again after the cold of mourning and emphasize reciprocal obligations
    in pigs and food. The ceremony ends with mourners who abstained from foods or
    practices resuming them, illustrated by a widower whose pipe is lit and returned
    to him by a ufuapie chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ufuapie chiefs leave their ufu while chewing areca nut and produce a loud
    clicking sound by rubbing lime spatulae against lime gourds as a warning to keep
    the track clear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ufuapie chiefs repeatedly stop after a few steps, pretend to be too tired
    to continue, receive food presents, and then proceed; this refreshment happens
    two or three times every hour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near the mourning village, painted ufuapie men form a compact group, wear
    ornaments and sometimes great feather headdresses, hold drums at eye level, beat
    the drums at a signal, and advance into the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased person's family asks the performers not to dance, saying they
    have come to take away the village's cold; the widow and near relations remonstrate,
    feign attack, and threaten the dancers with glowing embers.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Dancing continues through the night, and each performer later receives a boiled
    ball of sago called ketsiketsi, which he must share with kinsfolk who lent feathers
    and ornaments for the headdress.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After ketsiketsi distribution, dancers with large kangakanga headdresses rest
    while men in smaller headdresses dance; women and girls cook vegetable food, and
    pigs are killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A kou is built in the open central space of the village from big bamboos planted
    in the ground, with cut branch stubs serving as hooks for food, fish, and meat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Late in the evening, after clicking lime spatulae and sudden quiet, ufuapie
    chiefs come out wearing priceless ornaments and stand motionless by the kou in
    the respectful silence of the crowd.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The feast-giving chief places a pig limb, slabs of pig fat, and other presents
    at the visiting chiefs' feet and gives a speech saying their arrival makes the
    village warm again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ufuapie spokesman replies that the food and game are poor but that the
    hosts cannot give more than they have, and he reminds them that the ufuapie previously
    gave twenty pigs that must be returned when possible.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the speeches, mourning is ceremonially ended; those who abstained from
    foods or practices in memory of the deceased arrange themselves in a semicircle
    near the kou, each holding what they had avoided.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the example of a widower, the ufuapie chief lights the widower's pipe,
    swings it two or three times around his head, declares that mourning is over and
    smoking may resume, and the widower replies that he smokes again.
  category: action
  evidence_refs:
  - ev:10
