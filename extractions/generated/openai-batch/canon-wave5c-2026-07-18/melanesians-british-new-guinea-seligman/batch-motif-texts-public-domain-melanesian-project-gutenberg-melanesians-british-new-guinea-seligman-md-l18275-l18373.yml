canonical_text:
  quote: ''
  summary: 'The passage describes Mekeo ufu as clubhouses with ritual importance in
    war-related practice: warriors call on the ufu or village name, returning warriors
    interact with the ufu, newly returned warriors undergo seclusion, restrictions,
    washing, feasting, and decoration, and some ufu carry chiefly-owned designs or
    borrowed ceremonial decorations.'
  language: English with Mekeo and other local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A warrior was described as calling out the name of his ufu when striking a
    blow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Warriors returning from a war party were described as embracing the main piles
    of the ufu while invoking and praising them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tired or stiff man might speak the name of his ufu, but more usually would
    call the geographical name of his village; the expression using inaenga is glossed
    as belly, centre, or heart of the village, with a note questioning how literally
    this should be translated.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Certain Mekeo ufu are said to play an important part in ceremonies for warriors
    newly returned from war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Newly returned warriors entering their villages throw their spears at and
    into the ufu of the war and faia chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The returned men are called ngove and spend a considerable time in strict
    seclusion in the ufu of the faia chiefs, with the front of the ufu closed by plaited
    coconut leaves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During seclusion the men are said to spend much of their time squatting around
    the fire, eating little, and conveying food to the mouth with a fork rather than
    touching it with the hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the end of the seclusion period the men wash in water infused with fefu
    leaves and leaves of another herb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After washing, the men may leave the ufu during daylight but still return
    to it at night; they may do no work, wear no ornaments, and not approach their
    wives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After two or three months, a feast is held in the ufu of one or more clans
    engaged in the war; pigs are probably killed for the occasion, and certain ufu
    are set apart by custom for the feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the feast, men who had killed someone in the recent fighting are decorated
    with kefe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ufu have no special designs, badges, or carvings attached to them as ufu;
    carved designs on parts of the ufu are described as the property and distinctive
    badge of the chief with hereditary charge of the ufu.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mangemange, the high chief of Ikoiko pangua of Rarai village, is said to have
    added a special circular-hut-like design to Popungapi, the ufu of his pangua;
    the structure is said to represent Mount Drew, called Kafarua by the Mekeo people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In some Mekeo villages, ceremonial decoration of the ufu may mimic Papuan
    Gulf decoration, including borrowed bull-roarer derivatives bearing conventional
    human figures representing Elema ancestors.
  category: attribute
  evidence_refs:
  - ev:8
