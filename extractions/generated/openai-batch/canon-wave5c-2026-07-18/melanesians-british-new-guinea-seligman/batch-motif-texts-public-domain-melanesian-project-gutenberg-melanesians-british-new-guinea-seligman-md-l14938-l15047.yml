comparison_claims:
- id: claim:1
  claim: The passage supports a cautious comparison between the aruaru ceremonies
    and the Lese/Elema boy initiation described in the note, since both involve boys'
    seclusion, instruction in making ornaments, and red-colored bodily adornment after
    or during initiation.
  claim_level: same_function
  target: Lese/Elema boys' initiation at Lese
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The Lese account is presented as a note and not as a full one-to-one
    parallel; the passage does not claim all details or objects are identical.
- id: claim:2
  claim: The passage itself reports regional influence involving Waima and Elema proximity
    and notes Gulf masks used by Waima, supporting a cautious historical-contact claim
    for nearby ceremonial mask traditions.
  claim_level: historical_contact
  target: Waima, Elema, and Gulf mask use in relation to Roro/Paitana contexts
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: medium
  limitations: The note also says the Gulf masks are not found among Roro or Paitana
    tribes, so the claim should not be generalized to all groups in the passage.
