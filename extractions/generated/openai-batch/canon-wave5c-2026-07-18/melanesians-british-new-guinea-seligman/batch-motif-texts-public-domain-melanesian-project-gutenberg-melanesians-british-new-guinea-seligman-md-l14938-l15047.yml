canonical_text:
  quote: ''
  summary: 'The passage describes aruaru initiation ceremonies for boys and older
    lads: red painting, confinement in the back compartment of an aruaru marea, instruction
    by older men, food passed through holes, feasting and dancing, repeated seclusion,
    fasting or simulated fasting, making and wearing instruments, masks, and ornaments,
    transfer of ornaments to older fully initiated men, and a subsequent wallaby hunt.
    A note also summarizes a Lese/Elema boys'' initiation involving a belt, tassels,
    seclusion, craft instruction, red earth, oil, and fragrant herbs.'
  language: English with local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys about ten years old and older lads approaching puberty, all called miori,
    were initiated together.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The initiates were painted red and confined by day for about two months in
    the back compartment of an aruaru marea; at night they could go out but could
    not visit their parents' houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Older men visited the confined initiates daily and directed them in making
    armlets, belts, leglets, anklets, and wristlets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: Relatives prepared food for the initiates, and boys too young for initiation
    passed it to them through small holes in the sides of the back compartment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The aruaru chief supervised the ceremony and ordered a feast when he considered
    the boys sufficiently trained.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: People killed pigs and brought cooked food, and men and women danced; the
    men wore the iu while dancing.
  category: action
  evidence_refs:
  - ev:5
  - ev:12
- id: obs:7
  text: After a dance, the chief announced from the marea platform that the boys had
    completed their belts, anklets, and other items; the initiates left the marea
    and went to their parents' houses, where their mothers at first feigned not recognizing
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the first seclusion, the aruaru stayed in the village for about two
    months, were said to have flirtations, and wore the iu when dancing before being
    secluded again for about a month.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the end of the second seclusion the boys were supposed to fast for one
    day, but pairs of boys were expected to open and eat at least one coconut without
    making noise.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the chief approached noisily and looked into the back compartment, the
    aruaru lay in attitudes of exhaustion; the chief called for food, which he and
    other old men brought to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: During seclusion, old men taught the initiates to make iu, mask frameworks
    called itaretare, dancing masks called vera, dancing plumes, and pearl shell crescents.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The initiates later left seclusion to dance wearing the ornaments, then discarded
    their finery when they returned.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Each boy made a mask called bakoro, described in the passage as like a hat,
    wore it for a dance, and then returned to the marea.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The initiates later made basket-work ornaments, including one called kokoai,
    and came out fully decked with vera, iu, itaretare, and several mairi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The ornaments made by the initiates became the property of the older fully
    initiated men called buiapu who had taught them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The buiapu and the initiates went wallaby hunting, with the initiates leaving
    the village at night and meeting the buiapu after daybreak.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: A note says that at Lese an Elema boy received a hibiscus bark belt called
    kuva, added tassels when his pubes began to enlarge, entered seclusion in an eravo,
    learned to make ornaments, and later used coconut oil colored with red earth and
    fragrant herbs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:18
  text: A note states that Waima had been influenced by proximity to Elema tribes
    and that Gulf masks called kaivakuku were used by Waima though not found among
    Roro or Paitana tribes.
  category: relationship
  evidence_refs:
  - ev:2
