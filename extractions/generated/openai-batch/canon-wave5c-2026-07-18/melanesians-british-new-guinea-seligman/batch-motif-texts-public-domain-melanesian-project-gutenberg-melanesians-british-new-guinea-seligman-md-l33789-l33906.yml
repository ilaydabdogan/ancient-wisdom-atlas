canonical_text:
  quote: ''
  summary: The passage describes the killing and distribution of pigs at the Walaga
    feast at Diwari. The walaga mango is taken down from the dawati, its leaves are
    cut off, and the leaves and dead men's property are burned in the fire used for
    singeing pigs. Pork and taro are distributed from the platform as payments, with
    names called and gifts collected by younger relatives. The feast ends as people
    pack up the food and disperse. The passage also records a privilege allowing hungry
    waiting guests to take food from host gardens or coconut palms by calling a formula,
    notes a charred stick tied to the walaga mango, and mentions old men's hair knots
    used as charms against sorcery.
  language: English
  quote_policy: summarized
