canonical_text:
  quote: ''
  summary: 'The passage lists omen practices reported for Wagawaga, Tubetube, and
    Bartle Bay: totem tree leaf movements as signs of relatives'' deaths, animal cries
    or appearances as death, war, and fishing omens, a beche-de-mer in a net as a
    no-catch indicator described as practical rather than omen-like, a firefly entering
    a house as a death sign, and bleeding from a self-inflicted work injury as a sign
    of trouble among relatives at home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wagawaga, seeing totem birds was not considered specially lucky before
    fighting or at other times; omens were instead taken from the behavior of the
    totem tree.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man working in his garden saw his father's totem tree shed a leaf that
    moved or 'walked' along the ground, he would know his father was dead; if his
    own totem tree did so, he expected to hear of his mother or sister's death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the cry of the bunebune pigeon was heard while a man or woman was ill,
    the patient was expected to die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A beche-de-mer entangled in a fishing net was said to mean no fish would be
    caught, but the passage says this appeared to be a repeated practical observation
    rather than an omen.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Tubetube, on a fighting expedition it was good for a man to hear or see
    his totem bird when approaching the shore of a hostile community, and hearing
    the cry was more important than seeing the bird.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: If Tubetube totem birds were not seen or heard before fighting, the party
    could hardly expect victory; totem fish or snakes did not betoken luck on the
    war-path.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: For Tubetube war omens, the position of the bird or the direction of its flight
    did not matter, and seeing totem birds away from fighting did not betoken good
    luck.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: When fishing on the reef at night, hearing the cheeping of the flying fox
    mariboi was good, while hearing the lowiri bird's cry was bad enough that a fishing
    party would usually return at once.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In Bartle Bay, if a firefly entered a house at night, it was a sign that someone
    in the house would die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a man working in the garden or away from home cut himself with his digging
    stick so that blood flowed, he would ask what had happened to his people at home
    and would expect an accident to one of his relations.
  category: sequence
  evidence_refs:
  - ev:10
