canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing healing and sorcery practices: restoration
    of a wandering life-spirit, sacred preparation of sorceress and patient, invocation
    of spirits including Devase, extraction of foreign bodies from the sick, incantations
    against inland spirits, communal epidemic responses, and a reported vada method
    of killing and reviving a victim by rope and medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The incantation is described as aiming to restore a wandering sica to its
    owner; both sorceress and patient must become sacred, and spirits are invoked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Devase is described as apparently becoming immanent in the sorceress, who
    calls herself his wife, and his presence is said to assist her in bringing the
    missing sua back to the sick person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage reports two coexisting explanations for sickness: disease caused
    by foreign bodies and non-epidemic disease caused by loss of the sick person’s
    sua.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one treatment, the sorceress removes objects such as stone, wood, rope,
    or spear pieces from the body while uttering commands addressed to sickness, evil,
    blood, and bodily strength.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another incantation, the sorceress calls to inland spirits to remain inland,
    with rocks, and on mountains; the spirit of sickness leaves, she declares her
    hands and feet clean, then exits by a circuitous route and returns to the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During a reported epidemic at Hanuabada, torches were burned, horns were blown,
    hereditary sorcerers cursed through the night, land spirits were blamed, people
    slept in canoes in the bay, and arrows were later fired at moving objects.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ahuia reports that human sorcerers called vada follow a victim to a garden
    or bush, kill him with spear and club, cut him up, attach a rope to hand or knee,
    and use medicine on the other end of the rope to restore him to life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The revived victim is described as dazed, forgetful, unable to explain what
    happened, and returning to his village in a feeble and silly condition after being
    told he will die shortly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Koiari man, Yohia Wagira of Gas^ri, is reported to have been imprisoned
    on a sorcery charge; Ahuia feared his release and said he had threatened to put
    magical medicine in all wells.
  category: other
  evidence_refs:
  - ev:8
