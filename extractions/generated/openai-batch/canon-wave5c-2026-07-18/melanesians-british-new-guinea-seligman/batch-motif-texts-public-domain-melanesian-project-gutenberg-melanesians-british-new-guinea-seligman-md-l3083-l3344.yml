  quote: ''
  summary: 'The passage lists Koita sections and villages, describes territorial range
    and recurring hostility between eastern and western groupings, notes the extinction
    of Namura, and records origin accounts: a Motu-told story of named ancestors emerging
    from the earth with a female dog, and eastern Koita accounts linking Gorobe and
    Yarogaha ancestors to an erimo tree at Koma and Badili, Hohodai, and Yawai origins
    to the hill Idu.'
