canonical_text:
  quote: ''
  summary: 'The passage surveys spiritual beings among Roro-speaking tribes, notes
    cautions about possible mission influence, and describes named or categorized
    beings: Oa Rove Maral, paipai or Paipai, beriwa, Boubou, an evil spirit like fire,
    and spirits of the dead. Paipai are linked with illness, snake and human forms
    near springs, and a shape-changing ancestral role in some legends. Beriwa is used
    for spirits of the dead, malicious nonhuman agencies, and the bull-roarer.'
  language: English
  quote_policy: summarized
