canonical_text:
  quote: ''
  summary: The passage describes Koita movements between named settlements under Ova
    Abau, sickness and epidemic as causes for removal, transport by lakatoi to Poreporena,
    the building of houses, gardens, a dubu, and tabu feasts. It then describes Koita
    village sizes, house forms, former tree-house refuges, relations with Motu settlements,
    intermarriage and borrowing of Motu practices, inland and coastal village layouts,
    and the composition and naming of the Poreporena village system.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Koita group was led by Ova Abau in a migration to Nara, lived inland at
    Sobu Kau', and moved again after sickness killed many children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After moving to Obo on the Nara beach, the group signalled returning lakatoi
