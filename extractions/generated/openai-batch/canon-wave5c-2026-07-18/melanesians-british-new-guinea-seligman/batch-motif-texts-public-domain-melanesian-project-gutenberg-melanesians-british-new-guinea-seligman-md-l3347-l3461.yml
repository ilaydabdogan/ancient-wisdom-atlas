  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Hohodai, gardens were made, a dubu was built, and Dubara iduhu held a tabu
    feast; the section later returned to Koke, held two tabu feasts there, and then
    returned to Hohodai after an epidemic.
  category: sequence
  evidence_refs:
  - ev:2
