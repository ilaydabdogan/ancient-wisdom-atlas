  summary: A chief addresses a widower whose wife has died and whose banana abstinence
    is being ended. The chief ritually handles bananas and areca nut, removes the
    widower's mourning gear, replaces it with ordinary male dress ornaments, and announces
    that he may again use specific adornments and let his hair grow.
