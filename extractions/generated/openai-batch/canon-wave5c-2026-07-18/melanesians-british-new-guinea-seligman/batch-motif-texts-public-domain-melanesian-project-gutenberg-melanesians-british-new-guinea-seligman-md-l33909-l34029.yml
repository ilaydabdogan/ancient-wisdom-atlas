canonical_text:
  quote: ''
  summary: The passage describes funeral and burial practices in parts of the southern
    Massim area, including hamlet burial grounds, rules for burying visitors and clan
    outsiders, disturbance and reburial of remains, visible grave features, and evidence
    for partial exhumation involving skulls placed in rock crevasses or retained remains
    of loved relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that inhumation practices at Wagawaga, Tubetube, and Bartle
    Bay had been substantially modified by Government action.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before Government-enforced cemetery burial, graves in much of the south-eastern
    district, including Wagawaga and Tubetube, were dug on hamlet outskirts and sometimes
    very close to houses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In ordinary circumstances, members of a hamlet were buried in that hamlet’s
    burial area, except when death occurred away from the hamlet and the body could
    not be brought back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dead visitor was taken back to his own hamlet if possible; if not, he might
    be buried in any hamlet of his own clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Visitors whose clans were not represented in the hamlet-group were either
    taken back to their own community or buried at some distance from the hamlet-group
    graves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because burial space in each hamlet was small, earlier burials were often
    disturbed, and remains were handled and reburied in the new grave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes these burial sites as hamlet-graves and compares them
    functionally to family burial plots and vaults elsewhere.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old graves could be indicated by heaps of stones with shrubs or by shrubs
    on otherwise cleared ground; the passage says these signs were not intentionally
    made as grave markers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Teste Island grave is described as fenced, with no roof in contemporary
    Tubetube practice, and with a young coconut palm likely grown from coconuts placed
    on posts around the grave.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author distinguishes the exhumation discussed here from sporadic corpse-eating
    and asks how far ordinary exhumation prevailed among the southern Massim.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Thirty-four skulls were reportedly obtained from a place called a cave at
    Awaiama in Chad’s Bay; the author believed the place was really a rock crevasse,
    and no long bones or other bones were seen with the skulls by the collector.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A place of skulls called moiaru at Gogowari on Rogea is described as a deep
    rock crevasse where skulls are or formerly were deposited.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mr Abel interpreted the removal of skulls from graves and their deposition
    in such places as a sign of love or friendship.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A man of Farm Bay is said to have kept the dried body of his son in his house
    because he loved him dearly.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Bodies are described as buried upright in a squatting posture, with the head
    only a little below the surface, making skull removal after decay easy.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: The author concludes that partial exhumation is not necessarily alien to southern
    Massim beliefs and customs, but does not think it is general throughout the district.
  category: other
  evidence_refs:
  - ev:12
- id: obs:17
  text: A footnote reports that in the folk tale Tanoduya, the body of a foreign woman
    who married into the community is taken up a hillside and left under a rock rather
    than buried in the hamlet.
  category: action
  evidence_refs:
  - ev:13
