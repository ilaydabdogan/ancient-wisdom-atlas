  summary: The passage reports Koita and Motu omens, mostly connected with hunting
    and fishing. It lists favorable and unfavorable signs involving fish, birds, right
    and left sides or feet, and sneezing; states that birds and fish may be sent by
    spirits of dead tribesmen; notes a nearby Sinaugolo practice of invoking ancestors;
    includes a footnote on a Papalau as healer, diviner, and charm worker; and describes
    death omens and practical bird warnings of strangers in the bush.
