canonical_text:
  quote: ''
  summary: 'The passage describes Mekeo chieftainship: high chiefs, war chiefs, expert
    offices, the lopia ekei assistant role, ceremonial precedence at feasts, chiefly
    ornaments and insignia, loyalty to chiefly families, and an account of a Walaka
    chief who resigned after a breach of ceremonial food presentation obligations.'
  language: English with Mekeo and Roro terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each clan is said to have, or ideally to have, two chiefs ranked as lopia
    fda and io lopia, described as high chief and war chief respectively.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes faia lopia as departmental experts who exercise powers
    to give victory to the community rather than for gain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lopia ekei is described as the head-man or leader of the ekei section
    and as a henchman of the lopia fda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In small or weak pangua, war chiefs may be absent, or the high-chief and war-leader
    functions may be united in one man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The lopia fda has certain rights that he does not delegate to the lopia ekei;
    if he is ill, a substitute is chosen from his own family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: At clan feasts, the lopia fda takes precedence, while the lopia ekei carries
    and spreads a bread-fruit bast-cloth seat for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The lopia ekei receives gifts of food, especially pork, passes them to the
    high chief, sits at the high chief's left, and acts as spectator or assistant
    in ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At big feasts, each lopia fda carries a special lime gourd called faonga and
    makes a rattling noise with a grooved lime spatula.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The faonga is described as larger than ordinary lime gourds, covered with
    dark wax, studded with animal teeth, kept wrapped in the ufu, and brought out
    only for ceremonial occasions.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mekeo chiefs also wear the lopia pao, identified in the passage as an ornament
    called eai rove by Roro-speaking tribes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage reports affectionate consideration for lopia fda chiefs, loyalty
    by closely related ikupu, and recognition of the pre-eminence of chiefly families.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A former Walaka lopia fda resigned and left his village after his wife secretly
    reserved a pig joint that should have been ceremonially presented to guests.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: After the resignation, the nobility of the former chief's family continued
    to be recognized, and the descendant's name was linked with the present chief
    in ceremonial name-calling.
  category: sequence
  evidence_refs:
  - ev:12
