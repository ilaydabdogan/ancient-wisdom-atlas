canonical_text:
  quote: ''
  summary: 'The passage describes Koita, Motu, Kabadi, Porebada, Boera, Gulf, Koiari,
    and Kilakila conflict practices: avoidance of pitched battle, allied raids, warnings
    to friends before attacks, treatment of accidental homicide, payment of heni as
    blood price, and a note on heni as a first-born-child ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Koita tactics, like those of their opponents, avoided pitched
    battles, but that Koita fought well when cornered and made daylight counter-attacks
    when sufficiently provoked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Koita and Motu sometimes joined together and that Koita-Motu
    settlements could act as a single fighting unit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A reported fight between Poreporena and Boera began after Boera men insulted
    and beat Porebada men who were fishing near Boera.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Porebada men went to Poreporena for help, Gulf natives at Poreporena joined
    the party, and an attack was planned and carried out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The attacking force against Boera was divided, with half going by land and
    half by canoes by sea, catching the Boera people between the two forces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An individual in an attacking party might warn special friends or members
    of his iduhu in the threatened village and advise them to leave quietly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says such an informer was not punished or regarded as a traitor,
    and that warned individuals or families often kept the warning to themselves.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Accidental homicide within a tribe might cause loud talk but not war, and
    payment would be accepted for the dead person.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If an accidental homicide victim belonged to another tribe, the blood price
    called heni could be refused and war could result, though matters were generally
    settled peaceably.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Daure Garia accidentally struck Magani Numuru in the neck with a spear while
    throwing at a wallaby, and Numuru died soon afterward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Koiari debated whether to kill Daure Garia or settle amicably, and the
    peace party prevailed with agreement to accept heni.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Daure Garia was sent from Kilakila to Hohodai to stay under the protection
    of his clansman Taubada.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The heni accepted by the Koiari included one big pig and more than ten valuable
    articles, including toia, doa, tautau, mairi, and dodoma.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says that if the heni had not been accepted, a vendetta would
    have arisen, since a homicide was never given up to another tribe.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A footnote says heni is also the name of a ceremony after the birth of a first-born
