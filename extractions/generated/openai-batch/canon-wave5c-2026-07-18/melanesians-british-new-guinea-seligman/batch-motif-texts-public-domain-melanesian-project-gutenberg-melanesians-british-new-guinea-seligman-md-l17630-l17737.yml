  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The men of Amoamo are said to have selected the palm funguka as their kangakanga
    because of the strength and toughness of its wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the cock-origin story, the fowl and megapode once lived together in the
    bush; the fowl left eggs exposed, predators ate them, and the birds came nearer
    to villages for protection.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men adopted a special arrangement of cock feathers as kangakanga after noticing
    the beauty of the birds' feathers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One kangakanga is linked to a particular two-headed im'du palm rather than
    to the ordinary palm species.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A legend explains kefe and auau ornament-badges by saying that a woman at
