canonical_text:
  quote: ''
  summary: The passage describes kangakanga as clan-badges made from or associated
    with ornaments, animals, plants, or distinctive features. It records clan restrictions
    on eating or killing badge-associated animals, possible consequences for violations,
    uncertain origins, and several origin explanations, including adoption of cock
    feathers, selection of strong or unusual palms, and a girl born with shell ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A kangakanga may consist of a special arrangement of ornaments, including
    combinations of fretted turtle-shell ornaments called kefe or Conus shell armlets
    worn on one arm.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states a general rule that an animal providing a kangakanga may
    be killed but not eaten, while also giving exceptions among named clans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For some clans, eating a forbidden kangakanga-associated animal or plant is
    said to bring harm not only to the individual but also to other clan members.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Married women may eat the animals from which their husbands' kangakanga are
    derived and may receive such flesh from their husbands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says no general statement can be made about the origin of kangakanga,
    which are described as old-time fashion and sometimes considered less ancient
