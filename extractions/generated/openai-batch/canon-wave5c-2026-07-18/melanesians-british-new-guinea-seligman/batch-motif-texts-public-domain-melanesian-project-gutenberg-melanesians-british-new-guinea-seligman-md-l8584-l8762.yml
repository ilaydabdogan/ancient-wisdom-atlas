canonical_text:
  quote: ''
  summary: The passage describes the hekarai as a rare ceremonial feast or series
    of feasts organized through friendly rivalry between two important men and their
    supporters. The ceremony includes a challenge by boasting, a meeting at a small
    fire, reciprocal food gifts, construction of a pole display called geva, collection
    and display of bananas, night guarding of the displayed food, creation of large
    food piles called tarirako, exchange of valuables, wallaby hunting, judging of
    banana quantities, and further compensatory exchanges if quantities are unequal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hekarai is described as a feast or series of feasts brought about by deliberate
    but friendly rivalry between two important men, with no animosity between the
    protagonists or their followers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahuia recalled one rare hekarai involving Taubada and Hedu Ramika.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The challenger boasts of having a better garden with more food, then descends
    from his house platform, makes a small fire, sits by it, and smokes; the challenged
    man joins him by the fire, and supporters of both men gather and smoke.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: For about six days the two rivals exchange food presents, each being expected
    to return a similar quantity and kind as soon as possible; the food is politely
    given, received, and eaten by the recipient and his family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A structure called geva is built from vertical poles set along one side of
    the village street, with horizontal poles lashed between them six or eight feet
    above the ground.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rivals collect bananas from their own gardens and their friends' gardens,
    and most villagers join one of the two parties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each party hangs bananas at one end of the geva, marks where its bananas end,
    and leaves the bananas there for one or two days while youths watch at night to
    prevent opponents from moving bananas to their own side.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: At the feast each rival makes a large pile called tarirako from bananas and
    sugar cane, exchanges valuable property with the other rival, and tries to meet
    and outdo the other; no pigs are killed, while hunting parties bring wallaby.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the two banana piles are judged equal, the hekarai ends; if they are unequal,
    another hekarai must be held, and this may repeat until equal numbers of bananas
    are provided.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Yams are also heaped by the rivals, but only bananas count in deciding whether
    the hekarai is final; the man with fewer yams is expected to later present enough
    yams to equal the difference.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A drawing sent by Ahuia is said to show streamers, probably iduhu dagina,
    that resemble pepe displayed on lakatoi; another drawing shows men standing on
    the banana support.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
