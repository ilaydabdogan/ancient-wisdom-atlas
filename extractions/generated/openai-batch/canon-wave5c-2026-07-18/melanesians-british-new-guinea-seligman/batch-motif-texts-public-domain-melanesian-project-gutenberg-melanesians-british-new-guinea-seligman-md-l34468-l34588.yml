canonical_text:
  quote: ''
  summary: The passage describes Wagawaga and Tubetube mourning practices. Widows,
    widowers, children, and other kin blacken their bodies, wear specified mourning
    ornaments or garments, observe food and movement restrictions, remain secluded
    or avoid ordinary routes, and later re-enter ordinary activity through funeral
    feasts or removal of mourning. It also includes a Dogura note about all-night
    wailing and fear of parauma after a death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, three or four days after her husband's death, a widow blackens
    her body with soot and coconut oil and puts on specified neck, arm, and petticoat
    mourning items.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, until the first banahivi, the widow remains in the house or avoids
    ordinary paths and people; after it she resumes mixing with others, fetching water,
    and gardening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, the widow keeps mourning until the last banahivi and may not
    eat taro, pig, or kangaroo during that period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Wagawaga, children of the deceased wear mourning ornaments and blacken
    themselves until the last banahivi; sons wear an old fishing-net perineal bandage,
    while children continue to use nearby tracks normally.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Wagawaga, a man avoids produce from his dead father's hamlet for life and
    generally avoids its potuma and hamlet space, sometimes taking the seashore instead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Wagawaga, the father, mother, brothers, and sisters of the deceased follow
    different mourning rules for blackening, armlets, necklaces, food restrictions,
    and use of common tracks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Wagawaga, children of a dead mother go to their mother's hamlet after the
    first banahivi; black is not worn for a mother, but both sexes wear armlets and
    necklaces until the last banahivi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Wagawaga, a widower observes the same food taboo as a widow, blackens himself,
    and wears mourning items until the last banahivi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A note about Dogura reports that relations wailed all night before a woman's
    body was taken away, and that most others avoided Dogura because parauma were
    said to be numerous and active there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Tubetube, the widow and children remain in the house until the first funeral
    feast; elder children and the widow remain secluded while the gariauuna remain
    on the grave and go out by the back of the house when necessary.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Tubetube, the widow must wrap herself in a daam mat when going out, leaving
    only a small part of her face visible.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Tubetube, on the second or third day after burial, the widow and children
    blacken themselves, abstain from fish, taro, and pig, and remain secluded until
    the gariauuna leave the grave.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: At Tubetube, after the first kanekapu ceremony, the widow and children may
    mix with others, and the widow may return to her own hamlet if she had been living
    in her husband's hamlet.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: At Tubetube, the widow continues to wear mourning items and black paint for
    months, may not wash in fresh or salt water, and ends mourning when a male and
    female affinal kin sequence strips the widow and children of mourning near the
    grave.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: At Tubetube, the widow's long petticoat is cut short at the side of the grave,
    and the severed pieces are hung on the grave fence; the passage says the reason
    was not ascertained.
  category: action
  evidence_refs:
  - ev:12
