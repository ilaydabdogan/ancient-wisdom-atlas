  summary: 'The passage records song texts, gives brief linguistic comments attributed
    to S. H. Ray, and describes Koita dances: slow parallel-column movements, participation
    by men and unmarried girls, male use of drums or bamboo dancing sticks, highly
    regular rhythm, movements of girl dancers, comparison with Motu dances, and the
    Maginogo bamboo dance among the Hohodai Koita.'
  language: English prose with untranslated song text as printed; Ray's notes mention
