canonical_text:
  quote: ''
  summary: The passage analyzes whether ufuapie group membership is related to shared
    or different iauafangai and ngopu origin. It reports a native historical account
    in which the original Vee and Biofa settlements each had two ngopu groups, with
    each pair standing as ufuapie to the other. The author then compares this model
    with contemporary Vee/Rarai and smaller village arrangements, excluding immigrant
    stocks from the main reconstruction.
  language: English with Mekeo terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames a question about whether units forming an ufuapie group
    usually share a common iauafangai, choose groups with a different iauafangai,
    or ignore iauafangai in choosing ufuapie.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that, if immigrant pangua are neglected, pangua with common
    iauafangai have a common origin and together form a ngopu group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The original Vee and Biofa settlements, loiofaopo and loiovina, are said to
    have been in open country on the left bank of the St Joseph River, between present
    Oriropetana and Bebeo.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Informants state that at that time both Biofa and Vee had two ngopu groups,
    and that each pair of ngopu groups was ufuapie to the other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The named Biofa ngopu groups were Inawi and Inawae; the named Vee ngopu groups
    were Ngangai and Kuapengi.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author concludes that natives hold the original ufuapie groups to have
    been the inhabitants of single villages, each village having two stocks or ngopu
    groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because each stock is said to have had its own iauafangai, people who were
    ufuapie to one another were necessarily of different stocks and had different
    iauafangai.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When immigrant stocks are excluded, conditions at Rarai are described as almost
    exactly matching the hypothesis based on native history.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In smaller villages, some pangua are described as ufuapie to pangua belonging
