canonical_text:
  quote: ''
  summary: The passage describes ordinary friendship within sections and villages,
    hereditary friendships between families, the vasila relationship formed by discussion
    and shared smoking and betel chewing, and the closer henamo bond formed through
    same-day birth, reciprocal gifts, shared upbringing, kin-term extension, restrictions
    concerning sisters, blood-feud precedence, and companionate sharing, hunting,
    fishing, and fighting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of a section generally know and maintain friendly relations with other
    members of their own sex, while taking little public notice of women or girls
    not closely related to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain families maintain traditional and hereditary friendships with other
    families, including families in villages little known to them or formerly hostile
    to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vasila are specially good friends; a man may have any number of them and stays
    with his vasila when visiting other villages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vasila relationship is entered into after discussion by the contracting
    parties and consists ceremonially of formally smoking and chewing betel together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The main text states that a man does not marry or have connection with the
    sister of his vasila, while a footnote reports Captain Barton's correction that
    marriage may occur but non-marital connection does not.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:6
  text: The henamo bond is described as closer than vasila and, strictly, can exist
    between children of the same sex born on the same day in certain villages when
    their fathers exchanged presents at birth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The term henamo is also used more loosely by children at play and by Motu
    boys for men with whom they became friends during visits to eastern islands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Boys going on a hiri together may become fast friends and, after exchanging
    gifts, consider themselves henamo in the strict sense.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage lists villages whose people are said to be capable of becoming
    reciprocally henamo, and states that Motu and Koita may be united in this bond.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Soon after the birth of possible henamo, one father gives the other a dog,
    pig, or armshell; a return present of equal value, usually of the same kind, is
    made.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: As far as circumstances allow, henamo children play and grow up together,
    and they may receive their first sihi from the maternal uncle of one of them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ahuia and Waigamu are given as an example of henamo who received their sihi
    from Waigamu's maternal uncle; afterward Ahuia used the term raimu for this man
    and used his own kinship terms for his henamo's relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man may not marry or have connection with the sister of his henamo, and
    in following a blood feud a henamo takes precedence over the dead man's brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Girls may become henamo in the same way as boys, but the relationship is described
    as less serious and often lapses when one party marries.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'Henamo are described as mates in every way: they share food, go hunting and
    fishing together, and in battle stay side by side as far as possible.'
  category: action
  evidence_refs:
  - ev:9
