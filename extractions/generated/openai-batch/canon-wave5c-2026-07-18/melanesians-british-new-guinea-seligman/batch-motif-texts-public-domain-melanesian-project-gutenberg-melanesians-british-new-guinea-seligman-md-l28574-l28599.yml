  summary: The passage describes age-based restrictions on children eating turtle
    and certain fish, the teaching of a child's totems by the mother at about seven
    or eight years old, boys assuming a perineal bandage and girls petticoats without
    ceremony, and a note on ear and nasal perforation including an anecdote about
    a boy seeking ear perforation to avoid being mocked as a wild or bush pig.
