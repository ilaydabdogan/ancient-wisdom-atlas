canonical_text:
  quote: put away all the spears so that there be no more war
  summary: The passage describes a witnessed kabilula peace and atonement ceremony.
    Taolu, wearing sacred royal emblems and accompanied by armed followers, is formally
    acknowledged as guiau. Chiefs exchange valuables as atonement and return gifts,
    speeches settle grievances from fighting, tobacco is accepted for a pipe of peace,
    and Taolu's people later return to their villages with help from former enemies.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Taolu arrived at Obweria with a numerous armed retinue, while he himself carried
    no weapons and wore ornaments including sacred royal armlets and wristlets formerly
    held by Enamakala and predecessors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kunol, a Tilataula chief, formally received Taolu by jumping and gesticulating
    while addressing Taolu and acknowledging him as guiau in succession to Enamakala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kunol said the people had had enough fighting, that atonement was ready, and
    that Taolu should make peace, return to Omarakana, rule as guiau, and put away
    the spears.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kunol struck his forehead as a pledge to defend from danger, then grasped
    Taolu's hand and drew him toward the path to Kabwaku while the gathered men acclaimed
    Taolu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The procession to Kabwaku was led by warriors and a sorcerer whose incantations
    were said to clear the path of evil spirits; women followed carrying appeasing
    gifts, with chiefs, more warriors, and the crowd behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Kabwaku a circle was formed in front of Moliasi's house, with armed men
    around it, Moliasi and chiefs at one end, and Taolu and his friends at the other.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Taolu repeatedly entered the ring carrying a single valuable, laid it on the
    ground as atonement for a named chief, and between thirty and forty valuables
    were presented and received.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The valuables presented included armlets, old stone tomahawks, and necklaces
    of native money.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Taolu made a speech saying he was weakened by Enamakala's death, that he had
    brought his own valuables as lula, and asking permission for his people to return
    to their villages, put away spears, and work gardens for food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Moliasi and the other Tilataula chiefs presented return lula to Taolu, item
    for item, matching the valuables they had received, and then made speeches accepting
    Taolu as guiau.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Meiosivalu said he remembered the deaths of relatives and the burning of his
    home, had fought to take payment for this, and regarded the present kabilula as
    settling all.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Taolu held up a stick of tobacco and asked who would distribute it so that
    they could smoke a pipe of peace together; acceptance of the tobacco completed
    the kabilula.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: About a fortnight later Taolu and his people settled again in their villages,
