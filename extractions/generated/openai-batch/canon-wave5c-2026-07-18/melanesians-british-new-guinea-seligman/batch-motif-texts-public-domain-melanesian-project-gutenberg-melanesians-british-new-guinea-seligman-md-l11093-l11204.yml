canonical_text:
  quote: ''
  summary: The passage defines terms for shadow, reflection, soul, ghost, and vital
    essence; describes Koita, Motu, and related beliefs about spirits after death;
    gives an account of the Koita mountain Idu as a destination for shades; describes
    object-souls, haunting, dream-vision, temporary soul absence, sneezing as a sign
    of soul return, a reported fraudulent ghost evocation, and an etiological story
    explaining why dead spirits no longer return bodily.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's shadow is called va^Hva, with Motu laulau given in parentheses, and
    the same word is applied to reflection in water, photograph, or mirror image.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sua, with Motu lauma given in parentheses, is described as something that
    leaves a person at death and then has an independent existence as ghost or shade.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sua may temporarily leave the body or be enticed from it; its absence causes
    sickness and, if prolonged, death, and harm done to the sua is reproduced in the
    person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Animals are said to have no sua; a reported Motu classification says pigs,
    dogs, and wallaby have laulauma but no lauma, and when they die it is their end.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports that a magical ceremony was explained as giving the sua
    of armshells and other valuables to an offended spiritual agency.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Koita sua go to a mountain called Idu; Koiari and Motu shades are said to
    go elsewhere.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: On Idu, sua lead a life resembling earthly life, and good and bad, strong
    and weak, warrior and child are said to fare alike.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: If a body is buried with its nasal septum unpierced, the sua must wear a creature
    called tehena as a nose ornament, and a postmortem operation would be performed
    for a Koita who died with an unpierced septum.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When a man dies, his sua goes immediately to Idu and quickly returns with
    other sua to carry away the sua of objects cared for by the dead man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sua of articles ceremonially destroyed at death are said to exist on Idu,
    and sua there have gardens, houses, and wives.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sua live on Idu for an unknown period longer than a human life, then weaken
    and utterly cease to exist; some Gaile men suggested this might happen when their
    names are forgotten on earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Sua are seen in dreams, and some men described as likely to be called sorcerers
    can see them while awake; sua frequently return to villages and haunt the place
    of death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In 1900 four Motuan girls persuaded many Port Moresby people that they could
    make a dead youth named Tamasi appear bodily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Tamasi's mother and relatives paid native money for the evocation, and relatives
    and friends waited in a house at Taora for his appearance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The apparent Tamasi went around shaking hands until Lario held the incarnation
    and Teina Materua struck a light; the supposed dead man was then identified as
    the Hanuabada girl Mea.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: Mea was brought before a Magistrate's Court and punished with a short term
    of imprisonment for practicing sorcery, and payments made to her were collected
    by the Magistrate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Sua may leave the body during sleep; if a person wakes before the sua has
    returned, he will probably become sick.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Sneezing is described as a sign that the sua has returned, while not sneezing
    for many weeks is called a bad sign that the sua has gone far away.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:19
  text: A story says a dead man's sua returned to his wife in an early state of decay
    and told her to boil water and wash him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: The wife was too afraid to wash the returning sua; the sua said that if she
    had obeyed, other sua could have returned bodily, but because she did not, this
    could never happen.
  category: sequence
  evidence_refs:
  - ev:9
