- id: claim:2
  claim: 'The passage gives a cautious linguistic and conceptual comparison between
    Koita sua and Motu lauma or laulauma: sua and lauma are associated with ghost
    or soul, while laulauma is associated with shadow or image and is said to persist
    only without separate existence for some animals.'
  claim_level: linguistic_similarity
  target: Koita sua and Motu lauma/laulauma terminology
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides reported glosses and examples, not a full linguistic
    analysis.
