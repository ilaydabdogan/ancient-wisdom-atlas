candidate_motifs:
- id: motif:1
  label: Detachable soul whose absence causes illness
  taxonomy_refs: []
  basis: Sua can temporarily leave or be enticed from the body; sickness or death
    follows if absence is prolonged, and sneezing marks its return.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The passage reports local terminology and beliefs but does not present
    a narrative episode except in the sleep and sneezing explanation.
- id: motif:2
  label: Mountain destination of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: Koita sua go to the mountain Idu after death, with Koiari and Motu shades
    said to go elsewhere.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only the Koita destination is named and described in detail.
- id: motif:3
  label: Afterlife as continuation of earthly life
  taxonomy_refs:
  - afterlife_journey_map
  basis: Sua on Idu have gardens, houses, wives, habits, and amusements like mankind,
    and live for a period longer than human life.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage also states that this existence eventually ends.
- id: motif:4
  label: Object-souls accompany the dead
  taxonomy_refs: []
  basis: The newly dead returns from Idu with other sua to carry away the sua of cared-for
    objects, and ceremonially destroyed articles have sua on Idu.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not give a separate mythic narrative for the origin of
    this practice.
- id: motif:5
  label: Postmortem correction of bodily defect for afterlife condition
  taxonomy_refs: []
  basis: A Koita dying with an unpierced septum would receive a postmortem operation
    so the sua would not have to wear tehena as a nose ornament.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is described as mortuary practice rather than a full narrative motif.
- id: motif:6
  label: Eventual extinction of shades
  taxonomy_refs: []
  basis: Sua live on Idu for an unknown period, weaken, and utterly cease to exist;
    loss of names and memory on earth is suggested as connected to disappearance.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The relationship between being forgotten and ceasing to exist is presented
    as a suggestion by discussants, not a settled doctrine.
- id: motif:7
  label: Ghosts visible in dreams or to specialists and haunting death places
  taxonomy_refs: []
  basis: Sua are seen in dreams and by a few waking specialists, return to villages,
    and haunt the place of death.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage notes inconsistency or indefiniteness about whether sua are
    seen while awake.
- id: motif:8
  label: False embodied ghost exposed by physical test
  taxonomy_refs: []
  basis: An apparent incarnation of Tamasi shook hands with relatives, was held, illuminated,
    and exposed as Mea.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a reported historical anecdote about deception, not a traditional
    mythic episode.
- id: motif:9
  label: Failed bodily return of the dead through refused washing
  taxonomy_refs:
  - resurrection
  basis: A decaying dead man's sua asked his wife to boil water and wash him; he said
    that if she had obeyed, other sua could return in bodily form, but now they cannot.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage describes an etiological failure of bodily return, not an
    accomplished resurrection.
comparison_claims:
- id: claim:1
  claim: The passage presents Koita, Koiari, and Motu shades as having postmortem
    destinations, while distinguishing the Koita destination Idu from unspecified
    places for Koiari and Motu shades.
  claim_level: same_function
  target: Koita, Koiari, and Motu shade destinations
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
