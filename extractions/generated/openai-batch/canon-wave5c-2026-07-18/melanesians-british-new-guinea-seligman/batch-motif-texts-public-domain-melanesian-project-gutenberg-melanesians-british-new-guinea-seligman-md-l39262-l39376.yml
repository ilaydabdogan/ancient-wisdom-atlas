canonical_text:
  quote: ''
  summary: The passage describes Northern Massim and Trobriand burial and mourning
    practices, including a note on Murua exhumation and skull preservation, Trobriand
    corpse decoration and burial, funeral food distribution, mourning dress and blackening,
    restrictions and avoidances, and the roles of relatives by marriage and totemic
    relatives in burial and feasting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the most striking Northern Massim funeral feature earlier
    noted for Murua was exhumation and careful preservation of the skull and some
    other bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Trobriands, a man was generally buried on the morning after death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dead man was marked with a black band on the forehead, decorated with shell
    ornaments, and given a new perineal bandage before burial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lubai prepared the body, were said to dig the grave, remove ornaments
    before burial, and sometimes build a small house above the grave.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Dead bodies had been buried in the village, and one explanation given was
    respect rather than burial in the bush.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before burial, women of the village wailed almost continuously, and men showed
    grief by pressing their noses, sniffing, and throwing nasal mucus on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a man died, yams stored in his yam house were distributed to near relatives
    of his own totem for the funeral feast, and several coconut trees were cut down
    by close relatives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dead man's brothers and sisters' children made a pretence of cutting down
    his house and yam houses, but other relatives stopped them after limited defacement.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After burial, food provided by near relatives of the deceased's own totem
    was eaten by other clans of the village in a feast called sagali.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The widow, children, and father of a dead man blackened themselves before
    the sagali feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Until the sagali feast was over, other men of the village were not to sit
    on ceremonial platforms called boimaviaka.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a village chief died, clansmen from neighbouring villages brought food
    to the burial feast in the central dancing space of the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A widow's hair was cut; she wore a long mourning petticoat, neck ornament,
    leglets, and armlets for a period said to be about ten months.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the end of a widow's mourning, her husband's sisters removed or altered
    her mourning garments, after which she went to the seashore and washed herself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The dead man's children had their hair cut, were smeared with black pigment,
    wore a mourning necklet, and avoided fish and yams for a stated period.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When a woman died, her lubai, identified here as her husband's brothers and
    possibly her father, dug the grave and buried her.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: After a woman's burial, the sagali feast took place, with most food provided
    by her mother, maternal uncle, and sisters and eaten by people not of her totem.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: A widower blackened himself and wore mourning gear for his dead wife, with
    some or all gear given by his dead wife's sisters.
  category: action
  evidence_refs:
  - ev:11
