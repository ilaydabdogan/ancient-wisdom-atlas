  quote: ''
  summary: The passage reports blood marks after a night departure and news from Makibiri
    that a dead man belonged there. It then recounts Ahuia seeing six vata enter a
    hunting camp at night; one stole wallaby from a smoking platform, and Ahuia failed
    to catch him. Ahuia later said Kunia told him they were vata. The passage also
    reports Romilly's reference to three spirits, Devase, Horumagi, and the female
    spirit V^aganamagi, invoked by an old woman called Papalau to cure disease.
