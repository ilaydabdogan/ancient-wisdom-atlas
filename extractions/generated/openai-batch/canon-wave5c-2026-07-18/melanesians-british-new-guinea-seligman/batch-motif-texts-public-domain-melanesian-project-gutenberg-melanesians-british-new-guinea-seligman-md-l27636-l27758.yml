canonical_text:
  quote: ''
  summary: The passage describes the eriam relationship in Wedau and Wamira, including
    marital-access rules, mutual help, inheritance of the relationship, mourning obligations,
    kimta eating arrangements, and differences among neighboring villages regarding
    the scope of eriam rights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eriam relationship is described as including a man's access to the wife
    of his eriam and duties and privileges of mutual help.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Wedau, eriam relationships are said to follow marriage-like limitations
    involving clan membership and the clans of wives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man may be eriam to a man of a younger kimta, but more often to men of his
    own kimta.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eriam relationship is described as hereditary in the ordinary course,
    but it may be mutually dissolved, and new nonhereditary eriam relationships may
    be inaugurated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If one eriam partner is in want, the other feeds him; the passage says the
    needy man's wife initiates the request rather than the man himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If an eriam partner has several wives, the other partner's rights extend only
    to the first or one wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A wife mourns for her husband's eriam as for a near relation or as a widow,
    though a note says the mourning is shorter than a widow's.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wamira and Wedau kimta arrangements are said to be the same; unmarried women
    eat as one kimta, married women form kimta corresponding to their husbands, and
    kimta mates eat together ceremonially.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Wamira, the eriam relationship is said not to carry marital rights, and
    intercourse with the wife of one's eriam would be punished as ordinary adultery.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Wamira, a man may be eriam with men of other tribes, but this is said to
    imply only exchange of food and other presents.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage reports that the marital-rights custom came from Boianai to Wedau
    and did not reach Wamira.
  category: sequence
  evidence_refs:
  - ev:9
