canonical_text:
  quote: ''
  summary: 'Ethnographic account of Roro marriage practice: marriage partners, collection
    and negotiation of bride-price, acceptance through chewing divided areca nut,
    wedding-day mock assault and capture of the bride, procession to the bridegroom''s
    father''s house, ritual concealment and decoration of the bridegroom, public recognition
    of the marriage, and initial avoidance between bride and bridegroom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro men generally took wives from their own or other Roro villages, with
    some marriages to neighboring groups; such outside marriages are said to have
    become somewhat more common in recent years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a youth is ready to marry, his father asks members of his local group
    to help collect the bride-price for his son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy's father brings the bride-price with two or three companions to the
    house of the girl's father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bride-price is laid out on the verandah, while the boy's party sits silently
    and leaves the next move to the girl's father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The presented items include shell ornaments or currency, bird feathers, dancing
    petticoats, and always a panicle of ripe areca nut.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl's family criticizes the presents without touching them, because touching
    would imply acceptance before bargaining is complete.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the girl's family opposes the marriage in theory, they retire into the
    house without speech and the boy's people go home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If agreement is reached, the girl's father heaps the bride-price, halves an
    areca nut with his teeth, and gives one half to the bridegroom's father.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After both contracting parties chew their halves of the nut, the relatives
    of the bride and bridegroom smoke and chew together and discuss the marriage feast.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the boy's relatives leave, the bride's father distributes the bride-price
    among his relatives and local-group members.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the wedding day men of the bridegroom's local group, excluding the bridegroom,
    surround the house of the girl's parents and carry it by mimic assault.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The bride runs away, is soon overtaken and caught, and resists with hands,
    feet, and teeth.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A sham fight occurs between adherents of the bride and bridegroom.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The bride's mother uses a wooden club or digging stick to strike inanimate
    objects, curses the ravishers, and then collapses weeping for her child.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The bride's mother is expected to maintain extravagant grief for three days
    and does not accompany the bride to her father-in-law's house.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: Members of both local groups accompany the bride in procession, while her
    kin advise her and young female friends express regret for her future absence
    from dances.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: When the bridegroom sees the procession, he hides in the marea, but the ibitoe
    drag him out, decorate him, and bring him to his father's house.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:18
  text: The bridegroom is seated near the bride while onlookers publicly call out
    that the named pair is married.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:19
  text: The passage states that this public announcement constitutes formal recognition
    of the marriage by the tribe.
  category: other
  evidence_refs:
  - ev:17
- id: obs:20
  text: The bride and bridegroom initially take no notice of each other; in the evening
    the bridegroom sleeps in the marea and the bride sleeps in her father-in-law's
    house.
  category: sequence
  evidence_refs:
  - ev:18
