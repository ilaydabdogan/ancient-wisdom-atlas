canonical_text:
  quote: ''
  summary: The passage describes a class of oada/dada formerly associated with particular
    marea buildings rather than with their users. It lists carved planks, suspended
    eiei pots, painted designs, papares boards, snake carvings, and a human effigy
    with bow and arrow associated with named marea. One snake carving is said to represent
    Paipai, a shape-changing ancestor. The author also notes a possible Gulf/Elema
    connection for the papares board and says this class of dada was absent from war
    marea.
  language: English
