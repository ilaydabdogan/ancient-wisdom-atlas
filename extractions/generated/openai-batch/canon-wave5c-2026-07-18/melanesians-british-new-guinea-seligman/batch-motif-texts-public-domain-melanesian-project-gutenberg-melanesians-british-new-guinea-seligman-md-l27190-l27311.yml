canonical_text:
  quote: ''
  summary: The passage describes the eriam relationship at Wagawaga and Tubetube as
    a reciprocal bond between certain men, involving close friendship, practical help,
    kin-like address terms, and restrictions around wives, widows, sisters, and some
    affinal relatives. It then describes the Bartle Bay kimta as a same-sex age cohort
    or association, with rights to fellowship and help, regional recognition, naming
    by known members, and no formal admission or birth exchange.
  language: English
  quote_policy: summarized
