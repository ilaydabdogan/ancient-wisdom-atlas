canonical_text:
  quote: ''
  summary: 'The passage describes reported Massim-area beliefs and death customs:
    supernatural beings are believed but not worshipped; the dead pass beneath the
    earth to an other world where an old man receives and assigns them places; spirits
    of the dead are generally thought to remain apart from the living. It also describes
    mourning feasts, dissociation from the dead and their belongings, abandonment
    or destruction of death houses, avoidance of names and food associated with dead
    fathers, and a Tubetube incident in which a basket taken near a grave was refused
    as dangerous.'
  language: English
  quote_policy: summarized
