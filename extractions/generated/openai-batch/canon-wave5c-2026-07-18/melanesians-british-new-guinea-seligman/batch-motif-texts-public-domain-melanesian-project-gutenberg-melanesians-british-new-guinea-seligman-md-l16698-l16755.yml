- id: obs:2
  text: After each occasion, the masks were said to be burnt; all Elema villages have
    harihu, but they are said not to appear simultaneously in neighbouring villages.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dogs were medicined before hunting in a manner compared by the passage to
    a Koita practice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a dog to be successful in hunting wallaby, its owner is said to steal
    food and give it to the dog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the person whose food was stolen becomes angry, that anger is supposed
    to influence the dog and make it keen and fierce in hunting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Taboos are imposed on youths while making drums, and the passage identifies
    these as examples of sympathetic magic in the district.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note says that, if taken literally, each local group or itsubu may have
    one kaivakuku; Dr Strong was told that there were formerly twenty kah'akuku in
    Wamia, about the number of Waima settlements.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Siria, one love charm is made by mixing dried umbilical cord with tobacco
    the chosen girl will smoke, with lime she will use when chewing areca nut, or
    with dried powdered shark skull.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another love charm has the would-be lover hide in the bush where he can see
    the track on which he expects the girl to pass.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In that love charm, the lover has a germinating coconut and a sting ray spine;
    the young shoot is broken off, and when the girl approaches he thrusts the spine
    into the printed 'eve' of the coconut and moves it within the soft substance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The coconut-and-sting-ray charm is described as particularly efficacious,
    not widely known, and probably recently introduced.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sorcerers are said to use portions of the human body for magical purposes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A human penis enveloped in clay is described as a potent love charm kept by
    sorcerers; a youth may borrow it, wear it around his neck, and let the desired
    girl see it while he speaks to her.
  category: action
  evidence_refs:
  - ev:7
