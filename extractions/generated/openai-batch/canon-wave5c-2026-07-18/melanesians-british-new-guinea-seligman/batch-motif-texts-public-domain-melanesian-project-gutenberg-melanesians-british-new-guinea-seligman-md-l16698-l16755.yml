canonical_text:
  quote: ''
  summary: 'The passage describes distinctive harihu masks, sometimes bearing clan
    badges, which are said to be burned after each occasion and not to appear simultaneously
    in neighbouring villages. It then records several forms of minor magic: hunting
    dogs medicined before hunting and given stolen food so the victim''s anger will
    make them fierce; taboos on youths making drums as sympathetic magic; a note on
    local-group associations of kaivakuku/kah''akuku; and several love charms involving
    dried umbilical cord, tobacco, lime, powdered shark skull, a germinating coconut
    and sting ray spine, and a clay-covered human body part kept by sorcerers and
    worn by a youth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each harihu mask is said to differ from all others, and the owner's clan badge
    is often worked on the mask, though not necessarily required.
  category: attribute
  evidence_refs:
