canonical_text:
  quote: ''
  summary: 'An ethnographic description of taboo at Wagawaga and Tubetube: protected
    foods, garden produce, pigs, reefs, and fishing grounds are marked by visible
    signs; some signs are only warnings, while others are empowered by medicine or
    spells; old men or medicine specialists impose and remove certain taboos; and
    communal reef taboos regulate fishing and catch distribution.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga and Tubetube, the things described as reserved or specially protected
    are mainly foods, garden produce, fish on certain reefs, and at Wagawaga sometimes
    pigs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A taboo requires a visible sign affixed to the protected thing or placed nearby;
    such signs are called hato at Wagawaga and dederi in Tubetube.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The signs are said to have no force by themselves and to function as warnings
    that protection rests on an owner’s wish, public opinion, or medicine/magic.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the medicine was reputed to be made by certain old men regarded
    as sorcerers and paid for their services, though sorcery was denied because it
    was an indictable offence under the Government Code.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: One common Wagawaga sign is described as a sago or coconut leaf tied around
    a tree trunk; in theory this sign merely marks that an individual or group wants
    the tree’s produce protected.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A different sign, giribay, is a sago or coconut leaf knotted around a tree
    and smeared with medicine by an old man who recites the correct formulae, adding
    disease-producing power to the sign.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The magically empowered tree taboo is described as absolute and non-selective:
    the owner would suffer like a stranger if he infringed it and would not take fruit
    until the taboo was removed.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: After removing the taboo, the medicine man receives some fruit from the tree
    as payment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that this district does not show a system of personal-influence
    mana taboo in which contact with an individual dynamically charges the tabooed
    thing.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Reefs and fishing grounds near a hamlet are treated as that hamlet’s property,
    and the hamlet’s old men can protect them by a taboo valid against the whole hamlet-group.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: When no taboo sign is displayed on a reef, anyone may fish there regardless
    of hamlet rights.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: After a reef taboo is removed, men from other hamlets usually join the first
    fishing; the catch is brought to the hamlet with the taboo right, where an old
    man divides it into equal shares among participants.
  category: sequence
  evidence_refs:
  - ev:11
