canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions at a tabu feast centered
    on a dubu platform: food is displayed on and around the structure, pigs are killed,
    hosts decorate themselves, visitors enter after a conch signal, armed demonstrations
    are ritually checked with sugar cane, women and girls perform and present yams,
    and food is distributed to visitors through bags, ropes, and named presentations.
    Two smaller clan feasts follow, including consumption of reserved pig jaws and
    a later meal after decorations and food supports are dismantled.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young trees are planted around the dubu, sugar-cane palisades or bundles are
    set around or against it, and yams, bananas, coconuts, areca nut, and sugar cane
    are placed, hung, or piled on and around the structure.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the morning of the feast pigs are killed near the dubu, cut up, and their
    flesh is piled on the platform.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tabu biagu and his clansmen wash in the sea, paint and ornament themselves,
    assemble on the dubu, and eat a specially cooked portion of pig flesh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of neighbouring villages gather in the bush and may not enter the
    feast-giving village until the kibo conch shell is blown from the dubu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The visiting men are fully armed; fighting at this stage is said to be contrary
    to etiquette, although fights sometimes arose during entry in earlier times.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Visitors enter the village beating drums and brandishing spears and clubs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Couples of host men hold bundles of sugar cane and use them to knock down
    the visitors' spears and clubs; after this, continuing hostile demonstrations
    is not considered good form.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women come behind the sugar-cane-bearing men, swing their petticoats, and
    carry large yams which they present to the iduhu rohi and other important men
    of visiting villages.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Girls described as game, nana, or roro to the tabu biaguna climb the dubu
    posts or stand or cling near the carved capitals while swinging their petticoats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tabu biaguna calls visiting women to gather around the dubu, after which
    his clansmen descend and fill the visitors' large string bags with yams to overflowing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Important visiting men and adult male visitors receive pork tied to bananas,
    and later pork tied to fishing nets containing yams; the food is lowered by rope
    while names are called, with the second kind of bundle becoming reachable after
    the third call.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'After the visitors leave, two smaller feasts take place among the feast-giving
    clan or clans: one in which reserved pig lower jaws are eaten on the dubu, and
    another on the tabu biaguna''s verandah after decorations and remaining food supports
    are removed.'
  category: sequence
  evidence_refs:
  - ev:8
