canonical_text:
  quote: ''
  summary: 'The passage recounts actions of Oa Rove: an encounter in a house with
    a woman returning from water, enlargement of a wallaby by blowing on it, fishing
    by the Ethel or Ufafa river, creation of a hill near Eboa used for exposing the
    dead, possession of women sought by many peoples, distribution of weapons and
    sorcery to named groups, and the apparent transformation of women into other hills
    when thrown to their husbands.'
  language: English
  quote_policy: summarized
