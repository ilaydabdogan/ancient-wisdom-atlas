canonical_text:
  quote: ''
  summary: 'The passage describes place and name taboos: women are not allowed upon
    the dubu except during a tabu ceremony; certain localities associated with spiritual
    agencies called tabu are avoided by both sexes because visiting them might bring
    evil results; the names of such places are freely mentioned. It also states that
    there are no taboos on names of the dead, but some relatives and marriage connections
    are not addressed by name, and many younger men avoid saying their own names publicly.'
  language: English
  quote_policy: summarized
