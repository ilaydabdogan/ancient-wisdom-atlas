canonical_text:
  quote: ''
  summary: The passage describes girlhood status terms, the staged tattooing of girls
    among Roro-speaking tribes, the tools and pigment used, kin involvement, feasting,
    ornament display, temporary restrictions after facial tattooing, and the later
    status of being fit for matrimony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: There is no ceremony when a girl is first put into the kiva petticoat; the
    timing has no fixed age and depends on the child’s mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: From infancy until she is considered nubile through facial tattooing, a girl
    is called wawaho.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young girl accompanies her mother to the garden and gradually learns garden
    work and helps her mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women of the Roro-speaking tribes are described as tattooed from head to foot;
    tattooing begins at about five to ten years of age with the hands and arms.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Later tattooing is done on the belly, chest, and back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tattooing is performed by an old woman skilled in the art, generally a
    relative of the girl, and the tattooer is fed by the girl’s mother and apparently
    otherwise unpaid.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The pigment consists of pot-bottom soot mixed with a little water and applied
    with a frayed wooden fragment before being pricked in.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The pricking is done by tapping a wooden mallet on an instrument from which
    one or more thorns project.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the girl is considered marriageable, the buttocks, legs, and finally
    the face are tattooed; a small feast is given before work on the buttocks begins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the day the head and face are to be tattooed, the head is shaved and relatives
    set the date for a feast, usually five days later because soreness and crusts
    diminish by then.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the feast day, finishing touches are given, and that afternoon the girl
    is considered nubile and called waho.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The girl is ornamented with valuable shell and other ornaments that her family
    can borrow; both her father’s and mother’s clan lend valuables.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: No dance takes place at the feast, which is held in the girl’s father’s house;
    the girl may eat some food but is usually too sore to do more than taste it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Facial tattooing, especially around the lips, is described as extremely painful.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Decked in ornaments, the girl ceremonially parades up and down the centre
    of the village for a short time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: For five days after the feast she should sit for much of each day on the verandah
    of her father’s house while wearing all her ornaments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: During this period she is rove and may only walk down the village centre;
    she may not help in the garden, cook, fetch water, or touch food with her hands.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: During the rove period she must pick up food with a fork whose handle is wrapped
    in banana leaf.
  category: object
  evidence_refs:
  - ev:8
- id: obs:19
  text: After five days, ornaments borrowed from all except very near relatives are
    returned, while ornaments from her own people are kept.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: After the five-day period she may feed herself and help in the gardens, but
    still wears ornaments each afternoon, appears publicly, and joins dances.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: After four or five months, when her hair has grown again, she is considered
    fit for matrimony and her status term is buiapu at Waima.
  category: sequence
  evidence_refs:
  - ev:9
