canonical_text:
  quote: ''
  summary: The passage describes a formal peace-making between Wagawaga and Maivara
    involving armed canoes, deliberation, presentation and reciprocal return of valuables,
    and renewed visiting rights. It then describes Bartle Bay distinctions between
    neighbourly warfare and enemy warfare, including different treatment of the dead
    and wounded. The final section describes pre-battle preparations involving consumption
    of a foul concoction, drinking boiled chips of a named stone, and testing spears
    against a special coconut to identify lucky weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Formal peace-making was customary during severe inter-community feuds, and
    each side paid for those it had killed even when deaths were numerically even.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: About twenty Maivara canoes came to Wagawaga carrying spears and shields while
    proposing peace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Maivara canoes lined up silently in a single row across Discovery Bay,
    and older Wagawaga men went out to discuss whether there should be peace or war.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wagawaga quickly collected valuables including armshells, benam, samakupa,
    and bagi.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man from each Wagawaga hamlet called up a Maivara canoe, which was tied
    to a stake in the sand near the shore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wagawaga men walked into the water, presented valuables to the called canoes,
    sat briefly in the canoes, and provided young coconuts for the Maivara men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listed peace gifts included armshells, samakupa, benam, wanepa, pigs,
    a boar's tusk ornament, a bone spatula ornamented with shell discs, and a bagi.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maivara instructed Wagawaga to come to their hamlet-group in three days, and
    Wagawaga then performed a similar ceremonial visit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Going ashore from the canoes on the first visit would have been considered
    an attack; after the double ceremony the two communities could freely visit one
    another.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Wagawaga visited Maivara, those who had given valuables received presents
    of corresponding value.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Bartle Bay, warfare was divided into neighbourly warfare and warfare between
    enemies.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In neighbourly warfare there was no cannibalism, the dead were buried, and
    a man would not knowingly kill a clansman.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'Enemy warfare was described as more severe: the dead would be eaten, women
    could not save wounded persons with a grass petticoat, and a clansman might be
    killed unknowingly.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before battle, a concoction containing human urine, pigs' excrement, dogs'
    excrement, and scraped coconut was prepared and eaten by fighting men to make
    them fierce.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Pieces of a stone called Warorovuna were chipped off, boiled, and drunk by
    fighting men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Fighting men threw spears at a special coconut; spears that struck it were
    called lucky spears and used in fighting, while spears that missed were rejected.
  category: action
  evidence_refs:
  - ev:9
