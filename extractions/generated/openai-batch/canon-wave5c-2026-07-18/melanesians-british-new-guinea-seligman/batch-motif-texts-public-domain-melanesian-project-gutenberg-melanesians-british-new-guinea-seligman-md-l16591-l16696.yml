canonical_text:
  quote: ''
  summary: The passage describes kaivakuku, men who pronounce and enforce a dreaded
    taboo on vegetable food, and compares them with Elema/Papuan Gulf harihu. It details
    whole-body masks, hereditary office, decisions by chiefs and old men, sanctions
    for taboo-breaking, garden and coconut taboo signs, secrecy around masked men
    being human, fear among women and uninitiated youths, and instruction of initiates
    in the clubhouse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaivakuku are described as men with the power to pronounce the most dreaded
    form of taboo on vegetable food and as taboo experts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Roro-speaking tribes the kaivakuku are reported at Waima, Hisiu, and
    perhaps Kevori, and the passage says the custom was introduced from the Elema
    tribe of the Papuan Gulf, while also noting local disagreement or qualification.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kaivakuku officiate in huge masks covering the whole body; masks are reported
    as kept in a special hut or in the closed inner chamber of the marea, and one
    mask portion was seen over a recently dead chief's death-chair.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Waima, when a man was caught breaking the taboo, kaivakuku men could complain
    to the ovia itsipana of the culprit's local group, raid his possessions, kill
    his pigs and dogs, and stop when a present was made.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kaivakuku men promenaded through the village in the afternoon while disguising
    their gait and walking on the sides of their feet, and at night they swung bull-roarers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The decision to proclaim a taboo did not belong to the kaivakuku or harihu
    themselves; it rested with chiefs and old men, while the masked officials translated
    the decision into action and punished transgressors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The kaivakuku office is described as hereditary, and the custom at Waima is
    described as decaying, with five kaivakuku reported in 1906 where there had formerly
    been twenty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Elema tribes, the men and masks are called harihu, and their taboo
    concerns garden produce imposed after planting, fencing, and the completion of
    yam-vine trellises.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The harihu determine when the crop is fit to eat by occasionally digging up
    a plant; they then inform the chief, who announces from the clubhouse verandah
    that the people may gather the food, after which a village feast is prepared while
    the harihu remain aloof in the clubhouse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: For coconuts, the harihu warn of an intended taboo by planting a ripe nut
    on its end; nuts may be collected until the first shoot appears, and the taboo
    lasts until the harihu remove it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A tabooed garden is marked by a small specially shaped stone at the entrance,
    bearing private marks of the harihu; tampering with it is said to make the offender
    liable to instant death at the hands of the vada of the harihu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each Gulf village is said to have its own harihu, with the office descending
    from father to son or to a brother's or sister's children if there is no male
    issue.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Only the men of the tribe know that the harihu are human beings; women are
    taught that they are spirits from the bush, and women and uninitiated youths believe
    this and fear them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: A woman coming near a harihu would be killed, and children approaching a harihu
    would be beaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the harihu appear, they come from the bush side of the village after
    previously living in a shelter in the scrub, where a few old men visit them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: Initiates secluded in the eravo clubhouse are instructed about the harihu,
    though novices may be so afraid that it is difficult to let a harihu come near
    them there.
  category: sequence
  evidence_refs:
  - ev:7
