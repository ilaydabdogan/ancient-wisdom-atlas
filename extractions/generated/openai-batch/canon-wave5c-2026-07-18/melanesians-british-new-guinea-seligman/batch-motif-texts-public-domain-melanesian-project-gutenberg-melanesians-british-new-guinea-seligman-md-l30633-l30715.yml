  summary: The passage describes trade routes and exchange relations around Wagawaga,
    Milne Bay, Tubetube, Duau, Panamoti, and neighboring islands. Tubetube islanders
    are described as middlemen who export pots and nose ornaments, import many goods,
    and pay for imported waga canoes and other goods with armshells, benam, bagi,
    pigs, and vegetable food. A specific transaction for a waga named Keworkewor is
    recounted with named participants and installment payments, though the narrator
    questions the reported values and quality of the payments.
