canonical_text:
  quote: ''
  summary: 'The passage describes Trobriand chiefly rank and village headmanship:
    bodily deference to a paramount chief, chiefly rights to labor and first-fruits,
    communal construction and feasting, garden and rain magic performed by chiefs
    and commoners, and the more limited advisory and mediating authority of village
    head men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: No special chiefly food prohibition, form of address, or salutation is described
    for a paramount chief in relation to head men or commoners of the same clan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Commoners are required not to be physically higher than a guyau; they squat,
    bend when passing, or ask a seated chief to rise before passing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mulosaida people built a high platform for Pulitari so that he could sit
    higher and they would not have to bend so much when passing him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A guyau is described as theoretically supreme over the people in his territory,
    and some named chiefs are said to have appeared as absolute autocrats before Government
    authority.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paramount chiefs could be carried when tired, demand heavy garden and building
    work, send young men to catch fish, feed those working for them, and receive first-fruits
    of yam gardens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a paramount chief needed a new house or yam house, villages came under
    their toriwaga to build it, while the chief provided a feast with pork and vegetable
    food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On chiefly house-building occasions, the guyau and toriwaga ate apart from
    commoners, but the commoners received food of the same quality.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Garden-productivity magic called megua is performed by both chiefs and commoners,
    and the knowledge is described as widespread rather than highly esoteric.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The megua tau acts for anyone able to pay, chews herbs, spits them about the
    garden, and others are warned to keep away during the charming.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Food given to a chief, often including fish, is said in some cases to be a
    return for magical assistance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chiefs were expected to bring rain by magical means in famine, but during
    a recent drought they were unsuccessful, while non-aristocrats were said to have
    been more successful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The toriwaga's authority is described as influential but not absolute; Makuniga
    said villagers followed his suggestions, while he consulted elders on weighty
    matters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Villagers make gardens for a toriwaga and bring him a share of fish, but his
    word is not described as law even in his own village.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: A toriwaga building a new house calls on men to cut and prepare wood and on
    girls and women to bring roofing grass, then feeds helpers with vegetable food
    but not pork.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Feuds such as those over women are not first referred to the toriwaga; an
    injured husband may seek vengeance with friends, while the toriwaga tries to limit
    bloodshed and promote settlement.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Repeated garden thefts may be reported to the toriwaga, who cautions an offender
    from his own settlement or asks the offender's toriwaga to reprove him if he belongs
    to a neighboring village.
  category: sequence
  evidence_refs:
  - ev:9
