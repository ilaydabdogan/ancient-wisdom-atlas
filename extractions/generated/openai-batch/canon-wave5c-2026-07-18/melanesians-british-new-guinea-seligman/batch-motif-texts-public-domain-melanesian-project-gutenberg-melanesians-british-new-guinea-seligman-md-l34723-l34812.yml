canonical_text:
  quote: ''
  summary: The passage describes mourning feasts after burial, including the kaiiekapu
    or kanekapu feast, restrictions on who may eat funeral food, reciprocal food gifts
    between hamlets of the dead man's totem, coconut placement and taboo at the grave,
    a later rigariga feast at which a widow leaves mourning, removal of mourning gear,
    food taboos during mourning, yam trophies, and a note comparing grave coconut
    and carrying taboos elsewhere in the Massim area and Dobu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: About ten days to three weeks after burial, a first feast called kaiiekapu
    is given by the people of the dead man's hamlet to people of one other hamlet
    of the dead man's totem.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only those of the dead man's totem may eat the funeral feast food given to
    the gariauuna; the gariauuna's wife and children should not touch it, though a
    small child might be given a piece as an exception.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kanekapu food consists of garden produce and uncooked pig-flesh; recipients
    are summoned to fetch it, most is carried away, and the recipient hamlet makes
    a smaller return gift of vegetables.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the kanekapu, one of the gariauuna hangs coconuts on the posts of the
    railing around the grave; the stated explanation is that people may know the grave,
    and no one may eat or touch the coconuts, which are left to rot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A later feast called rigariga is held some months after death, perhaps as
    many as ten months, and is the occasion for a widow to quit mourning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The rigariga resembles the kanekapu in providing food for the gariauuna and
    a particular hamlet of the dead man's totem; food is brought from the dead man's
    gardens, pigs are killed, and pork and vegetables are distributed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A brother of the dead man brings the widow to her dead husband's hamlet, where
    she is stripped of mourning gear; formerly this occurred by the grave, but a government
    cemetery requirement caused a modified form in the husband's hamlet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During mourning, yams, pork, fish, taro, and sago are described as taboo while
    mourning tokens are worn and the body is blackened.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yam trophies had been built around the deceased's grave, but under the old
    chief's influence they were instead made in the village and around the widow's
    house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note states that placing coconuts around graves occurs over a large part
    of the Massim area and may be connected with a Tubetube burden-shifting custom
    and a Dobu taboo on carrying by shoulder or head according to whether a man or
    woman has died.
  category: relationship
  evidence_refs:
  - ev:7
