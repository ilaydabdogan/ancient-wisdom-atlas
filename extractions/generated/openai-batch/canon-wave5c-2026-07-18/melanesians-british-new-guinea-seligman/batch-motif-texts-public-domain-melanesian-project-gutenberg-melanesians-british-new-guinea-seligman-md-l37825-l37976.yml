canonical_text:
  quote: ''
  summary: The passage describes the relative importance of snake, plant, fish, bird,
    and other animal totems in several islands; lists clans associated with bird totems;
    reports an Iwa origin legend in which clans emerged from different holes in the
    ground into the upper world with their totem animals and nearby totem plants;
    and records totem-related omens, avoidance of eating or touching one's own totem
    fish or bird, restrictions around a spouse's totem fish, and marriage prohibition
    within the totem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Snake totems are described as of little importance; some clans are said to
    have none, and some men do not know the name of their totem snake.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plant totems are said to be more valued than snake totems but still uncertain
    in informants' answers; fish totems are less important than bird totems but more
    respected than plant and snake totems.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dog, pig, and large monitor lizard are reported as totem animals on some
    or all of the islands.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: On Gawa, five clans are reported with the fish-hawk, pigeon, frigate-bird,
    lory, and tarakaka as their most important totems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: On Kwaiawata, the same five clans were stated to occur, but the passage notes
    uncertainty because men with the cockatoo, or wakeke, as bird totem were mentioned
    and may have been visitors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: On Iwa there are four clans with the fish-hawk, pigeon, frigate-bird, and
    lory as chief totems; on Kitava, all but the frigate-bird clan occur, and a green
    parrot clan is also found.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: On each island one clan is recognized as traditionally strongest and most
    influential, and that clan's head man or chief is acknowledged as chief of the
    island.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fish-hawk clan is dominant on Gawa, the pigeon clan on Iwa, and the frigate-bird
    people appear to be most important on Kwaiawata, though the last is less certain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: An Iwa legend states that each clan came out of a different hole in the ground,
    emerged into the upper world, brought its totem animals, and had its totem plants
    growing near its emergence hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The fish-hawk people are said to have emerged first from a hole called Okaipwas
    on Gawa, bringing their linked totems, including the dog.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The frigate-bird people are said to have reached the upper world through Kapepe
    on Kwaiawata; the pigeon and lory people emerged through holes on Iwa called Moraiiba
    and Widua.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: For the fish-hawk, frigate-bird, and pigeon clans, the strongest clan on an
    island is the clan traditionally said to have entered the world on that island.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage reports no generally recognized physical or psychical similarity
    between an individual and their totem bird or fish, except a statement that a
    fish-hawk man would catch many fish while lory and pigeon men would not.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: One reported omen says that when fishing, a man is lucky if he sees his totem
    bird coming toward him, and unlucky if he sees it crossing behind him.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A man would not injure or eat his own totem bird or fish; the passage notes
    that avoidance of birds may have little practical effect because birds are difficult
    to catch.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: When a totem fish is caught in a net, some informants say it is given to someone
    of another totem; a Kwaiawata man says he would release it alive if possible,
    give it to another clan if dead, and avoid touching a dead specimen killed by
    someone else.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: A married person who can eat a spouse's totem fish will not bring it into
    the house, but will cook and eat it on the beach.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: Marriage is said never to take place within the totem.
  category: relationship
  evidence_refs:
  - ev:16
