candidate_motifs:
- id: motif:1
  label: Clan emergence from ground holes into the upper world
  taxonomy_refs:
  - ascent
  basis: The origin legend states that each clan came out of a different hole in the
    ground and emerged into the upper world; named clans and holes are specified.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives an ethnographic summary of a local clan-origin legend,
    not a full narrative of a hero ascent or cosmological journey.
- id: motif:2
  label: Totems brought or growing at origin place
  taxonomy_refs: []
  basis: The clans bring their totem animals when they emerge, and their totem plants
    grow near the holes from which they emerge.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not explain why each animal or plant is linked to a particular
    clan beyond the emergence account.
- id: motif:3
  label: Origin-place precedence as basis for clan dominance
  taxonomy_refs:
  - royal_legitimacy
  basis: The strongest clan on an island is said to be the clan whose traditional
    entrance into the world occurred on that island, and its leader is acknowledged
    as island chief.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The passage concerns clan headship and island chiefship rather than monarchy;
    the comparison to royal legitimacy is functional and limited.
- id: motif:4
  label: Totem food and touch taboo
  taxonomy_refs: []
  basis: A person avoids injuring or eating their own totem bird or fish, may give
    a caught totem fish to another totem group or release it alive, and may avoid
    touching dead specimens.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage notes that bird avoidance may have little practical effect
    because birds are difficult to catch.
- id: motif:5
  label: Directional omen from a totem bird
  taxonomy_refs: []
  basis: During fishing, a totem bird coming toward a man is lucky, while a totem
    bird crossing behind him is unlucky.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: Only one example of an omen taken from a totem bird was found in the passage.
- id: motif:6
  label: Totemic exogamy
  taxonomy_refs: []
  basis: The passage states that marriage never takes place within the totem.
  evidence_refs:
  - ev:16
  confidence: high
  cautions: No further marriage-rule details are supplied in this passage.
comparison_claims:
- id: claim:1
  claim: The clan-origin legend can be cautiously compared by function to an ascent
    or emergence motif, because groups move from holes in the ground into the upper
    world.
  claim_level: same_function
  target: ascent motif family
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe a personal hero ascent, ritual ascent,
    or detailed cosmography; it is a social origin account for clans.
- id: claim:2
  claim: The linkage between an island's strongest clan, its chief, and the clan's
    traditional entrance into the world on that island is cautiously comparable to
    political legitimacy grounded in sacred or ancestral origin.
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The passage speaks of clan and island chiefship, not royal descent;
    it does not explicitly say that the legend legitimates authority, only that dominance
    and place of emergence correspond.
