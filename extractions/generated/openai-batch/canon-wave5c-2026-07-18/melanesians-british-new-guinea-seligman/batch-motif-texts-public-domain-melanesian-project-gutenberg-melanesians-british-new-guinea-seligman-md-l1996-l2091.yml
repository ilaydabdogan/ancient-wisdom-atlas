canonical_text:
  quote: ''
  summary: Ethnographic passage describing the Motu and allied coastal and inland
    groups, the distribution and relative importance of open ceremonial platforms
    called dubu, notes on lakatoi and hiri trading expeditions, and Sinaugolo/Garia
    traditions in which ancestral groups emerge from a cave or hole in the earth on
    Mount Taborogoro and carry or develop the first dubu posts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Motu and closely allied tribes are described as coastal settlements stretching
    from Redscar Head to Kapakapa, with Ikoro, Gaboni, and Sinaugolo groups near Kapakapa
    and inland.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sinaugolo are described as a powerful and influential tribe whose villages
    extend from near the coast behind Kapakapa up the valleys of the Kemp Welch river
    and its tributaries.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Open ceremonial platforms called dubu are said to exist among the Motu and
    kindred coastal tribes, with large dubu among the Motu only at Tupuselei and Gaile.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tupuselei is described as Motu-speaking but tribally Lakwaharu, differing
    in some customs from the Port Moresby Motu and not fitting out lakatoi for the
    hiri.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lakatoi are described as composite craft made of multiple dugout canoes and
    used by the Motu on sago trading expeditions to the Papuan Gulf called hiri.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gaile is said by its inhabitants to have formerly contained a foreign bush
    element, and its founders are named as De Bori and Gai Bori.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that open dubu are bigger, better carved, and more socially
    important in the Rigo district than elsewhere.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: According to the Sinaugolo, the dubu originated among themselves and was later
    adopted by neighbouring tribes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Sinaugolo legend states that the Sinaugolo came forth from their ancestral
    cave on the slopes of Mount Taborogoro with one carved post.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the same legend, the Sinaugolo used the one carved post as a model to make
    three others, and the four posts became the corner posts of the first Sinaugolo
    dubu in their village on Taborogoro.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author suggests that the open dubu probably originated with the Sinaugolo
    or a related tribe near Taborogoro and spread toward the coast and westward through
    neighbouring territories.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the Sinaugolo migrated toward the coast from the neighbourhood
    of Taborogoro, while the Garia migrated westward across their track, each carrying
    dubu customs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Sinaugolo legend says that the Garia and Sinaugolo once lived in a hole
    in the earth on Mount Taborogoro, increased in number, reached the surface, and
    then went in different directions.
  category: sequence
  evidence_refs:
  - ev:8
