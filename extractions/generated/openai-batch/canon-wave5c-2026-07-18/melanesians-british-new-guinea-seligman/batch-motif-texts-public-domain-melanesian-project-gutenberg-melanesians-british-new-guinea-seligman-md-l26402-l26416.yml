  quote: ''
  summary: The passage states that totems are sometimes regarded as giving omens,
    though the extent of the belief and whether meeting the most important totem always
    signifies good luck are uncertain. It reports that a man seeing his most important
    totem while hunting would know that, if he encountered a pig, he would successfully
    spear it, though the sighting did not guarantee that a pig would appear. A note
    adds that Mr Newton confirms totem abstinences and emphasizes personal feeling
    in a man's regard for his father's totems.
