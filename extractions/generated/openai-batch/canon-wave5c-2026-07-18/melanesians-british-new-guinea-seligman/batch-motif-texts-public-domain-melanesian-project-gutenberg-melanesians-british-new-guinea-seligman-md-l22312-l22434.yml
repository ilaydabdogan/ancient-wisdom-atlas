canonical_text:
  quote: ''
  summary: The passage contains the end of a Garubuiye snake fire episode, the Wagawaga
    story of the first coconut, and the beginning of the Wagawaga story of the snake
    Sinerogusi Sarasara. Fire is recovered from a snake's burning tail and distributed
    with totemic firebrands. A woman who fishes with her detached head dies after
    a man hides the head; the head becomes the first coconut palm, whose blood-filled
    nuts are processed for food. Pwakua, described as bird and man, steals and spreads
    coconuts to Nada and other villages. A girl eats eggs of the underground snake
    Sinerogusi Sarasara, and the snake pursues and enters her body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake named Garubuiye lives in a hole in a pandanus tree; its tail catches
    fire and continues glowing even after torrential rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys pull Garubuiye from the pandanus hole, break off the glowing tail, and
    use it to light a large fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People from many villages take fire home using different kinds of wood as
    firebrands, and the trees from which the brands are taken become their totems.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note identifies Garubuiye as the snake totem of the Garuboi clan of Wagawaga.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the first coconut story, a woman catches fish by removing her head, placing
    it in shallow sea water, letting fish enter it, and then replacing it on her shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man from another village watches the woman, throws her head into the scrub,
    and the woman dies when she cannot find it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The woman's head sprouts into a coconut palm; its ripe and young nuts are
    found to contain blood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man tries charcoal without removing the blood, then uses lime and sun-drying;
    he scrapes the coconut meat, squeezes it with water, and uses the juice on food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pwakua smells scraped coconut, finds the source island, steals a nut, plants
    it at Nada, later brings more nuts, and teaches people how to plant and tend them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note says Pwakua could be either a man or a bird as he wished, and that
    Pwakua is also a totem north of East Cape.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Sinerogusi Sarasara story, a girl repeatedly digs up and eats eggs
    she does not recognize, which are laid in a row extending from the underground
    snake.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After the girl sees the snake's back and hides in a house, Sinerogusi Sarasara
    emerges, follows her, is shown the house by villagers, enters her belly through
    the vulva, and coils inside.
  category: sequence
  evidence_refs:
  - ev:11
