canonical_text:
  quote: ''
  summary: 'The passage describes nose septum piercing for children around eight or
    ten years old, then gives a staged account of tattooing for girls: arms and face
    in early childhood, pelvic and thigh regions at six or seven, armpit and throat
    areas around ten, back and buttocks near puberty, and final marks associated with
    planned or recognized marriage. It also notes photographic repainting of tattoo
    patterns with soot and oil, and a status-restricted lower-leg mark.'
