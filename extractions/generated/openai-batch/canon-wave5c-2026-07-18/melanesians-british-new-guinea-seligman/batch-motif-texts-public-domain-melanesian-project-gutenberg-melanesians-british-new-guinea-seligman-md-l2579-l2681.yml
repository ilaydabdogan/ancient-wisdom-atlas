canonical_text:
  quote: ''
  summary: The passage classifies Koiari, nearby mountain, Garia, Manukoro, Barai,
    and related western Papuo-Melanesian groups by geography, language, physical measurements,
    dress, settlement form, and selected cultural traits. It notes Koiari tree houses
    used as citadels and refuges, sporran-like garments among some mountain men, and
    use of the open dubu among many western Papuo-Melanesian tribes mentioned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term Koiari is applied by the Motu and coastal neighbours to tribes inhabiting
    the hinterland, including foothills and lateral spurs of the main range.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gasiri, Sogeri, Uberi, Ebe, Agi, and Meroka are provisionally listed as belonging
    to the Koiari group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Koiari villages are described as small groups of less well-built houses, usually
    with one or two tree houses used as citadels and refuges in time of need.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Meroka are provisionally treated as the most easterly Koiari tribe, and
    the Vanapa river is treated as the western boundary.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Older men of the Koiari tribes are described as wearing long beards, with
    the author noting reddish or gingery facial hair in some members of the group.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tribes in the higher mountains behind the Koiari zone are described as similar
    in build and height to the Koiari, speaking a dialect akin to Koiari, and being
    distinguished by a sporran-like garment worn by men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some sporran-wearing tribes near the Gap, at over 5000 feet, are described
    by Captain Barton as light-skinned men of excellent physique and pleasant manners.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Garia is described as the best-known name among tribes west of the Koiari,
    speaking dialects of a Papuan language that differ from Koiari tongues; the name
    is applied to the representative group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Garia dialects are described as spoken west of the Kemp Welch river, with
    the Governor Loch range treated as headquarters and westward movement toward the
    coast noted.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Eastern Garia men measured on the western bank of the Kemp Welch are described
    as predominantly mesaticephalic, with general appearance suggesting a subordinate
    Papuan element, and as culturally resembling Sinaugolo neighbours.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The western Garia dialect is identified as Manukoro, and a small measured
    group from Lakumi is described as apparently taller and more dolichocephalic than
    the eastern Garia.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A tribe between Mount Potter and Mount Obree is described as speaking a language
    called Barai by Mr A. C. English, which he appears to consider a dialect of Garia.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: With specified exceptions, the western Papuo-Melanesian tribes mentioned from
    Hall Sound to east of the Kemp Welch river are characterized by the use of the
    open dubu.
  category: object
  evidence_refs:
  - ev:10
