canonical_text:
  quote: ''
  summary: Edai Siabo sails west after instructing Oiooio that, after fifty days,
    her daughter-in-law should climb Taubarau daily to watch for the returning lakatoi.
    Other wives assume their husbands will not return and take new husbands, while
    Oiooio remains faithful. The daughter-in-law finally sights the lakatoi, and Oiooio
    prepares herself, paddles to it, reports the other wives' faithlessness, and takes
    sago. Edai returns, confirms the truth of the dirava's words, admonishes the faithless
    women and the men who married them, and the narrative explains that since then
    lakatoi travel west yearly, bringing food during scarcity.
  language: English
  quote_policy: summarized
