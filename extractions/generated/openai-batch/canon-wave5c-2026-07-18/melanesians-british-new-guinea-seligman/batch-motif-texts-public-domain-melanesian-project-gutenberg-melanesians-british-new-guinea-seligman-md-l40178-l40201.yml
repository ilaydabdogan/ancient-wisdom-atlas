  summary: The passage reports limited inquiry into supernatural beings and mentions
    a creature called Modulele, said to cause sickness and death and to be common
    on Wakoia near Dobu. It describes men who know charms for controlling rain, sunshine,
    and adverse winds, with such knowledge usually transmitted within families. One
    rain-stopping method involves chewing ginger, spraying it from the mouth, and
    muttering a formula ending in a high-pitched sibilant. Similar procedures with
    different words are used to calm wind and to avert dangerous influences, including
    charms performed around Government parties and camps.
