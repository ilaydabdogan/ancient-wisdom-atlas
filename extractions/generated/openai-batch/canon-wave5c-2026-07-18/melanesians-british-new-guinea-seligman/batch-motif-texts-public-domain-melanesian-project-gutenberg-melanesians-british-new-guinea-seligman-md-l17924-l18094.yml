canonical_text:
  quote: ''
  summary: The passage presents a table of pangua of the Biofa and Vee, showing the
    ngopu group to which each belongs. It notes use of village names in brackets where
    needed and states that the author cannot give the origins of Afai pangua. The
    prose explains that clans in each ngopu group are understood to descend from a
    single pangua and originally to have shared an iauafangai and an ufu name. It
    also identifies isolated immigrant pangua outside any ngopu group and describes
    Eboa-Inafokoa as a foreign ngopu group recognized by Mekeo natives.
  language: English
  quote_policy: summarized
