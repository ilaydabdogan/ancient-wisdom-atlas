canonical_text:
  quote: ''
  summary: 'The passage describes loading and regulating a lakatoi hiri voyage: cargo
    stowage, bow orientation, the authority and taboos of the baditauna and doritauna,
    restrictions on udiha and cooks, the need to keep a vaina motionless, a 1906 voyage
    of the lakatoi Kevaubada to Kaimare, a mast-food rite with bananas and yams, and
    accounts of an older Hall Sound ceremony involving cassowary feathers and a disputed
    explanation about Lolo spirits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vessels are loaded with pots; pots belonging to the baditauna and doritauna
    are placed in the kalaga, while the rest are packed in dry banana leaves in named
    shelters and inside another printed term.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the lakatoi leaves harbour, the baditauna end is made the bow; on the
    return, the doritauna end becomes the bow, unless wind conditions require reversal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The baditauna and doritauna are said probably not to manage ordinary navigation,
    but to take charge and give obeyed orders in difficult situations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two udiha remain confined to a shelter beside the kalaga except for bodily
    necessity; only the baditauna, doritauna, udiha, and two selected cooks have access
    to that shelter.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The two cooks are selected one each by the baditauna and doritauna; orthodox
    cooks must be unmarried youths and follow restrictions in handling food.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A vaina hung above the udiha must remain free from motion, and if the vessel
    rocks it is steadied with guy strings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the voyage, the same food taboos apply to the captains as before departure,
    but no food taboos are placed on the crew.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the 1906 voyage of Kevaubada, the lakatoi anchored at Meabada, the crew
    collected firewood and erected steering rails, then proceeded outside Yule Island
    toward Kaimare.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Passing Yule Island, older men placed bananas and yams at the foot of each
    mast; the crew cooked and ate this food that day, while the baditauna, doritauna,
    and udiha did not eat it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Kaimare, the lakatoi entered the creek without waiting for permission,
    was accompanied by many Kaimare canoes, and anchored between the villages.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Chalmers describes an older Hall Sound ceremony in which a robber-chief and
    his little nephew used two wisps of cassowary feathers before the foremast and
    mainmast, followed by shouting as if something were being driven away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Chalmers explains the Hall Sound rite as an incantation to drive away troublesome
    Lolo spirits that detained lakatois after Motuans had killed many Lolans.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Keori confirms that such a Hall Sound ceremony was formerly performed as a
    command from Edai when Edai taught Edai Siabo the management of the lakatoi trip,
    but he denies that it referred to spirits of people killed by the Motu.
  category: speech
  evidence_refs:
  - ev:11
