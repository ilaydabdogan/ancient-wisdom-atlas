canonical_text:
  quote: ''
  summary: 'The passage describes adoption practices at Wagawaga and Tubetube: adopters
    select children of the same totem; adoption by women may be commoner, while men
    may adopt a brother''s child. Formerly, war captives near puberty could be adopted
    into the clan, assuming the adopter''s totems, which created prohibitions on marriage
    or sexual relations and made an adopted female captive equivalent to the adopter''s
    sister. Adopted children generally remained with their mother until weaned.'
