canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of the Louisiades based on information
    gathered at Samarai, especially from Toakina of Panatinani. It describes hamlets,
    houses, clubhouses, linked totems, examples of totem sets, uncertain clan grouping,
    Toakina's totem avoidances and paternal-clan restrictions, absence of tattooing,
    and marriage practices including girl-initiated marriage and arranged childhood
    betrothal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the Louisiades were not visited, but information was
    obtained at Samarai from natives of the island group.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Much of the information came from Toakina, described as a native of Panatinani
    employed in Government service at Samarai.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Panatinani houses are said to be arranged in hamlets called totoilni and to
    have a turtle-backed shape with a side entrance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each village-system is said to have clubhouses called yunu where adolescent
    youths sleep and married men often spend the night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: People are described as having linked totems consisting of one or more birds
    with a fish, a snake, and often a tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: One bird totem is described as more important than the others; a turtle or
    alligator may replace the fish totem, and a lizard may replace the snake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Panatinani word for totem is given as man, the same word said to be used
    at Murua.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Examples of Panatinani linked totems include named birds, a fish-hawk, a possible
    monitor lizard, a green turtle, an alligator, and a banded sea snake.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Examples of linked totems were also obtained from a native of Tagula, including
    entries associated with flying fox, crow, edible fruit, and a creeper.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author says inquiry did not show dual or multiple clan grouping in the
    Louisiades, but that this point remained uncertain pending further inquiry.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Toakina would not eat his own or his father's totem birds or fish, though
    he would destroy his own or his father's totem tree if necessary or convenient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Toakina thought that if he caught his totem fish he would take it home and
    give it to a friend from another clan.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Toakina would not marry into his father's clan and would abstain after his
