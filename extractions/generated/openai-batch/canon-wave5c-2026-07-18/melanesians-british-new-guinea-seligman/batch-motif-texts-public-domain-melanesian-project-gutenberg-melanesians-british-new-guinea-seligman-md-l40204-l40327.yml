  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that neither males nor females tattoo.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: One marriage pattern is described in which, after a period of intercourse,
