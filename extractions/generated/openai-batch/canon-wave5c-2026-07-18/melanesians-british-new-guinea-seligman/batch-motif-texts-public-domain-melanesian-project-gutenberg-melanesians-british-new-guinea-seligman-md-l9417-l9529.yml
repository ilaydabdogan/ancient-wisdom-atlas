canonical_text:
  quote: ''
  summary: The passage describes figures in the maginogo dance, especially the tahaka
    bowl figure. It gives an origin story in which an unnamed man discovers the water-filled
    Eyamune stone, washes and splashes himself, composes a song, and reports it to
    village dancers, after which the story and song are added to the dance. It also
    describes a Hohodai performance in which dancers use a pot of water, bamboo staffs,
    squatting movement, splashing, repeated placements, and passage between columns.
  language: English
  quote_policy: summarized
