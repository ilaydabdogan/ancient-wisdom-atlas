  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man's shadow, or his reflection in water or a mirror, is also called aru.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sneezing may occur when a man becomes angry, and otherwise sneezing is considered
