canonical_text:
  quote: ''
  summary: The passage reports beliefs about aru, a man's spirit or soul, its journey
    after death to Maraiya and into a spirit world, the Lord of the dead who assigns
    places, Wamira accounts of death-signs and arrival procedures, conditions and
    social continuity in the other world, the possibility of a second death, and the
    use of aru for a person's shadow or reflection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's spirit or soul is called aru, and after death it goes to Maraiya in
    the south-east.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tauurnariri is identified as the Lord of the dead who prepares and assigns
    a place for each.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Wamira account, spirits in the spirit world know of a death when something
    called obu falls from a tree, and one remains on the lookout for the one coming
    from the upper world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The arriving spirit passes up the Uruam, described as the further river, into
    the mountains, and the soul knows its way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An older dead man sits with his back to the newcomer and asks why he has come;
    the newcomer answers by naming a witch or sorcerer who has sent him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After further conversation, the new arrival is taken to the village where
    he lives henceforth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The spirits are described as having white skins, plenty to eat, and no sickness
    or evil assailing them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wealth status and community affiliation continue in the other world; each
    community has its own place.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Spirits can fight as they did in life; anyone killed there is destroyed forever,
    and all can die again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Spirits know their own friends, and life in the other world is said to repeat
