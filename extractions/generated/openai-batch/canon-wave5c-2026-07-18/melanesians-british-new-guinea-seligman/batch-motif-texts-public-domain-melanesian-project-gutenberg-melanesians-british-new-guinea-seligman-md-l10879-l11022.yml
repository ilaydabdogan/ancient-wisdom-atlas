- id: ev:13
  type: summary
  locator: lines 11000-11012
  quote_or_summary: Ahuia says a vata is not a ghost or spirit but a man and sorcerer;
    a vata may enter a house, kill an inmate, bring him to life again, and the inmate
    later sickens and dies.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/melanesians-british-new-guinea-seligman.md
  rights_note: Source metadata rights_status not specified; excerpt summarized.
- id: ev:14
