candidate_motifs:
- id: motif:1
  label: illness caused by captured or stolen sua
  taxonomy_refs: []
  basis: The sick man's sua is said to be captured by the tabu, and a child's convulsions
    may be explained by Atani Tano taking the child's sua.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage uses the term sua but does not define it systematically in
    this excerpt.
- id: motif:2
  label: ritual exchange to recover a stolen vital essence
  taxonomy_refs:
  - sacred_exchange
  basis: Ahuia explains that the tabu may accept the sua of the ornaments in exchange
    for the sick person's sua, after the sese ceremony.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The exchange is explicit, but mapping it to the broad taxonomy family
    sacred_exchange is interpretive and should be reviewed.
- id: motif:3
  label: ornamented ritual object placed over fire and broken pot
  taxonomy_refs: []
  basis: The sese is held above a pot with grass and a live firestick; the pot is
    struck with stones and broken while participants groan.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage explicitly says no meaning could be elicited for the breaking
    of the pot.
- id: motif:4
  label: return prohibition against looking behind
  taxonomy_refs: []
  basis: The sick person and attendants are forbidden to look behind them on the return
    journey from the ritual site.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No explanation for the prohibition is given in the passage.
- id: motif:5
  label: dangerous name utterance during subsistence activity
  taxonomy_refs:
  - forbidden_knowledge
  basis: Mentioning Godiva's name while fishing or hunting is said to cause bad luck.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage supports a name-related prohibition, but the taxonomy reference
    forbidden_knowledge is broader than the specific evidence.
- id: motif:6
  label: bush attacker whose victims sicken and die after returning home
  taxonomy_refs: []
  basis: Godiva stabs people in the bush and they go home, sicken, and die; vada victims
    return desperately weak and die in several days.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage gives similar outcomes for distinct figures without explicitly
    linking them as one motif.
- id: motif:7
  label: killer who revives the victim before delayed death
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Non-human vada are said to kill men, make medicine of the body, and bring
    the victim to life again; Ahuia also says vata may kill an inmate, bring him to
    life again, and the person later sickens and dies.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: medium
  cautions: The revival is temporary and ends in death, so the taxonomy references
    death_rebirth and resurrection are only approximate.
- id: motif:8
  label: night-traveling sorcerer bands
  taxonomy_refs: []
  basis: Ahuia describes vata as sorcerers who go about at night, steal, and generally
    travel in bands of three, four, six, or twelve.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage also records conflicting views about whether vata are human
    sorcerers, non-human beings, bogies, or Koiari.
- id: motif:9
  label: long-haired limbless or extremity-lacking beings
  taxonomy_refs: []
  basis: Atani Tano and Devase are described with long hair and missing limbs or extremities;
    Godiva also has long hair and lacks toes.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage lists similar physical traits but does not state that these
    figures belong to one class.
comparison_claims:
- id: claim:1
  claim: The passage itself links the Koita-related vadavada/vata material with a
    Motu account of Vata by name and by the shared function of explaining sudden illness
    or death associated with the bush.
  claim_level: same_function
  target: Motu Vata as quoted from Rev. Dr Turner
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  limitations: 'The passage emphasizes elastic and conflicting interpretations: Vata
    may be treated as an evil spirit, predatory bushman, non-human being, bogey, Koiari,
    or human sorcerer.'
- id: claim:2
  claim: The forms vata, vada, vadavada, and vatavata are presented in close association,
    supporting a cautious linguistic similarity claim within the passage.
  claim_level: linguistic_similarity
  target: Vata/vada/vadavada/vatavata naming cluster
  evidence_refs:
  - ev:9
  - ev:10
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide linguistic analysis; it only presents
    the names and related descriptions.
