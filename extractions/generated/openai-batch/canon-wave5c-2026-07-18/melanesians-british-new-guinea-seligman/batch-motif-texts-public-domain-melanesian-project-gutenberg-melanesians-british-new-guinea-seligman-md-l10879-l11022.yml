    in the bush.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/melanesians-british-new-guinea-seligman.md
  rights_note: Source metadata rights_status not specified; excerpt summarized.
- id: ev:10
  type: summary
  locator: lines 10971-10979
  quote_or_summary: The name is said to apply both to predatory bushmen and to non-human
    beings who kill with an egg-shaped stone club, make medicine of the body, and
    bring the victim to life again.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/melanesians-british-new-guinea-seligman.md
  rights_note: Source metadata rights_status not specified; excerpt summarized.
- id: ev:11
  type: summary
  locator: lines 10979-10985
  quote_or_summary: A man attacked by vada returns weak and ill to his village and
    dies in three to six days; vadavada look and dress like ordinary men but travel
    at night.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/melanesians-british-new-guinea-seligman.md
  rights_note: Source metadata rights_status not specified; excerpt summarized.
- id: ev:12
  type: summary
  locator: lines 10985-10999
  quote_or_summary: The narrator says it is unclear whether older men regarded vadavada
