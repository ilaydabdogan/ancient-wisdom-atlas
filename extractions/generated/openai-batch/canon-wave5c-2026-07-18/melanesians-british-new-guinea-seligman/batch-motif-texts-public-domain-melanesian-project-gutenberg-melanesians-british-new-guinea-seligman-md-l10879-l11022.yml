canonical_text:
  quote: ''
  summary: The passage describes a sickness-causing tabu associated with a large tree
    and a sese ceremony intended to recover a captured sua by offering ornament-sua
    in exchange. It also describes child illness attributed to Atani Tano, bad luck
    and fatal stabbing associated with Godiva, devase and forgotten dead-sua in the
    bush, and vadavada/vata as bush beings, predatory men, or sorcerers linked with
    night travel, killing, revival, theft, sickness, and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tabu with power to make people sick is said to be immanent in a large Ficus
    tree below Government House and is sometimes conceived as having human form.
  category: relationship
  evidence_refs:
  - ev:1
