canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of Northern Massim clan totems and related avoidances:
    people are described as avoiding eating, injuring, or improperly killing certain
    totemic animals or plants, with bodily swelling and possible death named as penalties
    in some cases. The passage records variation by clan, village, and family group,
    including Malasi, Tabalu, Lukosisiga, and Osiwasiu practices involving birds,
    pigs, dogs, fish, plants, shark, sting-ray, and pig-hunting dogs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, despite legendary close associations between men
    and totem animals, no generally recognized physical or psychical resemblance or
    omen-giving function is identified for the totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is said not to eat his totem bird; the named penalty for doing so is
    a swollen stomach and perhaps death, though the passage also says there was no
    actual tribal punishment for eating the totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hungry Mimalasi woman is reported to have eaten a pigeon shot by Mr Bellamy;
    if she later became sick, the illness would have been attributed to breaking the
    totem rule.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports uncertainty about whether a man would kill his bird totem,
    but says he apparently would not object to touching it after death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man is said usually not to eat his totem fish; if such a fish is taken alive,
    he does not release it but gives it to a man of another totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One account says a man would usually avoid injuring his plant totem, while
    Mr Bellamy states that a man clearing a garden would destroy his totem plant without
    hesitation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Malasi clan has katakea, the white cockatoo, as a subsidiary bird totem,
    and Malasi men nevertheless use its feathers for admired dancing ornaments like
    other men.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Osiwasiu, the pig is linked with bird totems of the Malasi, Lukuba, and
    Lukosisiga clans; villagers reportedly do not eat wild pig because their bellies
    would swell, though they may hunt bush pig and sell it elsewhere.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Osiwasiu, all clans eat village pig of any colour, no one eats dog though
    dogs are kept, and neither sex eats shark or sting-ray.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Boitaru, where pig is a Malasi totem, Malasi men do not eat bush pig; they
    eat black-skinned village pig but not yellowish-brown pig, which is explained
    as the colour of man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Malasi men at Boitaru keep pigs and may kill black village pigs, while brownish
    pigs are sold or exchanged with men of other clans.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mr Bellamy considers the rule about brownish-red pigs to apply only to the
    Tabalu family group of the Malasi clan, the chiefly family group.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A Tabalu may not eat a village pig speared or killed in any way other than
    by being caught by hand, tied to sticks, and roasted alive over a fire; the stated
    explanation is that their fathers did not eat it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The penalty for infringing the Tabalu brownish-red pig rule is stated to be
    a swollen belly and perhaps death.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Pigs are described as well treated in south-eastern New Guinea, with marked
    fellowship between a man and his pig in some cases.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Sir William MacGregor records a guide whose half-grown pig repeatedly followed
    him like a dog, even after the guide tried to drive it home and punished it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: At Boitaru, people of the Lukosisiga clan are related to dogs as Malasi men
    are to pigs, with dog described as one of their totems.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The chief of the Lukosisiga clan is said to 'medicine' dogs of his own and
    other clans before pig-hunting, though the passage reports doubt that this is
    due to totemism.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: A footnote says certain fish were eaten only by old men because unmarried
    or recently married men who ate them were believed to become unpleasant to the
    opposite sex; the passage notes this avoidance probably has nothing to do with
    totemism.
  category: action
  evidence_refs:
  - ev:11
