canonical_text:
  quote: ''
  summary: 'The passage describes events at the Diwari walaga feast: the ceremonial
    cutting and handling of a small mango tree, transfer of responsibility for the
    next walaga through acceptance by Daigogo and Tetebani catching the leaves, installation
    of the tree and other objects on the dawati, pig presentations with mango and
    axe processional gestures, use of dabedabe branches or sticks when fewer pigs
    were brought, and extended dancing by decorated men and women until daylight.
    The narrator notes conflicting accounts about the cutting implement and missed
    some beginning and night events.'
  language: English
  quote_policy: summarized
