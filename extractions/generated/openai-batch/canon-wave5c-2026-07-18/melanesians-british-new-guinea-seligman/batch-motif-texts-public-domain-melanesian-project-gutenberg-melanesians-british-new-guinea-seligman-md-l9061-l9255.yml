canonical_text:
  quote: ''
  summary: The passage describes Koita songs and dances, their instruments, named
    song classes, rules of ownership and purchase, occasions for performance, and
    several examples of song origins or associated narratives.
  language: English with Koita and Motu terms and song texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dancing occurs at almost all feasts and is commonly accompanied by songs,
    drums, dancing sticks, rattles, or small wooden gongs called sede.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rattles are made from seeds of Pangium edule and are often tied to dancing
    sticks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some Koita dances may be performed for amusement at any time, while others
    are generally restricted to appropriate occasions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Songs appropriate to particular occasions are grouped into named classes,
    and songs and dances can be named from a song's first words.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Songs and dances are described as strictly owned; unauthorized use formerly
    could lead to war, while legitimate use of another group's song or dance required
    purchase.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Abau Rohi of Hohodai saw the maginogo dance at Yarogaha and arranged for Keta
    Vahu to teach it to Hohodai after payment in valuables.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Named song classes include berasi, ehona, vaura, maginogo, maisi, and bago,
    each associated with particular contexts such as fencing gardens, dirges, hiri,
    feasts, funerals, hekarai, dance, or homicide.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The origins of most songs are described as obscure, and the words are often
    unintelligible; some songs are said to come from particular places or from the
    east.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The berasi song Irimabera is sung when fencing a garden only if the singers
    have passed the previous night with a girl, though its use as a dirge does not
    imply this.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The song Ogonimabia is said to have been made by a Yawai boy returning from
    an assignation with a girl of Ogoni village when a storm overtook him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Vaura group songs are said not to be Koita and to have come from the east,
    though the exact route is uncertain.
  category: attribute
  evidence_refs:
  - ev:10
