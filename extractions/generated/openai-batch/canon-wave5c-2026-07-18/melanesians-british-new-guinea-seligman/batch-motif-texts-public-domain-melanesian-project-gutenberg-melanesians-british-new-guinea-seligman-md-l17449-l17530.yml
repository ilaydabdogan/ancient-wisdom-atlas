canonical_text:
  quote: ''
  summary: Ethnographic account of the formation of Inawi and Inawae through migration,
    village fission, war-displacement, factional movement, intermarriage, warfare,
    and the adoption of child captives, including a Roro family at Inawae descended
    from captured children of a chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain Waiaka men and families are described as among the first to leave
    loiovina, the stated original home of the Biofa tribe; Paiapaia later split from
    loiovina and settled at the present site of Inawi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Okope clan families came down the river as war-driven fugitives, were received
    by Waiaka, moved upstream with them, and built houses continuous with the Paiapaia
    settlement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ongofoina and Ngangai families joined the growing settlement after being unable
    to agree with the majority in their own villages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ipange is described as an immigrant stock from near Amoamo Inaukina on the
    Biaru river, while Ungo is described through Father Egidi as part of an emigrant
    stock connected with other named village groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The recent settlement by Inawefia is said to have been due to constant harassing
    wars waged by Waima against Afai.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Inawae village is described as containing three local groups, with Inawae
    Ipiau alone strong enough to be important, and with later divisions producing
    named pangua and an Inawae Ipuko remnant near the original settlement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some Ikoiko families, identified as Vee, settled at Inawae and preserve some
    autonomy; the text says there is no definite information why they settled there,
    but suggests faction fights in their own village as probable cause.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A single Inawae family of Roro origin is said to descend from children of
    a Roro chief whose settlement was attacked and whose young children were carried
    off as prisoners of war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The note states that Mekeo tribes generally did not take prisoners of war,
    but that exceptions involved young children who were adopted into the village
    of their captor.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Examples are given of child-prisoners or captive-descended families at Veifa,
    Inawi, and Aipiana; Aiai, a boy carried off from Waima, was adopted into the Waiaka
    pangua of Inawi and considered a brother of Opungu Ongopaina.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Roro family history is presented as showing that child prisoner-taking
    could function practically as adoption from a tribe with which communication and
    intermarriage continued despite periodic killings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A group of Roro natives formed a settlement on Ariopa creek, controlled the
    coastal plain, and prevented free intercourse between coastal and inland villages.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Coastal people decided to attack the Roro settlers; the Roro appealed for
    help to Inawi and Inawae, into which Roro had freely married, and the allies repulsed
    the adversaries.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After a disagreement over loot, the Mekeo men attacked and defeated the Roro,
    killed everyone except the chief's children, carried those children to Inawae,
    occupied the Roro settlement site, and retained the land until later driven out
    by coastal men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: As the adopted Roro children grew up, the elder returned to their father's
    village, one resumed the dignity of chief, and the youngest boy remained at Inawae
    with his sister who had married there.
  category: sequence
  evidence_refs:
  - ev:6
