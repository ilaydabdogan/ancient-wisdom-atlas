canonical_text:
  quote: ''
  summary: 'The passage describes inter-village warfare in Kiriwina/Kitava contexts:
    a land dispute settled by spear combat, an attempted ambush of a Government party,
    a revenge attack against the chief Enamakala and his followers, the destruction
    and burning of villages and food stores, and a customary peace-making process
    involving exclusion of the defeated party, reciprocal presents, permission-seeking,
    and an offering of atonement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kadukwaikera and Gumalababa quarrelled over ownership of planting ground claimed
    by both sides.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When diplomatic means did not settle the land dispute, the solution was left
    to spear combat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The combat field was selected and cleared, then changed because the afternoon
    sun would have been in one side's eyes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the combat, two men of Kadukwaikera were killed and several more were wounded
    by spears, especially on the leg; shields were also split by spears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A number of villages attacked the chief Enamakala, and an attempted ambush
    of a Government party occurred in 1899.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Government party included constabulary, boys formerly employed by the
    Government, carriers, and Mr M. H. Moreton.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Attackers with shields and spears approached the rear of the Government party,
    while other parties were positioned ahead and on both sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shots from the Government party scattered the attackers; the police returned
    with a blood-spattered shield, a shield with a bullet hole, and spears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Moliasi stated that his faction attacked because they were curious about fighting
    with rifles.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rising against Enamakala is described as revenge for earlier raids and
    burning of many named villages attributed to Enamakala.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dissatisfied party complained that Enamakala was niggardly in distributing
    food and that his brother and successor Tauulu was a sorcerer and a bad man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Enamakala was driven from Omarakana, which was burnt; gardens, coconut palms,
    areca palms, pigs, and fowls were destroyed, killed, or driven away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The mission station at Omarakana was looted and the teacher's garden destroyed,
    but the church and dwelling-house were not burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Eleven other villages and many houses full of yams were burned, causing great
    loss.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The defeated party were driven to a temporary encampment at Giugwa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: Former custom kept the defeated party away from their village sites for a
