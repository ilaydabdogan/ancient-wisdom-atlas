canonical_text:
  quote: ''
  summary: 'The passage describes Tubetube warfare and cannibalism practices: a victorious
    war party returns with a dead enemy or prisoner, the community greets them with
    dance and rejoicing, a victim may be killed on a clan naka in revenge, the body
    is cut up and distributed, some relatives and others abstain from eating, payment
    is made to the killer or captor, the killer observes seclusion and food restrictions
    followed by bathing and blackening, skulls and bones may be displayed or worn,
    and difficulty lighting fires is treated as a bad omen for absent warriors.'
  language: English
  quote_policy: summarized
literal_observations:
