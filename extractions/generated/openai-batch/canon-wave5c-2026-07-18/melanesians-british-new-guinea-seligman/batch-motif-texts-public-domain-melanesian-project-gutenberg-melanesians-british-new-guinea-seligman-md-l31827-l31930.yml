  text: When victorious canoes approached the island, the population gathered on the
    beach and began a dance called railsi after recognizing signs of victory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men brought the dead enemy's body ashore, placed it on a naka, and later distributed
    portions as pig flesh would be divided.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prisoner might be adopted into the captor's community if the beaten party
    had paid a life-for-life blood debt.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a prisoner was to die, he was killed on a naka associated with the clan
    of the man for whom revenge was being taken.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the dead man's widow was still mourning, her mourning necklace and armlets
    were transferred to the victim.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The widow thrust pointed sticks into the victim's eyes and taunted him about
    having seen her husband killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The dead man's game, identified as sisters' children, speared the victim until
    he died, and men of the clan cut up the body on the naka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The flesh could be eaten by inhabitants of Tubetube except the killer or captor
    and specified relatives of the man for whom payment was taken.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:9
  text: Some people abstained from eating the gum to avoid endangering its provider
    through later lime-pot contamination.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Payment called gaioiyai, often a pig and four pairs of armshells, was made
    to the person who killed or captured the victim, not to the war-party leader.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The warrior who killed or captured a victim entered his own house by the back
    door, avoided the naka where the body lay, cooked for himself, and ate only food
    roasted in fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After three days of seclusion the warrior bathed in the sea, then blackened
