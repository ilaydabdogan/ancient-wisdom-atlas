comparison_claims:
- id: claim:1
  claim: The passage cautiously links Tubetube ceremonial cannibalism with Milne Bay
    by suggesting that a former dual clan grouping, if it existed at Tubetube, may
    have influenced cannibalism as it has in Milne Bay.
  claim_level: same_function
  target: Milne Bay ceremonial cannibalism and possible dual clan grouping influence
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: low
  limitations: The passage explicitly says nothing was known of a dual grouping of
    clans when Tubetube was visited; the comparison is conditional.
- id: claim:2
  claim: The passage suggests that singeing the body before cutting it up may have
    occurred at Tubetube as elsewhere in the district.
  claim_level: same_function
  target: Body-singeing before cutting in the surrounding district
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: low
  limitations: The account also states that singeing the body is not mentioned in
    the Tubetube account; occurrence at Tubetube is described only as probable.
