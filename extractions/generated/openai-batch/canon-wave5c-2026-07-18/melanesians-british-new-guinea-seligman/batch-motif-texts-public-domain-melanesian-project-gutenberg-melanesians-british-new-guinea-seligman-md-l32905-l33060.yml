canonical_text:
  quote: ''
  summary: The passage records Wagawaga and Tubetube song texts, glosses, reported
    meanings, and performance contexts. It notes that the Wagawaga songs are sung
    while dancing; several song meanings are unknown or uncertain. Named songs refer
    to sea travel, wind, a named canoe, tide movement, a star or morning star, Dumodumoia,
    De people, news travelling eastward, fence-cutting words without practical implication,
    and Tubetube ceremonial, war-party, and canoe-paddling song contexts.
  language: English prose with transcribed local-language song texts and interlinear
    glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collector reports difficulty obtaining songs in Wagawaga itself because
    of shyness around dancing, but best singers recorded songs on the schooner; the
    songs presented are described as sung while dancing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pediri song text and gloss mention a man sailing to Tubetube, hard wind
    from Dagedagera, the canoe Porububuni being bailed out, and a frigate bird screeching.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated meaning of Pediri is that a man went to Tubetube and, on returning
    from Dagedagera, met a storm requiring constant bailing; Porububuni is identified
    as the canoe's name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Nuauuro song states that high water runs out until low water is reached,
    and the reported meaning is that the tide runs out steadily from high to low water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A second part of Nuauuro mentions a star approaching, someone or something
    coming down, and the morning star coming here; the passage says this part's meaning
    was unknown.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Nuauuro note, bagi is identified as a valued shell ornament, and Dumodumoia
    is said to be the name of a village-system or island.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ogoogo song includes a man with long locks hanging down the back of his
    neck and words glossed as their land, our land, flat land, and the land of Dumodumoia;
    its meaning is reported as unknown.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Damorea song includes words whose meaning is uncertain or denied by informants;
    Sapidobu may mean earring and budibudi may mean mist.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The first four songs are described as true Wagawaga songs, while the next
    three are said to have been learned from bush natives.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Mai Del laulauina song is glossed as the people of De talking and grumbling;
    its meaning was unknown at Wagawaga and it was said to have travelled to the coast
    from an inland bush village.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Kwabiai song is glossed as news from Kabiai going eastward; it is said
    to come from Dapaiuna in Milne Bay and perhaps to mean that news travels about.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Walawalairu song is glossed as cutting down a fence and collecting it
    together, but informants said it was only a song, had no meaning, and did not
    imply men assembling to cut a fence; it is said to come from Rafarafa in the bush.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: At Tubetube, favourite dancing songs are named rausi, pediri, and waia; rausi
    is especially danced during soi festivities, while pediri and waia are said to
    have been introduced from Rogea.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Besa is named as a dance and song performed on the return of canoes from a
    successful war party; Losuma is named as a drum-accompanied dance before a war
    party starts, without singing.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Gumgum is said to have come from Kwararo, is sung without drum or dance, and
    is commonly sung in canoes while paddling or sailing, though it may be sung at
    other times.
  category: action
  evidence_refs:
  - ev:14
