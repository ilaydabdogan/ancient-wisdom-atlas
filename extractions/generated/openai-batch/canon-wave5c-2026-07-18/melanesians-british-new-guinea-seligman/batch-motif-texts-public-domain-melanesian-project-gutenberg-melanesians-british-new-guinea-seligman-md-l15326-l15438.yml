canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of marriage ceremonies: affinal abuse
    pacified by animal gifts, mock pillage, adornment of the bride, gestures of reconciliation,
    delayed cohabitation, a later exchange of pigs, feather ornaments, shell jewellery,
    fish, and bananas, restrictions on the bride before that exchange, elopement procedures,
    clan exogamy, natal-kin concern for married women, and the beginning of a named
    case involving Abia Koai and Koaba Warupi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the morning after the marriage, the bride's father stands outside the bridegroom's
    father's house and abuses him until he is pacified by a dog that is killed for
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mock pillage of the bridegroom's local group's houses and gardens occurs,
    but valuable property and permanent crop damage are avoided, and only near relatives
    of the bridegroom are to be plundered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bridegroom's relatives paint the bride and adorn her with shell ornaments;
    the young couple initially ignore each other, but an understanding is said usually
    to be established when the bride gives her husband betel and lime.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth day, the bride's mother visits, weeps and groans until a pig
    is killed for her, and then praises the generosity of her son-in-law and his family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cohabitation is said not to begin for a few weeks; the boy sleeps in the Tnarea
    and the wife in her father-in-law's house, though intercourse is reported to occur
    in or near gardens soon after marriage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports a former custom that a woman should not have children
    until her garden was bearing well, while the author states uncertainty about adherence
    to the rule and its means.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: For the first few weeks after marriage, the bride decorates herself each afternoon
    and visits and gossips with friends, as she had done at the time of face tattooing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A second part of the marriage ceremony occurs three to eight weeks later;
    the author is uncertain whether it corresponds to official consummation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the later ceremony, the bride's kin prepare fish and bananas, while the
    bridegroom's local group brings pigs, feather headdresses, and shell jewellery
    in a procession led by the bride.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bridegroom's side gives pigs and feathers to the bride's father; the bride
    is stripped of ornaments that are also given to her father; he gives fish and
    bananas in return, and the bridegroom's supporters eat the food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Until the later exchange ceremony occurs, the bride is not allowed to visit
    her father's village or eat food brought from it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bridegroom's pigs are killed and eaten by the men of the bride's local
    group, with special use of the Tnarea if the bride is a chief's daughter; later,
    gifts are distributed among near relatives of the bride and the couple receive
    presents on a subsequent visit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The elaborate ceremony is said to occur when betrothal and dowry proceed regularly;
    elopements are also common, with the couple going to the bush and later reconciliation
    often beginning with the gift of a pig.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Clan exogamy is strictly required, with a stated exception that a widow may
    remarry into her first husband's clan.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Although a married woman does not formally retain her maiden itsubu, her kin
    may resent injury done to her and may try to start a vendetta if her husband is
    considered responsible for her death.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage begins an example in which Abia Koai of Ovia Pokina itsubu married
    Koaba Warupi of Korena itsubu, quarreled continually with her mother-in-law, and
    hanged herself.
  category: sequence
  evidence_refs:
  - ev:11
