canonical_text:
  quote: ''
  summary: The passage describes totemic spells used in fishing, fighting, and raiding;
    a reported Bogaboga origin story in which a shrimp and a frog give birth to clan
    totems and ancestors; Kubiri crocodile totem customs involving food placed in
    rivers, subsidiary totems, and taboos; and Mukaua chiefly organization, feasts,
    hunting leadership, and chiefly etiquette.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each fish-totem has a named spell, muara, used in fishing when a seen fish
    resembles the totem fish in appearance, movement, or colour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In fighting and raiding, muara of the fish-hawk and of a hawk are prayed or
    repeated so the human action may resemble the animal's successful darting or snatching.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A reported Bogaboga story says a shrimp and a frog once held a jumping match;
    the shrimp was the better jumper, and the shrimp and frog gave birth to totems,
    and in the frog's case also ancestors, of certain clans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Kubiri, the crocodile is a totem whose intercession is sought by
    placing food in rivers for it to eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The crocodile clan has subsidiary totems including shell-fish, fresh-water
    fish, taro, and a banana, with associations based on resemblance to crocodile
    scales, crocodile food, shared name, or use in feeding the crocodile.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Subsidiary totems may not be eaten, and in some cases may not be touched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Mukaua district each clan has a clan chief, and over them is a paramount
    chief who voices final decisions in assemblies concerning war, raids, and grave
    matters.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Clan chiefs decide timing and food quantities for clan feasts in which food
    is exchanged with people of the same clans living some miles away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hunting-party leaders are often appointed by clan chiefs; they arrange the
    meeting place, manage the hunt, and divide the game afterward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Chiefs have no special language, title, form of address, ornaments, or distinctive
    burial, but receive a portion of game and are passed with bent bodies by women
    or youths when chiefs are talking together.
  category: attribute
  evidence_refs:
  - ev:6
