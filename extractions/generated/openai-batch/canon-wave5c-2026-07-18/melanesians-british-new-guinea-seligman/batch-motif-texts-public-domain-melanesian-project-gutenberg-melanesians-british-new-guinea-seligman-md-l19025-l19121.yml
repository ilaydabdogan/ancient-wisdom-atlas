canonical_text:
  quote: ''
  summary: The passage describes the ufuapie relationship linking pangua or ikupu
    groups, its ceremonial role in death and mourning, its required public assent
    for recognizing new autonomous units, its possible role in building an ufu, and
    a solemn feast at which ufuapie chiefs present a lime gourd to a new leader and
    declare him a chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pangua, or sometimes particular ikupu within a pangua, may stand in a special
    relationship to another pangua or ikupu called its ufuapie.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives Father Egidi's explanation of ufuapie as meaning 'clubhouse
    of the other side of the village.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ufuapie has definite functions in ceremonies, especially ceremonies connected
    with death and mourning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An ekei group of an ikupu cannot be officially recognized as partly autonomous
    without the publicly declared consent of its ufuapie at a large feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The public assent of the ufuapie is also required when a new pangua comes
    into existence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ufuapie should assist in building an ufu, but such help may be avoided
    because the ufuapie may expect substantial feasting and entertainment in return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A whole pangua may be ufuapie to one or more other pangua, but in some cases
    only certain ikupu or sections within a pangua belong to a given ufuapie grouping.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When an ikupu or pangua seeks independence, it chooses an ufuapie, because
    consent of the ufuapie is required before action can proceed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A new unit commonly selects the same ufuapie as the pangua from which it originated,
    but it may choose ufuapie partly or wholly from other pangua.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ufuapie of a new unit may be influenced by the site where the unit builds
    its houses, especially if it moves to another village.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A weak new unit may take the iauafangai, ufu, and even kangakanga of its neighbours.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the recognition ceremony, the new unit gives a large feast, chiefs of neighbouring
    villages come to the ufu, and fda chiefs of the ufuapie present a lime gourd called
    faonga to the leader and declare him a chief like themselves.
  category: sequence
  evidence_refs:
  - ev:7
