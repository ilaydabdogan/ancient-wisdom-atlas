canonical_text:
  quote: ''
  summary: The passage describes an ethnographic account of changing morality in the
    south-eastern district. It states that older morality was primarily group-based,
    with public opinion judging individuals. It describes compensation for theft,
    the accepted killing of an adulterer by an injured husband, financial responsibility
    involving relatives and clansmen, revenge in inter-community war, and automatic
    inheritance arrangements.
  language: English
  quote_policy: summarized
