canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing dance practices at Wagawaga, Tubetube,
    and Bartle Bay: a shy dusk drum-circle dance at Wagawaga; a rehearsal and description
    of rurepo, formerly associated with cutting, cooking, and eating an enemy and
    using decorated skulls on sticks or paddles; the reported discontinuation of dancing
    at Tubetube after a native teacher allegedly removed dancing feathers; and conventionalized
    pantomimic dances at Bartle Bay, including a named lizard dance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, the only spontaneous dance observed by the party occurred one
    evening at dusk as the party was leaving, and the performers stopped when approached
    closely.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A number of men with drums formed a circle about five metres across, with
    non-performers of both sexes grouped around the outside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Wagawaga dance appeared to include one man leaving the circle and leaping
    into the air while holding his drum above his head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rurepo was stated to have formerly been danced during the cutting up, cooking,
    and eating of an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rurepo was said to be accompanied by shell conches and single drum beats played
    by men who were not themselves dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rurepo dancers each held a stout stick or canoe paddle inserted into the foramen
    magnum of a skull brought from the potuma and decorated with croton leaves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sticks with skulls were raised and lowered while their holders jumped
    and stamped up and down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each rurepo performer had a white-painted face with a dark line running down
    the middle of the face over the nose, lips, and chin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: It was stated that any performer might dance rurepo with any skull from the
    potuma, without seeking or avoiding the skull of his own kill.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rehearsal skulls were four in number, were not kept in the potuma, were
    hidden in an undiscovered place, and were still valued.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Tubetube, it was said that no dancing occurred in the present day because
    of the opposition of the native teacher, who allegedly had taken away the dancing
    feathers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Bartle Bay, many dances were described as pantomimic but highly conventionalized;
    a photographed example was called the lizard dance, while dances at the walaga
    ceremony appeared not to be pantomimic.
  category: attribute
  evidence_refs:
  - ev:8
