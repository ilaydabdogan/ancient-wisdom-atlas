canonical_text:
  quote: ''
  summary: The passage describes named and group rights over the corner posts of a
    Hohodai dubu, explains a Tupa iduhu claim through genealogy and temporary group
    affiliation, describes dubu construction for tabu feasts and their orientation
    toward another dubu, notes carved clan-badge terminals and human-head carvings
    on posts, and states that the Koita have no origin legends for the dubu.
  language: English
  quote_policy: summarized
