  text: Four corner posts of the new Hohodai dubu are associated with specific masters
    from named persons or iduhu groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tupa iduhu owns hereditary garden land near Korabada and Akorogo but is said
    to own no land close to Hohodai.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A family that should have belonged to Tupa iduhu temporarily merged its identity
