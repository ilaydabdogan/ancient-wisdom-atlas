canonical_text:
  quote: ''
  summary: The passage describes food taboos for unmarried people, pregnant women,
    mothers after childbirth, and husbands in several named communities, including
    restrictions on particular foods, food-capture methods, cooking vessels, water
    temperature, naming/status terms, and handling of food remains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that old men generally abstained from human flesh, while
    other food restrictions for young men, young women, and older women are referred
    to elsewhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Bartle Bay, unmarried people of both sexes avoided wallaby because the
    food was said to make members of the opposite sex dislike them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Bartle Bay, unmarried people also avoided a root from a lily-like plant
    because it was said to cause rash, enervation, and unsatisfactory sexual connection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Wagawaga, a pregnant woman was forbidden fish caught in a net and sugar
    cane, while line-caught or speared fish, pig, and wallaby were not taboo; her
    own food was cooked in a special smaller saucepan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Tubetube, a pregnant woman was forbidden turtle, tuai fish, and fish caught
    in small-mesh kware scoop nets; the passage states that eating fish from kware
    was linked to prolonged labor and probable death undelivered, whereas fish caught
    in the large-mesh inai net could be eaten.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Wagawaga, a mother after childbirth was restricted for at least a month
    to boiled taro mixed with whole okioki fruit, eaten from a small new pot; after
    the first month she still could not drink cold water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Tubetube, a young mother during the puerperium could drink only warm water
    and had to avoid fish, turtle, and pig, under penalty of her child becoming sick
    and probably dying.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Bartle Bay, women friends prepared special food for a woman pregnant with
    her first child and her husband; the woman was called meumeu until the child was
    born and kamoti afterward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: From first being called meumeu until childbirth, the woman prepared and cooked
    her food, ate by herself, and had the peelings thrown into running water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband of a meumeu was forbidden to plant sugar cane or uri and had to
    avoid tying leaves or tops in a bent position on vegetable food destined for his
    wife; the husband of a kamoti was not restricted in this way.
  category: action
  evidence_refs:
  - ev:7
