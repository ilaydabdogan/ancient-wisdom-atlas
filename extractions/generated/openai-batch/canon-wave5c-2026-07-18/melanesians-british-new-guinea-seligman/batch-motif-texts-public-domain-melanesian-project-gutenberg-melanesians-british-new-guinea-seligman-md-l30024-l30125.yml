canonical_text:
  quote: ''
  summary: 'The passage describes inheritance and guardianship practices: a man''s
    utilitarian personal goods commonly pass through his sister''s children or maternal
    uncle, while valuables may partly pass to his own children; a woman''s gardens
    and valuables are divided among children and siblings; at Bartle Bay property
    may be used for burial obligations or burned at a death feast; widows and children
    often move to maternal relatives; houses where a man died may be abandoned, altered,
    or left to rot partly because of fear of returning spirits of the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes two categories of a man's personal property for
    inheritance purposes.
  category: other
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A man's drums, lime pots, lime spatulae, and canoe or canoes are said to pass
    to his sister's children, even if those children are all girls.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a man has no sister's children, his maternal uncle takes the canoe and
    other property such as drums and fishing nets; after the maternal uncle's death,
    the property reverts to the dead man's own brothers and sisters.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Valuable items such as armshells and sapisapi necklaces may partly pass to
    a man's own children, and some pigs may sometimes pass to his children, though
    the children would not dare eat the pigs themselves.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man's lifetime gifts of valuable jewellery to his own children are remembered
    and counted against the children after the father's death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An ill man may state that particular jewellery should descend to his children,
    and the passage says such wishes would be respected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: When a man is childless and has no surviving brothers or sisters, his sister's
    children take all his property.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman's garden property is divided equally among her children; if the children
    are young, their mother's brothers look after the gardens and may use crop portions
    not needed to feed the children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman's personal property passes to her brothers and sisters in equal parts
    if her children are small, but later some valuable property such as armshells
    is given to the children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: If a woman's children are grown, girls inherit baskets and pots, while boys
    and girls alike inherit a portion of valuable property such as armshells and jewellery;
    part of the valuable jewellery still goes to the woman's brothers and sisters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Bartle Bay, when a man dies, much personal property is used to pay for
    burial offices, and some property is reserved to be burned at the tovela that
    completes the death feasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Bartle Bay, a man's coconut palms and fruit trees go to his sister's children,
    though he can state limited wishes about disposal after death, and these wishes
    may be respected.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A widow remains only a short time in the dead husband's house and usually
    goes to live with a brother, taking her children with her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Children who move with their widowed mother come under the immediate care
    of maternal uncles, who are described as natural guardians responsible for the
    boys' education.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a woman dies, her brother is described as more responsible for the children
    than their father.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: In olden days, the house in which a man died was usually shut up and left
    to rot; if it was new and good, it might be used by the dead man's sister's children
    after closing the old doorway and cutting a new one.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: If the death house was shut up and left to rot, the site remained unoccupied
    for some time but was ultimately built on by the dead man's sister's children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The passage states that deserting or destroying the house may be a sign of
    sorrow and is also thought to prevent evil spirits from returning and affecting
    other family members.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:19
  text: The passage notes that orphan children should live with their mother's relatives,
    usually her brothers, but that clan strength and willingness or ability to support
    the children can alter this rule.
  category: sequence
  evidence_refs:
  - ev:9
