canonical_text:
  quote: ''
  summary: The passage recounts an unnamed youth preparing spears and platforms to
    kill a cannibal pig ogre, sending its bristles by raft to exiles so they return.
    It then gives the story of Dabedabe, a boy born among pigs who restores pigs from
    bones washed in rivers and substitutes pigs for human captives at a walaga feast.
    The final fragment begins a tale in which a boy emerges from a mapa-tree nut,
    armed and adorned, and enters a village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother says the village people crossed to islands because a pig ogre ate
    many of them, and she warns the young man that the ogre will kill and eat him
    if it sees him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man cuts trees, makes many notched and barbed spears, and seasons
    them in smoke over many weeks.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The young man builds a series of long, high platforms and stacks the spears
    on them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pig ogre sees the platforms from its mountain lair, comes down, and attacks
    while the young man throws spears from platform to platform.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the last platform the young man thrusts a special spear into the pig ogre's
    mouth and kills it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man plucks the dead pig's bristles, puts them on a raft, and sends
    the raft toward people who are sad and mourning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The exiles see the raft, understand that the pig ogre is dead, return to their
    country, feast on the pig, and live in peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A sow gives birth to a litter containing pigs and a boy; a man takes the boy
    home and gives him to his wife to suckle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After villagers cook meat from the hunt, the boy says they have killed his
