  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Dabedabe has sores on his body and has only one friend, a little boy who looks
    after him.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Dabedabe sends the little boy to determine whether an inland feast will eat
