canonical_text:
  quote: The custom itself is called taubu.
  summary: 'The passage describes miscellaneous death-related taboos: neighbours of
    a dead man and strangers visiting nearby houses must avoid going to new gardens
    until after the lahidairi ceremony, though old gardens may still be visited for
    food. The avoidance is attributed to proximity to the corpse, which is described
    as highly aina, or in Motu terms helaga; the custom is called taubu.'
