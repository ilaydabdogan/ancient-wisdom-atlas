literal_observations:
- id: obs:1
  text: Some informants said ancestral history extended back to Kelrara or Keherara
    near East Cape, while another stated location was an island near Duau called Wagilona.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain Tubetube men have land rights on the neighbouring island of Narunaruwari,
    where the Hanawesu stock had previously formed a settlement after a quarrel with
    Lekekeu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hanawesu people returned to their present Tubetube site within roughly
    the previous thirty years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A recent immigration of a stock or stocks called Koiaria by Tubetube men had
    peopled Naruwaruwari, though the passage says the full composition of its inhabitants
    was unclear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bartle Bay is described as a shallow crescent-shaped indentation on the south
    coast of Goodenough Bay, roughly fifty miles west of East Cape.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The area around Bartle Bay is hilly and broken, with nearby hills reaching
    about 3,000 feet, while Cape Frere forms a hilly eastern promontory.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A narrow fertile plain near Bartle Bay is crossed by the Wamira River and
    another smaller stream and contains gardens belonging to Wedau and Wamira people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wedau and Wamira settlements stretch along much of the pebbly beach, and their
    houses are mostly low oblong ground-built houses, with a few raised on piles.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people of Wedau and Wamira are described as showing practically no differences
    in physical character and habit and as sharing many customs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The small hill settlements behind Bartle Bay resemble Wedau and Wamira people
