canonical_text:
  quote: ''
  summary: The passage describes reported Koita and Motu beliefs and practices concerning
    sorcery, exorcistic healing, charms, payment to a sorceress, extraction of objects
    from a patient, invocation of named spirits, ritual taboos, house blessing, and
    a formula for the return of a life-spirit to a sick person. It ends with a caution
    that Romilly's reports of spirit invocation are vague and do not clearly separate
    observation from hearsay.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says an accurate account of esoteric Koita sorcery is probably
    no longer obtainable.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Motu people are reported to have believed that Koita had power to exorcise
    malevolent agencies, and the author adds that Koita may have held a similar belief
    about Koiari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In cases of sickness, a Motu person would generally send for a Koita man,
    or more often a Koita woman, for treatment by charms and with payment of a fee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman reputed as a sorcerer was paid yams, a fishing net, and money to cure
    a man, and she passed a charm three times around the patient's head and body while
    muttering incantations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Romilly's described treatment of a child combined incantations to exorcise
    a malevolent spirit with massage and suction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sorceress in the child-treatment account carried a small bag of charms,
    and the village became silent when she began to sing or speak.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the child-treatment account, the sorceress made passes over the child
    and produced a spear point, a stone, and mouthfuls of blood-like substance from
    the patient's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The account says that in a bona fide performance a spirit should enter the
    sorceress, bystanders would leave, and during convulsions she would roll into
    salt water so that the spirit departed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The translated incantation names three spirits: Devase, Horumagi, and the
    female spirit Vaganamagi.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The translated incantation says spirits got hold of the woman and insisted
    that she speak; she put her fingers in her ears and on her eyelids, then forbade
    inland and grass spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ritual account says the sorceress made the sick person sacred, ate food
    from the house, avoided water except coconuts for eight nights, avoided fish,
    and at the end was sacred.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sorceress called Devase to the house, reported Devase's command to swing
    the rami, blessed the house, and blessed fishing, turtle seeking, and dugong seeking.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: When standing over a sick person, the sorceress told the spirit to return
