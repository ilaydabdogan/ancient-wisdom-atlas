canonical_text:
  quote: ''
  summary: The passage describes the Waima/Bereina ceremony in which a boy, after
    ear-piercing and while still a miori, assumes the perineal bandage called itaburi.
    His father kills a dog, displays it at the front of the house, and gives it to
    the boy's maternal uncle. The maternal kin eat the dog, and the maternal uncle
    places the itaburi on the boy in his own house while the father and paternal relatives
    are absent. The dog is described as a kind of price for the boy's assumption of
    the itaburi, with a pig as an inferior substitute if no dog is available. Notes
    mention that the hanging dog publicly announces the coming investiture, and another
    note cautiously compares a separate Waima birth ceremony involving women with
    bows or spears to a Koita ceremony.
  language: English
  quote_policy: summarized
