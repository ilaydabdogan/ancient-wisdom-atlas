canonical_text:
  quote: ''
  summary: 'The passage summarizes Mekeo social organization: the Biofa and Vee tribes,
    their original clans, clan-associated trees, reciprocal ufuapie relations, marriage
    restrictions, villages, hereditary chiefs and clubhouses, differentiated chiefly
    offices, warfare magic, clan fission into ngopu groups, changing clan badges and
    clubhouse names, and the reduced modern role of ufuapie in marriage regulation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mekeo is described as formed by two tribes, Biofa and Vee, each originally
    consisting of two pangua or clans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two tauafangai trees, ongoi or breadfruit and a palm called undu, were each
    assigned within the tribes to one pangua standing in reciprocal ufuapie relation
    to another pangua.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marriage was not allowed within the pangua; the stated bars to marriage were
    identity of pangua or near blood relationship.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Biofa and Vee each occupied a village east of the St Joseph River, named
    loiovina and loiofaopo respectively.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each pangua had a hereditary chief, the lopia fda, responsible for the upkeep
    of the pangua clubhouse and for official representation in important ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Important ceremonies are said to have centered around the clubhouse.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage distinguishes high chiefs, war chiefs, and lopia ekei, with the
    lopia ekei officially assisting the high chief on ceremonial occasions and sometimes
    becoming a de facto head of families.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: War chiefs often had a clubhouse of their own or an assigned side of a shared
    clubhouse; they sometimes renamed clubhouses to commemorate deeds.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some clubhouses were set apart for warfare magic prepared and celebrated by
    faia experts or faia lopia.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The magic of the faia experts is described as giving victory to the community
    and is distinguished from sorcery.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The original Biofa pangua were Inawi and Inawae, and the original Vee pangua
    were Ngangai and Kuapengi.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: As new groups formed and split from parent pangua, the original pangua names
    became names of ngopu groups tracing common descent from original stocks.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Groups formed by fission often retained the tauafangai and clubhouse name
    of the parent pangua but took new kangakanga clan badges and sometimes new clubhouse
    names.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The ufuapie relationship is said to retain little of its former importance
    in marriage regulation but to remain important in mourning rites and in ceremonies
    recognizing a new pangua or ekei group within a pangua.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Father Egidi is reported as recognizing centers of origin for immigrant stocks
    settled in Mekeo villages, including Vaingu and a center near Amoamo Inaukina
    on the Biaru River called the Maakunga.
  category: setting
  evidence_refs:
  - ev:13
