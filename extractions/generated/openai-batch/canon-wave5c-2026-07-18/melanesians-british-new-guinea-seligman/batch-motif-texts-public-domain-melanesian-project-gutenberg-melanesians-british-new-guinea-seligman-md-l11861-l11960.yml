canonical_text:
  quote: ''
  summary: 'The passage describes the external relations and trade of the Roro-speaking
    tribes: limited trade contacts, canoe building and purchase, an annual au nohi
    voyage, exchange networks for ornaments and tools, market exchange with Mekeo,
    intermarriage and petty warfare, attacks by Elema groups, friendship with the
    Nara village Oroi, and guest invitations to a niarea inauguration.'
  language: English
  quote_policy: summarized
