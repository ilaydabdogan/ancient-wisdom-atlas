candidate_motifs:
- id: motif:1
  label: Mourning ended through washing and removal of mourning signs
  taxonomy_refs: []
  basis: Widow, widower, and children are treated after mourning by washing or scrubbing,
    removing black pigment, removing ornaments, and changing mourning dress.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage describes ritual actions but does not explain their symbolic
    meaning beyond ending or altering mourning.
- id: motif:2
  label: Kin-assigned mortuary obligations
  taxonomy_refs: []
  basis: Specific kin categories are assigned tasks such as making ornaments, washing
    mourners, fetching bodies, digging graves, placing corpses, cleaning bones, and
    providing feasts.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: Some kin relationships involved in bone removal and wearing are explicitly
    reported as uncertain by the author.
- id: motif:3
  label: Curation and wearing of the deceased's bones
  taxonomy_refs: []
  basis: Skulls are kept in houses, oiled and polished, while atlas bones, phalanges,
    and lower jaws are worn by children, widows, or widowers.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage does not state a doctrinal or mythic explanation for wearing
    or curating the bones.
- id: motif:4
  label: Transformation of human bones into restricted implements
  taxonomy_refs: []
  basis: Forearm bones, fibulae, and other long bones are made into spatulae whose
    use is restricted to certain lubai or, in the woman's case, used by the widower
    and lubai.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage does not clarify the practical or ritual contexts in which
    the spatulae are used.
- id: motif:5
  label: Final deposition of remains in cliff shelters or caves
  taxonomy_refs: []
  basis: After household keeping, skulls and other bones are placed on rock platforms,
    in shallow rock shelters, or in a shallow cave above the shore.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage contains uncertainty about the exact timing of removal of
    all bones from the grave.
- id: motif:6
  label: Sex-reciprocal mortuary handling of spouses
  taxonomy_refs: []
  basis: The passage explicitly compares rites for widows and widowers and describes
    analogous treatment of bones after deaths of men and women.
  evidence_refs:
  - ev:1
  - ev:2
