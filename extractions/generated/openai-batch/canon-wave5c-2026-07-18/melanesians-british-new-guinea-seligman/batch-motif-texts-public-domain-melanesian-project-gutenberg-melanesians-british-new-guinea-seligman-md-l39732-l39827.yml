  confidence: medium
  cautions: The male and female cases are not identical in all named kin duties, and
    some details are incomplete or uncertain.
comparison_claims:
- id: claim:1
  claim: The widow's and widower's mourning-ending rites have the same general function
    of removing visible mourning signs through shore washing or scrubbing and removal
    of ornaments or dress markers.
  claim_level: same_function
  target: Widow and widower mourning-ending rites within the passage
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage says the widower undergoes a similar process, but it does
    not provide an explicit interpretation of the rite.
- id: claim:2
  claim: The handling of a deceased woman's bones is presented as functionally parallel
    to the handling of a deceased man's bones, including removal of bones, skull curation,
    bone spatulae, jaw wearing, and final placement in rock shelter or cave.
  claim_level: same_function
  target: Male-death and female-death bone rites at Kwaiawata within the passage
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The author reports uncertainty about some bone-removal timing and relationships,
    and the detailed kin assignments differ between male and female cases.
