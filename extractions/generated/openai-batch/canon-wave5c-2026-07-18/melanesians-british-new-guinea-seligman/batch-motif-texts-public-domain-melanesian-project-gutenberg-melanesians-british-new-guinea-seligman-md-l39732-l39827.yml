canonical_text:
  quote: ''
  summary: The passage describes mourning-ending rites, burial duties, removal and
    cleaning of bones, household curation and wearing of bones, making of bone spatulae,
    mortuary feasting, and final deposition of remains in rock platforms, rock shelters,
    or shallow caves at Kwaiawata and related contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead woman's sister is described as responsible for making mourning ornaments
    for the widower; the passage also states that when a woman dies, skull and bones
    are removed from the corpse as in the male case.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widow discards mourning ornaments about ten months after her husband's death,
    after she and her relatives make a feast for the dead man's siblings and sisters'
    children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow's sisters-in-law take her to the seashore, wash her, remove newly
    applied black pigment, and cut short her long mourning petticoat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'A widower undergoes a similar process: his dead wife''s sisters scrub black
    pigment from his body and remove mourning ornaments originally made for him.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dead man's children are similarly treated after mourning, with the sons
    of the dead man's sisters, called kada, said to officiate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Kwaiawata, a man who dies away from his own village is fetched by his sisters'
    children; his grave is dug by his mother and sisters' children, not by his father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The corpse of the dead man is placed in the grave by his mother-in-law and
    sisters' husbands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A feast called sagalz is provided by near kinsfolk one or two days after burial
    and is eaten by people of all clans except the deceased man's clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Specific bones, including forearm bones, fibulae, phalanges, skull, and cervical
    vertebrae, are removed from the corpse and taken to the beach to be cleaned by
    the mother-in-law and others, perhaps including the widow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Forearm bones and often fibulae are made into spatulae by certain lubai, and
    the use of the spatulae is said to be confined to those lubai.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The clean skull of a dead man is kept in the house by his widow and children;
    the children wear his atlas bones and phalanges around the neck or in the hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Male children wear their father's lower jaw; if the dead man has no son, the
    lower jaw is worn by his widow.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The skull, cleaned bones, and bone spatulae are kept in the house for about
    twenty months; during this time the skull is regularly oiled, rubbed, and polished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: After household curation, the skull and many bones are finally deposited on
    rock platforms and in shallow rock shelters in cliffs above the shore.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: Rock shelters visited at Kwaiawata contained skulls, femora, ribs, vertebrae,
    tibiae, and other bones, indicating that all bones of the body were removed at
    some time.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: The author reports uncertainty about whether all bones are removed at skull-taking
    or whether the grave is reopened later; the author considers later reopening probable.
  category: other
  evidence_refs:
  - ev:6
- id: obs:17
  text: When a Kwaiawata woman dies, her grave is dug by her husband and children,
    and her husband places the corpse in the grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: For a deceased woman, the widower and his brothers, and perhaps sisters, remove
    the bones; bone spatulae from arm and leg bones are used by the widower and certain
    lubai.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The widower keeps the treated skull of his dead wife and wears her lower jaw.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: After keeping the skull and bone spatulae for some time, the widower and his
    brothers appear to dig up remaining bones and place them in a shallow cave or
    rock shelter.
  category: sequence
  evidence_refs:
  - ev:7
