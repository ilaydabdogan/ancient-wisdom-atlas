canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking chieftainship, including war leadership,
    feast invitations, ranked food distribution, the Parama Kupunu senior chief, the
    ceremonial office of ovia akiva, magical war chiefs, hereditary succession, female
    temporary officeholding or transmission, and an office-qualifying ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In serious intertribal warfare, the ovia ahuahu's battlefield authority is
    described as subordinate to that of the paiha chief or chiefs, who are responsible
    for disposing the whole force in the enemy's presence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In faction fights and quarrels between friendly groups, the paiha chief is
    not consulted and the ovia ahuahu leads the war party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plans of campaign or policy are discussed by village old men and settled with
    the concurrence of the ovia itsipana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Paiha chiefs are described as leaders in the field and as experts in magical
    ceremonial for successful warfare; they may also be ovia itsipana or ovia awarina.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Important feast invitations are issued in the name of the ovia itsipana, who
    instructs the ovia awarina to send messengers to invite chiefs of neighbouring
    itsubu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Feast messengers take bunches of areca nut, hang one in the marea of the ovia
    itsipana of each summoned local group, state the feast time, and the invitation
    is understood to extend to the chief's clansmen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Big feasts are given in the name of two chiefs of the food-providing clan,
    while smaller feasts may be given in the name of one chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chiefs whose names are attached to a feast distribute the food and ceremonially
    taste it before allotment, but do not eat it themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Chiefs of visiting itsubu receive ranked portions of pigs killed for the feast,
    including the head or half head, hams, and forelimbs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Parama Kupunu is described as the oldest Roro itsubu and, before government,
    probably the strongest; its ovia itsipana exercised authority over the whole Roro
    tribe and was called ovia pakana kauna, 'big chief man.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Parama Kupunu chief's influence has diminished, but he still takes precedence
    at feasts and may ask ovia itsipana of other villages to taboo their coconuts
    for a feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ovia akiva, or 'chief of the knife,' ceremonially cuts up pigs at big
    feasts, but does not help kill or cook them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The ovia akiva is described as less important than the ovia awarina and as
    a hereditary office-bearer or carving expert rather than a chief in the full sense.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Paiha ovia are described as magical 'departmental experts.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Chieftainship of the right, left, and war, as well as the akiva function,
    is hereditary and, as far as possible, passes from father to son.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: If an ovia itsipana has no son, his eldest daughter may act until her eldest
    son can assume office; a woman ovia akiva in Paitana villages will transmit the
    office to her son.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: A woman who is ovia itsipana or ovia akiva does not enter the marea or take
    part in ceremonies centered on it; her husband or son takes her place on the marea
    and at festivals, while invitations are issued in her name.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: A woman could not be ovia awarina because the ovia awarina had usually killed
    his man and led his clan in war.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: When the direct male line of an ovia awarina died out, a substitute would
    be sought in his brother or, failing that, the brother of an ovia awarina of the
    same itsubu in another village.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: A man acknowledged as heir to a chieftainship would not be recognized as chief
    after his father's death unless he had participated in the ceremony called at
    Siria bearai.
  category: sequence
  evidence_refs:
  - ev:10
