canonical_text:
  quote: ''
  summary: The passage describes a Tubetube account of retaliatory warfare against
    Basilaki after a Tubetube man has been killed. It includes a note on restricted
    eating of human flesh, mourning by felling coconut trees, selection of a clan-related
    war leader, a pre-raid feast and speech, quiet night travel, a dawn raid on a
    hamlet, seizure of a prisoner and a body, looting and destruction, and post-raid
    drumming, conch blowing, and besa dancing from which the killer and captor abstain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women and children generally did not eat human flesh, but a woman might receive
    a small portion so that she might bear a strong child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tubetube account concerns what would happen if a Tubetube man were killed
    by men of a hostile Basilaki community; the information is said to come from older
    men who had taken part in similar raids.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men returning in a canoe without one of their party paddled slowly and wailed
    for their dead comrade as they neared the Tubetube beach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After people on shore were told that a brother had been killed, mourning customs
    began with the felling of two coconut trees belonging to the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When vengeance was decided, a war-party leader titled taniwaga was selected
    from the same clan as the dead man; he and his near relatives supplied much of
    the food for the losuma feast before departure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Once the men were aboard, the taniwaga spoke to them in general silence, urging
    vigilance against spears, strength in fighting, and the taking of payment; after
    the speech there were no conches or shouting, and the canoes left quietly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The voyage was arranged to arrive before daybreak; a dark night was selected
    to avoid being seen, with direction judged by the wind.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Basilaki the canoes were moored in a quiet bay away from the hamlet, with
    men left in them so that a quick retreat would be possible.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Armed parties surrounded the hamlet; the leader mounted a house platform and
    tried to break in, commonly using a blackwood sword as a lever.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Noise from the attempted break-in generally woke the inmates, whose cries
    to rouse others became the signal for the raiders to rush the houses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A surprised hamlet usually rushed for the bush; there was no pursuit, but
    if immediate reprisals were not feared the hamlet was looted and burnt, coconut
    trees were cut down, and other damage was done.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If one prisoner was taken and one man killed, both were dragged to the canoes
    regardless of their totems, and at this stage even the body of a person of one's
    own or father's totem could be mishandled.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After paddling to a safe distance, the canoes formed a line; men used drums
    and conch shells and danced the besa, except those needed to handle the canoes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The slayer of the dead man and the captor of the prisoner did not join the
    drumming or dancing but sat quietly with bent head and downcast eyes; one informant
    said no one in the canoe containing the prisoner and body joined.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Near Tubetube, the sail was lowered, drums were beaten, conch shells were
    blown, and besa was danced again, while the killer and captor remained silent
    with heads lowered.
  category: sequence
  evidence_refs:
  - ev:11
