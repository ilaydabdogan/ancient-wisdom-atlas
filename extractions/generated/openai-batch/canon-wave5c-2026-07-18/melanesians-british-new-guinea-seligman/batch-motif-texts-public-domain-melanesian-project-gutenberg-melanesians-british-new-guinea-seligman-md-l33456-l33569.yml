canonical_text:
  quote: ''
  summary: 'The passage describes a later phase of the walaga mango rite: the preserved
    mango is brought from the fasting men''s sleeping house, carried in procession,
    handled by named ritual participants, chewed pieces of young mango are spat toward
    the setting sun, and parts of the old mango are burned and kept as ashes or remaining
    pieces for future exhibitions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an undetermined interval, the preserved mango is brought out from the
    sleeping house of the fasting men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Informants gave differing explanations for bringing out the mango, including
    the rotting of the house and a dream in which the mango speaks to the taniwaga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the dream explanation, the mango asks to smell smoking pigs' fat so that
    pigs will be healthy and crops will grow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fasting men prepare a new house nearby, notify people in the surrounding
    area, and visitors arrive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The taniwaga and fasting men go in dancing costume to the earlier sleeping
    house, and ritual items, refuse bags, mats, leaves, chips, and the wrapped mango
    tree are handed out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men present wipe dust from the objects handed out and smear the dust over
    their bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mango is carried in procession into the centre of the temporary village
    and is met near the houses by the pigula, who brandishes a spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the procession stops, the mango is put down but is not allowed to touch
    the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The gugula cuts young green mangoes and places pieces in the mouths or hands
    of the fasting men, who chew them and spit the fragments toward the setting sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some informants explain the spitting toward the setting sun as a way for the
    sun to carry mango bits over the whole country so everyone will know.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The taniwaga breaks off part of the mango tree; the remaining mango is wrapped
    in new mats, while the broken portion, old mats, leaves, food, and refuse are
    later burned after sundown.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The burning is done at an ordinary fire, with no spells, and in the Gelaria
    case the fire was lit with matches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The ashes are gathered by the people, and the freshly wrapped remains of the
    mango tree are hung over the fireplace in the taniwaga's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: At later exhibitions, a piece of the mango is broken off and burned; the old
    mango may be kept until a new walaga is arranged, and a new mango can be cut when
    the old one is finished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage reports uncertainty about the fate of the ashes, including a disputed
    claim that some ashes are mixed with pig food and an unverified claim about possessing
    ashes for future feasts.
  category: other
  evidence_refs:
  - ev:7
