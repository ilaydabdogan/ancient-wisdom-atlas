canonical_text:
  quote: ''
  summary: 'The passage describes Wagawaga practices concerning infancy and youth:
    immediate handling of newborns, first-born umbilical-cord placement in a banana
    plant, sipupu feasts for maternal uncles, postpartum food restrictions, paternal
    avoidance and contact taboos, first-born food taboos, attitudes to twins, and
    practices of naming, name assumption, nickname replacement, and name avoidance.
    A footnote compares related practices at Bartle Bay.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Soon after birth, an infant's joints are extended and flexed, its head is
    stroked, and its muscles are gently kneaded once; the passage states that this
    does not appear intended to alter head shape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a first-born child, the fallen umbilical cord stump is taken by the father
    or mother to the garden and placed in the sheath of a banana leaf near the base
    of the plant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the banana plant bears fruit, the first sipupu feast is given to the
    child's maternal uncles, and produce from that plant forms part of the feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sipupu feasts are held only for the first child, commonly in a series of four
    or five about a month apart; parents cook vegetables and fish for the maternal
    uncles and their relatives, while the child's mother is excluded from eating it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For at least a month after childbirth, the mother is restricted to boiled
    taro mixed with the fruit of the okioki tree; after each sipupu more foods are
    added, and after two or three months she may eat fish and work in the garden.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the case of a first-born child, the father stays in the potuma for about
    six months and observes food restrictions; violation of the taboos is said to
    cause illness in the child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father does not see the child for about the first month, avoids passing
    close to his wife while she has the child, and does not touch the child until
    sapisapi shell-bead strings have been tied to the infant's wrists and above its
    elbows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sapisapi strings mark that the father may handle the first-born child
    without the child ceasing to thrive or becoming dangerously ill; this contact
    taboo applies only to a first-born child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A first-born child is called halafwau, while other children are called halabeafa;
    a first-born child is subject to food taboos until early childhood, with one account
    extending the yam taboo to age four or five.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Twins are generally regarded with disfavour, and public opinion formerly permitted
    their mother to suffocate one soon after birth, although twins are not described
    as a disgrace and no special explanation is given for them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Children receive names soon after birth, often from near relatives and friends;
    boys are commonly named after maternal uncles and girls after maternal aunts,
    but not after their mothers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Boys' and girls' names are distinct, and girls' names often begin with a prefix
    related to words for woman, female, mother, or maternal aunt.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Taking a friend's name is described as a compliment or sign of admiration
    and friendship; the passage gives Luta, formerly Pampam, as an example of a person
    who assumed another woman's name.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A child normally receives only one name, but the birth name may later be replaced
    in usage by a nickname based on a physical peculiarity; the passage gives Paarofa
    as an example.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The names of the dead may not be mentioned before surviving relatives, and
    this restriction could cause confusion and renaming when children had been named
    after maternal uncles or aunts.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: At Bartle Bay, according to a footnote, a father ordinarily does not touch
    his child until the umbilical cord has dropped off and does not go on a journey
    until that has occurred; soon afterward he may nurse or swing the child while
    the mother is away.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: At Bartle Bay, an unmarried woman must not nurse a first-born child unless
    she gives the child a present.
  category: relationship
  evidence_refs:
  - ev:12
