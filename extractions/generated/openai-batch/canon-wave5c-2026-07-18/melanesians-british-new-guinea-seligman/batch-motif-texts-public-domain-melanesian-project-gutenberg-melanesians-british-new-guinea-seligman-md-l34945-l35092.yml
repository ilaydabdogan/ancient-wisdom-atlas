canonical_text:
  quote: ''
  summary: The passage describes the offer and acceptance of a funerary banivi through
    a coconut token, reciprocal obligations between local or clan groups, killing
    and eating pigs with a vegetable-food gift, and the ending of specific mourning
    after the last pig. It also describes widow mourning restrictions, removal of
    ornaments, washing, food taboos, residence arrangements, remarriage consent, and
    a later feast named torela or torda in the passage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of the dead man's avu goes to another settlement with a coconut and places
    it before the taniwaga, who may accept or reject the banivi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Acceptance or refusal is constrained by reciprocal counting of banivi eaten
    between two local groups; a group in debt must accept until the numbers are even.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If neither group is in such debt, the taniwaga may refuse and send the dead
    man's avu to another group; the passage says the dead man's friends may be sent
    back and forth until someone is shamed into accepting.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man who accepts the banivi kills the pig or pigs and provides the vegetable-food
    gift called bibiko, which is cooked and sent to the dead man's settlement.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: All pigs must be eaten before the banivi can end; more banivi occur when the
    deceased was a rich man owning many pigs, though more than two pigs at one banivi
    is described as unusual.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the last pig has been eaten, specific mourning for the deceased is over
    and dancing, previously forbidden, may resume.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If another death has occurred in the community, a man may wear a sign such
    as a hair band and two cowrie shells above the elbow until dancing begins, to
    signify that he has mourned.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The widow removes one armlet for each pig killed; when the accepting community's
    taniwaga, called the lara, comes for the last pig, he strips the last armlet from
    her arm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the last armlet is removed, the widow removes her necklace and washes
    herself, but does not put on a fresh petticoat until the drums sound for the torela.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The widow discards her food taboos after the last banivi but does not eat
    pig until the torela.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Soon after her husband's death the widow lives with a near relative, usually
    a brother or sister, and ceremonially returns to her house to meet the lara for
    the banivi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The children divide their time between their father's settlement and the houses
    of their maternal uncles.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: If there is more than one wife, each wife goes through the same ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a widow remarries, everyone in her late husband's local group must assent,
    otherwise a quarrel is likely.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: A footnote states that the details about the spoken offer and who eats the
    banivi are less certain than the preceding information.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: The last banivi is determined by the number of pigs left by the deceased and
    is followed by a big feast called torda in the passage.
  category: sequence
  evidence_refs:
  - ev:7
