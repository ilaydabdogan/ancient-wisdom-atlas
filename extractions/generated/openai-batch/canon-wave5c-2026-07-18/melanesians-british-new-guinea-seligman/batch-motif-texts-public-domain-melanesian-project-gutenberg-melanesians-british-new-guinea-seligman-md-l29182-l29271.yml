canonical_text:
  quote: A binding marriage is constituted by the relatives of the girl and boy exchanging
    certain presents of food and by the young people living together publicly.
  summary: The passage describes marriage practices at Wagawaga, Tubetube, Bartle
    Bay, Wedau, Wamira, and Gelaria. It emphasizes public cohabitation, reciprocal
    exchanges of food and valuables between affinal families, special property-taking
    rights of some wife-side relatives at Wagawaga, and garden-making or alternating
    residence practices in some communities.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Wagawaga, a binding marriage is constituted by relatives of the girl and
    boy exchanging food presents and by the young people living together publicly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, the boy's mother fetches her daughter-in-law and brings her to
    the house where the mother and son live.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, the young husband's mother, father, sisters, and maternal and
    paternal uncles prepare food, and the bridegroom with brothers and cousins carries
    it to the girl's hamlet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wagawaga food is left on the watara to be divided among the bride's maternal
    and paternal relatives.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: On the following day at Wagawaga, the bride's people take food to the bridegroom's
    hamlet, where it is eaten by his family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Wagawaga, neither bride nor bridegroom partakes of the reciprocal feasts,
    which are repeated after about a month and are called muri or viuli.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Wagawaga, the term muri is extended to licensed depredations by the wife's
    sister, mother, and ail, who have a recognized right to plunder.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Wagawaga, a man's wife's sister may take things belonging to her brother-in-law,
    including canoes, fishing nets, house furniture, and personal jewellery; the rule
    does not apply to garden produce until it has been gathered.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Wagawaga, a man's sister and other members of the husband's family have
    no equivalent right to take property belonging to the brother's wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Tubetube, a binding marriage is constituted as at Wagawaga, with reciprocal
    food presents and an additional exchange in which the boy's father gives an armshell
    or bagi to the girl's mother and the girl's father returns a similar or equivalent
    gift to the boy's mother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Bartle Bay section, marriage is said to occur freely within the community,
    and intermarriage among Wamira, Wedau, Gelaria, Givari, Lavora, and other named
    groups is described as common.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Bartle Bay section, when the bridegroom announces his approaching marriage,
    his father takes pearl shells or other valuables and later food to the bride's
    folk; the bride's father gives a return present and equivalent food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Bartle Bay section, the food supplied by the bridegroom's family is
    eaten by the girl's parents and family rather than by the young couple.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Wedau and Wamira, the boy brings his bride to his father's house after
    making a garden whose produce is ready when the marriage takes place.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At Wedau and Wamira, the married couple is expected to assist the father-in-law
    in garden making without compensation; Mr Newton describes this as a sort of payment
    for the wife.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: At Gelaria, a woman generally goes first to her husband's hamlet for a short
    time while cultivation begins on his ground; then the couple goes to the wife's
    home, starts a garden, and returns to the husband's people, with this routine
    likely continuing for years but lessening after the bride's parents die.
  category: sequence
  evidence_refs:
  - ev:11
