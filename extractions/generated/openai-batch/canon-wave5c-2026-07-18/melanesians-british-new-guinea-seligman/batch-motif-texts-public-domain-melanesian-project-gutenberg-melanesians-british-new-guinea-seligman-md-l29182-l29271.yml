  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly say Bartle Bay marriage is 'as at Wagawaga';
    similarity is inferred from adjacent described practices within the same passage.
- id: claim:3
  claim: Wedau, Wamira, and Gelaria marriage practices all link marriage with gardens
    or cultivation, but Wedau and Wamira emphasize garden service for the father-in-law
    while Gelaria emphasizes alternating residence and cultivation at both spouses'
    homes.
  claim_level: same_function
  target: Garden-linked marriage practices at Wedau, Wamira, and Gelaria
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The functional comparison is limited to garden-related marriage obligations
