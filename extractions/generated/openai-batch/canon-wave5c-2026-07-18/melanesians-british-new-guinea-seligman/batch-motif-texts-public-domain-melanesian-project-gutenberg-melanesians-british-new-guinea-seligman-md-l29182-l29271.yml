candidate_motifs:
- id: motif:1
  label: Marriage constituted through reciprocal affinal exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Across the Wagawaga, Tubetube, and Bartle Bay descriptions, binding marriage
    or marriage procedure is tied to reciprocal exchanges of food and valuables between
    the families of bride and bridegroom.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage describes ethnographic marriage custom rather than a mythic
    narrative; the taxonomy term 'sacred_exchange' is used only as a broad exchange-pattern
    reference, not because the passage states sacrality.
- id: motif:2
  label: Bride transfer and public co-residence as marriage marker
  taxonomy_refs: []
  basis: At Wagawaga, public cohabitation helps constitute marriage, and the boy's
    mother fetches the bride to the house; related residence movements occur in Wedau,
    Wamira, and Gelaria descriptions.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:11
  confidence: medium
  cautions: This is a social pattern, not a supernatural or narrative motif.
- id: motif:3
  label: Affinal licensed plunder by wife-side relatives
  taxonomy_refs: []
  basis: At Wagawaga, muri includes recognized rights of the wife's sister, mother,
    and ail to plunder property belonging to the husband, while husband-side kin lack
    reciprocal rights.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives this as a local legal or customary rule; no wider comparative
    scope is demonstrated in the passage.
- id: motif:4
  label: Marriage payment through garden labor and cultivation
  taxonomy_refs:
  - sacred_exchange
  basis: At Wedau and Wamira, garden-making assistance for the father-in-law is described
    as a sort of payment for the wife, and at Gelaria the married pair's movement
    between homes is linked to beginning gardens.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage reports a marriage-economy practice; the exchange motif assignment
    is broad and should be reviewed.
