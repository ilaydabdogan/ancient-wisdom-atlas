- id: claim:2
  claim: The Bartle Bay exchange of valuables and food appears functionally similar
    to the Wagawaga and Tubetube marriage exchange pattern, especially in reciprocal
    gift-giving between affinal families and exclusion of the young couple from consuming
    the food.
  claim_level: same_function
  target: Bartle Bay, Wagawaga, and Tubetube marriage exchanges
  evidence_refs:
