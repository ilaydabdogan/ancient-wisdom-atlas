canonical_text:
  quote: ''
  summary: 'Ethnographic account of several kinds of ritual expertise and magic: wallaby
    hunting charms and summoning, food presentations to fish and banana experts, rain
    control by a rain expert with charm stones and water, and paiha chiefs or experts
    whose magical function is to secure success in war.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before a wallaby hunt, the wallaby expert abstains from intercourse with his
    wife for a month, makes a new perineal bandage, and adds grass or leaves from
    the marea thatch to wallaby medicine made of leaves, bark, and white stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wallaby expert burns off grass, scatters wallaby medicine over the cleared
    area, calls a wallaby name, and verbally summons wallabies of different sizes,
    sexes, and ages to come to that place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning later, the wallaby expert observes tracks and young grass,
    scatters more medicine including wallaby and turtle heads, buries a wallaby skull
    and a white wallaby stone, and again summons the wallabies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the hunt begins, the expert lies or pretends to lie asleep in the cleared
    area while covered with native cloth; hunters rouse him and ask where the wallabies
    are.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the pre-hunt actions, the expert eats areca nut and smokes, and many
    wallabies are hunted and killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before larger communal fishings, food is presented to the fish expert, eaten
    by him and his relatives, and the refuse is put into the creek where the fishing
    will occur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fishing does not begin until the fish expert gives the word, invites everyone
    to participate, and directs the proceedings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Banana experts receive food when gardens are made and receive some young banana
    suckers when these are planted out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A rain expert’s staying lazily in his house wrapped in a blanket is said to
    make rain likely, while getting up and walking about the village is said to stop
    rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The rain expert has charm stones suspended by strings over vessels of water;
    the stones are lowered to touch the water when rain is wanted and raised when
    enough rain has fallen.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bats are said to frequent the rain expert’s house and to move of their own
    accord to his new house if he builds one.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Paiha chiefs are described, in their paiha functions, as departmental experts
    whose business is to ensure success in war by magical powers rather than as ordinary
    chiefs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Waima is said to possess two paiha chiefs, Rohi Aihi and Naime Miria, and
    each paiha expert has his own paiha marea.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Baki Oa is described as a peace marea chief and as chief of the right side
    of the paiha marea Bobo Rabi, but not as a paiha expert.
  category: relationship
  evidence_refs:
  - ev:9
