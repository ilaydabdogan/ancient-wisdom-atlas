canonical_text:
  quote: ''
  summary: Ethnographic passage describing the absence of formal chieftainship at
    Wagawaga, Milne Bay, and Tubetube; temporary revenge-war leadership based on kinship
    and totem relation; informal status of old or important men; Taumawal's prestige
    as a carver and drum custodian; the respectful term taubada; and age-, sex-, kinship-,
    and place-based rules for taboo foods and redistribution of fish, turtle, dog,
    pig, wild pig, and dugong through the potuma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there are no big chiefs, definite clan chiefs, or
    war chiefs at Milne Bay or Tubetube, only leaders of individual war parties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A revenge war-party leader is described as being of the totem of the deceased
    person and usually a close kinsman of that person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some oldish men are recognized as important because of roles in feasts, presumed
    magical knowledge, wealth, canoe-buying, travel, trading, fishing success, or
    craft skill.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Taumawal of Tearuwasi hamlet is described as important especially because
    of his carving skill, learned from his maternal uncle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Young men of Tubetube keep drums in Taumawal's house, following an old custom
    of keeping drums in the house of a big man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Influential men are not normally presented with fish or pig portions by unrelated
    men, but in hamlet-groups with man-houses they share food sent to the potuma they
    attend.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The term bada or taubada means old man and is used as a respectful term for
    old men of superior status and as polite address to white men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Wagawaga, there is no chieftainship, but food distribution rules direct
    much of the best food to old men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men not past middle age may not eat dog, turtle, or large kurau fish; women
    may not eat dog or turtle, though after middle age they may eat kurau.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the food prohibition is enforced by belief that eating forbidden
    foods will make a man unpleasing to the opposite sex.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Tubetube, young people may not eat ivetoa or nohu because these fish are
    said to have lethargic habits and eaters might contract similar habits.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: A middle-aged man who catches a turtle gives it to his father, who takes it
    to the old men's potuma to be cut up and eaten.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Large fish are partly directed to the potuma for old men, while smaller fish
    may be divided among younger men for cooking and eating in their own hamlets.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A man killing a dog is expected to take it to the potuma, where old men, including
    the giver if old enough, eat it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: When wild pig is killed, part is given to owners of pig nets, while a portion
    including the head and jaw is taken to the potuma; dugong flesh also goes to potuma,
    with head and jaw apparently going to the old men's potuma.
  category: sequence
  evidence_refs:
  - ev:9
