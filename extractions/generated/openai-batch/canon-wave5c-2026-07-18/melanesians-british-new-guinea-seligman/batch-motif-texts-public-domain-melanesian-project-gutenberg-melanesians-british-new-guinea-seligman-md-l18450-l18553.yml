canonical_text:
  quote: ''
  summary: The passage describes internal divisions within a pangua. The basic unit
    is the ikupu, a broadly defined family group whose members generally trace descent
    from a common ancestor. Stronger clans in Inawi commonly divide into fdangiau,
    translated as “first born,” and ek'ei, meaning “subsequently born.” Some ikupu
    groups publicly declare autonomy, invite ufuapie chiefs to acknowledge their status
    at a feast, and may gain recognition for a new chief. A fully separated division
    may take a new name and become a new pangua, with chiefly recognition depending
    on strength, support, generosity to ufuapie, and a sufficiently grand feast.
  language: English
  quote_policy: summarized
