canonical_text:
  quote: ''
  summary: The passage describes childhood, adolescence, kinship terminology, and
    social relationship categories among the Northern Massim/S. N. G. Children may
    be named after shell valuables, are taught their totem and clan privileges or
    prohibitions, and boys receive perineal bands from their fathers. The text says
    there is no puberty initiation ceremony, but boys may sleep in a separate building
    or platform, while girls have no seclusion or girl-houses; at puberty a girl's
    teeth are blackened and she eats from a special dish while food is cooked at the
    common fire. The passage also lists kin terms and describes the non-blood, non-clan
    relationship term lubai/nubai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some children are named after valuable shell-jewellery articles; an example
    is a woman named Pilapala after a well-known armshell.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children are told at a fairly early age what totem they belong to and are
    taught the privileges and prohibitions attached to clan membership.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boys receive their first perineal bands from their father in his own house,
    without ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Naughty children of either sex are disciplined by their mother with gentle
    blows to the cheeks or shoulders, and sometimes with a stick; the buttocks are
    not struck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: While a boy's parents are alive, the maternal uncle is said not to have much
    to do with his upbringing; a child caught stealing in a garden would be taken
    to the mother for punishment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that there is no initiation ceremony at puberty, but boys
    at about that time sleep in a separate building, often an empty yam house, called
    burukuku matura and shared by members of all clans.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Siviagela in 1904 there was a roofed-over platform said to be the sleeping
    place of unmarried boys of the village.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: There are said to be no girl-houses and no ceremonial seclusion at first menstruation;
    a girl's teeth are blackened at puberty and she eats from a special dish while
    her food is cooked at the common fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman who has borne one or more children was stated to wear two petticoats.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Blood relations in general are called kadala and relations by marriage are
    called vaivai; the passage lists multiple kinship terms and their reciprocal applications.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The word lubai or nubai means dear friend or darling, is not applied to blood
    relations or fellow-clanspeople, and is said to be important in funeral and mourning
    ceremonies.
  category: relationship
  evidence_refs:
  - ev:8
