canonical_text:
  quote: ''
  summary: 'The passage describes several kinds of magical or practical experts, notes
    hereditary transmission and gift-giving, and gives a detailed account of a wallaby-hunting
    expert''s pre-hunt rites: net gathering, coconut breaking, transfer or scattering
    of cinders, root burning, taboos, washing, night assembly, ancestral invocation,
    singing, use of areca and a topi branch, animal imitation, and a Mou village note
    about a spear and areca nuts left for Oa Rove.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists hunting, fishing, planting, coconut, banana, rain, and former
    war experts, and says the art and practice are usually passed from father to son.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Experts are said not to ask for presents or demand payment, while people who
    benefit from their efforts give presents on appropriate occasions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note says that much of what is said about Roro-speaking experts also applies
    to Mekeo neighbours, and cites one family at Inawae Ikoiko as believed for generations
    to have weather power and the ability to produce rain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before a large wallaby hunt, the wallaby expert is consulted, fixes the date,
    and villagers pile their nets in front of his house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A coconut is placed on the piled nets and broken by the expert with one blow
    of a wooden club.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The expert carries cinders from a verandah fire to the expected starting place
    of the hunt; if the hunt is postponed, the cinders are scattered as a sign that
    it will not take place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For about a week the expert visits the place where the hunt is to begin and
    burns roots said to attract game.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The expert is forbidden cohabitation and may not eat food cooked by a woman,
    yams, wallaby, or pig; he may eat kangaroo-rat and drink milk of roasted unripe
    coconuts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the day before the hunt the expert washes in sea water in a coastal village,
    or in fresh water inland.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At night fires are lit near the place where the drive will begin; hunters
    meet, thrust spears into the ground, and bring nets to form part of the net wall.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The expert stands with his spear thrust into the ground in front of the hunters,
    and none of the hunters may pass beyond him toward the drive.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The expert recites spells appealing to male ancestors for as many as seven
    generations and says many wallabies will be killed; the hunters sing hunting songs
    giving reasons for needing wallaby meat.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: During the ceremony the expert chews areca nut, holds a leafy axis of dracaena
    called topi, spits on it after each invocation, and later puts on a specially
    prepared perineal band called itaduri with a long tail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The expert strikes each hunter's net with the topi branch, then hops on all
    fours like a wallaby between two rows of men; the men first fail to catch him,
    but he is caught at the far end and released.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The expert then leads the hunters to the starting place, goes aside imitating
    a wallaby's gait, is said to imitate wallaby cries and direct them toward the
    nets, and announces that many wallabies will be caught because the ancestors will
    help.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: For Mou village, Father Cochard reported that the expert's spear was left
    where it had been thrust into the ground and that a few areca nuts were left near
    it for Oa Rove.
  category: action
  evidence_refs:
  - ev:8
