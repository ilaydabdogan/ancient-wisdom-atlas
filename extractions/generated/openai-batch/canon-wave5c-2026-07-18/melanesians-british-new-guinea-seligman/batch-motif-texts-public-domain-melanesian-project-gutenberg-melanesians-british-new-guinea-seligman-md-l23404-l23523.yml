canonical_text:
  quote: ''
  summary: In the first narrative segment, two girls follow a frog-like croak, are
    led by an old frog-witch into a wet cave opened by a spoken command, escape with
    the witch’s shell necklace, and the witch is later killed by their father. In
    the second segment, Duagau and his dog find flying fish on land in a time when
    there is no sea; Duagau discovers fish swimming inside a hollow tree. After his
    mother urges men to cut it down, the tree repeatedly heals itself until the chips
    are burned; when it falls, water gushes out and settles on low-lying land.
  language: English
  quote_policy: summarized
