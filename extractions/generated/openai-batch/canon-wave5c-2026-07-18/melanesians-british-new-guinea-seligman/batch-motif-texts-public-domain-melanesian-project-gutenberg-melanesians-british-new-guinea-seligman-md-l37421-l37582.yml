canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes Trobriand clan totemism, naming four
    clans and their chief bird totems, linked animal, fish, plant, and bird associations,
    clan naming forms, and family groups. It then gives a myth explaining linked totems:
    humans are sent from Tuma, the other or lower world, by Topileta because of population
    pressure there. The clans emerge through the deep hole Rabai in a stated order,
    bringing their totem birds and some animals. Topileta also tells them to bring
    yams and cooking-pot stones from the underworld.'
  language: English with Trobriand-language terms
  quote_policy: summarized
