canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which an old woman kills boys
    born from falling nuts until a fifth boy avoids her trick and kills her and her
    husband; a short tale in which a lame man escapes while his teasing companion
    is caught and eaten by Hill people; and the beginning of a tale about the ant
    Waima and the bird Kukuku hunting pigs with a net, after which a fish-hawk steals
    pig entrails.
  language: English
  quote_policy: summarized
