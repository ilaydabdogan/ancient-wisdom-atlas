canonical_text:
  quote: ''
  summary: The passage describes carved boards associated with Roro marea clubhouses.
    It discusses a fish-charmer permitted to carve a fish bada in Boaiota marea; the
    placement, ownership, restricted use, possible sale, and repeated designs of chiefs'
    carved boards; named examples involving ovia itsipana and ovia awarina; designs
    derived from ornaments such as mairi and koiyu; and some ornamental kaiva boards,
    including one bearing a snake and a bull-roarer-like object in kaiva-board style.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man associated with Koae Kupunu itsubu was allowed to carve the
    conventional figure of his fish bada, called akicmit in the passage, in Boaiota
    marea; the author notes that his status as a successful fish charmer may have
    affected this admission.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many, though not all, marea contain carved boards suspended from the roof
    overhang, attached under the thatch, placed under the eaves, or attached to the
    front of the main post.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The designs on these boards usually render common ornaments conventionally,
    often in series, and usually do not form a recognizable baba identifying a particular
    local group or itsubu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most boards of this class are described as the property of marea chiefs and
    as belonging to the families of those chiefs, with public opinion strictly limiting
    their use.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The right to use a particular board could be sold, but only to other chiefs;
    the author suggests old and forgotten sales may explain similar or identical boards
    in different marea.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage reports similar or nearly identical board designs across several
    places, including Mou and Siria, Kevori, Siria and Maivauku of Waima.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The carvings are generally in low relief, with intaglio and relief features
    often accentuated by paint of different colors.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Figures 23 and 24 are boards belonging to, and considered the dada of, the
    ovia itsipana and ovia awarina of Koae Kupunu itsubu at Siria; they were exhibited
    on Anapua and Boaiota marea respectively.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Siria the meanings of the patterns on these boards could not be identified
    and were said to be forgotten, if they had ever had meaning.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pattern on the board of the ovia awarina is said to appear derived from
    the fretted turtle-shell ornament called koiyu at Waima.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Boards under the kaiva of Airava marea represent mairi, koiyu, and an unidentified
    thing called aria; boards on Maivauku marea bear a design called rairai, described
    as property of the ovia awarina.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some carved and painted boards under the kaiva were regarded by the author
    as ornamental rather than as a chief's personal property; one Airava board represents
    a snake.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that square-ended ornamental boards may pass into bull-roarer
    form and mentions a bull-roarer-like specimen in kaiva-board style whose history
    could not be determined.
  category: object
  evidence_refs:
  - ev:8
