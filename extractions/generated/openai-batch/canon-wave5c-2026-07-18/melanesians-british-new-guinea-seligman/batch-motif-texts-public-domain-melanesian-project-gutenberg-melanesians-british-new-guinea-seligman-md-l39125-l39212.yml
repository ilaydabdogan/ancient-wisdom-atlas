canonical_text:
  quote: ''
  summary: Ethnographic description of polygyny among the Northern Massim, including
    its theoretical restriction to chiefly families, exceptions among wealthy or feared
    commoners, the role of a first wife in approving and arranging later marriages,
    the housing and treatment of multiple wives, examples involving Enamakala and
    Toura, and contrasting rules for widows of chiefs and commoners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Polygyny is described as theoretically restricted to paramount chiefs, village
    chiefs, their siblings, and their sisters' children, understood as men in the
    direct line of descent of chieftainship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rule is reported as not strictly kept on the Trobriands, where wealthy
    commoners, especially those reputed as sorcerers, may take more than one wife
    without challenge.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A married chief would not sleep with unmarried girls or marry them unless
    his first wife assented.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first wife usually discusses the proposed marriage with her own parents
    and acts as intermediary between her husband and the girl he wants to marry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl's parents are first approached, and the girl is said in theory to
    have the right to refuse, though the passage says she usually would not object.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Presents sent to the parents of first and later wives are said to be of the
    same value, and the passage reports no observed difference in status between the
    first wife and the others.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Older or senior wives are described as receiving consideration and exerting
    influence over younger wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Each wife has her own house, regarded as belonging to her husband and carved
    and decorated like the houses of chiefs.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Enamakala's wives' houses are described as a crescent of separate houses,
    each with a sleeping platform, fireplace, and cooking utensils, with one house
    for each wife.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: MacGregor reports that old and apparently worn-out wives are treated with
    greater consideration than younger wives.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Toura is described as having five wives and Enamakala as having nineteen,
    with tobacco sticks divided among their wives with scrupulous evenness.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The widows of a paramount chief pass partly to his successor and partly to
    his other brothers; Paolu, successor to Enamakala, took eight of his brother's
    widows while the rest were distributed among other brothers.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: A commoner does not take his dead brother's wife; the widow leaves her late
    husband's house and stays with one of his relatives, usually his brother, until
    she marries again, which she is free to do.
  category: sequence
  evidence_refs:
  - ev:12
