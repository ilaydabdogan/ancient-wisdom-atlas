canonical_text:
  quote: ''
  summary: The passage discusses the uncertain significance of the mango cult and
    the walaga ceremony near Bartle Bay. It reports that mangoes are common food,
    not clearly sacrosanct, not cultivated, and not clearly linked to garden magic.
    The walaga is tentatively associated with death feasts and spirits of the dead.
    The passage also describes feast practices involving five pigs called a “mango,”
    a mango branch, a stone axe, payment, abstinence from mangoes by the bearer, and
    a reported pig-squeal sequence ending with the fifth pig being called a “mango.”
