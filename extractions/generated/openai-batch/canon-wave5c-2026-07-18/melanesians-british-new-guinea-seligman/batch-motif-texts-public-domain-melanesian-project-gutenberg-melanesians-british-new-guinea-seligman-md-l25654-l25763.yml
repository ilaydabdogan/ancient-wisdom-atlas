canonical_text:
  quote: ''
  summary: Ethnographic passage describing totemic practices among Tubetube and nearby
    communities, including food and contact restrictions for bird and fish totems,
    feather use, treatment of war dead according to totem identity, clan exogamy,
    affinal abstention from a spouse's father's totem, a Dekwasoso plant/tree totem,
    Rogea and Basilaki totem avoidance, and Wamira clan names and the term bariaua
    for totems and other uncanny agencies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tubetube man is said not to eat his own bird totem or touch it when dead,
    while still wearing its feathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tubetube men at the time described ate their own fish totems, and the passage
    says it was unclear whether this was a modern innovation; local opinion tended
    to say it had always been customary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Distinguishing totem marks or badges were not painted on men before fighting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: No attempt was made to avoid fighting clansmen, but a man who killed a clansman
    in battle would regret it and would not help carry the body to the canoes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says it was never clear whether a man formerly would have helped
    eat a hostile-community man of his own totem, but opinion tended against it.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man would avoid eating a man of his father's totem if such a person were
    killed, though no guilt attached to killing him in battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If prisoners were taken, they were questioned about a dead man's totem; if
    no information was obtained, anyone would help carry away and eat the corpse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man would not eat his father's totem bird or fish and would not wear feathers
    from his father's totem bird.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men wore feathers from their own totem birds, and a man who killed another
    clan's totem bird often gave its feathers to a friend of that clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Marriage did not take place within the clan, and sexual connection within
    the clan was avoided and regarded as immoral, though no special bad luck or formal
    punishment is described.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A married person customarily abstained from eating the totems of the spouse's
    father as a matter of courtesy and to avoid discomfort or quarrelling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two old men of Dekwasoso said that their plant totem, the tree kaikuari, would
    have been cut down and used as firewood if convenient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Rogea footnote lists several bird totems and says the hornbill binam was
    linked with a shark, a constrictor snake, and a tree.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Young men from Basilaki and Rogea said they would not eat either their own
    or their fathers' bird or fish totems.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Wamira, Wedau, and Gelaria communities are described as made up of clans
    named from real or hypothetical bush settlements or stocks.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Magala, chief of the Wadubo moiety of Wamira, is identified with the Iriki
    clan and described himself and his clan as people of Daba.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The Wamira word bariaua is used for any supernatural or uncanny agency, including
    white men before they became well known, totem animals, and non-human anthropomorphic
    beings such as Aetago.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: An unpublished paper by Rev. Copland King is cited as saying that the totem
    animal, reptile, or bird is spoken of as the father or grandfather of the family
    and that family members do not eat its flesh.
  category: speech
  evidence_refs:
  - ev:13
