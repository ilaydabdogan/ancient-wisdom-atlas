candidate_motifs:
- id: motif:1
  label: Totemic food and contact taboo
  taxonomy_refs: []
  basis: Multiple statements describe refusal to eat or touch certain own or paternal
    totems, especially bird and fish totems, and a cited Wamira report says family
    members do not eat the totem's flesh.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:9
  - ev:13
  confidence: high
  cautions: The fish-to-totem rule differs by community and by whether the totem is
    one's own or the father's; the passage records uncertainty about Tubetube fish
    totems.
- id: motif:2
  label: Totem-derived ornament and clan recognition
  taxonomy_refs: []
  basis: Men wear feathers from their own totem birds, avoid feathers from their fathers'
    totem birds, and may give feathers from another clan's totem bird to a friend
    of that clan.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage does not describe painted marks or badges as being used before
    battle; it explicitly says they were not used there.
- id: motif:3
  label: Totem identity regulating treatment of war dead
  taxonomy_refs: []
  basis: Carrying or eating a corpse after battle is described as affected by whether
    the dead man's totem is known and whether it is the slayer's own or father's totem.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage notes uncertainty about whether men formerly ate hostile-community
    men of their own totem.
- id: motif:4
  label: Clan exogamy and clan-incest avoidance
  taxonomy_refs: []
  basis: The passage states that marriage never took place within the clan and that
    sexual connection within the clan was avoided and considered immoral.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No special supernatural penalty or formal punishment is reported for the
    sexual act.
- id: motif:5
  label: Affinal courtesy through totem abstention
  taxonomy_refs: []
  basis: Married people abstain from the totems of a spouse's father to avoid causing
    discomfort or quarrels with the spouse.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage explains this as courtesy and convenience rather than as a
    directly stated supernatural sanction.
- id: motif:6
  label: Decline or absence of plant-totem respect
  taxonomy_refs: []
  basis: The kaikuari tree totem of Dekwasoso is said to have been cut and used as
    firewood if convenient, with the author suggesting that respect for it had ceased
    on the island.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The conclusion about earlier loss of respect is the author's inference,
    not a directly quoted rule.
- id: motif:7
  label: Totem as uncanny kin or ancestor
  taxonomy_refs: []
  basis: The Wamira term bariaua is used for totems and uncanny agencies, and a cited
    report says the totem animal, reptile, or bird is spoken of as family father or
    grandfather.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage reports kin terminology but does not elaborate a myth of descent
    or origin.
- id: motif:8
  label: One-legged man-killing uncanny being
  taxonomy_refs: []
  basis: Aetago is described as a one-legged non-human anthropomorphic being who kills
    men and is included among agencies called bariaua.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives only a brief classificatory mention and no narrative
    episode.
comparison_claims:
- id: claim:1
  claim: The passage explicitly says Tubetube differs from Wagawaga by holding a man's
    own bird totem in greater respect.
  claim_level: same_function
  target: Wagawaga totemic practice
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: Only the contrast reported in this passage is used; details of Wagawaga
    practice outside the excerpt are not available here.
- id: claim:2
  claim: The passage explicitly says that, in other matters, Tubetube totemic practice
    is much the same as Wagawaga, especially in avoidance of the father's bird or
    fish totem and feather rules.
  claim_level: same_function
  target: Wagawaga totemic practice
  evidence_refs:
  - ev:4
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The comparison is internal to the ethnographic account and is partly
    balanced by the stated difference regarding respect for a man's own bird totem.
- id: claim:3
  claim: Young men from Basilaki and Rogea report a comparable rule of not eating
    their own or their fathers' bird or fish totems.
  claim_level: same_function
  target: Basilaki and Rogea totem avoidance practice
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says the informants were few and young, so the representativeness
    of the comparison is limited.
