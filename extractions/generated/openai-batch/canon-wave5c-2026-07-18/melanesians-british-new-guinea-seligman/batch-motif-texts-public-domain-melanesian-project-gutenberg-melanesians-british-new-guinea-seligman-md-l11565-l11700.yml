canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking village architecture, Waima house and
    fence forms, clan organization called itsubu with patrilineal descent and exogamy,
    settlement groupings, and the distribution and meanings of several Roro clan names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro-speaking villages are said to vary little architecturally from one another
    and to resemble Motu villages, with houses not built on the beach or in the sea;
    at Waima houses are rarely raised on piles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The houses are described as rectangular and oblong, usually about twice as
    long as broad, with steep thatch, rear wall formed by thatch, a front of sago-leaf
    midribs, a raised sill, and a doorway closed by plaited coconut palm leaves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: An unusual Waima house photographed in 1898 is described as resembling a beehive
    from the front, not circular, with an ornamental ridge-pole projection and a carved
    and painted board on the pole supporting the anterior roof projection.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the carved and painted board makes it probable that
    the unusual Waima house belonged to a chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Waima gardens are said to have fences good enough to keep out pigs while in
    repair; some houses are surrounded by stout high fences, some by low fences, many
    by none, and some unfenced houses have a bamboo-marked rectangle around or before
    them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Roro-speaking tribes are divided into clans called itsubu, with descent in
    the male line; until recently their members adhered strictly to clan exogamy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author identifies Roro itsubu as corresponding units to Motu and Koita
    iduhu clans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Members of many Waima local groups, and reportedly Kevori groups, tend to
    speak of themselves as equivalent to an itsubu even when the settlement contains
    only part of one itsubu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Waima, Kevori, and Bereina are described as having compact groupings of small
    settlements, usually with householders of a single itsubu; Roro and Paitana are
    described as more spread out but tending toward compact villages with representatives
    of many clans.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The named Roro clans include Ovia Pokina, Koae Kupunu, Parama Kupunu, Aitsi
    Noobera, and Aitsi Kupunu.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage glosses pokina as origin, beginning, and secondarily steering
    paddle of a canoe; kupunu as origin, root, or lower part of a tree trunk; and
    ovia as chief.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage interprets Ovia Pokina as the stock of the chief and Aitsi Kupunu
    as the origin or stock of Aitsi.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Siria and Erierina together are said to contain representatives of each Roro
    clan; Pinupaka and Pokama each contain part of Parama Kupunu; Delena contains
    representatives of Koae Kupunu, Ovia Pokina, and Aitsi Noobera.
  category: relationship
  evidence_refs:
  - ev:8
