candidate_motifs:
- id: motif:1
  label: Humanoid non-human races with ordinary life cycles
  taxonomy_refs: []
  basis: The passage distinguishes species-like non-human beings from ogres and describes
    several classes as male and female, human-like, and in some cases breeding and
    dying like humans.
  evidence_refs:
