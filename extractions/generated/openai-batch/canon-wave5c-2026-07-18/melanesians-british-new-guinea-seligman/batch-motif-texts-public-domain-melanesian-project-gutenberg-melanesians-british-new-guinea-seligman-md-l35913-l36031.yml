canonical_text:
  quote: ''
  summary: 'Ethnographic passage reporting the absence of a discovered cult of a superior
    being, heavenly bodies, ancestors, or spirits, while describing named classes
    of non-human beings at Wagawaga and Tubetube: tree-dwelling, swamp-dwelling, mourning-associated,
    disease-causing, and shy fishing or canoe-borrowing beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author reports no discovered cult of a superior being or heavenly bodies,
    and no definite cult of ancestors or spirits of the dead, though shades were thought
    to know when certain feasts were held.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an idea of essential similarity between humans and animals,
    and perhaps trees, expressed in folk tales from Wagawaga, Taupota, and Awaiama.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes belief in many mythical beings, many of them malevolent
    and humanoid enough to be characterized as ogres; it also distinguishes other
    generally harmless beings treated as races or species from ogres treated as freaks
    without expected progeny.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A footnote reports that at Bartle Bay shades were supposed to know when a
    walaga and perhaps other feasts were held, and that the mango was treated with
    reverence in walaga ritual.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:5
  text: Wagawaga niatagaigai live among tree branches, are male or female, and are
    described with a male form like an ordinary man and a female form with one large
    and one small breast.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Niatagaigai are not regarded as hurtful, but appear to sick people and push
    fingers into the patient's flesh to determine whether the patient will recover
    or die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the niatagaigai's fingers sink into the patient's flesh like into a rotten
    banana, the patient will die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Matabiri live in swamps and mangroves, are male and female, include old and
    young, and are described with huge protuberant bellies and swollen cheeks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Matabiri are described as malevolent beings who put medicine on sleeping people,
    causing belly and face swelling and death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wagawaga bariaua live in trees, are harmless, cannot make sea-going craft,
    borrow mortal canoes, and are intensely timid and afraid of being seen by people.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two Wagawaga bariaua borrowed a small dug-out canoe, fished all night, were
    seen by Burea at dawn, ran away, and left fish and a net in the canoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Burea and his companions ate the fish; the net was hung up at a potunia, disappeared
    the next morning, and was believed to have been reclaimed by the bariaua; no misfortune
    followed the eating of the fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Tubetube karawatoniga are said to live in the bush or among rocks near the
    seashore, are harmless, are most frequently seen after a death, and are attracted
    by mourners' wailing.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: Karawatoniga are not visible to everyone, are human in form and colour, breed
    and die like humans, wear hair in mourning-style ringlets, and have indistinct
    or ill-developed features.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Tubetube susukaikaigeda are male and female, resemble humans but are shorter,
    pot-bellied, and one-breasted; they are harmless, live in wet and swampy places,
    haunt particular localities, are seen in daytime, and frighten those who see them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Tubetube bariaua live within the trunks of big old trees, but are not regarded
    as the life or spirit of those trees or of vegetation generally.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Sividaiyoa saw a bariaua fishing near Dagedagera in evening twilight; the
    bariaua looked around for approaching humans and ran away when he saw Sividaiyoa.
  category: sequence
  evidence_refs:
  - ev:9
