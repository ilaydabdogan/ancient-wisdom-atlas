  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The material is ethnographic description rather than a single narrative
    episode.
- id: motif:2
  label: Hidden beings dwelling in trees
  taxonomy_refs: []
  basis: Niatagaigai live among branches, Wagawaga bariaua live in trees, and Tubetube
    bariaua live within trunks of big old trees.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage explicitly denies that Tubetube bariaua are tree spirits or
    vegetation spirits.
- id: motif:3
  label: Supernatural prognosis of death through bodily touch
  taxonomy_refs: []
  basis: Niatagaigai press fingers into a sick person's flesh; if the fingers sink
    in like into a rotten banana, the patient will die.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage frames the act as determining recovery or death, not as causing
    the illness.
- id: motif:4
  label: Malevolent beings cause disease by medicine on sleepers
  taxonomy_refs: []
  basis: Matabiri place medicine on sleeping people, leading to swollen belly and
