canonical_text:
  quote: ''
  summary: 'The passage reports that no definite initiation ceremony for the ibitoe
    was found at Yule Island, though their restrictions could function like bodily
    training. It then describes the formerly practiced Waima aruaru initiation: boys
    near puberty were secluded in specially built aruaru marea, used for initiation-related
    purposes. The passage lists associated marea and stocks, notes that all youths
    were initiated together in one marea in turn, and compares the Waima practice
    to Elema initiation ceremonies in eravo clubhouses.'
