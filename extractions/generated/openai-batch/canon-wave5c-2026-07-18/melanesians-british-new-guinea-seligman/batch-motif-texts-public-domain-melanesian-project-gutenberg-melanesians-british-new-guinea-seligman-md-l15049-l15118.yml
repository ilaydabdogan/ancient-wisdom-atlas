canonical_text:
  quote: ''
  summary: 'The passage describes aruaru initiation practices: seclusion in bush and
    marea, nighttime concealment, paired excursions, completion of seclusion through
    one initiate’s sexual connection with a girl later becoming his wife, change of
    status name, a year-long Waima ceremonial cycle with four dances tied to monsoon
    phases, post-release gardens for marea chiefs, and basket-work headdresses worn
    by initiates.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The initiates stay in the bush and approach the village at dusk to enter the
    marea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief asks the initiates whether they are weary of seclusion, and the aruaru
    give no answer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seclusion is said to end when one initiate has had connection.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:4
  text: Initiates may leave the marea at night while wrapped so as to be unrecognizable.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: When the time to end seclusion arrives, one or more couples leave the marea
    and look for girls willing to receive them, whom they usually marry later.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Initiation is considered complete at the end of seclusion, and initiates formerly
    called miori are afterwards called buiapu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Waima, every male formerly had to undergo the aruaru ceremonial, usually
    before marriage, with some exceptions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Waima ceremony begins about the south-east monsoon, lasts about a year,
    and includes four ceremonial dances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The initiates perform special dances with special decorations, while older
    men dance ordinary dances at some distance.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The four named dances are bite, oare, aunapaka, and vakivaki, each associated
    with wind or monsoon timing and particular coverings or ornaments.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After release from the marea, the initiates make gardens called iciama for
    the chiefs of the marea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A circular basket-work object called lopo is worn on the head with hair passed
    through its central opening and marked with lime and perhaps red ochre.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A half-moon-shaped basket called kokoai is worn vertically on the head and
    is part of the initiates’ dress at one ceremonial dance.
  category: object
  evidence_refs:
  - ev:8
