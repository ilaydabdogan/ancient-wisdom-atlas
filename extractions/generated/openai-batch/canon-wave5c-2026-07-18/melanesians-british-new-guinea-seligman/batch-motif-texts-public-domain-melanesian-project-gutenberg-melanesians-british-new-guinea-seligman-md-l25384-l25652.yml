canonical_text:
  quote: ''
  summary: The passage describes totemic rules at Wagawaga and Tubetube, especially
    the avoidance of a father's totems. It records sanctions, exceptions for plants
    and childbirth diet, marriage restrictions, treatment of spouses' totems, restrictions
    on wearing feathers of a father's totem bird, and the linked bird, fish, and snake
    totems of Tubetube hamlets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, a man is said to pay more ceremonial attention to his father's
    totems than to his own totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Failure to respect a father's bird and fish totems is said to bring severe
    boils; companions would regard the offender as foolish and greedy, but strong
    public resentment is not described.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: One adopted man avoided both his father's old totems and the totems acquired
    through adoption into a Wagawaga clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man respects and avoids his father's totem snake and would not kill it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Modewa men with Garuboi fathers said they would not injure the father's totem
    plant okioki in the bush, but would destroy it if it interfered with garden-making.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lying-in women are said to eat a decoction containing yams and okioki fruit
    or leaves during the puerperium, even if okioki is their own or their father's
    totem plant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man would not marry a woman with the same totems as his father; one informant
    called women of his father's totem 'half-mother' to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that in the old days a man would not sleep with a woman of
    his father's totem, but breach of the rule was considered too small to harm the
    lovers or their clansfolk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man would eat his wife's totem fish as he would eat his own, and the same
    rule applied to a wife's treatment of her husband's totem fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man was said to be no more or less frightened of his wife's totem snake
    than of any other snake in which he had no special interest.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Feathers of cassowary, lory, cockatoo, various pigeons, cassowary, cockatoo,
    and bird of paradise are described as decorative, dancing, visiting, or fighting
    plumes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: No man would wear feathers of birds that were his father's totem birds, including
    in special ceremonial head-dresses and waiapa ceremony feather use.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author states that no information was obtained about the origin of bird,
    fish, and snake totems, while the origin legend for plant totems is located elsewhere.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: At Tubetube, as at Wagawaga, each individual has linked bird, fish, and snake
    totems; most Tubetube hamlets lack plant totems, and Dekwasoso's plant totem is
    not held in respect.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Tubetube table organizes hamlets by bird, fish, snake, and plant totem
    categories.
  category: setting
  evidence_refs:
  - ev:9
