  summary: The passage describes Aroma and Hood Peninsula dubu houses or platforms,
    their clan associations, chiefly ownership of posts, decoration, ceremonial use,
    a Babaka girls' initiation performed on a platform, pigs and skulls associated
    with sacred platforms, a reconstructed Aroma sacred platform with a fire before
    it, and the association of open dubu with tabu festivals and spirits of the dead.
  language: English
  quote_policy: summarized
