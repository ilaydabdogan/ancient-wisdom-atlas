  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Babaka, seven recently tattooed nubile girls stood on a dubu while an old
    woman anointed their genitals with oil; the girls then cut yams and pelted the
    crowd with areca nuts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In one Babaka ceremony no pigs were hung on the dubu, though one pig lay in
