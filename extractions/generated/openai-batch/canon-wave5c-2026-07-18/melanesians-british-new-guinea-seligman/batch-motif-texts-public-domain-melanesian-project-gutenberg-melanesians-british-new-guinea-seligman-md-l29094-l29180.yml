canonical_text:
  quote: ''
  summary: The passage describes courtship and betrothal customs in Wagawaga, Tubetube,
    and Bartle Bay settlements. It covers prolonged premarital connection, female
    proposal in Wagawaga and Tubetube, parental consent, refusal scenarios, and the
    Bartle Bay custom called viagagavu, in which eligible boys and girls sleep together
    before possible marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wagawaga and Tubetube, a girl who has repeatedly received the same boy
    for one to three months may propose marriage if she still cares for him and considers
    him suitable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that in Wagawaga and Tubetube the initiative in proposing
    marriage would not be taken by the youth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says an intimacy seldom lasted two or three months unless one
    or both partners were willing that marriage should result.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When two people desire to marry, each notifies their parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the parents of either prospective spouse refuse consent, the marriage does
    not take place.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports no known instances of elopement or marriage without parental
    consent in this context.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the girl's parents refuse consent at Wagawaga, she informs the boy during
    his next visit in the potunia; he spends that night with her but does not return
    the following night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the boy's parents refuse consent, the girl is told that marriage cannot
    take place, though cohabitation is probably not ended immediately.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The custom called viagagavu is reported at Wamira, Wedau, Gelaria, and some
    coastal settlements east of Bartle Bay, and is described as essentially a preliminary
    to marriage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In viagagavu, a boy and girl pass the night together, sleeping in each other's
    arms, either in a rough shelter in the bush or in the house of the girl's parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Only members of intermarrying clans and individuals not blocked by social
    restrictions from marrying each other participate in viagagavu in this way.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says sexual connection often does not occur in viagagavu; if it
    occurs, marriage is usual, while without it marriage may or may not follow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Viagagavu may be entered into as a jest or fun, may occur many times in the
    life of a boy or girl, and is not necessarily a preliminary to marriage with the
    first partner.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: A widow or widower about to marry would practise viagagavu with the future
    spouse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At Gelaria, a boy may privately ask a girl he fancies to sleep together; if
    she assents, he names a meeting place in an empty garden house or in the bush
    where he builds a rough shelter.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: At Gelaria, the boy may caress the girl and put his hands and arms around
    the upper part of her body; the pair separate before dawn.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: At Gelaria, the girl may indicate acceptance of the boy's tacit marriage offer
    by saying she does not care for other men, or by saying nothing; definite rejection
    is required to prevent the boy from assuming acceptance.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: After the Gelaria bush-sleeping, the boy announces to his parents and the
    girl to her mother that each has slept with the named partner.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: A footnote describes a household sleeping arrangement in which parents sleep
    around the front fireplace, marriageable girls around the back fireplace, and
    brothers usually in paternal uncles' houses.
  category: setting
  evidence_refs:
  - ev:13
