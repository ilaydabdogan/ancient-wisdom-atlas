canonical_text:
  quote: ''
  summary: 'The passage describes several reported forms of cannibalism in the southeastern
    district: revenge cannibalism between enemy communities, killing and eating strangers
    or vulnerable visitors for pleasure or appetite, a quoted account by Laido of
    four Kurada castaways killed, cooked, and eaten, an account of Barabara traders
    ambushed by Maivara men, a rejected Rossel Island mass-cannibalism report, and
    brief mention of rare cannibalism involving recently exhumed bodies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that most cannibalism cases in the southeastern district
    were treated as communal revenge for members who had been killed and eaten by
    enemy communities.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes a smaller category in which human flesh was eaten
    for pleasure and strangers were commonly killed and eaten, though no constant
    food supply of this kind existed.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Laido says people of her village ate four people belonging to Kurada village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Kurada canoe was found offshore full of water, with four people clinging
    to it; the four were two men and two women who appeared tired and weak after two
    days and two nights in the water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kurada people said they had been returning from Nuakata when wind and
    sea filled their canoe and carried it toward Laido's village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wariwarubu brought the four Kurada people ashore; Lakapona, Taubara, Wariwarubu,
    and Gilinua then killed them with a spear and tomahawks, according to Laido's
    witnessed account.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After the four were killed, people made a large fire, scorched the bodies,
    cut pieces off with knives, cooked the pieces in pots, and many people ate the
    flesh.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that communities sometimes attacked marriage relatives
    or weak friendly traders for human flesh, even when they knew this could lead
    to a feud.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Barabara party travelled in three canoes to Maivara to barter for areca
    nuts; after an alarm, they tried to return to their canoes but were cut off by
    Maivara men armed with spears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Barabara men fled into the bush after finding their canoes removed; six
    failed to reach home and were later said to have been killed and eaten by Maivara,
    despite prior friendly relations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage treats the repeated account that Rossel Island natives killed
    and ate over 300 Chinese from the wrecked St Paul as untrue, citing local accounts
    and Sir William Macgregor's objections.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: A much rarer form of cannibalism is described as eating bodies exhumed soon
    after burial; information was meagre, but a case reported by Sir Francis Winter
    in 1895 is said to show the practice formerly existed in Milne Bay.
  category: action
  evidence_refs:
  - ev:9
