canonical_text:
  quote: ''
  summary: 'The passage describes marea clubhouses among Roro-speaking and neighboring
    groups: their architectural plan, decorative elements, use as men’s meeting places,
    alleged first builder, association with right and left chiefs, maintenance responsibilities,
    and hereditary or locally varying marea names.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each local group of each clan is said to have, or to be expected to have,
    at least one marea serving as the men’s meeting place and clubhouse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A marea is built on piles and includes a raised unroofed front platform, usually
    a second higher platform, and a bench or couch along the sides and back.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The inner compartment is separated from the outside platforms by a partition
    reaching to the roof, with a small door as the only access.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Roof-supporting posts pass through the platforms and flooring, and clan badges
    are often carved on these posts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The roof forms the back and sides of the marea and continues forward as a
    narrow overhang called kaiva, which may be decorated with dried-leaf pendants
    and carved boards.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports variation in size and decoration among Roro, Walma, Paitana,
    Mou, Siria, and related examples, including named and photographed marea.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Repeated inquiries reportedly found no legends of the origin of marea, but
    at Siria the name Obia was preserved as the alleged first builder, whose example
    others imitated.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'At the time described, there should be two marea in each local group of every
    clan: one for the ovia itsipana and one for the ovia awarina.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The earlier arrangement is described as one marea belonging to two chiefs,
    the chief of the right and the chief of the left, with each chief responsible
    for maintaining his half.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The habit of building separate marea for the ovia itsipana and the ovia awarina
    is said to have existed before the dispersal from Maiaera.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Each marea has a name; names descend from marea building to marea building
    of each clan or local group.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Aitsi Benuna, two marea called Kevoripaka face each other from opposite
