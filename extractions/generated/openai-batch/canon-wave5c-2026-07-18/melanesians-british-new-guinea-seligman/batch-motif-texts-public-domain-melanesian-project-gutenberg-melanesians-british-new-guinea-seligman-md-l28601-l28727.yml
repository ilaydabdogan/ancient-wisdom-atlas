canonical_text:
  quote: ''
  summary: The passage describes Tubetube adolescent customs including areca chewing,
    tooth blackening, status terms, tattooing practices, puberty-related sleeping
    and tattooing changes, and menstrual restrictions. It includes a Rogea story explaining
    girls' tattooing through a wandering girl captured by a cave-dwelling cannibal
    sorceress, tattooed, escaped, and avenged by her father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Tubetube, boys around ten or twelve, before puberty, begin chewing areca
    nut and may blacken their teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tooth blackening uses tari, a black bituminous semi-fossilised wood from Basilaki
    swamps, mixed with roasted badira leaves and water into a paste applied overnight
    on a dried leaf against the front teeth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated reason for blackening teeth is ornamentation, personal adornment,
    and attraction of the opposite sex.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists named status terms for stages of boys and girls before puberty,
    at puberty, and after puberty.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Younger men and boys who have been away working may have tattoo marks, often
    in a south-eastern scroll pattern; formerly no male was tattooed except for sickness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women were tattooed profusely; a girl's face was tattooed before puberty,
    usually after nose piercing, and her chest, belly, flanks, arms, and hands were
    tattooed after first catamenia ceased.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that there are no initiation ceremonies for boys or girls;
    about puberty boys begin sleeping away from home and girls' tattooing proceeds.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that there are no special marriage or betrothal marks and
    apparently no feasts connected with tattooing.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Rogea story, a small girl wanders despite parental warnings that a
    bush sorceress will eat her, and the woman man-eater calls her to a cave whose
    door opens by command.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Rogea story, the sorceress tattoos the girl from the face down to the
    feet, boils and eats the blood, and intends to eat the girl later.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Rogea story, the girl commands the cave door to open, escapes to her
    parents, and her father kills the sorceress by making her swallow a hot stone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Rogea story concludes that girls' tattooing was afterward imitated from
    this event.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: No special ceremony is observed at a girl's first menstruation; during menstruation
