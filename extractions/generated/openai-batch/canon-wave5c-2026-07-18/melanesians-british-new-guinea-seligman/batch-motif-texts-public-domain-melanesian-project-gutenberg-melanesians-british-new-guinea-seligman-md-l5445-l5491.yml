  summary: The passage describes personal property and valued possessions, noting
    older and newer forms of value. It lists pigs, dogs, ornaments, dancing plumes,
    earlier weapons, adzes, canoes, drums, fishing nets, a newly popular camphor wood
    box with a bell-lock and key, and several named native ornaments made from shell,
    mother-of-pearl, boar tusk, and dogs' teeth.
