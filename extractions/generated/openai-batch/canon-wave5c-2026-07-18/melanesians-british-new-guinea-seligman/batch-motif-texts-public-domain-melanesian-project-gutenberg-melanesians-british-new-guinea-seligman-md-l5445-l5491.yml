  text: A man's valued possessions are described as including his pig, dog, ornaments,
    and dancing plumes; before the white man's coming, weapons, adze, and canoe are
    said to have been almost equally valuable.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The store at Port Moresby and the repression of feuds are said to have altered
    the values of personal property; axes and bush knives became common, and trade
    for a canoe could be earned at the white settlement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man is said not to part readily with his drum and fishing nets, because
    trade articles have not greatly reduced the labor needed to make them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The former value of a good spear is inferred from its association with articles
    of personal adornment in the heni ceremony.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A camphor wood box with a lock that rings a bell when the key is turned is
