canonical_text:
  quote: ''
  summary: 'The passage describes Koita and Motu food taboos: none are limited to
    one village, iduhu, or family; certain fish are forbidden to young people and
    adolescents because harsh skin would make them disliked by the opposite sex; wallaby
    intestines are avoided for the same reason while liver is eaten only by girls;
    two poisonous spined fish may be eaten by boys but are forbidden to girls because
    they would make tattoos extremely sore; pregnancy and puerperium food taboos are
    referenced elsewhere.'
