canonical_text:
  quote: ''
  summary: The passage classifies oaoa found on marea clubhouses and describes examples
    of animal-form badges carved or suspended on marea structures, including garfish,
    paia fish, hornbill, lizard, bird, and chelonian forms, as well as badges in aruaru
    initiation marea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage groups oaoa on marea into four classes: badges of the owning
    local group, foreign oaoa, oaoa owned by the ovia itsipana of the owning group,
    and oaoa associated with a named marea building.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oaoa of Ovia Pokina and Koae Kupunu local groups are described as displayed
    on the Kevori and Boaiota marea of Siria village and carved on projecting roof-stringer
    ends above the entrance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bifid free extremity of the Ovia Pokina oaoa is said to represent the
    jaws of a garfish called akumu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Koae Kupunu oaoa called paia, no meaning was elicited at Siria; at
    Mou, where it is the oaoa of Aitsi Kupunu, it represents the tail of a fish called
    paia.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Designs representing a clan or local-group oaoa may be carved on side posts,
    the front of the ridge pole, inside and outside longitudinal stringers, projecting
    floor rafters, and beneath the kaiva.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men of Abotaiara settlement wear hornbill mandibles ceremonially, and
    Airava marea has side-post capitals carved as hornbill heads with exaggerated
    downward-bent beaks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the front central kupua post of Airava marea, upper and lower hornbill
    mandibles are secured; near the roof hangs a wooden bird figure with extended
    wings, and posts are carved with angular designs derived from hornbill mandible
    markings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Maivauku marea, the airava dada carved on posts is said to have degenerated
    until it was unrecognizable.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Tautaa marea, a board under the kaiva is carved with a lizard called ibaboro,
    a bird, and a chelonian; ibaboro is identified as the dada of the Herahera men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A footnote reports that a pipe panel in the Glasgow Museum with a lizard and
    birds resembles the board beneath the kaiva of Tautaa marea, and the author suggests
    the pipe is of Waima make and possibly copied from a clubhouse board.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: In special aruaru marea used for initiation ceremonies, the badges of clans
    participating in the aruaru ceremonies were formerly represented on the marea.
  category: relationship
  evidence_refs:
  - ev:9
