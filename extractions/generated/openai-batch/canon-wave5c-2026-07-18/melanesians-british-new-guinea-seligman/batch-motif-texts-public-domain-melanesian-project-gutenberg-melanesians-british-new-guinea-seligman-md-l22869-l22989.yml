canonical_text:
  quote: ''
  summary: 'The passage contains the end of an ogre episode involving Faisi Uri and
    Gwarigwaridona, including a dangerous meal, skulls used as water vessels, a planned
    beheading, a village attack on the ogre''s cavern, and the ogre''s death when
    his body-spears break on a hard shield. It then begins the Taupota tale of the
    Black Cockatoo: a mother and son encounter a wild cucumber plant; the boy eats
    the entire plant, becomes unable to walk, is left while his mother goes for help,
    and is taken by the ogre Wavineruatonu, who had planted the cucumber and threatens
    to eat him.'
  language: English
  quote_policy: summarized
