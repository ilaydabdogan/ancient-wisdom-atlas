canonical_text:
  quote: ''
  summary: 'The passage describes adoption practices: fathers ask friends to adopt
    or temporarily care for children, adopted children may take the adopter''s kin
    affiliation and call him father, mothers are said not to initiate adoption requests,
    and remarriage to a widow may lead to adoption of her children. A named example
    describes Ganiga Soso adopting Vaguya Ganiga, the child of Boio Seri by a previous
    husband.'
  language: English
  quote_policy: summarized
