canonical_text:
  quote: ''
  summary: The passage contains the close of a tale in which an old woman at Kamkarago
    smells smoke, infers that her grandchild has been born, brings garden food, snatches
    the baby, and takes it to her cave dwelling opened by a spoken rock charm. The
    child's parents later learn or use the charm, live there for a time, escape, and
    the boy later learns that his grandmother has died when the rock no longer opens.
    The passage then gives the Taupota tale 'Sorcery,' in which a witch wife flies
    home from a tree by a spell while carrying her husband, but the husband learns
    only part of the spell and dies when he tries to imitate the flight. It ends with
    the opening of 'The Frog-Witch,' where two girls dress for an inland dance.
  language: English
  quote_policy: summarized
