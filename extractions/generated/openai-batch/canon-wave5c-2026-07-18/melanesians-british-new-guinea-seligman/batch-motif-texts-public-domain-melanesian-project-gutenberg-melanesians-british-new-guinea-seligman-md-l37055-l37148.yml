canonical_text:
  quote: ''
  summary: The passage describes the geography, cultivation, clan organization, chiefly
    hierarchy, and recent intergroup conflicts of the Marshall Bennet islands, including
    Gawa, Kwaiawata, Iwa, Dugumenu, and Kitava. It notes temporary resource visits
    to Dugumenu, elevated terraced atolls with cliff ladders, fertile lagoon depressions,
    island chiefs, feuds, a Larena-Kumageya dispute over a pig and chieftainship,
    battles, arrests, seizure of pigs and yams, and eventual peace-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Marshall Bennet Group is described as five islands named Gawa, Kwaiawata,
    Iwa, Dugumenu, and Kitava, lying between Murua and the Trobriands.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dugumenu is described as a low coral island with vegetation and coconut palms,
    without permanent habitation, but visited by canoes for fishing and coconut gathering;
    temporary camps may last one or two weeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other islands are described as elevated atolls with terraces, cliffs,
    and in some places ladder access made and placed by the natives.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old lagoon bottoms are described as fertile depressions with heavy vegetable
    mould, hamlets, gardens, young timber, and ferns.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Kitava is described as the largest island of the group, with gardens on limestone
    terraces and Morinda fruit as an important addition to the inhabitants' diet.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The islanders are described as having clan organization, with each clan on
    each island having a chief or head man, and the chief of the traditionally strongest
    and most influential clan serving as chief of the whole island.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the chiefs are not obviously distinguished by greater
    stature, unlike what is sometimes reported for chiefs on the Trobriands.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The islands are said to have formerly fought with one another, especially
    Gawa and Kwaiawata; the passage also says there is no evidence that cannibalism
    was practiced and that the islanders deny it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Larena and Kumageya on Kitava are described as long-standing enemies, with
    a dispute about a pig named as the origin of the trouble and island chieftainship
    also complicating the matter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a battle in which Larena killed six opponents, arrests were made; Larena
    later attacked again, drove opponents out of Kumageya, took pigs and yams, and
    peace followed after further arrests.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
