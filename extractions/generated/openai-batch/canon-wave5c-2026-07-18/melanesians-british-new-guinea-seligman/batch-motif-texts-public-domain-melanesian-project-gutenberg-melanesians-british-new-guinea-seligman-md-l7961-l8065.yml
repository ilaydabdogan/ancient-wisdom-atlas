canonical_text:
  quote: ''
  summary: The passage describes Koita morals as communal rather than individual,
    with chiefs acting through informal elder consultation and no centralized religious
    or political authority assigning praise, blame, or reward. It states that homicide
    and theft are judged chiefly by their effects on the community, that children
    conform to tribal traditions without formal initiation or instruction, and that
    Koita customs, organization, dances, and beliefs have persisted despite sustained
    contact with Europeans, missionaries, traders, and other outsiders.
  language: English
  quote_policy: summarized
