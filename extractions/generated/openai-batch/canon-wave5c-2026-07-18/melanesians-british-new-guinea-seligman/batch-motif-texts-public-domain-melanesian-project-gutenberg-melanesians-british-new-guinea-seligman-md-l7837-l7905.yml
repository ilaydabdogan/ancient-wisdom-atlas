canonical_text:
  quote: ''
  summary: The passage describes Koita-related homicide procedure in cases of garden
    theft, blood feud, revenge, compensation, and the ceremonial surrender and killing
    of a murderer to end a feud between communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Theft from a fellow villager's garden could lead to loud dispute and a scuffle
    with sticks, stones, and clubs between the iduhu concerned, without an intention
    to kill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a death resulted from an intra-community dispute, community leaders could
    prevent vendetta and arrange acceptance of a blood price.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A stranger caught stealing in a garden might be killed, and this could result
    in a blood feud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the hypothetical case, a Hohodai man kills a Baruni man trespassing and
    stealing from his garden, then reports the killing to his iduhu rohi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The iduhu rohi consults the rohi ketaike and old men to decide whether the
    slayer should be defended or given up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Baruni may settle the debt by waiting for an opportunity to kill a Hohodai
    man, woman, or child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Baruni may instead come openly and armed to Hohodai, declaring revenge for
    the murdered fellow villager.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A revenge fight would usually stop after one Hohodai man was killed, unless
    previous killings required further retaliation in Baruni's view.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Battles could fail to end blood feuds and could produce chronic enmity with
    further murders and reprisals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If Hohodai did not wish to fight, they might agree to surrender the murderer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before being surrendered, the murderer retires into his house and ornaments
    and paints himself, usually with help from his henamo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A pig belonging to the murderer, or to his henamo if he had none, is killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Baruni men surround the murderer's house, light fires, and squat around them
    through the night.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The pig is cooked and eaten inside the murderer's house by fellow villagers
    and leaders; the condemned man is expected to eat, while near relatives and friends
    abstain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Women wail throughout the night-long pig-eating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: At dawn the murderer is stripped of ornaments and led down the house ladder
    by the rohi ketaike.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: When they reach the ground, the rohi ketaike jumps back onto the ladder and
    Baruni men spear and club the surrendered man to death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The rohi ketaike declares that the matter is finished and that Baruni should
    kill no more men because this man has been given to them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: After yelling war cries, the Baruni retire, and the victim is buried in the
    usual way.
  category: sequence
  evidence_refs:
  - ev:8
