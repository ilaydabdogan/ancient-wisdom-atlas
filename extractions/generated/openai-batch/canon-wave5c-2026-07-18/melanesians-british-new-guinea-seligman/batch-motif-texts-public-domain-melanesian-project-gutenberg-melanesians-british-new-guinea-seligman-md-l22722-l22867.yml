canonical_text:
  quote: ''
  summary: The supplied Wagawaga passage contains several narratives. Tuisuheaia,
    a red eel living in streams and an underwater village, assumes human form, deceives
    a mother, steals and eats her child, and after the father burns the eel's underwater
    village a storm kills the parents and they become rocks called Papi. Kwahohofi,
    a feared man-eater, is killed when relatives exploit his fear of an earthquake
    wave. Kuporu, a giant ogre who catches divers and eats them, is killed by white
    men; those who eat his flesh die except a Sariba man who abstained. The passage
    also begins a story of Gwarigwaridona, an ogre with horn-like spears, and Faisi
    Uri, a hunter with two dogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A red eel named Tuisuheaia lives in the stream Habaria and marries a woman
    who lives under water in another stream, Fala.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tuisuheaia assumes a man form at sundown.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tuisuheaia carries a rough coconut basket filled with rotten waterlogged wood
    and tells the woman that it contains many fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because the house is dark, the woman mistakes Tuisuheaia for her husband and
    gives him the child when he asks for it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The real husband returns, the parents realize the child is lost, and they
    search during the night while grieving.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eel kills the child on a rock and eats it; in the morning the parents
    see blood on the rock.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father finds the hole leading to the eel's underwater village, lights
    the end of a pole, thrusts it down, and the village burns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A storm with thunder and rain follows on land and under the river; the man
    and his wife are killed and turned into rocks called Papi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kwahohofi eats many people and locates victims by watching for smoke from
    their fires.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kwahohofi's relatives consult about what to do and learn that he fears the
    wave after an earthquake.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Men make a fire, throw young coconut milk over the sleeping Kwahohofi, falsely
    announce that the great wave has come, and he falls over the cliff and dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kuporu is a giant ogre who catches men under water while they dive for fish,
    carries them to the bush, kills them, and eats them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: White men from a schooner kill Kuporu, take his body to Igwari, cut it up,
    and all except one Sariba man eat his flesh.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the schooner leaves, crew members die daily until only the Sariba man
    who did not eat the monster's flesh remains alive.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Gwarigwaridona is described as a kind of ogre with short spear-like horns
    growing from his joints and forehead, and he has killed and eaten many people.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: Faisi Uri hunts wild pig with two dogs; after taking a big pig, his dancing,
    singing, and shouting draw Gwarigwaridona to him.
  category: sequence
  evidence_refs:
  - ev:14
