  summary: The passage discusses whether ufuapie groups regulated marriage among Mekeo-related
    communities. It reports opinions that marriage within the ufuapie was preferred
    or prescribed, describes claims of reciprocal pig, dog, feast, and mourning obligations
    between allied groups, then qualifies or rejects some of those claims using genealogical
    and ethnographic evidence. It also notes recognized marriage forms, bride-price,
    mock pillage, older capture-marriage stories involving a bathing girl and a petticoat,
    and distinctions among ufuapie, pangua, iauafangai, and ikupu groups.
  language: English
