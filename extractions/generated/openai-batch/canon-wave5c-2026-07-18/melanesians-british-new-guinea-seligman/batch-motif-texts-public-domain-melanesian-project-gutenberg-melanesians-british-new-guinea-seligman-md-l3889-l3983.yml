canonical_text:
  quote: ''
  summary: The passage describes rights and obligations around portions of game, fish,
    and feast foods given to iduhu rohi/roki, their cooking and communal consumption
    on the chief's verandah, and the display of some animal remains and banana haulms
    there. It also describes ownership of dubu corner posts and related chiefly or
    sub-chiefly roles, and outlines the rohi ketaike's limited role in land-dispute
    mediation, war decisions, and decisions about strangers or offenders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iduhu rohi are said to have rights to game killed by men of their section
    and less clearly defined rights in large fish caught.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a villager kills a pig, he brings the head, half-head, or lower jaw to
    an iduhu rohi of an iduhu other than his own; the gift is cooked on the iduhu
    rohi's verandah and eaten by men of the section, including the donor and guests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: No particular tduku is fixed as the required recipient, but failure to present
    the appropriate portion to a tduku rohi of the section is described as extremely
    bad form.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Whole pig skulls or lower jaws, when presented, are fixed on the verandah
    or front of the iduku roki's house; one verandah is described as adorned with
    thirty-three jaws and three complete skulls.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ahuia is said to refer to the pig jaws and skulls with pride and to have made
    the drawing reproduced as Plate VI.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wallaby loin, including kidneys and tail, and among the Motu one forejoint
    of every turtle, are presented similarly, but their bones are not hung on the
    verandah.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Large fish are left on the iduhu rohi's verandah, cleaned and cooked at his
    orders by a clansman, and eaten on the verandah after invitation to the men of
    the section; a sick man may receive a portion at home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fish skulls and often vertebral columns are hung from the front eaves of the
    verandah; the tail of the dakudaku fish is prepared and preserved.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Withered banana haulms brought for feasts to the iduku roki's verandah are
    sometimes left hanging for a long time.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each iduhu roki owns the front right corner post of the dubu and is responsible
    for its maintenance and renewal; in a common dubu, the strongest or traditionally
    most important clan's iduku roki becomes owner or master of that post.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tauna of the left front post acts as sub-chief, assisting the front-right-post
    tauna in arrangements for dubu feasts and ceremonies; the tauna of the two back
    corner posts are not chiefs or headmen but tend to be influential.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rohi ketaike adjusts land disputes between iduhu, while other quarrels
    are not necessarily referred to him and his opinion is said to carry little more
    weight than that of other influential elders in most matters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In war, the rohi ketaike consults with elder men, arranges operations, and
    may stop a battle or end pursuit if he can make himself heard.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that strangers were not commonly put to death, but that
    in former times the rohi ketaike could determine whether strangers were killed
    and could help decide whether an offender who killed a stranger from another Koita
    division would be surrendered or defended.
  category: action
  evidence_refs:
  - ev:10
