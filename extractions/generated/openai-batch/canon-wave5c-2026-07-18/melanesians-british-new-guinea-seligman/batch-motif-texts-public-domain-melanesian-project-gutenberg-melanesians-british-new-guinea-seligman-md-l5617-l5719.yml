  summary: The passage describes Koita trade in relation to Motu trade, including
    former markets, present water-borne coastal exchange, Port Moresby store influence,
    imported food, village-specific goods, shell ornament production and distribution,
    canoe trade and prices, and feather exchange.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Koita trading methods are practically the same as Motu methods,
    and many Koita take part in the Motu annual hiri trading expedition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Former irregular markets attended by Koita and Koiari are reported to have
    ceased before the arrival of Europeans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the time described, most Koita trade is water-borne and conducted by inhabitants
    of coastal villages, especially along the coastal strip from Lealea to Hula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Safety in the coastal Central District, the Port Moresby store, and the proximity
    of Poreporena to the white settlement are described as increasing coastal trade
    and dependence on imported food.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes that trade goods may now be substituted for older articles
    of native exchange among the eastern Koita.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kapakapa, Tupuselei, and Gaile bring bananas, taitu, and some toia, receiving
    pigs, feathers, doa, and ageva in exchange.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hula and Aroma bring coconuts, petticoats, and some shell goods; Hula also
    brings tautau and smoked fish, fishes near Port Moresby, and takes pots and sago
    from Motu and Koita.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ageva are made only at Tatana and Vabukori within the Koita-Motu country,
    and are then traded to other Koita and Motu villages whose inhabitants act as
    distributors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Toaripi, Lese, Waima, and occasional Papuan Gulf trading canoes bring foodstuffs
    and other products, and Gulf and Waima traders receive ornaments in exchange.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Manumanu brings vegetable food, petticoats, crabs, and dug-out canoes, receiving
    toia, tautau, and mairi in exchange.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Canoe valuation is described as formerly being in toia, while more recent
    canoe payments may combine toia, money, and store goods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Feathers are obtained by the western Koita from Nara and Kabadi and traded
    for shell ornaments with the Motu and eastern Koita.
  category: action
  evidence_refs:
  - ev:7
