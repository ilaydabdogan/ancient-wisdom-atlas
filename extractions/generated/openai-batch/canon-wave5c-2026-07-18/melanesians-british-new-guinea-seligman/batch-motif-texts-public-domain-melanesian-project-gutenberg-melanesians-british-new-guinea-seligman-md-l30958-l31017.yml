canonical_text:
  quote: ''
  summary: The passage describes milder forms of warfare and brawling among Southern
    Massim communities, including quarrels over feast distributions, jealousy and
    insults, community escalation, limited damage compared with more severe warfare,
    compensation after injury or killing, and local terms for such brawls.
  language: English, with transcribed local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A milder form of warfare may arise when a quarrel breaks out between two usually
    friendly communities, shading into a clan brawl within a hamlet-group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In this milder warfare, coconuts are not cut down, houses are rarely or never
    burnt, pigs are not usually carried off, and killed men are left where they fall
    rather than eaten or decapitated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who receives no present of food at an important feast may express dissatisfaction,
    injure someone from the feast-giving hamlet-group, and start a quarrel that spreads
    to both communities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cited example says fighting near Cape Pierson resulted from a man not receiving
    what he considered his due share of food at a feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another cited example says Sarokiko of Gomagaboina became angry when his name
    was not called in a food-present distribution, threw a stone at a house, and began
    cutting down a yam platform.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Boasting about success in love affairs at feast gatherings and jealousy aroused
    by such boasting are described as recognized sources of minor warfare.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Certain insults, including saying that a man's father is dead, naming his
    dead father, or accusing him of incest with his mother or sister, are described
    as flagrant provocations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person using the most serious insults is expected to be prepared to fight
    immediately, and the abused man may attack with any handy weapon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After an insult-provoked fight begins, each man's clan or community may join
    the fray; little damage is usual, but one or more men may be killed before peace
    is made.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A less serious insult, saying that a man does no work and eats food from others'
    gardens, may result in a brawl.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Brawls within a community over women or pigs may lead to wounding or killing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After wounding or killing in such a brawl, valuables are usually handed over
    to the injured man or, if he is killed, to his relatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A homicide in this setting is reproved and remains at risk for some time of
    being speared by the victim's relatives if an opportunity arises.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The passage reports that such brawls are called raua at Taupota, probably
    also at Wagawaga, and apparently sasara ipaua at Tubetube.
  category: speech
  evidence_refs:
  - ev:4
