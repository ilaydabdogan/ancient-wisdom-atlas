canonical_text:
  quote: ''
  summary: The passage describes a skull-supported charm decorated as a face with
    cane, bast, boars' tusks, human hair, and feathers, with additional charms such
    as herbs, coral, a fish mandible, and a quartz pebble attached. Informants say
    the charm was used to procure an enemy's death, and quartz pebbles are described
    as deadly. The passage then discusses disease and death attributed to sorcerers,
    mythical beings, and in some cases sorcerer-controlled spiritual agencies, including
    reported cases involving a spirit, footprints under a victim's house, and a woman
    who said she became sick after being taken by the hand at night.
  language: English
  quote_policy: summarized
