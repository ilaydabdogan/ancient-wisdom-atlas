canonical_text:
  quote: ''
  summary: The passage describes Wamira beliefs about parailma, an agency also called
    labuni by Gelaria people, its inability to cross flowing water unaided, and carved
    kokoitau figures placed on an aqueduct to frighten it away. It then summarizes
    reports on witch-related parailma, beneficent specialists whose magic assists
    gardens, irrigation, fishing, hunting, and weather control, specialized taboos
    imposed by signs and spells, the ownership and transmission of incantations, uncertainty
    about the unseen power behind them, and a reported abnormal birth attributed locally
    to drinking irrigation-canal water.
  language: English
  quote_policy: summarized
