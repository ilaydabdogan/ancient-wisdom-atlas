canonical_text:
  quote: ''
  summary: The passage recounts Oa Rove’s revenge after people steal his game and
    fish, including the taking of women, the giving of weapons, the sending of conflict,
    sorcery, and death, and several variants in which Oa Rove appears as a wise skin-changing
    child, shapeshifts into animals, raises women away from their village, teaches
    killing, offers a failed chance at immortality, and is associated with the origins
    of decay, flies, and mosquitoes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Arabure women did not return, the Arabure people sought Oa Rove,
    who said he had taken the women in revenge because his game and fish had been
    stolen and he had been treated badly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oa Rove said that if he had been treated well he would have made the people
    rich in yams, bananas, and areca nuts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oa Rove called together Roro and Mekeo villagers, gave them spears and black
    palm-wood clubs, and sent battle, theft, adultery, and killing sorcerers among
    them; the passage says death came to these villages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Romilly’s variant, Oa Rove is described as a child who changed his skin
    like snakes, did not grow larger, and was wise enough to be left in charge of
    the village and women.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child Oa Rove lit a firestick, traveled into the bush, slept inside a
    hollow log, and was picked up by a woman gathering firewood; he then persuaded
    her to adopt him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Oa Rove went fishing or hunting with the men, all fish, pig, and wallaby
    were caught in his net, but the village men beat him and took most of the catch
    or game.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Oa Rove asked his adopted mother to gather the girls and women for fishing,
    then secretly changed himself into a large fish and later into a wallaby, neither
    of which the women could hold or kill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Oa Rove pounded twigs from a small shrub and threw them into the river, after
    which so many fish died that they could not be collected before dark.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The women woke cold, heard a great noise, saw the ground rising, and recognized
    their village far below; Oa Rove laughed and said they could not hurt him because
    he was now in his own place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When husbands came for their wives, Oa Rove sat on an inaccessible rock and
    threw a spear, a bow and arrow, a club, and then a charm stone, teaching the men
    how to copy and use these means of killing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Oa Rove threw a dead body and said that if it had been caught before touching
    the ground, the weapons would have been useless and the people would have been
    immortal as he was.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In one variant, bodies of women wrapped like corpses fell from the sky, were
    not successfully held up, touched the ground, and produced bad smell, flies, and
    mosquitoes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In another story, Oa Rove gave the tribes a closed bamboo with buzzing inside;
    after they opened it in water, the first mosquitoes appeared and continued to
    multiply in water.
  category: sequence
  evidence_refs:
  - ev:11
