canonical_text:
  quote: ''
  summary: Ethnographic passage reporting and discussing cases and beliefs concerning
    exhumation and eating of corpses, alleged corpse-eating sorcery or parauma transformation,
    reported infant killing and eating, restrictions on cannibal feast participation,
    preparation of human flesh, and the author's conclusion that public cannibalism
    in parts of south-eastern New Guinea was chiefly connected with vengeance and
    desire for human flesh rather than magic.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Samarai, a Central Court case involved two adult women and a girl accused
    of digging up and eating the body of the elder daughter's recently buried child;
    the oldest woman was mother of the other two, and the accused claimed the act
    was customary before receiving short imprisonment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that evidence was conflicting on whether eating dead relations
    in the district had ever been common enough to count as a custom.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A South Cape account attributed to Chalmers says a Bonarua woman dug up her
    buried husband to feed friends, causing indignation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author doubts Chalmers's explanation of the indignation and states that
    the practice formerly prevailed, probably sporadically, over a wide area and perhaps
    most intensely in the D'Entrecasteaux Groups.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports a common opinion that sorcerers open graves and eat corpses,
    which the author treats as possible evidence that exhumed-corpse eating had magical
    significance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mr Giblin hypothesizes that the three accused females may have wanted to become
    parauma; reported conversations connect becoming parauma or a flesh-eating witch
    with eating buried bodies or corpses.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The passage reports that children, especially illegitimate children, were
    sometimes killed and eaten, while also noting uncertainty about how often eating
    occurred and describing a Milne Bay infant case as unconfirmed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage refers elsewhere to rules determining who could take part in a
    cannibal feast and to ceremonial abstinence imposed on men who had taken prisoner
    or killed the person eaten.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: For non-ceremonial cannibalism, children were not permitted to eat human flesh,
    pubescent men and women could do so, some women and men abstained, and toothless
    old men usually abstained and were often not named when flesh was distributed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Human flesh was generally boiled or cooked in a native oven; some body parts
    were especially esteemed, and Waieraiena of Wagawaga was noted as unusual for
    eating his portion raw.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author states that public cannibalism at Wagawaga or Tubetube had no magical
    significance, that eaters did not gain the dead man's wisdom or prowess, and that
    the main factors were vengeance for a killed hamlet-group member and desire for
    human flesh.
  category: other
  evidence_refs:
  - ev:10
