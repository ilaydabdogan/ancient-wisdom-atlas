canonical_text:
  quote: ''
  summary: 'The passage describes Roro-speaking marea or clubhouses: their named status,
    chiefly rights to build them, rival or joint construction by chiefs and clans,
    display of feast-related bones as reminders of reciprocal obligation, responsibility
    for upkeep and carved posts, expert carving lineages, and rules about storing
    weapons in battle-related marea rather than in the marea of the ovia itsipana.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vegetable food was reportedly not hung up or displayed in quantity on the
    marea before a feast, unlike the custom in the area of the open dubu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A warrior might call out the name of his marea when striking a blow or when
    very tired.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note attributes the calling of named marea and named nets less to conscious
    animism than to mana or virtue inherent in the name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some marea other than those of the ovia itsipana were called terms glossed
    as jealousy marea, and some separate marea are explained through quarrels between
    chiefs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two weak clans could unite to build one marea in common, with the right and
    left sides built by different chiefs and each half bearing its own proper marea
    name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bones, including pig jaws, pig skulls, and dog skulls, were sometimes attached
    to or temporarily exhibited in marea as feast trophies and reminders that a return
    feast was owed.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a return feast had been given, a skull could be removed from the marea
    and thrown away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chiefs were responsible for upkeep of the marea and for providing carved marea
    posts, while expert craftsmen produced much of the fine carving.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Poa Oa was remembered as an expert carver who worked for his clan and helped
    the Nara village Diumana with a clubhouse resembling the Waima marea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Carving knowledge is described as passing from Poa Oa to his son Maoni Poa
    and expected to pass to Maoni Poa's son Oa Maoni.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spears and clubs were not brought into or upon the marea of the ovia itsipana,
    while spears, clubs, bows, arrows, and reserves of weapons were kept in battle
    marea and some paiha marea.
  category: action
  evidence_refs:
  - ev:7
