canonical_text:
  quote: ''
  summary: The passage defines several Roro terms for reflection, shadow, vital essence,
    and the ghost or shade of the dead; describes tsirama and beriwa as village-frequenting
    spirits that can affect luck, steal souls, and cause fear at night; describes
    Ariyo as the destination of dead spirits, with gardens and abundant food; and
    describes Boubou, an evil fire-like spirit, intercepting and questioning the dead
    before directing them along roads to Ariyo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auba is described as the likeness or reflection of a person rather than the
    ghost of a dead person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsirania or tsirava is described as the usual term for the spirit or ghost
    of a dead person, while beidwa is also sometimes used.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsirava is also used for the vital forces or essence within a person, and
    tsirama are sometimes seen as shadows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tsirama are considered to frequent their people's villages; if they desert
    a village, the inhabitants are said to have no luck, and measures may be taken
    to bring them back.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If annoyed, for example by too many quarrels among women, tsirama are said
    to send bad luck in hunting and fishing; in such circumstances, people might try
    to conjure them out of the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Seeing the tsirama of a dead relative in dreams is described as terrifying
    but not unlucky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Tsirama are said to steal away the souls of others and make them ill; beriwa
    are said to behave in the same way and are sometimes considered identical with
    tsirama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fear of tsirama and beriwa is said to prevent people from leaving the village
    after dark unless accompanied, even for very short distances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The tsirama or beriwa of dead men are said to go to Ariyo in the bush behind
    Waimatuma, where shades cultivate a large garden, food abounds, and all are happy.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In one account, if a living man reaches Ariyo he dies, and plants from Ariyo
    brought to mortal gardens are transported back by spirits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In a variant account from Mou, living men reached Ariyo and brought back plants,
    but the plants withered and died when transplanted, and mortal gardens then produced
    only small crops for a time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Boubou is described as an evil spirit like fire who intercepts the tsirama
    on the way to Ariyo, asks about ear and nose piercing and the manner of death,
    and directs the spirit to one of several roads, all of which reach Ariyo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that Boubou's origin and physical characteristics were
    not discovered and that there was no reason to attribute his existence to misunderstood
    Mission teaching.
  category: attribute
  evidence_refs:
  - ev:6
