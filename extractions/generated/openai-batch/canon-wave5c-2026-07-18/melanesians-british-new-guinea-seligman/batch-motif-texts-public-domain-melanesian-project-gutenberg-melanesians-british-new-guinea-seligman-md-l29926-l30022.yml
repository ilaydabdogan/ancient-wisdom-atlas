canonical_text:
  quote: ''
  summary: The passage describes inheritance practices at Wagawaga and Tubetube, including
    succession to garden land, house-sites, houses, coconut trees, armshells, jewellery,
    cooking pots, and first crops after death. It emphasizes sisters' children as
    heirs to men's land, temporary care of property for minors, occasional destruction
    or abandonment of houses associated with death, and specific transfers of women's
    property and widow's crop obligations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, most or all of a man's garden land passes to his sisters' children,
    who divide it equally if they are all married.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If some of a man's sisters' children are unmarried, their married brothers
    and sisters look after the land; a maternal uncle or the man's mother may temporarily
    hold land when the sisters' children are young.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a man's death at Wagawaga, his house is often destroyed or allowed to
    rot; a note says a house is deserted after a corpse has been in it for some time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a dead man's house at Wagawaga is not destroyed, or if only the house-site
    remains, it commonly passes to a brother, sister, or sister's child, with convenience
    affecting the choice.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At Wagawaga, a woman's garden property, including coconut trees, is divided
    equally among her children, but an elder married sibling may hold the property
    in trust for younger siblings until they marry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If none of a dead woman's children at Wagawaga are grown up, their maternal
    uncles and aunts look after the garden property and feed the children, using surplus
    food themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Wagawaga, armshells and valuable jewellery associated with a woman may
    pass partly to her sisters and partly to her children, while jewellery given by
    a husband may revert to the husband's kin or to the widower depending on who dies
    first.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Wagawaga, a woman's cooking pots pass to her adult daughters, or to her
    sisters if the daughters are young.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Tubetube, a man's landed property, including clan garden land and land
    he cleared and planted, is divided equally among his sisters' children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Tubetube, after a husband's death, his widow must give half of the first
    crop raised on her garden ground to the deceased man's brothers, sisters, and
    mother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Tubetube, a dead man's house may pass to a brother, sister, or sister's
    child, but houses of the dead are often destroyed or allowed to rot, so heirs
    may inherit the house-site rather than the house.
  category: relationship
  evidence_refs:
  - ev:9
