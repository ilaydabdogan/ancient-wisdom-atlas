canonical_text:
  quote: ''
  summary: The passage describes Koita marriage-night adornment, immediate post-marriage
    movements and payments, reciprocal exchanges between the families, rules concerning
    a woman's iduhu after marriage and widowhood, remarriage payments, preferred widow
    or widower remarriage patterns, and polygynous household arrangements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the marriage night the bride prepares a sleeping mat for the bridegroom,
    and he comes to her publicly before the house is quiet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride is specially decorated with dressed and oiled hair, possible scarlet
    hibiscus blossoms, earrings, red paint, reddened armlets with odoriferous leaves,
    coconut oil on the epilated genitals and thighs, and a new petticoat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bridegroom wears a cassowary-feather headdress, three rows of tautau as
    a frontlet, white cockatoo feathers, dried village-pig tails in his ears, red
    and yellow face paint, and reddened armlets.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn the husband and wife go to the husband's house, usually his father's
    house, and the boy leaves two toia or doa on the sleeping mat; these are called
    gabuato and are kept by the girl's parents.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A later damuy is brought to the bride's parents' house by the husband's mother,
    sisters, and yaiya, and each of the bride's female relatives carries a hodu pot
    full of water to a bridegroom's relative's house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After placing the water pot, each bride's relative brings food to the same
    bridegroom's relative's house, cooks it there, and the householder and family
    eat it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two days after the marriage the bridegroom's relatives send a betube present
    to the bride's parents; the next day the bride's parents make an equal-value return
    present, also called betube.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For about the first fortnight of married life the bride and bridegroom sleep
    in the bride's father's house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Reciprocal food presents between the two families continue for years and cease
    only when one party fails to perform its part of the exchange.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a woman marries she takes her husband's iduhu; as a widow she may remain
    in that iduhu or return to her relatives and resume her maiden iduhu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a widow with children returns to her old iduhu, she takes only children
    who have not reached puberty; those children keep their father's iduhu and later
    return to build on the father's house site.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a widow remarries, the second husband must pay the usual damu to her
    maiden iduhu, and her first husband's relatives may demand a substantial laraha
    payment.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that no levirate exists and that marriage with a deceased
    husband's brother does not occur.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Marriage between a widow and a son of a brother or sister of her deceased
    husband's father is considered especially suitable though not compulsory; a related
    preferred marriage is also described for a widower.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Polygyny is described as not uncommon; generally each wife has her own house
    on her husband's village site, and those houses are said to descend to her children.
  category: relationship
  evidence_refs:
  - ev:11
