  quote: ''
  summary: An account attributed to Captain Barton describes an ear-piercing operation
    for a child about one year old. A split ring made from shark vertebra or crab
    leg section is fitted to the stretched ear lobe; its points gradually penetrate
    the ear, after which the ring is removed and a piece of wood is inserted to keep
    the hole open.
