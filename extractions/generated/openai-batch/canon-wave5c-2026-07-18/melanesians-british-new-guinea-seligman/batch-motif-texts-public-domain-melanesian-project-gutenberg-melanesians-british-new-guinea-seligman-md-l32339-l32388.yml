  quote: ''
  summary: The passage classifies taboos in the southeastern district of New Guinea
    into magically enforced taboos and nonmagical taboos enforced by public opinion
    and custom. It further distinguishes nonmagical taboos protecting objects through
    signs from customary abstentions at special times, and explains that uncertainty
    about whether a sign has been magically empowered can strengthen protection of
    private property.
