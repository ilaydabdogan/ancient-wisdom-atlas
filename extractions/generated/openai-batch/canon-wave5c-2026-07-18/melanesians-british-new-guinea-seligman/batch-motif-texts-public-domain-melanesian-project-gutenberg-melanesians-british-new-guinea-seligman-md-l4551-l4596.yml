canonical_text:
  quote: ''
  summary: 'The passage describes kinship duties and privileges: a boy receives his
    first perineal band from his maternal uncle and owes him services; maternal uncles
    have stronger authority than fathers or paternal uncles in some contexts; reciprocal
    raimu, siba, and waru relations include broad borrowing privileges, different
    return expectations, and no avoidance behavior; a henamo friendship bond is briefly
    cross-referenced.'
  language: English
  quote_policy: summarized
