  text: A boy usually receives his first perineal band from his maternal uncle and
    owes him services in return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When with his maternal uncle in a canoe, the younger man does most of the
    work and prepares and cooks food; on land he helps with garden work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger man performs similar services for his mama, identified as father
    or paternal uncle, but the maternal uncle is said to exert more authority than
    any mama.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Ahuia uses the annual hiri trading cruise for sago as an illustration: a
    man or boy might refuse to go with his father or paternal uncle, but would go
    with his maternal uncle without objection.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People who are reciprocally raimu freely borrow valuable articles such as
    nets or canoes from each other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When reciprocal raimu return borrowed property, they mention any damage, and
    the owner decides whether the borrower must make it good.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men and women do not avoid relations-in-law; waru and siba associate freely
    in houses and gardens.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Siba take food from each other's gardens and borrow each other's canoes or
    other property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Loans by a man to his sister-in-law are said not to be part of the bride-price
    because the articles are returned, and men have equal privileges regarding siba
    and waru property.
  category: relationship
  evidence_refs:
  - ev:5
