canonical_text:
  quote: ''
  summary: The passage explains the relation, among Mekeo groups, between iauafangai,
    kangakanga, and ufu. It describes iauafangai as animal or plant associations of
    clans, kangakanga as distinctive clan-badge ornaments often derived from animals
    or plants, and ufu as clubhouses associated with clans or local groups. It also
    reports uncertainty and confusion among these terms and their names, including
    comments attributed to Father Egidi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that iauafangai, kangakanga, and ufu are closely connected
    in the minds of Mekeo people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each pangua has as iauafangai an animal or plant, often the same for most
    or all pangua said to be ngopu, meaning of common descent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Inawi ngopu group of the Biofa tribe is given as an example whose iauafangai
    is ongoi, the breadfruit tree.
  category: object
  evidence_refs:
  - ev:2
  - ev:9
