canonical_text:
  quote: ''
  summary: The passage describes post-marital residence and land-use practices at
    Wagawaga and Tubetube. A husband was expected to make his first post-marital garden
    on his wife's land, might reside for a time in her hamlet, could later make a
    garden in his own hamlet, and might alternate between the two hamlet-groups. At
    Tubetube, the passage gives a specific example involving Mwakasoki and Turia,
    including house-building and garden-making in both the wife's and husband's hamlets,
    with assistance and later caretaking by the wife's relatives.
  language: English
  quote_policy: summarized
