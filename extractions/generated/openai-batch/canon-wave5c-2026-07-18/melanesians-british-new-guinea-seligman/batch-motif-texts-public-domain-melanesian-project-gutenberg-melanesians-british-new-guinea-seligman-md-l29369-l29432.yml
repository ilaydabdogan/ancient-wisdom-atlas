  text: At Wagawaga, a man who married was customarily expected first to work on his
    wife's garden and land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, it was usual for a married man to live in his wife's hamlet,
    but if the wife's hamlet was close to his own he could take her to his hamlet
    without offence, provided he worked on her garden land soon after marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, the first garden made after marriage was obligatory on the wife's
    land, even though initial residence in the wife's hamlet was optional.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After making a good garden on the wife's land at Wagawaga, the husband would
    usually make a garden in his own hamlet and might take his wife there for a period.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Wagawaga arrangement could produce a semi-migratory existence between
    the husband's and wife's hamlet-groups for years.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Wagawaga, a man generally returned to his own hamlet in old age, except
