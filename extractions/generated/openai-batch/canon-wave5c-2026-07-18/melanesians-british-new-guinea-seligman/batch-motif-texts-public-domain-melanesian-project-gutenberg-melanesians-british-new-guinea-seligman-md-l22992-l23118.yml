candidate_motifs:
- id: motif:1
  label: Captive child released by other children
  taxonomy_refs: []
  basis: The boy is confined and is released when children open the pot or cage to
    play with him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage begins mid-story, so the original capture circumstances are
    not included.
- id: motif:2
  label: Intended victim replaced by refuse in a cooking pot
  taxonomy_refs: []
  basis: The boy leaves excreta in the pot, and the men cook and eat it while thinking
    the pot contains him.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly state the prior plan for the boy beyond
    the men’s mistaken cooking and eating of the pot contents.
- id: motif:3
  label: Tree refuge with weapon defense against climbers
  taxonomy_refs: []
  basis: The boy climbs a coconut palm with three spears and kills or wounds climbers
    by spearing their eyes.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: No broader ritual or cosmological role for the tree is stated.
- id: motif:4
  label: Escape through transformation into a bird
  taxonomy_refs:
  - shapeshifter
  basis: As the palm is cut down and falls, the boy turns into a black cockatoo and
    flies away.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only this final transformation is described; no wider shapeshifting ability
    is stated.
- id: motif:5
  label: Etiological explanation for black cockatoos in treetops
  taxonomy_refs: []
  basis: After the transformation, the narrative says that ever since then he sits
    in or flies around treetops.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives only the tale ending and not a formal explanatory statement
    beyond this closing sentence.
- id: motif:6
  label: Child departs after kin consume her special food
  taxonomy_refs:
  - departure
  basis: The girl’s mother and aunts repeatedly eat her lily roots; she prepares herself,
