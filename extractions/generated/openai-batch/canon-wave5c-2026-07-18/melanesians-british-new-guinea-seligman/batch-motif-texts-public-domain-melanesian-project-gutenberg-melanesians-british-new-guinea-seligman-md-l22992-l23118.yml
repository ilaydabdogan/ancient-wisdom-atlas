canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a captive boy is released
    by children, receives three spears from his parents, climbs a coconut palm, deceives
    men into eating what he left in a pot, kills climbers by spearing their eyes,
    and escapes as a black cockatoo when the palm is cut down. It then begins the
    Taupota tale “The Lily Root,” in which a girl whose preferred yellow lily root
    is eaten by her mother and aunts prepares herself with coconut oil and ornaments,
    leaves with her dog, climbs a wakola tree over the sea, and sees a crocodile below.
  language: English
  quote_policy: summarized
