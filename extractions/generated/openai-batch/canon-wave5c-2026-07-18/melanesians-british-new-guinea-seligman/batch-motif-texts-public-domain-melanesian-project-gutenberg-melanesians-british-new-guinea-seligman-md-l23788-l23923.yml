canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a speaking snake, identified
    by a woman as her mother, watches over a child, makes the child temporarily able
    to run, and magically produces garden food, explaining why mountain people have
    plentiful but enchanted food. It then gives the tale of the Rat and the Butterfly,
    who travel in a decorated chip canoe, sink it, reach shore, and later the rat
    dies in a sugar-cane patch; butterflies wrap and bury him while refusing carrion
    birds' questions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An enormous snake enters the house, coils under the net bag where the child
    sleeps, smells and licks the child, watches for a time, and leaves for the bush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband reports the snake's visit, and the woman identifies the snake
    as her mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The snake returns at night, wakes the woman, and tells her to let her husband
    go to the gardens while she stays home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The snake visits again, stays with the family, and later offers to mind the
    baby while both parents go to the gardens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While minding the baby, the snake lengthens the child's legs so that the child
    can stand, walk, run, and play outside the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the mother protests, the snake calls the child back, shortens his legs,
    and says he may run again when the sun is in another stated position.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When sent to the gardens, the old snake breaks single leaves of orabu, sugar-cane,
    and taro, and these become quantities of food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The parents later find no signs that food has been taken from the garden,
    and the narration explains that mountain people have plenty of food, though it
    is enchanted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A rat and a butterfly make a canoe from a chip of wood, decorate it with carvings
    and small cowry shells, and embark on the deep sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The rat and butterfly accuse one another that breaking wind may split or burst
    the canoe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rat breaks wind so forcefully that the canoe bottom splits, the canoe
    fills with water, and it sinks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the canoe sinks, the rat swims and the butterfly flies; when tired,
    the butterfly perches on the rat's head while the rat continues toward land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After reaching shore, the butterfly seeks food in a banana garden, while the
    rat gnaws a sugar-cane; the cane breaks and holds the rat in the notch, and the
    rat dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The butterfly wraps the dead rat in an aravi mat, calls other butterflies,
    and the butterflies carry the rat to a prepared grave.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A kite, an osprey, and other carrion birds ask about the wrapped food or meat,
    but the butterflies do not answer and bury the rat safely.
  category: sequence
  evidence_refs:
  - ev:8
