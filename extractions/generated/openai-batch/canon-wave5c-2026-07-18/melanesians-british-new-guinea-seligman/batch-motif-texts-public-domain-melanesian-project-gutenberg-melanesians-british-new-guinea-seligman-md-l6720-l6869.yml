canonical_text:
  quote: ''
  summary: 'The passage gives seven numbered songs sung on lakatoi, with the collector''s
    comments on pronunciation, possible meanings, associated places, objects, and
    several lakatoi-related legends: an addressed vessel named Bogebada, a drought
    tradition about Anal/Hanai, a netting reference around Idiha and Bava, a quarrel
    and split voyage involving Kaimegore and Idogore, a lost lakatoi at sea, preparation
    for a voyage, and two obscure songs.'
  language: English commentary with Motu-language song text
  quote_policy: summarized
