canonical_text:
  quote: ''
  summary: The passage describes Sinaugolo movements from hill sites to the coastal
    plain, neighboring Hood Peninsula and Aroma-area groups, house dubu or koge structures,
    skull trophy display in house-dubu areas, relations between Bulaa/Alukune and
    Keapara, and canoe-making dependency.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sinaugolo are described as leaving Taborogoro, reaching several village
    sites, and taking names from those sites before reaching a mountain called Sinaugolo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After further splittings and wanderings, an advanced guard reached the edge
    of the coastal plain and founded Gumori Dobo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The village Gumori Dobo is described as the first Sinaugolo settlement actually
    on the coastal plain; its dubu was named Ligodubu, and the name Ligo is explained
    as meaning that people had come down from the hills.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A coastal group extending from the Hood Peninsula eastward at least to the
    Aroma villages is provisionally bounded by the Upugau river and includes Kwaipo,
    Hula, Kerepunu, and Aroma.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bulaa or Hula village is described as four groups of pile-dwellings in
    the sea, each with a distinctive name.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bulaa people are said to have formerly lived at Alukune or Harukunu near
    Keapara/Kerepunu and to have been subservient to Keapara for generations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Keapara is described as levying fish and other marine produce from Alukune,
    obtaining vegetable-food exchange on favorable terms, and seizing Alukune women
    as wives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Half of the Alukune/Bulaa village left together, settled at Hood Point, and
    built Bulaa; the remaining half continued in subjection to Keapara for some time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hood Peninsula and related coastal group is distinguished from western
    neighbors by house dubu, called koge in the Hood Peninsula, instead of open dubu.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The koge or house dubu are described as steeple-houses with lofty spires and
    as structurally notable buildings with long forms and massive supporting posts.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Skull trophies are said not to be kept in the open-dubu area from Redscar
    Bay to Kapakapa and Ikoro, but to have been collected and hung on dubu where house
    dubu occur until Government-enforced peace.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The passage states that these peoples have broadly similar social organization:
    villages are divided into clans that are, or recently were, exogamous.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Alukune fisherfolk are described as obtaining canoes from Keapara and paying
    heavily, reportedly through a half-profits arrangement in which canoe debt was
    rarely cleared.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Canoe-making is described as the major industry of Keapara, with men hollowing
    canoes using stone adzes.
  category: action
  evidence_refs:
  - ev:10
