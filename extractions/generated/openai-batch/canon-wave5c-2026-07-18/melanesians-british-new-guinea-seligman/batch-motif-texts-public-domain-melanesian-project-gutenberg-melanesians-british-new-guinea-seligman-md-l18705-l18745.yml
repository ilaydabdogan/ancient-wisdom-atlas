canonical_text:
  quote: ''
  summary: The passage describes how an ikupu may split when a leading man proposes
    building a ngove with support from kin and friends, provided the wider group accepts
    the action and receives a feast. It also describes the reverse process, in which
    a weakened ikupu merges with a related one. Further differentiation may produce
    a nearby new settlement with a new name after feasts, especially if it gains prestige
    through war or a sorcery expert. The passage explains how weakened clans or hill
    immigrants may be absorbed or later become limited independent clans within a
    village, producing locally recognized pangua subdivisions and adoption of host-group
    practices or identifiers.
  language: English with local terms
  quote_policy: summarized
