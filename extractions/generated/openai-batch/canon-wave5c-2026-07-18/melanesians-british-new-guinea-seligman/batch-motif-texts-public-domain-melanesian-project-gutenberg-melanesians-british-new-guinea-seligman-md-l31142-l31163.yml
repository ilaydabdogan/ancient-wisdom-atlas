  summary: 'The passage describes warfare practices: a man who has killed an enemy
    avoids withdrawing his spear or touching the corpse because contact with the dead
    man''s blood is believed to cause illness or death. It also reports that a woman
    can save a man struck down in battle by throwing her inner grass petticoat over
    him, with two cited Wedau/Wamira examples.'
