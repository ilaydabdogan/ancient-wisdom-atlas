canonical_text:
  quote: ''
  summary: 'Ethnographic account of ufuapie relationships and their functions in death
    and mourning ceremonies: a deceased married woman is returned to her own village;
    mourning taboos are lifted by an ufuapie chief; pigs, feasts, dirges, invitations,
    and gifts regulate the ending of mourning and the resumption of dancing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ufuapie group is described as usually composed of two or more pangua,
    with individual pangua often recognizing one principal ufuapie while also acknowledging
    others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a woman marries she lives in her husband's village; when she dies, her
    kin fetch her body and carry it back to her own village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband's village mourns until the body is removed, while later ceremonies
    and taboos occur in the woman's own village and affect all clans of that village.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the ceremony ending mourning, the chief of the ufuapie group comes to the
    deceased's village to remove waist belts, armlets, and leglets worn by relatives
    of the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ufuapie chief releases relatives from self-imposed food taboos by taking
    part of the avoided food, waving it around the mourner's head, and authorizing
    its use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Domestic pigs must be killed and a feast made for the men of the ufuapie before
    dancing may take place; if only wild pigs are given, drum-accompanied dances remain
    prohibited while chant-accompanied dances are allowed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pangua of the ufuapie usually send women to sing dirges at the funeral.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Food given to the ufuapie women at the funeral is not carried away by them;
    instead, the deceased's pangua carry food presents to the villages of their ufuapie.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Any chief of a clan that is ufuapie to the deceased can perform the ceremony
    ending mourning; when multiple chiefs are present, the one whose clan has the
    longest or closest connection acts as master of ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before the great feast, men of the mourning village hunt and return after
    killing much game; invitations are sent by messengers bearing bunches of areca
    nuts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Neighboring villages may be invited as a courtesy, but the ufuapie are described
    as the only people strictly entitled to invitation; the ceremony cannot begin
    before the ufuapie men arrive.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The men of the ufuapie may delay arrival until they have received sufficient
    inducement in presents.
  category: action
  evidence_refs:
  - ev:7
