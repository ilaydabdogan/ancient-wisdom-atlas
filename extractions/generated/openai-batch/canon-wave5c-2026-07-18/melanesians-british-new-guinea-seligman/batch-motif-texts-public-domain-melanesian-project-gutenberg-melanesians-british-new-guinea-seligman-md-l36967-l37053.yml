- id: obs:3
  text: Taolu possesses armshells, shell-disc waistbelts, and ceremonial axe blades,
    much of it obtained after the death of his brother Enamakala; the passage says
    this property is his own and may be sold or given away.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peace-making is described as formal and highly ceremonial; the author reports
    no evidence for cannibalism and says prisoners were not taken, with no quarter
    being the rule.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Trobriand islanders are described as keen traders, with differences among
    islands in the amount of foreign trade carried on.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vakuta is said to have especially bold sailors who travel to other island
    areas, while Kadawaga people are described as less bold; a Koma waga owner says
    he will use his canoe only for coasting.
  category: action
  evidence_refs:
  - ev:4
