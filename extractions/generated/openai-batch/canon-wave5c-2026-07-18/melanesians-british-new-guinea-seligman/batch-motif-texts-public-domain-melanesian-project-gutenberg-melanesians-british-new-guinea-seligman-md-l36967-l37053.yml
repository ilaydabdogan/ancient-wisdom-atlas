  text: The author says the account shows the scale of former fighting and an aristocratic
    tradition, but rejects evidence for Taolu or Enamakala holding supreme authority
    over all Kiriwina or the Trobriand Group.
  category: relationship
  evidence_refs:
  - ev:1
