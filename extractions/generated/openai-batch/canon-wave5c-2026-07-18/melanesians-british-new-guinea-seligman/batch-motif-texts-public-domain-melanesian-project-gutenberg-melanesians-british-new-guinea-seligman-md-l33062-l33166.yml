canonical_text:
  quote: ''
  summary: 'The passage describes the walaga feast in the Bartle Bay district: its
    regional importance, its dancing platform and dance, the role of the taniwaga
    as master of ceremonies, the summoning of communities owing pigs, the selection
    and clearing of a wild young mango tree, and the taboos and separations imposed
    on the taniwaga, fasting men, and certain women of the taniwaga''s clan. A footnote
    also compares related mourning feasts and notes a practice of cutting mango trees
    in relation to pigs killed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The walaga is described as the largest and most spectacular feast in the Bartle
    Bay district and as bringing together distant communities, including communities
    indifferent or hostile to one another.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A walaga was said to be held when a community had many pigs of its own and
    when much food, including pigs, was owed to it by neighbouring peoples.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feast takes its name from a large dancing platform built specially for
    the occasion.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Walaga is also the name of a dance performed in single file by both sexes
    on saplings placed around the outer edge of the dancing platform.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The head man of one of the more powerful clans of the host community becomes
    taniwaga, described as the chief or master of ceremonies of the walaga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The taniwaga sends messengers to people owing pigs to him or his community,
    confirms that enough pigs will be provided, and sends notice up and down the coast
    months before the ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: About five or six weeks before the feast, the taniwaga goes to the jungle
    and selects a self-sown wild mango tree that is young and has never flowered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eight to twenty men accompany the taniwaga and clear a circle of about ten
    feet in diameter around the selected mango tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the clearing, the taniwaga and the men who cleared the ground are differentiated
    from all others and described as vivivireina, set apart or holy.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The taniwaga and fasting men must not wash, drink water, allow water to touch
    them, eat boiled food, drink broth, or eat mango fruit; they may drink only baked
    young coconut milk and may eat certain foods only if baked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The fasting men are said to sleep by themselves in a house into which no one
    else may intrude; rubbish and food refuse from their meals is stored in baskets
    there and may not be removed until after the walaga.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mr Newton reported seeing a temporary village of large pile-built houses,
    most divided into men's and women's sections, near or including the house of the
    fasting men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the day the men begin their fast, about six to ten women of the taniwaga's
    clan begin avoiding the company of the opposite sex and observe the same abstentions
    from water, boiled food, and mango fruit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The women observing these taboos do not sleep in a special house, and the
    rubbish from their meals is not treated like the fasting men's rubbish.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A footnote states that at the Gelaria ioi, which corresponds to the Wamira
    torela, platforms are built and one mango tree is cut down for every five pigs
    killed.
  category: action
  evidence_refs:
  - ev:8
