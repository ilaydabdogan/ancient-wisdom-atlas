canonical_text:
  quote: ''
  summary: The passage describes Bartle Bay public status categories, especially gulau
    chiefs and taniwaga ritual or technical controllers. It explains that taniwaga
    possess specialized knowledge of charms or incantations for domains such as crops,
    water, rain, wallaby, fish, and taro; that some offices are hereditary and may
    combine with chiefly status; and that status is also shaped by age, property,
    wealth, and poverty-related categories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bartle Bay settlements are described as recognizing certain men as headmen
    or chiefs called gulau, with influence and authority.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magala of Wamira and Bamdiri of Wedau are named as examples of men to whom
    chiefly influence and authority apply.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Taniwaga are described as experts whose special knowledge benefits their own
    community and sometimes foreign communities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some taniwaga know charms or incantations called pari connected with gardens,
    water, rain, wallaby, fish, and taro.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Within his own community, each taniwaga is said to be supreme in his own department,
    and others cannot interfere with him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A taniwaga generally does less hunting and gardening than other men because
    men of his community do much for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Taniwaga are said probably to observe special taboos; the stated example is
