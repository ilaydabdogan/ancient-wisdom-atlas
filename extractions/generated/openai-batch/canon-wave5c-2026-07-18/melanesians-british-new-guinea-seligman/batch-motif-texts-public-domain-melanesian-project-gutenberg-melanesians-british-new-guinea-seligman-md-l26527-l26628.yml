  text: A taniwaga generally transmits his knowledge to his brother or to his sister's
    son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bamdiri is described as both gulau of Wedau and taniwaga of charms that bring
    rain and control winds.
  category: relationship
  evidence_refs:
  - ev:4
