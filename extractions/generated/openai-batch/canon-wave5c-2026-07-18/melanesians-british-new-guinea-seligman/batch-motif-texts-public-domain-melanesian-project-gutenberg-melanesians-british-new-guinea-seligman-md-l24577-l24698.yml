canonical_text:
  quote: ''
  summary: The passage gives local historical and origin accounts for Wagawaga-related
    stocks and Tubetube settlements. It recounts a taro theft that led to clan conflict,
    migration from Bobowa to Gumeni, and a feast; Sinedadaiya’s attachment to a Bwari
    Keroro man, expressed through an areca-nut request, leading to the Garuboi stock;
    the Modewa stock’s origin in survivors of an earthquake-sunken Bwari island who
    drifted on tree fragments and were adopted at Pihoho; a Hurana origin site near
    Tokea rock; and geographic details of Tubetube hamlets around a central hill and
    coastal flats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bobowa man took cooked taro belonging to others and ate it, causing annoyance,
    recrimination, minor blows, and clan partisanship.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the dispute remained unsettled overnight, a party of men left Bobowa,
    went to Gumeni, made a settlement, and stayed long enough to hold a large feast
    called toreha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the Gumeni feast, Sinedadaiya, a woman of Gumeni, became attached to a
    man from Bwari Keroro and asked him for areca nut, which the passage states was
    equivalent to a declaration of attachment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sinedadaiya followed the Bwari Keroro man to his home; his people questioned
    her presence and even suggested killing and eating her, but accepted his explanation
    that she wished to live with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children of Sinedadaiya and the Bwari Keroro man are said to be the ancestors
    of the present Garuboi stock of Wagawaga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The eastern extremity of the Wagawaga hamlet-group is said to belong to the
    Modewa stock, which had not been settled in Discovery Bay for more than four generations;
    Duria hamlet is described as absorbed into that stock by adoption.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bwari is described as the remains of an island off Rogea where people once
    had gardens before an earthquake shattered the island and sank much of it beneath
    the sea, killing many inhabitants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some inhabitants of Bwari climbed a large tree; many fell and drowned when
    branches snapped, and others held to large branches after the tree broke apart
    and drifted away from the disaster site.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tree fragments with people on them drifted to Wari, Tubetube, Dahuni near
    Bonabona, and the mainland foot of the hill below Pihoho.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Pihoho woman going to the beach for salt water saw exhausted men clinging
    to the tree remains, reported this to Pihoho men, and the men brought the castaways
    to Pihoho.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Pihoho, the castaways took the totems of their rescuers, settled, took
    up land, and were adopted; later, when Pihoho was reduced, its people moved to
    the eastern Wagawaga hamlet-group and fused with its people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The historical origin site of the Hurana stock is said to have been near a
    large rock called Tokea within a day’s walk of Discovery Bay.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tubetube hamlets are described as grouped on the west and south coasts around
    a large central hill, with houses on sandy flat ground near the beach rather than
    on hill slopes, and gardens behind the houses or on flatter northern land.
  category: setting
  evidence_refs:
  - ev:7
