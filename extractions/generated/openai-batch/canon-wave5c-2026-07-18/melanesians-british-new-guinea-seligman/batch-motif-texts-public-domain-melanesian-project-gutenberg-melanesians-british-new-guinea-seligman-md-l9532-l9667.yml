canonical_text:
  quote: ''
  summary: 'The passage describes Koita funeral and mourning practices: messengers
    summon relations, visitors touch the corpse''s face with their noses, close kin
    prepare and adorn the corpse, mourners keep night vigil with dirges and fasting,
    a death chair called bisa is made, the corpse is displayed with wife and sister
    beside it, broken possessions are arranged as a tobi, and later the sister removes
    ornaments before the corpse is rolled in a mat and tied to a pole for carrying.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Messengers from the dead man's local group are sent to his Koita and Motu
    relations in neighbouring villages; arriving visitors come without paint or decoration
    and touch the dead man's face with their noses without inhaling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A younger brother, or failing him the henamo, prepares the corpse by shaving
    the face and pubes, putting on a new sihi, oiling and painting the face, and adding
    ornaments including a nose ornament, shell armlets, strings of tautau, a boar's
    tusk ornament, and gana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the early preparation and vigil, the corpse lies on its back on a mat
    in the house with its head supported in the widow's lap.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men and women surround the corpse, watch and wail through the night, sing
    named dirges and songs, and abstain from eating while smoking remains allowed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sunrise the wailing stops; visitors disperse for rest and food, and friends
    from other villages eat on the verandah of the dead man's house at the widow's
    invitation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead man's nana, roro, and iha make the bisa, a rough wooden death chair
    or bench arranged to support the body in a sitting posture.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The corpse is carried to the bisa by people not closely related to the dead
    man, placed in the centre, flanked by wife and eldest sister or by two wives,
    while villagers and friends face the bisa in a half-circle, beat drums, and sing
    dirges before the corpse is carried back to the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead man's chief possessions, except certain valuable ornaments and costly
    nets, are carefully broken and arranged beside the bisa as a tobi, with broken
    spears at the centre and other items wrapped and tied around them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A native drawing of a bisa shows a papaw tree beside the bisa, a small tobi
    with a drum and two nets, women wiping tears, and a man who has lit a baubau with
    a glowing brand shown in red.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tobi is made for a married man, a married woman, and an adult unmarried
    male, but not for an unmarried girl or a child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the body is returned to the house, the dead man's sister removes most
    ornaments and places them in a kiapa string bag for later division among near
    relatives; everyone present again touches the corpse, and the corpse is rolled
    tightly in a new mat and roped to a pole for carrying.
  category: sequence
  evidence_refs:
  - ev:8
