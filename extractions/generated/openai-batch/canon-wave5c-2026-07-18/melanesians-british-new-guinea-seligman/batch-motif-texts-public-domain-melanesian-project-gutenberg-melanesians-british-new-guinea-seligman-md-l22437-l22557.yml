canonical_text:
  quote: ''
  summary: The passage contains the end of a snake story in which a community frees
    a girl from a snake by luring it away for water, killing it, and explaining reefs
    as its pieces; a Wagawaga story of Hagwai, a neglected boy who becomes a cuscus;
    and a Wagawaga story of a man betrayed in a bat cave, aided by dogs, rescued by
    an old woman, and preparing revenge.
  language: English
  quote_policy: summarized
