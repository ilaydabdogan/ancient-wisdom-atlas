canonical_text:
  quote: ''
  summary: The passage describes emblem-bearing posts and other carved or modelled
    figures in marea clubhouses at Waima and Mou. It identifies hornbill, crab-claw
    sail, lizard, bird, and chelonian images as baba or dada associated with particular
    settlements or local groups; describes chiefs' and local representatives' responsibilities
    for carving, maintaining, and owning posts; notes reciprocal food exchange during
    post work; and reports uncertain or second-hand information about aruaru marea
    and seclusion in a marea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The front right lateral post of Tautaa marea has a capital carved as a conventional
    hornbill and belongs to Roro Aiera settlement of the Arabure stock, whose bada
    is the hornbill.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second right lateral post belongs to a Hauramiri local group and is also
    carved as a hornbill, with beak marks still recognizable.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The left front lateral post belongs to the Ereere stock and bears a representation
    of a crab-claw canoe sail, described as one of the baba of some or all Ereere
    local groups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The carving on the Ereere post was incomplete and was said to have been intended
    to show two sails with surfaces parallel and edges turned toward the village centre.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second left lateral post belongs to Herahera settlement; its broken capital
    was said to have been intended to represent the baba of Herahera, one of the Arabure
    local groups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each post was supposed to have been carved by the chief of the settlement
    or local group whose baba it bore, and each ovia itsipana was responsible for
    carving the baba of his settlement or local group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In practice, many men assisted in carving post capitals, and an especially
    expert non-chief might do most of the work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chiefs of outside itsubu and local groups working at Tautaa marea received
    food from Herahera men; later each ovia itsipana would give Herahera as much or
    more food than had been consumed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The baba of clans participating in aruaru ceremonies could apparently be represented
    on parts of the marea other than the main supporting posts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A board beneath the kaiva of Tautaa marea bears representations of a lizard,
    a chelonian, and a bird.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The lizard on the board is drawn centrally and at a larger scale than the
    bird and chelonian, and represents the dada of Herahera settlement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The text suggests, with stated uncertainty, that the bird and chelonian on
    the board represent dada of other itsubu or local groups participating in the
    aruaru ceremonial.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Airava, the hornbill, is modelled in effigy in the marea of Abotaiara and
    is also represented flat on the kaiva in Tautaa marea.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Airava is stated to be the dada of people in several Hauramiri and Arabure
    local groups.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Aieri, a chelonian perhaps identified as a freshwater turtle, is one of the
    dada of Hauramiri Koko and Hauramiri Oki Pokina.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Rabau, a large new marea built at Mou in July 1904, is described as probably
    an aruaru marea but was not then inaugurated.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Paitana settlement of Mou has six local groups, and representatives of all
    are responsible for upkeep of certain posts in the new marea built by Mou itsubu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Certain posts, perhaps all, at the Mou marea have carved on them the dada
    of the local group to which the person responsible for their upkeep belongs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:19
  text: The Mou marea has two central posts called kupua and eight lateral posts called
    meke in front of the closed-in chamber that forms most of the building.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:20
  text: A footnote reports that seclusion of initiates in aruaru marea had ceased
    at Waima, and separately reports that at Mou aruaru was described as a ceremony
    in which people of all itsubu meet and are shut up in a marea.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: The same footnote reports that aruaru could only occur when no death had occurred
