canonical_text:
  quote: ''
  summary: The passage begins with notes on the Aurana clan, its bird totem, and local
    forms of address among girls. It then gives an animal tale in which Waima the
    ant and Kukuku hunt pigs. Kukuku repeatedly acts fearfully and deceptively, while
    Waima kills a pig and later kills a hornbill that attacks the intestines he is
    washing. Kukuku warns that birds will avenge the hornbill, called their master.
    Waima hides with other ants in a tutuana tree, where birds attack their leaf houses.
    The ants kill many birds by stinging their eyes, but a crow closes its eyes, destroys
    the ant houses, and eats dead ants. The tale ends by explaining why birds avoid
    tutuana trees and why kukuku lives hidden in long grass.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of the Aurana clan are said to have a bird totem and to hold the highest
    position among the clans in that part of the coast because they outnumber the
    other clans in Goodenough Bay.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls are said sometimes to call an older girl by a term glossed as master,
    mistress, or lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: An ant rouses a large pig and warns Kukuku; Kukuku hides until the pig passes,
    then strikes his spear into a gaguma tree so that red sap flows onto it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kukuku tells Waima that he speared a pig but that it escaped after breaking
    the net and shaking out the spear; that night they have no meat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: On a later hunt the ant kills a pig, but a kestrel carries off the entrails
    when Kukuku should have washed them; the ant then decides to wash the intestines
    himself on the next occasion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Waima reaches the beach with the intestines, a hornbill attacks, and
    Waima stings the hornbill in both eyes, kills it, and carries it back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kukuku says that Waima has killed the birds' master and that all the birds
    will seek vengeance and make war on them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Waima hides in a tutuana tree and joins other ants who build homes there,
    while Kukuku remains exposed and is hunted into the long grass by birds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Birds trying to break into the ants' houses are killed when ants sting their
    eyes; a crow then keeps its eyes shut, tears apart the leaf houses up the tree,
    and leaves only a few ants hidden in the bark.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The tale explicitly explains that birds fear to live in tutuana trees because
    ants build there, and that kukuku no longer perches in trees but lives hidden
    in long grass.
  category: other
  evidence_refs:
  - ev:10
