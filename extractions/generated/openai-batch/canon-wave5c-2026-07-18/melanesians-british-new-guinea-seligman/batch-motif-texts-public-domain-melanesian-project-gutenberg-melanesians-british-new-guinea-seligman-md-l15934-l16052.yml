canonical_text:
  quote: ''
  summary: The passage inventories objects found in sorcerers' bags, including quartz,
    animal remains, bamboo cylinders, red paint, bone needles or pointers, netted
    bags, stones, and vegetable matter. It then describes court and reported cases
    in which leaves, chewed sugar cane, petticoat fibres, or faeces are used or intended
    for sorcery against a person. It also discusses paired charm stones or seeds described
    as male and female, including a cited Chalmers report associating such objects
    with death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Objects listed from a sorcerer's bag include crystalline quartz, a large lizard
    jaw held with bamboo and twine, a bird claw in a carved wooden case, and a bamboo
    cylinder with red paint and a bone pointer.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other listed bag contents include small bamboo cylinders, a netted bag with
    charms, a netted bag with seeds and wood fragments, a neck loop, and attached
    packets of medicine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large bamboo cylinder contained a powdery vegetable mass wrapped in red
    rag and a bone pointer; cloth and loose bone needles were also listed among the
    objects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bag of another sorcerer contained fragments of broken arrows and many
    cassowary claws.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that bone needles suggest possible pointing magic, but
    that information about this use was not obtained; the use of the vegetable matter
    was considered clearer.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a Kevori case, an accused man admitted that dried leaves were medicine
    used in sorcery and that he placed them with fragments of chewed sugar cane from
    a man against whom he had a grudge, expecting that man to suffer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fibres of a woman's petticoat were found in the same bamboo cylinder, and
    people in court agreed that they were intended to harm the woman from whose garment
    they came.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some small water-worn vein-quartz stones in sorcerers' bags are enclosed in
    nets; two such netted stones may be joined by string and called male and female,
    though their significance and use were not learned.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chalmers is cited as reporting charm stones called male and female or father
    and child, and as describing Veata's paired seed and crystal objects as male and
    female and associated with death.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: In an Inawi case, one old man collected another man's faeces and asked Mangemange
    to treat them so the other man would die; Mangemange refused and ordered the faeces
    thrown into the river.
  category: action
  evidence_refs:
  - ev:8
