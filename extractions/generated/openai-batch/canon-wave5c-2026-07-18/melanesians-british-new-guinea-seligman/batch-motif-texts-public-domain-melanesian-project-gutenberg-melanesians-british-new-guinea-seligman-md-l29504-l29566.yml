canonical_text:
  quote: ''
  summary: 'The passage describes divorce grounds and procedures: husband-initiated
    divorce for neglect of garden work, cooking failures, barrenness, illness, or
    infidelity; wife-initiated divorce for the husband''s laziness or infidelity;
    residence-based departure to a natal or marital hamlet; property and children
    taken at separation; and the absence of a special divorce ceremony. It also describes
    violence and public opinion around adultery.'
  language: English
  quote_policy: summarized
