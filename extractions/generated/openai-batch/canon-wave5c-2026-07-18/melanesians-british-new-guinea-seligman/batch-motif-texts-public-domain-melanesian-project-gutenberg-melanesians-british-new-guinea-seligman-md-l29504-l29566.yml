  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: A woman may divorce her husband for confirmed laziness when he will not do
    his share of garden work, or for acts of infidelity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: If a woman is living in her husband's hamlet and leaves him, she takes her
