  text: A man may divorce a woman for prolonged neglect of her garden or repeated
    carelessness or unpunctuality in cooking his food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman's neglect of garden work and her husband's food may be used as a way
