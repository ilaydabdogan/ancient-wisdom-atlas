  text: Before divorce, many husbands are described as trying one or more severe thrashings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man may get rid of his wife if she is barren or has a chronic disease severe
    enough to incapacitate her.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:5
  text: When a man separates from his wife, he generally returns to his own hamlet-group
    and takes his personal property with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the spouses had occupied a house in the woman's hamlet, the woman stays
