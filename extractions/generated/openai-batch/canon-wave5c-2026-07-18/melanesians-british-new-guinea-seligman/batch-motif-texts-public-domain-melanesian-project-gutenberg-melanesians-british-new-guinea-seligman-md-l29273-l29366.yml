  summary: The passage describes marriage restrictions and marriageability categories
    at Wagawaga and Tubetube, including prohibitions based on clan, father's clan,
    totem, consanguinity, and certain affinal relationships, with a worked Wagawaga
    example and Tubetube terminology for non-marriageable persons.
  language: English with local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that the man sleeps on the man's side of the house, the girl
    on the woman's side, and sexual connection takes place by day in the gardens rather
    than inside the house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note states that clan descent is in the female line in the Bartle Bay communities,
    while those communities are also influenced by a neighboring area of male descent;
    inheritance practices are described as affected by contact.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Wagawaga, former marriage restrictions are described as totemic restrictions.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Wagawaga, no man or woman could marry a member of his or her own clan-group
    or a member of his or her father's clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Ipunesa, a man of Modewa clan, is given as an example: he could not marry
    into Modewa, Hurana, or Garuboi, and therefore formerly would have had to marry
    outside his own hamlet-group.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Wagawaga, consanguinity imposed an additional limit; the passage says third
    cousins seemed unable to marry.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Wagawaga, a man could not marry his wife's sister, even as a widower, and
    could not marry his brother's widow; the Buhutu people are reported as marrying
    wives' sisters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the present Wagawaga situation described, clan-group restrictions have
    broken down, but same-clan marriage, marriage into the father's clan, and consanguinity
    rules are still observed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Tubetube, as at Wagawaga, no man marries within the clan or into his father's
    clan.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that no evidence was elicited for a former dual or multiple
    grouping of Tubetube clans, so no comparison with Wagawaga can be made in that
    respect.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Rev. J. T. Field is cited for three Tubetube classes of non-marriageable
    persons: Natunatuleia, Karidiatupuana, and Kariianasa.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Natunatuleia includes those related as Natu and Nubai; Karidiatupuana, literally
    described as being part of the womb, includes those related as Game, Du, Kava
    or Katia, and Tubu; Kariianasa includes those with the same totem and those connected
    by the term toto, meaning brotherhood.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: All persons outside the three non-marriageable Tubetube classes are called
    Kasoriegogoli, meaning marriageable.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The nearest permitted consanguineous Tubetube marriage is between the children
    of Nubaili in the third generation, but grandchildren of two sisters cannot intermarry;
    grandchildren of two brothers can marry grandchildren of two sisters if they do
    not share the same totem.
  category: relationship
  evidence_refs:
  - ev:10
