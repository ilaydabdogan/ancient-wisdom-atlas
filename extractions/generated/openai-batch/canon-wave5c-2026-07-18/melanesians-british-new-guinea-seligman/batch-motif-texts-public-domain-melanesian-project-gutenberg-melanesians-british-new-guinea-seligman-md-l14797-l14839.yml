canonical_text:
  quote: ''
  summary: The passage describes the status of boys after assuming the itaburi and
    approaching puberty, including their designation as ibitoe, residence in the marea,
    restrictions on movement and eating, obligations to the clan chief, self-provisioning,
    dancing, drum-making, seclusion, food and drink taboos, and stated consequences
    for breaking these restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy who has assumed the itaburi is still called miori until or near puberty,
    when at Roro he is called ibitoe ibitoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As puberty advances, the boy becomes an ibitoe and should stop sleeping in
    his father's house, resorting instead to the marea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ibitoe of the Roro and Paitana tribes are described as privileged because
    no very regular work is expected of them, but they are also subject to restrictions,
    disabilities, and theoretical physical hardship.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Except when dancing, an ibitoe should not use the open space between the houses
    that forms the main village street and should enter or leave by the clear space
    behind the houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ibitoe must not be seen eating by members of the opposite sex and usually
    do not eat with or in the presence of married men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ibitoe are expected to obey their clan chief during major fishing, hunting,
    or bush-clearing operations and to assist, when needed, in building their marea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In theory, ibitoe should provide for themselves by getting food from the bush
    and sea; in practice they catch fish and supplement this with petty raids on gardens
    and houses if not caught red-handed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dancing and preparation for dancing are important in the life of an ibitoe,
    and many make their own drums, which is considered proper though not compulsory.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When making drums, groups of three or four generally unite, live in the bush,
    and avoid being seen by women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Many foods are forbidden to drum-making ibitoe; they may drink only water
    from banana-leaf axils or coconut milk and should avoid contact with fresh water
    until the drum hollow has been charred and scraped into shape.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the fresh-water restriction is broken before the drum hollow is charred
    and scraped, the embers used for charring are said to refuse to glow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Their food must be cooked in a small pot called eiei, or they will become
    too stout to dance well; if any eat fish, a fishbone is said to puncture the tympanum
    of the taboo-breaker's drum.
  category: sequence
  evidence_refs:
  - ev:8
