canonical_text:
  quote: ''
  summary: 'The passage describes Biofa, Vee, Mekeo, mountain, Roro-speaking, Lapeka/Rapeka,
    Elema, and Yokea geographical and social relations, including warfare, markets,
    intermarriage, adoption of customs, and clan distribution. It then recounts Afai
    clan movements: a first migration is attributed to factional fighting over whether
    the laugh of a laughing jackass came from its mouth or rectum; after bloodshed,
    one faction stayed and another moved, later hearing the bird again and moving
    further after being saddened by the memory.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Biofa villages are listed as Inawae, Inawi, Aipiana, Veifa, Oriropetana, Amoamo,
    and Afai, with most forming a compact group on the Angabanga between northern
    and southern Vee villages.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Vee are said to have been frequently worsted by the Biofa during earlier
    chronic warfare, possibly because of the Vee's more scattered position.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The external relations of the Mekeo tribes are described as limited by geography,
    while people from Inaukina and other middle Biaru villages had settled among and
    intermarried with Mekeo tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mountain populations behind Mekeo brought feather ornaments, stone adzes,
    and clubs to Mekeo villages for barter, especially through Inauvarene and Lopiko.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mekeo fought Roro-speaking tribes but also intermarried with Waima, Roro,
    Bereina, Rapa, and probably Mou; markets with Waima exchanged Mekeo garden produce
    for fish and shellfish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some Mekeo villages, especially Inawi, adopted Elema/Papuan Gulf customs such
    as kaivakuku and Gulf decoration for ufu displayed on ceremonial occasions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Biofa are described as friendly with Yokea, while Yokea warriors formerly
    attacked the Vee, sometimes with Biofa support.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In an attack on Rarai, inhabitants climbed into coconut-tree crowns, where
    Biofa archery could not reach them, but Gulf natives shot them from the tree tops
    with arrows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mekeo villages are typically composed of representatives of several clans,
    and portions of the same clan can occur in distant villages, including Vee clans
    in mainly Biofa villages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Afai history is used to illustrate repeated clan coalescence, separation,
    partial fusion, and wandering apart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The first migration from Afai is traced to faction fights allegedly arising
    from disagreement over how the laugh of a laughing jackass originated.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Old men in the ufu had just lit a fire on the verandah when they saw the bird
    ongoye, the laughing jackass, perched on a nearby tree, laughing and jerking its
    posterior body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Some people said the bird's sound came from its mouth, while others said it
    came from its rectum; two factions formed, and bloodshed took place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The stronger Afai faction, composed of local groups of named clans, stayed
    at the village site; the weaker party moved near Kevori and began building a new
    village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: When the new village was partly built, the weaker party again heard the jackass
    laughing on a neighboring tree; the sound reminded them of the time before the
    split, saddened them, and they moved again.
  category: sequence
  evidence_refs:
  - ev:8
