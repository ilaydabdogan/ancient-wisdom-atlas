canonical_text:
  quote: ''
  summary: The passage introduces the annual Motu trading expedition to the Papuan
    Gulf. Large sailing canoes leave Port Moresby and neighboring Motu villages near
    the end of the south-east trade-wind season, carrying earthenware pots and other
    valued articles for barter. They return during the north-west monsoon after about
    three months, laden with sago obtained in exchange. The passage says the origin
    of the expedition is obscure, that the custom appears old, and that a common trading
    dialect shared by the Motu and Gulf tribes supports its antiquity. A note adds
    that many Koita participate in the custom.
  language: English
