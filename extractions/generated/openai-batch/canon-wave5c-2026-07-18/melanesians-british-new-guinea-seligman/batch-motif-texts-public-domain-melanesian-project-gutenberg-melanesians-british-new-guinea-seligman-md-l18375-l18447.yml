  text: Each village contains a number of ngove, which are usually house-sized structures,
    sometimes built on high piles and often outwardly like ordinary dwelling-houses.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ngove is described as a clubhouse for men, and use-right belongs only to
