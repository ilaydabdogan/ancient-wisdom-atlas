canonical_text:
  quote: ''
  summary: The passage describes ngove, men’s clubhouses used by members of a single
    ikupu or family group. It explains hereditary rights to build and maintain them,
    their occasional construction on high piles to frustrate sorcery, restrictions
    excluding women, sleeping use by puberty-age lads, widowers, and guests, and the
    usual absence of hereditary post decoration found in some other buildings.
  language: English
  quote_policy: summarized
