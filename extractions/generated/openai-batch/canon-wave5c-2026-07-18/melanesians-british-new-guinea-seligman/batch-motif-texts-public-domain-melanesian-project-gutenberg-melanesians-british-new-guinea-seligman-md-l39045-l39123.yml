canonical_text:
  quote: ''
  summary: Ethnographic description of marriage practices involving the bride’s transfer
    to the bridegroom’s hamlet, reciprocal food, ornaments, and valuable presents,
    garden-making and cultivation obligations, Murua and Tokunu marriage exchanges,
    and examples of Tokunu marriages involving named totem affiliations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is usually brought to the bridegroom’s hamlet by her mother, who
    brings food and ornaments as a return present from the bride’s family.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young couple generally live for some time in the house of the bridegroom’s
    father.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Food presented by the bride’s mother is eaten by the bridegroom’s parents
    and relatives, not by the bride and bridegroom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After marriage, a garden is made on the husband’s land, with help from people
    of his hamlet if clearing scrub is needed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the spouses’ hamlets are close, a garden is also made on land belonging
    to the bride’s hamlet; the couple are said to do half the work and receive half
    the produce, with the other half taken by their respective parents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Iwa, failure by a bridegroom living on the island to work on his wife’s
    garden land could lead the parents-in-law to urge their daughter to leave him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man may sometimes live in his wife’s hamlet temporarily, but this is described
    as unnecessary.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Murua, marriage usually follows prolonged cohabitation and includes an
    exchange of valuable presents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Examples of Murua marriage gifts include armshells, a bagi, ceremonial axe
    blades, steel axes, large knives, tobacco, and calico; return presents could be
    expected to be of adequate value.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Murua, once the marriage price was settled, no further payments were said
    to be made on the birth of children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On Tokunu, marriage was said to be brought about in the same way as on Murua;
    in one recorded wedding, the bridegroom’s father gave armshells and a canoe, and
    the bride’s parents returned armshells, two items represented in the text by an
    unclear word, and a canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Gaimagawa stated that the bride’s relatives gave an excess because the bridegroom
    was unusually wise in garden-making, though the author doubts the accuracy of
    this explanation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Murua and Tokunu, a bride would live in her husband’s village, a garden
    would be made on the husband’s garden-land, and the wife’s garden-land would usually
    also be cultivated by her husband if accessible.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Tokunu community was described as small, intermarrying freely with Murua,
    and not apparently avoiding marriage within the community; examples are given
    using blue pigeon, fish-hawk, and frigate-bird totems.
  category: relationship
  evidence_refs:
  - ev:8
