  summary: The passage describes premarital sexual freedom within totem and blood-relationship
    restrictions, courtship through sexual connection, observations about illegitimate
    births and conception, and Wagawaga night visits to unmarried girls' houses called
    potuma, where girls select visiting bachelors through a male intermediary.
