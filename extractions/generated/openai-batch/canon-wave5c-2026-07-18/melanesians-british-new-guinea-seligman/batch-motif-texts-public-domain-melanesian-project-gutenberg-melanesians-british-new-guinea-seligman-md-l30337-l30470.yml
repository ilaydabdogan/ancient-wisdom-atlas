    Group and traded northward to the Trobriands and southward/eastward to Milne Bay
    and nearby islands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ceremonial axe blades are described as Murua's chief export, although their
    manufacture had ceased some years before the account.
  category: object
  evidence_refs:
  - ev:3
