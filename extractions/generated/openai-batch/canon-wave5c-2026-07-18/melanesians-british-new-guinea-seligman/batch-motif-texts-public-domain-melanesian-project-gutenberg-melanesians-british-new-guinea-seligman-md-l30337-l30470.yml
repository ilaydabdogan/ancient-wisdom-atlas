canonical_text:
  quote: ''
  summary: The passage describes trade routes and exchange values for Murua stone
    blades, especially ceremonial benam blades, and for Amphlett pottery. It gives
    itineraries and prices for named ceremonial blades, notes reluctance to display
    valued possessions, records a case of name avoidance connected with a dead wife,
    and contrasts ceremonial blade value with ordinary tool-blade production.
  language: English
  quote_policy: summarized
