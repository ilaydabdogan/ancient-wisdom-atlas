canonical_text:
  quote: ''
  summary: 'The passage describes the origins, recognition, and handling of charms
    among Koita and nearby coastal contexts: many charm stones are locally found,
    some objects are linked to the Papuan Gulf or Vailala, charms may be selected
    for resemblance, rarity, or unusual form, and some are revealed by dreams sent
    by spirits of dead Koita. Examples include yam and banana stones, animal parts,
    conchellin masses, fossil coral, quartz crystals, glass stoppers used with rainwater
    for garden fertility, stones with holes, and highly charged quartz charms handled
    with a bone fork rather than by hand.'
  language: English
  quote_policy: summarized
