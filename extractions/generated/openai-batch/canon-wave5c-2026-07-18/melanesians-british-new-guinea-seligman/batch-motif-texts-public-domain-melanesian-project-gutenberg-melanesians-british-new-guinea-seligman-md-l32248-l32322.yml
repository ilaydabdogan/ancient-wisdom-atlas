canonical_text:
  quote: ''
  summary: The passage describes reported responses to theft from gardens, houses,
    personal property, and pigs, including killing a stranger thief in former practice,
    shame or thrashing for a fellow-clansman, women’s petty garden thefts leading
    to small fights, reciprocal theft after suspected house theft, concealment of
    valuables because of theft and permitted taking by certain affinal relatives,
    and compensation or retaliation after pig killing. An inserted note also describes
    male and female methods of suicide and gives two reported suicide cases involving
    a girl, a youth, and a small boy.
  language: English
  quote_policy: summarized
literal_observations:
