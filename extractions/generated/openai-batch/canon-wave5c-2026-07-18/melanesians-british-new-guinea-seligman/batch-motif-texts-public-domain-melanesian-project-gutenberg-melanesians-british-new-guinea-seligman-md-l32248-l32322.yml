  text: A fellow-clansman who stole from gardens would not be killed or formally punished,
    but would be reproached, might feel ashamed, and might occasionally be thrashed
    on the spot.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women are described as sometimes committing petty thefts from one another’s
