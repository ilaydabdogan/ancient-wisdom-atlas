  text: The passage says theft was formerly uncommon, and that stealing from gardens
    is now said to be more common than in earlier times.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Formerly, a stranger caught stealing in a garden might be waited for and killed
    there.
  category: action
  evidence_refs:
  - ev:1
