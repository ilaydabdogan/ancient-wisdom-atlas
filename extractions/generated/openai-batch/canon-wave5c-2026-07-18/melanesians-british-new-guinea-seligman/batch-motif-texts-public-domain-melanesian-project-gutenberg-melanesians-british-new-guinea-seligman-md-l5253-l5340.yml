canonical_text:
  quote: ''
  summary: The passage reports four recorded cases of polygyny among seventy-six marriages,
    then describes Koita-associated beliefs and practices concerning conception, pregnancy,
    childbirth, prolonged labor, cutting the umbilical cord, disposal of the afterbirth,
    newborn washing and massage, breastfeeding, and retained placenta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among seventy-six recorded marriages, four instances of polygyny are reported,
    with the author suggesting the custom may once have been more frequent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pregnancy is said to be diagnosed by darkening of the nipple and areola, while
    cessation of menstruation is treated as a later and less reliable sign.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that a single sexual act is considered insufficient for
    pregnancy and that continued cohabitation for about a month is thought necessary.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief that menstrual blood in some way comes from the
    breasts and that the fetus is formed from blood derived from the breasts.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: A pregnant woman is forbidden to cohabit and is restricted from eating bandicoot,
    echidna, certain fish, and iguana; she should also avoid walking at night to prevent
    prolonged labor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During confinement the woman squats on a coconut husk, grasps a rope from
    the rafters, leans against a woman behind her, and is supported by two women holding
    her legs while her mother faces her to receive the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If labor is prolonged, the father is summoned to open boxes and remove hair
    and arm bindings; if this fails, the woman's brother performs similar removals;
    if that fails, a medicine woman chews aromatic bark, spits it over the abdomen,
    and embraces the woman tightly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After birth, the maternal grandmother cuts the umbilical cord with a bamboo
    sliver at a measured distance from the navel, and the cord is not tied, twisted,
    dressed, or otherwise treated.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The afterbirth, called momo, is placed in a wide-mouthed clay pot until the
    next morning, when the young mother wades into the sea, breaks the pot, and leaves
    the pot fragments and placenta to sink; if she cannot do this, her mother acts
    for her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The child is washed daily in warm water by a maternal or paternal grandmother
    while the mother remains confined to the house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the first washings, the child undergoes towa, involving gentle massage,
    limb manipulation, and head-stroking, with the hand warmed at a fire before kneading.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The child is put to the breast soon after birth; retained placenta is described
    as infrequent, untreated, and invariably fatal.
  category: sequence
  evidence_refs:
  - ev:10
