canonical_text:
  quote: ''
  summary: The passage describes social and geographical relations among Mekeo and
    Roro-related settlements, especially Afai, Inawi, Inawae, and associated pangua.
    It recounts a jackass story linked to migration, repeated fission and movement
    of Afai local groups, eviction and seizure of settlement land, a blood-price settlement
    in which land replaces revenge, and the composition of Inawi's pangua.
  language: English with indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Inawae is described as formerly consisting of a single pangua, with later
    Ikoiko families and a few Roro residents retaining some separate group identity.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A narrative states that a jackass laughed, after which the group moved to
    Nara and later migrated eastwards to Kapatzi, where they settled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Mekeo folk identify these people with the people marked Kabadi
    on maps, and that Afai people refer to them as older and younger brothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five local groups remaining at the old Afai site dispersed, with parts moving
    to Inawi and other named clans or families later moving among Ififu, Afai, Inaukina,
    Aipiana, and other places.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that repeated Afai splittings and migrations were chiefly
    caused by faction fights within the village, and perhaps by a broader migrant
    tendency among Mekeo and Roro-speaking tribes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage gives an example in which powerful neighbours drove an Afai local
    group away from a settlement near Inawi, seized the site, and continued to enjoy
    coconuts planted by the evicted men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says land was sometimes ceded as payment for a blood-price, though
    probably not commonly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the reported instance, Waiaka clan men killed a man of Inawefae clan and
    avoided giving the Inawefae an opportunity to take revenge for a long time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Because an ufuapie relationship existed between Inawefae and Waiaka, members
    met under the restraint of rites by which a village is purged of grief when mourning
    ceases; after discussion, Inawefae agreed to forego revenge and accepted a strip
    of land as blood-price.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Inawi was selected for study because it was one of the oldest settlements
    and was considered less confused by wholesale adoption of immigrant stocks than
    many other villages; Father Egidi had taken a complete genealogy of the village.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Inawi is described as consisting of seven pangua, the last three immigrant,
    with an additional settlement of people of an Afai-associated pangua who still
    possess land at Afai.
  category: relationship
  evidence_refs:
  - ev:10
