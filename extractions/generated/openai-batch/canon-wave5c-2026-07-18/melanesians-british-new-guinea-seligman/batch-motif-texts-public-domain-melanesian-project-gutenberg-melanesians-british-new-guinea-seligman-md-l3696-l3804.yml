  quote: ''
  summary: The passage describes iduhu dagi, or clan badges, as conventional signs
    associated with certain iduhu, their materials and architectural placement, their
    weakened contemporary significance among the eastern Koita, and rules and examples
    of iduhu rohi, or clan chief, succession among Dubara, Keakone, and Taurama groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain iduhu were said to have the right to use particular conventional designs
    called dagina.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The badges could be carved on wood or made from dried grass and dried leaf
    streamers, sometimes hanging from a shell.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage glosses dagi as a sign or witness and treats iduhu dagi as equivalent
    to a clan badge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the eastern Koita, iduhu dagi are described as far advanced in decay,
    apart from toana flown on lakatoi during hiri trading voyages.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dagina were identified on the ends of verandah roof rafters in Hohodai and
    were said to belong to the Dubara, Taurama, and Keakone clans.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Hohodai and Pari, verandah rafter designs were often called toana and often
    linked with an iduhu name, but houses were usually not ornamented mainly with
    the owner's iduhu design.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Taubada''s house was an exception: all of his verandah rafter ends carried
    one Dubara toana, and the carving was done by Hara, a Taurama man.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Carvings at the tops of large dubu corner posts were also called toana, and
    the passage states that only one functional dubu then existed among the eastern
    Koita, excluding Baruni.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Koita had no dominant or paramount chief over the whole group; each iduhu
    had its own iduhu rohi or clan chief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The iduhu rohi office was generally hereditary in the direct line, but a sister's
    son could succeed if the chief was childless or if the eldest son was too young;
    succession could be discussed by old men of the division.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: For Dubara, Ahuia is described as the active present iduhu rohi, while his
    maternal uncle Taubada still takes part in affairs; the chieftainship is expected
    to revert to Taubada's eldest son Ova Tau after Ahuia's death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: For Keakone, Hedu Gamika is the present iduhu rohi; his maternal uncle Goro
    Arua had inherited the office from Arua Boio, and Homoka Goro is expected to become
    iduhu rohi after Hedu Gamika's death or incapacity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: For Taurama, Taurama Vamaga was absorbed into Taurama Vaga, and Maraga Kora,
