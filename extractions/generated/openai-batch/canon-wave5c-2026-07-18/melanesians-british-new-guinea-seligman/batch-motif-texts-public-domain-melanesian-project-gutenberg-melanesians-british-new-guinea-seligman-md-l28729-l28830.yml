canonical_text:
  quote: ''
  summary: 'The passage describes menstrual food and washing restrictions, then details
    boys'' initiation practices in the Bartle Bay/Wamira context: attributed origin,
    timing by plant flowering, salt-water and coconut-milk actions, clothing changes,
    food exchange, food taboos, and sexual abstinence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A menstruating woman does not eat from the family pot or dish; she cooks at
    the common fire in a special small pot that is retained for her future use.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the end of her period, the woman washes in sea or fresh water and is then
    considered clean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Wamira, initiation is said to have been instituted by an otherwise undescribed
    superhuman being, and neglecting initiation is said to prevent boys from growing
    up properly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Initiations formerly occurred about every three or four years, but mission
    and school requirements are said to have made them less frequent and later in
    age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: From about age seven until initiation, boys sleep in the ordinary male potuma;
    the passage also reports an older system of potuma differentiated largely by age
    or tribal status.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Initiation takes place after the flowering of the edible rush called orabu,
    with fathers deciding in evening discussion and telling sons when the rush has
    flowered.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each boy scrapes an unripe mango into a coconut shell, mixes the scrapings
    with salt water at the beach, drinks the mixture, drinks more salt water, and
    dives and swims underwater with his mouth open.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before diving, the boy removes his perineal bandage and waistband, wears a
    leaf girdle used for bathing, and keeps his armlets on.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boys drink milk of green coconuts, which is said to prevent vomiting and
    contribute to purging; afterward they put on coarse coconut-spathe and pandanus-leaf
    dress, comb their hair, oil themselves, and return home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mothers cook foods for the returning boys, but no boy eats food prepared by
    his own mother; each places his portion in a pot outside another initiate's house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Meat, fish, fish-spawn, and taro leaf are forbidden foods, and sexual indulgence
    is forbidden to the initiates; non-observance of sexual abstinence is associated
    with poor hair growth.
  category: other
  evidence_refs:
  - ev:8
