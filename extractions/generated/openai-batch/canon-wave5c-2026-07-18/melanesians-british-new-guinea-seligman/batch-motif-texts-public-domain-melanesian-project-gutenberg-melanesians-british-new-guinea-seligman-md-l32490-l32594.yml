canonical_text:
  quote: ''
  summary: The passage catalogues several taboo signs used around Wagawaga, Tubetube,
    Rogea, and nearby areas. Signs made from coconut or sago leaves, plaited coconut
    leaflets, shell strings, Y-shaped branches, shells, pig skulls, and sugar-cane
    stalks mark protected trees, gardens, reef fish, fruit rights, mourning-feast
    food reserves, pigs, and tracks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Community members are said to know roughly who owns each garden and areca
    or coconut tree, so even one sign can serve multiple fenced enclosures or a grove
    without much risk of accidental mistake.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many taboo signs are described as widely spread through the district, with
    particular place names supplied where the informant had definite information.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sign named hato at Wagawaga is made by fastening a short coconut leaf,
    or sometimes a sago leaf, around a coconut or areca palm trunk; a variant uses
    two leaves on opposite sides of the trunk with leaflets knotted together.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sign sometimes called gwara or gwala at Wagawaga and Tubetube is made
    from a coconut leaf or joined leaves stretched between trees or stakes, with hanging
    leaflets; at Wagawaga it can also be supported higher on a Y-shaped branch or
    young tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the gwara sign is erected on a reef at Wagawaga or Tubetube, it protects
    the fish on that reef.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another taboo sign is a roughly plaited round basket form made from coconut
    leaflets and placed upside down on low stakes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first listed sign is especially used on areca and coconut trees, while
    the second and third can also be used for other plants; at old Tubetube these
    three signs were said to denote the presence of medicine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A simple sign of one or two coconut leaflets tied to a lower branch of a bearing
    fruit tree marks the finder’s right, which later arrivals are expected to respect.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Tubetube, after a man dies, a string of dunali shells may be tied around
    one of his coconut trees and may also be used on certain gardens to reserve their
    produce until the mourning feast called rigariga.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage notes that gardens are usually tabooed for the mourning feast
    only if enough cultivated land remains to support the deceased man's family.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Wagawaga a pig taboo sign consists of a Y-shaped young tree or branch planted
    upright, with Triton or Cassis shells tied at the fork, a coconut or sago leaf
    stretched across it, and one or more pig skulls tied to the leaf midrib.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man’s pigs under taboo protection are not expected to be killed by a neighbor
    if they enter the neighbor’s garden; instead the neighbor is expected to complain
    to the owner and claim compensation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note reports that a taboo sign with the same name as gwara extends from
    Rogea past Milne Bay and up the coast to Cape Vogel.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note describes tying two sugar-cane stalks across a track to prevent use
    of the track when adjacent sugar-cane is ripe; this can be done with a spell or
    merely as a physical barrier.
  category: action
  evidence_refs:
  - ev:11
