canonical_text:
  quote: ''
  summary: 'The passage recounts warfare episodes involving Koitabuans, Dourans, Kabadis,
    and Manumanuans: an initial raid with killing, looting, burning, pursuit, blocked
    canoe escape, counterattack, hidden fugitives, contested deaths, child participation
    in killing, and a later deceptive peace message that leads Dourans into an ambush.
    It also describes an old Koitabuan urging vengeance through his son-in-law taking
    up his spear.'
  language: English
  quote_policy: summarized
