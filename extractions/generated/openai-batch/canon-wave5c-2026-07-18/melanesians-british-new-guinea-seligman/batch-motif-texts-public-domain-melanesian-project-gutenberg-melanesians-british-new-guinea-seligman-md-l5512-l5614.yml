canonical_text:
  quote: ''
  summary: The passage describes Koita rules and examples concerning inheritance of
    house sites, houses, land-use rights, coconut trees, floor boards, and personal
    property after a man's death. It gives general rules for widows, children, siblings,
    male-line successors, and named kin categories, then illustrates them with the
    cases of Maiago and Ovaketa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's house is treated as real property because the ground on which it stands
    descends in the male line; if no wife, siblings, or children survive, the house
    is left to rot before another house is later built on the site.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widow may remain in her dead husband's house or return to her own family;
    if she is childless and returns, the use of her husband's land reverts to his
    nana and roro, and the same reversion occurs at her death or remarriage if she
    stays.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a widow with children leaves the husband's house, the floor boards are
    divided among the dead man's nana, roro, raimu, children, and the widow; the boards
    are preserved because of the labor formerly required to make them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dead man's coconut trees are divided among brothers, sisters, and children,
    with boys said to receive more than girls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dead man's land is divided among his children, but daughters are described
    as having only a life interest, though their own children are commonly allowed
    to garden there while acknowledging the land belongs to the mother's kinsmen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a man dies childless, his land and coconuts go to his brothers, sisters,
    and raimu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man's house site descends to his sons, or if there are no sons, to his nearest
    male kinsman; strictly speaking, the hereditary house site is the only place he
    may build a house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Maiago's case, no one moved into his house; because he had no son, the
    house was to be left to rot, and his half-brother Mabata Maiago was expected later
    to build on the site.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Maiago's coconut trees were to be divided between his sisters and children,
    his cultivation rights were to go to his daughters, his dog to Mabata Maiago,
    a fine armshell to Bogi Goada, and his dugong net to Koikoi Goada.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bogi Goada is identified as Maiago's nana and as the person who shaved Maiago's
    dead body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Ovaketa's case, his son Rabura Kogi took possession of the house, and one
    wife, Keranoboka, continued living there with him; another wife, Diara Ova, had
    run away before Ovaketa's death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rabura Kogi distributed customary armshells and adornment items among his
    father's nana and roro and was described as practically residuary legatee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ahuia Ova received nothing because his mother Diara Ova had run away and he
    had been adopted by her brother Taubada; the passage says he would otherwise have
    lived in Ovaketa's house and later shared inherited valuables.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: If Ovaketa's brothers Harigeta and Getahari had not predeceased him, Rabura
    Kogi would have given each a customary share, such as tola, doa, a pig, or a dog.
  category: relationship
  evidence_refs:
  - ev:8
