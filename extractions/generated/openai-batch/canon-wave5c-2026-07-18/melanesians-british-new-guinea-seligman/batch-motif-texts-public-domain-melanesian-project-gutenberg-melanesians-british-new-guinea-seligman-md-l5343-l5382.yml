  quote: ''
  summary: The passage describes postpartum seclusion after childbirth, daily washing
    by the young mother's mother, disposal of the afterbirth in the sea, use of banana
    leaves for lochia, domestic assistance by the husband's sister, infant feeding
    practices, food and betel restrictions for both parents, and a rule delaying resumed
    cohabitation until the child can toddle.
