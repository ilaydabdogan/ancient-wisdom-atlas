  summary: An old woman magically closes a cave entrance while everyone is inside.
    A mother discovers that the cave is sealed except for a small hole in the roof.
    The trapped people fear, lack food, and die. An old man identifies their former
    greediness as the cause of the old woman’s revenge; he is the last alive, asks
    boys outside for food, is refused, and dies.
