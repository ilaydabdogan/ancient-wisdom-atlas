canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking beliefs about sorcery directed toward
    disease and death. It identifies snakes, especially the black snake called aiurama,
    magical stones, and plant materials as sorcerers' media. It recounts an account
    of obtaining a deadly snake stone through fasting, isolation, dreaming of a black
    snake, and extracting a stone without touching it. It also describes methods for
    directing snakes against victims by using body scent, and lists objects found
    in a sorcerer's netted bag.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The section limits the term sorcery to magical practices intended to produce
    disease and death and efforts to cure disease so produced among Roro-speaking
    tribes.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies snakes and certain magical stones as the two media
    most frequently believed to be used by sorcerers, with leaves and roots also included
    in a sorcerer's kit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The black snake called aiurama is said to be commonly employed by sorcerers
    to kill people who have offended them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some crocodile attacks are also reported as being attributed to sorcerers,
    including one case in which a crocodile was said to have obeyed a sorcerer's instructions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fatal snakebite is described as often being attributed to sorcerers, although
    the passage notes that snakebites not caused by sorcery were also admitted.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A black snake is said to provide a deadly stone that kills any individual
    touched by it, and the sorcerer avoids direct contact with the stone.
  category: object
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:7
  text: An account attributed to Ahuia says that a sorcerer seeking a snake stone
    fasts for two weeks, stays alone in the bush, eats only a few roasted bananas,
    and avoids seeing women.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sorcerer eventually dreams of a black snake living in a hole in a hollow
    tree or in the banks of a creek.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sorcerer wraps native-cloth bandages around his hands, arms, and legs
    and carries a spear-like instrument with many closely set points.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The snake is harassed until it moves away and exposes a small stone, which
    is lifted with the spear points, dropped into bamboo, and carried away without
    being touched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The snake stone is described as red, hot, and about the size of a filbert;
    touching a person with it is said to be enough to kill.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Dropping the snake stone into salt water is said to render it harmless while
    the water hisses and bubbles until no more bubbles arise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sorcerers are alleged to keep snakes in cooking pots in the bush or in a dark
    corner of the house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: To direct a snake to bite someone, a sorcerer places a fragment of cloth or
    another object retaining the target's body scent in a pot with the snake, warms
    the pot, and later releases the snake near the victim.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A variant method has the sorcerer touch the victim with a magic stone smeared
    with a strong-smelling substance, then release a snake conditioned to that odor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Magical stones are described mostly as greyish water-worn pebbles, including
    water-worn fragments of vein quartz crystals.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: A sorcerer's mahawa netted bag is said to contain magical stones and miscellaneous
    objects, including a necklace of alligator teeth and medicine packets, a stone
    in a bamboo holder, mourning gear, a bamboo cylinder with bone needles, a carved
    comb, a coconut vessel, and an unfinished stone adze.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
