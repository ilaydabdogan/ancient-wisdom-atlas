canonical_text:
  quote: ''
  summary: Ethnographic note on Pokao/Nara describing geography, village history,
    clan organization, neighboring relations, trade, leadership and feast roles, and
    the architecture and carved decoration of former clubhouses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pokao or Nara is described as a small district east of Roro and Mekeo, with
    an uninhabited mangrove-fringed coast and villages in open uplands behind the
    coastal zone.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pokao and Roro formerly exchanged smoked wallaby flesh for coconuts and other
    garden produce.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The social organization of the Pokao villages is said to resemble that of
    the Koita; characteristic Nara houses are oval in section and open onto verandahs,
    sometimes shared by several houses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A local history states that all Nara people once lived at Vanuaboada, but
    because the area could not support them, Ova Vala suggested splitting into smaller
    villages.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some idubu moved from place to place and were weakened by fighting with Epa,
    Mekeo, and Kabadi until Nemi Oroi gathered many of them and persuaded them to
    unite under him.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The three most important idubu named in the account are Siagauna, Babu, and
    Oroi, and the passage says only one Siagauna man and two Babu men were then alive.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nemi Oroi of the Oroi idubu was head of the village and head man in the big
    clubhouse called Ivamuru; Ume Kame of Babu idubu was second in command.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kaloka, a woman, is described as the current head of the village, but on ceremonial
    occasions her place is taken by her son Naime.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At a feast, Naime and the younger Ume Kama kill the first two pigs and make
    the first cut in them; afterward all take part in the killing, while Oa Idoa and
    Taba Oa distribute the meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nara villages are described as having old friendship with the Koita and
    Waima and trade with Delena, whose people bring pots and receive yams, bananas,
    and tobacco.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the time of the account, Nara clubhouses had been replaced by light roofed
    open platforms, whose common ornamentation was diamond-shaped weaving under the
    eaves.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: An old Diumana clubhouse or loe had surviving carved posts; the posts were
    carved by Poa Oa of Waima or under his direction, and the building resembled the
    Roro marea while lacking its front platform and closed back compartment.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The terminals of the Diumana loe's massive side posts were carved as human
    heads, and each post bore a conventional crocodile carving.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Diumana loe is described as elevated above the ground, with a high ridge
    pole, an overhanging front roof projection, and carved and painted boards attached
    beneath it; some posts remained standing and others were fallen and fire-damaged.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: The clan system of Nara is said probably to be essentially the same as that
    of the Koita and Motu; Oroi village has four idubu and descent generally follows
    the male line.
  category: relationship
  evidence_refs:
  - ev:11
