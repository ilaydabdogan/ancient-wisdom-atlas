  quote: ''
  summary: The passage describes Trobriand chiefly authority, especially Taolu's position,
    as shaped by the end of fighting under government rule, marriage alliances, lineage
    rank, wealth, and fear of bwagau, described as sorcery or poisoning. It also describes
    restricted chiefly rights to decorated houses and yam houses, clan-specific buna
    shell arrangements, pig-keeping privileges of uncertain scope, and restricted
    ornaments worn by the Tabalu family.
