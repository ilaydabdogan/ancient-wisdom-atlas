canonical_text:
  quote: ''
  summary: 'The passage describes Mekeo clan badges called kangakanga: exclusive clan
    rights to wear them, sale or exchange of those rights, elaborate headdresses and
    dance ornaments that use or imitate animals, plants, and mountain outlines, and
    the non-use of kangakanga in war.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each clan is described as having a recognized exclusive right to use its kangakanga
    as a badge, although rights can sometimes be sold or exchanged.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: At Veifa, people without the swordfish-sword kangakanga were expected to give
    swords of caught swordfish to men of Ongofoina pangua.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note reports that a threat of stealing a pangua's kangakanga can still strongly
    excite a pangua.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1904 Inaukina pangua of Rarai village sold Ongofoina pangua the right to
    wear the feather kangakanga called fole, and Ongofoina was said to have the right
    to sell it again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oala Aivea and Alo Aivea pangua exchanged an extended right to wear the fretted
    turtle-shell ornament kefe for the right to wear the feather headdress mengunge,
    said to represent Boboleva.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Many kangakanga are elaborate headdresses containing parts of a particular
    animal or plant, while others imitate characteristic features of an animal or
    plant.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Where a kangakanga represents a mountain or peak, feathers are arranged in
    a design intended to reproduce the mountain's characteristic outline.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Plant-related examples include a kapoc-tree imitation, a double-headed palm
    outline, and pingu palm leaves worn on dancers' wrists and knees.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Animal-related examples include a swordfish sword worn in the front hair,
    a goura-pigeon crest represented by radiating feathered bars, and an aulda headdress
    made with hornbill, parrot, and cock feathers.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
- id: obs:10
  text: Kangakanga were not worn in war; men of all pangua wore cassowary plumes,
    painted themselves black, and did not try to avoid attacking men of their own
    iauafangai or kangakanga.
  category: action
  evidence_refs:
  - ev:14
- id: obs:11
  text: The passage states that dancers' face painting generally did not refer to
