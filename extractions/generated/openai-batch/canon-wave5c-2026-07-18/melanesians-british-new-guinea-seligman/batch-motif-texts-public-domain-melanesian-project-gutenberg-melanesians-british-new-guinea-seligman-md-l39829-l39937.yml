canonical_text:
  quote: ''
  summary: 'Ethnographic account comparing Kwaiawata cliff bone deposits and domestic
    keeping of relatives'' skulls, followed by Murua funeral and mourning practices:
    exposure or burial of the dead, mourning songs and charcoal blackening, grave
    fires, exhumation, smoking and basket custody of bones or skulls by widows and
    children, final placement in a cliff cleft, and a note on Agiatau''s grave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kwaiawata cliff bone collections are described as lacking special arrangement
    of bones and not being hamlet or clan burial places.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skulls kept in houses were oiled and carefully tended; the passage also mentions
    a pretence of eating lime with spatulae made from bones of certain deceased relatives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Natives would not approach the cliff burial sites closely and were surprised
    when visitors did so.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The only explanation elicited for avoidance of the cliff bones was that they
    were old bones and highly dangerous.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Father Thomassin's Murua note, sobs, cries, howls, and a lugubrious song
    announce a death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: For a low-estate deceased person in Murua, the body is exposed in the hut
    for about two days, friends weep in turns, women bury the dead in a trench near
    the village, and a funeral feast follows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: For a person of quality or chief, everyone must weep over the corpse or risk
    being regarded as a sorcerer, and the tribe mourns by blackening the whole body
    with charcoal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In some villages a fire is lit on the grave, tended by the deceased's parents
    for a fortnight while they remain secluded, receive food silently, and sing funeral
    songs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: On a fixed day the grave fire is quenched; women exhume the bones and hand
    them to the nearest relation, and a widow may place her husband's relics in a
    decorated basket that she carries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In Captain Barton's Murua outline, women of clans other than that of the deceased
    place the body in the grave.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before burial, the widow remains inside the dead man's house holding the dead
    man's head upright while the body is supported sitting; she does not sleep and
    should wail continually.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The dead man's body is buried beneath his house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: Two months after burial, the women exhume and collect the bones, take them
    to the seashore or bush, smoke them over a fire for one day, make a basket, put
    the bones in it, and hand it to the widow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The widow keeps the basket by her side; after a later feast by men of the
    dead man's totem she may go to the gardens, but gives the basket containing the
    skull to a child, preferably a girl, to guard until she returns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After ten months, the basket is put in a cleft of a cliff; before the bones
    are placed there, the widow paints a horizontal black mark across the skull's
    forehead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Captain Barton states that in Murua it is not customary to make spatulae from
    bones or use the skull as a lime-pot.
  category: other
  evidence_refs:
  - ev:7
- id: obs:17
  text: Agiatau, a frigate-bird totem head man of Wapuru upon Tokunu, had a grave
    described as resembling those of Teste Island, but smaller and without a roof.
  category: relationship
  evidence_refs:
  - ev:8
