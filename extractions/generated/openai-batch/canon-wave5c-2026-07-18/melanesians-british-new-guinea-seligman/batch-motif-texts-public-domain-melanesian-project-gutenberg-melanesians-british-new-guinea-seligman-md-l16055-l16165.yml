canonical_text:
  quote: ''
  summary: The passage describes charm stones and related objects attributed to sorcerers,
    including stones associated with seasons, sickness and death, fertility, and a
    feared quartz death stone. It reports lay fear of touching or transporting such
    objects, beliefs about sorcerers' plant poisons, and beliefs and evidence concerning
    use of human body parts and skulls as sorcery charms, including a detailed description
    of a prepared skull.
