  claim: The passage explicitly compares the chief-mourning practice to Kitava, stating
    that black mourning pigment is worn by all subjects except those of the dead chief's
    own clan.
  claim_level: same_function
  target: Kitava black mourning pigment practice for a dead chief
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the stated mourning-pigment rule and does
    not establish broader equivalence of funeral rites.
