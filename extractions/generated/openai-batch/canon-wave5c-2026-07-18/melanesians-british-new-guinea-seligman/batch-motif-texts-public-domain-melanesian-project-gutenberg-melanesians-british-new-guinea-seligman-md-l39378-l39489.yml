canonical_text:
  quote: ''
  summary: The passage describes mourning rules, funeral feasts, totem-linked participation
    and non-participation, burial procedures for chiefs, post-burial removal and distribution
    of bones, making human bones into lime spatulae and skulls into lime-pots, and
    related mortuary practices reported for Kavatari.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children do not cut hair, blacken bodies, or abstain from food when their
    mother dies; a woman does not blacken or cut hair when a child dies; brothers'
    and sisters' deaths have no outward mourning signs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the death of a sister's child, men and women blacken their bodies, and
    the author believes they cut hair, but states uncertainty about hair cutting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a paramount chief dies, village chiefs come to his village for burial
    and the funeral feast; chiefs of his own totem bring yams, areca nut, and bananas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of other totems may attend the funeral feast without bringing food,
    while people of the dead man's totem do not partake of the feast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a paramount chief's death, coconut palms are not destroyed in subject villages,
    but some are cut down in his own village and nuts are thrown down from other trees,
    apparently for the funeral feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A dead paramount chief is carried to his grave and buried in the same way
    as a dead commoner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Black mourning pigment is worn by the dead chief's subjects, including women
    and children, except those of his own clan; the same mourning rule applies when
    a village chief dies, and the pigment is said to be worn for about one month.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a paramount chief's death, his father or sister's husband removes bones
    from arms and legs and perhaps ribs; bones are distributed to people of all totems
    except the dead man's, with eligible village chiefs receiving one bone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Distributed bones are said to be placed later in the grave of a near relative
    of each recipient, who would take the bone to Tuma; the author notes the statement
    was volunteered but also records that Mr Bellamy found no evidence for burying
    bones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some bones are reserved to make lime spatulae ceremonially used by the dead
    chief's father, children, and sisters' husbands; the text identifies Figure 49
    as a spatula made from a humerus.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The body of a paramount chief is placed in the grave early in the morning,
    lightly covered with planks and mats amid wailing, then taken out, wept over,
    and returned to the grave one or more times before final placement around sundown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After some time in the grave, the paramount chief's body is exhumed and the
    skull is made into a lime-pot by his children, which they and perhaps his widows
    may use; the corpse of a village chief is treated in the same manner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the first wife, brother, or son of a paramount chief dies, specified
    in-law or paternal-uncle relatives remove a forearm or fibula bone and make or
    use it as a lime spatula.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Kavatari, a man is buried the morning after death; the following night
    the grave is opened and leg and forearm bones are removed by the father, or perhaps
    by the sister's husband if the father is dead or absent.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: At Kavatari, the father, brother-in-law, and children place a man in the grave
    and make removed arm and leg bones into lime spatulae which only they may use
    ceremonially.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: At Kavatari, terminal joints of a dead man's phalanges are worn by his children,
    and in some cases the dead man's jaw is worn as a bracelet, though the extent
    of the custom is unclear.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: Children do not eat food from their dead father's village for some time after
    his death; the author states that notes on this point are unsatisfactory.
  category: action
  evidence_refs:
  - ev:10
