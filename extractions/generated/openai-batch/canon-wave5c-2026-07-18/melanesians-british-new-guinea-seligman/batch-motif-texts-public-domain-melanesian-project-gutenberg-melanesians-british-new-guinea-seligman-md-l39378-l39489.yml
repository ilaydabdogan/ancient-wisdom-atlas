candidate_motifs:
- id: motif:1
  label: Kin-specific mourning display and non-display
  taxonomy_refs: []
  basis: The passage distinguishes deaths that require no outward mourning from the
    death of a sister's child, which prompts body blackening and possibly hair cutting.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Hair cutting for the sister's child case is explicitly uncertain.
- id: motif:2
  label: Totem-regulated funeral feast and mourning
  taxonomy_refs: []
  basis: Food contribution, feast participation, mourning pigment, and bone distribution
    are all described as varying by relation to the dead chief's totem or clan.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage reports rules but does not explain their meanings.
- id: motif:3
  label: Chiefly death marked by coconut tree cutting and nut use
  taxonomy_refs: []
  basis: At the paramount chief's death, coconut palms are spared in subject villages
    but some are cut down in his own village and nuts from other trees are thrown
    down, apparently for the feast.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The author says it is not clear whether the nuts belonged exclusively
    to members of the dead chief's totem.
- id: motif:4
  label: Distributed bone conveyed to Tuma through a relative's grave
  taxonomy_refs:
  - afterlife_journey_map
  basis: Distributed bones are said to be placed in a near relative's grave, and that
