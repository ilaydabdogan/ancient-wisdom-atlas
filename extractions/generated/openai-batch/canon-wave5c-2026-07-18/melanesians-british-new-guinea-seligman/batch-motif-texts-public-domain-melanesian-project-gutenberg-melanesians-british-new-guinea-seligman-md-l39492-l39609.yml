canonical_text:
  quote: ''
  summary: The passage describes mourning-name practices, inheritance and residence
    after death, and Marshall Bennett/Iwa funeral customs involving burial in the
    village, removal and cleansing of the skull and selected bones, keeping or wearing
    bones, and ceremonial manufacture and reddening of bone spatulae.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Names of the dead are reported not to be strictly avoided, though a delicacy
    exists about speaking them and relationship terms may be substituted for actual
    names.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Names of certain living near relations or connections of the deceased are
    not used for a period after death, and temporary terms are applied until remarriage
    or removal of black mourning pigment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man whose child or brother's child dies is called tomakapa during mourning,
    while his wife is called namakapa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: One explanation recorded for the observances is that the dead were in the
    habit of calling a person's name; another explanation mentions shame at hearing
    names when the dead can no longer call them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A widow leaves her husband's house after his death and goes to the house of
    one of his relatives if possible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dead man's house is not burnt, avoided, or left to rot, but passes to
    a brother or, if no brother exists, to a sister's child.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Garden property, yam houses, shell ornaments, and other valuable property
    are divided among specified kin, though children may possess property transferred
    before death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Marshall Bennets, the skull and certain bones are taken from the body;
    the skull is kept, bones are worn, and certain limb bones are made into spatulae.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Iwa, a man is buried in his own village, and his grave is dug by his lubai,
    described as certain relations-in-law.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A feast at or soon after burial is made by the mother, brothers, sisters,
    and sisters' children of the deceased and is said to be eaten by members of all
    clans other than that of the dead man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The lubai and the widow open the grave and remove the skull, fore-arm bones,
    fibulae, and cervical vertebrae.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The removed bones are taken to the beach and cleansed; the skull is given
    to the widow and children to keep in their house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The lubai make the long bones into spatulae and ceremonially redden the blades
    to imitate spatulae used for conveying lime to the mouth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The bone spatulae are said not to be truly used for conveying lime to the
    mouth, because doing so would make the eater's teeth fall out.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The jawbone of the dead man is worn by his widow, and his vertebrae and phalanges
    are worn by his wife's brothers and his own children of both sexes.
  category: action
  evidence_refs:
  - ev:10
