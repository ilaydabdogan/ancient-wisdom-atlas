canonical_text:
  quote: ''
  summary: 'Introductory note to a folk-tale chapter describing how tales from mainland
    South-eastern British New Guinea were collected and translated, how local tale
    groups are related, and what recurrent belief patterns appear in the tales: rock
    or cave dwelling folk, man-animal similarity, a surviving human spirit, and malevolent
    non-human beings called ogres by the authors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The folk tales were collected from people of the mainland of South-eastern
    British New Guinea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wagawaga tales were taken down from old men in the evening, sometimes in the
    men's clubhouse and sometimes in Ipunesa's house; the old men told the story to
    an interpreter, who translated it into pidgin English sentence by sentence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The recorders compared two versions of one Wagawaga story and found no substantial
    discrepancies, while acknowledging possible summarisation or misunderstanding
    in translation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Stories from Taupota, Awaiama, and Goodenough Bay were translated without
    an interpreter by a recorder who knew the dialects; informants were asked to explain
    meanings where narratives were bare or gapped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The authors state that, except for story No. 13, the tales show no signs of
    white influence, and that twenty years earlier there was no intelligent intercourse
    with white men in the district considered.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The authors group Taupota and Milne Bay stories together on the basis of close
    cultural relation, leave Awaiama's connection uncertain, and treat Goodenough
    Bay tales as another group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Rock or cave dwelling folk occur frequently in the tales, but the authors
    do not treat this occurrence as evidence for the tales' antiquity.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: Certain stories show that, from one aspect, man and animals are considered
    essentially similar; this is noted alongside a Wagawaga belief that man alone
    has a spirit surviving after death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The tales reveal belief in non-human and non-animal beings with no particular
    cosmic function, usually more or less malevolent, sharing human-like ideas and
    lifespan; the authors apply the term ogre when such beings are harmful or malevolent.
  category: attribute
  evidence_refs:
  - ev:9
