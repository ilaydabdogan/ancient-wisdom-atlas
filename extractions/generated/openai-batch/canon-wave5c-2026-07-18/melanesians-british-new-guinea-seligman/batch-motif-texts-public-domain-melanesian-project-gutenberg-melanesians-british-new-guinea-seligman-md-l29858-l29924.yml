canonical_text:
  quote: ''
  summary: The passage describes Massim valuables, especially benam stones in ceremonial
    handles, their display by women at feast dances, named handle types, and the valuation
    of hard, durable stone and shell objects. It also discusses armshells as labor-intensive
    valuables and currency, with large wearable masiwaru valued partly because suitable
    Conus shells are rare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that, apart from the use of certain stones in relation to
    the dead, Mr. Gilmour's account would also apply among the southern Massim.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies a reported harvest rejoicing as corresponding almost
    certainly to the toreha feast of Milne Bay and the soi of Tubetube, Basilaki,
    and Rogea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dances held during these ceremonies, women carry and exhibit benam; the
    author says this is also done at Suau, while noting uncertainty about the occasion
    there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stones are hafted into either light artistic handles or heavier larger
    handles, both described as unsuitable for practical use.
  category: object
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: The slighter handle form is reported as an old Kiriwina handle called valela
    vaigua, glossed as meaning that its handle is wealth; the heavier form is called
    taramasima and is said to have come originally from Misima or farther east and
    south.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old and well-carved handles were considered valuable, though much less valuable
    than the stones hafted into them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage says the most valuable Massim property shares two traits: refractory
    material requiring prolonged work and durability; valued objects are made of hard
    stone or shell, with rarity and skill also affecting value.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Armshells are durable and labor-intensive; large masiwaru are worth much more
    than smaller armshells because Conus shells large enough for adult wearable armshells
    are rare.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Small armshells are manufactured in large numbers despite not being wearable
    or practically usable except as currency.
  category: object
  evidence_refs:
  - ev:6
