canonical_text:
  quote: ''
  summary: The passage describes Koita courtship, betrothal, and marriage practices,
    with some comparison to Motu practice. It covers nocturnal visits by lovers, female
    initiation of a marriage proposal, tattooing at betrothal and shortly before marriage,
    gifts of tobacco and areca nut, formal presentation of areca nuts with pepper
    and lime to the girl's brother, communal chewing and discussion by relatives,
    collection of bride price, and kin-mediated notification before marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unmarried Koita girls, like Motu girls according to the passage, may receive
    lovers at night in their parents' houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy waits until the house is quiet and the fire is low, enters quietly,
    speaks with the girl in low tones, and is expected to leave before daylight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the boy oversleeps, the described consequence is teasing rather than an
    obligation to marry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Betrothal begins when the boy and girl decide to marry after a period of unmarried
    relations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The initial marriage proposal comes from the girl while the couple are together
    at night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A boy who does not want marriage does not directly refuse at the time, but
    later sends a friend, usually his henamo, to say he does not wish to marry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A girl generally does not allow a boy who refused her marriage offer to visit
    her again.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: When a girl is betrothed, the previously bare region between navel and breasts
    is tattooed; the passage says Koita and Motu use the same pattern.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Any woman accustomed to tattooing may officiate and receives food as a present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The young couple continue nocturnal meetings during the betrothal period.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: During betrothal the boy gives the girl small presents of tobacco and areca
    nut and is expected to give similar small attentions to her relatives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The boy formally announces his desire to marry by sending the girl's brother
    a panicle of areca nuts with pepper and lime, using his own brother or sister
    as intermediary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The girl's brother tells his sister about the marriage request and asks whether
    he should eat the areca nuts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: If the girl assents, the brother takes the nuts home, summons relatives, and
    the gathered relatives chew, discuss the marriage, and receive shares of the nuts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage says the nuts may be sent back if general disapproval is expressed,
    though in practice the matter apparently does not reach this stage unless the
    marriage is to occur.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: A few days later the bridegroom gives the girl's brother a larger present
    of areca nuts and pepper, distributed and eaten similarly; if he lacks sufficient
    nuts, he may give sago instead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The bridegroom collects the bride price, called damu and noted as Motu dava,
    from near relatives and from the whole iduhu; a man from a small iduhu may borrow
    from friends in other iduhu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: No definite bride price is arranged with the girl's relatives, but a generally
    recognized amount is made up.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: The passage gives examples of bride prices including armshells, toia, pigs,
    dog teeth, hatchets, and bush knives.
  category: object
  evidence_refs:
  - ev:8
- id: obs:20
  text: Shortly before marriage, or when the date is fixed, a V-shaped mark called
    gado is tattooed on the bride-elect.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: When the boy is ready to receive his bride, he sends his mother, or his sister
    if his mother is dead, to tell the bride's mother.
  category: sequence
  evidence_refs:
  - ev:9
