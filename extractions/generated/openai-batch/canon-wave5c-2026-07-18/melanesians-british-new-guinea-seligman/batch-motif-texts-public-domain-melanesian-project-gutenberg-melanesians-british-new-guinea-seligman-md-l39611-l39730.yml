canonical_text:
  quote: ''
  summary: Ethnographic description of burial, mourning, exhumation, bone cleaning,
    grave marking, chiefly mourning, hamlet avoidance, corpse ornamentation, and kin-specific
    mortuary duties in Kitava, Gawa, and related named places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bones of a dead woman are removed and cleaned by her husband, his mother,
    his brothers and sisters, and his sisters' children; her skull is kept in the
    widower's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widower's brothers and sisters' sons make spatulae from the bones of the
    deceased woman, and keep and colour the spatulae.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dead woman's lower jaw is worn by her husband; her cervical vertebrae
    are worn by her mother-in-law and her husband's sisters; her mother-in-law also
    wears some of her phalanges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Kitava, many individuals wore mourning signs after the death of the island's
    paramount chief, who belonged to the pigeon totem; his successor was his sister's
    child, Toabiu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The late paramount chief's grave was open because his skull, fibulae, and
    fore-arm bones had recently been removed for further treatment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Around the dwelling and yam houses of the late chief and Toabiu was a taboo
    sign made from a fence of horizontal coconut leaves with drooping pinules and
    coconuts impaled on upright sticks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dead chief's open grave was an oblong hole with a raised board frame around
    its mouth and large white cowrie shells suspended at the head and foot.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ornamental front of the dead chief's yam house was ceremonially defaced
    by slashes made by Toabiu, reportedly because of grief for his uncle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Commoner graves are described as much less elaborate than chiefs' graves;
    at Kwaiawata the outward sign of burial was a rough fence around ornamental foliage
    plants on the grave.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: People from other hamlets avoided entering or approaching a hamlet in which
    mourning was in full progress.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Gawa, a dead man's eyes are closed by his brother or mother; the body is
    ornamented with bagi, armshells, a shell nose ornament, black face lines, and
    a new perineal bandage, with sisters' children and the brother involved in placing
    ornaments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: If death occurs in a strange hamlet, the corpse is carried back wrapped in
    a mat and buried in the deceased's own hamlet, usually in front of his house or
    yam house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The widow and children of a deceased man do not follow the corpse to the grave,
    but they wear mourning; the widow blackens herself and wears doba and magula,
    while the children blacken themselves and wear cross-shoulder belts and pegara
    armlets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: If the children delay or shirk mourning, their dead father's sisters and sisters'
    children admonish them and shame them into performing it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Some time after burial, the grave is reopened, the skull and some limb bones
    are taken out and cleaned at the seashore, and a sagali feast is provided by the
    deceased's brothers, sisters, and sisters' children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: When a woman dies away from her own hamlet, her body is brought back for burial;
    her corpse's face is painted by her children as well as by her sisters' children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: After a woman's death, the husband blackens himself and puts on cross-shoulder
    bands called magula and armlets called pegara; the passage breaks off while describing
    the material of the armlets.
  category: action
  evidence_refs:
  - ev:8
