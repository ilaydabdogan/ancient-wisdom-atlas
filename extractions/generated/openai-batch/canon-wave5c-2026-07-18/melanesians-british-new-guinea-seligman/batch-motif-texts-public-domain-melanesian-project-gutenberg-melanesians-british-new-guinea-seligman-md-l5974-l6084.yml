canonical_text:
  quote: ''
  summary: 'The passage describes preparatory procedures before a westward lakatoi
    voyage: leading men decide and recruit command partners, cease cohabitation, publicly
    gather officers and crews through a smoking sequence, prepare the large dugouts
    and deck, become helaga, observe marital and bodily restrictions, appoint udiha
    attendants, move them aboard while avoiding salt-water contact, arrange mats and
    bags on the vessel, and follow strict food-handling, drinking, and dietary taboos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In April or May, a leading man may secretly decide to organize equipment for
    a lakatoi to go west in autumn, inform his wife, and cease cohabiting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The originating man is called baditauna and recruits another man to go as
    doritauna; both then cease cohabiting and are described as the man at the root
    and the man at the top.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a prearranged day, the baditauna sits on the ground before his house; a
    small boy gives him a bamboo pipe, tobacco, and a leaf, and the doritauna joins
    him to smoke.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two mast-captains, two sail-captains, and the crews gather and divide themselves
    beside the baditauna or doritauna, forming two separate commands without an stated
    priority of one over the other.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: About August, the baditauna and doritauna call the crew to overhaul and caulk
    the asi, the large dugouts composing the lakatoi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At this stage the baditauna and doritauna become especially helaga; husband
    and wife keep apart, do not speak directly, refrain from some bodily care, and
    the wife's position is compared to that of a widow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the caulking, the lailai operation floats the caulked asi, lashes them
    together, and constructs the platform or deck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Each main leader chooses an udiha, usually his son or raimu and preferably
    a prepubescent boy, though a childless man may appoint a grown man.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The udiha become helaga and are carried to a canoe and paddled to the lakatoi,
    with care taken that their feet do not touch salt water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Each udiha carries a new mat and the master's vaina bag, wears a new sihi,
    spreads the mat beneath a midship shelter, and hangs the bag above it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The baditauna, doritauna, and their two udiha sleep aboard the lakatoi; the
    udiha do not leave except for one day when pots are stowed.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Food is cooked by wives or sisters-in-law in a keikei pot, taken to the lakatoi
    by a boy, and handed to the udiha.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The cook and eaters may not touch the food with their fingers; it must be
    handled or eaten with a diniga bone fork, the udiha eats first, and leftover food
    is restricted to the udiha and the corresponding leader.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Certain foods are taboo to the men and boys, and the udiha may drink only
    coconut milk rather than water.
  category: object
  evidence_refs:
  - ev:14
