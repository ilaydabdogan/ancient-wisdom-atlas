canonical_text:
  quote: ''
  summary: The passage describes Oa Rove Marai as an enduring spiritual being of unknown
    parentage, associated with sacred or set-apart status, shape-changing, hunting
    power, revenge, weapons, and offerings. A legend recounts his appearance to an
    old widow as a child, his superior hunting and fishing, conflict with Arabure
    men, taking women in a canoe, carrying the canoe upward toward the sky to a high
    mountain, the origin of crotons from the women passing water, and the women falling
    and becoming rocks, hills, and mountains.
  language: English
