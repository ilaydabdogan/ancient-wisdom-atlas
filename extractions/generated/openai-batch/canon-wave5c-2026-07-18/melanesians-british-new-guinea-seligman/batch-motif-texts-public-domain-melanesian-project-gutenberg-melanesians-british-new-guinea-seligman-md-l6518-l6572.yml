canonical_text:
  quote: ''
  summary: 'The passage describes practices observed while the lakatoi fleet is absent
    from Port Moresby: wives of named men refrain from washing and observe food taboos;
    they work in their husbands'' gardens at sunrise; a daughter or niece keeps the
    house shut and maintains an unextinguished fire; a fibre knot tally counts days
    of absence with tenth-day feasts; after fifty days the fleet is expected. Omens
    for the voyage are read from bodily sensations, dreams interpreted by a sorcerer
    or sorceress, and nocturnal seminal emissions aboard the lakatoi, with a sleeping
    restriction used to counteract the latter bad omen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the lakatoi fleet's absence, the wives of the baditatma/baditauna and
    doritauna refrain from washing themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The food articles taboo to the husbands are also taboo to these wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each morning at sunrise the wives visit and work in their husbands' gardens,
    then return to the village before the customary hour.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While the wives are in the gardens, a daughter or niece keeps the house doors
    shut and tends a fire that is not allowed to go out until the lakatoi return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A length of fibre is suspended from a rafter inside the house, and one knot
    is tied for each day of the lakatoi's absence, with every tenth knot specially
    marked.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: On every tenth day a small feast called boioda takes place in each house,
    with food brought by relations of men attached as crew to the baditauna or doritauna.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men may enter the house when feast food is brought but must eat on the verandah;
    only women may eat inside the house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The wives of the baditauna and doritauna may visit each other's houses but
    may not enter any other house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When fifty days have passed, marked by the fifth big knot, the fleet's return
    is expected daily.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Twitchings or ticklings of the body, usually in feet or hands, are treated
    as omens; the right side is good and the left side is bad.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dreams are taken to a sorcerer or sorceress for interpretation as good or
    bad omens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Examples of good dream omens include seeing grass burning, a dog running after
    a wallaby, and carrying a heavy load of bananas.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: Examples of bad dream omens include seeing a big rock or stone, standing on
    wood over or in water that sinks, and seeing a lakatoi loaded with sago until
    it sinks.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: On the lakatoi, nocturnal seminal emissions are regarded as bad omens; a baditauna
    or doritauna who has one tells those aboard, and the sign can be counteracted
    by not sleeping on his mat for one or two nights.
  category: action
  evidence_refs:
  - ev:7
