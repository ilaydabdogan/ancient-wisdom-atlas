canonical_text:
  quote: ''
  summary: The passage gives an origin legend and dance description for maginogo,
    a dance song now associated with the Yarogaha section. It says the ancestors of
    the Yarogaha and Gorobe Koita once lived in a giant erimo tree near Nebira/Saddleback
    Hill, where Gorobe men invented maginogo. The Yarogaha and Gorobe sections later
    exchanged dances, making maginogo Yarogaha property. The passage also describes
    how bamboo staffs became the successful accompaniment after other devices failed,
    and it outlines the dance formation and movements of two men and two parallel
    columns of dancers.
  language: English
  quote_policy: summarized
