  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dance begins with two parallel columns of dancers, with men and women
    alternating as far as possible.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two men stand a few paces from one end of the columns and face them; the column
    dancers stand at right angles to these men while facing each other.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The two men advance toward the columns, while the columns move sideways to
    meet them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two men may separate and pass along the sides of the columns, or pass
    together between the columns; the dancers follow the man who initiates the movement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the movement, the dancers reform into two parallel columns, then turn
    inward to face each other again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The dance includes singing and stamping of bamboos.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Later in the dance, terminal members from one end of the columns pass inward
    with some neighbours and move down the length of the columns, after which two
    parallel lines are again formed.
  category: sequence
  evidence_refs:
