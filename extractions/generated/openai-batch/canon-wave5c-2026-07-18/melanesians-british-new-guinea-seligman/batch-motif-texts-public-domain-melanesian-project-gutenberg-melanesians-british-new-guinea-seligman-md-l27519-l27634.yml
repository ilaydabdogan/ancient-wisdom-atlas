canonical_text:
  quote: ''
  summary: The passage describes mourning duties associated with eriam relationships,
    regional terms and distributions for kimta/eriam-like relationships, Bolanai rikam
    marital privileges, Mr Newton’s distinction between kimta age-cohort bonds and
    eriam marital-right bonds, and the am kimta feast through which age positions
    and cohort relations were marked.
  language: English with local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a man dies, the wives of his eriam mourn for him as his own wife does,
    but for a shorter period.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eriam wives wail for the dead man, are blackened, wear a special widow’s
    petticoat, and don mourning armlets, but remove or abandon these mourning signs
    earlier than the deceased man’s own wife.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The notes on eriam duties and privileges were collected at Wedau; the passage
    states uncertainty about former application at Wamira and notes related terminology
    or customs at Gelaria and westward around Goodenough Bay.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Bolanai, kimta is called pata and eriam is called rikam; men of the same
    pala in a community are rikam to each other.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Bolanai district, males betrothed within the village are usually betrothed
    to girls of a pata nearly corresponding to their own.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man abstains from connection with his wife from diagnosed pregnancy until
    the child is weaned, and during this period may have access to wives of rikam
    who are not pregnant and not forbidden by clan rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man proposing connection with a rikam’s wife tells the woman; the encounter
    generally occurs in the bush or garden, and the woman need not keep it secret
    from her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Mr Newton states that kimta and eriam should be kept distinct: kimta is based
    on being born at about the same time, while eriam concerns reciprocal rights over
    wives and related duties.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Children of the same age were regarded as belonging to the same kimta, normally
    remaining in it for life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A local feast called am kimta was held from time to time, during which males
    of the various kimta ate together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A person could be degraded or advanced in kimta; a physically slower-developing
    child could be moved into a lower kimta, and older depleted kimta could be combined.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The chief object of am kimta is described as impressing age positions on the
    community, especially the rising generation; clan, relationship, and wealth distinctions
    were not observed in the eating.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Boys would am kimta about the time they pulled food they had grown themselves
    and expected invitations to eat with kimta mates in other villages.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that communities had little ordinary intercourse outside
    themselves and visited others mainly for feasts, commerce, or consultation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: Kimta relationships produced friendly relations among people who grew up together
    and shared age-linked duties, privileges, memories, and expectations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The word eriam could be used loosely for friends or chums of the same kimta
    without implying rights over wives.
  category: speech
  evidence_refs:
  - ev:8
