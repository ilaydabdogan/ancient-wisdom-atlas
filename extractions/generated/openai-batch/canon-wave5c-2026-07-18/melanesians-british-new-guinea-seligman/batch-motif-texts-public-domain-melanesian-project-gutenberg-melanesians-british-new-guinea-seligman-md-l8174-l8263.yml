canonical_text:
  quote: ''
  summary: The passage describes named taboo signs used to protect trees, garden produce,
    paths, firewood, and game. Some signs may carry magical sanctions such as sickness
    or implied magical protection, while others function through native law, custom,
    consent of elders, or public opinion. The passage emphasizes that magical and
    non-magical property taboos receive similar respect.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The general word for taboo applied to trees and garden produce is given as
    tora, especially for a coconut-tree taboo sign that requires the consent of village
    old men after public discussion.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bodibo is described as a common taboo sign on a single coconut or other tree.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bodibo sign consists of a wisp of grass tied in a loose single knot, with
    a string passed through the loop and tied around the tree trunk.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that bodibo was formerly made with magic ceremonial, and
    infringement would bring sickness on the wrongdoer; it also reports the view that
    some old men might still use magic secretly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Garabi is described as an ordinary taboo sign on a single tree, made by plaiting
    coconut or sago leaves around the trunk or tying a single leaf around a small
    trunk.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bodibo and garabi may have magical sanction, and their efficacy is attributed
    primarily to fear of the results of infringing their magical properties.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tora is an imposing taboo sign placed beside a path or in a garden to protect
    coconut palms or garden produce; it has no direct magical power and is treated
    as native law enforced by public opinion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Water itself was never tabooed, though a tora could be set beside a water
    hole in order to taboo surrounding trees.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A track to a new garden may be tabooed by planting sticks on each side, carrying
    creeper between them, and suspending one or more bodibo grass knots; the passage
    says this implies some magical protection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A rough recognized garden-track taboo is for the owner to cut down a tree
    so that it blocks the road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Firewood can be tabooed before or after cutting by tying a wisp of grass around
    the tree or faggots; this is called umuraumura or nanainanai and implies no magical
    protection.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A hunter may leave game by a track covered with broken branches or slung in
    a fork of a tree, and the passage says the quarry would not be touched despite
    the lack of magical protection.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage concludes that little or no difference in respect is accorded
    to property taboos that are magically enforced and those backed only by custom
    or public opinion.
  category: relationship
  evidence_refs:
  - ev:9
