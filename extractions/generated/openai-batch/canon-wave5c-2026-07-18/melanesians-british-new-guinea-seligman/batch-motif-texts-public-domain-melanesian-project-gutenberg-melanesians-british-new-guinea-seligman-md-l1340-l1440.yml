canonical_text:
  quote: ''
  summary: The passage compares physical, cultural, linguistic, and enumeration characteristics
    attributed to Papuo-Melanesian and Papuan groups in southeastern New Guinea. It
    discusses two men of Hanuabada/Port Moresby, regional groups such as Sinaugolo,
    Garia, Massim, Western Papuo-Melanesians, Tubetube, Louisiades, Marshall Bennet
    Islanders, and Trobriand Islanders, and includes a note on skull measurements
    and a cave at Awaiama said to have contained skulls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage describes two men of Hanuabada: a slighter man treated by the
    author as typical of one Papuo-Melanesian division, and a taller man described
    as having Papuan features.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author argues that Port Moresby's location east of Cape Possession excludes
    recent contact metamorphosis and supports a conclusion that immigrant Melanesians
    were superimposed on a former Papuan population.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that a similar physical difference can be found among the
    Sinaugolo, and that the Sinaugolo speak a Melanesian dialect while their Garia
    neighbours speak a Papuan language.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Massim and Western Papuo-Melanesians are said to differ physically, with
    the Massim showing an orderly west-to-east change, while Western Papuo-Melanesians
    are said not to show such an orderly arrangement.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A footnote reports skull measurements from multiple places and states that
    34 skulls were collected from a cave at Awaiama in Chads Bay, which was said to
    be a depository of skulls brought from Goodenough or Fergusson, though the author
    notes uncertainty about their origin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that both divisions of Papuo-Melanesians share wavy hair
    and the absence of long, rigid seclusion ceremonies for boys at puberty, contrasting
    this with Papuan tribes where such ceremonies are described as characteristic.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that many Papuo-Melanesians, including all the Massim,
    speak languages with common Melanesian grammar and words related to the common
    stock language of Oceania, while Papuan languages are described as having unrelated
    vocabularies and non-Melanesian grammar.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage contrasts enumeration systems: the Papuo-Melanesian is said to
    count by quinary or vigesimal systems, while the Papuan is said to have only numerals
    for one and two and to count reliably only to five or six by combination.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The inhabitants of Tubetube are reported to allege that they originally came
    from the eastern end of Duau, and the passage gives measurements for ten men.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports a rise in cephalic index eastward toward the Louisiades
    and gives measurements for Louisiades, Gawa, Kwaiwata, Marshall Bennet Islanders,
    and Trobriand Islanders.
  category: attribute
  evidence_refs:
  - ev:8
