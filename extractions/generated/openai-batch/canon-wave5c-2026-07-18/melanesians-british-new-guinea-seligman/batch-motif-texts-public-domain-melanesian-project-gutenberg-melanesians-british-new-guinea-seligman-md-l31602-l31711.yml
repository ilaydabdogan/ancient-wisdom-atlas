canonical_text:
  quote: ''
  summary: The passage describes rules and procedures for cannibal feasts, especially
    maiha taken as payment for a death and idaidaga victims killed and eaten otherwise
    than as payment. It records dancing with skulls, clan and kinship restrictions
    on who may eat, abstention and seclusion for the killer or captor because of blood-related
    danger, use of skulls and bones as objects or ornaments, rules for distributing
    and eating human flesh, and a footnote comparing Wedau and Wamira practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While a corpse was being cut up and cooked, successful warriors performed
    a dance called rurepo to drum beats and conch blowing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skulls from previous cannibal feasts were brought from the potuma, decorated
    with croton leaves, mounted on a paddle handle or long stick through the foramen
    magnum, and held above each dancer's head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the burning, the victim's captor made a return present to the next of
    kin of the man for whom maiha was taken; the passage gives Rerenia giving Bakaiya
    a bagi as an example.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For maiha taken for a Wagawaga man, the feast and entry into the cannibal
    gahana/gakana were limited to the dead man's clan-group, excluding the intermarrying
    clan-group and outside clans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiha taken for Keori was eaten only by Garuboi men; the text says that
    if Keori had belonged to Modewa or Hurana, Garuboi would have abstained and Modewa
    and Hurana together would have shared the feast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father and paternal relatives of the dead man for whom maiha was exacted
    should not take part in the feast, while the mother and maternal relatives would
    eat the son's maiha.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: No one would eat a man of his own killing or a prisoner he had taken, though
    he might eat a man of his own or father's clan if that person was killed or captured
    by someone else.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The killer or captor of the man to be eaten went straight to his own house
    and stayed there for about a month, living on roast taro and hot coconut milk;
    his wife remained in the house but slept apart.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The stated reason for the killer or captor's seclusion and abstention was
    fear of the dead man's blood; if he joined in eating, his belly would become full
    of blood and he would die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ipunesa explained the feared blood-related danger as smell or vapour of the
    blood, while the author describes it as imperceptible qualities from the blood
    that lingered around the feast and adhered to participants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The provider of the feast avoided taking lime from the lime gourd of anyone
    who had taken part in the feast for some considerable time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Older men said that the blood-related qualities were not expressed by the
    word arugo, used for the ghost, shade, or spirit of a dead man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The homicide's brother or ail prepared the skull and took it to the potuma,
    and these relatives could wear an armlet made from the lower jaw of the maiha
    and cervical vertebrae attached to their back hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A man or woman killed and eaten otherwise than as payment for a clansman's
    death was called idaidaga; strangers might be treated this way for the desire
    for a favored food.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The killer of an idaidaga victim had to abstain from the flesh and follow
    the same rules as the killer of maiha, while anyone above puberty could otherwise
    share in the feast regardless of clan.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: An idaidaga victim taken alive was dragged to the captor's gakana, speared
    without a mortal wound, burnt, cut up, and distributed by the captor's ail and
    brother, who called recipients by name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: People who could not enter the gakana received their portions outside, and
    human flesh, whether idaidaga or maiha, was not taken into a house.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:18
  text: A footnote reports Wedau and Wamira practices in which adult males could eat
    enemy flesh if it was not revenge payment, while revenge cases were limited to
    the relevant clan or clan-group.
  category: relationship
  evidence_refs:
  - ev:10
