candidate_motifs:
- id: motif:1
  label: Revenge or payment cannibal feast
  taxonomy_refs: []
  basis: Maiha is described as taken for a dead man, with the feast limited to the
    dead man's clan-group and return presentation to next of kin.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: This is an ethnographic description of practice rather than a mythic narrative;
    the motif label is descriptive.
- id: motif:2
  label: Clan-restricted ritual consumption
  taxonomy_refs: []
  basis: The passage gives detailed clan-group and kinship rules determining who may
    enter the cannibal place and who may eat maiha.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Rules are specific to the described Wagawaga context and should not be
    generalized beyond the passage without corroboration.
- id: motif:3
  label: Killer's abstention and seclusion because of blood danger
  taxonomy_refs: []
  basis: The killer or captor abstains from eating his own victim, remains secluded
    for about a month, and avoids feast participants' lime gourds because of feared
    blood-related qualities.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The author explicitly distinguishes the danger from arugo; no ghost or
    spirit interpretation should be inferred beyond that statement.
- id: motif:4
  label: Human remains as feast trophies and ornaments
  taxonomy_refs: []
  basis: Skulls from earlier feasts are displayed in the dance, and the current victim's
    skull, lower jaw, and vertebrae may be prepared or worn by specified relatives.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage records use and display of remains but does not provide a
    full symbolic explanation for each object.
- id: motif:5
  label: Non-revenge idaidaga cannibal feast
  taxonomy_refs: []
  basis: Idaidaga victims are defined as killed and eaten otherwise than as payment;
    the killer abstains but post-puberty people may otherwise share, and the victim
    is processed and distributed through a named procedure.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage reports this as practice and includes no mythic origin account.
- id: motif:6
  label: Human flesh excluded from the house
  taxonomy_refs: []
  basis: The passage states that human flesh, whether idaidaga or maiha, might not
    be taken into a house and describes alternative eating locations.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The reason for this house prohibition is not explicitly explained in the
    passage.
comparison_claims:
- id: claim:1
  claim: 'The footnote presents Wedau and Wamira as having a functionally similar
    distinction to the main Wagawaga account: enemy flesh could be eaten more broadly,
    but bodies eaten as revenge or payment were restricted to the relevant clan or
    clan-group.'
  claim_level: same_function
  target: Wedau and Wamira enemy/revenge cannibal-feast rules described in the footnote
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is internal to the passage and footnote; the footnote
    includes bracketed uncertainty about clan versus clan-group and does not establish
    historical contact.
- id: claim:2
  claim: The Wagawaga rule that human flesh was not taken into a house resembles the
    Wedau practice of cutting and eating the body on the beach or in a gully and never
    in a house, apart from a heavy-rain exception.
  claim_level: same_function
  target: Wedau spatial avoidance of houses for cannibal-feast eating
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: medium
  limitations: The Wedau note includes an exception during heavy rain and the comparison
    is not explicitly extended to Wamira in the same way.
