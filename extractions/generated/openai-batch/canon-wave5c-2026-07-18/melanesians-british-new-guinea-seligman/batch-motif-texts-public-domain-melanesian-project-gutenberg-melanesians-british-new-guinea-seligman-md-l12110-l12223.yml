canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of the decay of Roro-speaking clan badges or design-rights:
    hereditary patterns once sold or restricted become copied as decoration on utensils,
    marea posts, shell ornaments, and other objects. Examples include hornbill-derived
    A-shaped marks, crocodile carvings, koiyu shell designs, and a mixed-settlement
    case at Hisiu where badge attribution may become confused.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that among Roro-speaking tribes some da'da/oada retaining
    full value could probably be sold, and that certain low-relief board patterns
    recognized as hereditary chiefly-family oada were once bought and sold.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts limited extension of oada-use rights with a later condition
    in which conventional representations or derivatives are used as decoration on
    wooden or bone utensils regardless of the maker’s or user’s stock or settlement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Waima, patterns said to derive from the hornbill are used by any itsubu
    as decorative schemes on bone utensils, while still serving as distinguishing
    marks in the marea when carved on post capitals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hau ani coconut-scraper decoration is described as A-shaped marks resembling
    marks on the side posts of the Airava marea at Abotaiara and as derived from marks
    on the hornbill’s beak.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Abotaiara men stated that the A-shaped markings were truly Abotaiara property
    and that other settlements strictly had no right to copy them, although the passage
    says there is now no effective copyright on such bone implements.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The crocodile is said to be the dada of the Roroaiera local group of Arabure
    itsubu and strictly should appear only on the Roroaiera marea, but crocodiles
    are carved on marea of unrelated local groups.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Poa Oa, the hereditary carver of the Roroaiera local group, carved the crocodile
    on the posts of the Diumana clubhouse belonging to a neighbouring friendly people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Koiyu ornaments are described as turtle-shell designs mounted on a piece of
    white Melo diadema shell; these designs were said to be clan property, though
    the passage doubts that makers now restrict themselves to one design.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that decay of dada makes it difficult to discover the dada
    of a particular local group, especially at Waima where partial and temporary fusions
    of groups of diverse origin occurred.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hisiu is described as a Waima colony with families and representatives from
    multiple settlements or itsubu; its Komo Kupunu daughter settlement has an Airava
    marea and airava, the hornbill, as its dada.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The passage notes that a man who carves especially well may train his son
    or sister’s son, so the position tends to become hereditary; Poa Oa was taught
    by his paternal uncle and taught his son.
  category: sequence
  evidence_refs:
  - ev:8
