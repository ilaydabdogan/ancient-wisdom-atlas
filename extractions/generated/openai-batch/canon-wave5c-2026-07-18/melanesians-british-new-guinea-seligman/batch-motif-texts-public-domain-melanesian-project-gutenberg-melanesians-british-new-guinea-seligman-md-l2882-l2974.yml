canonical_text:
  quote: ''
  summary: The passage discusses whether Papuasian art is primarily aesthetic or has
    non-aesthetic significance. It contrasts the Louisiades belief that carved munkuris
    fixed to northern Massim waga are essential to safe canoe navigation with Tubetube
    importers' lack of knowledge of that meaning. It also describes canoe end-piece
    designs as conventional representations of birds, fish, and snakes associated
    with local totem animals, widespread decorative carving and copying, the purchase
    of a dance by a Koita village, and hereditary wood-carving specialists trained
    through family lines.
  language: English
  quote_policy: summarized
