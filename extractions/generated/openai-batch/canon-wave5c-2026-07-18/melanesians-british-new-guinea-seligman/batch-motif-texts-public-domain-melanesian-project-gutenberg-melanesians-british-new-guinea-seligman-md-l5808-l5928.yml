canonical_text:
  quote: ''
  summary: The passage recounts a legend in which Edai Siabo of Boera is taken underwater
    by the dirava Edai, instructed in the making and use of lakatoi trading canoes
    and the hiri voyage, returns in a death-like state and revives, teaches the Boera
    people the vessel, instruments, and songs, and then leads or initiates a westward
    trading voyage exchanging pots for sago.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Edai Siabo is introduced as a man of the Motu village of Boera.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Edai Siabo and other men sail by canoe to the islands of Bava and Idiha to
    catch turtle, but they are unsuccessful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the other men sleep on the island, while Edai Siabo, described as
    master of the turtle net, sleeps alone in the canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the night the dirava Edai arises from the water, seizes Edai Siabo,
    and carries him under water to a rock-cave abode.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dirava tells Edai Siabo not to fear and says he has brought him there
    to tell him about lakatoi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dirava explains how lakatoi should be made and says that a westward voyage
    in one would obtain sago for the season of scarcity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Edai Siabo's companions see his feet projecting from the cave, repeatedly
    dive down, and try to pull him out, but the dirava holds him until the instruction
    is finished.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the instruction is completed, the dirava allows Edai Siabo to be hauled
    out; he appears dead in the canoe but later opens his eyes and revives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Edai Siabo tells his companions that the dirava Edai took him into the rock-cave
    and instructed him about making a lakatoi and about the hiri.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Boera, Edai Siabo builds a model lakatoi according to the spirit's instruction,
    places it on the sea, and it sails quickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The assembled people ask who taught Edai Siabo to make the vessel, and he
    says the dirava Edai taught him to make a big vessel and sail west for sago.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Edai Siabo explains to the village men how to lash canoes together, step the
    mast, make the sail, and perform other construction tasks; the people build a
    lakatoi named Oalabada.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: A Koita brother-in-law of Edai Siabo tries to dissuade him from going west
    by saying he has bananas in the garden and yams in the house, but Edai Siabo remains
    stubborn.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The completed lakatoi is loaded with earthenware pots.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Edai Siabo forbids beating drums on the lakatoi and instructs the people to
    use bamboo sede instead; the men make sede and are pleased with their sound.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Edai Siabo gives the words and tune of the lakatoi song as the dirava Edai
    had taught him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Those not going on the hiri go ashore, while the others hoist the sail and
