canonical_text:
  quote: ''
  summary: Ethnographic passage describing Louisiades marriage exchange, affinal property
    claims and avoidance, widow and deceased-wife's-sister remarriage rules, inheritance
    of land and houses, and a following appendix section describing Mukaua settlements,
    houses, language/customs shared with Bogaboga, and possible former man-houses
    inferred from terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Initial gardens are made on the bride's hamlet land, and additional, more
    important gardens are made on the bridegroom's land because he usually later builds
    in his own hamlet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two or three days after consummation, the bridegroom's folk carry prepared
    food and valuables such as armshells and sapisapi to the girl's parents' house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Return presents of similar value are made, and reciprocal food presents continue
    for an indefinite time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A wife's sister may take things belonging to her brother-in-law, even borrowing
    and damaging a large canoe without blame; the bride's brothers have similar rights.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bride's mother has less clearly defined rights and is described as likely
    to beg, while the bride's father is said not to ask for anything.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: No payment is made to the wife's parents at the birth of a first or later
    child, according to the informant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Several affinal avoidance relations are listed, including son-in-law with
    mother-in-law, father-in-law with daughter-in-law, wife with husband's brothers,
    and husband with wife's aunts and wife's sisters' daughters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man is said to have the right to marry his brother's widow after her mourning;
    if another man marries her, he must pay the dead man's brother the price the dead
    man had paid.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a woman dies, her husband may take her unmarried sister without fresh
    payment; if that sister marries someone else, her husband must pay bride-price
    to the dead sister's husband rather than to her own people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: During his wife's lifetime, a man should not approach his wife's sister closely,
    hold prolonged conversation with her, or speak with her alone in the bush, because
    this could produce jealousy and trouble.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man's land passes to members of his clan, including brothers, sisters, and
    sisters' children, and never to his children; personal property can partly pass
    to children if directed or given during life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A woman's land passes to her children; if they are young, her brothers, sisters,
    and sisters' children look after it, and part is later given to the children to
    cultivate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man's house goes to a brother, sister, or sister's son, though it is often
    left to rot or destroyed; a widow returns to her hamlet with her children, and
    no burial or mourning details were elicited.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Mukaua community is described as six nearby settlements, with several
    single-clan hamlets and two settlements containing two separately named clan hamlets
    with headmen.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Mukaua and Bogaboga houses are built on piles, thatched with sago leaf, and
    have a covered front platform.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Mukaua and Bogaboga are said to speak the same language and observe the same
    customs; neither has stone circles or current clubhouses, but a word boru is equated
    with the Barde Bay word potuma, leading to the suggestion that man-houses may
    once have existed there.
  category: relationship
  evidence_refs:
  - ev:10
