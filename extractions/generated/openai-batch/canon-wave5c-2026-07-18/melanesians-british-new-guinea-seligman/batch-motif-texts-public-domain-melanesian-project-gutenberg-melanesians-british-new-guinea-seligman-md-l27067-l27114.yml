canonical_text:
  quote: ''
  summary: The passage describes bolabola as rows or circles of stones understood
    by the author as squatting places rather than cannibal sites. Some stones bear
    lightly incised designs identified or reported as the morning star, a possible
    star or eye, and a starfish, while other designs lack clear names or meanings.
    The Irere bolabola is described as a circular stone place with upright stones
    held as family property and inherited through kin. Women and some visitors were
    restricted from using or approaching bolabola. A central fire is sometimes used
    now, while formerly a shallow pottery dish called noma occupied the centre. A
    cited letter compares Wedau and Goodenough Island stone circles as places for
    sitting, discussion, and avoiding damp ground.
  language: English
  quote_policy: summarized
