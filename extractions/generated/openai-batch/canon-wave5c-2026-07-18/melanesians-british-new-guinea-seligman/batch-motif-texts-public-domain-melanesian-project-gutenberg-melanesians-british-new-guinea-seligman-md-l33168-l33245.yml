canonical_text:
  quote: ''
  summary: 'The passage describes preparations for the walaga: dance practice, timing
    by crop and moon, restricted cutting and erection of platform posts by fasting
    men, medicine men placing charms and muttering spells to prevent sickness, an
    informant report that medicine men extract and release a dead person''s shade
    from posts, occasional bull-roarer use, construction details, announcement of
    the feast, and preparations for cutting a chosen mango tree with precautions to
    catch falling leaves, twigs, and chips.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men and women practice the dance steps for the walaga on a section of log
    laid on the ground, usually at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a preparatory period of about three to six months, probably determined
    by taro crop ripening, the walaga is announced five or six days before a full
    moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The taniwaga and the fasting men go to the jungle to cut posts and timber
    for the walaga platform, and only they may cut and carry these materials to the
    village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fasting men dig the holes in which the piles supporting the walaga will
    be stepped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the holes are dug, the taniwaga notifies all district gweri ravai,
    described as medicine men, that the walaga piles are to be stepped.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gweri ravai assemble with ginauri charms consisting of leaves, bones,
    ash fragments, and similar items.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: One or more gweri ravai squat beside each hole, mutter pari spells, and place
    some ginauri at the bottom of the hole to prevent people who come to the walaga
    from getting sick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fasting men place the posts in the holes and firmly fill them with earth
    while the gweri ravai stand by muttering spells.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The text states that information about the actions of the gweri ravai was
    difficult to obtain and that their actions may have varied by occasion or place
    of origin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Mr Newton's reported account, the gweri ravai rub the posts, suck through
    their hands, and aim to extract the arua, or shade/spirit, of any dead man present
    in the post so it will not be injured by the erection of the post.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the same report, the gweri ravai carry the extracted soul away and release
    it in the grass or bush.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Awaiama and Taupota, bull-roarers are said to be swung by fasting men while
    the posts are being stepped, and the passage says no reason for this use could
    be elicited.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The walaga platform is said to be quickly completed, and its edge planks are
    generally made of dabedabe wood.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Messengers announce in nearby and surrounding districts that the walaga is
    built and that the feast will occur in five or six days.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Visitors generally arrive on the day before the feast proper, when fasting
    men cut a track to the chosen mango tree.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Nets are placed on the ground to catch leaves or twigs that may fall when
    the mango tree is cut down.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: New sleeping mats are arranged around the mango tree about two feet above
    the ground so chips will not fall to the ground when the trunk is cut through
    above the mats.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: One fasting man cuts down the mango tree; no spells are recited, and a stone
    adze is used.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: A footnote states that no legend is attached to the dabedabe tree and that
    informants differed or were uncertain about whether the Dabedabe story concerned
    the first walaga.
  category: other
  evidence_refs:
  - ev:12
