canonical_text:
  quote: ''
  summary: 'The passage describes Waima paiha war-related offices and practices: two
    male paiha chiefs with right and left battle functions, two related paiha women
    whose presence is required in the war party, kinship links among named office-holders,
    pre-battle medicining with a plant, battle charms, and presents given to paiha
    chiefs to turn a private quarrel into a communal affair.'
  language: English with local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rohi Aihi, an Arabure paiha expert, is said to take precedence over Naime
    Miria in paiha matters, and both men have official titles applying only to their
    paiha functions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rohi Aihi is titled autai pakana, glossed as the great autai; Naime Miria
    is titled autai irina, interpreted as the autai of the left.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Autai is described as the name of a bark which, when eaten, makes people talk
    much; chewing this bark by paiha chiefs is described as a necessary preliminary
    to a fight.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When Waima decided to attack another community, the battle line was led by
    the autai pakana and autai irina, followed by two related paiha women, then the
    ovia awarina war chiefs, and then the tuari, the bulk of the war party.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The autai pakana led the right side of the van and was supposed to make the
    frontal attack; the autai irina held the left-side station and is described as
    commanding a reserve for flank actions or cutting off retreat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two paiha women were said to be necessary and were essential to the war
    party; they danced while going to the fight, did not themselves fight, and if
    they ran away the fighting men would follow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two named paiha women are Aiva Ikupu, attached to Rohi Aihi, and Poni
    Biri, attached to Naime Miria.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage gives genealogical explanations for the relationships between
    each paiha woman and the paiha chief with whom she is officially connected.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before attack, the paiha chiefs medicined their men with a portion of the
    leafy axis of a plant called topi, using a method compared in the passage to a
    previously described hunting preliminary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The paiha chiefs carried battle charms including leaves, bark fragments from
    certain trees, and pieces of broken weapons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Formerly, presents were made to the paiha chiefs to induce them to take up
    a private quarrel and make it a communal affair.
  category: action
  evidence_refs:
  - ev:6
