canonical_text:
  quote: ''
  summary: 'The passage describes the return journey of lakatoi vessels: the shifting
    bow according to wind, continued restrictions on the baditauna, doritauna, and
    udiha, taboo removal at Boera or Borebada through bathing, adornment, and a final
    meal, watchmen sighting the returning fleet from Huhunamo, and wives and relatives
    meeting the vessel and distributing sago. It then summarizes Captain Barton''s
    account of the lakatoi Kavaubada at Kaimare, including exchanges with Kaimare
    notables, a pig or dog meal, conversion of the lakatoi into a house, acquisition
    and shaping of asi, nightly singing by Kaimare women and girls, construction and
    enlargement of the lakatoi, sago trade and loading, return without anchoring,
    a food-sharing act off Jokea, and the stated absence of sexual intercourse between
    Motu visitors and women or girls of Gulf villages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the return journey the end serving as the bow depends on whether the wind
    is northerly or southerly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baditauna, doritauna, and their two udiha resume the footing and restrictions
    observed on the outward voyage until the lakatoi reaches Boera or Borebada.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Boera or Borebada, the baditauna and doritauna bathe in the sea, adorn
    themselves, put on new sihi, and the food taboo is removed with a final meal of
    sago and grated coconut cooked in the keikei.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The keikei and kibo are sometimes broken after the last meal and their pieces
    thrown into the sea, but the passage says this may be omitted and its regularity
    is uncertain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Koita men keep an intermittent watch for the returning lakatoi from Huhunamo
    hill and pass the news to Port Moresby villages when the vessels are sighted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wives of the baditauna and doritauna bathe, wear their ornaments, and go in
    canoes with wives and relatives of the crew to meet the returning vessel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Each woman receives a kokohara of sago from her husband, takes it back to
    the village, divides it among relations-in-law, and reserves a portion to cook
    for her husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: At Kaimare, Kaimare men board the lakatoi, embracing occurs, and the baditauna
    and doritauna present ornaments and pots to two Kaimare notables.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two Kaimare notables kill a pig or dog that is eaten on the lakatoi by the
    crew, leaders, and udiha; the animal is described as Motu property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The lakatoi is converted into a house by tying a spar between the masts as
    a ridge pole and adding a roof thatch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: 'Asi are obtained through negotiation: an armshell may be given to a Kaimare
    man, Kaimare men measure and fell trees, and the Motu shape the floated timber
    into asi.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Kaimare women and girls sit in a group, beat drums, and sing all night, while
    Kaimare men do not take part and do not dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Houses on piles are built for the Motu in the river, the lakatoi is taken
    to pieces, and an enlarged lakatoi is reconstructed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: Kaimare people go into the bush to make sago, while Motu obtain sago from
    Koriki and Vaimuru people in exchange for retained pots and beads; later the Kaimare
    return with sago and Motu load their shares onto the lakatoi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: On the homeward journey the lakatoi does not anchor; off Jokea the baditauna
    and doritauna place sago and areca nuts in the iTiitahuna and call everyone to
    eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage states that no sexual intercourse takes place between the Motu
    and women or girls of the Gulf villages they visit.
  category: relationship
  evidence_refs:
  - ev:6
