canonical_text:
  quote: ''
  summary: The passage describes hereditary chiefly offices, selective succession
    among children, a woman chief who may transmit office to children raised in her
    pangua, inherited and purchased rights to chiefly house carvings, the lopia pao
    boar-tusk ornament as a chiefly emblem, an origin account in which an Afai woman
    sees non-human faifai carving boards through a digging-stick hole and directs
    her husband to copy them, and a Waima legend in which an ornament invented by
    Bereina is copied or stolen by Mekeo people, leading to warfare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The offices of lopia fda and io lopia are described as hereditary from parent
    to child or adopted child, with an old fighting-days qualification that a war
    chief had to be a successful warrior.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief may pass over elder children and transmit office to a younger son;
    the passage gives examples involving the Oriropetana lopia fda and an Inafokoa
    pangua chief.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A woman, Inau Oaia, is described as a present-day lopia fda at Inawae and
    may transmit her office to her children if they are brought up at Inawae.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that children of noble families could assume their mother's
    pangua, and that this mode of descent was unusual among commoners but not strictly
    limited to chiefly families.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A lopia fda might ornament his pangua house with carved designs inherited
    with the chieftainship.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Inawi chief's house is described as unusual, built in a cross form with
    equal limbs, a hanging plank called ipopi, and carved side planks called alipa
    ikanga.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The right to build faifanga-type houses and the right to make and display
    certain carved planks are described as exclusive or owned rights that could be
    purchased and then inherited.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Leaf-like objects near the base of the swinging plank in the figure are described
    as conventional representations of the boar-tusk ornament lopia pao, which every
    Mekeo chief has the right to wear and display.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the origin account, an Afai woman planting taro looks down a hole made
    by her digging stick and sees men, later identified as non-human faifai, carving
    boards.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Afai woman tells her husband what she saw, and he carves similar boards
    under her direction and exhibits them at feasts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Waima legend says the ornament was invented by Bereina and copied or stolen
    by Mekeo folk, whose carving of it in the ufu of Inawi caused prolonged warfare
    between Bereina and Waima on one side and Mekeo on the other.
  category: sequence
  evidence_refs:
  - ev:8
