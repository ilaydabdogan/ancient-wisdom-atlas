canonical_text:
  quote: ''
  summary: The passage describes rules of avoiding physical contact and speech among
    certain opposite-sex relatives by marriage. A man especially avoids his wife's
    sister, treats his mother-in-law with somewhat less rigidity, and does not avoid
    his brother's wife. It also records local qualifications from Tubetube, Wagawaga,
    South Cape, and villages inland from Milne Bay.
  language: English
  quote_policy: summarized
