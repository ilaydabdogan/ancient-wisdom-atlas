- id: obs:1
  text: Most opposite-sex relatives connected by marriage who also observe name avoidance
    avoid coming into contact with one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is said to rigidly avoid talking to a sister of his wife, whether they
    meet alone or with others present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man meets his wife's sister alone, he avoids coming near her; if passage
    is unavoidable, they turn their backs while passing, and one, usually the woman,
    steps aside into the bush.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man avoids his mother-in-law less rigidly than his wife's sisters, but when
    he meets her alone he treats her in the same way.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In public, a man usually does not enter his mother-in-law's house unless he
    is living there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In his own house, a man may speak a little to his mother-in-law and may eat
    food she cooked, but he does not take the pot of food directly from her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Father-in-law and daughter-in-law avoid each other much as mother-in-law and
    son-in-law do.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man does not avoid his brothers' wives.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A note states that at Tubetube the practice is dying out.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: A note reports that men of South Cape and villages inland from Milne Bay would
    not avoid their wives' sisters, and that a man might marry two sisters in those
    places.
  category: relationship
  evidence_refs:
  - ev:6
