canonical_text:
  quote: ''
  summary: 'Ethnographic description of Southern Massim/Bartle Bay death and burial
    customs: grave watching by gariauna, food restrictions and gifts, spouse and community
    mourning, kimta gestures, recited charms for the dead, grave goods, body preparation,
    bier procession, burial orientation toward clan origin, and removal of objects
    not buried.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After interment, the gariauna remain by the grave for five to ten days, sleep
    on or beside it, and use the grave shelter when it rains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food for the grave watchers is supplied by the dead man's brothers, near relatives
    of his totem, or other kinsmen if those relatives are unavailable.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the grave watch, the gariauna drink no water, receive only a little
    heated coconut milk, and are supposed to eat only small amounts of yam and other
    vegetable food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the grave watch ends, the gariauna bathe in the sea, return to their
    own houses, continue to receive food from the dead man's wife and children, and
    receive a kanekapu feast present that is divided among them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A wife supports the head of her dying husband on her lap, and a husband performs
    the same office for a dying wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A dying man is visited by his kimta mates, and members of the community and
    kimta mates from neighbouring communities come to the dead man's house door and
    wail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage notes a mourning cry, au eda, glossed in the note as possibly
    meaning the child or person cared for or nursed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eyes of the dead are not closed by mourners; the explanation given is
    that they close by themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man's kimta mates stand beside his body, grip the corpse's nose between
    finger and thumb, slide their fingers down the nose, and say kapore au kimta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After death, the father of the deceased, or failing him a son or brother,
    recites a spell by the body or outside the house; the spell is usually a garden
    charm, but may be a spear or fish charm for a warrior or fisherman.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The cited informant note says the spells repeat taro, pig, and wallaby pari
    to instruct the dead man in what he needs and so that he can take pari to the
    spirit world, while also noting uncertainty about whether the spirit needs them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Formerly, burials took place near the deceased's house; upright stones were
    placed at the head of the grave, broken objects were put on the grave, ornamental
    trees were planted there, and a hut was generally built over it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Members of the deceased's family blacken the corpse's face, draw lines across
    prominent features, and place many ornaments upon the body.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: After painting, the body is placed outside the house on its back on a sleeping
    mat while a woman supports the head and the grave is dug.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The grave is dug by gariauna, who may be brothers, cousins, or sisters' children
    of the deceased, with assistance from kimta mates or clan members; the digging
    stick is thrown away in the bush.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The wife lies beside the body, embraces it, and weeps quietly without asking
    why her husband left her.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: When the body must be carried to the grave, it is placed on a wooden bier
    called ratirati, lying on its side in a position compared to a foetus in utero.
  category: object
  evidence_refs:
  - ev:15
- id: obs:18
  text: The gariauna act as bearers, no one precedes the bier, and the community and
    relatives follow it to the grave.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: The body is buried on its side, with the head toward the legendary place of
    origin of the dead man's clan and a dish of food near the corpse's face.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:20
  text: At the grave edge the gariauna remove ornaments and objects not to be buried;
    these are later taken to their houses without special ceremony because no infection
    is attached to them.
  category: action
  evidence_refs:
  - ev:17
