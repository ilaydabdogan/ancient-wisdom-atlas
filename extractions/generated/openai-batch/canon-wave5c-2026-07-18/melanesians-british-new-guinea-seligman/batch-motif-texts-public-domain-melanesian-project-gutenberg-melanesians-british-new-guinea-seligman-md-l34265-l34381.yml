candidate_motifs:
- id: motif:1
  label: Graveside vigil with mourning austerity
  taxonomy_refs: []
  basis: The gariauna spend five to ten days at the grave, sleep there, abstain from
    water, and eat restricted food.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an ethnographic ritual pattern rather than a mythic narrative
    episode.
- id: motif:2
  label: Funerary food provisioning and distribution
  taxonomy_refs:
  - sacred_exchange
  basis: Specified kin feed the grave watchers, and the gariauna receive and divide
    a kanekapu feast present of vegetables and pig flesh.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy label is broad; the passage describes ritualized kin exchange
    but does not describe a divine transaction.
- id: motif:3
  label: Spells instructing or accompanying the dead to the spirit world
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage reports that pari are recited to instruct the dead man in what
    he needs and so that he can take pari to the spirit world.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage itself says the matter is hazy and does not give a detailed
    route, map, or stages of an afterlife journey.
- id: motif:4
  label: Grave goods and food placed with or near the dead
  taxonomy_refs: []
  basis: Broken objects are put on the grave, and at burial a dish of food is placed
    near the corpse's face.
  evidence_refs:
  - ev:10
  - ev:16
  confidence: medium
  cautions: The passage does not explicitly state the purpose of the grave goods or
    the food.
- id: motif:5
  label: Burial oriented toward legendary clan origin
  taxonomy_refs: []
  basis: The corpse's head is placed in the direction of the legendary place of origin
    of the dead man's clan.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: No explicit explanation is provided for the orientation, so no return-to-origin
    interpretation is asserted.
- id: motif:6
  label: Fetal-position burial posture
  taxonomy_refs: []
  basis: The body on the bier lies on its side in a position compared to a foetus
    in utero, and it is buried on its side.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage makes the fetal comparison literally but does not interpret
    it as rebirth or a death-rebirth motif.
- id: motif:7
  label: Companion mourning gesture and affectionate formula over the corpse
  taxonomy_refs: []
  basis: Kimta mates perform a nose-touching/sliding gesture and say kapore au kimta,
    a phrase associated in the passage with affection and commiseration.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The meaning is reported as partly untranslatable; interpretation should
    remain close to the passage.
comparison_claims:
- id: claim:1
  claim: The passage reports a perceived functional parallel between the pari spells
    and a burial service, since the pari are said to bless or comfort the spirit.
  claim_level: same_function
  target: burial service, as named in Mr Newton's note
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: The referenced burial service is not otherwise defined in the passage,
    and the same discussion says it was uncertain whether the dead person's spirit
    needed the pari in the spirit world.
