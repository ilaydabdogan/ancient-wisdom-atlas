canonical_text:
  quote: ''
  summary: 'An ethnographic account describes the koriko feast at Hohodai in October
    1904: men gather bananas, yams are added, elders and named supervisors divide
    the food into karoa shares, these shares are distributed to neighboring villages
    and consumed by men, and Ahuia''s drawing of the ceremony is described.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All iduhu of the village take part in the feast; men alone gather bananas
    and pile them in heaps called teri in front of the house of an iduhu rohi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hohodai example, about 100 bunches of bananas were arranged in eight
    heaps in the village street, and a large number of yams were piled on the verandah
    of the house where Taubada and Ahuia lived.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The yams had portions removed as planting eyes; those portions were to be
    planted later, while the yams themselves were to be distributed with the bananas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Every man contributes some yams, but the account states that not all seed-yams
    for the next crop, nor necessarily the last yams of the year's crop, are distributed
    at the koriko.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After deliberation by old men, the teri were divided into smaller heaps called
    karoa under the supervision of Taubada and Ahuia, and yams were added to each
    karoa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The karoa were distributed among neighboring villages; Hanuabada and Tanobada
    received karoa by a modern local exception and gave sago rather than return karoa.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hohodai youths carried karoa to recipients' villages and left one on the verandah
    of each iduhu rohi, where the bananas and yams would be cooked and eaten by the
    men of the village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Food retained at Hohodai was to be cooked on the verandah of the house where
    Taubada and Ahuia lived and eaten by all the men of Hohodai.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ahuia's drawing of the koriko ceremony showed sugar-cane uprights, heaps of
    yams and bananas, and open pots called nau; the observer notes uncertainty about
    the pots' contents and adds that no sugar cane or boiled vegetables were distributed
    at the observed koriko.
  category: object
  evidence_refs:
  - ev:7
