  summary: Ethnographic discussion of magic and sorcery in the Roro-Mekeo region.
    The passage describes secrecy around sorcery knowledge, colonial legal pressure,
    the warfare-linked paiha chiefs and their clubhouses, the attribution of untimely
    death to sorcery, generally familiar relations between villagers and sorcerers,
    protective functions assigned to local sorcerers, inheritance of sorcery power,
    and cases where sorcerers were driven out or killed after alleged interference
