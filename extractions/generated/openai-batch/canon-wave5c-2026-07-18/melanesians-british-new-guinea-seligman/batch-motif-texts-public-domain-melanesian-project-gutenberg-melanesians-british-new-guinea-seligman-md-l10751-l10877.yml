canonical_text:
  quote: ''
  summary: The passage describes Kolta beliefs about malicious localized mythical
    beings, especially tadti and tabu. Tabu may dwell in fresh water or bush in animal
    forms, cause illness or take a person's sua, and include named examples such as
    Hara Tabu and Agure Tabu. Hara Tabu is linked to a hill, a river-serpent legend,
    wallaby-blood precautions, and a trap in which villagers bury the snake, after
    which a hill appears. Agure Tabu haunts a water hole and requires a drinking precaution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kolta are said to believe in several mythical beings with varied outward
    characteristics, generally described as malicious.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The beings called tadti inhabit definite areas, and some have limited spheres
    of influence; their places are identified through sickness, death, or severe sores
    after human contact with those areas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fits and convulsions called inunu are attributed to the agency of tabu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tabu may exist in fresh-water springs as starfish or crabs, or in the bush
    as snakes; they are described as having no sua and an indefinitely long existence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Urita is described as living in wells and springs as a cephalopod or as a
    fish likened to a snake; the water of such sources is said to depend on urita's
    presence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hara Tabu is said to be immanent in a small hill near Waifana; local people
    avoid the hill, and misfortune after approaching it is attributed to the tabu's
    anger.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A club or spear made from a tree growing near Hara Tabu's hill is believed
    to inflict an especially severe wound.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When wallaby blood falls near Hara Tabu's hill, the bloodied earth, dust,
    dirt, or leaves are gathered and thrown into the river so that the tabu cannot
    use the remains to cause illness in those who eat the wallaby.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the legend of Hara Tabu, the tabu originally lived in the Laloki River,
    appeared as a huge carpet snake, claimed prawns caught by a man, pursued him,
    and then continually accompanied him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man's fellow villagers used a barbecue platform over a hole as a trap;
    after the snake rested on it, they collapsed the platform, buried the tabu, experienced
    a slight earthquake, and saw a hill arise at the spot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man who returns from the bush shaking with fever is said to have fallen
    unconscious while a tabu took his sua.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Agure Tabu water hole, drinkers must pinch a hole in the bottom of a rolled
    leaf vessel so that the tabu can fall out; otherwise the tabu may enter the drinker,
    causing swelling and death.
  category: action
  evidence_refs:
  - ev:8
