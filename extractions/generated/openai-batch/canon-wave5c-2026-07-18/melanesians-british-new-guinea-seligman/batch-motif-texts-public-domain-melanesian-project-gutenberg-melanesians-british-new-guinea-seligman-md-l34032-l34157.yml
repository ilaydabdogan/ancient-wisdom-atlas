canonical_text:
  quote: ''
  summary: The passage describes deathbed attendance, corpse preparation, grave construction,
    burial posture and orientation, mourning practices, bathing, food restrictions,
    tree-cutting, and related customs at Wagawaga, followed by a shorter account of
    sickbed visitation, medicine-man payment, and deathbed posture at Tubetube.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, a dangerously ill man from the potuma is usually moved to a child's
    house, or failing that to a brother's or sister's house, and is tended by the
    hamlet that will later eat the banahivi funeral feasts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dying man is supported in a sitting position by his wife and children or
    by brothers' and sisters' children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After death, the corpse is propped in the middle of the house; the dead man's
    wapa is cut off by his brother, and his face is painted by his sisters' children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dead man may be dressed with a clean perineal bandage, shell nose ornament,
    and shell-disc necklace if he possessed them; a dead woman is dressed in a new
    petticoat and has her face painted by her mother or sister.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: When a man or woman dies, everyone wails without regard to the deceased person's
    clan or clan-group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man's grave is dug by his sisters' children or men of his clan; a woman's
    grave is dug by her brothers or sisters' children, and a new digging stick is
    broken and used in the grave fence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The body is placed on a mat at the bottom of the grave in a squatting posture,
    enclosed by canoe planks, covered by mats, and then covered with earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the body has to be moved for burial, it is placed in a canoe and paddled
    to its destination; the deceased person's ail serve as bearers when the canoe
    arrives.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: At the grave edge, the gariauna remove ornaments from the body and keep them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The body is placed in the grave facing east with the hands under the chin,
    because facing another direction would prevent the dead person or spirit from
    reaching Hiyoyoa, the other world.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man's wife and children do not follow him to the grave, but his clan relatives
    may attend; a woman's children follow her body because they belong to her clan.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Immediately after the funeral, the gariauna, widow, and children bathe in
    the sea; the widow and children do so because they supported the dying man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After bathing, the gariauna cut down three to five of the dead person's coconut
    trees; the nuts and tree are left to rot, though the dead man's mother and sisters
    may use the leaves for certain items.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: For two or three weeks after the funeral, the gariauna observe food and drink
    restrictions, including avoiding boiled food, water, bananas, sugar cane, and
    pig until the last banahivi.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After bathing in the sea, the widow and children shave their heads and may
    move hamlet according to the death circumstances and the deceased person's sex.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: At Tubetube, a sick man is visited by clansmen who bring small food gifts;
    a medicine man may be summoned and paid regardless of the outcome.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: At Tubetube, a dying man is propped in a squatting position by his wife, first-born
    child, or mother, and this posture is retained after death until burial.
  category: action
  evidence_refs:
  - ev:12
