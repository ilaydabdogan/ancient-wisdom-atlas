  summary: The passage describes agricultural charms used for coconuts, yams, bananas,
    and garden crops, including leaves placed under coconuts, water dripped over stones
    or other charms, lists of stone and shell charm materials, touch rites for large
    yams, a counter-clockwise garden circuit with a disc charm, and incantations recorded
    for planting or crop-growth stages.
  language: English with transcribed incantation formulae
