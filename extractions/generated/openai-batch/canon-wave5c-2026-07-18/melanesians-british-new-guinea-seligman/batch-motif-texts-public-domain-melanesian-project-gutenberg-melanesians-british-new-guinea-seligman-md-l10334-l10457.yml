literal_observations:
- id: obs:1
  text: When coconuts are planted, leaves of a tree called abekeru are placed under
    the coconut; the tree is described as bearing many fruits that are not edible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yam and banana crops are said to be favorably influenced when water drips
    over certain stones or other charms and falls on seedling yams and banana suckers
    before planting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An incantation is given for repetition while the water-dripping procedure
    is performed, although the author states it was not always considered necessary.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yam stones are described as rounded, oval, or oblong, usually waterworn, and
    made from several kinds of stone; some yam charms are made from volcanic material,
    vein quartz, or hollow blisters from giant clams.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When giant-clam blisters are used as charms, they are sometimes reddened,
    and water is left in them briefly before being sprinkled on yams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: More or less spherical stones with a single projection are especially valued
    as yam charms, and dumb-bell shaped stones are described as highly prized; ownership
    of one such charm was alleged to ensure abundant and excellent yam crops without
    requiring water to drip from it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain polished elongated stones are used by touching a specially large yam;
    the yam is then stored, later found to have many shoots, and those shoots are
    planted to produce more large yams.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Banana charms in the Ballantine collection include waterworn coral, a banana-shaped
    pebble, a possible child's marble, calcite, scored limestone pieces, pebbles of
    several minerals, a netted set of metamorphic pebbles, and a collection including
    a boar's tusk, shell ornaments, resin, and iron ore.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A flattened circular disc charm of lava with a central hole has shell traces
    on its surface; water is not sprinkled on it, and a good banana crop is sought
    by walking counter-clockwise around the garden while carrying it in the left hand
    and turning it toward the garden center.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some charms are considered beneficial for everything in the garden, and their
    presence in gardens during planting time is described as sufficient for that effect.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: A garden-wide charm example consists of four pieces of resin and a spherical
    waterworn pebble in separate nets, with two echinus spines completing the charm.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Chalmers records an incantation repeated in plantations when the yams are
    just above the ground.
  category: speech
  evidence_refs:
  - ev:10
