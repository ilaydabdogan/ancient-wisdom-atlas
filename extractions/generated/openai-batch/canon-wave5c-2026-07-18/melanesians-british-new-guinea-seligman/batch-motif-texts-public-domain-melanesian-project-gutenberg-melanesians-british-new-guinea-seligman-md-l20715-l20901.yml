  summary: The passage includes a marriage table for clans of Inawaia village, based
    on Father Egidi's genealogies and prepared by N. W. Thomas. The prose states that
    a person, whether or not belonging to the ufuapie group, may make off with a girl
    without paying bride-price. It explains that liberty within the pangua rests on
    the understanding that marriage within the pangua cannot occur, and it reports
    that genealogies nevertheless show rare endogamous marriages in large clans such
    as Waiaka, with no recent cases.
