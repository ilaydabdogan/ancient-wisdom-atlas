  quote: ''
  summary: 'The passage describes Koita household composition: each house contains
    only one family, typically parents and children, sometimes with surviving older
    relatives. Bachelor or widowed siblings often live with married relatives. Household
    size is said usually not to exceed about six people, and Ahuia''s count in Hohodai
    and Guriu gives an average population per house only a little above five.'
