  quote: ''
  summary: The passage states that gambling and betting were formerly unknown among
    the Koita, but that at the time described many young and some middle-aged men
    had become heavy gamblers. The described game uses a pack of cards, with bets
    placed on the colour or suit of the card turned up. Young adults of the Koita
    and Motu tribes are said to play through the night under shelters, causing work
    disruption and a curfew-like regulation for native servants in the white settlement.
