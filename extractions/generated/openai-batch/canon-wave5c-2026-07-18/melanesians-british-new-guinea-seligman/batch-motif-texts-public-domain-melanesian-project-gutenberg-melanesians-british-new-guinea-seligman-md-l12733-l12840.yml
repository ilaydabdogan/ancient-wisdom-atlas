canonical_text:
  quote: ''
  summary: The passage classifies marea clubhouses by ordinary, battle, initiation,
    and warfare-magical uses; discusses their names and possible derivation from Mekeo
    clubhouse names; describes the marea as a male clubhouse linked to chiefs, clan
    badges, hereditary carved patterns, feasts, village discussion, sleeping, guest
    reception, danger to strangers at war-chief marea, and death exposure with mourning
    restrictions.
  language: English with local-language terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes ordinary marea connected with ovia itsipana and
    ovia awarina from battle or spear marea possessed by certain war chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some marea exist only for special functions and ceremonies; only a few clans
    have the right to build them, though all male community members use them ceremonially
    on appropriate occasions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two named special classes are artiani marea, formerly used for initiation
    ceremonies, and paiha marea, concerned with warfare in its magical aspect.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Several marea names are glossed or discussed: Burebure is connected with
    an expression meaning ungovernable or derelict; Airava means hornbill; Haurama
    means black snake; Rabi means night; Rabau or Ravau is a native name for Yule
    Island.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that some Waima marea names were derived from Mekeo clubhouse
    names, with examples including Maivauku compared with Maipa ufu and Oaibua compared
    with Oafua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Socially, a marea is described as a clubhouse whose male local-group members
    belong by right of birth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The titles ovia itsipana, chief of the right, and ovia awarina, chief of the
    left, refer to or embody positions taken on the marea verandah during important
    ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Clan badges are carved on marea posts, and boards carved with hereditary patterns
    of the high chief are hung in the marea.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ceremonial feasts are held on the marea platform, men gather there in the
    evening to chew areca nut and discuss village affairs, older men spend afternoons
    there, and ibitoe sleep in the closed inner chamber.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Strangers are received in the marea of the ovia itsipana; official visitors
    such as ambassadors are expected by etiquette to sleep there and are fed there
    for some days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the old days, a stranger who first entered a village and stepped onto the
    platform of a war-chief marea, even accidentally, was killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Dead men are exposed on the marea platform and mourned by relatives; members
    of the bereaved family are forbidden to enter the marea until after one of the
    ceremonial mourning feasts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote suggests, as a possibility, that Waima adoption of Mekeo clubhouse
    names may have been a courtesy in return for hospitality; the author also reports
    an instance of a Mekeo clubhouse being renamed after a Yokea eravo where its men
    had been hospitably entertained.
  category: relationship
  evidence_refs:
  - ev:10
