canonical_text:
  quote: ''
  summary: 'The passage contains several Wagawaga narratives or narrative fragments:
    a man poisons water so that most people die except warned kin; drums are obtained
    from people living beneath the ground and copied for dancing; a singing skull
    is taken from a village, spreads a song, and is later broken; a woman from Tanoduya
    beneath the ground is stranded above ground, marries, has children, and is buried
    under a boulder; and the opening of a story about orphan boys, their magical grandmother,
    unfair pig sharing, and exclusion from cave shelter.'
  language: English
  quote_policy: summarized
