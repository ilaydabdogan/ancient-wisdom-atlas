canonical_text:
  quote: ''
  summary: 'The passage states a sex taboo observed at Wagawaga and Tubetube during
    pregnancy and early childhood, then describes several ceremonial feasts: Wagawaga
    ogatara, sipupu, and hiwoga, and Tubetube soi. It emphasizes food preparation,
    invitations across hamlets or communities, canoe-building rites, pig-killing,
    dance, exchange, and distribution of food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga and Tubetube, cohabitation stops when a woman becomes pregnant
    and is not resumed until the child can toddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ogatara is named as a feast held before a war party starts, and the same name
    is also applied to a feast by one hamlet to which other hamlets are invited.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the non-war ogatara example, a hamlet with surplus food builds a watara
    platform and piles cooked vegetable food and areca nut panicles on it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old men from the hamlets assemble on the watara to eat and chew areca, while
    food and areca nuts may be given to visiting hamlet members.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sipupu are identified as birth feasts, but their details are referred to another
    chapter rather than described in this passage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hiwoga is a small feast made when a canoe is to be built; the future canoe
    trunk is roughly shaped in the bush and dragged to the water's edge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: For hiwoga, the canoe owner kills a pig if he has one, or otherwise provides
    vegetable food; the food is laid on the beach and a conch shell signals others
    to come for shares.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The canoe owner's hamlet helps with the canoe and food preparation but eats
    none of the hiwoga food; men from other hamlets may have helped drag the trunk.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Tubetube, the big feast called soi is held occasionally and irregularly,
    is said to correspond to the Wagawaga toreha, and is always held during the south-east
    monsoon.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before a soi, canoes go to friendly communities to buy pigs and vegetable
    food, paying mostly in Tubetube-manufactured pots and partly in currencies named
    benam and sapisapi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At soi, the night before the ceremony includes a large dance with neighboring
    communities; the next day pigs are killed and cut on the nakanaka, and coconuts,
    pig flesh, and yams are distributed to visitors and other clans.
  category: sequence
  evidence_refs:
  - ev:11
