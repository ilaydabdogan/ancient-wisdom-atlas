candidate_motifs:
- id: motif:1
  label: Revenge raid producing a captive as payment for a death
  taxonomy_refs: []
  basis: The war party sets out to exact revenge, captures one man, and the maiha
    is described as being slain in payment for the dead man.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage is ethnographic description rather than a mythic narrative;
    no supernatural agent is stated.
- id: motif:2
  label: Pre-battle feast with exhortations to courage and revenge
  taxonomy_refs: []
  basis: Before the raid, warriors eat the ogatara and speeches inciting valour and
    revenge are made.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain symbolic meaning beyond social preparation
    for warfare.
- id: motif:3
  label: Triumphal return with sound, dance, and insults
  taxonomy_refs: []
  basis: After the raid, the attackers beat drums, blow conches, dance besa, shout
    insults, and return triumphantly.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No wider mythic comparison is stated.
- id: motif:4
  label: Captive ritually wounded by the dead man’s kin before final killing
  taxonomy_refs: []
  basis: The captive must be wounded by the next of kin of the dead man, and care
    is taken not to kill him before this occurs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage calls a fatal injury at this stage a mishap, so the wounding
    is distinguished from the later killing.
- id: motif:5
  label: Gift exchange to the captor of the revenge victim
  taxonomy_refs:
  - sacred_exchange
  basis: After the maiha is dragged ashore, the next of kin gives a gudu present to
    the captor because he took the prisoner who will be maiha.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes a formal compensation/exchange, but does not explicitly
    call it sacred.
- id: motif:6
  label: Transfer of mourning signs onto the captive
  taxonomy_refs: []
  basis: A widow still in mourning is expected to transfer her mourning ornaments
    to the maiha.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states the rule conditionally and notes that the ceremony
    is omitted when the widow is no longer in mourning.
- id: motif:7
  label: Burning of captive at a tree within a cannibal-feast enclosure
  taxonomy_refs:
  - sacrifice
  basis: The victim is brought to a gahana, wrapped in dry coconut leaves, tied to
    a tree, burned, and later eaten.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is only in the broad sense of ritualized killing;
    the passage does not state an offering to a deity.
- id: motif:8
  label: Dead man’s weapons burned with the revenge victim
  taxonomy_refs: []
  basis: When possible, the spear and shield of the first man killed are preserved
    and burned with the maiha.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain the intended meaning of burning the weapons.
- id: motif:9
  label: Cannibal consumption in and around a marked stone circle
  taxonomy_refs: []
  basis: The burnt corpse is laid on a pandanus mat, cut up, and eaten partly within
    and partly without the gahana.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No cosmological interpretation is supplied in the passage.
- id: motif:10
  label: Forced witnessing of another captive’s fate
  taxonomy_refs: []
  basis: The Taupota note says that when two prisoners were taken, one would usually
    be killed and roasted before the eyes of the other.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This detail is supplied in a note attributed to Mr. Giblin and is not
    part of the main Wagawaga episode.
comparison_claims:
- id: claim:1
  claim: The passage itself reports that the described Wagawaga revenge-captive and
    cannibal-feast pattern would also apply to Taupota villages.
  claim_level: same_motif
  target: Taupota villages near Chad's Bay
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is secondhand within the passage and adds Taupota-specific
    torture details rather than giving a full independent description.
