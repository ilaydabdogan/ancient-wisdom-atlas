canonical_text:
  quote: ''
  summary: The passage describes a revenge war party led by Rerenia, including a pre-raid
    feast and exhortations, a night attack that captures one man, triumphant return
    with drums and conches, staged wounding of the captive by warriors and the dead
    man’s kin, a compensatory gift to the captor, possible transfer of mourning ornaments
    from a widow to the captive, execution by burning at a cannibal-feast stone circle
    with a tree, and the cutting up and eating of the corpse. Notes add clan rules
    for the war leader and a Taupota parallel with additional torture details.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before departure, warriors were exhorted to be courageous and to seek revenge,
    while the leader of the war party did not make a speech.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rerenia of Wagawaga Pupuna hamlet was leader of the war party and taniwaga,
    or master of the feast; he alone killed pigs, while others contributed vegetable
    food.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:11
- id: obs:3
  text: The ogatara feast was eaten on the lower platform of a potuma by warriors
    except Rerenia, who ate only in his own house; women and children sat around but
    did not take part.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The war party left near sundown fully armed, carrying drums and shell conches,
    and travelled in ten canoes to the Maivara river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The attackers landed quietly, surrounded and rushed a potuma, and captured
    one man after the other inmates escaped.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The captive was bound and placed in a canoe, and the attackers withdrew to
    avoid counterattack.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At daylight the attackers beat drums, blew conches, danced besa, shouted insults
    toward Maivara men on shore, and returned to Wagawaga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Wagawaga the captive was thrown into shallow water, speared by as many
    warriors as could reach him, and dragged ashore, while care was taken not to kill
    him at that stage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The next of kin of the dead man whose death was being avenged was expected
    to wound the captive; Bakaiya, the dead man’s brother, slashed him across the
    shoulder with a tomahawk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the maiha was brought ashore, the next of kin made a gift called gudu
    to the captor; Bakaiya paid Rerenia several named valuables and goods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the dead man left a widow still in mourning, she was expected to transfer
    her mourning ornaments to the maiha.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The victim was dragged to a stone circle called gahana, reserved for cannibal
    feasts, wrapped in dry coconut leaves, lashed to a tree, and burned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that a tree, usually a coconut tree, always stood in these
    gahana.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: When possible, the spear and shield of the first man killed were preserved
    and burned with the maiha.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The burnt corpse was laid on a pandanus mat, cut up, and eaten partly inside
    and partly outside the gahana.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A note attributed to Mr. Giblin says the same description would apply to Taupota
    villages, with added details about one prisoner being killed before another and
    burning splinters inserted into a victim’s flesh.
  category: other
  evidence_refs:
  - ev:10
