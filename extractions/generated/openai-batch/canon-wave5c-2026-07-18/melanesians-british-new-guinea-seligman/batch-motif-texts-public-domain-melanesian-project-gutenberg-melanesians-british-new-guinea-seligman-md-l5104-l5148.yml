literal_observations:
- id: obs:1
  text: A man may send away his wife for infidelity or severely beat her; if he discovers
    her with a lover in flagrante delicto, he may kill both, but otherwise may divorce
    her and seek damages from the lover.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The usual procedure sends the wife to her lover with a request for the amount
    of marriage price, called damu, previously paid for her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The adultery price is called laraha, is compared in the passage to a payment
    made for a widow, and must be paid by the lover, with possible help from his local
    group.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Only part of the laraha paid by the lover is kept by the aggrieved husband;
    the rest is shared among his clansmen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A divorced woman may live with her lover if he is unmarried, or if his wife
    does not object; she may also return to her own folk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After divorce, children generally remain with their father, with possible
    exceptions for very young children and conditional return or clan affiliation
    of boys and girls.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Barrenness is not presented as a cause of divorce, while bad temper and idleness
    on the part of a woman may lead to divorce.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a girl runs away from her husband because of his infidelity and does not
    return shortly, her father must hand back the damu paid by the husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Vanitau left her husband two months after marriage, lived with her own folk,
    and resumed her maiden iduku.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ahuia Ova said Vanitau was justified because her husband did not cohabit with
    her, avoided her, and refused to eat food she had cooked.
  category: speech
  evidence_refs:
  - ev:7
