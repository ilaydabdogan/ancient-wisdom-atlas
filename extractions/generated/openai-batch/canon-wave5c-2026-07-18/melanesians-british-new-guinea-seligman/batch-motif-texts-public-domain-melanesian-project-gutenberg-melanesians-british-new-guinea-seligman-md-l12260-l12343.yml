canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of doubtful oaoa/dada: group-restricted canoe
    names, badges, named dances, nets, bows, arrows, and spears among Roro, Paitana,
    and Waima groups, including reported purchase or theft of names from Motu and
    Toaripi and naming after animals, thorny plants, or weapon medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Carvings on viarea and feather headdresses used in ceremonial dances are described
    as important clan-badges.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some customs and methods of performing common acts are peculiar to certain
    groups and are broadly regarded as dada, though the passage says they may shade
    into matters that are not oaoa.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each itsubu or local group of the Roro and Paitana tribes is said to seem
    to have an exclusive right to a particular canoe name, with all its canoes called
    by the same name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Waima, each settlement's common canoe name is limited to that settlement's
    canoes and is associated with a particular sign or badge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many Waima canoe names are names of fish, and some are names of birds; examples
    include pehera, nepuwai, and inanukai.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that most canoe names were said to have been bought or
    stolen from the Motu, and notes a possible resemblance between the canoe name
    veregai and the Motu word vanagai.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Use of canoe names by people of foreign itsubu would be resented; the passage
    also says dances were strictly group property or copyright.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fishing nets are named among Roro-speaking tribes, and the author believes,
    without certainty, that these names are private rather than family property.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Waima there are bow and arrow names that are not strictly private property,
    may be bought, sold, or stolen, and may or may not be regarded as dada.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bow and arrow names are usually derived from fish with sharp spines, thorny
    trees or plants, or medicine rubbed on arrows to make them deadly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The bow is said to have been introduced into the Roro district from the neighborhood
    of Toaripi, and bow and arrow names were said to have been bought or stolen from
    the Toaripi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Spears may be given names from medicine rubbed on them to make them go straight;
    successful bow, arrow, and spear names may be bought.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Spear names appear to be individual rather than common to all spears of a
    family, local group, or itsubu.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Boborabi is given as a spear name derived from medicine and is also said to
    be the name of the paiha marea of the Arabu Kupunu settlement of Waima.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
