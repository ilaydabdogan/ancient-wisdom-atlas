canonical_text:
  quote: ''
  summary: 'The passage describes relations among named social ranks and groups: bahada
    or babada direct laralaraga labor and provide feasts; canoe gifts are distributed
    after launch visits; Gelaria clans have taniwaga head men; etiquette toward a
    gulau requires distance, bent posture, low speech, and property restrictions;
    helpers work a chief''s garden and receive a feast; and a hunter gives specified
    parts of a wild pig to a gulau and some flesh to a taniwaga. The line range also
    includes plate captions for a Maivara house and house carving.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bahada tell laralaraga what work they want done and direct them; after the
    work is finished, a bada probably provides a feast for the laralaraga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a new canoe is made and launched, the laralaraga take it to visit different
    places, people give presents, and the presents are distributed among those who
    worked on the canoe, while the bada retains some and gives some to his children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Babada expect laralaraga to help in garden work and house-building; the passage
    says laralaraga do nearly all the house-building work and receive a feast after
    special work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each Gelaria clan is said to have a taniwaga or head man, and the taniwaga
    of clan Garuboi is described as gtilau of all Gelaria.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Yauyau, and also said to apply to Wamira, a man keeps some distance from
    a gulau unless he wants to speak to him, and when passing he probably turns his
    face toward him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When speaking to a gulau, a man approaches with neck or body somewhat bent
    and speaks in a low voice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man does not touch a gulau's property unless specially directed to do so.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A gulau does not eat in public and does not pass his lime pot to commoners;
    to other gulau he uses an inclusive plural expression for the lime pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A taniwaga passes his gulau guardedly and does not look back or turn his head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The heavy work of making a chief's garden is mostly done by near relatives;
    the chief may stand and watch, his wives do their share, and other men help because
    their own gardens are expected to be good if they do so; present custom requires
    the chief to make a small feast for helpers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A man who kills a wild pig presents his gulau with all or part of the head
    and with meat from the flank or belly; his taniwaga also receives some flesh,
    but no specially reserved part.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage includes plate captions identifying a house at Maivara, Milne
    Bay, and a carving on a house at Maivara.
  category: object
  evidence_refs:
  - ev:6
