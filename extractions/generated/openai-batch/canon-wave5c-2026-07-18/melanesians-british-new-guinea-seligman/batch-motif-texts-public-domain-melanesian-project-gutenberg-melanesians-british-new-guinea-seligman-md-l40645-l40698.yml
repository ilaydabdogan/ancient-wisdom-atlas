  text: Children may be affianced in childhood, sometimes at eight or nine years old
    or younger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy’s mother makes a dress of banana leaves and offers it to the mother
    of the prospective child-bride.
  category: action
  evidence_refs:
