- id: obs:4
  text: Parents often consult their children before betrothal, but consultation is
    not described as necessary.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: If one betrothed person dies, the survivor is almost certainly consulted before
    a new spouse is chosen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Marriage is initiated when the bridegroom’s people tell the bride’s people
    that the children are old enough to marry.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: After repeated notification, the boy takes the bride to his father’s house,
