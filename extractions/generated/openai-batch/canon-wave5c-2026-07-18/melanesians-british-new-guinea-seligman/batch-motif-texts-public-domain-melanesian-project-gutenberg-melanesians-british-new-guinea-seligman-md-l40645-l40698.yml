canonical_text:
  quote: ''
  summary: 'The passage describes Mukaua and Bogaboga betrothal and marriage customs:
    childhood affiance by acceptance of a banana-leaf dress, later marriage initiated
    by the bridegroom’s people, gifts to the bride’s people, residence in the husband’s
    village, rules and practices concerning land use, widow residence, children’s
    residence, and houses for additional wives.'
  language: English
  quote_policy: summarized
