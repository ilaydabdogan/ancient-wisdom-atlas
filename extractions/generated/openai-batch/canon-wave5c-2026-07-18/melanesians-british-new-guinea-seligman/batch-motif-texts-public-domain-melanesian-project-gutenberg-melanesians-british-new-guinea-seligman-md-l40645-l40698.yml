  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: At marriage a woman comes to live in her husband’s village.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: If the wife’s land is near the husband’s land, the husband works in both his
