canonical_text:
  quote: ''
  summary: Ethnographic account of Wagawaga and Tubetube avoidance of dead persons'
    names. The passage describes taboo on speaking names of the dead, social offense
    caused by name-mention near relatives, name-changing among people named after
    elders, replacement of ordinary vocabulary resembling the deceased's name, and
    examples involving objects, birds, songs, pig tusks, and analogical reference
    by shark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, the names of dead persons become taboo immediately after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avoidance of a dead person's name can remove that name or related words from
    the common spoken language while memory of the dead person lasts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that words may be permanently lost or later revived with
    modified or new meanings because of this name avoidance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mentioning the name of a man's dead father or paternal uncle in his presence
    is described as a deadly insult, and mentioning a dead spouse's name before the
    surviving partner is described as especially unfriendly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deceased person's name is especially avoided in the hamlet to which the
    deceased belonged, apparently because relatives might be offended or insulted.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Children are usually named after a maternal uncle or aunt, and this naming
    practice produces repeated name-changing when an eponym dies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One example describes a child first named Israela, then called Ipunesa after
    the uncle Israela died, with another name-change expected when Ipunesa dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another example describes a man formerly named Botuau, the name of a bird,
    who dropped that name after his ail died and took the song-name Poliwarutu; the
    passage states that Poliwarutu will be dropped from local speech after his death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: New names given after the death of an eponym are often names of common-use
    objects, and if a person bearing such a name dies the object's name must also
    be replaced.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Foreign words and pidgin-English are used as substitute names, including examples
    where a bush-knife is called 'go-to-hell' and a coconut water vessel is called
    'finish.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The custom of replacing words resembling a deceased person's name is called
    polo la in the passage.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: If a child or stranger inadvertently repeats a dead person's name, someone
    hushes the speaker; if a similar-sounding word is spoken, the speaker is told
    the new word.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In one example, after a man named Binama died, people of Taupota adopted ambadina
    as the new name for the hornbill.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Tubetube, as at Wagawaga, no man's name is mentioned after death, and name-changing
    is common because people are often named after elder clansmen.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Tubetube example states that after Mwakasoki dies, a pig's tusk will be
    called dojia, his real name Waiaga will be dropped for the song it names, that
    song will be called karagado, and he may be referred to as shark if needed because
    a shark also has large teeth.
  category: sequence
  evidence_refs:
  - ev:6
