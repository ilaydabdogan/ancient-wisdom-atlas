canonical_text:
  quote: ''
  summary: 'The passage describes several Southern Massim valuables and ceremonial
    objects: bone lime spatulae, Louisiades gabaiera spatulae or dance objects, dona
    pig-tusk ornaments and shell imitations, and benam ceremonial axe blades. It records
    materials, places of manufacture and circulation, value criteria, named individual
    stones, and uses of benam in exchange, marriage payments, conflict settlement,
    sorcery procurement, death rites, harvest display for departed spirits, burial
    with the dead, and concealment to prevent inheritance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large and finely made potuma are described as showing no signs of use for
    eating lime and are regarded by the author as ceremonial, while smaller potuma
    are used freely.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gabaiera occur in the Louisiades; small examples are used as lime spatulae,
    while large examples are held by women while dancing or perhaps only by married
    women.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gabaiera form part of the bride-price on Tagula and perhaps on other islands
    of the group.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dona are ornaments made from a pig tusk grown into a spiral or near circle,
    and they may be imitated by circular shell objects cut from giant clam shell or
    cone shell.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Benam are ceremonial axe blades that must be highly polished and too large
    and thin to be used as tools.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Benam are said to have been made on Murua from stone obtained near Suloga;
    the craft is described as extinct.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The value of benam varies by size, thinness, workmanship, and the presence
    of light bands, mottling, or streaks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Trobriands, different names are applied to benam according to excellence,
    and the best stones are individually named.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Several named blades are said to preserve names of trees, a fern, a man's
    name, hot water, a midden or heap of dirt, and incidents during manufacture.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Benam are used to buy pigs, food, canoes, land, dances, and other wealth;
    they are also used to procure sorcery or the death of an enemy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Benam are used to pay for people slain in battle, appease an enemy, and make
    peace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Benam are used as gifts to the relations of a woman whom a man wishes to marry.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Benam are placed under the head and on the breast of the dying to appease
    Topileta, described as keeper of the ways in the underground world of spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At great harvest rejoicing and dancing, benam are brought out so that spirits
    of the departed may see and be glad.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Benam are sometimes buried with the dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Benam are kept buried, and a man near death may hide them so that no one will
    inherit his wealth.
  category: action
  evidence_refs:
  - ev:10
