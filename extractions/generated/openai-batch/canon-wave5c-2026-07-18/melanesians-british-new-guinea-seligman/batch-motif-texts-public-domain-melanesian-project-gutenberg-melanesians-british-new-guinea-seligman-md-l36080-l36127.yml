  summary: The passage reports that no information was obtained at VVagawaga or Tubetube
    about living beings associated with the sun, moon, or stars. For Rogea, it records
    Eaboahine as a man living in the moon, with an untranslated prayer used when a
    war party starts on a cannibal raid. It also reports a Boianai response to a lunar
    eclipse in which villagers and animals screamed from fear, and villagers said
    the screams of dogs and pigs frightened away the "devildevil."
  language: English; includes an untranslated local-language prayer text
