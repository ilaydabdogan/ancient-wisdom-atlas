canonical_text:
  quote: ''
  summary: 'The passage describes Roro-speaking clan badges called dada: who may wear
    or display them, how the term can also designate European institutional signs,
    the principal forms of the badges, animal-derived designs and objects, and the
    absence of special food avoidance toward animals represented by a clan badge.'
  language: English
  quote_policy: summarized
