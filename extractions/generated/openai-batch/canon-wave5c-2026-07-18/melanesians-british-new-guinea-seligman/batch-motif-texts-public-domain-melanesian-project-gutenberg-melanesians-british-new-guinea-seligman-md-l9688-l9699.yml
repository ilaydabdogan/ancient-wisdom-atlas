canonical_text:
  quote: ''
  summary: 'The passage describes a mourning custom in which relatives and friends
    sleep in the dead man''s house, said to express sympathy for the widow left alone
    by her husband''s death. It then notes a changed practice under government-required
    burial in a recognized graveyard away from the village: the grave is lightly thatched
    against rain, no one sleeps on or near it, and relatives sleep in the dead man''s
    house. The change is attributed to government influence and fear of being far
    from the village.'
