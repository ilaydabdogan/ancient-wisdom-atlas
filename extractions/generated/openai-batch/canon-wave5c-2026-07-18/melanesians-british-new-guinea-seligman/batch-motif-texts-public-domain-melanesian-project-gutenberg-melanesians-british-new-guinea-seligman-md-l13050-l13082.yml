canonical_text:
  quote: ''
  summary: 'The passage describes part of the inauguration of a marea: pigs are killed,
    cut up, and assigned as named portions; women cook and carry food; visiting chiefs
    eat while local chiefs refrain; areca nut is distributed; later yams and bananas
    are arranged as wakaro, inspected, and assigned by the feast-giving chief with
    a banana haulm; an evening dance may follow.'
  language: English
  quote_policy: summarized
