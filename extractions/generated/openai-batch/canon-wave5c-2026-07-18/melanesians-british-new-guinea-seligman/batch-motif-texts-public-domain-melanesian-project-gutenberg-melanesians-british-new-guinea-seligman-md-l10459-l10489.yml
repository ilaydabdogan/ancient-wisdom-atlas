canonical_text:
  quote: ''
  summary: The passage describes hunting charms made from odoriferous or strong-tasting
    bark, sometimes mixed with food and fed to hunting dogs before pig, wallaby, or
    cassowary hunts. Mullet pieces may be added for their quick and strong jumping.
    Ahula attributes some charm-bark knowledge and supply to men of the Papuan Gulf.
    Other hunting charms include stomach stones applied to dogs' teeth, a pig bone
    worn in an arm band, and charcoal face-blackening before wallaby hunting.
  language: English
