canonical_text:
  quote: ''
  summary: 'The passage reports accounts of Koita/Koitapuan weather influence and
    weather charms: drought and bad hiri weather are blamed on Koitapuans, leading
    to retaliatory killings; an old sorcerer is said to have dug up a rain-and-crop
    charm of pottery and stones; and Chalmers records a Koitapuan sacred place, Varimana,
    where a dangerous buried stone or stones associated with a tree, Mabata the chief-sorcerer,
    and offerings were treated as powerful.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Koita/Koitapuans are described as being supposed to prevent rain and influence
    weather over a considerable distance of coast line.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a prolonged drought, a Koitapuan village was said to be the cause;
    a Motu party went there, killed about eight or ten people, and rain followed soon
    afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During a returning hiri voyage, the sea became rough and sago was thrown overboard
    to save the canoes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Hood Point tribe, angry at the reduced sago share, killed the first man
    who passed outside the Koitapu village and said this avenged the bewitching of
    the canoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Romilly is reported as mentioning an old Koita sorcerer digging up a powerful
    spirit or charm said to produce rain and abundant crops.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The charm in Romilly's account consisted of a fragment of pottery and two
    small round stones from the river, apparently iron nodes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Varimana is described as a bush place near Port Moresby sacred to the Koitapuans,
    where treading is said to cause instant death.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A story says mighty men carried a very large stone from Sogeri; many died
    on the way, the stone was left at Varimana, later carried to Koiari where many
    also died, and then returned and buried at Varimana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The stone was buried close to a young tree; the tree grew very large and covered
    the stone, which had been wrapped in native cloth and bound with twine before
    burial.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the grass near the tree was to be burned, Mabata cleared a wide space
    so that fire would not approach the tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mabata's threat to dig up the stone and turn it over was said to terrify the
    Motu and bring him many large presents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When Mabata dug near the tree, he found earthenware pot pieces covering two
    small pebbles; after persuasion and tobacco left as a present for the spirit,
    the objects were carried away by the quoted narrator.
  category: sequence
  evidence_refs:
  - ev:6
