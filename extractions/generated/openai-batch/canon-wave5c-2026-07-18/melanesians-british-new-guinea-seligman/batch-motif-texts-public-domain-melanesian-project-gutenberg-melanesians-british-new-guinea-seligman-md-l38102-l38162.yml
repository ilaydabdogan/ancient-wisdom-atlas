  text: In 1904 Krupan settlement had eight men in six houses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three Krupan men had crow and shark as totems, while five had lory and turtle
    as totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three crow-totem Krupan men were married to women whose totems are listed
