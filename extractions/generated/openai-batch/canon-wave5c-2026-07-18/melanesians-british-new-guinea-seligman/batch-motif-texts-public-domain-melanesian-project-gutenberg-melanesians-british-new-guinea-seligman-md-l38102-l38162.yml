  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The five lory-totem Krupan men contracted marriages with women of flying fox,
    crow and cockatoo, and Torres Straits pigeon and gudowara fish totems; one of
    the men had been married twice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Captain Barton's Murua list gives linked totems including Torres Straits pigeon
