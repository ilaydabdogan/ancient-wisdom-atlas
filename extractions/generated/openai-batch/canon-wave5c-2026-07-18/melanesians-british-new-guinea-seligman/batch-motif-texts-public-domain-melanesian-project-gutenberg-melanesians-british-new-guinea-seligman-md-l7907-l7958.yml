canonical_text:
  quote: ''
  summary: 'The passage describes practices for a person who has killed another: leaving
    the victim''s blood to dry on the weapon, ritual bathing, seclusion, restrictions
    around women, use of a bone fork, temporary residence in a bush shelter, making
    and wearing a new sihi, participation in a bago dance, and eventual return from
    the aina condition. It also lists decorations and tattoo marks associated with
    homicide, varying by the victim''s sex, and records a belief that a killer may
    waste away because of contact with the victim''s blood as the corpse decays.'
  language: English
  quote_policy: summarized
