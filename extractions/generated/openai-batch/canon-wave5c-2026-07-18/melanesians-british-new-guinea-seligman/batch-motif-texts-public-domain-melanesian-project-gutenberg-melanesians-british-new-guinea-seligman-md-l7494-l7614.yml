canonical_text:
  quote: ''
  summary: The passage describes warfare among Koita/Koitabuan, Kabadi, Doura, Lealea,
    Manumanu, and related groups. It emphasizes night or dawn attacks on villages,
    revenge killings, alliances, looting, burning, peace proposals, exchange of presents,
    and market-related restraints on participation in conflict.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Western sections of the Koita, especially Arauwa and Rokurokuna, are described
    as formerly engaged in almost continual warfare with Kabadi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The usual inter-tribal fighting method described is quiet night encirclement
    of a village, an attack at dawn, killing inhabitants regardless of age and sex,
    and looting and possibly burning the village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Naime, the old chief of Manumanu, warned Chalmers not to proceed because Lokurukuna
    Koitabuans had gone to avenge earlier deaths caused by Dourans, and Douran bodies
    had floated down the stream.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dourans are described as living away from their villages and keeping watch
    after the attack, while the Koitabuans were willing to make peace and the Dourans
    outwardly pretended to want peace while intending revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kabadi are described as friendly with the Doura and at bitter enmity with
    the Koitabu tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kabadi attacked Lealea after a western sago trading expedition had gone,
    in revenge for the murder of one or two youths, and killed many women and children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the return of the trading canoes, the crews grieved and the Koitabuans
    with the Lealeans resolved on severe revenge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Koitabuans from several villages, led by Lealeans, surrounded Matapaila early
    in the morning while inhabitants were asleep, killed men, women, and children,
    plundered the village, and set fire to it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Refugees from Matapaila carried news to other villages, whose men then surrounded
    the rejoicing victors; only two escaped, and constant war followed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Dourans seeking revenge went to the Kabadi with pigs and other items and found
    Maimearua of Keveo to be a willing ally.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Manumanuans stayed out of the conflict, waiving grievances for peace and friendship
    and because they feared Port Moresby natives would close the Kabadi market and
    retaliate against them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Dourans selected two Lokurukuna villages for revenge; Kabadi joined them in
    the river, and the united forces travelled in two large canoes down a creek, landed,
    surrounded both villages before sunrise, and began killing and plundering.
  category: sequence
  evidence_refs:
  - ev:11
