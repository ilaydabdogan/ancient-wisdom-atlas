canonical_text:
  quote: ''
  summary: The passage describes the Wagawaga toreha, a large post-mortuary feast
    held after death-related obligations have ended. Preparations include building
    new houses, dancing, collecting pigs, vegetable food, and firewood, and constructing
    a watara platform. In the Kanabwahi example, Woka directed the feast; visitors
    entered with a mock assault after conch shells were blown, and food portions were
    distributed from the platform by calling recipients' names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A toreha is described as a big feast normally held about a year after a death,
    but it is delayed until pending banakivi obligations are over and until about
    a year has passed without further deaths in the hamlet-group.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One toreha can serve for all deaths in the community since the previous toreha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the feast, new houses are built in the hamlet giving the feast, with
    help from the whole hamlet-group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male guests sleep in the potuma, while female guests sleep in the women's
    half of the new houses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: During house-building, youths and girls spend much of each night dancing;
    the passage describes men forming an inner circle while girls move clockwise,
    or girls performing damorea with ceremonial stone axes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Care is taken to finish the houses two or three days after a new moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The community collects pigs and garden produce; women of the host hamlet gather
    vegetable food and stack it in the new houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: People from other hamlets who give or lend a pig receive a small present called
    piyo, consisting of two or three pots of vegetables.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Young men collect firewood, which is cut, stacked, and used for cooking vegetables
    given away as piyo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Pigs for the feast are caught and secured under the houses, then killed, singed
    with burning coconut leaves, and cut up on the seashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A platform called watara is built on the day the pigs are killed; vegetable
    food is heaped on it, and cut-up pig meat is taken to it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the Kanabwahi example, Woka directed affairs and was called tankwaga, chief
    of the feast or master of ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the morning of the Kanabwahi toreha, men of the other Wagawaga hamlets
    blackened themselves and put warlike feathers in their hair for the mock assault
    called waiapa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kanabwahi men blew conch shells when they were ready to receive the visitors;
    the passage identifies this as the beginning of the ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The visiting men rushed Kanabwahi, threw spears and stones while trying not
    to injure the hosts, and thrust spears into the houses and the watara.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Kanabwahi men mounted the watara and distributed pig flesh by throwing portions
    to the ground while shouting the intended visitor's name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The named recipient takes no notice, and another person, often a younger man,
    picks up the food for him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Pig flesh, taro, and other vegetable food are distributed as portions called
    yope; all visitors receive portions, and important men may receive two or three.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: The gariauna and those who have exchanged banahivi and melum receive yope
    like other people, without special increase or decrease.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: Visitors from neighbouring hamlets do not dance at the toreha, but carry the
    presented food to their own hamlet, where it is cooked and eaten.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: A footnote says that the caller may add remarks about a recipient's character
    or conduct, and that such insults could be avenged; it gives a Divari example
    where a village was burned and feast-givers were killed after an insulting remark.
  category: speech
  evidence_refs:
  - ev:9
