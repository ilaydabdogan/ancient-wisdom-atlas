  quote: ''
  summary: The passage describes bodily modesty among people of the south-eastern
    district, then reports local attitudes and practices around homicide, cannibalism,
    sorcery, vengeance, captive treatment, adoption, and compensation for wounds or
    deaths arising from brawls or accidents.
  language: English
