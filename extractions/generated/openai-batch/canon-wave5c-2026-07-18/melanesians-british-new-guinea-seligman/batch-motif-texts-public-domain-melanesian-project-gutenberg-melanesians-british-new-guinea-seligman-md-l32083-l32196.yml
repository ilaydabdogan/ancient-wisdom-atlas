literal_observations:
- id: obs:1
  text: People in the visited parts of the south-eastern district are described as
    modest in behavior, with no indecent gesture observed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are described as keeping the perineal bandage on while bathing and being
    ashamed to remove it even before a kinsman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are described as equally particular and said never to strip before one
    another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that homicide is judged by whether the slain person was
    a friend or whether reprisals were feared, rather than by a general feeling against
    homicide.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Foeticide and infanticide are described as common or formerly common, with
    some reason given to believe that infants were sometimes killed to be eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Strangers, castaways, and straying bushmen are described as formerly being
    killed and eaten when reprisals were unlikely.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A special term, ida'idaga, is applied to feasts made from strangers or members
    of weak distant communities unlikely to avenge the killing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sorcerers are described as being paid to produce sickness and death or acting
    on their own account, without stigma but with risk of reprisal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bringing home a dead body to be eaten, with the skull preserved in the potuma,
    is described as highly commendable, especially when the body belonged to a feud
    enemy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Prisoners taken in warfare could be brought alive to the hamlet-group, tortured,
    killed, and eaten in payment for a death in the captor's community.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that prisoners were commonly tortured and killed only in
    numbers that made the score even between the two communities.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Prisoners who were not killed were often treated kindly and generally adopted
    into the community.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Female captives were liable to be killed and eaten to level the score, but
    if not killed they were not sexually assaulted and the captor had no sexual rights
    over them.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Wounds or deaths from disputes over a woman or pig, or from accidents, could
    be compounded by payment, including shell armlets, a shell nose ornament, and
    a necklace of sapisapi discs in one stated blood-price example.
  category: object
  evidence_refs:
  - ev:10
