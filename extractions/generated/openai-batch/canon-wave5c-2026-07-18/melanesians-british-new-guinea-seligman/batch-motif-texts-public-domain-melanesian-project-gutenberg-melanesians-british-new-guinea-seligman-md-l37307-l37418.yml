  summary: The passage describes the geography and settlement pattern of the Alcester/Tokunu
    islands; evaluates and rejects an earlier report that large waga canoes are built
    on Tokunu; describes Murua houses, chiefly decorated houses, clan and totem distribution
    in villages, named Tokunu house groups, a payment for residence and garden rights,
    and age- or sex-specific houses.
  language: English
