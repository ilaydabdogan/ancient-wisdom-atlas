canonical_text:
  quote: ''
  summary: The passage describes family life and hamlet organization. It presents
    the hamlet as usually a kin-based family group, uses Wagawaga Pupuna as a genealogical
    example of descent from an ancestral man and woman, notes multi-generational residence
    in elder relatives' houses, and describes adoption of outsiders into Kanabwahi,
    including clan adoption, garden land allocation, possible splitting by stock,
    continued observance of old-site prohibitions, and respect for a paternal totem
    bird called gimo, a dove.
  language: English
