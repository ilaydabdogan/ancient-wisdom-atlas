canonical_text:
  quote: ''
  summary: The passage describes ritual uses of the paiha marea and war marea in connection
    with warfare. Arms are kept there, warriors assemble there before battle, and
    feasts follow successful fighting. Homicides undergo a partial seclusion for purification
    from blood taint, with restrictions on sleeping, nighttime movement, food handling,
    and eating. A paiha chief addresses them and spurts water over them; older warriors
    accompany them into sea water and rub off their paint. After a further period,
    first-time killers receive the kotyu turtle-shell ornament in their headgear,
    followed by dancing and a mock chase with embers and firebrands to drive away
    spirits of the hostile dead associated with the headgear. Returning successful
    warriors also throw spears at the roof and sides of the marea.
  language: English
  quote_policy: summarized
