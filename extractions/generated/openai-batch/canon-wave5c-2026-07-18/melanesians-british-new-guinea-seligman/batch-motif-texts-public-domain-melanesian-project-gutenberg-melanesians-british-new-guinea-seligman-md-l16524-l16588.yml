    their bodies at the sea-shore.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the final stage, warriors who have not previously killed a man assume the
    kotyu, a fretted turtle-shell ornament that only homicides may wear in a particular
    way in their headdress.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The paiha chief ties the kotyu to each warrior's headdress in the paiha marea
    after a feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A dance follows, and the same night the newly decorated homicides are pretend-chased
    around the village while embers are thrown at them and firebrands are waved toward
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The embers and firebrands are said to be used to drive away spirits of hostile
