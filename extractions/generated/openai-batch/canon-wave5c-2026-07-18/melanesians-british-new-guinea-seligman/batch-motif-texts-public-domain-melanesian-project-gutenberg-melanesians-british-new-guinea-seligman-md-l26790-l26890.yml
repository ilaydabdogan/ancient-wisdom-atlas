canonical_text:
  quote: ''
  summary: 'The passage describes Wagawaga potuma clubhouses and related male areas
    of dwellings: open use by men across clans, old men''s council use, gendered interior
    house divisions, communal construction under a potuma master, burning of a potuma
    after its master''s death, and a former custom requiring a killing before the
    hearth of a new potuma could be completed and used. It also notes nearby variations
    at Tubetube and Rogea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Use of a potuma is described as not narrowly exclusive to a clan; a man of
    any clan may sleep in any potuma, and boys or young men may paint themselves for
    dances there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may retreat to any potuma during a quarrel with his wife and usually
    sleeps there while she is pregnant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Certain potuma are especially frequented by old men, and young men do not
    come to these uninvited.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The watara of the old men's potuma at Wagawaga is described as becoming a
    town-hall at the evening meal, where important old men meet without regard to
    clan or hamlet.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: War and peace are said to have been discussed on the watara of the old men's
    potuma, while smaller local troubles were first considered in the local potuma
    of the hamlet involved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In well-built Wagawaga dwellings, a light transverse rail divides the floor
    into a front men's half called nakanaka and a rear women's half called gwigwi.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The front half of a dwelling is for men only, and no woman may enter it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: One Wagawaga house occupied by a Garuboi man and his family is described as
    decorated somewhat like a potuma and used by men of other hamlets for sleeping
    in its front portion.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A potuma differs from such a dwelling because skulls of slain enemies are
    kept in a potuma and not in the house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The men of a hamlet take the main part in building their potuma, while people
    from other hamlets and clans help and are fed by the host hamlet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Each potuma has a recognized master whose office is not hereditary and who
    assumes responsibilities connected with feeding helpers and preparing building
    wood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The potuma master is responsible for firewood and cleaning but is not described
    as having special privileges or greater prominence in old men's counsels.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the potuma master dies, his potuma is burned with everything in it, regardless
    of the clan ownership of the property inside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A brother or a sister's child of the dead master lights the fire that burns
    the potuma, and even skulls inside are consumed there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Formerly, a newly built potuma's fireplace was left open and no hearth or
    fire could be made until a man or woman from another community had been killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the killing associated with a new potuma, the skull was hung to dry
    in smoke from the newly kindled fire, and the body was cooked in a cannibal gahana,
    or stone circle, and eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage states that Tubetube had no potuma and that open places largely
    took their ceremonial role; it also notes that Rogea formerly had potuma called
    basin.
  category: other
  evidence_refs:
  - ev:8
