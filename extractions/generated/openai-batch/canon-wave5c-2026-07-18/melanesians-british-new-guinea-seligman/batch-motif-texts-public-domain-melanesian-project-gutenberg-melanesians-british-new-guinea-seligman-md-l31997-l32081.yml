canonical_text:
  quote: ''
  summary: The passage describes sexual morality and customary responses to sexual
    conduct in the communities discussed by the source. It states that sexual acts
    were not treated as reprehensible unless they involved adultery or prohibited
    kin/social relations; that rape or attempted rape by an unmarried man against
    an unmarried woman was rare and not formally punished; that adultery brought sanctions
    including expulsion, beating, killing of the lover, hamlet fighting, or compensation;
    and that Government law changed or constrained older lethal sanctions. A footnoted
    case reports a domestic killing following a quarrel over pig food and a dog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that sexual acts were not treated as reprehensible so long
    as they did not involve adultery or persons required to keep apart by consanguinity
    or social custom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that before marriage a girl might dispose of her person
    as she pleased, within the stated limits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rape or attempted rape is described as very rare, and an attempt by an unmarried
    man on an unmarried woman was said not to be punished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Tubetube informant is summarized as saying that such a boy would be laughed
    at for acting when the girl did not want him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says most married women were and are faithful, while adultery
    is said to be becoming commoner because killing adulterers conflicts with Government
    authority.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says white law punished adultery by fine or imprisonment, which
    the described local perspective viewed as inadequate and cumbersome to enforce.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says an unfaithful wife should not be killed in theory; proper
    courses were to send her back to her parents' hamlet or beat her, though a husband
    who killed her would not face strong public opinion against him in his own hamlet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a man did not send away an unfaithful wife, he regarded any child born
    to her as his and treated it as such, even if he suspected the child might not
    be his own.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A married woman's lover might be killed, even if he belonged to the same clan
    or hamlet as the aggrieved husband.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says that in former times a man might be killed even for talking
    alone with another man's wife in the bush or on the seashore, and that a married
    woman would not speak to a stranger unless other women were present.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: When an adulterer was targeted, the injured husband was described as openly
    following and trying to kill him wherever found; the husband's hamlet would turn
    out armed, often causing a fight between hamlets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If an adulterer was killed and his hamlet did not kill someone in return,
    a vendetta usually did not begin because public opinion was against the adulterer
    and shell ornaments could be paid for the death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a man killed an adulterer in the bush, he generally returned to his hamlet,
    told his clansmen what he had done, and an attempt was made to pay for the dead
    man immediately to avert a blood feud.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The footnoted Goodenough Bay case describes a wife throwing a stone at a dog
    that was eating pig food, after which her husband killed her with a pointed stick;
    her relations demanded retaliatory payment by killing the husband, but he was
    handed to a village constable.
  category: sequence
  evidence_refs:
  - ev:8
