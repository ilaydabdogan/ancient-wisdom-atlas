canonical_text:
  quote: ''
  summary: 'The passage describes funeral and mourning procedures: kin prepare and
    decorate the corpse, designated totem-related officiants dig and arrange the grave,
    the body is placed seated in a protected grave cell, ornaments are transferred
    to the officiants, disturbed earlier bones are reinterred, and post-funeral coconut-tree
    cutting and food restrictions are observed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sister closes the corpse's eyes; if there is no sister, a brother performs
    this act and also holds and flexes the dead man's legs into position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wailing begins directly after death and continues for some hours.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body is decorated with armshells, a shell-disc necklace, a nose ornament,
    black face paint, a new perineal bandage, and turtle-shell earrings with sapisapi
    discs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Specified relatives perform the body''s toilette: the brother puts on the
    perineal bandage and dresses the hair, while the children place the nose, neck,
    and arm ornaments.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the morning the body is placed on a litter called nabanabwau in a sitting
    posture and carried to the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The grave is dug by the dead man's sisters' sons, called his game, who are
    known during the rites as gariauuna; if four such men are not available, men of
    the same totem may perform the duties.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The gariauuna are not specially painted or dressed and do not wail or sing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The gariauuna are followed by people of their totem and by willing friends
    from other totems, but the dead man's children do not follow the corpse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The grave is dug with a newly cut digging stick and by hand, is four to five
    feet deep, and is fenced against pigs.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:10
  text: A mat is placed at the bottom of the grave; the body is wrapped in a daam
    mat, lowered by the gariauuna, seated in a squatting position, and supported under
    the chin by a stick fixed in the grave sides.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before the body is carried to the grave, the ornaments on the corpse are removed,
    wrapped in a daam mat, left in the deceased's house for the gariauuna, and become
    their property without a cleansing ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The gariauuna roof the grave cell with sticks, mats, coconut leaves, and soil,
    and build a fence using various materials, including fragments of the broken grave-digging
    sticks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Formerly some grave coverings formed a small chamber where the gariauuna could
    sit; similar old grave structures are said still to exist in some Rogea hamlets.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: If previously buried bones are disturbed while digging a fresh grave, they
    are rolled in a daam mat and reinterred beside the new occupant.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Immediately after the funeral, a brother of the dead man cuts down two or
    three coconut trees belonging to the deceased; this may also be done by the son,
    game, or bara, and the gariauuna may eat the nuts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The deceased's other coconut trees are not yet taboo to brothers, sisters,
    and other relatives, but the dead man's children avoid coconuts, fattened pig,
    and nearby garden produce from their dead father's hamlet; the restriction does
    not apply to distant gardens.
  category: relationship
  evidence_refs:
  - ev:10
