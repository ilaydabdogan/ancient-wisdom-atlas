canonical_text:
  quote: ''
  summary: Ethnographic account of recent migrations, warfare, epidemics, intergroup
    boundaries, settlements, burials of war dead, and village layout among Roro-speaking
    groups and neighboring Waima and Kevori communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Roro tribe formerly lived near the coast at Maiaera, west of Pinupaka
    and close inland from the beach.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Roro moved from Maiaera to Araha after continual warfare with Waima, Mekeo,
    and Paitana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After about ten years at Araha, an epidemic occurred and most Roro shifted
    to Yule Island, while other groups went to Pinupaka, Pokama, Baara, Delena, or
    Erierine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the history of the Paitana tribe resembles the Roro history
    in broad outline.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people of Mou once lived on the plain of Maiaera near Roro settlements,
    then moved after petty warfare to a salt water creek called Ararana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After an attack by Elema natives in which many were killed, the people of
    Mou moved near the present village site and first formed a cluster of small settlements,
    probably clan-based.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Waima settlements occupy a coastal area near hills forming a ridge between
    the settlements and the sea.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kevori lived between Waima and Cape Possession in settlements resembling the
    Waima congeries and was formerly often at enmity with Waima despite intermarriage
    and some Waima colonies from Kevori.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ovia Pokina was a former place where Waima and Kevori faced each other; coconut
    palms still stood there after abandonment.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Men of Waima who fell in wars with Kevori were buried at Ovia Pokina.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Roro-speaking villages mostly consist of two facing rows of houses across
    a bare straight sandy street.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Where two clans are represented in a village, the dividing line usually crosses
    the village street at right angles, and each clan generally has a clubhouse at
    opposite ends facing the village center.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Where more than two clubhouses exist, one or more are built among the houses
    and are usually surrounded by houses of their own clan.
  category: attribute
  evidence_refs:
  - ev:12
