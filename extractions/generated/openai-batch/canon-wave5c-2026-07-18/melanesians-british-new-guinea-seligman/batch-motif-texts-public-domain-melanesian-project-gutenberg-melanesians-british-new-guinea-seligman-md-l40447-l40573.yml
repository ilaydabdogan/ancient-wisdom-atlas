candidate_motifs:
- id: motif:1
  label: multiple clan totems inherited through the father
  taxonomy_refs: []
  basis: The passage states that Mukaua district clans have a number of totems and
    that these descend through the father, then lists multiple totems for several
    clans.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: This is an ethnographic institutional pattern, not a mythic narrative
    episode.
- id: motif:2
  label: totemic abstention from killing or eating one's own totem
  taxonomy_refs: []
  basis: Mukaua people are said not to kill or eat their own totems; banana totem
    holders may cultivate and harvest but not eat the fruit themselves; Bogaboga examples
    also concern eating one's totem fish.
  evidence_refs:
  - ev:10
  - ev:12
  - ev:18
  confidence: high
  cautions: The passage also records exceptions or mediated cases, such as use of
    materials obtained otherwise and consumption by people of other totems.
- id: motif:3
  label: illness following violation of totem taboo
  taxonomy_refs: []
  basis: Killing a totem monitor lizard or cuscus is said to result in boils, and
    a Bogaboga informant and his brother reportedly developed boils after eating their
    totem fish.
  evidence_refs:
  - ev:10
  - ev:18
  confidence: high
  cautions: The author reports verifying boils in one case, but the passage does not
    establish causation beyond the local explanation.
- id: motif:4
  label: totem as grandparent or kin relation
  taxonomy_refs: []
  basis: When asked about origins, Mukaua people reportedly said of their totems,
    'they are our grandparents,' while the general ancestor term was not used.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: No origin story was elicited, and the passage explicitly notes uncertainty
    about the ancestor terminology used.
- id: motif:5
  label: tree and landscape totems with avoidance taboos
  taxonomy_refs: []
  basis: Bogaboga clans have tree and mountain totems; tree totem holders must not
    use or injure the trees, and mountain totem holders must not look at or set foot
    on the mountain.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: Mukaua itself is said not to have forest-tree or uncultivated-plant totems,
    and rock, mountain, and rain totems are reported as belonging to other people.
- id: motif:6
  label: chief totem among multiple clan totems
  taxonomy_refs: []
  basis: Bogaboga Inaboana, Maniugu, Kibiris, and Mariuna clans are each described
    with a chief totem plus other totems.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage does not explain how chief totems differ ritually from other
    totems.
- id: motif:7
  label: serpent as clan totem
  taxonomy_refs:
  - serpent
  basis: The constrictor snake dubo is listed as a totem for the Mukaua Inauboana
    clan and the Pupumina Kaukepo clan.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage lists a snake as a totem but gives no serpent narrative, action,
    or mythic episode.
comparison_claims:
- id: claim:1
  claim: Mukaua and Bogaboga accounts share a functional pattern in which violating
    one's own totem by killing or eating it is associated with clan disapproval and
    boils, while people of other totems or clans may handle or eat the same animal
    without the same restriction.
  claim_level: same_function
  target: totemic taboo violation and illness sanction in Mukaua and Bogaboga accounts
  evidence_refs:
  - ev:10
  - ev:11
  - ev:18
  counter_evidence_refs:
  - ev:12
  confidence: medium
  limitations: This is an internal comparison between communities in the passage.
    The passage does not claim historical contact or common origin for the pattern;
    banana totem rules show variation in who may consume the totem product.
- id: claim:2
  claim: 'Mukaua and Bogaboga differ in the presence of tree and landscape totems:
    Mukaua is said to lack forest-tree and uncultivated-plant totems, while Bogaboga
    clans include tree and mountain totems with strong avoidance rules.'
  claim_level: same_function
  target: tree and landscape items functioning as totems in nearby communities
  evidence_refs:
  - ev:13
  - ev:15
  - ev:16
  - ev:17
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the communities named in this passage
    and should not be generalized beyond them without additional evidence.
