canonical_text:
  quote: ''
  summary: The passage describes settlements and clan totems in the Mukaua district
    and Bogaboga territory. It lists animal, fish, plant, tree, and landscape totems
    for several clans; notes paternal descent of totems in Mukaua; records taboos
    on killing, eating, touching, using, or looking at certain totems; and reports
    boils as a consequence of killing or eating one's totem. It also records that
    Mukaua people described their totems as their grandparents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Some settlements are described by layout and origin traditions: Mukaua houses
    form a circle for inter-tribal and inter-village feasts; Mukaua people claim to
    be original inhabitants; Awanori is said to have come from the north across the
    sea; Yausika is said to have been built by people from the south-east; Mukaua
    people do not tattoo.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Mukaua district each clan has a number of totems, and these totems
    descend through the father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kaminaura settlement is of the Murimuri clan and has totems including
    Goura pigeon, crow, several fish, a clam, and a cephalopod.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yausika householders are of the Wairapia clan and have totems including dog,
    cuscus, bandicoot, fish, a large lizard, and two kinds of banana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Awanori settlement is of Kaiwunu clan and is reported to have a fish totem
    named kaiwunu; a note warns that the clan may have other totems not recorded.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mukaua settlement people are all of Inauboana clan and have totems including
    turtle, constrictor snake, and two fish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yabayabata clan has totems including red parrot, cephalopod, fish, and a kind
    of banana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kurakura people are described as strangers from one of the D'Entrecasteaux
    Islands and are alleged to have no totem system similar to Mukaua.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pupumina people are of the Kaukepo clan and have totems including flying fox,
    constrictor snake, turtle, dugong, and possibly a small whale.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bave people are of the Natuwosa clan and have totems including turtle, lizard,
    and two fish, one of which is the sting ray.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mukaua people do not kill or eat their totems, but may use feathers of totem
    birds if found or given and may buy feathers, cuscus tails, or monitor-lizard
    skin for drums even when these animals are totems.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: If a person whose totem was monitor lizard or cuscus killed that animal, the
    clan headman would be angry and the killer was said to suffer from boils.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A totem fish caught by accident would be removed from hook or net by a person
    of another totem, who could keep and eat it; such fish were not returned to water
    and received no special treatment.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A man would avoid touching a dead totem found on the road or in the bush and
    would not bury it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: A man with banana totems would plant and pick the fruit of those bananas but
    would not eat it himself; his wives could eat it.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: No forest trees or uncultivated plants are Mukaua totems, but Mukaua people
    report knowing others with rocks, mountains, and rain as totems.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: No origin story for the Mukaua totems was elicited; the totems were described
    as 'our grandparents,' while the general term for ancestor was not used on that
    occasion.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: Bogaboga territory contains three communities with five distributed clans;
    Inaboana men have fish-hawk as chief totem and also hawk, fowl, fish, banana,
    plantain, and tree totems, but no snake totems.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:19
  text: In Bogaboga, Maniugu clan has dugong as chief totem and also fish, plantain,
    and forest-tree totems; Kibiris clan has a prominent mountain as chief totem and
    also fish and trees; Mariuna clan has a banana as chief totem and also fish and
    birds.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:20
  text: Bogaboga people with tree totems must not use those trees for building, firewood,
    or canoes and must not chop down or injure them.
  category: action
  evidence_refs:
  - ev:16
- id: obs:21
  text: When a mountain is a totem in Bogaboga, people must not look at it or set
    foot on it.
  category: action
  evidence_refs:
  - ev:17
- id: obs:22
  text: A Bogaboga informant and his brother ate one of their totem fish, were severely
    rated by clan and family, and were reported by the author to have suffered boils
    within a short time; members of other clans were said to eat the same fish unharmed.
  category: sequence
  evidence_refs:
  - ev:18
