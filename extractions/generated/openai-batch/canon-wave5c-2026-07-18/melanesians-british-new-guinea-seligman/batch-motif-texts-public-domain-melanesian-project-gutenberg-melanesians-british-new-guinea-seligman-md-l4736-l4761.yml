canonical_text:
  quote: ''
  summary: 'The passage describes name-giving customs: names are used for both sexes;
    a child is usually named soon after birth but may be named before birth; children
    have two names, including one from the father and another from a relative or friend;
    a gift-request example leads to an infant being named after Ahuia; some male children
    take their father''s names in inverted order; and a name-giver incurs no responsibility
    for the child.'
  language: English
  quote_policy: summarized
