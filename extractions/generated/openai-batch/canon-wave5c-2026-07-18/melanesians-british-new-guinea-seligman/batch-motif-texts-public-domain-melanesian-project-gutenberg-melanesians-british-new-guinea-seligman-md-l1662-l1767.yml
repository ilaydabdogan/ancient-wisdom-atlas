canonical_text:
  quote: ''
  summary: Ethnographic passage describing Massim clan grouping, exogamy, address
    rules, former revenge cannibal feasts, beliefs and practices concerning own and
    paternal totems, feather ornament use, and the representation of totem animals
    in Massim decorative art.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some parts of the Massim district, including Milne Bay and Bartle Bay,
    clans are arranged in dual or multiple groupings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Where such grouping occurs, marriage is prohibited both within one's own clan
    and within one's own clan-group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The clan grouping regulates the terms by which individuals are addressed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The clan grouping formerly determined who participated in a cannibal feast
    held to avenge a fellow villager killed by a hostile community.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: With the recent extinction of warfare and cannibal feasts, dual grouping has
    declined and is often ignored in marriage regulation, while totem exogamy remains
    generally observed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: People are not usually considered to share the qualities of their totem birds,
    fish, or snakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage reports no totem shrines, no special influence over totem animals,
    and no ceremony for increasing the totem.
  category: other
  evidence_refs:
  - ev:2
- id: obs:8
  text: People in the district show more regard for their father's totem than for
    their mother's totem, which is also their own.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'A person may kill or eat his own totem in some cases: own fish totems are
    caught and eaten, own snake totems may be killed if in the path, and own totem
    plants may be destroyed when convenient.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: No one would eat or destroy a father's totem bird or approach a fire where
    it was cooking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: If a father's totem fish is caught, a fisherman generally asks a companion
    to remove it from the net and does not touch or eat it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A person generally avoids injuring his father's totem plant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A man may wear feathers of his own totem bird as ordinary and appropriate
    ornaments, but would not wear feathers of his father's totem bird.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Totem birds, snakes, and fishes are commonly represented on houses, canoe
    prows, lime spatulae, net floats, and other wooden utensils and ornaments.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Carvers are not limited to their own totems or to the totems of the person
    for whom they carve.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Some totem animal designs have entered general district art and are used to
    decorate houses and utensils regardless of the owner's totem connection.
  category: sequence
  evidence_refs:
  - ev:6
