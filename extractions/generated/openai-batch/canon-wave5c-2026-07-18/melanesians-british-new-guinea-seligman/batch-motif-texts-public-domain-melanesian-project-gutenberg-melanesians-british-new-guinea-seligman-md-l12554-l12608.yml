  summary: The passage describes the eaii rove as a chief-only ornament publicly invested
    on young chiefs in a clubhouse, usually before puberty. It describes the ornament
    as a double row of ground boar tusks worn on the chest, notes that chiefs may
    represent it in carvings on a marea pole, and discusses hereditary names of chiefs'
    houses. A footnote records a Waima succession custom for an ovia akiva without
    sons.
