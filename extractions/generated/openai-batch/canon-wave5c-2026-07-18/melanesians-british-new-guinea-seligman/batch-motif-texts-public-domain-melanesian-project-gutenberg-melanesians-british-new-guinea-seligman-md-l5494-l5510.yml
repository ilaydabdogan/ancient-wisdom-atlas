  quote: ''
  summary: 'The passage describes customary treatment and inheritance of personal
    property after death: a deceased person''s worn bandage or petticoat is burnt
    months later during a ceremony, while a dead man''s personal property passes to
    specified relatives, with no personalty going to the widow, some reserved for
    young children, and division handled by an adult eldest son or substitute male
    kin.'
