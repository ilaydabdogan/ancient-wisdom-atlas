canonical_text:
  quote: ''
  summary: The passage describes mortuary food displays, a widow's ritual reintroduction
    to forbidden foods at the end of fasting, removal of mourning tokens and black
    pigment, mourning rules for siblings and widowers, funeral procedures for a deceased
    woman, Bartle Bay widow's mourning dress and armlets, and reciprocal banivi mourning-feast
    exchanges among clans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: About thirty food trophies are described, each founded on a large basket of
    yams with a stick-and-bark frame and a yam pile narrowing to a single yam at the
    top.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pigs, coconuts, prepared sago, and yams are suspended over house platforms
    on wooden frames as part of the preparations.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the preparations are complete, the widow throws herself on the ground
    and wails, and several relatives join her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman holds cooked yam to the widow's nostrils for her to smell, gives it
    to her to eat, and publicly announces that she now eats yam.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pork, fish, taro, and sago are then offered in turn to the widow, and the
    woman announces each food as it is eaten.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The food-eating ceremony ends the widow's and her clan's fasting from those
    foods, and mourning tokens are removed from the woman's neck.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After black mourning pigment is removed, the widow is free from her taboos,
    and food intended for the gariauuna is given to them by the dead man's brother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Brothers wear no mourning for each other; a sister mourning a brother wears
    string mourning neck ornaments but does not blacken herself, put on a long petticoat,
    or abstain from going into the sea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman's hair may mat into long curling locks called doiona during mourning,
    attributed to not washing in fresh water, though the passage questions whether
    this headdress is limited to mourning women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a woman dies, her bara or game, who are her gariauuna, take the chief
    part in her funeral ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A dying woman is supported in the same posture as a dying man by her husband
    or children, and her children close her eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A new petticoat is placed on the deceased woman by her sister, mother, or
    daughter, while her children place ornaments and arrange her hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After ornaments are removed, the deceased woman is carried to the grave by
    her game or, failing them, by her children; her gariauuna stay by the grave, her
    children follow, and her husband does not.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: For a deceased woman, death-feast food is provided by her children, with sisters
    supplying any deficit if necessary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The widower remains in the house wrapped in a daam mat, wears an old perineal
    bandage until after the first kanekapu, blackens himself after his wife's death,
    and later has the black pigment washed off by his children at the rigariga.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: At Bartle Bay, a widow wears a coarse shredded coconut-leaf petticoat, blackens
    herself, and wears widow's mourning neck ornaments.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: At Bartle Bay, a widow appears to put on cane mourning armlets when the dead
    man's pigs are ready to be killed for the first mourning feast; one armlet is
    said to be worn for each pig.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The banivi mourning feasts are described as reciprocally exchanged among individuals
    of component clans within Wedau and Wamira clan-groups practicing group exogamy.
  category: relationship
  evidence_refs:
  - ev:8
