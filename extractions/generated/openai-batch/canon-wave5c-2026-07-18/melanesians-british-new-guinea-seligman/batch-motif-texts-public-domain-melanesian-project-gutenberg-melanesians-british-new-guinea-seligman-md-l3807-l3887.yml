canonical_text:
  quote: ''
  summary: The passage describes Koita iduhu rohi succession debates, the recognition
    of a sectional headman, and the duties of iduhu rohi in feast food distribution,
    ceremony coordination, peacekeeping, and land-permission matters involving absorbed
    local groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The succession to Ganiga Egahu is described as undecided, with several named
    candidates proposed on kinship or descent grounds and with one candidate noted
    as unmarried and physically impaired.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In each Koita section, one particular iduhu rohi was recognized as chief or
    headman of the whole section and was called rohi ketaike or rohi baugi.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sectional chieftainship was usually constant in one iduhu and is described
    as hereditary in the same sense as the chieftainship of that iduhu.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The iduhu rohi is responsible for sharing out food at koriko feasts, helps
    determine when feasts are held, visits gardens, and watches produce ripening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bananas for the feasts are brought to the house of the iduhu rohi of the feast-giving
    iduhu and left hanging on his verandah before being piled into heaps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Idhuhu rohi discuss feast and ceremony dates and details, may exert influence,
    but cannot enforce their wishes against the general opinion of the older men of
    the iduhu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Orders by iduhu rohi concerning practical details of ceremonies, such as moving
    food or carrying food to another iduhu, are described as promptly obeyed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Idhuhu rohi act to keep peace in the village and reduce friction between clans;
    a wife-maltreatment case could be referred to them for advice to the man involved.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Questions concerning land are formally brought before iduhu rohi even without
    an active quarrel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Surviving Tupa families identifying as Dubara made gardens on Dubara land
    and obtained permission for use of Taurama and Vaiu land, with Vaiu permission
    subject to confirmation by the Dubara iduhu rohi.
  category: relationship
  evidence_refs:
  - ev:7
