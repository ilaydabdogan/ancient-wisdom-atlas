canonical_text:
  quote: ''
  summary: The passage contains a Wagawaga narrative titled “The Birth of the Sun,”
    in which a woman has contact with a wadumo fish, gives birth from her thigh to
    Dudugera, sends him to his fish father, and later mitigates destructive heat by
    sprinkling lime across the sun. It then begins a second Wagawaga narrative, “How
    Fire Came,” in which an old woman keeps fire in her body and the youngest of ten
    youths discovers and steals a brand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman weeds a garden above the beach, sees a large wadumo fish in the surf,
    goes into the sea, and repeatedly has the fish rub and nuzzle her thighs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's thigh swells painfully; her father scarifies it with obsidian,
    and a boy child bursts from one incision.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman washes the child, cuts the cord, lies by the fire, and nurses him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child, named Dudugera and called the leg-child, plays with village children
    and throws toy spears at his companions instead of at trees or bushes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other boys abuse Dudugera by saying that his father was a fish and that he
    should go back to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dudugera's mother, angry and afraid for him, consults her mother and decides
    to give him to his father for safety.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the beach, the great fish takes Dudugera in its mouth and carries him to
    a far-away country in the east.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before leaving, Dudugera tells his mother to warn her relations to move their
    crops and live under the overhang of the great rock Duyau.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dudugera says he will climb into a pandanus and then into the sky, and that
    villages, trees, plants, and people will die unless his friends shelter under
    Duyau.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The prophecy is followed by dried water, withered trees, failed gardens, and
    the deaths of pigs, dogs, and men from great heat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dudugera's mother climbs a hill with a lime pot and at sunrise sprinkles lime
    from a gourd across the face of the sun, causing him to shut his eyes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the lime is sprinkled, the heat is reduced, rain falls, and clouds appear
    before the sun on the following morning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A footnote says the wadumo fish is a totem through much of the south-eastern
    district, though not of the Wagawaga clans, and is called warumo at Tubetube with
    the fish-hawk as linked bird totem.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the second story, before men had fire, an old woman called Goga lives at
    Maivara at the head of Milne Bay.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: People dry sliced yams and taro in the sun; the old woman prepares food for
    ten youths but secretly cooks her own food using fire taken from her body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A piece of boiled taro accidentally reaches the boys; the youngest tastes
    it, shares it, and the boys notice it is soft and good.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The youngest boy hides and sees the old woman take fire from between her legs,
    then tells the others, who decide to steal some fire.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: The boys cut down a tree as big as a house and use jumping over it to choose
    the youngest boy as the one who will steal fire.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: The youngest boy snatches a brand from the old woman, jumps the felled tree,
    drops the brand when it burns his hand, and sets grass and a pandanus on fire.
  category: sequence
  evidence_refs:
  - ev:15
