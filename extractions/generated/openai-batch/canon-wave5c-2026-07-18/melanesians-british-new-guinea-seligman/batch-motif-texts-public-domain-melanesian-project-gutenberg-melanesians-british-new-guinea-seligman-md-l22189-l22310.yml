candidate_motifs:
- id: motif:1
  label: miraculous child born from a thigh incision after fish contact
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Dudugera is born when the mother's swollen thigh is scarified after repeated
    contact with the wadumo fish.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The unusual birth is explicit; the term sacred is not used in the passage,
    though the narrative title connects the episode with the sun.
- id: motif:2
  label: animal father carries child away
  taxonomy_refs: []
  basis: Other boys identify the fish as Dudugera's father, and the great fish takes
    him in its mouth to a country in the east.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not call the fish divine.
- id: motif:3
  label: ascent from tree to sky
  taxonomy_refs:
  - ascent
  basis: Dudugera says he will climb into a pandanus and then into the sky.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage reports the prediction and subsequent heat but does not narrate
    the climb in detail.
- id: motif:4
  label: catastrophic heat with instructed refuge
  taxonomy_refs: []
  basis: Dudugera warns that villages, plants, and people will die unless his friends
    shelter under Duyau; the water then dries, plants fail, and animals and men die
    from heat.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The destructive force is heat from the sun, not a flood or explicit world-ending
    fire.
- id: motif:5
  label: ritual mitigation of the sun by lime
  taxonomy_refs: []
  basis: Dudugera's mother sprinkles lime across the sun's face, after which the sun
    shuts his eyes, the heat lessens, and rain and clouds appear.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain whether this is a recurring ritual or a single
    mythic act.
- id: motif:6
  label: hidden bodily source of fire
  taxonomy_refs: []
  basis: The old woman cooks with fire taken from her body, specifically from between
    her legs, and conceals the evidence.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: The excerpt does not state why she possesses fire or why others lack it.
- id: motif:7
  label: fire acquired by theft
  taxonomy_refs:
  - sacred_theft
  basis: The boys decide to steal fire from the old woman, and the youngest snatches
    a burning brand from her.
  evidence_refs:
  - ev:13
  - ev:15
  confidence: high
  cautions: The passage ends while the brand is igniting grass and pandanus, so the
    wider distribution of fire is not included in the excerpt.
- id: motif:8
  label: selection of the youngest by ordeal-like jumping test
  taxonomy_refs: []
  basis: The boys cut down a house-sized tree, try to jump over it, and choose the
    youngest because only he succeeds.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The text presents the jumping as a practical selection test, not as a
    formal initiation.
