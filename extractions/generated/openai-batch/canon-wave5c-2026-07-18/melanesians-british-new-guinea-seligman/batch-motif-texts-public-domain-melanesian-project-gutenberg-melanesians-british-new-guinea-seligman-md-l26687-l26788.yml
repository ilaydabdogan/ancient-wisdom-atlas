canonical_text:
  quote: ''
  summary: The passage describes Wagawaga men's clubhouses or talking places, called
    potuma, and their public platforms, called watara. It notes their exclusion of
    women, decoration with painted and carved boards showing animals, interior fireplaces
    and sleeping or fishing equipment, displays of animal bones and former displays
    of human skulls, food eating and sharing on the platform, age/status restrictions
    around the old men's potuma, and clan associations of potuma ownership.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wagawaga there are houses called potuma that function as clubhouses and
    talking places for men, and no woman may enter them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The potuma are similar in size and construction to better dwelling houses,
    but are decorated with painted boards along the front, back, and sides.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some potuma may be built in the sea below high-water mark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Carved and painted boards on the potuma represent birds, snakes, and fishes,
    and the passage states that these are not limited to the totem animals of the
    builders or owners.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the potuma are one or two fireplaces, sleeping mats, wooden pillows,
    and fishing nets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The interior gable ends are hung with fish backbones, turtle leg bones, and
    fish and pig skulls as evidence of food abundance eaten in the potuma.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In earlier times pig jaws were arranged outside the front thatch, and human
    skulls taken by the men of the potuma were attached to an inner board or lashed
    to poles by some bush communities behind Wagawaga.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A platform called watara is usually built in front of the potuma as a verandah
    or beneath the floor.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ceremonial feasts are not held in the potuma and no food is cooked there,
    but many men habitually eat in or upon the potuma platform.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A man may ask his wife or mother to send food to the potuma; other men have
    no right to it, but he normally invites them to join him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Men of importance returning from a large feast are expected to bring much
    of the pig-meat received there to the watara of the potuma, where it is eaten
    by attendees.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Young men do not enter the old men's potuma or its watara unless specially
    invited.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The passage reports a belief that if a woman entered a potuma it would soon
    catch fire and be destroyed, though the author heard of no case in which this
    was said to have happened.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: In theory each clan should have its own potuma, though the passage says this
    allotment had partly broken down by the time described.
  category: relationship
  evidence_refs:
  - ev:11
