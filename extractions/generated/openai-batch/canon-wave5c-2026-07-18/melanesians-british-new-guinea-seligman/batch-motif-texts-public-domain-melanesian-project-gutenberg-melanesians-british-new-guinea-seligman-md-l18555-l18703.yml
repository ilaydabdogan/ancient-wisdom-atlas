canonical_text:
  quote: ''
  summary: 'The passage describes internal divisions within pangua and ikupu: conflicts
    that produce new settlements and groups, dual social groupings, genealogical descent
    from named ancestors, chiefly and war-chief offices, transfer of chiefly authority
    with a chiefly lime object, and a general account of how a new ikupu emerges from
    a growing parent ikupu through kin and marriage factions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Veifa pangua is described as first divided into fdangiau and ekei sections.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the fdangiau section fought among themselves; the defeated party,
    led by the lopia fda, returned to a former settlement site at Inawi and formed
    Ongofoina Kipo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The victorious party remained at the Veifa site, reorganized itself and the
    village, and formed three new ikupu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A later conflict within the ekei section led one party to move to Amoamo village
    and form Igniuma pangua, while another remained at Veifa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage describes a further dual grouping of ikupu into fda aui or lopia
    aui and io aui.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lopia fda group is said to belong to the fdangiau section, while the io
    aui group includes the war chief and may belong to either fdangiau or ekei.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Waiaka, the genealogy is said to show that both lopia fda and io lopia
    descend from Maino Amaa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Waiaka is described as having eight ikupu; five trace origin to a single named
    ancestor, while three others assert common stock and call themselves brothers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Maino Amaa, living at Ioiovina seven generations earlier, had three sons;
    two named sons, Amewa Kaiokuau and Opungu Kaiokuau, were among the first to leave
    Ioiovina, cross the river, and settle near the later Inawi and Inawae sites.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Neither Amewa Kaiokuau nor Opungu Kaiokuau was an fda chief, but their descendants
    increased until five present-day ikupu traced descent to Maino Amaa through them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The high chieftainship entered the family after a lopia fda was publicly shamed
    at a feast by one of his wives and transferred his authority and its chiefly lime
    object to an ancestor of Opungu Ongopaina.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Keaeke Ifoilako is identified as an important descendant of Opungu Kaiokuau
    and as io lopia of Waiaka.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:13
  text: The passage describes an ikupu as emerging when a parent ikupu grows, parties
    form within it, and closely related families linked by blood and marriage increasingly
    hold apart from the wider community.
  category: sequence
  evidence_refs:
  - ev:8
