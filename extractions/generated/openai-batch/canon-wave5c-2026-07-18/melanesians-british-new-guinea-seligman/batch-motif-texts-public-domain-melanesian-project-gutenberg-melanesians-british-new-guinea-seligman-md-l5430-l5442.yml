  quote: ''
  summary: 'The passage describes customary rules concerning women and land: women
    are said not to truly own land, but daughters and certain orphans may cultivate
    portions of their fathers'' land and keep produce. Children may garden there with
    kin permission. Land is not transferred as dowry or as part of an adultery payment.
    A widow-related custom is only cross-referenced.'
