canonical_text:
  quote: ''
  summary: The passage describes a heni ceremony for a first-born child, involving
    adornment of mother and infant, a visit to the maternal grandmother's house, carrying
    of ceremonial items by a sister-in-law, removal and redistribution of ornaments
    and objects among maternal kin, and an equivalent return present divided among
    the father's relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heni ceremony takes place in connection with a first-born child of either
    sex.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the child is about three or four weeks old, the child and mother are
    decked with New Guinea finery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother carries the child to her mother's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother is accompanied by her sister-in-law, who walks behind carrying
    an empty pot, a spear, a petticoat, and a firestick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child's father stays quietly in his own house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The infant's mother and her sister-in-law sit in the child's grandmother's
    house, smoke, talk, and chew betel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The infant's yaiya, identified as the wife of its maternal uncle, strips the
    ornaments from the mother and child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ornaments, spear, pot, and petticoat go to the raimu and wahia on the
    maternal side.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The maternal-side relations keep some items and give the rest to their clansmen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage explains this redistribution as repayment to clansmen who helped
    make an equivalent return present.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The equivalent return present should be given before the mother and child
    leave the house and will be divided among the infant's father's relatives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A referenced native drawing shows the child's aunt carrying only a firestick,
    and the tattoo on both figures is described as exaggerated.
  category: other
  evidence_refs:
  - ev:8
