canonical_text:
  quote: ''
  summary: 'The passage describes Trobriand and Marshall Bennet chieftainship customs:
    chiefly duties at feasts, the uncertain relation between paramount chiefs and
    village chiefs, privileges involving yam houses, rules of eating and approach,
    restricted chiefly platforms, succession rules, reported denial of a supreme overlord,
    and Gawa clan chiefs identified by totem and hamlet.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief is described as having the duty to preside at feasts and ceremonies
    and distribute food to visitors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The relation between the toriwaga and the guyau is described as puzzling;
    the toriwaga is not a guyau and lacks the pig privilege, but may build a big yam
    house, unlike an ordinary native.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moliasi, a toriwaga described as a commoner, disputed Toalu's authority, drove
    him from his village, and burned it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a feast after a house is built for a guyau, the guyau and his toriwaga
    eat together apart from commoners; a guyau does not share his lime-pot or eat
    with a commoner, but chews betel and eats with toriwaga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A toriwaga may approach a paramount chief without stooping and speak without
    waiting to be addressed; no ceremony is reported in which a village chief humbles
    himself before a paramount chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women are excluded from the yam-house platforms of paramount and village chiefs;
    these platforms are reserved for men, and village drums are kept on or above them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yams in the yam houses of paramount and village chiefs are stored and removed
    only by men, usually men of the chief's clan in the case of village chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A commoner approaching his chief is described as stooping, often with hands
    behind him or held open, and normally does not speak before the guyau has the
    opportunity to speak first.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage contrasts this with toriwaga-villager relations, where villagers
    around a toriwaga do not avoid being physically as high as the village head man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The offices of guyau and toriwaga pass on death to a brother, failing that
    to a sister's son, or to an adopted member of the same clan if direct heirs are
    absent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author states that the chapter's information does not provide evidence
    for a supreme overlord among the paramount chiefs.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Inquiries at several villages produced denials that Enamakala or Enamakata
    of Omarakana was overlord of the other paramount chiefs, and the passage reports
    repeated assertions that all paramount chiefs are of equal dignity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: On each island one man is regarded as head man or chief of each clan, and
    the chief of the traditionally most important clan is recognized as chief of the
    whole island.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: For Gawa, Yoseli of the fish-hawk totem is named chief of the whole island;
    Suluyowa is listed with the pigeon totem, and Kwadui with the frigate-bird totem.
  category: relationship
  evidence_refs:
  - ev:8
