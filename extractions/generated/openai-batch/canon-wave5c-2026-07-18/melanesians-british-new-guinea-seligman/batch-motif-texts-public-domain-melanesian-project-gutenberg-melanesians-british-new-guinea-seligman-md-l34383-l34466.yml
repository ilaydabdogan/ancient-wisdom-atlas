literal_observations:
- id: obs:1
  text: Personal ornaments of little value and foods eaten by the sick man during
    his last illness are placed on top of the mat rolled around the corpse.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buried food is explained as sustenance for the deceased on the way to
    the other world, and the term tamaina is explained as provision for an ordinary
    journey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The food in the grave is also said to advertise the foods eaten by the dead
    man during his last illness, which are taboo to his widow or widows until after
    the last funeral feast called banivi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Widows abstain strictly from the taboo foods, sometimes to a low state of
    nutrition; imported foods such as yams or rice are described as allowable.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The gariatma place stones on the mat edge, pull earth into the grave, stamp
    it down, build a small coconut-leaf shelter over the grave, and put a fence around
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Relatives formerly slept by the grave for two or three nights to prevent pigs
    from disturbing it, and the watchers were theoretically supposed to wail all night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each clan-group of a settlement has its own grave; graves are frequently reopened,
    bones are treated as at Tubetube, and the bones are not kept in houses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the night of a death, people in the neighborhood do not leave their houses;
    in modified form this continues until the next new moon, with avoidance of casual
    night walking and the path near the death place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says there is some reason to suppose that at Taupota a belief
    exists that the soul of the dead man is looking for a new habitation.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that formerly people who died away from home were taken back
    to their own folk, and another note states that at Wamira the corpse's feet are
    toward the direction from which the deceased's clan came.
  category: relationship
  evidence_refs:
  - ev:8
