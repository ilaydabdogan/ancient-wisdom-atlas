canonical_text:
  quote: ''
  summary: 'The passage describes practices around vengeance by kin groups, then funeral
    and mourning ceremonies: immediate wailing, intimate contact with the corpse,
    preparation and public display of the body, status-specific adornment, unrest
    over sorcery accusations, damage to the dead person''s property, burial, rites
    to drive away the dead person''s spirit, night fires on the grave, and burial
    or placement of property and offerings with the deceased.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman’s itsubu sought vengeance on her husband, while the husband was protected
    by members of his own itsubu; the Mission restored quiet before bloodshed occurred.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wailing for the dead begins immediately after death and is performed by women
    who are nearly related to the deceased, with intervals for rest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow and near female relatives rub, embrace, and lick the corpse while
    crying to the dead man to return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male relatives arrange the corpse’s limbs, close its eyes, and prop its head
    forward on its chest using a shield held by spears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A death is said to be announced by blowing a shell trumpet, with the same
    note regardless of the deceased person's sex or rank.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Female mourners were said formerly to gash their scalps with sharp shell fragments
    until blood streamed, sometimes causing fainting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'A death chair called aiyaiyai is prepared: for a commoner it is set in the
    village, and for a chief it is set on the verandah of his marea.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dead man is dressed in full dancing costume and painted as for a dance;
    a chief also receives the boar-tusk chieftainship ornament eai rove around his
    neck.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a death, the village may become unsettled over whom to blame and avenge
    for a clansman’s death by sorcery; men may carry spears in an excited condition.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: At Waima, an aiyaiyai was seen on a marea verandah with a kaivakuku mask and
    mouldering yams hung above it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the day after a man’s death, many of his effects except jewellery are broken
    or damaged and hung beneath the eaves of his house, which is usually abandoned
    and allowed to decay.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Vegetables planted by the dead man are said to be hung to the eaves of his
    house when ripe and allowed to rot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After about twenty-four hours’ exposure, the corpse is stripped of ornaments,
    wrapped in a mat splinted with sago-palm midribs, attached to a pole, and carried
    to burial.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The corpse was formerly buried under the floor of the deceased’s house in
    a shallow grave, usually with the head toward the rising sun.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: When the body is in the grave, a near male relative strokes the corpse twice
    from foot to head with a tree branch to drive away the spirit called beriwa.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: For a month or two after burial, a relative lights a fire on the grave at
    night, reportedly to keep the dead man warm.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Part of the dead man’s property was formerly buried with him; in the cited
    case of Oa, gifts were placed on the grave and weapons and ornaments were set
    at the head of the grave.
  category: object
  evidence_refs:
  - ev:12
