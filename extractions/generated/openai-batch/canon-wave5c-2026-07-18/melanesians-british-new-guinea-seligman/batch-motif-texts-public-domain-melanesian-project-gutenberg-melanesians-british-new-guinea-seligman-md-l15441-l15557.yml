candidate_motifs:
- id: motif:1
  label: Intensive mourning around the corpse
  taxonomy_refs: []
  basis: The passage describes immediate wailing, touching and licking the corpse,
    calling for the dead man to return, and female bloodletting mourning actions.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: This is a descriptive funeral-practice motif; no supplied motif-family
    taxonomy term directly matches it.
- id: motif:2
  label: Public display of the dead on a death chair
  taxonomy_refs: []
  basis: A chair called aiyaiyai is prepared for the corpse, with location differing
    by rank; Waima evidence describes a chair on a marea verandah.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage describes display furniture and setting but does not explain
    its symbolic meaning.
- id: motif:3
  label: Status-marked funerary adornment
  taxonomy_refs: []
  basis: The corpse is dressed and painted as for a dance, and a chief receives a
    boar-tusk chieftainship ornament.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Rank distinction is explicit, but broader political or religious implications
    are not stated in the passage.
- id: motif:4
  label: Death attributed to sorcery and retaliatory mobilization
  taxonomy_refs: []
  basis: The text describes village unrest after death over vengeance for sorcery
    and gives a case of armed men moving against an accused sorcerer.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents reported social responses, not a mythic narrative
    of sorcery itself.
- id: motif:5
  label: Ritual destruction and abandonment of the dead person’s possessions and house
  taxonomy_refs: []
  basis: Effects are broken or damaged and hung beneath the eaves; the house is usually
    abandoned, and crops planted by the deceased are left to rot.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The text offers a probable explanation for the yams but does not state
    a ritual doctrine behind the destruction and decay.
- id: motif:6
  label: Spirit-expulsion from the corpse by branch-stroking
  taxonomy_refs: []
  basis: A near male relative strokes the corpse twice from foot to head with a tree
    branch to drive away the dead man’s spirit, called beriwa.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage states the action and stated purpose but gives no further
    cosmology of the beriwa.
- id: motif:7
  label: Post-burial care of the dead by grave fire
  taxonomy_refs: []
  basis: A relative lights a fire on the grave for one or two months at night, reportedly
    to keep the dead man warm.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The motive is reported as a local statement; no additional afterlife interpretation
    is supplied.
- id: motif:8
  label: Grave goods and offerings for the dead
  taxonomy_refs: []
  basis: Part of the dead man’s property was formerly buried with him, and Chalmers’s
    account describes gifts placed on a chief’s grave with weapons and ornaments at
    the grave head.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not state whether the goods are for afterlife use, commemoration,
    or another purpose.
- id: motif:9
  label: Burial oriented toward the rising sun
  taxonomy_refs: []
  basis: The corpse is usually placed in the shallow grave with its head turned toward
    the rising sun.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The orientation is stated, but the passage does not explain its meaning.
comparison_claims:
- id: claim:1
  claim: The Waima aiyaiyai death chair is explicitly compared in the passage to the
    Koita sede, with the Waima example described as low-backed and only large enough
    to seat the corpse.
  claim_level: visual_similarity
  target: Koita sede
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage notes resemblance only; it does not establish shared origin,
    function beyond seating/display, or historical contact.
