canonical_text:
  quote: ''
  summary: 'The passage describes procedures for the Tabu Feast: village discussion,
    preliminary games, reciprocal food exchange between women and men, construction
    of the pata platform under the tabu biagu, borrowing and fattening pigs, piling
    garden food on the platform, participation of men and unmarried girls, notification
    of surrounding villages, distribution of bananas, dances, and repair or construction
    of a dubu oriented toward another feast-giving group.'
  language: English
  quote_policy: summarized
