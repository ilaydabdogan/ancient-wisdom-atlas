canonical_text:
  quote: ''
  summary: 'The passage discusses dada/oada clan badges displayed on certain marea
    and gives local origin accounts for badges: a crab-claw form derived from canoe
    sails, the Parama Kupunu akumu/garfish head established through dreams involving
    Paipai and a snake, and a paia fish tail adopted after it continued to flap after
    death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dada/oada are described as clan badges used by itsubu and especially visible
    on marea.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The relation of oada to the marea is said to apply only to the marea of the
    ovia itsipana, not to marea of the ovia awarina as chief of the left or to aruaru,
    war, or paiha marea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mainahauna clan explained its crab-claw dada by saying their people saw
    similarly shaped sails on canoes and represented the shape on marea posts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Pinupaka, the Parama Kupunu itsubu had no finished marea during the visit,
    but a marea named Kevori was being built by the ovia awarina.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Parama Kupunu story, their men went fishing and caught only akumu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: While sleeping in the marea, the ovia itsipana dreamed that Paipai told him
    to ask other clans to exchange other fish for the akumu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The other clans refused the exchange, and Paipai then told the chief in another
    dream that akumu should be the sign of the Parama Kupunu marea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A big snake ate all the akumu except their heads, and Paipai then insisted
    in another dream that the akumu head with long jaws should become the Parama Kupunu
    dada.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Aitsi Kupunu account says ancestors caught a paia fish whose tail kept
    flapping after the fish was killed, leading them to take the tail as their dada
    and carve it on marea posts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note says Paipai is more generally a name applied to certain malevolent
    beings who afflict people with disease, although in the Parama Kupunu account
    Paipai appears benevolent.
  category: attribute
  evidence_refs:
  - ev:7
