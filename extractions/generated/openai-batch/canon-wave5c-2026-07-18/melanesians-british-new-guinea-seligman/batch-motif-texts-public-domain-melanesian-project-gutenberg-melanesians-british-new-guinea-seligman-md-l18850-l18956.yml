canonical_text:
  quote: ''
  summary: The passage describes chiefly succession, adoption, civil and war chiefs,
    war invitations using areca nuts, battle-stopping gestures, qualifications for
    war-chief status, the role of the faia/fata ritual expert in warfare, a pre-raid
    ritual using a Dracaena plant implement, and a hereditary chieftainship ceremony
    involving ceremonial pig dismemberment.
  language: English with indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adoption is common among chiefly families, especially among chiefs of smaller
    immigrant clans; an adopted son is treated as a true son and may succeed to chieftainship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief may adopt the son of the leader of an immigrant group joining the
    village, so a lopia fda may sometimes not be descended by blood from hereditary
    chiefs of the clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The io lopia, described as the clan war chief, may send panicles of areca
    nuts as invitations to other war chiefs; those who accept and chew the nuts must
    help him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before joining battle, the io lopia usually invokes the name of his ufu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After successful warfare, the io lopia acts as chief during following feasts
    and ceremonies, receiving presents and taking the lead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lopia fda usually does not fight, but can stop hostilities by parading
    unarmed between combatant lines and shaking lime from his gourd.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'A new pangua is described as developing chiefly offices in sequence: lopia
    ekei may become pangua chief, later lopia fda, and only after official recognition
    can an io lopia become possible.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The io lopia dignity requires public declaration at a large feast and could
    only be assumed by a man who had killed an enemy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that victory is attributed to the magic of the faia expert,
    who medicines the warriors before fighting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A faia expert may serve several pangua across more than one settlement while
    also exercising chiefly functions in his own pangua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before an early-morning attack, the faia/fata expert accompanies the attackers,
    spits on a leafy axis of a Dracaena plant called ofe, strikes downward toward
    the hostile village, passes the ofe under his right leg, and murmurs spells intended
    to make the enemy sleep heavily.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Near the hostile village, the expert strikes the attackers’ spears with the
    ofe, crouches with the ofe doubled under his belly, blocks his ears with his fingers,
    and the warriors jump over him; the action is said to cause enemy deafness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a hereditary chieftainship qualification ceremony, an old chief advises
    a youth and may guide his hand while the youth ceremonially dismembers a pig.
  category: action
  evidence_refs:
  - ev:7
