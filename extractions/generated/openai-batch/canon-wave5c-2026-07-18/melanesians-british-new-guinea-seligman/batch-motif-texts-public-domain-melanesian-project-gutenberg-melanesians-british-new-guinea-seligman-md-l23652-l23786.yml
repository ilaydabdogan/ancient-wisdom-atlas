canonical_text:
  quote: ''
  summary: The passage first gives the end of a tale in which a hungry hag or grandmother
    tries to climb up to children in a tree and is repeatedly misdirected by the eldest
    child, suffering stings and bites. The children's father dreams of them, returns,
    learns their mother has been killed, calls them down from the gontida tree, sharpens
    a cutting tool, lures the hag with fish, and kills her. He burns the houses, attempts
    to cross to islands by canoe with his children, throws two children overboard
    to lighten the canoe, and then drowns with the eldest child. Notes explain the
    cutting tool and a house-burning custom connected with fear of sorcery. The passage
    then begins “The Boa Constrictor,” in which a boa constrictor gives birth to a
    human-looking daughter who steals garden food, is caught by a man, is taken as
    his wife, bears a son, and warns her husband not to fear if her mother comes while
    she is away.
  language: English
  quote_policy: summarized
