canonical_text:
  quote: ''
  summary: The passage describes infancy, childhood body modifications, puberty status
    terms, sleeping arrangements, naming and nicknaming practices, feeding, and ear
    and nose boring procedures, especially for Tubetube. It also states that boys
    and girls do not undergo formal puberty initiation or seclusion ceremonies in
    the described context.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child's ears are pierced while the child is still a baby.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nose boring is described as a matter of no great importance and is often delayed
    until about or after puberty in the first portion of the passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boys are said not to have initiation ceremonies at puberty; when pubic and
    axillary hair begins to show they begin, or may already have begun, sleeping in
    the potuma.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A boy named Gabiau is presented as a case of precocious puberty who sometimes
    sleeps in the potuma and sometimes in his parents' house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Girls are said not to be tattooed and not to undergo initiation or seclusion
    ceremonies at puberty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Girls are said not to abstain from gardening, cooking, or fetching water during
    their first period, and many girls are alleged to begin frequenting the potuma
    before that time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists status terms for babies, children, boys, girls, youths,
    and women; some of the terms are also used as terms of address.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that a boy might chew areca and wear armbands while still
    called koko, might be told his totems at the koko or tewera meameana stage, and
    usually would not begin to smoke until shortly before puberty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Tubetube a baby usually sleeps in the hollow of its mother's arm, on a
    petticoat, and may be covered with a mat.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the day a Tubetube baby may be placed inside a folded mat sack and
    covered with another mat if cold.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tubetube children are named within a few days of birth, often after the maternal
    uncle, though a clansman or clanswoman may suggest giving the child his or her
    own name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: As a child grows up, a nickname generally derived from a physical peculiarity
    may replace the real name; the passage gives Mwakasoki as an example, whose nickname
    means large teeth or tusks.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A child is usually suckled until a number of teeth have appeared, while also
    being given taro, yam, or banana first masticated by the mother before weaning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Tubetube the mother bores the child's ears before weaning by placing several
    komakoma on one spot of the ear lobe until sloughing creates a perforation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Each komakoma is described as a turtleshell ring with a sapisapi disc; when
    used for perforation its separated ends grip the tissue until a hole forms by
    sloughing.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: At Tubetube a child's nose may be bored from about the fourth to the eighth
    or tenth year; the mother generally officiates if the child is younger and the
    father if the child is older.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Tubetube nose boring is described as placing one or more komakoma on the septum
    until perforation occurs, after which the ring is removed, the wound washed, and
    a small stick of gradually increasing size inserted.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: A footnote reports an unconfirmed allegation that a sharpened stick might
    be thrust through the nasal septum during sleep; the author states that this could
    not be confirmed and seemed unlikely.
  category: speech
  evidence_refs:
  - ev:12
