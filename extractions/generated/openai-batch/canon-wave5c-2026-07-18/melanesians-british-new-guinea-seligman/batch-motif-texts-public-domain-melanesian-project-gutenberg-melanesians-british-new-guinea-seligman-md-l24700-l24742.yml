  summary: The passage gives a geographical and historical account of settlements
    connected with Tubetube. Lekekeu is described as deserted after its older men
    died and younger people moved to Hanavesu. Tubetube is said to have originated
    as a peaceful colony from Bebwaiya on Duau, first settled at Dagedagera by Gegera
    totem men and then joined by further Gegera and other totem groups. The passage
    also notes canoe traffic with Duau, an earlier residence at Dobu, and shallow
    wells behind the beach used as a dry-season water source.
  language: English
