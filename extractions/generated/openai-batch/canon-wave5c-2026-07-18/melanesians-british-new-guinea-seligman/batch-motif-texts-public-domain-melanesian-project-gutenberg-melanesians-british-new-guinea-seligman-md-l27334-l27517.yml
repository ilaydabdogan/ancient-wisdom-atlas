  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In warfare, eriam tried to keep together and look after each other; if one
    speared an enemy, another might spear the fallen enemy as well.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The passage explains the wartime action by saying the enemy was considered
    to have attacked the whole eriam group through one member.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Members of an eriam group ate together before fighting, though this was said
    to merge into the wider kimta fellowship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Eriam determined which of them should marry the widow of one of their comrades,
