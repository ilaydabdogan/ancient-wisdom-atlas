canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing kimta and eriam social groupings: age
    estimates for children, puberty and marriageability notes for girls, recognition
    of kimta fellowship through eating together, address and kinship terminology,
    eriam mutual aid and warfare solidarity, marital access involving wives of eriam,
    marriage-gift obligations, and marriage prohibitions among children or siblings
    of eriam.'
