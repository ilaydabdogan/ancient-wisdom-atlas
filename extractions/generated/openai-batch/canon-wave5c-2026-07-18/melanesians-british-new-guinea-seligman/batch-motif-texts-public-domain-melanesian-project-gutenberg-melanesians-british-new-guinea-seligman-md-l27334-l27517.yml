  category: attribute
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:4
  text: Kimta fellowship between mates from different communities was said not to
    be recognized until they were old enough to eat together in kimta.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man showed cautious reserve toward the womenkind of kimta mates in a foreign
    community and addressed a kimta mate's wife or sister-in-law by name rather than
    by a relationship term.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A child called the father's kimta mates and their wives by parental terms,
