canonical_text:
  quote: ''
  summary: The passage describes stone heaps, stone circles, and stone rows in several
    Massim-area localities as male sitting, yarning, meeting, and debating places;
    some were associated with cannibal feasts. It also recounts a reception and peacemaking
    episode at a stone circle near Wagawaga and notes architectural features such
    as a central water vessel and stone slab flooring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Rogea and many south-eastern district islands, hamlets had large stones
    or heaped small stones used by men as squatting and yarning places; their quick
    drying after wet weather was given as a practical advantage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that such stone heaps were said not to have been made
    in Tubetube, while stone heaps used as male squatting places were found over the
    D'Entrecasteaux group.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wagawaga and other hamlet-groups had non-cannibal gahana, stone circles used
    as clan men's squatting and debating places, and these were built by the men of
    the clan to which they belonged.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note in the passage states that no women may approach the Rogea baru.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Bagofigofi, warned men were seated within a stone circle, shouted welcome
    without rising, and Kuania led the visiting party around the outside while chewing
    and spitting areca nut before addressing the seated men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Bagofigofi episode, room was made for the white visitors inside the
    circle while Kuania remained outside; men feigned an attack on him, at least one
    with a spear; Kuania laid down a trade tomahawk and Berigi laid down hoop iron,
    after which grey-headed women embraced Kuania and peace was considered concluded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A non-cannibal gahana at Taupota was described as essentially resembling one
    at Taradiu; a shallow pottery vessel full of water formerly stood in the centre
    and was used by men as a mirror.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some Massim-area gahana had floors of slightly raised stone slabs, with examples
    or records from Fergusson Island and Rogea.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Wamira settlements of Bartle Bay, stone circles and stone lines were called
    bolabola and were said to correspond to Wagawaga gahana.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Particular bolabola, especially at Irere, were reported as used during cannibal
    feasts, while at Wedau a cannibal feast was reported to have taken place outside
    the village and not on the bolabola.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some Bartle Bay circles and rows of stone were described as old-time male
    squatting and debating places, mainly meeting and debating places for old men.
  category: setting
  evidence_refs:
  - ev:9
