canonical_text:
  quote: ''
  summary: The passage reports totem-related observances and variations at Iwa, Gawa,
    Kwaiawata, Murua, Dekoias, Suloga, Komduku, and Tokunu. It describes restrictions
    on injuring, eating, killing, wearing, or contacting one's own and especially
    one's father's totems; bird-feather ornament use and transfer; avoidance of marriage
    into a father's clan or totem; linked animal totems; an account of an old man
    of Suloga distributing clan totems; and a belief that Murua dead descend into
    the earth and are assigned places by that old man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Iwa, a man would not injure his own totem plant, but if it was a nuisance
    in his garden he might ask a man of another totem to cut it down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Iwa, people with the pig as one of their totems were reluctant to eat brown
    or yellowish pigs, and the passage says this matched the Trobriand islanders'
    practice and reasons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man could wear feathers of his totem bird as dancing ornaments, but pigeon
    and lory feathers were also worn by men of these and other totems.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In former times, a man who killed a totem bird customarily gave some of its
    feathers to a man belonging to the clan whose totem bird he had killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People showed strong respect for their father's totem animals, including not
    eating or killing a father's bird or fish totems and not uprooting or injuring
    a father's totem plant.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a father's fish totem was caught, it could be given to a member of another
    clan, who would be asked to remove it from the net.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On Kwaiawata it was said that a man would not readily ask another person to
    cut or remove his father's totem plant from his gardens, and that a man would
    generally avoid killing a snake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In former times no individual would marry into his or her father's clan; the
    passage says this custom was declining and gives Kutopara as a recent exception.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man would not wear the feathers of his father's totem bird, and if his father's
    totem animal was the pig he would not wear a boar's tusk ornament.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Murua, a totemic clan was called man, and Captain Barton was told that
    an old man of Suloga originally gave a bird and a fish totem to each clan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Murua people die, they go down into the earth and are received by the
    old man, who assigns them places.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: For Dekoias villages, the passage says everyone had linked totems from different
    vertebrate orders, no one had plant totems, and snakes appeared to be totem animals
    but received comparatively little respect.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: In Murua-related examples, pigeon totems were linked with fish, snake, and
    in one reported case pig; the word used for snake was the general word for snake
    rather than a species name.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Murua and Tokunu, there was disagreement about how a man treated his totem
    bird, but the passage says no one would hesitate to kill and eat his totem fish.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage reports individual variation in statements about eating or killing
    a totem bird, and concludes that there was no general strong feeling against killing
    and eating the totem bird at that time.
  category: other
  evidence_refs:
  - ev:11
- id: obs:16
  text: At Murua, no one would kill, eat, or willingly come into contact with his
    father's totem bird or fish.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: A man of the frigate-bird totem could wear frigate-bird feathers when dancing,
    and men of other totems could also wear them, but a man whose father had the frigate-bird
    as totem would not handle those feathers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: The same paternal-feather handling rule is reported for white cockatoo feathers,
    even though those feathers were the commonest dancing ornament in the district.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: The passage says no man would marry into his father's totem at the time, and
    that the rule had formerly been strictly observed.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:20
  text: The passage says a person was not supposed to display physical or psychical
    characters of any of his totem animals.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:21
  text: As a courtesy to his wife, a man would not eat her father's totem bird or
    fish, probably especially in her presence or when expecting intimate contact with
    her.
  category: relationship
  evidence_refs:
  - ev:13
