canonical_text:
  quote: ''
  summary: 'The passage reports customs attending the arrival of lakatoi in the Gulf:
    mooring, cessation of taboos, washing, tarua selection, reciprocal exchange of
    ornaments, pots, and sago, use of kae tallies, procurement of new asi, reconstruction
    of the vessel, cargo loading, and the partly relaxed but continuing duties of
    the tidiha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account is presented as based on repeated conversations with men who took
    part in the hiri, not on the author's own witnessing of lakatoi arrival.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arrival of the lakatoi at its Gulf destination is described as an occasion
    of rejoicing, and the vessel is moored in the river opposite its destination village.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the lakatoi is moored, taboos cease, and the baditauna, doritauna, and
    their tcdiha/tidiha leap into the water to wash off accumulated dirt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Head men of the Gulf village, with an escort, make a ceremonial visit to the
    lakatoi, and each crew member selects an individual as tarua, translated in the
    passage as friend.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The baditauna and doritauna each select two headmen as tarua and adorn them
    with personal ornaments before the rest of the crew produce and use their ornaments
    to decorate chosen friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Every ornament bestowed has a recognized value, and if accepted, a corresponding
    value is to be given in exchange.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The villagers return to their houses, kill a pig or a dog, cook it, and give
    it to the visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the next day, pots are unpacked and arranged in rows on the river-bank,
    with each man keeping his own pots separate.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Purchasers select lots of pots; the owner breaks short slivers of stick called
    kae, places two in each pot, and seller and purchaser each keep one tally from
    every pot until later payment in sago.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tallying system is said to be followed only in the Elema district and
    not in the Namau district; the Motu explanation given is that Namau has so much
    sago that it is not assigned definite value.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Men in the lakatoi who need to obtain new asi give a large shell armlet to
    their tarua.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Asi are said to be made from ilimo, a large soft-wood tree growing close to
    rivers in low alluvial reaches.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Gulf natives bring measurements of required trees, fell satisfactory trees,
    and float them downstream; visitors haul them onto the river-bank, hollow them
    out, and shape them into asi without using fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: While the lakatoi crew work on asi, most local natives live in the swamps
    making the required quantity of sago.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After new asi have been made, the lakatoi is taken apart and reconstructed
    on a larger plan; sede may not be beaten and songs may not be sung until reconstruction
    is complete, after which lakatoi songs may be sung except 'Lara toa.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Sago parcels called gorugoru and turua are loaded first, followed the next
    day by smaller parcels called kokohara, and each man's sago quantity is checked
    by the kae.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:17
  text: While the lakatoi remains beside the Gulf village, the tidiha lose much of
    the sacredness of their office and may go ashore and eat without restriction,
    but they remain in charge of the vaina aboard and must remove their sihi before
    going ashore.
  category: relationship
  evidence_refs:
  - ev:9
