canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Wedau and Southern Massim
    totemism, especially Gelaria clans and their totems. It reports that Gelaria people
    agreed that the great snake Garuboi ordained and distributed the totems; it also
    describes exogamy, matrilineal descent, food and injury taboos, special relations
    between Elewa people and dogs, other clan-specific totem practices, the Warorovuna
    stone used for war strength, avoidance of totem snakes, clan restraint in battle,
    and restrictions concerning a father's totem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists Gelaria clans and named totems, including Garuboi as a constrictor
    snake, Gabubu as a pigeon, Binama as a hornbill, Poro as a pig, and Dagasi as
    a dog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gelaria informants agreed that the great snake Garuboi ordained and distributed
    the totems.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One explanation given for totems was that they served as clan signs to prevent
    clan incest; another suggested an undefined affinity because totem animals were
    in some vague way made of the same material as their clansmen.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Clan descent is described as taking place in the female line, and members
    of the same clan were not to intermarry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man generally would not eat the flesh of his totem animals, though in some
    instances he might kill them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Garuboi man said that if he injured a hornbill, the hornbill would be sorry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: An Elewa man would not eat dog; dogs would not bite him even in strange hamlets;
    Elewa men were fond of dogs, buried dead dogs, fed dogs the same food they ate,
    and believed their dogs helped them more than other dogs helped their owners.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Other clan examples include a Logaloga man killing and wearing feathers of
    the red parrot but not eating it; an Ianibolanai man not killing or eating the
    monitor lizard but using drum skin made from it; an Iaronai man keeping but not
    eating white pigs; and a Lavarata man not collecting or burning Modewa wood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Warorovuna is described as a totemic stone; pieces were chipped off and boiled,
    and the water was drunk to give strength in war. It was given only to allies,
    and enemy skulls were placed near the stone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man would go around his totem snake on the road to avoid touching it, and
    if he saw a dead Garuboi he would feel sorry, whatever his clan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports an idea of real but ill-defined affinity or sympathy between
    a man and his totem, while adding that this did not seem to imply physical or
    psychical resemblance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In battle, a man would not throw spears at men of his own clan but would turn
    aside; if he killed one accidentally he would be reproached, but no further action
    would be taken.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man would not eat or injure his father's totem; if it were a snake he would
    avoid it and likely be frightened, while believing it would not hurt him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that a man might not marry into his father's clan, and
    that a visitor would ordinarily stay with a clansman or, if married, with his
    father-in-law.
  category: relationship
  evidence_refs:
  - ev:8
