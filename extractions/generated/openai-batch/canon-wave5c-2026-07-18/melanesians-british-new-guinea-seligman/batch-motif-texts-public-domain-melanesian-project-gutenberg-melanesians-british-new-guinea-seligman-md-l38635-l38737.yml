- id: obs:4
  text: A clan chief receives deference and privileges; if he does not fish, men of
    his own clan are expected to bring him part of their catch when he has no fish.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a paramount chief's garden, men of his clan clear bush, he feeds them
