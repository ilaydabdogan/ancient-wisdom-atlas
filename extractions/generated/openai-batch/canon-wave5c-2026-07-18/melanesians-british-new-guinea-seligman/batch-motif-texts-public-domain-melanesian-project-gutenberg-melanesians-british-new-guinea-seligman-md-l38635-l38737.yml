canonical_text:
  quote: ''
  summary: 'The passage describes chieftainship on Gawa and nearby Marshall Bennet
    contexts: the fish-hawk totem chief Yoseli is treated as paramount chief of the
    island; chiefly status is hereditary; commoners show bodily deference; clan members
    provide labor, fish, seed yams, bananas, planting help, and feast shares; chiefs
    charm clan gardens by spells and crop-specific sticks; older family heads also
    exercise authority in hamlets.'
