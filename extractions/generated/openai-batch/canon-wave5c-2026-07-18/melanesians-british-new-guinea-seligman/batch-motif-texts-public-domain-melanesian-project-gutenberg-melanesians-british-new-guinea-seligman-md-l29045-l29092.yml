canonical_text:
  quote: ''
  summary: The passage describes etiquette for a stranger visiting a girls' potuma
    in a community with girl-houses, then describes Tubetube courtship practice where
    a youth, with a girl's assent, makes a night visit through the woman's door, preserves
    an appearance of secrecy, leaves before daylight, and may be urged toward marriage
    if discovered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stranger visiting a community containing a girl-house would usually visit
    the girls' potuma in the evening, unless he was married and travelling with his
    wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local man acting as ambassador would introduce the stranger and avoid slurring
    his name or otherwise disadvantaging him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports no jealousy about introducing strangers to the potuma,
    and says a stranger was under no disadvantage and perhaps had some advantage from
    coming from a distance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: If a visitor did not want to go to the potuma, he was not pressed, and this
    refusal was not treated as a breach of etiquette.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At Tubetube there are no girl-houses, and the described practice is said to
    hold over a considerable part of the south-eastern district.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A youth desiring connection with a girl, or willing to accept her advances,
    asks whether she will receive him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the girl assents, the youth waits around the house until talking ceases
    and the older occupants may be presumed asleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The youth enters by the back, identified as the woman's door, and finds the
    girl waiting by the woman's fireplace near that end of the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The youth stays with the girl during most of the night, talking in low tones
    so as not to disturb the other occupants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The youth leaves before daylight by the same door he used to enter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Decorum requires an appearance of secrecy, even though people in the house
    may know what is happening and discuss it among themselves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: If the youth oversleeps and is discovered in the morning, marriage is generally
    suggested and often agreed to, though the boy may face the situation without being
    threatened or abused and may return another night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After a first night together, the boy returns only if the girl asks him to
    do so; the proposition for a second night is said never to come from the male.
  category: relationship
  evidence_refs:
  - ev:6
