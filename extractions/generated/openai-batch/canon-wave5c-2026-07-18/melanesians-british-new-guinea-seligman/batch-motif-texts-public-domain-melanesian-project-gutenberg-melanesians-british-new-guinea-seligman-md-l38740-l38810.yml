canonical_text:
  quote: ''
  summary: The passage describes reported family, pregnancy, childbirth, lactation,
    sex-preference, multiple-birth, and totem/adoption customs. Children, especially
    boys, are desired; barrenness may be treated by a medicine man. Pregnancy may
    be celebrated with a feast, childbirth has no special ceremony, and after birth
    a woman avoids cold water. A husband’s access to the birth-house differs between
    a first and later child. Placenta and navel string are buried without ceremony.
    A sexual prohibition during lactation is linked to the child’s illness or death.
    Families with only daughters are disfavored; a third successive daughter might
    formerly be killed. Women with twins or triplets are ridiculed by comparison to
    pigs. Children take the mother’s totem, and adopted children retain their original
    totem.
  language: English
  quote_policy: summarized
