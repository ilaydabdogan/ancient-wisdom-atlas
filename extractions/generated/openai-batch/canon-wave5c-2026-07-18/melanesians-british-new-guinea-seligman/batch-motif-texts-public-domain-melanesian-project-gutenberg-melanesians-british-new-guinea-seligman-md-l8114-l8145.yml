canonical_text:
  quote: ''
  summary: The passage describes reported attitudes toward homicide, revenge, abortion,
    and treatment of strangers. Homicide is said to have been condemned mainly when
    it endangered the local group through the dead person's kin or involved a clansman,
    relative, or friend. Intertribal warfare is described as involving the killing
    of captured women and children. Revenge is described as a former sacred duty of
    the dead man's brothers and henamo. Abortion is said to have been formerly practiced
    without a sense of wrongdoing. Strangers are said not to have been killed merely
    as strangers and generally to have been well treated, with comments on Moresby
    and later mission contact near Port Moresby.
  language: English
  quote_policy: summarized
