canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic statements about human flesh as food, then
    describes a Wagawaga-Maivara revenge episode: Maivara men ambush a Wagawaga canoe,
    capture Keori and Bonadiero, publicly taunt Wagawaga with the captives, eat Keori,
    and spare Bonadiero through adoption and later restoration. It also reports a
    boy protected by women’s petticoats and adopted, and notes preparations and a
    required feast before Wagawaga revenge-seeking.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human flesh is reported to resemble pig in flavor, to have a more delicate
    flavor, and not to produce the swelling, sickness, satiety, or vomiting attributed
    to eating too much pig flesh.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An individual or individuals eaten in revenge for a comrade previously eaten
    by a hostile community are called maia or maiha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maivara men used three canoes at night to ambush a Wagawaga canoe near Seraumi,
    drove it ashore, and captured Keori and Bonadiero.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prisoners were bound, put into a Maivara canoe, and deliberately carried
    past Wagawaga on the return journey.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Opposite Wagawaga, the captors drummed, shouted, gesticulated, blew conch
    shells, danced, stripped the captives, waved the captives’ garments, yelled their
    names, and described how they would be cooked and eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bonadiero cried and repeatedly tried to escape, while Keori appeared resigned
    to those watching from shore.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Keori was eaten after usual preliminaries; Bonadiero was not injured, was
    adopted by Taumaia, and was later taken by Rabi guests and restored to her own
    people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a reported parallel case, women protected a boy from being killed by throwing
    their petticoats over his body; no man dared touch him while he was under that
    protection, and he was later adopted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Wagawaga, revenge was resolved upon but delayed for about six weeks to
    reduce Maivara watchfulness; canoes and weapons were prepared, and a feast called
    ogatara or losuma was held before any party could seek maiha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A prisoner sharing a captor’s totems might be ransomed through articles of
    value, with help sought from a friend or connection able to influence the captor
    to accept a smaller ransom.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A linguistic note states that Taumaia means payer or redeemer, and that maia
    or maiha is the common term for paying, repaying, payment, or price.
  category: other
  evidence_refs:
  - ev:9
