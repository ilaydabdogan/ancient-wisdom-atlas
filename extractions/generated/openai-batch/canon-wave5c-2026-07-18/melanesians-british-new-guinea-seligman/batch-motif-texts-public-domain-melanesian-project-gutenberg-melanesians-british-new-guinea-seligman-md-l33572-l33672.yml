literal_observations:
- id: obs:1
  text: A walaga was held behind Diwari on September 24-25, 1907, in a village built
    in scrub on a level mountain spot about 1200 or 1500 feet above the sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old woman argued for a site near the gardens because she would have to
    prepare much taro and did not want to go to the beach; the others agreed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The temporary village was built in a rough square, with most houses specially
    built on piles about six feet from the ground and belonging to different clans.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each house had a low partition dividing men's and women's compartments; men's
    doorways faced the inside of the square, while women's doorways were generally
    at the side with their end toward the scrub.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Raised houses had distinct marks on the main central bearer, including black-and-white
    designs and black circles associated with particular clan houses; the potuma bore
    a single black circle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The potuma was intended as a sleeping place for fasting men, though not all
    fasting men slept there; Tebari, the feast chief, slept in his own house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred mango was seen in the potuma without covering, and the observer
    reports that handling it caused no objection.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Timber for the platform was cut and brought in weeks before erection, and
    the walaga mango was cut while the platform timber still lay on the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Medicine men placed charms in the platform post holes and said that they extracted
    a human bone from one post; the charms were intended to prevent visitors to the
    walaga from becoming sick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A dawati pole about thirty feet high stood in the center of the platform,
    with strings tied from its top to house gable ends; urupou poles around the platform
    edge were used for dancing.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The walaga mango was cut on August 27, 1907, and the passage says it must
    be kept distinct from other mangoes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note compares the Diwari bearer designs with similar designs at Wagawaga,
    where similar designs were said to be decorative in intent.
  category: other
  evidence_refs:
  - ev:8
