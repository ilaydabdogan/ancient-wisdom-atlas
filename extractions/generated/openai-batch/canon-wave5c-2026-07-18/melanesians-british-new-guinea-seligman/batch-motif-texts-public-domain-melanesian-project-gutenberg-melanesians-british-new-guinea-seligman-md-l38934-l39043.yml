canonical_text:
  quote: ''
  summary: Ethnographic description of courtship, marriage negotiation, bridewealth,
    return gifts, post-marital residence, intermarriage, exogamy, and distribution
    of marriage property in the Trobriands and the Marshall Bennet Group.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Trobriands, courtship is described as more or less prolonged cohabitation,
    with the girl receiving her lover at night in her parents' house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trobriand parents may suggest marriage when the relationship appears not to
    be merely temporary; the text says it is not clear whether the girl herself would
    suggest marriage, though it is considered likely.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a Trobriand match is agreed and regarded as consummated, the boy takes
    the girl to spend the night in his father's house; the next day the bridegroom's
    father sends a substantial present to the girl's relatives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Trobriand return presents are said usually to consist only of food, and the
    valuable shell jewellery sent by the boy's people is not repaid.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a named Trobriand example, Makuniga's people sent ceremonial axe blades,
    armshells, and a sapisapi necklace; the bride's mother received the present and
    distributed part of it among siblings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Trobriand bride first comes to her husband's village, and gardens are first
    made on the husband's land before a garden is commonly started on the wife's land.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A married Trobriand man visiting his wife's village stays with his father-in-law,
    and the passage states that a man may speak to his mother-in-law and a woman to
    her father-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A divorced Trobriand woman returns to her parents' house, usually taking her
    children with her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Marshall Bennet islanders are described as intermarrying freely among
    the islands, despite former fighting between certain islands.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Marshall Bennet Group, no one now marries into his own clan; formerly
    no one would marry into his or her father's clan, though the text gives Kutopara
    as a recent exception.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Marshall Bennet courtship is described as prolonged cohabitation, with the
    marriage proposal apparently coming from the girl or sometimes from the girl's
    father, followed by discussion among the parents of both parties.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Marshall Bennet marriage exchange, the boy's father gives a large present
    to the bride's parents, who return uncooked vegetable food, a large pig, and usually
    some shell jewellery; the girl's parents generally receive more than they give.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Examples from Gawa, Kwaiawata, and Iwa list gifts including ceremonial axe
    blades, bagi, armshells, pigs, vegetable food, sapisapi belts, beads, and calico.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
- id: obs:14
  text: Bridewealth is said to be received by the girl's father but distributed among
    her mother, father, siblings, and maternal and paternal uncles and aunts.
  category: relationship
  evidence_refs:
  - ev:13
