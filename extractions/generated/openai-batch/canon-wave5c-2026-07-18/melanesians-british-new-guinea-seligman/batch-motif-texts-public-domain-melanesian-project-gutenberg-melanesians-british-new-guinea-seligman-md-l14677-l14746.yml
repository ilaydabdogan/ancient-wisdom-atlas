canonical_text:
  quote: ''
  summary: The passage describes Roro childhood naming customs, including names derived
    from animals, plants, natural features, relatives, fathers, friends, foster-mothers,
    dead kinsmen, and adopters. It also describes adoption-related clan and rank implications,
    late weaning, and childhood ear and nose piercing without ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro names are described as deriving from animals, plants, and natural features
    and as being given to girls or boys without sex distinction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person is not obliged to avoid eating or injuring the plant or animal from
    which that person's name is derived.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Children are named when quite young, and a child commonly receives two names:
    the second is the father''s first name, while the first may be a relative''s name
    or an animal, plant, or natural feature chosen by the parents.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Choosing a friend's name for a child is described as complimentary, and the
    same friend's name could also be given to a favourite pig.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A child may bear the father's two names in inverted order.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Roro are said not to practise name-changing or nicknames.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sick mother's child was suckled for the first days of life by a woman of
    another clan who was connected by marriage, and the child was given that foster-mother's
    name in gratitude.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A name may be agreed before birth, including the name of a dead kinsman if
    the child is male.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: An adopted child may take the adopter's name if the adoption arrangement is
    made before birth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Early adoption is said to place the child in the adopted father's clan, prohibit
    marriage into that clan, and possibly allow assumption of an adopted father's
    rank if he is a chief.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Children are weaned comparatively late and receive vegetable and fish food
    before weaning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Children's ears are pierced at about six to eight years old, with two holes
    in each ear; the nasal septum is pierced at about ten or eleven years old.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The ear and nose piercing operations are described as having no ceremony;
    a thorn is used, blood is washed away with water, and leaves are inserted to keep
    the wounds open.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A boy called miori from babyhood remains called miori after ear and nose piercing.
  category: attribute
  evidence_refs:
  - ev:10
