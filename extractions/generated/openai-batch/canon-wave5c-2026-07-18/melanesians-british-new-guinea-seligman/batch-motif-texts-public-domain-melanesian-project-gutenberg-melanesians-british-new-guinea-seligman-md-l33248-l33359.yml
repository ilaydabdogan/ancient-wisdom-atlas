canonical_text:
  quote: ''
  summary: 'The passage describes parts of the walaga feast: a mango tree is cut with
    a special stone adze, ritual debris is wrapped, and the tree is carried in procession
    to the village with pearl shells, the adze, fasting participants, music, shouting,
    and dancing. The tree and associated objects are kept from ordinary use and stored
    with walaga things. At the feast site, houses are decorated, vines run from the
    mango to houses, guests bring pigs in processions, branches are stuck into house
    walls to mark connections with the pigs, mango poles are processed or placed,
    and fasting dancers wash, are oiled, dress, and dance before breaking their fast
    at home.'
  language: English
  quote_policy: summarized
