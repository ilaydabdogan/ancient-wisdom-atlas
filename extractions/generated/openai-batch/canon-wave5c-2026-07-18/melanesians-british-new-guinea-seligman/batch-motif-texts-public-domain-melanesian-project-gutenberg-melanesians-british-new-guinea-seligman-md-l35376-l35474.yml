canonical_text:
  quote: ''
  summary: The passage describes dances connected with mortuary observances; a wapa
    ceremony in which the dead man's brother presents pigs and the wapa and dunali
    shells are destroyed; timing and participation rules for the torela feast; an
    account of a torela closing mourning restrictions; and Gelaria burial and mourning
    customs compared with Wamira.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At sundown, younger men return and dance for many evenings; each evening is
    reserved for one dance, with pediri described as the favorite, and dancing upon
    the watara is said not to occur.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wapa of the dead man is removed from the body by his brother and kept
    in the brother's house until the toreha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the toreha, the brother presents a large pig to the aii of the dead man,
    and the wapa is tied to one forefoot of the pig as it lies fettered on the ground
    with a pole beneath its feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the aii carry away the pig, one of them removes the wapa, which is burned
    as soon as the pig is singed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dunali shells from the wapa are kept; later, the dead man's sisters fatten
    a large pig and present it to their brothers, after which one of the aii breaks
    the dunali and the dead man is considered completely finished.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Both pig presentations are called gamapuyaga, and the interpreter explained
    them in terms of reciprocal feeding between brothers before death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The torela is postponed after subsequent deaths in the community, except infant
    deaths, until all the banivi for the latest death have been eaten; this commonly
    places the torela about a year after the last death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The torela is eaten only by people who are not from the community that provides
    it; visitors may bring food for smaller clan feasts, but this is said not to be
    part of the torela.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A death of an influential person can postpone a torela more than the death
    of a less important person, and a taboo may prevent dancing and drum-beating until
    it is lifted by a major torela.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: During one feast, certain women came to the chief, who put small portions
    of vegetable and flesh food into their mouths; drums were struck, and mourning
    badges were probably removed from the women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At the distribution of food, names were called and pork and food were thrown
    down for those named; the occasion also included public discussion of bad behavior
    and a man's indignant refutation of an accusation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Gelaria, the corpse is carried to the grave in a squatting posture, with
    clenched fists beneath the lower jaw, legs tied together, and arms lashed to the
    body to make a compact bundle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At Gelaria, a chief would be buried with some ornaments and in a squatting
    position, while a commoner would be buried lying on his side; in either case the
    body faces the direction from which the dead man's clan is believed to have come.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'Children of the deceased wear mourning for their father: boys are blackened
    and wear armlets, while girls wear armlets and a mourning necklace.'
  category: attribute
  evidence_refs:
  - ev:11
