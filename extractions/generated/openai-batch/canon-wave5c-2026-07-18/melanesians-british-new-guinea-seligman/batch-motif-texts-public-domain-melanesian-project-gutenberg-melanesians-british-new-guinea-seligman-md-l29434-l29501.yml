  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same individual could be successively married to various women in neighbouring
    hamlet-groups or in hamlets of one hamlet-group without any spouse having died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tauyareke first married Bonowaia, a Maivara woman, when he was about eighteen
    and lived with her at Maivara for about two years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tauyareke’s daughter by his first marriage sometimes comes to Wagawaga to
