  text: At Wagawaga, it is denied that any man currently has more than one wife, and
    former cases of men with two wives are described as few.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, quarrels between an old wife and a new wife are said to have
    caused discomfort to the common husband, and a first wife might return to her
    parents if a new wife were taken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Tubetube, polygyny is said to have formerly existed to a limited extent;
    each woman had her own house, and quarrels between co-wives were apparently uncommon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Tubetube, no rule is reported for how much attention a man should pay to
    each wife, and it was assumed that one wife would naturally become the favourite.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that many valid marriages formerly lasted only a short
    time and could be dissolved by mutual agreement or without strong opposition.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage links the absence of a considerable wedding price and the presence
