  summary: The passage states that marriage regulation depends on avoiding marriage
    within forbidden degrees of kinship extending to third cousins. It notes that
    marriage within the iduku/iduhu is rare despite no avowed objection, that many
    marriages occur within the same or neighbouring villages, and that the rarity
    of iduhu marriage may be due to the difficulty of avoiding consanguinity violations
    among members of the same iduhu.
