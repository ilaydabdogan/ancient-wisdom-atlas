canonical_text:
  quote: ''
  summary: 'The passage describes several puberty or initiation observances: male
    initiates called agariria build and sleep in a separate potuma, observe seclusion
    and taboos, work, hunt, fish, receive instruction, cleanse and adorn themselves
    at the end, and return home; a Gelaria boy called ilaike observes viginana abstinence
    before pubic hair, receives instruction from his father, bathes, is adorned, and
    is feasted; Wamira girls formerly underwent a shorter seclusion around puberty
    with movement and food restrictions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Male initiates go to the gardens, work until the heat of the day, and then
    build a sleeping hut away from other houses near the outskirts of the settlement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sleeping hut is called potuma, the same name as the clubhouse, and the
    initiates are termed agariria.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the hut is being built, the boys sleep on the sand and avoid the settlement,
    passing through it only at night when all are asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the potuma is finished, the boys sleep there but spend days in the gardens
    and on the seashore; their mothers cook food for them using special small pots.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The initiates are seen by others but avoided, and old men visit the potuma
    to talk to the boys and repeat taboos that must not be broken.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: No clan or kimta separation is made in the potuma, and the seclusion lasts
    from the flowering of the orabu rush until the sun reaches its most northerly
    direction, a period described as four to six months.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: During seclusion the initiates may hunt and fish, but their quarry must be
    given to their mothers, fathers, and mothers' brothers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the close of seclusion there is a hunt, the boys recover belts and ara,
    cleanse themselves in the sea wearing leaf girdles, comb their hair, oil themselves,
    paint their faces black and red, return to their fathers' houses, and the initiation
    potuma is left to rot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Gelaria, a boy without genital hair is called ilaike and begins ceremonial
    abstinence from flesh and fish, called viginana, before pubic hair begins to grow.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: During viginana the Gelaria boy may eat vegetable food and hunt, but does
    no garden work and may no longer cross to the women's side of the household floor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Gelaria boy's boiled food is prepared by women, passed to him by a man
    in a reserved pot, and returned by him to one of the men rather than to the women.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Gelaria boy's father instructs him to behave as a man, obey commands in
    war, and share food fairly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: At the end of viginana the Gelaria boy bathes in the river, receives a new
    belt and ara from his father, has his hair publicly combed by his father, wears
    a comb, lets his hair grow, has his face blackened, receives ornaments, and a
    settlement feast is prepared.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Wamira, girls formerly known before catamenia as gidara were secluded around
    puberty in an existing settlement house for one to three months.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Wamira girls could be visited by women and could leave by daylight, but
    they were not allowed out at night, did not visit gardens, had food brought and
    cooked for them, and abstained from flesh food.
  category: action
  evidence_refs:
  - ev:6
