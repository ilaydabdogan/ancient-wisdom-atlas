canonical_text:
  quote: "“the skull is painted red and kept in the rupu”"
  summary: The passage describes a turtle-net ceremony in which clan nets are left
    in the rupu with the chief, who ritually treats them; after turtle fishing the
    catch is cut up and apportioned by the chief, the head is kept and later its skull
    is painted red and stored in the rupu. The passage then gives regional ethnographic
    notes on Keveri, Cloudy Bay, Orangerie Bay, Mailu social divisions, skull houses,
    women's exclusion from those houses, tattoo patterns, and linguistic/cultural
    comparisons with neighboring groups.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Before turtle fishing, men of each clan take their nets to the rupu of their
    clan, where the clan chief lives, and leave the nets there until evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The clan chief is alone with the nets for part of the day and 'medicines'
    them while wearing armshells, feathers, and bunches of herbs between the armshells
    and his arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the evening the nets are collected, piled in one large craft, and accompanied
    by smaller canoes holding most of the fishermen; turtles are driven into the nets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the turtle drive, each clan takes its nets and the turtle caught in
    them to the house of its clan chief, where the turtle is cut up and apportioned
    by the chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The clan chief keeps the turtle head; it is cooked the next day and placed
    on top of the nets, and its flesh is eaten by all the clan except the chief.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's wife may receive a portion of turtle that may be cooked and eaten
