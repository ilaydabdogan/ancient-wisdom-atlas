canonical_text:
  quote: ''
  summary: The passage describes Tokunu mortuary customs involving ceremonial platforms,
    coconuts used as taboo signs and feast supplies after a death, a funeral feast
    with pork and vegetables distributed by a feast master, abstention and food taboos
    among specified kin, avoidance of names of the dead, and cliff or cave burials
    at Murua containing cleaned bones, red-painted bones, clay pots, and turtle-shell
    ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tokunu settlements named are Wapuru, Roguau, Lasinawia, and Sipwararo;
    the first three are described as predominantly frigate-bird totem settlements,
    while Sipwararo belongs to the blue pigeon totem.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: With the exception of Lasinawia, each Tokunu settlement is said to have a
    ceremonial platform called a nakanaka, and in multi-clan settlements the platform
    is said to belong to local representatives of the frigate-bird totem.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Wapuru nakanaka was covered with sprouting coconuts; additional coconuts
    were impaled on sticks around it, and a transverse stick decorated with white
    Ovulum ovum shells was supported above the platform.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Wapuru nakanaka decoration was explained as being on account of the death
    of Agiatau, the principal man of the settlement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The coconuts of Wapuru were said to be preserved until the last funeral feast,
    and the coconuts on the nakanaka acted both as a taboo sign on settlement coconuts
    and as a supply for the feast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: For a less important man, coconuts in his settlement would be preserved only
    from the time of a feast corresponding to one of the Wagawaga banakivi, rather
    than from the time of death onward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: There was no display of coconuts on the Roguau nakanaka, and Lasinawia had
    no nakanaka in 1904.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage concludes that at Tokunu only the coconuts of the dead man's settlement
    become taboo on his death, while sprouting coconuts at Sipwararo were explained
    as unrelated to Agiatau and intended for a feast at Murua.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pigs for the Wapuru feast were to be brought from Tubetube, Murua, Kwararo,
    Gawa, and Misima, while vegetable food was to be collected by all Tokunu settlements
    and stacked in Kamtau's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the pigs were killed, singed, and washed, they were to be taken to the
    nakanaka and cut up there, while vegetable food was brought from storage and piled
    on the platform.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kamtau, described as giver or master of the feast, would stand on the nakanaka,
    call each man, woman, and child by name, and throw down a present of pork and
    vegetables.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The pork was cooked at the settlement giving the feast; after visitors ate
    part or all of it, dancing would begin and continue through the night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: No one of the dead man's clan partook of the feast, and the deceased's sons-in-law
    and their children also abstained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: A man on the island may not eat pig from his dead father's settlement, nor
    coconuts, yams, and bananas from his dead father's garden; if the rule is broken,
    the offender's belly and face would swell and he would die.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The same food rule is said to apply to the dead man's brothers' children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: Everyone avoided mentioning the names of the dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:17
  text: Cliff burials between Suloga and Wanai Bay were located among sharp dolomitic
    limestone pinnacles with crevices, hollows, shallow rock shelters, and caves.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:18
  text: Many of the rock hollows and caves contained human bones that had apparently
    been scraped clean before being brought there.
  category: object
  evidence_refs:
  - ev:6
- id: obs:19
  text: Smaller bones of the extremities were generally absent, while scapulae, pelvic
    bones, larger long bones, and skulls were the bones found in greatest number.
  category: object
  evidence_refs:
  - ev:6
- id: obs:20
  text: Many skulls and some long bones had been painted red in part.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:21
  text: Bones of more than one individual were often contained in large clay pots
    identified as coming from Kwatota in the Amphlett Group, and in some cases a small
    round hole existed in the pot.
  category: object
  evidence_refs:
  - ev:7
- id: obs:22
  text: One skull exposed in a cleft in rocks at Murua had large turtle-shell ornaments
    removed from the zygoma.
  category: object
  evidence_refs:
  - ev:7
