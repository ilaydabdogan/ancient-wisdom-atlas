canonical_text:
  quote: ''
  summary: 'The passage describes Wagawaga banahivi mourning feasts after a death:
    preparation by the dead man’s kin, pig slaughter, vegetable food, cooking by the
    widow’s hamlet, reciprocal melum gifts by people of the dead man’s totem, food
    division for the gariauna and a totem hamlet, named hamlet exchange relationships,
    a sequence of feasts with coconut taboos, a final larger feast ending the taboo,
    and an observed Yabarawa-Hehego example.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two to four weeks after a death, the dead man’s family, including his father
    and widow, prepares the first banahivi feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vegetable food for the feast is supplied partly from the family’s gardens
    and partly from the dead man’s gardens; pigs belonging to them are killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the last banahivi, all remaining pigs belonging to the dead man must be
    slaughtered, and his coconut palms cease to be taboo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each banahivi is cooked by the widow and other people of her hamlet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People who take away and eat the banahivi give a return present called melum,
    made of two or three pots of cooked vegetables, to the dead man’s relatives who
    prepared the feast food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a banahivi, half the food is placed in one heap for the gariauna of the
    deceased, while the other half goes to one hamlet of the dead man’s totem and
    is taken by men of that hamlet or their wives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Particular hamlets regularly exchanged banahivi, and extension to other totem
    hamlets could occur when the hamlets were closely related or recently separated
    from a parent hamlet.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The passage gives examples of changing hamlet exchange relationships, including
    an exchange ending after Modewa failed to make an adequate return for a feast
    provided by Yabarawa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage lists present banahivi exchange pairs among named hamlets and
    stocks, including Wagawaga with Wagawaga Pupuna, Modewa with Duria, Modewa with
    Dobuapa, and immigrant stocks of Yabarawa with Hehego.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Part of the food of the gariauna might be given to their small children, while
    their wives might object that the children belonged to their clan rather than
    to the father’s clan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Banahivi recur at intervals of one or two months; after a particular feast,
    usually the third, a gwara taboo is placed on all coconuts in the dead man’s hamlet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The last banahivi occurs ten or twelve months after the first, is larger,
    includes killing ten or twelve pigs including all of the dead man’s pigs, and
    ends after tabooed coconuts are knocked down, hung, preserved, and later eaten
    with the feast food.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In an observed Yabarawa case, the dead man’s sister provided a pig borrowed
    from her husband’s mother at Wagawaga Pupuna; the pig was brought to Yabarawa
    with conch-shell blowing and laid by the sister’s house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the observed case, after vegetable cooking was complete, the pig was killed
    and cut up; its flesh and the vegetables formed the banahivi, which was fetched
    by people of the immigrant stock of Hehego, who brought three pots of cooked taro
    as melum.
  category: action
  evidence_refs:
  - ev:10
