canonical_text:
  quote: ''
  summary: 'The passage describes the staged building and official opening of a new
    marea clubhouse: chiefs and itsubu organize labor, materials are gathered, carved
    posts are erected, food is distributed, dances are held, carvings are concealed
    and later unveiled, friendly villages are invited through areca-nut messages,
    reciprocal food contributions are expected, and pigs are laid out and apportioned
    by local chiefs on the morning after the night dance.'
  language: English with local terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new marea requires an inauguration ceremony before it is used for ceremonial
    purposes, although men may gossip or sleep there before the ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The itsubu building the marea collect and prepare wood and other necessities,
    while chiefs and old men carve posts and make rope, and younger men dig holes
    and do rougher work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Doubtful matters about the marea are settled by two chiefs, with the ovia
    itsipana taking the lead.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before erection begins, the ovia itsipana sends bunches of areca nut to chiefs
    of neighbouring itsubu to request their clans' help in setting up the posts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men of the local group and their helpers carry heavy carved posts from the
    forest or shore and assist in setting up the piles, while the owning local group
    provides food for visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the first day the posts, piles, and rafters are put up; that evening pig
    and dog meat is distributed and a dance is held with both men and women.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women gather leaves and men fasten them to strips of creeper and twine them
    on the marea posts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Later work includes fixing small rafters, inviting chiefs by areca nut to
    help put on the roof, building the front platform shortly before the opening,
    and concealing the carvings from view.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the opening, men fish and smoke the catch and erect bamboo poles hung
    with food and streamers of palm leaf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chiefs invite friendly villages with areca nut; each visiting chief is expected
    to bring six to twelve bunches of bananas and receives food for himself and his
    people in return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women collect wood for fires, men prepare feather gear, pigs for the feast
    are caught, and visitors are received informally before the night dance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the main dance begins, coconut-leaf curtains are drawn aside, local chiefs
    speak from the itara, and the carvings are uncovered.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The dance continues until morning, and sometimes rival villages or clans compete
    to see which can continue the longest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The following morning, pigs supplied by the local group are placed on heaps
    of coconut leaves in front of the marea, and local chiefs portion them out.
  category: action
  evidence_refs:
  - ev:9
