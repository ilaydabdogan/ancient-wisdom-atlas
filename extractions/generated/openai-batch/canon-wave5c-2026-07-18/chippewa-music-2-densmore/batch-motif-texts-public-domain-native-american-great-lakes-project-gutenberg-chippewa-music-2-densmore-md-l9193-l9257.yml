canonical_text:
  quote: ''
  summary: A victorious war party returns toward its village. Runners announce the
    approach, the warriors rehearse victory songs and dress finely, women come out
    to meet them, receive and carry scalps fixed in hoops on poles, and lead a singing
    procession. In the village, food is set out beside the scalp poles for a feast
    called “feasting the Sioux,” followed by gifts and a song honoring the victors,
    whose intended meaning is explained by Odjib'we.
  language: English
  quote_policy: summarized
