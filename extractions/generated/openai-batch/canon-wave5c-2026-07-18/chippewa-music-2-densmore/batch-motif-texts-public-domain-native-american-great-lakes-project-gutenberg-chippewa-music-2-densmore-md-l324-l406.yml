literal_observations:
- id: obs:1
  text: A test of interval-formation included 40 songs recorded at Waba'cing, 50 war
    songs of Odjib'we recorded at White Earth, and 14 songs recorded by E'niwilb'e
    at Lac du Flambeau.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war songs of Odjib'we showed no interval-formation, while interval-formation
    was found in 4 Waba'cing songs and 3 Lac du Flambeau songs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that the Waba'cing and Lac du Flambeau material would seem
    to represent an older culture than the war songs of Odjib'we.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The minor third is described as prominent in Chippewa music, and the average
    interval of progression is given as 3.1 semitones.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pitch/key method sets the phonograph to 160 revolutions per minute, records
    a pitch-pipe tone C before the song, and later adjusts transcription playback
    so the recorded C matches the pitch-pipe C.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that the last tone is usually the lowest tone and tonic,
    that 95 percent of the songs were recorded by men, and that many songs are in
    the major keys of F, G flat, and G.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rhythmic analysis considers both instrumental and vocal expression, and most
    songs were recorded with drum accompaniment.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among songs not transcribed only in outline, 63 percent begin on the accented
    part of the measure; the rhythmic unit often occurs in the first measure, and
    the first tone is usually high.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that interest in a Chippewa song frequently diminishes
    as the song proceeds, with some closing measures containing repeated characterless
    phrases.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After deducting songs transcribed in outline, 50 percent of the remainder
    begin in double time and 40 percent in triple time; measures with five or seven
    counts are described as single units without secondary accent.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage notes similar five-count measures in other studies and seven-count
    measures in Omaha music.
  category: relationship
  evidence_refs:
  - ev:6
