  summary: The passage describes an evening gathering at Lac du Flambeau after the
    Restoring the Mourners ceremony, with drumming, singing, and dancing around a
    warrior drum to be presented to the Menominee. It gives song texts and analyses
    for three war songs sung by E'niwub'e, including a dream song connected with a
    thunderbird vision and a song about ravens singing in the sky.
  language: English with transcribed Ojibwe/Chippewa song words
