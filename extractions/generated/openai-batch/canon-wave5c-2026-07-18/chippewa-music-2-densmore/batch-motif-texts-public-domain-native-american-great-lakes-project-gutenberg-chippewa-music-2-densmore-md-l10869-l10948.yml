  summary: The passage first gives a musicological analysis of tones and intervals
    in Chippewa songs, then describes a 1910 Drum-presentation Ceremony in which two
    drums were given by the Lac du Flambeau Band of Chippewa to Menominee Indians.
    It explains dancing periods, the veneration of the drum, the relation of the “drum
    religion” to the Mide' or Grand Medicine, the themes of peace and strict ritual
    law, a reported Sioux origin, and Wis'kino’s statement about keeping and honoring
    a drum in his house.
