canonical_text:
  quote: ''
  summary: The passage gives a statistical and functional analysis of Chippewa dream
    songs, comparing them with Mide', war, woman's dance, and gift-related songs.
    It then introduces war songs, describing drum use on the warpath, at village dances
    before departure and after return, and in recent social dances. War songs are
    classified as dream songs of individual warriors, songs concerning war charms
    and medicines, songs about the conduct of a war expedition, and songs commemorating
    success.
  language: English with Ojibwe terms
  quote_policy: summarized
