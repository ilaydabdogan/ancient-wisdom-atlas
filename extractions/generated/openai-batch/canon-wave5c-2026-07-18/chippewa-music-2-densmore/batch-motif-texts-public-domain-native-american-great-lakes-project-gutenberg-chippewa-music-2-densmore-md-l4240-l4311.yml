- id: obs:1
  text: The dream-song group is described through musical statistics, including harmonic
    feeling, downward progressions, minor thirds, time changes, triple drum rhythm,
    rhythmic units, and voice/drum metric relations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dream songs are described as more centralized in structure than the Mide'
    songs, with harmonic form and five-toned scales referring tones to a keynote.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Mide' songs were generally used to affect persons
    other than the singers, while dream songs in this group, except doctor's songs,
    aimed to secure a more personal advantage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the warpath, war songs were accompanied by a small drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At village dances before the departure and after the return of a war party,
    a large drum was used and the drummers sat around it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In recent years, war songs are described as being sung at tribal social dances
    with a drum similar to that used in the Drum-presentation Ceremony, but less elaborately
    decorated.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'War songs are classified into four kinds: dream songs of individual warriors,
    songs concerning war charms and medicines, songs of the conduct of the war expedition,
    and songs commemorating its success.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The first two classes of war songs are said to have a connection with the
    supernatural element, while the success-commemoration class is said to have no
    supernatural element.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A reported statement says that in older practice no warrior would have dared
    sing a war song that was not composed in a dream, referring to the first two classes
    of war songs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The third class includes songs of the war messenger, the dog feast, and the
    departure of the war party; the fourth includes songs composed by a returning
    war party or in victory dances after a successful expedition.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the boundaries between the war-song classes are not
    strongly marked and that the classification is general.
  category: attribute
  evidence_refs:
  - ev:6
