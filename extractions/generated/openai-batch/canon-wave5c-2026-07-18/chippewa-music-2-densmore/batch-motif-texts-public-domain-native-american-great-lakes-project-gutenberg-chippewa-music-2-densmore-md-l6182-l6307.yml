  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Odjib'we returned and reproached the others for not coming, while they answered
    that they had been waiting for his report.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Chippewa moved near the Sioux new camp, heard singing and dancing, and
    stayed awake watching and waiting for dawn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At first light, four Chippewa went ahead to a place where the Sioux would
