canonical_text:
  quote: ''
  summary: A Chippewa war party scouts a Sioux camp, waits through the night, begins
    a dawn attack, and fights through the day. Xo'din, a Mille Lac chief, is killed,
    and the Chippewa return with three Sioux scalps. The victory is celebrated with
    dances and a song sung by Odjib'we whose words say that the singer will start
    tomorrow in his canoe, interpreted in the passage as indicating another warpath
    departure. The passage then introduces songs connected with a later notable Sioux-Chippewa
    fight involving Little Six, Odjib'we, and Niski'gwtin.
  language: English with Ojibwe/Chippewa song text and English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While looking over the camp, the Chippewa heard Sioux guns in the distance
    and sent two scouts along the wooded shore of a long lake to determine the Sioux
    position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The scouts reported that two Sioux were sitting on the opposite shore of the
    lake; when the Chippewa arrived, the Sioux had gone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Chippewa stealthily ascended a hill from which they could see the entire
    Sioux camp and decided to wait until night rather than attack immediately.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: From hiding, the Chippewa watched the Sioux cook a meal and prepare for a
    night march.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odjib'we, one of three Chippewa sent toward the camp, told his companions
    to stay while he crept ahead; he later heard the Sioux chopping wood at what seemed
