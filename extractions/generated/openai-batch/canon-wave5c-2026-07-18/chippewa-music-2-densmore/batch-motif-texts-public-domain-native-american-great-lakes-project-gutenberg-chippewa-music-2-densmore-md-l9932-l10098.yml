canonical_text:
  quote: ''
  summary: The passage describes the ca'wunoga as an old dance first used for healing
    people who were not in good health, taught by the South Manido to a good young
    man whose ill relatives recovered after he carried out the instructions. It then
    gives musical notes on two ca'wunoga songs. The passage also recounts a story
    about Bica'ganab, a Chippewa woman descended from a Hudson's Bay trader and a
    Chippewa woman, who fought Sioux attackers, survived in the water, returned to
    the battlefield, scalped the dead Sioux, gathered trophies, painted her face,
    and returned to camp. A song gloss praises a woman for defending her children
    and fighting for all.
  language: English with transcribed Ojibwe/Chippewa song words
  quote_policy: summarized
