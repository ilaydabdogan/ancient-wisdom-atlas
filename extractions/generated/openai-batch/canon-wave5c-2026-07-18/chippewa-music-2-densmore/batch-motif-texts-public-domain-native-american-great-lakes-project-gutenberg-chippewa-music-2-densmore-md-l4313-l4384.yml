canonical_text:
  quote: ''
  summary: The passage gives a statistical and comparative analysis of Chippewa war
    songs, describing tonal, melodic, rhythmic, and metric traits. It compares war
    songs with Mide' songs, dream songs, woman's dance songs, begging dance songs,
    and moccasin game songs. The author attributes some correspondences with Mide'
    and dream songs to a shared element of communication with the supernatural, and
    notes that the woman's dance and begging dance were associated with transmission
    from the Sioux. The passage then begins a section on love songs.
  language: English
