canonical_text:
  quote: ''
  summary: The passage presents several White Earth Reservation Chippewa songs with
    glosses, commentary, and musical analysis. The songs concern having salt, carrying
    June berries on a journey as a son-in-law, and a woman's plea to work steadily
    because of fear that someone will be taken away. The passage also introduces pipe
    dance songs, describing the pipe dance as an old 'good time dance' believed to
    have come from the manido', in which a man carries a pipestem, crouches so his
    body represents a pipe, and then passes the pipestem and rattle to another man
    who must dance.
  language: English with Chippewa/Ojibwe song text and glosses
  quote_policy: summarized
