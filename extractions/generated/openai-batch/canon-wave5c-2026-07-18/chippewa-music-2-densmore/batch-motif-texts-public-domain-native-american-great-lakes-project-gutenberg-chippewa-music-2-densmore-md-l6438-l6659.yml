  summary: The passage presents a dream song whose words are described as obscure,
    then relates Odjib'we's account of a fight at Ca'gobens' camp near the Minnesota
    River. A Chippewa war party hides near the river, shoots at a Sioux man in a canoe,
    and a battle follows. Ga'witayac', a Red Lake warrior, is mortally wounded, carried
    on a litter, sings his death song, and dies while singing. His large bear manido
    animal is named in relation to the death song. The passage also notes songs composed
    about the fight and sung in dances after the warriors returned.
  language: English with Ojibwe/Chippewa song text and glosses
