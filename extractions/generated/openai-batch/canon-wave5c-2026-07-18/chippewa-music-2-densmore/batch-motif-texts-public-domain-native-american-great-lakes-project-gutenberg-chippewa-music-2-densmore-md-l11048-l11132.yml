canonical_text:
  quote: ''
  summary: The passage describes two named types of ceremonial drums, a witnessed
    presentation of a chief drum and warrior drum, the respectful storage and handling
    of the chief drum, its physical decorations and supporting stakes, associated
    pipes, sticks, tobacco containers, and a reported right to make and give away
    duplicate drums.
  language: English with Chippewa/Ojibwe terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Two drum types are distinguished: the chief drum, usually given by one chief
    or leader to another, and the smaller warrior drum, presented by one tribal member
    to another.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the witnessed ceremony, Bi'jikens presented the chief drum to Wis'kino,
    and a Lac du Flambeau Chippewa presented the warrior drum to a Menominee from
    another part of the reservation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief drum was kept on a low box in a room corner, with a clean white
    quilt covering the box and surrounding floor, and with articles belonging to the
    drum placed beside it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bi'jikens and his family treated the drum and its related articles with great
    respect; after hesitation, he permitted it to be photographed, and his son and
    son-in-law carried it to the dancing circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief drum was described with two untanned-hide heads, blue and red painted
    halves, a yellow band near the blue edge, red flannel, silver disks, otter fur,
    beadwork, tassels, and metal thimbles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The curved stakes supporting the drum were covered with beadwork and otter
    fur, held feathers in sockets, and were tipped with cow-tail tufts and ribbon
    streamers colored blue on the west and north stakes and red on the east and south
    stakes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Associated items included four drumsticks for leading drummers, a longer stick
    used only by the drum owner in a specific ceremonial part, a pipe with geometric
    decoration and red woodpecker feathers, a turtle shell containing a tobacco mixture,
    compartment boxes, feathers, and additional ordinary drumsticks.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Bi'jikens had received the drum four years earlier from a Bad River Chippewa
    leader and retained the right to make duplicates and give them away; another man,
    Mec'kawiga'bau, was reported as intending to make and give away a duplicate drum.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: According to Mec'kawiga'bau, there were no songs or ceremonies connected with
    making a drum.
  category: speech
  evidence_refs:
  - ev:7
