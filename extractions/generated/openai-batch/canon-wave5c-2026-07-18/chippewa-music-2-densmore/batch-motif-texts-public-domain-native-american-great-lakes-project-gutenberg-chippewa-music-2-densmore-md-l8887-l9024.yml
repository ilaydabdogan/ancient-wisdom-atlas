canonical_text:
  quote: ''
  summary: A narrative introduces three songs connected with a Chippewa expedition
    against a Sioux village. In the battle and retreat, the Chippewa warrior Name'bines'
    is mortally wounded, asks to be left in bushes with his gun, kills a pursuing
    Sioux man, gives a final war whoop, and sings a death song asking his comrades
    to sing it at home for the women to dance by and to tell how he died. The song
    text says he discerns the odor of death in the front of his body. A later song
    concerns Sioux women moving to and fro, wailing as they gather up wounded men.
  language: English with Chippewa/Ojibwe song text and translated glosses
  quote_policy: summarized
