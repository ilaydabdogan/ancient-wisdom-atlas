canonical_text:
  quote: ''
  summary: The passage describes a pouch, ingredients, spoon, and preparation of a
    medicine by placing powders at the east, south, west, and north sides of hot water.
    It also describes a birch-bark measure with animal drawings, another medicine
    named for an island herb, accounts of dream instruction by a thunderbird, uses
    of roots as charms carried in pockets, and claims that the medicine cures wounds
    and sudden illness and is used only for good purposes.
  language: English with Ojibwe terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pouch contained a mixture of three ingredients, a small tin spoon, and a
    tied packet of the principal ingredient.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Main'gans demonstrated that a spoonful of the powder could be swallowed without
    water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Main'gans prepared the medicine in liquid form by placing small spoonfuls
    of mixed ingredients on the surface of hot water at the east, south, west, and
    north sides of a pail, naming each direction as he acted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: He added portions of the principal ingredient to the middle of each of the
    four powder patches, beginning with the east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ingredients dissolved in hot water, and the medicine was described as
    ready for use, though some preferred boiling it for stronger flavor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The medicine was to be taken four times a day, with a small dose at first
    and later an increased dose.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The full dose was taken in a birch-bark measure that held about a tablespoonful.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Drawings on the inside of the birch-bark measure were said to represent animals
    and to indicate that the measure was for this particular medicine.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mi'nismo'wuck, translated in the passage as “island herb medicine,” was named
    from its principal ingredient, formerly found only at a certain place on Lake
    Superior and later discovered at Mille Lac in light sand along the shore.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The island herb medicine contained eight ingredients said to be herbs of about
    the same sort.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Na'waji'bigo'kwe said that a man dreamed of a thunderbird who told him how
    to prepare and use the medicine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Na'waji'bigo'kwe said she found a small root, sang, talked, and prayed over
    it, wrapped it in fresh birch bark, and put it into a man's coat pocket to help
    him with serious difficulties.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In another account, relatives of a man who had killed his wife asked Na'waji'bigo'kwe
    for mi'nismo'wuck; she gave them a small piece of root, which the man carried
    in his pocket.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The medicine was said to act as a charm, check bleeding from wounds, and be
    used internally for many forms of sudden illness.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The medicine was called a “life medicine” and was said to be used for good
    purposes only.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Four songs were stated to be connected with this medicine.
  category: relationship
  evidence_refs:
  - ev:9
