canonical_text:
  quote: ''
  summary: The passage discusses transcription features of Chippewa songs, common
    instrumental accompaniment, and reasons for singing. It states that many songs
    are connected with reliance on supernatural help, often through songs received
    in dreams and used in danger, medicine, war, or serious undertakings. It also
    surveys themes in song texts, including nature, animals, birds, water, and Midewiwin
    associations with water and aquatic animals.
  language: English
  quote_policy: summarized
