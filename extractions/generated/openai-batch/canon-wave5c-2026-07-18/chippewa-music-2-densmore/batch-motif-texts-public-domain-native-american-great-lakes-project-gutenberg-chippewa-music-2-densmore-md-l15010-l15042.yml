canonical_text:
  quote: ''
  summary: 'The passage introduces Chippewa game songs by stating a belief that gambling
    was taught to Indians by a manido'' to relieve hunger and ill fortune. It lists
    three games, notes which games had songs, and says older Indians revere the games
    and songs as a Manido'' gift. It then begins E''niwub''e''s origin narrative:
    a skilled Chippewa hunter travels far away with two wives and four children; the
    children and wives die in sequence; after burying them, the man considers suicide
    but instead wanders without drinking until he collapses.'
  language: English with Ojibwe/Chippewa terms
  quote_policy: summarized
