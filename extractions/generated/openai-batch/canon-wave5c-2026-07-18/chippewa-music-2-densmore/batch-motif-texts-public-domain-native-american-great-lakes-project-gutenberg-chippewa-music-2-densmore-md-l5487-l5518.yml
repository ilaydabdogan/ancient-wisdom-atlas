canonical_text:
  quote: ''
  summary: The passage describes Odjib'we's war-honor objects, including a skunk-skin
    badge, birch war club, war drum, and scarlet war shirt. It explains images on
    the war drum through an account of a drum inventor whose dream is represented
    by lightning, a thunder-like drum sound, Wenabojo's use of the large turtle as
    an errand-bearer, the turtle's war messenger, and the depiction of bow and arrow
    because Indians fought with those weapons.
  language: English with Ojibwe terms
  quote_policy: summarized
