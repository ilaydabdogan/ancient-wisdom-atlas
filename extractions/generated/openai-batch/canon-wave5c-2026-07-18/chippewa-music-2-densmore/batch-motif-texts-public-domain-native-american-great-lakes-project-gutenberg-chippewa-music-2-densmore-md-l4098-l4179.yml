canonical_text:
  quote: ''
  summary: The passage first summarizes musical and functional characteristics of
    Mide' songs, describing them as songs used to secure a definite effect by supernatural
    power. It then introduces Chippewa dream songs, explaining that they are said
    to come in dreams or trance-like states induced by isolation and fasting, and
    gives examples of songs heard from trees, crows, animals, thunderbird, and manido'
    in human form. It also notes a comparison to Ghost Dance trance vision songs and
    mentions that some dream songs relate to flight through the air.
  language: English
  quote_policy: summarized
