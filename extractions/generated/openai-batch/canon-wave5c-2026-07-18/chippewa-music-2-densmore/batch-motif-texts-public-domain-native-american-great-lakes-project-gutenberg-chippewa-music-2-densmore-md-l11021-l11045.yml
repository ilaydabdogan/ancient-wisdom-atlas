  quote: ''
  summary: A woman instructs men in making a drum. After the drum is completed and
    songs are learned, the first striking of the drum is followed by the reappearance
    of the manido and the death of the two drum makers. The passage then describes
    continuity between this origin account and later Drum-presentation Ceremony practice,
    including transfer of drums and songs between groups, Sioux ceremonial songs,
    Chippewa songs used during dancing, and two types of ceremonial drums.
