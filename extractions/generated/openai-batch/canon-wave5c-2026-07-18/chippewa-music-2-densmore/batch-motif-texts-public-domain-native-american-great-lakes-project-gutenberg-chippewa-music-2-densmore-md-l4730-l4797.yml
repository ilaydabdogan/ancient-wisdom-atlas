  summary: The passage summarizes musical and performance features of gift songs used
    in social dances and songs for the entertainment of children. Gift songs accompany
    gifts, usually a pony, and are sung by the recipient or giver with singers at
    the drum. The passage then gives statistical musical analysis of these songs and
    of children's entertainment songs, noting humor, mimicry of tribal interests and
    occupations, child war-game themes, animal-war content, excitement in performance,
    and variable drum use.
