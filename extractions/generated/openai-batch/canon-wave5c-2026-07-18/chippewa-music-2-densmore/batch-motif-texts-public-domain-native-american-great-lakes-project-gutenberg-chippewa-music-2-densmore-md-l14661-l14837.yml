canonical_text:
  quote: ''
  summary: The passage gives musical analysis of songs and embeds brief narratives
    about songs associated with deer and buffalo. One deer song is said to have come
    to an old man in a dream and to accompany a dance in which men and women imitate
    buck and doe deer before a hunt. Another song represents a deer walking alone
    and proud of shining horns. A buffalo song is said to have originated when a fasting
    man heard buffalo singing, saw a herd walking in a circle in mud, joined them,
    became a buffalo, and received their song.
  language: English with transcribed Chippewa/Ojibwe song text
  quote_policy: summarized
