canonical_text:
  quote: ''
  summary: 'The passage gives song texts and analysis, then describes Chippewa war-party
    songs and procedures: a song about going south and bringing the south wind; a
    war-bird song; a pre-departure pipe and drum ceremony; the ordered march of a
    war party; scouting before attack; and an arrow song sung while war-arrow heads
    are dipped in red medicine.'
  language: English with Ojibwe/Chippewa song text and terms
  quote_policy: summarized
