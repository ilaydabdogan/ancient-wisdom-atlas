canonical_text:
  quote: ''
  summary: 'The passage gives translated song lines about uncertainty concerning one
    from whom the singer flies or rises, followed by musical analysis. It then describes
    Chippewa preparations for a major fight: litters for the wounded, a noncombatant
    elder carrying medicine and water, Sioux pursuit of wounded Chippewa, a feather
    flag carried and defended by a brave warrior, drum and song used to inspire fighters,
    leaders wearing conspicuous feathers, and a neck charm made of dried bird skin
    containing private medicine. Before battle the birch-bark cover was removed from
    the charm, and a song was sung to make the charm effective. The next item is introduced
    as a Song of a War Charm sung by Odjib''we.'
  language: English with Ojibwe/Chippewa transliteration and vocables
  quote_policy: summarized
