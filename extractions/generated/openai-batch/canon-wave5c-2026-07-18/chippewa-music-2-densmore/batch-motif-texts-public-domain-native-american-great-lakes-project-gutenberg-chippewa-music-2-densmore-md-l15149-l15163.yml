  summary: The passage analyzes a song said to have been taught by a manido' to a
    man who had been dead. It reports that no words were recorded, describes relations
    between drum and voice, outlines rhythmic and melodic features, and explains a
    game custom in which a guess stops the song while rapid drumming accompanies score
    counting.
