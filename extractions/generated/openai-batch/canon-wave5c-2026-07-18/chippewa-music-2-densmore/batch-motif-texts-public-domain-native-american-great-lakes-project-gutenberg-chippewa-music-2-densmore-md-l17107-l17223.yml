canonical_text:
  quote: ''
  summary: 'The passage gives song text and analysis for Chippewa dance songs, including
    Southern Dance songs sung by E^niwub^e, descriptions of rhythm, drumbeat, calls,
    and repeated dancing. It then describes songs associated with giving away a pony:
    a song signals the gift, a man dances around the drum with a stick representing
    an imaginary pony and gives the stick to a friend, and in some cases a beaded
    suit gift obligates a pony owner to give a pony in return.'
  language: English with Ojibwe/Chippewa song text transcription
  quote_policy: summarized
