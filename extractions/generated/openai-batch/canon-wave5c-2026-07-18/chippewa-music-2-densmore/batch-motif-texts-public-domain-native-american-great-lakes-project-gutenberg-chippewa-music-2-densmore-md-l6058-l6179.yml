canonical_text:
  quote: ''
  summary: The passage recounts a Chippewa war episode in which Odjib'we kills a Sioux
    opponent, Mo'kadjiwens removes the scalp but leaves it behind, and a victory-dance
    song memorializes the mislaid scalp. It then introduces another war expedition
    organized by Ge'miwunac, describing inter-band participation, travel by canoe,
    nightly war-dance singing, concealment, scouting, trail-reading, and signs of
    a Sioux camp and council.
  language: English with Chippewa/Ojibwe names, song text, and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we and his war party remain concealed, hear gunshots, and interpret
    the shots as indicating first that the Sioux shot ducks and then that their own
    men fired on the Sioux.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Odjib'we confronts a Sioux man; both make statements about bravery, exchange
    attempted blows with guns, and Odjib'we shoots the Sioux in the back as he runs
    away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Odjib'we permits Mo'kadjiwens to remove the scalp; the scalp is in Mo'kadjiwens'
    charge, is left at a noon stopping place, and is not missed until night camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because the party cannot return for the scalp, they compose a song and sing
    it at home in the victory dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The song text and gloss say that Mo'kadjiwens took a Sioux scalp which is
    hanging in a marsh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The song is recorded without drum; the analysis describes it as lively, in
    steady triple measure, eight measures long, harmonic in structure, and minor in
    tonality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A later war expedition is organized by Ge'miwunac; Pillager, Mississippi,
    and Mille Lac participants join, and the party starts from Crow Wing in canoes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the first camp a few miles down the Mississippi River, the party holds
    its first war dance, and Odjib'we says the dance song is sung every evening while
    the party is away.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Odjib'we describes some men dancing around the fire while others sit still,
    and all singing before going to bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The next morning the party breaks camp, travels rapidly through the woods,
    then on the prairie rests in concealment by day and travels by night.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Near Sioux country, two scouts are sent ahead with instructions to return
    and report signs of the enemy; Odjib'we imitates a scout posture with one hand
    shading his eyes and the other signaling backward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The scouts return and report a wide new trail, concluding that Sioux must
    have passed that day; one estimates a hundred people and the other forty.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: At dawn the Chippewa clean and load their guns, follow the trail, find four
    green-bough lodges, a dancing and council place, and forty-two stones in a circle
    indicating the number of warriors present.
  category: sequence
  evidence_refs:
  - ev:10
