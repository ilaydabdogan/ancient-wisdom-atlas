canonical_text:
  quote: ''
  summary: The passage describes small drum gatherings with tobacco gifts, a tradition
    that the Sioux gave a ceremonial drum and its songs to the Chippewa, and an origin
    narrative in which a woman hiding in water is summoned by a manido, eats unseen
    among soldiers, receives instructions and songs for the drum, and is told that
    the drum will make peace with enemies and requires an offering of two men.
  language: English
  quote_policy: summarized
