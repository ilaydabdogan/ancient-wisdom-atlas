  text: At small drum gatherings, people visit the drum, sing songs, and each person
    who comes brings a gift of tobacco.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drum owner is the only speaker at the small gatherings, speaks as representative
    of those who come, presents tobacco to the drum, and the tobacco is then given
    to the singers at the drum.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that many generations ago the Sioux gave the Chippewa a large
    drum, taught them the songs belonging to it, and related its origin tradition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief that permanent peace between the Sioux and Chippewa
    resulted from the presentation of the drum.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After receiving the drum, the Chippewa made similar drums and gave them away
    with the proper songs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When presenting a drum, the giver customarily relates an individual dream
