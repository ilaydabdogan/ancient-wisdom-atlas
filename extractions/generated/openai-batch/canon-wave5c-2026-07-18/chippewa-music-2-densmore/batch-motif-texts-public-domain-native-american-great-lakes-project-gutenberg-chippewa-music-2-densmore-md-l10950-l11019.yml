    between Sioux and Chippewa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The informants agreed that the woman hid in water for four days with her face
    concealed by a broad lily pad.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:9
  text: In the narrative, a woman unable to keep up with the warriors hid in shallow
    water at the edge of a pond for four days with a lily leaf over her face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A voice told the woman that the people who had been killing her friends were
    about to eat and called her to share their food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman was afraid at first, then believed the voice and came from the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The woman found herself among soldiers, ate with them, and could see them
    while they could not see her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The person whose voice she had heard was identified as a manido appearing
