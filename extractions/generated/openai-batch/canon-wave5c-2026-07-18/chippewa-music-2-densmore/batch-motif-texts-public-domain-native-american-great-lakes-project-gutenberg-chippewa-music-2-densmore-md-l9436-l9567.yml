canonical_text:
  quote: taking the scalp, danced while singing
  summary: 'The passage introduces a rejoicing song: after De''kiiin''s song, her
    mother Djihgwa''kumigo''kwe takes a scalp, dances, and sings a song composed in
    honor of Odjib''we. The translated words express rejoicing to a son who has brought
    back an elder brother. A musical analysis follows. The passage then records Odjib''we''s
    account of a severe fight with Sioux led by Gaga''gins, or Little Crow: Chippewa
    scouts kill and scalp a Sioux woman, Sioux warriors pursue them, the full Chippewa
    force is met, and the Chippewa are victorious. A related Victory Song is attributed
    to Hole-in-the-day, leader of the expedition.'
  language: English with transliterated Ojibwe song text and English glosses
  quote_policy: quoted
