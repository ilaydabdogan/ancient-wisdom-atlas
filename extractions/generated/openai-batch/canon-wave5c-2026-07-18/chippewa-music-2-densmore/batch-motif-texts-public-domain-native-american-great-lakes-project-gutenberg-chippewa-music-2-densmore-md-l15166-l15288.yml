canonical_text:
  quote: ''
  summary: The passage presents two moccasin game songs sung by E'niwub'e and analyzes
    their musical structure. It reports that these songs were said to have been taught
    by a stranger or manido' to a man who had been dead so that he could play the
    moccasin game successfully, and notes that the manido' appeared as a bear. The
    passage then describes the Chippewa moccasin game as a present diversion that
    formerly involved serious gambling, dream-seeking for success, and large losses
    or winnings. It includes an incomplete incident about a Leech Lake player who
    obtained the secret of success from his wife after she returned to him in a dream
    after death.
  language: English
