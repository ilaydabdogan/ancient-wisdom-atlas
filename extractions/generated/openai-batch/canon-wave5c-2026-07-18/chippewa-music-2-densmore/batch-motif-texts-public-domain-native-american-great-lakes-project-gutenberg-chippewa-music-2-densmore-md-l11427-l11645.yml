canonical_text:
  quote: ''
  summary: The passage gives analyses of several Chippewa songs sung by Mec'kawiga'bau
    and describes a Lac du Flambeau ceremony called Restoring the Mourners. In the
    ceremony, people whose mourning period is ending sit in the center of a circle
    with drums around it; they wear bright clothing, receive gifts, and undergo acts
    involving water, washing, and grooming while a song is sung. The passage also
    describes mourning customs for bereaved mothers and the landscape surrounding
    the ceremonial enclosure.
  language: English
  quote_policy: summarized
