canonical_text:
  quote: ''
  summary: The passage describes a drum-presentation ceremony. Officials of the chief
    drum sit at the side of a circle with painted faces and ornaments. Bi'jikens opens
    with a formal speech, tobacco is distributed to the assembly, and he gives and
    repeats an invocation while gesturing toward and dancing around the drum. The
    leading drummer begins the Song of the Pipe, and pipe bearers present, light,
    and offer pipes in an ordered sequence.
  language: English
