canonical_text:
  quote: ''
  summary: 'The passage describes Odjibwe war-honor material culture, a weasel-skin
    decorated shirt, and several Chippewa warrior medicines. It explains that these
    medicines were obtained from older Midewiwin-associated herbal specialists, used
    internally and externally, and treated as protective charms against hostile medicine.
    It then gives Main''gans''s account of the origin of cattle herb medicine: a male
    Midewiwin member dreamed of horned animals resembling cattle under water, who
    emerged and taught him how to prepare the medicine. A song and cattle-like sounds
    accompany preparation and war-dance performance. The passage also lists herbs
    used by Main''gans and identifies the principal root botanically.'
  language: English with Ojibwe terms
  quote_policy: summarized
