canonical_text:
  quote: ''
  summary: The passage describes Menominee hosts and Chippewa visitors gathering for
    a drum-presentation ceremony. After the Chippewa recover at a temporary camp,
    the Menominee dance, send a messenger, and form a formal receiving line behind
    an American flag. The Chippewa approach in procession with flags, pipes, drums,
    supports, drumsticks, singers, drummers, women, and children. White Feather invokes
    Manido', peace, pipe use, and handshaking. Pipe bearers exchange smoke, and the
    Chippewa shake hands with Wis'kino and the Menominee lines.
  language: English
  quote_policy: summarized
