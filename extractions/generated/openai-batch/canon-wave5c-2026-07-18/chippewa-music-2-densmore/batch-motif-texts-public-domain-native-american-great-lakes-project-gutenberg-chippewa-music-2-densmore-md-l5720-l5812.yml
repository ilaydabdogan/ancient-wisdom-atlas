canonical_text:
  quote: ''
  summary: The passage describes an origin tradition for Wa'huno'wucl, an eastern
    herb medicine said to have good and evil uses, taught by an eastern manido to
    a fasting youth who sought Mide'wiwin power. The youth forms an alliance using
    the medicine in dances, and the medicine is described as capable of killing or
    curing. The passage then recounts Odjib'we's warrior vocation after relatives
    were killed by the Sioux, his fasting for a vision, a dream in which a woman gives
    rush guns to Sioux attackers whose shots become harmless horseflies, and the woman's
    prophecy and song that become Odjib'we's protective dream song.
  language: English with Ojibwe terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wa'huno'wucl is presented as an eastern herb medicine distinct from two other
    medicines and said to have had both good offices and evil uses, with evil uses
    later prevailing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man wanted to join the Mide'wiwin to gain power as a hunter, but his
    father opposed him as too trifling for the solemn Mide'.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man went away and fasted many days before a manido from the east
    came and told him about the medicine and its good and bad properties.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The youth gathered men into an alliance known as ^ya'hunog', who held dances
    and used the medicine unscrupulously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the first dance, eight men were destroyed by a man who knew the medicine's
    secret.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The medicine was said to kill or cure those who took it, to act as an evil
    charm, and to make things go through the air.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The three medicines described in the surrounding section are summarized as
    imparting healing, success, and revenge and as suited to men on the warpath.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Odjib'we's paternal grandfather, two of the grandfather's brothers, and two
    of Odjib'we's brothers were killed by the Sioux; Odjib'we then determined to hunt
    and kill the Sioux and chose the career of a warrior.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Odjib'we frequently fasted alone in the woods, hoping for a dream or vision,
    and after a four-day fast he received a dream.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the dream, a woman carrying guns made of rushes gave the guns to approaching
    Sioux and told them to shoot at Odjib'we.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the Sioux shot the rush guns, horseflies came out, alighted on Odjib'we,
    and could not harm him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman told Odjib'we that he would be a great warrior and would always
    be protected, and Odjib'we said this came true because he was never wounded by
