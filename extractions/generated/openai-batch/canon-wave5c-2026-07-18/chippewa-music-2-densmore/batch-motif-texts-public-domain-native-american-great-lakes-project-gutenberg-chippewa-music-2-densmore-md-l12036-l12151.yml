canonical_text:
  quote: ''
  summary: The passage describes musical analysis followed by an ethnographic account
    of a Chippewa drum party traveling from Lac du Flambeau toward a Menominee settlement
    for a drum-presentation ceremony. It records a timing dispute about departure
    after a pipe presentation, the party's train and walking journey with drums, camp
    equipment, and gifts, the Menominee ceremonial ground and dancing circle, the
    placement of a flag, tobacco collection, drums at the entrance, and the Menominee
    chief Wis'kino's reception of news that the Chippewa were approaching.
  language: English
