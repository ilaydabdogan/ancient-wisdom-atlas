canonical_text:
  quote: ''
  summary: 'A man who has lost everything dies and then returns to consciousness when
    a black-clad stranger, identified as a manido, approaches. The stranger teaches
    him three gambling games: the hand game, the moccasin game, and a plate game with
    bone figures. The formerly dead man wins each game. The stranger then directs
    him to an Indian village and reveals himself in departing as a large black bear.
    The man goes to the village, gambles, and wins people who are described as making
    him feel he has won back his dead. Notes compare the hand game and plate game
    to widely distributed Indigenous game types.'
  language: English with Ojibwe/Chippewa names and terms
  quote_policy: summarized
