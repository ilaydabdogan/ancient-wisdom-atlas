canonical_text:
  quote: ''
  summary: The passage gives notation, lyrics, and analysis for several Chippewa songs,
    including moccasin game songs, a woman's dance song, a war-return song, and a
    song glossed as “I carry it away.” It also describes the woman's dance as practiced
    at Minnesota Chippewa gatherings, including circular movement facing a drum, drummers
    under a branch shade, women’s shawls, alternating men and women, and gift exchange.
    The passage states that the woman's dance was said to have been acquired from
    the Sioux and that one old war-return song was also recorded at White Earth.
  language: English with Chippewa/Ojibwe song-text transcriptions and glosses
  quote_policy: summarized
