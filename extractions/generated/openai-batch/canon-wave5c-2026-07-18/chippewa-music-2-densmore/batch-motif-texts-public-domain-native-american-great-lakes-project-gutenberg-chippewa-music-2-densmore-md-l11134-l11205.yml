canonical_text:
  quote: ''
  summary: The passage describes the transfer and ceremonial use of a drum among Chippewa
    communities. An elderly chief publicly transferred a drum and its responsibilities
    to another man. The passage then compares similar drums on Minnesota reservations,
    notes reported Sioux influence and loss or survival of some ceremonial meanings,
    lists the personnel of a drum party, and describes the spatial arrangement and
    duties of participants during a ceremony.
  language: English, with Ojibwe/Chippewa names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An elderly chief, Me'dwcya'slin of the Lac du Flambeau Chippewa, had received
    the drum but was too feeble to discharge its obligations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Me'dwcya'slin held a dance and publicly transferred the drum to Mec'kawiga'bau,
    who was willing to assume the responsibility.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Similar drums were reported on White Earth, Leech Lake, and Red Lake Reservations
    in Minnesota and were said to have been received from the Sioux.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Waba'cifig the drum was suspended from crotched sticks; in other noted
    instances it rested on the ground.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that decorated drumsticks were not used, no pipe belonged
    to the drum, and the drum's significance as a peace symbol seemed to have been
    lost in the Minnesota examples described.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A drum party originally consisted of 29 persons, with named offices and participant
    groups including chief, owner, speaker, aid, caretakers, drummers, singers, women
    singers, and leading dancers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: During a ceremony the chief drummer is usually seated at the western side
    of the drum, with the drum pipe, tobacco mixture in a turtle shell, and other
    drum articles at his right hand.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The chief drummer starts the songs and leads the singing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Leading drummers are seated by four stakes or legs supporting the drum; less
    important singers and drummers sit between them without permanent seats.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women form a large outer circle, sit with bowed heads, and cover their mouths
    with hands or shawls while singing through the nose an octave above the men's
    voices.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The chief of the band, owner of the drum, speaker, and four leading dancers
    sit on the long seat around the dancing hall or circle.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The aid sits alone at a little distance, ready to act as messenger.
  category: setting
  evidence_refs:
  - ev:10
