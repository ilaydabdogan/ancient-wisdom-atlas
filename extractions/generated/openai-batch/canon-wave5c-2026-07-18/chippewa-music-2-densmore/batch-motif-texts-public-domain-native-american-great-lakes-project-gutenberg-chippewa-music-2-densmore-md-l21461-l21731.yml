- id: obs:1
  text: In the described pipe dance, imitating a pipe produced merriment, and it was
    considered a test of courage for a man to brave the assembly’s ridicule and sit
    where he would be asked to dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, in early days, men who danced this wore no clothing
