canonical_text:
  quote: ''
  summary: 'The passage describes conventions and musical analyses for several Chippewa
    songs and dances: a pipe dance involving public ridicule, sparse clothing, and
    drum-controlled pauses; song No. 171, which names chiefs remembered during a pleasure
    occasion; song No. 172, “Little Plover,” whose dance may imitate plover motions;
    song No. 173, “Why?,” addressed to a female friend; and the beginning of a Mide
    burial song recorded without drum.'
  language: English with Ojibwe/Chippewa terms, names, and song text
  quote_policy: summarized
