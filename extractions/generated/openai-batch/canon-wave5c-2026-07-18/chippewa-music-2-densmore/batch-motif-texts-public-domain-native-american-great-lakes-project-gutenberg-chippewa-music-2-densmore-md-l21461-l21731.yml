- id: obs:3
  text: The pipe-dance music includes a sharp, short drumbeat followed by silence;
    when the drumbeat is heard, the dancer pauses in his current attitude and remains
    motionless until the drumbeat resumes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The drumbeat for the pipe dance is described as very rapid, and the dancer
    is expected to keep perfect time with it.
  category: action
