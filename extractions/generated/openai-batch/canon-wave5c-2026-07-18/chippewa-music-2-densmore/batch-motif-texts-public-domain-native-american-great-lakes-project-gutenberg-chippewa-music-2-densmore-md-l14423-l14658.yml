canonical_text:
  quote: ''
  summary: The passage contains rhythmic classification tables, then introduces dream
    songs. One account says a man painted his face with charcoal, fasted ten days,
    dreamed of clouds rising in the south, was summoned by manido' in the clouds,
    went up into the clouds, and saw thunderbirds who taught him a song. A second
    account says a fasting man heard voices beyond a hill, saw deer standing in a
    circle, heard a deer announce a seasonal dance when leaves had fallen, watched
    the deer choose a little buck to sing, and learned the song, later using it as
    a dream song when hunting deer. The passage also gives song titles, song words
    for the deer song, and musical analyses.
  language: English with Ojibwe/Chippewa song text
  quote_policy: summarized
