canonical_text:
  quote: ''
  summary: The passage gives a song text translated as a speaker saying they are small
    and come from the south, followed by musical analysis. It then describes the observer
    leaving E'niwub'e's house, seeing a party carrying a drum in moonlight, and learning
    that the chief-drum party had danced at Bi'jikens's house and was bringing the
    drum to E'niwub'e's house so both drums could be used in singing. The passage
    next describes a simple divorce ceremony held during a dancing period, in which
    a person desiring divorce makes a throwing motion outside the dancing circle while
    songs are sung, and introduces a recorded divorce song sung by Mec'kawiga'bau
    with musical analysis.
  language: English with transcribed Ojibwe song text
  quote_policy: summarized
