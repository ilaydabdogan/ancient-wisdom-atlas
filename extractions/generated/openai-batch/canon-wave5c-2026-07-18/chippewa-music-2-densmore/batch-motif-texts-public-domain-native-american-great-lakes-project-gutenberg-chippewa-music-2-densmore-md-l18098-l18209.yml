canonical_text:
  quote: ''
  summary: 'After tabular headings on song rhythm, the passage describes Chippewa
    medicine poles at Lac du Flambeau: poles beside houses bearing cloth frames, banners,
    symbols of celestial bodies and birds, and tied bundles of rags. It explains an
    origin story in which a fasting young man dreams of thunderbirds and their tree,
    then makes a pole and image to represent the dream. A later custom is described
    in which a war-related dream is either fulfilled by singing the dream song on
    the warpath, or, if unfulfilled, represented visually on a pole; the unsung song
    and vision are associated with curative power against sickness and death. The
    passage also notes a spring feast and address concerning the pole.'
  language: English
  quote_policy: summarized
