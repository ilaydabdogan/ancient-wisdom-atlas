canonical_text:
  quote: ''
  summary: 'The passage gives musicological analyses and free translations for several
    Chippewa songs: an analysis of a song with a recurring rhythmic unit; No. 109,
    “I am Thinking of Her”; No. 110, “Weeping for My Love”; No. 111, “Come, Let Us
    Sing”; and No. 112, “Song of an Ambitious Mother.” It notes performers, absence
    of drum in some recordings, translated song words, rhythmic and melodic traits,
    sadness/love themes, an invitation to sing, and a brass kettle as valued property
    in a song involving Bugac’s daughter and a son represented by a woman singer.'
  language: English with transcribed Chippewa/Ojibwe words
  quote_policy: summarized
