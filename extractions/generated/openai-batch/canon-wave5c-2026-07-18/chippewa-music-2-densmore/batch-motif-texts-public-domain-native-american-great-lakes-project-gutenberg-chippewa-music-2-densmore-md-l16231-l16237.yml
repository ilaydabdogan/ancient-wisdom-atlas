  summary: A note identifies Mrs. Benjamin Gauthier as the singer of the song, gives
    her Chippewa name translated as “double sky woman,” and describes her descent
    from Ginictano, a Wisconsin Chippewa chief. A second note explains a term said
    to combine words for “man” and “metal,” referring to large brass kettles obtained
    from traders and called “man-kettles.”
