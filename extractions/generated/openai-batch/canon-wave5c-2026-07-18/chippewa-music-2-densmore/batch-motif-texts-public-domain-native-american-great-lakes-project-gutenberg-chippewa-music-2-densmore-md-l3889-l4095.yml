- id: obs:2
  text: The passage groups Mide', dream, and war songs as closely related in origin,
    noting that many songs said to have been composed in dreams were used in Mide'
    ceremonies and practices and also on the warpath.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dream songs were identified as such by singers, had no special assigned use,
    and were probably used by individuals in dances before becoming general in the
    tribe, usually after the composers' deaths.
  category: sequence
  evidence_refs:
  - ev:3
