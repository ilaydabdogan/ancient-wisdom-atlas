canonical_text:
  quote: ''
  summary: The passage introduces a group analysis of Chippewa songs, especially Grand
    Medicine songs of the Mide'wiwin. It describes Mide' songs as associated with
    initiation, special medicines, curing the sick, charms, dances after meetings,
    supernatural power, and the transfer or renewal of spirit power through song and
    ceremony. It also notes that Mide', dream, and war songs are related in origin
    because some songs said to be composed in dreams were used in Mide' practices
    and on the warpath.
  language: ''
  quote_policy: summarized
