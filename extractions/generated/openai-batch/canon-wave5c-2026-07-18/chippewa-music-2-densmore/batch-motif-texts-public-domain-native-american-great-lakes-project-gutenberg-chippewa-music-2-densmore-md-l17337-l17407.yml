  summary: The passage presents a plate captioned Chippewa cradle-boards, musical
    metadata and analysis for a moccasin game song, and a lullaby described as a song
    for the entertainment of children. The lullaby is said to be shared in related
    form between Lac du Flambeau and White Earth Chippewa recordings, to use repeated
    vocables rather than words, and to be associated etymologically and practically
    with swinging or rocking a baby in a cradle-board, hammock, or against a seated
    woman’s feet.
