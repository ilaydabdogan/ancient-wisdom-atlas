  summary: 'The passage describes rules and gestures in a moccasin game: a striking-stick
    player may risk a score on his own guess, a partner may indicate a guessed moccasin
    by the position of a marked bullet in his hand, guesses are limited by player
    role, and a correct guess by both players is called a “double crack.”'
