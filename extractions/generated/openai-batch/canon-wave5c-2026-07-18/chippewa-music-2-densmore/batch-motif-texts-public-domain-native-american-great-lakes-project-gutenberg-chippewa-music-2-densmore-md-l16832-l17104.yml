canonical_text:
  quote: ''
  summary: The passage presents musical transcriptions and analysis for several Chippewa
    songs, including "Maple Sugar," "My Travels," and a song of thanks for food. It
    describes maple sap being boiled into syrup and made into grained sugar, molded
    sugar, and taffy, with storage in ma'kuks and birch-bark containers. It also describes
    the end of sugar-making, movement to summer camps on lake shores, and an illustrated
    canoe-repair scene. The song of thanks is tied to the close of a begging dance
    at a house after people have eaten food given to them.
  language: English with Chippewa/Ojibwe song words and terms
  quote_policy: summarized
