canonical_text:
  quote: ''
  summary: 'The passage presents songs sung by Mec''kawiga''bau and musical analyses,
    then describes parts of a Drum-presentation ceremony: messengers smoke pipes with
    Menominee drum recipients, promise to return with their people after a set number
    of days, preparations for departure begin at Lac du Flambeau, each tribe dances
    four days on its own reservation, the Chippewa hold Restoring of Mourners and
    sometimes a Divorce ceremony, tribes dance together four days at the presentation,
    a Dog Feast may cement a peace bond, and a five-song sequence opens parts of the
    ceremony.'
  language: English
  quote_policy: summarized
