canonical_text:
  quote: ''
  summary: The passage describes an aged Lac du Flambeau woman's explanation of old-style
    Chippewa moccasin making, including materials, cutting, sewing, shaping, fastening,
    and sinew use. It then presents No. 113, a love song sung by CyGABEA'siN'o'KWE,
    recorded without drum, with glossed lyrics about going to talk with a sweetheart
    identified as a widow, followed by a brief musical analysis.
  language: English, with Ojibwe/Chippewa song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An aged woman at Lac du Flambeau, who made the moccasins, cut a moccasin pattern
    shown as figure 4 and explained it through an interpreter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She stated that in former times they had no shears, cut deerskin with a knife,
    used no pattern, and made a gathered covering for the feet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described moccasin was sewn up the instep, piped with a strip, moistened
    inside, molded with the back of a knife, and flattened on the knee after the gathered
    front was moistened with tepid water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A fastening strip passed through two slits at the front of the instep, was
    tied, wrapped around the ankle, and tied at the back when worn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old custom described one-piece deerskin moccasins and sewing with sinew;
    the illustrated pair had separate flaps, and one deerskin was said to make only
    two pairs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: After discussion and hesitation, a blind woman sang the following song, and
    it was recorded by phonograph.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The song heading identifies the piece as No. 113, a love song, sung by CyGABEA'siN'o'KWE,
    glossed as “Woman of the Breeze That Blows to the End,” and recorded without drum.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The English gloss of the song says that the speaker will go and talk with
    “my sweetheart,” identifies the sweetheart as “the widow,” and says “I love” and
    “my sweetheart.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The musical analysis states that the metric unit is faster than in most love
    songs, that prolonged tones are frequent, that all octave tones except the third
    occur, and that the structure is freely melodic.
  category: other
  evidence_refs:
  - ev:5
