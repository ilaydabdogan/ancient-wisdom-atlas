canonical_text:
  quote: ''
  summary: The passage gives words and analysis for songs, then describes a Chippewa
    war-party incident used to explain a dream song. A leader who had seen a protecting
    cloud in a youthful vision sang his dream song while Sioux pursuers pressed close;
    a dark cloud and torrential rain appeared, and the Chippewa escaped through the
    storm. The leader later sang the song at a victory dance. The passage also gives
    the words of song No. 42, “A Cloud,” and song No. 43, “I am Called,” a dream song
    of a forgotten warrior whose words say that the speaker is called by a spirit
    from the middle of the great water.
  language: English with Ojibwe song words and English glosses
  quote_policy: summarized
