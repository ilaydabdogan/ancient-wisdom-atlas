  summary: The passage includes an etymological note translating a name as “sky in
    commotion,” then describes a drum-related ceremony in which mourners are invited,
    their faces are painted while songs are sung, war-derived strength and rights
    may be shared with a mourner, and White Feather exhorts the mourners to lift their
    eyes, release sorrow, and rejoin the gathered people. The mourners are seated
    with drum parties or friends, and gifts are placed beside them.
