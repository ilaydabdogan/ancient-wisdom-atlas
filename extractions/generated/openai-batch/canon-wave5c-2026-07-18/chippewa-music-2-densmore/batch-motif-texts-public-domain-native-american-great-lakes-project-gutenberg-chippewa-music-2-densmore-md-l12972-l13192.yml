canonical_text:
  quote: ''
  summary: A Dog Feast sequence within a Drum-presentation Ceremony is described.
    After songs, an oc'kabe'wis takes dog meat from a kettle, dances around the drum,
    and gives it to the drum owner to eat. The dog's head is placed in a pan on the
    eastern side of the dancing circle, four distinguished warriors are selected to
    eat from it, and each later dances around the dog's skull, speaks of a victory,
    and sings a commemorative war song. The remaining dog meat is then distributed
    to women and men of the company, concluding the feast.
  language: English with transcribed Chippewa/Ojibwe song text and glosses
  quote_policy: summarized
