    course.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A typical war song is attributed to Memeng'wa, called Butterfly, a prominent
    Lac du Flambeau Chippewa warrior, and is recorded by Mec'kawiga'bau, who learned
