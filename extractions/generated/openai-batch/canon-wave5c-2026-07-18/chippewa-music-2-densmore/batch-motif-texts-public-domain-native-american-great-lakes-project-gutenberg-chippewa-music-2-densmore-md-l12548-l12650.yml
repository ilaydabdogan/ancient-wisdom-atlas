canonical_text:
  quote: ''
  summary: The passage describes stages of a Chippewa-Menominee drum-presentation
    ceremony. The chief drum is treated as transferred to Wis'kino, gifts are distributed,
    Menominee participants position the drum and sing, and Wis'kino formally touches
    the drum with a long drumstick after three feints while leading drummers strike
    it. Songs mark ownership, departure, and a later closed-door phase. Reciprocal
    gifts, speeches, handshakes, pipes presented to the sky and passed through the
    assembly, placement of the drum in the Menominee chief's house, a following warrior-drum
    presentation, dancing, adornment gifts, and musical analysis of the Song of the
    Closed Door are also described.
  language: English
  quote_policy: summarized
