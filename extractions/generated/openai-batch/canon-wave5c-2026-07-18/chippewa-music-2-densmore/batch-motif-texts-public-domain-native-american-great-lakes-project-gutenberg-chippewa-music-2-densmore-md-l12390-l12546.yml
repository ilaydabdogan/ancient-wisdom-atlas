canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Chippewa drum-presentation ceremony:
    a pipe is offered toward the sky while the Song of the Pipe is sung; food and
    gifts are presented in relation to the drum; a loosened drumhead is restored through
    song, dance, and heat; Bi''jikens presents Wis''kino with ritual responsibilities
    and gifts; and Wis''kino selects a young man to care for the pipe belonging to
    the drum.'
  language: English; OCR transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the Song of the Pipe, the drummer faces east, holds the pipe almost
    horizontal, and turns it four times in a circle above his head; this pipe presentation
    is done four times during the day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony includes many speeches, lasts many hours, and includes a noon
    feast; delicacies presented to the drum are placed beside it and later divided
    among singers and drummers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When an untanned drumhead loosens during a ceremony, one drummer starts the
    Song of the Drum; five men in charge of the drum rise, dance around it, and then
    hold it near a fire until the resonance is restored.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that drumhead tightening is usually accomplished by exposing
    the drumhead to heat from fire or sun rather than disturbing the fastening.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At about 3 o'clock, Bi'jikens leads Wis'kino across the dancing circle to
    a seat beside the officers of the chief drum and makes a presentation speech asking
    him to select people to care for the drum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bi'jikens removes his beadwork and clothing and places them on Wis'kino; Chippewa
    participants then pile gifts on a blanket, including cloth, garments, shawls,
    quilts, blankets, shirts, and children's gifts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the gift pile is complete, the drum is lifted from its supports and
    placed on the matting; the supports are laid beside it, singers and drummers retire,
    and singing is taken up by the party at another Chippewa drum.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wis'kino selects a young man to have charge of the pipe belonging to the drum;
    the young man's duties are to keep the pipe filled and be present whenever the
    drum is taken from Wis'kino's house for a general assembly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The pipe belonging to the drum is presented to Wis'kino by the Chippewa pipe
    bearer.
  category: action
  evidence_refs:
  - ev:7
