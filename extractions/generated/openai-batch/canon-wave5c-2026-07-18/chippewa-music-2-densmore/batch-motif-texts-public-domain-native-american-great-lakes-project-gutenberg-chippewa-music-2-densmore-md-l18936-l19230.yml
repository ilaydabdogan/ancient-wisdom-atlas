canonical_text:
  quote: ''
  summary: The passage presents several Chippewa songs sung by Ki'miwun with musical
    notation, analysis, and lyric glosses. The song texts include sitting with a turtle,
    being carried by wind around the sky, approaching thunderbirds, and a white-haired
    raven flying around the sky. A prose note says songs in this group are sung after
    a doctor has swallowed bones and during treatment of a sick person, with hissing
    or blowing breath, whistling, and bones issuing from the mouth; an older practice
    involved drawing bones from a shallow dish of water.
  language: English with Ojibwe/Chippewa song text and glosses
  quote_policy: summarized
