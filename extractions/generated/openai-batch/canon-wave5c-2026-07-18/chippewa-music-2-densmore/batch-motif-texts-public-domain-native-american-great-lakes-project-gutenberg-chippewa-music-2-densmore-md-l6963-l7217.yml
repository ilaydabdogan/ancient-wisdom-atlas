canonical_text:
  quote: ''
  summary: The passage describes Chippewa war-expedition songs. A leader sends a messenger
    with tobacco to invite warriors; the messenger offers a filled pipe while singing,
    and those who smoke agree to join. The messenger returns with a report song. Warriors
    gather near the leader's lodge, receive a feast, give a final pledge, and begin
    an initial dance followed by nightly dances until reaching the enemy. One initial
    dance song states that the singer feels no fear in connection with death and a
    “Great River man.”
  language: English with Ojibwe/Chippewa song texts and glosses
  quote_policy: summarized
