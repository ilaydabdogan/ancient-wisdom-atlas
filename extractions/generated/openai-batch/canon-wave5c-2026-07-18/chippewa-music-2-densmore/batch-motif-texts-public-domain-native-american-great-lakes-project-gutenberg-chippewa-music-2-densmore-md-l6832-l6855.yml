  quote: ''
  summary: 'A reminiscence attributed to Ma''djigi''jig describes the hardships imposed
    on young warrior recruits: separation from the main camp, sleeping in bough shelters,
    poor rations, and subordinate treatment by older warriors. The passage also notes
    his later service as a scout and warrior and a plate showing him in a scout posture
    holding grass or brush before his face.'
