canonical_text:
  quote: ''
  summary: The passage recounts the 1858 Battle of Shakopee, then introduces a Chippewa
    war medicine song sung before battle to strengthen a warrior's charm. It describes
    the charm as a birdskin or bird-shaped cloth object filled with medicine known
    to the wearer, hung around the neck for protection, and associated with dream-derived
    knowledge. The passage also gives song words about bird-plumage and flying balls,
    explains the balls as enemy heads, identifies the bird used in one charm as the
    kingbird, and notes the singer's dream song after a ten-day vigil.
  language: English with Ojibwe song text
  quote_policy: summarized
