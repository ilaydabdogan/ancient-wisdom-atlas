canonical_text:
  quote: ''
  summary: 'The passage moves from the end of a children’s fireside story involving
    a pig in a tree, fighting Frenchmen, a rich man traveling toward great water,
    and a rabbit taunting a lynx, into an ethnographic discussion of Chippewa children’s
    folktales and animal-character songs. It then gives the tale of the Coon and the
    Crawfish: crawfish ignore an old female crawfish’s warning, attack a cunning coon
    while singing, and are eaten, while the warning crawfish survives safely in the
    water. Variant song wording presents the coon as either dead or cringing/asleep.'
  language: English, with Ojibwe/Chippewa terms and song words
  quote_policy: summarized
