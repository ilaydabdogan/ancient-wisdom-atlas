canonical_text:
  quote: ''
  summary: The passage first gives rhythmic-analysis notes for numbered songs, then
    introduces Begging Dance songs. It reports an account in which a song and dance
    are said to have come from the Assinniboin or Rock Sioux and to have become practiced
    among the Chippewa. In the origin account, a newborn boy is placed outside a wigwam
    with dogs, the dogs keep him warm and transmit a song to him, and he later travels
    camp to camp singing with the dogs and receiving food. The later begging dance
    is described as a way to obtain food, with dancers moving from wigwam to wigwam,
    sometimes dancing around a fire, and carrying provisions in a birchbark bag. The
    passage also gives song texts and analysis stating that participants represent
    themselves as dogs.
  language: English with transcribed Chippewa/Ojibwe song words and glosses
  quote_policy: summarized
