- id: obs:2
  text: The first song in the Begging Dance group is said to have come from the Assinniboin,
    or Rock Sioux; the dance is also said to have come from that tribe and to have
    been practiced among the Chippewa for many generations.
  category: relationship
  evidence_refs:
