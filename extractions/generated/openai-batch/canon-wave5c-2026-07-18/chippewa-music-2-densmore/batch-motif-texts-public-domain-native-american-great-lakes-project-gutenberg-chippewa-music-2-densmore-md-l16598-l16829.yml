- id: obs:3
  text: E'niwtjb'e states that, among the Sioux, a newborn baby boy was laid on the
    ground outside the wigwam door until he could creep into the wigwam.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: While the child lay outside, dogs formed a circle around him with their heads
    toward him, and their breath helped keep him warm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dogs are said to have given the song to the boy by willing him to know
    it, rather than by singing it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the boy reached manhood, he went from camp to camp singing the song,
    followed by dogs, while shaking a deer-hoof rattle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After he finished singing, he was given food and his dogs were also fed; the
    passage identifies this as the origin of the begging dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In later use, the begging dance was considered a legitimate way for needy
    tribal members to secure food and was also practiced for pleasure.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A leader and small company could go from wigwam to wigwam dancing and singing;
    if occupants were asleep, the dancers entered and danced around the fire, after
    which the people gave them food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If no cooked food was available, the visitors took provisions and placed them
    in a birchbark bag carried by an old woman.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The glossed text of No. 114, called 'Song of the Dogs,' includes the statement
