canonical_text:
  quote: ''
  summary: The passage describes a Dog Feast associated with a Drum-presentation Ceremony.
    The writer reports observing a performance on the Leech Lake Reservation in Minnesota
    in July 1910, with Chippewa participants, including two who enacted Sioux teachers.
    The passage states that the ceremony and feather garments were received from the
    Sioux. It identifies four chief actors, describes their costumes and the dancing
    circle, and recounts the first song, during which the Dog Feast messenger brought
    in a kettle containing cooked dog, danced, and moved the kettle to the western
    side of the enclosure.
  language: English
