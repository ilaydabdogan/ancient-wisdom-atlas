canonical_text:
  quote: ''
  summary: The passage describes Chippewa battle singing, including a battle song
    attributed to Omiskwa'wegi'jigo'kwe, who accompanied her leader-husband in battle
    and wished she could take a scalp though custom forbade women to use the scalping
    knife. It also describes shouted claims of killing a Sioux for recognition and
    encouragement. A second account tells how Niski'gwun revived Odjib'we in battle
    with medicine from his bag mixed with water, sprayed on Odjib'we's feet and limbs
    while singing a help song.
  language: English with transcribed Chippewa/Ojibwe song words
  quote_policy: summarized
