canonical_text:
  quote: ''
  summary: 'The passage contains song words and analysis for several Chippewa/Ojibwe
    songs: a question-and-answer song naming a bird-skin charm as the singer''s trust;
    ethnographic description of singing and soft drumming before attacks; No. 29,
    a Drum Song whose words say the singer makes all brave men dance; and No. 30,
    a song of a man who rushed toward the enemy, together with an account of a warrior
    who discarded weapons and clothing, made himself a target, and might escape if
    not killed at the first shot.'
