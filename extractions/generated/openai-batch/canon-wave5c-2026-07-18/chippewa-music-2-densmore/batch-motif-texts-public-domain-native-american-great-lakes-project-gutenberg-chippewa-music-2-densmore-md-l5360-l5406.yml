  text: Na'waji'bigo'kwe is described as especially skilled in the lore of native
    medicines on the White Earth Reservation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Meja'kigi'jig, Ma'djigi'jig, and A'kiwen'zi gave personal reminiscences and
