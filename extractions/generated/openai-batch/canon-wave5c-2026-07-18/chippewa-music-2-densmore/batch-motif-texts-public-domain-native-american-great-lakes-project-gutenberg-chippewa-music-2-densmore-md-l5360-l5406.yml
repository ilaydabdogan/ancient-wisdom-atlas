- id: obs:1
  text: Odjib'we is described as both a musician and a warrior, with more than 70
    of his songs recorded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During years of blindness at the Old People's Home at White Earth Agency,
    Odjib'we loved to sing and was among comrades who recalled earlier days.
  category: setting
  evidence_refs:
