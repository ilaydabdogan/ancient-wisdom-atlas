canonical_text:
  quote: ''
  summary: The passage introduces Odjib'we as a Chippewa musician and warrior whose
    songs were recorded at White Earth. It names several associates and informants
    who contributed war songs, dream songs, medicine songs, herb knowledge, and reminiscences.
    It closes with Odjib'we's death and a brief historical note on warfare between
    the Chippewa and Sioux/Dakota in Minnesota.
  language: English with Ojibwe names and terms
  quote_policy: summarized
