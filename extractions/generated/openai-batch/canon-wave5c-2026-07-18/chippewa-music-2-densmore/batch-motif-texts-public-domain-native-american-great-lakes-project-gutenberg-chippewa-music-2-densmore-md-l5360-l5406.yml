  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Main'gans, translated as “little wolf,” came from Mille Lac, lived at White
    Earth for almost a generation, loved old ways and songs, and was physically impaired
    from frozen feet in boyhood while remaining active.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Main'gans attributed his strength to a native remedy called hi'jikiwuck, or
