  quote: water flowed from the hole in the pole and fell into the dish
  summary: The passage describes a boy returning from a fasting vigil. His grandfather
    requires him and other returning boys to dance around a medicine pole before eating.
    During the grandfather's song, water flows from a hole in the pole into a birchbark
    dish; the boys drink it to break their fast. The passage states that the fasting
    songs were composed in the grandfather's dreams and that the pole corresponded
    to one seen in a vision.
