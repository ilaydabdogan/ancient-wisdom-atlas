canonical_text:
  quote: ''
  summary: The passage describes an account in which a man's wife appears and tells
    him of four hidden bullets that must be placed in water before use in the moccasin
    game; after finding and soaking them, he wins and becomes successful. The incident
    is said to begin a custom of soaking bullets. A separate dream account gives another
    player confidence after he sees money under moccasins. The passage then explains
    the moccasin game's players, implements, concealment of a marked bullet under
    moccasins, observation of bodily signs, preparation with blanket and wagers, and
    the opening action of singing, drumming, and hiding bullets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's wife appeared to him and told him that four bullets were hidden in
    the woods, would bring success in the moccasin game, and must lie in water before
    use.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man searched in the woods, found four bullets, placed them in water at
    the edge of a lake, used them in a moccasin game, won, and was thereafter successful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the incident began the custom of soaking bullets,
    which many players continue because they believe it brings success in the game.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another successful player was said to have dreamed of a row of moccasins and
    of finding a piece of money under each one; this dream gave him confidence in
    playing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The game may be played by two men but usually has four contestants, with two
    partners playing against two others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each side hides four bullets under four moccasins laid in a row on a blanket,
    and one of the bullets is marked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stated skill in the game is placing the marked bullet so that the opposing
    players cannot readily locate it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other game implements include twenty counting-sticks, a slender striking-stick,
    and additional bullets used by the guessing side to indicate its guess.
  category: object
  evidence_refs:
  - ev:5
