canonical_text:
  quote: ''
  summary: 'The passage describes a Chippewa-Sioux peace-pact ceremony: both sides
    approach in ordered formation with pipe bearers, women, leaders, and warriors;
    women move before the warriors; both sides sing reciprocal praise songs naming
    opposing leaders; guns are fired into the air and left unloaded; pipe bearers
    offer the peace pipe for smoking; warriors shake hands; the Sioux receive Chippewa
    hospitality; and subsequent nightly ca''wuno''ga peace dances are held.'
  language: English with transcribed Chippewa and Sioux/Dakota terms
  quote_policy: summarized
