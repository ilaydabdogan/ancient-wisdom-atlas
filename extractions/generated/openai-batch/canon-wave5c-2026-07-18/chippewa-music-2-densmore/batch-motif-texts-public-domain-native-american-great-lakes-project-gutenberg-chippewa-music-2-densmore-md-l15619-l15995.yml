canonical_text:
  quote: ''
  summary: 'The passage gives tables of rhythmic and metric features for songs 94-104,
    then presents transcriptions, word glosses, and analyses for Chippewa love songs
    Nos. 105-108: “Go with Me,” “Do not Weep,” “You Desire Vainly,” and “He is Gone.”
    The lyrics include a courting invitation with an offer of something to wear, a
    departing speaker telling someone not to weep, a speaker saying an addressee desires
    vainly because the speaker comes to see the addressee’s younger sister, and grief
    over a lover who is gone and dead.'
  language: English with transcribed Chippewa song words and English glosses
  quote_policy: summarized
