  summary: The passage describes Chippewa war-dance songs in praise of bi'jikiwuck,
    with warriors imitating wild cattle and wild animal calls to decoy the Sioux.
    It gives song texts and analyses, then introduces songs sung during preparation
    of island herb medicine and before battle to make the medicine effective as a
    charm. These include a song likening the singer's flight to a raven's feather
    and another using the heavens as defense.
