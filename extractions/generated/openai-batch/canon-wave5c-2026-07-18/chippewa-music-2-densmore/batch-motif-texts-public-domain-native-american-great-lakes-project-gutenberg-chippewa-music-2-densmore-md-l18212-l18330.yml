canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa medicine poles: garments containing tobacco
    or portions of garments are tied high on poles for sick persons, and poles may
    be scraped, renewed, decorated, or replaced. It gives accounts involving Me''dweya''sun,
    whose relatives and friends used poles and garment strips during his illness,
    and whose own medicine pole replicated a fallen tree from an unfulfilled war dream.
    It also recounts Ki''tciodja''nhnwewegi''jig''s boyhood fasting dream of a bird,
    later represented on a medicine-pole banner. The passage then introduces songs
    recorded at Waba''cing village on Red Lake and gives local context for that community.'
  language: English, with Chippewa names and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A garment with tobacco folded in it is tied around a pole in connection with
    a feast; an autumn feast is also mentioned, though frozen ground can prevent taking
    down the pole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When friends are anxious about a sick person's condition, they put tobacco
    in one of the sick person's garments and fasten it high on one of the medicine
    poles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A weatherworn pole may be scraped until it is white and smooth, or replaced
    with a new pole, with the sick person's garment tied on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The writer saw a pole painted with red and blue bands and a banner whose figures
    were outlined in blue; the pole had been scraped a few months earlier when Me'dweya'sun
    was very ill.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: That pole belonged to one of Me'dweya'sun's relatives, had been freshened
