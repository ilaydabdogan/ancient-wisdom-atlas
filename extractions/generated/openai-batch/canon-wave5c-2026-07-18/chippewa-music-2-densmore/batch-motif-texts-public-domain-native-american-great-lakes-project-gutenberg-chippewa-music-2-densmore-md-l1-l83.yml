  summary: An ethnomusicological introduction outlines an analysis of Chippewa songs,
    describing the corpus, collection sites, song classes, tests of song identity
    across singers and reservations, variation in rhythm and melody, the relation
    of words to music, and the beginning of tabulated analysis by melody and rhythm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage frames the analysis around three questions: what the Chippewa
    sing, how they sing, and why they sing.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The material under analysis comprises 340 songs recorded by phonograph and
    transcribed in ordinary musical notation with some special signs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The songs were collected on principal Chippewa reservations in Minnesota and
    on the Lac du Flambeau Reservation in Wisconsin.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The represented song classes include Midewiwin or Grand Medicine songs, dream
    songs, war songs, love songs, game and dance songs, gift-related songs, children’s
    entertainment songs, and some unclassified songs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated purpose of the work is to preserve the oldest songs and songs connected
    with tribal history, custom, and ceremony.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Song identity was tested by recording the same song from the same singer at
    different times, from different singers on the same reservation, and from different
    singers on widely separated reservations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the tests, comparison of phonograms showed song identity, although renditions
    were not always uniform in every respect.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rhythm was repeated more exactly than melody, while melody sometimes changed
    in unimportant progressions or in the number of closing phrases.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old man repeated a song of very irregular rhythm accurately after intervals
    of several months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A young man modified the rhythm of an old song so that it somewhat conformed
    to common rhythms of the white race.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some transcribed Chippewa songs have no words, and most song words are few
    and suggest rather than fully express the song’s idea.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Continuous words are described as occurring only in love songs and in a few
    Mide songs.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The writer reports that, except for love songs, song words seldom vary in
    renditions by different singers, despite the stated possibility of changing words.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Words, syllables, and accents may be altered to fit the music, including omission
    or addition of syllables and insertion of meaningless syllables.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The next section’s tabulated analysis concerns melody and rhythm, including
    rhythm of voice and drum, and begins with a division into major and minor tonality.
  category: sequence
  evidence_refs:
  - ev:11
