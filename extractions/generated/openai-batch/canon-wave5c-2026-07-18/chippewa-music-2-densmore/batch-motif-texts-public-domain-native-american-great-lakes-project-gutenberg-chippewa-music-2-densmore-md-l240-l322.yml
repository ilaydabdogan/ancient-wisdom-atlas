  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the analyzed Chippewa songs, minor thirds in both ascending and descending
    progressions are reported to occur more than twice as often as major thirds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author interprets the interval relation, rather than key relation, as
    central to these songs and calls the interval the melodic nucleus of Chippewa
    song.
  category: relationship
  evidence_refs:
  - ev:6
