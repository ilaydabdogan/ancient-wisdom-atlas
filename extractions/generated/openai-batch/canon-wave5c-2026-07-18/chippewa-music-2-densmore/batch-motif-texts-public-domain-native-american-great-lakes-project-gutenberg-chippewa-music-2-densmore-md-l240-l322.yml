  summary: The passage analyzes Chippewa songs statistically, describing tone material,
    accidentals, harmonic versus melodic structure, downward melodic progressions,
    interval frequency, and the prominence of the minor third. It also cites comparisons
    with reported musical features in other peoples' songs and in animal calls, while
    cautioning that the heard intervals may not have been exact Western minor thirds.
  language: English
  quote_policy: summarized
