  - ev:1
- id: obs:2
  text: Songs are classified by the relation of contiguous accented tones as harmonic,
    melodic, or intermediate; the passage gives counts of 83 harmonic songs, 222 melodic
    songs, and 35 intermediate songs.
  category: other
  evidence_refs:
