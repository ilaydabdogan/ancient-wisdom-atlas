- id: obs:3
  text: The author states that melodic boundaries and the persistence of the third
    and fifth suggest chord relations, but also notes that relatively few songs are
    harmonic in structure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage reports a downward trend in Chippewa melodies: 70 percent begin
    with a downward progression, 65 percent of all progressions are downward, and
    90 percent end on the lowest tone.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second is reported as the most frequent interval, while the minor third
    is next in frequency, comprising 34 percent of downward and 29 percent of upward
    progressions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage cites published observations about minor, flat, or non-major third
    intervals in songs of Asaba people, Australian Aboriginal people, Sumatrans, native
