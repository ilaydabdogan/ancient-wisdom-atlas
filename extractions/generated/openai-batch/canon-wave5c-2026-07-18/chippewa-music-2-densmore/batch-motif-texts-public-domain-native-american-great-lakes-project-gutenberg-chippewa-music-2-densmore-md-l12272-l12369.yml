canonical_text:
  quote: ''
  summary: The passage describes Menominee and Chippewa participants in a drum-presentation
    ceremony. Menominee listen while Chippewa sing, Wis'kino arranges hospitality
    food for the Chippewa, both groups dance, rain delays the ceremony for a day,
    preparations resume with pine branches laid in the dancing circle, five drums
    are arranged, an aid receives tobacco at the entrance, and feather garments associated
    with Sioux usage are worn by ceremonial officials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Menominee beat drums, sang, and danced around them while the Chippewa
    sang songs used at the opening of four days of dancing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Menominee listened as the Chippewa sang, and the women sat with heads
    bowed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wis'kino addressed the Chippewa as relatives, said they must be tired and
    hungry after their journey, and arranged for cooked food to be brought to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men and women brought kettles, pails, and pans containing wild rice, white
