canonical_text:
  quote: ''
  summary: The passage gives musical analysis of one melody and then presents two
    war songs connected with a war expedition that occurred when Odjib'we was young.
    One song concerns a Sioux woman who seized an ax to defend her children during
    a battle and was killed with them. A second account concerns a Sioux woman taken
    captive, prepared for execution, allowed to sing, and then rescued by Odjib'we's
    elder brother; at a later camp dance she expressed gratitude to the warriors by
    handshakes, kisses, and a song she composed.
  language: English with transcribed Ojibwe/Chippewa song words and a Sioux word in
    glossed lyrics.
  quote_policy: summarized
