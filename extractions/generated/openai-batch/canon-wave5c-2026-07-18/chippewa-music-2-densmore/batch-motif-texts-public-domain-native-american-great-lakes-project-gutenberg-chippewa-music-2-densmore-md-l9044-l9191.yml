canonical_text:
  quote: ''
  summary: The passage presents song No. 35, “They are Playing a Game,” with translated
    lines describing passing feet on the prairie and men playing a game as they come.
    It then recounts a context in which a warrior, exhausted while a war party was
    returning home, is not abandoned by the other warriors; he uses medicine, rises,
    composes and sings a song, and continues the journey. The passage also gives song
    No. 36, “Song of the Exhausted Warrior,” whose translated words say that the speaker
    cannot travel but will borrow something by which to arrive, followed by musical
    analysis.
  language: English with transcribed Ojibwe song text
