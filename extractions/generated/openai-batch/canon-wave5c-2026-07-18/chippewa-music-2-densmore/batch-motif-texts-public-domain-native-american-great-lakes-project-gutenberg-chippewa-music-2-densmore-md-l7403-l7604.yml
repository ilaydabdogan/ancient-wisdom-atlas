  quote: ''
  summary: 'The passage describes Chippewa war-related songs and ritual actions: a
    Dog Feast dance, a Song of Departure with feather imagery, the departure of warriors
    toward enemy country, women''s escorting actions, evening warpath camp arrangements,
    the leader''s divinatory use of drum, pipe, and deer-hoof rattle, a nightly leader''s
    song about the earth, and a solitary dream song associated with leaders, oc''kabe''wis,
    and scouts.'
