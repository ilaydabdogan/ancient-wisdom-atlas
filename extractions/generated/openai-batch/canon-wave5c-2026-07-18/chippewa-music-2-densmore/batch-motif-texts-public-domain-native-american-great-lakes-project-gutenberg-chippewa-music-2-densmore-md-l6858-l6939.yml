canonical_text:
  quote: ''
  summary: The passage describes Chippewa young-warrior training and first-war-party
    rules, including a blindfolded marrow-bone contest, mittens and a scratch stick,
    taboos in the recruits' camp, and a snake omen. It then recounts Ma'djigi'jig's
    first war expedition against a Sioux village, including night reconnaissance,
    the leader calling wind, a whistle signal, taking scalps, and the leader's use
    of pipe, dream song, deer, and thunderbird-sent rain to aid the war party.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A breaking-bone contest was held in the recruits' camp after deer or other
    large game were killed; a marrow bone was placed on the ground and a blindfolded
    man attempted to strike it with a hatchet after walking eight paces away and back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man who cracked the bone with the first hatchet blow carried away the
    spoils; the marrow was removed after cooking, and this was stated to be the only
    way a young warrior on his first expedition could taste fat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men on their first war party were required to wear mittens on both hands from
    leaving the village until entering a fight with the Sioux.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A small scratch stick was hung from the mittened wrist for scratching the
    head or body; failure to use it was said to cause boils or sores, and the reason
    given was that recruits lacked the protective medicines carried by warriors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the recruits' camp, stepping over another person's article was avoided;
    stepping across another man's gun led to punishment and was supposed to render
    the gun useless.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: It was considered a bad omen for a recruit to see a snake.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: During Ma'djigi'jig's first war expedition, experienced men reconnoitered
    a Sioux village at night, counted tipis, estimated warriors, and reported back
    soon after midnight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before daybreak, the Chippewa approached the Sioux village; the leader called
    for wind, and the wind noise masked the sound of the Chippewa entering the camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A warrior blew a quavering note on a tiny whistle like a waking bird's call;
    at that signal the Chippewa fired, rushed at the tipis, tore them down, and killed
    wounded people where possible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The attackers severed a Sioux head and later removed scalps; the scalp lock
    behind the crown was described as difficult to remove, but a skillful warrior
    could remove it with one knife motion and carry it at his side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When provisions ran short, the war-party leader chose a camp near a lake,
    smoked his pipe, sang his dream song, smoked again, and pointed to a direction
    where he said a deer was coming and was sent to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before attacking a Sioux village, the leader frequently called on the thunderbird
    to send rain so that the Sioux would remain at home and not detect the approaching
    Chippewa.
  category: action
  evidence_refs:
  - ev:6
