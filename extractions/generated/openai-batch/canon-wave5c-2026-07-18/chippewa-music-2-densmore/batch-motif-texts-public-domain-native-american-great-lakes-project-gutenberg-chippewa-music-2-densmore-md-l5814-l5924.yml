canonical_text:
  quote: ''
  summary: The passage describes Odjibwe's early participation in a public dog feast
    used to test aspiring warriors, his later secret departure on the warpath with
    his cousin, the war song sung during four nights of camping, and the expedition's
    successful killing of one Sioux followed by a return feast and dance.
  language: English with romanized Chippewa/Ojibwe song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In early youth, Odjibwe took part in a dog feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog feast is described as a tribal custom held so young men aspiring to
    be warriors could show courage before assembled people.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old warrior was selected to announce the feast and walked through the village
    making the announcement aloud.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The next day there was a large gathering, especially of young men, with singing,
    dancing, and speeches.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The youths whose courage was to be tested were seated on the ground in a circle,
    and a dog was killed in the center of the circle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dog's liver was removed, cut into small pieces, and one piece was given
    to each young man on a long stick.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A young man who chewed and swallowed the morsel without flinching was considered
    brave enough for the warpath; one who shuddered or drew back was deemed faint-hearted
    and jeered by the assembly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Odjibwe said he endured the test without any change of expression, but for
    many days afterward he was unable to bear the thought of what he had done and
    did not admit this to anyone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: At about age 20, Odjibwe consulted his cousin Ne'bdncc'ktin, and they decided
    to go on the warpath together while concealing their intention as a hunting expedition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Odjibwe and his cousin left the village with heavy hearts, thinking of friends
    whose deaths they were going to avenge and of uncertainty about their own fate.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Odjibwe said that he and his cousin sang the same war song during each of
    the four nights they camped, though the words imply more than two people in the
    party.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The translated song words include the statements 'on the fourth day,' 'I am
    chosen by,' and 'the men,' with a note that 'men' is commonly applied to warriors.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the fourth morning, the party saw one Sioux, killed him, took his scalp,
    and returned to the village, where a feast and dance were held in their honor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The words of the return dance song are described as expressing the youthful
    warrior's arrogance after his first victory.
  category: speech
  evidence_refs:
  - ev:7
