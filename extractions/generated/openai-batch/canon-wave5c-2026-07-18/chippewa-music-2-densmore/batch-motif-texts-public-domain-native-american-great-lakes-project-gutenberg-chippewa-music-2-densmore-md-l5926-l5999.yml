canonical_text:
  quote: ''
  summary: The passage recounts two war episodes involving Odjib'we. In the first,
    after dismissing a report of Sioux scouts, he goes to investigate, is ambushed,
    loses his companion, kills a Sioux attacker, hides by an oak tree, and first sings
    his dream song. In the second, a war party led by Hole-in-the-day ambushes a lone
    Sioux man; Odjib'we shoots him, earns a skunk-skin arm badge, takes the scalp,
    escapes by canoe, and sings during a victory dance on the opposite shore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we stated that he had not sung his dream song on the previous expedition
    and first sang it after being frightened by Sioux in the skirmish described in
    this passage.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Two men and their wives left a Chippewa camp on a hunting expedition, and
    while the men were away the women saw two Sioux scouts and later reported this
    to their husbands.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Odjib'we doubted the report of Sioux nearby, put on bright finery, and went
    with a friend toward the reported place while carrying his gun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two Sioux hid in bushes beside the road, one with a spear and one with a club,
    and attacked Odjib'we and his companion without warning; a larger body of Sioux
    warriors then appeared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odjib'we's companion was killed, while Odjib'we escaped, shot a Sioux who
    attacked him with a club, and hid behind a great oak tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Odjib'we killed a Sioux in the first skirmish, the other Sioux disappeared;
    Odjib'we did not stop to scalp the man, but later Chippewa returned and scalped
    the dead man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A later song was composed by Odjib'we after killing a Sioux and was sung by
    him while carrying the scalp in a victory dance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hole-in-the-day organized a small Chippewa war party near the Minnesota River
    and ordered the men to lie behind a fallen tree, wait for his firing signal, allow
    only one man to fire, and not shoot a woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A company of Sioux men and women passed without being fired on, but when a
    lone Sioux man came later, Hole-in-the-day signaled Odjib'we, who fired and wounded
    him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Because Odjib'we caught the wounded Sioux by the arm, he was thereafter entitled
    to wear a skunk-skin badge on his right arm.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the wounded Sioux was killed and scalped, the Chippewa crossed the river
    by canoe while Sioux from the village failed to overtake them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the opposite shore the Chippewa danced, waved the fresh scalp, taunted
    the Sioux on the bank, and Odjib'we sang a song he had composed at that time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the dance the Chippewa returned home, and Odjib'we said they had killed
    the man to let the Sioux know they had been around.
  category: speech
  evidence_refs:
  - ev:6
