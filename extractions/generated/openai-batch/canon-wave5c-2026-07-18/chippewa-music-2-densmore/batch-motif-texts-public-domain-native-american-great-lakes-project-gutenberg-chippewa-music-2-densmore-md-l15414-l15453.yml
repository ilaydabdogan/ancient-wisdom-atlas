  quote: ''
  summary: 'The passage describes rules and scoring for a moccasin game at White Earth,
    Minnesota: bullets are hidden under moccasins, a guessing side attempts to locate
    the marked bullet, counting-sticks track score, and a stick is placed at the blanket
    edge after each game before stakes are settled after an agreed series.'
