  summary: The passage gives musicological tables and entries for several Chippewa
    songs. It notes that two Mide' songs belong to a ceremony after the death of a
    Mide'wiwin member, with one object being to direct the spirit on its journey.
    It then presents song texts and analyses for Mide' songs and love songs, including
    references to voice, drum, rhythmic units, a manido, a Mide' brother, a lost sweetheart,
    and a refusal to drink.
  language: English with Ojibwe/Chippewa song text and translations
