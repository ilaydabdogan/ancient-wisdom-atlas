    eating of meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Old-Man-Coyote asks his wife whether there should always be daytime and whether
    fire, once obtained, should be kept burning; she chooses day and night and morning
    fire-making after sleep.
  category: speech
  evidence_refs:
  - ev:3
