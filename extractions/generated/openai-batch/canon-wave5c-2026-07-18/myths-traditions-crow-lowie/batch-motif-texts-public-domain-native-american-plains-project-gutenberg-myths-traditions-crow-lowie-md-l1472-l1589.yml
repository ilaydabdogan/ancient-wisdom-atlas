canonical_text:
  quote: ''
  summary: The passage describes Old-Man-Coyote disposing of the alligator into the
    river with help from the beaver, assigning residences and behaviors to animals
    and birds, consulting his wife about day and night, fire, horse use, buffalo hunting,
    pemmican, tipi-making, clothing, Crow camp order, warfare, and women’s dances.
    A following section presents a series of world-ordering disagreements between
    Red-woman and Old-Man-Coyote’s wife about hides, fire, grease, lifespan, death
    customs, possible resurrection, seasons, air, rivers, trees, grass, flowers, and
    medicinal roots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The alligator is called the chief of the water animals and threatens to destroy
    birds and living things unless he is thrown into the river.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Birds surround the alligator with long sticks but cannot push him from the
    high bank; after two failed trials Old-Man-Coyote consults the beaver.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The beaver gives Old-Man-Coyote a moss necklace and instructs him to squeeze
    it behind the alligator so water will flow under him; the ground becomes soft
    and the alligator is pushed into the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: As the alligator goes down, he says he will see one of them occasionally;
    the passage explains this as the reason animals are sometimes caught in the river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Old-Man-Coyote assigns the dragon-fly to ponds and assigns several birds their
