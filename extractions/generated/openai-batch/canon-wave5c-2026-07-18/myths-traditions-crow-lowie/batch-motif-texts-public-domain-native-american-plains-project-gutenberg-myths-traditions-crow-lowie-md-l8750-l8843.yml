canonical_text:
  quote: ''
  summary: A weakened young man leaves his pregnant wife near a rock and encounters
    a dwarf who has killed a deer. The dwarf restores him with deer blood, roasted
    meat, and stretching, then instructs him to heal his wife the same way. The couple
    visits the dwarf's rock house; the wife gives birth to a boy whom the dwarf names
    and ritually presents with incense, fire, and the four quarters. The dwarf and
    his woman provide ornaments, hides, a lodge, horses, stone-body protection, special
    clothing, and colored arrows, and send the young man back toward his people with
    instructions concerning a hostile former husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man brings a big rock to the foot of tall grass, makes his wife
    lie there, says he will go die elsewhere, and walks away crying while using his
    gun as a cane.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After crossing a ridge, the young man approaches a stranger who is butchering,
    saying he will meet the being even if it is an enemy who kills him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stranger is described as a short, muscular dwarf who has killed a black-tailed
    deer, gives the young man deer blood to drink, makes a big fire, and roasts ribs
    for him to eat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After drinking and eating, the young man stands and stretches, and his prior
    inability to hold himself up is gone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dwarf points to a big rock by the mountain as his house and tells the
    young man to take blood to his pregnant wife, make her drink it, and bring her
    the next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wife drinks the blood, stretches, and recovers from her own inability
    to hold herself up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the dwarf's rock house, the pregnant wife is not allowed to enter; the
    young man enters and sees tanned hides and a woman who says the dwarf has brought
    her son late.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the wife gives birth to a boy, the dwarf names him His-arrows-plenty-of-lightning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The newborn is washed; the dwarf uses bear-root incense, moves away the fire,
    places the child over it toward the four quarters, repeats the name, and gives
    the child to its father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dwarf gives the young woman elk teeth, and the dwarf's household provides
    hides and skins so the couple can make and furnish a lodge.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young man explains that the woman had a husband who wanted to kill him;
    the dwarf identifies that man as his adopted child and says he had made that person's
    body of stone with holes above the collarbone and at the rump.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The dwarf sends the young man behind the mountain to bring horses from where
    Shoshoni are located, and then tells him to keep all the horses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The dwarf says the young man's body is now stone, makes a cut-back blanket
    and a shirt with holes, makes four arrows colored black, red, yellow, and blue,
    and tells him to wait until the fourth time before killing the hostile man if
    he still wants to kill him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young man moves with his wife and child and camps near the people with
    a fine tent, bird tail-feathers, elk teeth, and horses of various colors.
  category: sequence
  evidence_refs:
  - ev:9
