  summary: The passage includes the end of one tale in which a man receives supernatural
    instructions, a black horse, sweatlodge purification, and success in first coup.
    It then begins the tale of a young Crow man who fasts to see the birds’ country,
    refuses adoption and medicines from birds, is repeatedly deferred by the Seven
    Cranes, and finally travels on a crane to the sky boundary. The crane chief raises
    the sky with a pipe, the birds cross water toward a land, and the birds’ country
    is described as having painted tipis.
