canonical_text:
  quote: ''
  summary: A boy refuses One-eye’s offers and completes a dangerous race at an ice-hole,
    using a sacred whip to make One-eye’s horse fall and then killing him. The boy
    restores horses and women taken by One-eye. Another fasting boy receives medicine
    and songs after a lightning strike on the mountains, returns, marries two girls,
    and joins the first boy as a successful warrior and chief. A variant begins with
    hostile clans, One-eye as a tyrannical ruler, and a boy named Kills-alone or Bear-comes-from-afar
    undertaking a mountain vision-fast, returning to teach sweatlodges and demonstrate
    controlled fire power.
  language: English
  quote_policy: summarized
