canonical_text:
  quote: ''
  summary: A young man whose face was burned in childhood leaves home for the mountains
    seeking help for the side of his face he hates. After encounters with successive
    tipi beings who send him farther on, he meets an eagle who promises help if the
    young man will help protect the eagle's offspring from something in a lake. The
    young man is warned away from drinking water, carried by a bear, washed by eagle-made
    rain so he can speak to the Sun, instructed by a little bird, and then addressed
    by the Sun at sunset. The passage ends as he goes toward a riverside where others
    are waiting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy falls into the fire while playing and burns his face; as a man he dislikes
    one side of his face while the other side is described as good-looking.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man stays inside his tipi and paints his face before going out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He asks his mother to make many moccasins; after his father supports him,
    she makes them, and he leaves camp for the mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the mountains he makes a shelter among pines, stores meat and moccasins
    on poles, and goes out for a vision.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the first encounter, unseen speakers question him, a white tipi appears,
    medicines are visible inside, and he is told to go farther into the mountains
    after stating that he hates one side of his face.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a second place, another tipi appears after two days; its speakers ask what
    he is trying for and again tell him to go farther.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a third place below a high hill, he makes a shelter, goes onto the hill,
    sees an eagle circling, and the eagle comes down to sit by him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eagle asks why he is crying, hears that he hates one side of his face,
    and promises to come to his shelter and tell him things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The eagle, appearing as a person at the shelter, says he will help the young
    man but asks the young man to help him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The eagle describes a lake with an island and a nest; whenever he has children,
    something comes from the lake and eats his little ones, and the nest currently
    holds two eggs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the young man approaches clean water to drink, a spirit tells him not
    to drink it, and he jumps across.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A bear says he has been waiting for the young man, tells him to get on his
    back, and carries him toward the place shown by the eagle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The eagle says the bear is dangerous and that the young man must do what the
    Sun says.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The eagle makes medicine, causes rain to fall without visible clouds, and
    washes the young man so he can talk to the Sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A little bird tells the young man what to say to the Sun before explaining
    his troubles.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: At sunset the Sun turns to the young man and tells him to run four times to
    reach the Sun's place; afterward the little bird says others are waiting at the
    riverside, where four ducks are introduced.
  category: sequence
  evidence_refs:
  - ev:10
