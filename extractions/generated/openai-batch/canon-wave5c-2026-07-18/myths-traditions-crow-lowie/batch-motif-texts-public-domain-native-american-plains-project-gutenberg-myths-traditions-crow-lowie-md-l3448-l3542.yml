canonical_text:
  quote: ''
  summary: Ka/ricbapi'tuac finds the bones of his mother and little brother and restores
    them by shooting arrows upward and warning them to move as the arrows fall. He
    hunts buffalo and his mother prepares hides into a tipi. A bird warns him that
    Long-arms will take him; the younger brother serves as a decoy and is abducted.
    Ka/ricbapi'tuac sends arrows and his bow upward, ascends to the sky, enters an
    old woman's tent in smaller form, and reaches a Sun dance gathering where Long-arms
    holds the younger brother as intended food. He kills the old woman, cuts off Long-arms's
    arms, rescues his brother, and returns to earth by following arrows downward.
    The passage gives etiological explanations for morning eating and for children
    fighting elders, and states that Long-arms had been taking animals and people
    from earth to kill and eat them.
  language: English
  quote_policy: summarized
