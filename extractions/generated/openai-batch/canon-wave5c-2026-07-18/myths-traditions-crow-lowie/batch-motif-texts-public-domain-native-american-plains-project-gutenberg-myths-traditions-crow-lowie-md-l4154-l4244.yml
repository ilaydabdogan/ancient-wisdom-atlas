canonical_text:
  quote: ''
  summary: Two brothers confront a dangerous buffalo, investigate and kill Red-woman
    with her own digging-stick, burn her shelter over her body, and then Spring-boy
    enters a dangerous white tipi associated with snakes after exchanging eyes with
    a jack-rabbit and receiving advice from Old-Man-Coyote. Inside the snake lodge,
    a flat stone protects him while the snakes attempt to attack him during a storytelling
    exchange.
  language: English
  quote_policy: summarized
