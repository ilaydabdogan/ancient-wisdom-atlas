canonical_text:
  quote: ''
  summary: 'Old-Man-Coyote visits the elk, condor, and crow in their tents or lodges,
    declares hunger, receives food made from bark and body-derived substances, eats,
    saves some for his family, smokes, tells stories, and invites the hosts to visit
    him. Later the owl, elk, and condor visit Old-Man-Coyote. Old-Man-Coyote attempts
    similar food-making acts: with the owl his pierced eye falls out and the owl heals
    it; with the elk his scraped neck bleeds while the elk''s produces shavings; with
    the condor he successfully provides meat and grease. The passage ends with the
    condor reporting to the elk and owl that Old-Man-Coyote fed him well.'
  language: English
  quote_policy: summarized
