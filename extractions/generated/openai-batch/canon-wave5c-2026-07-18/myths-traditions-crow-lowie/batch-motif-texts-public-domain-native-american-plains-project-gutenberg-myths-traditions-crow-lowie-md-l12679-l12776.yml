canonical_text:
  quote: ''
  summary: The passage recounts Crow war episodes involving Barl’te and a later account
    of a fourth brother who becomes known as Kills-with-his-mother. It includes dream
    or wish statements before raids, horse capture, enemy killing, ritual praise,
    a mother’s participation in killing an enemy horse thief, warrior display in a
    sham battle, medicine-making, military success, illness and death, and a closing
    statement that four brothers became eminent men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man says he dreamt of a hay or bay horse with split ears and a feather tied
    to the end of its mane, and tells others to get it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Feaster tells his wife to make moccasins because he is going on the warpath,
    and six men set out at night, crossing at the mouth of the Little Horn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Barl’te makes a wish before setting out: that he will safely bring his men
    home and give something to each clan father.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Barl’te scouts from a high hill, sees two men butchering, and reports this
    to his party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party kills two enemy men; Barl’te strikes coups, takes a gun, and captures
    three horses, one of which matches the horse earlier desired or described.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Barl’te and the group steal sixty horses, cross the river, and return home;
    a clan father sings glad-songs before Barl’te’s tipi and receives two horses from
    him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The fourth brother digs and stays in a hole near a bank by Fort Custer, hears
    Sioux above him at night, and later warns the Crow that Sioux may try to steal
    their horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The fourth brother says jokingly that he will stay home and catch an enemy,
    and the passage notes that while at the bank he had dreamt of killing a man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: An enemy tries to steal a bobtail sorrel pony, but the pony moves backward,
    steps on a tipi cover, and tears it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The fourth brother seizes and stabs the enemy; the enemy cuts the Crow’s ribs,
    and the Crow’s mother strikes the enemy’s head with a hatchet after her son throws
    him down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the killing episode, the Crow receives the name Isa’-kaxparape’c, translated
    in the passage as He-kills-with-his-mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Kills-with-his-mother asks to be taken to war and has a crier announce a sham
    battle led by the Sweater, the Sun-worshiper, the Feaster, and Kills-with-his-mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the sham battle, Kills-with-his-mother rides a black horse painted with
    white stripes, paints himself all white, makes a lightning ring around his face,
    and paints his spear white.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: An old man who sings for Kills-with-his-mother says that he will not live
    long and tells him to have his sweethearts before he dies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Kills-with-his-mother’s mother carries his spear; he makes medicine and passes
    through a corral without being hurt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Kills-with-his-mother leads in fighting, stabs enemies, drives enemies back,
    and returns home as a distinguished man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: Before completing the same feat a fourth time, Kills-with-his-mother catches
    a disease in camp and dies at about forty years old.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: 'The passage concludes that four brothers became eminent men: the Feaster,
    the Sweater, the Sun-worshiper, and Kills-with-his-mother.'
  category: relationship
  evidence_refs:
  - ev:7
