- id: ev:7
  type: summary
  locator: lines 15406-15509; The Otter Sisters
  quote_or_summary: Two beautiful otter women lure a rich young man under the ice
    into an underwater tipi, marry him, receive buffalo meat, and their father grants
    otterskin-scalplock medicine; after a name insult, one wife leaves in otter form,
    and another daughter finally takes him back.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Rights status not supplied in metadata.
- id: ev:8
  type: summary
  locator: lines 15406-15509; The Buffalo Husband
  quote_or_summary: A chief’s daughter promises to marry a buffalo skull and is carried
    off by a buffalo; her human husband, aided by moles, retrieves her underground,
    and night-hawk’s advice lets him scatter the pursuing buffalo from a tree refuge.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Rights status not supplied in metadata.
- id: ev:9
  type: summary
  locator: lines 15406-15509; The Stump-horn and the Bladder
  quote_or_summary: Two poor boys obtain an old elk stump-horn and bladder, win the
    chief’s daughters, secure buffalo and war trophies, and use stars enclosed in
    the bladder as agents and warriors; the keeper finally disappears with the medicine
    into the sky as a former big star.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
