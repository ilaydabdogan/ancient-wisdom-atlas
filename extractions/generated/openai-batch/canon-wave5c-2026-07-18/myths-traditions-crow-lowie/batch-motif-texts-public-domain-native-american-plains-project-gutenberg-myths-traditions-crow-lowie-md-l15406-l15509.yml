  locator: lines 15406-15509; Old-Man-Coyote 4, war-power section
  quote_or_summary: Old-Man-Coyote protects Sore-Tail in war, becomes Sun, directs
    red face circles, becomes wiser and respected, gives White Robe power in vision,
    and lengthens night by means of White Robe’s shield.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
