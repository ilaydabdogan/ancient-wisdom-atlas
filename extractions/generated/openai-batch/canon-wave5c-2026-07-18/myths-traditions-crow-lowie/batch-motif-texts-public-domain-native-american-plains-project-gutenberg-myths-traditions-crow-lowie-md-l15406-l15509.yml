candidate_motifs:
- id: motif:1
  label: Stolen summer apportioned into seasonal halves
  taxonomy_refs:
  - seasonal_cycle
  - sacred_theft
  basis: The tale states that summer and winter are held in bags, that Old-Man-Coyote
    steals the Summer bag, and that a settlement gives each country summer for half
    the year.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage is a brief abstract, so details of the owners and negotiation
    are compressed.
- id: motif:2
  label: Trickster who crosses forms and alters beings
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: Old-Man-Coyote repeatedly transforms himself or others and obtains food,
    power, or etiological results through deception or force.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a broad pattern across several short abstracts rather than a single
    fully narrated episode.
- id: motif:3
  label: Etiological origin of an animal feature
  taxonomy_refs: []
  basis: The goose episode explicitly explains long goose necks as the result of Old-Man-Coyote
    pulling the last goose’s neck.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No taxonomy reference was supplied for etiological animal features.
- id: motif:4
  label: Human marriage into an otter underwater household
  taxonomy_refs: []
  basis: The rich young man is forced through an air hole to an underwater tipi, marries
    otter women, and receives medicine from an otter father-in-law.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage identifies the wives as otters but does not elaborate the
    underwater realm beyond the tipi and air hole.
- id: motif:5
  label: Name insult breaks animal-spouse marriage
  taxonomy_refs: []
  basis: An otter wife tells the husband not to call her a bad name; when he does,
    she becomes an otter and leaves him.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The exact bad name and the rule’s background are not given in the abstract.
- id: motif:6
  label: Buffalo spouse abduction and animal-aided rescue
  taxonomy_refs:
  - stolen_beloved
  basis: A buffalo skull becomes the promised spouse, carries off the woman, and her
    human husband retrieves her with moles’ help while buffalo pursue them.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The woman’s initial promise complicates a simple abduction reading.
- id: motif:7
  label: Tree refuge during pursuit by animals
  taxonomy_refs: []
  basis: The rescued couple climb a tree during buffalo pursuit, are discovered, and
    survive after the man follows night-hawk’s shooting advice.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is one episode within a short abstract and not identified by the
    passage as a separate tale type.
- id: motif:8
  label: Medicine object containing star warriors
  taxonomy_refs: []
  basis: The bladder contains stars that come out to perform required deeds and become
    warriors who defeat enemies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No supplied taxonomy reference directly covers star medicine objects.
- id: motif:9
  label: Sky return of a former star figure
  taxonomy_refs:
  - ascent
  basis: The keeper of the bladder disappears with the medicine into the sky, where
    he belonged and had formerly been a big star.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The abstract states the final sky disappearance but does not narrate the
    keeper’s prior star origin in detail.
- id: motif:10
  label: Poor youths gain status through powerful medicine
  taxonomy_refs: []
  basis: Poor boys use the stump-horn and bladder to secure food, horses, scalps,
