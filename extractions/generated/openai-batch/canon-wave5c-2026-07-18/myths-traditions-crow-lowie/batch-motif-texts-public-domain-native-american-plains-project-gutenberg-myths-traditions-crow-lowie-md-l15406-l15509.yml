canonical_text:
  quote: ''
  summary: 'The appendix gives brief abstracts of several tales: Old-Man-Coyote episodes
    about the seasonal bags, bears, food-bodied men, war power, and goose necks; an
    Otter Sisters marriage tale; a Buffalo Husband abduction and rescue tale; and
    a Stump-horn and Bladder tale in which star medicine brings hunting and war success.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Summer and winter are kept in bags by a woman; Old-Man-Coyote and animal helpers
    steal the Summer bag, and an agreement gives each country summer for half the
    year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: Old-Man-Coyote turns into an elk while deer, coyote, jack-rabbit, and wolf
    help carry the stolen Summer bag away from its owners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old-Man-Coyote imitates bears burying one another, buries the bears, builds
    a fire, cooks them, and ignores their whistling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old-Man-Coyote bites pieces from four men whose bodies are forms of food,
    knocks them into a lake bed where they become soup, and later punishes a comrade
    who drinks the soup.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Old-Man-Coyote protects Sore-Tail in war, transforms himself into Sun, prescribes
    red face circles, gives power to White Robe in a vision, and lengthens the night
    with White Robe’s shield.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Old-Man-Coyote wrings the necks of geese crossing a lake, fails to wring the
    last goose’s neck, pulls it longer, and the abstract explains this as why geese
    have long necks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two beautiful women are long otters with fine fur who force a rich young man
    through an air hole into a tipi under water and marry him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The otter father-in-law instructs the young man to tie his scalplock with
    otterskins so that touching it to the ground makes him disappear underground;
    the man later becomes a chief and cures wounded warriors at water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: One otter wife bears a boy child, warns the husband not to call her a bad
    name, leaves in otter form when he does so, and the father-in-law eventually has
    a daughter take him back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A chief’s daughter promises to marry a buffalo skull; the buffalo carries
    her off, and her human husband, aided by moles, seizes her and takes her away
    underground.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The fleeing couple climb a tree while buffalo pursue them; the woman urinates
    on the last buffalo and reveals them, and a night-hawk advises the man how to
    shoot the buffalo leader so the herd scatters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two poor boys receive an old elk stump-horn and bladder, marry the chief’s
    two daughters, direct buffalo into a corral, and repeatedly return with enemy
    horses and scalps.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Stars enclosed in the bladder come out and perform required deeds, including
    becoming warriors who defeat an enemy camp.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The keeper of the bladder disappears with the medicine into the sky, where
    he belonged and had formerly been a big star.
  category: sequence
  evidence_refs:
  - ev:9
