  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Girls and the Sioux woman dance, while Crow-on-the-forehead's parents carry
    bows and guns taken by their son from the enemy and sing praise songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Sioux visitors arrive, are watched while pitching their tents, give presents
    to the daughter, look at the young man, and remain four days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the Sioux visitors leave, Crow-on-the-forehead gives his wife's father
    half of his horses and returns guns and property taken from the enemy; the woman
    remains among the Crow, has a child, and the Sioux and Crow live in peace for
    a time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the next tale, a young woman says a suitor may marry her if he brings her
