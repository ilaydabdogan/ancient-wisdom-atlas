canonical_text:
  quote: ''
  summary: 'The passage concludes a Crow-on-the-forehead episode in which a Sioux
    woman comes to marry him, exchanges gifts with his parents, summons her Sioux
    kin, and a temporary peace follows. It then begins the tale of Red-hair''s Hair:
    a young woman sets marriage on the condition that a suitor bring Red-hair''s hair,
    and the suitor departs with arrows, receiving directions and advice from successive
    tipi-dwellers after bringing them game.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young woman enters the young man's sleeping place but does not speak or
    comply with his instructions; after a fire is built, the household recognizes
    that she is not Crow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Sioux-speaking woman talks with the young woman and reports that she came
    to marry Crow-on-the-forehead and that the Sioux are afraid of him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sioux young woman gives a mule to the young man's mother, a horse to his
    father, and presents all that she brought.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Crow-on-the-forehead's parents sing praise songs, announce that an enemy child
    has come to marry their son, and people gather to look at her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young woman asks that two captives be sent to the Sioux camp to tell her
    people that she has not been killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Her father and relatives come toward the Crow; the Crow camp moves to a big
