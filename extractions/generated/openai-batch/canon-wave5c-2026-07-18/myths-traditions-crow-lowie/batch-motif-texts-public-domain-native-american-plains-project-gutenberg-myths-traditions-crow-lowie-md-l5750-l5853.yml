canonical_text:
  quote: ''
  summary: Looks-down follows his wife and son through successive obstacles to the
    camp of the boy's grandmother. The wife repeatedly refuses to feed or speak to
    him, while the son warns and helps him. At the grandmother's stone-doored lodge,
    Looks-down enters in feather form, identifies his son, wife, and bed by signs
    supplied by the boy, survives a deadly sweatlodge test using small creature-forms,
    and obtains wood from a dangerous thunder-nest tree after praying to his father
    and receiving storm aid.
  language: English
  quote_policy: summarized
