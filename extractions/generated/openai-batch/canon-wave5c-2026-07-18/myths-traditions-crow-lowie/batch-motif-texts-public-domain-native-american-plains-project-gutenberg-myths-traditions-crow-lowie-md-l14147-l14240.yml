    his mother to get his medicine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young Crow catches a gray horse, drives back Shoshoni attackers, stabs
    some with his spear, and dismounts them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young Crow later uses a tomahawk, kills many enemies, and the Shoshoni
