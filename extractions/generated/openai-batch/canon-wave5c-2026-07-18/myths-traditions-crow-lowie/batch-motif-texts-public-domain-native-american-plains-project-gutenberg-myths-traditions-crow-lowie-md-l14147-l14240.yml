canonical_text:
  quote: ''
  summary: The passage first recounts Little-head and Bull-snake escaping enemies,
    crossing water, and treating Bull-snake after a snakebite with a weed. It then
    notes that both were medicine men and that Little-head could not be shot. The
    passage next recounts a conflict between Crow and Shoshoni involving Shoshoni
    shamans with supernatural powers, a young Crow visionary who uses deer-hide medicine
    and fights in red paint, and the capture and honorable treatment of Red-face,
    who gives power and establishes peace through adoption and exchange of property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little-head begins to sing; when Bull-snake opens his eyes, he finds himself
    across a creek on a hill and does not know how he got there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sioux are still surrounding the original place, and shooting is heard
    there after Little-head and Bull-snake have moved away.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little-head says he does not know how to swim; the two make a raft from forked
    logs for their clothing while Bull-snake swims with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Little-head repeatedly says the water is shallow and is described as walking
    or treading water, while Bull-snake goes under when he tries to stand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A snake bites Bull-snake; Little-head chews a weed, spits on the bite, and
    Bull-snake comes back to his senses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bull-snake later stays by good water, gets a weed, doctors himself, uses the
    weed when hungry, and recovers enough to return to camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Bull-snake and Little-head were medicine men; it also
