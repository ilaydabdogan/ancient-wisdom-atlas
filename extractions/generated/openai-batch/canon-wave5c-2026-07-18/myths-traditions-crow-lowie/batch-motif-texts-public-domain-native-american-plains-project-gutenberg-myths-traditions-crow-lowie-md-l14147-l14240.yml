    were shamans.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A young Crow mourns and has a vision; he gives instructions about crooked-horned
    deer, has a red-painted suit made from two such deer, and has a spear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a Shoshoni scout reports the Crow, Red-face proposes destroying them
