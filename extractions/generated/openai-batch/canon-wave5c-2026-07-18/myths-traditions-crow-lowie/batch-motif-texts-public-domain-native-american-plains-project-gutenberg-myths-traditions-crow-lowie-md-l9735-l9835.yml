canonical_text:
  quote: ''
  summary: A crying boy, later named Plenty-badger, seeks help after a girl has struck
    and rejected him. Speaking rhubarb plants, a man, and a bear direct him farther
    until he reaches an elk skull, which speaks, becomes an elk-man, demonstrates
    a whistle that summons females, and grants him elk medicine and limited elk transformation.
    After returning, Plenty-badger and his comrade reenact parts of the instruction;
    Plenty-badger becomes elk-like, whistles to attract young women including the
    girl who insulted him, and rebuffs her.
  language: English
  quote_policy: summarized
