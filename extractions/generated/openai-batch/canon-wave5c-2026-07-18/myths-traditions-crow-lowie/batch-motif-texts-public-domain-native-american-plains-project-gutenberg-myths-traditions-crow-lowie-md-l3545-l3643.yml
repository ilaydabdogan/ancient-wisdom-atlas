canonical_text:
  quote: ''
  summary: The passage contains the end of one tale and the beginning of another.
    In the first, a boy approaches hunters, is chased with a buffalo foetus or calf,
    spends the summer in a tree, rejects living with the people, declares that he
    would have made them good and restored them after death, then ascends by arrows
    with his mother, brother, and dogs to become seasonal stars. In the second, a
    young woman follows a porcupine up a box-elder tree into the sky, cannot return,
    marries the sky man who sent the porcupine, bears a son, and the son later breaks
    prohibitions involving meadow larks and a bushy-stemmed turnip, revealing his
    earthly origin and a hole down to earth.
  language: English
  quote_policy: summarized
