canonical_text:
  quote: ''
  summary: A poor young man is suspected by a woman's husband, who strikes the woman
    and makes her bleed. Cunning-man heals her and advises her to join the young man.
    The couple leave camp, hide and travel to the mountains, where hunger weakens
    them. An unidentified man kills antelopes, gives the young man blood and manifolds
    to restore himself and his wife, and later appears in a dream. The young man subsequently
    succeeds in hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man sits among the horses at the young woman's lodge and is seen
    by her husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband questions his wife about giving turnips to the poor young man,
    and she denies involvement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband strikes the woman on the head, causing bleeding, and she goes
    to her parents' lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People who hear of the injury say it is well because the rich man had taken
    his friend's wife too.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cunning-man is summoned and doctors the woman's head on successive visits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cunning-man tells the woman that she should marry or take the young man as
    her lover because her husband hurt her for nothing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cunning-man instructs the woman to prepare moccasins and other things and
    to stay away from camp for about ten days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cunning-man tells the young man to prepare blankets, a saddle, and a horse
    for the woman's coming.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman comes to the young man at night; they ride double, turn back, and
    stay in the woods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During travel, they stay on a high hill by day, then continue until they reach
    the mountains and build a shelter in a canyon.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: After their calf meat is gone, the young man fails to kill elk, deer, or rabbits,
    and both he and his wife become very weak from hunger.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young man lies on rocks and cries during the night before seeing two antelope
    and an unidentified man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The unidentified man kills both antelopes with arrows, speaks with the young
    man, and gives him blood and two mouthfuls of manifolds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The unidentified man instructs the young man to take blood and manifolds to
    his wife and says that she is still living.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The young man finds the game load unexpectedly light and returns to the shelter,
    where magpies fly out and his wife is still alive.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After drinking blood and eating manifolds, the woman becomes well enough to
    walk and cook.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The young man dreams and sees the unidentified man again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The young man later kills antelopes, eagles, and a deer in the hunting area.
  category: action
  evidence_refs:
  - ev:11
