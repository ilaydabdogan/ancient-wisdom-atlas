canonical_text:
  quote: ''
  summary: A young woman who had insulted Plenty-badger seeks to marry him and offers
    horses and other gifts through his grandmother and her own kin. Plenty-badger
    and his comrade humiliate her before he eventually accepts the horses and marries
    her, but delays sleeping with her until winter at his grandmother’s urging. Their
    child, Black-elk, is named and ritually marked. After the grandmother dies and
    is buried on a tree, Black-elk’s desire to revisit her burial place is described
    as the origin of a Crow custom of returning to relatives’ burial sites. Plenty-badger
    later makes medicine for four men, who become notably handsome in sham battles
    and attract women by whistling.
  language: English
  quote_policy: summarized
