canonical_text:
  quote: ''
  summary: The supplied passage contains the end of a snake episode in which Old-Woman’s-Grandchild
    is entered by a snake, restored to life after the snake is drawn from his skull,
    and the snake’s later biting behavior is explained. It then gives a tale of a
    pregnant woman killed by a witch-like visitor, her twins placed separately behind
    a curtain and in a spring, the father’s discovery of the surviving children, the
    capture and incorporation of Spring-boy, the twins’ revival of their mother, and
    the beginning of an episode involving a buffalo that swallows people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake comes underground and enters Old-Woman’s-Grandchild through the anus,
    then moves upward into his skull as he breaks off parts of himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Curtain-boy places the head or skull in a hollow; rain fills the skull with
    water, the sun heats it, the snake comes out, and Old-Woman’s-Grandchild comes
    back to life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Curtain-boy and Old-Woman’s-Grandchild rub the snake’s face on stone until
    its long nose is worn off; after begging, the snake is released and says it will
    bite only occasionally.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A pregnant wife in a tipi receives a woman guest while her husband is hunting
    and cooks meat for her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman guest says pregnant women are her plates, eats from the pregnant
    woman’s belly, cuts open her abdomen, removes two little twins, throws one behind
    a curtain and one into a spring, and props the woman upright with sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband returns, touches his motionless wife, sees that her belly is empty,
    and later hears a child behind the wall asking for food and explaining what happened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father leaves meat for the boy while hunting; the food is eaten, two sets
    of tracks appear, and the boy asks for two bows and arrows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Spring-boy plays with the other boy but flees to the well or spring when the
    father returns; after a failed capture, the father makes rawhide gloves so the
    boy can hold him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When Spring-boy is held, he says he is helpless, returns his sharp teeth to
    his 'father,' and asks that a complete buffalo be put into the spring for that
    'father.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the boys grow up, Lodge-boy asks Spring-boy to help revive their mother,
    who still lies where she was left.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The twins use spoken prompts about an overflowing kettle, a falling ball,
    a cherry-masher, and the husband returning from the hunt; the mother gradually
    moves, rises, drinks water, eats meat, stretches, and becomes well.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The revived mother tells her husband that she was asleep and that the boys
    woke her up.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The father warns the boys not to go to a buffalo on the other side because
