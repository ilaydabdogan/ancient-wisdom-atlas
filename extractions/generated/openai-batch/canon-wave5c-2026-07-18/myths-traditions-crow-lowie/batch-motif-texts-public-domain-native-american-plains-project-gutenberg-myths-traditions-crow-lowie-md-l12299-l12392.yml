canonical_text:
  quote: ''
  summary: 'The passage closes a return-and-reunion episode in which a young man brings
    a woman''s brother back, recounts his experience, and marries her. It then begins
    a Crow tale of four brothers who pursue different ritual practices: praying to
    the Sun, fasting, building sweatlodges, and giving feasts. The Sweater conducts
    protective sweatlodge rites for children, performs a smoke-and-naming rite for
    an infant, continues building sweatlodges daily, and later joins Red-bear on a
    warpath where a dream of specific horses is fulfilled by a horse raid.'
  language: English with Crow terms
  quote_policy: summarized
