canonical_text:
  quote: ''
  summary: The protagonist enters a man-eating buffalo, kills it from inside, rescues
    four surviving men, and teaches them to make and use bows and arrows to hunt buffalo.
    The passage then lists other destructive beings he has killed as part of a mission
    from above. Later, a snake enters his body and kills him; after three years his
    father in the sky sends animal helpers to find his bones and arrange his skull
    toward the sun. Rain and solar heat make the snake leave the skull, the protagonist
    rises, subdues the snake, and explains the origin of headaches, sickness, and
    worms in bodies.
  language: English
  quote_policy: summarized
