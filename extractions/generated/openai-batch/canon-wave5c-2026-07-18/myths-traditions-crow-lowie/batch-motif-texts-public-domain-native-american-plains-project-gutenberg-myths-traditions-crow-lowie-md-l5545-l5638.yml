canonical_text:
  quote: ''
  summary: A woman later named Corn-silk travels with moccasins and corn balls toward
    marriage to One-feather-gone-from-his-wing. Groups of mice warn that the husband
    kills his wives. Badgers, after receiving food from her, tell her how to survive
    a river ordeal involving a buffalo skull and later help hold her underground while
    her husband, transformed into a bird, tries to seize her. She removes his shell
    necklace, which is his medicine and later described as his heart. The couple later
    has a son, returns to her home, and the son finds the necklace before the husband
    retrieves it and flies up as a bird.
  language: English
  quote_policy: summarized
