- id: motif:2
  label: Intertribal peace marked by gift exchange and camp-sharing
  taxonomy_refs: []
  basis: The Sioux and Crow camp next to each other, the Crow give horses and presents,
    and the groups remain together about ten days.
  evidence_refs:
