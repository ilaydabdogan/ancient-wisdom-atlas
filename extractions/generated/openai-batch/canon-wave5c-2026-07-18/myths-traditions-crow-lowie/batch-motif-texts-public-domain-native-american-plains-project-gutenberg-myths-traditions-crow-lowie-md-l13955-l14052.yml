canonical_text:
  quote: This was the first time the Crow and Sioux made peace.
  summary: The passage recounts Eats-sinews and another Crow boy returning to the
    Sioux dressed in Crow style, persuading the Sioux to move toward the Crow camp,
    and helping arrange a joint camp in which gifts, a returned wife, and mixed households
    mark the first peace between Crow and Sioux. It then begins a separate tradition
    about an Hidatsa war party taking a Nez Perce boy and horses, the boy being adopted
    by the Hidatsa captain, and the Nez Perce father later bringing horses and a larger
    party to seek the boy’s return.
  language: English
  quote_policy: quoted
