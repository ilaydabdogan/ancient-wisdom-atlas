canonical_text:
  quote: ''
  summary: The passage contains two related buffalo-wife accounts. In the first, a
    buffalo cow brings her son to his human father, later leaves after being insulted,
    and is recovered from a buffalo herd through animal helpers and recognition tests.
    In the second, a female buffalo stuck in mud bears a child by a Crow youth, later
    becomes a Crow woman, brings the child to the father, and marries him after he
    remembers the muddy encounter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo cow says the father of her child is a human being and brings the
    child to the edge of a camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child is instructed to call a young man father and to answer his question
    about paternity by referring to the time of the mud.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The buffalo woman warns her husband not to call her names; after he later
    calls her like a ghost, she and the child are gone by night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband finds buffalo and calf tracks at the camp edge, and a winter sparrow
    tells him the tracks are his wife's and that she has reached a big herd.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband prepares moccasins and arrows, follows the tracks, and is taken
    by a little wolf to a large buffalo herd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son, appearing as a calf, tells his father to identify him among many
    similar calves by a left-ear movement; the man succeeds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The son says he will mark his mother with mud when the cows go to water; the
    man identifies the muddy cow as his wife and is allowed to take wife and child
    back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the second account, a scabby female buffalo is stuck in a muddy place by
    a spring, and a youth sexually possesses her twice and calls her wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The buffalo becomes pregnant, gives birth to a human male child, and the child
    is transformed into a calf because they are medicine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The child asks about his father, and his mother says the father is a Crow;
    the child wants to go to him because calves mock him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The buffalo mother takes the child to the Crow camp, turns into a fine-looking
    Crow woman, and the child also appears human.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The child identifies the father, and the father recognizes the mother after
    being reminded of the muddy encounter and the word wife; he then marries her.
  category: sequence
  evidence_refs:
  - ev:8
