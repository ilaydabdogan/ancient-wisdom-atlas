canonical_text:
  quote: ''
  summary: The passage contains the close of an Old-Man-Coyote episode involving mouse
    assistance, the tale “The Hoodwinked Birds,” in which Old-Man-Coyote uses a bloodied
    mourning ruse to catch geese before the birds escape, and the tale “Old-Man-Coyote
    and Porcupine,” in which Porcupine tricks a buffalo into carrying him across a
    river by entering its body and then kills it from within.
  language: English
