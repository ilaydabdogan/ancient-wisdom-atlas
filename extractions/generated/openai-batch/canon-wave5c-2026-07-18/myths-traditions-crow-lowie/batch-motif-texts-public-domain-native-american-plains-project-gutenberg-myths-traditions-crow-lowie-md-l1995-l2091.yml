canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Old-Man-Coyote gives a
    soiled blanket to a rock, takes it back, is pursued by the rock, deceives several
    animals into attacking it, and is finally saved when a night bird shatters the
    rock, producing scattered medicine-stones. A second tale tells how Old-Man-Coyote
    joins painted geese in flight, falls over a camp, escapes people who intend to
    pluck and eat him, transforms into a wolf, and leaves a trail of dung. A third
    tale begins with hungry Old-Man-Coyote visiting the Owl chief, whose wife prepares
    bark and pierces the owl's eyes so grease transforms the bark into meat. Footnotes
    compare the flight tale to a Mandan tale and the bungling-host tale to a widespread
    motif, especially a Shoshoni parallel.
  language: English
  quote_policy: summarized
