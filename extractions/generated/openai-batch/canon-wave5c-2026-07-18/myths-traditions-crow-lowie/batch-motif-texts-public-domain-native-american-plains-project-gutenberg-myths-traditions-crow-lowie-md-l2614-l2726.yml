canonical_text:
  quote: ''
  summary: 'The passage includes the end of a tale in which an unnamed male repeatedly
    drinks or handles water despite a warning and loses body parts that he replaces
    with mud. It then gives the tale of Old-Man-Coyote and his mother-in-law: Old-Man-Coyote
    engineers a journey under the pretext of a war party, stages a river crossing
    to see his mother-in-law exposed, camps with her, instructs an owl to threaten
    them into sleeping together, and returns home with the event concealed. A short
    alternate text version repeats the owl-coercion episode.'
  language: English
  quote_policy: summarized
