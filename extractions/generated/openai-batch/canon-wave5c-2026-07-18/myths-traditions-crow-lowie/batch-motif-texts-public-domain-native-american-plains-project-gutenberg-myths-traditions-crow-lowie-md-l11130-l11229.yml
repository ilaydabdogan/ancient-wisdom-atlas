canonical_text:
  quote: ''
  summary: 'The passage first gives a fragmentary account of buffalo hunting, mountain
    berry gathering, and exchanges with White men who provide knives, ammunition,
    iron tools, and beaver traps. It then gives two versions of “The Offended Turtle”:
    war-party members meet a large turtle, some ride on it despite warnings, cannot
    get off, and are carried into a lake and drowned while non-riders survive to report
    the event. After mourning, the Crow select a chaste woman, place her in a separate
    lodge with ground-cedar, offer her to Thunder as a wife in return for help against
    the animal, and receive ritual instructions involving sweatlodges, smoke to the
    cardinal directions, Tobacco, and camping by the lake.'
  language: English
  quote_policy: summarized
