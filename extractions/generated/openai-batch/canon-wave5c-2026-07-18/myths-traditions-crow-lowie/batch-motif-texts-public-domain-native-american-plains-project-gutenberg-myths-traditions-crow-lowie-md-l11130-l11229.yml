  text: The White men advise changes in clothing, say wars can produce chiefs, and
    tell the people how to prepare beaver skin and tail for trade.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the first turtle version, young men returning from a war party meet a large
    snapping turtle going in the same direction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some young men stand or sit on the turtle; two others refuse and warn that
    the turtle is sacred and dangerous.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The turtle climbs a high hill and approaches a large lake while the riders
    ignore further warnings to get off.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near the lake the riders cannot dismount, their shots have no effect, and
    the turtle carries them into the lake where they disappear; the two walkers come
    home alone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the second turtle version, men returning from a war party see a shining
    large turtle with large claws on a high peak.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: All but one man eventually climb onto the turtle; the lake beyond the ridge
    is described as the turtle’s home, with web-footed birds flying around it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The riders in the second version find themselves glued to the turtle, weapons
    do not harm it, and the turtle carries them to the middle of the lake where they
    drown.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The single non-rider in the second version returns to the Crow lodges, reports
    what happened, and the camp mourns the dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people choose a chaste woman, make a lodge separated from the camp circle,
    spread ground-cedar over it, and announce to Thunder that she is given to him
    as wife in return for help killing the animal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thunder comes at night, visits the woman, and instructs through her that the
    chief and men should make seven sweatlodges, smoke to the cardinal directions,
    tie Tobacco in bunches, and camp by the lake with clans separated.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
