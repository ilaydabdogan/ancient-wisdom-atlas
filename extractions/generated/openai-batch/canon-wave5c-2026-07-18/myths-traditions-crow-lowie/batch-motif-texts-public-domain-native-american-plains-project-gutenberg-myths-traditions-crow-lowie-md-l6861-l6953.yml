canonical_text:
  quote: ''
  summary: In a Crow hero-tale passage, a friend repeatedly plants cooked buffalo
    portions for Camp-boy while others mock him. Camp-boy appears, scouts enemies,
    repeatedly strikes first coups, and leads a shrinking party farther from home.
    The party takes horses, enters a forest, finds a same-language settlement, narrowly
    avoids being killed, stays there, and Camp-boy marries the chief's daughter.
