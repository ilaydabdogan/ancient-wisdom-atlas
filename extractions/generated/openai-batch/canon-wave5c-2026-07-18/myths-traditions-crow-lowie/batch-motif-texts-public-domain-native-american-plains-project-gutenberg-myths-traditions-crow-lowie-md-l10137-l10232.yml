canonical_text:
  quote: ''
  summary: A young man loses all his property and his wife in a hoop game, goes upstream
    seeking power, and receives help from a white-headed eagle and associated birds.
    With a warm blue stone/hoop and instructions about wagers, he wins back what he
    lost from his rival, whose father is Morningstar. The birds later warn him in
    a vision to paint their picture on his shield for protection against an enemy
    raid. The shield protects him, but after the birds migrate Morningstar causes
    him to die.
  language: English
  quote_policy: summarized
