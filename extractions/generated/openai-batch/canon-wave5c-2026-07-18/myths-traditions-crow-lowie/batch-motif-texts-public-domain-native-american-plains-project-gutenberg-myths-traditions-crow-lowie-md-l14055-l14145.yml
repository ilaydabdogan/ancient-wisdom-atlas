    corn, food, and other presents, and are said not to be enemies thereafter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Nez Perce boy has both a Hidatsa adopter and a Nez Perce father, and he
    chooses to go with his Nez Perce father after asking the Hidatsa father what to
    do.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Hidatsa war party attacks a tipi near the Butte region, kills a woman, and
    takes a child and horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The captured child is given to a Hidatsa chief, raised there, and becomes
    a young man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Flathead father later learns that the Hidatsa have his son, travels with
