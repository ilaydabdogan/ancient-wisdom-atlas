  text: The Hidatsa chief says he brought the boy from far away, loves him, and gives
    the horses to the boy after refusing the father’s request.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man hears that his birth father brought horses and went away crying,
