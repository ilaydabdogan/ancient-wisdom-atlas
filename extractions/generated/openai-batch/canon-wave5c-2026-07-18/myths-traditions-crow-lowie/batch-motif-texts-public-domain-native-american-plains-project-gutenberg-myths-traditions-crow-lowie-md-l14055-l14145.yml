  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Flathead father gives horses to the chief’s daughter at her door in an
    attempt to recover his son, but the chief refuses to give the young man up.
  category: action
  evidence_refs:
  - ev:4
