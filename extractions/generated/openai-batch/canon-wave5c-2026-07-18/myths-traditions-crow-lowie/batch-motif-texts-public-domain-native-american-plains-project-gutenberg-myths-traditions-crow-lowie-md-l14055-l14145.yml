  quote: ''
  summary: The passage recounts reciprocal visits and exchanges between Nez Perce
    and Hidatsa that end enmity; a Hidatsa raid in which a Flathead child is captured,
    adopted, later sought by his birth father, and eventually returns to the Flathead
    and becomes a chief; and the beginning of a Crow-Sioux war-party episode in which
    Little-head and Bull-snake are surrounded near a Sioux camp.
  language: English
  quote_policy: summarized
