canonical_text:
  quote: ''
  summary: A young man is carried with closed eyes by successive groups of ducks across
    expanses of water and islands to a shore where children, their mother, dangerous
    door animals, and the Sun's household appear. He makes toys for the children,
    uses the father's looking-glass, and his damaged face becomes perfect. After instructions
    from the Sun, he returns by duck and then by eagle to a lake island. The eagle
    warns him of fog and a water animal; the young man uses four hot stones to kill
    the animal, identified as a long-otter, which thunder then removes. The eagle
    tells him saved young eagles will later take him home.
  language: English
  quote_policy: summarized
