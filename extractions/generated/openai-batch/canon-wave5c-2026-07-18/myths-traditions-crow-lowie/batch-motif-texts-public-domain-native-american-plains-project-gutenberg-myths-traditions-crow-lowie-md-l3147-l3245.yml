canonical_text:
  quote: ''
  summary: A boy kills a lightning-emitting horned alligator that ate stored food
    and burns it. His grandmother, fearing him and knowing he was sent to kill bad
    things, repeatedly warns him away from dangerous beings and powerful object owners.
    The boy goes to each place, often at noon while the being sleeps, kills or overcomes
    a bear, a man with fire-moccasins, and a man with a long knife, and then takes
    or tests a bucket belonging to an old woman by a creek.
  language: English
  quote_policy: summarized
