canonical_text:
  quote: "“Since then porcupines eat the bark of trees and not meat.”"
  summary: The passage contains two Old-Man-Coyote episodes. In the first, Old-Man-Coyote
    tries to gain a buffalo by giving Porcupine a blunt knife, but Porcupine succeeds,
    moves the meat to a tree limb over the river, and repeatedly outwits Old-Man-Coyote
    and his wolf family; the tale ends by explaining why porcupines eat tree bark
    rather than meat. In the second, Old-Man-Coyote and Jack-Rabbit make a storytelling-and-sleeping
    wager involving sexual violation; Jack-Rabbit induces Old-Man-Coyote to sleep
    and escapes.
  language: English, with one Latin phrase
  quote_policy: quoted
