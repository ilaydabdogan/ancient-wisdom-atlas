canonical_text:
  quote: ''
  summary: The passage contains connected episodes involving Old-Man-Coyote, Cl'rape'/Ci'rape',
    animal helpers and opponents, a cocoon that induces sleep, the healing and continuing
    ritual form of the sweatlodge, and a buffalo paunch containing ants that become
    men and procure buffalo. Old-Man-Coyote repeatedly tries to take the paunch, later
    exchanges medicines with Cl'rape', misuses the paunch, and the ants return to
    Cl'rape'.
  language: English
  quote_policy: summarized
