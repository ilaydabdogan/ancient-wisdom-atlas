canonical_text:
  quote: ''
  summary: A woman warned that her brother-in-law wants to kill and eat her leaves
    with her sister-in-law, makes a shelter in a snow-free hunting place, kills deer,
    feeds and rescues her weakened husband, and helps him recover and hunt elk. She
    is named Turtle-woman and described as skilled at everything.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A younger brother urges his elder brother to kill his wife so they can eat
    her; the husband refuses because she provides for them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sister-in-law warns the woman that the elder brother wants to eat her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman roasts a rabbit and feeds others but gives nothing to the one who
    wanted to eat her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman says she wishes to live and is going away to a high hill near the
    door direction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The woman and her sister-in-law reach a place with yellow grass, many deer,
    flint, a willow tree, and no snow; the woman makes a shelter from part of a tipi
    cover.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman uses her husband's flint to make a large fire, and she and her sister-in-law
    sleep there at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman positions her sister-in-law and herself near a creek bend, kills
    a deer after it slips, and drags it to their shelter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman butchers the deer, drinks some blood, makes her sister-in-law drink,
    and saves remaining blood in the manifold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The woman returns to the lodge, finds her husband alive with only a little
    fire, rebuilds the fire, and feeds him blood, pudding, and roasted meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The husband tells the woman to retrieve bows, arrows, powder, a knife, and
    a file from closed tents; she brings them out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The woman places her husband on a rawhide with comforters and drags him over
    the snow to the shelter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The woman is named Turtle-woman and is described as skilled at everything.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The next day the woman again kills a deer at the place where she had previously
    positioned her sister-in-law.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The husband says he will live; Turtle-woman says she would have brought the
    younger brother too if he had not wished to eat her, and says she killed him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The husband recovers, first walking slowly with a cane and then rising and
    stretching when Turtle-woman tells him to do so.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: When elk are present, Turtle-woman says she will make them slip on the ice;
    the husband shoots a fallen female elk and butchers it with a knife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The husband later goes hunting, brings game home, and makes saddles from crooked
    bones.
  category: action
  evidence_refs:
  - ev:6
