canonical_text:
  quote: ''
  summary: A crying baby is found and raised by buffalo bulls. The child receives
    strength, weapons, and powers from bear and eagle patrons, violates a warning
    by drinking the water of All-bones' wife, and thereby brings All-bones into conflict
    with his buffalo fathers. After the bulls are defeated, a sparrow reveals All-bones'
    vulnerable places, and the young man kills him with arrows. The young man heals
    his buffalo fathers in a sweatlodge and is then prepared by animal donors to return
    to his human people, marry, and have a future son whom the buffalo fathers intend
    to raise.
  language: English
  quote_policy: summarized
