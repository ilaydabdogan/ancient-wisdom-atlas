canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a weak boy and a mutilated, blinded
    woman are aided by deer, owl, and snake beings. The woman is healed with animal
    body parts; the boy is fed and strengthened with buffalo blood and food, receives
    marked arrows from a snake patron/father, marries the woman, prospers, returns
    home, and the markings of Crow arrows are explained. The passage then begins another
    tale, “The Spurned Lover,” in which the poor orphan Plenty-badger offers wild
    rhubarb to a wealthy young woman and is rejected and insulted.
  language: English
  quote_policy: summarized
