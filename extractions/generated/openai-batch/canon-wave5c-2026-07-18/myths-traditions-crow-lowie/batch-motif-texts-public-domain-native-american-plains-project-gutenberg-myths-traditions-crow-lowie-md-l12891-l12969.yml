canonical_text:
  quote: ''
  summary: A plain or ugly young man is wronged when his handsome comrade steals his
    wife. The young man asks Cunning-man how to retaliate. Cunning-man devises a carrot
    ruse that causes the handsome man to suspect and beat his own wife. Cunning-man
    treats the wounded woman, advises her to go to the ugly man, and arranges their
    elopement with help from the ugly man's brother. The couple travel away from camp,
    suffer from poor hunting and hunger in the mountains, and then encounter a dwarf
    hunter who provides deer meat and weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ugly or plain young man has a handsome comrade who first arranges his marriage
    to a pretty girl and then steals that wife from him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plain man asks Cunning-man for advice on how to get even by stealing the
    handsome man's wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cunning-man instructs the plain man to keep two carrots tied together, follow
    the handsome man's wife during a camp move, drop the carrots behind her, pick
    them up, turn aside, and eat them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The handsome man sees the plain man picking something up and concludes that
    his wife must have dropped it for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The handsome man reproaches his wife and strikes her on the head with a club,
    causing her to bleed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cunning-man is asked to doctor the wounded woman and makes a poultice from
    a round buffalo chip crushed fine and mixed with fat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cunning-man advises that the wounded woman be sent to the poor man and later
    tells her to go to him when it is dark.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Cunning-man tells the ugly man to saddle a horse and prepare ten days' rations
    for an elopement.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ugly man's brother urges the woman to elope and gives her powder, bullets,
    and a brown horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cunning-man stealthily brings the woman out of the tent to the ugly man, and
    the pair ride away together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The couple first stay close to camp, then move farther away for several days
    until they reach mountains.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man is a poor shot, uses up his ammunition, and kills only one deer and
    one rabbit before hunger becomes severe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The woman becomes lean, and the man lies down on a rock to die.
  category: sequence
  evidence_refs:
  - ev:6
