canonical_text:
  quote: ''
  summary: The passage is a comparative discussion of Crow folklore parallels with
    Omaha, Assiniboin, Dakota, Arapaho, Hidatsa, and other Plains traditions. It argues
    that many resemblances are best explained as contact or diffusion rather than
    inherited Siouan common property. It highlights especially strong Crow/Hidatsa-Arapaho
    connections, including shared trickster-cycle elements, Grandchild myth variants,
    Star-husband or Porcupine-pattern variants, celestial dialogue, and snake-adventure
    incidents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage identifies four Crow parallels to the Omaha trickster cycle:
    hoodwinked birds, Rabbit covering the trickster, the bungling host, and the false
    suitor.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage qualifies the Omaha-Crow parallels by saying the hoodwinked birds
    story is not in the atypical Crow form, the false suitor motif is practically
    identical with a Dakota version, the bungling host story belongs to a Fox-Kickapoo
    category, and the Rabbit episode is separated from the rolling-rock incident in
    some Crow-related tales.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says miscellaneous narratives show widespread shared themes but
    no direct connection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Crow and Assiniboin folklore show many resemblances, some
    close, but interprets them as due to contact, noting Assiniboin residence in the
    same Plains region and contact with Missouri Village tribes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says a rough comparison of trickster motifs gives at least a dozen
    Assiniboin-Crow coincidences, a number equaled by Arapaho and nearly equaled by
    Blackfoot.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that two popular Crow myths, Lodge-Boy and the Thunderbird,
    occur only fragmentarily in Assiniboin; that Assiniboin lacks a Star-Boy myth;
    and that Assiniboin celestial marriage and buffalo-wife stories fall into categories
    distinct or foreign to Crow versions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says features common to the Assiniboin, Crow, and Omaha collections
    are negligible and are readily explained by transmission from a common source.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage claims Crow traditions prove historically undocumented contact
    of the Crow or Hidatsa with the Arapaho, and says Arapaho share at least a dozen
    elements of the Crow trickster cycle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The passage identifies several restricted-distribution episodes shared in
    Crow-Arapaho comparison: marriage with Whirlwind woman, the trickster setting
    out on a war party with his mother-in-law, and Rabbit covering the trickster combined
    with the rolling-rock motif.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says the Grandchild myth is prominent in both Arapaho and Crow
    tradition and that the evidence from recorded variants is overwhelming.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage distinguishes Dakota, Assiniboin, and Blackfoot Star-husband stories
    from Crow, Hidatsa, Arikara, Arapaho, Gros Ventre, and Kiowa variants, which it
    says conform to the Porcupine pattern.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage says a celestial dialogue occurs in Arapaho and Gros Ventre versions
    and remains unrecorded among the Arikara; it also says snake-adventure incidents
    are closely paralleled across variants.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The table of Old-Woman’s-Grandchild elements lists items including Sun’s and
    Moon’s dialogue, Porcupine luring a girl, Frog jumping on Moon, digging and shooting
    taboos, a sinew rope, a stone dropped after climbers, adoption of a boy by an
    old woman, blackbirds killed, grandmother’s secret husband, Jug-tilter, calf foetus,
    rectum snakes, flat stones, storytelling, and destruction of all snakes but one.
  category: sequence
  evidence_refs:
  - ev:13
