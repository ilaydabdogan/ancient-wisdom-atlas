canonical_text:
  quote: ''
  summary: A young man disobeys a warning about ravens and learns from a raven that
    his parents are not his real parents and that he is a person of the earth. After
    he sees his foster mother transform into an owl, his foster parents decide to
    send him home and equip him with raven feathers and instructions. He travels through
    a sequence of old women who receive buffalo meat and give him stones, softened
    wood, advice, and warnings about young women at a tipi. At the final tipi he is
    drawn back by the young women, refuses their food, and throws it to dogs described
    as a tiger and a bear.
  language: English
  quote_policy: summarized
