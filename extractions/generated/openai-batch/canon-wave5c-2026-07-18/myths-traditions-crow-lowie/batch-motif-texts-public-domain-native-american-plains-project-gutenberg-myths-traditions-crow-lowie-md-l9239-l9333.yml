canonical_text:
  quote: ''
  summary: 'The passage first concludes an account in which One-eye, feared for taking
    women from their husbands, loses an ill-treated wife to Bear-comes-fromafar; a
    horse expedition follows, and the narrator states that this explains how the Crow
    got many horses and how the sweatlodge originated. The passage then begins the
    Raven-face account: Raven-face’s younger brother Arrow-head/Arrow-point is warned
    about and then killed by Birik-o''oce men. Raven-face confronts them, is wounded,
    and later undertakes a winter vision quest. In a storm he shelters in a bear cave
    with cubs; the bear pair does not harm him. In the morning the bears make ritual
    motions, the male bear sings, raises him, shows him the whole world, and tells
    him he need not fear death while he has teeth.'
  language: English
  quote_policy: summarized
