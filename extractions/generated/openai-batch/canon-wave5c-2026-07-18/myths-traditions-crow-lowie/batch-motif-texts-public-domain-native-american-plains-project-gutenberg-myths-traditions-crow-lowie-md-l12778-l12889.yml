  quote: ''
  summary: The passage contains a tale of four young men who try different devotional
    or ritual practices to learn who will become the greatest chief and live longest;
    a tale called “The Skeptical Husband,” in which Acdu'cite ignores warnings, his
    wife encounters bears and later Sioux raiders, escapes with her boy, and eventually
    leaves him; and the opening of a note on Cunning-Man, described as wise and able
    to know character and the future.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Four young male friends who had not yet joined a war party assign different
    practices: fasting, mourning, and torture; prayer to the Sun; tending and praying
    to the sweatlodge; and giving presents and food to a''sa''ke.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The four practices are followed by different life outcomes: early fame and
    death for two, chieftainship and proper-age death for the sweatlodge-owner, and
    old age, great chieftainship, and strong power for the fourth.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Acdu'cite camps on a mountain side away from a moving big camp and repeatedly
    goes hunting while his wife remains near the tipi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: While picking berries, the wife encounters bears; two bears chase her to the
    tipi and wait outside until her husband returns and kills them, and a later bear
    is killed after she reports seeing it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crow hunters advise the wife to move back to camp and warn that something
    will be wrong if she does not, but her husband does not believe the warning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sioux steal the household's horses, surround the tipi, and one Sioux reaches
    under the tipi cover and touches the wife's leg while the husband dismisses her
    alarm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wife hides under a pile of meat, retrieves her boy, and escapes through
    thick brush; the boy cries but is quieted, and the Sioux hear him after the pair
    are already away in the bushes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After waking, Acdu'cite makes medicine, arms himself, fights the Sioux, takes
    horses, strikes coups, wounds or kills enemies, and brings Crow men from the main
    camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Crow later find the wife, build a fire, cook food for her after three
