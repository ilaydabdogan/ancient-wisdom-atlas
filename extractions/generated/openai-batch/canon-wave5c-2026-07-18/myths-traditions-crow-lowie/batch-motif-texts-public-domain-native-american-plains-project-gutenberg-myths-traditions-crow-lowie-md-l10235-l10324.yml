canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which birds search for their child,
    a thunderbird breaks a scaffold and reveals a plume connected with the child''s
    death, Morningstar warns his child against clouds, and the child is later struck
    by thunderbird. It then gives the tale of the Eagle-catcher: a young man catches
    many eagles, stays behind, is sealed in his pit by a rock, is rescued and restored
    by a small boy with water and pemmican, is sent to kill an elk, receives help
    from moles through an underground tunnel, and receives medicine and skills before
    returning to the Hidatsa.'
  language: English
  quote_policy: summarized
