canonical_text:
  quote: ''
  summary: Two boys retaliate against a man who had harmed them, then repeatedly visit
    dangerous places despite parental warnings. They neutralize a killing tree and
    a closing coulee, receive a cutting tail from a beaver, and are swallowed by a
    dangerous buffalo whose organs they cut before escaping. A storm destroys one
    brother, leaving only a blood clot that later becomes a boy again when an old
    woman boils it. The brothers resume hunting and killing bad beings. Later the
    stars plan to eat them, and Long-arm takes Spring-boy through the smoke hole,
    leaving the other brother to search and mourn.
  language: English
  quote_policy: summarized
