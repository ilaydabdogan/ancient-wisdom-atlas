canonical_text:
  quote: ''
  summary: The passage begins with the end of a preceding account involving vision-like
    dress, whistles, and a girl who becomes a medicine woman. It then tells of Hii'ara'wic,
    who is humiliated by a young woman at a spring and sets out seeking medicine.
    A stag, a white-tailed deer, and a bull antelope each direct him onward until
    he reaches a bull elk. The elk becomes an elk-clad young man, uses a flute to
    summon female animals, identifies the desired girl with a white mountain-sheep,
    makes medicine, and instructs the man to gain strength and strike coups before
    approaching her. After fulfilling these instructions, Hii'ara'wic uses incense
    and the flute in a tipi; women come, the young woman enters through the smoke
    hole, and the two men possess and eject her. Her kin then give property to Hii'ara'wic;
    he marries her, and their son later becomes a chief.
  language: English
  quote_policy: summarized
