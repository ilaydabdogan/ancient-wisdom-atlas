- id: ev:7
  type: summary
  locator: lines 2806-2815
  quote_or_summary: The mother digs up a large wild turnip, makes a hole, and shows
    the boy many gamblers below. She identifies the place as where she came from and
    tells the boy to ask Sun for buffalo sinews.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
