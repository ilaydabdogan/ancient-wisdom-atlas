- id: ev:8
  type: summary
  locator: lines 2816-2826
  quote_or_summary: Sun brings buffalo sinews. The woman gives them to a spider, which
    makes a rope. Mother and son enlarge the sky-hole, tie the rope to a digging-stick,
    and climb down, but the rope ends at the treetops because some leg sinews were
    forgotten.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:9
  type: summary
  locator: lines 2827-2833
  quote_or_summary: Sun discovers the woman hanging from the hole, reshapes a stone,
    tells it to hit the woman and not the boy, and throws it down. The woman is killed;
    the boy remains by her corpse and sleeps there nightly.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:10
  type: summary
  locator: lines 2833-end of supplied passage
  quote_or_summary: An old woman nearby finds garden damage, tests the unseen child
    with a shinny stick and bow and arrows, catches the boy when he chooses the bow
    and arrows, feeds him, and later places a bowl of cooked corn behind a curtain
    that is found empty.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
