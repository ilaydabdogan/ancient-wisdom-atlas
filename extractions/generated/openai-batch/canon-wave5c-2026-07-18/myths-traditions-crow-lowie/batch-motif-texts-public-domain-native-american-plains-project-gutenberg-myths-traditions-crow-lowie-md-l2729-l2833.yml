canonical_text:
  quote: ''
  summary: 'In a Crow hero tale, Sun and Moon choose different brides: Sun takes a
    Hidatsa girl after she climbs after a porcupine toward the sky, while Moon is
    associated with a frog woman. The Hidatsa woman bears Sun’s son. Sun forbids the
    boy to shoot a meadowlark and forbids his wife to dig wild turnips. Both prohibitions
    are broken, leading the mother and son to discover a hole looking down to her
    earthly home. With a spider-made sinew rope they try to descend, but the rope
    is too short; Sun throws a stone that kills the woman, while the boy survives.
    An old woman later catches and feeds the boy after testing whether the hidden
    child is male or female.'
  language: English
  quote_policy: summarized
