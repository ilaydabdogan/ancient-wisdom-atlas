candidate_motifs:
- id: motif:1
  label: climb from earth toward the sky leading to capture by a celestial being
  taxonomy_refs:
  - ascent
  basis: The youngest Hidatsa sister climbs after a porcupine until she nears Sun,
    who reaches down and takes her.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not state that the tree is a formal cosmic axis; only
    the upward climb and arrival near Sun are explicit.
- id: motif:2
  label: celestial bride-taking or abduction
  taxonomy_refs:
  - stolen_beloved
  basis: Sun takes the Hidatsa girl from near the sky after she climbs from earth;
    she later wants to return to her place of origin.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: The passage presents planned marriage and taking, but does not use explicit
    abduction terminology.
- id: motif:3
  label: human and animal brides compared by an eating test
  taxonomy_refs: []
  basis: The Hidatsa woman and Frog are tested by eating boiled buffalo guts; Frog
    attempts to imitate eating by gnawing bark and is judged a poor eater.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family directly matches this episode.
- id: motif:4
  label: child of a celestial father and earthly mother
  taxonomy_refs:
  - divine_parent_child
  basis: The Hidatsa woman bears a boy whose father is Sun.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not yet describe the boy’s later heroic career beyond
    this line range.
- id: motif:5
  label: broken prohibitions reveal origin or condition
  taxonomy_refs:
  - forbidden_knowledge
  basis: Sun forbids shooting a meadowlark and digging wild turnips. The boy shoots
    the bird and is called a slave; the mother digs a turnip and opens a view to her
    former home below.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The link between prohibition and knowledge is inferential, though the
    forbidden acts directly precede revelations.
- id: motif:6
  label: return from the sky by rope
  taxonomy_refs:
  - return
  basis: The mother plans to go home to the camp below and descends with her son by
    a rope made from sinews.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The return attempt fails within this passage.
- id: motif:7
  label: insect or spider helper makes a rescue rope
  taxonomy_refs: []
  basis: The woman gives sinews to a spider, and the spider makes the rope used for
    descent.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly matches the spider helper.
- id: motif:8
  label: mother killed during escape while child survives
  taxonomy_refs: []
  basis: Sun throws a stone that kills the hanging woman but is directed not to hit
    the boy; the boy remains alive by the corpse.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The broader narrative implications of the mother’s death continue beyond
    the passage.
- id: motif:9
  label: hidden child identified by choice of gendered objects
  taxonomy_refs: []
  basis: The old woman sets out a shinny stick and a bow and arrow to determine whether
    the unseen child is a girl or a boy; the boy chooses the bow and arrows.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: Object-gender association is stated only through the old woman’s test.
comparison_claims:
- id: claim:1
  claim: The editorial note treats this narrative as part of a set of Crow versions,
    naming three informants and stating that each variant contains elements lacking
    in the others.
  claim_level: same_motif
  target: Crow variants from Plenty-hawk, Scratches-face, and Grandmother’s-knife
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not summarize the other variants, so the precise shared
    and divergent motifs cannot be extracted here.
- id: claim:2
  claim: The editorial note states that an unpublished Hidatsa version recorded by
    the writer shows direct historical connection with the Crow myth.
  claim_level: historical_contact
  target: unpublished Hidatsa version recorded by Lowie
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The Hidatsa version is not quoted or described in this passage; the
    claim rests only on the note’s assertion.
