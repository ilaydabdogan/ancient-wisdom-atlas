- id: obs:1
  text: A group of boys rides against an enemy war party, frightens them, takes their
    horses, later recovers saddles, guns, and knives, and returns these goods to their
    shelter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oldest boy, identified as war captain, makes medicine and directs war
    parties that bring back more horses; the group gains enough horses for everyone
    and increases in shelters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a long period, the group has about thirty tipis and some children nearly
    grown; while seeking Crow people, they move near a Crow camp at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The oldest child's black-painted lodge stands in the middle of the camp circle;
    when Crow visitors ask who is inside, the occupants identify themselves as the
    lost children and say none of them has died.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Parents come after learning the children's identity, the groups camp together
    as a separate camp from the main body, and the leader of the children's camp takes
    charge of the whole band.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old woman digging roots has her dog with her; a wolf approaches, and the
    dog and wolf exchange spoken insults about food, beatings, hunger, freedom, and
    dependence on human owners.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old woman leans on her digging-stick and listens to the dog and wolf;
    at the end the wolf goes howling toward white clay, while the dog follows the
    old woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man hunting buffalo addresses his penis after seeing buffalo; it answers
    and then keeps repeating that it sees the buffalo despite his attempts to stop
    it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaking organ says it will not stop unless the man's wife's mother presses
