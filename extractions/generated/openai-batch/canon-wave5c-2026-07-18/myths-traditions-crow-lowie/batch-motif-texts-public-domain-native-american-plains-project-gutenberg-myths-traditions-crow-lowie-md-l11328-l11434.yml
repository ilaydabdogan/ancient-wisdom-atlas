canonical_text:
  quote: ''
  summary: The passage concludes a tale in which lost children raid enemies, acquire
    horses and goods, grow into a separate camp, and reunite with Crow relatives.
    It then gives a tale of a dog and a wolf exchanging insults about domestic dependence
    and wild freedom while an old woman listens. A final obscene tale describes a
    hunter whose penis begins speaking after he addresses it about buffalo and is
    cured only when his mother-in-law sings and presses it; a note states that similar
    incidents occur in other Plains traditions.
  language: English
  quote_policy: summarized
