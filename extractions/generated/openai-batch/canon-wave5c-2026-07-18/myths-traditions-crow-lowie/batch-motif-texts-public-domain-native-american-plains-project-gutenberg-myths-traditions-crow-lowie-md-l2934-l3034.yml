canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a boy uses stories to
    put snakes to sleep, kills most of them, later suffers a returning snake''s attack,
    and with rain, wind, and Sun''s heat forces it out and changes its face; the tale
    explains why snakes bite only sometimes and says the boy became Morningstar. It
    then begins another tale: a woman climbs an ash tree while following a porcupine,
    reaches a sky land, marries a young man there, bears a rapidly growing boy, and
    the boy violates a warning by shooting a meadowlark that says he belongs elsewhere.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy meets two snakes on a path and is directed to a big white tipi where
    many snakes have their heads on sticks arranged in a circle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy sits on a flat stone; when one snake tries to enter his anus, it strikes
    the stone instead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The snakes ask the boy to tell stories learned from his grandmother, and his
    descriptions of sleepy situations cause the snakes to fall asleep in groups until
    all are asleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the snakes are asleep, the boy cuts off the heads of all but one; the
    escaping snake warns against sleeping in the daytime.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Later the boy sleeps on a high hill after setting four arrows around him to
    watch; the returning snake approaches, the arrows strike him, and the boy wakes
    only as the snake crawls into him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy's body is reduced until only his skull remains; he causes rain and
    wind, and then prays to Sun so that the water in a hole becomes hot enough to
    trouble the snake.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy seizes the snake, grinds off its face below the eyes, releases it
    after it promises to be good, and the snake then says it will bite only once in
    a while.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that the boy became Morningstar and appears in winter mornings,
    not in summertime.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman sitting under a tall ash tree sees a porcupine above, climbs after
    it, and continues climbing until she reaches the sky.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: On the other side of the sky, the woman finds land like earth, good water,
    a big tipi, and a young man who says he sent for her and wants to marry her.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The woman stays in the sky, becomes pregnant, and has a boy who grows larger
    every morning.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The sky father gives the boy a bow and arrows, warns him not to shoot meadowlarks
    because they speak his language, and also tells the woman not to move buffalo
    chips.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: A meadowlark injures the boy's eyes with its wings; the boy shoots it, and
    the bird tells him that he does not belong there and should go where he belongs.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The next morning the household hunts buffalo, and the passage breaks off during
    the woman's preparation of a buffalo hide with water.
  category: sequence
  evidence_refs:
  - ev:12
