canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which a young man directs the camp to kill
    sent creatures and Old-Man-Coyote, after which the Sun releases game animals back
    to earth. It then begins ''Yellow-Dog and the Morningstar'': the Big Dogs take
    dried meat; Yellow-Dog forces himself on a former sweetheart who is married to
    Morningstar; Morningstar removes game animals, causing snow and famine; the woman
    later feeds weakened Yellow-Dog with corn balls and rose berries; a boy''s turtle-shell
    medicine contains fat that is brought to Yellow-Dog.'
  language: English
  quote_policy: summarized
