canonical_text:
  quote: ''
  summary: The passage describes Curtain-boy repeatedly calling Spring-boy from a
    spring so the two brothers can play, eat cooked meat, and gamble with bows and
    arrows. Curtain-boy tells his father that Spring-boy is his brother, that their
    mother was killed by a woman, and that one child was thrown into the spring while
    the other was put behind a curtain. With rawhide protection and the father's help,
    Curtain-boy captures Spring-boy; the father throws food into the spring as water
    and fog emerge, and Spring-boy's sharp teeth are filed off. Later the boys ask
    about their mother's burial place, report killing a buffalo, and the father begins
    warning them about a dangerous old woman with a jug.
  language: English
  quote_policy: summarized
