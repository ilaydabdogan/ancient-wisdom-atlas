canonical_text:
  quote: ''
  summary: Long-arm takes Spring-boy away. Curtain-boy discovers an arrow-feather
    clue, ascends through the smoke hole by shooting arrows, reaches the sky, and
    is adopted by an old woman later identified as the Moon. On the way to a feast
    where Spring-boy is to be eaten, Curtain-boy kills two dangerous sky beings and
    takes their fire-moccasins and cutting knife. At the feast he dismembers Long-arm,
    rescues Spring-boy, gives an arm to the Moon to place in the sky as Hand Star,
    and returns to earth with his brother. The boys later hunt for their parents;
    an arrow-body episode leads to Old-Woman’s-Grandchild making Curtain-boy his comrade.
    Curtain-boy and Old-Woman’s-Grandchild encounter buffalo butchers and then enter
    the snakes’ tent, where stories make the snakes sleep and Old-Woman’s-Grandchild
    cuts off their heads except for one that wakes.
  language: English
  quote_policy: summarized
