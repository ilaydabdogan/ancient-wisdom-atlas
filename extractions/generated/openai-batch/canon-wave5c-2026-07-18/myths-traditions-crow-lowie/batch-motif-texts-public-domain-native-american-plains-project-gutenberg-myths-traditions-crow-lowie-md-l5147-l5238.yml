canonical_text:
  quote: ''
  summary: A young woman who is married to the Sun secretly takes a human young man
    as lover or husband. The Sun becomes angry, removes game animals, and threatens
    starvation for the people. After failed hunts and migration, the poor young man
    performs a rite involving fat, fire, four throws, seven buffalo chips, and a sexually
    inexperienced messenger; seven buffalo are found the next morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl had married the Sun before the day she was kissed by the boy, and
    the Sun later saw his wife asleep with someone else and left angry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy secretly entered the girl's lodge and slept with her; she later revealed
    that she had been married to the Sun for three winters and three summers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl warned the young man that the Sun wanted to do something to both
    of them; the young man replied that he was greater than the Sun, and she warned
    him not to say that.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sun confronted his wife, said he would give trouble to the Crow Indians,
    and took away the grouse, deer, and other game.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young men found no game, the people ate their dogs, and the camp moved
    away while the young woman and young man knew the cause but did not tell the others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young woman rode back looking for the young man, met the Sun, heard that
    the one she loved was asleep and that the Sun would make his people starve except
    perhaps one or two, then found and awakened the young man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a council, a cunning man said that either the Sun, Morningstar, or Old-Man-Coyote
    had caused the trouble and identified the woman and young man as the cause of
    the community's trouble.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people moved toward the mountains; the young man was left behind, used
    a stick as a cane, met a crying old dog, passed through a heavy snowstorm, and
    reached the campsite where his wife gave him a corn ball.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The young man asked the crier for fat; a child had kept guts containing fat,
    which was brought to the young man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young man ordered firewood piled and burned, divided the fat into four
    balls, threw the balls onto the fire while young men shouted, and the fire rose
    higher each time until the fourth rise went into the heavens.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man told women to dig up seven buffalo chips, made seven buffalo
    tracks in a tipi, and had a young man who had not known a woman place the chips
    near the first hill; before sunrise the boy saw seven buffalo there.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A source note states that the narrator said the people in the story were Hidatsa.
  category: other
  evidence_refs:
  - ev:10
