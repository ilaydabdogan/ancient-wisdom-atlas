canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which Old-Man-Coyote enters a Crow
    camp in elaborate dress, is exposed when his mount and finery revert to other
    forms, and the Crow thereafter adopt the style of dress he displayed. It then
    gives the tale of Old-Man-Coyote and a ghost woman: he marries her, suffers her
    repeated night travels with a moving lodge, runs away, is hidden by medicine mice
    through transformation into a mouse, and is released when an old mouse persuades
    the ghost woman to abandon the search and divorce him.'
  language: English
  quote_policy: summarized
