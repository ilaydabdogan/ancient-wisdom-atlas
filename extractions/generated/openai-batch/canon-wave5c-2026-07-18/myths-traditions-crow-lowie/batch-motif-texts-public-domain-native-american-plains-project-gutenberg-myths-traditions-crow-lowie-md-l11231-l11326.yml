canonical_text:
  quote: ''
  summary: A woman relays Thunder’s directions for the clans to drain a lake. After
    the ditches are opened, Thunder shoots into the lake through the night; by dawn
    it is dry, exposing water-coyote, beaver-demon, other water beings, striped tipis,
    and the bones of missing Indians. Young men kill the living beings, and a shaman
    kills the turtle associated with the captures. In “The Deserted Children,” children
    playing away from camp are left behind when the camp flees an approaching enemy.
    They gather useful materials, move to the mountains, build shelters, and four
    older boys fast and report dreams or patron powers. A dwarf-adopted boy hunts
    game with two flint-headed arrows, while a hawk-adopted boy has fighting medicine.
    The children survive by hunting, build shelters, kill two Piegan buffalo butchers,
    acquire horses, mature, marry, have children, move to a river, and begin a war-party
    episode before the passage breaks off.
  language: English
  quote_policy: summarized
