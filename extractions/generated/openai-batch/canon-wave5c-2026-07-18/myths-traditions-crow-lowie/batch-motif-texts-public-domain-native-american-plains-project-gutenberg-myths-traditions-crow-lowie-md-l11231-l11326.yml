candidate_motifs:
- id: motif:1
  label: Supernatural Thunder helps humans drain a hostile lake
  taxonomy_refs: []
  basis: Thunder’s instructions are relayed by the woman, the people drain the lake,
    and Thunder shoots into it until the water is gone.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives the action but does not explicitly state a broader cosmological
    or moral interpretation.
- id: motif:2
  label: Water beings exposed and killed after removal of water
  taxonomy_refs: []
  basis: Water-coyote, beaver-demon, other water beings, and the turtle are found
    without water in the dry lake and are killed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy motif family directly matches this literal pattern.
- id: motif:3
  label: Abandoned children survive after the camp departs
  taxonomy_refs:
  - departure
  basis: Children are left behind when the camp flees, then gather materials and establish
    life away from the original camp.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The departure is involuntary; the passage’s source note says this version
    differs from many related variants.
- id: motif:4
  label: Fasting youths receive dream powers or patron aid
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Four older boys fast for four days and report dreams or encounters that give
    leadership, doctoring, hunting, and fighting powers.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The text reports the dreams and powers but does not provide a formal ritual
    explanation beyond fasting.
- id: motif:5
  label: Supernatural patron grants hunting and battle efficacy
  taxonomy_refs:
  - initiation
  basis: A dwarf teaches one boy to shoot game and gives strength against enemies;
    a hawk gives another medicine power to fight and not be shot.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: Only the dwarf and hawk patrons are stated; other boys’ powers are described
    as dreams rather than direct patron encounters.
- id: motif:6
  label: Child survivor group forms a new community
  taxonomy_refs: []
  basis: The deserted children hunt, build shelters, obtain horses, grow up, marry,
    have children, and move to a river.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage breaks off before the later plot is complete, so the final
    function of the new community is uncertain.
- id: motif:7
  label: Young warriors prove themselves through enemy killing and coup actions
  taxonomy_refs:
  - initiation
  basis: The boys kill two Piegan buffalo butchers; the hawk-adopted boy strikes coups,
    scalps the enemies, and disposes of their bodies.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The text does not explicitly label this as initiation, though it follows
    the fasting and medicine-power episode.
comparison_claims:
- id: claim:1
  claim: The source note identifies “The Deserted Children” as a version of a familiar
    Plains Indian theme.
  claim_level: same_motif
  target: familiar Plains Indian deserted-children theme
  evidence_refs:
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: The note also says this particular version has no close parallel and
    calls it conspicuous for pointlessness; no external variant text is included in
    the provided passage.
- id: claim:2
  claim: The source note says Assiniboin and Blackfoot variants are clearly related
    to the abandoned-children theme represented here.
  claim_level: same_motif
  target: Assiniboin and Blackfoot variants of the deserted-children story
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The relationship is reported by the source note only; the provided
    passage does not include the Assiniboin or Blackfoot narratives for direct comparison.
- id: claim:3
  claim: The source note contrasts this version with many related stories in which
    abandonment is caused by a wicked chief and unnatural parents and ends with poetic
    justice.
  claim_level: same_motif
