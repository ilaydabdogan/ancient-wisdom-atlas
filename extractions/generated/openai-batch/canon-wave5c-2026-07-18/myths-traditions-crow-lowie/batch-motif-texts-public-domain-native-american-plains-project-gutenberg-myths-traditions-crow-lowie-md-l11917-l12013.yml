canonical_text:
  quote: ''
  summary: 'The passage first concludes a fragment in which survivors of a snow-covered
    camp return in spring, find many dead relatives and damaged tents, and leave because
    of the odor. It then begins the tale titled “The Faithful Mistress”: a Hidatsa
    war party leaves a wounded man near the Yellowstone region with provisions; his
    younger brother remains with him; the wounded man’s mistress secretly prepares
    supplies, receives a detailed ground-drawn route from an honest man, and begins
    the journey by following rivers and landmarks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After snow had gone from snow-covered tents, an unnamed woman made a small
    elk-hide tent and proposed looking for the camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The survivors said the people were surely all destroyed and that they alone
    were living.
  category: speech
  evidence_refs:
