- id: obs:3
  text: People cried because many close relatives had perished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group found horses belonging to dead people and saw smaller tents lying
    down and larger tents sagging or fallen.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The group did not take back the dead because the odor was very bad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A party of young Hidatsa men traveled upstream in fall, killed enemies, and
    one young man named On-top-of-the-bull had his shinbone broken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because winter was too long, the war party decided to leave the wounded man
    behind, placing him in a hide hut with water, firewood, a hooked limb for pulling
    firewood, bullets, and powder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The wounded man’s boy brother was told to go home, but he returned crying
    and chose to stay with his brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Hidatsa chief’s younger wife was the wounded man’s mistress; after hearing
    what had happened, she secretly made moccasins and prepared cached food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: An honest man from the war party told the mistress how to reach the wounded
