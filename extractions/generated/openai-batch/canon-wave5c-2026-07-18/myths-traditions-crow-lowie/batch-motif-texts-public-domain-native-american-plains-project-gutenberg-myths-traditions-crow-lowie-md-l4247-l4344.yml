canonical_text:
  quote: ''
  summary: Spring-boy tricks snakes into sleep with stories and beheads them, but
    one escaped snake later enters his body. Spring-boy uses rain, wind, water, and
    heat to catch it, grinds its face, and is later given stones in his head by Curtain-boy,
    becoming Rattling-head. The two boys are said to have killed many dangerous beings.
    Long-arm then takes Curtain-boy into the sky; Spring-boy seeks help from Old-Man-Coyote
    and birds, sees a hole in the sky, ascends by four colored arrows, transforms
    himself into a poor boy, and is fed by an old woman in a camp near a river.
  language: English
  quote_policy: summarized
