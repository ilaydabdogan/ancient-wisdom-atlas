canonical_text:
  quote: ''
  summary: 'The passage contains connected Crow tale material about Cunning-man and
    war-party episodes: a returning young warrior recounts mountain warfare and redistributes
    horses and war objects; friendship is restored and his son later receives dwarf
    medicine. A second episode has Cunning-man assigning two quasi elder brothers
    to protect his son on the warpath, one of whom dies as a decoy during an ambush
    while the son returns. A third episode has Cunning-man using storytelling as a
    stratagem to kill an enemy on a river bank. A fourth fragment identifies Cunning-man
    as the model war captain and begins an episode of two enemy scouts caught by rain
    on a peak.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating, Cunning-man asks the young man where he has been, and the young
    man reports being in the mountains, killing four enemies, going on a war party,
    and bringing horses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man gives Cunning-man a captured gun, a war-bonnet he made, and
    horses for Cunning-man and Cunning-man's wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man gives horses to his comrade, his brother, and his wife's relatives,
    although the comrade initially refuses a larger offer because the two men had
    exchanged wives and he had thought the pair dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man invites Cunning-man to smoke and eat, tells him that his wife
    struck coups after him and that he took guns, and says he wants to be a chief
    someday.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The two comrades remain friends and go on war parties together; the young
    man later becomes the biggest chief in camp and leader during camp movement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chief paints his tipi with the picture of a man and keeps scalps at the
    ends of its poles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the chief's son becomes a young man, his father gives him medicine identified
    as the dwarf, and the youth goes on war parties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Cunning-man tells his own boy that he will find him a protector for the warpath,
    summons a foolish-acting young man with a coupstick, and calls him the boy's quasi
    elder brother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The foolish-acting young man stumbles through Cunning-man's tipi and spills
    water from a bucket, prompting Cunning-man's wife to object to his choice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Cunning-man also summons a young man with many arrows and wants him to accompany
    his boy as another brother-like protector.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Cunning-man predicts that the enemy will surprise the party at noon, that
    the coupstick man will not run, and that this will allow the boy to return.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: During the ambush, the spear-holder remains at the fire, the enemy gathers
    toward him and kills him, while others flee toward the woods; Cunning-man's boy
    and the arrow-man later return with meat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: On a river bank, Cunning-man sees an enemy preparing to shoot him, tells a
    story to his wife while holding an arrow as if illustrating it, then suddenly
    shoots the enemy through the eye.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage calls Cunning-man the great storyteller of his time and says he
    was the only war captain the people had, with everything modeled on him.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:15
  text: Two fighting tribes, Carrot-eaters and Water-scrapers, each send a scout up
    the same peak; a cloud brings heavy rain, and each scout runs to a separate rock-shelter
    until nightfall.
  category: sequence
  evidence_refs:
  - ev:6
