canonical_text:
  quote: ''
  summary: A boy repeatedly goes to places his grandmother or an old woman forbids.
    He kills a dangerous beaver and obtains its tail as a knife, takes a stone kettle
    from another old woman, and then visits a white tent inhabited by snakes. He blocks
    the snakes’ attempt to enter his body, burns food connected with them, tricks
    them into sleeping, and cuts off their necks except for one snake. The surviving
    snake later enters his body while he sleeps, leaving his body in pieces and his
    skull occupied by the snake. The boy’s father sends Thunder; rainwater and the
    sun’s heat force the snake to emerge from the skull, and the boy rises, punishes
    the snake, and releases it. The snake says it will bite occasionally, explaining
    why snakes sometimes bite. The passage ends with the boy meeting two men butchering
    buffalo, one of whom offers him a buffalo fetus and chases him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman warns the boy not to go to a creek with dangerous beavers; he
    goes there, kills a sleeping beaver, cuts off its tail, and brings the tail-knife
    back to her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman warns the boy not to go to another creek; he takes a stone kettle
    from a sleeping old woman, refuses to put it down, and the kettle burns its owner
    when she flies to it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy brings the stone kettle home after catching birds and other animals
    with it; the old woman is afraid and tells him to hang it up, so he ties it to
    a tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandmother is afraid of the boy and cannot find anything to kill him;
    she tells him of a white tent on a ridge and asks him not to go there.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy goes to the white tent with the beaver-tail knife and a flat stone;
    the snakes tell him to sit in the rear, and snakes trying to enter his body from
    underground strike the stone and retreat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The snakes cook a stomach part into which they have put their teeth; the boy
    cooks it until it burns, and the snakes suffer pain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy has the snakes lie in a circle around the fire with their necks on
    a stick while he tells a story; when they stop answering, he cuts off their necks,
    but one escapes underground and warns him not to sleep in the daytime.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After setting his arrows around him as watchers, the boy sleeps; the surviving
    snake enters his body, and he breaks himself at the waist and neck, leaving his
    body in three parts while the snake remains in his skull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy’s father sees his son’s bones and sends Thunder; Thunder reports the
    snake in the skull, shoots near the skull, rolls it to a washout, and makes rain
    fill it, while the sun heats the water until it boils.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the snake protrudes from the skull, the boy seizes it, rises to his feet,
    says it has given him a long headache, files its face against a stone, and releases
    it after it promises not to do anything more.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After being released, the snake says it will bite once in a while; the passage
    explicitly states this is why snakes bite occasionally.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The returned boy meets two men butchering buffalo; they discuss his grandmother,
    one gives him meat, and later one offers him the buffalo fetus, causing the boy
    to run while the man chases him.
  category: sequence
  evidence_refs:
  - ev:8
