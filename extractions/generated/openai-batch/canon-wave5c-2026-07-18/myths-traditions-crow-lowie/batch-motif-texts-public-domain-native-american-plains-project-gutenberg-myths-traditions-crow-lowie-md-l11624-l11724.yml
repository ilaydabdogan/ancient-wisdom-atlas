candidate_motifs:
- id: motif:1
  label: Return of a presumed-lost son with rejoicing
  taxonomy_refs:
  - return
  basis: Black-elk is thought possibly eaten by wolves but returns to his parents,
    is embraced, fed, and celebrated with a rejoicing song.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The excerpt begins after earlier events, so the full cause of Black-elk's
    absence is outside this passage.
- id: motif:2
  label: Public distribution of valued items after an ordeal
  taxonomy_refs:
  - sacred_exchange
  basis: Black-elk distributes feathers to the gathered camp, and the people later
    bring corn and corn balls; Has-medicine-thunder also receives horses and property
    before undertaking his promised task.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: low
  cautions: The passage shows exchange of feathers, food, horses, and property, but
    it does not fully explain the ritual or sacred status of the exchanged items.
- id: motif:3
  label: Extraordinary travel by plant material and closed eyes
  taxonomy_refs: []
  basis: Black-elk lays out ground-cedar, steps on it, closes his eyes, and arrives
    with his brother at another place after a short interval.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The mechanism is not explained in the excerpt, and no explicit taxonomy
    family is supplied for this travel pattern.
- id: motif:4
  label: Disappearance of a warned-against war party
  taxonomy_refs: []
  basis: Black-elk warns against going with the six men; later White-mountains gathers
    young men for a war party and they are never seen again.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage reports blame and sequence but does not explicitly state a
    supernatural cause for the disappearance.
- id: motif:5
  label: Unseen taking of a swimmer by river power
  taxonomy_refs: []
  basis: The young man repeatedly says he is being taken away while in the Yellowstone
    and then disappears under the water despite rescue attempts.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The taker is unnamed in this passage; the account gives the victim's words
    and disappearance but not an identified being.
- id: motif:6
  label: Shaman announces retrieval of a drowned person
  taxonomy_refs: []
  basis: Has-medicine-thunder says he will bring the drowned young man back, receives
    property from the relatives, and is taken to the disappearance place with guides.
  evidence_refs:
  - ev:8
