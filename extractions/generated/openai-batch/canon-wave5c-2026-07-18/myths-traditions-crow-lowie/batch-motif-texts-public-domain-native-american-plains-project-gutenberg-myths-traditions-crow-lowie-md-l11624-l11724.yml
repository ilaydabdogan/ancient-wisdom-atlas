canonical_text:
  quote: ''
  summary: The passage concludes a Black-elk episode in which he returns to his family,
    recounts being abandoned during a journey, distributes feathers, gains White-mountains'
    wife as a second wife after a conflict, travels with his brother by means of ground-cedar,
    and later White-mountains' war party disappears. It then begins a tale about a
    young man taken under the Yellowstone River, Warm-blanket's failed rescue attempt,
    and Has-medicine-thunder's announcement that he will bring the young man back.
  language: English
  quote_policy: summarized
