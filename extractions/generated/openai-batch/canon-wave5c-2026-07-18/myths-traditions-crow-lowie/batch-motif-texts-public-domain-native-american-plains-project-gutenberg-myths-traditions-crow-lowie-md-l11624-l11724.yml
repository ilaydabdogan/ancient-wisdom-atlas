    run away from him, and seats the people in a circle to receive feathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Black-elk recounts that White-mountains sent him back for medicine, the others
    went on, and he followed their tracks until exhausted, breaking his bow and arrows
