canonical_text:
  quote: This was the hole in the sky.
  summary: A woman in the sky uncovers a hole and sees people below, becomes homesick,
    and is sent down in a rawhide bucket with her son. The descent line breaks after
    her husband throws a stone, killing her while the boy survives. The boy later
    damages an old woman's garden, is lured and caught with food, and enters her tipi;
    the old woman is identified as the Moon. At the end, the boy discovers a creature
    like an alligator under a covered box eating pudding.
  language: English
  quote_policy: quoted
