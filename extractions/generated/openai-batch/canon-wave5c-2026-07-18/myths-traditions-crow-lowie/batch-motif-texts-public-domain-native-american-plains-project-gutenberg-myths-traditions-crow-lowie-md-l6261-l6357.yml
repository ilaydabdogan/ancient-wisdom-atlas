canonical_text:
  quote: ''
  summary: Animal helpers finish and decorate a hide, warn a woman about her husband's
    planned attempt to throw her from a cliff, and instruct her in protective preparations.
    The husband pushes her toward alligators below, but she escapes through a hole
    dug by mice while he falls. She flees with prepared objects that become landscape
    barriers when thrown behind her. She reaches a mountain tipi, circles it as instructed,
    and the ground caves in under the pursuer. A boy in the tipi defends her with
    animal guardians and then, using the woman's medicine and weapons, kills the pursuer
    and burns his body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beavers, badgers, a porcupine, and ants help soften, rub, decorate, and finish
    a hide with quill-work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animal helpers tell the woman to wear long moccasin strings, keep her
    blanket loose, and prepare stomach parts, sticks, and an arrow-smoother because
    her husband will try to throw her from a cliff near a buffalo skull.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mice are said to dig an underground hole to the top of a high cliff, and badgers
    are said to wait underground by the buffalo skull.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the river and cliff, the husband makes the woman stand on the skull, shows
    her alligators below, and pushes her forward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman slips into the dug hole; the badger holds her long moccasin strings,
    while the husband goes over with her loose blanket and falls into the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman flees with the manifolds, rough stone, and sticks, and the females
    who had tanned for her give her speed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: During the pursuit, a thrown stick becomes thick woods, a thrown stone becomes
    high rocks, thrown manifolds become ridged rough hills, and a thrown aco'xe becomes
    large holes in the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The woman reaches a mountain tent, calls to its occupants as sons, is told
    to go around the tipi four times on the right side, and enters after the ground
    caves in under the pursuing man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A boy inside the tent refuses to send the woman out when the man demands her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two dogs tied by the door go out against the man; one is a bear and the other
    is a mountain-lion, and both die after fighting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy borrows the woman's medicine, a shield, and a stone maul, fights the
    man, and reports that he has killed him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman and the boy gather wood, place the dead man on the pile, burn him,
    and poke the fire with long sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy has seven brothers who are away hunting at the end of the passage.
  category: relationship
  evidence_refs:
  - ev:6
