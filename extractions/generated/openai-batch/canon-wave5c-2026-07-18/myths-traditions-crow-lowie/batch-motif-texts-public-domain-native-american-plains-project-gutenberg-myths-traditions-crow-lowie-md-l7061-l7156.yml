canonical_text:
  quote: ''
  summary: A young Crow man prepares feathered medicines, a spear, and a decorated
    lodge-pole display; gains and paints a black horse; is praised and named Crow-on-the-forehead;
    repeatedly performs fourfold rites with his mother before battles; passes through
    enemy lines while weapons fail to hit him; kills enemy warriors and takes horses
    and finery; and attracts a young woman from the hostile Sioux camp who travels
    to his black tipi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man gathers fallen feathers and makes war-related objects, including
    a buckskin-fringed stick, head ornaments, a black trailing skin, a spear, and
    medicines tied to a lodge pole beside his tipi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While he is tending horses, a fine black horse comes to his herd, stands still,
    and proves tame when he rides it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He decorates the black horse and himself with white clay, black earth, crow
    feathers, eagle tails, and the long black skin before riding around the camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old men sing songs in his praise and call him Crow-on-his-forehead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He prepares four bullets and powder in four little bags and makes four bowstrings,
    tying them together.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: During a fight over stolen horses, the black horse returns to camp and kicks
    one of his lodge poles; his mother ties and paints the horse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before entering battle, he and his mother sing four songs at the tipi door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: He spits into a little bag containing bullet and powder materials, throws
    out the contents and a bullet, then passes through enemy lines while gunshots
    and arrows do not hit him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: He goes through the enemy lines four times; enemy bowstrings tear or guns
    fail to fire, and the enemy flee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: He kills enemy men with his spear and takes their horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A woman previously captured by the Crow returns to her tribe, identifies the
    warrior as Crow-on-the-forehead, and says this was his first fight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Enemies seek aid from other tribes by making them smoke and attack the Crow
    again.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: In a later battle, he takes water in his mouth, puts it into a little bag,
    throws it out, cuts a string in two, and is said to have made the enemy’s powder
    wet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After another fourfold passage through enemy lines, he kills two enemies,
    takes horses and finery, and gives the spoils to his father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A young woman in the hostile Sioux camp refuses other marriages, throws food
    into the fire, and says she wants to marry Crow-on-the-forehead, though her father
    objects because he is an enemy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: In a later attack, the enemy surround the Crow camp; the young man paints
    his horse white, goes through the lines four times, kills two enemies, and takes
    horses and clothing or ornaments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Before the young Sioux woman comes to the Crow camp, the young man has painted
    his tipi black, tied feathers to the door, and placed war-bonnets and other finery
    around the lodge.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: The young Sioux woman receives permission to leave, travels with a horse,
