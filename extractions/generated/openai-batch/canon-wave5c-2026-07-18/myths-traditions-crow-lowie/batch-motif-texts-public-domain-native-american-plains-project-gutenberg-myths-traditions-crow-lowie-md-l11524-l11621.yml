canonical_text:
  quote: ''
  summary: A young man later named Black-elk helps provide meat, captures an eagle
    with a boy, and cures the boy in willow sweatlodges with bear-root. A party that
    had left him returns with stolen horses, and his relatives believe him dead. After
    winter, an old man permits Black-elk to go home, commands a death-and-skin-removal
    act involving the little boy, and gives travel instructions using sagebrushes,
    feathers, and closed eyes. Black-elk and the boy arrive near a camp, see his father
    and wife seeking visions, cross water by walking on it, and approach his family
    while his mother does not answer his call.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little boy threatens to leave unless his parents taste meat; both taste
    it, and the boy says it tastes better than eagle flesh.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After eating deer, they make a bowstring from deer sinews, stretch the sinews
    between trees, and the man makes arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man kills a rabbit and uses it while attempting to catch birds;
    the boy reaches for a bird despite warning, is scratched through a finger by talons,
    and the young man helps catch the eagle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The scratched boy returns to his brother; by a creek, ten willow sweatlodges
    are built, the old man helps, bear-root is rubbed on the boy's arms, and the boy
    comes out well again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The party that left the young man steals many horses from the enemy and returns
    to camp; Black-elk's wife expects him, Black-elk's father asks White-mountains
    about him, and the family gashes themselves thinking he is dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Black-elk and his brother hunt and return with meat; the little boy marks
    the anniversary of the young man's arrival, and the young man remembers his home
    and earlier homesickness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people formerly ate birds, but after the young man's arrival they eat
    buffalo and deer; he stays through winter, and in spring the old man says he may
    go home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man orders the young man to split the little boy's skin at the feet
    and hands and tickle him to death; after objection, the young man does it, the
    boy is flayed, a little boy is inside the skin, the skin laughs and acts crazy,
    and the sensible boy is to be taken along.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man tells Black-elk to get four sagebrushes, place them in the direction
    of travel, put his brother on feathers, take a first step with eyes closed, and
    let the little boy tell him the rest; Black-elk opens his eyes in another place
    near a big camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: From a high hill, Black-elk sees a line of camps and two figures; the passage
    identifies the figure across the creek as his father and the one on the flat as
    his wife, both connected with seeking a vision.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: At dark, Black-elk and the little boy go to the river, the boy gets on Black-elk's
    back, they walk on the water to the camp, and a fire they build goes out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Black-elk's father, believing his son killed, goes out on the hills; during
    a snowstorm he shelters under a dry tree, where a bird sings three times and then
    a fourth song of rejoicing, after which he returns home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Black-elk comes to the farthest camp with the little boy, stands outside,
    calls his mother twice, and she does not answer; his father says the caller sounds
    like her son.
  category: speech
  evidence_refs:
  - ev:11
