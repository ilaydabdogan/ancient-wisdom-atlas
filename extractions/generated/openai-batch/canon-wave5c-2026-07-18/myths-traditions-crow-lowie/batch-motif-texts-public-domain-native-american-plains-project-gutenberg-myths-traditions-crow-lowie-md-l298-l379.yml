canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction comparing Crow, Hidatsa, Arikara,
    Mandan, Assiniboin, Dakota, and broader Siouan folklore materials. It argues for
    close Crow-Hidatsa tale relationships, notes shared or similar character names
    and tale incidents, discusses trickster-cycle borrowing, contrasts borrowing with
    possible common inheritance, and cautions against confidently reconstructing an
    original Siouan mythology because of later divergence and borrowing.
  language: English
