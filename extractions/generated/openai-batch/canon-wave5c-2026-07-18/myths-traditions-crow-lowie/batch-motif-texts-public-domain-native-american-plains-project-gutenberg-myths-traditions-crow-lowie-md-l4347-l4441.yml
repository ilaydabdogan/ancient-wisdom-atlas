canonical_text:
  quote: ''
  summary: A rescuer passes through successive camps of bird-people to find Curtain-boy,
    who is held by Long-arm and is to be eaten. The rescuer confronts and kills Long-arm,
    burns him, sends the birds down to earth, returns with his brother through a sky-hole
    by means of arrows, and later assigns family members to celestial bodies. The
    passage then begins another tale in which a hunter warns his pregnant wife not
    to answer anyone at the rear of the lodge; an unborn child speaks, reveals the
    door, and a two-faced visitor enters.
  language: English
  quote_policy: summarized
