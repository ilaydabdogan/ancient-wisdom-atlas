canonical_text:
  quote: ''
  summary: The passage contains an episode in which a father enters the river to retrieve
    his dead child from water beings, followed by a longer episode in which a hostile
    stepfather abandons a boy at an eagle nest. A female eagle feeds, equips, and
    returns the boy to his mother. The boy later kills his stepfather, survives a
    Sioux attack, and is associated with a dangerous corpse taboo enforced by lightning.
  language: English with Crow terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children were swimming at the Bighorn canon; one child disappeared, and people
    thought an alligator had taken the child into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The missing child's father, Runs-near-the-camp, went to the water, placed
    both hands in it, cried there, and on the fourth day was taken into the river.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Underwater informants told the father that an alligator had taken the boy
    to the mouth of Woody Creek, that the boy was dead, and that water-beings wanted
    to eat him but were waiting.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father went through the water to the creek mouth, got the boy's body,
    emerged where he had entered, and brought the body back to camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man hunting with his stepson forced the boy by ropes toward an eagle nest
    on a steep hill, threw the rope away, went home without him, and lied to the boy's
    mother about his whereabouts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother had a crier call for searchers, cut off her hair, sought a vision,
    and in dreams was told that her boy had been suffering for a long time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy remained at the eagle nest; a female eagle told him her young would
    take him down when large enough, brought him young deer, and instructed him to
    put meat in the sun, where it cooked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young eagles grew and practiced flying; the mother eagle said they would
    pass over the camp four times, tested their strength, and then said she would
    carry the boy herself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The eagle told the boy to make a bow and arrows from four sticks; she painted
    two arrows white, one yellow, and one red, and called the two white arrows his
    best arrows.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The eagle carried the boy on her back, saw his mother on a high hill, came
    down there, and the mother recognized and embraced him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before leaving, the eagle told the boy he could kill or otherwise trouble
    the person who had caused him trouble, and told him to kill and open a buffalo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After returning, the boy cried and would not tell his mother or the camp about
    his experiences.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The boy later told his mother he would kill his father, then shot his stepfather
    with a white arrow, shot him again, killed him, dragged him away, and had people
    warned not to go near.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy killed a buffalo as the eagle had instructed and said it was for his
    father; a man asked for meat and then accompanied him to kill more buffalo.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: An eagle swooped down near the men; the boy understood it as a sign to hide,
    but his companion went back to camp.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Sioux attacked the young man; he killed nine, was hard to shoot, and the camp
    later found the nine enemy bodies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: A relative of the dead stepfather tried to recover and bury his bones; although
    there were no clouds, rain fell on him and lightning struck and killed him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: A crier announced that people should keep away from the dead bodies, and the
    passage says the young boy was a medicineman and everyone was afraid of him.
  category: speech
  evidence_refs:
  - ev:11
