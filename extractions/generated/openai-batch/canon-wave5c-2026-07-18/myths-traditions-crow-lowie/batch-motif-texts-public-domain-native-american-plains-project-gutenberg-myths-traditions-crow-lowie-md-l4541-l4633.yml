canonical_text:
  quote: ''
  summary: Two boys use arrows and spring water to restore their mother. Later, after
    disobeying their father’s instruction not to touch a rolling hoop before it falls,
    they follow the hoop to a lake tipi. A man and woman there keep the hoop; the
    man repeatedly tries to eat or kill the boys by boiling them, submerging them
    upside down in the lake, and roasting them in a covered heated pit, but the boys
    survive each ordeal. The woman repeatedly urges the man to release them, and he
    eventually says she will return the hoop so they may go home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys shoot arrows into the air above their mother; as arrows descend,
    she first moves parts of her body, then rolls away, then stands and runs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spring-boy takes his mother to a spring, washes her face and body, and instructs
    her to dive twice upstream and twice downstream; she comes out well again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys’ father tells them not to touch the netted hoop until it falls down.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: One boy proposes finding out what their father told them not to do, and the
    boys touch the hoop before it falls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After being touched, the hoop keeps rolling, leads the boys over a hill to
    a big lake with a big tipi on it, then rolls up the tipi and sticks at a lodge
    pole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the lake tipi, a man says that if the visitor is a girl they will adopt
    her, but if a boy they will eat him; after learning there are two boys, he says
    he will eat them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The man ties and undresses the boys and puts them into a covered boiling kettle,
    but they sit at the bottom telling stories and later jump out alive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The woman tells her husband to let the boys go because they are dangerous
    and to give them their hoop, but he refuses.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man and woman tie the boys upside down to lodge poles and leave them submerged
    in the lake; Spring-boy unties his brother, and both survive.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The man prepares a pit with heated stones, cherry-tree limbs, water, rawhide
    coverings, dirt, and a large fire; the boys are placed inside tied up, but free
    themselves, sleep, and jump out alive the next morning.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the final ordeal, the man wonders what kind of boys they are, the woman
    scolds him, and he says the boys may receive their hoop and go home.
  category: sequence
  evidence_refs:
  - ev:11
