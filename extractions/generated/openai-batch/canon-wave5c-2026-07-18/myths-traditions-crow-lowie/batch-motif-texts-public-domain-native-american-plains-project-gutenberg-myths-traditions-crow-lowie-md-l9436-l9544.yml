canonical_text:
  quote: ''
  summary: The passage concludes Raven-face episodes involving dangerous encounters
    with buffalo, a grant of doctoring power, a cliff rescue, and fulfillment of a
    bear’s earlier warning. It then begins a tale of a poor nearly blind man and his
    wife, whom the Moon visits and helps; the couple recruits young men and begins
    a journey toward promised horses at the Musselshell fork.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo horns the ground, licks Raven-face’s back until the skin is torn
    off, makes water on his wounded back, and Raven-face goes into a trance and cries
    out in pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo appears as a bull painted with white clay, speaks to Raven-face,
    says he came to earth to flirt and does not belong there, says Raven-face shot
    him, and says he killed Raven-face’s horse in return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaking buffalo tells Raven-face that he shall doctor people wounded
    by bullets or arrows and own horses thereby, then disappears from sight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a later buffalo hunt near the canon of the Bighorn, Raven-face slides under
    a wounded buffalo, his buffalo-hide belt catches on the horn, and he dangles over
    a cliff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven-face’s comrade cries, punches the buffalo with his bow, and the buffalo
    throws Raven-face back toward his friend before going down over the cliff.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that a bear had told Raven-face he need not fear death
    until he had lost his teeth, and Raven-face recognizes this as true after the
    near-death event.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'A poor couple travels behind a large Crow camp: the man does not see well,
    the wife digs roots, they have one horse and a very small lodge, and they take
    leftovers when game is plentiful.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Moon comes to the wife as a woman in plain dress with an elkskin robe
    and a blue-handled knife, befriends her, and advises her to find someone to work
    for them because her husband is nearly blind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wife tells her husband that she has been told to look for workers and
    that horses for him, including a roan and a big-bellied mare, are at the fork
    of the Musselshell River.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The couple feeds turnip-pudding to four brave young men; two doubt the poor
    man’s supernatural power, while two decide to go with him because the claim may
    come true.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The wife cuts up the tent cover to make moccasins, makes a padded saddle,
    and carries a bag given by the Moon that is shaped like a halved hourglass.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: At night the two young men and the poor man set out; the wife sings songs
    of rejoicing and scouting and directs them toward the Musselshell fork where the
    roan is coming.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: On the Yellowstone the three travelers kill a very fat buffalo, eat some of
    it, and cook and keep the remaining meat without building a fire.
  category: action
  evidence_refs:
  - ev:12
