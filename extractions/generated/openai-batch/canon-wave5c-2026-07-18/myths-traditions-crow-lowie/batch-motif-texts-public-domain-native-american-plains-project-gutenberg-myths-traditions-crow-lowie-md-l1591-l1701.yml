canonical_text:
  quote: ''
  summary: The passage gives several etiological episodes. Old-Man-Coyote’s wife and
    Red-woman decide how fruits ripen, how hides are softened, how gendered bodies
    and social categories are differentiated, how medicines and vision-seeking are
    rewarded, how horses and buffalo are treated, what materials are used for arrows
    and bows, and where the Crow are placed among other tribes. A following episode
    explains the joking-relationship through Old-Man-Coyote’s encounter with a buffalo
    calf whom he addresses as a younger brother. Another episode begins Old-Man-Coyote’s
    first visit to the Crow, whom he says he made, and describes his transformation
    of a mountain-goat into a decorated horse and his making of regalia from ordinary
    materials.
  language: English
  quote_policy: summarized
