canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale fragment in which a squirrel-man
    reports that his comrade became cannibalistic and was later found as bones hanging
    from a tree. It then gives the tale titled “The Snake-Man”: two young men encounter
    a huge animal blocking their way; one burns and eats its flesh while the other
    refuses. The eater transforms into a hairy, horned, different being, is carried
    to the river, thrown in, becomes huge, disappears under water, and later returns
    as a person. He gives his former comrade unerring arrows, instructions for a war
    party, a river crossing, and an offering of a special buffalo to his father. The
    comrade follows the instructions, crosses with companions, obtains horses, and
    later begins another visit to his friend at the river.'
  language: English
  quote_policy: summarized
