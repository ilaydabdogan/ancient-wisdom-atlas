- id: obs:3
  text: The girl leads the selected buffalo cow over a stream, and the young men kill
    it, skin it, build a fire, cook it, eat, wash, and rub themselves with peppermint
    weed as instructed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: During a swim, each young man shoots an arrow into quicksand or mud after
    speaking as if shooting game for a hungry child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl inspects the young men’s quivers, finds mud on their arrows, disputes
