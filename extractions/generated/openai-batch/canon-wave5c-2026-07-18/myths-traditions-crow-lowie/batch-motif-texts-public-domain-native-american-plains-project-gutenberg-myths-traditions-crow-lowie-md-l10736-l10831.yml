canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which two young men interact
    with a girl and her father, eat buffalo described by the girl as dogs, kill an
    alligator hidden in mud, then drive away the pursuing girl by reversing their
    command, after which she vows vengeance on their marriages. It then begins the
    tale titled “Sharpened-leg,” where a starving war party dwindles to two comrades;
    one man with squirrel powers discovers the other eating flesh and marrow from
    his own legs, sharpening his shinbone, and planning cannibalism. The fugitive
    is chased through a river and into trees, receives advice from winter-sparrows,
    reaches a raven-tree, and the pursuer’s sharpened leg becomes stuck there.
  language: English
  quote_policy: summarized
