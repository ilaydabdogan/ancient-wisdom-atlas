    vengeance four times whenever they marry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the tale titled “Sharpened-leg,” a group of young men on the warpath becomes
    hungry; most turn back until only two comrades continue.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: One of the two comrades is described as having squirrel powers; he returns
    secretly to the bark hut and sees his comrade breaking his shinbone, removing
    meat and marrow from his own legs, cooking and eating it, sharpening his shinbone,
    and saying he will eat the returning comrade.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The squirrel-power man flees, crosses a river, and sees the sharpened-leg
