canonical_text:
  quote: ''
  summary: The passage recounts early trade and intermarriage involving White traders
    and Crow people, Iron-ball's warning that buffalo and deer would disappear and
    Crow children would learn White men's ways, the death-seeking warrior Batco'sana'pua
    who repeatedly fought from a hole and later rode a white horse over a steep bank,
    and the beginning of Spotted-rabbit's story, in which his father's death leads
    to his mother's mourning and his own preparations to become a Crazy Dog through
    horse-gifts, special dress, equipment, and seclusion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Long-knife says another boat will come when the water is low; the arriving
    men have hoes, knives, and axes, and the Indians pay them with buffalo hides.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iron-ball is described as chief of the White men, a trader at the site of
    Forsyth, a man who married a Crow woman, and one who lived on the same food as
    the Indians.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After having a child with a Crow woman, Iron-ball calls the Indians together
    and says buffalo and deer will be killed off, children will study White men's
    ways, and the people will become poor; the narrator states that this came true.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Batco'sana'pua says he does not want to become old, cowardly, or afraid, and
    that before he is forty he will do something to die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Batco'sana'pua goes on four war parties, digs a hole when surrounded, jumps
    out to drive off enemies, returns to the hole, and rebukes other Crow Indians
    as cowards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a Lumpwoods dance, Batco'sana'pua rides a white horse while another man
    leads him around camp singing glad-songs and announcing that young women who want
    him as a sweetheart should act soon because he does not want to live long.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When about forty, Batco'sana'pua takes his white horse, paints himself white,
    covers the horse's eyes, rides to the edge of a rocky steep bank, and both horse
    and rider are smashed in the fall; the place is named for the event near Pryor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spotted-rabbit is described as exceptionally good-looking, physically without
    fault, living with his parents, and owning many horses.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Spotted-rabbit's father is killed in war, his mother gives away her
    big tipi and property, cuts and gashes her body, goes without moccasins, walks
    with a cane, and cries among the camp while others cry with her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Spotted-rabbit spends time in the hills tending horses, remains silent at
    home, and gives away three horses for war clothes while his mother says the horses
    are his to give.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spotted-rabbit prepares to be a Crazy Dog with a decorated rattle, a shortened
    gun named Wolf-arm, fringed red shirt, Navajo blanket breechclout, fringed leggings,
    beaded moccasins, red-and-black sashes, and a necklace.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Spotted-rabbit tells an elder clansman that because his father died he will
    be a Crazy Dog; he is told to bring a best horse and belongings to the foot of
    the mountain, and he hides near a shaded tree with the clansman's clothes.
  category: sequence
  evidence_refs:
  - ev:6
