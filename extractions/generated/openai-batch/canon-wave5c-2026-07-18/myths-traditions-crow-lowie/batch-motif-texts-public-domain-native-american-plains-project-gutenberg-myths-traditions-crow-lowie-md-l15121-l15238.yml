- id: obs:1
  text: A clansman teaches Spotted-rabbit songs, and Spotted-rabbit learns all of
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The songs include statements that young women or young men’s wives will cry
    because the singer must die or will die soon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two married women sleep with Spotted-rabbit in the tipi; one is the wife of
    Two-faces, whose husband does not scold her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spotted-rabbit’s mother wakes him, tells him to water and bring in his horse,
    and later gives a loud woman’s cry as he starts out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The clansman brushes the horse, puts on the bridle and lion skin, follows
    with a drum, and sings for Spotted-rabbit’s dancing.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Several men say they will kill Spotted-rabbit because he took their wives,
