canonical_text:
  quote: ''
  summary: Spotted-rabbit learns songs from a clansman, attracts many married women,
    dances publicly with horse adornment and song, faces men who threaten to kill
    him, then advances against a dangerous Sioux enemy during a horse-raiding episode.
    The Sioux kills him. Two-faces uses song and medicine, disarms the Sioux, and
    another Crow kills the Sioux. Spotted-rabbit’s mother retrieves and transports
    his body, while women mourn him and cut themselves; she continues to carry his
    corpse and asks whether he or his bobtail horse is better.
  language: English with Crow-language song text and terms
  quote_policy: summarized
