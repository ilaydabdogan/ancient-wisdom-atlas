canonical_text:
  quote: ''
  summary: A battle ends with Looks-at-the-white-buffalo surrendering, being decapitated,
    and burned. His people mourn and seek peace with One-eye through One-eye’s sister
    and a medicine-pipe. A pipe-smoking peace council follows, but One-eye later harms
    a young man at a creek. The young man prepares for a prolonged absence and fasts
    in the mountains for dreams that might help him against One-eye. In winter, One-eye
    uses medicine to bring buffalo to the ice, and people butcher buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After renewed fighting, all members of the party except Looks-at-the-white-buffalo
    were killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Looks-at-the-white-buffalo gave his name, said he was tired, broke his bow
    and arrows, threw away his knife, sat down, and told the Sioux to kill him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Crow men watched from a high hill and saw that the enemy were still afraid
    of Looks-at-the-white-buffalo after he had discarded his weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The enemy chopped off Looks-at-the-white-buffalo’s head with an ax; his body
    still moved, and the enemy then built a fire and burned him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two witnesses returned after the Sioux camp moved, saw the burned place,
    reported the killing, and the people mourned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: People in Looks-at-the-white-buffalo’s camp feared One-eye would destroy the
    camp if he learned of the death, so they sent One-eye’s sister with a pipe and
    instructed her to tie the medicine-pipe over the tent door.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy called to One-eye four times; after the boy cried, One-eye entered,
    and the feathers of the medicine-pipe over the door struck him in the face.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Food was given to One-eye, a pipe was filled, and the visitors smoked with
    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sister’s husband stated that the groups were the same kind of people,
    had long been separated and at war, and now wanted peace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the peace gathering, the death of Looks-at-the-white-buffalo was explained
    as a wished-for death because he did not want to kill his own people; One-eye
    agreed to peace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The groups hunted buffalo, exchanged horses with One-eye’s relatives, camped
    together, and agreed not to fight anymore.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a little creek during a buffalo hunt, One-eye told a young man to drink,
    then stepped on the back of his head and held him there until he could not move.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The injured young man prepared moccasins, received arrows, knives, and a blanket,
    and said he would stay away for two or three seasons and return.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young man fasted in many places, built a buffalo-hide-covered shelter
    in the mountains, had many dreams, and continued fasting because none enabled
    him to act against One-eye.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In winter, One-eye made medicine to make buffalo come to the ice, and many
    buffalo were killed and butchered.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Two boys hunting rabbits found a dead buffalo on the river bank and later
    found many more buffalo being butchered; the killer of the first buffalo was not
    known.
  category: sequence
  evidence_refs:
  - ev:9
