canonical_text:
  quote: ''
  summary: The passage contains the end of a medicine-man tale involving walking on
    water, underwater disappearance, recovery of a drowned man's remains, a turtle
    captor, and a thunderbird-owned willow; a second episode in which the same medicine-man
    is mortally wounded and left by a rock where a spring appears; the tale of a tall
    left-handed woman-killer who is trapped and destroyed by a society and young men;
    and the opening of a winter-camp tale in which a woman exits by the smoke hole
    to gather food and firewood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After asking for the exact place in the water, the medicineman rubs himself,
    takes a young willow, tells the others not to look, whistles upstream and downstream,
    walks on water up to his ankles, and disappears under the water near where a young
    man had been taken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The companions wait until the sun is low, think the medicineman is dead, then
    hear whistling in the water and see him reappear at the place where he vanished.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The medicineman returns with the lost man's necklace and one leg whose flesh
    has been eaten, and says he was told that the body had been given to another who
    ate it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicineman says a big turtle captured the young man; he brings the turtle
    out with the willow and strikes it with the thunderbird-owned willow, paralyzing
    its hind legs.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After being shot in the abdomen and having his spine broken during a winter
    raid, the medicineman asks to be wrapped in a young buffalo hide and thrown into
    ice-free water, promising to overtake the others in two days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The companions refuse to throw the wounded medicineman into the water, place
    him on a high rock with a crack, and leave; the crack enlarges, a spring comes
    out there, and he dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women who go to the woods for firewood fail to return and are found with arrows
    through them; a tall, large left-handed wanderer is said to watch for women, ravish
    them, and kill them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A dying young girl names the tall left-handed man as the one who ravished
    and shot her and says earlier missing women must have met the same fate.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The men hold council and decide to have the Big Dogs society invite the killer
    to join so that four strong members can become his particular friends and trick
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During a camp move, the four assigned men pretend to walk with arms around
    one another, seize the killer by the wrists and legs, throw him down, and call
    the young men to capture him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Guns and arrows do not harm the captured killer enough to stop him; he threatens
    the people if released, and they then kill, dismember, cut up, and burn him, finding
    that his spine is made of a young cherry tree.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: In a winter camp with snow-covered lodges, a woman shuts herself in, exits
    by the smoke hole, catches cottontail rabbits at the tops of trees, gathers firewood,
    roasts the catch, and feeds her husband, brother-in-law, and sister-in-law.
  category: action
  evidence_refs:
  - ev:9
