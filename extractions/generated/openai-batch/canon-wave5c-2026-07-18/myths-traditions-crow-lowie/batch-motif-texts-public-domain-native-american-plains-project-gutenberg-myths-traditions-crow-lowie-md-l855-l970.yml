canonical_text:
  quote: ''
  summary: The passage presents several Crow cosmogonic variants involving a medicine
    stone, a star-being who becomes Tobacco, creation of terrain, ritual instructions,
    creation of people from mud or from a tree hole, earth-diver episodes with ducks
    and other animals, a flood-and-boat episode, and Old-Man-Coyote's division of
    peoples into tribes with the Crow at the center.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shining object on the plains is identified as a medicine stone, described
    as part of the earth, the oldest part of the earth, a separate being, and able
    to reproduce itself as stones over the earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A being seen standing on the ground is identified as one of the Stars above;
    when approached, it transforms into the Tobacco plant, with no other plant yet
    growing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People are instructed to take and raise Tobacco in the spring, care for it,
    use it in dancing, and sing a planting song.
  category: speech
  evidence_refs:
  - ev:2
  - ev:15
- id: obs:4
  text: After making man, the creator sees there is no grass and makes mountains,
    hills, and trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A poor boy goes out to fast and is adopted by the Sun; the narrative then
    turns to the organization of the Tobacco dance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a briefer version, after the earth has been brought up, the Sun declares
    that everything proceeds from left to right and sprinkles fine dirt four times
    over the water from left to right.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The briefer version explains contemporary incense practice as beginning at
    the left because of the Sun's left-to-right sprinkling.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the briefer version, a Tobacco-man appears before any living being has
    been made, shrinks as the creators approach, and is discovered as the white-flowered
    Tobacco plant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sun and Old-Man-Coyote declare that they will make the Crow and that the
    Tobacco plant will be the Crow people's mainstay.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: One kind of people is fashioned from mud into dolls and given life; these
    clay people are told to open one another's eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Crow are made from a hole in a tree; the first one to come out has his
    eyes opened and is told to open the eyes of the rest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Medicine-tail's version, Old-Man-Coyote dispatches a little swallow, a
    crow, a wolf, and a duck as earth-divers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old-Man-Coyote makes the land from mud and then makes human beings, one male
    and one female, from a little mud; their children alternate boy and girl and the
    people increase.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In another version, Old-Man-Coyote makes a boat; rain covers all the mountains,
    and after the waters go down the boat is aground on a high mountain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Two ducks come to Old-Man-Coyote; after one duck fails after three dives,
    the other brings mud in its bill on the fourth trial, and Old-Man-Coyote throws
    earth around to make the earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Old-Man-Coyote marks out rivers and creeks, makes mountains and hills, creates
    buffalo, horses, animals, tipis, people, and a wife, and instructs the people
    to reproduce.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:17
  text: When the people become numerous, Old-Man-Coyote divides them into different
    tribes in a circle, leaves the Crow in the middle, makes the others their enemies,
    and institutes dancing after killing an enemy.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: At the beginning of the Old-Man-Coyote and Ci'Rare' account, the earth is
    covered with water, Old-Man-Coyote is alone on the water, meets a little coyote
    companion, and the two decide to make the earth.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:19
  text: In the Old-Man-Coyote and Ci'Rare' account, ducks are asked to dive and bring
    earth from the water; they bring earth four times, and Old-Man-Coyote makes the
    earth.
  category: action
  evidence_refs:
  - ev:14
