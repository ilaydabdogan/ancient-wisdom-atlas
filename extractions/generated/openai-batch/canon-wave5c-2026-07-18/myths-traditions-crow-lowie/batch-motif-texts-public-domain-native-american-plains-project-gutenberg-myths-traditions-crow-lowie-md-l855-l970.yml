comparison_claims:
- id: claim:1
  claim: The passage presents multiple internal variants of an earth-diver creation
    pattern in which animals, especially ducks, obtain mud or earth from beneath water
    so that land can be made.
  claim_level: same_motif
  target: Earth-diver creation pattern across the Medicine-tail version, the flood-and-boat
    version, and the Old-Man-Coyote and Ci'Rare' account
  evidence_refs:
  - ev:7
  - ev:10
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The claim compares only variants included in this passage and does
    not assert external historical relationship.
- id: claim:2
  claim: The longer and briefer versions both treat Tobacco as a pre-existing or star-related
    living being whose plant form is foundational for Crow ritual or subsistence life.
  claim_level: same_function
  target: Tobacco being in the main version and briefer version from the same informant
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:15
  counter_evidence_refs: []
  confidence: high
  limitations: The two accounts differ in wording and detail, and the passage notes
    informant wavering over Sun and Old-Man-Coyote.
- id: claim:3
  claim: Mud, earth, or dirt functions repeatedly as a creative substance for land,
    people, animals, or ritual explanation across several variants.
  claim_level: same_function
  target: Mud or earth as creation material in versions 2, 3, 4, and Old-Man-Coyote
    and Ci'Rare'
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:10
  - ev:11
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The created products and actions vary, so this is a functional comparison
