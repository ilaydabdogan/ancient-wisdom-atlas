canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which a buffalo wife leaves her Crow husband
    after he says she is like a ghost despite her prohibition. He follows human-to-buffalo
    tracks to a buffalo camp, receives directions from buffalo affines, and passes
    a recognition test by using signs supplied by his child. The wife, husband, and
    child return among the Crow, where a saying about a true buffalo wife is given.
    The passage then begins another tale: a good-looking girl jokingly says she wants
    to marry Worms-in-his-face; he hears, comes to her camp, appears good-looking,
    lies beside her at night, leaves at dawn, and she follows him to a high peaked
    hill.'
  language: English
  quote_policy: summarized
