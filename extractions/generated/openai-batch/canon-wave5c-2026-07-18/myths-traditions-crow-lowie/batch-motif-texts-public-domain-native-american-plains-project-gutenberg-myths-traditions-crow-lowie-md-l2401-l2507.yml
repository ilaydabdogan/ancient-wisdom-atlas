  summary: The passage includes the end of an episode in which two girls outwit a
    male by lying motionless, a tale in which Old-Man-Coyote is trapped when a girl
    becomes a box-elder tree, and a tale in which an abandoned boy raised by buffalo
    performs marriage tests while Old-Man-Coyote falsely claims or imitates his achievements.
  language: English
