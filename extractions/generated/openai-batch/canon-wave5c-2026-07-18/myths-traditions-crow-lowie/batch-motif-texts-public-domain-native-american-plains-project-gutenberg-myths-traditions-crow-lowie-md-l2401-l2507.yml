literal_observations:
- id: obs:1
  text: A male figure approaches two females who lie motionless on their backs and
    touches, kisses, and sexually inspects them while they remain still.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The male figure concludes that the females may be dead and leaves to break
    stones, saying he will chop up their four breasts for his children to play with.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girls put on their dresses, run away, and later call out to the male figure
    that he has been cunningly fooled and had smelled them several times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the girls confront him, the male figure does not answer, goes away sad,
    and later hides or runs whenever he sees them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Old-Man-Coyote is introduced as a figure who would have his will of any women
    he came to.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Old-Man-Coyote sees a disrobed beautiful girl in a clearing and attempts to
    possess her; she rises, becomes a box-elder tree, and traps his organ in an aperture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A winter-bird acts as messenger for Old-Man-Coyote, and three female beavers
    come to cut and split the box-elder tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explains the blood from Old-Man-Coyote's organ in the tree as
    the reason all box-elders have blood or red coloring inside them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman leaves a child in a buffalo wallow; seven buffalo find and raise the
    child until he grows up and returns to camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief of the camp offers a daughter in marriage to the man who kills an
    eagle and later offers the same reward for killing a silver fox.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy kills the eagle and the silver fox, but Old-Man-Coyote substitutes
    his own arrow or takes the animal to claim the achievement before the chief.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Crow people know the boy killed the eagle and fox, so Old-Man-Coyote marries
    the elder daughter and the boy marries the younger daughter.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The boy makes medicine and brings abundant buffalo and elk to camp, while
    Old-Man-Coyote imitates him but brings only smaller numbers of animals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy has enough elk teeth to make a dress for his wife, but Old-Man-Coyote
    has only enough teeth for his wife to use as a wristlet.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: The boy's medicine results in a fresh buffalo chip, while Old-Man-Coyote's
    imitation results in a bad-smelling wolf chip that must be covered up.
  category: sequence
  evidence_refs:
  - ev:10
