  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A woman and her husband went to the mountains; the husband captured horses
    in a big lake, and they prepared straight tipi poles.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The woman made holes in tipi poles with a heated elkhorn prong, sewed hides
