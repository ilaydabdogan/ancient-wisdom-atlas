canonical_text:
  quote: ''
  summary: After the made buffalo disappear, Ci'rape' finds their den in the rocks.
    Two men follow buffalo tracks through a tunnel to another land inhabited by giants
    who use buffalo as horses and find buffalo meat disgusting. When birds attack
    the giants, the little visitors kill the birds, and the giants then fear and honor
    them. The visitors receive buffalo, bring them back through the tunnel to earth,
    and subsequent sections describe buffalo processing, tipi-making, food plants,
    future white tool-givers, bows, boiling, winter buffalo-hide furnishings, horse
    multiplication, parfleches, ropes, and moving camp for buffalo hunting.
  language: English
  quote_policy: summarized
