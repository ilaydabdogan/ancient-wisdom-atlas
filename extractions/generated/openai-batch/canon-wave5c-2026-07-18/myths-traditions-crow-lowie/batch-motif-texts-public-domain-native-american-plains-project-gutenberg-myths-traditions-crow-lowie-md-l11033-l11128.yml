  text: After the bird attack, the giants feared the little people and carried them
    about to avoid offending them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The giants drove a herd to the hole, and the two men brought buffalo back
    through the tunnel to the other entrance and returned to earth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Women prepared buffalo hides by tanning them with brain, liver, and fat, removing
