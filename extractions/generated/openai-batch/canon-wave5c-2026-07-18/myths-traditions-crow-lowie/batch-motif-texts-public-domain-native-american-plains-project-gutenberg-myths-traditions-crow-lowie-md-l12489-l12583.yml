canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving Bare''ate, the Sun-worshiper:
    a fight with Sioux, his rescue, ritual painting and joyful songs, warpath medicine
    with a hoop, fog-making and repeated darkening of the sun to aid horse raids,
    a later expedition recovering horses from Piegan raiders, triumphant dancing on
    return, the birth and naming of his son, and a brief transition mentioning Awucte
    and movement toward the Hidatsa.'
  language: English with Crow names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crow and Sioux fight; Bare'ate goes into a hollow, kills two Sioux, loses
    his roan horse, and is rescued by the Crow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fight, the Crow kill eight Sioux and capture one woman and one child,
    while no Crow are killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun-worshiper paints a black circle on his face, a black spot on his nose,
    black stripes on his limbs, carries a pole with a scalp tied to it, and sings
    joy songs through camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Sun-worshiper knew what was going to happen and told
    people in advance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bare'ate goes on the warpath, makes an offering, takes a hoop to a hill, sticks
    it in the ground, makes medicine, and learns where a camp is located.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the boys want darkness for horse stealing, Bare'ate directs one boy to
    take water into his mouth and sprinkle medicine on him; soon fog rises and visibility
    becomes poor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bare'ate and companions steal horses and regroup at a named hill near daybreak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bare'ate uses four sagebrushes one at a time toward the rising sun; each time
    the sun disappears and darkness returns during the escape.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The party swims the Bighorn Canon, all horses cross, they find buffalo, build
    a fire, eat, and return to the Crow camp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Piegan steal Crow horses, a man whose bobtail pinto was stolen asks
    the Sun-worshiper for help by laying his hand on his head.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The Sun-worshiper requests a willow stick for a hoop and a red blanket, leads
    an expedition, finds fresh horse droppings, makes medicine, throws ashes toward
    the enemy, and marks his face black by a finger gesture involving his tongue and
    the sun.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Crow catch up with the Piegan at the Yellowstone River, where the Piegan
    have made a boat to cross; six of twelve Piegan are killed while swimming, and
    the stolen horses are recovered.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Sun-worshiper captures two guns and one bow; on the return, the party
    sings and dances at multiple places until his voice is gone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: When Bare'ate returns home, his wife gives birth to a boy whom he names Ax’ac
    iaxpa/riac, translated as Sun-is-his-medicine.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Bare'ate is described as like a chief; people want him to lead for good luck,
    but he refuses because his time has not yet come.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Awucte is said never to have been hurt in war, while Bare'ate’s horse was
    once killed; the passage then says the Sweater was a little better off than the
    Sun-worshiper.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: A moving crowd divides, four brothers go to the Hidatsa, and Awucte marries
    a Hidatsa girl.
  category: sequence
  evidence_refs:
  - ev:10
