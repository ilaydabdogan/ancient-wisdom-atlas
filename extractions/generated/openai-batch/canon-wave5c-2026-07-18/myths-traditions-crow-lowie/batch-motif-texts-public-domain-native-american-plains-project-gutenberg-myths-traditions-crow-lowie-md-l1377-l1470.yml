canonical_text:
  quote: ''
  summary: The passage first recounts Old-Man-Coyote using dancing animals, a body
    opening, and promises to Sun while trying to kill animals; he is later trapped
    by creaking trees while Cl'rape' eats his meal. The passage then gives a Day and
    Night tale in which Old-Man-Coyote gathers birds, arranges a gambling contest
    against water and four-legged beings over whether daylight or night will prevail,
    dragon-flies help the birds win, the sun rises, and Old-Man-Coyote assigns animal
    species their habitats, foods, and uses.
  language: English
  quote_policy: summarized
