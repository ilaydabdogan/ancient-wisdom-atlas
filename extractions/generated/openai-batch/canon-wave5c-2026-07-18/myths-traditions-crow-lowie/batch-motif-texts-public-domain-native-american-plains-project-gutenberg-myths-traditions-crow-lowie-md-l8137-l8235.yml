canonical_text:
  quote: ''
  summary: The passage continues a tale in which a human visitor stays among bird
    people, especially the Cranes, receives feathers, wings, a pipe, and several bird
    medicines, passes a sky-earth boundary with the birds, returns to his people with
    the Seven Cranes, undergoes sweatlodge rites, and uses the medicine on the warpath.
    He captures a foretold woman, marries her, and transmits his medicine to his son.
    The passage then begins “The Bulls’ Ward,” in which a young woman secretly conceives
    by an orphan boy, gives birth during a buffalo hunt, and the child is placed in
    a buffalo wallow before seven bulls arrive.
  language: English
  quote_policy: summarized
