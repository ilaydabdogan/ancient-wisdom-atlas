candidate_motifs:
- id: motif:1
  label: Human receives supernatural bird patronage and medicine
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The man stays with bird people, receives wings, a pipe, and medicines from
    bird patrons, and is instructed in their use at the place where he had fasted.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage begins mid-tale, so the full circumstances of the man’s arrival
    among the birds are not included.
- id: motif:2
  label: Flight to a sky-earth threshold and passage under the lifted sky
  taxonomy_refs:
  - ascent
  basis: The man flies with the Seven Cranes to the place where the sky touches the
    earth and lifts the sky with a pipe so the birds can pass under it.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes flight and a sky boundary, but does not fully define
    the cosmological geography or direction of travel.
- id: motif:3
  label: Return from supernatural absence to mourned relatives
  taxonomy_refs:
  - return
  basis: A hunter tells the man that his relatives had mourned him; the man then returns
    to camp with the Cranes and undergoes rites there.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The duration and initial departure are outside the supplied excerpt.
- id: motif:4
  label: War success through ritual medicine, songs, and omen
  taxonomy_refs:
  - initiation
  basis: The Cranes instruct the man to go on the warpath; he uses four songs and
    a buffalo-chip pile test before a successful raid.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy reference is general; the specific passage motif is war-medicine
    validation rather than initiation alone.
- id: motif:5
  label: Foretold woman spared in raid and taken as wife
  taxonomy_refs: []
  basis: The Cranes foretell that the man must not harm a woman identified by pinto
    horse and elkskin dress; she is captured and later married by him.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents the woman as captive; it does not describe her perspective
    or frame the marriage as a sacred marriage.
- id: motif:6
  label: Human introduces meat eating among bird people
  taxonomy_refs: []
  basis: The man kills deer; cranes and other birds eat with him, and the passage
    states that thereafter the Cranes and many birds ate meat.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The excerpt does not explain whether this is an origin episode or a local
    event within the tale.
- id: motif:7
  label: Secret birth and hidden child in buffalo wallow as bulls arrive
  taxonomy_refs: []
  basis: A young woman conceals pregnancy and childbirth; the child is placed in a
    buffalo wallow, and seven bulls come along after the people leave.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The subsequent role of the bulls and the child is not included in the
    supplied lines.
