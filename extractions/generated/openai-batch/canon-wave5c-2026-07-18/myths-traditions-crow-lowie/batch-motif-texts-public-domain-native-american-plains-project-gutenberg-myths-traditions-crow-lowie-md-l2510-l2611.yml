canonical_text:
  quote: ''
  summary: The passage begins with a public river-swimming episode in which a young
    boy transforms into a buffalo and carries his wife across and back, while Old-Man-Coyote
    imitates the feat by becoming a wolf and fails. It then presents episodes in which
    Old-Man-Coyote threatens or tests a turnip, rose berries, a mouse, and a prairie-chicken
    after demanding second names from them; each name corresponds to an effect that
    harms or humiliates him. The mouse episode explains hair cutting as a mourning
    custom. In the prairie-chicken episode, Old-Man-Coyote falls into a river and
    beaver dam, changes into a baby, is taken in by beavers, and later kills and eats
    two beaver young.
  language: English
  quote_policy: summarized
