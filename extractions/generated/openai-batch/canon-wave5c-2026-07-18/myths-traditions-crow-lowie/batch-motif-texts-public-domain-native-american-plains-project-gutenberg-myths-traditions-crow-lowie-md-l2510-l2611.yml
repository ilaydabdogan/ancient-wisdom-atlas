- id: motif:2
  label: Failed trickster imitation of a successful feat
  taxonomy_refs:
  - trickster_boundary
  basis: Old-Man-Coyote imitates the boy's public swimming transformation but becomes
    exhausted, endangers his wife, is recognized, mocked, and runs away.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The label identifies a narrative pattern; the passage itself does not
    use the word imitation explicitly.
- id: motif:3
  label: Second names reveal powers of nonhuman beings
  taxonomy_refs:
  - trickster_boundary
  basis: Old-Man-Coyote repeatedly demands second names from a turnip, rose berries,
    a mouse, and a prairie-chicken; each second name describes the effect that subsequently
    affects him.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The exact scope of the two-name pattern beyond these episodes is supplied
    only by the passage and its note.
- id: motif:4
  label: Flatulence causes upward flight
  taxonomy_refs:
  - ascent
  basis: After testing the turnip named The-one-to-make-the-winds, Old-Man-Coyote
    breaks wind so forcefully that he goes up into the air and must anchor himself
    to plants and a tree.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The event is a comic bodily episode rather than a solemn ascent; taxonomy
    mapping to ascent is functional and should be reviewed.
- id: motif:5
  label: Plant or berry power causes bodily affliction
  taxonomy_refs: []
  basis: Rose berries named The-one-that-causes-itch cause Old-Man-Coyote to itch
