canonical_text:
  quote: ''
  summary: 'The passage first preserves the end of a tale in which a man follows instructions
    from a comrade: he throws in a buffalo, then captures a young woman and a spotted
    mule and pushes them into the water, after which the comrade grants him shallow-water
    help when named. The passage then gives the tale of four Crow men who follow buffalo
    through a cave to another side of the earth, meet giants who own buffalo as horses,
    help repel animal enemies, and return with buffalo, explaining why buffalo are
    found throughout the country.'
  language: English
  quote_policy: summarized
