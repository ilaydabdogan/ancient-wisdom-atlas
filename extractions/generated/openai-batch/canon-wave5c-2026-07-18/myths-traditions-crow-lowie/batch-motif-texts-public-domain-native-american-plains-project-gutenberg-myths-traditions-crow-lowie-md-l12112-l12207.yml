  text: The chief permits the young man to kill the chief's father; the father dresses
    in fine clothes, mounts a horse, and the young man shoots him, strikes him, and
    takes his bonnet and scalp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After being told to go home, the two Crow men hide in a badger hole while
