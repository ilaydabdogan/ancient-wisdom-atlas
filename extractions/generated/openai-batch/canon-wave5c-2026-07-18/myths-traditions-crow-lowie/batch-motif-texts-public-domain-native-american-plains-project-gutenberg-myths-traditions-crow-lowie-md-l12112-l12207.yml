canonical_text:
  quote: ''
  summary: 'The passage continues a Crow tale in which a young man finds a captive
    youth suspended as an offering during an enemy Sun dance, attempts rescue, undergoes
    an ordeal involving four buffalo skulls, kills the chief''s father by permission,
    escapes with the rescued youth, heals him, returns him to his mourning sister,
    and marries her. It then begins another tale: a Crow woman''s brother is captured
    by Sioux for a Sun dance offering, she seeks a vision and promises marriage to
    whoever returns a part of him, and an orphan young man living with an adoptive
    poor old woman is introduced.'
  language: English
  quote_policy: summarized
