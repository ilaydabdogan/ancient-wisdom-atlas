canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which birds and Thunder assist an
    unnamed man, transform him into eagle and hawk forms, and send him against dangerous
    water animals until a powerful elk called Old Man Hidatsa stops him and tells
    him to return home as a human. It then begins another tale in which a skilled
    young hunter bursts a watery skin-like object, awakens on a high rock in a lake,
    meets featherless young birds and Thunder parents, and prepares equipment to fight
    water monsters that eat the young birds each summer.
  language: English
  quote_policy: summarized
