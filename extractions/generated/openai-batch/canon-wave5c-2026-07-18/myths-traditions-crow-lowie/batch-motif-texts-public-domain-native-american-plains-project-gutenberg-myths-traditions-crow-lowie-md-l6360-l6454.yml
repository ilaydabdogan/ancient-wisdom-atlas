canonical_text:
  quote: ''
  summary: A powerful boy emerges after a fire, revives his two dogs, and presents
    a young woman as his sister after saying he killed Worms-in-his-face. The woman,
    skilled through tanning medicine from female animals, is later visited repeatedly
    by a woman carrying an old man; the visitor sings or says that Black-wolf's liver
    will be eaten and rubs the old man's mucus on the quill-work. The young woman
    repeatedly forgets to warn the brothers until she uses a feather as a reminder.
    Black-wolf says they cannot avert death, sends the dogs to different places, and
    the brothers escape by shooting arrows through the smoke hole and following them.
    Red-woman arrives, recognizes their escape by a feather, follows with a digging-stick
    through the smoke hole, and pursues them.
  language: English
  quote_policy: summarized
