candidate_motifs:
- id: motif:1
  label: Enemies suspend violence overnight
  taxonomy_refs: []
  basis: Two scouts from different groups, apparently on or near the warpath, agree
    not to harm one another during the night and set knives aside.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not specify the broader conflict or all group identities
    beyond the signaled labels.
- id: motif:2
  label: Gambling replaces combat
  taxonomy_refs: []
  basis: The Water-scraper explicitly proposes that the two men not kill one another
    but gamble using sticks for a button game.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The game rules are not described beyond the use of sticks and wagers.
- id: motif:3
  label: Escalating wager to body part
  taxonomy_refs: []
  basis: The wagers move from guns and possessions to clothing and then to a portion
    of scalp; one man ultimately loses and has his scalp cut.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Only a small piece of scalp is specified; the passage does not frame the
    act as ritual beyond the wager and instructions.
- id: motif:4
  label: Scalped loser returns with pursuers and dies
  taxonomy_refs: []
  basis: The scalped man reports the scalper to his mounted comrades, pursues, counts
    coup, and is then shot and killed by the scalper.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The motivations for renewed violence are implied by sequence but not explicitly
    analyzed in the passage.
- id: motif:5
  label: Cunning-man gives practical taboo-like instruction
  taxonomy_refs: []
  basis: Cunning-man lists materials not to use and materials to use for bodily cleansing
    after defecation.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives practical reasons for the rejected materials; it does
    not explicitly call the instruction sacred or taboo.
- id: motif:6
  label: Etiological origin of wife-and-mistress custom
  taxonomy_refs: []
  basis: After the young man marries one woman and takes another as mistress, the
    passage states that this is the origin of the present custom of keeping a mistress
    as well as a wife.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The statement is confined to the custom as described in this passage.
- id: motif:7
  label: Marriage obtained by social entrapment
  taxonomy_refs:
  - trickster_boundary
  basis: Cunning-man draws an unmarried girl into his tent, seats her on his son's
    bed, summons old men who block her exit, and the people then say she is married
    to his son.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The plain motif is strongly supported; the taxonomy reference to trickster-boundary
    behavior is interpretive and should be reviewed.
