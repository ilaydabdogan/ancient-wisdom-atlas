canonical_text:
  quote: ''
  summary: A tale segment describes two scouts from different groups meeting at a
    rock in heavy rain, agreeing not to kill one another overnight, gambling for possessions
    and eventually for scalps, followed by pursuit and killing. The passage then identifies
    the tale with Cunning-man and includes separate Cunning-man episodes explaining
    cleansing materials, advice leading to wife-and-mistress practice, and a marriage
    arranged by trapping a young woman in Cunning-man's tent before witnesses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two armed scouts come to the same rock during pouring rain, sleep close together,
    and communicate by signs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The scouts identify themselves as a Water-scraper and a Carrot-eater and agree
    not to harm each other during the night.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Water-scraper proposes gambling instead of killing, using sticks for a
    button game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gambling wagers escalate from guns and personal property to clothing and
    scalp.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Carrot-eater wins back his property and then wins the Water-scraper's
    scalp.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The scalped Water-scraper asks for moccasins and breechcloth back, instructs
    the other man how to cut a small piece of scalp, and sends him to shake the scalp
    from a hill.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The scalped man returns to his mounted comrades, reports the scalper's location,
    and they pursue the scalper and his people, who are on foot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the pursuit, the scalped man counts coup on the scalper, and the scalper
    shoots and kills him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage identifies the episode as a Cunning-man story and a baitsitsiwe
    tale; a note says the connection to the Cunning-man cycle is unclear and that
    it recalls the Gamblers motive.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cunning-man tells people not to use driftwood, buffalo chips, or dirt for
    wiping after defecation and recommends sagebrush and barked wood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A young man asks Cunning-man for advice about a woman; Cunning-man tells him
    to propose privately and, if she agrees, lie with her that night or run away with
    her the next morning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young man marries the woman, then goes to another girl and lies with her
    as a mistress; the passage states this as the origin of the present custom of
    keeping a mistress as well as a wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Cunning-man gathers wood during a time of scarcity and uses a meal invitation
    to bring an unmarried girl into his tent for his son.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Cunning-man seats the girl on the boy's bed, summons old men to smoke inside,
    and the old men sit around her so she cannot get out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the smoking gathering, people say the girl is married to Cunning-man's
    boy.
  category: sequence
  evidence_refs:
  - ev:9
