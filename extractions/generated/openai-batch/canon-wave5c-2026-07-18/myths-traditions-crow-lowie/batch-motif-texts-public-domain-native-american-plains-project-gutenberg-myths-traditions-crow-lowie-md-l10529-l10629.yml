  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being struck, the elder sister circles and cries like a bear, turns
    into a bear, and is delayed when her feet and rump get stuck on awls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl runs toward her brothers and follows their tracks while the bear
    frees herself, follows the tracks, and threatens to eat her even if she is a ghost.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The girl throws the elder sister's porcupine quills in all directions, and
    the bear stops to gather them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers kill a buffalo, clean its manifolds, and give them to the girl;
