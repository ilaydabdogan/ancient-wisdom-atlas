canonical_text:
  quote: ''
  summary: A younger sister explains that her elder sister became a bear, destroyed
    people, and will eat her unless she brings a jack-rabbit pierced with a digging-stick.
    Elder brothers help kill and prepare the jack-rabbit, then instruct the girl in
    escape tactics. The girl strikes the elder sister's shinbone, causing her to turn
    into a bear and pursue her. The pursuit is delayed by planted awls, scattered
    porcupine quills, and buffalo manifolds that become flat rocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger sister says she caused her elder sister to become a bear, that
    the elder sister destroyed many people, and that the elder sister now wants to
    eat her if she cannot bring a pierced young jack-rabbit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brothers arrive at a camp that looks destroyed and help obtain a
    young jack-rabbit by shooting it with an arrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers instruct the girl to pierce the jack-rabbit with a digging-stick
    and give it to her elder sister as the requested object.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The elder sister accepts the jack-rabbit, questions how it was done, and says
    she thinks the girl did not kill it by herself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers tell the girl they will stay on a pointed hill for four days,
