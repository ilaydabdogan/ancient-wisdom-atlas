canonical_text:
  quote: ''
  summary: A young Hidatsa named Black-elk is abandoned by a hostile war-party leader,
    becomes exhausted, and lies on a high hill expecting death. A little boy finds
    him, persuades his parents to help, and the father carries Black-elk home, where
    he is healed. Black-elk then helps the boy catch eagles, makes him a bow and arrows
    from chokecherry wood and feathers, receives arrowheads made from transformed
    leaves through the father's instruction, and later kills a deer while teaching
    the boy not to fear it.
  language: English
  quote_policy: summarized
