canonical_text:
  quote: ''
  summary: A Crow orphan or young man goes to a Sioux camp to recover a young woman's
    brother, who has been tied high to a Sun dance pole and offered to the Sun. He
    frees the captive but both are caught; Sioux chiefs debate killing them and impose
    an ordeal over seven buffalo skulls. The captive is said to have been adopted
    by the Sun and passes the ordeal. The rescuer hides him, retrieves weapons and
    animals, nourishes and heals him with buffalo blood, meat, fat, and fire-cooked
    food, follows the captive's reading of sun dogs to avoid a Sioux war party, and
    returns toward camp to bring the captive's sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The orphan or young man decides to go after the young woman's brother despite
    his grandmother's urging not to go; she makes him moccasins before he sets out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Sioux camp, a Sun dance structure stands in the center, with a high
    central pole, and the captive is tied high to it in the sign of a cross.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man enters at night, climbs a leaning pole during singing and drumming,
    reaches the captive, frees his arms and legs, and carries him down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman in the fourth circle of tents sees the escape, calls out, and the
    Sioux catch both Crow persons and take them to the chief's tipi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief says the boy had been offered to the Sun, but that the Sun has saved
    him; other chiefs arrange a test with seven buffalo skulls, with the first skull
    painted black and the last red.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The captive is said to have been adopted by the Sun while tied to the poles,
    wears a plume on his head, and walks across the skulls without fatal stumbling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rescuer carries the captive over a hill, hides him in a deep hole in a
    coulee under thistles with the plume sticking out, and lies flat nearby while
    pursuing Sioux fail to find them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the Sioux return, the rescuer goes back to the camp, retrieves his gun
    and knife, takes horses and mules, and supports the weakened captive on horseback.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: During the journey the rescuer kills buffalo, gives the captive blood and
    meat, cooks and roasts fat and ribs over fires, greases his sores with fat, and
    makes riding equipment from buffalo skin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The rescuer tells the captive that the captive's sister promised to marry
    anyone who brought back any part of her brother; the young woman later dreams
    that she will see part of her brother.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The captive tells the rescuer to look at the sun; after seeing changing sun
    dogs, he directs them toward the mountains, from which they see a Sioux war party
    moving where they had been.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At a coulee with a stream and buffalo, the rescuer kills buffalo again and
    then goes to camp to bring the captive's sister.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The rescuer finds his grandmother crying away from camp; she recognizes him,
    embraces him, and goes to fetch the young woman.
  category: action
  evidence_refs:
  - ev:12
