canonical_text:
  quote: ''
  summary: The passage first recounts Humpback reaching the Crow camp, reporting events
    involving Size-of-iron, and Holds-the-tail mourning and making a Sun dance with
    prescribed preparations, regalia, dancing, and fasting. It then tells of the Hidatsa
    warrior Lifts-heart, who refuses to surrender to Sioux enemies, survives while
    other Hidatsa companions are killed, repeatedly attacks Sioux chiefs in camp,
    sings a recognizable song, steals horses, and later resists another Sioux encirclement
    from a pit near water until the Sioux retreat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Humpback runs to the Crow camp, where a crowd asks what happened, and he tells
    them about his experience and about Size-of-iron.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Holds-the-tail’s little girl hears Humpback’s report and goes crying to Holds-the-tail.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Holds-the-tail is described as extremely sad, cuts his hair while leaving
    hair on the crown for a feather, eats little, cries repeatedly, and prepares to
    make a Sun dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A crier announces that buffalo tongues are to be saved for the Sun dance,
    and the people move to the Big Horn for Sun lodge preparations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun lodge pole preparation includes a red-painted woman slave for the
    berdache ceremony, a special song, four feigned chops at the tree, and then cutting
    the tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Brave men with coups act as police, people ride double to bring poles, parents
    bring presents, and the doll-owner receives presents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Sun dance pledger wears plumes on his little fingers and crown hair, a
    soft male mountain-goat skin as a kilt, skin anklets, and a feathered whistle;
    he is painted white, dances to songs, and fasts for four days.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Hidatsa war party makes pits near a creek after being taken unawares; enemies
    urge them to meet, but Lifts-heart and a little boy refuse to give up while the
    rest accept gifts and surrender their guns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lifts-heart threatens approaching Sioux with his gun, refuses horses as gifts,
    and shoots a Sioux chief who walks up to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Lifts-heart shoots the chief, the disarmed Hidatsa are killed, while
    Lifts-heart remains with the boy and kills a number of enemies before they retreat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lifts-heart follows the enemy to their camp, enters or approaches large central
    tipis at night, kills chiefs, sings his song, and the Sioux become afraid of him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: During one night encounter, Lifts-heart steals two horses, kills a woman who
    questions him, sings his song, and returns home with horses and a little brother
    riding one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On a later war party, Lifts-heart and his people hide in a pit in a lake or
    marshy area when the Sioux camp surrounds the lake; he kills a woman fetching
    water and fights back against encirclement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the lake pit, Lifts-heart sings his song; the Sioux identify him as the
    feared person, move camp, leave property behind, and he takes what he wants.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The narrator states that Holds-the-tail died only a few years earlier and
    that this was one of the last Sun dances.
  category: other
  evidence_refs:
  - ev:8
