canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a boy stays in a tall tree
    because of a calf, kills two men going skyward, ascends, and becomes the morningstar.
    It then begins the tale “Lodge-Boy and Thrown-Away,” in which a female visitor
    kills a pregnant wife, throws one baby behind a lodge curtain and another into
    a spring, stages the wife’s corpse, and one surviving child later emerges to his
    father while the spring child remains associated with the spring.
  language: English
