canonical_text:
  quote: ''
  summary: A one-eyed woman described as plain announces she will marry and is laughed
    at. Hu'arawic, also called Comes-all-the-time in the passage, visits the women's
    shelters, stays with her despite invitations from handsome women, marries her,
    and has a son. After two or three years, five comrades from his own band bring
    his blanket and flute to fetch him home. They find him dirty, unkempt, badly dressed,
    and unresponsive with a baby. Through Little Dog songs, incense, his blanket and
    flute, and blowing toward the four directions, they restore him to his senses.
    He expels several bad things from his mouth, washes, is combed and dressed, receives
    presents, and returns home looking as before. The woman runs away and is said
    to have man-bewitching power.
  language: English
  quote_policy: summarized
