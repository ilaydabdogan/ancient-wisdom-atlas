canonical_text:
  quote: ''
  summary: 'The passage recounts the story of Knife and Comes-from-across: she refuses
    Knife, is captured by enemies, and later escapes from an enemy chief-husband to
    return to Knife with a horse. It also begins a separate buffalo episode in which
    a young hunter repeatedly shoots a bull buffalo without injuring it.'
  language: English
  quote_policy: summarized
