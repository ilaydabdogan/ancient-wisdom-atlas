  summary: 'A boy defeats several dangerous beings or places after warnings: a self-cooking
    bucket connected with an old woman, a snake lodge reached after help from a jack-rabbit,
    a leaning tree that kills animals, and a widening creek or coulee. The passage
    ends by introducing a lake-dwelling buffalo monster that eats people by drawing
    things into its mouth.'
