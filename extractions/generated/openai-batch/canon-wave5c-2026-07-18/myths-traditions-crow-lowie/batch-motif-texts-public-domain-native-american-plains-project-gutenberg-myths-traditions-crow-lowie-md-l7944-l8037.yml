  quote: ''
  summary: The passage closes an eagle-patron tale in which a young man is sent home
    by eagle helpers with medicine, eagle tokens, and instructions for an eagle-painted
    tipi that later gives weather knowledge. It then begins a tale titled “A Visit
    to the Sun,” describing ducks creating humans from mud in tribal pairs, followed
    by a Hidatsa fasting quest in which cranes carry him toward the Sun, Moon instructs
    him how to approach, and he witnesses the Sun’s household, its fiery faces, extraordinary
    hospitality, human-body food, and a fog-making act by the Sun’s son.
  language: English
  quote_policy: summarized
