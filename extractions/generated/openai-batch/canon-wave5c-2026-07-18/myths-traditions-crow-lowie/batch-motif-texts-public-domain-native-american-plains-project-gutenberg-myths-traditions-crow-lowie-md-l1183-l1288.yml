canonical_text:
  quote: ''
  summary: The passage recounts several Old-Man-Coyote episodes involving Ci'rape',
    mice at a Sun dance, buffalo, a little coyote, and food acquisition. Old-Man-Coyote
    fails to escape after taking an arrow; enters a mice Sun dance and gets his head
    stuck in a buffalo skull; uses Ci'rape' as a dancer to make buffalo laugh until
    two die; later harms Ci'rape' after Ci'rape' eats and discards pemmican; and obtains
    fat from a little coyote through an exchange and then takes back the game stick.
    Embedded editorial notes compare some motives with other published collections
    and a Kutenai occurrence.
  language: English
  quote_policy: summarized
