canonical_text:
  quote: ''
  summary: The passage recounts Crow historical traditions about encounters with White
    visitors who bring iron, later guns, and trade goods. Elders interpret the arrival
    of iron through an earlier prediction, discuss the name Crow, experiment with
    iron arrowheads, and repeatedly instruct selected youths to remember the events.
    Later visitors demonstrate flintlock guns; the Crow eventually obtain guns from
    the Hidatsa. A White chief named Crane settles among the Crow, marries an Indian
    woman, builds a house, and later brings guns, powder, and other goods by river
    boat; Long-knife also arrives with a loaded boat.
  language: English
  quote_policy: summarized
