canonical_text:
  quote: ''
  summary: Old-Man-Coyote tries to obtain fat from ice, becomes stuck, summons animals
    under the claim that he created them, and uses them to free himself and obtain
    food. Ci'rape' eats his stored food and is punished. A narrator note identifies
    the securing of fat as a recurring Old-Man-Coyote-cycle motive. The passage then
    begins a variant in which coyotes make fat come from ice with rock bells, Old-Man-Coyote
    imitates them despite a warning not to do it four times, becomes stuck, and sends
    birds and a raven to summon animals.
  language: English
  quote_policy: summarized
