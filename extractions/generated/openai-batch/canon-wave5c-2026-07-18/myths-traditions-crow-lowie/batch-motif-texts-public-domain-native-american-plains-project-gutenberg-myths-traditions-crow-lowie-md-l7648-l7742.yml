canonical_text:
  quote: ''
  summary: A young son-in-law is repeatedly sent by his father-in-law on difficult
    tasks. A bear patron helps him obtain out-of-season fruit, a flawless bow and
    arrows made through animal and material transformations, and finally a spotted
    buffalo. The father-in-law tries to kill the buffalo with the supplied bow and
    arrows, but the arrows fail, the buffalo kills him, and the people learn that
    he had destroyed other young men before.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man takes a gun and sack, travels upstream in a blizzard, and reaches
    a source where there are rocks, a cave, and berry branches.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bear calls the young man, hears that the father-in-law demanded ripe sarvis-berries,
    takes him into a cave, and lets him fill the sack with berries and berry branches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear tells the young man that the father-in-law will give four tasks,
    that one will be hard, and that the young man will accomplish it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man returns to camp crying with the fruit; his wife meets him, and
    the old man accepts that the task has been done.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four days later the old man sings and orders ripe plums with fresh chokecherry
    branches; the young man goes to the bear den, obtains them, and returns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man demands a cedar bow with sinew backing and ten flawless arrows
    with eagle tail feathers and blue points.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bear obtains a feather from an eagle; a leaf, grapes rubbed on grass,
    a snake, and weed bark become components of the bow and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the final task, the old man orders the young man to drive a spotted buffalo
    to his door; the bear says this is the hard task and instructs him how to approach
    the buffalo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man follows the bear's instructions, circles four times, and drives
    the spotted buffalo to his father-in-law.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man shoots four times, but the arrows crumple; the buffalo horns him
    and tears him apart.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man gathers the old man's remains, throws them into the spring,
    later returns home, and the people learn how other young men had been destroyed.
  category: sequence
  evidence_refs:
  - ev:7
