canonical_text:
  quote: ''
  summary: The passage contains several Crow traditions. In the first, a Hidatsa war
    party reaches a Crow camp, scouts it, hears speech that suggests kinship, recognizes
    Crow language and material culture, and is eventually received as relatives; later
    some Hidatsa remain and marry there, while exchange of horses and agricultural
    foods connects the groups. A second section explains the origin of the U'wutace
    clan name through Old-Man-Coyote's instruction to marry and an orphan boy whose
    spittle mixed with grease affects a fire and prompts ridicule. A final fragment
    begins a peace-making story by describing a destroyed Crow camp, captured kin,
    and survivors leaving.
  language: English
  quote_policy: summarized
