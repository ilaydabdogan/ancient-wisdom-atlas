canonical_text:
  quote: ''
  summary: A young woman follows a man through a sequence of smoky shelters where
    food and water are present. At first he does not invite her to eat and they sleep
    apart; at the fourth stop he invites her to sit by him, share food and water,
    and sleep with him, saying he will marry her if she is powerful. They reach his
    camp, where he is identified as Worms-in-his-face. His mother receives the woman.
    The woman later sees that her husband has no nose and worms come from the hole
    in his face. He hunts a buffalo and orders his wife to tan and quill-embroider
    the hide in one day. She weeps because she cannot do it, but a badger summons
    female animal and insect helpers who process the hide.
  language: English
  quote_policy: summarized
