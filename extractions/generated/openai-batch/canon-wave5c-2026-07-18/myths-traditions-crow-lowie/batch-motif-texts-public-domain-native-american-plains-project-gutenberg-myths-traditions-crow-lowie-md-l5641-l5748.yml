canonical_text:
  quote: ''
  summary: 'A bird-like husband departs after promising aid and saying his son will
    be like him. The son, Looks-down, grows up, sits on a hilltop rock pile, and is
    approached by two women from below and above. They bring paired moccasins and
    corn gifts and become his wives, later named Buffalo-woman and Corn-woman. Each
    gives birth in a place associated with her nature: Buffalo-woman at a buffalo
    wallow, transforming into a buffalo and bearing a calf that becomes a baby; Corn-woman
    in a cornfield. Their sons quarrel over a game, the wives argue, and Buffalo-woman
    leaves with her son while Corn-woman tells Looks-down to follow Buffalo-woman.
    Looks-down repeatedly flies as a bird to observe or seek them.'
  language: English
  quote_policy: summarized
