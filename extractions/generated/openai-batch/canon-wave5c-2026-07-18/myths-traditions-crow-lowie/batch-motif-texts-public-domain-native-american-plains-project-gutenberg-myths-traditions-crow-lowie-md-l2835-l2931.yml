canonical_text:
  quote: ''
  summary: A powerful boy repeatedly tests or violates warnings from his grandmother.
    Red corn becomes blackbirds, which she revives. He kills otters that are revealed
    as her husbands, prompting mourning and an etiological note. He defeats a dangerous
    woman by using her boiling jug against her. Later he is trapped in a tree by one
    of two sharp-shooters using a buffalo calf foetus, bargains for release, and the
    grandmother avoids the men and Old-Man-Coyote by becoming a pumpkin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman tells the boy he may eat all kinds of corn except red corn;
    he cooks red corn, and it bursts and turns into blackbirds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy shoots and kills many blackbirds; the old woman plucks them, makes
    them alive again by talking and praying to them, and lets them go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy finds otters eating corn behind curtains in the tipi and kills them
    with arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandmother packs away the killed otters, which are identified as her
    husbands, and cuts her fingers and legs in mourning; the passage states that Crow
    Indians have done the same since then.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The otters speak while being packed away, warning that the boy is powerful;
    the grandmother carries them to a little hill, and the place turns into a little
    river called Short-river by the Hidatsa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The grandmother warns the boy about a dangerous comrade whose rawhide jug
    boils anyone toward whom she turns its opening.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy gives the dangerous woman a belt of birds as food, secretly takes
    her jug, causes an eagle to fall into it, then turns it on the woman so that she
    is drawn in and boiled; he brings the jug to his grandmother for carrying squashes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The grandmother warns the boy about two sharp-shooters who can shoot anything
    and run all day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy finds the two men killing a young buffalo; the bad man chases him
    with a calf foetus, and the boy climbs a tree where the foetus is hung below him
    until he becomes skin and bones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The good man says they should take the boy down, but the two men first demand
    that the boy let them possess his grandmother; the boy reports this to her, and
    she agrees to see them in four days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In four days the two men arrive with Old-Man-Coyote, and after the encounter
    Old-Man-Coyote suspects that something is wrong and asks whether they possessed
    the right woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that the old woman had turned into a pumpkin and that the
    men and Old-Man-Coyote had possessed a pumpkin; Old-Man-Coyote then leaves his
    two comrades for good.
  category: attribute
  evidence_refs:
  - ev:5
