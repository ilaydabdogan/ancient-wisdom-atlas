  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No formal taxonomy reference for this motif family was supplied in the
    available list.
- id: motif:5
  label: Refuge helper with guardian animals kills pursuer
  taxonomy_refs: []
  basis: At the white tipi, a little boy helps the fleeing woman; his tiger and bear
    attack and kill Red-woman when she seizes him.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The tiger and bear are called the boy's dogs; the passage does not explain
    their nature beyond this.
- id: motif:6
  label: Permanent destruction by burning and controlling sparks
  taxonomy_refs: []
  basis: Red-woman is burned, and each escaping spark is put back, after which the
    tale says there is no more Red-woman.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Although fire is central to the destruction, the episode is local and
    does not support the supplied world-destroying-fire taxonomy family.
