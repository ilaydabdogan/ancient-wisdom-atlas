canonical_text:
  quote: ''
  summary: The excerpt contains the tale of Red-woman and the opening of The Bear-woman.
    In Red-woman, a water animal transformed into a young man courts a woman at a
    spring, brings her to his dwelling, and subjects her to dangerous tasks and a
    death trap associated with a buffalo skull and river beings. An old woman and
    animal helpers aid the woman, who escapes Red-woman by using objects that become
    barriers. A little boy at a white tipi and his tiger and bear kill Red-woman,
    whose body is burned. The boy's seven brothers then go up and become the Seven
    Stars. The Bear-woman opening presents a young woman without a lover whose younger
    sister tells her to imitate a bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red-woman adopted a good-looking young man as her younger brother; he was
    originally a water animal whom she transformed into a man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an Indian camp, people reached the spring by stepping on an old buffalo
    skull; a young woman stepped on the skull while getting water and found a young
    man beside her.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man spoke courtship words to the young woman; she trusted him, fetched
    her property, and followed him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman in a tipi warned the young woman that the man's sister was bad
    and that the young woman would be made to tan the hide of a big buffalo bull.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Following the old woman's instruction to ask for help, the young woman called
    for aid and ants cleaned, scraped, and tanned the buffalo hide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red-woman urged her brother to hurry because she was anxious to get rid of
    the young woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At bath time the husband told his wife to stand on a buffalo skull; after
    moles softened the ground, she slipped through a hole, and river beings called
    fathers ate the husband instead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young woman had hidden porcupine quills, powdered material, digging-sticks,
    and a root-digger received after the old woman's advice.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the river beings realized whom they had eaten, they restored the man
    to life; he told Red-woman what had happened, and she pursued the young woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'During the pursuit, the young woman''s thrown or used objects became barriers:
    quills became cactus, powder became thistle-like trees, a digging-stick became
    a gulch, and a line drawn with a root-digger became a swift stream.'
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The young woman reached a white tipi and asked a little boy for help; he told
    her to run around four times and come in.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Red-woman seized the little boy, but the boy told his sister to release his
    dogs, a tiger and a bear, which attacked and killed Red-woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Red-woman's body was burned, and every spark that jumped away was put back;
