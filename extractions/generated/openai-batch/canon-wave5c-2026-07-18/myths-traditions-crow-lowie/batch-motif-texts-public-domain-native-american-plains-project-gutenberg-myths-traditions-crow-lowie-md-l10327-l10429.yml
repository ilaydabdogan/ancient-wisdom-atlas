- id: motif:1
  label: Transformed water-animal husband
  taxonomy_refs:
  - shapeshifter
  basis: The adopted younger brother is explicitly said to be a water animal whom
    Red-woman transformed into a man, and he becomes the young woman's suitor and
    husband.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage states transformation but does not name the water animal.
- id: motif:2
  label: Dangerous supernatural spouse and bride ordeal
  taxonomy_refs: []
  basis: The transformed husband brings the young woman into Red-woman's household,
    gives her a difficult buffalo-hide task, and later leads her into a bath trap.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames the danger through events and the old woman's warning;
    it does not supply an explicit motif label.
- id: motif:3
  label: Animal helpers complete impossible task
  taxonomy_refs: []
  basis: When the young woman calls for help as instructed, ants clean, scrape, and
    tan the buffalo hide to the husband's satisfaction.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only the hide-working task is included in this excerpt.
- id: motif:4
  label: Magical flight with obstacle transformations
  taxonomy_refs: []
  basis: The fleeing woman uses quills, powder, a digging-stick, and a root-digger,
