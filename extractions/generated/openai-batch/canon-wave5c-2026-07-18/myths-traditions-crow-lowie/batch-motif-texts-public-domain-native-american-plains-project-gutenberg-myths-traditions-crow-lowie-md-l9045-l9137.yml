canonical_text:
  quote: ''
  summary: One-eye throws an orphan boy into a hole in the ice, where the boy enters
    a tipi in the water occupied by a man, a woman, and animal guardians. The man
    says One-eye has misused medicine powers, gives the boy a choice of medicines,
    and instructs him to provoke One-eye during three buffalo events and eventually
    kill him. The boy returns, takes buffalo tongues and meat during repeated hunts,
    and maintains contact with the man below. One-eye becomes afraid and later threatens
    the boy. The boy receives further instructions for a life-staked horse race on
    the ice. One-eye's injured youngest wife marries the boy and refuses to return.
    The passage ends as the boy prepares his horse and rides onto the ice for the
    race.
  language: English
  quote_policy: summarized
