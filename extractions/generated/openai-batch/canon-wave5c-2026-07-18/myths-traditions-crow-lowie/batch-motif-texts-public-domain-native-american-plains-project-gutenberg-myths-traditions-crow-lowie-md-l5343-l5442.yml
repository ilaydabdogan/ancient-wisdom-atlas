canonical_text:
  quote: ''
  summary: Yellow-dog conducts a fire ritual with four balls, collective shouting,
    and red body paint; a white wolf comes from the fire, and Yellow-dog announces
    a Chinook wind. After a warm wind, Yellow-dog directs searches for buffalo chips,
    scouting from a high hill, and repeated total kills of buffalo herds, which restores
    food to the camp. A wounded four-year-old buffalo escapes to Morningstar, who
    questions it and sends animal messengers to inspect Yellow-dog’s tipi or camp.
    A weak-looking wolf warns Yellow-dog by sending out his spirit, and the sparrow,
    magpie, and fox messengers are killed or trapped. Morningstar then sends Old-Man-Coyote
    to investigate.
  language: English
  quote_policy: summarized
