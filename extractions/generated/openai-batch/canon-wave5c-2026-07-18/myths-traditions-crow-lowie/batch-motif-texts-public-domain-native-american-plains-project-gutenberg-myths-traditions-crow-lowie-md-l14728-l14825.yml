  quote: ''
  summary: The passage recounts Big-iron challenging Thunder and aquatic dangerous
    beings, explaining and prophesying the meaning of iron and Yellow-eyes/Whites,
    and a later generation recognizing the prophecy when White visitors arrive with
    iron objects and trade goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big-iron calls Thunder his brother and says he is going to have fun with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During cloudy thunder, Big-iron paints himself white and rides a gray horse
    with a sheepskin blanket, spear, and shield.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thunder tries repeatedly to strike Big-iron with lightning, but Big-iron is
    always in another place and the lightning strikes elsewhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Big-iron takes out a warclub and pretends to throw it at the lightning; afterward
    the clouds break and blue sky appears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Old men ask Big-iron what the word “iron” in his name means; he first responds
    with an obscene trick, then says iron lasts longer than anything else and is hard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Big-iron compares hard rocks and iron with his own body and says that someday,
    when tired of living, he will die.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: At a cliff near the Big Horn confluence, Big-iron seizes a large turtle by
    the neck, and the water begins to rise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Big-iron puts the turtle in sand for four days, then releases it and orders
    the water to stay low so the Indians may have a ford.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A water buffalo appears, and Big-iron orders it to remain in the water and
    never show its head again; the narration says this came true.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The narration summarizes that Big-iron played with dangerous things, including
    Thunder, water, and the turtle.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Big-iron tells older men he does not want to hurt them but is after the big
    ones, to show he is greater than they are.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Big-iron says iron is owned by Yellow-eyes, identified parenthetically as
    Whites, and prophesies that ten generations after his death the Crow will know
    iron and Yellow-eyes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: After living four times or four generations, Big-iron repeats that after six
    more generations the people will see the Whites and that Yellow-eyes will be the
    first name applied to them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: After Big-iron dies, his prophecy is handed down to the ninth generation,
    where an old man instructs ten young men to remember it and to use iron if it
    comes true.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Two of the ten young men live to old age, hear of two yellow-eyed men, bring
    the Whites before them, and regard Big-iron’s prophecy as verified.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The White visitors say they live across water, came to look over the country,
    and wish to be at peace.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The White visitors produce beaver traps, an iron-headed arrow, and a wrapped
    piece of iron; they say the arrow and clothing were bought from Mexicans.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:18
  text: The old man points to the flat wrapped iron and tells his comrade that the
    prophecy has come true and that their children will not starve owning it.
  category: speech
  evidence_refs:
  - ev:9
