canonical_text:
  quote: ''
  summary: A skilled young hunter encounters a mysterious white moving thing, loses
    consciousness, and awakens stranded on a high rock. He finds two young birds,
    is addressed as their brother, receives water and food from bird parents, and
    is asked to protect the young from water monsters. With materials supplied by
    the birds, he prepares fires, hot stones, hide containers, and arrows, then kills
    two monsters that come from the water. Afterward a raven is sent to announce a
    feast to the birds, and several birds attempt to cut up the slain monster.
  language: English
  quote_policy: summarized
