  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The siblings sit smoking on a pointed hill and discuss what they should become
    because they have no lodge and cannot do anything for themselves.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The younger sister proposes that they become the Dipper, described as where
