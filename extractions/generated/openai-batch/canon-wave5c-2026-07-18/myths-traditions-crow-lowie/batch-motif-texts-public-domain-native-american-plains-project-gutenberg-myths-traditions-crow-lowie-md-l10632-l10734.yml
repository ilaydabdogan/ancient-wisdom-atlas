canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a younger sister uses a
    cleaned stomach part that becomes holes in the ground to stop a supernatural bear-like
    pursuer. The siblings then decide to become the Dipper and establish a relation
    with pipe smoke offerings. A shorter Dipper variant says the Seven Stars rejected
    several perishable forms before becoming the Dipper. The passage then begins a
    tale of Splinter-foot, in which two young men find a young woman wrapped in an
    elk hide, remove a deer-horn splinter from her foot, and she says both have married
    her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brothers give their younger sister a cleaned stomach part and tell
    her to spread it behind her when the bear overtakes her.
  category: action
  evidence_refs:
