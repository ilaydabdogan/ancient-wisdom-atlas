canonical_text:
  quote: ''
  summary: 'A woman sees her people below through openings in the earth, is lowered
    with her son by a sinew rope, and dies when the rope breaks. The surviving boy
    is later adopted by Hicictawia, Red-woman, and overcomes a series of dangerous
    beings, places, and objects: bears, a closing coulee, a fog-causing long-otter,
    a falling tree, and a man with fire-moccasins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman sees earth and her people after digging up a turnip; after moving
    buffalo chips against her husband’s instruction, she again sees her people below.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband sends men to kill a buffalo, bring sinews, make strings, and use
    them to lower the woman and her son through the enlarged hole.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The sinew rope does not reach the ground; after forgotten sinew is noticed,
    a stone is told to strike the woman’s head, the rope breaks, and the woman dies
    when they reach the ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy remains alive on the ground while his father above watches him and
    says he will send the boy away because the boy’s mother was no good.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy follows a path through woods to a garden, eats corn there, is tracked
    and trapped by Hicictawia, Red-woman, and agrees to live with her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy brings whole buffalo bodies to the old woman, but the meat repeatedly
    disappears in a few days without bones remaining, and the woman becomes afraid
    of him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the old woman warns him not to go to a thicket, the boy goes there,
    is charged by bears, kills them all, cuts off their claws, and brings the claws
    home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being warned about a coulee that closes on crossers, the boy tricks
    it by feinting a jump, jumps back and forth, and commands it to remain still forever.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Morning fog is attributed to a nearby spring; the boy discovers a long-otter
    from the spring eating hidden pudding, kills it, and the old woman identifies
    the long-otter as her husband.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old woman sends the dead long-otter to the rivers and says that God’s
    son is present there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After being warned about a leaning tree with many bones beneath it, the boy
    causes the tree to fall, jumps on it, walks over it, and commands it not to rise
    again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The boy takes fire-moccasins from a sleeping man, uses them, burns the man
    by kicking at him, brings the moccasins to the old woman, and leaves them tied
    to a tree outside because they keep burning.
  category: sequence
  evidence_refs:
  - ev:9
