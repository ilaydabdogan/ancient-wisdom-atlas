canonical_text:
  quote: ''
  summary: The passage recounts Crow war episodes involving the Sweater, horse raids
    against Dakota/Sioux enemies, a buffalo-hide ritual and prayer to the Sun, a later
    one-hundred-pole sweatlodge with offerings and communal well-being, and the beginning
    of an account of Bare'ate, a Sun-worshiper who makes a ritual hoop, leads children
    in a longevity pledge, predicts enemy arrival, and gives offerings during a chase.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war with the Dakota occurs while Crow men are fighting; the Sweater makes
    a sweatlodge, ties a split-eared horse near camp, then mounts a bay horse and
    goes to the battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An enemy Dakota or Sioux rider on a dark bay pinto, wearing a bonnet, repeatedly
    drives back the Crow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sweater catches the enemy rider on a horse brought from the enemy, shoots
    him twice in the back, takes his horse, bonnet, and feathered stick, and strikes
    a coup.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After this killing, the Crow chase the Sioux and obtain many mules and horses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Red-bear later leads a war party toward the Bighorn Mountains; the party makes
    medicine by smoking roots, and scouts locate an enemy camp and horse corral.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Sweater and Spotted-horse enter the large corral, take or cut loose selected
    horses, open part of the corral, and begin leading horses out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Sweater returns to cut the remaining ropes in the corral, drives the horses
    out, rejoins Spotted-horse, and the party brings back seventy horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the return, the Sweater says that Spotted-horse will kill a white buffalo;
    later a herd appears with a white buffalo among it, and Spotted-horse kills a
    gray buffalo and another buffalo.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The party makes a life-sized buffalo figure out of chips, leaves the hoofs
    and head on the skin, covers the figure with the skin, and burns a little ise
    at the head and at the back on each side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: They speak to the hide and pray to the Sun; the Sweater prays for safety and
    says he has worked hard to save the others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The party stops by a coulee with water, eats, and gets home safely; at home
    they sing songs and go around the camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Sweater becomes famous and is reckoned among the bravest men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: After returning home, the Sweater makes a one-hundred-pole sweatlodge, invites
    medicinemen, and has children bring wood and beads as offerings to the sweatlodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The children dig a hole in the middle and put offerings where rocks would
    otherwise be placed; the narrative then says there was no sickness, many people
    had children, and those children multiplied.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Sweater is said to have done what was right, lived to be one hundred years
    old, and then died.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Sun-worshiper gives whatever he gets to the Sun and makes a willow hoop
    with four black-painted sharp sticks, buffalo-hair rope, eagle feathers, sagebrush,
    a handle, and a blanket piece with a black circle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Before sunrise, a pledge to the Sun begins with song; when the sun rises,
    the worshiper points the hoop toward the sun and sings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: The worshiper sticks the willow hoop into the ground and tells children to
    touch it and say they will live long, have no sickness, and live well.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:19
  text: Bare'ate, whose name is glossed as He-makes-offerings-always, says the enemy
    will come in four days, and on the third night tells the herald to announce that
    the enemy will be seen the next day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: On the fourth day the enemy comes, steals some horses, and the Crow chase
    them; Bare'ate gives offerings and later feathers to the Sun during or after the
    chase.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:21
  text: Because Bare'ate has given offerings to the Sun, a man calls on him for help,
    but Bare'ate says he can do nothing for him.
  category: speech
  evidence_refs:
  - ev:7
