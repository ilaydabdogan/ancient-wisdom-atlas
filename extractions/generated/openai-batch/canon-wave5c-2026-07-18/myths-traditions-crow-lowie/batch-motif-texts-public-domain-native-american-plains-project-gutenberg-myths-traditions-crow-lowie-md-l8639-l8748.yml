canonical_text:
  quote: ''
  summary: A boy learns from a dwarf that Whiteheaded-eagle arranged his capture so
    he could kill a dragon or long-otter that eats young eagles. The boy kills the
    dragon with red-hot rocks, is blessed by Eagle and the birds, receives arrows
    and place-marking instructions from the dwarf, returns home, and becomes a headman.
    The passage then gives a short account of dwarf tracks and dwarf medicine obtained
    through fasting, dream summons, cave encounter, adoption, and gift of medicine.
    It ends with the opening of a tale in which a tyrannical man accuses a poor young
    man, causing the young man and a woman to depart with provisions, later suffering
    hunger after their supplies and hunting success fail.
  language: English
  quote_policy: summarized
