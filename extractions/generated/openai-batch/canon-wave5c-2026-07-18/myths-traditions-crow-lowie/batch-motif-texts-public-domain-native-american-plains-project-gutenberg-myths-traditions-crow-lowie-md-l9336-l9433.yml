canonical_text:
  quote: ''
  summary: Raven-face shelters a rabbit from a hawk; the hawk, rabbit, and a male
    deer each transform into persons and grant or demonstrate powers of speed or sure-footedness.
    Later Raven-face and Dangling-foot confront Birik-o'oce enemies during a buffalo
    hunt, and Dangling-foot kills Honest. Dangling-foot's separated camp is later
    destroyed by Cheyenne. Raven-face then confronts a mysterious hermaphrodite buffalo
    bull, uses the animal powers in flight toward a mountain, and is left without
    further medicine as the buffalo kills his horse and advances on him.
  language: English
  quote_policy: summarized
