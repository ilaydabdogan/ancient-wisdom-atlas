  quote: ''
  summary: The passage ends one tale in which a young man survives a dangerous sexual
    encounter, is threatened by seven brothers, summons raven-linked mountain helpers,
    and freezes his enemies. It then shifts to a second tale beginning with Old-Man-Coyote,
    the loss of a child at Pryor Gap, and the child's upbringing by dwarfs, who give
    him a bow and colored arrows and warn him not to shoot a meadow lark.
