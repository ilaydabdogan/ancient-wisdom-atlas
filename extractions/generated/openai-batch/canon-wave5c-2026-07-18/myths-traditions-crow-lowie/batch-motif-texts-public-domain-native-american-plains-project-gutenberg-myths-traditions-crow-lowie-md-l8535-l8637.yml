candidate_motifs:
- id: motif:1
  label: toothed or biting female genitalia as sexual danger
  taxonomy_refs: []
  basis: The girl's genital biting consumes stones and driftwood and is explicitly
    linked by the source note to the vagina dentata motive.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage begins mid-tale, so the setup before this scene is not included.
- id: motif:2
  label: spouse protects hero from hostile kin
  taxonomy_refs: []
  basis: The young woman claims the man as husband, refuses to permit her brothers
    to eat him, and shields him during their attack.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No broader marriage classification is stated in the passage.
- id: motif:3
  label: magical bird token summons rescue
  taxonomy_refs: []
  basis: The young man uses a raven feather to send distress signals to mountain dwellers;
    it returns as a cawing raven after the enemies freeze.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The prior origin of the raven feather is only alluded to, not narrated
    in this excerpt.
- id: motif:4
  label: weather destroys enemies
  taxonomy_refs: []
  basis: After the raven-feather summons help, snow and a blizzard enter the tipi
    and freeze the seven brothers.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly state whether the blizzard is produced
    by the mountain helpers, though the sequence strongly links them.
- id: motif:5
  label: landmark and place-name explanation
  taxonomy_refs: []
  basis: The destroyed tipi is located near Little Horn by a spring from a genital-shaped
    rock, and Pryor Creek's name is explained through offerings of arrows.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The exact naming explanation is partly in a footnote and depends on translated
    place-name information.
- id: motif:6
  label: sacred exchange for wishes
  taxonomy_refs:
  - sacred_exchange
  basis: The dwarf adoptive father tells visitors to give arrows and beads and says
    they will receive whatever they wish for.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives a rule of offering and reward but does not narrate an
    example of a visitor making the exchange.
- id: motif:7
  label: Coyote as maker of people
  taxonomy_refs:
  - culture_hero
  basis: The passage states that Old-Man-Coyote first made the people.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only a brief creation statement is included; no creation episode is narrated
    here.
- id: motif:8
  label: lost child fostered by dwarfs and rapidly grown
  taxonomy_refs:
  - miraculous_child
  basis: A child lost at Pryor Gap is obtained by dwarfs, made to grow rapidly, and
    equipped with hunting weapons.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The excerpt ends before the full later career of the boy is shown.
- id: motif:9
  label: four colored supernatural arrows
  taxonomy_refs: []
  basis: The dwarfs provide four arrows colored red, blue, black, and yellow; the
    first shot penetrates a rock.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain the colors' meanings.
- id: motif:10
  label: tabooed animal reveals human identity
  taxonomy_refs:
  - forbidden_knowledge
  basis: The boy is warned not to shoot a meadow lark; when he is about to shoot it,
    the bird speaks and identifies him as a Crow and man of the earth.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy link is tentative because the passage presents a forbidden
    act and identity revelation, not a formal doctrine of forbidden knowledge.
