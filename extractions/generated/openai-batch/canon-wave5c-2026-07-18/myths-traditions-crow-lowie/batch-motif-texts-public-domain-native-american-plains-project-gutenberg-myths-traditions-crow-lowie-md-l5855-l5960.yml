canonical_text:
  quote: ''
  summary: 'Looks-down survives several lethal demands from an old woman with help
    from his father, birds, and Corn-woman: he fetches a red-breasted wolf, obtains
    sticks from a dangerous body-like hollow, wins a race around the world, and is
    carried upward by birds until he sees all the world and wins the buffalo. Corn-woman
    contrasts herself with Buffalo-woman as a provider of corn. The next tale begins
    with a young man mating with a buffalo cow stuck in mud; she later gives birth
    to a male calf described as the child of the Crow.'
  language: English
  quote_policy: summarized
