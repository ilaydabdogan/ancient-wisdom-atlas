canonical_text:
  quote: "“She had transformed herself into a bear.”"
  summary: An elder sister, after being urged, changes into a bear-like form using
    a buffalo-hide blanket and rope. Children tease and approach her; she charges,
    kills, and devours some of them, and people flee the camp. She has instructed
    her younger sister to use bear-root incense when she enters a lodge; after four
    incensings she becomes fully human again and says the urging caused the destruction
    of their people. The two sisters remain hungry in the abandoned camp. The elder
    sister threatens to eat the younger unless she catches a young jack-rabbit with
    a digging-stick. The younger sister cries while searching, and her six elder brothers,
    returning from a war party, hear her and bring her to them.
  language: English
  quote_policy: quoted
