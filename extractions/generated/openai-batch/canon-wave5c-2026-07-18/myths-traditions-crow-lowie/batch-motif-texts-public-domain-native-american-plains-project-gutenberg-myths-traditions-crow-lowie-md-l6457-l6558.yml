canonical_text:
  quote: ''
  summary: Red-woman kills seven brothers who shoot her where she directs. A sparrow
    reveals her vulnerable head-feather to a boy, who shoots it and kills her. The
    boy revives his brothers in a sweatlodge; they ascend to the sky and become stars
    while warning the young woman not to pick up any baby on her way home. The woman
    eventually carries a crying child identified as part of Worms-in-his-face. The
    child eats chiefs' hearts until ritual specialists expose it; a marksman shoots
    its little finger, and the camp burns it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red-woman directs Black-wolf and other attackers to shoot her in the side,
    then knocks them down and kills them.
  category: action
  evidence_refs:
