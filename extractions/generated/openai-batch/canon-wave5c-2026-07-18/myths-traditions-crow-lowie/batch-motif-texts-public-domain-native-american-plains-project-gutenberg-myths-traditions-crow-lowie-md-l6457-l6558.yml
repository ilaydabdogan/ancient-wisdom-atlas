  - ev:2
- id: obs:3
  text: A sparrow tells the boy that the thing tied to Red-woman's head is the place
    to shoot her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy ignores Red-woman's instruction to shoot her side and instead shoots
    at the feather at her head, where her heart and lungs are said to be; Red-woman
    falls and dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy has the young woman get wood and make a sweatlodge, brings in the
    brothers' corpses, and restores them to life inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After revival, the brothers discuss becoming mountains, stones, water, or
    something toward which pipes are pointed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers tell the young woman she is human and cannot be taken up, warn
    her not to pick up any baby on the road, and give her instructions about stomach-ache
    kneading that will bring property.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The seven brothers go up to the sky and become stars, while the boy remains
    separate near the Seven Stars.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young woman repeatedly encounters crying or appealing babies or children
    on the road and eventually cleans one child, carries it on her back, and brings
    it to her family.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the child is brought into camp, chiefs are found dead with holes in
    their sides and their hearts gone; the child had cried before the deaths.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An arrow-medicineman makes three feathered arrows, and another shaman makes
    rain; an arrow later reports that the child is the culprit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The child exits through the smoke hole, hoots like an owl, travels through
    the air, and later sits atop a tall tree.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The child holds out its little finger and threatens destruction if it is not
