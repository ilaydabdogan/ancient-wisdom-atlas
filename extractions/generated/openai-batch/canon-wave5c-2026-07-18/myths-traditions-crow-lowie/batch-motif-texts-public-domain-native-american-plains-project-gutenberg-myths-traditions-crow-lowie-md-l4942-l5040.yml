- id: obs:4
  text: One boy sings while another dances under the buffalo's heart with a knife
    point upward on his head, so that the knife touches the heart when he jumps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys cut off the buffalo's heart and kidneys; the buffalo dies, and they
