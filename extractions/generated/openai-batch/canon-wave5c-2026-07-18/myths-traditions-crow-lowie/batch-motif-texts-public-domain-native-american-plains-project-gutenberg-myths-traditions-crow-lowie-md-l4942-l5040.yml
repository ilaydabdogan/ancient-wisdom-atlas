canonical_text:
  quote: ''
  summary: The passage recounts two boys inside a dangerous buffalo that has swallowed
    people; they perform a Sun dance-like action, cut the buffalo's organs, and free
    the captives. A later prank involves stones placed in a boy's head so it rattles.
    Their father warns the boys not to separate, but they do; Spring-boy is taken
    to the sky by Long-arm. The remaining brother tracks him, sees a hole in the sky,
    climbs upward by following an arrow, and passes through camps of raven, crane,
    white-hawk, and eagle people, receiving adoption and information from old women
    in several camps.
  language: English
  quote_policy: summarized
