canonical_text:
  quote: ''
  summary: Two buffalo-hunting narratives are given. In the first, a Crow hunter fleeing
    a buffalo climbs a tree; the buffalo repeatedly hooks the tree and wallows, producing
    dirt, red paint, and white clay, then appears with white-painted eyes and a buffalo
    tail and changes through horse forms before becoming a buffalo again. In the second,
    a hunter shoots a buffalo, is attacked and wounded in a washed-out trail, and
    then witnesses a painted horseman who sings, rides against rocks that shoot and
    become people, and later changes into a buffalo that vanishes near a dead buffalo.
    The passage ends by saying the medicine belongs to Shows-a-fish and Knows-his-coups.
  language: English
  quote_policy: summarized
