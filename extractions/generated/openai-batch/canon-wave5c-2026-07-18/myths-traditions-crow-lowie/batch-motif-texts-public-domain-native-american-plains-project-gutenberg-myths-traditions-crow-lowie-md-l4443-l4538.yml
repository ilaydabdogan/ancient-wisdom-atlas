canonical_text:
  quote: ''
  summary: A dangerous man kills a pregnant woman by placing a red-hot stone on her
    abdomen, removes two children, and leaves one behind a screen and one in a spring.
    The husband finds his wife dead, places her on a scaffold, and later discovers
    the hidden boy, who lives with him. The hidden boy calls his brother from the
    spring; the brothers play with arrows and a hoop. The father learns of Spring-boy,
    traps him, and Spring-boy returns his biting teeth to a being in the spring after
    the father offers buffalo meat. Spring-boy then lives with his father and brother.
    The boys later tamper with their father's bag of white powder, replace it with
    ashes, and decide to try to revive their mother.
  language: English
  quote_policy: summarized
