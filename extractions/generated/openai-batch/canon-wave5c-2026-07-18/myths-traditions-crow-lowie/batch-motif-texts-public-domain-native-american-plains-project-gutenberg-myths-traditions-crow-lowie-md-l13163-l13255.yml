  text: An unidentified man tells the young man when to return to the hunting place
    and instructs him to shake arrows and shout while elk are driven toward rocks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elk go over a cliff, and several hundred elk are killed; the young man
    skins some of them while the other man gathers elk teeth.
