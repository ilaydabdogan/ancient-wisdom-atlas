- id: obs:3
  text: The young man and his wife process hides, meat, elk teeth, and skins; the
    woman makes a dress with elk teeth, and hides are sewn into a tipi cover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The couple stop living in a shelter and move into a tipi after obtaining poles.
  category: sequence
  evidence_refs:
