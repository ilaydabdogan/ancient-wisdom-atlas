canonical_text:
  quote: ''
  summary: A young Crow man, aided by an unidentified man in hunting, gains large
    quantities of game, hides, elk teeth, tipi materials, horses, and war spoils while
    living with his wife. He and his wife raid a Nez Perce camp for horses and later
    kill and scalp men from enemy war parties. In the fall they move to find their
    people. After the young man dreams of the camp coming toward them, they scout
    and identify the Crow camp by its songs. They prepare their tent and food; Cunning-man
    recognizes the young man as the missing Crow man and enters to receive meat and
    pemmican.
  language: English
  quote_policy: summarized
