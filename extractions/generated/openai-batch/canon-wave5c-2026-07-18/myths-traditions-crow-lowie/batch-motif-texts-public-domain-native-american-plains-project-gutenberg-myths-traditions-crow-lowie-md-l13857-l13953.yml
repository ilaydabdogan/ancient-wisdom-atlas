canonical_text:
  quote: ''
  summary: A Crow chief's wife is captured by Sioux and remarried in the Sioux camp.
    Two Crow boys grow up there as captives and brothers; one is named Eats-sinew,
    the two are secretly adopted by the Sun and Morningstar, and Eats-sinew rises
    to leadership among the Sioux. After hearing an old man reveal his Crow origin,
    Eats-sinew gathers other Crow captives and later returns with his brother to the
    Crow camp, where they identify themselves through their fathers' names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's wife is captured by a Sioux man, hidden in a lodge, and claimed
    as his wife; the captain of the Sioux war party kills that man and marries her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two Crow boys remain in the Sioux camp for a long time as captives; one receives
    the name Eats-sinew after chewing sinew when hungry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The captured woman fails at first to recognize her son because his eyes are
    swollen and matter is flowing from them, but after questioning him she takes him
    to her lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two boys herd their owners' horses; after a gray horse breaks its leg,
    they drive the horses far from camp and are later found and brought back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When one boy is threatened with death after the horse incident, the other
    says he wants to be killed too if the boy is killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: While the boys are out with the horses, the Sun and the Morningstar adopt
    them, and the boys do not tell anyone about it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: As young men, the brothers go on war parties with the Sioux, bring back horses,
    and Eats-sinew becomes a captain and chief.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eats-sinew hears an old man tell that he, his brother, and his mother are
    Crow captives and that his name came from chewing sinew.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eats-sinew's mother confirms his Crow identity, and his Sioux stepfather kills
    the old storyteller with a gun.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eats-sinew has meat cooked, summons the Crow captives, asks them whether they
    know they are Crow, and says he is going to see the Crow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two brothers leave to look for the Crow, riding mules, leading horses,
    and carrying war-bonnets and clothing; their mother has told them their fathers'
    names.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Near the Crow camp, the brothers are first feared because they look Sioux,
    then identify themselves by their fathers' Crow names and are taken into camp
    by their fathers and others.
  category: sequence
  evidence_refs:
  - ev:8
