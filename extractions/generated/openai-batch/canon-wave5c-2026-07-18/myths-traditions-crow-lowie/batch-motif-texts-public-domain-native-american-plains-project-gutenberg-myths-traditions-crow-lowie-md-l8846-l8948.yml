canonical_text:
  quote: ''
  summary: The passage closes a tale in which a young man returns with horses and
    scalps, distributes wealth, resists a medicine-powered enemy, kills a stone-bodied
    antagonist, restores taken property and wives to the people, burns the antagonist,
    and becomes a great chief associated with buffalo abundance. It then begins the
    tale of One-eye and Looks-at-the-white-buffalo, describing rival invulnerable
    warriors, camp divisions, frequent fighting, and a raid into a Sioux camp where
    trenches are dug and a battle occurs.
  language: English
  quote_policy: summarized
