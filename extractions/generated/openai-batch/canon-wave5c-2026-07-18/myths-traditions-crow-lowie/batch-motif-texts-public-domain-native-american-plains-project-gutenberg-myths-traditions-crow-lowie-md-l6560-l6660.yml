canonical_text:
  quote: ''
  summary: The passage first gives an origin for stomach-kneading as a healing practice.
    It then introduces Red-Woman, her sharp-pointed weapon, and medicine sticks associated
    with adoption by her. In the main tale, a family of seven sons and one daughter
    loses both parents. Several brothers go over a hill to hunt buffalo and are compelled
    by Red-Woman to carry heavy meat to her lodge, where they remain hungry and wounded.
    A dwarf-adopted brother and then a left-handed brother follow; the left-handed
    brother uses medicine arrows, fetches water, cooks meat for his brothers, and
    later fights Red-Woman, who breaks his arm. The supplied excerpt ends with the
    combat unresolved.
  language: English
  quote_policy: summarized
