canonical_text:
  quote: ''
  summary: The passage concludes one narrative in which a man, aided by supernatural
    power and by two kind young men, obtains horses and social standing for a poor
    household while refusers are later excluded from war parties. It then begins “The
    Compassionate Brother-in-Law,” in which Gray-old-man, identified as an eagle,
    visits bird-trappers; one household gives acceptable hospitality and receives
    successful eagle-catching predictions, while the pretty wife’s refusal is followed
    by failed hunting, her husband’s violent mutilation of her, and the younger brother’s
    refusal to abandon his injured sister-in-law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man at a fork directs others toward a herd in a basin among mountains and
    tells them to look for a roan horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the roan is brought, the man saddles and mounts it, then asks for a
    big-bellied mare and leads her with a rope.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group drives horses behind the man, swims with the horses near Bull Hill
    and the mouth of Pryor Creek, and brings back eighty head, with sixty given to
    the man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: People say the man was responsible for the horses, and the poor woman’s husband
    uses horses to obtain a large lodge and furnishings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman reports that the Moon told her to find someone to work for her;
    she identifies two young men as helpers and two others as men who insulted and
    refused her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The kind young men later bring horses and kill an enemy on war parties, while
    the other young men are sent home when they try to join war parties.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the next tale, people camp for bird-catching; the group includes a young
    man with a pretty wife, another with a plain wife, two single men, and a young
    boy who is the first man’s brother.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: An old man named Gray-old-man comes to them, says he will visit when they
    are ready, and is identified by the narration as an eagle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The households prepare food and moccasins for Gray-old-man; the pretty wife
    refuses to bathe and incense herself, while the plain wife obeys her husband.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Gray-old-man asks the plain woman to remove her blanket; she is naked, and
    he then enters, eats what she has given, and puts on her moccasins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Gray-old-man does not eat the handsome woman’s food or put on what she sewed,
    asks for tobacco from the plain woman’s husband, and gives eagle-catching advice
    and predictions to that household and the two single men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Gray-old-man does not speak to the husband of the handsome woman or to his
    brother; they return empty-handed nightly, while the others catch eagles as predicted.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: The husband of the pretty woman says she spoiled his luck, pushes her down,
    sits on her breast, punches out her eyes with an awl, and cuts the tendons on
    her ankles with a knife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The younger brother returns, finds his sister-in-law ill-treated and moaning,
    and tells his older brother that he has done something very bad.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The younger brother takes pity on his sister-in-law, cries, says she has been
    kind to him, and refuses to leave her when the older brother departs.
  category: action
  evidence_refs:
  - ev:6
