candidate_motifs:
- id: motif:1
  label: Horse wealth obtained through supernatural power
  taxonomy_refs: []
  basis: The man identifies particular horses, leads a successful horse acquisition,
    receives the largest share, and the passage notes use of his supernatural power
    by the young men.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a continuation of an earlier narrative, so the origin and
    exact nature of the man’s power are not fully present in this excerpt.
- id: motif:2
  label: Supernatural instruction to seek human helpers
  taxonomy_refs:
  - wisdom
  basis: The poor woman says the Moon told her to look for someone to work for her,
    after which kind helpers are distinguished from refusers.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The Moon’s statement is reported indirectly by the woman; the excerpt
    does not show the original encounter with the Moon.
- id: motif:3
  label: Helpers rewarded and refusers publicly shamed
  taxonomy_refs: []
  basis: The young men who help become successful and distinguished, while the young
    men who refused are sent home from war parties and cry.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The sanction is socially enacted in the passage; a direct supernatural
    punishment is not explicitly stated.
- id: motif:4
  label: Supernatural animal-person patron visits hunters
  taxonomy_refs:
  - shapeshifter
  - sacred_exchange
  basis: Gray-old-man appears as an old man but is identified as an eagle; he visits
    bird-trappers, receives offerings, and gives advice and predictions about eagle
    catching.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage identifies Gray-old-man as an eagle but does not narrate a
    visible transformation.
- id: motif:5
  label: Accepted hospitality brings hunting success; refused hospitality spoils luck
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: Gray-old-man accepts the plain woman’s food and moccasins and predicts successful
    catches, but rejects the pretty woman’s offerings after her refusal; the rejected
    household then catches nothing.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The text links refusal, rejection, and failed catching, but the exact
    causal mechanism is stated through the husband’s accusation rather than a direct
    narrator explanation.
- id: motif:6
  label: Compassionate in-law refuses to abandon an injured woman
  taxonomy_refs: []
  basis: The younger brother finds his sister-in-law mutilated, rebukes his older
    brother, cries from pity, and stays with her despite being told to leave.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only the opening of the tale is included, so the later consequences of
    this loyalty are outside the excerpt.
- id: motif:7
  label: Violent mutilation after blamed loss of luck
  taxonomy_refs: []
  basis: The husband blames his wife for spoiled luck and mutilates her eyes and ankle
    tendons with an awl and knife.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a descriptive motif candidate; the passage does not present the
    violence as ritually required or morally approved.
