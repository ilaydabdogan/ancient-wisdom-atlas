canonical_text:
  quote: ''
  summary: A young man must obtain Red-hair's hair in order to marry a girl. Helpers
    transform him into a woman and advise him how to pass Red-hair's animal watchers.
    He enters Red-hair's tipi, is accepted as a wife, and is suspected by Red-hair's
    brothers. While lousing Red-hair, he kills him, takes his hair, flees with aid
    and misdirection from helpers, returns to his people, gives the hair to the girl,
    and marries her.
  language: English
  quote_policy: summarized
