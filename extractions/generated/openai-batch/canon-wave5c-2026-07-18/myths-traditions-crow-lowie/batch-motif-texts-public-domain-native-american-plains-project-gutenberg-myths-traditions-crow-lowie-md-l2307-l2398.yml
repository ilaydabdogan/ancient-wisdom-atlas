canonical_text:
  quote: ''
  summary: The passage contains two Old-Man-Coyote episodes. In the first, Old-Man-Coyote
    exchanges his male organ with a mouse in order to be chosen by a woman seeking
    the smallest organ, then retrieves his own organ and kills the mouse after the
    deception is exposed. In the second, two berrying girls refuse Old-Man-Coyote;
    he disguises or presents his male organ as a sweet large strawberry, later reveals
    the deception, and the girls attempt a retaliatory sexual trick by feigning death
    while exposed. Editorial notes compare the episodes with other recorded versions
    and traditions.
  language: English with some Latin anatomical phrases
  quote_policy: summarized
