canonical_text:
  quote: ''
  summary: Spotted-rabbit is ritually prepared by his clansman with bathing, grooming,
    face paint, horse ornamentation, song instruction, and practice. He enters camp
    publicly as a Crazy Dog, despite his mother’s grief and questions. His clansman
    repeatedly tells him not to dismount or dance, but Spotted-rabbit dismounts when
    told not to, while the clansman sings and dances with him, signifying willingness
    to die with him. Spotted-rabbit moves through camp, running over obstacles, returns
    to his mother’s tipi, and explains that he wants to die and catch up with his
    father.
  language: English with Crow terms and song text
  quote_policy: summarized
