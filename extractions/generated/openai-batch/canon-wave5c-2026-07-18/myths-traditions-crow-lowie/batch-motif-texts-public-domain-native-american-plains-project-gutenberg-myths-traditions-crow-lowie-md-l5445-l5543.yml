canonical_text:
  quote: ''
  summary: Yellow-dog receives and uses instructions involving Old-Man-Coyote, food,
    smoking, a pipe stem, and battle disguise to survive Morningstar’s attempts to
    destroy him. Old-Man-Coyote is entertained by Yellow-dog, reports misleadingly
    to Morningstar with heart-fat, and advises Yellow-dog how to stop a storm and
    defeat Morningstar’s son. The passage then begins the tale of Corn-Silk, a Hidatsa
    girl who refuses suitors because she dislikes the thought of children and names
    One-feather-gone-from-his-wing as the one she wants to marry. A source note identifies
    comparative motifs in the Corn-Silk tale.
  language: English with Indigenous-language terms/transcriptions
  quote_policy: summarized
