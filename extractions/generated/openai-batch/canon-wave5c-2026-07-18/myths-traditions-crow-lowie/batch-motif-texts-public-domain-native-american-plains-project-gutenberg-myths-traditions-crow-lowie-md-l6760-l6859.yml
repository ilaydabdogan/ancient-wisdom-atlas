canonical_text:
  quote: ''
  summary: The passage recounts episodes in which a handsome youth later called Flint-like-young-man
    overcomes an invulnerable chief, takes a woman from the chief's household, becomes
    chief, and later rescues a boy drowned for a year from water-monsters near the
    ocean. A new tale then introduces Camp-Boy, a handsome stay-at-home youth shamed
    into joining a raid after his father burns himself in anger; Camp-Boy instructs
    his left-handed friend to prepare a buffalo blood-sack on the trail, and the friend
    later hears a coyote howl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In spring, a large tipi is built, and a handsome boy's mother's brothers propose
    taking him to the main camp so he can flirt with young women.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man in the main camp is chief because he is invulnerable, and he uses that
    status to take the prettiest girls and best food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief has a sister-in-law and kills anyone who loves her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief's sister-in-law, while fleshing a hide, speaks as if the boy has
    called her, says she hates him, and insults him as fatherless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The left-handed man advises the boy to steal the chief's sister-in-law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy seizes the woman, brings her to his tent, and sleeps with her; the
    chief and the camp search for her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The left-handed man defies the chief and tells messengers that the chief should
    come quickly; after a third message, the chief is angry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In confrontation, the chief's arrows glance off the boy and the chief's knife
    breaks; the boy cuts off the chief's head with a sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boy orders that property wrongfully taken by the former chief be reclaimed,
    keeping only the girl and his own property; he becomes chief and is called Flint-like-young-man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The next summer near the Bighorn, people whose boy has been drowned for a
    year give the youth ten horses and ask him to look for the drowned boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The youth prepares a gray horse with lightning streaks, red clothing, a sword,
    red face paint, and the same eagle plume; he rides toward the four quarters, rises
    into the air, and turns north.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: An old woman in the air tells him the drowned person has been taken to the
    ocean, to a hill in the water, and that the waves recede in daytime near six captives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the beach, after the tide goes back, water-monsters hold the sought person
    by the water; the youth runs over and chops up five monsters, then calls to the
    last one to get up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The rescued person rides away on the horse; when the pursuing water worries
    him, the youth charges the water, it recedes, and he returns the drowned boy alive
    to his relatives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Camp-Boy is introduced as a handsome young man who stays at home while other
    young men go on the warpath and win renown; his clansmen name him Camp-Boy.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Camp-Boy's left-handed friend urges him to go because many women are going
    on a raid.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Camp-Boy's father says he has never sung praise songs and throws himself into
    the fire, burning himself in anger; Camp-Boy then resolves to sing praise songs
    and go along.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Camp-Boy instructs his friend to make moccasins, kill a buffalo at the second
    night stop, cook the blood-sack, plant it in the ground, and call it food for
    Camp-Boy; bystanders mock the act, and the friend later hears a coyote howling.
  category: sequence
  evidence_refs:
  - ev:8
