canonical_text:
  quote: ''
  summary: The supplied passage contains the close of one tale in which a young man
    reports being stranded at an eagle nest by his stepfather, is returned by an eagle,
    has the accusation publicly announced, and later receives offerings and prayers
    after death. A second tale begins with early Crow people traveling along the Big
    Horn; a stepfather abandons and throws a fatherless boy into Bighorn Canon, where
    the boy clings to a pine on a cliff and is approached in sequence by a sparrow-hawk,
    a squirrel, an eagle, and four mountain-sheep who speak of rescue or adoption.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young woman related to the stepfather enters the camp, asks the boy to marry
    her so he will stop troubling her family, and he marries her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his wife leaves for her mother's camp, the boy tells his mother that
    his father forced him by ropes to an eagle nest, threw down the rope after the
    boy signaled, and that an eagle later brought him home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother has a crier announce her son's account; the people blame the stepfather,
    and the boy and stepfather are named Big-iron and Good-clouds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man says that after his death people should give him presents and
    pray to him; when they give the right kidney and pray, the requested thing is
    granted; after the camp moves, he is buried and gifts are given at the burial
    ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the second tale, the first Crow are traveling afoot in spring along the
    Big Horn near the Gap, when rain and snow mix and buffalo cows calve; they corral
    buffalo in the canon and use bows and arrows.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fatherless boy asks his stepfather to take him hunting; the stepfather takes
    him out, leaves him on a rock, and later returns to lead him farther on.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the highest place of Bighorn Canon, the stepfather makes the boy look over
    the edge for a supposed deer light and throws him down; the boy lands on a soft-earth
    step and clings to a pine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stepfather says he will now have no one to bother him while eating; the
    mother searches for the boy, and two young men report having seen and fed him
    on the rock.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: While the boy is caught on the tree, a sparrow-hawk appears in a vision, questions
    him, hears his story, offers to strike him down to another step and adopt him,
    turns into a man on a gray horse, fails when the boy is scared and clings to the
    tree, and leaves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The next evening a squirrel hears the boy's story, says it will adopt him
    and take him to the same place as the bird intended, but the rescue is not completed
    and the helper leaves; a footnote says the frightened subject in this episode
    is probably a textual mistake.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:11
  text: On the third day an eagle hears the boy's story, says the man does dirty tricks,
    offers to carry the boy on its back with his legs over its tail, but returns him
    when he becomes scared.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: On the fourth day four mountain-sheep appear, described as one very young,
    one yearling, one two-year-old, and one three-year-old; the oldest says they are
    last and that no other power can save the boy.
  category: sequence
  evidence_refs:
  - ev:11
