canonical_text:
  quote: ''
  summary: A young man raised by buffalo fathers returns to camp, identifies the woman
    who exposed him in a buffalo wallow as his mother, selects a poor young man as
    his father, and later protects seven buffalo bulls understood as his fathers.
    A reckless rider attacks the bulls and is killed by Crazy-bull. The young man
    and his son transform into buffalo in water, and the son is later raised among
    buffalo grandfathers; the narrator connects this to adoption of relatives' children.
    A following tale, “The Dwarf’s Ward,” begins with a child lost from a dog travois
    after the dog chases deer; the child is taken inside rocks, raised by adoptive
    parents, becomes a hunter, and is later sent to feed a second father at a mountain
    with white rocks. A footnote compares the opening episode with other recorded
    versions and with Assiniboin and Blackfoot variants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prior speaker instructs the young man how to make his mother recognize him
    and tells him to visit his fathers at the foot of the mountains in the fall.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At camp, young women are playing ball; one woman fetches the ball, and the
    young man calls her mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman asks when she became his mother, and he says she put him into a
    buffalo wallow, covered him with dirt, and that his fathers raised him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: People compare the young man with his mother, question him, ask who his father
    is, and he points to a poor young man; the mother and the poor young man marry,
    and the returned young man later marries the chief’s daughter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: During hunger in camp, the young man requests seven buffalo chips, sends scouts,
    announces buffalo, and warns that seven bulls must not be disturbed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A crazy young man on a white horse charges the seven bulls, shoots Crazy-bull
    in the thigh, and is killed along with his horse by Crazy-bull.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man says the attacker had been warned not to chase the seven bulls
    and had shot one of his fathers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man dives into water and becomes a bull; his little son becomes
    a calf, and both later return as persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man later takes his son to his fathers, and the son is raised among
    buffalo grandfathers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator states that this is how people now adopt the children of relatives.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: In “The Dwarf’s Ward,” a married couple’s small child is seated on a dog travois;
    after the dog chases two white-tailed deer and returns alone, the child is gone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The parents search for two days, cannot find the child, and go on mourning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The child has been taken inside rocks by a person and is kept there until
    he grows into a young man.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The rock-dwelling adopter makes a bow and arrows for the boy, who hunts deer,
