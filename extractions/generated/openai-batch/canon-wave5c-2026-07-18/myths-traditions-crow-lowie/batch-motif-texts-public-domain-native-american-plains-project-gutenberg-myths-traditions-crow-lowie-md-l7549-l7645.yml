canonical_text:
  quote: ''
  summary: The passage ends one tale in which a Crow figure, aided but not always
    rescued by Thunder, kills two long-otter monsters with arrows, heated stones,
    and water; birds are summoned to eat the monsters, the Crow is transformed into
    a condor, remembers he is an Indian, is punished by an elk and underwater beings
    for killing water creatures, and returns human. A brief note identifies the elk
    as Hidatsa, the bird as Crow, and explains the name Elk River. The passage then
    begins 'The Son-in-law's Tests,' describing a daughter whose first three husbands
    disappear and a new husband whom the father-in-law sends on a task.
  language: English
  quote_policy: summarized
