canonical_text:
  quote: ''
  summary: A woman follows named landmarks and river ice to find On-top-of-the-bull,
    an injured man who had been abandoned. At night she sings near his shelter; he
    and his brother first suspect a ghost, then recognize her as living. She brings
    food, tobacco, and a pipe. After scouting hostile buffalo hunters, she refuses
    to leave him. During snowfall she and the boy take saddles and horses from a hostile
    camp, and the three escape to their own people. On-top-of-the-bull reunites with
    his father, and a pinto horse is given to the girl’s husband or chief, who accepts
    the situation without anger. The passage then begins another tale, in which a
    girl promises to marry any man who brings part of her brother’s body after his
    war party is destroyed; a young man prepares and searches but does not find the
    body in this excerpt. A footnote compares the second tale with Dorsey and Kroeber
    and with Kroeber.
  language: English
  quote_policy: summarized
