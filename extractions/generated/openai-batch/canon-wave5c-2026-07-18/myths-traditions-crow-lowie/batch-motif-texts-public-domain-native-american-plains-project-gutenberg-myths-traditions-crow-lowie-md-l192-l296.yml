canonical_text:
  quote: ''
  summary: Introduction to Lowie's collection describing Crow mythology as Plains
    Indian in atmosphere, with buffalo chase, warpath, quests, supernatural saviors,
    human heroes, Old-Man-Coyote, inconsistent classification of supernatural beings,
    examples involving Thunderbirds, water-monsters, a dwarf, an eagle or Thunderbird,
    and a hero frightened by a buffalo foetus. The passage also contrasts Crow ritual-origin
    accounts with those of several neighboring Plains groups and introduces questions
    of historical affiliation.
  language: English
