canonical_text:
  quote: These four performances represented the four generations. This meant that
    the boy was to live four times.
  summary: A boy is carried down by mountain sheep to an aged man on an island surrounded
    by water. The man demonstrates four water transformations, gives the boy the name
    Big-iron, gifts and instructions, and foretells offerings. After returning home,
    Big-iron overcomes a shaman's wolverene medicine, marries the chief's daughter,
    kills his stepfather, renews youth by entering water across generations, and dies
    the fourth time.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Four mountain sheep, including age-graded sheep, carry the boy downward from
    ledge to ledge and finally to a small island surrounded by water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the island the boy finds an old man who says he sent the sheep for him;
    the old man is extremely aged and the boy is skeletal from hunger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wife or young girl associated with the old man comes out of the rock with
    a blanket and a polished old staff said to be made from a mountain-sheep tail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the old man is wrapped in a blanket, he dives into the water toward
    the four quarters and comes out as a young man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man has a painted shield and spear decorated with mountain-sheep tails;
    the shield bears a bullet mark even though the passage says guns did not yet exist.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man repeats water-diving performances in which he alternates between
    youth and old age; the narration states that the four performances represent four
    generations and that the boy is to live four times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man says all animals are his children, gives the boy his name Big-iron,
    identifies himself as one of four things that last forever, names and claims Big
    Mountain-Sheep River, and gives the river to the boy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man says offerings should continue after death, and the passage says
    a visible grave had beads and trinkets placed in a hole in a tree.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The old man gives the boy a warclub-stone tied to a sheep's tail, says it
    can kill by a pretend strike, greases him with neck fat, and orders the mountain
    sheep to take him home by a route through named places.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy returns home looking older, finds his stepfather in mourning with
    the other relatives, and tells his mother he will kill her husband, though his
    brothers advise delay.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy had been told not to fear any animal because animals are his joking
    relatives; when he throws mud at a shaman's wolverene medicine, the wolverene
    says Big-iron has broken its ribs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Big-iron makes the wolverene smell his anus and breaks wind in its face as
    part of making it well; the shaman says Big-iron has overcome his medicine.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Big-iron throws the shaman down as though dead, then raises him by his bang,
    breaks wind in his face, restores him to life, and lets him go.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Big-iron marries the chief's daughter, kills his stepfather with a mud pass,
    becomes young again by being thrown into water when old, repeats this across generations,
    and dies after the fourth time.
  category: sequence
  evidence_refs:
  - ev:10
