canonical_text:
  quote: ''
  summary: 'The passage first recounts a Crow-Shoshoni encounter in which Red-face
    supports an adopted Crow against Black-cricket, leading to battle, Black-cricket’s
    death, a peace vow, and remembered names. It then begins the tale of Holds-the-tail’s
    Sun Dance: Size-of-iron goes on the warpath, kills and takes trophies from Piegan
    enemies, repeatedly holds off attackers, deliberately returns to die, and Humpback
    escapes into a snowstorm, sheltering in a dead buffalo skin.'
  language: English
  quote_policy: summarized
