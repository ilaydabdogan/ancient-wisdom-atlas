canonical_text:
  quote: ''
  summary: The passage recounts camp movements, horse raids, fighting, deaths, mourning,
    medicine-making, and the death of the Sun-worshiper. It then describes the Feaster
    or Hunter, who hunts and repeatedly feeds his clan fathers; their prayers and
    dreams are connected with coup-taking, a horse thief's death, and later plans
    for a small raid after first feeding the clan fathers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun-worshiper had a boy child, and the Feaster named the child a'sa'ka
    waxpac, glossed as Clan-father-medicine.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red-bear rode through camp on a bay horse, naked, striped with paint, with
    two wolf tails tied to his moccasins, and announced movement toward the Bighorn
    and Wolf Mountains for meat and war.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sun-worshiper made medicine and another hoop to determine whether enemies
    were nearby, and found none nearby.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Enemies and named enemy groups repeatedly stole horses; Crow people pursued
    and fought them, with several Crow deaths reported.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Crow bodies were placed in a large striped tipi called Aivaxu'k'.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Crow-woman, a widow, cut and gashed her head, bled, cried through camp, tried
    to reach the Sun-worshiper, and asked him for help, but others prevented contact
    because she was bleeding.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: While people were going to swim the Bighorn and some pursued horse-stealing
    enemies, the Sun-worshiper became sick during the chase and died the next day
    at the age of ninety.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Feaster hunted daily, fed his a'sa'kua or clan fathers whenever he brought
    food home, prepared feasts day and night, and avoided the warpath while entertaining
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The clan fathers asked the Feaster about his dream, wished him long life to
    a certain season, and prayed for him after eating.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A clan father wished the young man would strike a coup in his place; the young
    man promised a horse if he did so, and later struck a coup in battle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ten-bears reported a dream in which a horse thief was killed and coups were
    struck; that night the Feaster's wife saw someone stealing horses, the Feaster
    shot the thief, struck a coup, took his gun, and his wife took the second strike.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the horse thief was killed, people dragged the body to the center of
    the camp and danced around it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: While butchering a buffalo, the Feaster or Hunter was surrounded by enemies,
    and other Crow men rode out and rescued him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Buxka proposed that he and the Hunter take about four men on the warpath to
    sneak up on Sioux and steal horses; the Hunter said he would first hunt deer to
    feed his clan fathers.
  category: speech
  evidence_refs:
  - ev:11
