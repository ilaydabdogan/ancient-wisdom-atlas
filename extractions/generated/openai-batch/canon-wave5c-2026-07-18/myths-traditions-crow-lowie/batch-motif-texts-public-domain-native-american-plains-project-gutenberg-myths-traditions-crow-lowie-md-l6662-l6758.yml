canonical_text:
  quote: ''
  summary: A dwarf searches for his adopted boy and confirms through an ant scout
    that a witch holds him in her tent. A grieving sister swallows a white stone near
    a pine at the mountains and soon bears a white boy who grows to young manhood
    within days. The boy learns of his mother’s lost brothers, acquires a sword by
    rubbing a feather, uses a horse and plume, repeatedly travels through the air
    to the witch’s tent, identifies the captive brothers, prepares with red clothing,
    red paint, a black lightning mark on the horse, and a sword, then splits the witch’s
    tent, frees the prisoners, defeats the witch, and returns with the seven brothers
    and an eighth captive.
  language: English
  quote_policy: summarized
