canonical_text:
  quote: ''
  summary: Two boys, Spring-boy and Curtain-boy, repeatedly seek out dangerous beings
    or places after parental warnings, neutralize them through tricks, transformations,
    or captured objects, and return home with trophies or reports. They also revive
    their dead mother at a burial site, restore her to their father, overcome a dangerous
    leaning tree and spreading coulee, and take fire-moccasins from a dangerous man.
    The passage ends with the beginning of another warning about a buffalo named Bull-dead-wolf.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dangerous old woman uses a jug to draw passers-by into it, boil them, and
    eat them; the boys are warned to stay away from her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys plan to stop the jug with a rock; Curtain-boy later points the jug
    at the old woman, causing her to enter it and be boiled, and the boys take the
    jug home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father warns the boys about a woman with a digging-stick that kills animals
    when swung.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys turn into a butterfly and a fly while the woman with the digging-stick
    sleeps; Curtain-boy takes the stick, strikes her with it, kills her, and brings
    it home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys decide to make their mother get up, ask for stone implements, and
    take a jug and flesher to the burial site under a pine tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the burial site, the boys toss objects upward and warn that they will fall
    on their mother; she moves, gets up, sits down, and says she has slept for a long
    time.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The boys bring their mother home, hide her, and persuade their father to call
    for his wife to go to bed; she then comes out of hiding, and he watches her at
    night for four days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father warns that a leaning tree drops on and kills anything that passes;
    the boys trick it into dropping, play on it, and bring limbs home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother warns that a coulee spreads out when someone jumps over it and
    can drown the jumper; the boys feint jumps, then jump over it, play with it, drink
    from it, and report that it no longer has power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother warns of a dangerous man with a fire moccasin; Spring-boy becomes
    a whirlwind, takes the moccasins, burns the tipi and man, and the boys decide
    to take the fire-moccasins home for their mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage ends as the mother begins telling the boys about a buffalo called
    Bull-dead-wolf.
  category: speech
  evidence_refs:
  - ev:8
