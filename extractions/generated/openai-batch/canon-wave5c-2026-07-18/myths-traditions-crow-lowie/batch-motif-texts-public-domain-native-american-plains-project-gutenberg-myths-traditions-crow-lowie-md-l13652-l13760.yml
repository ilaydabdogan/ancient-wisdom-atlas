canonical_text:
  quote: ''
  summary: Two accounts explain the separation of the Crow and Hidatsa. In the first,
    formerly co-resident Crow and Hidatsa divide after a buffalo-killing episode in
    which the Crow are denied a portion of the stomach; the Crow party goes toward
    the mountains while the Hidatsa take another direction and raise corn and pumpkins.
    The first account also tells of a Crow man who receives a supernatural dream-gift,
    takes a shining star from a mountain, plants it as sacred Tobacco, and distributes
    it for cultivation. In the second account, denial of buffalo stomach meat again
    prompts Crow discontent; young men persuade a chief to leave secretly at night,
    the group moves toward the mountains, hunts buffalo, later gains horses, and remains
    there through the next generation.
  language: English with Crow terms
  quote_policy: summarized
