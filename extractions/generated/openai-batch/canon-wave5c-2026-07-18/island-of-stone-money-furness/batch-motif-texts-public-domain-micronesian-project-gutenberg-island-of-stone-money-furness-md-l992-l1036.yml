  quote: ''
  summary: A first-person account describes men taking a sleeping girl from a hut
    at her father's house, carrying her by canoe, giving shells to the Chief of Rul,
    and later reporting that she remained with them. The author frames this as the
    stealing of a mispil, compares it to young Lochinvar, suspects prior arrangement
    and shell compensation, says participants are admired as heroes, and describes
    mispil tattoo marks on hands and legs as lasting signs of former status.
