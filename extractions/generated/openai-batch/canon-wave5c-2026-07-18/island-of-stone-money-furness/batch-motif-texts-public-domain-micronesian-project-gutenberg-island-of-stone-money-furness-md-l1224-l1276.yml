  summary: The passage describes red-shell necklaces, their bead construction, and
    their value as adornments. It recounts a visit by the chief Inifel from Magachpa,
    who wore a splendid red-shell necklace with occasional white beads, and notes
    the narrator's desire to acquire such a necklace despite reports that they could
    not be bought. The narrator asks Eonoboi, a chief and mach-mach, to procure one.
