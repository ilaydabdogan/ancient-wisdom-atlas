  quote: ''
  summary: The narrator introduces a phonograph to record songs and incantations,
    expecting the audience to be amazed by a machine that emits human voice and music.
    Instead, the gathered audience shows little interest except in the rotating wax
    cylinder and clockwork sounds; some return to husking coconuts. One man dismissively
    calls it an acceptable kind of tom-tom, a local adopted term for musical boxes
    or instruments introduced by outsiders.
