canonical_text:
  quote: ''
  summary: A narrative fragment describes a mother and daughter failing to keep a
    seven-day promise to Yalafath, his punitive sending of a rat to destroy yam plants,
    his forgiveness and sending of a cat, and his command that the daughter marry
    the being who had killed and revived her. Yalafath gives them a sailing canoe;
    they travel and observe high lands, mountains, and low coral islands formed where
    sand was scattered. The passage explains dark people and white people through
    different descent lines and links white people’s ships and taking of goods to
    Yalafath’s gifts. The narrator then comments that the story seems recent, citing
    cats and an allusion to a copra trader taking sand as ballast.
  language: English
  quote_policy: summarized
