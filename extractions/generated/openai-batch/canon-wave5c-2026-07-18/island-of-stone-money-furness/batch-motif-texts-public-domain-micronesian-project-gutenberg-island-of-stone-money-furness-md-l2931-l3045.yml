canonical_text:
  quote: ''
  summary: 'The passage describes a knot-and-leaf omen procedure performed with a
    soothsayer: a questioner ties random knots in leaf strips, counts remainders by
    fours, displays the remaining knots between the fingers, and the seer interprets
    paired numerical combinations as named han or demons whose unions affect the answer.
    Fatumak explains names, sex, and marriages among the han, reacts negatively when
    the narrator guesses part of the system, and says that men of Uap possess Bei
    for seeing future events beyond ordinary human thought.'
  language: English
  quote_policy: summarized
literal_observations:
