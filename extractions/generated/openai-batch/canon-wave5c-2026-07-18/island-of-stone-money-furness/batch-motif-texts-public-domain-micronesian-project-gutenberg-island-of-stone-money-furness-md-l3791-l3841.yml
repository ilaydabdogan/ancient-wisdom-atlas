canonical_text:
  quote: each person bearing a gift for the corpse
  summary: 'The passage describes funeral rites for Mafel: mourners bring shell-money
    and other gifts, access to the unburied body’s yard is restricted by custom, the
    body is to be removed through a broken wall rather than a doorway to avoid ill
    luck, presents are largely expected to be returned after burial, and women in
    the yard maintain subdued activity while waiting.'
  language: English
  quote_policy: quoted
