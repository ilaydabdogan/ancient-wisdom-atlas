canonical_text:
  quote: ''
  summary: The passage describes the social position of a woman called a mispil in
    relation to a failu or pabai. She is socially avoided by local matrons but treated
    respectfully by men, allowed to witness songs and dances barred to other women,
    supplied with food and luxuries, exempted from taro-field labor, and given a secluded
    house called tapal. If she appears to favor one lover, the man is told to withdraw.
    The passage says mispils are faithful to the men of their house and regard themselves
    as property because they were captured at risk and paid for with stone money.
