canonical_text:
  quote: '"Long, long ago when there was nothing but sea and sky, and no land..."'
  summary: In a narrated religious story, Fatumak recounts a primordial time before
    land. A first woman comes from a barnacle under floating driftwood and lives in
    the water. Her daughter, despite a warning, climbs onto the log, where a sky-descending
    hibiscus fixes it in place. Clothed sea devils see the naked daughter, kill her,
    and preserve her body in salt. The mother finds her, and Yalafath, ruler of Heaven,
    commands the killers to revive her by charm. Yalafath then gives the mother and
    daughter sand and yams and instructs them to scatter and plant them over the sea;
    the passage cuts off before the instruction is complete.
  language: English
  quote_policy: quoted
