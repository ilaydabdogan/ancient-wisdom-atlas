canonical_text:
  quote: ''
  summary: The narrator describes seeing Kakofel carrying a betel basket and a sprouted
    coconut heart. After he jokingly addresses her as “Kakofel Kan,” she reacts with
    fear, drops the food, runs home, and thereafter avoids him, even when attending
    phonograph gatherings. The narrator then describes Kakofel’s mother as an eager
    phonograph attendee who sits near the brass horn, directs singers, and receives
    cigarettes in thanks. He also describes a visit to her palm-leaf kitchen, where
    she cooks yams and taro over an iron-bowl hearth and watches the fire because
    she says fallen burning sparks are ill-omened.
  language: English
