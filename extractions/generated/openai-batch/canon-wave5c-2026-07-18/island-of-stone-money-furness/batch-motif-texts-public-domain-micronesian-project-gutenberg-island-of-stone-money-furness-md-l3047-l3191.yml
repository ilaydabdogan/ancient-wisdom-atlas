literal_observations:
- id: obs:1
  text: Ronoboi is described as a chief, a noted seer, and a dealer in charms who
    provided information about mach-mach or momoh men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who practice the art are said to have to be aged widowers or widows
    and may not eat food prepared the previous day.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Practitioners must destroy chewed betel-nut quids by fire or by throwing them
    into the sea; their betel basket includes a compartment for used quids awaiting
    destruction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nail parings and cut hair must likewise be burned or thrown into the sea,
    and spit on the ground must be wiped out with the foot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that these disposal and erasure practices are done so that
    counter-spells cannot be worked against the practitioners.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: A person taking counsel of the Bei must make knots in strips of palm leaf
    and hold them in the right hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says a person cannot force his fortune by pre-arranging combinations
    of kan because the soothsayer knows controlling circumstances.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Fatumak visited to settle accounts with Friedlander for goods to be received
    in exchange for coconuts already rendered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Fatumak is described as accurate in dealings and as having invented a cipher
    for trade articles and quantities of coconuts.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: Fatumak wrote accounts in pencil on scraps of paper, using stable signs intelligible
    to him after time had passed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some of Fatumak's signs are described as pictographs, including signs for
    an axe and iron pots; he also explained a tea sign as a paper bundle with twisted
    ends.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage describes the people of Uap as using a decimal system with separate
    words for twenty, thirty, forty, fifty, one hundred, and one thousand, and compounded
    forms for sixty and beyond.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage compares this with the Miri Nagas of Upper Assam, who are said
    to count only to ten, repeat after ten, and mark tens with a stick or pebble.
  category: other
  evidence_refs:
  - ev:5
- id: obs:14
  text: The concluding paragraph says sharpened-shell adzes can still be found in
    houses of old families and are remembered by old men as formerly used by parents
    and grandparents.
  category: object
  evidence_refs:
  - ev:6
