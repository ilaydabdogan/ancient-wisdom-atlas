canonical_text:
  quote: ''
  summary: The passage describes activity in a failu, or bachelors' house, immediately
    after fishermen return. Canoe figureheads are protected, fish are unloaded, and
    the canoe is moored. Inside the house, much of the floor is divided into small
    coconut-frond matting pens for the tired fishermen. The narrator notes a possible
    taboo against stepping over sleeping fishermen's legs. Other house members remain
    at the inland end, working, socializing near embers, and ignoring the fishermen.
    The fishermen are described as confined until they go to sea again, with movement
    restricted toward the inland side of the house; female kin may bring gifts or
    wish to speak with them.
  language: English
  quote_policy: summarized
