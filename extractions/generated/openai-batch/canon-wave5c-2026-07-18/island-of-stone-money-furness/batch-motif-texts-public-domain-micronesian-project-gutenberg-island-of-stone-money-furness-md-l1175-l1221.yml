  summary: The passage describes costume adornments, especially ear ornaments and
    necklaces. Women are said to prefer natural leaves and flowers, while men wear
    glass-bead loops with shell pendants, tortoise-shell ornaments, improvised colorful
    materials, and necklaces. Rare pink shell pendants are described as highly valued
    and owned by wealthy families, while ordinary shell-disc necklaces are worn by
    common folk.
