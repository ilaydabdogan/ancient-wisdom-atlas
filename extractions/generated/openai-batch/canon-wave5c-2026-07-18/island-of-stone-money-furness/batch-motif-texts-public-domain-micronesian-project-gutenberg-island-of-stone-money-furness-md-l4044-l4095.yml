canonical_text:
  quote: ''
  summary: 'The passage describes parts of Mafel''s burial: goods and a sprouting
    coconut are provided for his post-mortem journey, the grave is sealed against
    monitor lizards, mourners wail until the grave is completed, the funeral route
    is explained as a status-marking custom, and Fatumak explains that burial posture
    and orientation depend on manner of death.'
  language: English
  quote_policy: summarized
