canonical_text:
  quote: ''
  summary: 'The passage describes tattooing customs: captured women were tattooed
    as reminders of their former status and beauty; elaborate tattooing was said to
    have been introduced from Mukamuk by drifting men; a leg pattern once reserved
    for warriors later became fashionable; shark representations had protective or
    status associations; and the native art, Gotau, was performed by women using soot,
    coconut milk, water, pointed sticks, and bone gravers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tattooing was not generally prevalent among women, except among women captured
    from other communities to be companions for men in the Failu or Pabai.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Captured women were tattooed on the backs of their hands and on their legs
    as a lasting reminder of their earlier status and youthful beauty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Middle-aged men with elaborate tattooing say the fashion was introduced from
    Mukamuk, an island north of Uap.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men from Mukamuk are said to have drifted down to Uap and taught both men
    and women how to tattoo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In earlier times only warriors were allowed to ornament their legs with the
    pattern called Thilibetrak.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After serious battles between neighboring districts ceased, the restriction
    on Thilibetrak was ignored and the leg patterns became fashionable adornment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ngol are representations of sharks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some people say Ngol patterns protect wearers from shark attacks while swimming
    in the lagoon, while others say they are chosen because the shark is the king
    of fish and fish are important food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gotau is given as the native name for the art of tattooing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women are usually the tattoo artists during long nights and lazy days in the
    Pabai or the Failu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The coloring material is made from soot from burning coconut oil, the milk
    of the coconut, and a little water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sticky mixture is dabbed on the skin, the outline is marked with a pointed
    stick, and the coloring matter is driven under the skin with a rake-shaped needle
    or graver made from frigate-bird wing bone or a substitute wing bone.
  category: action
  evidence_refs:
  - ev:6
