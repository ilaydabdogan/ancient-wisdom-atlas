  summary: The passage describes a standing-up tsuru performed chiefly by younger
    men who assemble from the failu in a shoulder-to-shoulder line. They begin with
    careful spacing, foot marking-time, and hand clapping, then a named singer, probably
    Gamiau, starts a high-pitched song and the group joins in a fast sequence of arm,
    leg, kneeling, and body-swaying motions. The narrator reports being unable to
    understand or obtain a translation of the song and speculates that archaic phrases
    or an inherited impropriety may explain its opacity.
