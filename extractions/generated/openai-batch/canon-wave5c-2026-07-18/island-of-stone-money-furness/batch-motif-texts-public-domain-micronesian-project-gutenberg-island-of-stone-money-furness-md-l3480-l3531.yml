canonical_text:
  quote: ''
  summary: 'The passage describes services of the mach-mach: touching a sick person;
    using a stingray-tail spine talisman and incantation to calm sea weather by driving
    away an invisible god; conducting a child-naming rite ten days after birth with
    coconut palm leaves, an appeal to Yalafath, and expulsion of demons; receiving
    payment in money or food; and a named example, Fatumak, trading with Friedlander.
    A caption also refers to carrying babies in a hamper.'
  language: English
  quote_policy: summarized
