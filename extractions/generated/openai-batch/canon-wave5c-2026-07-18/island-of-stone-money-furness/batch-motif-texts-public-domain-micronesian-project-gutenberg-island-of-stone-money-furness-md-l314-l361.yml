canonical_text:
  quote: ''
  summary: 'The passage describes interiors of private houses in Uap: dust and cobwebs,
    smoke without chimneys, a dark screened sleeping room, storage under rafters,
    and household objects put away. The narrator recounts being allowed to search
    houses for ethnological items while owners answered questions, while valuables
    were probably kept hidden in the inner chamber and objects wanted by the narrator
    would be paid for with trade tobacco. The passage ends with the narrator landing
    near such houses at Priedlander''s copra station and noting Priedlander''s wife,
    a native of Guam and Roman Catholic convert who had not adopted Western house
    style.'
