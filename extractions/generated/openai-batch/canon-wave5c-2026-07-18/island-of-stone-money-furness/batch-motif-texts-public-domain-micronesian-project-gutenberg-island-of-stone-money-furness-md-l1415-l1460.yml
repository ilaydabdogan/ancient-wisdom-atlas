canonical_text:
  quote: ''
  summary: The narrator describes failed attempts to interest an audience with phonograph
    recordings in unfamiliar words, then records a youth speaking native words and
    immediately plays them back. The audience reacts with awe, repeats the words,
    wonders whether the boy is inside the horn, then laughs and demands repetition.
    The machine becomes accepted as a talking and singing object, and later women
    request a separate exhibition in a cleared copra storehouse.
