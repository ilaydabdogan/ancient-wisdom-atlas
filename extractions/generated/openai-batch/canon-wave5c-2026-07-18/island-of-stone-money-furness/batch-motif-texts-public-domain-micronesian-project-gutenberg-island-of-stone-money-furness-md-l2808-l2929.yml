canonical_text:
  quote: ''
  summary: The narrator describes Fatumak, a man from Uap who learned and remembered
    legends during a long solitary confinement after a fall. Fatumak is regarded locally
    as wise and prophetic, lives alone among many salvaged possessions, uses locks
    and boxes to protect them, travels by a small raft to tell fortunes, and interprets
    knotted palm or Bei leaves. The passage says that the hidden meanings of the knots
    concern marriages of the kan or demons and are kept secret, passed from father
    to son near the father’s death. A client consults Fatumak about whether a sick
    friend will recover, and Fatumak gives favorable answers.
  language: English
  quote_policy: summarized
