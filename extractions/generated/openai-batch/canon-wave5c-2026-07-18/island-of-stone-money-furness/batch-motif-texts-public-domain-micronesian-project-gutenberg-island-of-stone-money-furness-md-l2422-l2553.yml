canonical_text:
  quote: ''
  summary: A narrator describes befriending a Uap girl through explanations of her
    ear ornaments, a reciprocal display of tattooing, and cat's-cradle string figures.
    Other children and the chief join the string play. Later, children play a dangerous
    moonlit game throwing glowing coconut-husk firebrands in a coconut grove; Friedlander
    disperses them and threatens adults with responsibility and confiscation of fei
    if fire damage occurs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl's father explains that the apparent lumps are halves of coconut shell
    worn to protect recently pierced ears, with saffron or reng-reng smeared over
    the shells, neck, and cheeks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When she sees the narrator's interest is friendly, the girl loosens the strings
    holding the shell protectors and shows swollen punctured ear lobes with oily green
    leaves inserted to keep the holes open.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator displays Japanese tattooing on his arms as a fair exchange, and
    the girl touches it with black and yellow smudged fingers; the two become friends.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator shows a cat's-cradle figure, and the girl makes a string figure
    called melang, described as coral with a stalk and two side branches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cat's-cradle lesson includes Uap words and phrases glossed by the narrator,
    including terms for 'not right,' 'all right,' 'very painful,' and 'excellent,
    very good.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other children gather and compete at making cat's-cradle figures, while Lian
    the chief attempts a pattern but fails because his hands shake; his daughter jeers
    at him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kakofel is described as a tom-boy of Dulukan who is present in mischief and
    in the roughest games with the boys.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: On a moonlit night, children in a coconut grove throw glowing coconut-husk
    firebrands from behind coconut trees, scattering sparks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Friedlander fears fire damage to his thatched storehouses and disperses the
    children, leaving dropped embers glowing in the grove.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Friedlander tells men and boys at the failu that they must restrict the children,
    especially Kakofel, or he will hold them responsible for fire damage and confiscate
    their largest and whitest fei until compensation is made.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Several men start into the darkness to catch and chastise the culprits, but
    the narrator compares the task to trying to catch a frigate bird.
  category: sequence
  evidence_refs:
  - ev:8
