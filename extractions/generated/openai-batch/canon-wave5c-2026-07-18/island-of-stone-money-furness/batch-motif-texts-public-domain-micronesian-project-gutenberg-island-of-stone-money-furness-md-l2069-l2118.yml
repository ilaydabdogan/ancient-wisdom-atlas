  summary: An informant describes a nearby family whose wealth is acknowledged although
    its enormous fei stone money has rested unseen on the sea floor for generations.
    The stone was lost from a raft in a storm after an ancestor acquired it; witnesses
    affirmed its size, quality, and blameless loss, so the community continued to
    recognize its purchasing power. The passage also notes that the weight of fei
    discourages theft.
