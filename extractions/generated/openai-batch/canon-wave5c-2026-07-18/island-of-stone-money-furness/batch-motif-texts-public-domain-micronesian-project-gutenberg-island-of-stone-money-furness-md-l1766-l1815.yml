  quote: ''
  summary: An observer describes decorated performers arranged by age and size at
    the front of the failu for a seated posture-song called tsuru. The performance
    is witnessed by an audience and is described as narrating heroes in canoes at
    sea or legends of Kan/devils, with singers using arm and wrist motions resembling
    rowing or repelling foes and using no weapons. The observer also states that the
    posture-dance belongs to the same class as dances seen in Japan, Anam, and Siam.
  language: English
