canonical_text:
  quote: ''
  summary: The passage describes Uap men's houses called failu on the coast and pabai
    inland. They are found in all villages, are reserved for men, serve as places
    for councils and community affairs, and are also used by men and boys for song
    and dance. Women are excluded, explicitly on grounds of decorum. These houses
    may take years to build, but men often occupy them before completion once the
    framework and roof are finished.
