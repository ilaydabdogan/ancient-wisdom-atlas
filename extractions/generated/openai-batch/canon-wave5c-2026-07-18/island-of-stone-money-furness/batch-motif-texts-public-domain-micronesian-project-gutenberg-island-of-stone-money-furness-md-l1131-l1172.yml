canonical_text:
  quote: ''
  summary: 'The passage describes Uap ear adornment practices: boys and girls have
    earlobes pierced and gradually stretched at about age ten to twelve; the lobe
    holes receive leaves, flowers, or cotton; a maluek leaf plug is prepared with
    fire and coconut oil for stretching and healing; boys endure painful swelling
    without protectors, while girls may wear stained coconut-shell protectors; a smaller
    upper ear hole may hold a flower stem.'
