  summary: Chapter XI describes tattooing in Uap as a formerly elaborate male fashion
    now declining. It says older male tattooing covered much of the body, was done
    painfully with sea-fowl or fish bone points rather than steel needles, and was
    understood by the narrator as adornment rather than a badge of superiority. The
    passage states that the only distinction it seemed to confer was proof that the
    ornamented person was a free man, since the Pimlingai slave class were prohibited
    from tattooing their bodies.
