  summary: The passage describes exchange values for Yapese fei stone money, including
    food, pigs, coconuts, pearl shell, tools, rice, and compensation for theft of
    a mispil. It also describes pearl-shell strings used as small change, their construction,
    measurement, and depreciation if damaged.
