canonical_text:
  quote: ''
  summary: 'The passage describes Uap stone money, called fei: moss or lichen on the
    surface does not reduce value; discs are cut nearly circular with a central hole
    for carrying by pole; smaller coins are used in purchases and valued by diameter
    measured in spans; fei are displayed before a failu as evidence of wealth and
    industry; large fei may change ownership by acknowledgment without being moved
    from the former owner''s premises.'
  language: English
  quote_policy: summarized
