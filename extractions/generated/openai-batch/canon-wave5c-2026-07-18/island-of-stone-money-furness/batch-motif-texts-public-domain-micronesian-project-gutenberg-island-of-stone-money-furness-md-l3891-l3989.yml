  quote: ''
  summary: A funeral party mourns Maf el, places pearl shells on his chest, wraps
    and carries his body on a litter through island paths and villages to a grave
    clearing, sets the body near the recent grave of his wife, and begins further
    mourning and grave preparation.
  language: English
