canonical_text:
  quote: ''
  summary: 'The passage describes Uap stone money called fei: large limestone wheels
    made from valued stone quarried and shaped in Babelthuap, transported by canoe
    and raft across the ocean, and treated as a durable medium of exchange representing
    labor. It also describes how size, whiteness, fine grain, and storage conditions
    affect value and appearance.'
