  summary: The passage describes rules governing contact between women and men at
    a bachelors' house, the display and sale of fish with unattended payments in shell
    money or stone money-wheels, communal use of those payments by the failu, and
    the presence of a common mistress or mispil who is obtained from another district
    by force or cunning.
