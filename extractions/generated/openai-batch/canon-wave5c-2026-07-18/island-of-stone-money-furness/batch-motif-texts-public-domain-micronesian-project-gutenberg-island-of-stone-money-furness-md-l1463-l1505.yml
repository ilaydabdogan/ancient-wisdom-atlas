canonical_text:
  quote: ''
  summary: The narrator describes playing English and native songs on a recording
    machine for women in a crowded bamboo house. The English song bores them, while
    a native song amazes and delights them. Later two young girls sing a duet said
    to be used at funerals to praise the deceased and express survivors' grief; the
    recording is imperfect but makes the women eager to hear their own voices.
  language: ''
  quote_policy: summarized
