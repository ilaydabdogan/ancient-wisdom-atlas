  text: After being free to visit home, family, and friends, the people described
    return willingly and voluntarily to the failu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that in earlier times many districts were at constant war,
    high-born nobles were divided into two named tribes, and the capture of a mispil
    was accompanied by bloodshed and enduring feuds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the later situation described, the seizure of a young girl to fill the
    office of mispil is characterized as reduced to something like a commonplace burglary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The seizure is said to be almost always furtively prearranged with the chief
    of the district, because the parents appeal to him for redress.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Captors who have chosen a victim are expected to pay shell money and stone
