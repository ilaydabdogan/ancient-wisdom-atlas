  summary: The passage describes people returning willingly to the failu after visiting
    home, contrasts earlier violent captures of a mispil during interdistrict warfare
    with later furtive, compensated seizures of young girls for that office, and introduces
    Gamiau’s account of the capture of Lemet, the mispil of Dulukan.
  language: English
  quote_policy: summarized
