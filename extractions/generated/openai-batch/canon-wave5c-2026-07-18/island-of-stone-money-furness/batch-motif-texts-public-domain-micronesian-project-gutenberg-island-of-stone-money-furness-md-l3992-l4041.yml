  quote: placed him in the grave, with his head toward the setting sun
  summary: 'The passage describes preparations for a burial: earth is removed in coconut-frond
    baskets, women collect stones and coral to line and cover the grave, spectators
    sit silently, the narrator’s tattoos are inspected by women nearby, and Maf el
    is placed in a small grave on a mat with his head toward the setting sun. Before
    earth is put over him, one Pimlingai takes two pearl shells from the corpse as
    payment for the burial labor.'
