canonical_text:
  quote: ''
  summary: The passage lists living or extinct clans of Walpi and Sichumovi by former
    homes, grouping them as from Tokonabi, from Palatkwabi and the Little Colorado,
    and from Muiobi/Rio Grande valley and New Mexican pueblos. It notes that Sichumovi’s
    original settlers belonged to the New Mexican pueblo-related group, but their
    descendants intermarried with Hopi people and lost their linguistic characteristics.
    The remainder gives clan names and glosses, many of them animal, plant, weather,
    object, or religious-being designations.
  language: ''
