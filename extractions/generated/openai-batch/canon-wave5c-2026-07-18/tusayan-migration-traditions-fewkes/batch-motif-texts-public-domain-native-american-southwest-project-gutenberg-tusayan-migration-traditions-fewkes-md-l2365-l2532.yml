candidate_motifs:
- id: motif:1
  label: Ritual correspondence between Hopi and Zuni warrior societies
  taxonomy_refs: []
  basis: The passage lists multiple correspondences between the Pakab/Momtcita material
    and Zuni Bow society material, including society identity, figurine correspondence,
    ritual action, cardinal-point animal images, and dance resemblance.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an ethnographic comparison in the passage, not a mythic narrative
    episode.
- id: motif:2
  label: Clan departure and westward migration through named settlements
  taxonomy_refs:
  - departure
  basis: The Asa are said to leave the Rio Grande region and travel through Tukwi,
    Kawaika, Akokaiabi, and Zuni before continuing toward Tusayan.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy term is broad; the passage concerns clan migration tradition
    rather than an individual hero departure.
- id: motif:3
  label: Drought-driven exile and return
  taxonomy_refs:
  - departure
  - return
  basis: Years of drought and famine lead the Asa to leave the East mesa for Canyon
    de Chelly, after which they eventually return to Walpi.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives a historical-clan migration account rather than a symbolic
    death-and-return myth.
- id: motif:4
  label: Clan foundation of settlements
  taxonomy_refs: []
  basis: The Asa build Tcakwainaki and later Asa women found Sichumovi; the Pakab-Awata
