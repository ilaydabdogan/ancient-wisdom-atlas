  cautions: This is a social-political arrangement in a migration tradition, not a
    fully developed recurring motif in the passage.
comparison_claims:
- id: claim:1
  claim: The passage supports a close functional and ritual comparison between the
    Hopi Momtcita/Kalektakii material and the Zuni Society of the Bow/Bow-priest warrior
    celebration.
  claim_level: same_function
  target: Zuni Society of the Bow / Zuni Bow priests' warrior celebration
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports correspondences and resemblance but does not provide
    full ritual texts or performances for independent verification.
- id: claim:2
  claim: The passage presents a cautious historical-contact or derivation claim that
    the Momtcita may come from Zuni, a Zuni pueblo colony, or a shared source also
    underlying the Zuni variant.
  claim_level: historical_contact
  target: Zuni or a Zuni-related pueblo source for the Momtcita
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The stated alternatives include derivation from Zuni, from a Zuni colony,
    or from a common source; the passage does not settle among these.
- id: claim:3
  claim: The passage supports a cautious connection between Pakab/Reed-Arrow clans
    and Awata/Bow clans in relation to possible Awatobi foundation.
  claim_level: historical_contact
  target: Awata/Bow clans and Awatobi foundation tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: low
  limitations: The passage explicitly says there is nothing definite to support the
    claim except the statement that Pakab people were at Awatobi.
- id: claim:4
  claim: The passage supports a comparison between a Tcakwaina cult at Zuni and on
    the East mesa, ascribing the shared cult to the Asa/Tcakwaina clan.
  claim_level: same_motif
  target: Cult of Tcakwaina common to Zuni and the East mesa
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement appears in a footnote and no detailed ritual description
