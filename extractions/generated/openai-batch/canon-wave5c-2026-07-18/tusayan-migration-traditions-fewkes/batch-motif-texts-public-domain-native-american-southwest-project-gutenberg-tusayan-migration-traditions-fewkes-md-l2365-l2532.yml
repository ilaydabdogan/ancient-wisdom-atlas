- id: claim:5
  claim: The passage compares Asa traditions of leaving for the Navaho country during
    famine with Anza-era reports of Hopi distress, abandoned pueblos, and departed
    families around 1780.
  claim_level: historical_contact
  target: Anza-era report of Hopi crop failure and departures
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents the identification as probable, not certain.
- id: claim:6
  claim: The passage cautiously links Asa and Tewa clan movements to a larger Tanoan
