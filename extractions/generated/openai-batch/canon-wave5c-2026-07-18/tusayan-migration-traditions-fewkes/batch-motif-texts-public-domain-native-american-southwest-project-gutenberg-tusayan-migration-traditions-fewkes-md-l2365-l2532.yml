canonical_text:
  quote: ''
  summary: The passage discusses Pakab ritual connections with Zuni warrior societies,
    possible Pakab-Awata relations to Awatobi, and traditions of Asa/Tcakwaina clan
    migrations from the Rio Grande region through several pueblos to Zuni, Awatobi
    mesa, East mesa, Canyon de Chelly, Walpi, and Sichumovi. It also correlates some
    Asa traditions with drought, famine, Anza-era reports, and post-1680 Tanoan movements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pakab chief is described as also chief of a warrior society called Kalektakii,
    which Hopi identify with the Zuni Society of the Bow.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pakab chief has a figurine of Piiukonhoya corresponding to the Zuni Ahaiuta,
    and his acts when setting it in place are described as identical with those of
    Naiuche, the Zuni Bow chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The room where the figurine is kept has wall figures of animals of the cardinal
    points, and the passage says these are identical with those at Zuni.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The public dance of the Momtcita is said to resemble the War dance at Zuni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that evidence indicates the Momtcita is closely related
    to the warrior celebration of Zuni Bow priests and may have been derived from
    Zuni, a Zuni pueblo colony, or the same source as the Zuni variant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage treats the Pakab or Reed/Arrow clans as possibly the same as the
    Awata or Bow clans and as possible founders of Awatobi, while noting limited evidence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Asa clans are said to have formerly lived near Santa Fe and Abiquiu, to
    have Tewa ancestry, and to have left the Rio Grande around the end of the sixteenth
    century.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Asa migration route is described as going to Tukwi, then Kawaika, Akokaiabi,
    and Sioki/Zuni, where some clan members still lived as the Aiwakokwe clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some Asa continued from Zuni to the Awatobi mesa, built Tcakwainaki, and were
    said to have katcinas with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Asa did not remain long at Tcakwainaki and continued to the East mesa,
    where some traditions say they joined related Tewa clans and aided them in fights
    with the Ute.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Asa traditions say they later built houses at the end of the East mesa above
    the gap east of Hano.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Years of drought caused famine, after which the Asa moved to Canyon de Chelly
    in the Navaho country, lived in houses now ruined, intermarried with the Navaho,
    and eventually returned to Walpi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the Asa returned to Walpi and found other Tewa clans in their former
    dwellings, the Walpi chief assigned them a new village site at the head of the
    Stairway trail on condition that they defend it against enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Toward the end of the eighteenth century, most women of the Asa phratry moved
    to another point on the East mesa and founded Sichumovi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage suggests the Asa exodus to the Navaho country may correspond to
    a period around 1780, when Hopi crop failure, abandoned pueblos, and departing
    families are reported in connection with Anza.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage says it is not unlikely that Asa and Tewa clans formed part of
    Tanoan people who left the upper Rio Grande valley after the 1680 rebellion and
    traveled to Tusayan by way of Zuni.
  category: relationship
  evidence_refs:
  - ev:9
