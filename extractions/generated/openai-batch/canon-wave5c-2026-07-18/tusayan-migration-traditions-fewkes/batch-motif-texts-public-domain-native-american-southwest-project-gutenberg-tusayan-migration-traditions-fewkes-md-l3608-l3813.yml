canonical_text:
  quote: ''
  summary: The passage gives Hano clan totals, then describes the personnel, clan
    links, origins, and ceremonial roles of Walpi religious societies. It notes that
    katcina dances involve all men and older boys, Soyaluna involves all families,
    and the katcina cultus is attributed to eastern pueblos with named masked personages.
    It then describes Tokonabi-derived Snake and Antelope priest societies, their
    association with Snake-Horn clans, their ancient status at Walpi, the Snake dance
    and January ceremonials, later expansion beyond clan limits, and bear and puma
    personation in secret Snake-dance ceremonies.
  language: English
  quote_policy: summarized
