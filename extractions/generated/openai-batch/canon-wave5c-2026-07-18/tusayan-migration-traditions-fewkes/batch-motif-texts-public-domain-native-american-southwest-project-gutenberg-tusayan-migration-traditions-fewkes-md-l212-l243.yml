  summary: 'The passage describes Hopi reactions to Spanish priests and mission activity:
    initial tolerance of a new cult, resentment of pressure to abandon Hopi practices
    and accept baptism, claims of coerced unpaid labor, uncertain compensation, enduring
    hostility toward the mission period, surviving Spanish-era objects in Walpi, and
    introduced livestock, fruits, and seeds attributed as lasting benefits.'
