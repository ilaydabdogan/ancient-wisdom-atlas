canonical_text:
  quote: ''
  summary: The passage discusses Asa migration traditions and ritual objects at Walpi,
    including katcinas, an heirloom mask called Tcakwaina, possible relations to Natacka
    and Calako taka masks, and possible Zuni connections. It also notes place-name
    explanations and lists Asa people at Walpi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the 'Joso' or Hopi were probably Tewa from the East mesa,
    and connects the name Josoge, meaning 'Hopi pueblo,' with Asa return to the Rio
    Grande and the old pueblo at Abiquiu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Asa people, like the Honani, are said to have brought some katcinas to
    Walpi, including Tcakwaina.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Asa winter solstice meeting, peculiar fetishes are exhibited in the
    kiva.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Asa display an old mask called Tcakwaina as an heirloom and claim they
    brought it when they came into the country.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes a striking likeness between the Tcakwaina mask and Natacka
    masks, and says the author suspects the Asa brought the Natacka to the East mesa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the Asa are not represented in the Middle mesa pueblos
    and Oraibi, and reports the author's suspicion that Oraibi has no Natacka in the
    Powamu ceremony.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the masks of Tcakwaina, Natacka, and Calako taka have
    noteworthy similarity in symbolism, and says it is not impossible that they derive
    from Zuni or a Zuni settlement.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage identifies the home of Calako as the ruin of Winima near St Johns,
    Arizona, and says both Hopi and Zuni legends report that the Zuni Calako came
    from there; the Hopi Calako is said to have come from the same place.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says it is highly probable that the Asa introduced several other
    katcinas besides the Tcakwainas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sichumovi is described as the present home of the Asa and as often called
    a Zuni pueblo, probably because it was settled by Asa clans from Zuni.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage lists Asa people at Walpi under men and boys, and women.
  category: other
  evidence_refs:
  - ev:7
