canonical_text:
  quote: ''
  summary: The passage first gives a tabular membership list for the Mamzrautix Society,
    divided by women, men, and clan headings, though several names are affected by
    OCR irregularities. It then describes the Kalektaka as a warrior society introduced
    by the Pakab clans. Its Momtcita ceremony is said to closely resemble the Priesthood
    of the Bow at Zuni, leading to the view that the society is of New Mexican origin.
    Among the Hopi, however, it is described as a Pakab clan celebration that does
    not dominate the rites of other societies, unlike the Society of the Bow in Zuni
    ritual.
  language: English with Hopi/Zuni terms and OCR irregularities
