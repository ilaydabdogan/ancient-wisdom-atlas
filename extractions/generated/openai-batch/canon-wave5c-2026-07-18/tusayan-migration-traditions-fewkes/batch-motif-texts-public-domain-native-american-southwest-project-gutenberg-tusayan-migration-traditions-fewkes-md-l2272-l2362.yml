canonical_text:
  quote: ''
  summary: The passage lists names under “Katcina or Anwuci (Walpi)” and then summarizes
    traditions concerning the Pakab clans. Pautiwa, identified with the Eagle clan,
    says his ancestors came from eastern pueblos and lived at Kwavonampi. The author
    discusses possible identifications of Pakab with Arrow and Awata/Bow clans and
    with Awatobi. Stephen, citing Pautiwa, reports that the Eagle clan formerly lived
    at Citaimu, abandoned it, and split between Walpi and Mishongnovi. The passage
    also notes that the Pakab Momtcita ceremony resembles a Zuni rite and occurs just
    after the winter solstice.
  language: English with Indigenous names and terms
