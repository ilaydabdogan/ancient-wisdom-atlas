canonical_text:
  quote: ''
  summary: The passage describes Hano/Tewa settlement at East Mesa near springs and
    a named rocky mound, lists original Tewa clans and chiefly affiliations, notes
    ritual objects at a Sun shrine and communal spring-cleaning practice, recounts
    traditions of Tewa defeat of Ute raiders at a sand hill later called Meat mound,
    and states that the Tewa received farmland north of Wala as a reward for defending
    Tusayan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hano/Tewa group went to the East Mesa and built a pueblo on high land
    near Isba, also called Coyote spring; traces of the old pueblo walls are said
    to remain near Yellow-rock mound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While living at the old pueblo they used a spring called Unba; Unba is described
    as filled with sand, while Isba is still used by Hano people.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists original Tewa clans with Hopi and English equivalents, including
    Rain-cloud, Tobacco, Corn, Pine, Katcina, Sand, Pink-shell, Crane, Turquoise,
    Sun, Firewood, Bear, and Bivalve-shell; some listed clans are marked extinct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage states that several Hano clan names correspond to Walpi clan
    names derived from the same objects: Rain-cloud, Tobacco, Corn, Katcina, Sand,
    and Bear.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Named Hano chiefs or leaders are connected with clans: Anote with Tobacco,
    Kepo with Kolon, Mapibi with Sand, and Potan with Bear.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Sun shrine east of Yellow-rock mound is used during the Tantai rite, and
    during Soyaluna it receives sun-ladder pahos, raincloud-ladder pahos, and feathered
    strings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Hano-owned spring is cleaned when filled with sand through communal work
    announced by the town crier; men work, women cook nearby, a feast follows, and
    old men smoke ceremonial tobacco in ancient pipes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Traditions of conflict with the Ute are said to have several variants, but
    all agree that the Tewa fought and defeated the Ute.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Ute last stand is placed on a sand hill east of the mesa, where captured
    sheep were driven together and their carcasses made into a rampart.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sand hill is said to be named Cikwitu'kwi, or Meat mound, because of the
    battle occurrence there.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: All but a few Ute were killed; the survivors were released and sent back with
    the message that the Tewa bears had come to Tusayan to defend it, after which
    Ute inroads ceased.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: As a reward for aiding against the Ute, the Tewa received farmland north of
    a line drawn through Wala, while Hopi clan landholdings are described as south
    of that line.
  category: relationship
  evidence_refs:
  - ev:8
