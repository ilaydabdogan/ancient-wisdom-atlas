canonical_text:
  quote: ''
  summary: 'The passage gives clan population counts for Walpi and Sichumovi, then
    summarizes Hano clan traditions: Hano people are mainly descendants of Tewa clans
    invited to the East mesa by a Snake chief of Walpi after Awatobi’s destruction.
    It describes their Tewa language, Hopi intermarriage, repeated Hopi embassies
    with prayer sticks to a Tewa chief during Ute attacks, acceptance of the fourth
    invitation, westward migration, claimed original home at Tcewadi, linguistic links
    with named pueblos, and a route of migration attributed to Hatco.'
  language: English
  quote_policy: summarized
