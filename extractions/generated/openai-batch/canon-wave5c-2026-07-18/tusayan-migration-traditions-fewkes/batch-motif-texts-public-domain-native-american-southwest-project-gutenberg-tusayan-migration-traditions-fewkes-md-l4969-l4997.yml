  summary: 'The passage lists conclusions about pueblo ritual origins and migration:
    Hano is described as Tanoan and transplanted to the East Mesa; Sichumovi ceremonies
    are described as eastern and Tanoan in ritual character; Walpi is described as
    formed through Snake, Bear, Horn, Flute, southern Arizona, and eastern colonist
    components; and a wholly northern nomadic origin for the present Hopi is questioned.'
