  text: Captain Melchior Diaz is reported to have learned from native informants that
    Totonteac was about seven days from Cibola, resembled Cibola in country, houses,
    and people, had cotton, and contained twelve towns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coronado is reported to have written that Cibolan informants described Totonteac
    as a hot lake with five or six houses and separately told him of distant cities,
    with Tucano named as the first of four known places.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that Coronado's informants did not seem to treat Totonteac
    and Tucano as the same settlement cluster or kingdom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author proposes that Totonteac and Tucano may have been names for two
    different groups of villages west and northwest of Cibola, not necessarily the
    present Hopi pueblos.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author proposes that both village groups may have been inhabited by clans
    that later found refuge in what is now the Moqui reservation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old men of the Gila Indians told Carets in 1775 that the Moqui nation formerly
