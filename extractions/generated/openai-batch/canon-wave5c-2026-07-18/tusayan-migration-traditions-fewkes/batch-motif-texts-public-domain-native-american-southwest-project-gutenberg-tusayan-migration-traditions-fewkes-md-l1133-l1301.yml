canonical_text:
  quote: ''
  summary: The passage surveys traditions and ethnographic interpretations about clans
    said to have moved from Palatkwabi and Little Colorado pueblos toward Hopi/Tusayan,
    Zuni, Awatobi, the Middle mesa, Walpi, and other settlements. It describes Patun/Squash,
    Lenya/Flute, Patki, Piba, and related clans; discusses the southern origin and
    transmission of the Alosaka cult; and notes ritual objects and images including
    horned figurines, pollen or flower mounds, Alosaka personations, the Tuwapontumsi
    shrine with petrified wood, and Alosaka images in New-fire and Winter-solstice
    contexts.
  language: English, with Hopi/Tusayan terms
  quote_policy: summarized
