canonical_text:
  quote: ''
  summary: The passage describes Sumaikoli priests and cult as connected with katcinas
    and supposed to have come to Tusayan from New Mexico. It then summarizes East
    Mesa ritual calendars for Walpi, Sichumovi, and Hano, emphasizing Walpi's modified
    Hopi ritual, Sichumovi's eastern pueblo and Zuni-related elements, and Hano's
    fragmentary Rio Grande/Tcewadi ritual survival with katcina personations visiting
    kivas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sumaikoli priests and cult are described as closely connected with the
    katcinas and as supposed to have been introduced into Tusayan from New Mexico.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Walpi is identified as the only East Mesa pueblo where a true Hopi ritual
    is celebrated, while also being strongly affected by intrusive clans from other
    stocks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Powamu observance at Walpi is said to differ greatly from the Oraibi performance,
    with Asa and Hano clans named as especially important in producing the modification.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Walpi ritual calendar lists observances across the year, including Winter
    Snake or Flute, Powamu, Palulukonti, Sumaikoli, abbreviated katcina observances,
    Niman-katcina, Tawa-paholawu, Snake or Flute dance in alternate years, Lalakonti,
    Mamzrauti, Wiiwiitcimti or Naacnaiya, Soyaluna, and Momtcita.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note ascribes the introduction of Natacka at the Walpi Powamu ceremony to
    the Tcaliwaina or Asa clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sichumovi ritual calendar includes Pamu'ti, Zuni Return Katcina, Powamti
    with katcina visitors to Walpi kivas, Palulukonti, abbreviated katcina observances,
    occasional Sio Calako, occasional Bulintikibi, occasional Owakulti, and a December
    Soyaluna contribution to Walpi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Sichumovi, Tewa clans identified as Asa and Honani predominate, and katcinas
    are said to predominate there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bulintikibi at Sichumovi is described as intrusive and almost identical
    with an eastern pueblo ceremony, while the Sio Calako is described as an incorporated
    and greatly abbreviated Zuni observance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Hano ritual calendar includes abbreviated katcina observances, Powamti
    katcina visitors to Walpi kivas, Palulukonti, Tawa-paholawu as sun prayer-stick
    making, Sumaikoli, occasional Howina, Tantai as winter solstice rites, and a warrior
    celebration.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Hano ritual is described as a fragmentary survival of the ritual at Tcewadi,
    the Rio Grande home of the Hano clans.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: No katcina altar had yet been seen in Hano, and several ceremonies named for
    Hopi pueblos are said not to be presented in that Tewa pueblo.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hano January and February celebrations take the form of katcina personations
    that visit Walpi, Sichumovi, and Hano kivas; Hano and Sichumovi also contribute
    katcina personators to Walpi, making Walpi's Powamu different from that in other
    Hopi pueblos.
  category: action
  evidence_refs:
  - ev:9
