canonical_text:
  quote: ''
  summary: The passage discusses evidence for long Hopi residence in Tusayan, compares
    Eototo with Masauu, lists Kokop and Honani clan members, describes Tewa and Tano
    migrations from the Rio Grande to Hopi country and partial return, and recounts
    Honani traditions about katcinas emerging from the Underworld at Tuwanacabi, being
    kept by Honani clans, and later clan movements and dispersals after the Awatobi
    massacre.
  language: English
  quote_policy: summarized
