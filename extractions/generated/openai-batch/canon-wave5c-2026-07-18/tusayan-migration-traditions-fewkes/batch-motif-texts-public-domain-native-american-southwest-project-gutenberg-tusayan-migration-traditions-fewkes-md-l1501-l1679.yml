canonical_text:
  quote: ''
  summary: The passage first gives tabular lists of Patki clan members, grouped by
    men and boys and women and girls, including members at Sichumovi. It then describes
    the Piba/Tobacco clan and the closely associated Tabo/Rabbit and Sowi/Hare clans
    as having a southern origin, with former habitations on the Little Colorado near
    Winslow, probably at a ruin called Cakwabaiyaki. It also notes Piba presence at
    Awatobi and possibly Pakatcomo, identifies Tapolo as a Piba chief and first Tataukyamu
    chief at Walpi, identifies Hani as Tapolo’s descendant and a chief of the same
    society, and adds a footnote that Tapolo admitted hostile Walpi into Awatobi before
    its destruction and later settled at Walpi.
  language: English with Hopi names and OCR-corrupted forms
  quote_policy: summarized
