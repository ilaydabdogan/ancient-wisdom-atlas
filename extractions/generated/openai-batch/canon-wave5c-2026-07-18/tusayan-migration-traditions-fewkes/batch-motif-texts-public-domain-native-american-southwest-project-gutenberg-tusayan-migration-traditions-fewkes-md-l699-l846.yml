canonical_text:
  quote: ''
  summary: The passage reports traditions about Snake-associated clans, including
    earlier association of Puma, Dove, Horn, and Snake peoples at Tokonabi; intermarriage
    with Snake women; conflict among offspring; southward migration to Wukoki; and
    a figure named Tcamahia who goes east seeking clans emerging from the Underworld,
    is directed by the war god Piiiikonhoya through an arrow sent to a sipapu, and
    joins clans at Acoma. The passage also links these traditions to Snake dance ceremonial
    objects and roles, including stone celts called tcamahias, puma and snake symbols,
    and antelope/horn elements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Snake, Puma, Dove, and Cactus peoples may have been
    represented when the Snake settlement was first made at the northern base of the
    East mesa, with the Snake clan dominant and its chief governing the town.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that in former life at Tokonabi the Dove, Puma, Horn, and
    Snake were associated, and that some accounts also include the Tiiwa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Snake legend is described as a mythic story of the adventures of the god
    Tiyo in the Underworld.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The legend says a youth of the Puma clan brought home a Snake-clan girl as
    his wife, and a Horn-clan brother also married a Snake-clan girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Because the offspring of the two Snake women did not get along with children
    of other clans at Tokonabi, the Puma, Snake, and Horn clans migrated southward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Horn separated from the other migrating clans, while the Puma and Snake
    continued to Wukoki and built a pueblo there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tcamahia left the Puma and Snake at Wukoki to seek other clans said to be
    emerging from the Underworld in the far east.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Sotcaptukwi near Santa Fe, Tcamahia met Piiiikonhoya, the war god, and
    told him the object of his quest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Piiiikonhoya shot an arrow to a sipapu or orifice in the north where people
    were emerging from the Underworld; the arrow returned with a message directing
    Tcamahia westward to join the clans.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tcamahia followed the direction and met the clans at Akokaiobi, identified
    in the passage as the Hopi name of Acoma.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The narrator explains the name Tcamahia as meaning the Ancients.
  category: speech
  evidence_refs:
