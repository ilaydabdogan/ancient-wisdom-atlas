canonical_text:
  quote: Who are you? Whence have you come?
  summary: 'The passage describes a symbolic reception of Flute priests at Walpi:
    chiefs of the Bear and Snake clans stand behind a meal line barring entrance,
    the Bear chief challenges the Flute chief, the Flute chief identifies his group
    as kindred and as knowing rain-bringing songs, ritual objects are received, prayer
    offerings are given, and the meal line is removed and remade to show the entrance
    open. The passage then explains that major ceremonies often involve returning
    to old worship sites or ancestral springs to obtain ritual water, giving examples
    involving Wenima, Sipabi, and Clear creek. The final portion lists Ala-Lenya clan
    or phratry names under men/boys and women/girls.'
  language: English
  quote_policy: quoted
