  summary: 'The passage summarizes traditions and ethnographic notes about the Honau/Bear
    clan and Kokop clans: their reported former homes, migrations into Tusayan or
    Walpi-related territory, claims involving Masauu, the destruction of Sikyatki,
    the current remnant state of the Honau clan in Walpi, and Katci''s account of
    Kokop movements from Jemez through other locations.'
