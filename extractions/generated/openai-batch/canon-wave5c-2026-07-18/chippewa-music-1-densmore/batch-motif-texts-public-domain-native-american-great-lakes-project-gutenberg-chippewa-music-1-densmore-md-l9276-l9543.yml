canonical_text:
  quote: ''
  summary: The passage presents Chippewa/Ojibwe war-related songs and explanatory
    prose. It includes a pipe-related song fragment, the return of a war messenger
    after pipe smoking, the mustering of warriors, a feast and final pledge inaugurating
    a war expedition, an initial dance and nightly dances until reaching the enemy,
    a song declaring no fear of death, and a shaming song naming a man who stayed
    home instead of joining warriors.
  language: English with Ojibwe/Chippewa song texts and glosses
  quote_policy: summarized
