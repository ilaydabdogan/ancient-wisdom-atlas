canonical_text:
  quote: ''
  summary: The passage gives musical analysis of woman's dance songs and begging dance
    songs, noting tonalities, scales, rhythmic features, drum relationships, and stated
    social context. It says the woman's dance songs are associated with merrymaking
    and gifts, and that the begging dance was said to derive from the Sioux and involved
    a large drum carried by two or three men as a party went from tent to tent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The woman''s dance songs are described statistically: 70 percent are minor
    in tonality, half begin on the dominant, 40 percent have a range of an octave,
    40 percent have a range of a twelfth, half are on five-toned scales, and only
    one contains an accidental.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: All of the woman's dance songs are described as purely melodic in structure,
    and their upward and downward progressions are evenly divided.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The triple drum-rhythm is said to occur with all of the woman's dance songs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rhythm of the woman's dance songs is described as catchy and pleasing,
    and the passage connects the group with merrymaking and simple pleasure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that gifts were an important feature of the woman's dance
    and notes a tonal correspondence between woman's dance songs and gift songs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The begging dance songs group comprises Nos. 187 and 188 of Bulletin 45 and
    Nos. 114-118 of the present work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The begging dance, like the woman's dance, is said to have been derived from
    the Sioux.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the writer's observation among both Chippewa and Sioux, a large drum is
    used in the begging dance.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The large drum is carried by two or three men as the begging party goes from
    tent to tent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The begging dance songs are analyzed as 72 percent major in tonality, with
    71 percent beginning on the dominant and only 14 percent beginning on the tonic.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The percentage of downward progression in the begging dance songs is 67, described
    as the same as in the Mide' and the largest in the entire series.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says the percentage of ascending fourths in the begging dance
    songs is the largest in the series except in the pipe dance, and that this interval
    has been found to characterize songs concerning motion.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: For the begging dance songs, the number of songs having the same metric unit
    of voice and drum equals the number in which the drum is faster than the voice.
  category: relationship
  evidence_refs:
  - ev:8
