  summary: The passage gives musical analysis of recorded Chippewa songs, then presents
    No. 169, “If I Were a Son-in-law,” with lyrics about taking June berries on a
    journey and explanatory notes on son-in-law status. It next presents No. 170,
    “Work Steadily,” a woman’s love song expressing fear that an addressee will be
    taken away. The passage then describes the pipe dance as an old Chippewa good-time
    dance believed to have come from the manido, in which men carry and transfer a
    pipestem and rattle while dancing in a crouched posture meant to represent a pipe.
