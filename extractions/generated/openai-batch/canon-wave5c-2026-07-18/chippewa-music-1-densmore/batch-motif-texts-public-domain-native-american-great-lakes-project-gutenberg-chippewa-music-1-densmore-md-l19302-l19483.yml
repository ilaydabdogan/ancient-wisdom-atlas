canonical_text:
  quote: ''
  summary: The passage describes an aged Lac du Flambeau woman’s account of making
    moccasins, including cutting deerskin with a knife, gathering and sewing the moccasin,
    moistening and shaping it, using fastening strips, and sewing with sinew according
    to old custom. It then presents Love Song No. 113, sung by O^gabea^sino'kwe and
    recorded without drum, with a translation in which a speaker says they will talk
    with and love a widow sweetheart, followed by brief musical analysis.
  language: English with Ojibwe/Chippewa song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pattern for moccasins was cut by an aged woman at Lac du Flambeau who made
    the moccasins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman said that in the old days they had no shears, cut deerskin with
    a knife, and used no pattern, making a covering for the feet and gathering it
    up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: She sewed the moccasin up the instep and used a short strip to pipe it so
    it would hold firm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She moistened the inside of the moccasin, molded the outline with the back
    of a knife placed inside it, moistened the gathered front with tepid water, and
    flattened it on her knee.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seam up the back was curved below the heel, leaving a small triangle of
    deerskin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The illustrated pair used one long strip passed through two small slits at
