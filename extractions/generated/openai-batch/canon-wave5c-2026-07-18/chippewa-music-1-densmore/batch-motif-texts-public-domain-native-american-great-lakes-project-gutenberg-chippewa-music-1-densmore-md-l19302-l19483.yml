  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The illustrated pair had flaps separate from the feet, and the sewing was
    done with sinew according to old custom.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: After discussion and hesitation, a blind woman sang a song that was recorded
