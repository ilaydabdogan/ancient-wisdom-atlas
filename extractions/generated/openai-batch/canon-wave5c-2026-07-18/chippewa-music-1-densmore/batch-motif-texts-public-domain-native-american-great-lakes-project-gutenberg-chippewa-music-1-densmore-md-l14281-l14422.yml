canonical_text:
  quote: '"Red means blood (life), and the red paint is for long life."'
  summary: The passage describes a mourning-ending ceremony connected with drum parties.
    White Feather invites mourners, spreads his blanket for them, and thanks the people
    and Manido. Mourners' faces are painted while songs are sung. An old man, speaking
    in White Feather's place for White Feather's mother, offers a mourning woman the
    strength and power that sustained him in battle. The passage explains that war
    honors and rights, such as wearing a feather, may be shared in this ceremony without
    being lost by the giver. White Feather later tells the mourners to lift their
    eyes, release sorrow and unkind feelings, trust themselves, and remember that
    all die but will meet afterward. The mourners are seated among drum parties or
    friends, and gifts are placed beside them.
  language: English
  quote_policy: quoted
