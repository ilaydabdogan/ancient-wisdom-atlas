canonical_text:
  quote: ''
  summary: The passage describes an evening gathering at Lac du Flambeau after the
    ceremony of Restoring the Mourners, with drumming, singing, and dancing around
    a warrior drum to be presented to the Menominee. It then gives song texts and
    analyses for selected Chippewa war songs, including a thunderbird vision song
    in which tobacco is held and tossed toward the sky to direct a storm, a song about
    ravens singing in the sky, a war song, and a song whose text says the singer is
    small and comes from the south.
  language: English with Ojibwe song text and glosses
  quote_policy: summarized
