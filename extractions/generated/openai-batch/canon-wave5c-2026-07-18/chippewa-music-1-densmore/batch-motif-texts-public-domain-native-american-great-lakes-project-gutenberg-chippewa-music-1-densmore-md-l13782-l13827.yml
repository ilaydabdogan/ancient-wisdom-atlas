canonical_text:
  quote: ''
  summary: 'Ethnographic description of a Chippewa Drum-presentation Ceremony: seating
    around the drum, named ceremonial roles, women’s singing, drum-related objects,
    reciprocal gift and hospitality obligations, messengers carrying warrior pipes,
    a Sioux departure song, and identification of songs sung by Mec''kawigabau.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief drummer is usually seated on the western side of the drum; at his
    right hand are placed the drum pipe, a turtle shell filled with tobacco mixed
    with red willow bark, and other articles belonging to the drum.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief drummer starts the songs and leads the singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Leading drummers sit by the four stakes or legs supporting the drum, while
    less important singers and drummers sit between them and have no permanent seats.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The women form a large outer circle, sit with bowed heads, cover their mouths
    with hands or shawls, and sing the melody through the nose an octave above the
    men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chief of the band, the owner of the drum, the speaker, and the four leading
    dancers sit on the long seat surrounding the dancing hall or circle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The aid sits alone at a little distance and is ready to act as messenger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Those who care for the drum and pipes have no official duties during a ceremony
    and are usually seated with the drummers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Before presenting a drum, the presenting man customarily asks whether the
    intended recipient wishes to assume the obligations connected with accepting it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Acceptance of the drum involves providing gifts for the drum party, one or
    more feasts for guests, food for the guests' camp during their stay, and later
    returning an equivalent set of gifts to the donor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: When ready to return the equivalent gifts, the recipient sends a messenger
    to the donor and afterward visits with a large party carrying the gifts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: About ten days before the presentation of drums by the Lac du Flambeau Chippewa
    to the Menominee, two messengers were sent with the warrior pipes belonging to
    the two drums.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before the messengers left Lac du Flambeau, a dance was held and the final
    song was the Sioux song of departure sung at the close of gatherings connected
    with the Drum-presentation Ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The ceremonial songs in the following narrative were sung by Mec'kawigabau,
