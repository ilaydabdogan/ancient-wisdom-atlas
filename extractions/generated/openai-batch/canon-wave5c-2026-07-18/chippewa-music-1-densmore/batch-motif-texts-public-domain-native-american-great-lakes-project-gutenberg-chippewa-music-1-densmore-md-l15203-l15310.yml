canonical_text:
  quote: ''
  summary: 'The passage describes the close of a Chippewa-Menominee drum-presentation
    ceremony: Wis''kino ceremonially touches the chief drum, Menominee drummers take
    it up, gifts are exchanged, pipes are raised and passed, and a departure song
    ends the day. It then notes the following day''s warrior drum presentation, fourth-day
    dancing and adornment-giving, the Song of the Closed Door and its enclosure rule,
    musical analysis, and an account of a Dog Feast sometimes associated with the
    fourth day and said to have been received from the Sioux.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wis'kino stood beside the drum holding a long drumstick with a loon neck at
    the end, pretended to strike the drum three times, and lightly touched it on the
    fourth attempt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wis'kino's final light touch, four leading drummers each struck the drum
    sharply with decorated drumsticks.
  category: action
  evidence_refs:
  - ev:1
