  text: The Song of the Owner of the Drum was performed and is described as signifying
    that the drum belonged fully to the Menominee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Menominee presented gifts to the Chippewa by spreading a blanket on the
