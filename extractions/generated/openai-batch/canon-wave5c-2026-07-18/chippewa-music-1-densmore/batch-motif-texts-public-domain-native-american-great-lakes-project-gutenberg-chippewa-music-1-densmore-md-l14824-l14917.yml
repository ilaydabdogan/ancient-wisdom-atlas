canonical_text:
  quote: ''
  summary: The passage describes the arrival and formal reception of a Chippewa party
    by Menominee hosts. Wis'kino sends a messenger to invite the visitors, the Menominee
    form lines with a flag bearer, the Chippewa arrive in procession with flags, pipe
    bearers, drums, singers, women, and children, White Feather gives a speech invoking
    Manido and peace, pipes are presented and smoked, members of the two groups shake
    hands, and the flags, drums, and drum articles are placed around or within the
    dancing circle.
  language: English
  quote_policy: summarized
