canonical_text:
  quote: ''
  summary: The passage describes a Chippewa-Sioux peace pact. Opposing war parties
    approach in ceremonial order, with women moving before the warriors. Both sides
    sing a peace-pact melody naming and praising the other side's leaders. The groups
    fire guns into the air without reloading, pipe bearers offer the peace pipe for
    leaders to smoke, warriors shake hands, hospitality is offered, and subsequent
    nightly ca'wiino'ga dances are described.
  language: English with Indigenous terms
  quote_policy: summarized
