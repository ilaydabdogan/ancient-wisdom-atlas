canonical_text:
  quote: ''
  summary: The passage describes an account of Wa'hunowuck, an eastern herb medicine
    said to have both good and harmful uses, its origin through a fasting young man
    instructed by an eastern manido, and its later dangerous ceremonial use. It then
    recounts Odjib'we's childhood losses to the Sioux, his choice of a warrior career,
    his fasting for a dream, a dream in which a woman shows enemy weapons becoming
    harmless horseflies, and the dream song that he treated as a sacred personal possession.
  language: English with Ojibwe terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wa'hunowuck is described as an eastern herb medicine distinct from two other
    medicines; it was said once to have good offices, but evil uses later prevailed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Na'waji'bigo'kwe gave the origin story and said the tradition had been related
    to her by her grandfather.
  category: speech
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: A young man wanted to join the Mide'wiwin to gain hunting power, but his father
    opposed him as too trifling for so solemn a matter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man went away and fasted many days; a manido from the east came
    to him and told him about the medicine and its good and bad properties.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The young man gathered men around him, formed an alliance known as Wa'hunog,
    held dances, and used the medicine unscrupulously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eight men were destroyed at the first dance given by a man who knew the secret
    of the medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The medicine was said to kill or cure those who took it, to work as an evil
    charm, and to make things go through the air.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The three medicines discussed in the surrounding section are summarized as
    imparting healing, success, and revenge and as being suited to men on the warpath.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Odjib'we's paternal grandfather, two of that grandfather's brothers, and two
    of Odjib'we's brothers were killed by the Sioux; Odjib'we then chose the career
    of a warrior.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Odjib'we fasted alone in the woods, hoping for a dream or vision, and after
    a four-day fast he had a dream.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Odjib'we's dream, a woman carried guns made of rushes and gave them to
    approaching Sioux, telling them to shoot at him.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: When the Sioux shot the rush guns, horseflies came out, landed on Odjib'we,
    and could not harm him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The dream woman told Odjib'we that he would be a great warrior and would always
    be protected; Odjib'we said he was never wounded by the Sioux.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The woman sang a song that became Odjib'we's dream song; he later sang it
    before or during fights.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the dream song was recorded, Odjib'we feared he would not live long
    because he had given away his most sacred possession.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The translated song text states that when they shot, they missed the man.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The musical analysis says the dream song contains nine measures, four parts,
