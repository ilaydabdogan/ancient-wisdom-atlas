canonical_text:
  quote: ''
  summary: The passage gives musical analysis of two Southern Dance Songs, then describes
    songs connected with the giving of a pony at a dance. A song announces that a
    pony will be given away; a man uses a stick as part of the public performance,
    and a later song of thanks is led by the man who received the pony-stick. The
    passage also describes reciprocal expectations involving ponies, a beaded suit,
    and dance participation, and briefly notes moccasin game songs with no dream origin
    attributed to them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: No. 121 and No. 122 are Southern Dance Songs said to be always sung together
    and recorded consecutively.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: The analysis of No. 121 says people were sometimes carried away by the dance
    and danced all night, with each song sung an indefinite number of times without
    interruption of the time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The analysis of No. 122 describes a closing call or ejaculation descending
    glissando, sometimes accompanied by rapid drum beating.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The analysis of No. 122 says it has the same drumbeat as the preceding song;
    the dance seems to gather speed while the drum retains an even, moderate beat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a dance, hearing the pony-gift song tells the people that a pony is to
    be given away.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man dances around the drum with a little stick, whips an imaginary pony
    with it, presents the stick to a friend, and the actual pony transfer takes place
    later.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If people are slow to volunteer ponies, the head drummer may start the song;
    someone may present a beaded suit to the owner of a desirable pony, and the expected
    return is a pony.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who have given away ponies join the dance, and others who dance at that
    time are required to part with their ponies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man who has received the pony-stick leads the dance during the song of
    thanks, carrying the stick; previous pony givers dance with him and many hold
    up fingers to show the number of ponies they have presented at dances.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The moccasin game songs mentioned at the end are described as ordinary songs
