canonical_text:
  quote: "“It was said that the dogs gave this song to a boy…”"
  summary: The passage begins with rhythmic-analysis tables and then introduces begging
    dance songs. It reports that the first begging dance song and the dance came from
    the Assinniboin, or Rock Sioux, and had long been practiced among the Chippewa.
    E'niwGb'e gives an origin account in which a baby boy is placed outside near dogs,
    the dogs warm him and cause him to know a song, and when grown he sings from camp
    to camp with dogs following him and is given food. Later begging dance practice,
    associated song texts, and dog-identification in performance are also described.
  language: English with transcribed Chippewa/Ojibwe song terms
  quote_policy: quoted
