  summary: After listening to songs in E'niwub'e's house, the writer goes outside
    at night. The moonlit lake and pines are described. A group carrying a drum comes
    down the road from Bi'jikens's house, where they had been dancing; they are bringing
    the drum to E'niwub'e's house to sing with both drums.
