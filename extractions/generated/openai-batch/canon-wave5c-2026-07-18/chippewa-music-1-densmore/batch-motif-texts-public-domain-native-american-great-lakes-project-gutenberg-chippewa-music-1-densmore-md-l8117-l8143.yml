canonical_text:
  quote: ''
  summary: A Chippewa war party led by Hole-in-the-day sets an ambush near the Minnesota
    River. After allowing a mixed group of Sioux men and women to pass, the leader
    signals Odjib'we to shoot a lone Sioux man. Odjib'we drags the wounded man, receives
    entitlement to a skunk-skin war-honor badge for catching him by the arm, and takes
    his scalp after the man is killed. The Chippewa flee by canoe, dance on the opposite
    shore while waving the scalp and taunting the Sioux, and later return home.
  language: English
  quote_policy: summarized
