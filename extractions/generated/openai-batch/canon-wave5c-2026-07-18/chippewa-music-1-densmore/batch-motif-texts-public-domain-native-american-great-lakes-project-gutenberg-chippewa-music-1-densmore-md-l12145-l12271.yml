canonical_text:
  quote: ''
  summary: 'The passage gives musicological analysis of songs, presents the dream
    song No. 43, "I am Called," sung by Odjib''we, with glosses saying that a speaker
    is called by a spirit from the middle of the great water. It then describes post-dance
    handling of scalps: wrapping them, sending them between villages for similar dances,
    carrying them with tobacco and associated songs, returning them to the first village,
    and setting scalp-bearing poles in a grave. The passage closes by introducing
    procedures for peace pacts between Chippewa and Sioux, initiated by messengers.'
  language: English with Ojibwe/Chippewa song text and English glosses
  quote_policy: summarized
