canonical_text:
  quote: ''
  summary: The passage discusses Chippewa singing and transcription practices. It
    describes rhythmic independence between voice and drum; varied singing techniques
    by song type, including love-song nasal drawling, Mide'wiwin syllables, throaty
    vocables, and cultivated vibrato; and the difficulty of representing Chippewa
    intonation with piano-scale notation.
  language: English
  quote_policy: summarized
