  text: Voice and drum are described as distinct expressions even when they appear
    to share the same metric unit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drum may slightly precede or follow the voice; one cited record has the
    drum begin behind the voice, briefly align with it, and end slightly ahead of
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The manner of Chippewa singing is said to vary according to the nature of
    the song and the skill of the singer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A nasal drawling style is said to be always used in love songs and in no other
    songs; it is not loud and remotely suggests an animal call.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Songs of the Mide'wiwin are described as containing meaningless syllables
    that are distinctly pronounced and often similarly given across renditions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Mide'wiwin songs, words are said to be more often mispronounced or changed
    to fit the music, which is described as the essential element of the song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Other classes of songs use throaty vocables that differentiate tones but cannot
    be expressed in letters; the passage says Chippewa singers do not move the lips
    for these vocables and seem to produce them by contraction of the glottis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A vibrato or wavering tone is described as cultivated among younger singers
    and considered evidence of musical skill.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: Intonation according to the piano scale is said to vary widely among singers
    and sometimes within intervals sung by the same person.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The transcriptions are described as approximate representations using familiar
    notation, with additional signs and descriptive notes for features not graphically
    expressible.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The signs + and — above a note indicate that a tone was persistently sung
    less than a semitone above or below the transcribed note.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Five records are said to show faulty intonation at the beginning of a song
    that was corrected in the latter part.
  category: sequence
  evidence_refs:
  - ev:4
