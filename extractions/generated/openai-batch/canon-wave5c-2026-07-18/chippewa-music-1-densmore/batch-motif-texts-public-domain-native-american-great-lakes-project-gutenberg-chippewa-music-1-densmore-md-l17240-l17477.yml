canonical_text:
  quote: ''
  summary: The passage gives tabular and analytical notes on rhythmic units in songs,
    then presents dream-song accounts. In one account, a fasting man dreams of cloud-dwelling
    manido' who invite him upward, where thunderbirds teach him a song. In another,
    a fasting man seeking a dream hears voices beyond a hill, sees deer standing in
    a circle, hears them plan a seasonal dance, and learns a song sung by a little
    buck; he later uses it when hunting deer. The passage also includes song transcriptions,
    word glosses, and musical analysis of the Thunderbird and Deer songs.
  language: English with transcribed song text and glosses
  quote_policy: summarized
