canonical_text:
  quote: ''
  summary: The passage describes an origin incident for soaking bullets used in a
    moccasin game, a second dream associated with gaming confidence, and detailed
    rules and practices for hiding and guessing a marked bullet under moccasins while
    players sing, drum, observe bodily signs, keep score, and wager goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife appeared to a man and told him that four hidden bullets in the woods
    would bring success in the moccasin game if he let them lie in water before use.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man searched in the woods day after day, found four bullets, and placed
    them in water at the edge of a lake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After using the bullets that had been in water, the man won everything and
    was thereafter successful; the passage says this began the custom of soaking bullets.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Another successful player had a dream of a row of moccasins and found a piece
    of money under each one; the dream gave him confidence in playing.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The game may be played by two men but usually has four men, two partners against
    two partners.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each side hides four bullets under four moccasins laid in a row on a blanket,
    and one of the bullets is marked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Skill consists in placing the marked bullet so that opposing players cannot
    readily locate it; the side hiding the bullets scores.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Players study involuntary signs and mannerisms that may reveal where the marked
    bullet was placed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Before play, a blanket is spread on the ground and goods such as a rifle,
    blanket, shirt, or beaded bag may be staked on the result.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A knife is tossed to decide which side hides first; one player may hold a
    drum, another lays out moccasins and bullets, and the guessing side holds a striking-stick
    and bullets for indicating its guess.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When play begins, the drummer sings and beats the drum while a partner lifts
    each moccasin toe and slips a bullet underneath as opponents watch closely.
  category: action
  evidence_refs:
  - ev:10
