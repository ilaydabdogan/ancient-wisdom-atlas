canonical_text:
  quote: ''
  summary: 'The passage describes two song groups: songs connected with gifts, usually
    the gift of a pony, sung by the giver or recipient with singers at the drum in
    social dances; and songs for the entertainment of children, usually humorous and
    mimicking tribal interests and occupations. It also gives musical analysis and
    compares these groups with nearby song groups such as moccasin game, woman''s
    dance, begging dance, pipe dance, dream songs, and war songs.'
  language: English with Ojibwe song-group terms
  quote_policy: summarized
