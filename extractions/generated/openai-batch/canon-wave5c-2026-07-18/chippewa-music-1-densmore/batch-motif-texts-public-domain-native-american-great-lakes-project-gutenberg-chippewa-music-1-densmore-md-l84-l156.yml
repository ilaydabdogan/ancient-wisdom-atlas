  summary: The passage presents musicological analysis of recorded Chippewa songs.
    It discusses words being subordinated to melody, possible archaic or symbolic
    origins of apparently meaningless syllables, definitions of key and tonality,
    methods for determining keynote and major/minor tonality, interval statistics,
    initial and final tones, melodic range, and relation to overtones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited passage attributed to Charles S. Myers states that words may be sacrificed
    to tune, that meaningless words or syllables may be introduced, and that meanings
    may disappear as songs are handed down over generations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that recorded Chippewa songs usually show a relation of
    tones to a keynote, while their harmonic relation may be complicated or absent
    in some instances.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies rudimentary elements of key in the songs, including
    persistence of the third and fifth above the keynote, correct octave intonation,
    and frequent tonic triads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the keynote is determined by an ear test and tonality is
    determined by the distance of the third and sixth above the keynote.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that about 57 percent of the analyzed songs are major
    in tonality, 42 percent are minor, and three songs change between major and minor
    by altering the pitch of the third while retaining the same keynote.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that the seventh occurs in only about 9 percent of the
    minor songs and describes whether it lies a semitone or whole tone below the tonic.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that 54 percent of the songs begin on the dominant and
    15 percent begin on the octave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that 67 percent of the songs end on the tonic and that
    in 90 percent the final tone is the lowest tone in the melody.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that many songs have a compass of 12 tones or an octave,
    and that the melodic boundary of a majority corresponds to a fundamental tone
    and its principal harmonic upper partial tones.
  category: attribute
  evidence_refs:
  - ev:6
