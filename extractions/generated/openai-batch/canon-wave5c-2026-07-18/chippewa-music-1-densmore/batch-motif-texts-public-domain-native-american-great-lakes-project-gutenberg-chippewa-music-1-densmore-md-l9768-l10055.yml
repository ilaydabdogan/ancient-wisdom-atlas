- id: obs:1
  text: At the conclusion of the dog feast and dance, the party leader began the song
    of departure and the warriors took up the melody.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The warriors left the feast scene dancing rather than marching and followed
    their leader toward the enemy's land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Only one woman, usually the leader's wife, was allowed to accompany the war
    party.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Four women escorted the warriors out of the village, walked back and forth
    in front of them, joined their song, and had faces whitened with clay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The four women divided into two on each side of the path; the warriors passed
