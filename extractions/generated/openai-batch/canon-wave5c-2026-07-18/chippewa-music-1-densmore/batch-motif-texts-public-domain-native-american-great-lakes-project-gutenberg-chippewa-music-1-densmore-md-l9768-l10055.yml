canonical_text:
  quote: ''
  summary: 'The passage describes a Chippewa war party leaving after a dog feast and
    dance while singing a song of departure, escorted by women with whitened faces.
    It then gives song texts and descriptions of warpath practices: evening camp formation,
    the leader''s solitary singing, use of drum, lighted pipe, and deer-hoof rattle
    for divination, a leader''s song about seeing the whole earth, and a solitary
    dream song about going south and bringing the south wind.'
  language: English with Ojibwe song words and English glosses
  quote_policy: summarized
