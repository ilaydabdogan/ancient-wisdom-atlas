canonical_text:
  quote: ''
  summary: An ethnographic narrative describes a Chippewa war expedition organized
    by Ge'miwunac'. Men from Pillager, Mississippi, and Mille Lac groups travel from
    Crow Wing by canoe, camp, dance and sing around a fire, then proceed through woods
    and prairie. Scouts are sent ahead near Sioux country, report a wide new trail,
    and the party later finds temporary lodges, a dance and council place, and forty-two
    stones marking the number present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ge'miwunac', described as a member of the Pillager Band of Chippewa, organized
    the war expedition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A party of twenty Pillagers came to the Mississippi village and wanted them
    to join; ten Mississippi and seven Mille Lac men decided to go.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The combined party started from Crow Wing in canoes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A few miles down the Mississippi River the party made its first camp and held
    its first war dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odjib'we said the song of the first war dance was sung every evening while
    the party was away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some men danced around the fire, others sat still, and all sang before going
    to bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The next morning the party broke camp, traveled through the woods, and later
    rested in concealment by day and traveled by night on the prairie.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Near Sioux country, two scouts were sent ahead with instructions to return
    and report signs of the enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the narration, Odjib'we assumed a scout-like posture, with one hand
    shading his eyes and the other signaling to supposed followers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The scouts returned and reported a wide new trail, saying the Sioux must have
    passed that day; one estimated one hundred people, while the other estimated forty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Chippewa remained in a grove until morning, then cleaned and loaded their
    guns and set out to follow the Sioux trail.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: They found four green-bough lodges where the Sioux had spent the night, a
    nearby dancing and council place, and forty-two stones arranged in a circle indicating
    the number of warriors present at the council.
  category: object
  evidence_refs:
  - ev:5
