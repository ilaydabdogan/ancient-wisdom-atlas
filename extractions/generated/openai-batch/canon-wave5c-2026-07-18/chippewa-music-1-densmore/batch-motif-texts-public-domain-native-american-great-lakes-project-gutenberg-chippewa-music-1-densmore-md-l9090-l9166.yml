canonical_text:
  quote: ''
  summary: 'The passage describes customs and recollections associated with Chippewa
    recruits and war parties: a blindfolded marrow-bone breaking contest for young
    warriors, first-war-party mittens and a scratch stick, taboos concerning weapons
    and snakes, a narrated dawn attack on a Sioux village, scalping practices, and
    leaders calling wind, dream-song provision, and thunderbird-sent rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When deer or other large game were killed by warriors, a breaking-bone contest
    was held in the recruits' camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the contest, a marrow bone was placed on the ground; the participant walked
    eight paces away, was blindfolded, and tried to strike the bone with a hatchet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young warrior on his first expedition could get a taste of fat only through
    this contest, and the prize was not given unless he actually broke the bone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men on their first war party were required to wear mittens on both hands from
    leaving the village until entering a fight with the Sioux.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small stick was hung from the wrist of the tied mittens and was to be used
    for scratching the head or body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Failure to use the scratch stick was said to result in boils or sores, and
    Ma'djigi'jig explained the rule by saying recruits lacked the protective medicines
    carried by warriors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the recruits' camp, stepping over another person's article, especially
    a gun, was avoided because it was believed to make the object useless and could
    lead to punishment by the owner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: It was considered a bad omen for a recruit to see a snake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ma'djigi'jig related an attack on a Sioux village that occurred during his
    first war expedition.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At dusk, the war-party leader sent experienced men to reconnoiter; they approached
    under cover of night, counted tipis, estimated warriors, and reported after midnight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before daybreak, the Chippewa approached the Sioux village; the leader called
    for wind, and the wind masked the sound of the Chippewa approach.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A warrior gave a quavering note on a tiny whistle, compared in the passage
    to the call of a waking bird, and this served as the signal to fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After firing, the Chippewa rushed at the tipis, tore them down, and killed
    as many wounded people as possible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage describes warriors severing a Sioux person's head, later removing
    the scalp, and carrying the scalp at the victor's side.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a war party lacked provisions, the leader selected a camp near a lake,
    smoked his pipe, sang his dream song, smoked again, and announced that a deer
    was coming and had been sent to the party.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Before attacking a Sioux village, a leader could call on the thunderbird to
    send rain so the Sioux would remain at home and not detect the Chippewa approach.
  category: action
  evidence_refs:
  - ev:8
