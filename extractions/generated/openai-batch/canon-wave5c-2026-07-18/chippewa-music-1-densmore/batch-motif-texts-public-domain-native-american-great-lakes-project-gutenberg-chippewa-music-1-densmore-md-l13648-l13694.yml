literal_observations:
- id: obs:1
  text: 'Two named drum types are distinguished: a chief drum usually given by one
    chief or leader to another, and a warrior drum presented by one member of the
    tribe to another.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the witnessed ceremony, the chief drum was presented to Wis'kino of the
    West Branch Settlement of the Menominee tribe by Bi'jikens, a member of the Lac
    du Flambeau Band of Chippewa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the same ceremony, a warrior drum was presented to a Menominee from another
    part of the reservation by a Lac du Flambeau Chippewa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief drum was kept in Bi'jikens's house on a low box in a corner, with
    the box and surrounding floor covered by a clean white quilt.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Articles associated with the chief drum included a pipe filled and ready for
    use and drumsticks in neat cloth cases.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bi'jikens and his family treated the drum and everything pertaining to it
    with great respect.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: After hesitation, Bi'jikens consented to the drum being photographed, and
