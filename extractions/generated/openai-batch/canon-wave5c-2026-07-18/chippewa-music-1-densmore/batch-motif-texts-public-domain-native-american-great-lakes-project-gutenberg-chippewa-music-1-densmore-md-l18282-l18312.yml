canonical_text:
  quote: ''
  summary: 'The passage describes rules and signals in a moccasin game: guessing players
    infer where a marked bullet is hidden under moccasins, indicate guesses through
    hand and bullet positions, and score differently depending on correct or incorrect
    guesses, including a special “double crack” when both players guess correctly.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guessing player holding the striking-stick may risk the score on his own
    judgment if he believes he knows which moccasin hides the marked bullet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When making that individual risk, the striking-stick player extends his right
    hand with two fingers spread, and his partner does not indicate a guess.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The guesser holding the bullets places the marked bullet in his own hand in
    a position corresponding to the moccasin where he thinks the other marked bullet
    is concealed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man holding the bullets is allowed only one guess.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man with the striking-stick is allowed three guesses and may toss aside
    two moccasins without finding the marked bullet before turning another moccasin
    for the score.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The partner indicates his own guess after the striking-stick player's action.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the partner's guess is correct, he opens his hand and shows the marked
    bullet in the right position.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the partner's guess is incorrect, he extends his hand with the thumb down
    to mean “I have guessed wrong.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A correct guess by both players is called a “double crack” and gives them
    an additional turn at hiding the bullets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage includes captions for a signal meaning “I guessed wrong” and for
    an arrangement of bullets indicating a guess.
  category: other
  evidence_refs:
  - ev:6
