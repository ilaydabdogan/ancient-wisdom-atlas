canonical_text:
  quote: ''
  summary: The passage introduces Chippewa game songs by stating a belief that a Manido
    taught gambling games to relieve hunger and ill fortune. It names three games
    and notes which had songs. It says present-day games may be treated as pastimes,
    while older Indians still revere them as a gift from the Manido. A narrative attributed
    to E'niwub'e begins with a Chippewa hunter whose wives and children die during
    a remote hunting expedition; after burying them, he considers suicide, chooses
    instead to wander until exhaustion, refuses water, and collapses.
  language: English with Chippewa/Ojibwe terms as transcribed in the passage
  quote_policy: summarized
