canonical_text:
  quote: ''
  summary: The passage gives musical analysis and song texts for Chippewa songs sung
    by Ki'miwun, including doctor's or dream songs used in healing. Translated song
    images include a body lying in the east, sitting with a turtle, being carried
    by wind around the sky, and the approach of thunderbirds. The passage also describes
    a doctor's treatment involving swallowed bones, hissing or blowing on a sick person,
    a whistle as bones issue from the mouth, and an older practice of drawing bones
    from a shallow dish of water.
  language: English with transcribed Chippewa/Ojibwe song words
  quote_policy: summarized
