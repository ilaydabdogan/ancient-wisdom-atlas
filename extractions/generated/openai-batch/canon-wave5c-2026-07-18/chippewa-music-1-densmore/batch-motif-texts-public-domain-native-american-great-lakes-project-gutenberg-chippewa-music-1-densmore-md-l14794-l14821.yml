  quote: ''
  summary: The writer reaches a Menominee ceremonial gathering near Neopit, on the
    Menominee Reservation. The passage describes the camp area, the dancing circle,
    its openings, the eastern entrance with an American flag and tobacco collection,
    drums near the entrance, and a courteous reception by Wis'kino, who reports that
    the Chippewa are on their way and tired from travel.
  language: English
