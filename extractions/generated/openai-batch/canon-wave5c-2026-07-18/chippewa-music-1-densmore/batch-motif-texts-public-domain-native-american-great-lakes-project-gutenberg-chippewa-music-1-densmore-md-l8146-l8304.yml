canonical_text:
  quote: ''
  summary: The passage presents two Chippewa songs sung by Odjib'we with musical analysis
    and an explanatory war narrative. One song, "An Eagle Feather I See," includes
    glosses referring to an eagle feather, seeing, a brave, and catching; a note explains
    the feather as worn by a warrior who took an enemy scalp. The narrative recounts
    Odjib'we leading a war party against a Sioux man near a lake, the killing of the
    Sioux, removal of his scalp by Mo'kadjiwens, and the later loss of the scalp.
    A second song, "Song of a Mislaid Scalp," states that Mo'kadjiwens took a Sioux
    scalp that is hanging in a marsh; the account says the song was sung at a victory
    dance with both credit and ridicule.
  language: English with Ojibwe/Chippewa song text and glosses
  quote_policy: summarized
