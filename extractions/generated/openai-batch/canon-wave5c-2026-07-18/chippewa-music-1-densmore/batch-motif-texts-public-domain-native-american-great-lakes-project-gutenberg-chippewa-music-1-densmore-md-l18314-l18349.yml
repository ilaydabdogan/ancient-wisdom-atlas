canonical_text:
  quote: ''
  summary: The passage describes rules and scoring for a moccasin game at White Earth,
    Minnesota. One side hides bullets under moccasins until the guessing side guesses
    correctly. A guesser uses a striking-stick and counting-sticks, with special endgame
    rules when few counting-sticks remain. The score depends on the marked bullet's
    position, the guesses made, and agreement or disagreement between guessers. After
    each game, a stick is placed in the ground by the blanket, and stakes are settled
    after an agreed number of games.
  language: English
  quote_policy: summarized
