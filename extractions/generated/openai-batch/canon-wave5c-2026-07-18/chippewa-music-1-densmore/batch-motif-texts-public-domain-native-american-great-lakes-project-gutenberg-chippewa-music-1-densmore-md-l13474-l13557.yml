canonical_text:
  quote: ''
  summary: The passage describes a 1910 Drum-presentation Ceremony in which Lac du
    Flambeau Chippewa presented two drums to Menominee people, explains the associated
    dancing periods, describes the drum religion as oriented toward peace and strict
    ritual law, records Wis'kino's statements about keeping and visiting the drum
    with tobacco, and notes traditions that the Sioux earlier gave a drum and songs
    to the Chippewa and that a woman was involved as the means used by a manido' in
    giving this type of drum.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In October 1910, the writer witnessed a ceremony accompanying the presentation
    of two drums by the Lac du Flambeau Band of Chippewa in Wisconsin to the Menominee
    Indians in Wisconsin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Part of the ceremony was enacted on the Lac du Flambeau Reservation and part
    on the Menominee Reservation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ceremony is called Dewe'igun omi'giwen', translated in the passage as
    'a drum is given away,' or the Drum-presentation Ceremony; Barrett described it
    under the title Dream Dance.
  category: speech
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:4
  text: Before departure, the Chippewa danced four days on their reservation, and
    the Menominee danced the same length of time before the arrival; there were also
    four days of dancing on the Menominee Reservation at the presentation and four
    days of dancing together afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The drum and its ceremonies are described as highly venerated, giving rise
    to what is called the 'drum religion.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the drum religion concerns peace between peoples who
    have been at enmity and includes strict ritual requirements concerning songs and
    duration of dancing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wis'kino, a Menominee chief who received one of the Chippewa drums, said he
    would keep the drum in his house, keep tobacco beside it, and keep the drum pipe
    filled.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wis'kino said friends would visit the drum and that he and his wife would
    sometimes hold a small feast beside it, asking the drum to strengthen them in
    faith and in the resolution to live justly and wrong no one.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wis'kino said that when he and his wife acted alone there would be no songs,
    because only special men may sing the songs of the drum and his own part is that
    of speaker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wis'kino said people visit the drum about every fourth night, each person
    brings tobacco, the owner speaks for those present, and the tobacco is presented
    to the drum and then given to the singers who sit at the drum.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says that many generations earlier the Sioux gave the Chippewa
    a large drum, taught them the songs belonging to the drum, and related the tradition
    concerning its origin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that permanent peace between the Sioux and Chippewa was
    believed to have resulted from the earlier presentation of the drum.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: After receiving the drum and instructions, the Chippewa made similar drums
    and gave them away with the proper songs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When presenting a drum, it is customary for the giver to relate an individual
    dream to the recipient, which the passage says adds to the value of the gift and
    strengthens the bond between the two men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Informants from several communities agreed that a woman was the means used
    by the manido' in giving this type of drum.
  category: relationship
  evidence_refs:
  - ev:9
