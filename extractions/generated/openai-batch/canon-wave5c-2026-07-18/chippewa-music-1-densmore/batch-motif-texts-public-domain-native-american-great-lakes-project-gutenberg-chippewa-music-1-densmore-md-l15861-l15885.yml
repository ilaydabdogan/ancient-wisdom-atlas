canonical_text:
  quote: ''
  summary: After a Drum-presentation Ceremony on the Menominee Reservation, the Menominee
    host group and Chippewa visitors remain for four additional days of dancing together.
    Snow falls, but the dancing continues because custom requires a begun dance to
    be finished. The Chippewa then face a difficult return journey toward the railroad,
    with lighter packs because gifts have been given away and the expected equivalent
    return has not yet been fully received. The company returns to Lac du Flambeau
    after having given two drums to the Menominee.
