  summary: The passage presents No. 54, a 'Song of Departure' sung by Me'ckawiga'bau,
    followed by musical analysis. It then describes two messengers smoking pipes with
    two Menominee who were to receive drums, promising to return with their people
    after a set number of days. When the messengers reached Lac du Flambeau, preparations
    for departure began, including a four-day dance custom and Chippewa ceremonies
    called the Restoring of Mourners and, if needed, a Ceremony of Divorce.
