canonical_text:
  quote: '"Brother, let us gamble."'
  summary: A man whose life has departed hears a black-clad manido approach, regains
    consciousness, learns and wins three games from him, sees the stranger depart
    as a black bear, and then wins wagered women and children at an Indian village,
    which E'niwub'e describes as winning back his dead.
  language: English
  quote_policy: quoted
