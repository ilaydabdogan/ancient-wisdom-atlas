canonical_text:
  quote: ''
  summary: The passage describes a Dog Feast sequence within a Drum-presentation Ceremony.
    A ceremonial attendant takes dog meat from a kettle, dances around the drum, and
    gives the meat to the drum owner. The dog's head is placed in a pan at the eastern
    side of the dancing circle. Another attendant selects four valorous warriors,
    who eat meat from the dog's head while a song is sung. Each warrior then dances
    around the dog's skull, speaks of a victory, and sings a commemorative war song.
    The remaining dog meat is later passed to women and then men of the company, concluding
    the feast.
  language: English with Ojibwe terms and song text
  quote_policy: summarized
