canonical_text:
  quote: ''
  summary: The passage describes a pouch, spoon, packet, and birch-bark measure used
    with a medicine; Main'gans demonstrates taking it dry and preparing it in hot
    water by placing powder at the four cardinal sides of a pail. It then describes
    mi'nisino'wuck, an island herb medicine named for its principal ingredient, reports
    a dream in which a thunderbird instructed a man how to prepare and use it, and
    recounts Na'waji'bigo'kwe's uses of the root as a charm and curative life medicine.
  language: English with Ojibwe terms
  quote_policy: summarized
