canonical_text:
  quote: ''
  summary: The passage describes ca^wuno^ga as an old dance first used for healing,
    taught by the South Manido to a good young man whose ill relatives recovered;
    it later became a social dance. It then presents and analyzes Ca^wuno^ga songs
    and narrates the background to a war song concerning Bica'ganab, a Chippewa woman
    who fought Sioux attackers, fought in and around canoes and water, returned to
    the battlefield, took scalps and other trophies, and was remembered as one of
    the bravest Chippewa women.
  language: English with Ojibwe terms
  quote_policy: summarized
