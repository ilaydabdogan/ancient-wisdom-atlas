canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Chippewa and Menominee drum-presentation
    ceremony: arrival and greeting, singing and dancing, Menominee hospitality toward
    the Chippewa, a rain delay, renewed preparations with pine branches and regalia,
    the arrangement of five drums in the dancing circle, tobacco collection at the
    entrance, and the use of feather garments associated with Sioux practice.'
  language: English
  quote_policy: summarized
