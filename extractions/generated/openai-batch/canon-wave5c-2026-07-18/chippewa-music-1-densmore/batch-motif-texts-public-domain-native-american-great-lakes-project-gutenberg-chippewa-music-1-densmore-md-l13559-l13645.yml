canonical_text:
  quote: ''
  summary: The passage explains the term manido' as spirit or ghost, describes multiple
    Chippewa manido' including Mide' spirits and animal manido' from visions, and
    recounts an origin narrative for a ceremonial drum. A pursued Sioux woman hides
    in pond water for four days, hears a voice, is unseen among soldiers, and later
    meets a manido' in the form of a white man. The manido' teaches her how to make
    the drum and its songs, states rules for singing and dancing, and requires two
    men in return for the drum. When the first drum is struck, the manido' appears
    and the two makers die. The passage then connects this first drum to later drum-presentation
    ceremonies, intertribal transfers, and Sioux and Chippewa songs.
  language: English with Chippewa terms
  quote_policy: summarized
