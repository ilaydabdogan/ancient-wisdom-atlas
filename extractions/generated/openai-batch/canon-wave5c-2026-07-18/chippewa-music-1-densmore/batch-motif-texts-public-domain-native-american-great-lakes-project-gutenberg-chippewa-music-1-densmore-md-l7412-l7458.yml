canonical_text:
  quote: ''
  summary: The passage introduces Odjib'we as a Chippewa musician and warrior whose
    songs were recorded and preserved. It describes fellow elders and war participants
    at White Earth, including contributors of dream songs, war songs, and songs connected
    with native herb medicines used by or prepared for warriors. It also summarizes
    Odjib'we's death and reputation and gives a brief historical frame for warfare
    between the Chippewa/Ojibwa and the Sioux/Dakota in Minnesota.
  language: English with Ojibwa/Chippewa names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we is described as both a musician and a warrior, with more than 70
    of his songs recorded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During years of blindness at the Old People's Home at White Earth Agency,
    Odjib'we loved to sing, and comrades there recalled earlier days on the prairie.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Niski'gwim, also called Niski'gwun in the passage, fought beside Odjib'we
    at Ca'gobens' village and was present among the elders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maih'gans, translated as "little wolf," had come from Mille Lac, lived at
    White Earth for nearly a generation, and loved old ways and old songs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Maih'gans is described as crippled from frozen feet in childhood, yet active,
    and he attributes his strength to continued use of a native cattle herb medicine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cattle herb medicine is described as a medicine used by warriors in former
    times; Maih'gans described it, secured herb specimens, and sang songs connected
    with its origin and use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Odjib'we was recording songs, Niski'gwun contributed his own dream song
    and one or two other songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Na'waji'bigo'kwe sang songs of the island herb medicine and remembered herbs
    being dug to make that medicine for departing warriors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Na'waji'bigo'kwe is described as highly skilled in the lore of native medicines
    at White Earth Reservation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Meja'kigi'jig, Ma'djigi'jig, and A'kiwen'zi gave personal reminiscences and
    are said to have taken part in wars against the Sioux; the two last named fought
    under Odjib'we's leadership.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Odjib'we died in April 1911; many songs preserved in the work were known only
    to him, and the passage says he led his people to victory over the Sioux while
    never raising his hand against the white man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The final battles between the Chippewa and Sioux are placed in central Minnesota;
