canonical_text:
  quote: ''
  summary: The passage lists Chippewa song titles and texts involving pipes, springs,
    Mide lodge movement, shells, flame, spirit land, bears, women dancing, animal
    songs, war-dance animal imitation, and medicine songs. It gives details for a
    Bi'jikiwuck war-dance song, songs used with island-herb medicine before battle,
    and song translations involving raven-feather flight and rising to the heavens.
  language: English with Ojibwe/Chippewa song text and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of short song lines includes a first-person speaker raising a pipe,
    a bubbling spring emerging from hard ground, movement around a Mide lodge, a shell
    going toward people who fall, a flame going up to the speaker's body, walking
    toward the spirit land, going often to the big bear's lodge, and women enjoying
    a dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed songs in the present volume include titles about arising from a
    flowing spring or prairie land, Sioux women gathering wounded, Odjibwe bringing
    back a brother, going, weeping, singing, approaching footsteps, and departure.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A section is explicitly labeled as songs concerning animals, usually represented
    as in motion; the listed animals and animal forms include bird, owl, Round-hoofed,
    curved horns, bird-skin charm, ravens, horse, deer, a manido' in bear form, and
    crawfish.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Warriors sang songs in praise of Bi'jikiwuck in war dances and imitated wild
    cattle by holding their arms above their heads as horns and pretending to paw
    the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same description says warriors imitated calls of wild animals, intending
    to use those calls in decoying the Sioux.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Song No. 23 is a dancing song of the Bi'jikiwuck sung by Main'gans, recorded
