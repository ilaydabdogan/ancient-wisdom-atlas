canonical_text:
  quote: ''
  summary: The passage describes Chippewa medicine poles used with garments, tobacco,
    banners, and offerings in contexts of long life and sickness. It gives examples
    involving Me'dweya'suh, whose war dream was never fulfilled and whose horizontal
    tree-pole recalled a dreamed fallen tree, and Ki'tciodja'nimwewegi'jig, who fasted,
    dreamed of a bird, and later drew the bird on a medicine-pole banner. The passage
    then introduces Waba'cing village and the context for recorded songs there.
  language: English with Ojibwe/Chippewa names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person seeking long life brings a garment with tobacco folded in it and
    ties the garment around a medicine pole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Friends of a sick person put tobacco in one of the sick person's garments
    and fasten it high on one of the poles; they may also scrape a weatherworn pole
    smooth or replace it with a new pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A pole associated with Me'dweya'suh had been scraped, redecorated, given renewed
    banner cloth, and supplied with an offering during his illness, but he did not
    recover.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another medicine pole associated with Me'dweya'suh consisted of an uprooted
    tree placed horizontally between two forked poles at about five and a half feet
    from the ground, with strips from his garments fluttering on it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Me'dweya'suh dreamed in youth that he led a war party, conquered the enemy,
    pursued them, and leaped over a fallen tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because no war party came for him to lead, Me'dweya'suh later erected the
    horizontal tree at the height of the fallen tree in his dream, saying he had not
    fulfilled his dream.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ki'tciodja'nimwewegi'jig said that when he was a boy he fasted and dreamed
    of a bird; because he never went to war, he later erected a medicine pole and
    drew the bird on its cloth banner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator states that the bird design above Ki'tciodja'nimwewegi'jig's
    life was the symbol of a song that was never sung.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The following section identifies Waba'cing village on Red Lake as the place
    where a group of Chippewa songs was recorded during a Fourth of July gathering
    in 1910.
  category: setting
  evidence_refs:
  - ev:6
