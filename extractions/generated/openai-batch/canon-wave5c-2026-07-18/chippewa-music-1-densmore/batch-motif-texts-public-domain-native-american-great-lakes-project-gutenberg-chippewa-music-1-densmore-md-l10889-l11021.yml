canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa war-related songs and practices as reported
    and sung by Odjib''we: a subdued drum song before a daybreak attack, the open-fight
    war cry naming the Sioux, a warrior practice of rushing unarmed and unclothed
    toward the enemy as a target, songs of courage or self-control during battle,
    and a battlefield song attributed to Omiskwa''wegi''jigo''kwe, who urged her leader-husband
    in battle but was restrained by custom from using the scalping knife.'
  language: English with Ojibwe/Chippewa terms
  quote_policy: summarized
