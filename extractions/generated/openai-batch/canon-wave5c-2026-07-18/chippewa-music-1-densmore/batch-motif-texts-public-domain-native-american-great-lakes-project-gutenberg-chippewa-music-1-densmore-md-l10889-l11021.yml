  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: During a fight, a man frequently sang either his dream song or a song he had
    composed about a former victory.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Odjib'we stated that during great excitement a man would sing louder but probably
