  text: Odjib'we stated that the Chippewa sang before attacking the enemy when possible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a daybreak attack, Chippewa warriors crept to an ambush near a village,
    beat the drum very softly, sang in subdued tones, then gave a piercing yell and
    rushed the sleeping enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In open fight the Chippewa war cry was given as “Bwan, Bwan,” identified in
    the passage as the word by which they designated a Sioux.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Odjib'we stated that the leader started the drum song; the title is connected
    in the passage with the muffled throb of the drum.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The translated words of the drum song say, “I make them dance,” referring
    to “those brave men,” “every one of them.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In open fight, one Chippewa man might inspire others by making himself a target,
    throwing aside weapons, removing clothing, and rushing toward the enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the Sioux did not kill the self-exposing warrior at the first shot, the
