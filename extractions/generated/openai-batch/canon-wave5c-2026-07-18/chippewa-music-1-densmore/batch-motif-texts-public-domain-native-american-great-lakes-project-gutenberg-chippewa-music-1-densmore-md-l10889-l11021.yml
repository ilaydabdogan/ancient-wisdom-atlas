  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man named Ogima'wudjiweb, translated as “chief of the mountains,” is said
    to have had this experience and escaped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The song of the man who rushed toward the enemy addresses friends, tells them
    not to flee, and declares “I am strong-hearted.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The musical analysis says a slow metric unit is found in other songs of self-control
