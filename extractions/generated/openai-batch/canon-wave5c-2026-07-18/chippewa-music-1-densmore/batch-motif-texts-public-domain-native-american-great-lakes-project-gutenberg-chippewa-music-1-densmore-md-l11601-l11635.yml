  quote: ''
  summary: 'The passage describes the return of a victorious war party: runners announce
    its approach, warriors prepare at a final camp, women meet them, scalps are displayed
    on poles, a feast and later honoring ceremony are held, and a victory song is
    explained by Odjib''we.'
