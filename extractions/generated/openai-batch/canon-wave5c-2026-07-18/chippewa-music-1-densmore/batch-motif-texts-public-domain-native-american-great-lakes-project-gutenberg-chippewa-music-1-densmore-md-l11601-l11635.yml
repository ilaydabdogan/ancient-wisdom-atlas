  text: A returning victorious war party sent runners ahead to announce its approach,
    prompting preparations for reception.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before reaching home, the warriors camped, rehearsed victory songs, and dressed
    in fine apparel.
  category: action
  evidence_refs:
