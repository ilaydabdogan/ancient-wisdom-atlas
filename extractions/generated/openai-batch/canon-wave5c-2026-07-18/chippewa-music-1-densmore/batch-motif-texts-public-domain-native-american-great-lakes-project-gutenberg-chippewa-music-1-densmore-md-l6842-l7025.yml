  quote: ''
  summary: An ethnomusicological section classifies several Chippewa song groups,
    notes diverse topics among unclassified songs, and compares melodic and rhythmic
    resemblances among Mide', dream, war, begging dance, pipe dance, moccasin game,
    gift-related, children's, love, and women's dance songs. The author relates musical
    form to song purpose, including supernatural power, supernatural aid, acquirement
    of gifts, pleasure, motion, and war themes.
