canonical_text:
  quote: water flowed from the hole in the pole and fell into the dish
  summary: The passage describes two songs connected with a boy's fasting vigil. Before
    going alone from camp, the boy has blackened his face, dances, and hears his grandfather
    sing. After the boys return from fasting, they dance around a medicine pole while
    the grandfather sings; water flows from a hole in the pole into a birchbark dish
    and is given to the boys to drink, ending the fast. The passage also says the
    songs were composed in dreams and the pole corresponded to a vision.
  language: English with Chippewa/Ojibwe song terms and glosses
  quote_policy: quoted
