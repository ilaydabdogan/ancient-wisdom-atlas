  quote: ''
  summary: The passage analyzes musical characteristics of Mide' songs, including
    tonal material, melodic direction, rhythmic units, and rapid drum rhythm. It states
    that these songs are used to secure a definite effect, usually on another person,
    by supernatural power, and suggests links between musical features and the singer's
    motive or mental state. It then introduces dream songs, described as songs said
    to come to a person's mind in a dream or trance after isolation and fasting, with
    a comparative note that ghost dance participants also embodied visions in song
    after trance.
