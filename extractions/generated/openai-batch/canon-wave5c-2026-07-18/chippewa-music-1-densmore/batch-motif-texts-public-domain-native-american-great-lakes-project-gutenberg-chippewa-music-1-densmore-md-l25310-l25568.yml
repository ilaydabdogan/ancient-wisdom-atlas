  summary: The passage gives song texts, glosses, and analyses. One song names four
    chiefs from Sioux, Winnebago, and Chippewa affiliations and explains that the
    names mark remembrance rather than physical presence at the dance. Another song,
    “Little Plover,” says that a little plover has walked by and notes that men imitated
    plover motions during the dance. A third song, “Why?,” asks a female friend why
    they dance. The passage also begins a Mide' Burial Song entry sung without drum.
