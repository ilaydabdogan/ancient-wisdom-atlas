  summary: The passage describes the organization of a Chippewa war expedition through
    songs. A warrior who intends to lead a war party sends a messenger with tobacco
    to invite warriors. The messenger gathers warriors in villages, explains the expedition,
    prepares a pipe with tobacco and red willow inner bark, offers the pipe stem to
    warriors, and sings the War Messenger song. Those willing to join smoke the pipe.
  language: English with Ojibwe terms and song text
