  summary: The passage describes a drum-presentation ceremony in which tribes dance
    together for four days, with a possible Dog Feast on the fourth day to strengthen
    peace bonds. It then lists a first-day Chippewa sequence of five songs associated
    with ceremonial roles and the giving away of the drum, notes their use at Menominee
    and possible repetition at Lac du Flambeau, and provides musical headings and
    analysis for songs sung by Mec'kawiga'bau.
