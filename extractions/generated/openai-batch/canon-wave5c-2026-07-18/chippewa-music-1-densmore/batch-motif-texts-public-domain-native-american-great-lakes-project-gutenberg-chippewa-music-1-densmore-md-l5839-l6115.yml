canonical_text:
  quote: ''
  summary: The passage presents part of an ethnomusicological analysis of 340 Chippewa
    songs. It discusses relations among Mide', dream, and war songs; describes Mide'wiwin
    or Grand Medicine songs, a Mide' rattle, initiation songs, special medicine songs,
    healing and charm-working uses, transfer and renewal of spirit power, and some
    statistical musical features.
  language: English
  quote_policy: summarized
