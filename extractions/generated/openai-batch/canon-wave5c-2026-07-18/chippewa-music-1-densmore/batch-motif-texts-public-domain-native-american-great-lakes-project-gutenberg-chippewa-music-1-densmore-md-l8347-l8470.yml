canonical_text:
  quote: ''
  summary: A prose account describes Chippewa scouting of a Sioux camp, Odjib'we's
    reconnaissance, a dawn attack that becomes an all-day gunfight, the death of No'din,
    the taking of three Sioux scalps, and a return home followed by victory dances
    and a song sung by Odjib'we. The passage then introduces a later group of songs
    connected with the last notable fight between Sioux and Chippewa at the village
    of Little Six.
  language: English with Ojibwe song text
  quote_policy: summarized
