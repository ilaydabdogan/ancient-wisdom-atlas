canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes Chippewa medicine poles at Lac du Flambeau:
    poles with cloth frames, banners, celestial and bird figures, and rag bundles
    stand beside houses. The passage explains an origin account in which a young man
    fasts, dreams of thunderbirds and their tree, and makes a pole and painted deerskin
    representation. A later custom connects poles to dream songs not sung because
    a war dream was not fulfilled; such a man is said to have special curing power,
    and the pole may be taken down in spring for a feast and explanation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tall poles are described as standing beside many houses in the Chippewa village
    at Lac du Flambeau, each surmounted by a cloth-covered frame resembling a small
    flag that can swing in the wind.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older poles may retain only part of the frame and tattered cloth, while newer
    banners bear red and blue outlined figures, including recognizable symbols of
    the sun, moon, stars, and birds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bundles of faded rags are tied high on many poles and flutter in the breeze.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Questions about the poles’ significance are said to receive evasive answers;
    one outside question frames the rags as possibly frightening evil spirits, and
    a local explanation links new poles with deaths in the village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that a full account of one medicine pole would include
    a man’s boyhood dream, his failure to fulfill that dream, and his struggle against
    sickness and death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the origin account, a young man blackens his face and goes away to fast
    according to tribal custom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man dreams of thunderbirds and the tall tree on which they live.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After returning home, the young man cuts down a tall straight tree, trims
    it into a pole, places it in the ground at his door, paints the birds seen in
    his dream on deerskin, stretches the deerskin on a frame, and fastens it at the
    top of the pole.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The later custom differs by having the young man wait to see whether the dream
    comes true, and the dream usually concerns war and promises success on the warpath.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the dream is fulfilled in war, the man does not erect a pole and instead
    sings for the first time the song that came in his dream.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the man lacks an opportunity to go to war, he pictures the dream objects
    on deerskin or cloth, while the song is never sung.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man whose dream strength was not used against a human foe is said to have
    special power to cure the sick and power against death.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: In spring, the owner of a pole may take it down, lay it on the ground, make
    a feast, invite friends, and speak about the pole.
  category: action
  evidence_refs:
  - ev:7
