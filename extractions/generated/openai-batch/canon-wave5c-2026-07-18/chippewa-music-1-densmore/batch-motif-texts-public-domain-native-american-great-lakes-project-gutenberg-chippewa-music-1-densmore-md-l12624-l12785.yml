    songs. It describes a prairie fight near present St. Cloud, Minnesota, a Sioux
    woman defending her children with an ax, and a separate captive Sioux woman whose
    song before execution moved Odjib'we's elder brother to rescue her; she later
    expressed gratitude through handshakes, kisses, and a song.
  language: English with transcribed Chippewa/Ojibwe song text and one Sioux designation
