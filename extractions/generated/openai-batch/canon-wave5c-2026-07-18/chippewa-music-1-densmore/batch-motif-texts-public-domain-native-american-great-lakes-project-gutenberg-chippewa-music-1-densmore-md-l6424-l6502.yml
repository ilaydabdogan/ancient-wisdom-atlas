  summary: The passage describes a Chippewa end-blown flute-like instrument called
    hibl'gwiln, its provenance, dimensions, tonal qualities, and an old melody furnished
    by Rev. C. H. Beaulieu. It then summarizes the character, themes, verbal flexibility,
    and musical features of recorded Chippewa love songs, emphasizing sadness, disappointment,
    departure, loss, longing, jealousy, fickleness, and attempts to drown disappointment
    in drink.
