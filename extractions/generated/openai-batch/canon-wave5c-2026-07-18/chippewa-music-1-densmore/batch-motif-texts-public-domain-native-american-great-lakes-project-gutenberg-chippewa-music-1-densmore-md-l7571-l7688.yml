canonical_text:
  quote: '"They came up from the water and talked with him"'
  summary: 'The passage identifies Odjib''we''s war-honor objects, describes a warrior''s
    shirt decorated with weasel-skin fringe, and gives ethnographic information on
    Chippewa warrior medicines. It focuses on hi''jikiwuck, or cattle herb medicine:
    its protective and medicinal uses, an origin account in which a Midewiwin man
    dreams of cattle-like beings under water who teach its preparation, the associated
    song and cattle-like noises used in preparation, and the botanical identification
    of its ingredients.'
  language: English with Ojibwe terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Headings in the passage label Odjib'we's war-honor feathers, war-honor badge,
    war club, and war drum.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer reports seeing an old warrior wearing a shirt in a dance; the shirt
    decoration consisted of narrow strips of weasel skin forming a fringe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The weasel is described in the passage as a hunter, wanderer, and warrior,
    with an external authority quoted on its bloodlust.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The principal medicines carried by Chippewa warriors are named as cattle herb
    medicine, island herb medicine, and eastern herb medicine, obtained from old men
    of the tribe, usually members of the Midewiwin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The medicines were used externally and internally, and were believed to serve
    as charms whose presence protected the carrier and counteracted enemy bad medicine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hi'jikiwuck is described as used internally as a stimulant and cure for fits,
    and externally as a stimulant and to check bleeding from wounds.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: According to Main'gans, a male member of the Midewiwin dreamed of cattle-like
    animals under the water; they came up, spoke with him, and told him how to prepare
    the medicine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The dreamer composed and sang a song to persuade the beings to return; he
    sang it when digging roots or preparing hi'jikiwuck, and others learned it so
    that it became customary in preparation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Old men preparing the medicine made noises like cattle, and the same was done
    when hi'jikiwuck songs were sung in war dances.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Main'gans used four ingredients in hi'jikiwuck; the number of ingredients
    could vary from two to eight, but the principal herb was always present.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The principal cattle herb was represented to the writer by a dried root with
    downy white feathers attached, because the feathers were said to resemble the
    blossoms.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Dr. J. N. Rose identified the principal root as Polygala senega, Seneca snake-root,
