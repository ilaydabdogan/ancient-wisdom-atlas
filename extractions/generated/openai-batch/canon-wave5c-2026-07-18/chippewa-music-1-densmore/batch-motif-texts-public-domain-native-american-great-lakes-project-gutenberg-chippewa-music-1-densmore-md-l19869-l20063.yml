canonical_text:
  quote: ''
  summary: 'The passage presents Chippewa songs numbered 116-118: “Maple Sugar,” “My
    Travels,” and “Song of Thanks for Food,” with song text, glosses, and musical
    analysis. It describes preparation and storage of maple sugar in ma''kuks, birch-bark
    cones, packets, and other containers; notes a valued maple-sugar gift in the begging
    dance; describes movement to summer camps after sugar-making; and explains that
    the thanks song closes a begging-dance visit after food has been eaten.'
  language: English with Chippewa/Ojibwe song text and terms
  quote_policy: summarized
