canonical_text:
  quote: ''
  summary: The passage introduces an analysis of Chippewa music, describing a corpus
    of 340 phonograph-recorded and notated songs collected in Minnesota and Wisconsin,
    listing major song classes, explaining tests used to establish song identity across
    singers and reservations, and discussing the relation of song words to melody,
    rhythm, and syllabic adaptation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The section frames three questions about Chippewa music: what, how, and why
    the Chippewa sing.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The analyzed material comprises 340 songs recorded by phonograph and transcribed
    in ordinary musical notation with a few special signs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The songs were collected on principal Chippewa reservations in Minnesota and
    at Lac du Flambeau Reservation in Wisconsin.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The represented song classes include Midewiwin, dream, war, love, moccasin
    game, woman's dance, begging dance, pipe dance, gift-connected, children's entertainment,
    and unclassified songs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The work states its purpose as preserving the oldest songs and those connected
    with tribal history, custom, and ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Song identity was tested by recording the same singer at different times,
    different singers on the same reservation, and different singers on widely separated
    reservations.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the tests, comparison of phonograms showed song identity, though renditions
    were not uniform in every respect.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rhythm was repeated more exactly than melody, while melody sometimes showed
    changes in unimportant progressions or phrase number at the close.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: An old man repeated a song of very irregular rhythm accurately at intervals
    of several months.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A young man modified the rhythm of an old song so that it conformed somewhat
    to common rhythms of the white race.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Some transcribed Chippewa songs have no words, and some may formerly have
    had words.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Most Chippewa song words are few and suggest rather than fully express the
    song's idea.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Words are continuous only in love songs and a few Mide songs, and some song
    words may be altered if the idea remains the same.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Syllables and accents may be omitted, added, introduced, or shifted to fit
    the music and note-values of a song.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The next section begins a descriptive analysis of melody and rhythm tables,
    including a first division into major and minor tonality.
  category: sequence
  evidence_refs:
  - ev:15
