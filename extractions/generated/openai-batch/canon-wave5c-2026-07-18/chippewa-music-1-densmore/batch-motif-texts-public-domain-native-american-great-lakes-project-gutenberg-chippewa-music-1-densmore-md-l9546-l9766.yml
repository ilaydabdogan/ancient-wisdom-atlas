canonical_text:
  quote: ''
  summary: The passage describes Chippewa war-party preparations, including appointed
    aides, equipment, a war banner made with eagle feathers, a final dog feast treated
    as a pledge by the warriors, a pledge song, and a dance with guns before departure.
  language: English with Chippewa terms and song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war leader appointed four men as aides for the entire expedition; these
    men were called oc'kabe'wis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aides handled preparations, arranged dances before departure, carried
    the leader's pipe and the drum on the march, and arranged camps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The war party carried a supply of "medicine" and materials for making and
    mending moccasins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leader provided part of the equipment and borrowed the banner or flag
    borne by the war party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war banner was made of eagle feathers sewn on a cloth strip about four
    feet long and fastened lengthwise to a pole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Odjib'we stated that in earlier days there was one such banner among the Mississippi
    Band of Chippewa; it was made by Gaga'giwigwun, loaned to war parties, treated
    as common warrior property, and kept by him in peacetime.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A war flag preserved at White Earth was said to have been carried against
    the Sioux by Mi'gisins' and to be in the possession of his daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The final event before the war party left the village was a dog feast in which
    only the head was eaten and only the men going on the expedition partook.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Participation in the dog feast was considered equivalent to a pledge that
    the warriors were prepared for whatever fortune of war might come, including death
    or worse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pledge song text says that the braves feed the singer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the dog feast, all the warriors danced with guns in hand and sang a
    wordless song when preparations were complete and they were ready to start.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage describes one war song as a taunting, mocking melody and explicitly
    compares it with No. 38, another song of derision.
  category: other
  evidence_refs:
  - ev:9
