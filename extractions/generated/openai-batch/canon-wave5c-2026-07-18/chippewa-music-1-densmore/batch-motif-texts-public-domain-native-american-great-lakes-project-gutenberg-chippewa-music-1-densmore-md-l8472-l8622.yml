  quote: ''
  summary: The passage recounts the 1858 Battle of Shakopee, introduces a Chippewa
    war-medicine song sung before fighting, describes a birdskin or cloth bird-shaped
    charm filled with medicine and worn for protection, gives song words about bird-plumage
    and flying balls, and notes a dream origin for Niski'gwun's song.
  language: English with Ojibwe song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lower Sioux groups, including Shakopee and his band, returned in summer to
    former homes and camped near the town named for Shakopee in 1858.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed brave fishing in the Minnesota River early in the day was fired
    upon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shakopee's men identified the sound as coming from a Chippeway gun and had
    women ferry 30 or 40 men across.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sioux did not know that 150 or more Chippeway warriors were hiding behind
    a timbered bluff about a mile away.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Sioux placed themselves in ambush in a narrow area between two lakelets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Chippeways charged down from the bluff more than once but did not dislodge
    the Sioux, then departed in haste carrying wounded and possibly dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: Four Chippeway corpses were left behind after the engagement.
  category: other
  evidence_refs:
  - ev:1
- id: obs:8
  text: The first song in the group is described as referring to a war charm worn
    by a warrior and sung shortly before a fight to make the charm more effective.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Niski'gwun said he sang this song before the battle at Ca'gobens' village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:10
  text: The word translated as “balls” was said to refer to enemy heads that the warrior
    would cut off and toss about.
  category: speech
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:11
  text: The usual Chippewa warrior's charm consisted of a dried bird skin filled with
    medicine known only to the wearer, probably an herb or another substance suggested
    in a dream.
  category: object
  evidence_refs:
  - ev:3
- id: obs:12
  text: The charm was worn around the warrior's neck and was believed to protect him;
    the passage also says that if a bullet struck the charm, it would kill the man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: The bird used for the charm was identified as the kingbird or bee martin,
    and the passage emphasizes that this bird attacks larger birds, including hawks,
