canonical_text:
  quote: ''
  summary: 'The passage describes a children''s song with disconnected comic sections:
    a fat pig in a tree, fighting Frenchmen, a rich man traveling toward the great
    water, and a rabbit speaking against a lynx from a place of safety. It then imagines
    children in a warm wigwam falling asleep after the song. A musical analysis follows.
    The passage then discusses Chippewa children''s folk-tales, longer We''nabo''jo
    and windigo story cycles, possible imported European stories at Red Lake, and
    animal-character songs in stories. It concludes with the tale of the Coon and
    the Crawfish, in which crawfish ignore an old female crawfish''s warning, attack
    a seemingly sleeping coon, and are eaten, while the warning crawfish remains safe
    in the water.'
  language: English
  quote_policy: summarized
