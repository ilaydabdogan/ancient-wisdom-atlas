    warrior marked his arrows, while after guns were introduced a call during battle
    helped identify who killed an enemy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Niski'gwun said Odjib'we once entered a fight without his medicine and appeared
    almost paralyzed soon after the fight began.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Niski'gwun gave Odjib'we medicine from his own bag, mixed it with water, and
    sprayed it on Odjib'we's feet and limbs with a wisp of brush.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicine treatment revived Odjib'we, enabled him to rise, and the fight
