canonical_text:
  quote: ''
  summary: The passage describes Chippewa war practices, an episode in which Niski'gwun
    aids Odjib'we in battle by applying medicine mixed with water while singing a
    help song, and a later war expedition against a Sioux village in which the wounded
    warrior Name'bines' sings a death song, is left in bushes with his gun, and makes
    a final kill before death.
  language: English, with transcribed Chippewa/Ojibwe song text and glosses
  quote_policy: summarized
