  summary: The passage discusses Chippewa dream songs, including songs heard from
    trees, crows, animals, the thunderbird, and manido' in dreams; notes dream-song
    themes of flight through the air; explains the vision and song as sources of supernatural
    aid; compares the expectancy and acquirement associated with dream songs to women's
    dance songs and gift songs; and summarizes musical traits of dream songs in relation
    to other song groups.
