canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Chippewa drum-presentation ceremony:
    repeated offering of a pipe to the sky while a pipe song is sung; feasting and
    food placed beside the drum; a drum-restoration procedure using song, dance, and
    heat if the drumhead loosens; the formal presentation of the drum by Bi''jikens
    to Wis''kino; accumulation and distribution of gifts; appointment of a pipe caretaker;
    and Menominee participants taking places beside the transferred drum and beginning
    to sing and drum.'
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the Song of the Pipe, the drummer faced east, held the pipe almost
    horizontal, and turned it four times in a circle above his head while presenting
    it to the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pipe presentation was performed four times during the day at nearly equal
    intervals, with the last offering near the close of the day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A feast was held at noon, and foods previously presented to the drum were
    kept beside the drum until they were divided among singers and drummers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the untanned drumhead loosened during a ceremony, the Song of the Drum
    was begun as a signal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the drum-restoration signal occurred, five men in charge of the drum
    rose, danced around it, then held the drum near a fire until its desired resonance
    returned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The actual presentation of the drum began about three o'clock in the afternoon.
  category: setting
  evidence_refs:
