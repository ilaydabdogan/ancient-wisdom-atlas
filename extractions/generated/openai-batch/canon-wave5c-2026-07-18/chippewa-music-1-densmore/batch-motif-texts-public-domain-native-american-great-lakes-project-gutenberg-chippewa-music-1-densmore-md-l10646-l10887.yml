canonical_text:
  quote: ''
  summary: 'The passage gives musical analyses and glosses for several Chippewa songs,
    including a song of safe return, a song using images of flying or rising away
    from someone, and a war-charm song. It also describes preparations for battle:
    care of the wounded, a water and medicine carrier, a feather flag bearer, a drummer-singer
    who inspires warriors, conspicuous feathered adornment, and a bird-skin charm
    exposed and sung over before battle.'
  language: English with Ojibwe/Chippewa song words and English glosses
  quote_policy: summarized
