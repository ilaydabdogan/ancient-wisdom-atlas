    songs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage attributes the relation of war songs to Mide' and dream songs
    to a common element of communication with the supernatural.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the woman's dance may correspond with war songs because it
