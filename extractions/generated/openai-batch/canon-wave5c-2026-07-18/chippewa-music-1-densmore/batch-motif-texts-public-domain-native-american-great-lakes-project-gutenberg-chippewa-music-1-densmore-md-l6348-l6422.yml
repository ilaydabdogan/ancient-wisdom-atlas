  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the begging dance was also received from the Sioux and that
    war songs show both melodic and rhythmic correspondence with that group.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that war songs relate to moccasin game songs only in compass,
