canonical_text:
  quote: ''
  summary: The passage analyzes Chippewa war songs statistically and comparatively,
    describing their tonality, range, melodic and rhythmic structure, relation to
    drum and voice rhythms, and correspondences with Mide', dream, woman's dance,
    begging dance, and moccasin game songs. It attributes some correspondences to
    communication with the supernatural, peace-period dance exchange with the Sioux,
    and excitement shared with moccasin game songs. It then introduces a section on
    love songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports numerical musical traits of war songs, including major
    tonality in half of them, a high proportion ending on the tonic, and a large proportion
    with a compass of ten or more tones.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: War songs are described as largely melodic in structure, with purely melodic
    songs and melodic songs with harmonic framework together forming most of the group.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that first progressions are downward in many war songs
    and that intervals of a second are above average, indicating freedom of melodic
    movement.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes rhythmic features of war songs, including changes of
    time, limited occurrence of the triple rhythm associated with the victory or scalp
    dance, even beats characteristic of the Mide', and frequent rhythmic units.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The metric unit of the voice is described as rapid, while that of the drum
    is of medium rapidity; the drum is faster than the voice in less than half of
    the war songs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The group of war songs is described as less homogeneous than other groups,
    with diverse correspondences to other song groups.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the relation of war songs to Mide' songs seems strongest
