canonical_text:
  quote: ''
  summary: 'The passage describes a pipe dance in which imitation of a pipe caused
    merriment and a man’s willingness to face ridicule was treated as a test of courage.
    It notes early dress for the dancers, then describes the musical pattern: a sharp
    short drumbeat followed by silence, during which the dancer freezes until the
    drum resumes, and a rapid drumbeat requiring precise timing. It identifies song
    No. 171, "O''gima," as sung by E^niwub^e.'
