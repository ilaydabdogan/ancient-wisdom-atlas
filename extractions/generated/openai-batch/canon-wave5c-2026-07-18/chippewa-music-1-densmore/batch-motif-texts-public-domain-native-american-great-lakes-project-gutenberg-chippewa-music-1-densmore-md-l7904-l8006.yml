canonical_text:
  quote: ''
  summary: The passage recounts Odjib'we's early participation in a dog feast used
    to test aspiring warriors' courage, his later decision with his cousin Ne'bCmec'kiln
    to go secretly on the warpath, their departure to avenge dead friends, and the
    war song they sang during four nights of camping. It also includes publication
    notes on the song transcription.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dog feast is described as a tribal custom held so young men aspiring to
    become warriors could show courage before assembled people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old warrior was selected to announce the feast by walking through the village
    and speaking loudly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After singing, dancing, and speeches, the youths whose courage was to be tested
    sat on the ground in a circle, and a dog was killed in the center.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dog's liver was removed, cut into small pieces, and a piece was given
    to each young man on a long stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A youth who chewed and swallowed the liver morsel without flinching was considered
    brave enough for the warpath, while one who shuddered or drew back was called
    faint-hearted and jeered by the assembly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Odjib'we said he passed the test without changing expression, but afterward
    he privately felt unable to bear the thought of what he had done.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: At about age 20, Odjib'we consulted his cousin Ne'bCmec'kiln, and they decided
