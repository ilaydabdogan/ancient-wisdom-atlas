  quote: ''
  summary: 'The passage first presents tabulated rhythmic analysis of songs, including
    rhythm of first measure, change of time, rhythmic unit, and comparison of voice
    and drum metric units. It then describes children''s games of war when Chippewa
    and Sioux camps were near each other: children of the two groups contended, and
    Odjib''we recalled a sham battle by small boys using sharpened and notched rushes
    as arrows, with adults watching and cheering. The game had rules, including a
    ban on shooting at heads and a prohibition on running away; the contest caused
    pain and bleeding.'
