canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa war-party departure and preparation practices:
    a leader smokes and shares a pipe before departure, speaks to a drum, the drum
    signals the march, the party travels in a set order and silence, scouts watch
    the Sioux, and warriors prepare for attack by singing medicine songs, treating
    arrow heads with red medicine, and preparing bi''jikiwuck war medicine. Two songs
    are presented: an Arrow Song and an Origin of the Bi''jikiwuck song whose gloss
    refers to arising from a flowing spring.'
  language: English with transcribed Chippewa/Ojibwe song words
  quote_policy: summarized
