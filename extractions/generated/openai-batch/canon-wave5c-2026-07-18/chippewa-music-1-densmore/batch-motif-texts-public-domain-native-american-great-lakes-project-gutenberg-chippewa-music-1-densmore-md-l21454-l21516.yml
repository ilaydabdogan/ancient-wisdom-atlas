canonical_text:
  quote: ''
  summary: The passage describes Waba'cing Chippewa Mide'wiwin observances, including
    a grave fire kept for four nights and a child's grave with a rattle and food.
    It also describes dancing, drum use, food distribution, named singers, phonograph
    playback of recorded songs, and a section on dream songs, many of which were said
    to have been composed in dreams and probably used in war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most Indians at Waba'cing are described as members of the Mide'wiwin, whose
    rites are closely observed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two women were seen tending a fire at the head of a newly made grave, and
    the Mide' teaching is said to require this fire to burn for four nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near the newly made grave was a little child's grave with embers remaining,
    a crude rattle on the grave, and a paper bag containing food beside it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Waba'cing Chippewa dancing is described as free and individual, with skilled
    dancers using the whole body and with shoulder motion, shrugging, twisting, and
    sinuous movement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The drum was native-made, about 24 inches in diameter and 12 inches high,
    covered with untanned hide, and suspended between four crotched sticks driven
    into the ground.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The singers at the drum usually numbered six or eight; leaders began by singing
    a few bars alone, after which the others joined.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the dancing, beef and breads were distributed, and the passage notes
    that older Waba'cing Indians had not yet acquired a liking for salt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Awtin'aktim'igicklifi', translated in the passage as 'fog covering the earth,'
    said his people had rarely heard tuned instruments and that he had lived with
    the same group of Chippewa while moving from camp to camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Awtin'aktim'igicklifi' said that as a child he sat with old men, listened
    to their singing, and learned their songs, but now sang songs made in dreams by
    men of his village.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Awtin'aktim'igicklifi' sang in falsetto with a throaty vibrato and said he
    had discovered and cultivated this ability since boyhood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other singers are named and briefly described, including an old man with long
    braids, a council-prominent middle-aged man, a singer with a particularly good
    voice, and one who sang only one song.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Phonograph reproduction of the songs gave the Indians pleasure; they gathered
    outside a carpenter shop where the phonograph was placed, with wigwams and a shining
    lake beyond.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Forty songs were recorded at Waba'cing, twenty-six of them said to have been
    composed in dreams, and the author states that most Chippewa dream songs were
    probably used in war.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage begins to explain dream songs by referring to a young man who
    had a dream during a fasting vigil.
  category: sequence
  evidence_refs:
  - ev:8
