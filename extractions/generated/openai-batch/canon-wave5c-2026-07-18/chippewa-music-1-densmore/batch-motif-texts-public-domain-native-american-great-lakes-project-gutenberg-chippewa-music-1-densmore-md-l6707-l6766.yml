canonical_text:
  quote: ''
  summary: The passage compares motives and musical features among several Chippewa
    song groups, especially begging dance, woman's dance, pipe dance, children's entertainment
    songs, and gift-related songs. It describes the begging dance as a recreational
    camp practice for securing gifts and food, the woman's dance as involving reciprocal
    gifts, and the pipe dance as a humorous performance for merriment. It also summarizes
    musical features of the remaining pipe dance songs.
  language: English
