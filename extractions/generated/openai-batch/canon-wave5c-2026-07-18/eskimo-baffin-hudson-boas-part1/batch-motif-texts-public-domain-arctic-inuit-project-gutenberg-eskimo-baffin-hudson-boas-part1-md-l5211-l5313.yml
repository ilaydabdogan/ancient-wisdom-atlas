canonical_text:
  quote: ''
  summary: 'The passage gives several etiological tales: a child is born without the
    mother being cut open and people imitate the child’s anus; an elder daughter imprisoned
    by her father becomes an agdlaq and kills her parents while sparing her younger
    sister by recognizing wooden pegs; a deserted girl turns herself into stone and
    is still heard as an echo; and death begins when an overpopulated floating island
    overturns, after which waters recede and islands ground.'
  language: English
  quote_policy: summarized
