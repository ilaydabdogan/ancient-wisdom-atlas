canonical_text:
  quote: ''
  summary: 'The passage first recounts a woman''s soul passing through successive
    animal embodiments—dog, wolf, caribou, walrus, ground-seal, and seal—learning
    animal practices, returning through a harpoon-associated household act, and later
    being reborn as a child who explains animal likes, dislikes, and a seal-hunting
    custom. It then begins the tale of an old woman and her granddaughter during famine:
    the old woman magically summons animals, rejects several kinds until foxes arrive,
    kills the foxes, and then obtains seal blubber by making hunting gear from her
    waist strap and melting a hole in the ice with urine.'
  language: English
  quote_policy: summarized
