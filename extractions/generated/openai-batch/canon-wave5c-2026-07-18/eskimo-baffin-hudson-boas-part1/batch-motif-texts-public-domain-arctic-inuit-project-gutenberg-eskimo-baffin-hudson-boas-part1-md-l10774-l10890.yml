canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which Igimagajug finds his wife, is accused
    by his brother-in-law of killing and eating her family, disputes the accusation
    with his wife, and is killed by people with spears. It then gives the tale of
    Inupajukjuk, a giant hunter defeated when his heel sinews are cut, and notes giants
    turned to stone at Repulse Bay. It next recounts conflict between the Tornit,
    a race of very large people, and the Eskimo: raids, retaliation through feigned
    friendship at a dance-house, killing or capture of Tornit children, the survival
    of one Tuneq boy and one girl, the boy’s extraordinary spear skill and disappearance,
    and landscape marks and inland giant beliefs associated with the Tornit and Ijiqan.'
  language: English
  quote_policy: summarized
