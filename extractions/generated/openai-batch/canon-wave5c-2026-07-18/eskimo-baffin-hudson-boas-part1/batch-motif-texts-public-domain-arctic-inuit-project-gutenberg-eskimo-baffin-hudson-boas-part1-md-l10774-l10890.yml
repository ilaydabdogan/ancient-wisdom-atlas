- id: motif:1
  label: Bound-game accusation and revenge killing
  taxonomy_refs: []
  basis: Igimagajug is bound in a rope game, accused of killing and eating kin, confronted
    by his wife, and killed by the group.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a local narrative sequence; no supplied taxonomy family directly
    matches it.
- id: motif:2
  label: Giant defeated by cutting heel sinews
  taxonomy_refs: []
  basis: Inupajukjuk and his wife are each brought down when the small man cuts their
    heel sinews, allowing them to be killed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives no broader explanation for the heel as a special vulnerability
    beyond the action itself.
- id: motif:3
  label: Transformation into an equal-sized giant opponent
  taxonomy_refs:
  - shapeshifter
  basis: One of the two men turns himself into a giant of equal size before wrestling
    Inupajukjuk.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only one transformation is described, with no details about method or
    permanence.
- id: motif:4
  label: Giants as earlier inhabitants and landscape traces
  taxonomy_refs: []
  basis: Giants are said to have lived when the Eskimo reached the country; stone
    giants, footprints, broken ground, split rocks, and Tornit land-tearing marks
    explain visible places.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: The extraction treats the landscape explanations descriptively and does
    not infer geological or historical causes.
- id: motif:5
  label: Smoke concealment preserves a small family remnant
  taxonomy_refs: []
  basis: A woman and her two children survive a Tornit raid by making smoke in their
    house so the attackers cannot find them.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not identify the smoke as sacred or magical, only effective
    concealment.
