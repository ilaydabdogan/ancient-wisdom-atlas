  quote: ''
  summary: The passage describes beliefs and narratives concerning souls after death,
    including a dead woman's disturbed soul causing deaths, the movement of two souls
    after death, the strengthening of infants by deceased souls, soul-loss and illness,
    transmigration into animals or rebirth, the powers of angakut/angakok through
    inner light, visits to Sedna, and an earlier practice of healing sickness by blowing
    and touching.
  language: English
  quote_policy: summarized
