canonical_text:
  quote: ''
  summary: 'The passage contains several brief narrative episodes: feared men are
    killed and put under ice; Emataloo, an orphan foster-child, grows stronger through
    wrestling contests, humiliates and violates his foster-parents, threatens Kutchaping,
    and is later lost when ice breaks up; Takak flees a bad marriage and starvation,
    waits in a fox-trap, follows boys'' tracks to huts, and is fed; Nanwalokdjua kills
    his wife Koneruakdju after a quarrel; Egeewaping kills the grief-stricken Akkalow,
    believing he intended murder; and the brothers Unakjew and Etookshakjwen travel
    to avenge Unukchea''s murder by Aako.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koomungaping and his friend pursue a fleeing man, and the friend kills him
    with arrows; the bodies are dragged to ground-ice and pushed under the ice where
    Ooryew's body had been placed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the deaths of the three bad men, the people sleep quietly and say they
    are pleased because they had feared them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A married couple in Akudnirn raises Kutchaping and the orphan boy Emataloo;
    the children gamble together, and Kutchaping later visits relatives at a distant
    place.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: As Emataloo grows, he repeatedly asks his foster-father to wrestle and progresses
    from being thrown to nearly matching him and then throwing him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After becoming stronger, Emataloo throws his foster-father into the blubber-and-meat
    storage place and cohabits with his foster-mother Atalee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Atalee tries to help her husband, Emataloo throws both foster-parents
    into the blubber-and-meat storage place and thinks that they had no mercy on him
    when he was weak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Emataloo tells his foster-parents that he intends to visit Kutchaping, pull
    off her clothes, and tear her to pieces with a hook before the people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the ice breaks up during a sealing expedition, several hunters go adrift;
    Emataloo and many companions are lost, while his foster-father and a few others
    reach shore.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Takak, a woman married in Aggo, leaves her husband secretly because he treats
    her badly and food is scarce; she tries to find her brother near Padli but becomes
    thin and faint on the long journey.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Takak enters a fox-trap to wait for someone; two boys come, flee at first,
    then tell her that if she is human she can follow their tracks to the huts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Takak reaches the huts, identifies herself as the sister of someone in the
    tribe, is hardly recognized, receives food, and says she has eaten nothing since
    leaving Aggo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nanwalokdjua asks his wife Koneruakdju about the weather; after her retort
    angers him, he tears her hand, beats her, and kills her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After Akkalow's son dies, Akkalow is sad and angry and determines to kill
    someone; Egeewaping stabs and kills him, believing Akkalow meant to kill Unaq's
    husband.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Aako murders Unukchea in Aggo; when Unukchea's relatives in Kingnait hear
    the news, the brothers Unakjew and Etookshakjwen decide to avenge him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The brothers reject advice to go overland to Padli and instead travel by boat
    around Cape Mercy despite warnings about pack-ice; it takes a year to reach Padli,
    and they later continue to Aggo.
  category: sequence
  evidence_refs:
  - ev:9
