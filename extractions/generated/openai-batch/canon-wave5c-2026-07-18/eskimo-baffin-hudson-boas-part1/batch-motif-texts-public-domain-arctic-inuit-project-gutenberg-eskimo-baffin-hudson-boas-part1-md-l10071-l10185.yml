candidate_motifs:
- id: motif:1
  label: killing of feared men followed by communal relief
  taxonomy_refs: []
  basis: The deaths of the three bad men end the people's fear and allow them to sleep
    quietly.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The opening of this episode is fragmentary, so the full prior conflict
    is not present in the passage.
- id: motif:2
  label: bodies hidden or disposed under ice
  taxonomy_refs: []
  basis: Bodies are dragged to ground-ice and pushed under the ice at the place where
    Ooryew's body had been put.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain a ritual or symbolic reason for the under-ice
    disposal.
- id: motif:3
  label: orphan foster-child proves strength through repeated contests
  taxonomy_refs:
  - initiation
  basis: Emataloo repeatedly tests strength against his foster-father as he matures
    and eventually surpasses him.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The contests mark maturation but are not described as a formal initiation
    ritual.
- id: motif:4
  label: revenge reversal by the formerly weak
  taxonomy_refs: []
  basis: Emataloo says his foster-parents had no mercy when he was weak and uses his
    new strength to humiliate and abuse them.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an intra-household revenge pattern rather than a socially sanctioned
    revenge quest.
- id: motif:5
  label: dangerous ice breakup carries hunters away
