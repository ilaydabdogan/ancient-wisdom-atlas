canonical_text:
  quote: ''
  summary: The passage first narrates how two lost girls and a carried child enter
    Mangegjatuakdju’s underground house, find human remains, deceive her long enough
    to escape through the roof, and lead the villagers back. The men then trick Mangegjatuakdju
    with a rope, drag her from the house, and kill her; her claims that her organs
    are made of hard or valuable materials prove false. The passage then begins another
    tale in which families at Qenertung and Ixa'luin hunt seals; after one hunter
    hosts others for seal meat, he is attacked and killed by companions.
  language: English
  quote_policy: summarized
