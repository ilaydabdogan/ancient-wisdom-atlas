  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bone implement with a sharp edge and hollow blade is used to squeeze water
    out of wet skins; a wooden beater is used to remove snow from clothing; some handles
    are carved to fit the hand closely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A backscratcher is found in the Cumberland Sound material and is described
    as consisting, in one specimen, of whalebone with a sharply turned end.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The clothing style of the Cumberland Sound Eskimo is said to differ in some
    respects from that of other regions, especially in women’s breeches and leggings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men’s jackets are described with a straight cut, short front slit, short rear
    tail or straight lower edge, and uniform light-and-dark decoration; men’s trousers
    reach the waist, have no slits, and bear horizontal bands.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: Women’s summer and winter jackets are described as having generally uniform
    decoration, with some variation in sleeve stripes; Labrador and Savage Island
    styles are described as almost the same as Cumberland Sound styles, differing
    in border details.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: Women wear short breeches and short leggings suspended from the waist string;
    girls wear men’s garment style until about age twelve, when their jacket is cut
    with a short wide tail; infants’ garments are made of caribou-fawn skins and include
    a hooded shirt with a short front slit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: Women’s jackets may be ornamented with bone or ivory bead fringe; a double
    wooden button represents a kayak and paddle and is used for suspending a needle-case
    or pouch; another small ivory carving is said to be connected with clothing, but
    its use is unknown to the author.
  category: object
  evidence_refs:
  - ev:10
- id: obs:10
  text: The collection includes games such as a wooden top, a leather sling, and a
    skin buzz; dice are carved in forms of birds, men, and women; other realistic
