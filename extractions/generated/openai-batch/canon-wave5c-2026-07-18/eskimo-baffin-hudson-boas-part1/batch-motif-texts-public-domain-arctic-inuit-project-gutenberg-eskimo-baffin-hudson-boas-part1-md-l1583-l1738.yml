  summary: The passage catalogs Cumberland Sound household vessels, tools for skin
    and clothing care, clothing forms by gender and age, ornamented garments, buttons
    and small carvings, games, dice, and ivory or wood carvings. It also notes several
    material-culture comparisons with other Eskimo groups, Siberia and eastern Asia,
    Labrador, Savage Island, the Central Eskimo, and other eastern tribes.
  language: English
