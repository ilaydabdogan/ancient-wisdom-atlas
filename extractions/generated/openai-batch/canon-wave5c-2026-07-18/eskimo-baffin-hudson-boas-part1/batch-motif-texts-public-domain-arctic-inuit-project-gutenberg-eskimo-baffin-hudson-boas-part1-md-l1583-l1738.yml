literal_observations:
- id: obs:1
  text: A large leather bucket stands near the house entrance; a leather cup lies
    in it; small spoons are shown; small trinkets are kept in wooden boxes with sliding
    covers or close-fitting lids.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The use of one implement is uncertain; it may have been used as a ladle or
