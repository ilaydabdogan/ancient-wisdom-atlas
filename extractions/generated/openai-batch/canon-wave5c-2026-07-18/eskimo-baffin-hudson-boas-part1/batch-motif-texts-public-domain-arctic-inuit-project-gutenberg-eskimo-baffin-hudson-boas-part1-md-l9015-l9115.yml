canonical_text:
  quote: ''
  summary: 'The passage contains several tale episodes: Kunengoo arrives from Qamaqdju,
    marries an elder brother, and later guards meat and skins that the brothers initially
    conceal from their community; Uktowyouakjew, a small but very strong inland hunter,
    is taunted and challenged by Kookalejwak and her sons, then displays superior
    kayak speed and hunting strength; Kudlang and his son encounter an abnormal caribou-like
    animal that behaves violently, dies against a boulder, and is judged not to be
    an ordinary caribou.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman named Kunengoo arrived from distant Qamaqdju and reported having eaten
    meat from a wolf-killed caribou and a fox found dead in a trap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother asked Kunengoo to be his wife, and she consented.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the lake was frozen, Kunengoo was asked to remain behind and watch meat
    and skins until the men could return in winter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers returned home without telling others about the great number of
    caribou-skins or about Kunengoo, then later asked friends for additional dog-teams
    and sledges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the party reached the lake, the other men saw Kunengoo and the large
    quantity of skins; later people at Niutang wondered about the strange woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Uktowyouakjew is described as small in stature but very strong, living inland
    near a large lake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Uktowyouakjew hunted caribou crossing the lake from his kayak and stored seal
    blubber in skin bags for later use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Uktowyouakjew could drive his kayak upstream through rapid water, using a
    paddle with holes for handles rather than ordinary notches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kookalejwak arrived with two young men; the older brother tried to seduce
    Uktowyouakjew's wife, and the wife warned the brothers that her husband was strong
    and angry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kookalejwak repeatedly taunted Uktowyouakjew as too small and fit only to
    sit by the lamp cooking seal-meat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: During a caribou hunt on the lake, Uktowyouakjew sped between the brothers'
    kayaks, upset them with the rush of water, seized two caribou by their antlers,
    and drowned them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After killing the caribou, Uktowyouakjew helped the brothers out of the water,
    gave tallow to Kookalejwak, and the brothers left the place during the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Kudlang and his son saw a caribou standing in water and striking water and
    rocks with its antlers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kudlang's gun cap first snapped without firing; after he fired with another
    cap, the caribou attacked and then died after striking its head against a boulder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Kudlang stated that the animal was not a caribou, noting its different smell,
    bare hind-quarters, worn antlers, unchewed moss in its stomach, and bad-tasting
    flesh.
  category: attribute
  evidence_refs:
  - ev:6
