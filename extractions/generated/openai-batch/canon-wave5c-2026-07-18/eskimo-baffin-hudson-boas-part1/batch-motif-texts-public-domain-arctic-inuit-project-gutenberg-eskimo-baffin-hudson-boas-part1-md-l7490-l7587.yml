canonical_text:
  quote: ''
  summary: 'The passage concludes an Attongey episode in which an old woman prepares
    a mixture of human and wolf brains with blood, gives it to Attongey, and then
    dies after failing to reproduce his dish-filling action. Attongey later escapes
    a dogless group by secretly cutting their sledge lashings, taking a cup-and-ball
    carving, and fleeing while their sledges repeatedly break down. The passage then
    begins the tale titled “The Huts of the Skeleton People”: a hungry man from Padli
    visits the house of Kooloome and his wife, eats seal-meat, is hidden when Kooloome
    returns, warns Kooloome that hungry people plan to kill him, receives permission
    to take the meat secretly, and then sees that the apparent people are only bones.'
  language: English
  quote_policy: summarized
