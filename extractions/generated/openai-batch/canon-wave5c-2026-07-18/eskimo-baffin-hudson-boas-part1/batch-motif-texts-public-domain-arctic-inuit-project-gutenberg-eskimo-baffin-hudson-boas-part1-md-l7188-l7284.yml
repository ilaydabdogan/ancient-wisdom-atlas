  summary: The passage first recounts an old Fox tricking Wolves away from whale-meat
    by making a whale seem like rocks. Tale 41 tells of an old woman whose adopted
    bear cub helps catch seals, escapes when villagers try to kill it, and later leaves
    seals for the family. Tale 42 follows a husband who discovers his wife summoning
