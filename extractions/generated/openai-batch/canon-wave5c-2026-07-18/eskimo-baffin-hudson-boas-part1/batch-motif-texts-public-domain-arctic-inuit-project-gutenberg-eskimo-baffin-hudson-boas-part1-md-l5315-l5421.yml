canonical_text:
  quote: ''
  summary: 'The passage contains several tales: a woman identifies her silent nightly
    assailant as her brother, and after a chase they become the sun and moon; an orphan
    boy and an old man become two pursuing stars; bear hunters, dogs, sledges, and
    bear become constellations; two girls or sisters make thunder, lightning, and
    rain, and named storm-makers receive gifts, are visited by angakut, wield thunderbolts,
    and are said to keep a stolen boy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman lives alone in a hut while other people assemble in the dancing-house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man comes to the woman at night, puts out her lamps, coerces cohabitation,
    returns nightly, and refuses to speak or give his name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman marks the left side of the silent visitor's face with material from
    the bottom of a pot and later sees the same marks on her brother in the dancing-house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman cuts off her left breast, offers it to her brother to eat, lights
    a lamp-trimming stick, and is pursued by her brother, who also carries a lighted
    trimming-stick.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the chase, the brother falls and his flame goes out, while the woman's
    flame keeps burning; both are wafted up to the sky and become the sun and the
    moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Outakalawaping repeatedly taunts the orphan boy Elaakjewwakjew, who is advised
    by another boy to reply with accusations about Outakalawaping's first wife in
    cracks in the ice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the orphan boy retorts, Outakalawaping chases him; the two rise into
    the air and become two stars, with the pursuit still continuing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A bear is hunted by seven, or possibly ten, sledges, with dogs in close pursuit
    and men urging them along.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the bear hunt, men notice their feet or sledge-runners no longer touch
    the ground, and the hunters are transferred to the sky and become constellations.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two girls, Kweetoo and Kadlu, play at night after their father sends them
    farther from the hut because of their noise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: One girl proposes making various animals, but the other rejects them because
    people can catch them and proposes making lightning instead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The girls jump on hollow ice; one stamps so that the sound is like thunder,
    and the other urinates, making rain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: People hear thunder, see lightning and rain, but do not see the girls who
