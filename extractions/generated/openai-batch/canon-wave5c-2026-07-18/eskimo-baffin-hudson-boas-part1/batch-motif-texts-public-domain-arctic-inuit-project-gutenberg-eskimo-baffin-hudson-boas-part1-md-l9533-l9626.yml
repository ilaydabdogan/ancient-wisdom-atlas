canonical_text:
  quote: ''
  summary: The passage contains three tale segments. In the first, a walrus-hunting
    party is carried adrift by broken ice; Keyoota kills three companions and the
    survivors falsely report that the missing men were lost, until others later disclose
    the deaths. In the second, Keyakjuak and his cousin kill Keyakjuak’s feared elder
    brother, later face reports that the brother calls from his grave, and Keyakjuak
    shows further anger in a ball game and a caribou-hunt dispute. In the third, Kanatchea
    of Padli is described as angry, abusive toward his wife, skilled at sealing, and
    once releases an old male seal after saying it reminds him of his own angry face.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunting party from Sikosuilaq was hunting walrus when the ice broke up and
    the group went adrift.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eeachak saved himself on a high piece of ice while others jumped from one
    ice cake to another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Keyoota stabbed Kemebiiktuak, pushed his body into the water, and later stabbed
    and killed Eeachak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sikeaksheak saw the two murders, promised not to tell if they returned, survived
    one attempted stabbing from behind, and was then killed by Keyoota.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The remaining hunters drifted for several days, reached the land-floe, and
    returned to shore without game.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The returning hunters said the three missing men had separated from them or
    had been lost when the ice broke up; after Keyoota left, other men told what had
    happened.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Akudnirn, a woman had two sons; the elder was strong, feared and hated
    by others, described as bad, and said to cohabit with his mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother told Keyakjuak it would not be right to harm his brother, while
    Keyakjuak’s cousin also wished to kill the elder brother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Keyakjuak and his cousin tested which of them was stronger, and Keyakjuak
    threw his cousin down twice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Keyakjuak and his cousin threw the elder brother down; Keyakjuak stabbed and
    killed him, and they covered the body with stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: People said the dead brother was calling from his grave; Keyakjuak checked
    the body, found it stiff and cold, and later told his mother that he and his cousin
    had killed him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During a ball game, Keyakjuak seized an angry opponent and moved toward a
    boulder as if to strike him against it, but his cousin stopped him and Keyakjuak
    released the man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: During a caribou hunt, several people disputed who killed a large buck, and
    Keyakjuak dashed the caribou to pieces on rocks.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Kanatchea of Padli is described as bad-humored, as striking his wife almost
