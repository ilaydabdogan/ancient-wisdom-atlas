- id: motif:1
  label: Hunters adrift on broken ice
  taxonomy_refs: []
  basis: A walrus-hunting party is carried adrift after the ice breaks up and survives
    several days before reaching the land-floe.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: This is recorded as a setting and sequence pattern; no supplied taxonomy
    reference is specific to ice-drift survival.
- id: motif:2
  label: Murder of companions concealed by false account
  taxonomy_refs: []
  basis: Keyoota kills fellow hunters, and the returning hunters explain the missing
    men as separated or lost until others later reveal the killings.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: No historical or intertextual comparison is implied.
- id: motif:3
  label: Sibling pair with dangerous elder killed by younger brother
  taxonomy_refs:
  - sibling_pair
  basis: The passage presents two brothers, the feared elder and Keyakjuak the younger;
    Keyakjuak and his cousin kill the elder brother.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The supplied taxonomy term is broad; the passage is specifically about
    violent fraternal conflict.
- id: motif:4
  label: Family transgression opposed by kin violence
  taxonomy_refs: []
  basis: The elder son is described as cohabiting with his mother, his mother is angry
    at his ways, and the younger brother and cousin kill him.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: No available taxonomy reference directly names this transgression; the
    label stays close to the passage.
- id: motif:5
  label: Strength contest before killing
  taxonomy_refs: []
  basis: Before the killing of the elder brother, Keyakjuak and his cousin test strength,
    and Keyakjuak proves stronger by throwing his cousin twice.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The text places the strength test before the killing, but does not explicitly
    say the test authorizes or causes the later killing.
- id: motif:6
  label: Reported call from grave with body found dead
  taxonomy_refs: []
  basis: People report that the dead brother is calling from his grave, but Keyakjuak
