canonical_text:
  quote: ''
  summary: The passage presents two Tadlo-centered famine accounts. In the first,
    Tadlo's household suffers starvation and child deaths until his sister confesses
    concealing a stillborn child; afterward Tadlo obtains seals and whales and attributes
    the earlier lack of seals to Sedna's displeasure at non-confession. In the second,
    prolonged bad weather and starvation lead the people to ask Tadlo, acting as angakok,
    to visit Sedna; his soul goes down to her, and two women confess concealed menstruation
    and premature birth, after which improvement is predicted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tadlo, his wife Kunariak, his sister Panelo, and four named children lived
    at Kingawa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During winter starvation, all four children died; Tadlo was lame, and his
    wife and sister dragged him on a sledge to seal-holes without success.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tadlo asked his wife and sister whether either had concealed a stillborn child
    or a time of menstruation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tadlo's wife denied both matters, while his sister confessed that she had
    given birth to a stillborn child, had not informed him, and had thrown it into
    the sea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the confession, Tadlo was taken with his kayak to an open winter water-hole,
    entered the kayak, caught a seal, and the household ate small portions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Tadlo's bad luck left him after his sister confessed,
    and Tadlo says that Sedna does not like people not to confess.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tadlo later caught many seals, a whale, and several white whales, and the
    household gathered meat and blubber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that when bad weather and starvation continue for a long
    time, an angakok may visit Sedna to receive her instructions and wishes.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: In an early autumn famine, wind, broken ice, and deep snow prevented sealing,
    while Tadlo was initially the only man able to hunt and shared seals with the
    people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people asked Tadlo to visit Sedna and ask the cause of the bad weather
    and starvation; his soul went down to Sedna while his body stayed in the hut,
    then returned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sedna told Tadlo that there were two women among the people who were not good;
    Tadlo ordered those women brought into the hut while he continued incantations.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: One woman confessed that she had not informed the people when she was menstruating;
    the other confessed a premature birth that she had not reported.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the women confessed, the angakok said that it would now be well and
    predicted better weather and enough food.
  category: speech
  evidence_refs:
  - ev:8
