canonical_text:
  quote: ''
  summary: The passage describes a community practice in which people judged obnoxious
    may be disposed of by common consent. One angakok discovers that another angakok
    had wished many Eskimo to die. After discussion, the hostile angakok is selected
    for disposal; an old man stabs him while he is clearing ice from a pond hole and
    is thanked by others. The murdered man's wife then goes to live with a young man.
