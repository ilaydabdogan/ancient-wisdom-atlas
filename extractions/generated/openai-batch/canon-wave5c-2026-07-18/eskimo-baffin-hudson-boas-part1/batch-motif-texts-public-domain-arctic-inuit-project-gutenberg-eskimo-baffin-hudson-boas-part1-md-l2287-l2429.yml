canonical_text:
  quote: ''
  summary: The passage describes material culture of the Kinipetu and Aivilik on the
    west coast of Hudson Bay, focusing on kayaks, paddles, harpoons, bladder-darts,
    seal-hole locating tools, caribou-hunting harpoons, and musk-ox horn bows. It
    compares some implements with those of neighboring or eastern Arctic groups and
    gives construction details and uses for hunting seals and caribou.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kinipetu and Aivilik are described as using broadly similar implements
    that can be treated together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The west-coast Hudson Bay kayak is described as lighter than kayaks of Davis
    Strait and Baffin Bay, with a rounded bottom and rounded ribs attached to eight
    longitudinal strips.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kayak is covered with the inner skin of the seal, which is given as the
    reason for its lightness compared with kayaks of Greenland and Baffin Land.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aivilik kayaks are described as shorter than Kinipetu kayaks, with lower stem
    and stern projections.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kinipetu kayak is described as having long stem and stern projections
    and being painted with black and red bands.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aivilik kayaks for hunting caribou in ponds are said to have rounder bottoms
    than kayaks used for seal-hunting in the sea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kinipetu kayak paddle is described as having a longer blade than the Aivilik
    paddle; the blades are painted red with black tips.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kayak harpoons are described as differing in detail from those used by eastern
    tribes, commonly with a wide notched barb.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bladder-dart is used from the kayak in seal hunting and includes a bladder
    attached nearer the butt-end than the tip.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: After an animal is hit by the bladder-dart, the harpoon-point disengages and
    the line wound around the shaft gradually unrolls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The throwing-board used for the bladder-dart has a thumb notch and first-finger
    hole but lacks grooves for the other fingers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Winter harpoons for seal hunting at breathing-holes were not obtained by Captain
    Comer, and the passage suggests this may be because such hunting is not much practiced
    on the west coast of Hudson Bay.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: When locating a seal breathing-hole under snow, the Aivilik use a curved probing-bone
    to find the center and determine whether the seal still visits it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: If a seal-hole is deserted, it is said to be covered with ice.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: After locating a breathing-hole, a delicate ivory rod attached to sinew string
    and a leather ring is inserted; the seal's contact with the rod indicates its
    approach.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: For hunting caribou in ponds, the Kinipetu use a long harpoon with a detachable
    point, an iron foreshaft, and sinew strings connecting head and shaft.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: The bows are made of musk-ox horn riveted together in the middle, with separate
    bone tips in many cases and sinew backing.
  category: object
  evidence_refs:
  - ev:12
- id: obs:18
  text: One described bow has two small eccentric horn pegs on the inner side, possibly
    to hold the bowstring in place when strung.
  category: attribute
  evidence_refs:
  - ev:13
