canonical_text:
  quote: ''
  summary: 'The passage contains three narrative episodes: Kunikjwak leaves a whale-flensing
    site to attack Pudlookshine and his brother-in-law, but is defeated at stone forts
    by the shore; the very tall Seacolearseawetto, who takes seals from others, is
    killed by companions through a binding ruse on the ice, while his wife suspects
    his death despite their denials; and Apartsoo, a quarrelsome man refused caribou-skins,
    is ambushed by villagers and then kills his wife before dying.'
  language: English
  quote_policy: summarized
