canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a man reaches a hut, finds
    his wife, son, and an old man, and sees them transformed into birds through a
    chest of feathers; he cuts his wife while she flies away, and eggs fall from her.
    It then begins the tale of Kiviuq: a poor boy living with his angakok grandmother
    is mocked by village children; the grandmother transforms him into a young seal
    to lure the villagers out to sea, where a gale kills all pursuers except Kiviuq,
    protected by a bird-skin amulet. Kiviuq drifts to a reddish island, finds a hut
    with an old woman and many heads, is warned by a speaking head that the old woman
    eats strangers, and survives her attempted knife-and-tail attack by hiding a stone
    slab under his clothing.'
  language: English
  quote_policy: summarized
