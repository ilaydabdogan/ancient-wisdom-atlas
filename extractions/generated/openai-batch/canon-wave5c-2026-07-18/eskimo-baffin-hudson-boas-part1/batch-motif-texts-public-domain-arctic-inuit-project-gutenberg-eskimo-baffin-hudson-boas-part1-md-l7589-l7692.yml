canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which a man secretly obtains
    seal meat from a hut of bones until others follow him and take the meat; a tale
    in which a boat crew asks land to open and passes through with eyes shut; and
    a tale in which a dying woman passes through successive animals, is eaten as cached
    caribou meat, and is reborn as a girl who later recounts the experience.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wanderer returns to hungry companions and repeatedly goes at night to the
    hut of bones to fetch seal meat without telling others where he goes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other people discover the wanderer's night journeys, follow him to the hut
    of bones, take all that is there, and leave him only a small share.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man says that the householder was named Kooloome, that Kooloome and his
    wife left, and that the wife said she had no stomach and did not eat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In an earlier time without rise and fall of the tide, a boat crew travels
    along Cumberland Sound and encounters a narrow strip of land blocking passage.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The crew speaks to the land and asks for a channel; the steersman tells the
    crew to shut their eyes and pull until the boat has passed through, after which
    the channel closes again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After arriving, women chew seal-skins and men rub and wring them until soft;
    the passage notes that men now hardly do this work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A dying woman is left alone in winter, is swallowed by a wolf while still
    alive, then passes through or enters a fox, bear, water, seal, ground-seal, and
    walrus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After becoming a walrus, the woman cannot dive until other walruses tell her
    how to move her flippers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After entering a caribou, the woman cannot run and jump until other caribou
    teach her to look at the horizon and push forward with her hind feet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eskimo hunters pursue the caribou with kayaks, kill them, tow them ashore,
    cut them up, and cache the meat under stones for winter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman remains aware while cached as meat; her meat stays soft, but she
    hardens herself when the people return so that she looks like frozen caribou meat.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The meat is taken to the huts and eaten by a woman, who becomes pregnant and
    gives birth to a girl; when old enough to speak, the child recounts what had happened
    to her.
  category: sequence
  evidence_refs:
  - ev:7
