canonical_text:
  quote: ''
  summary: The passage catalogs material culture from the Cumberland Sound, Southampton
    Island, Boothia Felix, and west Hudson Bay area, including bows, sinew-backing
    tools, arrow points, fishing spears and tackle, fish snares, ice-hole scoops,
    knots, knives, knife-sharpeners, an axe, and sledge construction using animal
    and imported materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bows are described with horn joints, copper rivets, sinew backing, and a seal-skin
    finger-stall attached to one bowstring for spanning the bow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A toggle with oppositely bent ends and a bone marline-spike are used to twist
    and spread sinew backing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arrow-related pieces include a barbed foreshaft, metal points, slate points
    formerly used in place of metal, and a bone point inserted into a shaft.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A bone implement with holes of different diameters is used to straighten arrow
    shafts and other wooden or bone shafts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: A three-pointed fish-spear with a long shaft is extensively used in fishing,
    and some spear points are made of musk-ox horn.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: West Hudson Bay fishing tackle includes braided sinew line wound on a bone
    reel, a bone hook component with a metal hook, and decoys such as carved ivory
    fishes and teeth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Caught fish are strung on thongs by passing a needle through the gills and
    mouth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: A whalebone snare attached to a stick, with a fine sinew thread, is said to
    be used by children to catch fish in brooks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Fishing holes cut in ice are cleared of floating ice with a musk-ox horn scoop
    tied to a long handle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that knots in this region differ from Cumberland Sound
    examples because line ends are turned over and sewn to form loops instead of using
    slits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old double-bladed knife remains in extensive use, and the long crooked
    knife is also used; teeth mounted on wooden shafts are used to whet knives.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: An axe is described with a metal blade, a mounting similar to an earlier bone
    axe type, and a perforated handle end that the author says was probably for suspension.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old sledges could be made from lengthwise-cut walrus hide rolled tightly and
    frozen, with bone cross-pieces and moss-water ice shoeing; current sledges use
    long runners, jaw shoeing, hoop-iron covering, and spikes or bolts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: When a piece of walrus is dragged home, three ribs are sometimes stuck into
    the meat to act as runners.
  category: action
  evidence_refs:
  - ev:8
