canonical_text:
  quote: ''
  summary: An introductory taboo says that a woman who has lost a child must not work
    fresh skins or she will die. The Cumberland Sound tale called “The Sedna Myth”
    tells of Avilayoq, also called Uinigumissuitung, who marries a dog transformed
    from a speckled stone, has many children, leaves with a kayak man who is later
    identified as a petrel, is recovered by her father, is pursued at sea, and is
    thrown into the water by her father during a storm. Her severed finger joints
    become whales, ground-seals, and seals; she loses an eye, falls into the water,
    and becomes Sedna in the lower world. The dog is drowned with stone-filled boots,
    and the father disappears under the flood tide; both are later described as present
    at or near Sedna’s lower-world house.
  language: English
  quote_policy: summarized
