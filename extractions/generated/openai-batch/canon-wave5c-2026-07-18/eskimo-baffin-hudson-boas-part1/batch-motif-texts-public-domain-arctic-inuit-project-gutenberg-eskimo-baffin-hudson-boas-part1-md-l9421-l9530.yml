canonical_text:
  quote: ''
  summary: 'The passage closes an incident in which an old man repeatedly reproaches
    Pudawallow and Mikiejew for walking on thin ice. It then presents several tales
    of quarrel and killing: Noodelwa, Ekkomalo, and the fleet-footed Akygerjew pursue
    a stranger at a seal breathing-hole; after arrow combat, Ekkomalo kills the stranger
    and Akygerjew takes his kayak. Kammungan, though unable to walk on his feet, runs
    quickly on hands and knees, obtains many caribou skins, provokes anger by comparing
    his success with other men, and dodges their arrows. Finally, Noonatoo suspects
    that the starving Okoweecheak ate his missing dogs; Punewishik sees a fresh dog
    skin, and Noonatoo retaliates by withholding food and walling in Okoweecheak’s
    door, leaving him to starve.'
  language: English
  quote_policy: summarized
