literal_observations:
- id: obs:1
  text: The modern Cumberland Sound sledge is described as wooden, with two runners,
    wooden crossbars, and a back formed by caribou antlers with the skull attached;
    former crossbars were made of bone or antler.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stout two-part thong passes through holes in the runners to fasten the dog
    traces to the sledge, with buttons, a loop, and a clasp preventing slipping and
    enabling fastening.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dog traces are strung on the fastening line with an ivory implement that has
    a large and a small eyelet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dogs have harnesses made of seal-skin or sometimes caribou-skin, with bights
    under the forelegs and straps over the breast and neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: During sealing, a dog may be taken out of the sledge to lead the hunter to
    the breathing-hole; some traces have a clasp so the fore part of the line can
    be unbuttoned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The whip is made of heavy thong with a wooden handle and wrapped, braided
    fastening details.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Round snowshoes with wooden frames and a thong network are used when travelling
    in soft snow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snow blocks for houses were cut with bone snow-knives, and snow-shovels were
    used to cover the base of a completed house with loose snow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lamp and kettle are described as made of soapstone; the large cooking lamp
    is crescent-shaped, and a very small lamp often burns in the rear of the snow
    house or near the entrance.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The kettle has a narrow rim, wide bottom, and perforations at each corner
    for suspension thongs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wooden dishes are made with a flat thick bottom, pegged wooden rim, bent side
    strip, overlapping bevelled ends, and bone or ivory reinforcement; some trays
    were hollowed out of solid blocks of wood.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A caption identifies an implement for squeezing water out of skins.
  category: object
  evidence_refs:
  - ev:8
