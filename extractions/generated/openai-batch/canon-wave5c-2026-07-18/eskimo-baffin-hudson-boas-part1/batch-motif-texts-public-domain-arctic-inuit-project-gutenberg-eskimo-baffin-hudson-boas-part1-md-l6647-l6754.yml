candidate_motifs:
- id: motif:1
  label: Affinal or intergroup woman amid massacre and punishment
  taxonomy_refs: []
  basis: Eavarnan is an Adla girl living among Eskimo who visits her own people and
    slanders the Eskimo; after Adlet kill the Eskimo women, the returning men mutilate
    her.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explicitly state that Eavarnan planned or ordered
    the killings, only that she slandered the Eskimo and remained after the massacre.
- id: motif:2
  label: Revenge raid into enemy communal house
  taxonomy_refs: []
  basis: Two men set out to avenge the murdered women; one secretly enters the large
    Adlet tent where people are eating and kills them all.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader comparative taxonomy is asserted from the passage.
- id: motif:3
  label: Captive stranger gains favor through superior hunting skill
  taxonomy_refs: []
  basis: Mumatchea’s husband is captured by Adlet but later impresses them by catching
    a basking seal in a manner they had not seen and is praised by their chief.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not say he intentionally teaches the Adlet or becomes
    a culture hero.
- id: motif:4
  label: Fiery anger punishes sexual transgression
  taxonomy_refs: []
  basis: After the chief’s brother has intercourse with the chief’s wife, the chief
    becomes angry, breathes fire, sends the Eskimo away, and a great fire rises from
    the camp where he probably burned the wife and brother.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The burning of the wife and brother is phrased as probable by the narration,
    not directly witnessed.
- id: motif:5
  label: Ancient tall predecessor people with strange lifeways
  taxonomy_refs: []
  basis: The Tornit are presented as a tall and strong race who formerly inhabited
    the country and practiced unfamiliar ways of housing, clothing, food storage,
    and medical treatment.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage is descriptive and does not narrate a conflict or transformation
    involving the Tornit in this section.
- id: motif:6
  label: Fatal cliff entrapment connected to concealed menstrual condition
  taxonomy_refs: []
  basis: The tuneq man cannot descend from the cliff after seeing an image involving
    his sister; after his death, she says she had not told him she was menstruating
    and had urinated while he was on the hill, causing his misfortune.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The causal explanation is reported by the sister within the tale; the
    exact mechanism is not explained.
