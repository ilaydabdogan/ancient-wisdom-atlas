canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound traditions: Eavarnan, an
    Adla girl living among Eskimo, is punished after Adlet kill Eskimo women; two
    Eskimo men avenge the women by killing Adlet in a large tent; Mumatchea, her husband,
    and child are captured by Adlet, but the husband gains favor through skilled sealing
    before a chief’s fiery anger destroys his own household; and stories about Tornit
    describe an ancient tall people and a tuneq man who dies on a cliff after an incident
    connected by his sister to undisclosed menstruation and urination.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eavarnan is described as an Adla girl who lived with the Eskimo, visited her
    own people, and slandered the Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Eskimo men were out in kayaks hunting seal, the Adlet went to the Eskimo
    tents and killed all the women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eavarnan waited for the Eskimo men to return and asked who wanted to marry
    her; after the men found their wives murdered, two men cut off her arms close
    to the shoulders.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two Eskimo men went secretly to the Adlet village to avenge the women; one
    wore clothing made from fresh-water seal skin while the other watched outside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fresh-water-seal-clothed man entered the large Adlet tent, found the people
    eating from a large dish, killed them all, and the avengers took Adlet property
    home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Akudnirn, Mumatchea, her husband, and a child encountered Adlet; the husband
    hid Mumatchea under snow and a sledge, but the Adlet found her and took the family
    to the chief’s house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Eskimo family remained among the Adlet through the spring; Mumatchea’s
    husband went sealing with the Adlet, and the chief’s wife became pregnant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mumatchea’s husband caught a basking seal by crawling up to it and harpooning
    it; the Adlet had not seen this method before, and the chief praised him as skilful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the chief’s wife gave birth, the chief’s brother had intercourse with
    her; she did not tell the chief, but he knew, became angry, warned the Eskimo
    to go home, and breathed fire from his nostrils.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the Eskimo family left the Adlet camp, they saw a great fire rising
    from it; the narration states that the chief had probably burned his wife and
    brother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Tornit are described as a tall and strong people who lived in large stone
    houses, did not know how to dress skins, wore wet caribou skins to dry them, kept
    rancid seal meat under their jackets, and drilled skulls to cure headaches.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A tuneq man climbed a steep island cliff to catch nesting fulmars; when he
    tried to descend, he repeatedly thought he saw his sister’s lower parts bare,
    stayed on the cliff, lived on young fulmars, and died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tumoovat later found human bones near the precipice; after her brother’s death,
    the tuneq woman said she had not told him she was menstruating and had urinated
    while he was on the hill, which she identified as the cause of his misfortune.
  category: sequence
  evidence_refs:
  - ev:9
