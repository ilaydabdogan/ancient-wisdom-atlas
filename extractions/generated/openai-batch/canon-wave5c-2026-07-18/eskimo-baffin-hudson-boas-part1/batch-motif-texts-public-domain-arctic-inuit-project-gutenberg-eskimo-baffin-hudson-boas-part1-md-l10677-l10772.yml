  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The wife later runs toward her brother's village, hides behind rough ice when
    Igimagajug pursues, reaches her brother's house, and tells her brother and his
    friends what happened.
  category: sequence
  evidence_refs:
  - ev:9
