canonical_text:
  quote: ''
  summary: A tale fragment tells of two girls lured by toys into a witch's stone house,
    their escape through a side opening, and the community's capture and killing of
    the witch, whose body contains flint, copper, lead, and beads that later become
    bodily substances. A second tale begins with Igimagajug, whose anger after his
    wife's still-born child offends Nuliayoq and leads to the withholding of seals.
    Igimagajug becomes a cannibal, while his angakok wife escapes by using a moss-filled
    clothing figure as a decoy, hiding in a snow house, and later fleeing toward her
    brother's village while Igimagajug searches and pursues her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A carved ivory bird and another toy draw the children farther from their village
    to the door of a stone house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old woman closes the entrance with a large stone after the children have
    entered the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children see human skulls and bones in a small adjoining room and identify
    the old woman as a witch who decoyed them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The older girl distracts the witch by speaking about the closed door, while
    the younger girl makes an opening in the side of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Both girls crawl out through the side opening, return to their father's house,
    and report what happened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man pretends to offer to cut the old woman's toenails, slips a line around
    her ankles, and calls others to pull her from the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people pull the old woman out, break her legs, drag her to their village,
    kill her with spears, and cut up her body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old woman says her teeth are flint, stomach copper, liver lead, and knees
    beads; when cut up, her body is found as described.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The people divide the flint, lead, copper, and beads, but the next morning
    these materials have become flesh, bone, and teeth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Igimagajug brings home a ground-seal after hunting, and his wife reports that
    she has had a still-born child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Igimagajug angrily commands his wife to haul in the seal; this offends Nuliayoq,
    who withholds the seals and causes hunger among the people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Igimagajug kills and eats his father-in-law, mother-in-law, and other nearby
    people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Igimagajug's wife, described as a powerful angakok, fears being eaten and
    prepares an escape while he is away sealing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The wife fills her clothing with moss to make a figure, instructs it how to
    behave if Igimagajug enters and stabs it, and builds a small snow house with a
    peephole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Igimagajug stabs the moss-filled figure, which cries out as instructed, but
    he later discovers that it is only clothing filled with moss.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Hungry and angry, Igimagajug cuts and eats a piece from his own leg, then
    remarks that he now knows killing and eating hurts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: 'Igimagajug uses a seal-line in a spell: heavier responses mean affirmation
