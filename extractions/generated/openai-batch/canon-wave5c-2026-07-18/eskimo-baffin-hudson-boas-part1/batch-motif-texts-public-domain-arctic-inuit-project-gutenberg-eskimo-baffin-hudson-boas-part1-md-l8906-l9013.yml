canonical_text:
  quote: ''
  summary: 'The passage recounts a boy who outruns sledges and kills three bears after
    his father urges him to run, followed by tales of caribou hunters: Nipatchee discovers
    a stone-covered wooden spar, makes and hides oversized arrows, runs down caribou
    and kills many without missing; two married brothers avoid the main caribou hunt
    but later travel by kayak and overland to a lake where they obtain abundant caribou
    skins and meat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In winter, some Eskimo driving near Qivitung see three bears on the ice while
    the floe-edge is a day’s drive away.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A father tells his son to run ahead of the sledges and try to catch the bears,
    knowing that the son is swift and a good bear-hunter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son initially falls behind the sledges despite repeated urging from his
    father to run faster and learn while young.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After asking for and receiving his father’s harpoon, the boy runs sideways
    away from the sledges and then ahead of them at great speed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The three bears attack the boy, and he avoids their biting and striking by
    jumping over them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before the sledges reach him, the boy kills all three bears with his spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When asked what he did to his knees to run so fast, the boy replies that his
    knees are light.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Nipatchee hunts caribou beyond Padli for many summers and discovers a large
    spar whose outside is stone and whose inside is usable wood.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nipatchee regularly takes wood from the spar to make very large arrows with
    caribou-antler points, and he hides these arrows from other people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Other hunters find arrow-shafts larger than ordinary Eskimo arrows, and Nipatchee
    says they may be his lost arrow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Nipatchee runs after caribou until close enough to shoot them with arrows,
    while others follow and cut up the killed animals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At one hunting-place, Nipatchee shoots an arrow through two caribou; later
    he kills many caribou one after another.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Men who witnessed Nipatchee’s hunting say they had never seen anyone so swift
    of foot and that he never missed a shot.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Niutang in Kingnait, two married brothers do not join the other men in
    caribou-hunting, preferring kayak hunting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The two brothers say they will go for young eider-ducks for winter jackets,
