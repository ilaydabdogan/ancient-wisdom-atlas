  summary: The passage describes post-death prohibitions lasting three days, grave
    visits in which relatives speak as though the deceased remains present, promises
    to name a future child after the deceased and to bring game, food eaten and left
    at the grave, and the leaving behind of certain skins associated with a person
    who died during the year.
