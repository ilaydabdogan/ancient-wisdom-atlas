canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Armuckjuark is killed and
    Artinarkjuark escapes a coordinated night attack, hides with his parents, returns
    alive, rewards one wife, rejects another, kills two attackers, and departs with
    his wife. It then gives the tale of a man who enters an abandoned dancing-house,
    encounters a hairless spirit, escapes through a window, and becomes a great angakok.
    It closes with a tale in which Owl and Bear quarrel verbally; Bear feigns death,
    lures Owl close, and kills him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the wives were gathering moss, a number of people told them they intended
    to kill Armuckjuark and Artinarkjuark that night and asked the women to put their
    stockings out from under the tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women returned, did not tell their husbands about the intended attack,
    and put the stockings out from under the tent when they lay down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dark the attackers collapsed Armuckjuark's tent and Artinarkjuark's tent
    and tried to stab the people inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Armuckjuark crawled on his hands and feet while carrying the fallen tent and
    men along for a distance, and was finally killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the attack on Artinarkjuark, one attacker pitied him and shouted that
    Armuckjuark was coming, which made the attackers jump up and allowed Artinarkjuark
    to escape wounded.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Artinarkjuark reached a stream, waded in it to cover his tracks, and then
    came to the place where his parents lived near duck-catching snares.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Artinarkjuark's parents dressed his wounds and gave him new clothing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When pursuers came to the tent, Artinarkjuark's mother covered him on the
    ground, and the old couple denied seeing anyone, fed the pursuers, and let them
    leave believing he was dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After his wounds healed, Artinarkjuark stayed with his parents, hunted, and
    made beautiful clothing for himself and for a woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Artinarkjuark returned to his village, a man who had stabbed him and
    carried a charm against his spirit dropped the charm after seeing him alive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Artinarkjuark called his wives; one came quickly, received the beautiful clothing,
    and the other was rejected because she did not come at once.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Artinarkjuark challenged two men who had stabbed him, killed them, and left
    the village with his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In an abandoned village, two men went to the old dancing-house; one remained
    outside while the other began to enter and asked where the dancers were.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The entering man felt a foot, leg, thigh, body, arm, and head, but found no
    hair.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The spirit said that it had no hair and tried to take hold of the man, but
    he escaped through the window and afterward became a great angakok.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Owl was watching a lemming hole when Bear came near, and the two exchanged
    hostile remarks about each other's behavior, cleanliness, children, and eyes.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Bear pretended to be dead; Owl came closer, and Bear caught Owl in his mouth
    and killed him.
  category: sequence
  evidence_refs:
  - ev:13
