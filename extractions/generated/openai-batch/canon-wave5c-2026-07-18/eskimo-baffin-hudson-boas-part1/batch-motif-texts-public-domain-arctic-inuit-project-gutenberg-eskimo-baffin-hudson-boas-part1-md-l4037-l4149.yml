  summary: The passage describes a Nugumiut autumnal festival involving masked supernatural
    figures, then gives traditions and rules concerning pregnancy, birth, postpartum
    restrictions, burial, grave goods, and taboos related to the souls of children,
    deceased people, and sea animals.
