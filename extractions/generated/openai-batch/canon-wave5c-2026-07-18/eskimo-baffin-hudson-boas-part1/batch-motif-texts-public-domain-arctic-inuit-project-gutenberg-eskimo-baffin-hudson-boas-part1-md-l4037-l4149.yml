literal_observations:
- id: obs:1
  text: Three masked persons representing supernatural beings appear in the Nugumiut
    autumnal festival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ekko and Ekkotow walk around huts, are led into the dancing-house, jump violently,
    and are later undressed by the angakut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ekko carries a kayak-scraper, pretends to strike people, lowers his head as
    if to butt them, and the people run away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Noonagekshown carries a spear, has a drag on his back, is bound with ground-seal
    lashings, has many objects hanging from his dress, and has his face covered with
    dog-skin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Noonagekshown appears in spring and autumn and is said to bring health to
    the sick, fair weather, and plenty of food, like Ekko.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ekko and Noonagekshown do not speak but make signs to indicate what they wish
    to say.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The regulations concerning birth are connected with the belief that vapor
    from the mother is offensive to the souls of sea animals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Akkoolookjo and Omernetoo are described in tradition as beings who advised
    people to obey certain customs when they became numerous.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Omernetoo instructs pregnant and postpartum women to use wolf teeth and a
    bear-tooth clasp to protect the child's soul.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Pregnant and postpartum women are given food restrictions involving seal kidneys,
    seal intestines, and seal meat caught by persons other than the husband, boys,
    or old men.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: After birth, a mother changes clothing and the infant's clothing and blanket
    in a rite called keeneatoon before she is fully allowed to visit houses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A body is buried at once after death, and the person preparing it places rabbit
    fur in his nostrils, wears some of the dead person's clothing, and drags the corpse
    away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the fourth day, relatives take a cup, knife, and small harpoon-head to
    the grave for the dead person's soul in case it wishes to go sealing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The soul of the deceased is supposed to leave the house after the fourth night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Clothing worn while the deceased's breath was leaving the body is said to
