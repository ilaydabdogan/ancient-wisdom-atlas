canonical_text:
  quote: ''
  summary: 'A sequence of short animal and soul tales: a lemming escapes an owl through
    a dance ruse; caribou defeats bear in a strength trial; a frightened child and
    grieving grandmother become birds; loon and crow alter each other''s bodies through
    sewing, lampblack, and violence; two rabbits escape an owl and tear him apart
    around a boulder; rabbit deceives fox with false seal tracks; an abused loon causes
    a deadly snowstorm; and a dead woman''s soul enters animal bodies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An owl sees a lemming feeding outside its hole and perches at the entrance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owl tells the lemming that two dog-teams are coming, and the lemming approaches
    the hole as if preferring to be eaten by the owl.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lemming offers to sing while the owl dances; while the owl is distracted
    looking upward, the lemming runs between the owl's legs into the hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lemming's wife tells him not to come out again and to throw dirt into
    the owl's face.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Bear and Caribou lock forearms in a trial of strength, and Caribou proves
    stronger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old woman tries to frighten her child by claiming to see hairless lemmings;
    the child becomes very small, turns into a small bird, and flies away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The grandmother grieves, rubs skin from around her eyelids, hangs a pouch
    around her neck, puts a needle into her boot-leg, flies away, and becomes a ptarmigan;
    the pouch becomes the gizzard and the needle becomes a leg bone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Crow and Loon agree to make clothes for each other, sewing skins with thread
    rubbed in lampblack; Crow's seam around Loon's body makes Loon speckled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because Crow will not sit still, Loon pours the lamp contents over Crow, making
    Crow black; Crow throws a stone at Loon, breaking and flattening Loon's legs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An owl seizes two rabbits, one in each foot, and the owl's wife advises letting
    one go and killing the other.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The two rabbits run on opposite sides of a boulder, and the owl is torn in
    two.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rabbit tells Fox to follow his tracks backward to find a seal; Fox instead
    finds only the place where Rabbit had been sleeping in the sun and later calls
    Rabbit a liar.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Men catch a loon, pull out nearly all its feathers, and release it with one
    long feather left in each wing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the following winter, deep snow prevents people from reaching walrus meat
    buried under stones; many die of starvation, and the storm is attributed to the
    loon seeking revenge.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A dead old woman's soul enters a raven; after the raven lays eggs, a man shoots
    it and gives it to a dog to eat, after which the woman's soul enters the dog.
  category: sequence
  evidence_refs:
  - ev:11
