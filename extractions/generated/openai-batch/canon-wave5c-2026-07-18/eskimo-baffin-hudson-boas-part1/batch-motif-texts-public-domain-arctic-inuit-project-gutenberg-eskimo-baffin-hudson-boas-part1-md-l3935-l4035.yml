canonical_text:
  quote: ''
  summary: The passage describes Eskimo religious ceremonials centered on appeasing
    Sedna, animal souls, and dead souls after taboo transgressions. In a fall rite,
    angakut send their souls down to Sedna, receive her reproaches and promises, and
    later ritually harpoon and cut her; blood on the tools and floor is read as a
    sign of abundant food. The next day Qailertetang, Sedna’s servant, appears in
    masked representation and presides over festival acts involving birth-linked animal
    skins, shouting for gifts, a summer-versus-winter rope contest, water-sipping
    wishes for calm souls and weather, and ritual pairing of men and women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stated object of the religious ceremonies is to appease Sedna, animal
    souls, or dead souls offended by taboo transgressions, using the guardian spirits
    of the angakut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The most important ceremony occurs in the fall, when Sedna is said to visit
    her people and give abundant food if they follow instructions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three angakut participate in a gathering; their souls go down to Sedna’s house
    to ask about food and health, receive Sedna’s reproaches and promises, then return
    and report her instructions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Sedna approaches, an angakut throws a kayak-type harpoon and line at
    her, after which Sedna slides back to her abode.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One angakut’s soul follows Sedna with a large knife and stabs her; after light
    is restored, blood on the harpoon, knife, and floor indicates plentiful food for
    the year, while no blood on the knife is an ill omen.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The people explain that cutting Sedna is an old custom, makes her feel better,
    and is like giving drink to a thirsty person; the author tentatively suggests
    it may cut off transgressions attached to her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the following day Sedna sends Qailertetang, represented by a man in women’s
    costume and a seal-skin mask; she is described as a large woman who makes good
    weather and makes human souls calm like the sea.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Qailertetang carries harpoon-line, harpoon, drag, and skin-scraper; she is
    dumb, sees everything, likes enjoyment, and her arrival is accompanied by a festival.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Festival participants attach to their hoods a piece of skin from the kind
    of animal their mothers used when cleaning them at birth; not wearing it or wearing
    the wrong kind is associated with sickness, punishment, and souls becoming light
    and leaving the body.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wearing the birth-linked skin piece is said to make the people new.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Participants run around tents shouting until an owner comes out and gives
    a small present, usually food; the cries are said to keep souls longer in bodies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A long rope with tied ends is used in a contest between summer-born people
    standing near the water and winter-born people standing inland; winter’s victory
    predicts plentiful food, and summer’s victory predicts a bad winter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Participants bring water to a tub near Qailertetang, sip it, state their birthplace
