canonical_text:
  quote: ''
  summary: A man named Itiqtaujaq seeks a wife, first unsuccessfully at a tent and
    then by taking the boots of a woman near a lake until she agrees to marry him.
    After they have a son, the wife becomes upset, uses feathers to fly away with
    the son, and Itiqtaujaq follows toward the hole of heaven and the land of birds
    through a sequence of hazards. He meets Eqaluqdjuq, who makes fish from wood and
    tells him how to reach his wife by traveling on a fish tail with closed eyes.
    Itiqtaujaq reaches the islands, finds his former wife with another husband, and
    wounds her as she begins to fly away; many eggs fall down.
  language: English
  quote_policy: summarized
