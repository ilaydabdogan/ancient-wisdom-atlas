candidate_motifs:
- id: motif:1
  label: sex transformation enabling marriage and parenthood
  taxonomy_refs:
  - shapeshifter
  basis: Two tale segments describe figures changing sex or gendered bodily appearance
    and entering marriage; one is identified as father of a child, and another becomes
    a wife and has a child.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage reports transformations literally but does not explain their
    ritual or social meaning.
- id: motif:2
  label: transformed body parts and markings become travel equipment or animals
  taxonomy_refs:
  - shapeshifter
  basis: The grandmother transforms privates, snow, and facial tattooing into a sledge,
    dogs, kayak, and paddle.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This motif is limited to the first tale fragment in the passage.
- id: motif:3
  label: death from witnessing, shame, or ridicule around transformation
  taxonomy_refs: []
  basis: A witness to the angakok's transformation dies, a woman who laughs at the
    transformed angakok dies, and the grandmother dies from shame after seeing the
    visitor's legs.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage gives adjacent events but does not state a general rule linking
    all such deaths.
- id: motif:4
  label: organ removal by rival spirit-practitioner causing death
  taxonomy_refs: []
  basis: A powerful angakok assumes spirit form, removes the transformed angakok's
    heart and intestines, and keeps half of the heart, preventing full recovery.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader taxonomy reference is assigned because the episode ends in
    death rather than successful rebirth.
- id: motif:5
  label: guardian spirit aids stranded hunters through animal transformation
  taxonomy_refs:
  - shapeshifter
  basis: A great angakok summons a large bear guardian spirit while stranded on an
    ice floe, and the hunters become bears to swim to shore.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not explicitly state whether the guardian spirit causes
    the transformation.
- id: motif:6
  label: taboo violation prevents return to human form
  taxonomy_refs: []
  basis: The oldest brother warns that killing seals will prevent the men from regaining
    human shape; the brother-in-law kills and eats a seal and must remain a bear.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The taboo is specific to this transformation episode.
- id: motif:7
  label: bird transformation to obtain food for returnees
  taxonomy_refs:
  - shapeshifter
  - return
  basis: The oldest brother transforms into a gull, flies to people cutting up a whale,
    eats meat, and brings meat back before the brothers resume human shape.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly say the whale meat itself causes the restoration.
- id: motif:8
  label: woman refuses human husbands and accepts dog as spouse
  taxonomy_refs: []
  basis: The next tale opens with a daughter refusing husbands and agreeing when her
    father suggests she might prefer a dog.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: Only the opening of the tale is included in this passage; the marriage
    is not yet narrated here.
