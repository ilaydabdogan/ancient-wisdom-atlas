canonical_text:
  quote: ''
  summary: The passage contains the conclusion of one tale in which a grandmother
    transforms herself and objects to become a male spouse and father, followed by
    the tale of an angakok who becomes a woman after being crippled by a whale, is
    later killed by another angakok, the tale of hunters transformed into bears after
    being carried away on an ice floe, and the opening of a tale about a woman who
    refuses husbands and is told she might prefer a dog.
  language: English
  quote_policy: summarized
