canonical_text:
  quote: ''
  summary: The passage recounts Ekkoma predicting and enabling a successful caribou
    hunt, finding water, and finding a place to fasten a boat; gives a short tale
    of Analukasa and her lost son Kinguya; lists amulets and hunting-success practices;
    describes an offering at a steatite quarry; and narrates a pyrites-aided repulsion
    of an approaching moon or spirit during a sledging journey.
  language: English
  quote_policy: summarized
