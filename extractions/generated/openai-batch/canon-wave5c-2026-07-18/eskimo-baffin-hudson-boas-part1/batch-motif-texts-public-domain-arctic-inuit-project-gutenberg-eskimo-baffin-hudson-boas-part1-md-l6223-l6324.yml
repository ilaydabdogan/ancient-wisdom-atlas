  summary: The passage contains the end of a giantess tale involving bear hunting
    and a fatal Latin-described marital episode, followed by a tale of a cannibal
    woman who kills a traveler and is killed by his friend, and a tale in which an
    abused pregnant woman calls the Man in the Moon, travels upward by dog sledge
