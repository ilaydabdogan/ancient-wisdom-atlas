canonical_text:
  quote: ''
  summary: In a village dancing-house, Qaudjaqdjuq is mistreated and forced to perform
    humiliating tasks. After the Man in the Moon causes anger by upsetting a pot,
    Qaudjaqdjuq and the Man in the Moon are sealed inside. The Man in the Moon revives
    a dead ermine, which lures villagers into fatal pursuits and opens a way out.
    Away from the village, the Man in the Moon whips Qaudjaqdjuq six times while instructing
    him to deny pain; Qaudjaqdjuq grows into a large strong man. The Man in the Moon
    summons three bears, which Qaudjaqdjuq kills. Qaudjaqdjuq then kills villagers
    while recalling their earlier abuses, and later takes two women as wives, injuring
    one who is slow to respond.
  language: English
  quote_policy: summarized
