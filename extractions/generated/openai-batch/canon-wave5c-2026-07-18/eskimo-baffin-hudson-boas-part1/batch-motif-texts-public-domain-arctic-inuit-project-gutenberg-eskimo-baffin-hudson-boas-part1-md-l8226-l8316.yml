canonical_text:
  quote: ''
  summary: The passage contains two transformation tales. In the first, an old woman
    and her adopted daughter are left alone; the old woman transforms into a man,
    makes dogs and hunting equipment from parts of her own body, hunts seals of gradually
    improving quality, impregnates the young woman, and later reverts to an old woman
    when a male visitor discovers the situation. In the second, Powmenakjwane injures
    his penis while hunting, gives up male hunting work, adopts woman’s clothing and
    seeks a husband; when his female identity is challenged, he tears the skin from
    his face, exposing bone and causing deaths. Later a woman who lent him her husband
    sees his privates but denies having disclosed it.
  language: English
  quote_policy: summarized
