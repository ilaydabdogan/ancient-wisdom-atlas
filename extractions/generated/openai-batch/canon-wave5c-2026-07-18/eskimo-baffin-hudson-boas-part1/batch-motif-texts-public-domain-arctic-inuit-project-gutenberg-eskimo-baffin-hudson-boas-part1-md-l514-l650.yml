canonical_text:
  quote: ''
  summary: The passage first reports Captain Comer's comparison of Kinipetu and Aivilik
    bodily traits, voices, cleanliness, and diet. It then describes in technical detail
    a Cumberland Sound kayak obtained by Lieutenant R. E. Peary, including its wooden
    framework, ribs, gunwale, manhole, seal-skin covering, deck lines, harpoon-line
    receptacle, ivory fittings, seal-skin float, and paddle. The passage ends by comparing
    this kayak with examples from Savage Islands, Hudson Strait, and with the kayak
    type of the Smith Sound Eskimo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Captain Comer is reported as saying that the Kinipetu are generally taller
    and thicker-set than the Aivilik and have more voluminous voices.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same report says the Kinipetu are cleaner than the Aivilik because they
    live largely on caribou, while the Aivilik live mainly on seal and walrus whose
    blubber soils belongings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Cumberland Sound kayak obtained by Lieutenant R. E. Peary in 1896 is described
    as 6 meters long.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The kayak framework has a flat bottom made from one central strip of wood
    and two curved lateral strips, held together by ribs sewed with sinew and thong.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ribs are spaced about 26 centimeters apart, bend upward at the sides,
    and are mortised into strips that form the gunwale.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two strong central beams frame the manhole, with the forward beam bent upward
    and the rear beam flat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wooden framework is covered with tightly drawn seal-skins held taut by
    thongs and sewed with sunken sinew stitches.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the manhole, the seal-skins are fastened to a hoop that is flat behind
    and sharply curved in front.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The deck has lines that hold hunting gear, including the harpoon and the receptacle
    for the harpoon-line.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The harpoon-line receptacle has a bottom of three boards, a handle-like extension
    for shoving under deck-lines, and an ivory hook on the right side for holding
    the harpoon shaft.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A small ivory implement attached near the manhole probably serves to hold
    the harpoon-line, whose coils rest on the receptacle and whose hind end is attached
    to a seal-skin float behind the manhole.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The kayak paddle is 305 centimeters long, with a 74-centimeter handle, rounded
    narrow blades, bone tips, and a notched ring with a fur strip.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: A kayak from Savage Islands, Hudson Strait, collected by Peary, is described
    as practically identical in structure with the Cumberland Sound kayak.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage compares the Cumberland Sound kayak with the Smith Sound Eskimo
    kayak and states that their types are clearly similar, while noting differences
    in rib construction and stern projection.
  category: relationship
  evidence_refs:
  - ev:10
