canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Okingwa releases a fox
    he identifies as his dead mother's soul, a tale in which Koocharoun murders a
    companion who later returns to accuse him, and the beginning of a spirit tale
    in which an underground being appears in a snow house and pursues a fleeing man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Okingwa's mother had died less than two months earlier, and Okingwa was seated
    at a seal breathing-hole at night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A voice called Okingwa by name from a fox trap and said the door had fallen
    after the speaker touched grease taken from the speaker's oil-lamp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Okingwa released the fox and told people he did not want to kill it because
    he knew it was his mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Koocharoun's companion caught a ground-seal, and Koocharoun killed the companion
    while they were preparing to cut it up on ice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Koocharoun fastened the ground-seal to the man's body with a sealing-line
    and threw both into the water, where both sank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Koocharoun returned home and said his friend had been lost; the friend's parents
    mourned and did not join the dancing-house gatherings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The murdered man appeared in the dancing-house, accused Koocharoun by name
    of fastening him to the ground-seal and sinking him, and disappeared into the
    ground.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the apparition repeated the accusation, Koocharoun followed him, and
    only the soles of Koocharoun's boots were last seen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The murdered man returned and remained in the dancing-house, where he told
    how Koocharoun had murdered him; the text states that he had returned to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An old woman was sent to tell the parents that their son was in the dancing-house;
    the father first took this as an insult and asked for a knife, but his wife urged
    him to go and see.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The parents saw their son in the dancing-house; afterward the father sent
    a loaded sledge down a hill so people could gather the scattered goods, and the
    son went home with his parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the spirit tale, a man with two wives and an adopted daughter was returning
    from Lake Netchillik toward Tininiqdjuaq and was making a snow-house entrance
    while the women prepared the interior.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man heard repeated laughter from the women, received no answer when he
    called to them, and cut a hole to look inside.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Inside, the women were on the bed with heads bent down and arms over their
    heads, and a terrible being with a pointed head had risen from under the ground.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The man fled with his dogs and sledge; the spirit pursued and gained on them
    until the man threw a mitten at it, after which the spirit stopped and the man
    reached Tininiqdjuaq.
  category: action
  evidence_refs:
  - ev:8
