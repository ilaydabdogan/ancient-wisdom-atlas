candidate_motifs:
- id: motif:1
  label: Incantation performance with communal commands to unseen forces
  taxonomy_refs: []
  basis: The ceremony includes a throwing-away gesture, the words “Begone,” and repeated
    group cries of “Go on.”
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not fully identify the unseen addressee; the evil-spirit
    interpretation is marked as probable by the source narrator.
- id: motif:2
  label: Guardian spirit journey for distant knowledge
  taxonomy_refs: []
  basis: The guardian spirit is said to visit the narrator’s distant home and to see
    absent hunters, enabling the angakok to report locations, conditions, and warnings.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports the ritual claim but does not describe the spirit’s
    journey in narrative detail.
- id: motif:3
  label: Animal-headed helper and animal embodiment in ritual
  taxonomy_refs:
  - shapeshifter
  basis: The guardian spirit has a walrus-like head, and the angakok holds sticks
    to his face as walrus tusks while behaving wildly.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage describes a walrus-headed spirit and ritual representation,
    not an explicit transformation; the shapeshifter taxonomy link is therefore cautious.
- id: motif:4
  label: Divination by locating hidden objects
  taxonomy_refs: []
  basis: The Kinipetu angakok repeatedly finds an object after people hide it.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The hidden object itself is not identified.
- id: motif:5
  label: Trance vision of approaching sickness with apotropaic directions
  taxonomy_refs: []
  basis: In trance the angakok sees approaching sickness and prescribes shooting guns
    northeast and northwest with prayer to ward it off.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives no further explanation of the directional symbolism.
- id: motif:6
  label: Omen object foreboding death
  taxonomy_refs: []
  basis: The angakok says that finding the lost gold stud would forebode death.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not state whose death is foreboded.
- id: motif:7
  label: First-animal hunting restraint for good luck
  taxonomy_refs: []
  basis: The angakok says the whalers will have good luck if they do not attempt to
    catch the first walrus seen in spring.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not explain whether this is a general rule or a specific
    instruction for the whalers.
- id: motif:8
  label: Post-ceremony spouse exchange with sickness sanction
  taxonomy_refs:
  - sacred_exchange
  basis: After each ceremony people must exchange wives; refusal by a woman is expected
    to bring sickness, and near-relative pairings are prohibited.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage frames the exchange as a custom after incantations but does
    not use the term sacred; the taxonomy link is interpretive and should be reviewed.
- id: motif:9
  label: Ritual games and bedding restriction after ceremony
  taxonomy_refs: []
  basis: The day after the ceremony is spent in games and nose-rubbing, and bedding
    must not be disturbed until late in the day.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The rule’s purpose is not explained in the passage.
- id: motif:10
  label: Sickness diagnosis and removal through bodily manipulation
  taxonomy_refs: []
  basis: The cause of sickness is discovered by head-lifting, and painful body parts
    are pricked so that disease leaves quickly.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage only summarizes the practice and does not describe a full
    case.
- id: motif:11
  label: Bereavement or stranger-arrival marking with strips
  taxonomy_refs: []
  basis: When bereaved strangers arrive, strips of cloth or skin are attached to clothing
    or girdles.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage notes a variant report where the custom occurs whenever strangers
    arrive, so the exact triggering condition is not fully settled.
- id: motif:12
  label: Witchcraft spell causing sickness after an offense
  taxonomy_refs: []
  basis: A boy’s illness or condition is attributed to a spell made by an angry old
    angakok after the boy commented on his missing toes.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage says it is not clear whether witchcraft is distinct from the
    art of the angakok.
- id: motif:13
  label: Avoidance of touch because of witchcraft danger
  taxonomy_refs: []
  basis: Some people avoid touching the clothing or bodies of others, perhaps because
    of belief in witchcraft.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: 'The source phrases the causal link as tentative: “It is perhaps due to
    their belief in witchcraft.”'
