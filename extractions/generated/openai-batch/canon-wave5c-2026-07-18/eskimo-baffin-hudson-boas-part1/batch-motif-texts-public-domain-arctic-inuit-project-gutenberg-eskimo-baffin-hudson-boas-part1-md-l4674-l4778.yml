  quote: ''
  summary: The passage describes several angakok incantation performances, including
    commands to unseen forces, guardian-spirit travel, divination about distant people,
    hidden-object discovery, sickness omens, apotropaic shooting and prayer, post-ceremony
    spouse exchange and games, healing practices, mourning or stranger-arrival strips,
    and a reported witchcraft spell causing sickness.
  language: English
  quote_policy: summarized
