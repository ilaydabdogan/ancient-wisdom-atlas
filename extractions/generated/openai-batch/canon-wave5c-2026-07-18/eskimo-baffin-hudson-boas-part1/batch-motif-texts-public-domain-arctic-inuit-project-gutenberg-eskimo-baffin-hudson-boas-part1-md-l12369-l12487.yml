canonical_text:
  quote: ''
  summary: The passage analyzes Eskimo death-related taboos as protections for the
    souls of deceased humans and animals, describes a Central Eskimo system linking
    animal souls with a protectress of sea-animals, and then discusses foreign influence
    in implements and folklore. It lists several tale-complexes as borrowed or paralleled
    from Indian, Athapascan, North Pacific, and Old World traditions, including the
    Origin of the Narwhal and a grave-body-stealing being with a magic-flight episode.
  language: English
