canonical_text:
  quote: ''
  summary: 'The passage contains several linked tale episodes involving Adlet and
    humans: protected human guests in an Adlet settlement are altered to become strong
    and fast, return home with gifted dogs, and send a seal back; a separate Abaqtung
    household episode describes Adlet visitors being ambushed after a wife signals
    her husband; a final brief episode describes Unoko and Makulu hearing a frightening
    unseen presence and finding Adlet footprints.'
  language: English with an embedded Latin sentence in one bodily-treatment episode
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two sons of an old Adla stand guard in the hut while other Adlet smell that
    people have arrived, howl like dogs, and are told not to enter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After repeated evenings of protection, the Adlet become accustomed to the
    man and woman and go hunting with them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man instructs the husband about a treatment for his wife connected
    with menstruation; the passage says the husband obeys with assistance from the
    old Adla's sons until bodily discharge is emitted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the treatment, the woman is initially so weak that her husband carries
    her, but after recovery she becomes very strong and fleet of foot.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman races the dogs around a high hill and returns at the same time as
    the dogs; she is said to run as fast as a caribou.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old Adla directs that the man be taken to a lake, where his legs are placed
    in water until numb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old Adla's two sons cut a piece from the man's instep, press out blood
    and white matter, and the wounds soon heal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the lake and instep procedure, the man is able to run as fast as the
    Adlet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the man and woman decide to return home, the two sons give them the dogs
    and tell them to send back their first ground-seal cut into a rope.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the return journey, the man and woman are pursued by fierce-looking people;
