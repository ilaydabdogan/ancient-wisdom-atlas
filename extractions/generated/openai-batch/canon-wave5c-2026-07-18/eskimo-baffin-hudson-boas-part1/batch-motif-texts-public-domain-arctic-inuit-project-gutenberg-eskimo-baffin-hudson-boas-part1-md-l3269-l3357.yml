canonical_text:
  quote: ''
  summary: The passage describes taboo regulations after deaths of certain sea mammals
    and persons, distinctions among animal categories, an origin tradition for walrus
    and caribou involving a woman who creates them from clothing and reassigns tusks
    and antlers, and numerous food, clothing, hunting, cooking, boat, and seasonal
    separation rules involving walrus, caribou, seal, salmon, and animal souls. It
    ends by cautioning that the walrus-caribou origin tradition does not fully explain
    the wider taboo complex.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the social enforcement of taboos appears clear but
    that the origin of the taboos is obscure.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the death of a sea mammal said to originate from Sedna's fingers, or
    after a person's death, many domestic and craft activities are forbidden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Additional restrictions are stated for women, including prohibitions on combing
    hair, washing faces, and drying boots and stockings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After a ground-seal is killed, the regulations must be kept especially carefully
    because transgressions relating to this animal make Sedna's hands sore.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Walrus, white whale, narwhal, saddle-back seal, and fresh-water seal are said
    not to be subject to the Sedna-finger series of regulations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The souls of the walrus and bear are said to be offended by transgression
    of certain other taboos.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A series of laws forbids contact between walrus, seal, and caribou, but the
    passage says the mythical concept behind these customs is not clear.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A tradition says that a woman created walrus and caribou from parts of her
    clothing, first giving the walrus antlers and the caribou tusks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When people hunted the animals, the walrus upset boats with antlers and the
    caribou killed a hunter with tusks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman called both animals back, gave the tusks to the walrus, flattened
    the caribou's forehead, and put the antlers on the caribou.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage says walrus and caribou have avoided each other since then, and
    people must prevent their meats from touching or being eaten together except under
    specified clothing conditions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Seasonal practices include completing caribou-skin winter clothing before
    walrus hunting, stopping caribou-skin work after the first walrus kill, and burying
    winter clothing and tents at the start of caribou hunting season.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Similar but less strict rules apply to seal and walrus; people change clothing
    or strip naked before eating seal during the walrus season.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The salmon's soul is described as very powerful, and salmon is subject to
    special pot, cooking-location, boot, and boot-leg restrictions.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Walrus, caribou, and salmon may pass through the same doorway but must not
    be eaten on the same day.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Among the Nugumiut of Frobisher Bay, the passage gives variant rules about
    which animals may be eaten on the same day and when clothing must be changed.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: If a person has eaten or hunted walrus, clothing must be changed before eating
    seal or going caribou-hunting, otherwise the transgressions become fastened to
    the walrus's soul.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage states that because the taboos are not restricted to caribou and
