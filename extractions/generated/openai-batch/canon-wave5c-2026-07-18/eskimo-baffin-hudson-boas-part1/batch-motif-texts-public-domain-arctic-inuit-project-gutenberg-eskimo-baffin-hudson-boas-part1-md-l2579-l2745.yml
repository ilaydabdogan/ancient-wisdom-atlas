- id: obs:1
  text: The west coast Hudson Bay whip is described as similar to the Cumberland Sound
    whip; the specimen has a 28 cm handle and a 6 m thong, with extra thong strips
    braided in to thicken the handle part.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skin preparation includes combing caribou skins with a wide-toothed bone comb,
    scraping the inner skin with a split caribou leg-bone scraper, and using other
    scrapers to remove flesh and soften skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some scraper handles are covered with skin and moss, and the passage notes
