  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kinipetu stone scrapers are said to have handles fashioned in the same left-turned
    manner, with stone or sometimes metal blades inserted into the handle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wet skins are squeezed with hollow bone scrapers, some shaped to fit the fingers.
  category: action
  evidence_refs:
  - ev:3
