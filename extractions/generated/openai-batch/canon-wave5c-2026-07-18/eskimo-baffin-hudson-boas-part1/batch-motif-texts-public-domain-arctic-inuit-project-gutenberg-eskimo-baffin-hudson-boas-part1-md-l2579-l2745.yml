canonical_text:
  quote: ''
  summary: 'The passage describes west coast Hudson Bay material culture: whip construction,
    skin-preparation tools, scraper designs, needle-cases and their attachments, winter
    snow-house tools and layout, former whale-bone and turf houses, and household
    furniture. It also records several explicit comparisons with Cumberland Sound,
    Southampton Island, Kinipetu, and Smith Sound forms.'
  language: English
  quote_policy: summarized
