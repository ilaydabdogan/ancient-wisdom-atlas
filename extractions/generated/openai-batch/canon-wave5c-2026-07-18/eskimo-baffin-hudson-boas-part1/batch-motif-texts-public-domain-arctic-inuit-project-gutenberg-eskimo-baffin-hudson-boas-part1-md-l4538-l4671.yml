- id: motif:1
  label: Shamanic empowerment by transmission or bodily ordeal
  taxonomy_refs:
  - initiation
  basis: 'The passage presents two means of becoming a powerful angakok: power transmission
    by an old angakok''s hands and a worm-induced wound ordeal.'
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The first sentence begins mid-context, so the broader explanation of power
    acquisition may precede the supplied passage.
- id: motif:2
  label: Guardian-spirit divination and healing
  taxonomy_refs:
  - wisdom
  basis: Angakut discover hidden causes of disease, famine, and misfortune with guardian
    spirits and act to bring relief.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The supplied taxonomy term 'wisdom' is broad; the passage specifically
    concerns spirit-assisted diagnosis and hidden knowledge.
- id: motif:3
  label: Ritual exchange with guardian spirits
  taxonomy_refs:
  - sacred_exchange
  basis: Payment, offerings, deposited miniature garments, meat for the guardian spirit,
    and fasting are described as pleasing or supplying the guardian spirit.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:11
  confidence: high
  cautions: The passage describes practical ritual reciprocity; it does not provide
    a doctrinal explanation beyond pleasing or supplying the guardian spirit.
- id: motif:4
  label: Journey to a powerful being for restoration of hunting conditions
  taxonomy_refs:
  - mystical_quest
  basis: In famine, an angakok and guardian spirit journey to Nuliayoq's abode to
    obtain good weather and seals.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The destination is not mapped in detail in this excerpt; the label is
    functional rather than geographic.
- id: motif:5
  label: Supernatural obstacle on a ritual journey
  taxonomy_refs: []
  basis: A tupilak tries to prevent the travelers from reaching Nuliayoq and is vanquished.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explain the tupilak's origin or nature beyond its
    obstructing role.
- id: motif:6
  label: Celestial ascent to the moon
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The moon visitor boards a sledge and feels it moving upward through the air
    to an ice-walled destination associated with the moon.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage later states that he had visited the moon, but the mechanics
    and identity of the sledge man are not explained.
- id: motif:7
  label: Avoidance of otherworld food to enable return
  taxonomy_refs:
  - return
  basis: The visitor hides the offered meat because he thinks eating it may prevent
    his return, then runs back through the air to the seal-hole.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage states the visitor's reasoning but does not explicitly confirm
    whether eating the offered meat would in fact trap him.
- id: motif:8
  label: Supernatural offense causing sickness after return
  taxonomy_refs:
  - divine_judgment
  basis: After returning from the moon, the visitor becomes sick; angakut diagnose
    that the moon was offended because he ate seal liver after returning, and he recovers
    after assent.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy term 'divine_judgment' is approximate; the passage says the
    moon was offended but does not elaborate a theology of judgment.
