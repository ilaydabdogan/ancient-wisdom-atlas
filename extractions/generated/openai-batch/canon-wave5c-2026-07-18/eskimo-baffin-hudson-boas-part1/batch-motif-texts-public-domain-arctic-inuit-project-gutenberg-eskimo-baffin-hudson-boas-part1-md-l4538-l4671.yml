canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing angakut and angakok practices: acquisition
    of power, guardian spirits, curing and divination rites, ritual objects and offerings,
    a famine-related journey to Nuliayoq, a moon-visit narrative, and the beginning
    of a described divination ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may receive angakok power from an old angakok by the old angakok
    placing hands on the person's head; another described method involves worms placed
    on the forearms until wounds heal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Angakut are said to use guardian spirits to discover causes of disease, famine,
    and other misfortunes and to bring relief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Guardian spirits named in the passage include a large bear with a man's head,
    a bear living underground, and a being with the head of a walrus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When an angakok prepares to summon a guardian spirit, lights are extinguished;
    during trance he is said to see through the back of his head and discover hidden
    things.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When malignant spirits are seen, the angakok summons a guardian spirit to
    help overcome and drive them away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An angakok asked to drive away sickness must be paid in advance, because this
    is said to please the guardian spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: During incantations the angakok wears a string around one foot; miniature
    skin jackets with colored ribbons are suspended in the snow hut and later deposited
    in lonely places for guardian spirits; a deer-hide drum is used.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: One angakok trying to cure a child fasted all day to please his guardian spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In famine, the passage describes an angakok and a huge bear-shaped guardian
    spirit traveling to Nuliayoq's abode; a tupilak tries to stop them, is vanquished,
    and Nuliayoq is induced to send good weather and many seals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A moon-visit story begins with a man watching a seal-hole at night under a
    full moon; a sledge arrives, he unties his legs, boards it, and rises through
    the air to walls of ice and an entrance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Inside the moon destination, the visitor sees a house with a woman and a little
    boy; the woman offers him meat, but he hides it and does not eat, fearing he may
    not be able to return.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After returning through the air to his seal-hole, the visitor later eats seal
    liver, becomes sick, is diagnosed by angakut as having offended the moon, nods
    assent, and recovers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In a later incantation account, meat is given for the guardian spirit, people
    sit in arranged places in a snow hut, some women cover their heads, the angakok
    wears caribou-skin strips belonging to his guardian spirit, and hatchets are put
    out of sight.
  category: sequence
  evidence_refs:
  - ev:11
