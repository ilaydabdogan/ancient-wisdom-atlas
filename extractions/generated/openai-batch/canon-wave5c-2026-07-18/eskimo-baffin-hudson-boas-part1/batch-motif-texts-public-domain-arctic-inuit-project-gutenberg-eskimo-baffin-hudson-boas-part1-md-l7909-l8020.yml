canonical_text:
  quote: ''
  summary: 'The passage begins with Rating and Atchina retrieving forgotten weapons
    from a flooded shore, where Rating sees a skull under water and remarks that he
    expects to live for some time. It then gives tales of angakut: Ashewaahallow sends
    her soul down to Sedna during famine and returns with a promise of two whales,
    which appear. Ningiu, described as wise and powerful, detects would-be attackers,
    wishes one dead, is accused of bewitching him, later causes one young hunter to
    die by being seen, restores him by wishing, directs hunters to abundant caribou,
    and warns Kudlu not to inquire about unseen beings because seeing them would hurt
    his eyes.'
  language: English
  quote_policy: summarized
