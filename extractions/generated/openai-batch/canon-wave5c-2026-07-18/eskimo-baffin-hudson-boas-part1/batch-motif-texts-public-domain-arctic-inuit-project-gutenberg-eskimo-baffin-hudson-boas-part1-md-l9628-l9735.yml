canonical_text:
  quote: ''
  summary: 'The passage contains several tale episodes: Kanatchea obtains foods for
    his mother out of season, later cuts a nephew during fire-drill play and is killed
    when dogs are allowed into his hut; a wife abandons her child and elopes with
    her brother-in-law Icheytechak, who later drowns after a ground-seal upsets his
    kayak, and the husband brings the wife home and isolates her; the grown son later
    refuses his mother a caribou skin because she abandoned him; Kokoparoolee''s snow-blind
    brother is attacked and fatally stabbed by enemies.'
