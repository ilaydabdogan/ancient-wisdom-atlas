canonical_text:
  quote: ''
  summary: The passage recounts a seal-hunting episode in which Tadlo follows Sedna’s
    instruction to return seal remains to the sea, followed by abundant seals. It
    then gives a tale of taboo infraction involving a cleaned caribou skin, ice breakup,
    death, and named survivors. The passage also reports beliefs about two souls,
    differentiated afterlife destinations, the undersea world Alipa'q with reversed
    seasons, and a harmful burdened soul called a tupilak that ritual specialists
    release by stabbing it with knives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After wind and ice changes, people were initially without food, then the ice
    became strong enough for sealing and a seal was caught.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tadlo told the men to take the seal to the huts, have everyone eat it without
    dividing it, keep the skin, bones, intestines, and blubber, put these into the
    skin, and cast them into the sea; the passage says Sedna had told him to do this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On following days the men caught many seals, did not throw away the remains,
    had fair weather, and thanked Tadlo for his help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator introduces the next tale as an illustration that other taboo
    infractions are punished in similar ways.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman cleaned a one-year-old caribou skin while the people were living in
    snow houses on the ice near Aqba'qtung; afterward the floe broke under their houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people could not escape by sledge, carried cups, knives, harpoon-lines,
    and spears, were followed by dogs, traveled toward shore for many days, suffered
    hunger and thirst, drank urine from cups, and many died on the ice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Only Okoko with his two wives Punyepung and Atatootjavung, and Kouttoolaw
    with his wife Escemingeyeu, survived and reached shore.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The survivors reached a lake, drank a little water, made themselves vomit
    repeatedly because they feared the urine they had drunk might make them sick,
    then drank fresh water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The survivors reached Aniriaksa'pik’s house, told him what had happened, and
    he gave Okoko a sledge and a dog to reach home.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The passage reports a belief that man has two souls: one stays with the body
    and may temporarily enter a child named after the departed, while the other goes
    to one of several lands of souls.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage lists afterlife destinations according to death circumstances,
    including three heavens, Sedna’s house, Omiktu, Kumetoon, Alipa'q, and Tukeychwen.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Alipa'q is described as closer to earth in spring, having seasons reversed
    from those on earth, because the earth turns over every fall and spring and winter
    is on the lower side.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Souls of the deceased stay with the body for three days; if a taboo is violated
    during this time, the transgression attaches to the soul, causes pain, and the
    soul roams the village seeking to harm the people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The harmed burdened soul is called a tupilak; it brings heavy snowfalls, sickness,
    and death, hovers near hut doors in mid-autumn, and may be seen by people called
    eoyew.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: When an angakok discovers a tupilak, the people assemble; the angakut search
    with knives, stab it, cut off the transgressions, and the tupilak becomes a soul
    again.
  category: action
  evidence_refs:
  - ev:7
