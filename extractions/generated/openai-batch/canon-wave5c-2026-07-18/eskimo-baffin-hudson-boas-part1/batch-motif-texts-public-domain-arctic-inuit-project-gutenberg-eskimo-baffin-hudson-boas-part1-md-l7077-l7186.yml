candidate_motifs:
- id: motif:1
  label: distressed persons transformed into birds
  taxonomy_refs:
  - shapeshifter
  basis: The passage explicitly says the paddling boy becomes a phalarope, the old
    woman becomes a loon, the frightened boy becomes a snow bunting, and the grandmother
    becomes a ptarmigan.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The taxonomy reference is used broadly for transformation; the passage
    does not describe voluntary shape-changing.
- id: motif:2
  label: small prey escapes predator by manipulating posture at a threshold
  taxonomy_refs:
  - trickster_boundary
  basis: The Lemming is blocked at her burrow entrance, gives the Owl instructions
    that open a path, and escapes between his legs into the hole.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents a successful ruse, but does not label the Lemming
    as a trickster.
- id: motif:3
  label: weaker-looking animal wins strength contest
  taxonomy_refs: []
  basis: The Bear emphasizes the Caribou's smaller arm, but the Bear's arm breaks
    in the contest.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family precisely matches this contest motif.
- id: motif:4
  label: etiology of bird coloration through decoration mishap
  taxonomy_refs: []
  basis: Soot makes the spots now seen on owl feathers, while spilled lamp-oil makes
    the Raven black all over.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The interpretation as an origin explanation follows from the passage's
    wording about present owl feathers and raven blackness, but no external taxonomy
    is invoked.
- id: motif:5
  label: hungry family discovers abundant food dwelling
  taxonomy_refs: []
  basis: The hungry Foxes find a dead whale, enter it, live on its meat, and are described
    as living in a house that was all meat.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a literal food-discovery episode; a broader motif family is not
    supplied by the passage.
