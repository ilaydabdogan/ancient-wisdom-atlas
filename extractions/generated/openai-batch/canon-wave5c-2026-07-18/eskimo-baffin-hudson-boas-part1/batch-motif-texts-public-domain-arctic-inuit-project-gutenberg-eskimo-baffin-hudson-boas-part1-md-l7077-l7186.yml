canonical_text:
  quote: ''
  summary: The passage contains the ending of an earlier transformation tale and numbered
    tales 36-40. It narrates a boy and old woman becoming birds; a Lemming woman escaping
    an Owl man by making him spread his legs away from her burrow entrance; a Bear
    losing an arm-strength contest to a Caribou; a boy frightened by his grandmother's
    story and transformed into a snow bunting while the grandmother becomes a ptarmigan;
    Owl and Raven old women exchanging decoration that explains owl spots and raven
    blackness; and hungry foxes finding a dead whale and living in its meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman repeatedly urges her grandson to paddle harder, saying she has
    no other boy; the boy's strength fails and he drifts away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The drifting boy becomes a phalarope; the old woman continues walking until
    her boot soles turn up, her clothing is bloody, and she becomes a loon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Owl man stands in front of a Lemming woman's burrow entrance, blocks it
    with his feet, and calls to his people to bring two sledges for the game he expects
    to kill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lemming woman tells the Owl to look up, spread his legs wider, and bend
    his head back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the Owl's legs are far apart and his head is bent back, the Lemming woman
    rushes between his legs into her hole; the Owl tells the sledge-bearers to return
    because the game has escaped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Bear asks a Caribou to test whose arm is stronger; they link arms, and the
    Bear comments that the Caribou's arm is much smaller.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the pulling contest, the Bear's arm breaks, and the Caribou leaves
    him in pain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A boy asks his grandmother for a story; after first refusing, she tells a
    strange story about a hairless lemming that wanted warmth under her arm and cried
    out.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy becomes frightened, runs away, and is transformed into a snow bunting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman searches for the boy, cries, rubs her eyes until they become
    red and raw, places a small skin bag near her neck, and becomes a ptarmigan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Raven takes soot from her lamp and makes the spots now seen on owl feathers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Owl makes whalebone boots for the Raven, but the Raven keeps hopping;
    after warning her, the Owl spills lamp-oil over her, and the Raven becomes black
    all over and flies away crying.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A family of Foxes is hungry; the old Fox searches for a seal-hole and follows
    a scent that is stronger when he raises his head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Foxes follow the scent to a dead whale in the ground-ice, go inside it,
    eat its meat, and live in a house made entirely of meat.
  category: sequence
  evidence_refs:
  - ev:10
