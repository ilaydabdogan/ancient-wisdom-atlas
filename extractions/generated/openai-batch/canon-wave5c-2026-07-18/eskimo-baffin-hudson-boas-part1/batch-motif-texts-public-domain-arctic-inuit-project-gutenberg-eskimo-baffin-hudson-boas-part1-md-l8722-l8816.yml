canonical_text:
  quote: ''
  summary: 'The passage contains several hunting and flight tales: two sisters flee
    a man who wants to marry one of them, survive by trapping caribou, build a stone
    house by the sea, and are later found by the husband; three brothers kill a pursuing
    agdlaq on slippery lake ice; and three brief bear-hunting episodes describe bears
    defeated by dogs, arrows, or lost on drifting ice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kiniksalao wants to marry Kingoodlee, his wife's sister, although both Kingoodlee
    and his wife Nouletoo oppose this.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two women consult their mother Nukatating, who advises them to stay, but
    they decide to escape and live alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sisters take sinew and caribou-antler needles when they leave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After failing to kill a caribou with a stone thrown from a mitten, the women
    make a long sinew string and use it across a caribou path to trip and kill many
    caribou.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sisters move to the sea, build a stone house, find a dead whale, carve
    its meat and blubber, and set a fox-trap near the window.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During winter the husband and a friend find the sisters' house, look through
    the window, and the husband enters and sits next to Kingoodlee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kingoodlee tells the husband that he has made a mistake and points him toward
    his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Three brothers hunting caribou near a large lake see an agdlaq pursuing them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The oldest brother chooses the frozen, slippery lake as the place to await
    the agdlaq.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The oldest brother fastens a knife to a long pole; the agdlaq runs against
    it and pushes him along the ice toward his brothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger brothers shoot arrows at the agdlaq, but the arrows barely pierce
    its skin; the oldest repeatedly thrusts the weapon until the animal dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The brothers divide the agdlaq carcass into three pieces, leave most of the
    flesh under snow, and bring one shoulder home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The father says neither bear nor agdlaq will kill his eldest son because he
