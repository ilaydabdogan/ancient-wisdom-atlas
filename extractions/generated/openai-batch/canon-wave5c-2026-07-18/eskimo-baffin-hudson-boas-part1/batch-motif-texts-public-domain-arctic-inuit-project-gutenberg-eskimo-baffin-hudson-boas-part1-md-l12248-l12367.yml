canonical_text:
  quote: ''
  summary: The passage is a comparative discussion of Eskimo tales, customs, and beliefs
    across Greenland, Cumberland Sound, Labrador, Alaska, and eastern Eskimo groups.
    It notes shared tales and names, summarizes elements of “The Faithless Wife,”
    lists analogous customs concerning naming, souls, birth, hunting charms, death
    taboos, games, and festivals, and identifies a small set of traditions common
    to Alaskan and eastern Eskimo, including “The Owl and the Lemming,” “The Sun and
    the Moon,” “The Dog who married the Woman,” and “The Mother of the Sea-Mammals.”
  language: English
  quote_policy: summarized
