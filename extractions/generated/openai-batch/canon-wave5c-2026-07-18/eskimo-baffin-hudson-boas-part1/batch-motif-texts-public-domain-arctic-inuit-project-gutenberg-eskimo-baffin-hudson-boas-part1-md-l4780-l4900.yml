candidate_motifs:
- id: motif:1
  label: Pregnancy and infancy taboos shaping the child's future
  taxonomy_refs: []
  basis: The passage states that a pregnant woman must act as she wants the child
    to act, and gives food, seclusion, and postpartum rules linked to child outcome
    and sickness-removal power.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an ethnographic custom description rather than a narrative episode.
- id: motif:2
  label: Imitative preparation for adult skill
  taxonomy_refs: []
  basis: The mother's repeated paddling, harpooning, and bow gestures, and the placement
    of fox intestine or caribou skin on babies, are explicitly linked to future hunting,
    walking, sewing, and cutting skills.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes practical ritual actions; broader symbolic classification
    should be reviewed.
- id: motif:3
  label: First-kill hunting initiation
  taxonomy_refs:
  - initiation
  basis: The first seal and first caribou kills require public ceremonies, distribution
    of animal parts, handling of bones or skin, and stated effects on the boy's later
    hunting success.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The text does not explicitly call the rite an initiation, but the first-kill
    structure and transition into future hunting support the motif assignment.
- id: motif:4
  label: Animal bones becoming future animals
  taxonomy_refs:
  - death_rebirth
  basis: After the boy's first seal, the bones are thrown into a seal-hole and are
    believed to become seals that he will catch later in life.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a regeneration belief about animal bones, not a full narrative
    of an individual dying and returning.
- id: motif:5
  label: Food and gift exchange with spirits for protection or hunting favor
  taxonomy_refs:
  - sacred_exchange
  basis: Food is left for a child's guardian spirit; first-caribou meat, beads, and
    skin are distributed to obtain Nuliayoq's favor; objects are placed at a grave
    with prayers.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage gives several exchange-like practices, but their theological
    relationship to each other is not explained.
- id: motif:6
  label: Lunar and winter observance for successful sealing
  taxonomy_refs:
  - seasonal_cycle
  basis: Boys repeat a practice at the appearance of the new moon throughout winter,
    and the practice is linked to future seal hunting and the man in the moon.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The cycle is seasonal and lunar, but the passage provides only a short
    custom description.
- id: motif:7
  label: Taboo gaze causing transformation or petrification
  taxonomy_refs:
  - shapeshifter
  basis: The passage says animals seen by widows may turn into stone or into other
    animals, and a whale seen by a widowed woman became stone.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The transformation is caused by a widow's sight rather than by a voluntary
    shapeshifting figure; taxonomy assignment is approximate.
- id: motif:8
  label: Burial with grave goods and prayerful circumambulation
