canonical_text:
  quote: ''
  summary: The passage describes customs and religious ideas concerning pregnancy,
    birth, infancy, children, first hunting kills, adolescent restrictions, burial,
    and widow-related animal transformations among people described for Cumberland
    Sound and the west coast of Hudson Bay. It includes food taboos, household seclusion,
    ritual feeding for a child's guardian spirit, imitative hunting gestures, new-moon
    sealing practices, first-seal and first-caribou ceremonies, grave goods, Nuliayoq,
    and traditions in which widows' sight transforms animals or turns a whale to stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant woman is instructed to behave as she wants the child to behave,
    and she and the mother of an infant must avoid specified animal foods; seals are
    therefore not killed outright but are allowed to breathe once before dispatch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Families expecting a birth live in a separate hut, though its porch may connect
    with a larger hut.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: For three months after childbirth, the mother remains in her house and abstains
    from sexual intercourse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For an infant boy, the mother keeps a kettle full of snow, melts it over a
    lamp, touches meat to the child's mouth, puts that meat into a bag to be thrown
    away when full, and leaves meat near the child at night for the child's guardian
    spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating, the mother pulls the child's limbs, seats the child, moves the
    child through paddling motions, uses her fork to represent harpooning a seal,
    and moves the child's hands as if drawing a bow and shooting an arrow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Fox intestine placed on a baby boy's feet is said to make him active and skillful
    on thin ice; caribou-skin strips around a baby girl's wrists are said to make
    her skillful in cutting and sewing skins.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the winter new moon, boys run out of the snow house, take snow, and put
    it in the kettle; parents say this pleases the watching man in the moon and will
    make seals come to diligent future hunters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a boy kills his first seal, his jacket and shirt are removed, the still-living
    seal is dragged across his back, the seal is cut up, the men each take a piece,
    the father takes the head, and the meat is cooked and eaten.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the first-seal meal, the boy's mother gathers all the bones and throws
    them into a seal-hole; the bones are believed to become seals the boy will catch
    later.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In one first-seal case, a grandfather instructed that caribou meat be cooked
    with seal meat to make the boy successful in caribou hunting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After a boy kills his first caribou, his mother distributes meat and beads,
    the boy gives the skin to an old man for clothing, and this is said to obtain
    Nuliayoq's favor for future hunting.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Boys are forbidden to play cat's-cradle because their fingers might later
    become entangled in a harpoon-line; adolescent girls are forbidden to eat eggs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Graves are generally made of stone, sometimes with the body wrapped in caribou
    skin; objects may be placed at the head end, visitors may walk around muttering
    prayers, and Nuliayoq is said to have taken the bones of one buried angakok.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Widows are said not to look around because animals dislike being looked at
    by widows; examples include animals turning to stone or into other animals, and
    a tradition says a whale seen by a widowed woman became stone.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
