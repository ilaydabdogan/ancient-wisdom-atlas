canonical_text:
  quote: ''
  summary: The passage contains the end of a Pupekalle episode, a tale of an abandoned
    old woman and grandson obtaining food from dwarfs through a quiet mouth-contact
    or spitting act, a parenthetical variant of that dwarf tale, and two Adlet encounter
    episodes in which human couples meet blind Adlet elders who identify humans by
    smell. In the first Adlet episode, Merkinook protects two visitors from hostile
    dog-like Adlet and later escorts them partway home.
  language: English
  quote_policy: summarized
