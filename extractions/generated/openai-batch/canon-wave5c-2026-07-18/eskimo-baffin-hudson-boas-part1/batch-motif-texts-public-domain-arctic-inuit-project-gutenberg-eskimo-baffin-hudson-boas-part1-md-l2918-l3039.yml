canonical_text:
  quote: ''
  summary: 'The passage describes games, toys, carvings, and ornaments: target games
    with stakes, gambling with a spinning dipper, a spinning ice top, wind-driven
    whalebone hoops, boys'' mock seal hunting, blind-man''s-buff, contests using seal-flipper
    bones, cup-and-ball implements, bone buzzes and dolls, and ivory or soapstone
    carvings including an ivory pendant representing a woman''s jacket.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that most games of the described tribes are similar to
    games of the Eskimo of Cumberland Sound.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In nugluktuq, a pierced ivory piece is suspended from the top of a snow house,
    steadied by a weighted line, and men try to hit the hole with pointed sticks while
    a knife serves as the stake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The winner of nugluktuq takes the knife, places another stake nearby, and
    is barred from further play; a simultaneous hit by two persons does not count.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women gamble with a musk-ox dipper turned swiftly around; the person away
    from whom the handle points wins and then places a stake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A top-shaped cake of ice called kipekutuk is spun by two men with sticks while
    one man sits on it; the game is often played at the floe edge while waiting for
    pack ice to come in with the tide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man described as the butt of the others may be induced to sit on the ice
    top and spun until sick.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Small whalebone hoops joined crosswise are placed on ice or hard snow in the
    wind, and young men run to catch them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Boys play hunting seals with small harpoons, pieces of seal-skin representing
    seals, and a seal hip-bone representing the blowing-hole in the ice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the boys' seal-hunting game, the boys blow like seals, try to catch seal-skin
    pieces through holes with little harpoons, and the boy who catches the last piece
    goes on with his seals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boys' fathers make the little harpoons, and their mothers prepare the
    pieces of skin.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the described blind-man's-buff game, a woman closes her eyes and gropes
    for another woman; when she catches one, she opens her eyes and strikes her on
    the head with the side of her fist.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Seal-flipper bones are used in a game where each bone represents an animal
    or an old or young person, and paired bones are dropped to decide which has thrown
    the other down in a fight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the seal-flipper bone game, the last winning bone is called the bear, and
    the losing player tests whether he is stronger than the bear by holding the bone
    to his forehead and dropping it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Children also use seal-flipper bones for playing house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Cup-and-ball is played with an implement with four holes in its short edge,
    caught on a wooden or bone pin, and also with the shoulder-bone of the seal.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Bone buzzes are spun with sinew string, and girls play with small bone dolls
    dressed in strips of caribou-skin or wool.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Aivilik and Kinipetu make many ivory and soapstone carvings.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: An ivory pendant used as an ornament on a woman's jacket is said to come from
    Victoria Land and to show the cut and decoration of a woman's jacket from that
    district.
  category: object
  evidence_refs:
  - ev:11
- id: obs:19
  text: The front design of the pendant represents the short front tail and white
    breast spots of the jacket, while the reverse represents the long flap and shoulder
    ornamentation.
  category: attribute
  evidence_refs:
  - ev:11
