  quote: ''
  summary: The passage records west-coast Hudson Bay beliefs about Nuliayoq, storm-making
    sisters, the Moon, afterlife destinations, rebirth of the dead, taboo violations,
    confession, famine, and ritual regulations concerning animals, seals, mourning,
    and offerings.
  language: English
