literal_observations:
- id: obs:1
  text: Nuliayoq is described as a deity who takes the place of Sedna among west-coast
    Hudson Bay people and is sometimes called Avilayoq.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nuliayoq is described as mistress of both sea animals and land animals and
    as withholding them when offended.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports a possibility of two deities with the same name, one controlling
    land animals and one controlling sea animals; it compares this with an Iglulik
    belief in Pukimna as protectress of land animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When taboo transgressions occur near Wager River, Nuliayoq is said to wait
    at the inlet entrance and upset boats and kayaks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Accidents, misfortunes, bad weather preventing aid to a starving family, and
    lightning strikes against offenders are attributed to Nuliayoq’s wrath.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Thunderstorms are attributed to three sisters: Kadlu makes thunder, Ignirtoq
    makes lightning, and an unnamed third sister makes rain.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women make storm offerings of white-tanned sealskin with a needle pushed into
    it and pieces of ivory, depositing them away from the village for the sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Earthquakes or subterranean noises are said to be sent by angry deities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Moon is thought to be male, to watch human actions, and to like industrious
    people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Souls of the dead go either to the lower world or to heaven; taboo transgressors
    go to the lower world, while the good and those who commit suicide go to heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The lower world is described as warm and as the abode of Nuliayoq and her
    father Anautalik, who makes taboo-transgressing souls unhappy.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: In heaven, souls play football with a living walrus skull, and the Northern
    Lights are identified as spirits above at play.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Souls of the dead are believed able to return and be born again if they choose.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A neglected reborn child’s death is said to have enraged the dead man whose
    return the child represented and to have prevented his daughter from bearing more
    children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Confession of taboo transgression is described as atoning for the offense
    and as common to west-coast Hudson Bay and Cumberland Sound Eskimo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: A famine in 1883 is attributed to a woman who concealed a miscarriage, continued
    eating seal meat, and refused to confess after an angakok discovered the transgression.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: In the famine account, Nuliayoq punished the whole tribe by withholding food
    and sending bad weather until the woman died, after which food became abundant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Recorded taboos include restrictions on work after killing a bear or ground
    seal, women combing hair, disturbing bedding, removing frost from a window, and
    moving camp before a seal is cooked.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: When a seal is brought into a snow house, melting snow is dripped into its
    mouth as a drink to please Nuliayoq, and snow is later stamped down where the
    seal was carved.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: Women who have lost a relative are restricted from working on fresh skins,
    cutting hair from most sealskins, and mentioning animal names.
  category: action
  evidence_refs:
  - ev:10
