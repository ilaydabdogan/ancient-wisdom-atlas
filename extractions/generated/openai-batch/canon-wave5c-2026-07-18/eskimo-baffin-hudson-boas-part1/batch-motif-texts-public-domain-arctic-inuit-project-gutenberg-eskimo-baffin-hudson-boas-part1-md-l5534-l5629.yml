canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a growing chrysalis kept in
    clothing attacks a man, is killed by dogs, and its keeper dies after learning
    this. It then gives the tale of Ititaujang: a hunter withholds a bathing bird-woman’s
    jacket until she agrees to marry him; after bearing a son, she and the child transform
    into geese and fly away. Ititaujang follows them toward the land of birds, passes
    unavoidable obstacles, meets Ixalu''qdjung by a brook, and receives a wood-kayak
    for a dangerous river crossing under an instruction not to open his eyes.'
  language: English
  quote_policy: summarized
