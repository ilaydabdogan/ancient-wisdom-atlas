candidate_motifs:
- id: motif:1
  label: dangerous nonhuman fosterling in the household
  taxonomy_refs: []
  basis: A chrysalis is kept and fed in clothing, grows, attacks the husband by sucking
    blood, and is killed by dogs; the woman who kept it dies after learning of its
    death.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The supplied passage begins mid-story, so the chrysalis’s origin and the
    woman’s reason for raising it are not present here.
- id: motif:2
  label: bird-woman captured through withheld garment
  taxonomy_refs:
  - shapeshifter
  - stolen_beloved
  basis: Ititaujang takes the bathing women’s clothing; three women regain clothing
    and become geese, while the last woman’s jacket is withheld until she agrees to
    marry him.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not name a broader tale type; the label is based only
    on the garment, transformation, and coerced marriage pattern in the passage.
- id: motif:3
  label: return to bird form using feathers
  taxonomy_refs:
  - shapeshifter
  basis: The goose woman places feathers between her own fingers and her son’s fingers,
    and both immediately transform into geese and fly away.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The mechanism is described literally, but the passage does not explain
    why the whale blood prompts departure.
- id: motif:4
  label: quest after vanished wife and child to a distant nonhuman land
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: After his wife and child fly away as geese, Ititaujang leaves the whale and
    follows them to the land of the birds beyond the horizon.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage segment ends before the quest is resolved, so return or recovery
    cannot be inferred.
- id: motif:5
  label: unavoidable threshold obstacles on a journey
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: Ititaujang cannot go around a sequence of obstacles and must pass between,
    over, or across them during his pursuit.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly identify these obstacles as tests or initiation;
    that function is inferred from their sequence on the path.
- id: motif:6
  label: taboo against opening eyes during magical crossing
  taxonomy_refs:
  - forbidden_knowledge
  basis: Ixalu'qdjung tells Ititaujang to keep his eyes shut in the wood-kayak until
    reaching the far shore; when he opens them, the kayak disappears, and it returns
    when he closes them.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The taboo concerns sight during travel rather than knowledge in a general
    sense; taxonomy alignment should be reviewed.
- id: motif:7
  label: dangerous helper with hidden bodily lack
  taxonomy_refs: []
  basis: Ixalu'qdjung can be seen through, is said to have no intestines, and says
