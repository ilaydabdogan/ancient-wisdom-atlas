canonical_text:
  quote: ''
  summary: The passage presents several Cumberland Sound tale episodes about angakok
    power. Eterseoot, a female angakok, is attacked by Kowertse but becomes whole
    again while Kowertse later sickens and dies. A great angakok restores a dead man
    by incantation and blowing on his face. The same great angakok initiates an aspirant
    through death, three nights under stones, and revival by repeated blowing around
    the body, and is also said to cure people by replacing diseased parts with rabbit
    parts. The range ends with a heading for the next tale, about an old woman who
    transformed herself into a man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eterseoot is described as a female angakok living at Isortuqdjuaq in Kingawa
    and having two husbands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eterseoot does not sew her clothing; she cleans and cuts skins, places them
    under her bed, and later finds the clothing finished when needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kowertse, a man who has lost his wife, believes Eterseoot caused the death,
    although the passage states that she had not wished the wife dead.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Eterseoot tells Kowertse that she knows why he has come; Kowertse says he
    intends to kill her and stabs and cuts her with a knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After being carried into her hut and saying she cannot recover, Eterseoot
    rises, walks to her usual seat, and is hale and whole with no scar or wound visible.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The next day Kowertse is sick; Eterseoot says he cut her but she is alive
    and whole, while he is sick despite not being cut or scratched, and he soon dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great angakok and three other men with their wives leave the sea in spring
    to hunt caribou; one man becomes sick and dies, and in fall the returning hunters
    find a new grave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The great angakok asks whether he should restore the dead man to life, begins
    incantations, blows on the dead man’s face, and the dead man breathes, rises,
    and later lives to be very old.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man asks the great angakok to initiate him as an angakok, and the great
    angakok says the man must die first.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The initiate dies, is covered with stones, is left on the ground for three
    nights, and is brought back frozen hard.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The great angakok moves around the body, keeps it at his right side, and blows
    into or onto the collar, sleeve, trouser legs, feet, and face until the body is
    alive again and the man becomes an angakok.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The same great angakok is said to cure people by taking out diseased body
    parts and substituting the corresponding parts from a rabbit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage range ends with a tale heading naming an old woman who transformed
    herself into a man.
  category: other
  evidence_refs:
  - ev:8
