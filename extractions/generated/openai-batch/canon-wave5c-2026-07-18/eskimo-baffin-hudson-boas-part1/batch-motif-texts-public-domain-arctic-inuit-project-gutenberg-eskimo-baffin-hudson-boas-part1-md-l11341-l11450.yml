canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a dog becomes a man, marries
    a woman, fathers pups, is drowned by the woman’s father, and is avenged by his
    offspring; some offspring are sent away in shoes that become boats and become
    ancestors of Indians and Europeans, while the woman becomes Nuliayoq and lives
    under the sea with her father and dog. A second tale introduces Armuckjuark, a
    very strong whaler whose strength is linked to a postnatal rite; he drowns his
    uncle, kills his half-brother after a false accusation by his wife Eccootlikechark,
    and then kills that wife after learning she lied.
  language: English
  quote_policy: summarized
