  quote: ''
  summary: The passage introduces Southampton Island as relatively inaccessible and
    little contacted, then quotes Captain G. F. Lyon’s 1824 visit. Lyon describes
    seven natives at the shore, one man approaching on a buoyant float made of inflated
    seal-skins and intestines, exchanges of beads, needles, salmon, an arrow, and
    knives, observations of language difference, storehouses, tents, and the conduct
    of Nee-a-kood-loo and his countrymen during the encounter.
  language: English
  quote_policy: summarized
