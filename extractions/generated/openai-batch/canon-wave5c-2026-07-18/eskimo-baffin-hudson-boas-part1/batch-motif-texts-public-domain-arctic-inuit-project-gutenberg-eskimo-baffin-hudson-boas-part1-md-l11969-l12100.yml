canonical_text:
  quote: ''
  summary: The passage compares regional implements and materials, then discusses
    the angiaq or angiyang as a premature-child spirit or bird-like illness agent
    connected with secrecy, transgression, confession, soul attachment, shamanic diagnosis,
    and sea-mammal food withholding. It closes by stating that Central Eskimo and
    Greenlandic ideas are more alike than previously thought and by listing traditions
    common to several Eskimo regions.
  language: English with Inuit/Greenlandic terms
  quote_policy: summarized
