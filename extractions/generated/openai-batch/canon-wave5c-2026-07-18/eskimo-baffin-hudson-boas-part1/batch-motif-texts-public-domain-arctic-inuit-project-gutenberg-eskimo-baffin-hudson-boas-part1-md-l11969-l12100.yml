- id: obs:2
  text: West coast Hudson Bay implements differ from Baffin Land because musk-ox horns
    are used for spoons, ladles, and bows; a gambling game is played there with a
    musk-ox horn ladle, while Cumberland Sound has a roulette-like form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kinipetu stone skin-scrapers are described as curiously shaped and as resembling
    or imitating northern bone-handled scrapers.
  category: object
  evidence_refs:
