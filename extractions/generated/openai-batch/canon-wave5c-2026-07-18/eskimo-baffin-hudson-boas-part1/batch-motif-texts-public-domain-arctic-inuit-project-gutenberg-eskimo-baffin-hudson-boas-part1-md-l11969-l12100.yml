  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Kakamak account, Kakamak had an angiaq that killed its brothers soon
    after birth; after conjuration, an angakok reported that Kakamak’s sister-in-law
    reproached her for a crime and for having an angiaq that killed the children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that abortions or agdlerutit infest the hair of the deity
    of the sea-mammals and induce her to withhold the food supply; it connects this
    with the idea of soul attachments produced by transgression, especially unconfessed
    secret abortion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kroeber’s Smith Sound report describes the angiyang as a bird visible only
    to the angakoq; it causes pain by pricking with its bill, may be killed by the
    angakoq to restore the sick person, dies after the person dies, and informs the
    angakoq about disobedience or refusal to tell the truth.
  category: attribute
  evidence_refs:
  - ev:4
