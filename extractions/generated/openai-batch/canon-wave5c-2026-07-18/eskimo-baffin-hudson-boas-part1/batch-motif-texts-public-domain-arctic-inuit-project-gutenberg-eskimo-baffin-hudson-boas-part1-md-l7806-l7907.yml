canonical_text:
  quote: ''
  summary: 'The passage contains several short narrative episodes: a party finds a
    black spirit dead on the ice with a mitten fixed under its chin and later finds
    women dead in a house; an old woman and child experience a house opening, dim
    lamps, and a large black being outside; another old woman and grandson encounter
    a red, noisy presence that affects the window and lamp; Akoto meets named beings
    associated with breath and wind who instruct him to give their names to his sick
    daughter, after which she recovers; and a following tale begins with Kating/Rating
    being warned that others intend to kill him.'
  language: English
  quote_policy: summarized
