canonical_text:
  quote: ''
  summary: A blind stepboy and his sister live with a stepmother who withholds meat
    after the boy kills a bear. The sister secretly feeds him. Birds at a lake carry
    the boy under water repeatedly and restore his sight. He later causes the stepmother
    to be dragged under water by a white whale, where she becomes a narwhal. The siblings
    travel, encounter hostile long-fingernail people who injure the sister, and then
    meet the kind Ikingan, whose food habits and anatomy are described as unusual.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A woman living north of Padli has two stepchildren: a blind boy and a girl.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bear looks into the house; the woman aims a bow and arrow for the blind
    boy, and the boy shoots and kills the bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stepmother tells the boy his arrow only struck the window, skins the bear,
    tells the girl not to tell him, and keeps him starving despite having meat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl hides pieces of meat while eating and gives them to her brother when
    her mother is absent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy asks his sister about a nearby lake and birds, has her lead him there,
    and asks her to leave him alone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One of the birds tells the boy to sit on its kayak, carries him to the middle
    of the lake, dives with him repeatedly, and asks after each dive whether he can
    see.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the repeated dives, the boy has very keen eyesight.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boy sees a bear-skin drying outside his mother's tent, and she says she
    obtained it from passing people in a boat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy prepares hunting equipment, takes the woman to hunt white whales,
    has her fasten the line around her waist, harpoons a large white whale, and gradually
    pushes her to the floe-edge so that the whale pulls her under water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman rises, pleads with her stepson, twists her hair into the form of
    a horn, is transformed into a narwhal, and swims away with the white whale.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy and his sister travel for a long time, reach a snow house, and the
    sister enters it to ask for water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The snow-house people have very long fingernails; after telling the girl to
    remove her clothing and take water from a bucket, they scratch her until her skin
    is torn.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The brother hears his sister cry, kills the long-fingernail people with his
    knife, wraps her in rabbit-skins until her wounds heal, and carries her inside
    his jacket while travelling.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The siblings meet the Ikingan, who are kind to them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Ikingan call caribou-fat lying outside dirt, offer food inside the hut,
    do not eat meat, chew and spit out fat, and are described as having no anuses.
  category: attribute
  evidence_refs:
  - ev:8
