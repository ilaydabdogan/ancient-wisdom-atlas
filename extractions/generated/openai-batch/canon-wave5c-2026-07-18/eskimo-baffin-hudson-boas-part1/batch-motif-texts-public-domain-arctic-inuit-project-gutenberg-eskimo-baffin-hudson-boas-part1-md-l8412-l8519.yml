canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which an old woman accuses Pupewalow
    of killing her son, threatens that her soul will enter a bear, and after death
    a bear kills Pupewalow; the bear is killed and then prevented from rising again.
    It then gives tale 58, in which a mistreated old woman makes frightening bone
    faces or skulls to compel better treatment and later sends a larger head after
    departing people, who die. It begins tale 59, in which an orphan boy remarks that
    whale-skin is soft and is therefore forced by an angry house owner to serve as
    harpooneer.
  language: English
  quote_policy: summarized
