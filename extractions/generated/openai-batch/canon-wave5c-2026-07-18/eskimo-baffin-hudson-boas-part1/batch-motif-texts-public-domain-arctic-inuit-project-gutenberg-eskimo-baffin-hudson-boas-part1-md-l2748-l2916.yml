literal_observations:
- id: obs:1
  text: The collection includes a Netchillik kettle from Boothia Felix, seal-skin
    buckets and cups, wooden dishes sometimes edged with ivory, and musk-ox-horn spoons
    and ladles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before entering a snow house, the Eskimo remove snow and frost from clothing
    with a wooden snow-beater, and winter clothing is stored outside rather than brought
    into the hut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small bone implements with a suspension hole are said to be used for extracting
    marrow from bones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When blubber is scarce, the Aivilik and Kinipetu burn turf and moss, which
    is dug with a bone spade.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Aivilik and Kinipetu clothing is described as differing from that of the
    Eskimo of Cumberland Sound; caribou-skin is worn in summer and winter, and sealskin
    clothing is said not to be worn.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kinipetu are said to have obtained European-manufactured cloth for a considerable
    period and to use colored cloth strips, especially black and red, to ornament
    fur jackets.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men’s jackets reach the middle of the thighs; the Kinipetu man’s jacket may
    have a very long tail reaching the ground and no side slits.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Men wear outer shoes made entirely of caribou-leg skin over their stockings.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Women’s dress includes a jacket, short breeches, long stockings, and shoes;
    the jacket has a hood and loops for a thong used to support a child carried in
    the hood.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Women’s stockings bulge greatly below the knee; worn foot parts are replaced,
    and seal-skin slippers are worn over the stockings.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Women’s hair is worn either in two knots over the ears or wound around two
    sticks and wrapped; a brass ornament is worn over the forehead.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: In winter travel over ice and dry snow, slippers with hair-on caribou-skin
    soles are worn and may be sewn with sinew spirals and zigzags for firmer footing.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: A pair of shoes said to come from Victoria Land is made of hairless seal-skin
    and elaborately creased in front.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Ivory combs are much used by tribes on the west coast of Hudson Bay; modern
    combs often have etched designs or elaborate decoration.
  category: object
  evidence_refs:
  - ev:14
- id: obs:15
  text: Among these tribes, women tattoo their faces and arms, with designs showing
    slight variations among different tribes.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: Snow-goggles are used in spring and show considerable variety of form.
  category: object
  evidence_refs:
  - ev:16
- id: obs:17
  text: The pipes of these tribes are made of soapstone and are described as showing
    strong Indian influence and resembling pipes of neighboring Indian tribes.
  category: object
  evidence_refs:
  - ev:17
