  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fox addresses Neqingoaq as its son, asks him to remove a flat stone, and
    Neqingoaq releases it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Peqaq leaves home weeping because her husband is angry with her, and she walks
    away on the ice.
  category: action
  evidence_refs:
  - ev:3
