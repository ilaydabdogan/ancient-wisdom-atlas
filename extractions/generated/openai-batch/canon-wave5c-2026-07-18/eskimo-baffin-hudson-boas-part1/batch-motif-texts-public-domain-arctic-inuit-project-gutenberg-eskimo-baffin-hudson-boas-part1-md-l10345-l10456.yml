candidate_motifs:
- id: motif:1
  label: Animal intruder killed while feeding from a carcass wound
  taxonomy_refs: []
  basis: The raven places its head inside the bear wound to eat blood and is killed
    there by the hunter.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents this as a very short tale; no broader comparative
    taxonomy is explicit.
- id: motif:2
  label: Trapped speaking animal persuades a human to release it
  taxonomy_refs:
  - trickster_boundary
  basis: The trapped fox sings to Neqingoaq, addresses him as son, requests help with
    the obstruction, and is freed.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The fox's speech and release are explicit, but deceit or trickster intent
    is not directly stated.
- id: motif:3
  label: Pursued woman changes into a raven and later resumes woman shape
  taxonomy_refs:
  - shapeshifter
  basis: Peqaq wishes to become a raven while fleeing her husband, becomes one, escapes,
    and later returns to woman shape near another man.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The transformation is explicit; the passage does not explain its cause
    beyond her spoken wish.
- id: motif:4
  label: Boy drives away an unwelcome visitor with a cannibal warning
  taxonomy_refs:
  - trickster_boundary
  basis: The boy's warning that cannibals are upon Kalluapik makes Kalluapik flee
    into the water; the editor note describes this as the boy's artful plan to get
    rid of an unwelcome visitor.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The editor note supports an artful-plan reading, but the tale itself is
    brief and does not explicitly call the boy a trickster.
- id: motif:5
