  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The giant is also said to catch whales by straddling a fiord and fishing as
    one would catch sculpins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: An orphan boy living with an old woman usually catches only gulls, leaving
    them little to eat, but one day catches a whale instead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The orphan fastens the whale with whalebone, tells of his catch, is mocked
