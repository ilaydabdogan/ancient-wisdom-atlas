canonical_text:
  quote: ''
  summary: 'The passage contains several short tales: a raven killed while trying
    to feed from a bear wound; a trapped fox singing to Neqingoaq and being released;
    Peqaq becoming a raven and later resuming woman shape; Kalluapik being frightened
    away by a boy''s warning about cannibals; a giant capturing boaters and whales;
    an orphan boy catching a whale; and Podluksak''s wife theft, pursuit, and revenge
    killings.'
  language: English
  quote_policy: summarized
literal_observations:
