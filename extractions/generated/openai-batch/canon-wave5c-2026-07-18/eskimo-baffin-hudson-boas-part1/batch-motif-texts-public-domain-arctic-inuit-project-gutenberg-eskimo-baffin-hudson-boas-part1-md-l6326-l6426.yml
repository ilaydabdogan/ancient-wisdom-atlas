canonical_text:
  quote: ''
  summary: 'A woman with a newborn son receives caribou meat and lamp oil attributed
    to the Man in the Moon, but after she eats her husband''s seal meat the gifts
    cease and she and the child die. The passage then gives stories about dwarfs:
    a small stranger kills a distant dog with a thrown knife, and Pupekalle later
    avenges his son''s death by killing inhabitants of dwarf huts while sparing two
    women who say they are not dwarfs.'
  language: English
  quote_policy: summarized
