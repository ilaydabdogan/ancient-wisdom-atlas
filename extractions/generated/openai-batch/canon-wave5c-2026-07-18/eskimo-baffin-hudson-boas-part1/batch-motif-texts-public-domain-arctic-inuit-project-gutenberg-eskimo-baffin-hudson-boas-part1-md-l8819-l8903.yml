canonical_text:
  quote: ''
  summary: 'A sequence of tales recounts encounters with bears: Kulwa kills a bear
    on a steep hill with help from his dog; Oonoko and Weba respond to a bear at a
    stone hut; Outerertalow kills bears despite paralysis on one side; an old woman
    kills an attacking bear with a staff and mitten; and Neneala is killed by a bear
    on a small island while her sons escape by boat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In winter, while hunters were sealing, a bear ran ashore and climbed a steep
    hill to a cliff-protected position where dogs could fall and roll down the slope.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kulwa said he would try to kill the bear despite warnings; he said bears did
    not bite him, followed the tracks, called his dog Akko, and killed the turned
    bear with arrows.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other hunters shared the bear meat and praised Kulwa; he described an earlier
    method of approaching bears with a knife while raising his left hand before his
    face.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A bear came into the entrance of Oonoko's large-stone hut at Qamaqdjuin while
    dogs barked and people were frightened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Oonoko passed meat and blubber through the door to the bear, but the bear
    still tried to enter; Oonoko struck its nose with a walrus penis-bone, and Weba
    shot it with arrows until it died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men put a tope around the dead bear's body, pulled it out of the porch, and
    skinned it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Outerertalow lived at Keemesoo with his wife Keewapek; although paralyzed
    on one side, he hunted bears alone with a sealing-harpoon, staff, and ivory knife.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: When a bear came up to men who were sealing, the men were afraid, but Outerertalow
    approached, jumped aside when the bear tried to catch him, and killed it with
    harpoon and lance throws.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After killing the bear, Outerertalow said he was not afraid of a bear when
    his harpoon was fastened in its body because he could jump aside as it came toward
    him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: An old woman walking ahead of people moving camp at Padli carried a staff
    and killed an attacking bear by putting a rabbit-skin mitten on the staff and
    pushing it into the bear's mouth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: On a small island, men went by boat to hunt walrus and left Neneala with her
    sons Punyeyloo and Kuminik.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Neneala saw something moving, thought it was a rabbit, and told the boys to
    look; it was a bear, and the boys fled toward the expected boat landing while
    Neneala ran uphill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The bear first pursued the boys and then Neneala, tore her breasts, and devoured
    her; people in the boat failed to frighten it away, the boys entered the boat,
    Koolek was dissuaded from landing to kill the bear, and the group left the place
    and did not return.
  category: sequence
  evidence_refs:
  - ev:6
