candidate_motifs:
- id: motif:1
  label: People transformed into predatory birds
  taxonomy_refs:
  - shapeshifter
  basis: The Hawks are described as a race of people who finally turn into birds of
    prey.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the transformation but gives no details of how or why
    it occurs.
- id: motif:2
  label: Peaceful intent shown by tolerating an offense
  taxonomy_refs: []
  basis: The angakok blackens a visitor's new white jacket, and the visitors' lack
    of offense is treated by the Tornit as proof that they intend no evil.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call the act a test; that function is
    inferred from the stated interpretation by the Tornit.
- id: motif:3
  label: Hospitality protects strangers from predatory outsiders
  taxonomy_refs: []
  basis: After accepting the visitors, the Tornit invite them into huts so they will
    be saved from the Hawks, who would have devoured them outside.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No ritual or sacred dimension is stated.
- id: motif:4
  label: Superhuman hunter and disputed game ownership
  taxonomy_refs: []
  basis: The Tornit son catches and kills a bear with extraordinary force, while the
    father objects that he is stealing it from the people; a note explains different
    Tornit and Eskimo ownership rules.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames the dispute as customary difference, not as a sacred
    theft motif.
- id: motif:5
  label: Flight from avengers ended by hostile weather
  taxonomy_refs: []
  basis: After the man kills Adlet children, Adlet adults pursue him, but a gale and
    drifting snow cause them to abandon the chase and some freeze.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not attribute the weather to a supernatural agent.
- id: motif:6
  label: Separated spouses reunite after danger
  taxonomy_refs: []
  basis: During the Adlet pursuit the wife runs in the opposite direction, later turns
    back, and meets her husband again on the third day.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The reunion is brief and not marked as ceremonial.
- id: motif:7
  label: Ambiguous dwellings of nonhuman and human peoples during travel
  taxonomy_refs: []
  basis: The traveler first investigates dwellings occupied by Adlet, then later approaches
    other dwellings and says he was unsure whether their inhabitants were men or Adlet
    before they are identified as real men.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The motif label is descriptive; no broader taxonomy is assigned.
- id: motif:8
  label: Strong other-than-human host storing food against a deadly season
  taxonomy_refs:
  - seasonal_cycle
  basis: The tuneq's strength is shown by hauling a whole walrus; he stores walrus
    meat for summer and warns that summer heat and mosquitoes would kill the traveler
    outside.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The seasonal element is explicit, but the passage does not describe a
    full cosmic or ritual seasonal cycle.
