  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A note contrasts Tornit and Eskimo rules for assigning ownership of game.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: A traveling man looks into Adlet dwellings, sees children playing, takes a
