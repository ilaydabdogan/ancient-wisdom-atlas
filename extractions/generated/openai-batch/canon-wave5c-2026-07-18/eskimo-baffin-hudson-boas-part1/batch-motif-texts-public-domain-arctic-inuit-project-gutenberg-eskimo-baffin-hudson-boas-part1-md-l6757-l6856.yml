canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound tale episodes: Tornit live
    near predatory Hawks who become birds of prey; a Tornit angakok blackens an Eskimo
    visitor''s new jacket, and the visitors'' calm response leads to hospitality and
    protection; a Tornit father and son pursue a bear near Eskimo sealers, and the
    son''s killing of the bear raises a difference between Tornit and Eskimo game-ownership
    customs; a traveling man kills Adlet children and escapes pursuit with his wife;
    the couple later meet real men and then a strong tuneq host who stores walrus
    meat and warns them against summer heat and mosquitoes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A number of Tornit live in Saumia near another people called Ketch-wey-ews
    or Ken-wey-ews, identified as Hawks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hawks are described as having long nails, being wicked and murderous,
    and eventually turning into birds of prey.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A great Tornit angakok blackens his hands on the bottom of a cooking pot before
    meeting four Eskimo returning from a caribou hunt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The angakok admires one visitor's new white young-seal-skin jacket and rubs
    his blackened hands over it until its front and back are darkened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors do not take offense at the blackening, and the Tornit regard
    this as proof that the visitors intend no evil.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitors are invited into the huts so that the Hawks will not devour them
    outside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eskimo sealing in Ugjuktung see a large bear approaching and then see two
    Tornit, father and son, pursuing it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tornit son catches the bear by its hind legs, carries it away, and kills
    it by striking it against rough ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tornit father says the son is stealing the bear from the people, while
