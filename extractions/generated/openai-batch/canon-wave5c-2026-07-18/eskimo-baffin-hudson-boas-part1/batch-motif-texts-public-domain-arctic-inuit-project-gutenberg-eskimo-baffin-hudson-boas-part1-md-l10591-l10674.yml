    boulder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Moon Man says he will send three bears the next day and advises the boy
    what to do.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the three huge bears arrive, the men are frightened and resolve to have
    the bears eat Qaudjaqdjuq.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Qaudjaqdjuq sings about having slept with dogs as his blanket and about people
