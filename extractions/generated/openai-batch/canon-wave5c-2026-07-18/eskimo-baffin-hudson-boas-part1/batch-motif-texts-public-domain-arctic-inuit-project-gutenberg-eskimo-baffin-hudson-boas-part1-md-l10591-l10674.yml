canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a man kills a Bear, flees
    a woman who transforms into a pursuing bear, creates mountain and river barriers
    by spells, and tricks the pursuer into drinking water until she bursts and fog
    rises. A short note says that children were formerly found on the ground rather
    than borne by women. The Qaudjaqdjuq abstract describes a boy carried away on
    broken ice, mistreated after landing at a distant shore, helped by girls and by
    the Man in the Moon, strengthened through repeated throwing, and then using three
    bears to destroy men who abused him while sparing and marrying two kind women.
    The excerpt ends with the opening of another tale about children disappearing
    from a village.
  language: English
  quote_policy: summarized
