canonical_text:
  quote: ''
  summary: 'The passage recounts multiple Cumberland Sound traditions or remembered
    incidents: Rating returns from Niutang with whale products for his starving family
    and later hunts seal, ptarmigan, caribou, and spring seals; a Netchillik boat
    expedition ignores Piaraq''s warning about taking walrus-hide on a caribou hunt
    and suffers starvation, leaving only Okowsecheak and his wife alive; a whaling
    accident near Niutang nearly drowns one crew before another crew rescues them;
    Etwallou leads hungry people across new ice to walrus-meat caches and instructs
    equal division; and three men drown after breaking through thin lake ice, followed
    by rescue and body-retrieval attempts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rating reaches Niutang, where people had caught two whales, and tells them
    that people in Isortuqdjuaq are starving.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People at Niutang give Rating a whalebone toboggan, an old dog, and whale-meat,
    whale-skin, and blubber; they advise him to stay, but he says he thinks his mother
    is alive and departs for Kingawa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rating asks at his mother's hut whether they are all dead; his mother replies
    that life remains, and Rating gives them whale-meat and whale-skin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rating finds a seal-hole, waits before returning to it, harpoons a seal, cuts
    it up, and brings meat home; his brothers and sisters cook the meat over a fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rating's mother asks for ptarmigan and later caribou-meat; Rating kills both,
    and by spring he is able to kill enough basking seals that the family is no longer
    in need.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two boats travel from Netchillik down Koukdjuaq and along Fox Channel; Piaraq
    warns that taking walrus-hide on a caribou hunt will cause starvation, but the
    people do not follow his advice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: One boat returns for want of food after finding only a few caribou; the other
    crew is later found starving, with all dead except Okowsecheak and his wife, who
    survive by eating bodies of the dead.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: During whaling near Niutang, a whale rises under a boat and upsets it; the
    crew are thrown into the water and nearly drown, but another boat's crew rescues
    them and they recover after expelling salt water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the whale is lost, bad autumn weather prevents the people from catching
    whales, and one or two caribou are not enough for their needs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Etwallou leads people across new ice to walrus-meat caches on Midliaqjuin
    and repeatedly tells them to remove all the meat and divide it into equal parts.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The hungry people begin eating while removing stones from the cache; after
    eating enough, they divide the remainder, sleep, and carry the meat home in a
    skin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Ichagatto near Sikosuilaq, three named men break through thin lake ice
    while going to caribou-hunting grounds; ropes thrown by Pudawallow and Mikiejew
    are too short, and the men drown in cold water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mikiejew calls his mother; when she sees the bodies she thinks they are rocks,
    tries to pull them out, breaks through the ice herself, and is rescued with difficulty
    by Pudawallow.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Keyooksaak and his wife Ooagejalaw hear what happened, use a pole to sound
    the ice, and use a long stick to draw the bodies back.
  category: action
  evidence_refs:
  - ev:11
