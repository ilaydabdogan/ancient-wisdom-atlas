candidate_motifs:
- id: motif:1
  label: return with provisions to starving kin
  taxonomy_refs:
  - return
  basis: Rating receives supplies in Niutang, returns despite being urged to stay,
    finds his mother and family alive, and gives them whale products.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The available taxonomy term 'return' is broad; the passage frames the
    event as a practical famine-return episode rather than a formal quest-return cycle.
- id: motif:2
  label: hunting sequence that restores a hungry household
  taxonomy_refs:
  - seasonal_cycle
  basis: Rating's repeated successful hunts for seal, ptarmigan, and caribou improve
    his family's condition, and spring brings basking seals sufficient to end need.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The seasonal element is literal spring seal availability; no ritual or
    cosmic seasonal cycle is stated.
- id: motif:3
  label: ignored subsistence warning followed by starvation
  taxonomy_refs: []
  basis: Piaraq warns against taking walrus-hide on a caribou hunt, but the people
    ignore him and later suffer food shortage and starvation.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explain why walrus-hide causes or predicts starvation,
    so interpretation should remain limited to the stated warning and outcome.
- id: motif:4
  label: surviving pair after group starvation
  taxonomy_refs:
  - survivor_pair
  basis: All members of a starving boat crew are dead except Okowsecheak and his wife,
    who are the only survivors.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: Although a paired survival is explicit, it is not presented as a world-renewal
    or origin survivor-pair narrative.
- id: motif:5
  label: water and ice peril with rescue or failed rescue
  taxonomy_refs: []
  basis: A whale overturns a boat and another crew rescues the men from salt water;
    later, three men break through thin ice and drown despite rope rescue attempts.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: This groups two adjacent incidents with similar hazards; the passage itself
    does not state that they are variants of one motif.
- id: motif:6
  label: cached food and commanded equal division under hunger
  taxonomy_refs: []
  basis: Etwallou tells hungry people to remove cached walrus meat and divide it equally,
    but they begin eating immediately and only later divide the remainder.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No moral judgment beyond the stated hunger and instructions is explicitly
    supplied.
