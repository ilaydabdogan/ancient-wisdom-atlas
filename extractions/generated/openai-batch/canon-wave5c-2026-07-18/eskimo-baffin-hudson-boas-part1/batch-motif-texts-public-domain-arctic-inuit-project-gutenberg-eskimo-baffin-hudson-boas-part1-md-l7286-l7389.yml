canonical_text:
  quote: ''
  summary: The passage recounts the end of a tale in which a man encounters a woman
    associated with his wife's grave and a fox-skin, marries her, loses her after
    Raven breaks a promise not to mention her smell, and follows her into a fox hole
    that appears as a dwelling. It then begins 'The Insects,' where an abandoned mother
    and daughter gather insects for food, the mother is rejuvenated when an ermine
    bites off her old skin at the insects' request, and the women choose to live and
    marry among the insects.
  language: English
  quote_policy: summarized
