canonical_text:
  quote: ''
  summary: The passage closes a tale in which Karnapik and his wife boil and eat human
    flesh until the village is destroyed, then tell visiting strangers that they have
    become supernatural beings. It then gives a tale about Orriotto, who drinks too
    much water and is temporarily incapacitated, and a tale about Akpukatoo, whose
    constant hunger leads villagers to fear cannibalism; after she is sealed in her
    house, she is found dead after eating her children.
