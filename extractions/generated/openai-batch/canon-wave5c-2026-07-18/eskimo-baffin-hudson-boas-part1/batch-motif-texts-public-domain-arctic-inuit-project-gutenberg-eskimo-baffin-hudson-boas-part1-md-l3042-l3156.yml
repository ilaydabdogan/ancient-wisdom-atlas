  claim: The author explicitly states that reports of Netchillik quarrels and family
    conflicts closely agree with customs and ideas important in traditions collected
    in Greenland.
  claim_level: same_function
  target: customs and ideas in traditions collected in Greenland
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not name the Greenland traditions or identify a specific
