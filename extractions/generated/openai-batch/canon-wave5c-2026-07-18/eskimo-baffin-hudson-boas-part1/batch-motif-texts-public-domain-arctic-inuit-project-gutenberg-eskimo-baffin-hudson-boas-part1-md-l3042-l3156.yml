canonical_text:
  quote: ''
  summary: Ethnographic notes on west Hudson Bay social organization describe Aivilik
    leadership, marriage and residence customs, adoption, walrus-hunt sharing, etiquette
    after accidental damage, ritual contests at meetings with strangers, older knife
    contests, reports of Netchillik family conflict, name relinquishment when two
    people share a name, killing of burdensome dependents, suicide or hanging of the
    sick and infirm, and abandonment of dependents during food scarcity. The passage
    includes beliefs about a guardian spirit connected with a blessed future hunter
    and about the offended spirit Nuliayoq causing lameness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents Coo-nic Char-ley, his son Albert, and Albert's nephew
    Tesiaq/Harry as successive leaders, with Harry succeeding because of ability.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harry was ceremonially blessed at birth by his grandfather so that he might
    become a great hunter and whaleman, and a guardian spirit was expected to punish
    careless work on his skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Polygamy is described as customary; polyandry is attributed to Iglulik, Ponds
    Bay, and Boothia Felix; and west Hudson Bay wives are said to live with the husband's
    family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Childless married couples often adopt children for future care, and one example
    describes a child given to an Aivilik family in exchange for a gun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Walrus parts are distributed according to who first strikes the animal and
    who next assists, while dogs are fed during butchering to encourage them in hunting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who accidentally damages another's property is described as feeling
    regret when comforted, but feeling relief if the owner is annoyed because only
    one person needs to be annoyed.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Meetings of strangers are accompanied by contests in a snow house, where selected
    men alternately receive full-force blows on the shoulder or side of the head until
    one gives in.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Earlier contests between Netchillik and Aivilik used knife points pressed
    against cheek-bone and shoulder, and one Netchillik contestant is said to have
    stabbed and killed an opponent before fleeing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage reports Netchillik quarrelsomeness and family violence and states
    that these details closely agree with customs and ideas important in Greenland
    traditions.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: When two persons with the same name meet, one relinquishes the name and receives
    a present.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Orphans and aged people who are burdens to the tribe may be killed; one account
    describes a mother killing her child Nuliayoq, after which she became lame and
    the spirit Nuliayoq was believed to be offended.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Among the Netchillik, people who become sick and infirm without prospect of
    recovery are said to commit suicide or be hung.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: When a travelling party lacks provisions, it may leave a woman or old person
    in a small walled-up snow hut, returning if the party reaches supplies.
  category: action
  evidence_refs:
  - ev:12
