candidate_motifs:
- id: motif:1
  label: Birth blessing for hunting destiny
  taxonomy_refs: []
  basis: Harry is blessed at birth with ceremony so that he might become a great hunter
    and whaleman.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives an ethnographic report, not a narrative myth; it does
    not state that Harry actually fulfills the destiny.
- id: motif:2
  label: Guardian spirit punishes careless ritual work
  taxonomy_refs:
  - divine_judgment
  basis: Harry's guardian spirit is said to become angry at a woman who works carelessly
    on his skins and to cause her death.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The spirit is called a guardian spirit, not explicitly a deity; the taxonomy
    link to divine judgment is approximate.
- id: motif:3
  label: Ritualized contest at meeting with strangers
  taxonomy_refs: []
  basis: Meetings of strangers are described as accompanied by contests in which representatives
    endure alternating blows until one gives in, without ill feeling.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a social ceremonial pattern rather than a mythic narrative motif.
- id: motif:4
  label: Violent ordeal contest with weapons
  taxonomy_refs: []
  basis: Former Netchillik-Aivilik contests used knife points pressed against body
    parts and could rupture into lethal violence.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only one fatal instance is reported; the passage does not frame the contest
    as mythic.
- id: motif:5
  label: Name relinquishment compensated by gift
  taxonomy_refs: []
  basis: When two persons with the same name meet, one relinquishes the name and receives
    a present.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not explain the religious or symbolic meaning of the
    name exchange.
- id: motif:6
  label: Offended ruler-spirit causes bodily affliction after killing of named child
  taxonomy_refs:
  - divine_judgment
  basis: After a mother kills the child named Nuliayoq, she becomes lame, and the
    spirit Nuliayoq, ruler of sea or land animals, is believed to have been offended.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage records a belief about causation but also notes that the killing
    coincides with customs among other Eskimo tribes; moral interpretation is explicitly
    cautioned in the source.
- id: motif:7
  label: Game-sharing by order of hunting participation
  taxonomy_refs: []
  basis: Walrus parts are allocated to the first striker and successive assistants,
    with dogs also fed to encourage future hunting assistance.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a subsistence and distribution pattern, not explicitly a mythological
    motif.
- id: motif:8
  label: Abandonment of dependent during scarcity with possible retrieval
  taxonomy_refs: []
  basis: A travelling party short of provisions may wall up a woman or old person
    in a small snow hut and return if provisions are replenished.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage gives this as a survival custom and does not attach a supernatural
    explanation.
