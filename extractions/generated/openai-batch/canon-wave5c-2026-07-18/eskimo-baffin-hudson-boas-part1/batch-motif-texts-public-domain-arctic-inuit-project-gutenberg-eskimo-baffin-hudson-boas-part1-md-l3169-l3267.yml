canonical_text:
  quote: ''
  summary: 'The passage recounts the Sedna legend and explains related Central Eskimo
    beliefs: Sedna is taken by a petrel husband, mutilated by her father while clinging
    to his boat, and her severed finger joints become sea mammals. She becomes the
    one-eyed mistress of a lower world and principal deity associated with sea mammals.
    Sea-animal souls return to her after death and can be harmed by taboo violations,
    corpse contact, and blood pollution. These violations offend Sedna and affect
    hunting success, weather, sickness, and starvation. Confession of taboo transgression
    is described as necessary to protect the community and restore hunting conditions,
    sometimes through an angakok’s diagnosis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedna is recalled as a girl who would not have a husband and who finally married
    a petrel that took her to its village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Sedna’s father carried her back in his boat, the petrel caused a heavy
    gale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sedna’s father threw her overboard, cut off the joints of her fingers as she
    clung to the boat, and those joints became whales, ground-seals, and common seals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sedna is said to have gone to the lower world and become its mistress; her
    father later went down after the tide swept over him and now lives in her house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Sedna is described as the mother of the sea mammals and as the principal deity
    of the Central Eskimo.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sedna is believed to live in a lower-world house made of stone and whale-ribs,
    to have one eye, and to move by sliding rather than walking.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The souls of seals, ground-seals, and whales are believed to come from Sedna’s
    house, stay with a killed body for three days, and then return to her abode to
    be sent out again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A violated taboo can attach to an animal soul, cause it pain, and make Sedna’s
    hands sore; Sedna then punishes people with sickness, bad weather, and starvation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Sea-animal souls are said to perceive corpse contact as a dark color and flowing
    human blood as a vapor, making affected hunters distasteful to them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Custom requires people to announce corpse contact, menstruation, miscarriage,
    and other taboo transgressions so that others can avoid harmful contact.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: In starvation narratives, an angakok may be invoked to discover the taboo
    violation; confession is followed by improved weather and successful sealing,
    while persistent denial may lead to death to appease the offended deity.
  category: sequence
  evidence_refs:
  - ev:6
