canonical_text:
  quote: ''
  summary: The passage gives short accounts of dwarf-like Inuarugdligait, giant Ijiqan
    people, and a longer tale of three girls who speak of taking a Whale, an Eagle,
    and a Bowlder as husbands. The animal husbands carry off two girls and are later
    defeated after rescue attempts by kin; the girl joined to the Bowlder gradually
    becomes stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Inuarugdligait are described as dwarfs about knee-high to an ordinary
    man and as living between Wager River and Chesterfield Inlet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Aivilik man is said to have seen two small sets of footprints in snow,
    and a Kinipetu man claims to have met one Inuarugdligaq.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The encountered dwarf enlarged himself to the size of the man and proposed
    a wrestling test of strength.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man threw the dwarf and forced him to let go by holding his wrists.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that if the dwarf had thrown the man, the man would have
    become unsuccessful in hunting and eventually died of hunger.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Inuarugdligait are said always to propose a strength test when meeting
    a man and to carry only an ice-chisel as a weapon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:7
  text: A dwarf couple came to a dance in an Eskimo hut; the woman's child fell from
    her hood at the entrance and was devoured by dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The dwarf husband told the crying woman to dance and enjoy herself, saying
    she might have another child later.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Ijiqan people are described as giants living west of Great Fish River
    and as twice as large as ordinary men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Siksik reports that, when he was a boy hunting with his father, two large
    men silently took two killed caribou and carried them away without resistance
    from his father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Three girls at play near the beach jokingly declared that they would take
    a Whale, an Eagle, and a Bowlder as husbands.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The girl who touched the Bowlder could not remove her hands from it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Eagle carried one girl to a nest on a high cliff, and the Whale carried
    another girl to an island.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The Whale gave bones from his body to the girl to build a house, and she became
    able to live either in water or on land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The Whale fastened a line to the young woman before letting her go to an island;
    she removed the line and tied it to a buckle that her father empowered to speak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The speaking buckle answered the Whale's calls, delaying the Whale until he
    hauled in the line and found only the buckle attached.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:17
  text: The angry Whale tore down the house, put most of his bones back into his body,
    forgot his breast-bone and hip-bone, and pursued the fleeing people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: The fleeing young woman threw pieces of clothing into the sea; the Whale repeatedly
    stopped to strike them with his tail, allowing the boat to escape over a reef.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:19
  text: The Whale stranded on the reef when the tide went out, and the people killed
    him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:20
  text: The girl carried off by the Eagle made a long line from caribou leg sinews
    while the Eagle was away hunting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:21
  text: She sent the Eagle to a distant place by saying there were many caribou there,
    then climbed down the completed line to her father and brothers' boat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: When the Eagle tried to recover her at the village and broke her father's
    house window with his wings, her father shot and killed him with an arrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:23
  text: People point out the Eagle's cliff and say people used to cut pieces from
    the line until it was out of reach.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:24
  text: The girl married to the Bowlder gradually turned into stone; people brought
