canonical_text:
  quote: ''
  summary: An ethnographic description of small seal-skin tents, their occupants,
    camp conditions, tools, scarce wood, valuables, exchange behavior, tattoos, clothing,
    hair arrangements, and dogs at a Southampton Island/Cumberland Sound encampment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes two very small, leaky tents made of badly dressed seal-skins,
    inhabited by five women and six children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women showed no fear or surprise when the visitors entered, while the
    children hid their heads and avoided speaking or looking at the visitors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One young woman carried her own child on her back; her mother was present
    and is described as having a similar countenance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Neeakoodloo rolled up a large new deerskin, threw it toward the narrator,
    and repeated the word rendered as “Kooyenna.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Except for the sleeping space, tent floors were strewn with salmon and offal;
    the narrator saw no lamp and only one poorly constructed cooking pot.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: About two dozen dogs lay near the tents and ran away when the visitors approached;
    no sledges were seen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The tents lacked domestic toys like those the narrator had found among winter
    companions; women used bird-pinion bone needles and had crude iron needles apparently
    made from nails.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A small black-painted piece of deal was kept among family valuables, and the
    passage states that this piece and three multi-piece bows were all the wood in
    their possession.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The group’s spears were made of whale rib bone, and one bow with five arrows
    was later said to have been purchased for a livery button.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After receiving presents, individuals immediately offered the donor a choice
    of their property, especially dried salmon-skin rolls and pieces of flint for
    making knives and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Neeakoodloo offered stones and fish-skins after receiving knives and, when
    these were refused, began cutting up his only large seal-skin for acceptance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Women were slightly tattooed on the face in small dots, their hands were unmarked,
    and their hair was twisted into short clubs hanging over the temples.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: Bone ornaments used as pendants to women’s hair locks included small pieces
    of lead strung alternately with pieces of bird claw.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Women wore thigh wrappers, high boots, and ragged jackets; the narrator compares
    these garments with clothing of the natives of the Savage Islands.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Men wore short breeches exposing the knees and gloves made from reversed dried
    dovekie skin.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Each man is described as having a large ball-like mass of hair projecting
    from the forehead, made from long matted plaited locks bound at the base and measuring
    more than four feet in one opened example.
  category: attribute
  evidence_refs:
  - ev:8
