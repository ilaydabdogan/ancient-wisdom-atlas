literal_observations:
- id: obs:1
  text: The passage compares kayak dimensions for Cumberland Sound, Savage Islands,
    and Smith Sound, and states that the deck attachments are much alike.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kayak harpoon is measured at 155 to 166 cm including the movable tusk;
    its head is described as large and wide, with two barbs and a blade parallel to
    the plane of the barbs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bladder-dart is used in the kayak; its detachable point is tied to the
    shaft, and an attached bladder keeps the shaft afloat, exhausts the animal, and
    helps prevent sinking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bladder-dart is hurled with a throwing-board, and the butt-end is shaped
    to fit the board's groove and rear peg.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A lance with detachable point is used from the kayak for hunting caribou in
    ponds; its point is short and lacks barbs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some peculiar bone points are illustrated, but their uses are unknown to the
    author.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The modern winter harpoon is described as wood with an iron point, while the
    ancient harpoon had a bone point attached to a wooden shaft and a stout butt-end
    bone point for breaking ice or hard snow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The winter harpoon head is smaller than the kayak harpoon head and uses a
    side-drilled socket and binding string to hold the shaft point.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The winter harpoon line passes through a loop near the shaft butt; when the
    head detaches after striking an animal, a hook catches in the loop and keeps line,
    harpoon, and shaft together.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Three line hooks show a tendency to take the form of a long-necked bird.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Small ivory attachments are grooved on the lower side and are probably attachments
