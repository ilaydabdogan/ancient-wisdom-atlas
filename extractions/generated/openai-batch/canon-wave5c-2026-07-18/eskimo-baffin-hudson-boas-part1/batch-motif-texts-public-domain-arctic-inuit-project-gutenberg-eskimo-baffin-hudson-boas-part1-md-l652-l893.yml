  summary: The passage catalogs kayak and winter hunting implements, including harpoons,
    darts, lances, throwing-boards, line hooks, line attachments, hand-supports, and
    clasps. It describes their dimensions, construction, uses in hunting, and some
    animal-shaped or animal-derived designs.
