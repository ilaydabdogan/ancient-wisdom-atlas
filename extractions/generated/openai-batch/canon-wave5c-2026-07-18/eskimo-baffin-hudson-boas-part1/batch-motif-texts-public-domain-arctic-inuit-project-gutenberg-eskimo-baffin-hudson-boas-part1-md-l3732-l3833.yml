    skin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After asking people to shut their eyes, the first angakok shouts, rises to
    his feet, and his soul goes upward while a creaking noise is heard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first angakok says his soul went through an invisible hole in the roof,
    and this proves him to be an angakok.
  category: speech
  evidence_refs:
  - ev:2
