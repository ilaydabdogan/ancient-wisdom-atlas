  quote: ''
  summary: The passage describes the first angakok seeing another sky and souls, proving
    his power through binding and soul ascent, lists powers and duties attributed
    to angakut, describes divination by head-lifting, witchcraft affecting illness
    and hunting, and a tale of Ekkoma, whose deranged mind is associated with supernatural
    knowledge of caribou.
