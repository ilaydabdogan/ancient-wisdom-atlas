canonical_text:
  quote: ''
  summary: The passage describes salmon fishing at a dammed stream, an exchange between
    visiting Europeans and local inhabitants, an abandoned Esquimaux establishment
    with food caches, tools, huts, stone piles, and graves. It records an adult and
    a child buried in coiled posture, a snow bunting nest found in the child’s stone
    tomb, and the narrator leaving useful articles on huts and stone piles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rapid gravel-bed stream near the tents had a dam across it, and fishermen
    stood behind the dam to spear salmon as they moved upstream.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator requested that salmon stores be opened and fish brought after
    the visitors; the local people agreed, and the ship received a large supply.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the local people lacked iron, were poor in material
    goods, and may not previously have seen Europeans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the landing place were remains of a large Esquimaux establishment with
    stored provisions in small buildings.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stored provisions included skinned birds, walrus pieces, seal carcasses,
    bags of blubber, and a leather sack of king-ducks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A high stone pile near the beach held a broken bow, a flint arrow, a knife,
    a spear, fragments of skin, and walrus flesh.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near a small peat hut, an inverted limestone cooking pot covered or stood
