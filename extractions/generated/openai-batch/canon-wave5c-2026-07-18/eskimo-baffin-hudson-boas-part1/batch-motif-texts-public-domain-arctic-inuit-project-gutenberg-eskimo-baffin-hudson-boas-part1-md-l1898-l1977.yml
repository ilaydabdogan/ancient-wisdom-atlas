    like a canoe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A larger mound contained a dead person sewn in a skin and coiled up; the narrator
    says this coiled posture was a custom among some Esquimaux tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A third stone pile covered the body of a child, coiled in the same manner
