  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Whale-jaw sledge runners and other bone spars lay under or near stones and
    were blackened with soot.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Double stone piles for supporting canoes lined the beach, and six large bone
    or winter huts stood farther inland in dirty, dilapidated condition with mosses
    and grasses on seats and sleeping places.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: On a shingle ridge, a small stone pile was associated with a flint knife,
