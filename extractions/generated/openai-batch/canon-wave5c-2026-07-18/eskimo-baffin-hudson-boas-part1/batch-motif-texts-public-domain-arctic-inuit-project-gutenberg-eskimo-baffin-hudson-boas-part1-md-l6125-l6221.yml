canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a woman escapes her cannibal
    husband by using heather-filled clothing and snow as a decoy, reunites with her
    brother, and the husband is killed in a dancing-house. It then gives three tales:
    a hunter carried out to sea by a monster gull kills it and returns using its feathers
    as a paddle; the giant Koodlowetto survives being dragged into an ice hole by
    a walrus and later breaks a sledge by sitting on it; and the giantess Inupassaqdjung
    handles whales, boats, and people as small objects.'
  language: English
  quote_policy: summarized
