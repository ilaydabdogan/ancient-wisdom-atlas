canonical_text:
  quote: ''
  summary: The passage closes a preceding tale in which women report kindness from
    insects and describe an old woman's rejuvenation after an ermine bites off her
    old skin. Tale 44 recounts a pregnant widow abandoned after her husband is murdered;
    she traps and kills ravens for food, and her son grows rapidly on raven meat until
    he becomes raven-like. At his mother's urging he avenges his father, using a dog
    corpse as an omen, dodging arrows like a raven, and killing the murderers. Tale
    45 begins with Attongey harnessing colored stones that transform into dogs, then
    rebuking two old women by comparing them to ravens, after which they behave like
    ravens.
  language: English
  quote_policy: summarized
