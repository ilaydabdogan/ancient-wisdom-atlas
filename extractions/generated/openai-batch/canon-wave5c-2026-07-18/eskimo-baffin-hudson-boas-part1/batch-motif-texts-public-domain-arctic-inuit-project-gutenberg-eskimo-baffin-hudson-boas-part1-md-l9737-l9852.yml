canonical_text:
  quote: ''
  summary: The passage contains two narrative segments. In the first, Kokoparoolee
    avenges his killed brother by killing the man hidden in seal-skins and then killing
    the remaining brothers; later enemies try to catch him and frighten him with a
    human skull placed in water, but he retrieves it and survives while they die.
    In the second, Kunikjwak's son abducts Pudlookshine's wife, attacks Pudlookshine
    after a false accusation, and dies by running onto Pudlookshine's knife; Pudlookshine
    escapes pursuit by hiding under snow and later finds protection with his sister's
    household.
  language: English
  quote_policy: summarized
