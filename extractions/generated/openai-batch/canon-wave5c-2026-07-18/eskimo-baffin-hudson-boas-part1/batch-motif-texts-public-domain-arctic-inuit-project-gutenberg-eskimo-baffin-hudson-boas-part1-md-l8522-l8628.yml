canonical_text:
  quote: ''
  summary: A boy compelled to join a whaling boat briefly appears as a strong bearded
    man while harpooning a very large whale, then looks like a boy again. Two episodes
    tell of bears transformed into geese when women cry or shout “Geese!” A separate
    tale describes girls visiting an isolated household whose man says he killed someone
    and whose hut cannot be found the next day. The final episode tells of Karnapik
    and his wife eating their dead daughter during famine, after which Karnapik uses
    her thigh-bone as a speaking-trumpet to command repeated killings for food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boat is manned, and a boy sits in the center beside the man who compelled
    him to go along.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After one whale stays too far away, a very large whale arises, and the boy
    is told to go to the bow and throw his harpoon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the bow, the boy stands erect, appears like a strong man, shows a manlike
    face with a beard, throws the harpoon deep into the whale, and then crawls back
    looking like a boy again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The whale rises dead before the kayakers can lance it, and the men say they
    have never before seen a boy kill a whale.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The whale is towed ashore and cut up over several days; later the boy says
    he uses only a whalebone knife for whale meat and, when larger, says he is still
    not a man although he harpooned a whale as a little boy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Saunituqdjuaq, a large bear comes close to shore from the ice and stretches
    its neck onto the shore, while the people run away and hide in a hole in the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An old woman unable to walk remains in her hut and repeatedly cries “Geese!”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: As the old woman cries “Geese!”, the bear’s ears and then other body parts
    fall off and become or fly away as geese.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Atawi'kdjuaq and his wife set out to search for their son, who was lost while
    hunting in his kayak, following shore and water routes to Lake Netchillik and
    its outlet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A huge bear as large as a good-sized island comes to the parents’ hut, and
    the woman says they cannot overcome the monster in its present shape.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Atawi'kdjuaq’s wife proposes transforming the bear into geese, shouts “Geese!”,
    and a cloud of geese immediately arises from the bear’s body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A man from Saumia asks two girls to accompany him while he goes sealing; while
    he waits at a seal-hole, the girls go ashore for ptarmigan and find an unexpected
    hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Inside the hut are an elderly woman at the rear and a man and younger woman
    in front; the younger woman gives the girls soup, which all share.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: The man names himself Udlilowa, says he has killed a man, and says he lives
    alone with his family because they do not wish to live with other people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The old woman asks whether the girls will be one of the Naaquaran; the girls
    return home and report the encounter, but the next day they cannot find the hut
    again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: During winter famine at Anarnitung, Karnapik’s daughter is dying; he asks
    for rope to tie her in a blanket and intends to take her out through the porch,
    but his wife asks him to wait.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: After the daughter dies, Karnapik and his wife resist hunger for a time but
    eventually eat her flesh until they have eaten her entirely.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Karnapik takes his daughter’s thigh-bone, uses it as a speaking-trumpet, and
    shouts commands to kill someone.
  category: object
  evidence_refs:
  - ev:7
- id: obs:19
  text: After Karnapik’s commands, the people kill one person and eat the flesh; later
    they kill more than one person and repeat the process when hungry again.
  category: sequence
  evidence_refs:
  - ev:7
