candidate_motifs:
- id: motif:1
  label: Child temporarily appearing as adult to kill giant game
  taxonomy_refs:
  - miraculous_child
  - shapeshifter
  basis: The boy appears as a strong bearded man only while throwing the harpoon,
    kills the very large whale, and then looks like a boy again.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explain the source of the change or describe a birth
    miracle; taxonomy links are approximate.
- id: motif:2
  label: Extraordinary feat contrasted with incomplete manhood
  taxonomy_refs:
  - initiation
  basis: After killing the whale as a small boy, the figure later says he is still
    not a man.
  evidence_refs:
  - ev:2
  confidence: low
  cautions: No explicit initiation ritual is described; the passage only preserves
    the speaker’s claim about manhood.
- id: motif:3
  label: Spoken naming transforms bear into geese
  taxonomy_refs:
  - shapeshifter
  basis: In two episodes, women cry or shout “Geese!” and a bear’s body becomes geese.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes transformation into multiple geese rather than a
    single shape-shifting individual.
- id: motif:4
  label: Monster overcome by transformation rather than combat
  taxonomy_refs:
  - shapeshifter
  basis: Atawi'kdjuaq’s wife says they cannot get the better of the huge bear in its
    present shape and transforms it into geese.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The text gives only one explicit statement of the strategy; the first
    bear episode does not state intent in the same way.
- id: motif:5
  label: Encounter with hidden or vanishing isolated people
  taxonomy_refs: []
  basis: The girls find a hut whose occupants call themselves Naaquaran, hear Udlilowa
    say the family lives alone after he killed a man, and cannot find the hut the
    next day.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly matches this pattern.
- id: motif:6
  label: Famine cannibalism beginning with a dead child
  taxonomy_refs: []
  basis: During starvation, Karnapik and his wife eat their dead daughter after initially
    resisting the temptation.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy reference directly matches famine cannibalism.
- id: motif:7
  label: Human bone voice-instrument commands communal killing
  taxonomy_refs: []
  basis: Karnapik uses his daughter’s thigh-bone as a speaking-trumpet to call people
    and command repeated killings for food.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage states the instrument’s use but does not explain its origin
    beyond the daughter’s body or assign a ritual context.
