canonical_text:
  quote: ''
  summary: The passage lists seasonal and situational taboos concerning the handling
    of caribou, seal, walrus, musk-ox, iron, steatite, bedding, food, reproductive
    conditions, hunting equipment, specific animals, and particular places. It also
    describes smoke rites before sealing, offerings or deposits on the ice or under
    stones, punishments attributed to Nuliayoq, and locality-specific restrictions
    around a pond and a hill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Work on caribou-skins is prohibited during the walrus-hunting season and while
    people live on the ice; unfinished work must be taken to shore, and certain caribou
    meat, skins, and bedding must enter a snow house through a rear hole rather than
    the doorway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seal-skin work is delayed or prohibited in relation to walrus-hunting and
    caribou-hunting seasons, and seal-meat and caribou-meat must not be eaten on the
    same day.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:3
  text: Before the first sealing trip of the season, dried seaweed or kelp is burned
    in the snow house; clothes and harpoons are held over the smoke while a word is
    spoken, and the key-block of the snow house is cut with a knife in all directions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Soon after sealing begins, a piece of white caribou-skin and a bit of thread
    are carried out and deposited on the ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Walrus tusks, iron work, caribou hair-cutting, and steatite work are restricted
    by season or by whether people are living on the ice.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:6
  text: A person who ate human flesh during famine is afterward forbidden to eat bear-meat
    because bear-meat is believed to resemble human flesh and to keep alive the desire
    for human flesh.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: A person recently bereaved must not pluck ducks; bedding must not be raised
    while men are hunting on the ice; a line should be cut slanting rather than straight
    across.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Women who are menstruating or who have miscarried must be isolated; a story
    says that a woman who did not disclose a miscarriage caused famine and was killed
    and taken down by Nuliayoq.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A woman shot in the leg and a woman who tires while travelling are interpreted
    as being punished by Nuliayoq for taboo transgression.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Killing an albino caribou is said to bring sickness and death; an example
    is given of a hunter who killed a white caribou, developed boils, and died, with
    the death attributed to Nuliayoq.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At a large pond near Iglulik, women may not look at the open pond, caribou
    hunters place huts out of sight, an antler from a killed caribou is pushed into
    the ground, and a lone hunter must not eat the kill until finding company.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Travellers approaching a hill in Tununirn must turn a somersault, except for
    old people.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A man hunting caribou in ponds from a kayak deposits small pieces of seal-skin
    under a stone as an offering to Nuliayoq.
  category: action
  evidence_refs:
  - ev:7
