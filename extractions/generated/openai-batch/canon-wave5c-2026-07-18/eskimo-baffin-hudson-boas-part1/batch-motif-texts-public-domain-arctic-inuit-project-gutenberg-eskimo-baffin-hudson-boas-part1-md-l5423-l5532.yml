canonical_text:
  quote: ''
  summary: The passage contains the end of a tale about Nareya, a huge man who kills
    a hunter, steals bodies from graves, tries to have a decoy angakok cooked, pursues
    the escaping angakok, and dies after drinking a magically made river, producing
    mist and fog. It then begins a tale titled 'How Children were formerly obtained,'
    in which Owmirneto and later her found daughters repeatedly find and raise children;
    one daughter who cannot find a child marries a found boy and later feeds a chrysalis
    with her own blood.
  language: English
  quote_policy: summarized
