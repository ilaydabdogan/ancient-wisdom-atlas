canonical_text:
  quote: ''
  summary: Six brief tales describe hunters encountering whales, killer-whales, seals,
    storms, unstable ice, an apparent killer-whale form, and an exhausted young man
    left in a snow house on the ice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from Aggo found a whale maintaining a breathing hole in ice with no
    nearby open water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hunter put his hand into the whale's blow-hole; the whale closed it, took
    him underwater, and later surfaced carrying him alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hunters fastened sealing-lines to the ice, harpooned and stabbed the whale,
    killed it, and later brought home meat, blubber, and skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ohkoko found a stranded whale on a boulder beach, avoided stones and mud thrown
    by its tail, killed it, and the people processed it for winter food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kooban found thin, weak killer-whales at a winter water-hole with ice on their
    back-fins; the people harpooned them but did not cut them up because they judged
    the blubber and meat unsuitable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a gale and heavy swell broke and piled the ice, Pavvean and Assesa returned
    with sledges loaded with seals that had been killed or trapped by the ice conditions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Observers saw Nutaakdju towing a killer-whale and then appearing with his
    kayak to dive like a killer-whale, including what they recognized as a fin on
    his back; later he appeared in normal form and denied being a killer-whale.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When winter ice broke, a group wandered across shrinking floes; Ulireyak gave
    up, his companions made a snow house for him, and they continued until they reached
    shore.
  category: sequence
  evidence_refs:
  - ev:6
