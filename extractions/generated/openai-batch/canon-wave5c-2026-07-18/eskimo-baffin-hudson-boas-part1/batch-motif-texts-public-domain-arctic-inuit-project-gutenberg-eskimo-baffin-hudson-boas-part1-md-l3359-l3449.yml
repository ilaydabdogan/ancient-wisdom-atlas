canonical_text:
  quote: ''
  summary: The passage describes taboos concerning polar bears, sea mammals, death,
    childbirth, premature birth, and seal meat. It explains that taboo violations
    can appear as dark color, vapor, or attachments on souls, can cause sickness or
    death, and can affect hunters, children, seals, and relations with Sedna. It concludes
    with a story in which Kunu conceals a premature birth, eats seal meat, and Naxojassi
    dies after the transgression becomes attached to his soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The beings named Angeakatille and Ochowjewtil guard the souls of bears and
    live in an enormous beautiful iceberg.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bear’s soul remains for three days near the place where it left the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Nugumiut, after a male bear is killed, specified organs and male-associated
    tools are hung on a pole for three nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After a female bear is killed, the same body parts are hung with female-associated
    tools and a brass head fillet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that taboo transgressions during the three days after a
    bear’s death are believed to be punished speedily.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Sea mammals are said to perceive taboo effects on humans as a dark color or
    vapor that ordinary humans cannot see.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A taboo transgression is said to attach to a person’s soul, make the person
    sick, and, if not removed, lead to death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The angakok can see and remove soul attachments with the help of a guardian
    spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Children are especially vulnerable to taboo attachments from parents, particularly
    mothers; when the mother acknowledges a transgression, the attachment leaves the
    child’s soul and the child recovers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: Clothing, tents, and skins connected with a dead person must be discarded
    because they would appear dark to seals and cause seals to avoid hunters or huts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Seal meat eaten in a successful hunter’s hut must not be taken out, especially
    in the case of the first seal of the season, to prevent contact with persons under
    taboo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A woman with a newborn child who has not fully recovered must eat only seals
    caught by her husband, by a boy, or by an aged man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The vapor from such a woman’s body is said to attach to the souls of other
    seals, which take the transgression down to Sedna and cause her hands to become
    sore.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A premature birth must be announced publicly; concealment may contaminate
    people and seals, causing seals to avoid the affected people and carry the transgression
    to Sedna.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: In the illustrative story, Kunu concealed a premature birth and ate seal caught
    by Naxojassi; the transgression became attached to the seal’s soul and to Naxojassi’s
    soul, and Naxojassi died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Aniksili performed an incantation and discovered Kunu’s concealed premature
    birth and its connection to Naxojassi’s condition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Kunu denied the event, was urged by her father Kudlu to confess, later confessed
    to her sister Mikiju, and was eventually divorced by her husband.
  category: sequence
  evidence_refs:
  - ev:6
