comparison_claims:
- id: claim:1
  claim: The passage contrasts polar-bear taboo consequences with the previously mentioned
    pattern of animals going to Sedna’s abode; both concern animal souls and taboo
    consequences, but bear-related punishment is said to be faster.
  claim_level: same_function
  target: animals going to Sedna’s abode
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is internal to the passage and mentions only relative
    speed of punishment; the wider Sedna-abode pattern is not described in this excerpt.
- id: claim:2
  claim: The Kunu story is presented as an illustration of the immediately preceding
    pattern in which concealed premature birth contaminates people and seals through
    taboo vapor.
  claim_level: same_motif
  target: premature-birth concealment taboo pattern
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage explanatory comparison, not a cross-cultural
    or historical-contact claim.
- id: claim:3
  claim: The first-seal restriction is a stricter instance of the broader passage
    pattern that game animals and their meat must be protected from taboo contamination.
  claim_level: same_function
  target: sea-mammal contamination-prevention pattern
  evidence_refs:
