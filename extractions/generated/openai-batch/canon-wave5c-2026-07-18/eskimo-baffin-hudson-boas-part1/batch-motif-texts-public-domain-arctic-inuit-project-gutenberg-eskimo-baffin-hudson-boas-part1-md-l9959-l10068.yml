canonical_text:
  quote: ''
  summary: 'The passage recounts several violent episodes: the removal of Apartsoo
    and his wife''s bodies and the cutting up of their possessions; Inutalu''s attempted
    attack on Koalwaping and his subsequent communal killing and dismemberment; and
    Koomungaping''s conflict with Ooryew, Kooleegowya, and Kunooshaw, including a
    failed night attack, Ooryew''s killing during a puppy-lure encounter, disposal
    of his body under the ice, and Kunooshaw''s death in an ice-hummock ambush after
    sea-gulls draw his attention to the blood track.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men carry away the corpses of Apartsoo and his wife to another island, report
    their deaths, and the people cut up the couple's belongings except for a caribou-skin
    taken by an old woman; thread is found inside the skin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inutalu is described as a bad man who had murdered many people, and his mother
    hears him muttering about where to go to kill someone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inutalu launches a boat and travels with his two wives and a crew to Niutang,
    where he visits Koalwaping, on whom he has designs.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: While visiting Koalwaping and his wife, Inutalu asks for whale-skin, raises
    his arm when Koalwaping turns for a knife, and is warned against by Koalwaping's
    wife; Inutalu explains the movement as testing a sore arm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people, knowing Inutalu as a bad man, have sharpened knives before dawn
    and distract him by calling out about whales blowing in different directions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Inutalu turns to look, men throw him down, hold his arms, stab him, cut
    off his head and limbs, and throw the parts into the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inutalu's wives and crew return to the boat and tell his mother that he is
    dead; the narration states that the mother had instigated him to murder people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ooryew, Kooleegowya, and Kunooshaw are said to be feared bad men and enemies
    of Koomungaping.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Koomungaping's wife sees Ooryew and Kooleegowya near the doorway through a
    hole in the tent; the men look through a hole above the doorway and leave when
    they see the people are not asleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Koomungaping and his friend use a litter of young dogs to draw Ooryew close;
    Ooryew reaches for a puppy while keeping his left hand and a knife inside his
    clothing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Koomungaping throws Ooryew down, Koomungaping's friend stabs him, and Ooryew's
    own concealed knife accidentally enters his body during the struggle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ooryew's body is dragged to the ground-ice and pushed through a crack under
    the ice, leaving a blood track.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Koomungaping, his friend, and another man conceal themselves between ice hummocks
    to watch for Kooleegowya and Kunooshaw returning from sealing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Kunooshaw notices sea-gulls gathered over the blood track, approaches to investigate,
    fails to see the hidden enemies, and is killed by the second arrow shot by Koomungaping's
    friend.
  category: sequence
  evidence_refs:
  - ev:10
