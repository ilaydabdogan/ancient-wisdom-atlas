candidate_motifs:
- id: motif:1
  label: destruction and selective taking of the dead couple's belongings
  taxonomy_refs: []
  basis: After Apartsoo and his wife are reported dead, people cut up their belongings,
    while an old woman takes a caribou-skin containing thread.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins after an earlier context not supplied here, so the
    reason for this treatment of belongings is not explained.
- id: motif:2
  label: intended murder exposed by a spouse's warning
  taxonomy_refs: []
  basis: Inutalu raises his arm when Koalwaping turns away for a knife, and Koalwaping's
    wife warns that Inutalu is going to stab him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not state whether an actual stab is begun; it presents
    the warning and Inutalu's excuse.
- id: motif:3
  label: collective ambush and killing of a feared murderer
  taxonomy_refs: []
  basis: Because Inutalu is known as a bad man, people prepare knives, distract him
    with whale cries, seize him, stab him, dismember him, and throw the remains into
    the sea.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No explicit legal or ritual framework is stated; the motive given is the
    people's decision to kill him when opportunity offered.
- id: motif:4
  label: mother as instigator of a murderous son
  taxonomy_refs: []
  basis: Inutalu's mother hears him considering where to kill someone, and after his
    death the narration states she had instigated him to murder people.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage gives only brief statements about the mother's role and no
    details of particular acts of instigation.
- id: motif:5
  label: night attack abandoned because the household is awake
  taxonomy_refs: []
  basis: Ooryew and Kooleegowya watch Koomungaping's doorway and look in through a
    hole but leave when they see the people are not asleep.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Their intention to attack is inferred from the text's statement that they
    left without attacking.
- id: motif:6
  label: lure by offered animal leading to killing of an armed enemy
  taxonomy_refs: []
  basis: Koomungaping invites Ooryew to choose a puppy, positions himself, and throws
    Ooryew down while Ooryew bends to take the dog with a knife concealed inside his
    clothing.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage presents the puppy selection as the immediate setup; it does
    not explicitly call it a preplanned ruse.
- id: motif:7
  label: concealed weapon turns against its wielder
  taxonomy_refs: []
  basis: During the struggle, Ooryew's knife, held inside his clothes, accidentally
    enters his own body.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Ooryew is also stabbed by Koomungaping's friend, so the concealed knife
    is one element in the death scene rather than the sole cause.
- id: motif:8
  label: blood track and birds draw attention to hidden violence
  taxonomy_refs: []
  basis: Ooryew's blood leaves a track to the ice crack, and Kunooshaw's attention
    is attracted by sea-gulls gathered over the track.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The sea-gulls do not reveal the ambushers directly; they draw Kunooshaw
    toward the area where he is ambushed.
- id: motif:9
  label: concealment among ice hummocks before arrow ambush
  taxonomy_refs: []
  basis: Koomungaping and allies hide between ground-ice hummocks, and Koomungaping's
    friend kills Kunooshaw with a second arrow.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The supplied excerpt cuts off immediately after Kooleegowya begins to
    react, so the full outcome of the ambush episode is not included.
