canonical_text:
  quote: ''
  summary: 'The passage contains several short West Coast of Hudson Bay tales: the
    origin of caribou through a spirit-made ground opening; Fox and Raven agreeing
    that day and night should alternate; accounts of the Sun and Moon as siblings
    and the Moon taking Tootocuttuke as wife; Musk-ox and Walrus exchanging and returning
    horns and tusks; an outcast woman transforming into a black bear and devouring
    a village except her brother; and the beginning of a tale about a grave-robbing
    black bear in person form and a husband who feigns death to enter the bear''s
    home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit comes to a village, marries a woman, does not eat, and is told by
    men that he must hunt and provide for his wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit makes a hole in the ground with his spear, and a caribou jumps
    out; he kills it and takes it home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man secretly follows the spirit, sees the caribou-catching and closure of
    the hole, then opens the hole himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Because the man does not close the hole quickly enough, all the caribou come
    out and spread over the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The angry spirit kicks the caribou in the forehead, flattening it, and tells
    them to run away and always fear humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Fox and Raven quarrel because Raven wants constant daylight for finding food,
    while Fox wants darkness for approaching food unseen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Fox and Raven settle that light and darkness should alternate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A sister lights a lamp-trimming stick and runs into the dark; her brother
    lights a knife, thinking it is a stick, and runs after her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The siblings rise higher until they reach the heavens, where the sister becomes
    the sun and the brother becomes the moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The light on the brother's knife soon goes out, explaining the moon's lack
    of warmth; the moon continues pursuing his sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Tootocuttuke plays alone with seal-flipper bones representing people and animals
    when her parents are asleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Moon descends on a sled, calls Tootocuttuke by name, tells her to bring
    her games, and she goes with him and becomes his wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Sun and Moon are regarded as sister and brother, and the moon's dark spots
    are attributed to the Moon wishing to rub noses with his sister.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Musk-ox and Walrus exchange horns and tusks, but later give them back because
    the tusks crack in cold weather.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: An orphaned sister violates tribal laws, is excluded from the village, lives
    alone in an old hut without clothing, and grows hair over her body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The hairy woman tells her brother she thinks she will transform into a black
    bear and instructs him to mark his hut with sticks when the people move.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The woman attacks the people and devours all of them except her brother, whose
    house is marked with sticks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: People discover that recently buried bodies have been removed from graves;
    a watcher sees a black bear take a body away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: A husband whose wife has died decides to take revenge by pretending to be
    dead and having a friend cover his body with stones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The black bear comes in the form of a person, opens the grave, puts a line
    around the supposed body, and drags it home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: While being dragged, the man holds grass and bushes, making the Bear's work
    difficult.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: At the bear's home, the Bear intends to thaw the body before cooking it, then
