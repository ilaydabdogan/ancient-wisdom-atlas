- id: motif:1
  label: Animal origin from a ground opening
  taxonomy_refs: []
  basis: Caribou first emerge from a hole made by the spirit's spear, and the uncontrolled
    opening releases all caribou over the earth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No exact taxonomy family for animal-origin emergence was supplied.
- id: motif:2
  label: Unauthorized opening releases animals
  taxonomy_refs:
  - sacred_theft
  basis: A man secretly observes the spirit's method and opens the hole himself, releasing
    all the caribou.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage describes secret copying and opening, but does not explicitly
    call the act theft.
- id: motif:3
  label: Animal traits explained by primordial marking
  taxonomy_refs: []
  basis: The spirit flattens the caribou's foreheads and commands them to fear humans.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No matching supplied taxonomy family for origin of animal traits.
- id: motif:4
  label: Alternation of day and night from animal dispute
  taxonomy_refs:
  - duality
  basis: Fox and Raven's opposed preferences for darkness and daylight are resolved
    by alternating light and darkness.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: ''
