  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When sick and near death, Ningiu tells the people that he will die and that
    Kudlu will then catch his first ground-seal and first whale, ending their need;
    Ningiu becomes unconscious, dies, and is buried.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Ningiu's family stays in the tent for three nights, Kudlu and his brother
    hunt from kayaks; the brother catches a common seal, Kudlu catches a ground-seal,
    and the next day Kudlu catches a whale that provides abundant food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Owleyjen and Akuto lack a lamp for cooking; Owleyjen, identified as an angakok,
    wishes that the other hunters' fire-drill will not work, and their drill is used
    up without success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Owleyjen offers to make fire in exchange for a lamp and oil; after these are
    brought to him and he says he wants the others to trim their lamps correctly,
    their fire-drills work at once and a light is brought to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Owleyjen and Akuto laugh at obtaining a lamp and oil, then return the lamp
    the following morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When a woman loses a needle in moss while women sew a kayak cover, Owleyjen
    lies down, looks through his hands without looking toward the ground, says he
    sees it, picks up moss at the spot, and shakes the needle onto the cover.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Utsunang needs wood for a kayak; Kunek, who owns wood, refuses to give him
    any and moves with his wife to a small island.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After hearing a night noise, Utsunang finds driftwood ashore and asks his
    wife Ishamaloo, identified as an angakok, to cause seals to come because he can
    now make a kayak and hunt them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kunek later offers some of his own wood because he has seen Utsunang's driftwood;
