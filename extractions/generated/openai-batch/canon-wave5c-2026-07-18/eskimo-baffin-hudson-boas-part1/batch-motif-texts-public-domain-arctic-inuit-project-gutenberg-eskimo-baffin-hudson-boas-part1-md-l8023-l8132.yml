canonical_text:
  quote: ''
  summary: 'The passage recounts three narrative episodes: Ningiu kills caribou by
    standing still and looking at them, later dies after predicting Kudlu''s first
    ground-seal and whale catches; Owleyjen, identified as an angakok, causes other
    hunters'' fire-drills to fail until he receives a lamp and oil, and later recovers
    a lost needle from moss; Utsunang, whose wife Ishamaloo is an angakok, obtains
    driftwood and then seals and a white whale that provide materials and food for
    his kayak after a quarrel with Kunek over wood.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ningiu approaches a dam caribou and fawn, stands still with his head bent
    to one side, looks at them, and the caribou stand still before falling dead after
    starting to run.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kudlu reports what he saw and believes that his father had a double, with
