canonical_text:
  quote: ''
  summary: The passage contains two etiological tales. In the first, Apasinasee’s
    daughter is made to marry her father’s dog after the dog assumes human form; she
    bears dog-children, is placed on an island, loses the dog-husband when her father
    drowns him by deception, and then directs the pups to kill her father. She later
    sends parts of her brood away, producing the Ijiqat, the Inuarudligat, and the
    ancestors of the Eskimo. A note says Mr. Peck’s version is identical, with a closing
    detail about the mother watching icebergs. In the second tale, a woman creates
    walrus and caribou from garments, changes their horns and tusks after the caribou
    kills a man, and assigns the caribou to the inland.
  language: English
  quote_policy: summarized
