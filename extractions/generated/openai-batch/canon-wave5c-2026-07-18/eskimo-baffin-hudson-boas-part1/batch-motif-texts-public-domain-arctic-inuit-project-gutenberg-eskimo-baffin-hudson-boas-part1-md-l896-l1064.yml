canonical_text:
  quote: ''
  summary: Technical ethnographic description of Cumberland Sound seal-hunting and
    whaling equipment, including seal-drags, toggles, pegs and plugs for seal wounds,
    animal-form buckles and toggles, an ear-trumpet for seal-hole hunting, winter
    seal-hole supports, kayak harpoon floats and drags, and an old whaling-harpoon
    arrangement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some line-related implements are described as having bird forms with concave
    backs that receive coils of line; some others have simple hook forms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seal-hunter implements are strapped to a coil by a thong ring with a buckle;
    short straps with toggles are pulled through the lower jaw of a seal to drag it
    from its hole to a sledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A case with ivory pegs for closing the animal's wounds is attached to the
    same ring as the seal-drag straps.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buckles consist of an eye and toggle, with eyes described as oval, triangular,
    or square-stemmed, and more elaborate examples decorated with rim notches or etching.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some toggles and buckles are described in animal forms, including seal-form
    toggles and a buckle representing an animal form identified as probably an ermine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cases for wound-closing pegs are mostly wooden, with grooves closed by string
    windings; a leather case filled with moss and thick wooden plugs with grooves
    are also described.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: An ear-trumpet attributed to sealers consists of a split, hollowed, and re-tied
    walrus tusk and a double-funnel ear-piece, and is used at a seal-hole to hear
    an emerging seal.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A winter hunter at a seal-hole sits on a snow-block seat, rests his feet on
    bear-skin, and places his harpoon on supports set into the snow.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The kayak harpoon line carries a large seal-float and a drag, which hinder
    the seal's movements and prevent it from sinking after death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The seal-float is made from a whole sealskin, with flippers and holes closed
    and a blow-piece placed at the mouth part of the skin.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old whaling-harpoon has a long wooden shaft, a whale-bone foreshaft, a
    two-part harpoon point, hide thongs, a bone handle, seal-floats, and a large drag.
  category: object
  evidence_refs:
  - ev:8
