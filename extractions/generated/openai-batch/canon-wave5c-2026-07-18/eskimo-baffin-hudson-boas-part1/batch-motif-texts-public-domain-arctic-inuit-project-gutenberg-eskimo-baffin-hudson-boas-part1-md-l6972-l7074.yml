canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a girl survives by letting
    foxes die in an overfilled house and using their bodies for clothing and food;
    a tale of a hunter fed by Raven and Gull; a tale of girls whose joking choices
    of animal bones as husbands lead to animated owl and whale spouses and escapes;
    and the beginning of an origin tale involving Katsu’s adopted son struggling in
    a kayak against a strong land breeze.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl stays outside while a house becomes full of foxes, and the foxes die
    from lack of air.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl skins the foxes, makes clothing from the skins using strings instead
    of needles and thread, eats the fox flesh, and then travels along the shore to
    the head of Cumberland Sound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hunter enters the house of the Raven and meets an old man who has a boy
    bring human flesh, fowl’s dung called whale-skin, and scrapings of whalebone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter refuses the foods offered at Raven’s house; the old man eats them,
    develops a stomach ache, and vomits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hunter then enters the house of the Gull, receives dried salmon, eats
    it gladly, goes home, and reports how the birds fed him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A young woman points to an owl shoulder-blade and calls it her husband; the
    bone becomes alive, flies toward a precipice, and takes the girl with it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first girl makes a grass rope during the Owl’s absence, lowers herself
    from the cliff, and returns to her mother’s dwelling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first girl’s father calls the Owl to the window, tells him to spread his
    wings, shoots him through the heart, and the dead bird turns back into a bone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another girl points to a whale skull and calls it her husband; the whale bone
    comes alive, and she has to live in the Whale.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the second girl goes outside, a line is fastened to her because the Whale
    fears she may escape.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The second girl ties the line to the shore, boards a boat steered by her father,
    and is taken home while the Whale pursues the boat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the Whale’s pursuit, the woman throws a hair-string, a mitten, a boot,
    and leggings into the water; the Whale attacks these objects, allowing the boat
    to reach shore.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Whale runs onto shore, becomes stranded, and nothing remains visible but
    a whale skull.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A third girl wishes another bone to become her husband, but the bone does
    not respond.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Katsu, an old woman, has an adopted son who is out in a kayak when a strong
    land-breeze arises; he struggles for three days to reach shore while she calls
    for him to paddle harder.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The adopted son’s face becomes red from effort, and blood begins to stream
    over his clothing; the passage breaks off at this point.
  category: attribute
  evidence_refs:
  - ev:10
