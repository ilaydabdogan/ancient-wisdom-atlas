- id: motif:2
  label: contrasting bird hosts and contrasting foods
  taxonomy_refs: []
  basis: Raven’s house offers foods the hunter refuses and the old man vomits, while
    Gull’s house offers dried salmon that the hunter eats gladly.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage reports the contrast but does not explicitly assign moral
    or cosmological meaning to it.
- id: motif:3
  label: spoken play-choice animates animal bone into husband
  taxonomy_refs:
  - shapeshifter
  basis: Girls call an owl shoulder-blade and a whale skull their husbands; these
    bones come alive as animal spouses, while a third bone does not respond.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: high
  cautions: The available taxonomy reference 'shapeshifter' is used broadly for the
    bone-to-animal and animal-to-bone transformations.
- id: motif:4
  label: escape from animal husband
  taxonomy_refs:
  - stolen_beloved
  basis: The Owl carries the first girl to a cliff and the Whale keeps the second
