canonical_text:
  quote: ''
  summary: 'The excerpt first finishes a tale in which a man staying with a tuneq
    ignores warnings against going caribou-hunting because mosquitoes will kill him
    and is later found dead. It then gives three tale episodes: two lost women are
    hosted by the Ijiqan and later display caribou-like speed attributed to Ijiqan
    food; Kingatcheta and Kevung approach a whale killed by the Takeychwen and receive
    whale-skin; and a mother repeatedly rejects arriving animals until foxes are invited
    in.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A visitor staying with a tuneq becomes tired of remaining in the house and
    wants to go caribou-hunting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tuneq repeatedly warns the visitor that the weather is too warm and that
    mosquitoes will kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitor says he will go only briefly and will kill the mosquitoes with
    his stick before going out near autumn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visitor does not return; when cold weather begins, the tuneq searches
    and finds him dead with his stick in his hand, many dead mosquitoes beside him,
    and his blood sucked out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two women who have lost their way come to Aukinerbing, where there is a village
    of Ijiqan.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ijiqan invite the two women to stay with them and later, in the fall,
    send them back and convey them to the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the two women return home, the mother of one says she had thought they
    were dead and asks what they ate while hungry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a later ball game, the two girls who had lived with the Ijiqan are
    initially slow and unable to catch the ball.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The two girls then run around the island very quickly, with loose hair streaming
    behind them, and the people are amazed at their swiftness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ball-players say that the Ijiqan made the girls capable of running so
    fast and that the food given by the Ijiqan made them fleet of foot.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: While many men are sealing in kayaks, they see a boat fast to a whale and
    people lancing the whale before the whale and boat disappear behind a point of
    land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The men later reach a dead whale that appears to be covered with seaweed,
    and the men are afraid.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Kingatcheta and Kevung approach the whale and see that the apparent seaweed
    is harpoon-lines and that the whale-killers are Takeychwen.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Takeychwen had feared dividing the whale with the approaching Eskimo kayaks,
    but they welcome the two courageous men and invite them to take whale-skin.
  category: relationship
  evidence_refs:
  - ev:9
