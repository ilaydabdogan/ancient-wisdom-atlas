canonical_text:
  quote: ''
  summary: The passage lists tribal divisions of Inuit groups around Cumberland Sound
    and the west coast of Hudson Bay, gives etymological and alternate names for the
    Kinipetu, reports an Aivilik account of a war-expedition that exterminated a tribe
    at Nuvuk and an abandoned revenge expedition by the Inuissuitmiut, notes a single
    surviving descendant of the Inuissuitmiut, and provides census and body-measurement
    data for Kinipetu and Aivilik families.
  language: English
  quote_policy: summarized
