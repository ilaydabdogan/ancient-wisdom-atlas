canonical_text:
  quote: ''
  summary: 'The passage presents three Teton Sioux songs connected with war and mourning:
    a song about a man returning after killing one enemy, a song concerning White
    Butterfly after his death, and a song titled “He Lies Over There.” It also describes
    mourning practices after relatives were killed on the warpath, including bodily
    cutting, hair cropping, skewers through flesh, and singing while moving around
    the village circle.'
  language: English with transcribed Teton Sioux song texts and glosses
  quote_policy: summarized
