canonical_text:
  quote: ''
  summary: The passage explains the term Wakaq'taqka as preferable to “Great Spirit,”
    discusses its sacredness and limited use in ordinary speech, reports old Sioux
    men’s statements that Sioux people have always believed in it, and describes wakan
    as mysterious power manifested in gifted persons, ritual objects, thunder, lightning,
    rain, the sun, sacred stones, medicinal herbs, food, healing, and success.
  language: English with Sioux/Lakota terms as represented in OCR
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Wakaq'taqka will be used instead of “Great Spirit”
    and analyzes the term as composed of words meaning mysterious and great, not as
    a word literally meaning spirit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports that old Sioux men consistently said the Sioux had always
    believed in Wakaq'taqka, and that in old times the term was considered too sacred
    for ordinary conversation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that unspoken elements are important in Indian thought and
    that medicine-men use a “sacred language” in which familiar words have occult
    meanings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several old Indians are reported as saying that a person with a gift for extraordinary
    things is called wakan, and that the gift is supernatural but requires effort
    and study.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same reported statement says no man has been found who could command the
    sun and moon or change the seasons, and that seasonal change was regarded as a
    gift from the sun.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A pipe is described as taku wakan because supplications may be made with it
    and good obtained.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thunder is described as wakan because it cannot be seen; lightning is seen,
    and thunder and lightning are described as signs of rain that benefits the earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says other conversations expressed the conviction that Sioux people
    had always believed in a mysterious power whose greatest manifestation is the
    sun, and that Wakaq'taqka designates that power.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists citations in which Wakaq'taqka is reverenced, petitioned,
    credited with conquest or success, described as provider of food, maker of all,
    represented by sacred stones, giver of medicinal herbs, all powerful, and a help
    in sickness.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage notes that some cited authorities differed from the author’s statement,
    including one who found evidence wanting for a single Supreme Existence and another
    who enumerated Dakota gods.
  category: speech
  evidence_refs:
  - ev:8
