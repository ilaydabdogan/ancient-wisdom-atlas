  summary: The passage notes a similar Chippewa banner custom, describes the distinctive
    rattle of the Strong Heart society, reports an informant's account of a society
    custom intended to increase self-control through dog killing and feasting, and
    identifies a Strong Heart society song sung by Eagle Shield with a gloss concerning
    exclusion of one who runs away.
  language: English with Dakota/Lakota song text and gloss
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A similar custom is reported at White Earth, Minnesota, among the Chippewa,
    where a chief's daughter is shown carrying a banner that belonged to her father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Strong Heart society's distinctive rattle is a rawhide receptacle traced
    with the lines of a turtle and containing small stones or shot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rattle was used by dancers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One custom of the Strong Heart society is described as designed to increase
    members' self-control.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the informant's account, four Strong Heart lodges stood in the center of
    the village, and the Strong Heart men met every morning in one lodge and sang
    songs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two young men with rattles and two young men with bows and arrows went around
    the village killing dogs that were to be eaten in the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Strong Hearts did not kill the dogs of people described as short-tempered,
    but killed dogs of prominent families.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a dog was shot, the participants shouted and shook their rattles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The informant says that a man's heart was strengthened when his dog was killed
    and he did not show anger.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women singed and cooked the dogs and took them to a Strong Heart lodge, where
