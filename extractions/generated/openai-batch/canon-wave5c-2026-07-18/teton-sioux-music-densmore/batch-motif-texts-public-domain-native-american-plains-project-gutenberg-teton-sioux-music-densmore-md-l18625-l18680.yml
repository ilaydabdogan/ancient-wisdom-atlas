canonical_text:
  quote: ''
  summary: The passage first analyzes a recorded song, then introduces Goose, a medicine-man,
    and gives his account of a waking vision during a hunt. In the vision an antelope
    is unaffected by rifle shots, a voice commands him to look at a human-faced rising
    sun, and an aerial scene appears with a sacred red-hot stone, a painted man, birds,
    descending bird-forms, herbs, a human skeleton, blood, and a buffalo horn. The
    voice instructs Goose to use three herbs and the buffalo horn in curing the sick,
    especially diseases of the blood.
  language: English
  quote_policy: summarized
