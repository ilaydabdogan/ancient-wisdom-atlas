canonical_text:
  quote: ''
  summary: The passage describes the selection, honoring, departure, song, searching
    procedure, and return signals of a buffalo-searching party. Old men and society
    leaders choose trustworthy young men; relatives give gifts; a high-ranking man
    starts the party around an upright stick signifying an enemy or buffalo; the party
    departs with a dancing step while a song is sung. The later search is conducted
    under the leader’s control, and the party signals the result of the search on
    return.
  language: English
  quote_policy: summarized
