canonical_text:
  quote: ''
  summary: The passage first gives tempo tables comparing voice and drum metric units,
    then comments on plots of songs received in dreams about animals. It then introduces
    Teton Sioux songs relating to sacred stones, explaining beliefs about dreaming
    of a small stone, the powers and physical qualities of the stones, their symbolism
    as described by Chased-by-Bears, the sacred-language term for them, their use
    by a medicine-man for information and healing, and their association with a Dakota
    power described as 'that which stirs.'
  language: English with Dakota terms in OCR form
  quote_policy: summarized
