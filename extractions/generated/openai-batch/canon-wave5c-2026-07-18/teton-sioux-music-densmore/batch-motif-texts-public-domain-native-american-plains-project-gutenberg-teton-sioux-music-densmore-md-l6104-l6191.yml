canonical_text:
  quote: ''
  summary: A chief welcomes a young Maiden as a sister sent by Wakaŋ Tanka, offers
    her rain water through braided sweet grass and a buffalo horn, and asks for her
    message. The Maiden says she represents the Buffalo tribe, which has sent a red-stone
    pipe. She instructs the people that the pipe is to serve as a peacemaker, a binding
    instrument in peace agreements, a means for medicine-men to help the sick, and
    a sacred object to be used with reverence. She then addresses women, children,
    and men with social and ritual duties connected with family care, purity, sacrifice,
    requests for buffalo meat, and daily offerings.
  language: English
  quote_policy: summarized
