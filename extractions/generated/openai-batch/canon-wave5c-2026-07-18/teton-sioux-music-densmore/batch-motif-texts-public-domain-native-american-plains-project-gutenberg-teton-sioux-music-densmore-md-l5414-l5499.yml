canonical_text:
  quote: ''
  summary: The passage explains a graphic method for plotting Sioux melodies by marking
    accented tones on coordinates and connecting them with lines. It states that plots
    of the melodies yielded five primary outline types. Types A and B are described
    as broadly distributed melodic outlines, while comparison of Types C, D, and E
    with song titles or uses suggests a tentative relation between song content and
    song form. Examples are given for Type A, Type B, and the beginning of Type C.
  language: English
  quote_policy: summarized
