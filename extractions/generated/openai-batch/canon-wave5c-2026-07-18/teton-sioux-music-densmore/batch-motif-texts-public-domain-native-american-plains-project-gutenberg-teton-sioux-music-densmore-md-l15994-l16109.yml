  summary: The passage describes reliance on medicine-men for prediction, requests,
    charms, and offerings; a narrator's consultation with a medicine-man; teachings
    about observing animals and surroundings; sacred stones as protective representations
    connected with the earth and informed by Wakan Tanka; a sacred stone appearing
    as a person who sings for living creatures; and a song associated with Red-Streaked-around-the-Face
    and performed by Lone Man.
