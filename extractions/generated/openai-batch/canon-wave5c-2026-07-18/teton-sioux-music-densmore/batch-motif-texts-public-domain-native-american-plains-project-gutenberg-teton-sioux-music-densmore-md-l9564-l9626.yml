  summary: The passage explains Sioux sacred terminology and song phrases, then describes
    the ceremonial placement of a sacred pole, a circular dance enclosure, an exposed
    earth square called a sacred place, a cross traced in the soil, offerings and
    coverings placed in the incisions, eagle feathers, sage for a buffalo skull, and
    the Intercessor's song during preparation. Notes compare the earth space and cross/cardinal-direction
    pattern with broader Indian religious practices.
