canonical_text:
  quote: ''
  summary: The passage presents No. 192, a song in honor of Red Fish, with glossed
    Santee Dakota words saying that the Crow Indians pursued him for a long time and
    surrounded him. It then gives musical analysis of the song. The passage also quotes
    biographical material on Sitting Bull, including his leadership, warfare, reported
    medicine-making and foretelling during the Little Bighorn battle, later reservation
    events, and death. A note says Sitting Bull wore red-painted shed buffalo hair,
    and explains that shed buffalo hair was valued by the Sioux as a remembrance of
    buffalo abundance and the coming of the White Buffalo Maiden, and was used in
    buffalo dance adornment and by Buffalo societies as a charm.
  language: English with Santee Dakota song text and glosses
  quote_policy: summarized
