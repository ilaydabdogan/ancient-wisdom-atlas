canonical_text:
  quote: ''
  summary: The passage states that animals, birds, aquatic creatures, insects, plants,
    and human beings differ in character and are adapted to particular places. It
    reflects on environmental change, diminished endurance and health, the loss of
    pure water, and the value of genuine native materials such as red, white, and
    black earth paints. It then introduces a group of personal animal-dream narratives
    and songs said to have been received in dreams, naming Brave Buffalo, Charging
    Thunder, 6iya'ka, Lone Man, and thunderbirds in relation to adjacent dream-song
    material.
  language: English
  quote_policy: summarized
