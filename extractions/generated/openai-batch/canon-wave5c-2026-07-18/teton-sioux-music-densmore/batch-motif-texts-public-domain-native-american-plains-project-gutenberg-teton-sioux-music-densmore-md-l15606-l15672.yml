canonical_text:
  quote: ''
  summary: The passage reports Brave Buffalo's account of a childhood search for the
    maker of nature, a dream in which a small round stone instructed him about WakaQ^tagka
    and promised supernatural help in curing, his later finding and use of sacred
    stones, and his explanation of their round form, relation to sun, moon, thunderbird,
    lightning, healing, and intercession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brave Buffalo is presented as a prominent medicine-man of the Standing Rock
    Reservation, about 73 years old when giving the information, with a father described
    as a leading medicine-man of the tribe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At age 10, Brave Buffalo looked at land, rivers, sky, animals, trees, bushes,
    flowers, and moss-covered stones while seeking to understand the great power that
    made them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a dream, a small round stone appeared to Brave Buffalo and told him that
    the maker of all was WakaQ^tagka and that he should honor this maker by honoring
    works in nature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dream stone said Brave Buffalo's search had made him worthy of supernatural
    help and that, when curing a sick person, he could ask the stone's assistance
    and all forces of nature would help.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Soon after the dream, Brave Buffalo found his first sacred stone on the top
    of a high butte, and later found several others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One stone described in the passage is nearly spherical, has dots grouped so
    as to suggest a tiny face, is dyed red, is surrounded by eagle down, and is kept
    in red cotton cloth; the passage says the red color has no significance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stone is said to be unable to get away when surrounded by eagle down;
    it can be sent on errands of observation and is imprisoned by downy eagle feathers
    when not in use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Brave Buffalo said he had cured many illnesses by means of the stone and described
    the stone as a brother of the first stone he found.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Brave Buffalo said he had no authority to secure the sisters of the original
    stone, but that it was good to have several brothers of the original stone to
    cooperate with it; he could feel when near a relative of the original stone.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Brave Buffalo said the stones are found on top of high buttes rather than
    buried in the earth, and that they are round like the sun and moon.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Brave Buffalo said all round things are related to each other, and that these
    stones have lain a long time looking at the sun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Brave Buffalo distinguished these stones from stones shaped in streams, saying
    they were found far from water and exposed only to sun and wind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The thunderbird is said to be related to the stones and to strike a person
    or animal when punishment is to occur; the passage connects this with lightning
    and stones embedded in the earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Brave Buffalo said he had lived faithfully according to the sacred stones'
    requirements, asked the stones rather than WakaQ^tagka directly, and regarded
    the stones as his intercessors.
  category: speech
  evidence_refs:
  - ev:7
