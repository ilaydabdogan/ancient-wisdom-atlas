  summary: The passage presents song texts, glosses, and musical analysis for performances
    by Kills-at-Night, his wife, and Swift Dog. It describes recording details, a
    discussion of apparent part singing, and several Swift Dog war-exploit episodes
    involving hunting, raids for horses, a river crossing into Crow country, two war
    parties, a Black Hills warpath, and a captured horse given to his sister.
  language: English with transcribed Dakota/Lakota song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song duplication is attributed to Kills-at-Night, with glossed words referring
    to something from long ago being widely known and now heard.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Recordings by Kills-at-Night and his wife were made on two cylinders, each
    containing four renditions; the wife's voice was silent during the opening measures
    and entered at varying points.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An apparent instance of part singing in the first performance was explained
    by the woman as unintentional because of a catch in her throat; seven other renditions
    showed no trace of it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The writer states that in concerted singing heard by the writer, women sing
    an octave above men with identical note values.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: One part of plate 70 was said to represent animals killed by Swift Dog on
    a hunt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Swift Dog said it was almost winter and very cold when the group went to Crow
    country; the river had not yet frozen and they made a corral near it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The group jumped into the water and swam across to the side where the Crows
    were camped; Swift Dog compared the splash to that of great falls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The group drove the Crow horses into the river, made them swim over, and put
    them in the corral until they were ready to start home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The song titled "I Come After Your Horses" addresses Crow enemies and says
    the singer comes after their horses and wants to own them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The musical analysis says the time quickens with the introduction of the words,
    a feature often found in Sioux war songs but not noted among the Chippewa.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: For another drawing section, Swift Dog stated that he and his brother-in-law
    went after horses and each secured three.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The song titled "Two War Parties" says the singer roams with two war parties
    and desired to capture horses.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Swift Dog said that when the railroad first passed through the Black Hills,
