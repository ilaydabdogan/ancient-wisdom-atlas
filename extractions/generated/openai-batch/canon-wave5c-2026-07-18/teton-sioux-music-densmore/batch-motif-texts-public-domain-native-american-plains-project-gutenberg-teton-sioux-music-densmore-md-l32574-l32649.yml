canonical_text:
  quote: ''
  summary: 'The passage gives musical analysis for a Buffalo Hunt song and then describes
    a ceremonial sequence before a buffalo hunt: entry into the tribal circle, preparation
    of bare ground with a buffalo chip, sweet grass, and pipe, a red-painted master
    of ceremonies conducting a pipe and smoke rite with repeated fourfold actions,
    scouts reporting buffalo sightings, listeners responding with gestures, and a
    public call to saddle horses and prepare for the hunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song titled as a Buffalo Hunt song is identified as sung by Sita^ka, with
    drum rhythm said to be similar to No. 6.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The musical analysis says five renditions were recorded, time was not strictly
    maintained, the opening rhythm was difficult to discern, and the song uses limited
    ascending and descending intervals, a fourth five-toned scale, a nine-tone compass,
    and melodic structure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A party entered the tribal circle with the leader in advance; a stick was
    placed upright in the ground and the party circled around it, with many striking
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the council tent a small hard, smooth bare place was prepared; a buffalo
    chip, sweet grass, and a filled pipe were placed there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The searcher who first saw the buffalo entered the lodge before his companions,
    and many people raised their hands, said a vocal response, stooped, and placed
    their palms on the ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man selected as master of ceremonies stood beside the bare ground, and his
    entire body was painted red.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The master of ceremonies put some of the buffalo chip on the pipe tobacco,
    lit the chip on the ground, laid sweet grass on it, passed the pipe over the smoke
    four times, pretended to light the pipe three times, and lit it on the fourth
    time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The master of ceremonies swung the pipe over the chip, offered it to the first
    searcher and then to other searchers, and the searchers puffed it four times;
    if needed the offering was repeated so the proper number four was observed.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: After the searchers had puffed the pipe, it was offered to all sitting in
    the lodge, who touched their lips to it even if it had gone out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The master of ceremonies did not ask a direct question but told the man who
    first saw the buffalo to tell truthfully what he had seen and where he had seen
    it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The first searcher’s model reply says he mounted a butte and saw two buffalo
    herds near the butte; the passage notes a custom of pointing with the thumb when
    speaking of buffalo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The master of ceremonies affirmed that the report was truthful and said the
    report made his heart good, while listeners cried a response and touched the ground
    with their palms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A further report may state that beyond the two herds the plain was black with
    buffalo, and the people again gave a vocal response.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the report was completed, the crier shouted for people to put saddles
    on their horses because they were going to hunt buffalo; horses were brought in,
    men and horses were painted, whetstones were brought out, and knives were sharpened.
  category: sequence
  evidence_refs:
  - ev:7
