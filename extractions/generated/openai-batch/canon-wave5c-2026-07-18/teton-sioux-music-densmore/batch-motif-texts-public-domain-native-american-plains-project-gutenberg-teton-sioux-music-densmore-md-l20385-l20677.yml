  summary: The passage continues Old Buffalo's account of a sweat-lodge sequence associated
    with a sick niece's recovery, followed by his statement that Wakai)'tai)ka saved
    her in answer to prayer. It then gives two songs sung by Two Shields, including
    a medicine-men's song about a north wind and another song grouped with dream songs
    used in treating the sick, with brief musical and ethnographic analysis.
  language: English with transcribed Indigenous song text and English glosses
