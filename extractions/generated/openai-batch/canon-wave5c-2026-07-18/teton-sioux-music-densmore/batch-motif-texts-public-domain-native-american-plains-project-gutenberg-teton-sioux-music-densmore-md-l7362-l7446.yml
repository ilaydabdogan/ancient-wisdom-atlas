canonical_text:
  quote: ''
  summary: The passage discusses the Siouan term toakap'da as referring to mysterious
    power rather than simply to a single Great Spirit, then describes the Sun dance
    as a ceremony involving vows, voluntary endurance of pain, sacrifice to the sun,
    and petitions. It contrasts non-Native official condemnations with Red Bird's
    explanation that the Sun dance was the people's first religion, centered on a
    mysterious power represented by nature and by the sun. Red Bird also recalls a
    year when the sun 'died,' followed by darkness and the arrival of a new religion;
    an editorial note identifies this with a solar eclipse. The passage notes that
    Sun dance practices varied among tribes.
  language: English
