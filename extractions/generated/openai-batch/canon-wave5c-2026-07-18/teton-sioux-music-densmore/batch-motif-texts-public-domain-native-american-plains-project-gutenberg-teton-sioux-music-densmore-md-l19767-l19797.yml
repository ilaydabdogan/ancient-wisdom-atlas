canonical_text:
  quote: ''
  summary: A badger appears to Eagle Shield in a dream in human form, shows him a
    medicinal plant, and later brings additional herbs without songs. Eagle Shield
    repays the badger by burying tobacco and continues to make tobacco offerings when
    digging the roots. Before giving the remedies to a child, he addresses Wakantanka,
    asking that the herbs make the child well. The first badger-imparted remedy is
    identified as horseweed, used for bowel pain and diarrhea, with guidance on dosage
    and preparation as a decoction.
