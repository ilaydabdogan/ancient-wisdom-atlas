canonical_text:
  quote: It was a ceremony enacted to teach a great lesson.
  summary: After bibliographic notes, the passage describes a ceremony in which an
    herb is rubbed on hands and arms, a man and other dreamers put their hands into
    boiling water to retrieve meat, and the meat is distributed without the occasion
    being treated as a feast. It explains that dreamers regard themselves as belonging
    to elemental powers until dream obligations are fulfilled. The passage then gives
    words and glosses for Lone Man's songs about a sacred wind or other elemental
    force wearing the singer and about returning in a sacred manner to the tribe,
    followed by musical analysis.
  language: English with transcribed Indigenous song text and English glosses
  quote_policy: quoted
