  summary: The passage classifies types of Indigenous songs, including songs received
    in dreams or performed by inherited or purchased right; songs for games, dances,
    war, hunting, and praise; and songs connected with folk tales, which are said
    often to be represented as sung by animals, with a crawfish story-song cited as
    an example. It then discusses standards for singers and musical rendition, including
    intonation, consistency across recordings, tone quality, vibrato, falsetto, nasal
    tone in love songs, wailing and lullaby tones, and vocal compass among Chippewa
    and Sioux singers.
  language: English, with OCR noise
