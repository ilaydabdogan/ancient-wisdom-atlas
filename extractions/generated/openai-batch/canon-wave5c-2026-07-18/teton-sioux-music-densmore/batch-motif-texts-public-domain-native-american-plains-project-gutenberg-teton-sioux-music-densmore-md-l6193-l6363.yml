canonical_text:
  quote: ''
  summary: The White Buffalo Maiden addresses a chosen chief, gives instructions for
    receiving and reverencing a pipe for the Sioux tribe, lights and offers the pipe
    toward above, earth, and the four winds, then departs without escort and turns
    into a white buffalo calf. The passage also records the pipe's named lineage,
    rules for its use, duplicates, and a song attributed to the Maiden that is also
    used in a Spiritkeeping ceremony.
  language: English; song text includes Lakota/Dakota words with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses the chief as an older brother and says he has been chosen
    by the people to receive the pipe in the name of the whole Sioux tribe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says the pipe must be respected and reverenced, and asks WakaQ^taijka/Wakaq^'taQka
    to look down, pity the people, and provide what they need.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker takes a buffalo chip from the ground, lights the pipe, and points
    the pipe stem toward the sky, the earth, and the cardinal points while making
    offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After taking a puff, the speaker passes the pipe to the chief, says her work
    is complete, and asks that the way be cleared before her without an escort.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker leaves the tent on the left side, walks slowly, and turns into
    a white buffalo calf after she is outside the entrance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief who received the pipe is identified as Buffalo Stands Upward, and
    the pipe is said to have been handed down through generations to Elk Head at Thunder
    Butte.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says each preceding keeper of the pipe lived to be more than a
    hundred years old.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pipe is named the White Buffalo Calf pipe; duplicates were made, and the
    stem was made to resemble the windpipe of a calf.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pipe is to be passed to the left because that was the direction the White
    Buffalo Maiden took when she went away, and the one who lights it must make an
    offering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The song is said to have been sung by the White Buffalo Maiden as she entered
    the camp and is also sung in the Spiritkeeping ceremony when a white buffalo robe
    is used.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The translated song words include walking with visible breath, walking toward
    the Buffalo nation, the speaker's voice being heard, and walking for a scarlet
    relic.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The music analysis describes the song as minor in tonality, melodic in structure,
