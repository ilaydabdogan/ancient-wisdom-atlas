canonical_text:
  quote: ''
  summary: The passage gives explanations by Two Shields and Siya'ka about the bear
    as a dream animal associated with healing herbs. It says the bear is fierce or
    ill-tempered yet uniquely offers herbs for human healing, knows roots and plant
    medicines, and is regarded as chief of animals in herb medicine. Song No. 67,
    sung by Shooter, is titled "A Bear Said This" and its gloss concerns a medicine
    root that will be eaten to live. Notes say no narrative accompanied the song and
    refer to other bear dream songs used in medicine. The excerpt then begins Song
    No. 68, "He Comes to Attack," sung by Chaboino Thunder.
  language: English with transcribed song text and English glosses.
