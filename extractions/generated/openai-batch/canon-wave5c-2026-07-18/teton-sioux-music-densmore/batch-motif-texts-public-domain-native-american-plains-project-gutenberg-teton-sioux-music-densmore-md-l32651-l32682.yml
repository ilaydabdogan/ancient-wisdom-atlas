canonical_text:
  quote: ''
  summary: An ethnographic account describes selected aki^cita receiving instructions
    from chiefs, directing an orderly buffalo hunt, arranging a two-section encirclement
    and chase, hunters marking arrows and seeking the best buffalo, and introduces
    a buffalo-hunt song sung by Gray Hawk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five or more men were selected from among the aki^cita to keep order during
    the hunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The selected men went to the council tent and received final instructions
    from the chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chiefs told the selected men to secure beeves for the helpless, the old,
    cripples, and women who had no one to provide for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The aki^cita directed the people on their journey and required quiet movement
    so the buffalo would not be alarmed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When near the buffalo, other aki^cita were selected, and in an ordinary hunt
    the party was divided into two sections led by about five aki^cita each.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Under aki^cita direction the two sections surrounded the herd and began the
    chase at command.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those who chased the buffalo removed saddles from their horses and prepared
    arrows marked so each man could claim animals he killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the ready call the hunters started rapidly, raising dust; men with fast
    horses tried to take the fattest buffalo and the best animals as trophies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A song of the chase is introduced as sung by Gray Hawk, described as a successful
    buffalo hunter who contributed details to the preceding narrative.
  category: speech
  evidence_refs:
  - ev:6
