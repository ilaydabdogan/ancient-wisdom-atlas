canonical_text:
  quote: ''
  summary: 'The passage concludes a narrative in which a plant is announced as the
    desired child and grows into corn understood as sent by Wakan Tanka. It then describes
    portions of the Teton Sioux Alo''wanpi ceremony for children: a pretended search
    with song, proof of the officiants'' right to perform the rite, carrying children
    to a double lodge, four stops with a wolf howl, face painting, plume adornment,
    and a song performed with rattle, wand, and decorated ears of corn.'
  language: English with Dakota/Lakota terms as transcribed in the source
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker tells the listeners not to fear and says the plant will grow into
    the most beautiful child they have seen; they are instructed to give it air, sunshine,
    and water and to let no other plant or shrub grow near it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listeners understand the plant as the child they had desired and follow
    the instructions they were given.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The plant grows with green covering and whitish hair, becomes tall, and produces
    corn in a green covering; the corn is removed when the covering changes color.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The listeners conclude that Wakan Tanka had sent them something to keep and
    raise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the opening of the ceremony, the ceremonial men come from the double lodge
    to get the children, pretend not to know where the children live, and go through
    the camp singing a search song.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The search song is connected with movement from tent to tent: the singer
    hastens to a tent, pauses, passes on, and repeats the action until reaching the
    destination.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the door of the children's home, the men narrate their past deeds as evidence
    of their right and qualifications to perform the sacred rite before they are allowed
    to enter and get the children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Small children are carried to the double lodge in blankets on the backs of
    the ceremonial men, who stop four times and give the wolf howl as a signal of
    approach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the double lodge, the ceremonial men sit in the place of honor behind the
    pipe rack, and each man's pipe or wand is placed against the rack.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old man paints the girls' faces with blue lines and possible red stripes;
    additional red stripes may be added by a qualified person, with a horse given
    for the right to wear more stripes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A white eagle plume is fastened in the girl's hair, along with red horsehair;
    the plume associated with Weasel Bear's daughter is later shown on a spirit post,
    with duck feathers on the quill tip similar to those on a Sun-dance pipe.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the girls' faces are painted, the ceremonial man holds a rattle in his
    right hand and a decorated wand in his left, waves the wand over the girls while
    singing, and each girl holds a decorated ear of corn.
  category: action
  evidence_refs:
  - ev:9
