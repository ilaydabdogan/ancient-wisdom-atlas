  summary: 'The passage presents technical analysis of Teton Sioux songs: tonal intervals,
    keynotes, vocal rhythm, changes of meter, and drum accompaniment. It reports statistical
    tables and figure captions concerning pitch intervals, song beginnings, measure
    structure, time changes, and drumbeat patterns.'
