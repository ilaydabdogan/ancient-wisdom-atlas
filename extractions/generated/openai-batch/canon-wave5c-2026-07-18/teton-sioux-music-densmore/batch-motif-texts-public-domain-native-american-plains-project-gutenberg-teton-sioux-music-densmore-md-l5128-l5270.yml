literal_observations:
- id: obs:1
  text: The writer states that vocal sounds differing by less than a semitone occur,
    but reports no evidence from about a thousand phonographic song records that such
    sounds form a consciously used system.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports interval statistics, including a largest interval of a
    fourteenth comprising 23 semitones and an average interval of 3.021 semitones,
    slightly more than a minor third.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that larger musical intervals occur less often than smaller
    intervals in the songs under analysis.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that 30 percent of the songs have G, G sharp or A flat,
    and A as their keynotes, and connects this with the natural vocal range of the
    singers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that 61 percent of the songs begin on the accented part
    of the measure, and that a majority begin on tones of the tonic chord.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that accented tones in the phonograph records are usually
    clear, and defines a measure in transcription as the period between two accented
    tones.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports that many songs have changes of time or measure length,
    often affecting single measures or a few measures rather than a whole section.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage distinguishes songs recorded without drum accompaniment from those
