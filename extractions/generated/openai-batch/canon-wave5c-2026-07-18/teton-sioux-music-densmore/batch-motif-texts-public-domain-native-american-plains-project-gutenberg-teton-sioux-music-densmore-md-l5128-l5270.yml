    drum-rhythm percentages.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For songs recorded with drum, the passage reports that 56 percent have drumbeats
    not divided into accented groups, but instead as an unaccented pulsation.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports that in 6 percent of songs with drum the drumbeats are
    accented in groups of two, and in more than 34 percent the drum is in a triple
    division.
  category: attribute
  evidence_refs:
  - ev:7
