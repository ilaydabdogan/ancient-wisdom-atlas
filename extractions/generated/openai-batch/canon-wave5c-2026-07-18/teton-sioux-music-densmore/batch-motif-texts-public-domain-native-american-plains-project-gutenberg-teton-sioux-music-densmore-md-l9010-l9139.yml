canonical_text:
  quote: ''
  summary: The passage gives song text and musical analysis, then describes a ceremonial
    cutting and transport of a tree that becomes a sacred pole. The tree is treated
    as an enemy before falling; medicine men burn sweet grass and offerings are made.
    The pole is trimmed, becomes sacred, and taboos govern its handling and movement.
    A story explains that a woman who stepped over the pole was later killed in a
    horse accident, interpreted as just punishment. Men carry the pole to camp with
    the top forward, while the Intercessor or a representative walks behind. Songs
    sung during the return are described as victory songs.
  language: English with transliterated song text
  quote_policy: summarized
