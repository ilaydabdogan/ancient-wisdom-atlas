  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A song's final measure is transcribed as complete unless repetition begins
    without a time break, in which case a repeat mark is used.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brief pauses in melody are described as often filled with shrill cries, calls,
    or rapidly spoken words, while the drumbeat continues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage identifies the five-toned scales used in the analyses as Helmholtz's
