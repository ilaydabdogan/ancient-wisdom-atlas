literal_observations:
- id: obs:1
  text: Experiments in Berlin with Doctor Stumpf are reported as finding that certain
    larger musical intervals were preferred enlarged and smaller intervals diminished.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many transcriptions are said to result from six or more readings of a phonograph
