canonical_text:
  quote: ''
  summary: 'Eagle Shield explains why the Crow-owners society honors the crow: the
    crow is a model of swiftness and is first to arrive at animal gatherings in the
    Black Hills. Wakaŋ Tanka, printed in the passage with OCR variation, is said to
    have created the Black Hills as an animal meeting place and to have forbidden
    killing animals during their gatherings. The passage also describes the society’s
    membership, lodge, crow-decorated lance, crow-skin necklace, and smoke rites before
    war.'
  language: English
  quote_policy: summarized
