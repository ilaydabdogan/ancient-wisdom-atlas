  quote: ''
  summary: 'The passage analyzes the musical structure and recorded renditions of
    a song. It then describes a remedy used by Eagle Shield for loss of appetite:
    a plant growing near creeks and in gravel, with only the root used, identified
    as Astragalus carolinianus L. The song was sung in connection with the remedy,
    and Eagle Shield said before singing that it was the song of a bear.'
