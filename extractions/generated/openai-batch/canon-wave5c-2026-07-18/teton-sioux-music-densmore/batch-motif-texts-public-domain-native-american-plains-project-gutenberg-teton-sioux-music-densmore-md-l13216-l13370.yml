canonical_text:
  quote: ''
  summary: Brave Buffalo reports a wolf dream while hunting alone. Painted wolves
    encircle him, lead him to a den on a high hill, and teach him means to catch snakes,
    to carry a live snake, and to perform a wolf-dream demonstration with a wolf-skin
    mask, red bent stick, and an owl alighting on his back. Afterward he prays to
    wolves to locate game. A dream-taught song, “Owls Hooting,” is used in treating
    the sick. The passage also records an explanation of the owl’s sacredness for
    some medicine-men, linking it to night movement, dream power, clear sight, and
    gentle healing.
  language: English with transcribed Dakota/Lakota song text and English glosses
  quote_policy: summarized
