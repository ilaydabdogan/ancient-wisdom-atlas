  text: Brave Buffalo said he carried the snake and bent stick in the same hand, with
    the snake coiling around the bow, and released the snake after the demonstration.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The wolves told him that a live owl would alight on his back during the demonstration,
    and Brave Buffalo said this happened.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the dream and demonstration, Brave Buffalo prayed to the wolves when
    he wanted to locate game, and he said they told him where to secure it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A song taught to Brave Buffalo in the dream was later used by him in treating
    the sick, and he said he sang it every night.
  category: action
  evidence_refs:
  - ev:5
