  text: Brave Buffalo states that his wolf dream came while he was hunting alone after
    wandering several days in search of game.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pack of wolves formed a circle around Brave Buffalo; their nostrils and
    paws were painted red.
  category: action
