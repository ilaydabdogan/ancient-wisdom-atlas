  summary: The passage describes Sioux societies as including dream societies and
    military societies. Dream societies are said to consist of men who saw the same
    animal in fasting visions; the shared vision determined membership and restricted
    meetings to those who had dreamed of the society's name-animal. The passage lists
    several named societies and notes cases where dream-society origins and later
    military character overlap.
