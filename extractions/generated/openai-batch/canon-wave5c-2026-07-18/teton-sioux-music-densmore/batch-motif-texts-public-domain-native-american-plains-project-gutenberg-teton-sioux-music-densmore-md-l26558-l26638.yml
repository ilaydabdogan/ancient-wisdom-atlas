  quote: ''
  summary: The passage describes Teton Sioux war-related customs concerning honor,
    rescue of wounded comrades, decorations, black face paint, counting coup, feathers,
    preparation and display of scalps, victory dances and songs, and comparative notes
    on hair ornaments and scalp-preparation usages among neighboring or cited groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man went to war to gain honor and capture horses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Honor could come from loyalty to comrades or from conquering the enemy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who carried a wounded friend or a captive on his back could place a
    specified decoration on his tobacco bag or blanket when he returned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A stranger who saved a wounded man deserted by his kinsman was given special
    honor and called Wawo'Jciyapi, translated as “Helper of the helpless.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Deserting a wounded friend on the warpath was described as the greatest perfidy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: For the Teton Sioux custom described by the informants, the first warrior
    who killed an enemy in an attack had the right to wear black face paint in dances
    after returning from war.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: War songs are said to contain words about seeking the black face paint.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The second warrior to kill an enemy might strike the enemy and, on returning,
    let his hair hang loose but not paint his face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: If a war party defeated the enemy without loss, the first four men who killed
    enemies and their women relatives were permitted to use black face paint, and
    special songs were sung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: A man who killed an enemy without injury to himself could wear an erect feather
    at the back of his head; multiple feathers corresponded to multiple enemies killed
    in the same battle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: A man who struck an enemy could wear a feather horizontally at the back of
    his head, and four men could count coup by striking the same enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: At the final camp, a returning war party prepared captured scalps for use
    in the victory dance.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:13
  text: If present, a man who had dreamed of a carnivorous animal that attacks human
    beings was selected to prepare the scalp.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The selected man scraped flesh from inside the scalp, mixed fat from it with
    gunpowder, rubbed the mixture on his face and hands, sewed the scalp inside a
    small hoop, and fastened it to a pole.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: A human-hair dance ornament obtained among the Sioux is said not to represent
    a Sioux custom; it is attributed to Crow dancing use and later Mandan and Hidatsa
    use.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: The human-hair ornament was said to be made from cut or fallen hair kept for
    that purpose rather than from enemy scalps.
  category: object
  evidence_refs:
  - ev:5
- id: obs:17
  text: A victorious war party approached the village carrying scalps aloft on poles,
    and Dog Eagle said he sang a song when he came in sight of camp and in subsequent
    dances.
  category: sequence
  evidence_refs:
  - ev:6
