canonical_text:
  quote: ''
  summary: The passage presents songs attributed to a Teton Sioux war-party context.
    A song says that a spirit has come with the wind and that something was foretold.
    In the narrative, Eagle Man, a war-party leader and medicine-man, prepares a red-painted
    pebble on a red blanket, sings a song about the four places from which the winds
    blow, and uses the sacred stone to seek news of the enemy. Red Horn offers a pipe
    to the stone and asks it to scout ahead. The stone disappears, returns by morning,
    and reports that the party will meet no more than ten enemies the next day. Human
    scouts then find six men at a water hole; the six escape, but an Omaha man coming
    to join them is killed, with Red Horn and Siya'ka taking counts. A further song
    is described as sung during the demonstration by the sacred stones.
  language: English with Dakota/Lakota song text and glosses
  quote_policy: summarized
