canonical_text:
  quote: ''
  summary: The passage reports a recorded prayer by an aged man addressed to Wakag'taQka,
    describes the prayer's circumstances and gestures, identifies Chased-by-Bears
    as a Sun Dance authority, and presents his explanation that holy talk is preceded
    by offerings and pipe smoking, that Sun Dance body cutting fulfills a vow by giving
    what truly belongs to a person, and that cosmic and natural order show a power
    greater than man.
  language: English translation and ethnographic prose with Dakota/Lakota terms
  quote_policy: summarized
