canonical_text:
  quote: ''
  summary: The passage presents song No. 280, “Hence They Come,” sung by Shooter,
    whose translated words say that when the tribe gathers, those without resources
    obtain the horses of Two White Buffalo, who has said this, and therefore they
    come. It then gives musical analysis and notes recording by several singers with
    sharp yells. Song No. 281, “A Short Time,” sung by Gray Hawk, addresses Two White
    Buffalo, telling him to take courage because he lives only a short time; the analysis
    identifies it as a Strong Heart society song and says praise in that society’s
    songs was a special honor. The passage then introduces comparatively modern love
    songs, including one described as expressing a maid whose parents object to the
    man of her choice.
  language: English with transcribed Teton Sioux song words
