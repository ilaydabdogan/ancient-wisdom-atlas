canonical_text:
  quote: ''
  summary: The passage describes a sacred stone owned by Chased-by-Bears, its wrapping
    with deerskin and powdered herb, its long use as a protective medicine object,
    its former ownership by the medicine-man White Shield, its ability to be recalled
    and to disappear and return, and its transfer after a healing episode involving
    Chased-by-Bears’s daughter. White Shield transfers the stone and its song in exchange
    for a horse.
  language: English
  quote_policy: summarized
