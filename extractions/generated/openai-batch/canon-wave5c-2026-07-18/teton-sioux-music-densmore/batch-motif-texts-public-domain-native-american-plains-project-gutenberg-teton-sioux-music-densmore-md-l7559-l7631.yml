canonical_text:
  quote: ''
  summary: The passage gives biographical notices of several Sioux men connected with
    the Sun dance. It describes Chased-by-Bears as a Leader of the Dancers who performed
    cutting and suspension rites and reported a vision of a painted man beneath the
    sun. It describes Red Bird receiving arm cuts for a Sun-dance vow and being instructed
    for the office of Intercessor. It notes John Grass and Weasel Bear as men selected
    to choose the Sun-dance pole, and recounts Weasel Bear's private vow to give part
    of his flesh to Wakan tanka after success in war, fulfilled by 100 arm gashes.
  language: English with Dakota/Lakota names and terms
  quote_policy: summarized
