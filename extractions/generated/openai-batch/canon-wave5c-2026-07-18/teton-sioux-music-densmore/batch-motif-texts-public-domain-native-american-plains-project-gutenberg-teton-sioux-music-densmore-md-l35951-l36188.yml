literal_observations:
- id: obs:1
  text: Little girls stand one behind another with their hands on the shoulders of
    the girl in front and move around the village in a wavering line while singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The words of the line-play song are not transcribed, but the passage says
    they mean that deer follow each other.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In another play, little girls sit in a circle, place one hand over the next
    girl's hand, and lightly pinch near the wrist until the group falls over laughing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The free translation of the second play song is “I catch but can not hold
    you.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lullaby is said in the passage to be the only lullaby used among the Sioux,
    with translated words telling the child to be still and sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the legend of a maiden who killed herself by leaping from
    a rock is found among many tribes, and that the writer first recorded a story
    and song at Sisseton among the eastern Sioux.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Lake Pepin tradition, a promontory called Maiden Rock is associated
    with a Sioux maiden who leaped from it and was killed on the rocks below.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Standing Rock Teton version, a young woman had promised to marry a
    man who went again on the warpath to make a name for himself, and the returning
    war party said he had been killed by the Crows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Teton version, the maiden dresses in her best attire, goes to the edge
