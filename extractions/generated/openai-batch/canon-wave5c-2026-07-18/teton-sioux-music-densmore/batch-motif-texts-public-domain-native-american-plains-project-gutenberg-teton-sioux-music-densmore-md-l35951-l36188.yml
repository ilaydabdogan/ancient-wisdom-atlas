  quote: ''
  summary: The passage describes Sioux children's play songs, a lullaby, and songs
    connected with the Maiden's Leap legend. It includes girls' line and circle plays,
    the lullaby words for stillness and sleep, and versions of a legend in which a
    maiden leaps from a rock or cliff after the reported death of the man she was
    to marry.
  language: English with some transcribed Sioux song words
