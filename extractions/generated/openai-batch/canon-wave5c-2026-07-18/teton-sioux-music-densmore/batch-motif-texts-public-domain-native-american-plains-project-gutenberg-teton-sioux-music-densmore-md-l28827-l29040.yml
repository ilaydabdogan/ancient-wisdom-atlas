canonical_text:
  quote: ''
  summary: The passage gives song texts and explanatory notes connected with Jaw’s
    night horse-capturing expedition and Eagle Shield’s warpath narratives. Jaw’s
    song asks that his horses be many; the narrative says he captured 70 horses from
    the Crows at night without waking or killing anyone, then returned with his party
    and gave a long wolf howl before a victory song. The passage then introduces Eagle
    Shield’s illustrated personal warpath experiences, including his first fight,
    a Kaŋgi’yuha society drawing and song of reproof, and the beginning of a Sioux
    expedition against the Crows in which horses and scalps are taken.
  language: English with transcribed Sioux/Dakota song words
  quote_policy: summarized
