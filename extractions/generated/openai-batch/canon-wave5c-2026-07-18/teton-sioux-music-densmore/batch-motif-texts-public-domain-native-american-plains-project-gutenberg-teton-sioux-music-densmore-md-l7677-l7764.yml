canonical_text:
  quote: ''
  summary: The passage lists several men connected with the Sun dance, describing
    their tribal affiliations, participation, scars, vows, suspension from the pole,
    buffalo skull carrying, a buffalo dream-name, and medicine-man status. It then
    describes conferences held to gather information about the Sun dance, including
    requirements for a sufficient number of participants, restrictions against curious
    young observers, and Lone Man's statement that recounting the ceremony was sacred
    talk preceded by prayer to Wakag^taQka/Wakag^taijka and followed by favorable
    weather understood as an answer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red Fish is described as a Santee-Yanktonai chief, prominent in tribal councils,
    who took part in the Sun dance twice, at ages 26 and 40.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lone Man is described as a Teton who took part in the Sun dance at ages 20
    and 31, had 100 scars on each arm, helped select the Sun-dance pole on one occasion,
    and sang at the drum on another.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seizes-the-Gun-away-from-Them made a Sun-dance vow while on the warpath, asking
    to conquer enemies, capture horses, and find his friends alive when he returned
    home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In fulfilling his vow, Seizes-the-Gun-away-from-Them was suspended from the
    pole for more than an hour; the flesh did not tear, the sticks broke, the flesh
    was cut, and a tiny portion of flesh was offered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Buffalo Bot carried six buffalo skulls while fulfilling a Sun-dance vow, took
    part in the dance again ten years later, and received his name from a dream in
    which he saw the buffalo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: No Heart is described as a Yanktonai medicine-man able to depict events by
    drawings; he took part in the Sun dance at age 20 and had 100 scars on each arm.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: White-Buffalo-Walking is described as a Teton who took part in the final Sun
    dance in 1882.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The named men were principal informants about the Sun dance, and about 40
    additional men from the Teton, Santee, and Yanktonai divisions were interviewed
    to corroborate and add details.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: For one conference, Thomas Frosted and Robert P. Higheagle were included with
    the writer to complete the desired number; no other persons were allowed in the
    room.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lone Man said that talking about the Sun dance was sacred talk, that at least
    12 persons should be present, and that young people should not come from curiosity.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lone Man said the men reviewed the Sun dance facts, asked Wakag^taQka/Wakag^taijka
    for a true account, prayed that weather would not prevent attendance, and regarded
    the absence of thunder, fair sky, and bright moon as showing that the prayer was
    heard.
  category: speech
  evidence_refs:
  - ev:9
