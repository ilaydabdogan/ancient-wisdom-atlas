canonical_text:
  quote: ''
  summary: A first-person dream narrative attributed to Siya'ka describes an all-night
    vigil, the arrival of an eastern light in the form of a man who becomes a crow
    guide, a visit to a large tent where a red-painted young man welcomes the dreamer
    and speaks of friendship with animals and birds, further transformations into
    owl and elk, instruction about westward petitioning for long life, and songs associated
    with owl, crow, elk, dawn, night, and wind. An editorial footnote also notes buffalo-skull
    color and orientation details in several ceremonies or narratives.
  language: English with Lakota/Dakota song text and English glosses
  quote_policy: summarized
