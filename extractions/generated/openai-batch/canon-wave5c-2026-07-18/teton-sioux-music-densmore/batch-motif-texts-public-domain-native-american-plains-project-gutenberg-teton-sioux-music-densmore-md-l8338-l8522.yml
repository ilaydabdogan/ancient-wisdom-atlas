canonical_text:
  quote: ''
  summary: 'The passage describes preparations and roles associated with the Teton
    Sioux Sun dance: decoration of the Sun-dance pipe, offerings by the Intercessor
    and dancers to Wakantanka, tobacco packets, a performed request-and-acceptance
    sequence involving a pipe and body painting, rehearsals, announcements by the
    Crier, military society dances and feasts, and a commonly used Chief song titled
    “We Are Coming.”'
  language: English with Teton Sioux terms and song text
  quote_policy: summarized
