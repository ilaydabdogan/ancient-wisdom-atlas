- id: obs:1
  text: Men were required to carry live coals in their hands, turn left, walk slowly
    around the lodge, pause at a mellowed-earth space, and finally roll the coals
    onto the softened earth after the fourth round.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who could complete the coal-handling act without being burned was considered
    qualified to be a member of the society.
  category: relationship
