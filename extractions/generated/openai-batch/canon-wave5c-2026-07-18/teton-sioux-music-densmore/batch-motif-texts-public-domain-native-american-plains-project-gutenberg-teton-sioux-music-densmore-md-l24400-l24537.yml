canonical_text:
  quote: ''
  summary: The passage describes a society admission ceremony in which men carry live
    coals around a lodge and place them on a prepared earth space; avoiding burns
    qualifies them for membership. Owl-feather headdresses are smoked over sweet grass
    and placed on the new members while a ceremonial song is sung. After admission,
    a member donates his best horse, commissions paraphernalia, and uses items such
    as an eagle-bone whistle, deer-hoof rattle, and owl-feather adornments. The passage
    also briefly notes a dew-claw rattle used in Sioux dances and introduces the White
    Horse Riders as an old organization distinct from tribal societies.
  language: English with Dakota/Lakota terms and song transcription
  quote_policy: summarized
