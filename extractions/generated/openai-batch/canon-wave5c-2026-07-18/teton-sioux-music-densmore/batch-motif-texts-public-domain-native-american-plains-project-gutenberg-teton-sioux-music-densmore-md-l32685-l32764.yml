  quote: ''
  summary: A music-analysis paragraph describes a short song's tonal material, multiple
    identical renditions, usual repeated performance, shrill cries, and steady drumbeat.
    The passage then records an expert-verified account of cutting up a buffalo cow
    after a hunt, including hide removal for tent or robe use, older and newer cutting
    tools, removal of meat and organs, an eightfold division of meat, and packing
    on horses for transport to camp.
