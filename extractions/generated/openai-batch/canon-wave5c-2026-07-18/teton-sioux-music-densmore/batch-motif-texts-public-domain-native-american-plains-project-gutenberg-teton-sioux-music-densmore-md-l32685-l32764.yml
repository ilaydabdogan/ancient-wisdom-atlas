  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: White Hawk gave a description of cutting up a buffalo cow; the description
    was read to HeHa'kawa'-kita, also called Looking Elk, who pronounced it correct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: White Hawk and Looking Elk were said to be especially proficient in this phase
