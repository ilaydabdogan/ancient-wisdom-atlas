  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: When a hide was to be used for a tent, it was removed whole; the animal was
    turned on its back, with the head turned left and the horns stuck in the ground
    as a brace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In old days a clamshell was used as a skinning knife, and the mother of Eagle
    Shield carried such a tool with its case; later, steel knives were used instead
    of shells.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage gives different cutting sequences for removing a hide for a tent
    and for removing a hide for a robe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A layer of meat was left on the inner surface of the hide and later removed
    by women; the tongue was taken out and considered by the Sioux to be the most
    delicate part of the animal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Beyond hide removal and initial treatment, the passage says there were no
    established rules, though White Hawk said front quarters were usually removed
    first.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The carcass was described as having an outer and inner 'blanket of flesh,'
    with the hump under the outer blanket; the ribs, kidneys, liver, fat, and brains
    were removed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: A fresh hoof was used as a hatchet, and in old days a knife made of the shoulder
    blade was used in cutting up the animal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: An intestinal pocket-shaped piece was turned inside out, fastened, tied, and
    used to hold brains; liver and hump were tied with it, while the paunch held heart,
    kidneys, and fat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Each hunter usually provided two horses to bring home the meat of one buffalo,
    and the meat was divided into eight named portions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: If the hide had been split for a robe, half of it was placed on each horse
    with meat laid or piled on it; if removed whole for a tent, it was made into an
    additional bundle and packed separately.
  category: action
  evidence_refs:
  - ev:9
