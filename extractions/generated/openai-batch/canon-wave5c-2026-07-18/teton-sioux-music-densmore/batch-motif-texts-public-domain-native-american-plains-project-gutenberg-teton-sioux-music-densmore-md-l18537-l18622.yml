canonical_text:
  quote: ''
  summary: 'The passage reports Brave Buffalo''s return from treating a sick person
    and describes curing objects and procedures: a bone used to suck out disease,
    a bowl of water, and a mirror bearing a new moon and star used to see disease.
    Brave Buffalo explains that the new moon is his sign and that his strength follows
    the moon''s phases. The passage also describes a night curing song accompanied
    by smoke offered to the four winds, a wolf dream associated with receiving a song,
    and a further song titled "The Sunrise" with brief musical analysis.'
  language: English with Dakota/Lakota song text transcription and glosses
  quote_policy: summarized
