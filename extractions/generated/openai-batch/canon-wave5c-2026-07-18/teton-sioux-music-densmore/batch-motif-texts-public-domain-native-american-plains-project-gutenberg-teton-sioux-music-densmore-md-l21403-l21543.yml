canonical_text:
  quote: ''
  summary: The passage describes the Buffalo society and Buffalo dance. It reports
    Santee accounts in which men performing the Buffalo dance had visions of buffalo,
    including dreams of being shot and reenacting or marking those dreams in the dance.
    It also describes dancers wearing buffalo-horn headdresses, imitating buffalo
    actions, and carrying a shield. Songs associated with the Buffalo society are
    said to have been received or composed in dreams of buffalo, though some dream
    stories were forgotten. Two song texts include images of walking northward to
    touch a sacred stone and of a goal toward the end of the earth.
  language: English with Dakota/Lakota song text and English glosses
  quote_policy: summarized
