  summary: A Maiden sent by the Buffalo tribe appears to two young men, instructs
    them to prepare a special lodge and ritual objects, punishes one young man after
    impure thoughts, and later enters the Sioux camp at sunrise carrying a pipe and
    is seated in the place of honor.
