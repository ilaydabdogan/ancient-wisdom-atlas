  quote: ''
  summary: The passage presents two Teton Sioux songs and musical analyses. Song No.
    226, sung by Haka'^la, addresses the tribe in relation to helping Two White Buffalo
    and says she has consumed what she had by helping. A note explains that among
    the Sioux it is a high compliment to say a person has been so generous as to give
    away all possessions. Song No. 227, sung by Silent Woman, says that whenever the
    tribe assembles they receive the speaker's horses, and attributes this saying
    to Two White Buffalo. The remaining text gives musical analysis of the songs.
  language: English with transliterated Sioux song text and English glosses
