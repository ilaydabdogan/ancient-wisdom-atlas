  quote: ''
  summary: The passage introduces Densmore's 1911 study of the Sun Dance among Teton
    and Yanktonai Sioux at Standing Rock, lists related Sun Dance or similar ceremony
    sources among several Plains peoples, and gives a biographical account of Red
    Weasel, a Teton authority and Intercessor trained by Dreamer-of-the-Sun. Red Weasel
    describes his training, reverence for Wakan Tanka, and the greater efficacy of
    sung prayer.
