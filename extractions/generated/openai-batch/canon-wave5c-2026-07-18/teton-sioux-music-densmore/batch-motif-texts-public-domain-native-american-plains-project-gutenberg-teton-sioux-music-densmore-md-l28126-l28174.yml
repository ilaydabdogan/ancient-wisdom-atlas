canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from Teton Sioux war-expedition narratives
    and song contexts: Eagle Shield is falsely reported killed but returns unharmed
    with captured horses; he also recalls hunger on expedition. It then introduces
    One Feather, an old warrior and singer, describes his wolf-hide warpath headdress,
    and narrates how as a young scout he killed a Crow man near a Crow camp and sang
    while returning to his comrades.'
