  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warriors acting as scouts or wishing to be unobserved wore a white cloth arranged
    like a blanket, often with eagle feathers at the shoulders; the hands were always
    covered, and sometimes the head was covered by a separate cloth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On seeing an enemy in the distance, a warrior strung his bow, then nearer
