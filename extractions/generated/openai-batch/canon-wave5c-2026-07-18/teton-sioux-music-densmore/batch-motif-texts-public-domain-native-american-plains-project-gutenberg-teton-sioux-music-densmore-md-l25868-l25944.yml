  summary: The passage gives words and notes for a song, a brief musical analysis,
    and an ethnographic description of warriors acting as concealed scouts, preparing
    for open fighting with regalia and war medicine, and receiving medicine-man painting
    accompanied by songs. Little Buffalo is described as a medicine-maker who painted
    warriors, and Bear Eagle is identified as a painted man who recorded two related
    songs.
  language: English with transliterated Dakota/Lakota terms
