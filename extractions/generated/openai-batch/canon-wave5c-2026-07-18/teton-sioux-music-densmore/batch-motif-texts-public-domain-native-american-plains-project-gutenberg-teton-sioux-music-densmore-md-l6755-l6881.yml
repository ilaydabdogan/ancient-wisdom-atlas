canonical_text:
  quote: ''
  summary: 'A song is presented in six renditions. Each rendition refers to an honored
    one and then addresses a being or presence associated with a direction or location:
    above, in the earth, west, north, east, and south. The analysis describes musical
    features of the song. After the ceremony, a decorated pipe or wand and corn become
    the property of the child for whom the ceremony was performed. The Itag''cai)
    depart with the children, pausing four times and giving a wolf call. Rewards are
    given to performers, and the ceremony places a child in a respected position above
    an ordinary child.'
  language: English with transliterated song text and English glosses
  quote_policy: summarized
