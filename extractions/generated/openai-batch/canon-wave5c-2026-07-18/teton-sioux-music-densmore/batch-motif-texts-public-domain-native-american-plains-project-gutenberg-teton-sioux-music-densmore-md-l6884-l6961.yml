canonical_text:
  quote: ''
  summary: The passage describes a decorated calfskin robe associated with a girl
    who had undergone the Alo Vaqpi ceremony and had taken part in the Hugka ceremony.
    Its colors and designs represent blood, success, morning sky, face stripes, a
    spider web, moon phases, camps, and a warrior's path connected with relatives'
    war expeditions. The passage then introduces the Sioux ceremony of Spirit-keeping,
    in which a grieving person keeps a relative's spirit for months or a year, observes
    restrictions, provides gifts and food, and later releases the spirit ceremonially.
    The ceremony is said to derive from the Coming of the White Buffalo Maiden and
    her instructions.
  language: English
  quote_policy: summarized
