canonical_text:
  quote: ''
  summary: 'The passage first discusses memory and interpretation among Indigenous
    singers, including the size of song repertoires and the expectation that a good
    singer perform with authority. It then introduces the section on ceremonies with
    the White Buffalo Calf Pipe narrative: ceremonial acts are said to follow instructions
    of the White Buffalo Maiden, a supernatural being through whose agency the pipe
    was given to the Sioux. The narrative is attributed to Lone Man through interpreter
    Robert P. Higheagle. The narrative begins by describing annual Sioux gatherings,
    their seasonal settings and social purposes, and then a Sans Arc band moving west,
    failing to find game, and sending two young men to search for buffalo and other
    game.'
  language: English
  quote_policy: summarized
