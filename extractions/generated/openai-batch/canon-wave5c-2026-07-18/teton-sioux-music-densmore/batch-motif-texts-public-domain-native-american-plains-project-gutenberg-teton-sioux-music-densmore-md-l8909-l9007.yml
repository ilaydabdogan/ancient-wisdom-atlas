canonical_text:
  quote: The tree was regarded as an enemy
  summary: The passage gives musical information for a song, then describes the ceremonial
    selection, praying over, cutting, and carrying of a tree for the Sun-dance pole.
    The Intercessor prays with a pipe and names four animals at different levels of
    the tree. Four young women or virgins ritually feint at cutting the tree after
    kinsmen recite war deeds, and the first finally fells it toward the south. A song
    for cutting the sacred pole follows.
  language: English
  quote_policy: quoted
