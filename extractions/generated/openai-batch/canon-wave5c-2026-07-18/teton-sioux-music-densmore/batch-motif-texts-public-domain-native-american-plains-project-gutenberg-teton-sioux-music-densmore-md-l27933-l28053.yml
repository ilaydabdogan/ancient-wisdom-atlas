  summary: The passage presents Red Fox's warpath song, described as the words of
    a boy wishing to go on the warpath despite opposition from older brothers, followed
    by musical analysis. It then gives Eagle Shield's personal narrative of organizing
    a winter war party, traveling through snow, scouting a Crow settlement from a
    butte, returning with a wolf howl, undergoing a truth-telling reception involving
    an upright stick and pipe offerings to directions, sky, and earth, and reporting
    the enemy village and horses.
