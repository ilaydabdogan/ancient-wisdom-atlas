canonical_text:
  quote: ''
  summary: The passage analyzes musical structure, tempo, drum rhythm, and syllable
    variation in several songs. It introduces a Braves' Dance song sung by Red Bird
    and explains its reported age through family transmission. It then describes the
    selection, cutting, decorating, and raising of a sacred pole from a tree on the
    morning before the Sun dance, with the tribe present and war songs sung as four
    young men depart to select the tree. A song titled “With Dauntless Courage,” sung
    by Lone Man, is presented with words about the warpath and courage. The passage
    closes by noting another song used in the same connection and before departures
    for the warpath or for searching buffalo.
  language: English with transliterated Teton/Dakota song text
  quote_policy: summarized
