- id: obs:1
  text: A fearful blizzard overtook Old Buffalo’s party near the end of the journey,
    and they stayed two days in a sheltered place in a butte while his leg was painful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the storm subsided, the party saw the enemy village and moved toward
    it at dusk through rocky country compared to the Bad Lands.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many Crows were camped at the village, where dancing was taking place; the
    party approached without being seen, except that dogs barked.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party entered the area where many horses were bunched, drove the herd
    away, later mounted some horses, and counted 53 horses at daylight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second terrible blizzard came the next morning, freezing Old Buffalo’s eyelashes
    and making it difficult for him to see.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old Buffalo saw that the horse tracks made a trail and that the enemy were
