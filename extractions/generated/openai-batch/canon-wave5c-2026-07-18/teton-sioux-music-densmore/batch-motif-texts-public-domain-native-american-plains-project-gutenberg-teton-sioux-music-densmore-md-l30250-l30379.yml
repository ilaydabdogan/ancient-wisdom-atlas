  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After another Crow charge, the Crows retreated, leaving saddles; Old Buffalo’s
    party captured the saddles and found only four horses alive at the earlier place
    of pursuit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old Buffalo helped the wounded boy onto a horse, led the horse through the
