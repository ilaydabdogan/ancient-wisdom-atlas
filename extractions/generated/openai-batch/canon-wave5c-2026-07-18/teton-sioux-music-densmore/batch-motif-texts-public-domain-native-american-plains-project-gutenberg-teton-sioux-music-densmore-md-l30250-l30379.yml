canonical_text:
  quote: ''
  summary: Old Buffalo recounts a war-party journey in which a blizzard forced shelter
    in a butte before the party entered a Crow village at night and drove off horses.
    A second blizzard exposed the horse tracks, the Crows pursued and surrounded the
    party, and a Sioux boy was wounded. During the fight Old Buffalo sang a Fox society
    song titled “I Am the Fox.” The account resumes with the party capturing saddles,
    helping the wounded boy travel by horse and travois, using buffalo for food and
    hide, and reaching the fork of the Missouri River.
  language: English with transcribed Sioux song vocabulary
  quote_policy: summarized
