  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Crows overtook the party, secured most of the captured horses, and surrounded
    the party after it jumped down a steep rocky place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Sioux boy about 15 years old was with the party and was shot in the back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The party fought as long as the sun moved in the sky; every time a gun was
    fired, it turned white with frost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the fight Old Buffalo sang a powerful song of the Fox society, to which
