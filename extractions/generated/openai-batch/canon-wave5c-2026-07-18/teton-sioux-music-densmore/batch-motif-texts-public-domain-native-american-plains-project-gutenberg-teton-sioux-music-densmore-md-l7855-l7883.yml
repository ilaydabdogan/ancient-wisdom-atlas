  summary: The passage describes a sequence of conferences and councils in which men
    and chiefs, including Red Bird and later Red Weasel, reviewed material concerning
    the Sun Dance. Phonograph records were played, the narrative was translated into
    Sioux, details were added and ordered, and material was recorded only when approved
    by the council. Red Weasel recalled Intercessor duties and sang four songs he
    had received with instructions from Dreamer-of-the-Sun.
