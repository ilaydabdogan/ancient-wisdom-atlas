  quote: ''
  summary: The passage presents several Sioux songs with singers, translated song
    words, and musical analysis. It includes an account told by Rev. John Eastman
    about Fierce Face, a Sioux man who voluntarily surrendered to authorities after
    a fatal mistaken attack on white cattle drivers, traveled without escort, was
    praised by camps in song, and is said to have died in prison. The passage states
    that his name and deed are remembered through song. A later song excerpt reports
    a message from the President telling Dakotas to become citizens, with a response
    that Dakota ways cannot be abandoned.
  language: English with Dakota song text and translations
