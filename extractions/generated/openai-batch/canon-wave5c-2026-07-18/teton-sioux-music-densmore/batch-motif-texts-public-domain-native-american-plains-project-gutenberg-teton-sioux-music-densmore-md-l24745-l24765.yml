  summary: The passage explains that joining a war party was not treated as the main
    honor; honor and public demonstration were associated with a victorious return.
    It introduces a sequence of songs for war expeditions, especially ten common war
    songs or “wolf songs” sung before a war party’s departure. Many of these songs
    mention the wolf because a warrior’s life was likened to that of the wolf. Two
    Shields is identified as a recorder of several songs and a leading singer at tribal
    gatherings.
