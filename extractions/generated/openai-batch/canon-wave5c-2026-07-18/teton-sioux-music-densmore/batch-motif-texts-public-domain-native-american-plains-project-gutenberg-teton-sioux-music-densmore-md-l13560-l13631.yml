canonical_text:
  quote: ''
  summary: Siya'ka's first-person narrative explains how a young man sought a dream
    for help. He describes preparation for requesting aid from WakaQ^taQka, consultation
    with a medicine-man, use of robes, tobacco, a decorated pipe, face paint, a sweat
    lodge, a hilltop vigil, four-direction offerings, a buffalo skull with sage, lamenting
    for long life and success, and finally a birdlike sound with a voice saying that
    he is recognized by WakaQ^taQka.
  language: English with Lakota terms in OCR/transliteration
