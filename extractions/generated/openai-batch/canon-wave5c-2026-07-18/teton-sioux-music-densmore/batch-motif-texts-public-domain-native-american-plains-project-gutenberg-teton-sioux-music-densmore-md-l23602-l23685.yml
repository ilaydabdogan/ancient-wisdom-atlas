canonical_text:
  quote: ''
  summary: The passage describes Aki'cita societies among the Oglala and Teton Sioux,
    explains the term as closer to guard or police than warrior, summarizes their
    duties in the buffalo hunt, camp order, punishment, and war-party service, and
    quotes or summarizes historical observers on related police/guard functions among
    Sioux and other Siouan groups. It also notes a separate secret society and describes
    selection and organization of Aki'cita officers, including head Aki'cita and lance
    bearers.
  language: English
