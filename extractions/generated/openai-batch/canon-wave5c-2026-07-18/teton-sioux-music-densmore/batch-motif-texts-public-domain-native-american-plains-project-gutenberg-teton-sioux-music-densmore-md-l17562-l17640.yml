canonical_text:
  quote: ''
  summary: 'The passage gives a glossed song and musical analysis, then reports Bull
    Head’s witnessed account of White Shield using a sacred stone to recover missing
    articles. In a house performance, White Shield holds the stone in his hand, says
    it will disappear, and the stone vanishes. Later a rattle is heard at the door,
    the stone is found on the doorstep, and White Shield hears its message: the missing
    items were taken by a man and thrown into the river, but would be returned that
    night. The next morning the articles are found where last seen, appearing to have
    been under water. The passage also notes that dream songs concerning sacred stones
    include uses for locating an enemy camp and a missing man.'
  language: English with transcribed Teton Sioux/Lakota song text and glosses
  quote_policy: summarized
