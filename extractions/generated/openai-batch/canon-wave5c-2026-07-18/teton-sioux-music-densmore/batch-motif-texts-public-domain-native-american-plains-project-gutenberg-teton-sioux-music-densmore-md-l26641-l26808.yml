canonical_text:
  quote: ''
  summary: The passage presents war-related songs and explanatory notes. One song
    says that an attacking party will return and that a woman stands smiling. The
    prose explains that returning warriors were met by women, that scalps taken in
    war could be given to women of the warrior's family, that women carried scalp
    poles in victory dances, and that the scalps and poles were later placed upright
    on the highest butte with food beside them. Later gatherings allowed a woman to
    carry evidence of her husband's war success. The passage also describes a successful
    young man giving away horses and receiving a manhood name after his first war
    party, and another song says horses are being brought back to an older sister.
  language: English with transcribed song text as printed and English glosses
  quote_policy: summarized
