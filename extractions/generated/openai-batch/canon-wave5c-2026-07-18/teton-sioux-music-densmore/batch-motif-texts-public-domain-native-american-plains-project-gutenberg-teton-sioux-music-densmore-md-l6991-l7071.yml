canonical_text:
  quote: ''
  summary: 'The passage describes procedures and objects connected with a Teton Sioux
    spirit bundle: enclosing hair and sweet grass, wrapping and elevating the bundle,
    preparing a decorated hide wrapping and gifts, placing the bundle on a red-decorated
    tripod outside a spirit lodge, arranging ritual objects inside the tipi, observing
    reverent conduct, burning sweet grass, and moving the tripod and bundle indoors
    at night or in bad weather.'
  language: English
  quote_policy: summarized
