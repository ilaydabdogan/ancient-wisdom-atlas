canonical_text:
  quote: ''
  summary: 'The passage describes Bear Face''s first act of keeping the spirit of
    his deceased son: the boy''s body was placed on a scaffold, a horse was killed
    beneath it, a ritually qualified man purified his hands and knife with sweet grass
    smoke, cut a lock of hair on the fourth motion after three preliminary motions,
    and the lock was wrapped in red cloth for a spirit bundle. It also notes that
    a worn article could substitute for hair, as in Weasel Bear''s use of his daughter''s
    hair ornaments, and describes the spirit-keeper carrying the wrapped packet around
    the camp circle while lamenting to announce the new responsibility.'
  language: English
  quote_policy: summarized
