canonical_text:
  quote: ''
  summary: The passage gives song texts and narrative from Charging Thunder concerning
    a wolf dream. In one song, father and mother come home howling, a calf is brought,
    and the mother returns in a sacred manner. Charging Thunder then narrates seeing
    the old wolf return with a buffalo calf. The old wolf teaches him how to make
    and use a pipe on the warpath, saying its strong smell will conceal his approach
    and help him outwit enemies and steal horses. Charging Thunder says he made and
    carried the pipe successfully; it looked ordinary but had been made sacred by
    a medicine-man. A following song says a different pipe was made for him in a sacred
    manner and that he met a wise spirit. A note explains that making objects sacred
    was attributed to men able to talk with such objects and understand them, and
    describes a medicine-man filling, incensing, and offering a pipe to the sky and
    cardinal points.
  language: English with Dakota/Lakota song text and glossary terms
  quote_policy: summarized
