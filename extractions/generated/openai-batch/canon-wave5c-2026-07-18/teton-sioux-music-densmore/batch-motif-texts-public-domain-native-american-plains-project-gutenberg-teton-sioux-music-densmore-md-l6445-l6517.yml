canonical_text:
  quote: ''
  summary: The passage describes Sioux beliefs about children as gifts from Wakai)^tai)ka,
    parental vows and offerings for a child's welfare, the White Buffalo Maiden as
    a model of purity and as associated with the pipe, the Aiywagpi ceremony and its
    decorated wand or pipestem, woodpecker decoration and its protective association
    with children, and the formal invitation of a man to perform the ceremony by means
    of a sealed buffalo-bladder case containing tobacco packets.
  language: English with transliterated Sioux/Dakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child is described as the greatest gift from Wakai)^tai)ka, given in response
    to prayers, sacrifices, and promises, and as sent through the element of a human
    being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father makes promises or vows to Wakai)^tai)ka, manifested through elements
    of earth and sky, so the child may grow in health and avoid serious misfortune.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A father's love for his child is publicly measured by sacrifices or gifts
    given and ceremonies performed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The White Buffalo Maiden is said to have been sent to the Sioux tribe by the
    Buffalo tribe and to have left an admired impression on parents as a model for
    children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Maiden is described as pure white and without blemish, a quality named
    as the father's desired character for his child.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Maiden is said to have told the people that good things would come by
    means of the pipe, leading to a ceremony connected with the Maiden and the pipe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The essential article in the Aiywagpi ceremony is a decorated wand or pipestem,
    described as representing the pipe associated with the Maiden when the original
    pipe was unavailable.
  category: object
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:8
  text: During the ceremony the leader carries and uses the wand or pipestem, and
    after the ceremony it is given to the child for whom the ceremony was performed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Such pipestems may be handed down for generations; their shape and decoration
    are fixed and not to be changed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wand or pipestem is described as about 20 inches long and decorated with
    tufts and heads of pileated woodpecker, eagle tail feathers in fan form, and strands
    of horsehair.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The woodpecker is explained as a simple, humble bird that stays near its nest
    and is seldom seen; this is linked to children in the ceremony being closely guarded
    and protected.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Parents first declare their wish for the ceremony, then invite a chosen man
    to perform it; if he accepts, he becomes bound to the father by a tie described
    as stronger than natural brotherhood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: For this ceremony the invitation consists of a tied or sealed buffalo-bladder
    case containing small tobacco packets; the invited man accepts by opening it and
    refuses by returning it unopened.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The tobacco packets in the invitation are described as similar to packets
    fastened to sticks as offerings at the Sun dance.
  category: relationship
  evidence_refs:
  - ev:10
