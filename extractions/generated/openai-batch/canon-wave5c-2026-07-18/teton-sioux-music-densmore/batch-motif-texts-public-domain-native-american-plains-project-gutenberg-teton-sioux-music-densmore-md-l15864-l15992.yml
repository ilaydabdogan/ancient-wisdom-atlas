canonical_text:
  quote: ''
  summary: 'The passage gives a sacred-stone song sung by Chased-by-Bears, glossed
    as saying that all the sacred stones come to see the addressee. It then reports
    musical analysis and an ethnographic narrative: after Chased-by-Bears parted with
    a sacred stone and its song, he suffered paralysis attributed to that action;
    arrangements were made to return the stone, to identify herbs used with it, and
    his health improved. Local authorities said he should not have sold a stone when
    he had only one, since a medicine-man might sell helpers of a special stone but
    not the stone that was the center of his power. A footnote compares paralysis
    after offense to a Chippewa belief about offending the manido.'
  language: English with Dakota/Lakota song text and glosses
  quote_policy: summarized
