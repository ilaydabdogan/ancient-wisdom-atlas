canonical_text:
  quote: ''
  summary: The passage gives song texts and glosses concerning an older sister and
    horses, musical analysis of recorded renditions, and Old Buffalo's account of
    a winter war expedition against the Crows after horses were stolen, including
    the theft of his older sister's horse. Old Buffalo and Swift Dog confer with the
    writer, and Old Buffalo frames the recalled material as something called back
    from the dead. Old Buffalo narrates gathering a party of thirteen, traveling in
    severe winter conditions without shelter, singing a wolf song nightly, and later
    gives a song of self-reliance about depending on his own courage while looking
    for horses.
  language: English with Sioux/Lakota song vocabulary and glosses
  quote_policy: summarized
