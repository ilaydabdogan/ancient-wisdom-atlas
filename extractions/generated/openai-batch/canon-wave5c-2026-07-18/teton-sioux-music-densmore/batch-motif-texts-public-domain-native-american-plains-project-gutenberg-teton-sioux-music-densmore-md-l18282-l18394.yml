  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a sacred-stone healer was called to a sick person, he was expected to
    demonstrate supernatural power before witnesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sick person filled a pipe and gave it to the medicine-man, who smoked
    it before being bound with thongs, sinews, and a hide.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The tent was dark while the medicine-man sang songs addressed to the sacred
    stones and also sang his own dream songs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the darkness, strange sounds were heard, objects were felt flying through
