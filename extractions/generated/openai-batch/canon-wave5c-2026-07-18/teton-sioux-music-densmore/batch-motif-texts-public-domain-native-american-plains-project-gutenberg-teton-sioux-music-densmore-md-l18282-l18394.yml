canonical_text:
  quote: ''
  summary: The passage classifies song plots associated with sacred stones and then
    describes Sioux treatment of sickness as dream-authorized practice. It distinguishes
    treatment by sacred stones, conjuring, and herbs; describes specialist roles;
    reports restrictions on certain practices; and narrates a sacred-stone healing
    demonstration involving a pipe, binding, darkness, songs, animal voices, a buffalo,
    firelight, and use of a stone to locate illness.
  language: English
  quote_policy: summarized
