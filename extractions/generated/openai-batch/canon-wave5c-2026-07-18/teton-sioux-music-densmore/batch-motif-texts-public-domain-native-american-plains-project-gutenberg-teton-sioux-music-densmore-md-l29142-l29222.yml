  quote: ''
  summary: The passage gives brief musical description, then narrates a Sioux raid
    in Assiniboin country during the ripe-cherry season. A group of cherry pickers
    is attacked; Assiniboin from camp attempt unsuccessfully to save them. Men are
    killed, women escape except one woman captured by Eagle Shield and taken to the
    Sioux camp. The following autumn she escapes and returns to her people. A song
    titled “Captives I Am Bringing,” sung by Eagle Shield, is presented as celebrating
    the victory.
