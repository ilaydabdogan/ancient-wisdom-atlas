canonical_text:
  quote: ''
  summary: The passage explains that the hoop carried by an elk dreamer is called
    a rainbow because the visible rainbow has the shape of a hoop while part is in
    clouds and part disappears into the ground. The term is associated with medicine-men
    and dreamers of air and earth elements. The elk dreamer’s hoop is sacred and carried
    around the neck or on the shoulder. The passage then gives songs Nos. 105-107,
    including a song in which a sacred hoop or rainbow “wears” the speaker, a song
    about one’s life, and a song whose words identify the speaker as an elk.
  language: English with transcribed Teton Sioux/Lakota song words
  quote_policy: summarized
