  summary: The passage describes a healing regimen centered on the sweat bath, heated
    stones, sprinkled water, light diet, rest, and dream-seen herbs. It also describes
    Sioux medicine-men, a gourd rattle used in treating the sick, medicine bags containing
    herbs and treatment articles, practices for protecting such bags, and a note comparing
    a similar rattle to a Menomini buffalo-calling charm.
