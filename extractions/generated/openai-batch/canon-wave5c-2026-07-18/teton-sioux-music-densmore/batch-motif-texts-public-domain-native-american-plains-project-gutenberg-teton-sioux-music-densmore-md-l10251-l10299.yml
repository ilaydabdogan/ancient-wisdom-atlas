canonical_text:
  quote: ''
  summary: 'The passage describes forms of participation in the Sim-dance: women may
    fast, stand beside a dancing relative, assume part of a vow, or provide gifts
    and feasts. Male dancers undergo fasting from food and water, dance facing the
    sun until exhaustion, and may fulfill vows through arm cutting or suspension from
    a pole by thongs attached through chest flesh. The passage also describes ritual
    specialists, assistants, tools, offerings of flesh toward the sky, kin sharing
    of vowed cuts, and scars left by cutting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women sometimes participate by fasting, standing beside a dancing relative,
    or assuming part of a relative's vow by allowing their arms to be cut.
  category: action
  evidence_refs:
