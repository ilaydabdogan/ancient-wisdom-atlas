  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The simplest form of the dance requires abstaining from food and water, dancing
    with face raised to the sun from morning until night, continuing at night and
    the following day, and stopping when exhausted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dancer who vowed arm cutting leaves the dancers' line, sits beside the pole
    for the operation, and resumes dancing afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The number of arm cuts varies from 10 to 100 or 200 according to the man's
    vow, with relatives sometimes assuming part of larger numbers.
