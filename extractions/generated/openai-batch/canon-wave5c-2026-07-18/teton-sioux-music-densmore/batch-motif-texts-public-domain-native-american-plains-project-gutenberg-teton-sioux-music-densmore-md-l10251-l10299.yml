  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cutting may leave small regularly ordered dot-like scars or broad white scars
    from gashes.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Lone Man is reported as saying he vowed 200 gashes, and his relatives divided
    half the number among themselves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: For suspension from the pole, chest flesh is lifted, pierced with an awl,
