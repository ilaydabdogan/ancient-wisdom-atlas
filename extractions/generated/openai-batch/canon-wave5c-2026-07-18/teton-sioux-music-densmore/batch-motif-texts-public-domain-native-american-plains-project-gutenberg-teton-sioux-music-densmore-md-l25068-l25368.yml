canonical_text:
  quote: ''
  summary: The passage gives lyrics, glosses, performer names, and musical analyses
    for several Teton Sioux songs. The song texts include an address to friends while
    a younger brother comes on the warpath; a speaker who considers himself a wolf
    and is hungry, tired, or afraid of the night when owls hoot; a speaker seeking
    adventures in all lands and walking amid hardships; a prayer to Wakan Tanka in
    which horses are granted; and the beginning of a song titled “Those Hills I Trod
    Upon.” The analyses describe melodic intervals, rhythmic units, five-toned scales,
    and comparisons with Chippewa songs or with a preceding song.
  language: English with Lakota/Dakota song words and glosses
  quote_policy: summarized
