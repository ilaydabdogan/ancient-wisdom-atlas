canonical_text:
  quote: ''
  summary: 'A first-person narrator recounts a winter horse raid on a Crow camp: the
    party caches food, approaches by buttes and creek, takes horses, flees with the
    herd, confronts pursuers from a ravine and ridge, uses concealment and shouting
    to seem numerous, and returns home. The passage then begins a note about a Sioux
    custom of sending a man ahead with a false report to a returning war party’s village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party received food, ate while keeping blankets tied down, and waited
    only to put on dry moccasins before continuing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the journey toward the Crow village, the party hung food in trees so
    it could be found on the return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party saw its tracks in the snow, reached sight of the Crow village at
    daybreak, stayed on a butte during the day, and later moved by a creek to a second
    butte overlooking the camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before entering the Crow camp, the party put on fresh moccasins, tightened
    belts, and arranged buffalo-hair lariats.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator told the others not to take too many horses, because a wide track
    in the snow would lead pursuers to them, and told the first to reach the food
    cache to wait for the others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The party secured twenty-one horses; the narrator had six, a companion rode
    one and led four, and a mule followed and joined them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the meeting place, two delayed men warned that the Crow camp had seen them
    and that people there were getting on horses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The party drove the herd through intense cold, traveled all night, watched
    for pursuit, made a fire the next morning, and put on dry moccasins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After a lookout said the Crows were on their trail, the narrator told the
    group to stand their ground and move the horses into a rough ravine ending in
    large rocks.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The party crawled to the ridge, lay flat in a spaced-out line, removed blankets,
    and readied guns while watching for the Crows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the Crow pursuers came near while following the horses' tracks, the party
    sprang up, yelled, and fired; the Crows fled, leaving one dead man and one horse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator told the companions to stay hidden and keep shooting so the Crows
    would think there were many of them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some men shouted a challenge to the Crows during the day; scouts later reported
