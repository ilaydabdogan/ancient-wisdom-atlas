  summary: The passage describes the author's field and analytical methods for collecting,
    vetting, transcribing, and analyzing Sioux songs at Standing Rock. It discusses
    phonograph recording, singer reliability, informant vetting, an incident in which
    material from an objected-to informant was removed, interview precautions, and
    musical interval analysis. It does not present a mythic narrative or symbolic
    episode.
  language: English
