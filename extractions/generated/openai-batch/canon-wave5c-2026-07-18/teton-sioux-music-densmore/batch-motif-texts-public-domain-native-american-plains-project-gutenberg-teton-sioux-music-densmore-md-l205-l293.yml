literal_observations:
- id: obs:1
  text: Sioux songs were collected by phonograph recording and transcribed from the
    phonograph record using ordinary musical notation with additional special signs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The transcriptions are described as approximating the tones produced by singers
    as closely as possible within familiar notation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some accidental duplicate song records were transcribed to show slight differences
    when a song was sung by different capable singers or by the same singer at different
    times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a song was known to be imperfectly rendered, another record could be
    made by a better singer, and the second record alone was considered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Indians distinguished good, indifferent, and totally
    unreliable singers, and that the writer could often distinguish them by comparing
    phonograph records.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The writer attempted to employ only the best singers and selected singers
    and informants partly by checking their reputations at the agency office, trader's
    store, and among their own people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Material that seemed interesting was sometimes discarded when an informant
    was found unreliable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In one incident, data concerning the Sun dance were recorded through another
    interpreter while Mr. Higheagle was absent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Mr. Higheagle returned, he reported that John Grass and other prominent
