canonical_text:
  quote: ''
  summary: The passage reports auditory interval tests for Chippewa and Sioux persons,
    then discusses music as a cultivated art among Chippewa and Sioux. It describes
    recognized standards for good singers and songs, old songs said to be composed
    in dreams through a supposedly supernatural process, isolation away from camp
    as a condition for inspiration, musical unity in dream-received songs, lack of
    unity in a collaboratively made song, structural differences between older and
    more recent songs, a younger singer regularizing an older Chippewa song’s rhythm,
    and an incomplete statement about restrictions on singing songs connected with
    ceremonial acts.
  language: English
  quote_policy: summarized
