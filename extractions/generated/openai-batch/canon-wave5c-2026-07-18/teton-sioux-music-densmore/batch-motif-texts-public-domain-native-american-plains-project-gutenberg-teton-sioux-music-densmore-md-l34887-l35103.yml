  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The song titled They Are Charging Them was sung by Kills-at-Night and includes
    translated phrases about charging, looking back, and friends.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The analysis of They Are Charging Them describes a compass of seventeen tones,
