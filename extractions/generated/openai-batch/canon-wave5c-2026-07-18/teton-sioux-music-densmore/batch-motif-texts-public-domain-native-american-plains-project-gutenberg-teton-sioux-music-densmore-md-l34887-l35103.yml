canonical_text:
  quote: ''
  summary: 'The passage describes grass-dance practices: men and women dance separately;
    women may summon men into the circle and gifts are exchanged as marks of honor;
    women may recount brave deeds and applaud with a high cry. At the end of men''s
    dances, a selected man performs a solo closing section called dancing the tail.
    The tail dancer must have done a brave deed, and an informant connects the practice
    to an honor dance associated with war service or rescue. The passage then gives
    song texts, translations, singers, and musical analyses, including a song whose
    words occur only in the tail section.'
  language: English with transcribed and translated Lakota/Dakota song text
  quote_policy: summarized
