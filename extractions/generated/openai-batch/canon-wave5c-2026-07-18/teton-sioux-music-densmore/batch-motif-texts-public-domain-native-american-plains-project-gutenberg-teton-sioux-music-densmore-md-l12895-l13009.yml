canonical_text:
  quote: ''
  summary: Brave Buffalo recounts a dream in which a buffalo tells him to follow along
    an upward path not touching the earth to a buffalo-hide tent filled with buffalo.
    A chief buffalo says he has been selected to represent the buffalo, and the buffalo
    give him a cane and a song through which he receives power to practice medicine.
    The dream buffalo also foretell a long life and instruct him that, after qualifying
    himself, he can demonstrate that weapons cannot harm him. On waking, he prepares
    a buffalo-hide tent, wears a buffalo hide with head and horns, and undergoes tests
    in which arrows and later guns fail to injure him. The passage also includes the
    song text, gloss, and musical analysis.
  language: English with Dakota/Lakota song text and glosses
  quote_policy: summarized
