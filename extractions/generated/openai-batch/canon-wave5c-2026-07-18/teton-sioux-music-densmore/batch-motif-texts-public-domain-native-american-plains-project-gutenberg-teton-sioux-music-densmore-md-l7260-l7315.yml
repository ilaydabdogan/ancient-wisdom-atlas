canonical_text:
  quote: ''
  summary: The passage describes a spirit-keeping conclusion in which a white buffalo
    robe is laid over a buffalo effigy, valuables are placed on it, and the robe and
    articles are transferred to an assisting society. Weasel Bear recounts that he
    and his wife gave away tipi materials and other possessions, retained only the
    spirit post, were later helped by relatives, and continued food-giving associated
    with care for the spirit post. He attributes these practices to the white buffalo.
    The passage then introduces the Sun Dance by noting the prominence of the sun
    in Native mythologies, a Natchez belief in a sun-connected sky deity, widespread
    North American worship of such a deity, and the Sun Dance among certain Plains
    tribes.
  language: English
  quote_policy: summarized
