canonical_text:
  quote: ''
  summary: The passage describes Sun-dance ordeal practices, including treatment of
    wounds, continued fasting and dancing, assistance with pipe and whistle, orientation
    toward the sun, enforcement by ritual supervisors, participation by female relatives,
    a song composed by White Robe during her brother's vow fulfillment, collective
    reverence and prayer, feasting and mourning at the tribal gathering, and a lamentation
    song commemorating Sitting Crow.
  language: English, with transcribed Lakota/Dakota names and song words
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a man was freed from torture by the breaking of the flesh, a powdered
    medicine was applied to the wound, and the passage says wounds healed readily
    and scars appeared slight relative to the ordeal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the medicine was applied, the man returned to the dancers and continued
    fasting and dancing until exhausted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men who painted the dancer sometimes held a pipe for him and put his whistle
    into his mouth because participants were not allowed to touch objects while dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each man danced in one place, turned continually to face the sun, raised his
    face toward it, and moved rhythmically on the ball of his foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At rest intervals the drummers stopped and dancers could stand, sit, or smoke
    briefly; if dancers hesitated to resume, the men who cut the arms and supervised
    vows forced them to their feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women whose relatives were fulfilling vows frequently danced beside them for
    part of the time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: White Robe said she composed a song while taking part in a Sun-dance in which
    her brother was fulfilling a vow.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: White Robe's brother had vowed that, if successful in a raid against the Crows,
    he would be suspended from the pole and have 200 cuts made on his arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: White Robe and her sister assumed half of the 200 cuts, each having her arms
    cut 50 times, while female relatives danced and the women learned and sang White
    Robe's song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The glossed words of the song include Climbing Eagle saying that Wakantanka
    should pity him, that he will live for a long time, and that he stands enduring.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Aged members of the tribe sat in the shade house on the outer edge of the
    dancing circle, and spectators were expected to join the Intercessor's prayer
    with their hearts.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: During the larger gathering, some people rejoiced, others lamented chiefs
    or warriors who had died, relatives provided feasts, and songs of lamentation
    were heard in camp.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A lamentation song used at a Sun dance commemorated Sitting Crow, a Sioux
    warrior killed in a fight with the Crows.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The glossed words of the lamentation song say that Sitting Crow is lying in
    the way he wished to lie.
  category: speech
  evidence_refs:
  - ev:12
