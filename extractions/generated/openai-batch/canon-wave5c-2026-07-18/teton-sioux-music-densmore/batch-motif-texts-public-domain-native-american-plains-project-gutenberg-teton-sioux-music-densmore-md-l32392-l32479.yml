canonical_text:
  quote: ''
  summary: 'The passage describes the construction and use of buffalo bows and arrows:
    bow shape and materials, arrow-point materials across generations, feathering,
    shaft length, incised flight-guiding lines, polishing stones, personal marks,
    smearing arrow shafts with buffalo blood, quiver capacity, arrow makers, and the
    occurrence of buffalo hunts before moving camp.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buffalo bows varied by individual, but shared a placement for fitting the
    arrow nearer the upper end, with the lower section longer and thicker than the
    upper.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bow materials included hardwoods such as cherry, plum, crab apple, sinew backing,
    buffalo-hide glue, and a bowstring made from twisted and dried buffalo-bull sinew.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'White Hawk described three arrow-point materials in a generational sequence:
    cut flint used by his great-grandfather, bone used by his father, and steel used
    by himself.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arrow feathers came from several kinds of birds; feathers were split, smoothed,
    and three were fastened to each arrow with glue and deer-sinew wrappings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bow quality was described by the depth to which an arrow would penetrate a
    buffalo, ranging from embedding the point to passing through the animal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man's buffalo arrow length was measured from parts of his own arm and hand,
    and light flexible shaft woods were preferred so the arrow could bend without
    breaking and be reused.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lines were cut into the arrow shaft to make it travel straight; White Hawk
    said the correct cutting method came from long experience.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After feathering, attaching the point, and cutting lines, the arrow shaft
    was polished with paired grooved whetstones said to come from the Black Hills;
    the stones were cleaned and wrapped in buckskin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each man had a special mark or device for his arrows, including use of particular
    feathers, red paint, a blue section, or dents in the shaft.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: As a final process, the arrow shaft was smeared with buffalo blood, which
    White Hawk said made the arrow pass more smoothly through the animal's tissues.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Most quivers held ten arrows; a man might make his own quiver but often ordered
    arrows from an arrow maker, and Red Fox was known as a skillful arrowmaker.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that a buffalo hunt frequently occurred when the tribe
    was about to move to a new camping place, and introduces Siya'ka as a speaker
    describing such a hunt.
  category: setting
  evidence_refs:
  - ev:9
