  summary: 'The passage first tabulates a comparison of metric units for voice and
    drum in a set of songs. It then describes Sioux dance lodges, including an older
    lodge type and a Standing Rock Reservation lodge witnessed in 1912, and reports
    that dancing restrictions led to the latter being torn down. The passage states
    that Indian dances imitate animals: grass dance movements imitate eagles and graceful
    birds, buffalo dance movements imitate buffalo, costumes and headdresses imitate
