canonical_text:
  quote: four times to the earth I prayed
  summary: 'The passage presents a Sun Dance song titled “Song of Preparing the Sacred
    Place,” sung by Red Bird, with a gloss describing prayer to the earth four times
    and preparation of a place for the tribe to behold. It then analyzes the melody
    and describes the ritual sequence: after a sacred pole and sacred place were prepared,
    a shade-house was built around the Sundance circle with posts, poles, buffalo
    hides, and fresh boughs. Old people, relatives of dancers, and spectators sat
    beneath it. On the morning of the Sun Dance, participants ate a full meal and
    then entered the vapor lodge.'
