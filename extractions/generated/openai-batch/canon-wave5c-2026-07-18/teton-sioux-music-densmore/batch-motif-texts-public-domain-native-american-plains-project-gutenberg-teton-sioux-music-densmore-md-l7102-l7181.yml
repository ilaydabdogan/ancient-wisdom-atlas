canonical_text:
  quote: ''
  summary: 'The passage describes preparations for a Teton Sioux spirit-releasing
    ceremony: gifts and feast supplies are collected, a helper assists the spirit-keeper,
    societies participate in outside feasts, ceremonial leaders are appointed, mourning
    attire is laid aside, and a cottonwood spirit post is made, adorned, dressed with
    the deceased person''s garments, purified, and ritually fed. Appeals for aid may
    be made in the spirit''s name during the feeding.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives helped gather gifts for the final feast, and women made many articles
    by hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A helper called a laborer leader carried messages, supplied wood and water,
    swept the lodge, kept the area around the spirit bundle clean, and cut and dried
    red willow for later distribution.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who kept a spirit was invited to society feasts and was expected to
    attend; when presents were given away he was expected to receive one first.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In return for favors from societies, the spirit-keeper invited those societies
    to attend feasts held outside the lodge when the spirit was released.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The period for keeping a spirit varied from several months to a year or longer,
    ending with a final ceremony and feast called the completion of the undertaking.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: All the band gathered for the event, and the various societies had special
    tents; societies took part in outside-lodge features but did not enter the lodge
    unless their members had themselves kept spirits.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: If several spirits were to be released, the first man who had announced an
    intention to keep a spirit was considered leader of the spirit-keepers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the morning of the spirit releasing, the leader sent a filled pipe to an
    old man designated as master of the whole ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Weasel Bear said that on the release day he laid aside signs of mourning,
    painted himself gaily, wore fine attire and a war-honor feather, and his wife
    dressed like a young girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: One man was selected for each spirit to prepare the spirit post and perform
    ceremony parts for that individual spirit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The spirit post was made in the spirit lodge, generally from cottonwood according
    to Weasel Bear.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The man making the post sat facing east, whittled upward with the knife moving
    away from him, and purified his hands and knife with sweet grass smoke beforehand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A post for a child's spirit was smaller than one for an adult spirit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The described post was made by Weasel Bear to represent the one used when
    the spirit of his little girl was released.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The post's facial features were worked with beads on buckskin, with paint
    lines appropriate for a girl who had gone through the Alo'wagpi ceremony, and
    a feather associated with that ceremony.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: After the post features were made, each assistant opened a case holding clothing
    to be put on the posts; the clothing had been worn by the person whose spirit
    was to be released.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the ceremony, the garments placed on the posts were given to the man
    who painted the post.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: A woman in charge of cooking brought food and placed a plate before each spirit
    post after purifying the food in sweet grass smoke.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Each assistant held a round piece of pounded meat to the painted mouth on
    a spirit post.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: During the feeding of the spirits, an orphan or another person in need could
    ask in the spirit's name to be fed and cared for; such requests were not refused,
    with four opportunities given.
  category: speech
  evidence_refs:
  - ev:8
