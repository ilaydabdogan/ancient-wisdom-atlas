canonical_text:
  quote: he removed the disease from the person's body by sucking it out
  summary: 'The passage describes Santee and related medicine-man or conjuring practices
    for treating sickness: a conjuror attempts to remove illness by sucking, uses
    fire, water, root, red paint, animal-like actions, repeated performance, and receives
    payment; a second account describes summoning a medicine-man with a black-painted
    pipe and eagle feather.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In many instances of treating the sick by conjuring, no medicines were given;
    the conjuror claimed to remove disease from the body by sucking it out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mrs. James McLaughlin reported witnessing a Santee demonstration on the Devils
    Lake Reservation in North Dakota.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A conjuror named Sip'to, also called Beads, attempted to cure a boy suffering
    from hemorrhages of the lungs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sip'to was described as an old man wearing only a breechcloth, with his body
    and face painted red and his hair short and loose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sick boy lay in a tipi; the passage says conjuring had to be done on bare
    ground, and that floors could be cut away in a log house for this purpose.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Inside the tipi, the conjuror sat in the place of honor opposite the door
    on smooth bare ground, with the boy's head near him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fire with many red coals was in the middle of the lodge, and a young girl
    brought water and placed it beside the conjuror.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The conjuror rinsed his mouth, chewed a piece of root, removed a coal from
    the fire with a stick, held it, and put it in his mouth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The conjuror dropped on all fours, tore up the ground with fingers and toes
    as though they were claws, cried like an animal, and approached the boy as though
    he were a wild beast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: With the coal still in his mouth, the conjuror sucked over the boy's chest
    until blood came to the surface, then made a whistling and puffing sound and spat
    into a dish partly filled with water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the performance, the conjuror sat down sweating heavily, and the boy
    immediately had a hemorrhage from the lungs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The same performance was enacted four times, and after each time the boy had
    a hemorrhage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boy said the treatment was making him worse, and the boy's father asked
    the conjuror not to continue working over him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The boy's father gave the conjuror a horse, with the stated Santee belief
    that sickness will return if the doctor is not paid.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Used-as-a-Shield gave an account of somewhat similar treatment that included
    medicine and described his own experience receiving treatment by a conjurer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: To summon a medicine-man, black paint made ordinarily with charcoal was smeared
    on the stem of a pipe, and an eagle feather was tied next to the mouthpiece.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: A messenger carried the painted pipe to the medicine-man's lodge with the
    bowl next to him; if the medicine-man was home, the messenger entered turning
    left and silently handed him the pipe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The medicine-man smoked the pipe as a token of assent, and the passage says
    a request to visit a sick person was not refused unless the medicine-man was physically
    unable to go.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: If the medicine-man was absent, the messenger left the pipe in the place of
    honor with the bowl toward the door, and the medicine-man's relatives tried to
    find him as soon as possible.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: A footnote states that similar demonstrations were made by medicine-men of
    other tribes and cites a description of the custom among the Chippewa.
  category: other
  evidence_refs:
  - ev:8
