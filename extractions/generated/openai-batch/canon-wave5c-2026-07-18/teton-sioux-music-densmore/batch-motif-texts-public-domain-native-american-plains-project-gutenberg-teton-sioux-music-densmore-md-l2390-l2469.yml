canonical_text:
  quote: ''
  summary: The passage classifies Group II of Teton Sioux songs as mostly recent songs
    and lists its divisions, including recent military-society songs, buffalo hunt,
    council and Chief songs, Sun dance songs, dance and game songs, honor songs, and
    miscellaneous songs. It then compares older and more modern song groups by musical
    features such as mode, beginning and ending tones, scale content, range, harmonic
    structure, accidentals, melodic direction, interval averages, and pitch.
  language: English
  quote_policy: summarized
