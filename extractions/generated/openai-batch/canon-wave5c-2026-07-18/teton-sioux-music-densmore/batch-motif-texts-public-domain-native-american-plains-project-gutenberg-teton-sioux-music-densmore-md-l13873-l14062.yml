  text: After a dream on a hilltop some distance from camp, Siya'ka returned home,
    took a sweat bath, and told the dream to a medicine-man in a lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Siya'ka said he had been a young man and eager to go on the warpath and make
    a name for himself.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Siya'ka said that after the dream his stronghold was in the east, while the
    west was also a source of help.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Siya'ka said the birds and insects seen in his dream were beings on which
    he should keep his mind and whose ways he should learn.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Siya'ka said the elk was brave, helped women, and, together with the birds
    and insects, was one of his helpers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Siya'ka said he never killed or ate elk, would not kill birds that continually
