canonical_text:
  quote: ''
  summary: 'The passage first gives Siya''ka''s account of returning from a hilltop
    dream, taking a sweat bath, telling the dream to a medicine-man, and understanding
    birds, insects, elk, and the east and west as sources of guidance or help. It
    then gives a tribal dream/tradition related by Two Shields: a war party hears
    a song, discovers the singer is an aged wolf, feeds him buffalo meat, learns his
    song, and this is identified as the beginning of Sioux wolf songs or war songs
    and the custom of carrying a wolf-skin medicine bag. The bag is also reported
    to come to life, walk about camp, and sing the first wolf song.'
  language: English with Lakota/Dakota song text and English glosses
  quote_policy: summarized
literal_observations:
