  summary: The passage states that children imitate older people, citing children's
    war games in which boys held a sham fight and girls sang about relatives wounded
    on the warpath. It then introduces a section on old ceremonial songs, noting songs
    for Alo'waijpi, Spirit-keeping, and Sun-dance ceremonies, restrictions on who
    may sing them, a Spirit-keeping song connected with the Gift of the White Buffalo
    Calf Pipe, and Sun-dance songs sung only by the Intercessor as part of his qualifying
    instructions.
