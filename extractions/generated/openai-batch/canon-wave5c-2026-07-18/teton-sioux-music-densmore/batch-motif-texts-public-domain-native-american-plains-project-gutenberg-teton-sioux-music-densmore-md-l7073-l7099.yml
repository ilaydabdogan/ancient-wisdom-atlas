canonical_text:
  quote: ''
  summary: The passage describes a white buffalo robe used in a spirit-keeping context.
    The robe is placed in a place of honor in the lodge, supports the tripod and spirit
    bundle, signifies purity, and is subject to handling restrictions. Only qualified
    ritual specialists may touch or move it, with an exception for children who have
    gone through the Hunka ceremony. Bear Face reports having such a robe while keeping
    his son's spirit. Weasel Bear reports that during spirit-keeping the contents
    of the lodge were treated as belonging to the tribe, so requested materials such
    as tobacco and wild willow were given.
  language: English
  quote_policy: summarized
