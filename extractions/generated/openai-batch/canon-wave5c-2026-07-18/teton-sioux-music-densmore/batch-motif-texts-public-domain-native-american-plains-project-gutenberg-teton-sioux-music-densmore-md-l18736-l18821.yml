canonical_text:
  quote: ''
  summary: The passage describes medicine pouches, animal parts, herb packets, and
    healing practices associated with Teton Sioux medicine practitioners. Earth-medicine
    Woman reports her uncle's use of eagle claw and elk bone remedies. Eagle Shield
    says he received knowledge of herbs from the bear and the badger, used a bear
    claw in treating the sick, and carried medicines in animal-skin pouches and packets.
    The passage also states that doctors did not claim remedies for every disease,
    but used remedies revealed by animals or acquired from other medicine-men.
  language: English
  quote_policy: summarized
