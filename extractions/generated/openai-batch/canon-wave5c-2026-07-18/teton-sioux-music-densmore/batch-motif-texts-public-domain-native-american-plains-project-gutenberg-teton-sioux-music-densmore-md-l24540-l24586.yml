canonical_text:
  quote: ''
  summary: The passage describes the White Horse Riders as principally old warriors
    who rode white horses and painted them to show brave deeds. It explains common
    horse decorations, describes an admired parade custom involving visits to wounded
    war veterans and food placed in the camp circle for people without someone to
    cook for them, and notes that the society's songs were popular and sometimes altered
    by substituting names.
  language: ''
