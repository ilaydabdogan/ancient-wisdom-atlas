canonical_text:
  quote: ''
  summary: 'The passage describes offices within several societies: a pair associated
    with two leaders is known in some groups as bonnet bearers and in others as pipe
    bearers, with similar functions. The two ranking pairs are sometimes called four
    chiefs in charge of the organization. Two whip bearers occur in all societies
    except the kaQgi^yuha. Food passers, drummers, and singers are said to be generally
    uniform across the societies, leading to the conclusion that the societies were
    brought near to one organizational type.'
  language: English with Indigenous terms
