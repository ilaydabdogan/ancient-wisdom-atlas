canonical_text:
  quote: ''
  summary: The passage presents several song contexts. In the first, Metal Knee and
    men on the warpath hear singing near a hill, discover a wolf singing, and learn
    its song. The wolf song’s four renditions describe roaming at daybreak with changing
    movement and caution. A later song is said to concern a buffalo dream, though
    the dream story is lost; its words mention a buffalo, a voice sent forth, and
    walking toward Blackbird or Swallow nations. Another song and explanation link
    deer, eagle, scarlet bait, blue vision, and animal nations coming.
  language: English with transcribed Dakota/Lakota song terms
  quote_policy: summarized
