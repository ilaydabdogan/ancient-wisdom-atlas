canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Teton Sioux spirit-lodge ceremony:
    gifts are displayed and distributed, societies and community members receive goods,
    children may be named or have ears pierced, a restricted lodge rite involves a
    pipe, sweet grass, a buffalo chip, and fourfold motions, the White Buffalo Maiden
    is invoked in relation to the pipe, spirit bundles are opened to release spirits,
    and a white buffalo robe may be carried from the lodge by qualified participants.'
  language: English, with Indigenous terms transcribed in the source
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the work inside the spirit lodge was finished, accumulated gifts were
    distributed to people in the camp; the gifts had already been exhibited on frames
    holding belts, moccasins, leggings, and other articles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit-keeper sent gifts to societies that preserved order in the camp,
    and the gift to a society was described as roughly equal in value to gifts received
    from that society and divisible among its members.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Weasel Bear said he gave a war bonnet to the Tokala society, and the feathers
    were distributed among the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The occasion included much feasting, public naming of children by prominent
    families, and piercing of children's ears in the same manner as at the Sun dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremony within the lodge was not studied in detail; only former spirit-keepers
    were allowed to enter, and the selected officiant was prepared with songs and
    prayers and was qualified to give lamentations for the dead.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a white buffalo robe was used, song No. 1 was sung, and a filled pipe was
    placed beside a round space of mellowed earth in the spirit lodge.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man appointed to light the pipe placed lighted sweet grass on a buffalo
    chip with four downward motions, then moved it four times in a circle with the
    sun before placing it on the chip.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The officiant held the pipe in the ascending smoke and repeated words attributed
    to the White Buffalo Maiden when she appeared to the Sioux; the speech itself
    was not recorded.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pipe was presented to Weasel Bear with a statement that it had been brought
    by a woman and that drawing it would lead him to be straight and truthful like
    the stem of the pipe.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The pipe was passed around the lodge toward the left; after it was smoked
    out, the pipe lighter pretended three times to empty ashes on the buffalo chip
    and emptied them with the fourth motion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the ceremony, spirit bundles lay beside their respective spirit posts;
    the actual release of the spirits came when the bundles were opened by the officiant.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The officiant removed wrapping from a spirit bundle in four acts, giving brief
    discourse between removals; the final unwrapping occurred about an hour before
    sunset, and Weasel Bear said the spirit of his child departed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The lock of hair or other nucleus object from the spirit bundle was kept by
    the family; selected articles were kept by the officiant, the remainder was distributed
    in the lodge, and the spirit-keeper and wife gave away nearly all they possessed
    except their clothing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: If a white buffalo robe had been used, there was interest in who would carry
    it out of the lodge; a qualified man could do this, and children who had been
    through the Alo Vagpi ceremony could help carry it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Qualifications for carrying the white buffalo robe included uprightness of
    life and former possession of a white buffalo robe.
  category: attribute
  evidence_refs:
  - ev:11
