canonical_text:
  quote: ''
  summary: Bear Necklace uses sacred stones in a darkened tent ritual to learn the
    fate of an absent war party. Bound and wrapped, he sings and tells dreams; the
    tent trembles, medicine articles fall, his cords loosen, and small round stones
    appear. Sitting Bull offers a buffalo robe to the stones, asks for fame, and receives
    a buckskin-wrapped stone to wear. The stones are said to provide correct information
    about the killed, survivors, and return date. The accompanying song glosses describe
    winds from named directions and round stones flying toward observers.
  language: English with transcribed song words and English glosses
  quote_policy: summarized
