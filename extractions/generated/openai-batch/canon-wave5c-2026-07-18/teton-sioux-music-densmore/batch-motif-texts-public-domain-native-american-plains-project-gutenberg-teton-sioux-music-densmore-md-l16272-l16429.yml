- id: obs:1
  text: Bear Necklace found stones, could talk to them, and depended on them for help.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A war party had been absent for two months, no news had been received, and
    the people feared all were killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people asked Bear Necklace to use the sacred stones to ascertain what
    had happened to the war party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bear Necklace asked to have his arms, fingers, and toes tied, was wrapped
    in a buffalo robe and ropes, and was placed beneath suspended medicine articles
    in a darkened tent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bear Necklace sang and told his dreams; the tent trembled, suspended articles
    fell, his cords loosened, and he stood free.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A row of four or five small round stones appeared after the medicine articles
    fell and were ready to tell Bear Necklace what he wanted to know.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sitting Bull made an offering of a buffalo robe to the sacred stones, asked
    to become famous, received one stone wrapped in buckskin, wore it around his neck,
    and was buried with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bear Necklace gave correct information about the absent war party, and the
    stones were said afterward to report names of those killed, names of survivors,
    and the day of return.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the song refers to stones passing through the air in the
    darkened tent during an exhibition of Bear Necklace's power.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says a person who did not believe in the stones' power was frequently
    struck by stones or other objects in the spirit-filled darkness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The song glosses mention wind blowing from directions associated with sunset,
    the home of the giant, and sunrise, and mention round stones flying toward the
