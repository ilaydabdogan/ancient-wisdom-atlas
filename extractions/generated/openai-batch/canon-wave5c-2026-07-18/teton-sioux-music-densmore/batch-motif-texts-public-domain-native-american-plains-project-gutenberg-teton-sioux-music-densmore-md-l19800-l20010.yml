canonical_text:
  quote: ''
  summary: 'The passage first summarizes Eagle Shield''s child remedies, then describes
    Bear-with-White-Paw''s healing practice: his appearance while treating the sick,
    his drum and decorated drumstick, a necklace with medicine bags and a bear''s
    claw, the use of the claw on patients, bear-derived knowledge of herbs, a supplication
    to the bear, and one healing song used with all the herbs.'
  language: English with transcribed Sioux/Lakota ritual language and song vocabulary
  quote_policy: summarized
