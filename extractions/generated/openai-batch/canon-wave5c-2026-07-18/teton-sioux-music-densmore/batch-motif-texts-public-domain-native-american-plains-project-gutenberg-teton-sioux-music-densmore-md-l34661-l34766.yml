canonical_text:
  quote: ''
  summary: The passage describes the Grass Dance as a widely distributed northern
    Plains dance associated in earlier accounts with the Omaha Hethu'shka society,
    warrior valor, grass or crow-belt regalia, and later social-dance forms. It cites
    Omaha, Yankton Sioux, Teton Sioux, Oglala Sioux, Sisseton Sioux, Blackfoot, Piegan,
    Crow, Gros Ventre, Assiniboin, Menomini, and Chippewa comparisons or attestations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Grass Dance is described as existing among all tribes of the northern
    plains at the time of writing, and its name 'Omaha' is said to identify it with
    the Omaha tribe from which many other tribes received it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In transmission, the dance is said to have lost its earlier significance and
    become simply a social dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dance is reported by Fletcher to have originally been connected with the
    Omaha Hethu'shka society, whose object was to stimulate an heroic spirit and keep
    alive the memory of historic and valorous acts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Fletcher's description of an Omaha meeting, members wore only breechcloths
    and fastened a long bunch of grass to the back of the belt, representing scalps
    the wearer had taken.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fletcher's description states that the Omaha leader had to be of sufficient
    rank to wear 'the crow,' a high-order decoration.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: De Smet describes the Yankton Grass band or Pejimahinnanka as a fraternity
    including braves or 'men of heart.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In De Smet's account, each member at ceremonial dances carries a long bunch
    of grass, described as an emblem of abundance and charity, and wears a braided
    grass badge at the waist in the form of a long tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explicitly notes that the grass is used in both accounts but that
    different symbolism is assigned to it.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: La Flesche is quoted as saying that Yankton Hethu'shka songs, steps, bodily
    actions, and rhythm were the same as those of the Omaha, except for certain preliminary
    ceremonies later omitted.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: La Flesche states that until very recent times only men danced the Hethu'shka
    because it was strictly a warrior's dance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bushotter includes the Grass Dance among intrusive dances occurring in camp
    while a Sun Dance was in progress and mentions grass worn at the dancer's belt.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wissler found an Oglala Sioux society called the Omaha, identified with the
    Grass Dance, where crow belts were worn but grass was not mentioned.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage reports that a feather-tail belt seems to have been generally
    considered part of Grass Dance regalia among listed northern Plains tribes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that similarities exist between Grass Dance accounts and
    descriptions of the Dream Dance among the Menomini and Chippewa, including presenting
    the pipe to the sky, drum position in the dancing circle, crow belts, and divorce
    custom in connection with the society ceremony.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: 'At Standing Rock Reservation, two kinds of Grass Dance are reported: the
    old men''s Grass Dance and the young men''s Grass Dance.'
  category: relationship
  evidence_refs:
  - ev:10
