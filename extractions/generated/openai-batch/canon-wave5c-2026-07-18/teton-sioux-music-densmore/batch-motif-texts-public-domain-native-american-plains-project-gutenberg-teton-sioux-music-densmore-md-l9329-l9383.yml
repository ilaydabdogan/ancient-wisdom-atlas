canonical_text:
  quote: ''
  summary: The passage first analyzes a song’s melody, rhythm, text continuity, and
    relation to medicine songs. It then describes the Sun-dance pole, its crossbar,
    offerings, effigies, suspension cords, top covering, the Intercessor’s placement
    of buffalo fat and low prayer at the pole hole, the silent and then vocal communal
    response during raising, and the transmission of three related songs by an elderly
    former Intercessor.
  language: English, with OCR corruption
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The melody is described as using only tones of the minor triad and fourth,
    with a long rhythmic unit and two shorter six-measure periods consisting chiefly
    of quarter notes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The words are continuous throughout the song, a feature said to occur more
    often in medicine songs among Chippewa and Sioux than in other song classes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun-dance pole is described as usually about 35 feet long and 6 to 8 inches
    in diameter, with a man-length crossbar tied securely to a short branch left on
    the pole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the intersection of pole and crossbar, a decorated rawhide bag wrapped
    in cherry branches is tied with rawhide thongs as one of the offerings made by
    the Leader of the Dancers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the larger bag is a smaller tanned buffalo-hide bag containing a large
    piece of buffalo hump on a sharpened red-painted cottonwood stick.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mato'-kuwa' (Chased-by-Bears) explains that the cottonwood stick symbolized
    both the arrow that killed the buffalo and the picket stake used for a stolen
    enemy horse when brought to camp.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two rawhide effigies, one in the form of an Indian and one in the form of
    a buffalo, are fastened to the crossbar and are said to indicate that the enemy
    and the buffalo were conquered by supernatural help.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Thongs or cords are fastened to the crossbar for suspending men; the two ends
    of each cord are to be fastened to sticks passed through the flesh of a man’s
    chest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A tanned robe of buffalo calfskin is hung at the top of the pole, while later
    ceremonies use a red cloth banner instead.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: After planting the sacred pole, the Intercessor examines the prepared hole,
    places an abundance of buffalo fat in it, and is said to pray and speak in a low
    voice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At the command to raise the pole, the assembled people remain silent while
    men slowly and carefully raise it; once it is in place, people cheer and weep,
    and three songs are sung.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The three songs were recorded by an elderly Teton Sioux man said to be the
    only living person who had held the office of Intercessor; the songs were part
    of instructions he had received from the man who preceded him in that office.
  category: relationship
  evidence_refs:
  - ev:10
