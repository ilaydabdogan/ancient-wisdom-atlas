canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing preparations for the Sun dance: a buffalo
    skull placed on sage near the council tent; medicine-men praying for fair weather
    with song, sweet grass, coals, pipes, and offerings to sky, earth, and cardinal
    points; a fair-weather song associated with Dreamer-of-the-Sun and sung by Red
    Bird; musical analysis of the song; and notes on camp vigilance, greetings, war
    tales, and warrior vows.'
  language: English with transcribed Teton Sioux song text and English glosses
  quote_policy: summarized
