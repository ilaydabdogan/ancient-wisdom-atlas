canonical_text:
  quote: ''
  summary: The passage gives a legend and song connected with Ghost Hill, a high butte
    near Fort Yates. A handsome young man disappears from a winter camp; his parents
    consult a man with sacred stones, hear and follow the young man's voice, learn
    that jealous men killed him, and later see a gray-blanketed figure moving toward
    Ghost Hill. The body is never found. The passage also gives the ghost song, its
    gloss, and notes on its recording by Two Shields.
  language: English, with Dakota/Lakota song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghost Hill is described as a high butte about eight miles southeast of Fort
    Yates, and the legend and song are said to be connected with it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sitting Bull and his band are said to have camped for one winter on lowland
    beside the Missouri River below Fort Yates.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A particularly handsome young man in the camp disappeared, and no trace of
    him could be found.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man's parents gave a horse to a man who had sacred stones and asked
    him to tell them about their son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man with sacred stones said the missing man's voice would be heard during
    the next night and that everyone should follow it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before dawn the camp heard the young man's voice; his parents and friends
    recognized it, lamented, and dogs barked as if a person were approaching.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The voice passed through the camp singing a love song, turned back toward
    Ghost Hill, and became too distant for the people to follow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After another horse was given, the man with sacred stones said the young man
    had been murdered by ten jealous men and predicted that they would die one by
    one at ten-day intervals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The predicted deaths of the ten men are said to have occurred.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man with sacred stones later said the young man had been chased, killed
    far from home, and devoured by wolves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The parents were told to follow the recurring voice until it disappeared,
    where they would see their son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The parents saw a figure wrapped in a gray Army blanket, followed it, and
    were never able to overtake it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The figure moved toward Ghost Hill and was thought to disappear in the side
    of the hill; digging and searching did not find the body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Walking Elk lived at the foot of Ghost Hill, attributed repeated family deaths
    to the ghost, and shot at it with a rifle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The last appearance of the ghost is dated to about 1889, and a similar gray-blanketed
    figure was later reported at Pine Ridge and Rosebud Reservation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Two Shields recorded the ghost song after receiving a valuable pipe made from
