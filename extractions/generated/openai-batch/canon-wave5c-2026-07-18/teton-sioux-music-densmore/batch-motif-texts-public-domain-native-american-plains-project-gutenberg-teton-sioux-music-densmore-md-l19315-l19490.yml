canonical_text:
  quote: ''
  summary: The passage describes Eagle Shield's treatment of fractures with plant
    medicine, grease, warming over coals, rubbing, parfleche splints, and matted deer
    hair, together with a song said to be sung before applying the medicine. It also
    describes a kidney-disease remedy said to have been imparted by the bear, with
    instructions for a wild-lettuce decoction and a treatment song addressing the
    bear as father.
  language: English with Sioux song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eagle Shield is described as a specialist in treating broken bones.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: For fractures, Eagle Shield used an herb mixed with soft grease, warmed his
    coated hands over coals, and rubbed the flesh above the broken bone; the treatment
    was repeated three times daily until healed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When an arm or leg was first broken, Eagle Shield said he pulled it until
    the bone slipped into place and then covered it with a parfleche case laced with
    thongs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eagle Shield used a small parfleche splint with soft flannel for a broken
    wrist and held a greased matted portion of shed deer hair while rubbing fractures.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fracture-treatment song was sung four times while preparing to apply the
    medicine, and its gloss includes an invitation to a friend to come and the statement
    that the bear told the singer this.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: A separate kidney-disease remedy was said to have been imparted to Eagle Shield
    by the bear and used a prairie plant identified as Lactuca pulchella, prepared
    as a decoction.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The kidney remedy was to be taken three times a day, not left standing overnight,
    and was said to relieve pain after reaching the affected spot, usually by six
    doses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A song was sung four times during treatment with the kidney remedy; in the
    song the bear is addressed as father and asked to send a voice.
  category: speech
  evidence_refs:
  - ev:7
