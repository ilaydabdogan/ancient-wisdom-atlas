canonical_text:
  quote: ''
  summary: 'Lone Man recounts a dream encounter with horsemen or riders in a cloud:
    after attacking an enemy who becomes a reed in water, he receives recognition,
    instructions about water beings, a song concerning the earth, protection by sacred
    stones, and later a charm. He prays to Great Grandfather before singing, and explains
    a charm song involving the swallow, thunderstorm, thunderbird, and the desired
    swiftness of a warrior''s horse.'
  language: English, with Dakota/Lakota song and prayer text plus English translations
  quote_policy: summarized
