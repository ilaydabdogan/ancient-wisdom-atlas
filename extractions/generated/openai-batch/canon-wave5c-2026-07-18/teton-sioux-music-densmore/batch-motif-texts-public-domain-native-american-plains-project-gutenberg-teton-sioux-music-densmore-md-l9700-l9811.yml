canonical_text:
  quote: ''
  summary: 'The passage gives Song No. 18, connected with a final visit to the vapor
    lodge, and includes translated song words about sending a voice, being heard,
    and living. It then analyzes the melody and describes Sun Dance dancers after
    the vapor bath: their painting by selected men, color symbolism connected with
    the sky, Teal Duck''s painted designs and regalia, hair ornaments, clothing, eagle-bone
    whistle, bodily restrictions, and assembly in dancers'' lodges to await the Crier.'
  language: English with Dakota/Lakota song text and names
  quote_policy: summarized
