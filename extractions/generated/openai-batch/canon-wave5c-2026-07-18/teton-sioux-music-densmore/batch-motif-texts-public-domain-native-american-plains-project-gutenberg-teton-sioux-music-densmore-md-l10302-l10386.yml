canonical_text:
  quote: ''
  summary: 'The passage describes articles and bodily ordeals used in the Teton Sioux
    Sun Dance: suspension by thongs through flesh, use of a knife, sticks, eagle-bone
    whistles, buffalo skulls, horses given for release, and more severe forms of suspension.
    It also records that dancers prayed for the tribe, especially the sick and old,
    and gives Red Bird’s explanation that public fulfillment of vows was believed
    to bring benefits and divine responsiveness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who had often held an office in the Sun Dance stated that he used
    a knife with the blade ground to a point and rawhide wrapping on the handle and
    part of the blade.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suspension thongs were usually long enough to let only the man’s toes touch
    the ground, and each newly suspended man was given a stick to raise his body slightly
    and ease chest strain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After discarding the stick, attempts at rest or stopping the motion of dancing
    increased the suffering.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men were suspended soon after 9 o’clock in the morning on the north side
    of the pole with upraised faces in the full glare of the sun.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The suspended men were expected to try to free themselves as soon as possible,
    sometimes doing so within half an hour and seldom remaining more than an hour
    according to informants cited in the passage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a man could not free himself by dancing, he or his relatives might give
    horses for his release, after which the cutter could cut through the flesh partially
    or entirely.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a man could not free himself and no required horses were given, he was
    jerked downward until the flesh gave way.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While suspended, each man held an eagle-bone whistle in his mouth and blew
    it from time to time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man who vowed to take part in the Sun Dance by carrying buffalo skulls could
    carry from two to eight skulls attached to flesh by sticks and buffalo-hide thongs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The buffalo skulls were suspended through their nostril openings, and the
    man danced until tearing flesh released the skull.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When several buffalo skulls were used, their weight made standing erect impossible,
    so the man leaned forward on a stick and danced in a bowed position.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Buffalo Boy stated that he carried six buffalo skulls for four or five hours
    and was then freed by cutting the flesh after the proper number of horses had
    been given.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A more severe form of torture suspended the body clear of the ground by thongs
    through flesh on each side of the lower back.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The most severe described form suspended the body between four poles by thongs
    through flesh of both chest and back, with only the toes touching the ground.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: While dancing, the men prayed for all in the tribe, especially the sick and
    the old.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Red Bird stated that a warrior fulfilling his vow wanted the whole tribe to
    share its benefits and believed Wakan Tanka was more ready to grant requests of
    those who made and fulfilled vows.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Red Bird stated that a public act was believed to be more effective than the
    same thing done privately.
  category: speech
  evidence_refs:
  - ev:11
