  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In a second expedition, Old Buffalo planned a horse raid and left camp secretly
    with one volunteer while others slept.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the expedition, they sang a song while hoping to capture many horses; the
    gloss names Crow Indians, looking for them, finding them, and bringing home their
    horses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old Buffalo and his companion approached the Crow village near dark by a creek,
