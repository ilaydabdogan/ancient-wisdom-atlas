  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A horse snorted, Crow people came with guns, Old Buffalo's horse was shot
    and fell, and his companion initially ran away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The companion later called Old Buffalo to safety, carried him double on his
