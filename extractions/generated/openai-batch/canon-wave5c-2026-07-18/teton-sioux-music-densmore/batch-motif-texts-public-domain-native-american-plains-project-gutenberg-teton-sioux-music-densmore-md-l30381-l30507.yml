  quote: ''
  summary: Old Buffalo narrates care for a sick boy during return from a warpath,
    the boy's reunion with his parents, the boy's death and name, and then a separate
    horse-stealing expedition against Crow people, including a song, stealth approach,
    attack, escape, and discovery of Old Buffalo's dead horse.
  language: English, with transcribed Sioux/Dakota song text and glosses
  quote_policy: summarized
