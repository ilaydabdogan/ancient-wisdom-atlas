  summary: The passage introduces a group of council songs sung when chiefs met in
    a decorated council tent inside the camp circle to decide tribal matters. It presents
    songs and glosses associated with Many Wounds, Siya'ka, and Used-as-a-Shield,
    including a song of dead chiefs, an old council song about fearlessness amid difficulties,
    a song about doing one's part in accomplishing council decisions, and a song about
    adopting ancestral customs. Musicological analyses of the songs follow the transcriptions.
