canonical_text:
  quote: ''
  summary: The passage records Lone Man's account of remembering a dream of riders
    in the clouds during danger, painting his horse with lightning marks, praying
    to a great grandfather, and singing. It then gives song texts and musical analyses,
    followed by Lone Man's explanation that a dream of thunderbirds left him feeling
    unworthy, sacredly influenced, and desiring public humiliation like others who
    dream of thunderbirds.
  language: English with transcribed Indigenous-language prayer and song text plus
    English glosses
  quote_policy: summarized
