canonical_text:
  quote: ''
  summary: Charging Thunder recounts a dream of thunderbirds who appeared as mounted
    men. Before the dream he asked permission to go hunting, traveled alone near Timber
    Lake, saw a deer, waited, fell asleep, and dreamed. In the dream the deer continued
    toward him, mounted riders appeared behind it, he became one of the riders, was
    told to lead and charge a pursued object, identified the object as a wolf, and
    was told he had been chosen because he would one day need the riders' protection.
  language: English
  quote_policy: summarized
