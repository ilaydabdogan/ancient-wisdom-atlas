canonical_text:
  quote: ''
  summary: The passage introduces a group of love songs connected with war and states
    that, in earlier times, love songs were associated with a man's qualification
    to wed through success in war or the buffalo hunt. It presents two recorded renditions
    of the same song by Two Shields and Siya'ka. In one version, the speaker promises
    marriage when the addressee's name is heard announced among the victors; in the
    other, the speaker promises marriage when the addressee returns from the warpath.
    The passage also notes similarities in melody progressions and rhythmic unit between
    the renditions.
  language: English with transcribed Dakota/Lakota song text
  quote_policy: summarized
