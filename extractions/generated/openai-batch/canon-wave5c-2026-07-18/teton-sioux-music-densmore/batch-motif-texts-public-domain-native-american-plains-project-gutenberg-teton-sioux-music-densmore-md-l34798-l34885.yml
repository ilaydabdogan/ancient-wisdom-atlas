canonical_text:
  quote: ''
  summary: 'The passage describes a Teton Sioux whistle used in dances and courtship,
    its construction and bird-head carving, and its signaling role in continuing dance-song
    repetitions. It then records Kills-at-Night''s description of the Standing Rock
    Sioux grass dance: its stated origin from the Omaha, adaptation of songs into
    Sioux, required feast, appointed cooks and foods, a dog-meat and bone sequence
    involving four young men, drum placement, and the rule that a lost article such
    as a fallen feather must be redeemed by gifts to old men before return.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wooden whistle-like instrument, often made of ash or box elder, had an open
    end usually carved to represent a bird head and was called by a Teton Sioux name
    glossed as referring to a large prairie chicken.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instrument was said to be used in dances, especially the grass dance,
    and also by young men as a courting call.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plain bone whistles and bead-decorated whistles were also used in dances and
    known by the same name in the passage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Three or four dancers might carry whistles, but the recognized leader of the
    dancers usually gave the signal by blowing his whistle when he wanted singing
    and dancing to continue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The instrument is described as an open pipe with a whistle or flageolet mouthpiece
    and a harmonic series comparable to that of a bugle or trumpet.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A footnote description says the lower end of one example was carved to represent
    a crane with an open beak, with the throat as the open end of the whistle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kills-at-Night described the Standing Rock Sioux grass dance and stated that
    the dance came from the Omaha; at first its songs were Omaha, then Sioux words
    were sung to carefully repeated melodies, and later Sioux melodies and words were
    used.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A feast is always held at a grass dance, with designated people notified by
    a Crier and not asked to provide for two successive feasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Appointed cooks bring foods such as dried berries or grapes, wild turnips,
    sweet corn prepared with ashes and bone fat, and sometimes dog.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: If dog is provided, the head and chest are cut into four pieces and placed
    in a large dish for four selected young men to eat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the four young men finish eating, the bones are piled, and each young
    man dances four times around the pile, extending his hand over the bones as he
    passes near them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a grass dance the drum is outside the circle of dancers near the men's
    side of the assembly, and a few women sing with the men at the drum.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: A lost article must be redeemed with a gift; if a feather falls, the party
    dances around it, one or more men strike it, and each gives a present to an old
    man before the feather is returned to its owner.
  category: sequence
  evidence_refs:
  - ev:8
