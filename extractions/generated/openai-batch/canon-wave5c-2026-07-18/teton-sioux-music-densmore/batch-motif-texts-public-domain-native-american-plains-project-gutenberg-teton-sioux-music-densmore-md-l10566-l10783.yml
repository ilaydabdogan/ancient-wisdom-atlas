  summary: The passage gives musical analysis, describes children’s public ear-piercing
    in the Sun Dance as a vow-related honor involving gifts and redistribution, presents
    a Noon Song concerning holy beholding at points of the sun’s course, and recounts
    Red Bird’s explanation of a song about an Intercessor’s dream of the rising sun
    and a hoop-and-feather ornament linked to the sun, moon, eagle, crane, and hawk.
  language: English with Teton Sioux/Lakota song words and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five recorded renditions of a song are described as entirely uniform, with
    musical comments on upward progressions, intonation, minor thirds, and a five-toned
    scale.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children participated in the Sun Dance through ear-piercing, often in fulfillment
    of a parental vow made in connection with a child’s illness and survival until
    the next Sun Dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The child’s ear-piercing was considered an honor and required gifts, making
    it unavailable to poorer members of the tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ear-piercing was done publicly by an experienced person or, in some cases,
    by the Intercessor with assistants; parents gave gifts such as horses, goods,
    furs, robes, and a pillow, and used articles were left for the poor of the tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ear was originally pierced with a bone awl, later with metal, and copper
    was inserted after the puncture; one or both ears could be pierced, with more
    than one hole if desired.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Children whose ears were pierced were considered somewhat related in status
    to men whose flesh was lacerated in the Sun Dance, and relatives held feasts in
    honor of the event.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At about noon on either the first or second day of dancing, the Intercessor
    sang a song while the drum was silent and the assembly listened.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Noon Song’s glossed words refer to holiness and beholding at places connected
    with the sun rising, passing on its course, and turning back.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A separate song was sung by the Intercessor while drummers rested and the
    people listened attentively; Red Bird explained it as concerning a dream of an
    Intercessor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the dream, an Intercessor saw the rising sun with rays streaming around
    it and made an ornament representing this vision; at first only he wore it, and
    later others did.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'The ornament is described as a hoop with lightly fastened feathers: the hoop
