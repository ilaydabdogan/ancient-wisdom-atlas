    thunderbird; a note that a warrior might strike a companion before entering an
    enemy camp to show willingness to die in that companion's place; a song about
    honor and personal desire; a fight song stating that the earth alone endures;
    and a narrative of a young man who went on the warpath after a false report about
    his intended bride and asked comrades to tell her that he hoped to be killed.
