canonical_text:
  quote: When I was about 22 years of age I dreamed that I came to a wolf den and
    found the little wolves unprotected by either father or mother.
  summary: 'The passage introduces Charging Thunder’s three animal dreams: thunderbirds,
    wolves, and buffalo. It states that he fulfilled dream obligations and received
    benefit, though the dreams did not require him to practice medicine. In the wolf
    dream, he comes to a wolf den, finds young wolves without their parents, hears
    them indicate that they are helpless but their parents will return, and learns
    their song. A note says a similar dream was recorded by J. Owen Dorsey.'
  language: English
