canonical_text:
  quote: "“Give me strength for long life, and strength to be right and honest in
    all I do.”"
  summary: 'A first-person speaker describes fulfilling a vow to Wakaŋtaŋka through
    a ritual ordeal: preparation in a steam-filled branch lodge with sage, wearing
    a heavy buffalo robe, walking barefoot with a decorated pipe to a distant hill,
    keeping vigil with a buffalo skull, following the sun with the pipe, praying for
    strength, placing red cloth at the four directions, and leaving the ritual objects
    and offerings on the hill.'
