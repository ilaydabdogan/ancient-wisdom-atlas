canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Sun Dance ceremony: a procession enters
    the circle with ceremonial pipes and a painted buffalo skull; attention and prayer
    are directed to the cardinal points; the skull and a sealed pipe are placed near
    exposed earth and sage; the Intercessor burns sweet grass, smokes a pipe, and
    extends it toward sky, earth, and the directions; an explanation links the action
    to offerings to Wakai)Hai)ka, gratitude to earth, and peace with the four winds.
    Men fulfilling vows stand and dance facing the sun with raised hands while the
    assembly laments. The opening song and drum pattern are introduced.'
  language: English
  quote_policy: summarized
