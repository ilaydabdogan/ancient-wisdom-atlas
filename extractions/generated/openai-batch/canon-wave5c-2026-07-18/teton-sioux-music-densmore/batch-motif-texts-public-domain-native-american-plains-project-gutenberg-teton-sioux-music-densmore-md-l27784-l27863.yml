canonical_text:
  quote: ''
  summary: Red Fox recounts that as a boy he disobeyed his mother's warning and followed
    a war party. On the expedition he was teased with false news that his mother had
    hanged herself, saw the bodies of Sioux killed by enemies, vowed revenge, and
    identifies this as the beginning of his career as a warrior. After he returned,
    his mother gave him moccasins and watched him closely.
  language: English
