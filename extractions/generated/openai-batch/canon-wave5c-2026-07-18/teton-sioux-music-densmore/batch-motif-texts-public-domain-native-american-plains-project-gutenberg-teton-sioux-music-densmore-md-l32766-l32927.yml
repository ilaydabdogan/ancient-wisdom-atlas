  summary: The passage describes Sioux buffalo hunting food preparation, a medicine-man's
    song and ceremony to secure buffalo in famine, the song text and glosses, comments
    on white buffalo rarity and sacred handling, and a named account by Jaw of killing
    and selling a white buffalo hide.
  language: English; song text includes Teton/Lakota terms with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A few women who were good riders accompanied hunting parties to herd pack
    horses until meat was ready for loading.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a hunting party returned, women cut meat into long drying strips, dried
    it, pounded it, and mixed it with wild cherries or animal fat for long-term food
    storage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The song is identified as a medicine-man's song used to secure buffalo during
    famine; Siya'ka reported knowing of its successful use.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the described ceremony, a medicine-man painted a buffalo skull with red
    and blue stripes and placed a filled pipe beside it on fresh sage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports a belief that the painted skull turned into a real buffalo
    and called other buffalo.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The song was sung in the dark, and the passage states that the buffalo is
    the speaker in the song.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Siya'ka said that after the medicine-man's ceremony and the singing of the
    song, buffalo came near the camp and the famine was relieved.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The song has three rendered text versions involving a pipe, red earth, and
    blue earth, each accompanied by phrases about being mentioned as people walked
    and about offering or placement upon the speaker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A footnote says that the pipe in the first rendition referred to the pipe
    brought to the Sioux by the White Buffalo Maiden.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The musical analysis says the song is melodic rather than rhythmic, has minor
    tonality, omits the second tone of the octave, and has mostly downward progressions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A white buffalo is described as especially swift, wary, rare, difficult to
    secure, and visually distinctive, including black horns and pinkish hoofs and
    nose.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a white buffalo was killed, the fatal arrow and a skinning knife were
    purified in the smoke of burning sweet grass, and the hide was removed so that
    no blood was shed on it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Only men who had dreamed of animals were allowed to eat any part of the flesh
    of a white buffalo.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The white buffalo hide was not handled like an ordinary hide; only women noted
    for purity of life could touch or tan it, and further ceremonies and purification
    with sweet grass were required.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The tanned white buffalo robe was kept in a rawhide case, often retained for
    burial with its owner, and treated as a sacred article even in small pieces.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Jaw said he killed a white buffalo at age thirteen, kept the hide through
    winter, and sold it in spring to Bone Club for horses, a buffalo-hide tent, and
    other goods.
  category: sequence
  evidence_refs:
  - ev:11
