  summary: The passage describes men on the warpath seeking high points to observe
    enemies and distances, using stone piles for concealment, and rejecting the idea
    that such piles were landmarks for return. Dog Eagle reports that a camp song
    was sung at night on the warpath to strengthen the men's hearts, sung very low
    and sometimes with owl imitation. The passage then gives the title and performance
    attribution for No. 185, Song of the Camp.
