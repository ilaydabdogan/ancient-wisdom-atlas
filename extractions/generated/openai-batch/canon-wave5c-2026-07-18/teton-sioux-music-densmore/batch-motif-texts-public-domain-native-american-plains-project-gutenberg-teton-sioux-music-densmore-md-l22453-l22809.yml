  summary: The passage presents song texts, glosses, and musical analyses for Horse
    Society/Dream Society songs. Two songs describe a Horse nation or herd moving,
    prancing, neighing, and chasing or walking. Another song, titled “A Root of Herb,”
    refers to a sacred herb root used by a first-person speaker toward the tribe of
    men. A concluding note explains that this group contains songs of societies composed
    of men with similar dreams, whose society names indicate the animal that appeared
    in the dream; many songs are said to have been received in dreams and later became
    common society songs.
