canonical_text:
  quote: ''
  summary: The passage records explanations of Wakai)^tai)ka as a great power, repentance
    and weeping in Sun-dance vows, beliefs about spirits after death, and Chased-by-Bears’s
    accounts of making and fulfilling Sun-dance vows connected with warfare, bodily
    offerings, leadership, buffalo skulls, and arranging articles on a sacred place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that creatures and humans are alike the work of a great
    power, and that rain and snow are under the control of a power greater than humans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are said to repent when making or fulfilling a vow to Wakai)^tai)ka, and
    men in the Sun dance weep and cry aloud while asking something of him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states a belief that after a man dies his spirit still lives somewhere
    on the earth or in the sky, though the exact place is unknown.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says spirits have not returned to speak to people again, except
    perhaps in sleeping dreams.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wakai)^tai)ka is described as everywhere and as hearing people, but his voice
    is compared to the unheard voices of dead friends’ spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first-person speaker made his first Sun-dance vow at age 24 when he was
    alone and saw an Arikaree approaching on horseback while leading a horse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker’s vow asked Wakai)^tai)ka to let him kill the man and capture
    the horse with a lariat, in return for giving his flesh at the next Sun dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker reports that he succeeded, told his friends he had conquered by
    the help of Wakai)^tai)ka, and was told he should be Leader of the Dancers at
    the next ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In fulfilling the vow, the speaker carried the lariat fastened to the flesh
    of his right shoulder and a rawhide horse figure fastened to his left shoulder;
    the figure note says the lariat and whistle were carried by Chased-by-Bears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Later, about 20 warriors asked the speaker to speak Sun-dance vows for them;
    each came alone, made a gift, and stated intended gifts, and one man said he would
    give his whole body to Wakaq^taqka.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before sunrise the warriors stood side by side facing East, raised their right
    hands, and the speaker prayed to WakaQ^tai)ka for pity, protection of families,
    victory over the enemy, capture of horses, and future Sun-dance offerings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The party returned victorious, and the speaker saw that the men’s vows were
    fulfilled at the next ceremony by cutting their arms and suspending their bodies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The second time the speaker fulfilled a Sun-dance vow as Leader of the Dancers,
    he carried four buffalo skulls and danced bowed on a stick because they were heavy.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the work with Chased-by-Bears, he went with the writer and interpreter
    to the site of the final Sun dance to arrange ceremonial articles on the sacred
    place; the place’s outline was made clear and intersecting white lines were traced
    on the earth.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
