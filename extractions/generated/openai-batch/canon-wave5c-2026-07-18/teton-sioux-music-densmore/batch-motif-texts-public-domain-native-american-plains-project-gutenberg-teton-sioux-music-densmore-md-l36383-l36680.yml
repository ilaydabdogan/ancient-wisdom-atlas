canonical_text:
  quote: ''
  summary: The passage describes several Teton Sioux songs, especially praise songs
    connected with Two White Buffalo and Red Fox. Red Fox adopted Two White Buffalo
    in place of his deceased daughter, gave her his daughter's name, and said he had
    the right to do so because he had killed two white buffalo. When these songs are
    sung, Red Fox is expected to make a gift on behalf of Two White Buffalo. Individual
    song texts emphasize poverty, donation, expected giving during fundraising, encouragement
    to Two White Buffalo, tribal dependence, and seeing chiefs.
  language: English with Sioux-language song transcriptions and English glosses
  quote_policy: summarized
