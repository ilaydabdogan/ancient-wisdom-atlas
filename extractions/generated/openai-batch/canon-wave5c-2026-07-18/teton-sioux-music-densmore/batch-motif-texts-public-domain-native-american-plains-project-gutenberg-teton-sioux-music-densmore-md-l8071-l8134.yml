  quote: ''
  summary: The passage describes the arrangement of a buffalo skull, fresh sage, and
    a decorated pipe at a sacred place, followed by Chased-by-Bears lying face downward
    with his head against the skull. It then describes the Teton Sioux Sun Dance as
    an annual midsummer, full-moon religious tribal gathering, with bands assembling
    in a circular camp, constructing lodges, and orienting the ceremonial space toward
    the east.
  language: English with Sioux terms
