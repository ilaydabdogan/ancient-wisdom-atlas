canonical_text:
  quote: ''
  summary: 'The passage discusses a Dakota/Santee moving deity or mysterious power
    connected with the Four Winds and Four Directions, with the Four Winds symbolized
    by a raven and a small black stone. It distinguishes small sacred stones carried
    on the person from large painted boulders used as objects of worship. It then
    classifies informants and singers according to their relations to sacred stones:
    dreamers and users, possessors, a possessor unable to command a stone, a singer
    at demonstrations, and witnesses familiar with songs.'
  language: English with Dakota/Santee names and terms
  quote_policy: summarized
