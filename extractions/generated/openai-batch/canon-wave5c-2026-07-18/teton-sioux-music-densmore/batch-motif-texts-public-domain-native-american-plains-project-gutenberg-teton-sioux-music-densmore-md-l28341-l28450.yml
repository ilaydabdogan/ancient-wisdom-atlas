  summary: The passage presents Song No. 158, a song concerning Sitting Crow, sung
    by One Feather and described as a praise song of a society to which Sitting Crow
    belonged. Its glossed text names friends, Sitting Crow, and says he did not return.
    The passage then presents Song No. 159, “A Spotted Horse,” also sung by One Feather,
    said to have been sung in connection with a fight with the Assiniboin. It notes
    that spotted black-and-white horses were prized by the Sioux, gives song words
    about friends coming along and the singer coming after a spotted horse, and adds
    that part of the song is addressed to friends and the remainder to the enemy.
