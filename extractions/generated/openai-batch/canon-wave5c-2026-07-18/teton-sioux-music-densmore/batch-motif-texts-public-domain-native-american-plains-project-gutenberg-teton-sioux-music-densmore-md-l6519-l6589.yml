canonical_text:
  quote: ''
  summary: 'The passage describes preparations for a Teton Sioux ceremony: a double
    lodge is built according to instructions attributed to the White Buffalo Maiden,
    ceremonial pipes and objects are arranged near a prepared earth square, and materials
    including sage, a buffalo skull, eagle plume, buffalo hair, and a decorated ear
    of corn are used. Footnotes compare related uses of bird and animal parts and
    a similar Sun Dance vow practice. The passage then introduces an inquiry into
    the ceremonial use of corn and begins a legend in which an old childless couple
    pray in a sweat-bath booth to Wakag^tai)ka for a child, hear a voice promising
    that their request will be granted, and the next morning find a greenish seed
    sprouting before their door.'
  language: English
  quote_policy: summarized
