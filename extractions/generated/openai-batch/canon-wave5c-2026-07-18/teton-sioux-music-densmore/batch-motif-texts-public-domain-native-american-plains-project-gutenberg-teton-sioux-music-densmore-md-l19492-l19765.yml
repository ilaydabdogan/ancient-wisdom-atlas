  summary: The passage contains song texts, translations, and commentary concerning
    healing songs associated with the bear and medicinal plants. One song invokes
    a father to send a voice. Song No. 88 is identified as the bear's song, connected
    with wild licorice and treatment of the sick; its words say the bear's paw is
    sacred and herbs or all things are sacred. Another remedy uses cone flower/root
    of the bur for hemorrhage, side pain, and earache, and Song No. 89 says a bear
    told the speaker about scarlet buckbrush and all things. The passage ends by stating
    that Eagle Shield received remedies for children from a badger dream and remedies
    for adults from the bear.
