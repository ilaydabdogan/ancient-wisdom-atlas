  summary: The passage introduces Frances Densmore’s collection of Teton Sioux music,
    identifies the communities and dialects represented, summarizes names used for
    the Dakota/Sioux and their divisions, and gives brief historical and linguistic
    notes on tribal names and geographic groupings.
  language: English, with Dakota and Chippewa terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most songs in the memoir were recorded among Indians of the Teton division
    of the Dakota, living on the Standing Rock Reservation in North and South Dakota.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some songs were also recorded among the Sisseton and Wahpeton Sioux at Sisseton,
    South Dakota, and twelve of those are included in the volume.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fieldwork began in July 1911 and continued until 1914, with Robert P. Higheagle
    serving as principal interpreter at Standing Rock and revising material collected
    at Sisseton.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that “Dakota” is the word used by these Indians in speaking
    of themselves and means “leagued,” “allied,” or, adjectivally, “friendly.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that “Sioux” was applied to the Dakota by outsiders and
    white men and became the commonly accepted designation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports Hewitt’s explanation that “Sioux” derives from a French-Canadian
    abbreviation of a Chippewa diminutive term meaning “they are the lesser enemies.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Riggs is cited as saying that the Dakota sometimes speak of themselves as
    the Očeti Šakowiŋ, rendered “Seven Council Fires.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The “Seven Council Fires” term is said to refer to the seven principal divisions
    that comprised the tribe or nation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Teton division is described as the largest division, said to have constituted
    more than half of the entire tribe and to have lived west of the Missouri River.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The four divisions living east of the Missouri are described as now known
