  summary: The passage contains a song fragment naming Holy House, known as Gabriel
    Renville, as departed, followed by musical analysis of voice and drum tempo. It
    then explains that Songs Nos. 191 and 192 honor living men who had been chiefs
    of the Teton Sioux under the old tribal organization. No. 191 is a recently composed
    grass-dance tune sung at Standing Rock Agency in 1912 in honor of John Grass,
    also named Mato-watakpe or Charging Bear; its text says the tribe depends on the
    speaker and that the speaker has traveled through difficulties.
