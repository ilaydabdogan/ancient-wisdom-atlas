canonical_text:
  quote: ''
  summary: The passage describes the Teton Sioux begging dance as a customary food-solicitation
    practice in which groups sing before tents until donations are given. It explains
    praise songs, decorated sticks used to request food from men with war honors,
    an old women's begging song associated with relatives of an absent warrior, and
    a later bread-and-coffee begging song. Musical analyses and singer attributions
    are included.
  language: English with Dakota/Lakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The begging dance is described as a custom rather than primarily a social
    dance, with the dance step incidental to begging food from tent to tent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Begging-dance songs included praise songs sung in front of a tent until the
    occupant appeared with donations; the tempo could be hastened with each rendition
    until gifts were received.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A council of chiefs could request food contributions from three classes of
    men: successful war-party leaders, victorious men who were not leaders, and men
    wounded in battle.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The request for food could be made with decorated sticks placed in the ground
    before tents; a military society decorated the sticks and sang around the camp,
    while an advance man identified tent occupants and placed the proper sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Specific stick decorations corresponded to specific war-honor categories:
    black paint and a black feather for successful leaders, black bands for victories
    by non-leaders, and red decoration for wounded men.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A begging song of four old women is connected with a warrior's wife and three
    women relatives standing in the middle of the village and singing until donations
    were brought.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The old women's song is described as taunting in general meaning and as mentioning
    buffalo chips, used as fuel, as the smallest gift that could be given to the poor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The musical analysis of the old women's song describes it as a wailing melody
    with a four-tone compass and many repetitions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A later begging song, said to have been composed about 1870, was used when
    bread and coffee became available through trade; a party sang it at a tent until
    the owner shared those goods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The bread-and-coffee song text asks for coffee and bread, and the passage
    attributes the singing to Used-as-a-Shield.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that a similar begging dance had been seen among the Chippewa
    at Red Lake, Minnesota.
  category: relationship
  evidence_refs:
  - ev:10
