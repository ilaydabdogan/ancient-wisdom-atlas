  text: The passage states that, with few exceptions, an unaccented drumbeat immediately
    precedes an accented beat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that in 3 percent of the songs the drum is in quadruple
    division, with the accented stroke preceded by a short unaccented stroke.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage defines a rhythmic unit as a group of tones of various lengths,
    usually comprising more than one count of a measure, occurring at least twice
    in a song, and influencing the rhythm of the entire song.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that many songs contain two or more clear rhythmic units,
