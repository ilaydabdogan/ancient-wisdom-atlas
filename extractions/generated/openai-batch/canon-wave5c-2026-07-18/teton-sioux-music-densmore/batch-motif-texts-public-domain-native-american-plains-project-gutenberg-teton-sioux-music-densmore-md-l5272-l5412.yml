  quote: ''
  summary: The passage analyzes Teton Sioux songs in terms of drum accents, rhythmic
    units, metric units of voice and drum, and differences between voice and drum
    tempo. It defines a rhythmic unit, reports percentages for songs containing such
    units, and summarizes formal musical traits such as descending melodic trend,
    mostly diatonic melody tones, and prominence of the minor third.
  language: English
  quote_policy: summarized
