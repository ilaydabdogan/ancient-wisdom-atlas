literal_observations:
- id: obs:1
  text: The writer conducted pitch-discrimination tests during the summer of 1915
    among Mandan, Hidatsa, Chippewa, and Sioux Indians, while presenting only the
    Chippewa and Sioux results in this passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In each of the two presented tribes, ten persons were tested, including men
    and women known as good singers and a few older persons who were not musicians.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The writer states that the limited number of participants and unfavorable
    test conditions make the results far from conclusive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tests used a set of tuning forks with a fundamental tone a' at 435 vibrations
    and ten other forks producing tones at stated increments above the fundamental.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the recorded test, participants heard pairs of tuning-fork tones in
    rapid succession and stated whether the tones sounded alike or different.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the regular test, participants were tested twenty times, two forks were
    sounded in rapid succession, and the participant was asked which tone was higher.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The writer used the intervals and correctness of replies as the basis for
    judging an individual's pitch discrimination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The writer reports qualitative observations that men she knew as firm and
    independent showed early concentration and recognized small intervals early in
    the test.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Chippewa man and two sons, all prominent singers on the White Earth Reservation,
    were tested; the father and one son had previously recorded songs for the writer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports the older man's pitch discrimination as about three vibrations
    and that of his two sons as about five vibrations.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The pitch discrimination of older Chippewa and Sioux Indians is described
    generally as about three vibrations.
  category: attribute
  evidence_refs:
  - ev:8
