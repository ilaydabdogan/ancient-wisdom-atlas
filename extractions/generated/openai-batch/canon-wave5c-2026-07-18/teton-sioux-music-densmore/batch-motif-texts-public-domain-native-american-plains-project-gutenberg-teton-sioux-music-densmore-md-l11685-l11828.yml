canonical_text:
  quote: "“the lightning came—it is the flash of their eyes, and the thunder is the
    sound of their terrible song”"
  summary: The passage contains musical-structure headings followed by an embedded
    ethnographic discussion of thunderbirds, giants, lightning, thunder, and the Heyoka
    Kaga ceremony. Giants dig river channels, die, and their spirits return to the
    clouds as thunderbirds. Their lightning, thunder-song, anger, and stone bodies
    are described. A man selected by thunderbirds through a dream publicly humiliates
    himself in the Heyoka Kaga, while informed observers understand this abasement
    as connected to command of sky powers. The passage also gives meanings of heyo'ka
    as thunderbird dreamer, contrary person, joker, fool, or clown, and notes disagreement
    about whether heyo'ka should be classed as gods.
