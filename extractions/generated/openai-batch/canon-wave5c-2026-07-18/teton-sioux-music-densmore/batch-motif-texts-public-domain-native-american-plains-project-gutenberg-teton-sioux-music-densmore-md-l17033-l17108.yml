canonical_text:
  quote: ''
  summary: 'The passage gives musical analysis of a song and then recounts a warpath
    episode: Standing Elk invokes sacred stones, sends them on a customary search,
    and tells the warriors to expect a wolf, a crow, and one enemy from the north.
    The warriors are instructed to pray to the wolf and crow as “grandfather” and
    ask to get a count. The predicted events occur; the enemy scout is killed, an
    enemy party charges, four Sioux repel nineteen enemies, and later the scout is
    identified as One Feather. The passage adds that Standing Elk used the following
    song in making his request to the stones and that no drum was used.'
  language: English with transliterated Indigenous terms and OCR artifacts
  quote_policy: summarized
