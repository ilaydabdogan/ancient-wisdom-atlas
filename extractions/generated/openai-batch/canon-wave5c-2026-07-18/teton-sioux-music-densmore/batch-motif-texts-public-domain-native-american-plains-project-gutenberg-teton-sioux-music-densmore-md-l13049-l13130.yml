  text: A dream of the elk is said to have a peculiar significance, and the elk is
    described as a favorite animal among young men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shooter says the elk is an emblem of beauty, gallantry, and protection, and
    relates these qualities to the ideal young man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that two elk teeth remain after the rest of the carcass
    has decayed, and that an elk tooth is treated as an emblem of long life and may
    be given to a child.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brave Buffalo says he was about 25, physically and morally at his best, and
    had a clean record when he dreamed of the elk.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the dream, while Brave Buffalo was asleep in a tent, someone came to the
    tent door, said he had come for him, and Brave Buffalo followed him on a long
    difficult journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dream journey leads to a beautiful lodge described as yellow on the outside,
