canonical_text:
  quote: ''
  summary: 'The passage explains the significance of elk dreams: Shooter associates
    the elk with the ideal qualities of young men and with long life through elk teeth.
    Brave Buffalo recounts a dream in which a guide leads him to a yellow lodge occupied
    by elks, where he is tested, welcomed, and taught a wordless song. The passage
    then gives a brief musical analysis of the elk song.'
  language: English
  quote_policy: summarized
