canonical_text:
  quote: ''
  summary: The passage gives a musical analysis and then recounts two demonstrations
    involving sacred stones. In the first, White Shield sends a stone to locate Siya'ka's
    lost horses by agreed signs, and the horses are later found where indicated. In
    the second, Shell Necklace consults sacred stones during a war-party camp, receives
    predictions and a request for a buffalo reward, and subsequent events fulfill
    the reported signs. The passage also introduces two songs associated with Shell
    Necklace, including one translated as living in a sacred manner.
  language: English with Dakota/Lakota names and song text
  quote_policy: summarized
