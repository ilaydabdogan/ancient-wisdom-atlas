  summary: The passage presents two medicine songs attributed to Sitting Bull and
    sung by One Buffalo, followed by Old Buffalo’s account of a standing prayer vigil
    for his sick niece. In the narrative, Old Buffalo calls on Wakan Tanka, vows offerings
    including four sacrifices and a Chief pipe, and the girl later improves, drinks
    water, and eats a little food.
