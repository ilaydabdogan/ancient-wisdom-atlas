canonical_text:
  quote: ''
  summary: A narrator recounts a war expedition associated with a Sun Dance vow. He
    vows flesh and blood to the great sun for success in war, later fulfills the vow
    through arm wounds, counts coups and kills enemies, raids a Blackfeet horse herd,
    camps near Bear Butte, sings a death song before expected combat, fights a Crow
    warrior by a rock with a cherry tree, spares two Crow captives, and says he was
    appointed chief because sparing them was considered brave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says he went on 45 war parties, describes the expedition on which
    he first killed an enemy, and says he rode a white horse with brown ears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the expedition, leaders at a Sun Dance invite anyone wanting success
    in war to join the ceremony.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Intercessor asks what offering will be made to the great sun, naming tobacco
    and flesh and blood; the narrator replies that he will give flesh and blood so
    he may conquer his enemies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator says he fulfilled the Sun Dance vow after returning victorious;
    his arms were cut, making 18 wounds in all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war party encounters Crow Indians, strikes living enemies with a coup
    stick, kills several, and later the narrator hits another Crow man with a club.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator says his Sun Dance vow made him fearless and identifies the club-striking
    episode as the fourth coup he counted on the expedition.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near a Blackfoot village, the narrator puts on a war bonnet, mounts his white
    horse, charges toward the village, takes about 50 horses, and is not hit by gunfire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the homeward journey near Bear Butte, the narrator remains behind with
    two young men and sees four Crow warriors approaching.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the young men propose running and hiding, the narrator tells them that
    there is one path by which one must go no matter how or where one dies, and urges
    them to stand and fight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator sings his death song because he feels sure he is soon to die,
    and he sings while pointing his gun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An immense rock with a crack and a cherry tree growing in it stands in front
    of the narrator; he watches the warriors through the crack, and a cherry branch
    interferes with his gun.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The narrator fights hand to hand with the Crow man who has a gun; his companions
    chase the others, take the gun from the man, and the narrator kills him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A boy runs away, two Crow captives ask to live and offer their bodies and
