canonical_text:
  quote: ''
  summary: 'The passage describes parts of the Teton Sioux Sun Dance: the drum and
    rawhide accompaniment near the sacred pole, the positions of the Intercessor and
    Leader of the Dancers, fasting by vow-fulfilling dancers, an opening prayer addressed
    to “grandfather,” and several forms of bodily ordeal involving laceration, skewers,
    cords, buffalo skulls, suspension, poles, horses, and warpath equipment.'
  language: English with transcribed Dakota/Lakota song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun Dance drum was placed south of the pole, was elaborately decorated,
    and was accompanied by a beaten stiff rawhide that gave the songs a tone distinct
    from ordinary dances.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who had carried the sacred pole sat at the drum and rawhide with special
    singers; women singers sat behind the men and formed an outer circle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Intercessor was seated west of the sacred place for the entire ceremony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: During rest periods, the Leader of the Dancers lay face downward west of the
    sacred place with his head pressed against the top of a buffalo skull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man who had spoken the vow for a war party had responsibility in the proper
    fulfillment of the vows, and dancers were attended by the men who had painted
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: All participants in the dance were required to abstain from food and water
    during the entire period of dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the conclusion of the opening dance, the Intercessor sang a prayer while
    all the people listened with reverence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prayer addresses “grandfather,” says that a voice is being sent, asks
    to be heard all over the universe, and includes the statement “I will live.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man could take part in the Sun Dance in one of six ways according to the
    nature of his vow, and fasting was required in every vow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The first form of participation consisted in dancing, the second added flesh
    laceration, and the other four involved a stick or skewer thrust through the flesh
    with strain applied until the flesh tore or was cut.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two common forms involved chest skewers attached by cords to the sacred pole
    crossbar and buffalo skulls fastened to the flesh of the back and arms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two more severe forms involved suspending the entire body by the flesh of
    the back and fastening the flesh of the back and chest to four poles placed at
    the corners of a square.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a horse had carried a man on the warpath when his vow was made, the man
    could attach the horse, or warpath bridle and whip, to the suspension thong or
    hold them while dancing; Chased-by-Bears reported suspending his rawhide lariat
    from an arm skewer during his first Sun Dance vow.
  category: action
  evidence_refs:
  - ev:8
