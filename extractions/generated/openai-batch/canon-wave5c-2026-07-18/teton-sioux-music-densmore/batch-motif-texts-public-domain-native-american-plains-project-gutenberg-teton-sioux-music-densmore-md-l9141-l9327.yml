canonical_text:
  quote: ''
  summary: The passage gives words of a song addressed to the Sacred Four, followed
    by musical analysis, then describes a Sun-dance sacred-pole procession. Young
    men and women circle the pole-bearers on decorated ponies with vines and branch
    hoops. The pole-bearers halt four times at the Intercessor's descending call,
    lowering the pole on crotched sticks. The sacred pole is brought into the Sun-dance
    circle top first; medicine-men call for wishes or offerings, and people bring
    gifts. The Intercessor removes bark, paints the pole with red paint or vermilion
    in perpendicular stripes, and sings alone while people listen. The painting song
    addresses “father” and says he has made the speaker own the trees and forests
    standing in their places. A footnote describes preparing vermilion by heating
    an ocherous substance.
  language: English with Teton Sioux song text/transcription and English glosses
  quote_policy: summarized
