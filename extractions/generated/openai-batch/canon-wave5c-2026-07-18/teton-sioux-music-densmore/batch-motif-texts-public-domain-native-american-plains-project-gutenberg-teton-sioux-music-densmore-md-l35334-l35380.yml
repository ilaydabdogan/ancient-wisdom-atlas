canonical_text:
  quote: ''
  summary: The passage describes the Night Dance in connection with the shuffling-feet
    dance. Young men and women participate, sitting on opposite sides of a tipi. During
    songs, individuals dance with presents and give them to members of the opposite
    group; this is described as a courting ceremony. All then dance in a circle holding
    hands, and a feast is made at the close. The passage also identifies a song of
    the Night Dance sung by Kills-at-Night and his wife and gives musical analysis
    of that song.
