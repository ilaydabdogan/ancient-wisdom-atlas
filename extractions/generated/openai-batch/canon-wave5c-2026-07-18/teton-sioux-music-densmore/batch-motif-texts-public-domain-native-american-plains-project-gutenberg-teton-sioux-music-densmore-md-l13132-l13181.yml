canonical_text:
  quote: ''
  summary: Brave Buffalo receives instructions from elks after being taught a song.
    He is told to use an eagle feather, paint his tipi with protective crane and crow
    images, and devise a public performance showing elk patronage before requesting
    elk help. He makes elk regalia, circles the camp with pipe-bearing attendants,
    imitates elk actions, and witnesses see elk footprints instead of human footprints
    on damp ground. The passage also notes that he would join a similar performance
    by another elk dreamer if asked.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elks teach Brave Buffalo a song and then give him instructions; each elk
    has a downy white eagle feather tied on its right horn, and he is told to wear
    a similar feather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elks instruct Brave Buffalo to paint his tipi yellow outside and with
    crane and crow drawings on the inner walls, saying that these birds would protect
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elks say that before he is fully entitled to request help from them, he
    must devise and perform something that shows people he acts under their patronage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After reaching home, Brave Buffalo makes an elk-hide mask from the skin of
    the head with horns, paints himself yellow, and holds hoops wound with elk hide
    and decorated with an herb liked by elks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The herb used with the hoops is identified in the passage as wild bergamot
    and is described as fragrant and liked by elks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arrayed as described, Brave Buffalo circles the camp close to the tents; two
    virgins precede him carrying his pipe; he imitates the actions of the elk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the circuit, he wishes that stepping on damp ground will leave elk
    footprints as a display of elk power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A crowd follows him and, after he passes over the damp spot, sees elk footprints
    instead of human footprints.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: He is not required to repeat the demonstration, but he would join another
    elk dreamer giving a similar performance and would wear the same mask.
  category: relationship
  evidence_refs:
  - ev:6
