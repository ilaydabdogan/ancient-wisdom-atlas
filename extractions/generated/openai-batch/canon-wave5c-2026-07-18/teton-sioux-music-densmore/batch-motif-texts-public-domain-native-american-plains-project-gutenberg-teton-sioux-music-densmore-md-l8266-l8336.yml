canonical_text:
  quote: ''
  summary: The passage describes Sun dance vows made by war parties in danger, including
    public and private vows of dancing, flesh suspension, or arm cutting; the expectation
    that vows must be fulfilled; punishments associated with neglected vows; and the
    selection, duties, and moral qualifications of the Intercessor, Leader of the
    Dancers, and others involved with the sacred pole and related offerings.
  language: English with Teton Sioux/Lakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When an entire war party was in danger, it was customary for its members to
    vow that they would take part in the next Sun dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The vow was usually made at sunrise and spoken by a warrior who had fulfilled
    a similar vow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a proper offering was available, each man held it in his left hand and
    raised his right hand while the vow was spoken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some individuals varied the rite by bowing the head or lowering the right
    hand slowly toward the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The spoken vow was only to take part in the dance, while a private vow concerning
    the specific part to be taken remained hidden.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some men vowed to dance, be suspended by their flesh, or have many gashes
    cut in their arms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says the vow had to be fulfilled even if the men returned defeated
    or to an empty lodge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: During the months before the Sun dance, the returned men prepared to fulfill
    their vows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that neglected vows to the sun were believed to be exacted
    by forces of nature, including death by lightning or disaster to family or horses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Old men knew of every vow and watched for its fulfillment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Military societies met during the four days before the Sun dance to elect
    the Intercessor, the Leader of the Dancers, four young men to select the tree
    for the sacred pole, and four young women to cut it down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Intercessor’s duties included offering prayers for the people, singing
    songs while performing ceremonial acts, painting the sacred pole, and preparing
    the sacred place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ceremonial songs for the Intercessor had to be composed by the singer or purchased
    from a previous officeholder who instructed him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Red Bird said the tribe would not appoint an unworthy man as Intercessor because
    he represented the people in prayers and offerings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Chased-by-Bears said a man who had committed a great wrong could not act as
    Intercessor, even after repentance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Leader of the Dancers was usually a successful returning warrior who had
    made a Sun-dance vow and wished to lead the dancers at the next ceremony.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Leader of the Dancers was expected to provide offerings for the sacred
    pole, buffalo fat for embedding the pole, a Sun-dance pipe, and a defect-free
    buffalo skull on which the pipe rested.
  category: action
  evidence_refs:
  - ev:8
