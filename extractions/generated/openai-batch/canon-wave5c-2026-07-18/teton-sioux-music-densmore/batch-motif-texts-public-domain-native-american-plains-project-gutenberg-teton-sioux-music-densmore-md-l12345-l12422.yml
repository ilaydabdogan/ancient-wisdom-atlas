canonical_text:
  quote: ''
  summary: The passage describes the Heyo'ka Ka'ga ceremony as a public humiliation
    rite chiefly enacted by people who have dreamed of thunderbirds. A dreamer signals
    the intent to fulfill the dream obligation with offerings, dresses and lives in
    deliberately poor fashion, is led by a medicine-man, proceeds around the tribal
    circle amid public jeering, sings and recounts dreams, offers meat to the thunderbirds
    in a pot over a fire, and later retrieves the cooked meat from boiling water to
    test protective medicines. Lone Man explains the ritual symbolism of water, fire,
    meat, and steam as signs of Wakaŋ Tanka's care through clouds, sun, animals, and
    sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heyo'ka Ka'ga is described as a ceremony of public humiliation, enacted chiefly
    by people who have dreamed of the thunderbirds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who has seen the thunderbird in a dream is expected to express unworthiness;
