canonical_text:
  quote: ''
  summary: 'A first-person patient describes a medicine-man''s treatment in a lodge:
    the healer prepares ritual objects, recounts the dream by which he received curing
    power, uses drum, rattle, breath, a bird-associated action, a pipe, and a bowl
    to remove and eject poison, then gives herbal medicine. The passage then describes
    Brave Buffalo as a powerful medicine-man and records his statement that medicine-men
    receive power from different sources, must act out their dreams, maintain integrity,
    smoke as a sign of peace, and may see sacred stones in dreams.'
  language: English with transcribed Dakota/Lakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person patient says he sent for a medicine-man to treat him many years
    earlier.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The medicine-man entered the lodge, sat behind the fire, later sat by the
    patient's head, tied grass around a lock of hair on the patient's forehead, and
    had the patient placed facing east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The medicine-man opened a bundle and took out a whistle, a small drum, a rattle
    used for beating the drum, and a black cloth that he tied over his eyes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Holding the drum and rattle, the medicine-man beat the drum rapidly and told
    the patient he would see the power by which the medicine-man had the right to
    cure sicknesses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The medicine-man told the dream by which he had received his power as a medicine-man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A horse's tail was fastened to the medicine-man's belt; he offered his drum
    to the cardinal points and placed a wooden bowl next to the patient's head.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: While approaching the patient and beating the drum, the medicine-man blew
    his breath strongly and struck his body on the right and left sides.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a pause, the patient heard the sound of a red hawk, and some witnesses
    said they saw the head of a red hawk coming from the medicine-man's mouth.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The patient felt a bird's beak over the painful place, penetrating far enough
    that he felt feathers, while the medicine-man kept still and then jerked upward
    to signify that the trouble had been removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A boy stood nearby holding a filled pipe; after it became apparent that the
    medicine-man had swallowed the poison, the medicine-man took four whiffs of the
    pipe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: To get rid of the poison, the medicine-man drummed, kicked the bare ground,
    paced back and forth, stamped, used both rattle and drum, and finally ejected
    the poison into the wooden bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The medicine-man told the people that he had sucked out all the poison, that
    none remained in the patient's body, and that the patient would recover.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The medicine-man mixed herbs in cold water, instructed the patient to drink
    it and repeat the dose the next morning, and the patient reports recovering in
    about ten days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Brave Buffalo is described as a powerful medicine-man on the Standing Rock
    Reservation and as actively practicing native medicine during his conferences
    with the writer.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Brave Buffalo says medicine-men receive power from different sources and refers
    to dreams, sacred stones, and Wakaŋ Tanka as all-powerful.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Brave Buffalo says a medicine-man must act out his dream and maintain integrity;
    he also says he is required to smoke, not fast, and that smoking shows peace with
    all men.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Brave Buffalo says dreams come to him naturally when he is alone on a journey,
    resting and becoming drowsy, and that he often sees sacred stones in his dreams.
  category: speech
  evidence_refs:
  - ev:11
