canonical_text:
  quote: ''
  summary: The passage describes a council in which Indian men listen to and discuss
    statements about the Sun Dance, pass a pipe in silence, and make decisions by
    consensus through an interpreter. The next day a party including former participants
    visits the site of the last Sun Dance of these bands, held in 1882 near Standing
    Rock Agency. They identify traces of the sacred place, a red-painted buffalo skull,
    the pole site, and the shade-house circle. Mr. Higheagle places fresh sage, the
    buffalo skull, and a Sun-dance pipe at the sacred place. Participants dress in
    older regalia, pass the pipe, refer to scars, and recall memories of the earlier
    ceremony and departed relatives.
  language: English
  quote_policy: summarized
