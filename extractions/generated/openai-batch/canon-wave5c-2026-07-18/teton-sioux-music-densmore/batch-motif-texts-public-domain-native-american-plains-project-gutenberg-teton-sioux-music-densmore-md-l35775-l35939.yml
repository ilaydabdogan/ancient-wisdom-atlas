literal_observations:
- id: obs:1
  text: The game of hiding a stick is said to have the same name as the game of hiding
    a moccasin, and its rules are attributed to Mr. Robert P. Higheagle, the writer's
    interpreter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ten people play on each side, and 10 score sticks are used.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A preliminary contest has one player from each side rapidly transfer a little
    stick between hands while the opponent tries to determine which hand holds it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The player who conceals the stick most successfully secures two score sticks
    for that player's side and the privilege of hiding first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two lines of players sit on the ground; each side's leader selects two
    players who sit in front facing each other, each with a hiding-stick.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hiding side conceals the sticks and the opposing side guesses; score sticks
    are transferred according to whether one or both hiding-sticks are located.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A leader may withdraw an unsuccessful player and substitute one of the remaining
    players.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Play continues until one side has won all the score sticks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four hand signals indicate guesses about whether both sticks are in left hands,
    right hands, outside hands, or inside hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writer states that she witnessed such a game at Bull Head, South Dakota,
    in 1912.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A game song and a song for when a game is almost won are both attributed in
    the passage to Kills-at-Night.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The song used when a player was on the verge of winning is specifically described
    as being for that stage of the game.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The most commonly used victory song in the game is identified as a war song
    in which the opposing player's name is inserted in place of the defeated enemy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Used-as-a-Shield sang the victory song with the name Red Bear, while One Feather
    sang it using words referring to the Crow tribe.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The free translation of the victory-song words is derisive and asks whether
    the person thought to save life by making that sign.
  category: speech
  evidence_refs:
  - ev:9
