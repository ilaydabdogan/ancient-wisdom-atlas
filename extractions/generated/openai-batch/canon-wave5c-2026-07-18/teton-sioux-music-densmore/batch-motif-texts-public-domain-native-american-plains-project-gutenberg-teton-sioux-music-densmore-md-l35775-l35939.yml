  summary: The passage describes the rules, implements, scoring, hand signals, and
    songs associated with the game of hiding a stick. It also notes that a victory
    song used in the game is a war song adapted by substituting the name of the opposing
    player or group for that of a defeated enemy.
  language: English with transcribed song terms
