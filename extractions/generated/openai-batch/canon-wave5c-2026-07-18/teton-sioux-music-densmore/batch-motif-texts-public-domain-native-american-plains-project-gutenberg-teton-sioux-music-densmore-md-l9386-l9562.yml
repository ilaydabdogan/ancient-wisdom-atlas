canonical_text:
  quote: ''
  summary: 'The passage presents three Teton Sioux songs sung after raising the Sacred
    Pole. In the first two, the pole is explicitly introduced as the speaker: it stands
    sacred, is to be beheld, and stands at the center of the earth while recognizing
    the tribe. A note explains that such wording belongs to a sacred language used
    in relation to supernatural matters and links the “center of the earth” expression
    with wind-center and four-winds formulas elsewhere in the same work. The third
    song addresses “grandfather,” mentions the places of the four winds, reverence,
    being made to wear something sacred, and the tribe’s wish to live.'
  language: English with transcribed Teton Sioux/Dakota terms as printed
  quote_policy: summarized
