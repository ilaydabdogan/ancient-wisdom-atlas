canonical_text:
  quote: ''
  summary: The author argues that information about the Andamanese should be collected
    before their possible extermination or assimilation. He disputes the name “Mincopies,”
    says that remarks mostly concern the eight tribes of Great Andaman because Little
    Andaman inhabitants have resisted contact, and contrasts earlier negative or monstrous
    physical descriptions with later and personal observations of well-proportioned
    bodies, small hands, feet, and ears.
  language: English
