candidate_motifs:
- id: motif:1
  label: Supernatural punishment for taboo violation
  taxonomy_refs:
  - divine_judgment
  basis: Specific actions—using alaha wood for turtle, taking restricted rainy-season
    foods, and burning beeswax—are described as provoking punishment, deluge, or storms
    from named beings.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage reports beliefs ethnographically; the beings are not uniformly
    described with the term divine.
- id: motif:2
  label: Weather as emotion, body, and weapon of a supernatural being
  taxonomy_refs:
  - divine_judgment
  basis: Storms are anger, winds are breath, thunder is growling, and lightning is
    a burning log thrown by Fuiuga-.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif label summarizes several literal identifications in one weather
    complex.
- id: motif:3
  label: Ritualized sound and speech to influence storm
  taxonomy_refs: []
  basis: Popping leaves on fires, shouted warnings to Fuiuga-, and the cited monsoon
    choruses all concern sound or speech directed toward storm conditions or a storm
    being.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage gives practices and an authorial comparison, not a single
    formal ritual text.
- id: motif:4
  label: Deluge as consequence of violating seasonal food restriction
  taxonomy_refs:
