comparison_claims:
- id: claim:1
  claim: The author cautiously identifies the practice of menacing Fuiuga- during
    storms with Colonel Symes’s report of choruses addressed to a malignant being
    during violent southwest monsoon tempests.
  claim_level: same_function
  target: Colonel Symes’s account of monsoon choruses to a malignant Being
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself says this is 'probably' the same practice; it does
    not provide independent confirmation.
- id: claim:2
  claim: A footnote in the passage notes a resemblance between the Andamanese rainbow
    as a dancing/sounding board and the Chippeway designation of the rainbow as a
    dancing spirit.
  claim_level: same_function
  target: Chippeway Indians’ rainbow as 'the dancing spirit' in the cited Maximilian
    travel account
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is limited to a brief footnote and does not support
    historical contact, common inheritance, or a detailed shared motif.
