canonical_text:
  quote: ''
  summary: The passage lists reported customs and beliefs concerning luck at the start
    of the day, food and material taboos, weather rites and storm explanations, deluge
    fears, rainbow omens, earthquake causation, infant rebirth, and sneezing.
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A meal soon after rising is described as invariable, because starting the
    day’s work on an empty stomach is believed to bring no luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wood of the alaha tree is not used for cooking turtle; the passage says
    this offense is abhorrent to mava .d'gar-, who punishes offenders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In tempestuous weather, leaves of Mimusops Indica are thrown on fires; the
    popping sounds are thought to assuage Puiuga-’s fury and moderate the weather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a dark cloud approaches at an inconvenient time, people shout a warning
    to Fuiuga- that Wd'ra-jdbo will bite him; if rain follows, they think Fuiuga-
    was not deterred.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: An earlier report by Colonel Symes is cited as probably referring to menacing
    or addressing Fuiuga- during violent monsoon tempests.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Storms are regarded as signs of Fuiuga-’s anger; winds are his breath, thunder
    is his growling, and lightning is a burning log thrown by him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eating or gathering certain plants and roots during the first half of the
    rainy season is believed to risk another deluge because Pu'luga- requires them
    for himself; fallen Entada seeds are exempted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Burning beeswax is said to offend Puduga- and bring storms; people may secretly
    burn wax to spoil another person’s fishing or hunting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The rainbow is described as .e'rem-chdw gala’s dancing or sounding board,
    visible only at certain times, and its appearance is said to foretell sickness
    or death.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that there are no superstitions about hills, valleys, and
    rocks, although Puduga- is believed to have formed them; creeks are attributed
    to a fortunate accident in traditions.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:11
  text: Earthquakes are said to be caused by mischievous male spirits of deceased
    ancestors shaking the palm-tree on which the earth rests in order to destroy the
    cane bridge between this world and heaven.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: The same male spirits are said to avoid making earthquakes during dry months
    because cracked earth might fall on them; female spirits try to dissuade or prevent
    them.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Every conceived child is believed to have had prior existence as an infant;
    after a baby’s death, a later foetus may receive the dead baby’s name in expectation
    that it is the same child born again.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sneezing is considered auspicious; bystanders ask who is thinking of the sneezer,
    who names an absent friend, or names the place if alone.
  category: speech
  evidence_refs:
  - ev:14
