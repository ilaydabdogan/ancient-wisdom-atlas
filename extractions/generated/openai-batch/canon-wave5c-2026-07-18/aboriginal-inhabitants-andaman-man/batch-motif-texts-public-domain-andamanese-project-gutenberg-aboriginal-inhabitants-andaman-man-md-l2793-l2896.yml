canonical_text:
  quote: ''
  summary: 'The passage describes social customs and attributed traits of the Andamanese:
    mutual affection, special care for vulnerable people, child discipline without
    corporal punishment, a fasting period before married life, hospitality and reciprocal
    tokens for guests, modesty customs, craftsmanship in weapons and utensils, gift-giving
    with expected equivalents, talkative speech, appreciation of jokes, and mild verbal
    abuse when angry. A footnote recounts chief .bl''ela tracking escaped convicts
    and requesting remission of other prisoners'' sentences as a reward.'
  language: English
  quote_policy: summarized
