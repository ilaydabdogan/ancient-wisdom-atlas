canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese archery and hunting equipment: differences
    between Great Andaman and Jarawa arrow-release methods, use of waistbelts as quivers,
    arrow ranges and construction, selective use of iron, absence of blow-pipes and
    other weapons, hunting and fishing practices, and childhood or travel-based shooting
    practice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Andaman arrow-discharge method is described as differing from that
    attributed to the Jarawa; Great Andaman archers place the arrow between the thumb
    and top joint of the forefinger and draw the string to the mouth with the middle
    and third fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Feet are described as used for stringing and unstringing bows, not for bending
    the bow while shooting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A waistbelt or other cincture often functions as a quiver during fishing and
    hunting, with arrows carried behind and heads upward for safety, freedom of movement,
    and quick access.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pointed arrows are described as effective to 40 or 50 yards, while pig-arrows
    are described as formidable but ill-balanced and reliable only at much shorter
    ranges.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Jarawa arrow-blade fastening method is described as using three holes in
    the blade and string through them to reduce disconnection; the author links this
    precaution to scarcity of iron.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the Great Andaman people do not show an inclination to replace
    their own weapons or tools with civilized ones, but have adopted iron in place
    of shell, bone, and perhaps stone for implements.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The blow-pipe is described as absent from the Andamanese weapon set, and slings,
    throwing sticks, clubs, bird-bolts, and blunt-headed arrows are also described
    as not in use among them.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: On pig-hunting expeditions, hunters take some pointed arrows in case smaller
    game such as iguana or paradoxurus is encountered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For rapid shooting, a man may hold several arrows in the same hand that grasps
    the bow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage describes Great Andaman fish-shooting under water as skillful
    and close-range, and rejects the claim that Great Andaman tribes use three-pronged
    barbed arrows for such shooting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Boys learn with small bows and arrows and may contribute to the family food
    supply through early shooting skill.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: While travelling, youths, children, and even elders are described as shooting
    at small passing objects on land and in water for practice or display, and bystanders
    do not reproach someone who wounds an animal without killing it.
  category: action
  evidence_refs:
  - ev:9
