canonical_text:
  quote: ''
  summary: The passage describes Andamanese relationship rules, kinship terminology,
    address forms, marriage restrictions, widow or widower kin priority, and proper
    naming practices. It says names may be chosen before birth, change by sex and
    life stage, and that young women receive a flower-name prefix at maturity based
    on one of eighteen trees flowering in sequence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriage is described as permissible only between people who are not even
    distantly connected, except by wedlock; adoption ties are included in the prohibition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: First cousins, including adoptive first cousins, are treated as half-brothers
    or half-sisters; nephews and nieces are treated nearly as sons and daughters,
    and grandparent terms also apply to grand-uncles and grand-aunts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Parents use distinct terms when addressing or referring to sons and daughters,
    and a footnote says foster-parents use corresponding terms for adopted sons and
    daughters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Uncles and aunts on the father's side are not distinguished from those on
    the mother's side; relationships are traced in both lines and the system is identical
    for either sex.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says relationships beyond the third generation are not traced
    or recognized, citing short lives, lack of records, and complications from adoption.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Address terms vary according to seniority, parent status, gender, and whether
    the person is named directly; some terms are described as equivalent to Mr., Sir,
    Mrs., or Madam.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports about sixty relationship terms, excluding equivalents,
    and says sibling terms indicate relative age as elder or younger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Senior relatives of a spouse, brother's wife, or sister's husband are addressed
    with the term mdm'; a person may not marry into the family of brothers- or sisters-in-law,
    while sharing the same name is not a marriage bar if there is no consanguinity
    or adoption tie.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The nearest kin to a widow or widower are listed in order as grown-up children,
    parents, then brothers and sisters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The naming system is said to begin before birth; parents choose a name in
    advance and may select a name borne by a relative, friend, or chief, and proper
    names are common to both sexes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A chosen birth name receives different forms according to whether the infant
    is a boy or girl and later according to childhood stage; at womanhood a girl receives
    a flower-name prefix to her birth name.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: There are eighteen prescribed trees said to blossom in succession, and a woman's
    flower-name is taken from the tree in season when she reaches maturity.
  category: object
  evidence_refs:
  - ev:10
