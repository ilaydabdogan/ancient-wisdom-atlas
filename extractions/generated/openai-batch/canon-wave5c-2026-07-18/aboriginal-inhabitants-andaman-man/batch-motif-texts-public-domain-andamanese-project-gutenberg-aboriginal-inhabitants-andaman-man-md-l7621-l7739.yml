literal_observations:
- id: obs:1
  text: The passage states that domestic duties often fall to women and children,
    but that the head of the family is not described as using compulsion; husband
    and wife are described as having marked equality and affection, with the husband's
    authority more or less nominal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband's listed duties include hunting, fishing, turtling, collecting
    honey, constructing canoes, building better huts, making bows, arrows, and implements,
    assisting with children, keeping up the fire, and providing materials; procuring
    wood or water is described as done only in necessity and treated as feminine work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women are described as expected to know shaving, tattooing, and scarifying;
    they prepare named items, erect the chdng-darangon, make personal ornaments and
    other objects, procure certain foods, cook, and provide water and fuel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men and women who remain at home are described as attending the sick, infants,
    and dependent persons, looking after fires in huts, and protecting absent people's
    property if needed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each family is described as customarily keeping provisions beyond its own
    requirements for visiting friends; the passage adds that much food is wasted in
    storage and that only certain seeds are kept for any length of time.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Migrations and community movements are arranged by the chief and elders; women
    are not consulted in these matters and are expected to carry the heaviest loads
    while marching, so that men are able to shoot or pursue animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Boys are trained by parents or guardians through miniature weapons suited
    to their age, instruction in their use, and later participation with men in hunting
    and fishing expeditions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Girls are taught by mothers or other female guardians to perform duties described
    as pertaining to their sex.
  category: sequence
  evidence_refs:
  - ev:8
