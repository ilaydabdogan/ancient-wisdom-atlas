canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese mortuary practices: most dead are taken
    away from the encampment for burial or placement on a raised platform, oriented
    eastward, accompanied by farewell gestures, fire, water, personal belongings,
    and suspended d''ra. It explains beliefs about souls going east to jereg or Hades
    and spirits haunting burial sites and encampments. After mourning, remains are
    cleaned and returned, and bones or skulls may be worn, exchanged, or distributed
    as relics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only infants are buried within the encampment; other dead are carried to a
    distant secluded jungle place and either interred or placed on a machan/platform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the destination, the corpse is carried by one of the men on his back and
    put down while final preparations are made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For grave burial, a spot with a boulder or large tree is selected as a marker,
    and a grave about four or five feet deep is dug with an adze.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In grave burial the body is lowered in a sitting posture facing east; in platform
    disposal the head is raised slightly looking eastward.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Those present take leave by raising the leaf covering from the head and blowing
    upon the face of the deceased.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:6
  text: Before the grave is filled, cords or canes are cut and leaves loosened; a
    fire is lit over the spot, and a shell filled with water plus an article belonging
    to the deceased is placed beside it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: For platform disposal, a small stage of sticks and boughs is built eight to
    twelve feet above the ground, generally in a large tree, and the body is lashed
    to it and covered with leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Two reasons are given for eastward placement: to hasten dissolution and because
    jereg or Hades, where souls of the departed flee, is said to be in the east.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spirit of the deceased is supposed to haunt both the burial place and
    the encampment where death occurred, so the community temporarily migrates after
    the funeral party returns.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After mourning, the men who assisted at the funeral return to the burial place,
    destroy the d'ra, remove remains to the sea-shore or a creek, clean the bones,
    and bring them back to the old encampment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Displays of grief are described as intended to conciliate spirits of the departed
    and to gain protection from misfortunes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: If one member of a young childless married couple dies, the survivor is not
    chief mourner and does not assist at the obsequies; relatives perform them, and
    one relative later takes and wears the skull.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Bones or skulls of the deceased may be given to friends or family members;
    remains of a chief or favourite may become widely scattered among admirers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that, as a rule, no adult lacks at least one human bone
    necklace, and skulls are generally present in every encampment and worn in turn.
  category: object
  evidence_refs:
  - ev:10
