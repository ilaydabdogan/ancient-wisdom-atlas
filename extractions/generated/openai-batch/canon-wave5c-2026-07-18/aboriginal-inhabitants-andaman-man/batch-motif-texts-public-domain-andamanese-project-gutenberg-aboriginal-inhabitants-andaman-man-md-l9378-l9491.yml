canonical_text:
  quote: ''
  summary: The passage describes Andamanese rules restricting direct address and touch
    among certain affinal relations; practices for referring to recently deceased
    persons; modes of warfare, including stealth attacks, timing, treatment of captives
    and property; and hunting practices, including proof tokens from game, post-hunt
    silence, and age and gender limits on participation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who wants to address a married woman younger than himself is described
    as using a third person as the medium of communication rather than speaking directly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists reciprocal restrictions on touching certain affinal relatives,
    including a younger brother's or cousin's wife, a wife's sister, a husband's elder
    brother or male cousin, and a husband's brother-in-law.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Titles such as mala, mavola, and chawa are said to cease being applied after
    death, and inquiries about the recently dead are answered in a subdued tone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: For about the first year after death, deceased persons are referred to as
    little as possible and are indicated by the tree or place where their remains
    are or were deposited; later a term equivalent to 'the late' is prefixed to names.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that assailants usually approach stealthily through jungle
    but do not conceal their trail, wear no breastplate, use no shields, and do not
    construct defensive earthworks or similar protections.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The preferred time for attack is described as daybreak while the enemy sleeps,
    or a late hour when the enemy is preparing or eating the evening meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women and children are said to face the same risk as men during attacks, but
    killing them is not treated as boast-worthy; an uninjured captured child is treated
    kindly in hope of eventual incorporation into the captor's tribe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The property of the defeated is described as being taken if portable and injured
    or destroyed if not portable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: No confirmatory evidence is said to be required for a claim that a man killed
    foes, but a hunter who kills a large animal far from home cuts off a tail or other
    part as visible proof to persuade others to help retrieve the carcass.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Andamanese are described as keen huntsmen, and the locations of encampments
    are said to depend partly on opportunities for hunting.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says there are no omens, superstitions, or special ceremonies
    connected with hunting departures or returns, except a custom of maintaining glum
    silence after the day's sport.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Females are said to take no part in hunting expeditions, and boys seldom accompany
    elders until after their twelfth year.
  category: relationship
  evidence_refs:
  - ev:9
