canonical_text:
  quote: ''
  summary: The passage lists insulting expressions and notes that quarrels may result.
    It then gives ethnographic observations on preference for jungle life, children’s
    intellectual capacities, memory and plant identification, and belief in dreams.
    The witchcraft section describes male individuals called 6ko-parad- or 6ko-pavad-,
    literally dreamers, credited with second sight and power over others’ fortunes,
    sickness, and death. Their status may begin with an extraordinary dream later
    confirmed by an unforeseen event, and they maintain influence through fresh demonstrations
    and gifts. Property can be reserved for their future use, and people may consider
    killing such a seer if disaster is thought preventable by him, though no execution
    is known. A footnote compares them with Tauna disease makers of the New Hebrides.
  language: English with Andamanese terms
  quote_policy: summarized
