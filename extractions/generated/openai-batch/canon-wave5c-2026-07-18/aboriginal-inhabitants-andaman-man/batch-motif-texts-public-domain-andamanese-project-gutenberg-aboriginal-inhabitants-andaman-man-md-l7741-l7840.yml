- id: obs:9
  text: Fully attired men are described with shredded bunches of Pandanus leaves attached
    to knees and wrists, a folded Pandanus leaf around the head, and a belt common
    to both sexes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men often remove most appendages while hunting, retaining a belt or lighter
