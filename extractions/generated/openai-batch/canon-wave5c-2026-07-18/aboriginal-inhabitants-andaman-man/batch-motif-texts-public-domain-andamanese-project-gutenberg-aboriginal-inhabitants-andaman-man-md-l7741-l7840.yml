canonical_text:
  quote: ''
  summary: The passage describes Andamanese infant care during travel, denies infanticide,
    attributes high infant mortality to excessive but well-intentioned attention,
    and details attire, ornaments, belts, leaf aprons, memorial wearing of ornaments,
    gender differences in dress, and certain pregnancy-related changes in cinctures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that infanticide is unknown to the Andamanese.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes excessive infant mortality to injudicious treatment
    and lavish attention by elders, not to lack of affection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When travelling, women secure babies by fastening a string around the woman's
    neck with its ends attached to the infant's wrists, and placing the child in a
    chip so that a serious fall is prevented.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that no clothing, in the author's sense of the word, is
    worn by either sex, but that ornaments and appendages substitute for clothing
    to some degree.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ornamental circlets, garters, bracelets, cinctures, and necklaces are described
    as made of bones, wood, or shell.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says these appendages are not worn as symbols of rank or status,
    except for the rogun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Manufacture of ornaments is said to devolve always upon females of the community.
  category: action
  evidence_refs:
