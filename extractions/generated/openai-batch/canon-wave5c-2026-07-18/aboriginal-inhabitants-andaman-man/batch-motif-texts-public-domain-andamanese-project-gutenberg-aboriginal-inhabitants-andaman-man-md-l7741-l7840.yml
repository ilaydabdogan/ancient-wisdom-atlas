  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Men are usually described as wearing one belt, while women almost invariably
    wear four or five and sometimes as many as eight around the waist.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Married women are described as wearing the rogun in addition to the apron
