canonical_text:
  quote: ''
  summary: The passage describes stages and explanations of gu'mul rites involving
    novice status, food prohibitions and reintroductions, honey eating and anointing,
    bathing, a water-splashing charm against a snake, sex-specific timing rules, and
    a final pig-related ceremony. It also records a case in which a youth who ignored
    food restrictions was believed to have died because he failed to follow ancestral
    rites.
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The origin of the term gu'mul-le'ke is stated to be obscure; a literal translation
    is given as “rainy-monsoon devour-does,” and the term is connected with rites
    in which melted fat or honey may leave the novice looking sweaty or rain-like.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A youth named Martin refused the food restrictions expected for his age, later
    became sick and died, and his community believed his death resulted from failing
    to follow ancestral rites and ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the yd'dl-gu'mul, a youth receives a status or address connected with
    gu'ma; a girl is said not to receive this because she receives a flower name at
    this life stage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Certain foods are reintroduced after rites at the chief's bidding, while other
    restrictions remain, including abstention from fruit between yd'dl-gu'mul and
    d'ja-gu'mul and abstention from pig's flesh until after reg-jvri-gu'mul.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: When the honey fast is broken, the novice is placed in the group, receives
    honeycomb from a chief or elder, eats in silence, and must eat without using his
    fingers, holding the comb to his mouth and using teeth and lips.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief anoints the youth with honey by squeezing a comb over his head and
    rubbing the honey over his body, after which a bath removes the honey.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The following morning the youth decorates himself with Alfinia leaves, enters
    the sea or a creek to the waist, locks his thumbs, splashes water on himself and
    bystanders, and sometimes ducks his head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The water-splashing performance is described as a safeguard or charm against
    Wd'ra-jobo, a snake believed capable of entering the stomach and causing death
    if the performance is not done.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For females, d'ja-gu'mul cannot occur until after the first child is born;
    females also abstain from honey during later pregnancies, and a chief or elder,
    preferably a relative, officiates.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The final reg-jvri-gu'mul normally follows about a year after yd'dl-gu'mul;
    friends and relatives go on a pig hunt, and the rite is postponed if the hunt
    fails, with a boar required for a young man and a sow for a female.
  category: sequence
  evidence_refs:
  - ev:9
