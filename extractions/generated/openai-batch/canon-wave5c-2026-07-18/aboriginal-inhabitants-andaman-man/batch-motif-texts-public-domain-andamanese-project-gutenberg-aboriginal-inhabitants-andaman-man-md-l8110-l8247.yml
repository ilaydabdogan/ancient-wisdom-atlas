  quote: ''
  summary: The passage gives ethnographic descriptions of Andamanese shaving practices,
    lack of intentional bodily deformation except possibly tattooing, unintentional
    cranial indentation from load-carrying, informal analogical methods for weights
    and measures, and named divisions of the day and night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shaving is described as an occupation regarded as feminine; men shave one
    another only in exceptional cases when a woman is not available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaving implement is described as a rude but effective razor made from
    a flake of quartz or, more commonly at the time described, glass.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before shaving an infant, the mother usually moistens the head with breast
    milk; for bigger children and adults, water is used.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the Andamanese do not intentionally produce deformities,
    unless tattooing is counted, and do not flatten or pinch the nose or perforate
    the nasal septum for ornaments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nicobarese are described as flattening children’s occiputs in infancy,
    blackening teeth after puberty, and perforating earlobes widely enough for insertion
    of a wooden cylindrical object.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A skull indentation is described in most Andamanese women, caused unintentionally
    by carrying loads with a cane or cord across the anterior portion of the cranium.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the Andamanese have no recognized standard of weights
    or measures corresponding to body-part units such as nail, finger-joint, thumb,
    span, or pace.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Small sizes, shapes, or weights are described by comparison with seeds or
    fruits, while larger weights are described by what one man could carry or lift,
    and quantities by containers or loads such as bucketful, basketful, handful, or
    canoe-load.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: No prescribed uniform size is given for mats, tools, weapons, or utensils;
    dimensions depend on the maker and available material.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that tallies and counters such as seeds or stones are not
    used in counting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Distances may be described as a bowshot, by reference to the distance between
    two known places, or as exceeding a day’s journey if over about fifteen miles.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage rejects the claim that only three divisions of the day are recognized
    and instead lists thirteen named periods of day and night.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Andamanese are described as having no knowledge of the sundial and as
    indicating short intervals with vague expressions such as waiting a little or
    saying something is soon finished or close at hand.
  category: speech
  evidence_refs:
  - ev:6
