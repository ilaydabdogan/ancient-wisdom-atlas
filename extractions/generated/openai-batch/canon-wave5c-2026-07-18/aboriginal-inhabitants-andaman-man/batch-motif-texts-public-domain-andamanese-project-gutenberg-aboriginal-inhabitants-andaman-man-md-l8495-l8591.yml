literal_observations:
- id: obs:1
  text: Before the author's group's occupation of the islands, the Andamanese are
    said to have possessed no dogs; after learning their usefulness in the chase,
    they prized certain breeds and accepted dogs given to them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dogs are described as allowed to sleep and sometimes eat and drink from the
    same vessel as their masters, while also being severely trained and commonly kept
    semi-starved to make them keener hunters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says summoning dogs by whistling and naming them were borrowed
    practices; common dog names include “Jack” and “Billy,” and dogs are addressed
    as lig-ala, glossed as “children.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dogs are said to be attached to their owners and to attack non-aboriginal
    strangers who approach their encampment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Meeting certain birds is regarded as a good omen, while meeting others has
    the contrary meaning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The absence of migratory species at certain seasons is explained as their
    visiting adjacent isles.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that the Andamanese have no knowledge of mythological animals
    such as dragons and unicorns.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that no quadruped, bird, or fish is venerated or regarded
    as sacred, even when animal names match names of traditional antediluvian ancestors.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some traditional antediluvian ancestors are described as having been transformed
    into, or as having assumed, the forms of animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage says that, apart from previously mentioned cases, no trace of
    belief in transmigration is found, and animal and human souls are not considered
    interchangeable at the time described.
  category: other
  evidence_refs:
  - ev:3
- id: obs:11
  text: 'Four animal names are said to have originated in animal cries: iguana, pigeon,
    dog, and pig; of these, only the dog is trained or domesticated.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
