canonical_text:
  quote: ''
  summary: 'The passage summarizes several Andamanese legends: variant accounts of
    the origin of illumination, night, and the moon; a prohibition against using the
    al''aha tree as fuel for cooking turtle and its punishment; the origin of evil
    spirits called .chol-; and a fable explaining drought through a woodpecker''s
    trick on a toad.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The narrator reports two different stories about world illumination: one
    says the sun and moon were created at .t&mo-''s request, while another says night
    was imposed as punishment after a caterpillar was killed.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the punishment account, the sun burned fiercely, two named women became
    irritable, found a caterpillar and an u'tura plant, and one crushed the grub while
    the other destroyed the plant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pu'luga- responded to the destruction of the caterpillar and plant by imposing
    a long darkness on the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief mai'a Jcoiw&t- invented dancing and singing to make Pu'luga- think
    people could enjoy themselves without light; Pu'luga- then granted alternating
    day and night and later created the moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says this story explains why the same word denotes both caterpillar
    and night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pu'luga- commanded to'mo- not to use the al'aha tree as fuel when cooking
    turtle, though it could be burned when preparing pigs or other animals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The warned punishment for violating the al'aha fuel rule was cutting the throats
    of males and depriving females of their breasts; the day agent was chdn'a .bd'do-
    and the night agent was mava .6'gar-.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shortly before the Deluge, the .t&mola violated the al'aha injunction at night,
    and mai'a .b'gar- descended and inflicted the threatened punishment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mava .chol- stole a captured pig, took refuge in a gurjon tree, and was killed
    after the wronged strong figure planted spikes and forced the tree into the ground.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mava .chol-'s spirit did not pass to .chd'itd'n- (Hades), but stayed on an
    invisible bridge; later descendants were sent there as black birds with long tails.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A woodpecker found a black honeycomb in a hollow tree, invited a toad to share
    it, lowered a creeper and bucket, and then let go, causing the toad to fall.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The toad retaliated by draining streams across the island, causing distress;
    when he danced, the water flowed from him and the drought ended.
  category: sequence
  evidence_refs:
  - ev:9
