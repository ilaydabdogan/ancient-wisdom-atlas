canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese hunting and turtling practices: limits
    on bird shooting, hunting gear, pig tracking and drive-hunting, rules for carcass
    ownership and communal distribution, feast narration and post-repast song and
    dance, turtle-hunt timing and locations, turtle species preferences, and refusal
    to capture turtles by turning them onshore.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Birds, waterfowl, ducks, and flying-foxes are sometimes shot, but not while
    flying or when an arrow might be unrecoverable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described hunting equipment includes bows, arrows, a hone, a Cyrena shell
