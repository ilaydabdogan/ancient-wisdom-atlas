  text: The passage says no stratagems, decoys, snares, or pitfalls are used for game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When without dogs, hunters follow pig tracks, surround the animal quietly,
    then rush forward yelling and shoot arrows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pig driving is described as common near the coast and Rhizophora roots, where
