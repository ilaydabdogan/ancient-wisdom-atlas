canonical_text:
  quote: ''
  summary: 'Ethnographic description of Andamanese aquatic subsistence practices:
    spearing turtles and sting-rays, correcting exaggerated reports about diving,
    fishing with hand-nets, bows, plant seeds, and large creek nets, followed by a
    brief skeptical introduction to claims about canoe navigation and speed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On dark nights, turtles are speared when they surface to breathe; the slight
    sound helps a hunter on the projecting prow aim the harpoon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After harpooning a turtle, the hunter may jump into the water to prevent the
    barbed head from slipping out as the line drags.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a turtle is too deep to spear from the canoe, the harpooner may leap
    feet foremost into the water with the spear and attempt to transfix it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After a sting-ray is speared and dragged to the boat, one person seizes its
    tail, holds it with the teeth, and knocks off the tail spike or spikes before
    the animal is brought into the canoe or to shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage rejects accounts implying that Andamanese divers routinely catch
    uninjured fish underwater; it says they dive after fish that have first been struck
    by arrow or harpoon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hook-and-line fishing is described as unknown to, and not favored by, the
    Andamanese in this account.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: At low water, women and children use hand-nets to capture fish and shellfish
    left by receding waves in rocky hollows on the foreshore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the turn of the tide, men stand waist-deep in water or pole canoes along
    the shore and shoot fish with bows and arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Crushed seeds of a plant called to'rog are sometimes thrown into creeks to
    drive fish and prawns from hiding places, making them easier to catch in hand-nets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Large nets were formerly, and in more distant communities still are, spread
    at creek mouths to catch turtles and large fish.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the large-net method, one side of the net is weighted with stones while
    the other is held up by floating alaba-tree sticks with cane leaves attached.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fish are driven into the net by beating the water with bamboo shafts of turtle
    spears; disturbance of a floating log and its leaves indicates where a turtle
    or fish has entered the net.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage introduces a navigation section by expressing surprise at earlier
    high praise for Andamanese canoe construction and claims of extraordinary canoe
    speed.
  category: speech
  evidence_refs:
  - ev:8
