canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese amusements and entertainments: throwing
    and target games, women''s adornment activity, boys'' wrestling and mock burials,
    children''s animal and pretend-feast play, water play and miniature canoes, adult
    dance-song entertainments, event-based festivities, large gatherings organized
    by a head chief, preparation of occasion-specific songs, and inter-community presentation
    or barter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unspecified participants compete in throwing a weighted string upward into
    a tree, skimming Cyrena shells for distance, playing ducks-and-drakes with flat
    stones, and shooting at a rolling root or pod.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are described as having no special amusements, with their chief delight
    said to be adorning relatives with designs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young boys wrestle on sand and play at mock burials.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the mock burial play, one child is covered with sand until only the head
    is visible; fire is placed nearby; the play usually occurs near a landmark; the
    child jumps out when finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Children sometimes tie a fine string to the leg of a toad or tree-lizard;
    unless elders interfere, the sport ends with the captive animal's death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Children search for small crabs and fish and have them cooked for a sham banquet
    or pretend feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Boys play at seizing one another under the surface of the water and float
    tiny canoes toward one another; they are also provided early with miniature bows
    and arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chief adult diversion is an entertainment with dancing and singing for
    many hours by moonlight or camp fires.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Successful hunts, visits, the beginning of a new season, recovery from illness,
    marriage, and the end of mourning can serve as occasions for entertainments.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Large tribal gatherings are organized by the head chief after members of a
    distant community offer to give sjeg at the chief's encampment; invitations are
    then sent to those within easy distance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Before the gathering, the proposers prepare a song and chorus, often composed
    for the occasion by a volunteer who sings the solo and trains the chorus.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The song subject is usually a recent personal or tribal exploit or adventure;
    women alone are instructed in the refrain, and rhythm is emphasized.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Visitors bring implements or articles that are more common in their community
    for presentation or, more exactly, barter.
  category: action
  evidence_refs:
  - ev:10
