literal_observations:
- id: obs:1
  text: Whetstones and hammers are described as mediums of exchange, but without great
    value or associated superstition, and are discarded when no longer serviceable.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that stones are not used by the Andamanese for cutting
    wood or bone; bone is usually crushed with a hammer for marrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before iron, small holes were bored with bone or shell pieces, and shells
    were generally used for purposes such as scraping or sawing rather than stone
    implements.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Andamanese are reported to deny having made stone arrow-heads, axes, adzes,
    or chisels, even when iron was scarce.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Fragments found in kitchen-middens are described by the Andamanese as quartz
    flakes or broken cooking stones or hones discarded as rubbish when no longer useful.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Stones are said not to be regarded as thunderbolts, worn as amulets, placed
    in water before working, bored with holes, ground, or polished.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:7
  text: Baskets are made from selected specimens of a common cane called fvdga-.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Basket-making includes removing leaves, cutting cane into lengths, shredding
    the cuticle into strips, splitting cane for longer pieces, and using shorter cane
    lengths as ribs or stakes for weaving.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A basket base is constructed with a recessed 'kick' so the basket can stand
    steadily; the maker begins weaving while pressing the stakes with the heel over
    a small hole in the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Basket handles are formed from bark of Melochia velutina, and stripes of td'la-dg-
    and kbvoh- are added as ornamentation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: No method of making the baskets waterproof is known, and baskets are not used
    as pottery moulds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: When travelling, earthen vessels may be placed in loose wicker casings for
    protection and easier carrying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: The passage distinguishes baskets of the five .bd'jig tribes from those made
    by the .ye'rewa-, noting that .ye'rewa- baskets are more neatly finished and have
    smaller openings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Baskets are used for many purposes by men, women, and children, last several
    months under rough use, and are not used as strainers or colanders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: A fine net called chd''panga- is said to serve the function of strainer or
    colander.
  category: object
  evidence_refs:
  - ev:4
- id: obs:16
  text: The next section begins by stating that the Andamanese do not produce stout
