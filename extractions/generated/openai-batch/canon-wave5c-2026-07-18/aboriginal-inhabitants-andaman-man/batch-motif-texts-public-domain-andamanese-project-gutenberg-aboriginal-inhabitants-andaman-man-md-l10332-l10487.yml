  summary: 'The passage lists several Andamanese geometric ornament patterns and the
    objects on which they are painted or cut. It then describes Andamanese pottery:
    evidence from kitchen-middens and traditions, current manufacture, clay and tools
    used, absence of a potter’s wheel, coil-building steps, smoothing with shell,
    and barter of pots among communities.'
