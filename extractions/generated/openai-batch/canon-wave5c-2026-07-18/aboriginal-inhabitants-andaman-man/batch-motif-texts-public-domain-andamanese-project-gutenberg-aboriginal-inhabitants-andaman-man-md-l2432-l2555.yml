  quote: ''
  summary: The passage describes Andamanese practices around childbirth, diet, treatment
    of pain, wounds, skin disease, constipation, epilepsy, snakebite, insect bites,
    elephantiasis naming, bandaging, and observed bodily expressions associated with
    emotions and mental states.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After childbirth, water is given to the woman to drink, and she is fed meat-gravy
    and fish-boiling water before other foods are gradually allowed; meat is withheld
    for a time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the first two or three days after childbirth, the woman remains sitting
    and is propped up by arranged articles forming a couch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For ear-ache, head-ache, and tooth-ache, treatment first uses chauga-ta, followed
    by scarification if pain and swelling continue.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Skin disease is treated by applying a large smooth stone warmed over a fire
    to the affected parts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wounds from thorns, stones, shells, and similar causes are treated with hot
    water poured from a Cyrena shell, followed by applying the heated shell; slight
    injuries may be treated by sea-bathing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Boils are treated by scarifying around the swelling and then bathing the area
    with chuinga lotion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bee larvae attached to honeycombs, or certain fruits in season, are eaten
    to correct constipation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Epilepsy is treated by sprinkling the patient with cold water and scarifying
    the brow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For snakebite, if the snake is killed, it is cut open and kidney fat is rubbed
    into the wound; if the snake is not captured, a ligature is tied above the bite
    and the flesh around it is scarified.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Centipede bites are treated with urine, while scorpion bites are described
    as receiving no attention because the scorpions are small and comparatively harmless.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bandages of leaves are applied to gunshot wounds, ulcers, fractures, sprains,
    or bruises.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Good spirits, low spirits, grief, thinking, astonishment, surprise, disgust,
    shame, defiance, fear, and laughter are described through visible bodily gestures
    and facial expressions.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
