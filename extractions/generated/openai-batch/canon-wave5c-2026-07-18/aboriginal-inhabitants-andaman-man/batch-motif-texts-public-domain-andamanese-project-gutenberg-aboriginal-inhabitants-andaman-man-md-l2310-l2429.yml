canonical_text:
  quote: ''
  summary: The passage describes treatments for illness, including fire, sea-water,
    plant substances, necklaces or charms called chauga-ta, warm water, massage, sucking
    of the skin, scarification, and melted black beeswax. It states that some internal
    diseases are attributed to an evil being and that human-bone necklaces are believed
    to cure disease and protect wearers from evil spirits through the intervention
    of a disembodied spirit. It also describes pregnancy practices and childbirth
    assistance by the husband and female friends, including use of a leaf screen,
    cord severing with a shell or blade, and washing and scraping the infant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For a cold in the head, sufferers remain at home and crouch over the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a cough, treatments include drinking sea-water, chewing named plant substances,
    tying chewed fibre around the neck, swallowing plant sap, and taking daily quantities
    of chuinga until the cough ceases.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For rheumatism and paralysis, a chauga-ta is tied around affected parts, chuinga
    is rubbed in, warm water may be poured over the members, the limbs may be shampooed,
    and scarification may be used if other measures fail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Scarification for rheumatism or paralysis is done with a quartz or glass flake
    by a woman, generally the wife or a near female kinsperson of the sufferer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In phthisis or internal disease, the patient's friends take steps to defeat
    the machinations of the evil one, to whom the sufferings are attributed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: For internal disease, chauga-ta are fastened over the seat of pain and black
    beeswax is melted over a fire and rapidly passed over the flesh, leaving adhering
    wax to wear off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For internal disease, a relative or friend of the same sex applies pressure
    with the hands, an attendant frequently sucks the skin, and scarification is used
    if symptoms worsen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sick receive attention from friends, and no charms except chauga-ta are
    employed to avert or cure illness; after recovery, no purification ceremonies
    occur.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Human-bone necklaces are believed to cure diseases and partly shield the wearer
    from evil spirits through the intervention of a disembodied spirit gratified by
    respect paid to his memory.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bones used in such necklaces may belong to an adult, a child, or one long
    dead; loose human teeth may be strung as necklaces or included among broken bone
    pieces, and turtle bones may also be added.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Skulls and jawbones are carried separately or together as mementoes and are
    not credited with special virtues.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: During pregnancy, women eat moderately but seek varied food, tell their husbands
    what to procure, take active exercise, and consume small amounts of td'la-dg,
    which is said to conduce to easier childbirth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At confinement, the woman is attended by her husband and female friends, placed
    in a sitting posture, supported by her husband, screened by female friends, assisted
    in delivery and removal of after-birth, and the infant is washed and scraped after
    the cord is severed.
  category: sequence
  evidence_refs:
  - ev:8
