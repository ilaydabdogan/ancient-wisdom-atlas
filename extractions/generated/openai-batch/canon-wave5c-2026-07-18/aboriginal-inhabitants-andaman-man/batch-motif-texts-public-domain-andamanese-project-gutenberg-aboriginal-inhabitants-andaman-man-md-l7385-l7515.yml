canonical_text:
  quote: ''
  summary: 'The passage records several Andamanese legends: the first tattooing after
    the first discovery of iron; post-Deluge rediscovery of body pigments; discovery
    and spread of yams after the death of the discoverer; creation of a woman from
    firewood in a footnote; transformation of inattentive women into sea animals and
    fish; a creation inscription on a sandstone block at .wbtdem''i-; and a legend
    of enormous uxhu- creatures that devoured people before dying stuck in mud.'
  language: English
  quote_policy: summarized
