canonical_text:
  quote: ''
  summary: The passage describes Andamanese manufacture and use of iron, stone, quartz,
    glass, and heated stones for tools, cutting flakes, tattooing, shaving, scarifying,
    cooking, and whetstones. It emphasizes cold-working of salvaged iron, continued
    use of stone implements, women's role in flaking, replacement of quartz/flint
    chips by glass among groups in contact with the author, and the stated absence
    of quartz fire-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that smelting and forging were unknown arts among the people
    described, who had until comparatively recent times been largely ignorant of iron
    and its uses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salvaged iron is reduced and shaped by cold hammering with a hard smooth stone
    on a stone anvil, breaking off excess metal, and grinding the new edge on a hone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some people living at Port Blair use old chisels to make arrow-heads and other
    implements more quickly, while pointed weapons are made from stout wire or large
    nails by hammering and grinding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says many inhabitants have not fully passed out of the stone age;
    more distant tribes retain stone and other implements, and Port Blair inmates
    still sometimes use stone implements by choice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The listed ordinary stone implements include a stone anvil, stone hammer,
    whetstone, quartz chips or flakes, and cooking stones.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Cooking stones are common pebbles heated and placed around food intended to
    cook.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A new whetstone is made by selecting soft sandstone; if the block is too large,
    it is placed on a fire until it breaks, then shaped with a hard smooth stone hammer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Quartz chips and flakes are used only once; blade-like edges are reserved
    for shaving, and pointed flakes for tattooing or scarifying; used flakes are discarded
    to prevent injury.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Flaking is described as one of the duties of women, and the note adds that
    all women can scarify and act as barbers, though fewer undertake tattooing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: For making quartz chips, two pieces of white quartz are used; one is heated,
    allowed to cool, held firmly, and struck at right angles with the other stone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Glass chips are said to be generally preferred by those in communication with
    the author because they are sharper and more effective, and they are obtained
    from thick bottle bases by the same method.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage rejects reports that stone chips or glass flakes are hafted in
    sticks, stating that the Andamanese themselves say they never haft them and do
    not sharpen stone chips after production.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Quartz is described as commonly available in the country occupied by friendly
    tribes, used only for the indicated purposes, and not used for producing fire.
  category: attribute
  evidence_refs:
  - ev:8
