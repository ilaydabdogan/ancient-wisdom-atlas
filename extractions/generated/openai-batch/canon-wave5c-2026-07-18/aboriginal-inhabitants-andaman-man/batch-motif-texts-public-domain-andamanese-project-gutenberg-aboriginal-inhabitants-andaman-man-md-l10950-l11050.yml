canonical_text:
  quote: ''
  summary: The passage describes Andamanese manufacture of cordage, nets, mats, bowstrings,
    ornaments, and related articles from bark fibres of several plants. It records
    scraping with Cyrena shells, drying in sun or fire, twisting and waxing methods,
    gendered work divisions for some fibres, a belief that unconverted yodba fibre
    contaminates turtle flesh, temporary restrictions on people who handled yodba,
    and the use of yodba or Cyrena shells as safeguards against sharks and dangerous
    fish while swimming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies alaha, pldita, and yodba as bark-fibre sources used
    for making cinctures, lines, nets, mats, bowstrings, reticules, necklaces, and
    twine.
  category: object
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: For alaha fibre, a male member is expected to procure a suitable branch, remove
    the bark, scrape it with a Cyrena shell, dry the fibres, and work them into yarn
    or cord.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alaha cordage may be coated with black wax for added strength or durability
    and is worked with an implement called kudegbo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The resulting bedma cord is used for harpoon-lines and turtle-nets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Preparation and manufacture of pldita fibre for hand fishing-nets and sleeping-mats
    are said to involve women exclusively.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yodba fibre is used for bowstrings, reticules, necklaces, and twine for arrow
    fastenings, and its manufacture is not restricted to either sex.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Andamanese are reported to believe that yodba plant material or fibres,
    before being converted into twine or bowstrings, can make turtle flesh uneatable
    if placed near it.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Turtle meat considered contaminated by yodba is thrown away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person who has collected or prepared yodba is barred for up to three days
    from cooking turtle or accompanying a turtling expedition.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sharks and other dangerous fish are believed to detest yodba and Cyrena shells,
    so yodba, Cyrena shells, or both are attached to cinctures as safeguards before
    swimming in infested waters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The yellow skin of the root of an orchid called rd is used with yodba string
    in personal ornaments and sometimes in weapon decoration, but not where strength
    is required.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ordinary string can be made by twisting prepared filaments on the thigh, rolling
    two lengths together, and smearing beeswax over the result.
  category: action
  evidence_refs:
  - ev:9
