canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Andamanese handling of hunted or kept
    pigs and other animal food: cutting, cooking by fire, boiling or baking, distribution
    of portions, consumption of organs and skin, food abstinence associated with initiatory
    ceremonies, and cooking choices affected by fear of chdl demons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An animal may be cut up and distributed without even partial cooking; the
    person undertaking distribution is under a tacit obligation to help the slayer
    and himself to the last two portions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small pigs caught alive may be kept and fattened for later slaughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the described pig preparation, entrails, lungs, liver, kidneys, and similar
    parts are first removed and replaced by selected leaves, which are set on fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leaves used inside the carcass are selected as free from scent and taste
    so that they will not affect the flavor of the meat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The carcass is placed on burning logs until the bristles are singed and the
    skin is dry enough for dirt to be scraped off, not until the meat is thoroughly
    cooked.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After charred leaves are removed and tendons at the joints are severed, the
    carcass is cut up and distributed; the operator may take choice morsels as a perquisite.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lining and flesh of the stomach and the thoroughly cleansed skin of the
    entrails are consumed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kidney-fat and omentum are described as luxuries from which young persons
    of both sexes must abstain during a certain period.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lungs, liver, eyes, and crackling are eaten; crackling is described as one
    of the choicest parts.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Baking pigs is described as risking offense to the chdl demons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: When dread of demons is paramount, pork is boiled; because the pots are small,
    pieces are removed and replaced in turn until the whole is thoroughly done.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stated reason for rotating the boiled pieces is that the flavor of the
    whole animal is thereby equally distributed in every portion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: On some occasions the pig is apportioned among several families of the community
    for cooking in their own huts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Flesh may be baked in leaves by means of heated stones placed between alternate
    layers of meat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note says the cook must taste a morsel before all present; if the chief
    is present, the chief receives the first and largest share, followed by men, then
    women and children, with the remainder going to the distributor.
  category: sequence
  evidence_refs:
  - ev:9
