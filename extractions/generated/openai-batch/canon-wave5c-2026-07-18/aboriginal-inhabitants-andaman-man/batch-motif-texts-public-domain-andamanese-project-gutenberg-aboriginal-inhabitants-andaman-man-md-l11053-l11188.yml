canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese net-making and related joining techniques,
    then surveys games and amusements: children learning English games, local analogues
    to blind-man’s-buff and leap-frog, mock pig-hunting, mock night attack, sea turtling
    play, an evening performance involving the Evil Spirit of the Woods and a feigned
    dead-person identity, creeper swinging, swimming and canoe races, and contests
    moving through dense Alpinia growth.'
  language: English with Andamanese lexical items
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Andamanese skill in net-making, including regulating
    mesh size with a finger and using bamboo netting needles; it also describes joining
    leaves for screens and repairing canoes by boring holes and threading cane strips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author introduces games and amusements, notes that children in the Orphanage
    enjoyed being taught English games such as kite-flying and see-saw, and states
    that some Andamanese pastimes resemble blind-man’s-buff, leap-frog, and hide-and-seek.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the blind-man’s-buff-like game, large leaves are fastened over a player’s
    eyes, and that player must catch the person who blinded him while other players
    pull and jostle him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the leap-frog-like game, one man squats on his heels while another jumps
    over him without touching him and then takes the same position.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In mock pig-hunting after dark, one player acts as the pig, runs about at
    a distance, and imitates grunting, while comrades shoot harmless arrows toward
    the sound until one arrow hits him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In another night game, one man leaves the encampment with u'tara- arrows,
    returns, fires them into different huts, and the occupants hide or run away screaming
    as if attacked by an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the sea turtling game, one end of a long line is held in a canoe and the
    other is fastened to the arm of the man representing the turtle; he dives and
    tries to elude others who pursue him until he is exhausted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In an evening performance, a man says he will go after the Evil Spirit of
    the Woods, takes a lighted log into the jungle, acts as if pursuing or struggling,
    answers a question about his identity in a feigned voice by naming a long-deceased
    person, threatens annihilation when something is thrown at him, sings, is searched
    out and brought back, and then remains silent and feigns sleep.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Players sometimes make an impromptu swing from a long stout creeper hanging
    from a bough and swing each other on it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Young men compete in swimming, feet-first diving from a rock or branch, occasional
    canoe races, and rapid movement through dense Alpinia leaves and stems.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
