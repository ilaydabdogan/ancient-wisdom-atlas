canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese social organization and dispute practices:
    succession to chiefs, status based on skill and generosity, the authority of chiefs’
    wives among women, the stated absence of covenants, oaths, trials, and ordeals,
    self-help justice using a burning faggot or arrow, homicide and possible revenge,
    British punishment for murder near Port Blair, and destructive outbursts interpreted
    as temporary possession.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a chief dies, a successor can be appointed from a deputy or right-hand
    man; choice is usually unanimous, dissent is settled by majority, and dissatisfied
    persons may transfer allegiance to another chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Social status is described as depending on relationship, skill in hunting
    and fishing, and reputation for generosity and hospitality.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chiefs, elders, and their wives may be exempt from daily drudgery, which young
    unmarried persons under their headship voluntarily perform.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Females and minors cannot be chiefs, but a chief’s wife holds a comparable
    position among women and may rule over younger unmarried women and some married
    women.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief’s widow continues to exercise the same rights unless she remarries;
    a young childless widow returns to her maiden home and loses status.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people are said to believe that the described system has existed from
    a remote period.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that no forms of covenant, oath, or appeal to a higher
    power to punish breach of faith or witness truth are found among them.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that there is no form of trial and no belief in an ordeal
    for discovering a guilty person.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Justice is described as self-administered by an aggrieved party, usually by
    throwing a burning faggot or discharging an arrow at or near the offender.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bystanders retreat with as much property as they can carry and conceal themselves
    until enough time has passed for the quarrel to settle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Friends may intervene in a serious dispute by seizing the disputants and removing
    their weapons until the risk of misuse has passed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: If a man kills his opponent, no necessary penalty follows, though a friend
    or relative of the deceased may avenge the death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A murderer may inspire fear in the community and may absent himself until
    the grief and indignation of the victim’s friends have lessened.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage gives an example of an Andamanese youth hanged at Port Blair in
    May 1880 for murder after a prior imprisonment for murder and after warnings about
    future capital punishment.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A man or boy may express resentment by destroying his own property and that
    of neighbors while sparing property belonging exclusively to the chief or other
    head man.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Such destructive outbreaks are described as the result of temporary “possession,”
    with the person considered dangerous and unaccountable, so no one restrains him.
  category: attribute
  evidence_refs:
  - ev:10
