  quote: ''
  summary: The passage describes Andamanese pottery manufacture, firing, sizes, uses,
    portability, disposal, and limits of ornamentation, then describes stones and
    Cyrena shells as tools. Footnotes compare some pottery and tool practices with
    other groups and cited archaeological or ethnographic examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shell is used to give the vessel a more finished appearance before both
    surfaces are engraved with wavy, checked, or striped designs by a pointed stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The utensil is dried in sun or before a fire and is repositioned so all parts
    receive heat; it is then baked with burning wood inside and around it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the pot cracks during baking it is useless; if it does not crack, it is
    cooled and considered ready for use.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: With good management a pot can be fit for use by the end of the day on which
    it is made.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Pots differ mainly in size: large ones suit large parties and permanent encampments,
    while smaller kinds are taken during migration, including after a death or for
    an entertainment elsewhere.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Medium-sized pots usually have a rough basket-work casing that makes them
    more portable and gives some protection.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ordinary pots hold about nine pints; larger ones hold about twice that amount;
    very small vessels are used for making and using kd'ngata-huj.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Except for the very small vessels named, vessels are not reserved for special
    purposes and are used for festivals, migrations, and ordinary occasions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Broken pottery is not buried in graves or beneath landmarks but is thrown
    away as rubbish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that painting, varnishing, models of men or animals, glazing,
    and porous cooling vessels are not made or attempted.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Natural stones are used as anvils and hammers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Cyrena shells are carried or kept ready and used for preparing arrows, sharpening
    knives and a boar's tusk edge, eating gravy, cutting leaves and meat joints, scraping
    plant pulp, making ornamental incisions, preparing a dance appendage, and planing.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A cited passage conjectures that some pottery decoration may derive from basket-work
    impressions or counterfeited rush impressions.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: A footnote says New Guinea people used a shell to sharpen a bamboo knife,
    and the passage says Andamanese bamboo knives resemble former Tahitian and Fijian
    practice.
  category: relationship
  evidence_refs:
  - ev:9
