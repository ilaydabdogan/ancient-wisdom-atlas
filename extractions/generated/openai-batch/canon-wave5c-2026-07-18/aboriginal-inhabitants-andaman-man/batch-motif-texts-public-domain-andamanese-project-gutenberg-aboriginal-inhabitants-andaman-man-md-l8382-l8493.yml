literal_observations:
- id: obs:1
  text: A quoted report says islands on the west side of the Andamans were visited
    in the fine season by Malay, Chinese, and Burmese fishermen seeking beche-de-mer
    and edible birds' nests.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same quoted report accuses some visiting fishermen of carrying off children
    for sale as slaves and recounts a party invited aboard a junk or prow, intoxicated,
    carried away, and sold at Acheen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The quoted report states that Andamanese people retaliated against foreigners
    who fell into their power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another quoted notice says Malays and Burmese obtained edible birds' nests
    either by collecting them or by receiving them from islanders in exchange for
    tobacco and other goods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Andamanese people set no fixed value on property,
    rarely make things expressly for barter, and prefer to frame transactions as presentations
    with an expected equivalent return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that quarrels often arise when a recipient fails to make
    the return that was expected after receiving a present.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Iron-pointed weapons, tools, and shell ornaments are described as readily
    accepted by the named e’rem-tdga- in exchange for items more easily obtained by
    them than by the dry&to-, with examples involving adzes, bows, arrows, canoes,
    and buckets.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Utensils, weapons, and canoes in daily use are described as receiving little
    care and needing frequent replacement; the passage says there is no accumulation
    of former generations' labor and no fixed inheritance law.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a death, the nearest kin is said to take the deceased person's effects,
    which are often later distributed among friends who need the articles.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Property belonging to one family member is described as available to relatives,
    while a cooking-pot, canoe, or sounding-board may be treated like public property
    by members of the same community when not needed by the owner.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author states that before the arrival of strangers the Andamanese were
    ignorant of agriculture.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that the Andamanese prefer cultivated products to wild
    vegetation but judge the labor needed for cultivation to outweigh the benefits.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says the Andamanese had seen only prisoners engaged in tillage
    and therefore associated such work with degradation and loss of freedom.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A quoted statement from Peschel says hunting provides supreme enjoyment and
    that agriculture offers no compensation for the excitement of the chase.
  category: attribute
  evidence_refs:
  - ev:11
