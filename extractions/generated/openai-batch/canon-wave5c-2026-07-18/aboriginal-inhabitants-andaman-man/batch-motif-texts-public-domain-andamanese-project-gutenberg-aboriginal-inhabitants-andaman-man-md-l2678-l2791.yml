canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese movement through jungle terrain, acute
    sight, scent, taste, and hearing, differences between coast and inland groups,
    and several observer-reported social behaviors: effects of foreign contact, caution
    and stealth in conflict, restitution by canoe after damage to a government boat,
    and sparing chained prisoners while targeting unchained officers at Port Blair.'
  language: English
  quote_policy: summarized
