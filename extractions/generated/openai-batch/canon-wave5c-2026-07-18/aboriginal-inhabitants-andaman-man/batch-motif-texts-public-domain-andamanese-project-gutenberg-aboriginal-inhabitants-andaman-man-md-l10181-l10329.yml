canonical_text:
  quote: ''
  summary: The passage describes Great Andaman canoe types, buoyancy and recovery
    after capsizing, seasonal dug-out canoe construction, anchors and propulsion,
    women’s roles in propulsion and ornamentation, and customary geometric ornamentation
    using shells, pigments, shells, seeds, bones, skulls, and jawbones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage concerns Great Andaman canoes, including large plain and outrigger
    varieties, with a note that the latter are generally small in carrying capacity.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Both described canoe types are said not to sink because of the wood; when
    they capsize or fill from a heavy wave, occupants right them and bale water while
    clinging to the sides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Most canoe-making is said to occur in August, September, and October; about
    eight men spend about a fortnight hollowing a dug-out and forming the prow from
    a selected trunk using an adze.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that fire is not currently used to expedite the hollowing
    process and adds that no traditions are known to support a past custom of doing
    so.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Canoes are described as having a bottom and water-level thickness never less
    than about 1.5 to 3 inches, which is presented as necessary for rough treatment
    and carrying spoils from turtling.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Andamanese anchor is described as a heavy stone or large lump of coral
    fastened to a stout line; rafts are said to be unknown at the present day.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Canoes are propelled along the shore with the haft of a harpoon spear and
    in deep water with paddles; women frequently assist except when men are engaged
    in turtling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Paddles are said never to be made by women, but their ornamentation is entrusted
    to women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the Andamanese ornament utensils, weapons, and related objects
    but do not represent natural objects or devise new patterns, instead following
    custom-prescribed designs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ornamentation is made with a Cyrena shell or painted with three substances
    that provide brick-red, white, and brown colors.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Small land and sea shells, certain seeds, and bones are prized for personal
    ornaments and for adorning weapons and implements; human skulls and jawbones are
    also worn and carried.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The listed designs include chevrons, cross lines, parallel lines, and parallel
    lines with zigzag, applied to items such as bows, buckets, canoes, paddles, baskets,
    and a sounding board.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
