canonical_text:
  quote: ''
  summary: The passage describes Andamanese beliefs about afterlife regions, souls
    and spirits, deceased children, ancestral transformation, dream travel, resurrection,
    a future renewed earth, and a divinely commanded earthquake that overturns the
    earth. It also denies worship of trees, stones, celestial bodies, or the moon,
    and introduces Pu'luga/Fu'luga as creator.
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In .chd'itd'n-, no change of growth or age occurs; adults remain as at death
    and engage in hunting in a manner peculiar to disembodied spirits.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spirits of animals and birds are sent to .chd'itd'n- for sport; because there
    is no sea there, the chdni'ga- of fish and turtle remain in their native element
    and are preyed on by .ju ru-win-.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spirits and souls of children who die while still entirely dependent on
    parents go to .chd'itd'n- and are placed under a rdu tree, whose fruit sustains
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who have entered .chd'itd'n- cannot leave; a tradition says an dlco-pai'ad-
    received a dream vision of its regions and the pursuits of disembodied spirits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some legends are said to support transmigration of souls, with certain ancestors
    vanishing from earth in forms of animals and fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spirits of ancestors not transformed, though in Hades, are believed to assist
    with unusually difficult tasks, know something of worldly events, and promote
    welfare for those who remember them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: An invisible cane bridge stretches between the earth and the eastern sky,
    steadies the earth, and connects it with .jereg-; departed souls pass over it
    to paradise or to the lower .jereg-ldr-mu'gu-.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: ".jereg-ldr-mu'gu- is described as a place of punishment for heinous sins
    such as murder and as very cold."
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: In serious illness, the sufferer's spirit is said to hover between this world
    and Hades; after death, before permanent residence in Hades, it haunts the deceased's
    abode and the place where remains were deposited.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In dreams, the soul is said to depart through the nostrils and see or do what
    is represented to the sleeper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Reflections, not shadows, are regarded as souls; the soul is said to be red,
    the spirit black, both invisible to ordinary human eyes and shaped like the person.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Evil is said to emanate from the soul and good from the spirit; at resurrection
    they will reunite and live permanently on the new earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The future life is described as repeating present life, but with people remaining
    in prime of life, without sickness, death, or marriage; animals, birds, and fish
    reappear in their present form.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: A great earthquake at Fu'luga's command will break the invisible cane bridge,
    cause the earth to turn over, kill those then alive, and make them exchange places
    with deceased ancestors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage states that there is no tree, stone, object, celestial-body, or
    moon worship, and no festival or dance for the new moon.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: Pu'luga is described as creator of all; the formation of the earth's surface
    and the seasons are attributed to his will.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The author states that traditions about origin exist and that much information
    came from older, intelligent members of distant communities rather than necessarily
    from younger people nearby.
  category: other
  evidence_refs:
  - ev:11
