  quote: ''
  summary: 'The passage describes Andamanese food and water practices: obtaining liquid
    from ground rattan, opening and cooking shellfish, eating fish and pigs, seasonal
    hunting and bodily condition, preparation of several edible roots, and occasional
    use of seaweed seed and mangrove fruits.'
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When away from home, some people assuage thirst by cutting a piece of ground
    rattan; the text says this practice is known only to South Andaman people and
    was borrowed from Burmese convicts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain shellfish are opened without an adze, using a Cyrena valve, a wooden
    wedge, or brief placement among burning logs, depending on the species.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some shellfish are removed from burning logs with bamboo tongs and transferred
    to a pot containing a little water for boiling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oysters are said formerly to have been eaten cooked, while current consumption
    is described as confined to North Andaman and possibly Little Andaman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mullet is reported as a favourite fish, and the author states that apparently
    few fresh-water or salt-water fish are not eaten.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pig hunts are described as most frequent during the rains, when pigs are more
    plentiful and in better condition and when the season of jungle fruit and honey
    abundance has ended.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the cool period, people are alleged to become thinner; this is attributed
    to the meagre condition of breeding pigs and to roots and fruits then in season
    being less fattening.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Six varieties of edible roots are listed and are eaten alone, preferably cold,
    with preparation varying according to acrid flavour.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Roots are prepared by methods including direct firing, boiling in a pot, wrapping
    in leaves and baking on burning logs, cooking with hot stones, soaking in water
    to reduce bitterness, and removing outer skin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A seaweed seed eaten by turtles and dugongs is carefully cooked and eaten
    as a relish; fruits of three mangrove varieties are occasionally eaten for change.
  category: object
  evidence_refs:
  - ev:8
