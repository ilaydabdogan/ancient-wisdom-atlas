canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese painting and shaving practices: three
    pigments are used for bodily adornment and as signs of mourning, sickness, festivity,
    heat, scent masking, decoration, and treatment. It also reports a tradition that
    Pu''luga taught painting to the first parents, that the art was lost after the
    Deluge, and that it was later revived through rediscovery of pigments. A newborn''s
    head is shaved and painted soon after birth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In addition to permanent tattooing, three pigments are used for bodily adornment,
    and the manner of application can indicate sickness, sorrow, or participation
    in merry-making.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Designs are not distinguished by rank or sex, and people are ordinarily not
    painted in exactly the same way.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Unmarried persons are described as temporarily restricted from using paint
    in a specified way, either as ornament or for pain relief.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a tradition that Pu'luga instructed the first parents
    in painting; the art was temporarily lost after the Deluge and later revived when
    the necessary pigments were accidentally rediscovered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three named painting materials are og-, tdia-og-, and khi'ob-, applied
    as a wash or in designs with the nail or fingertips.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Og- is a pale whitish-grey clay mixed with water and smeared thickly over
    the body to denote mourning; a lump of the same compound is also placed on the
    head during mourning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After eating pork or turtle, people smear og- over their bodies in the belief
    that evil spirits will not detect and be attracted by the smell of the food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Og- is also applied thinly when a person is heated by travelling, hunting,
    or dancing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tdia-og- is a comparatively scarce pure white clay applied ornamentally in
    fine patterns to cheeks, body, and limbs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women execute tdia-og- designs on relatives for a jeg- or other festivity
    and compete in variety and neatness of work.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Khi'ob- consists of burnt yellow ochre mixed with melted animal fat and sometimes
    almond oil.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Khi'ob- is used in decorating the living and the dead and as a remedy in certain
    forms of suffering, but not for mourning or insect protection according to the
    passage.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tdia-og- and khi'ob- are also used to adorn weapons, utensils, and other daily-use
    objects.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Khi'ob- is applied with fingertips in rough zig-zags and stripes over the
    body, and the designs are quickly effaced as body heat liquefies the pigment.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Within a few hours of birth, an Andamanese baby's head is shaved and painted
    with khi'ob-, while its face and body are adorned with a tdia-og- design.
  category: sequence
  evidence_refs:
  - ev:11
