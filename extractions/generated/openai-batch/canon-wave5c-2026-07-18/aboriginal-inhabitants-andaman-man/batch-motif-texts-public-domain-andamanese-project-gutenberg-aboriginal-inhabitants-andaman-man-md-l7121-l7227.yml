canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which .t&mo-'s descendants become numerous
    and are dispersed in pairs by Pu'luga-/Puduga-, each with equipment, fire, and
    a distinct dialect. .t&mo- drowns and becomes a cachalot, while his wife and others
    are drowned and transformed into other animals. After later disobedience, Pu'luga-/Puduga-
    sends a flood that destroys living beings except four people in a canoe; animals
    and birds are re-created. The survivors lose fire until a deceased friend in bird
    form flies to the sky and attempts to seize a burning log from Pu'luga-/Puduga-'s
    fire; the log falls near the survivors. The survivors later contemplate killing
    Pu'luga-/Puduga-, but he warns them and explains the flood as punishment for disobedience.
    The passage says this is his final visible communication and that his commands
    continue to be observed.
  language: English
  quote_policy: summarized
