  summary: The passage introduces Part I of an ethnographic work on the Andamanese.
    It discusses obstacles to earlier knowledge, early references to the islands,
    possible derivations of the name “Andaman,” and the author’s views on the origin,
    racial classification, isolation, intertribal variation, and demographic decline
    of the Andamanese under contact with civilization.
