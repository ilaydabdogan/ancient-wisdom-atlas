canonical_text:
  quote: ''
  summary: The passage describes betrothal, affinal avoidance rules, arranged marriage,
    irregular unions, a nonreligious marriage ceremony, post-marriage seclusion and
    shyness, wedding gifts, body painting, and a concluding dance among the Andaman
    Islanders as reported by the source.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After betrothal is agreed upon, the girl is taken to the hut of her future
    father-in-law or foster father-in-law, and the children remain together for several
    months so the engagement becomes generally known.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If one member of a betrothed pair dies young, the survivor does not take part
    in the obsequies and may form another alliance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man before middle age shows reciprocal shyness with the wife of a younger
    brother or cousin, while the wife of an elder brother or cousin may receive respect
    similar to that accorded to a mother if she is much older.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that lovers do not customarily announce a desire to marry;
    a guardian or community chief arranges matters when he observes attachment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bachelor or widower found asleep in a hut occupied by unmarried females,
    beside a woman, is regarded as irregularly united with that woman, with no ceremony
    or entertainment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the marriage ceremony has no invocation of a Supreme
    Being and nothing religious attached to it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the formal ceremony, the bridal party assembles at the chief's hut or
    in a hut occupied by unmarried women; the bride sits apart with matrons, and the
    bridegroom sits among bachelors.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief or elder approaches the bridegroom, who assumes modest reluctance
    and is led or nearly dragged toward the fiancee; a young bride may weep and hide
    her face while attendants straighten her legs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bridegroom is made to sit on the bride's thighs, torches are brought close
    so all present may witness, and the chief pronounces them married.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Unless settling elsewhere, the newly married couple does not leave the encampment
    for food or other needs, because friends supply them until post-marriage shyness
    wears off.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Relatives and acquaintances give the married pair ordinary-use articles such
    as nets, buckets, bows, and arrows as wedding presents.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the morning after the marriage, the bridegroom's mother or another near
    female relative paints him with tdia-dg-, and the bride is similarly ornamented
    by friends.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A young couple may spend several days after marriage without speaking to or
    looking at each other.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: After a few days, the couple enters ordinary duties, and the marriage is celebrated
    by a dance in which all except the bride and bridegroom participate.
  category: sequence
  evidence_refs:
  - ev:11
