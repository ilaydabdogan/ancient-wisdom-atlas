canonical_text:
  quote: ''
  summary: The passage describes Andamanese naming and address customs connected with
    pregnancy, motherhood, marriage, personal nicknames, and puberty. It notes that
    an unborn child's chosen name may be used by the mother before birth and by others
    to designate the parents. It also describes women's flower and birth names, men's
    nicknames based on personal peculiarities, and initiatory ceremonies involving
    a puberty fast, novice titles, food restrictions, and a chief's decision about
    when probation ends.
  language: English with transcribed Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near delivery, a woman may speak as if the unborn child, identified by its
    chosen name, is fidgeting, clawing, or ready.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During pregnancy, both the woman and her husband are described by a term glossed
    as “bad hair,” explained in the passage as an allusion to the foetus.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman's “flower” name gives way to a more dignified form when she is married
    and a mother; a childless married woman may also eventually receive the title
    chawa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The combination of flower and birth names is said to reduce the chance of
    two women in one community having the same names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men do not have an equivalent flower-name custom; nicknames are given and
    generally indicate personal peculiarities.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage gives examples of male nicknames based on large feet, a hand lost
    from snake-bite, and good looks, and says such names may cling to the bearer for
    life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Seniors may address a young married man by his wife's name and prospective
    designation, and an unborn child's name may be used beforehand to denote its parents.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At or soon after puberty, a fast kept during preceding years or months is
    broken, and the prefix gu'ma, glossed as denoting a neophyte or novice, is attached
    to a boy's birth-name.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fasting period begins between the eleventh and thirteenth year, lasts
    one to five years, is observed by both sexes, and lasts longer for girls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the fasting period, turtle, honey, pork, fish, and several other favored
    foods are forbidden, while other foods may be eaten in larger quantity.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chief, not the youth or maiden, decides when the probationer may resume
    eating the restricted foods after endurance and self-denial have been sufficiently
    tested.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some probationers are said to have chosen to prolong the abstinence period,
    and exceeding the average period is described as a cause for boasting.
  category: action
  evidence_refs:
  - ev:7
