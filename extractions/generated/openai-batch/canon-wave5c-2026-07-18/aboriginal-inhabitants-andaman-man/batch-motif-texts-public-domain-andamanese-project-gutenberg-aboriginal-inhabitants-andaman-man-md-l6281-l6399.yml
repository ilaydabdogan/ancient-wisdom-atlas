canonical_text:
  quote: Fire is supposed to possess the power of driving away evil spirits
  summary: The passage describes Andamanese uses of fire in huts and travel, denies
    sacred household or council-fire rites, corrects a report about so-called oven-trees,
    and records beliefs about fire as protection from spirits, Moon-related light
    taboos, meteors, darkness, and quiet conduct before sunrise.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Each occupied hut is said to have a fire used for warmth, driving away insects,
    cooking food, and producing smoke that preserves provisions stored above it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says council fires and fires for special occasions are not institutions
    among the people described, and that household fire is not treated as sacred,
    symbolic of family ties, ritually connected, polluted, or purificatory.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fires are generally kindled by fanning embers with a frond of Asflenmm nidus,
    and extinguished by pressing burning logs against an object such as a tree, canoe,
    or stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage rejects reports of Andamanese “oven-trees,” explaining the visible
    tree hollows as traces from repeated fires lit near buttress-root shelters during
    halts or storms.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women collect the wood, while maintaining fires at home or during travel by
    land or sea may be done by persons of either sex who have leisure or fewer burdens.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Matches introduced by the author’s group are said to have impressed the Andamanese,
    who viewed easy fire production by that means as evidence of superhuman gifts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Fire is reported to be believed capable of driving away evil spirits; when
    the dreaded e'rem-chdu'gala is imagined approaching at night, burning logs are
    thrown into the surrounding jungle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Anyone leaving the huts at night is said to take fire as protection against
    nearby demons, and a torch is also taken when it is very dark.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Darkness is said to have been instituted because of the misconduct of two
    ancestors.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the first few evenings of the Moon’s third quarter, when the Moon rises
    after sundown, people preserve silence, stop work or travel, and almost extinguish
    any fire or light until the Moon has ascended a few degrees.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The full Moon’s glowing appearance at the horizon is said to indicate anger
    at persons who neglect the conciliatory measures, and the Moon may punish by withdrawing
    or diminishing the light of his countenance.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Meteorolites are said to have no superstition attached, but shooting stars
    and meteors are viewed with apprehension.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Shooting stars and meteors are believed to be lighted faggots hurled into
    the air by e'rem-chdu'gala to find people nearby; people away from camp hide and
    remain silent before resuming activity.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Between dawn and sunrise, noisy work is avoided lest the sun be offended and
    cause an eclipse, storm, or other misfortune; travelers or hunters go quietly
    and avoid testing bow-strings because of the snapping sound.
  category: action
  evidence_refs:
  - ev:11
