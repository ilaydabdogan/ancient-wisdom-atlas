canonical_text:
  quote: ''
  summary: 'The passage first criticizes reports attributed to Dudhndtli/Hudhnath
    as exaggerated. It then states that a widow distributes a deceased husband''s
    unneeded property to his male relatives and denies the presence of suttee. The
    main section describes death and infant burial practices: public lamentation and
    intense communal grief, mourning clay and head-shaving, preparation of an infant
    corpse by painting, shaving, folding, leaf-wrapping, burial near the hut fire
    after a farewell blowing on the face, and cane-leaf wreaths hung around the hut
    or camp to warn visitors that a death has occurred.'
  language: English
  quote_policy: summarized
