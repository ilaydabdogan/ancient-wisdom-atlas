canonical_text:
  quote: ''
  summary: The passage describes Andamanese seasonal, lunar, tidal, directional, wind,
    cloud, and celestial terminology, including a Creator-associated north-east wind,
    a supposed bridge between this world and the next, and the Milky Way as a road
    used by angels. It then summarizes limited trade, valued imported goods, and barter
    media.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the people described have no method of numeration
    and therefore do not denote the number of lunations in a solar year, which is
    divided into cool, hot, and rainy seasons and further into twenty minor seasons
    mostly named after flowering trees used by honey bees.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives terms for four phases of each lunation and for tides associated
    with full and new moon, including high tide, low tide, flood tide, ebb tide, neap
    tide, and low tide at daybreak.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that four cardinal directions are distinguished; east and
    west are named with reference to the sun as the appearing-face place and disappearing-face
    place.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists four named winds and says that the north-east wind has special
    significance as the Creator’s or God’s wind because it comes from the part of
    heaven where a bridge between this world and the next is supposed to be located.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage identifies three forms of clouds and says that Orion’s belt is
    the only named star or constellation.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the Milky Way is called ig-ydiowa and is poetically described
    as a road used by angels.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says trading vessels manned by Malays, Burmese, and Chinese had
    long visited the islands, but also states that later visits involved risk because
    some traders kidnapped members of the population.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that present trade is limited to items such as turtles,
    shells, honey, bows, arrows, and a few other articles sold to visitors and residents
    at Port Blair, encouraged by presents such as tobacco and files.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says valued imports include dogs, iron, bottles, tobacco, pipes,
    and matches, and that internal barter may use weapons, utensils, or decorative
    materials as exchange media.
  category: object
  evidence_refs:
  - ev:9
