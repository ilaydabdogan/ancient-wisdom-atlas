canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese dance and music: a performer moves across
    the dancing ground in time with a sounding-board and chorus; women dance with
    swinging arms and bent knees; solo and chorus continue through the night until
    dawn. It notes unison singing, a three-note monotonous chant, refrain syllables
    said to have no meaning, and post-performance visits involving prescribed weeping,
    exchange of gifts, possible disputes over gift value, and later hunting or fishing
    parties.'
  language: English
  quote_policy: summarized
