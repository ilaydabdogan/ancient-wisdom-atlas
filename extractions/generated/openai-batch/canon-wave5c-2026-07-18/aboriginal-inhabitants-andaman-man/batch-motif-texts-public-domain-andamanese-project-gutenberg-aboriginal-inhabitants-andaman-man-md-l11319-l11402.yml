  summary: The passage describes preparations for an Andamanese festive gathering,
    the arrival and adornment of visitors, a night performance in a jungle clearing,
    the roles of women singers, audience members, a composer-conductor using a sounding
    board, and male dancers. It also describes the posture and movement of a man dancing,
    with notes comparing sounding boards to turtle carapaces and contrasting the contemporary
    dance with an older description.
