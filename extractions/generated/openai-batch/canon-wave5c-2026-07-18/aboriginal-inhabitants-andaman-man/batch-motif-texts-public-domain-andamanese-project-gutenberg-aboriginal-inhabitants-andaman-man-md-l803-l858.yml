  quote: ''
  summary: The passage credits Mr. Homfray with conciliating visiting tribes and aiding
    ethnological and philological work. It says the Homes brought members of different
    tribes together, encouraged intermarriage, arranged tribal feuds, and spread knowledge
    of colonial power and intentions. It then argues that attempts to reclaim the
    Andamanese had harmful effects, including dependence, loss of hunting skill, health
    damage from jungle clearances and tobacco-smoking, and moral deterioration. Footnotes
    report Homfray’s death and describe discomfort when first given tobacco.
