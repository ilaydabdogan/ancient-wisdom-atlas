canonical_text:
  quote: ''
  summary: 'The passage reports Andamanese mythic traditions about remote ancestors:
    Pu''luga creates or instructs the first man, fire and cooking are taught through
    solar or spirit mediation, variant accounts explain the first woman, first children
    and descendants are named, animal features and subsistence arts are established,
    seasonal work restrictions protect hudu beings, a dialect is given as a mother
    tongue, earlier canoe technology is described, and creeks are explained as resulting
    from a harpooned fish striking the shore.'
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mythic legends about remote ancestors are said to be told to the young by
    parents and others and accepted as true, despite mirth during recitation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says accounts of creation and human origin have some discrepancies,
    while the main features are generally agreed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the world had been made, Pu'luga is said to have created a black, taller,
    bearded first man named .tS-mo- or .td'mo-.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pu'luga showed the first man fruit-trees in the jungle at .wbt... and told
    him not to eat certain fruits during the rains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pu'luga taught the first man how to obtain and use fire by stacking two kinds
    of wood and calling Mother Sun to ignite the pile.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second version says Pu'luga came with a spirit or angel, the first man prepared
    and struck a pyre, and the fire was kindled before cooking was taught.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The first woman''s origin is reported in three variants: Pu''luga created
    her, the first man saw her swimming and called her ashore, or she arrived pregnant
    at Kyd Island and gave birth to children.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The descendants of the first parents are called .to'mola until the period
    of the Deluge, and the first couple are said to have had two sons and two daughters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When pigs became too numerous, the first woman drilled holes in their heads
    and snouts, giving them hearing and smell; Pu'luga then covered the land with
    jungle and the pigs wandered away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pu'luga taught the first man to make bows, arrows, canoes, and harpoons and
    to hunt and fish; he later taught the first woman basket-making, net-making, and
    the use of red ochre and white clay.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The first couple were told not to work after sundown in the wet months, because
    work noise would trouble hudu beings under Pu'luga's protection and make their
    heads ache.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Pu'luga gave the first couple the .bo'jig-yd'b- dialect, regarded in the passage
    as the mother tongue from which other dialects sprang.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Canoes in the ancestral period are said to have had no outriggers and to have
    been made by hollowing out Pandanus trunks.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Creeks are explained as forming when a harpooned large fish struck the shore
    with its projecting snout, breaking the land with each blow.
  category: action
  evidence_refs:
  - ev:12
