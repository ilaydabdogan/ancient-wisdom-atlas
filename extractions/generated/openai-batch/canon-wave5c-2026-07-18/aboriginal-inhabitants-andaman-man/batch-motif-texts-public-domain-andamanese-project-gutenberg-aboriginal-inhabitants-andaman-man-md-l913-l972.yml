canonical_text:
  quote: ''
  summary: 'An introductory prose passage discusses Orphanage and Homes programs for
    aboriginal children: boys trained for domestic service, concern over marriage
    arrangements, girls returning to jungle-home customs, claims about education and
    health outcomes, effects on relations with the narrator''s group, and a footnote
    describing Ruth''s training, languages, dress, needlework, designs, and dictionary
    use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the problem of how to dispose of lads trained in the so-called
    Orphanage was partially solved by training them to serve as domestic servants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that only two girls originally trained in the Orphanage remained
    in the Settlement, while other survivors resumed the customs of their jungle homes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator predicts that encouraging marriage between the Orphanage-trained
    lads and girls brought up in the jungle or Homes would re-associate the lads with
    people inclined toward jungle life and draw them away from their training.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that aboriginal children can keep pace in mental culture
    up to about age ten or eleven, after which progress appears to the narrator to
    be arrested; it gives examples of children reading Urdu fluently at nine or ten.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says training appears to have had a deteriorating physical effect,
    citing that probably not more than ten Orphanage children were then alive, only
    two or three married trainees had become parents, and none of their children had
    been reared.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that contact with the convict population harmed the morality
    of the children or trainees under discussion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the Orphanage and Homes had not accomplished all the good
    anticipated by their promoters, but that kindness and interest shown to the children
    strengthened friendly relations between the aborigines and the narrator's group.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says friendly intercourse among the tribes had lately been further
    encouraged and extended by visits paid in the station.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The footnote says Ruth was highly trained by Mrs. Homfray, could speak, read,
    and write English, converse in Hindustani, did not know her native language, did
    needlework and designs, wore European costume, and used an English dictionary
    when writing letters.
  category: attribute
  evidence_refs:
  - ev:6
