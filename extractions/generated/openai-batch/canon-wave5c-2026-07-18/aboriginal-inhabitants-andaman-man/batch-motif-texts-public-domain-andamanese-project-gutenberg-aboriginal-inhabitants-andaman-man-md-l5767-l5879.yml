canonical_text:
  quote: ''
  summary: 'The passage describes mortuary practices after a child''s death and then
    adult funerary preparation: provision of milk for the child''s spirit, relocation
    of the encampment during mourning, later exhumation and cleansing of remains,
    decoration and wearing of the skull, conversion of bones into necklaces, removal
    of mourning clay and painting of bodies, condolence song and dance, and the preparation
    of adult corpses with folded limbs. The author adds comparative and speculative
    notes about other peoples'' practices and possible meanings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the d'ra- is suspended, the fire is rekindled and the mother places
    a shell containing her milk beside the grave for the child's spirit, which is
    said to haunt its former home for a few days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The encampment packs needed goods, leaves for another camping ground generally
    two or three miles away, and constructs huts for the mourning period.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mourning period is described as usually lasting about three months; parents
    and relatives refrain from neighboring festivities, and named categories of mourners
    abstain from pork, turtle, and other luxuries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the mourners do not cut off finger joints and do not
    perform the daily honey-comb offering described in another account.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the agreed end of mourning, the group returns to the deserted encampment,
    removes and destroys the d'ra-, and the parents exhume the remains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father takes the remains to the sea-shore or nearest creek to cleanse
    them, brings the skull and bones back to his hut, and breaks the bones into small
    pieces suitable for necklaces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother paints the skull, decorates it with small shells attached to string,
    and wears it around her neck on a netted chain; after the first few days the husband
    may wear it instead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Infants' skulls are carefully protected with string, and the mother makes
    the bones into necklaces that she and her husband distribute among friends as
    mementoes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before distributing the bone mementoes, mourners remove the lumps of clay
    from their heads, and the wife paints her husband and then herself with the same
    compound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Friends assemble around the hut for a final condolence visit; the father sings,
    women chant the chorus, the parents perform a dance named Vi-t&latnga-, and others
    lament.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the parents tire and retire, friends continue the mournful dance and
    song for many hours; men who were previously spectators then join the women.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: For adult deaths, relatives smear themselves and place clay on their heads,
    remove the deceased's ornaments, and women paint the corpse, whose limbs are folded
    and wrapped.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says the true significance of folding and wrapping the body is
    unclear; questioned aborigines say it is for convenience in removal, while the
    author suggests a possible deeper meaning by comparison with a Hottentot practice.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: Females do not attend the funeral; after their preparation of the corpse they
    gently blow on the face and take a last farewell look.
  category: action
  evidence_refs:
  - ev:10
