  text: Shells are described as serving practical functions including pot-finishing,
    storage, food plates, drinking vessels, and opening or shaping other materials.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage rejects a report that human skulls are used as boxes; it states
