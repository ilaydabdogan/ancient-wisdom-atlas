canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese uses and non-uses of natural materials:
    shells as implements, vessels, and former blades; animal-derived and shell weapon
    points later replaced by iron; bamboo as a multipurpose material for shafts, containers,
    knives, tongs, needles, and poles; a Pandanus brush for painting; absence of most
    musical instruments, leather-work, and cave or tree-top dwellings; and temporary
    use of tree-root buttresses in storms.'
  language: English
  quote_policy: summarized
