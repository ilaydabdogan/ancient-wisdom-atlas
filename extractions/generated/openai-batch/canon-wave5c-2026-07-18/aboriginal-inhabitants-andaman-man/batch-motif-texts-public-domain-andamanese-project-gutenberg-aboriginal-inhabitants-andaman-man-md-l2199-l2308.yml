  text: Epilepsy is recognized as a malady peculiar to certain individuals, but epileptic
    fits are not regarded superstitiously in this passage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ophthalmia epidemic in 1877 mainly affected people of South Andaman; about
    fifty persons were attacked, and many suffered partial or complete loss of sight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says measles occurred once in 1877, caused high mortality among
    sufferers, and was introduced by convicts from Madras before spreading to Andamanese
    groups.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author compares the ravages of the measles epidemic, on a smaller scale,
