canonical_text:
  quote: ''
  summary: The passage describes recognized illnesses and epidemics among the Andamanese,
    lists common diseases, and gives an account of fever treatment using gu'gma leaves,
    chu'lnga drink, kbi'ub ointment, and a chdvga-td charm. It also states that internal
    pains and some mysterious diseases are attributed to evil spirits, including named
    spirits said to shoot or spear sufferers.
  language: English
  quote_policy: summarized
