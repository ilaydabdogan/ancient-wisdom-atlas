canonical_text:
  quote: ''
  summary: The passage describes observed Andamanese bodily expressions, gestures,
    movement, climbing, rest and sleep postures, load carrying, endurance, and a distress
    sound made while carrying loads. It includes several explicit comparisons to children
    elsewhere, natives of India, and Naganis described in another account.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When very angry, a man places his left hand palm-up between his teeth, glares
    at an object on the ground near the offender, raises a weapon with his right hand,
    and utters threatening words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When threatening another, a man seizes a weapon or missile and states an intention
    to inflict injury with it rather than clenching his fist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dogged or obstinate expression is described as averting the head, closing
    the lips, lowering the eyes, and frowning slightly.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sneering is described as clenching the teeth, slightly curling the upper lip,
    and fixing the eyes on an object near the person addressed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sulky children pout, frown, and make noises indicating discontent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inability or inability to prevent something is shown by averting the head
    and pouting the lips; beckoning is done by nodding the head vertically and waving
    an outstretched hand toward oneself; affirmation is a vertical nod and negation
    a lateral shake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes ordinary stance and gait, stalking game on tiptoe, average
    male and female pace lengths, swinging arms with palms inward, and pointing with
    one finger rather than the open hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In climbing ropes, creepers, branched trees, masts, or cocoa-nut trees, the
    described people move rapidly and use the hands, arms, legs, and big and second
    toes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Young men and women sometimes twist their bodies from side to side after rest
    or sedentary work to stretch the back muscles, producing sounds like cracking
    finger joints.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: For temporary rest after exertion, the favored posture is squatting on the
    heels; when very exhausted, people sit or lie down. The usual sleep posture is
    lying on one side, preferably the right, with bent knees and the head raised on
    an improvised pillow.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that many can shut one eye without closing the other, extend
    one finger without opening the hand, use the feet to hold and pick up light objects,
    and prefer pushing to dragging heavy loads.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: A man's maximum burden is described as about 40 pounds, which may be carried
    through jungle for as much as 15 miles in a day; in pursuit of runaway convicts,
    a long rest is usual if the pursued are not overtaken by the third day.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage says men put little weight on the head and instead carry loads
    by a cord across the chest, throwing strain on shoulders and back; women use a
    cord brought over the head and bend the back to reduce pressure.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:14
  text: A whistle-like or flute-like sound associated with carrying loads while distressed
    is reported for Naganis and is said to occur in similar circumstances among Andamanese
    of both sexes.
  category: attribute
  evidence_refs:
  - ev:15
