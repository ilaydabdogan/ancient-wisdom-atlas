canonical_text:
  quote: ''
  summary: The passage describes teasing nicknames used between inland and coast Andamanese
    groups, contrasting jungle wayfinding, tracking, turtle-harpooning, and use of
    fever leaves. It then gives accounts of Wo'i, an inland e'remtd'ga man who traveled
    from the Middle Andaman jungle to the Port Blair settlement, saw Europeans for
    the first time, remained after marrying a South Andaman woman, and became an informant.
    A second unnamed e'remtd'ga traveler is described as visiting Port Blair and later
    returning home with presents. The final section describes nomadism and temporary
    migrations, especially among the coast dryo'to, shaped by death, ritual gatherings,
    season, wind, moon phases, fishing and turtling conditions, and food availability.
  language: English
  quote_policy: summarized
