canonical_text:
  quote: ''
  summary: The passage is an ethnographic discussion of Andamanese social customs.
    It emphasizes moral conduct, hospitality, care for vulnerable persons, and especially
    adoption or fosterage. Children commonly leave biological parents for foster-parents,
    who must treat them kindly. Foster-children may later be transferred to another
    adopter. Foster-parents may resist boys leaving to form households because boys
    provide useful labor. Young people may pursue secret attachments, and guardians
    may test a suspected couple by arranging for them to be painted with contrasting
    substances before a night meeting, so that marks visible the next morning would
    reveal contact.
  language: English
  quote_policy: summarized
