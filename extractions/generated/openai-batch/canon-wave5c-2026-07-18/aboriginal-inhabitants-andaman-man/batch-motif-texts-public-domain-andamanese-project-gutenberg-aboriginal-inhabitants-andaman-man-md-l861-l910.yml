  quote: ''
  summary: The author limits judgments about Andamanese social and moral traits to
    communities considered unaffected by outside convict settlement. The passage then
    describes the founding and early operation of an orphanage on Ross Island for
    Andamanese children, their instruction in cleanliness, alphabet, needlework, basket-making,
    and discipline, and later difficulties retaining girls and boys. Some girls were
    placed with residents or married, while boys taken at an older age began longing
    to return to their native jungles.
