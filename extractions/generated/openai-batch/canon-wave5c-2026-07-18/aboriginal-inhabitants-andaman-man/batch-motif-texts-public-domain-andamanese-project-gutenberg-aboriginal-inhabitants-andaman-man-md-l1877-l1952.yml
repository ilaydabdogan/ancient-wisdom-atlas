canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese hair and shaving practices: women commonly
    shave their heads while leaving two narrow hair-lines; men use several head-shaving
    styles; women ordinarily act as barbers; hair may be removed for heat and cleanliness;
    sparse facial hair is valued as decoration; and several claims about long hair,
    baldness, and red ochre dyeing are discussed or rejected.'
  language: English
  quote_policy: summarized
