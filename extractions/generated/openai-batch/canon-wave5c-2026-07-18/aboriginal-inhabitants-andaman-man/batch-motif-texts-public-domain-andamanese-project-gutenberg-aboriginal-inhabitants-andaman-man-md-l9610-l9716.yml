literal_observations:
- id: obs:1
  text: The passage traces a belief to former use of fish-bones, especially serrated
    sting-ray tail-bone, as arrow-head tips; brittle spikes could remain in the flesh
    and lead to ulcers and death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Strangers' difficulty with Andamanese bows is attributed to holding the wrong
    end upward; with practice, Europeans are said to shoot stationary targets nearly
    as well as most aborigines but to acquire rapid and full-force shooting less readily.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Large bows are described as chiefly ornamental or for presentation to friends,
    and as seldom used except for shooting fish and pigs along the shore; smaller
    bows are preferred for jungle expeditions because they are convenient and easier
    to replace.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: One drawback of the bows used by these tribes is that they cannot be fired
    silently because the string strikes the lower or convex part of the weapon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Five varieties of arrows are named, and none is described as having more than
    one point or blade.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: One arrow form begins as a shaft with a hard-wood foreshaft; the wood is gradually
    heated over fire to make it harder and less liable to split, while related forms
    are sharpened or fitted with iron points and barbs for fishing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Andamanese are described as keeping bladed arrow and spear heads bright;
    arrow shafts are straightened with teeth and fingers, and no feathers or other
    flight-increasing devices are used.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'For iron-bladed arrows, the position of the barb and seam is described as
    functional: the seam or the barb most aligned with the blade is used as a sight,
    and the blade is inserted into the foreshaft and secured with string and coating.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote states that a Jarawa bow appears exempt from the silent-firing
    defect and attributes this to its resemblance to an ordinary European pattern.
  category: relationship
  evidence_refs:
  - ev:4
