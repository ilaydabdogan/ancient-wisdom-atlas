  quote: ''
  summary: 'The passage gives plate headings for Andamanese activities and then describes
    tattooing among Great Andaman groups: its stated purposes, practitioners, instruments,
    ages and stages, body placement, tribal pattern variations, healing practices,
    and lack of special distinction for chiefs'' children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate headings identify Andamanese people equipped for a journey and shown
    shooting, dancing, sleeping, and greeting.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that people will not remove or replace the o'hunga- in
    another person's presence, even if the other person is of the same sex; a note
    says girls first wear the o'hunga- at about five or six years of age.
  category: object
  evidence_refs:
  - ev:2
  - ev:12
- id: obs:3
  text: Tattooing is described as general among eight tribes of Great Andaman, while
    a note says the Jarawa are not known to tattoo or shave themselves.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:12
- id: obs:4
  text: The passage rejects the claim that tattooing hardens the skin against insects
    or jungle travelling and reports that the aborigines say the skin becomes more
    sensitive after the operation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tattooing is described primarily as ornamental and secondarily as proof of
    the individual's courage and ability to endure pain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tattooing operation has no special ceremonies; except in northern tribes
    it is almost always performed by women, who receive no payment but may be recognized
    for skill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Very few children of either sex are left untattooed after about the eighth
    year; the final operation may be delayed until the sixteenth or eighteenth year,
    with the process carried on gradually.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The instrument is a flake of quartz or glass held between the forefinger and
    thumb; markings occur on several parts of the body, but the face is never tattooed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cicatrices on people of both sexes are attributed to scarification, accident,
    or cuts that failed to heal like the rest of the design.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some named tribes are especially given to tattooing and are distinguished
    by three rows of cuts down the back and chest; the back rows are almost exclusively
    made by a male friend using the e'la- or pig arrow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The A'ka-Kol are described as omitting the center row of three down the back,
    while other named groups are described as having plain perpendicular and horizontal
    incisions over the person.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The passage states that a chief's child is tattooed in the same mode as other
    children, that the marks have no special significance beyond ornament, that no
    pigments are rubbed into the wounds, and that wounds are left to heal by themselves.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: A note mentions a youth, xra-ju'do-, who refused tattooing and received a
    designation meaning 'untattooed.'
  category: relationship
  evidence_refs:
  - ev:12
