canonical_text:
  quote: ''
  summary: The passage describes Andamanese customs around successful hunting or fishing
    returns, greetings, drinking, handwashing, bathing, heat protection, and fire.
    It states that the Andamanese do not know how to produce fire, that their traditions
    date acquaintance with fire to Creation, and that they preserve embers carefully.
    It also includes an authorial conjecture about volcanic islands as a possible
    source of first fire and a quoted note connecting Narcondam with Narak, Hell,
    and Rakshasa traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an unusually successful hunting or fishing expedition, men raise a triumph
    shout before reaching home; women answer with yelling and thigh slapping; after
    entering the encampment and depositing the spoils, the hunters remain silent for
    a time before recounting events.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that morning greetings do not pass between friends or spouses,
    and health inquiries are unusual except when addressed to an invalid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A thirsty man drinks from a stream or from water lifted in a leaf or vessel,
    then uses water from his mouth to wash his own hands; if another person is present,
    he pours water from a leaf over the friend's hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bathing is described as irregular, occurring during heat or when the body
    becomes sticky or unpleasant, such as after gathering honey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During hot weather, bodies are smeared with common white clay dissolved in
