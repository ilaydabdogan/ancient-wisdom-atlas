canonical_text:
  quote: ''
  summary: The passage describes Great Andaman huts and permanent encampments, coastal
    fishing and turtling sites, gendered subsistence activities at low and flood tides,
    encampment layout around a dancing ground and public cooking place, and a system
    of common territorial property with limited chiefly authority.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most Great Andaman huts are described as lean-to structures differing mainly
    in size and durability; they may stand alone or be joined together and are usually
    built in sheltered places away from the prevailing wind.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Permanent encampments consist of several huts, are usually inhabited by about
    50 to 80 persons, and may accommodate more people during festive tribal gatherings
    such as weddings or other occasions of rejoicing.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Permanent encampments of the dryd'to- are placed at sites advantageous for
    fishing and turtling, especially sandy beaches with extensive foreshore.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At low tide women catch fish in pools with hand-nets and collect shellfish;
    during flood tides men shoot fish and harpoon turtles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huts are placed to face inward toward the bu'lum- or dancing ground when shelter
    allows; in tempestuous weather the sloping roof is turned toward the prevailing
    wind for protection.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Encampment layout depends on the ground and surrounding trees; the passage
    says the people do not fell trees merely to make space and take care to avoid
    danger from falling branches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The encampment diagram labels spaces for married persons, bachelors, spinsters,
    a public cooking place, and the dancing ground.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The country is apportioned among tribes, and each tribe's occupied territory
    is considered common property of all its members rather than the exclusive property
    of chiefs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Domestic polity is described as communism modified by the authority of a chief;
    the head chief is called mava-igla- and elders or sub-chiefs are called mai'ola.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The head chief has authority over sub-chiefs, but the passage describes this
    authority as very limited.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The chief organizes meetings, influences questions affecting followers' welfare,
    directs hunting, fishing, and migrating parties, and commonly intervenes to settle
    disputes, but has no power to punish or enforce obedience.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The dry&to- and e'remtd'ya in each tribe are said to have their own independent
    head chiefs.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Chiefly power is described as limited and not necessarily hereditary, though
    a qualified grown son would often be chosen to succeed his father.
  category: sequence
  evidence_refs:
  - ev:11
