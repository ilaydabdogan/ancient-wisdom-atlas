  quote: ''
  summary: 'The passage describes official British action on a commission recommendation:
    Captain H. Man is ordered to go to Port Blair, raise the British flag, take possession
    of the Andaman Islands for the East India Company, and prepare for transported
    convict mutineers. It then reports the arrival of prisoners under Dr. J. P. Walker
    and gives mortality figures for the early penal settlement, attributing high fatality
    to tropical isolation, conflict, dense jungle, mangrove, and malarious salt and
    fresh water swamps.'
