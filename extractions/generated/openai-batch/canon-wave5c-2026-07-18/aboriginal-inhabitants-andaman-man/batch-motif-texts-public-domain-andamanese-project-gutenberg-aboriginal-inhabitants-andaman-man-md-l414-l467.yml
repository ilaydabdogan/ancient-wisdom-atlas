canonical_text:
  quote: ''
  summary: 'The passage gives a historical account of early European and colonial
    contact with the Andaman Islands: a belief about the islands is linked to hostility
    toward strangers and abuses by traders; voyagers avoided the islands; the East
    India Company sent Lieutenant Blair to prepare a penal settlement; the settlement
    was moved, renamed, became unhealthy, and was abandoned; a note comments on early
    published accounts and their limitations.'
