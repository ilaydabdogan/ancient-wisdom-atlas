canonical_text:
  quote: ''
  summary: 'The passage describes the gu''mul as a probationary rite for young persons
    involving staged food abstinence. It gives detailed procedures for breaking the
    turtle fast: a turtle feast, anointing with turtle fat, removal of ornaments,
    lamentation, feeding, a silent overnight vigil, morning weeping and body painting,
    use of leaves, a strenuous dance, and post-rite watching against harm and evil
    spirits. It adds that young women undergo the same rite with modifications concerning
    ornaments and aprons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The d'kd-ydp- is described as a test of endurance or self-denial for young
    persons and as evidence of fitness and ability to support a family.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The rite is divided into three named periods: a turtle gu''mul-, a honey
    gu''mul-, and a pig kidney-fat gu''mul-.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a youth is allowed and agrees to break the turtle fast, friends arrange
    a feast consisting entirely of turtle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chief or headman boils a large piece of turtle-fat in a pot, lets it cool
    sufficiently, and pours it over the seated youth's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men remove the youth's ornaments and rub grease into his body, while women
    and children cry because eating turtle again after long abstinence is believed
    to risk madness, illness, or death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The novice is fed turtle flesh; some is reserved for his consumption over
    the next two or three days, and the rest is distributed to those assembled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The novice is led to his hut, seated cross-legged on Myristica longifolia
    leaves with food at his side, and watched by friends who enforce silence, meet
    his wants, and prevent sleep by singing.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The next morning his mother, sister, and other female relatives weep over
    him and paint his ears and body with named compounds in alternating stripes.
  category: action
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:9
  text: Large leaves are made into two broom-like bundles and placed in his hands,
    other leaves are placed in his waistbelt, and he dances strenuously while women
    keep time and some initiated males may accompany him.
  category: action
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:10
  text: After the dance ends, the turtle gu'mul- is considered complete, but friends
    continue watching the youth for two or three days against possible harm from the
    feast and from evil spirits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the same turtle gu'mul- procedures apply to young women,
    except that matrons remove ornaments and leave certain waistbelts and a leaf apron
    for decency, with a more substantial leaf apron supplied for the dance.
  category: relationship
  evidence_refs:
  - ev:7
