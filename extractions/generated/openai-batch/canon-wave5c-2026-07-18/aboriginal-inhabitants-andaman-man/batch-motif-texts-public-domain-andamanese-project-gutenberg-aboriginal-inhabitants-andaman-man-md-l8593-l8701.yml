literal_observations:
- id: obs:1
  text: The passage says the described Andamanese groups find ample provisions in
    their immediate surroundings and do not need great exertion for simple wants.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their eagerness in the chase is described as motivated by both love of sport
    and the need to obtain food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: They are described as spending considerable time in dancing, singing, personal
    decoration, and preparing meals, and as rejecting tainted food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: About one-third of daily food is estimated as edible roots, fruits, and honey,
    with the remainder largely flesh of listed animals, fish, and molluscs; several
    insects and small animals are eaten as variety or luxuries.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: They are said to be nominally content with breakfast and a heavy supper after
    sundown, while also taking small quantities of food during work.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When leaving on a day hunt, they usually take fire and a goh- of food, warm
    the food, and eat it around midday; the passage says no difference is made between
    the sexes in fare.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An adult's average daily food intake is estimated at three or four pounds,
    with much higher consumption after successful hunts or during special occasions
    with all-night dancing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says caste distinctions are unknown, family members eat together,
    and a married man may eat with other married men and bachelors but not with women
    outside his household unless he is advanced in years.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bachelors and spinsters are required to take meals apart with members of their
    respective sexes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Their mode of eating meat is described as putting a large piece in the mouth
    and cutting off the excess with a bamboo, cane, or steel knife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Water is described as their general beverage; the passage adds that some aborigines
    near Port Blair had acquired a liking for rum but were not permitted to gratify
    it.
  category: object
  evidence_refs:
  - ev:7
