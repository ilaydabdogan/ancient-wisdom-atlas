  summary: The passage describes a youth’s rite involving a boar carcass, melted fat,
    enforced silence and immobility, attendance by friends, leaves placed in the youth’s
    hands and waistbelt, and an exhausting dance. It then reports social rules concerning
    the relation of these rites to marriage, monogamous marriage, premarital sexual
    conduct outside prohibited kinship limits, pregnancy leading to marriage, and
    infant betrothal.
  language: English with transliterated local terms
