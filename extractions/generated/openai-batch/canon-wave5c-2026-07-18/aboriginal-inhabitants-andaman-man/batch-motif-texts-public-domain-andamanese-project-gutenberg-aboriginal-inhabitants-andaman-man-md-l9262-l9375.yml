canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Andamanese honey gathering with the jvni
    plant, honey availability and sale, and several food-related tabus: seasonal and
    mourning restrictions, lifelong personal forbidden foods, initiation requirements
    for eating dugong or porpoise, rules about eating together, and pregnancy-related
    abstinence by women and husbands. A footnote compares paternal abstinence beliefs
    with examples attributed to the Abipones and the Antilles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before raiding hives, Andamanese honey gatherers procure the jvni plant, strip
    its leaves, chew the stem, smear the extracted essence over their bodies, and
    keep the juice in their mouths.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bees attempting to attack are said to be repelled by the odor and mouth-sprayed
    juice of jvni; chewed stalks may also be used to drive off remaining bees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small combs of white and black honey are available until about September while
    certain trees continue to blossom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Honey obtained in this way was sold to free residents at Port Blair and stored
    in barrels and bottles to meet demand until the following season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage lists general food or gathering restrictions connected with d'hd-ydp,
    prescribed seasons, supposed obedience to Pu'luga's commands, and mourning abstinence
    until t'l-to'latnga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Every Andamanese man and woman is described as prohibited through life from
    eating one or more fish or animals.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A personal forbidden food is often explained as based on a childhood functional
    derangement observed or imagined by the mother; if no such effect occurred, the
    person may select a forbidden food, often one little relished such as shark or
    skate.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A note states that Pu'luga is believed to punish a person who eats his yAt-tub
    by severe bodily afflictions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who has not passed initiation and attained the dignity named gv/maf
    is not permitted to eat dugong or porpoise flesh; on first tasting either, the
    novice must be fed by an already qualified friend or relative.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Outside initiatory ceremonies, the passage reports no general prohibitions
    on feeding oneself or touching another's food; after marriage only husband and
    wife may eat together, while childless widows and widowers usually eat with unmarried
    people of their respective sexes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A pregnant Andamanese woman abstains from pork, turtle, honey, iguana, and
    paradoxurus; after a while her husband abstains from iguana and paradoxurus because
    the embryo is believed to suffer if he eats them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A footnote reports external examples in which a father's conduct or diet is
    believed to affect an infant or expected child among the Abipones and in the Antilles.
  category: relationship
  evidence_refs:
  - ev:11
