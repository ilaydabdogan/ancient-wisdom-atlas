canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese intertribal communication and movement:
    dense jungles, unsuitable canoes, and language differences limit intercourse;
    tribal domains are understood through natural barriers and require permission
    to enter; gatherings serve barter and celebration but may also produce conflict;
    paths and new routes are indicated by use or bent twigs; there is no writing or
    formal record system, though ownership of weapons may be distinguished by tying
    and knotting; oral narration preserves reputations; messengers carry no token;
    drawings and charts may be recognized; swamps are avoided and creeks crossed at
    fords.'
  language: English
  quote_policy: summarized
