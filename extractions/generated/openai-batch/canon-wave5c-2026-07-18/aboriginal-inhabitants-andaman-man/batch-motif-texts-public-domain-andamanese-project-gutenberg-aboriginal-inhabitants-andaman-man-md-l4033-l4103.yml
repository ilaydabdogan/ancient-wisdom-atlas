canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese swimming and diving ability: swimming
    is common among both sexes and learned early by children; divers use the frog-stroke,
    leap feet-first, recover submerged objects, and dive after harpooned turtle or
    fish. The author rejects an exaggerated report of Andamanese people catching an
    enormous fish by plunging into deep water, notes local amusement at an illustration
    of that scene, and records a timed underwater test of three aryo''to youths.'
  language: English
  quote_policy: summarized
