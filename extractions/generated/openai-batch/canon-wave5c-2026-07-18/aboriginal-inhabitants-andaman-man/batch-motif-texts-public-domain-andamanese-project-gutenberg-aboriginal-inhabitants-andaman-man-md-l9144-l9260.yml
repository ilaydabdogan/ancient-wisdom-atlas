canonical_text:
  quote: ''
  summary: The passage describes Andamanese food preparation and preservation practices,
    including extraction of marrow, turtle-blood and turtle-fat handling, preserving
    meat over fire or in bamboo, processing seeds for the rains, and timing honey
    collection by flowering trees and moon phase. A footnote compares one grating-based
    preservation method to a Brazilian example reported by Jean de Lery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brains and marrow are described as desired foods; smaller bones are crushed
    with teeth and larger bones with a stone hammer to extract marrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turtle blood is carefully not spilled, boiled in the turtle's own shell until
    thick, and eaten separately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After turtle flesh is removed, the shell is placed over fire so remaining
    fat melts; the fat is eaten with Cyrena shells used as spoons, and the shell is
    broken up and divided so none is lost.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Turtle fat is also used in the manufacture of an unguent named kbi'ob.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Food is preserved either on a small grating above the hut fire or by packing
    half-cooked food into heated bamboo and slowly reheating it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the bamboo method, the opening is closed with leaves, the vessel is set
    aside, and later the bamboo is reheated, split open, and the food is shared; meat
    prepared this way keeps for several days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Seeds prepared for the rains are husked, partially sucked by those present,
    half-boiled, wrapped in leaves, buried in moist soil for weeks, then dug up, washed,
    dried in sun or over fire, stored in nets or leaves, and baked again before use.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Except for this seed preparation, the passage says food is not dried in the
    sun, salted, or intentionally smoked, though smoke may result from the storage
    method.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Honey is abundant in the dry months, and the passage lists flowering jungle
    trees whose succession enables bees to produce combs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the height of honey season, bees are said to consume much honey on moonlight
    nights, so comb-hunting is avoided until the moon has waned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note cites a Brazilian example in which a wooden grating on forked posts
    served to keep game and fish when meat was not salted.
  category: other
  evidence_refs:
  - ev:3
