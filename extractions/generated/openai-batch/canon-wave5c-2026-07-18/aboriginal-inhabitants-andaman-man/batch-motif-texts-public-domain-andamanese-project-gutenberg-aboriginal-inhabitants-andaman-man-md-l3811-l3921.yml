literal_observations:
- id: obs:1
  text: Women in rage may injure or destroy nets, baskets, and other articles belonging
    to other women or females of the encampment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women may seize a burning log, bang it on the ground, and utter a curse-like
    exclamation about the addressee's face becoming hideous.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women may struggle and fight until separated by the wife or daughter of their
    head man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women are described as leaving disputes with men to husbands or male relatives
    for redress.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: When a chief or elder loses his temper, peers withdraw to huts and other community
    members retreat to a secluded place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a chief or elder wantonly injures his people, they are said likely to repay
    him secretly in kind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Suicide is described as formerly unknown among the group, with a compound
    word coined after seeing self-murder among alien populations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A word meaning sin or wrongdoing is connected with falsehood, theft, grave
    assault, murder, adultery, and burning wax; such deeds are believed to anger Puiuga,
    the Creator.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Adultery is said to be rare; an injured husband would probably punish the
    guilty parties, with risk of retaliation, and no appeal to the chief is made.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Assault or theft by members of another tribe is regarded as premeditated and
    can become a tribal affair causing feud and bloodshed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Contact with Europeans and other foreigners is said to have introduced knowledge
    of drunkenness and intoxicating drink, leading to a coined word for an inebriate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Smoking is described as introduced after contact; men and women acquired the
    habit and used clay pipes, tobacco, or leaves when tobacco was unavailable.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Excessive smoking is said to have impaired constitutions and made work difficult
    without tobacco.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cannibalism is denied for the described groups and said to lack evidence,
    but South and Middle Andaman tribes are described as attributing it to other races
    and to people of North and Little Andaman.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: Fear of alleged cannibal neighbors and strangers is said to have contributed
    to dread and animosity toward strangers landing on their shores.
  category: relationship
  evidence_refs:
  - ev:11
