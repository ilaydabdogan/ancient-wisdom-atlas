  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During 1882, three evenings of the Anthropological Institute's session were
    devoted to reading and discussing portions of the prepared paper, which later
    appeared in the Institute's Journal.
  category: sequence
  evidence_refs:
  - ev:6
