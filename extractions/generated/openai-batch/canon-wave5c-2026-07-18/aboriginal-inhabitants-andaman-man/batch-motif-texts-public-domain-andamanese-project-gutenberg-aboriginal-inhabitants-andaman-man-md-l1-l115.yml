canonical_text:
  quote: ''
  summary: The preface introduces a monograph on the aboriginal inhabitants of the
    Andaman Islands. The author explains his residence and fieldwork from 1869 to
    1880, his charge of Government-established Homes, collection of vocabulary and
    ethnological information, reliance on anthropological guidance, cross-checking
    of information, and the publication history of the work with appended linguistic
    material, maps, plates, and photographs.
  language: English
  quote_policy: summarized
literal_observations:
