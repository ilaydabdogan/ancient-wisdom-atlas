  text: The author states that he was invited to read a paper before the Anthropological
    Institute on 24 May 1880.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says the planned monograph would embody observations made during
    his residence in the Andaman Islands from 1869 to 1880.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For four successive years the author had charge of Government-erected Homes
    intended to establish more cordial relations with the aborigines and to reclaim
    them, if possible, to some degree of civilisation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Contact with members of various tribes at the Homes enabled the author to
    prepare a vocabulary of the South Andaman dialect containing about 6,000 words,
    illustrative phrases, and comparative dialect material.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After acquiring colloquial knowledge of the language, the author collected
    information about habits and customs.
  category: action
