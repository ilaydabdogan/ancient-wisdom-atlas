  summary: The passage describes death-related practices involving suspected demons,
    protective night singing, beliefs about demons consuming the dead, and social
    practices of meeting, reunion, hospitality, gift-giving, and farewell among Andaman
    Islanders as reported by the source.
  language: English with transliterated Andamanese terms
