literal_observations:
- id: obs:1
  text: When a demon is suspected in a death, an unnamed male actor shoots arrows
    into the surrounding jungle and pierces the ground around the corpse with a spear
    selected according to the suspected demon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a death attributed to .e'rem-chdwgala occurs too late for immediate burial,
    people who are not mourners sing through the night to deter the demon from further
    harm in the encampment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: ".e'rem-chdwgala and his sons are said to feed on the blood and soft tissues
    of those who die on land, while worms dispose of the remaining parts except bones."
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: ".ju'ru-win- is said to consume every portion of those who fall into his clutches."
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Friends meeting after separation do not exchange ordinary salutations; they
    silently gaze at each other until a younger person makes a commonplace remark
    and news-telling begins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Relatives after an absence sit with arms around each other's necks and weep
    or howl for joy in a way the passage says resembles grief at death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The reunion crying chorus is started by women, joined by men, and may continue
    in small groups until exhaustion; if neither party is in mourning, a dance follows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'For married couples, reunion order depends on whether they are parents: childless
    spouses first weep with a blood relation, while parents meet spouse first and
    then a relation.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Friends at meeting commonly give each other something already in their hands,
    and these gifts are regarded as tokens of affection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Introduced strangers and guests are welcomed, served first, given the best
    food, treated well, and often given presents when leaving.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At farewell, the guest and host blow on each other's hands, exchange a set
    dialogue, and part.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the farewell dialogue, the host says, “May no snake bite you,” and the
    departing visitor replies that he will be watchful.
  category: speech
  evidence_refs:
  - ev:9
