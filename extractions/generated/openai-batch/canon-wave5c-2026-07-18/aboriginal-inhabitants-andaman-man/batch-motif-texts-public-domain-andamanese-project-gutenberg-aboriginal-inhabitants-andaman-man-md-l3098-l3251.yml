canonical_text:
  quote: ''
  summary: The passage describes Andamanese geographical knowledge and names for land
    and water forms, including Saddle Peak, Narcondam, and Barren Island. It reports
    beliefs that Saddle Peak was called Pu'luga's mouth and was Pu'luga's residence
    before the deluge; that rocks, valleys, and hills were formed by Pu'luga's will;
    that some mineral-bearing streams were caused by a poisonous snake; that smoke
    from Barren Island was explained as a fire kindled by Pu'luga; and that some voyagers
    were regarded as deceased ancestors permitted to revisit earth.
  language: English with transliterated Andamanese terms
  quote_policy: summarized
