canonical_text:
  quote: ''
  summary: The passage reports statements about Andamanese beliefs concerning a Supreme
    Being named Pu'luga-, his attributes, sky household, judgment after death, provision
    of food, and storm-punishment. It also describes several evil spirits, including
    forest spirits and an ant-hill spirit, and notes that traditions of Creation,
    Fall, and Deluge are traced to ancestral transmission and to times before the
    Flood.
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Informants are said to agree that accounts of Creation were handed down by
    the first parent and his immediate descendants, and that superstitions and practices
    are traced to the days before the Flood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that legends about Creation, Fall, and Deluge are current,
    and that the Deluge is said to be consequent on the Fall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people are described as believing in a Supreme Being called Pu'luga- while
    also fearing evil spirits as ever-present sources of bodily injury.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pu'luga- is described as fire-like but invisible, unborn, immortal, creator
    of the world and objects except the powers of evil, omniscient by day, angered
    by certain sins, pitiful to the distressed, and judge of each soul after death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pu'luga- is said to live in a large stone house in the sky with a wife he
    created for himself and with a large family.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pu'luga-'s wife and daughters, the sky spirits, are said to throw fish and
    prawns into streams and the sea for the inhabitants of the world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pu'luga-'s son is said to live with his father and to make his father's orders
    known to the sky spirits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When angered, Pu'luga- comes out of his house and blows, growls, and hurls
    burning faggots, which the passage glosses as violent thunderstorms and heavy
    squalls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pu'luga- does not kill directly, but is said to point out offenders who badly
    quarter or carve a pig to malevolent spirits called .chol-, who then kill the
    offender.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some dreaded evil spirits are described as self-created, existing from time
    immemorial, and outside Pu'luga-'s authority.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: ".e'rem-chdu'gala and his grown sons are said to roam the jungles with a lighted
