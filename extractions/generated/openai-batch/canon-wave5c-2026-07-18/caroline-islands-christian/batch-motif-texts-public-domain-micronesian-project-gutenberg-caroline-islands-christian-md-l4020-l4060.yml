  summary: An expedition returns to a vessel and notices alleged spies of King Paul,
    then travels by night through an uncharted labyrinthine route. The next day officers
    and sailors visit ruins at Uchentau, view a gateway, high walls, a central vault,
    a frieze, tomb-area masonry, and a cleared courtyard. The party clears more jungle,
    photographs wall angles, circles the precinct called the Place of the Lofty Walls,
    and observes walls facing waterways and dense forest.
