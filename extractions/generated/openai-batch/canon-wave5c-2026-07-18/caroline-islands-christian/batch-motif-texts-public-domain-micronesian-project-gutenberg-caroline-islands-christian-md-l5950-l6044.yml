canonical_text:
  quote: ''
  summary: Travel account describing a shipboard encounter with the Icho or King of
    Pingelap and his party, observations about Pingelap men, departure for Kusaie,
    weather and coastal navigation around Lele/Chabrol Harbour, and the rescue of
    a chicken that later becomes soup.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A host of natives follows the travelers on board, headed by the Icho or King
    with his Queen and interpreter, and brings hats and mats for sale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King asks for a Turkey-red shirt and refuses a cigar, saying it would
    be a bad example to church members.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King addresses the narrator as a friend and refers to Victoria and to
    the goodness of the Pingelap man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The King of Pingelap and the chief of Mokil are reported to have amused Spanish
    hosts on the gunboat Quiros by taking food with both hands rather than using knives
    and forks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a dish of curry comes within reach, the King of Pingelap eagerly takes
    a double handful and eats it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The travelers leave their anchorage and sail about 140 miles toward Kusaie,
    hindered by calms, light baffling winds, and heavy rain squalls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kusaie appears toward sundown with a sharp angular outline, while mountain
    tops are hidden by clouds, haze, and vapor.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pingelap men are described as nervous despite being dull and heavy in temperament;
    a minor operation such as removing a splinter is said to make a strong man faint.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The same nervousness is said to be related of people from Nuku-Oro and Kap-in-Mailang,
    and the Pingelap people are said to be subject to hypnotic suggestion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Whaling captains are said to have recruited Pingelap men because they were
    considered docile, hardworking, and able to endure Arctic cold.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The ship passes the lights of the missionary settlement of Mout, rounds the
    North-East Point, and sights Lele and Chabrol Harbour, where a strong eastward
    current is noted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The island landscape is described with low land, forested hill-slopes, pandanus
    and palm groves, needle-shaped peaks, a flat-topped mountain, valleys, and white
    birds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Near the harbor entrance, heavy rollers strike the reef, the passage is narrow,
    and a chicken flies overboard; the captain orders a boat lowered, the chicken
    is rescued, and later appears as soup.
  category: sequence
  evidence_refs:
  - ev:6
