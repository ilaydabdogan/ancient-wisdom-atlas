canonical_text:
  quote: ''
  summary: The passage describes travel arrangements and observations in Yap, including
    wharves, a Big House, fish-weirs, reef collecting, currents, and sharks. It then
    reports Juan's accounts of two Guam lovers who leapt from a cliff and of a spectral
    white deer that appeared to his grandfather while hunting at dusk, leading him
    onward after his dog refused to follow until he fell over a precipice. Juan explains
    this as a trick woodland spirits play on men entering the mountain wilderness;
    the narrator compares the belief to Japanese Bake-inono and the Irish Puka. The
    passage closes with discussion of Caroline Island star names and navigational
    astronomy.
  language: English
