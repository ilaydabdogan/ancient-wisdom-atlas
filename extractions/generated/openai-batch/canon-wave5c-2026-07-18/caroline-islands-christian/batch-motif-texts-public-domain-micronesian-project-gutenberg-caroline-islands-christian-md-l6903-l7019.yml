canonical_text:
  quote: ''
  summary: The narrator returns to the colony, reports to the Spanish Governor, visits
    Langar, meets local interlocutors and visitors from Ngatik, botanizes and collects
    seeds, receives Nanapei's warning about illness and political blame on the east
    coast, and is invited by Chaulik to Mutok. On Mutok and in Kiti he is hosted by
    local leaders and a Catholic padre. Eta guides him on a hill climb, helps with
    plant names, and later encourages kinsfolk to share knowledge of old gods and
    heroes. The passage closes with descriptions of watercourses, hills, forest, wildlife,
    lagoon, reef, and growing confidence with Nanchau's kin.
  language: English
  quote_policy: summarized
