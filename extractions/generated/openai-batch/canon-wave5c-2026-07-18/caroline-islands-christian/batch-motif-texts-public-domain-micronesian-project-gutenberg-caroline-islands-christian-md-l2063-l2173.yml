  summary: A travel narrative relays a translated Spanish account of stone and coral
    monuments in the Mariannes, called Houses of the Ancients, associated by tradition
    with burial of the dead. The account describes ruins at Saipan and Tinian, including
    the House of Taga and a bowl said to be the grave of Taga's daughter where human
    bones were found. The passage then describes arrival at Guam, coastal scenery,
    vegetation, and an inland journey to Agafia.
