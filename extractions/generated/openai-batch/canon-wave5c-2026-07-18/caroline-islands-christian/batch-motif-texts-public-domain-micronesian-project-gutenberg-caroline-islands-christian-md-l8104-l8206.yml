canonical_text:
  quote: ''
  summary: A travel party receives hospitality from a local chief, declines to stay
    because their people at Paniau await them, evades an attempted seizure for sailing
    on Sunday, navigates the walled islets and waterways of Nan-Matal, shelters at
    Pikanekit during stormy weather, divides into two canoes for safety, reaches an
    island camp, and resumes collecting, fishing, and distributing medicines after
    the weather clears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Noch addresses the visitor as a friend and guest and says Ponape people
    should not all be described as cannibals, pirates, or wild men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dinner is prepared with yams and taro, the Noch drinks Spanish wine in moderation,
    and he urges the party to stay for a day or two.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party decides to leave because their people on Paniau have scant supplies
    and are waiting for their return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A boat manned by five of Paul Ichipau's men approaches with orders to bring
    the party bound before King Paul for sailing on a Sunday.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party refuses the summons and prepares for self-defense with paddles;
    the pursuing boat turns back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The party enters the labyrinth of Nan-Matal, passes named walled islets, and
    navigates basalt blocks in the waterway.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Pikanekit the party plans to pick up Kaneke's wife Lilian and her baby,
    and a stormy night interrupts the voyage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The next morning has black sky, gale, rain, fallen palm nuts, a freshet brook,
    and a cooking pot on the fire.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Because of rough sea, heavy cases, and fear of another accident, the party
    divides between two canoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Both canoes have narrow escapes from upsetting but ultimately reach their
    destination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A pig bought from Hezekiah attacks Nanaua's legs in one canoe until quieted
    with an axe-handle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Friends on the island help haul the canoes onto the beach, and the camp has
    renewed provisions and supper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the following clear morning the party fishes and gathers shells in reef
    pools, and the narrator distributes medicines during further mainland visits.
  category: action
  evidence_refs:
