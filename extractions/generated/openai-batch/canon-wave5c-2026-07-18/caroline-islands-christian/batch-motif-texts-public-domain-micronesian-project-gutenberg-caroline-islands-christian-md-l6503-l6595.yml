  summary: The narrator describes changes among Pacific islanders and native converts
    under Christian mission influence, then depicts a mission station with students
    learning trades and domestic skills. The party receives hospitality from mission
    staff and Dr Channon, visits classrooms, hears hymns, departs by boat toward Lele,
    passes coastal and mountain scenery, eats at Capt. M.'s, and walks through woodland
    and palm groves on the narrator's last night in Lele.
