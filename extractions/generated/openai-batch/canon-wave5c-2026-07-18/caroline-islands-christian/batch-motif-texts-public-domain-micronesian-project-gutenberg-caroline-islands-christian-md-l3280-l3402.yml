canonical_text:
  quote: ''
  summary: The passage combines ethnographic notes about Ponapean clans tracing descent
    from Icho-Kalakal and a possible southern invasion; linguistic, place-name, and
    architectural parallels; and a first-person account of expeditions to Nan-Matal,
    Nan-Tauach, and Pan-Katara. The expedition excavates shell objects, clears jungle
    from ruins, notes Keroun's fear that spirits haunt the precinct, records a tradition
    of a former royal kava gathering, and ends with Alek bringing carved objects.
  language: English
  quote_policy: summarized
