  summary: The narrator travels by canoe from Paniau toward Marau with Nanchau and
    companions to visit the Au, an old headman known for old traditions, and to see
    inland ruins. The passage describes reefs, lagoons, fresh water bubbling through
    a reef, mountains, mud flats, settlement vegetation, the Au's house on a basalt
    terrace, and an evening conversation in which the Au begins recalling older political
    history involving Chokach, Chou-pei-achach, Kiti, Metalanim, and the tribe of
    Not.
