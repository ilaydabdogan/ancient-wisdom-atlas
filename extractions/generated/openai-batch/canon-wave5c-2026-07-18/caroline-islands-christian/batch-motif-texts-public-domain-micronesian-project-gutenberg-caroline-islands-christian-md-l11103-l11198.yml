comparison_claims:
- id: claim:1
  claim: The narrator explicitly compares the burying and digging up of a mother for
    blessings with a Rarotongan origin-of-pigs legend and a Ponapean story in which
    Kaneki the Leper’s corpse gives rise to the coconut palm.
  claim_level: same_motif
  target: Rarotongan origin of pigs; Ponapean story of Kaneki the Leper and the coconut
    palm
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides the narrator’s brief comparison only, not the
    full Rarotongan or Ponapean narratives.
- id: claim:2
  claim: Lirou’s Southern Yap account is said to agree closely with Toluk’s northern
    version in the details of Michigam’s voracity, rat-form plantation raids, death
    in a trap, and a flood seven days later.
  claim_level: same_motif
  target: Northern Yap version given by Toluk
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: Only the overlapping details summarized by the narrator are available
    in this passage.
- id: claim:3
  claim: The narrator notes a name similarity between Angafau and early Samoan Ongafau,
    paired with Tofitofau in a traditional fairy-tale opening.
  claim_level: linguistic_similarity
  target: Early Samoan legend names Ongafau and Tofitofau
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage supports only a name comparison and does not establish
    shared narrative content or historical connection.
- id: claim:4
  claim: The narrator compares Legerem’s staged magical production of woman from coconut
    husk through animal and phantom stages to the gradual evolution of the first man
    and woman in the Mayan Popol Vuh.
  claim_level: same_function
  target: Mayan Popol Vuh account of gradual evolution of first man and woman
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is authorial and general; the passage gives no detailed
    Popol Vuh evidence.
- id: claim:5
  claim: The narrator describes Galuai’s return from the sky astride a bamboo cane
