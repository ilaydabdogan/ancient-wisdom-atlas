- id: obs:1
  text: The narrator says that burying and digging up a mother for blessings recalls
    a Rarotongan pig-origin legend and a Ponapean story in which Kaneki the Leper
    is buried and a coconut palm grows from his corpse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lirou of Tomil gives a Southern Yap version in which the fairy is named Legerem,
    her husband is Mar-alau, and the Fairy Mother is named Mithigom or Michigam.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A goddess pursues the fleeing figures on storm wings, tries to seize them
    in talons, and tears away Ramung and the tract occupied by Map Island before succeeding
    on the third attempt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mar-alau drowns in winds and waters; the Fairy Mother and daughter hide in
    a cave; Legerem is captured by Igereng of Tomil; the Fairy Mother escapes and
    promises to visit her daughter in seven days with blessings rather than curses.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Fairy Mother appears as promised, levels and builds the stone wharf Ochongol
    from Dagut to Tomil, and plants roads with avenues of Kel or native almond.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Michigam raids plantations in the form of a rat, dies in a trap, and a flood
    follows in seven days; the survivor from Unean is Angafau, who escaped by climbing
    a tall palm.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator says Angafau’s name appears in early Samoan legend as Ongafau,
    paired with Tofitofau in a traditional fairy-tale introduction.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Legerem creates by magic five boys and a girl; Yangalab settles Gochepa, is
    assigned conquest of eastern islands as far as Ruk, Kuthiu, and Fanupei, and tribute
    is said to be paid to the chiefs of Gochepa because of this.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Legerem works over a tangle of coconut husk in successive seven-day periods,
    producing a black shore-lizard, a blue-tailed lizard, an iguana, a phantom frame
    of a woman, and finally Le-pulei, described as a perfect woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: By Legerem’s magic, Le-pulei bears six named daughters, and the people of
    Yap are said to descend from these daughters and from sky fairy visitors taken
    as wives by Legerem’s sons.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Legerem catches a sea-eel, cuts it in two, plants the pieces, and from them
    grow a coconut palm and a banana tree; two kinds of taro, Mai and Lak, are produced
    by similar means.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Legerem sends Galuai, an old man, who ascends in a column of smoke to the
    sky, asks Yalafath for more food for Yap, receives yams packed in a hollow bamboo
    cane, rides it astride with fowls harnessed alongside, and brings yam, bamboo,
    and domestic fowl to Yap.
  category: sequence
  evidence_refs:
  - ev:12
