canonical_text:
  quote: ''
  summary: 'The passage reports a Southern Yap version of stories about Legerem and
    her Fairy Mother: a storm pursuit tears away islands, Mar-alau drowns, Legerem
    is captured, the Fairy Mother escapes and later blesses the marriage by building
    a wharf and planting roads. The Fairy Mother later appears as a rat, dies in a
    trap, and a flood follows, with Angafau surviving in a tall palm. Legerem magically
    creates children, assigns Yangalab conquest and tribute rights, creates a woman
    through successive seven-day transformations from coconut husk and lizards to
    Le-pulei, and produces Yap ancestry through Le-pulei’s daughters and sky fairy
    wives. Another tale explains food origins: Legerem plants pieces of a sea-eel
    to produce coconut and banana, produces taro similarly, and sends Galuai up a
    column of smoke to Yalafath, who gives yams in a bamboo cane with fowls for the
    return to Yap. The narrator also notes several comparisons to Rarotongan, Ponapean,
    Samoan, Mayan, and classical material.'
  language: English
  quote_policy: summarized
