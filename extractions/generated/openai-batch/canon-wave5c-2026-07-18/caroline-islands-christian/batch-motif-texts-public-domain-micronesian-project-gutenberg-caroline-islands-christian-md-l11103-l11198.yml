  type: summary
  locator: 11108-11115
  quote_or_summary: Lirou of Tomil provides a Southern Yap version; he names the fairy
    Legerem, her husband Mar-alau, and the Fairy Mother Mithigom or Michigam.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:3
  type: summary
  locator: 11116-11129
  quote_or_summary: A goddess chases the fugitives on storm wings, tears away Ramung
    and Map Island, nearly tears another island, Mar-alau drowns, the Fairy Mother
    and daughter hide in a cave, and Legerem is captured by Igereng of Tomil.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:4
  type: summary
  locator: 11129-11137
  quote_or_summary: The Fairy Mother escapes, promises to visit Legerem in seven days
    with blessings for the new marriage, then returns, builds the stone wharf Ochongol
    from Dagut to Tomil, and plants the roads with Kel almond avenues.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:5
  type: summary
  locator: 11137-11144
  quote_or_summary: Michigam’s plantation raids in rat form, death in a trap, and
    a flood after seven days agree with Toluk’s northern version; the survivor Angafau
    escaped from Unean by climbing a tall palm.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:6
  type: summary
  locator: 11144-11150
  quote_or_summary: The narrator says Angafau’s name appears in early Samoan legend
    as Ongafau, coupled with Tofitofau in a traditional fairy-tale introduction.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:7
  type: summary
  locator: 11151-11162
  quote_or_summary: Legerem magically creates five boys and a girl; Yangalab settles
    Gochepa, receives conquest over eastern islands up to Ruk, Kuthiu, and Fanupei,
    and tribute is said to be paid to Gochepa chiefs as a result.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:8
  type: summary
  locator: 11163-11169
  quote_or_summary: The narrator introduces Lirou’s tale of Legerem’s magic arts for
    providing wives and says it recalls the Mayan Popol Vuh account of gradual evolution
    of the first man and woman.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:9
  type: summary
  locator: 11170-11182
  quote_or_summary: Legerem works seven-day periods over coconut husk to produce a
    black shore-lizard, blue-tailed lizard, iguana, phantom woman, and finally Le-pulei,
    a perfect woman.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:10
  type: summary
  locator: 11183-11187
  quote_or_summary: Le-pulei bears the daughters Tilik, Le-ngeru, Matenai, Tiningamat,
    Miting, and Rutineg; the people of Yap descend from these daughters and from sky
    fairy visitors married to Legerem’s sons.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:11
  type: summary
  locator: 11190-11195
  quote_or_summary: Legerem catches a sea-eel, cuts it in two, plants the halves,
    and from them grow a coconut palm and a banana tree; Mai and Lak taro are produced
    similarly.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
- id: ev:12
  type: summary
  locator: 11195-11198
  quote_or_summary: Legerem sends Galuai up a column of smoke to Yalafath in the sky;
    Yalafath gives yams packed in a hollow bamboo cane, and Galuai rides it back with
    fowls, bringing yam, bamboo, and domestic fowl to Yap; the narrator compares the
    image to Venus with birds.
  source_text_path: texts/public-domain/micronesian/project-gutenberg/caroline-islands-christian.md
  rights_note: Rights status not supplied in source metadata.
