literal_observations:
- id: obs:1
  text: A prisoner named Tarragon is described as a Pelew chieftain, a homicide, and
    a participant in the seizure of the trading schooner Maria Secunda and massacre
    of its crew.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: O'Keefe is said to have detained Tarragon with a revolver in a threatening
    crowd, after which Tarragon was taken ashore under guard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: O'Keefe and E. held a long interview with the Spanish Governor, who was irritated
    by the Dutch flag having been raised on St David's and who thanked O'Keefe for
    a service.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator was hindered by a painful foot while revising notes and writing
    new ones, receiving daily material from old Lirou and practical help from the
    Sonsorol boy called Matches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Spanish medical practitioner removed a deeply embedded splinter from the
    narrator's foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mrs O'Keefe helped the narrator obtain equivalents for a table of key-words
    in the dialects of Sonsorol, St David's, and Nauru, and praised Konias's earlier
    work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator states that if he returns to the Carolines he intends to follow
    Mrs O'Keefe's advice about taking a Sonsorol boy as helper.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On 14 December the mail steamer Saturnus arrived from Manilla with deported
    rebels and began coaling at the Tarrang wharf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sonsorol and Yap men carried large baskets of coal on their heads, and the
    narrator describes their bodies, clothing, hair, combs, and ornaments.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The coaling workers showed little interest in the Manilla men aboard and are
    described as viewing the garrison and newcomers with good-humoured indifference
    and some contempt.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Saturnus brought news of a battle near Cavite in which a village of about
    eight hundred rebels was reportedly surrounded and shot by Spanish reinforcements.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports that six rebels were shot on the Luneta esplanade and
