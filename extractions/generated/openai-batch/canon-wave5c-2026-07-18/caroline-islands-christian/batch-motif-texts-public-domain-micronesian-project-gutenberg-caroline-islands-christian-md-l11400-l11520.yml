canonical_text:
  quote: ''
  summary: 'The passage describes travel observations in North Yap: a boat under construction,
    plants, and a survey of Tan-ne-Erouatch, described as the land of Dead Heroes
    and burial place of mighty men of old. The narrator records grave forms for commoners
    and elites, a reported custom of throwing chewed pandanus fruit on graves to propitiate
    spirits, a local account of a former warrior island north of Ramung, fear of the
    deserted grounds at night, a large grave attributed to Rek of Umin, and remains
    of old gardens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: B. is observed setting up the framework of a trading boat made of tamanu timber,
    which is described as reddish-grained, durable, and said to harden in salt water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shrub called Avetch is described with jamboo-like foliage, a white petal-like
    terminal leaf, minute seeds, and small golden-yellow star-shaped flowers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tan-ne-Erouatch is identified as the land of the Dead Heroes and as a district
    containing burial places of mighty men of old.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The burial landscape is covered with grasses, wild sorrel, South Sea arrowroot,
    pitcher-plants, wild pandanus trees, and climbing fern.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A slope contains flat basalt platform graves overgrown with climbing fern;
    common-folk graves are lower, while graves of chiefs and wealthy men are higher
    and faced with upright stone slabs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A young guide reports a Yap custom of throwing chewed pandanus fruit on top
    of graves, described by the narrator as apparently propitiating spirits of the
    dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The guide reports a former island north of Ramung called SepiU or Sepil, whose
    people were savage warriors who came by canoe to fight the men of Yap.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: B. identifies the reported former island with Hunter's reef, a submerged coral
    stack northward in about fifteen fathoms of water, while the narrator notes possible
    name resemblances to Saipan and Tsipan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The promontory has traces of ancient cultivation and old house foundations;
    it is now waste and desolate, and natives fear to come there at night, coming
    only by day and in small groups.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A grave said to be that of Rek, chief of Umin, is surrounded by a narrow trench
    and consists of four tiers, with stone tiers, an earth tier, and a paved topmost
    tier.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Terraces and ditches beyond Fal are identified as relics of old gardens where
    yams and turmeric or wild ginger were formerly grown; the turmeric roots were
    used to make a cosmetic.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: A small rivulet running to the sea forms shallow pools where freshwater shells
    are gathered and compared to shells from a waterfall basin at Puia on Kusaie.
  category: setting
  evidence_refs:
  - ev:11
