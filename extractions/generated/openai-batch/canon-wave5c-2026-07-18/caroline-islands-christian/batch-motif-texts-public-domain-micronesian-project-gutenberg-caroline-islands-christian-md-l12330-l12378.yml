canonical_text:
  quote: ''
  summary: A wise old man of Tomil, taught astronomy by Le-gerem, leads seven men
    by canoe to the Pelew Group under the guidance of the Pleiades. There he finds
    shining stone and pearl-shell, shapes the stone into fish, crescent, and wheel
    forms, and returns. Le-gerem keeps only the holed stone wheels, rejects the other
    forms, and uses a charm to make them the desired standard coinage. The narrator
    says this leads to civil war in Yap and to fatal later expeditions for the stones
    and pearl-shell.
  language: English
  quote_policy: summarized
