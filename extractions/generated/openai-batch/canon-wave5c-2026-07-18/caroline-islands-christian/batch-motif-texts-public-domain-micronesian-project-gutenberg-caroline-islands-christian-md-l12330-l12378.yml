- id: obs:1
  text: A wise old man in Tomil named Anagumdng^ is said to have been taught the stars
    and their seasonal risings and settings by Le-gerem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After three months of study, Anagumdng^ takes seven men, described parenthetically
    as the usual perfect number in Yap tradition, and sails in a large canoe toward
    Balao, the Pelew Group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expedition is guided by the constellation Mageriger, identified in the
    passage as the Pleiades.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near Peleleu, at the Kokial islets in the lagoon, Anagumdng^ finds shining
    stone and pearl-shell.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shining stone is cut with shell-axes into fish, crescent moon, and rounded
    wheel forms; the wheel forms are bored with a large central hole.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The expedition loads the stones into the canoe and returns in five days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the stones are brought ashore, Le-gerem keeps the holed wheels, throws
    away the other forms, and uses a powerful charm to focus public desire on the
    recognized coinage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator states that before this there was no fighting in Yap, but afterward
    civil wars occurred because tribes wanted the coveted treasure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Later expeditions from Tomil, Rul, and Gochepa to the Pelews cause deaths
    from storm-season voyages, overturned vessels carrying heavy stones, and battles
