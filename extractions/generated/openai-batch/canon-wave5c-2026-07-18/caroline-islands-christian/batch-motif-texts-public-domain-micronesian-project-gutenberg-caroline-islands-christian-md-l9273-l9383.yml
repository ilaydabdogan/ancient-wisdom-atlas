canonical_text:
  quote: ''
  summary: 'The passage describes Yap valuables and exchange media, including pearl-shell
    money, copra, and a rare white bark mat. It then reports Lamotrek fishing and
    meal rites as told by Evan Lewis: a blessing to Toutop before eating fish, abstinence
    and fasting before fishing, the Yaf-ilok fire ceremony, washing in salt water,
    invocation of sea gods, and taboo sanctions. A note adds a Lamotrek belief about
    a squid leaving the sea at night to climb coconut palms and drink toddy.'
  language: English
  quote_policy: summarized
