canonical_text:
  quote: ''
  summary: 'The passage reports Ponapean traditions and commentary about ancient ruins:
    two brother heroes from Chokach are said to have built Nan-Moluchai by magic,
    causing stones to fly into place; the author discusses the physical basalt, possible
    transport methods, and local explanations that black stone grows in salt water;
    it also recounts a former Ponapean kingdom, its destruction by invaders, the drowning
    and divine transformation of its last king into a blue river fish that is not
    eaten locally, and the conqueror''s later status as a war-god and spectre.'
  language: English with Ponapean and Polynesian names/terms
  quote_policy: summarized
