canonical_text:
  quote: ''
  summary: The narrator describes the Pan-Katara precinct and Nan-Tauach masonry as
    a former sacred burial place for the King of Kiti and Kaeka, notes later treasure-seeking
    disturbance of the graves, returns to a clearing where a council-lodge has been
    built, converses with a young chief, and observes communal food distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pan-Katara is described as bordered by kava patches and shaded by Kangit trees,
    while Nan-Tauach is a basalt-block masonry pile overgrown with brushwood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nan-Tauach is said to have formerly been a very sacred spot, with two eight-foot-deep
    holes on top.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The two holes are identified as the graves of the King of Kiti and his marshal
    Kaeka, who were interred there after falling in a great battle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nan-Tauach masonry is compared to a Metalanim namesake but described as
    smaller and less finished; another Pankatara on Ngatik is described as a rude
    stone stack.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Searchers for red money, glossed as gold, removed flat stones covering the
    pits and found mouldering bones rather than treasure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator’s party returns through difficult terrain, including fallen tree
    trunks, mud-puddles, and stone-paved torrent beds, before reaching a clearing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the clearing, the building of a council-lodge has ended for the day, and
    feeding the fasting workers is about to begin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The workers include palm-leaf thatch sewers, house-mat plaiters, wood hewers,
    stone-workers, carpenters and joiners, and shutter-weavers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A large food pile is present, and the passage states that native hospitality
    avoids half-measures and strongly condemns grudging food to a neighbour.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator converses with the young chief for whom the house is being built;
    the exchange includes foreign news and the chief’s account of his own people’s
    history.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young chief is surprised by resemblances between Samoan, Tahitian, Marquesan,
    and local numerals or key words, and responds emotionally to a proposal for Pacific
    federation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief says that under one family and one flag the sea-girt lands would
    hold together like one household and war would vanish.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: An old man and young helpers distribute baskets of baked yams, fermented breadfruit,
    cooked plantains, and a baked sucking pig as the chief’s share; the old man then
    dances and jokes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that Saturday cooking of food to last until Monday occurs
    here as in Samoa and other islands.
  category: sequence
  evidence_refs:
  - ev:10
