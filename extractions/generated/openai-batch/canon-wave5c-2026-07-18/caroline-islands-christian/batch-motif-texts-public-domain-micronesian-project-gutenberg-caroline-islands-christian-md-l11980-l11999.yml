canonical_text:
  quote: the Age of Bone and Stone has passed away, and the Age of Iron and Steel
    has come in
  summary: The narrator describes returning to a boat, finding a paddle missing, improvising
    with a bottom board, and traveling to Tarrang. At Tarrang the narrator arranges
    notes and plans questions for expected local informants. In the evening, a man
    from Macao gives shells and a sting-ray tail with a deadly spine formerly used
    in the Carolines for tipping weapons; the narrator comments on the replacement
    of bone and stone by iron and steel.
  language: English
