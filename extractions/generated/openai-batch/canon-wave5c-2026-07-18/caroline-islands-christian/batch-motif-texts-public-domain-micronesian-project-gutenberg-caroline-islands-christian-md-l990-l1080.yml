canonical_text:
  quote: ''
  summary: A chronological historical abstract of Spanish occupation in the Caroline
    Islands, including German and Spanish flag-raising, papal arbitration, Spanish
    colonial proclamations, Catholic and Methodist mission conflicts, deportation
    of a Methodist leader, native risings, massacres, punitive expeditions, bombardments,
    American naval intervention, later Spanish governors, and an authorial comment
    that religious animosity contributed to loss of life, treasure, and humiliation
    for Spain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In August 1885, a German gunboat raised the German flag at Yap; the resulting
    dispute was referred to the Pope, who pronounced in favor of Spain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Spanish flag was raised at Ascension Bay in Ponape in July 1886, and Spanish
    rule was formally proclaimed there in April 1887 with the founding of the Colony
    of Santiago.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Catholic mission station was founded in Kiti, followed by disputes between
    Methodist missionaries from Boston and Capuchin priests; Mr Doane, the Methodist
    mission head, was deported to Manilla.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In July 1887, a detachment of Manilla soldiers under Ensign Martinez was massacred
    on Chokach, followed by a general native rising, capture of the Spanish fort,
    and killing of Governor Posadillo and about seventy defenders.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A punitive expedition arrived in October 1887, and the new Governor Cadarso
    proclaimed a general amnesty; 1888 and 1889 are described as a period of peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In June 1890, Lieutenant Porras and fifty-four soldiers working on a military
    road at Oa were massacred; four days later J. C. Dewar's yacht Nyanza was wrecked
    on reefs off the Mant Islands.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In September 1890, a relief expedition arrived from Manilla under Colonel
    Gutierrez Soto; the Metalanim coast was bombarded, troops landed on Tomun, native
    houses and King Paul's residence were destroyed, and an attempted overland march
    by Spanish troops failed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Spanish forces landed at Tolopuel in Metalanim harbour, where Colonel Soto
    was killed; later an attack upon Oa was carried by the Spanish with severe loss,
    and Chaulik, named as a leading rebel chief of the League, died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The American corvette Alliance arrived demanding compensation for the proposed
    expulsion of missionaries, obtained 17,000 gold dollars, and conveyed Mr Rand
    and his Methodist colleagues to Kusaie.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In November 1890, hard fighting took place at the stockade of Ketam, which
    the Spanish captured at the cost of a third of their force.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Later events included minor skirmishing, assassinations of isolated Manilla
    soldiers, the conciliatory policy of Don Jose Pidal, and the popularity of Don
    Miguel Velasco, who the passage says may have died in a recently reported massacre.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage attributes the later massacre to the imprisonment of Henry Nanapei
    of Ronkiti, described as a principal chief with American sympathies and head of
    Protestant mission schools in his district.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The author concludes that theological animosity had contributed to loss of
    life and treasure and humiliation for Spain.
  category: speech
  evidence_refs:
  - ev:13
