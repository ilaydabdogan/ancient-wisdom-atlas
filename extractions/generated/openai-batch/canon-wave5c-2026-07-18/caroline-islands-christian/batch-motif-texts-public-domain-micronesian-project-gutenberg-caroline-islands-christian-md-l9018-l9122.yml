canonical_text:
  quote: ''
  summary: The passage gives linguistic and ethnographic observations on Chamorro
    and related languages, reports ruins and an inscribed cave on Guam attributed
    to an ancient queen, speculates about lost Chamorro writing and specialist interpreters
    of signs, then narrates travel through Guam landscapes, rice fields, villages,
    and onward travel toward Yap. It also mentions Fun-Tan as a Marianne deity of
    fishermen and sailors and compares the name and function to Japanese Fune-Dama.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Chamorro grammar is akin to Tagala, Pampang, and Favorlang,
    and that its vocabulary has resemblances to words in the Sulu Archipelago, Aino
    traces, Polynesian affinities, and several Sanskrit cognates.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Padre Jose tells the narrator of ruins on Saipan, Rota, and Tinian, and of
    a cave on Guam near Ina-rahan and Agafia whose walls are covered with hieroglyphical
    characters attributed to an ancient queen of the island.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that there seems no reason the Chamorros could not have
    had an ancient written character like neighboring Tagals and Malays.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator proposes that long oceanic isolation could have caused the art
    of writing to pass into the hands of a minority who alone interpreted the signs,
    after which the practice could be lost except for traces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage compares writing with tattooing or commemoration in Ponape and
    cites related words from Ponape, Lampong of Sumatra, and the Sulu Archipelago.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator expresses interest in discovering whether old Chamorros had their
    own alphabet and whether inscribed tablets with annals and deeds of native kings
    might exist.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator learns that Saipan has a colony of Caroline islanders mostly
    from central groups.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The road to Port Luis crosses small bridges over rivulets, passes native houses
    among taro and banana plantations, and runs near coconut palms, the sea, beach
    vegetation, reef, and shells.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Asan, local peasantry prepare swampy land for rice planting, and the passage
    states that rice cultivation was a native industry before the conquest of 1570.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage suggests occasional early visits by Chinese or Japanese trading
    vessels and identifies Fun-Tan as the Marianne god of fishermen and sailors, probably
    corresponding to Japanese Fune-Dama, god of ships and navigation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hill of Nagas is described as looking down upon marsh and meadow, with
    rounded limestone formation resembling a Rhine hillside robber-castle.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Tipungan, the travelers load the trap with oranges with the aid of the
    village headman, meet an American trader, reach Port Luis, board the Uranus, and
    continue toward Yap.
  category: sequence
  evidence_refs:
  - ev:8
