canonical_text:
  quote: ''
  summary: The narrator travels with Keroun to Nantiati, attends a Kava festival by
    the water, meets Joe Kehoe, and goes to Nantamarui to discuss exploration plans
    privately. The next day at Ponatik he meets Chau-Tapa, also called Obadiah, a
    native preacher from Aru recommended by Nanapei to attend to spiritual welfare
    and teach Mortlock vocabulary. The narrator describes Obadiah’s background, religious
    manner, drinking, contradictory conduct, and language instruction. The passage
    ends with Joe arriving to finalize arrangements for a third expedition.
  language: English
  quote_policy: summarized
