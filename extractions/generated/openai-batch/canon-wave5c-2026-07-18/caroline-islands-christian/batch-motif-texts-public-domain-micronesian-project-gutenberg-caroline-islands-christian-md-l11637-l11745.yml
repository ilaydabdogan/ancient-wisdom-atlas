  summary: A travel narrator records visits in north Yap and conversations with local
    informants. The passage includes crocodile or alligator stories linked to Yap,
    the Pelews, Ponape, and Lamotrek; a Sonsorol rat-control tale; statements about
    sacred iguanas in Yap, two-tailed lizards as omens or luck charms, and an old
    man trading captured iguanas; and a description of terraced graves with an upright
    basalt slab.
  language: English
