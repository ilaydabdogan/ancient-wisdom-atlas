literal_observations:
- id: obs:1
  text: The described island group consists of three low coral islands named Pingelap,
    Taka, and Chikuru, with Chikuru also styled Tugulu on charts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: The passage estimates the population at a little over 1,000 and says most
    inhabitants live on the main central island.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The inhabitants are described as an ethnic link between Ponape and Mokil,
    and their language is described as an antiquated dialect of Ponapean with some
    Marshall Island words.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Missionary Ponapean, introduced through lesson books, New Testament translations,
    and songs, is said to be displacing the older local language.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The main island is described as having shaded walks, avenues, plantations
    of bananas and taro, arrowroot in the bush, boathouses, huts, and many canoes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Pingelap people are described as energetic fishermen, with canoes on the
    beach and offshore and fishing nets hanging in many places.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: The reef, sea, and bottom are described as containing cracks and fissures,
    fish, crustacea, squid, coral patches, sea plants, zoophytes, seabirds, and herons.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food resources mentioned include coconuts, two varieties of jack-fruit, fish,
    pigs, fowls, bananas, taro, arrowroot, and bread-fruit.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
  - ev:8
- id: obs:9
  text: The visitors are conducted to a cool shady spot, where mats are spread, green
    coconuts are husked, and a meal is prepared.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tomas is identified as the native teacher, and the passage describes a native
    church and schoolhouse with palm thatch and burnt coral walls.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Heaps of coconuts and baskets of cooked food outside are identified as the
