  text: The Yap group is described as one main island with several northern and smaller
    associated islands, surrounded by a coral reef.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The main island is described as nearly cut in two at the isthmus of Girrigir,
