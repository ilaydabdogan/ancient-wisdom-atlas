  quote: ''
  summary: 'A descriptive ethnographic and geographic account of Yap: its islands,
    reef, hills, water supply, population, social classes, house construction, crops,
    winds and typhoon seasons, and stone money used as a medium of exchange and display
    near club houses and wealthy houses.'
