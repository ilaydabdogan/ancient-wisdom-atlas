canonical_text:
  quote: ''
  summary: The passage identifies Pan-Katara/Nangutra as a haunted former governmental
    and ritual precinct, summarizes annual ceremonies involving high priests, canoe
    consecration, kava, food offerings, and restricted temple access, then gives a
    native account of a huge lizard or alligator first treated as a tutelary being,
    later declared a cannibal enemy, and finally killed by a drugged hog bait and
    fire trap in the council lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pan-Katara is described as a haunted island also called Pan-Gothra or Nan-Gutra,
    with a native gloss meaning House of Government, metropolis, or capital.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The precinct is said to have been anciently the seat of government and solemn
    feasts of king, priests, and nobles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A white goat is described as the solitary inhabitant, coming down bleating
    and browsing on leaves and shoots tossed into the canal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Dziamarous, identified as High Priests of Metalanim, had chief temples
    at Nanmatal and Nangutra and met once a year for the feast of Arbungelap.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: District natives repaired to Kuffiner for the feast, and canoes made during
    the past year were launched for consecration, while the vessel for the Divinity
    remained suspended in the king's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The celebration involved religious dances, kava drinking, singing, boat-racing,
    and the king planting his spear by a long stone at Nangutra.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lower classes, chiefs, and High Priests occupied marked spaces; food was heaped
    as an offering for the god or spirit, and the first cup of kava was offered to
    the god, followed by two cups to the god's two priests.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Only the king's two magicians, Nangleim and Manabus, were permitted to enter
    the temple.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: On Itet, a gigantic deified Conger-Eel is said to live within a thick wall;
    a turtle was killed on a huge stone and its entrails were placed in the Eel's
    house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A native version says that in the reign of King Chau-te-Leur a huge lizard
    swam into the great harbour and took up quarters on Pan-Katara or Pangothra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: People took the lizard for an Ani or tutelary genius and brought baskets of
    fruit and cooked yams and bananas to conciliate it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: After some basket-bearers and industrious slaves disappeared, the chiefs proclaimed
    the lizard a public enemy and cannibal fiend, and warriors went to fight it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The lizard seized and crunched some warriors, and spears, shell axes, pebbles,
    and sling-stones failed against its thick skin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A strategy was proposed to stuff a slain fat hog with pounded Up root, roast
    it over a great fire in the Nach or Council Lodge, wall the lodge except for one
    opening, then close the opening and set the building ablaze once the monster was
    drugged.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The alligator entered the trap, ate the cooked pig, became drowsy, slept,
    and was burned in a furnace of flame while enemies shouted and danced around its
    funeral pyre.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Pon-Kaim is described as the southernmost angle or corner, where submerged
    blocks and a narrow passage close in the island-city.
  category: setting
  evidence_refs:
  - ev:10
