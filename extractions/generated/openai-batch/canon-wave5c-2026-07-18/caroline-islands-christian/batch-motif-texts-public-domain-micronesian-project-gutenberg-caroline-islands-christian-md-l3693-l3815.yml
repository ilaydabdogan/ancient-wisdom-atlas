candidate_motifs:
- id: motif:1
  label: Haunted abandoned ritual-political center
  taxonomy_refs: []
  basis: Pan-Katara is explicitly called haunted and is identified as an ancient seat
    of government and solemn feasts for rulers, priests, and nobles.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is primarily a setting pattern in the passage rather than a narrated
    mythic action.
- id: motif:2
  label: Sacred offering and consecration at annual feast
  taxonomy_refs:
  - sacred_exchange
  basis: The ceremony includes consecrating canoes, preserving a vessel for the Divinity,
    heaping food for the god or spirit, and offering the first cup of kava to the
    god.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports ritual procedure and does not expand the theology
    behind the offerings.
- id: motif:3
  label: Animal sacrifice to a deified animal being
  taxonomy_refs:
  - sacrifice
  basis: At the Eel's house, a turtle is killed on a huge stone and its entrails are
    laid on a paved space in the Eel's house.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The further suggestion that this represents human sacrifice is explicitly
    an authorial probability statement, not a direct narrative assertion.
- id: motif:4
  label: Feeding a dangerous being mistaken for a tutelary power
  taxonomy_refs:
  - sacred_exchange
  basis: The huge lizard is first taken for an Ani or tutelary genius and fed fruit,
    yams, and bananas, but then basket-bearers and slaves disappear.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The same feeding pattern shifts from conciliation to danger; the passage
    does not present the lizard as a beneficent tutelary being after the disappearances.
- id: motif:5
  label: Man-eating monster repels direct assault
  taxonomy_refs: []
  basis: The lizard is proclaimed a cannibal fiend, kills some warriors, and is unharmed
    by spears, shell axes, pebbles, and sling-stones.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family precisely names a generic monster-slaying
    motif.
- id: motif:6
  label: Monster killed by stratagem rather than force
  taxonomy_refs: []
  basis: After direct combat fails, a hog stuffed with narcotic Up root is used as
    bait, the monster is trapped in the Council Lodge, and the building is set on
    fire.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The stratagem is not attributed to a named trickster figure.
- id: motif:7
  label: Destruction of monster by fire
  taxonomy_refs: []
  basis: The trapped alligator awakens in a furnace of flame and dies while enemies
    shout and dance around its funeral pyre.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The fire destroys an individual monster, not the world; therefore the
    supplied world-destroying fire taxonomy is not applied.
comparison_claims:
- id: claim:1
  claim: The passage frames the Conger-Eel account and the huge lizard or alligator
    account as local variants of an Itet monster tradition.
  claim_level: same_motif
  target: Kubary's deified Conger-Eel account and the independent native version of
    the Itet monster as huge lizard/alligator
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The animal identity differs between Conger-Eel, lizard, and alligator,
    and the locations named include both Itet and Pan-Katara/Pangothra.
- id: claim:2
  claim: The passage itself cautiously compares the turtle killing to human sacrifice
    by analogy with New Zealand usage in which fish terms can denote a human victim.
  claim_level: linguistic_similarity
  target: New Zealand Ika or Ngohi as terms said to denote a human victim
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: This is an authorial footnote and a probability statement; the passage
    does not directly narrate a human victim in the Pan-Katara ceremony.
- id: claim:3
  claim: The reported pet alligator kept and fed as a sacred animal at Nan-Matal has
    the same ritual feeding function as the huge lizard initially treated as a tutelary
    genius.
  claim_level: same_function
  target: Author's note about a pet alligator kept in Nan-Matal and fed as a sacred
    animal
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The pet alligator note is brief, not a full narrative, and is distinguished
    from the Conger-Eel account by the author.
