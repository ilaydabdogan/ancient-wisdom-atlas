  summary: The writer argues that the peoples, customs, languages, institutions, and
    thought of the South Sea Islands have received less study than the region's natural
    history. He contrasts anthropological and linguistic inquiry with more materially
    profitable scientific research, notes contributions and limits of explorers, naturalists,
    geologists, and missionaries, and urges historians to regard South Sea Island
    societies as living evidence useful for understanding early historical problems.
  language: English
