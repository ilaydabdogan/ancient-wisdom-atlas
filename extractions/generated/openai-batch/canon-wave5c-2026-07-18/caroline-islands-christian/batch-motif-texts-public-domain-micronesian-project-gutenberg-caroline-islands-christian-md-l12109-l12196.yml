  summary: The narrator hears accounts of two Pacific killings, observes a decorated
    colonial settlement during a fiesta and Catholic procession, describes disorder,
    drunkenness, attempted theft, barter, and fighting after the celebration, then
    records the arrival of the Santa Cruz with O'Keefe and laborers from storm-damaged
    islands.
  language: English
