  summary: A first-person travel account describes a dawn boat passage across a lagoon
    to a mission settlement, its school divisions for Marshall and Gilbert Island
    youths and girls, a visit with missionaries, and a colonial retrospective discussion
    of the 1890 Ponape affair and alleged former violence among Gilbert Islanders.
  language: English
