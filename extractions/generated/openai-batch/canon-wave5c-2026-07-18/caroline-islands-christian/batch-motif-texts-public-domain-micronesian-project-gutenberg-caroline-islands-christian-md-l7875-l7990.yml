  summary: A first-person travel party in an overloaded canoe capsizes in a dangerous
    coastal pool, swims while pushing the waterlogged canoe, reaches a coral refuge,
    bails the craft, and later receives hospitality on Aru Island. The passage then
    reports church fighting, missing spirits, and a visit to the Noch of Matup amid
    local suspicions about influenza being the wrath of Icho-Kalakal and the Ani after
    daylight entered a sanctuary.
