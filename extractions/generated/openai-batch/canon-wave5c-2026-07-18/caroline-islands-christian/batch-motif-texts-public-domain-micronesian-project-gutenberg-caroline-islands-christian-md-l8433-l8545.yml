canonical_text:
  quote: ''
  summary: A travel narrator surveys ruined Kiti fortifications, a royal council platform,
    and a ceremonial kava-pounding stone. The passage reports a Kiti tradition of
    iron men who landed, resisted ordinary weapons, and were killed through the eyes,
    and describes five lucky stones used for divination and said by Au to be watched
    by spirits. The narrator also comments on sacred place-names borrowed from Nan-Matal
    and compares rival shrines in other traditions.
  language: English
