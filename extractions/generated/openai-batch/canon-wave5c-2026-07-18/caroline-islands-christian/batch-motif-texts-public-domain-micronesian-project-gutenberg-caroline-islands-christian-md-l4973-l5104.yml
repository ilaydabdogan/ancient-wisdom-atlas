canonical_text:
  quote: ''
  summary: The passage catalogs Ponapean material practices and terms for cordage,
    traps, cages, fishhooks, fishing methods, nets, weirs, mats, and household implements.
    It also records several authorial comparisons with Yap, Kusaie, Polynesian, Malay,
    Gilbert Islands, Mortlock, and other island terms or practices.
  language: English with Ponapean and comparative vernacular terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old men twist fine strands end to end between fingers and thumbs to form strong
    cinnet cord, called Puel or Kichin-mot, used for lashing house and canoe framework
    in place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Natives formerly made traps and snares from pliant hibiscus strips; bird and
    pig nooses are called Letip or Litip, glossed as “a woman's deceit,” and other
    traps are called Katikatia-mau, glossed as “a good device.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described primitive rat-trap uses reedgrass or cane, coconut leaflet ribs
    as a spring, fermented breadfruit bait, and a heavy rock positioned to fall and
    crush the animal when the spring is touched.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Occasional hibiscus-wood cages may hold birds; children may keep a tame blue
    heron or a black-and-white sea-bird as pets, while elders are described as prioritizing
    food needs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ponapean fishhook Kdch is described as made of wood or bone with a mother-of-pearl
    body whose glitter attracts fish; introduced metal hooks are sought after.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man skilled at fishing is described as likely to secure a good marriage
    alliance because of his resourcefulness as a food-provider.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fishers use squid, cuttlefish, or hermit-crabs as bait, and also crush Up
    root in pools so its milky narcotic juice stupefies fish; larger sea-eels succumb
    last.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Uk is the generic term for nets, which are usually made from hibiscus bark
    strips or Oramai; named forms include stake-nets, seine-nets, casting nets, hand-nets,
    bag-nets, and weirs for different fishing contexts.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Loch is the local mat made of sewn pandanus leaves; the Paliker district is
    noted for producing such mats, and a great tribal chief's Loch is called Parror
    in ceremonial language.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other mat and basket types are identified as foreign or borrowed, including
    Li-rrop mats from other islands, Teinai coconut-leaf mats and Onoto baskets from
    the Gilbert group, and Kie or Kiel sleeping mats from the Mortlocks.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
