canonical_text:
  quote: ''
  summary: The narrator describes Port Darwin’s jetty, town, houses, gardens, and
    public buildings; visits the Botanical Gardens with Foelsche and Holtze; observes
    palms, banyans, and other plants from several regions; arranges an exchange of
    seeds and curios with Holtze; discusses neighboring tribes, mining, railway extension,
    scenery, and hunting; reflects on the pull of travel eastward; and then departs
    by ship toward Timor and Dilli with allusions to ancient and maritime eastern
    lands.
  language: English
