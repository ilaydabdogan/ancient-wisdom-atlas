canonical_text:
  quote: ''
  summary: The narrator prepares in Manila for travel to Yap, Guam, and Ponape by
    obtaining credentials, visiting the Capuchin mission head, receiving vocabularies,
    hiring Theodoro as assistant and photographer, and booking passage on the mail-steamer
    Venus. After nearly missing departure, the narrator and Willie Macleod commandeer
    a steam launch and board with Theodoro and baggage. Shipboard boys frighten Theodoro
    with stories of cannibal Carolinos; at sea he broods while the narrator reads
    and smokes.
  language: English
  quote_policy: summarized
