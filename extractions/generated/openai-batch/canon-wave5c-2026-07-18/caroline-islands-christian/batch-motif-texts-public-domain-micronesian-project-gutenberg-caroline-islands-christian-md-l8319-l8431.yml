  summary: The passage recounts traditions of a castaway canoe with eight chiefs,
    a northward voyage by two brothers who encounter a fiery midnight sky and return
    or are rescued by a kingfisher, and a mountain ascent to ruins where a basalt
    shark image, guardian-spirit images, shark reverence, and an old fortified battle
    site are described.
