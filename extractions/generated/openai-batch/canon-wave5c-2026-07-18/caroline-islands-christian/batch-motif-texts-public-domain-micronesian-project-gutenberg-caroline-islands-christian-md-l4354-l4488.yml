  summary: The passage describes an expedition to hillside ruins near Nantamarui that
    prove to be a small basalt cemetery attributed to the Chokalai or Little Folk.
    It records local traditions about these beings as earlier inhabitants, forest
    haunters, and revengeful goblins, including a tale of a man spirited away while
    planting kava and a report that some Palang River people descend from the Chokalai.
  language: English
