literal_observations:
- id: obs:1
  text: The passage presents a hierarchy in which a priestly or ritual caste is followed
    by the Pilung chieftains and the Pimlingai slaves, with the Pimlingai said to
    live largely in bush villages and to differ in appearance and pronunciation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One tradition says the Pimlingai descended from visiting canoe crews seized
    after a fatal epidemic, when local people killed many men and enslaved survivors,
    women, and children to restock the land.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The enslaved or serf class is said to belong to district chiefs and sometimes
    chief women, perform menial work, eat foods disliked by chiefs, and lack the Pilung
    ornamental comb.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Pilung there is said to be political equality, with majority decision-making
    and old men serving as umpires, spokesmen, and final arbiters of war, peace, and
    judgment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Murder is generally punished by a heavy fine, while breaches of the Machamach
    or Tabu are said to be punished by poisoning or assassination.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two senior wizards are described as heads of the island’s magicians and as
    living under strict rules about what they may eat, tobacco, and betelnut remains.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chewed remains of the senior wizards’ betelnut are collected and specially
    burned to prevent a hostile person from using them for a curse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When one senior wizard goes out, the other stays home because the people believe
    a calamity would follow if the two met on the road.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lesser Machamach men perform tasks such as recovering missing property and
    divination, while grave matters go to the two senior wizards.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The power of Tabu is said to apply to places, objects, and persons, and a
    tabued village may not give or receive goods for a period that can last months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tabu is imposed before long sea voyages, before fishing, during drought, famine,
    or sickness, and at the death of a chief or famous man; in sea contexts it is
    said to propitiate the Yap Neptune and the Shark-God.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says that three or four unmarried girls called Mespil are kept
    in each great club house to minister to the pleasures of the men of that clan
    or brotherhood.
  category: setting
  evidence_refs:
  - ev:9
