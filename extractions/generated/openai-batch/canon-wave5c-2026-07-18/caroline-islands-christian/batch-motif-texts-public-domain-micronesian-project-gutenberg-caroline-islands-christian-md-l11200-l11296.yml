  summary: Ethnographic passage describing Yap social classes, a tradition explaining
    the origin of an enslaved class, authority of chiefs and elders, punishments for
    taboo breaches, restrictions on two senior wizards, practices surrounding tabu,
    propitiatory tabus before sea travel and public crises, and an unfinished description
    of Mespil girls kept in club houses.
  language: English
