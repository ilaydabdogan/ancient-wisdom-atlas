canonical_text:
  quote: ''
  summary: A travel narrator reports receiving from Toluk of Omin a Yap flood account.
    In the account, sky beings and fairies visit Alok festivals; an unnamed fairy
    woman joins the mortal Maralok; her mother Loth summons her for penance. On the
    appointed day the sea rises and swamps the lowlands, killing Maralok while the
    fairy woman reaches Tomil. Loth then appears as an old woman; mother and daughter
    live in an underground cavern, make wings for escape to the sky, are snared in
    a net by people from Damachui, and are assigned to Igereng, who plans to marry
    them.
  language: English
  quote_policy: summarized
