canonical_text:
  quote: ''
  summary: The narrator recalls his final sight of Kubary, spends his last morning
    in Ponape, bids farewell, boards the steamship Uranus, and sails toward Guam.
    During the voyage he hears reports about the Philippine Revolution, describes
    shipboard routines and language discussion, then arrives at Guam, visits Henry
    M. and Padre Jose Palomo, and obtains information on the Chamorro language and
    numerals.
  language: English
