canonical_text:
  quote: ''
  summary: The narrator describes Te Bako, an elderly Gilbert Islander at Nalap, formerly
    a homicide but later converted, who says ghosts of dead men keep him awake and
    who goes onto the reef at night with torch and spear. Te Bako recounts killing
    a cousin during a drunken quarrel at a feast in the council lodge and condemns
    both local toddy and foreign liquor. The passage then describes nightly conversations,
    Te Bako’s war stories and references to foreign ships as “tree-mountains,” tensions
    with the narrator’s Manilla artist companion, and the narrator’s study of Ponapean
    language, dialects, vocabulary, sound changes, and linguistic affinities.
  language: English
  quote_policy: summarized
