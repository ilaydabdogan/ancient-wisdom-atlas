  quote: ''
  summary: A first-person travel narrator is left with a Sonsorol assistant, manages
    a crowd of local visitors who occupy his room while chewing betel-nut and smoking,
    obtains Gameu as an English-speaking interpreter, and anticipates a canoe trip
    to Ramung. The narrator then studies Spanish Philippine vocabularies containing
    moralizing and punitive sample dialogues, a colonial poem about the Cross and
    Light, and the beginning of a dinner dialogue.
  language: English, with quoted Spanish/Bicol-language material and English renderings
  quote_policy: summarized
