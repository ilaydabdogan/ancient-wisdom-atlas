  quote: ''
  summary: The narrator ends a survey of Lele, notes unexcavated ruins and possible
    relics, describes reclaimed lowlands, canals, walls, and fortifications, reports
    a native tradition of foreigners arriving in vessels from the north and imposing
    tribute on Ualan chiefs, states that the natives attach no special sanctity to
    the structures, compares the ruins with Ponape, and departs by sea.
  language: English
