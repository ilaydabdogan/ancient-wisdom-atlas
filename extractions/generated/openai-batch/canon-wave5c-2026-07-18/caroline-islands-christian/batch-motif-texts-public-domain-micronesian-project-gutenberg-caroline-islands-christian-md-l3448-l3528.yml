canonical_text:
  quote: ''
  summary: The narrator describes a third visit to ruins with an excavation party,
    the digging of a central vault, and an inventory of shell beads, fish-hook parts,
    shell axes, shell bracelets, shell needles or ornaments, pendants, human bone
    fragments, skull fragments, shell pieces, an iron spearhead-like object, and a
    fragment identified as obsidian or volcanic glass. The passage includes several
    authorial comparisons to shell-bead money, Central American ruins, Polynesian
    hooks, British flint-implement manufacture, and ancient Mexican obsidian terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After paying off Obadiah, the narrator’s party started from Lot on the morning
    of the 23rd.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Keroun asked to be left out of the visit because of spectral terrors, and
    Alek was absent on the king’s service.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The excavation party included Joe, Joe’s sons Lewis and Warren, Nanit from
    the Kiti border, Ch6tan, the narrator’s group, and a Manilla man with a camera.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The party dug by turns in the central vault during the afternoon and again
    the next morning until noon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rewards for undamaged bracelets or shell-axes encouraged digging, and a tally
    of finds was made at noon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tally included a quart of circular rose-pink shell beads made from Spondylus,
    strombus, and Conus shells.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some beads were circular and called Pul, while others were rectangular and
    called Pake; the passage says they were strung in rows for banana-fibre girdles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some beads were abraded or bleached, and shell-discs from Nan-Tauach were
    described as more elegantly ground and finished than those from other graves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The finds included eighty pearl-shell shanks of fish-hooks, with bone hooks
    generally indicated and some pearl-shell fragments interpreted as barbs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The finds included five ancient Patkul shell-axes of varying sizes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The finds included five unbroken carved shell-bracelets of elegant design,
    called Luou-en-MaUip and associated with the district of Matup.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The finds included about a dozen shell needles said to be used for sewing
    Pandanus leaves for canoe mat-sails, while others interpreted them as neck ornaments.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The finds included thirty or forty large circular shells bored through the
    centers and worn as breast pendants.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The excavation also produced bone fragments, portions of skulls, bits of shell-bracelets,
    small shell gouges, a spearhead-like iron piece, and a smoke-colored vitreous
    fragment identified as obsidian or volcanic glass.
  category: object
  evidence_refs:
  - ev:10
