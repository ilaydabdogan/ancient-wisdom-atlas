canonical_text:
  quote: ''
  summary: A first-person travel account describes a March 1896 journey from Nalap
    toward Ascension Bay and then to the ruins of Nan-Matal. The travelers meet King
    Paul at a festival under Mount Takai-U and pay a fee for permission to explore.
    They later glimpse and enter the ruins through canals and vegetation. Two Ponatik
    men, Keroun and Alek, reluctantly guide the narrator because of fear of ancestral
    spirits and the tabu surrounding the Lil-Charaui or Holy Places. The party reaches
    Uchentau at nightfall and postpones exploration until morning.
  language: English
  quote_policy: summarized
