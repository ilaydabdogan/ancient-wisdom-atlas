  summary: The passage combines linguistic remarks, travel description, and local
    traditions from Ponape and nearby islands. It describes the word Li as a prefix
    associated with woman in names and compounds; records a visit to the Tumulus of
    Kona the Giant and a local tradition that a giant was buried there with legs stretching
    seaward to nearby islets; notes a comparison of the name Kona with Hawaiian and
    Peruvian giant names; and describes the Ant Islands, including a sacred precinct
    for Pako-Charaui, the Sacred Shark and patron spirit of Ant, where sugar cane,
    kava root, and fish heads hang in honour of the divinity.
