canonical_text:
  quote: ''
  summary: A first-person travel narrative describes late work on Sonsorol vocabulary
    in Pilau, a tide-borne return to Tarrang, observations of Sonsorol boys living
    there, a conflict involving a Chinese cook, and a later dinghy visit to Tomil
    to see Chief Lirou, money-stones, village paths, house architecture, and a settlement
    affected by dancing and drinking festivities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator returned late to Pilau, where Konias finished work on the Sonsorol
    key-words, and notebook work continued until dawn was noticed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After brief rest, the narrator traveled on the incoming tide down to Tarrang
