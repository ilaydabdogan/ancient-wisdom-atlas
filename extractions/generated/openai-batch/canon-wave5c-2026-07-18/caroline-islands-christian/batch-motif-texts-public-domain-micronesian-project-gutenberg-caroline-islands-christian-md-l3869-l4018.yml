  text: A published missionary notice described a black Portuguese man as banished
    from Manila, favoured by Spaniards for supplying the late governor with food,
    and doing “Satan’s work.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Christian gave evidence that led to the conviction and detention of some wreck-plunderers.
  category: action
  evidence_refs:
