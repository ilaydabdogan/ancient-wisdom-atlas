  quote: ''
  summary: 'The passage combines reported historical anecdotes and expedition narrative:
    accounts of ambush, wreck-plundering testimony, and revenge killing; Joe Kehoe’s
    report of a stone with human footprints and weapon carvings; archaeological clearing
    and descent into underground chambers at the ruins; the arrival of the steamer
    Quiros; and a hazardous canoe passage through heavy harbour swell toward the ship.'
  language: English
