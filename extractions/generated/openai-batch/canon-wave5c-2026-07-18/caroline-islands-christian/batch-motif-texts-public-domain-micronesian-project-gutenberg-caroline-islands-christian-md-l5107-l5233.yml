  quote: ''
  summary: Ethnographic description of Ponapean household and craft objects, including
    bark-cloth mosquito screens, pillows, baskets, fans, netted bags, combs, gourd
    bottles, cooking vessels, earth-ovens, carving, and tattooing. The passage includes
    a festival use of a long food tray, with food procession, shell axes, kava brewing,
    ancestral-spirit invocation, and feasting, plus several authorial comparisons
