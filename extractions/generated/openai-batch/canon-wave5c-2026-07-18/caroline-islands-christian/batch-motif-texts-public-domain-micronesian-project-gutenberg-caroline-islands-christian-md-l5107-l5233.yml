literal_observations:
- id: obs:1
  text: The Ponapean mosquito screen before gauze and linen is said to have been made
    from cloth produced from Nin tree bark; paper mulberry is said to occur sparsely
    but not to be used for this purpose in Ponape.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pillow called Ulul or Ulunga is described as made from bamboo, a wooden
    log, or a length of tree-fern or pandanus trunk.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several baskets are described, including a flat coconut-frond tray, a circular
    basket, a fisherman’s basket, and a large coarsely plaited fish-basket.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Paikini consists of about thirty or forty flat trays fastened end to end
    to form one long tray, heaped with food and carried by about twenty men during
    festivals honoring a plenteous season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the Paikini festival sequence, men with shell axes sever the bark bindings,
    the food is apportioned, choko or kava is brewed, ancestral spirits are invoked,
    and the people eat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fans are made from pandanus or coconut leaves; ember-fanning fans are described
    as clumsy, while personal fans are neater and compared to Marquesan examples.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Et is a netted bag of Nin or Kalau fibre, and combs are described as similar
    to Yap combs and formerly made of white mangrove wood.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hollowed fruits from calabash-family plants are used as bottles, strung together
    by fives and sixes, with larger gourds used for drinking-water and smaller ones
    for scented oils.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage describes Ponapean wooden dishes, platters, coconut cups, and
    circular wooden vessels, and gives authorial comparisons of vessel terms across
    several languages and islands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The iron pot is described as common in Ponapean households and used for brewing
    black tea and boiling yam and coconut milk.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Um earth-oven is used to steam raw food underground, fish may be broiled
    on glowing embers of dried coconut shells, and a boat-shaped Kachak trough is
    used for preparing pounded foods mixed with coconut milk and salt water.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Carving is described as ornamental and mostly confined to canoe bows, canoe
    sides, and dancing-paddle blades; tattooing uses a human-bone needle called Kai.
  category: object
  evidence_refs:
  - ev:12
  - ev:13
