canonical_text:
  quote: ''
  summary: A travel narrator describes Thursday Island as a hot, dilapidated colonial
    township with a racially mixed population represented in derogatory language.
    The party passes shops, barracks, and the Japanese quarter, lunches at a hill
    hotel with pet animals, returns to the steamer, observes sandalwood loading and
    the killing of a captured shark, then departs across the Gulf of Carpentaria toward
    Port Darwin.
  language: English
