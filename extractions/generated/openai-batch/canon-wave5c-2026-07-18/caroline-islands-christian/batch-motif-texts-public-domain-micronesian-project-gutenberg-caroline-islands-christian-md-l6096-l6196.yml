canonical_text:
  quote: ''
  summary: 'The passage narrates a stay on Lele: the visiting party meets King Tokosa-Teleusar,
    receives hospitality and help for exploring ruins, visits local teachers Li-kiak-sa
    and Kevas, shares a meal, studies the Kusaian language during rain and illness,
    comments on missionary life, and records sparse local traditions about island
    names, plant introductions by Kusaian visitors, and a speculative Japanese connection.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After landing on Lele, the visitors went to see the King, called Tokosa-Teleusar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King speaks good English, learned from American whalers during long voyages
    in his youth, including a visit to Grimsby.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King welcomed the visitors, introduced his wife and household, expressed
    interest in exploration of ruins on his island, promised assistance, and placed
    his house at the narrator's disposal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The King's dependants searched the larder and gathered food from villagers;
    chickens were slaughtered for the visitors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors called on Li-kiak-sa, an aged native teacher described as keen,
    alert, wiry, wise, shrewd, and benevolent; he owned a small islet thickly planted
    with sweet potatoes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitors called on Kevas, an intelligent school-teacher named after Caiaphas,
    and persuaded him and Li-kiak-sa to share an evening meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shared meal included roast fowl, fried fish, eggs, turtle, taro, and a
    pudding made from taro, yam, coconut cream, and ripe bananas steamed underground
    in leaves.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Li-kiak-sa and Kevas refused wine and beer and drank large mugs of scalding
    black tea sweetened with brown sugar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kevas had compiled an English-Kusaian word list and agreed to give the narrator
    two long language lessons each day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rain prevented outdoor excursions, and the narrator's diary records low fever
    symptoms contracted in the Ponape marshes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator observes that Kusaian grammar, numerals, and many root words
    resemble Ponapean, with many Marshall Island words also present.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mr Dewar described Kusaie as a Protestant missionary stronghold where people
    avoided drinking and smoking, while the King secretly enjoyed grog and tobacco
    when possible.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The narrator states that local traditions seem scarce, but the island's name
    is widely known across the Caroline Islands under variant forms.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ponapeans call the island Koto and say that the Ivory Palm and Kava plant
    were introduced to Ponape by Kusaian visitors.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The narrator notes a resemblance between the names Kusaie and Kiu-siu and
    speculates that Lele may have been settled by Japanese from a wrecked junk or
    ancient trading vessel.
  category: speech
  evidence_refs:
  - ev:9
