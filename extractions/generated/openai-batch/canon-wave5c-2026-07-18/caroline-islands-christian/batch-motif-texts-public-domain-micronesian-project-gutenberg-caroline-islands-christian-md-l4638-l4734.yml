  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the killing, the attackers sat down to drink, boast, and make merry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Some fugitives returned, observed the enemies drinking in the lodge, heard
