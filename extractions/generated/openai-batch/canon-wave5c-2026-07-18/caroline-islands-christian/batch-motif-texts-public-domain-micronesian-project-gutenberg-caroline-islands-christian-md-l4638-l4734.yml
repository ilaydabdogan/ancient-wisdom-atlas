canonical_text:
  quote: ''
  summary: The passage describes a visit to the ruins of an ancient hilltop fortress
    called Lang-Takai, then recounts local traditions of siege, nonpayment of tribute,
    deception, massacre, captive survivors, and later use of the site as a refuge.
    It also tells a separate war story in which a Metalanim war-party attacks a festival,
    becomes drunk and overconfident, and is counterattacked by Kiti-related groups
    amid references to Spirit-shapes and a proverb.
  language: English
  quote_policy: summarized
