canonical_text:
  quote: ''
  summary: A Yap legend is recounted in which fairy beings turn into rats to steal
    crops; a giant rat identified as Loth the Fairy Mother is killed, and Loth's daughter
    warns Igereng of a flood to come in seven days. Igereng and his wife prepare on
    the highest hill with magic herbs and rites. A typhoon and tidal wave cover nearly
    all Yap, leaving only a slave man in Unean and the couple alive. The Unean survivor
    claims Nimiguil by placing a bamboo pole, explaining later service tenure. Later,
    Igereng's children fail to dig up their mother after three days, losing promised
    blessings. The sky spirit Yalafath sends his wife Mui-Bab, in bird form, to inspect
    the land; he then sends food plants, and Mui-Bab creates eight genii and wives,
    from whom Yap's generations descend. The narrator adds comparative comments connecting
    parts of the legend with Genesis, Semitic cycles, Japanese shape-changing tales,
    linguistic parallels, and bird-messenger traditions.
  language: English
  quote_policy: summarized
