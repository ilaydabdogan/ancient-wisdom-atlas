- id: obs:4
  text: Loth's daughter tells her husband that in seven days Loth's vengeance will
    bring a high flood-tide to overwhelm the land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife counsels her husband to build a house on the highest hill and bring
    magic herbs for rites or incantations against the inundation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fatal day a typhoon and tidal wave come from the north, nearly all
    Yap is covered, and all people perish except a slave man in Unean and the prudent
    couple.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the waters fall, the Unean survivor places a bamboo pole in the reef
    at Nimiguil as a possession marker and uses it to claim the land from Igereng
    and his wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The land-claim episode is given as the reason Nimiguil people hold their lands
    by labor and military service to the chiefs of Tomil.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two children are born to Igereng; their mother asks to be buried and charges
    them to dig her up after three days, promising advantages if they obey.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy and girl forget their mother's charge; when they finally dig her up
    she is dead, and Igereng's house loses the promised blessings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yalafath, a great spirit in the sky, sends his wife Mui-Bab down to learn
