  text: The fairies, suffering hunger, turn themselves into rats and repeatedly raid
    hill-terrace plantations for sweet potatoes, sugar-cane, and yams.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man on watch kills an enormous rat, and the narrator identifies it as Loth
