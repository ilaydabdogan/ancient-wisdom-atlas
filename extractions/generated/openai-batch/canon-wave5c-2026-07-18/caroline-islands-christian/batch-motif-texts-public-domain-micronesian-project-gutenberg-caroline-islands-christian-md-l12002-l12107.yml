- id: obs:3
  text: The informants discussed the gift of fire, the invention of stone and shell
    adzes, the introduction of stone and shell money, and who taught people to build
    fish-pens of cane and stone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage names Yalafath as a kindly but indolent Creator and Luk as an
    active spirit of Evil.
  category: attribute
  evidence_refs:
