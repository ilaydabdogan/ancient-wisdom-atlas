canonical_text:
  quote: ''
  summary: The narrator reports collecting Caroline Island traditions at Tarrang from
    Matuk, a man from Mokomok, and Lirou. Their topics include stars, lunar days,
    gods and heroes, the gift of fire, technological inventions, money, fish-pens,
    Yalafath the Creator, Luk the spirit of Evil, old wars, and a vanished northern
    land called Sepin or Saiping. The passage also describes elicitation methods,
    language comparison, and a Spanish Fiesta for the Feast of the Conception of the
    Virgin Mary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Matuk of Gochepa and a man from Mokomok arrived, and Lirou of Tomil came more
    than once to contribute about old traditions.
  category: action
  evidence_refs:
  - ev:1
