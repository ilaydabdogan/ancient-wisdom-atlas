canonical_text:
  quote: ''
  summary: The narrator comments on Yap dancing and missionary disapproval, then describes
    a moonlit return home after a night entertainment. A few days later the narrator,
    Fatumak, and boys carrying baskets travel across the island toward Milai to examine
    plants and collect seeds. Along the route they observe villages, stone bridges,
    limestone money-wheels, the remains of Fana-Mouk, the great house and burial place
    of the old chief Tanis, stone platforms, a coral table associated by the narrator
    with an old superstitious observance, cultivated swamp areas, a club house, an
    ancient cemetery with burial platforms, and many trees and plants.
  language: English
  quote_policy: summarized
