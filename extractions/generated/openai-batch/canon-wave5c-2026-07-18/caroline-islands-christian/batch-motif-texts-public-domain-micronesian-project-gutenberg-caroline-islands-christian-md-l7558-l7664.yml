canonical_text:
  quote: Laponga was a High Priest of old in Metalanim.
  summary: The passage first discusses kava and its role in social gatherings where
    traditions are gathered. It then recounts a legend of Laponga, a high priest and
    magician of Metalanim, who first tasted kava and invoked Nan-Ul-Lap. Laponga marries
    a forest nymph while in owl form and has bird-human children. When they embarrass
    him by calling him father, he curses them to lose human speech and form, producing
    bird voices, habitats, omens, and one bird’s vulnerability to stones and cooking.
  language: English, with local terms
  quote_policy: quoted
