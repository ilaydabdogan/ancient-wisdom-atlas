  quote: Tradition assigns their origin to a pupil of the fairy goddess, Le-gerem.
  summary: A travel narrator describes a shallow-water raft excursion near Lai and
    Gerem, observations of coral and marine life, stone fish-dams whose origin is
    attributed by tradition to a pupil of the fairy goddess Le-gerem, collection of
    specimens using Yub root, and a return to a household with several animals.
  language: English
  quote_policy: quoted
