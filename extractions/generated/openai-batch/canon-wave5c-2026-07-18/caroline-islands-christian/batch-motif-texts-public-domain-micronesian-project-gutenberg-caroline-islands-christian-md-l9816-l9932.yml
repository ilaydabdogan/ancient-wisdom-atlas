canonical_text:
  quote: ''
  summary: A first-person observer, guided by Fatumak, attends a night dance in Yap.
    Male dancers and boys perform chants, clapping, body-slapping, stamping, war-cries,
    and animal-mimetic movements by bonfire light. One dance is named after the Galuf
    or Iguana, described as a legendary thief. Fatumak also says some thieves pray
    to the god Luk for help avoiding capture.
  language: English
  quote_policy: summarized
