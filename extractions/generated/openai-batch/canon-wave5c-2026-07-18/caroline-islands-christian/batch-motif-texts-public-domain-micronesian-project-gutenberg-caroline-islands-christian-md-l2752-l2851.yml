canonical_text:
  quote: ''
  summary: The passage is an ethnographic description of Ponapean character, social
    values, reconciliation etiquette, occupations, food preferences and taboos, women's
    work, and marriage customs. It mentions ancestral spirits as enforcing filial
    piety, a reconciliation rite involving a gift and accepted sugar-cane, turtle
    reserved for chiefs, eels avoided as dreadful, and a marriage anointing with coconut
    oil, garland, and feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author characterizes Ponapean people as combining practicality, superstition,
    keen observation, hospitality after trust is gained, and suspicion toward strangers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Reconciliation is described as following an etiquette: a present called katom
    is made, an apology is offered, and the aggrieved party accepts a piece of sugar-cane,
    after which honor is satisfied.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Ponapeans as warriors, navigators, fishermen, carpenters,
    and boat-builders, and says many old men observe stars, weather, winds, and currents.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old age, especially when joined with wisdom or ability, is revered; priests,
    counsellors, healers, diviners, and gatherers of medicinal plants are held in
    high esteem.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lack of filial piety or natural affection is said to bring social stigma and
    the curse of ancestral spirits both here and hereafter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtle is reserved for chiefs, while eels of salt or fresh water are not eaten
    and are held in horror under the name Kamichik, glossed as the Dreadful One.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women are described as making mats, shutters, baskets, thatch bundles, leaf-girdles,
    oils, and cosmetics, and as fetching water, lighting fires, building stone ovens,
    preparing food, and doing household duties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women are said to assist men in outdoor labor when required and to accompany
    husbands and relatives into battle in time of war.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The marriage ceremony described brings the girl into the house, seats her,
    has her future mother-in-law rub coconut oil into her back and shoulders, places
    a flower garland on her head, and ends with a feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that marriage can be ended by consent of either party,
    that most Ponapeans have one wife, that polygamy is a privilege of wealthy and
    powerful chiefs, and that exchange of wives among friends and relations is occasionally
    practiced.
  category: relationship
  evidence_refs:
  - ev:8
