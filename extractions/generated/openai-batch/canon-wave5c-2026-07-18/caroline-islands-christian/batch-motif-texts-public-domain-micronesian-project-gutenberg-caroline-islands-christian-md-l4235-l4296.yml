canonical_text:
  quote: ''
  summary: The narrator recounts arranging departure by a Tahitian trader's boat,
    disputes over payments, a stay at Nantamarui, examination of nearby stonework,
    and then introduces Kubary's conclusions about Nanmatal. The quoted tradition
    says Nanmatal's stone buildings were made by an earlier race, whose last king
    Dziautoloa lived in the stone-town while the people supported him; it also begins
    an account of the stranger Idzikolkol's landings and his learning of Dziautoloa's
    military weakness from a woman.
  language: English
  quote_policy: summarized
