canonical_text:
  quote: ''
  summary: The narrator reports that no local tradition explains the builders of large
    stone works, contrasts them with named Sumatra magic artificers, revisits Nan-Matal
    by night despite a prior prohibition, travels through its canals and ruins, captures
    a sea-snake in shoal water, visits Langar and Santiago, receives supplies, and
    prepares for return travel.
  language: English
  quote_policy: summarized
