canonical_text:
  quote: ''
  summary: 'The passage reports two traditions about the origin of kava: one in which
    Ckerri-chou-lang, called the Little Angel from Heaven, drops a piece to earth
    in pity for humankind, and another in which an old magician brings up the root
    with a magic staff. It then describes a Ponapean kava-making ceremony in a council
    lodge, including ranked seating, pounding the root, adding water, inviting ancestral
    spirits and hall demons, making a drink-offering, offering the bowl to the king,
    etiquette of refusal and partial drinking, and a later experiment with a Samoan
    chili-pepper kava custom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One reported origin tradition says Ckerri-chou-lang, the Little Angel from
    Heaven, dropped a piece down to earth from the Celestial board out of pity for
    mankind and their woes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second reported origin tradition says a mighty magician of old raked up
    the wondrous kava root with his Irar or magic staff and made his memory blessed.
