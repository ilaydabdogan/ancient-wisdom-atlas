  summary: The passage surveys comparative examples from Micronesia and nearby South
    Sea regions. It describes a Marshall Islands war to recapture a fugitive high-ranking
    woman, with a siege, ocean-going canoes, huts, a stronghold, a wall, and a trench,
    and compares some details to Homeric epic. It also discusses Gilbert Islands kingship
    and republican forms, a second Marshall Islands case of a commoner general chosen
    for ability, Pelew institutions including retinue relations, tabu-like protected
    areas, and secret regicide by effigy, plus New Hebrides weregild and a New Guinea
    vendetta comparison.
  language: English
  quote_policy: summarized
