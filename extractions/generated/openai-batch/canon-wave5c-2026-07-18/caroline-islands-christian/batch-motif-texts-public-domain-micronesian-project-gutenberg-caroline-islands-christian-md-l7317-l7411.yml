canonical_text:
  quote: ''
  summary: The passage opens with a storm forcing the party ashore into a palm hut.
    It then describes a feast on Mutok arranged by Nanchau with Wana chiefs so the
    narrator can collect historical facts from old men. Animals are killed for the
    feast, including a dog named Pilot at Chau-Wana's request. Food, wine, tea, preserved
    milk, and kava are served. The feast produces songs, tales, offers of local knowledge,
    and a proposal to exchange old buried shell axes for new steel axes despite fears
    of spirits of the dead. The night ends with singing and Chau-Wana departing by
    canoe.
  language: English
  quote_policy: summarized
