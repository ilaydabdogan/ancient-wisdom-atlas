canonical_text:
  quote: ''
  summary: A travel-narrator describes a Ponapean gathering with food, bright dress,
    kava preparation, lodge hospitality, navigational discussion, and war-songs. Later,
    two messengers summon the old host Au to a dying chiefly female relative; he leaves
    by canoe into storm and night. The travelers then depart, give gifts to Au's wife,
    and later work at Paniau packing shells in heavy rain.
  language: English
  quote_policy: summarized
