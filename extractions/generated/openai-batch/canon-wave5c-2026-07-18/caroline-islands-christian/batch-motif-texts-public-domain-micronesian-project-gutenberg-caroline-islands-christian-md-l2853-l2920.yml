canonical_text:
  quote: ''
  summary: The passage describes Ponapean adoption, matrilineal descent, clan exogamy,
    bride service, tattooing and scarification, the Lekelek mutilation practice, burial
    customs and avoidance of dead ancestors' names, worship of deified ancestors and
    spirits, animal and tree media for spirits, and afterlife places called Packet
    and Pueliko guarded by two female forms. It ends with the narrator's plan to investigate
    the Metalanim Ruins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adoption of children is described as universal and as forming a complicated
    chain of relationships.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Descent is traced through the mother, and members of the same Tipu or clan
    cannot marry one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A wife must be taken from another division, and the suitor serves for his
    wife in the house of his prospective father-in-law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men and women practice tattooing on the arms and lower limbs; women's designs
    include one taken from interlaced coconut fronds, and other designs include circles,
    eight-pointed stars, and crosses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young men inflict knife-gashes and deep burn scars on their breasts and arms
    to show contempt for pain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A practice called Lekelek is described as excision of one testicle, usually
    the right, from young men reaching marriageable age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Ichipau of Metalanim is said to have gone further than the Lekelek practice
    while brooding over a threatened lake of fire and a passage in St John.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The dead are buried with ceremony and solemn funeral orations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: People are described as very unwilling to repeat the name of a dead ancestor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The worship of Am or deified ancestors, together with zoolatry or totemism,
    is presented as the backbone of Ponapean faith.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Villages, valleys, hills, streams, families, clans, tribes, events, and natural
    phenomena are said to have associated spirits, gods, deities, or master-spirits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The swamp, reef, mountain, and inland woods are described as populated by
    many spirits, some beneficent and most malignant.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ani are honored under the guise of a special bird, fish, or tree in which
    they are supposed to reside and with which they are identified; these media are
    called Tan-waar.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Examples of spirit media include the chestnut tree for the god of thunder,
