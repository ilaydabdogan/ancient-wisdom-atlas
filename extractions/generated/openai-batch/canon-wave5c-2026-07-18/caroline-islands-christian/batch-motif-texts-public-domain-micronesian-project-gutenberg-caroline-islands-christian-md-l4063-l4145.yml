canonical_text:
  quote: ''
  summary: The passage describes the north-east angles of Nan-Tauach, including masonry,
    canals, and a large Aio or banyan tree whose roots are damaging the wall. The
    narrator’s party explores the terrace and receives help from Spanish visitors.
    The next morning, messengers from King Paul summon the visitors after fishermen
    report jungle clearing at Nan-Matal. The passage reports a tradition that spirits
    of slaughtered Builders entered trees growing where a great battle was fought,
    notes similar reports at Metalanim and sacred groves in Timor, and describes King
    Paul interpreting the visitors’ find as hidden gold or silver before Theodoro
    and Chetan flee.
  language: English
  quote_policy: summarized
