canonical_text:
  quote: ''
  summary: The passage gives philological and ethnographic notes on Caroline Islands
    terms for stone, knife, iron, steel, and cutting implements. It describes older
    Ponapean knives made of bamboo or shell, proposed memories of metal weapons introduced
    by settlers or pirate-voyagers, substitution of shell or basalt where iron was
    unavailable, the term Parang for knife and iron, and Ponapean sling use, including
    local interest in the biblical David and Goliath duel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author compares the word Chila with Motu Ila, Sanskrit Shila, Latin Silex,
    Garo Sil, and a root Sil associated with piercing or cutting in Ural-Altaic tongues.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Metalanim word kapit is given as a word for knife and is compared with
    words from the Bismarck Archipelago, the Philippines, and Sulu associated with
    iron, a short sword, or a sword.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before traders brought machetes and large knives, Ponapeans made kapit from
    split bamboo; shell knives were called Lopuk and were used for slicing fish or
    bread-fruit.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Yap people still use shell cutting things called Yar-ni-matsif,
    and it notes related words for shell-knife in the Central and Western Carolines
    and Southern Philippines.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Kiti and Not are said to have adopted the English-derived word
    Naip for knives rather than a Spanish-derived term.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Names for iron in Ponape, the Marshall Islands, Kusaie, Mortlocks, Ruk, Nuku-Oro,
    Kap-en-Marangi, Yap, and German New Guinea are compared with Malay and several
    Eurasian terms for iron, steel, bronze, copper, sword, or metal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage notes Tinneh words denoting knife and compares Marianne, Uleai,
    Uluthi, and Satanal terms for iron with Sanskrit, Ahom, Khamti, Lao, Siamese,
    and Ponapean roots associated with iron or cutting.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that basaltic or coral lands of the Pacific produce no
    iron and that steel is therefore unobtainable locally.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author proposes that early Caroline settlers brought iron or steel weapons,
    or acquired them from stray pirates, and that traditional names remained after
    those weapons rusted or broke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Where metal could not be replaced, the passage says people used available
    materials: Tridacna shell on low coral islets and black basalt stone on high basaltic
    lands.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author reports that blackstone axes were formerly common in Samoa and
    Fiji, but that he encountered no blackstone axes in Ponape.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Malay word Parang is said to be used in the Central Carolines for both
    knife and iron, and the author interprets its survival as connected with apprehension
    of foreign short swords or bill-hooks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pai is identified as a sling and Pai-uet as a sling-stone; the sling-stone
    is described as the favorite Ponapean missile weapon before firearms.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Ponapean sling is described as plaited from Hibiscus bark strips, cinnet-fibre,
    or Nin-tree bark fibre.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage says the David and Goliath duel is especially favored among Ponapeans
    because the incidents accord with native fashion, and that David, rendered Tepit,
    is a common name among Protestant people on the south-west coast.
  category: relationship
  evidence_refs:
  - ev:8
