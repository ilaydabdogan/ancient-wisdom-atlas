canonical_text:
  quote: ''
  summary: A first-person traveler and the King make a coastal excursion from Lele.
    They meet Li-kiak-sa tending sweet potatoes and complaining of rats, travel by
    beach and canoe to Puia, visit a waterfall associated with the joint death of
    two defeated young chiefs, observe marsh wildlife including a robber crab, and
    enter a dark cavern with bats, guano, and an inky pool.
  language: English
  quote_policy: summarized
