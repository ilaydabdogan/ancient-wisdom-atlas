canonical_text:
  quote: ''
  summary: 'The narrator describes excavating ancient burial places on Ponape: vaults,
    basalt slabs, stone enclosures, bone fragments, stone tools, shell ornaments,
    and overgrown forest settings. The passage also records native dread of skink
    lizards called Kieil, mentions a place called the Valley of the Dwarfs, describes
    possible tombs of two ancient heroes, and compares the antiquity of the stone
    relics to dolmen, kistvaen, and kjoekkenmodding.'
  language: English
