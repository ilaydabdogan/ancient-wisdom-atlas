canonical_text:
  quote: ''
  summary: The passage catalogs Ponapean household and craft implements, including
    husking-sticks, looms, brooms, storage boxes, carpentry and canoe-building tools,
    needles, hackles, shell adzes, and gouges. It describes local plant, shell, and
    lagoon resources, imported metal replacements, fire-assisted tree felling, and
    elite festival display of adzes, with several linguistic or functional comparisons
    to other traditions.
  language: English with Ponapean and comparative lexical terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ak husking-stick is described as a mangrove-wood stake, pointed at both
    ends, driven into the ground, and used to tear off the fibrous outer envelope
    of coconuts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same wood is used for digging or planting sticks, and longer pieces are
    used as poles for punting canoes in shallow lagoon areas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ponapeans formerly used a loom called Tantar to weave banana fibre and
    Nin tree bark into narrow girdles and women's petticoats; the loom is described
    as long out of use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A housewife is described as keeping several Kap-en-nok brooms made from central
    ribs of coconut leaflets to sweep rubbish and keep mats clean.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person of distinction is said generally to have a large sea-chest or a smaller
    camphor-wood box for storing possessions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person engaged in carpentering may keep a cross-cut saw or a grindstone.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The boat-builder is said to prefer a modern steel gimlet to an older sharp-pointed
    Murex shell borer formerly used for piercing boards and planks in canoe and house-building.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before introduced nails, holes were bored and fastenings were made with cinnet,
    wooden trenails, or bolts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Tikak, a bone or shell needle, was used to sew palm-leaf thatch, pandanus
    sleeping mats, and ancient pandanus mat-sails.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Pandanus leaves for mat-sails underwent preliminary steaming in an earth-oven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ponapean housewives used a fine tortoiseshell hackle called Mera to comb banana-sucker
    fibre for belts decorated with pink and white shell-beads.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that Ponapeans used economic plants and lagoon and reef
    resources to provide food, shelter, and clothing.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The general Ponapean term for axe, adze, or hatchet-type instruments is given
    as Chila, with district variants Ki and Patkut.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Chila implements are described as made from the central shaft of Tridacna
    Gigas, the Giant Clam, worn into shape by careful rubbing.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Imported steel adzes, American axes, and tomahawks are said to be displacing
    the older shell implements.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: In earlier tree-felling, Ponapeans used primitive implements together with
    fire, chipping away a charred layer and then applying fire again.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: At great festivals, grandees sat in state with adzes crooked over their shoulders.
  category: action
  evidence_refs:
