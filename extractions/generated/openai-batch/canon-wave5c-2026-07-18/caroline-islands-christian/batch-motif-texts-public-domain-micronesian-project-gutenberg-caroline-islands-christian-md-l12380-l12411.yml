canonical_text:
  quote: ''
  summary: The passage recounts an origin story in which people in Yap have yam and
    taro but no fire for cooking, suffer from their uncooked food, and appeal to Yalafath.
    A fiery thunderbolt strikes a Choi tree, trapping Dessra the Thunder god in its
    trunk. Guaretin, a woman sunbaking taro nearby, helps him. In return, Dessra forms
    a clay cooking pot and places fire-sparks into Arr-tree sticks, explaining the
    origin of fire-making by wood friction and pottery in Yap. The passage ends with
    two moral proverbs about helping those in need and hidden fire.
  language: English
  quote_policy: summarized
