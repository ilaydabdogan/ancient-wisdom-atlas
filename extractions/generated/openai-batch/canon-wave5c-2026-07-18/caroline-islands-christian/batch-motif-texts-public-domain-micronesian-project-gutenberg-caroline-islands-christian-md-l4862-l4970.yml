canonical_text:
  quote: ''
  summary: Ethnographic description of Ponapean dress, ornaments, dance adornments,
    hats, and textile materials, including distinctions between work dress, festival
    dress, chiefly regalia, women’s clothing, and plant-fibre manufacture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces a description of Ponapean domestic economy, clothing,
    weapons, and dwellings after prior excursions around Ponape.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men’s work dress is described as a narrow girdle called Uaiuai-loi, made from
    woven banana or Nin-tree fibre, sometimes dyed yellow, and worn around the waist
    and between the thighs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Festival or leisure dress for men is described as the Kol or Mol, a kilt made
    from split young coconut leaflets that are steamed, soaked, scraped, and often
    dyed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old women are described as sometimes crimping and creasing each frond of the
    Kol into wavy lines, producing a Kol-Ikoch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chiefs and men of note are described as formerly wearing elaborately woven
    banana-fibre belts strung with rows of pink, white, and grey shell beads.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A common man putting on a chief’s belt is described as a serious offence in
    Ponape, with the passage comparing this to a Hawaiian rule carrying a death penalty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Carved and plain shell bracelets are described as fashionable, and a wise
    woman named Kamai is said to have invented them; turtle-shell ear-rings were also
    sometimes worn.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women’s dress is described as a wide deep girdle called Li-kau or Li-kau-tei,
    woven from Nin bark and hanging to the knees; paper-mulberry cloth is said not
    to have been known to the Ponapeans.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shell and flower necklaces, Gardenia and Cananga garlands, and wreaths of
    fern, herbs, and grasses are described as used ornaments.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Male and female dancers are described as wearing leaf fillets and winding
    coconut leaflets around their fingers so that the tips quiver and produce a rattling
    or whirring effect in choruses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pandanus-leaf hats with helmet form and projecting peaks are described as
    used by fishermen on the reef, with related names given for Ponape, Kusaie, and
    Yap.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage lists textile materials including inner banana fibre, Nin bark,
    Kalau bark used for string and nets, and coconut fibre from husks sunk near the
    high-water mark.
  category: object
  evidence_refs:
  - ev:9
