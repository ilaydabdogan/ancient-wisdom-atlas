  quote: ''
  summary: The narrator recounts a confrontation with the Ichipau of Metalanim over
    archaeological work at Nan-Tauach, subsequent measurements and photography around
    the canals, reports of a poisonous fish gift from King Paul, observations of armed
    sailors, native canoes, and possible spies, and later interactions with local
    people who associate chemical smells with demoniac powers and a Lake of Fire and
    Brimstone.
