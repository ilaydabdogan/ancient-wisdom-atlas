canonical_text:
  quote: ''
  summary: 'The passage describes archaeological features and place-names in the Nan-Matal/Nan-Moluchai
    area: an underground chamber or tomb with basalt roofing and relics; vegetation
    and fishing poison; a crescent basalt slab possibly used as a bell in sacred ceremonies;
    sea-walls, walled islets, canals, and sanctuaries; and local explanations of names,
    including an etiological note that demi-gods Olosipa and Olosopa, aided by workers,
    constructed the breakwater and walled islets.'
