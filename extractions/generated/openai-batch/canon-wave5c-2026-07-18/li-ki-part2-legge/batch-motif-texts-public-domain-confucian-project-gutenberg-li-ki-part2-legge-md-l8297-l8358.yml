canonical_text:
  quote: ''
  summary: 'The passage states criteria from the sage kings'' institutes for admitting
    persons or things into the sacrificial canon: sacrifice is owed to those who gave
    laws, died in duty, strengthened the state, met calamities, or warded off evils.
    It then lists ancient rulers, ministers, culture-givers, flood figures, and liberating
    kings whose services benefited the people. It also includes celestial bodies and
    terrestrial features that guide or provide materials for the people.'
  language: English
  quote_policy: summarized
