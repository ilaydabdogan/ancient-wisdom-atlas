canonical_text:
  quote: ''
  summary: The passage presents sayings of the Master on fortitude, the ethical Way
    or Path, equilibrium and harmony, the limits of sage knowledge, the nearness of
    moral reciprocity, and sincerity in aligning words with practice. It contrasts
    southern forbearance with northern martial bravery, uses Book of Poetry images
    of hawk, fish, and axe-shaft as illustrations, and lists reciprocal standards
    in family, political, and friendship relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 3ze-l0’ asks the Master about fortitude.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master distinguishes between the fortitude of the South, the fortitude
    of the North, and the questioner’s own fortitude.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fortitude of the South is described as forbearance and gentleness in teaching
    others and not returning conduct contrary to the right path; the good man studies
    it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bravery of the North is described as lying under arms and dying without
    regret; the bold study it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The superior man cultivates friendly harmony without weakness, stands erect
    in the middle without inclining to either side, and would die rather than change
    if bad ways prevail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Master says he does not search for mysterious things or practise marvellous
    arts in order to be honoured in future ages.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A good man is described as trying to proceed according to the right path but
    abandoning it halfway; the speaker says he is not able so to stop.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The superior man who acts according to equilibrium and harmony may be unknown
    and unregarded by the world without regret; only the sage is said to be able to
    do this.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Way of the superior man is described as reaching far and wide while remaining
    secret; common men and women may know and practise it, while even the sage does
    not know or attain its utmost reaches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Heaven and earth are called great, yet people still find things in their action
    with which to be dissatisfied.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: If the Way is spoken of in its greatness, nothing in the world can contain
    it; if spoken of in its smallness, nothing in the world can divide it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: A Book of Poetry couplet about a hawk flying up to heaven and fishes springing
    in the deep is used to say that the Way is seen above and below.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Master says the path is not far from man, and that a path far from what
    human nature suggests should not be considered the Path.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: 'A Book of Poetry axe-shaft image is used: one grasps an axe-handle to hew
    another, but may still consider the pattern far off if looking askance.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The superior man governs people according to their humanity and stops when
    they change what is wrong; reciprocity is expressed as not doing to others what
    one dislikes when done to oneself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: 'The speaker lists four reciprocal standards he has not attained: serving
    father as he would require a son to serve him, serving ruler as he would require
    a minister to serve him, serving elder brother as he would require a younger brother
    to serve him, and setting an example for a friend.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: The superior man’s words have respect to his practice, and his practice has
    respect to his words; the passage connects this with perfect sincerity.
  category: attribute
  evidence_refs:
  - ev:8
