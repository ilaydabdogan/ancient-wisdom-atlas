canonical_text:
  quote: ''
  summary: 'The passage prescribes ritual actions for mourners who arrive for mourning
    rites at different times or cannot attend: wailing, tying up hair, baring arms,
    leaping, wearing cinctures or mourning garments, bowing to visitors, escorting
    them, going to stations, gates, sheds, houses, or graves, and ending observances
    after prescribed wailings. It also distinguishes rites for father, mother, and
    more distant relations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mourner entering the house enters by the left side of the door, faces north,
    wails, ties up his hair, bares his arms, and performs leaping.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the east station, the mourner bows to visitors, performs leaping, and the
    presiding mourner bows to and escorts visitors when they leave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Principal mourners and cousins go out to the gate, wail, stop, and are instructed
    by directors to go to the shed; subsequent wailings and completion of mourning
    dress follow a prescribed schedule.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rites for a mother differ from rites for a father in having only one tying
    up of the hair and then wearing the cincture until the end of the business.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A mourner who does not arrive while the coffin is in the house first goes
    to the grave, faces west, wails, puts on the cincture and hempen sash, and joins
    the presiding mourner at the east station.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After returning to the house, the late mourner puts on a cap, enters by the
    left side of the door, faces north, wails, puts on the cincture, bares his arms,
    performs leaping, and later completes mourning-garb on the third day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When attendance is impossible, the mourner wails where he is, asks the particulars,
    makes a mourning place, ties up his hair, bares his arms, performs leaping, wears
    cincture and sash, bows to visitors, and escorts them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person returning after the mourning rites have been completed goes to the
    grave, wails and leaps there, performs further gestures east of the grave, escorts
    visitors, and does not wail in the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: For mourning away from home for a less closely related relative, the mourner
    goes to a station, wails, puts on head cincture and girdle on the east, bares
    his arms, leaps, bows to visitors, and follows directions until the business is
    announced ended.
  category: sequence
  evidence_refs:
  - ev:9
