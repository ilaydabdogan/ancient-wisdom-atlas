canonical_text:
  quote: ''
  summary: 'The passage presents teachings on filial piety: serving and reverencing
    parents, preserving their reputation after death, treating filial piety as a universal
    moral law, observing proper seasons in taking trees and animals, sacrificing to
    dead parents, preserving the body received from parents, avoiding perilous actions
    and harmful speech, and honoring age in dynastic and court practice.'
  language: English
  quote_policy: summarized
