- id: obs:4
  text: Trees are to be felled and animals killed only at proper seasons; the Master
    says doing either out of season is contrary to filial piety.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Three degrees of filial piety are listed: using one''s strength in service,
