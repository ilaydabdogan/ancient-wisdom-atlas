canonical_text:
  quote: ''
  summary: The passage gives rules for ranked tablets and carriage coverings, a gentleman's
    seating, sleep direction, response to storms, washing and bathing, preparation
    before going to the ruler, ranked tablet forms, mat etiquette, conduct while eating
    before a ruler, treatment of offerings, and the ritual sequence for receiving
    a cup from the ruler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ruler's tablet is described as ivory, while an officer's tablet is described
    as bamboo tipped with ivory.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editorial note states that the methods of a referenced divination are lost.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ruler's front cross-board is covered with lambskin edged with tiger fur,
    while Great officers and ordinary officers have specified carriage coverings of
    deer skin edged with leopard fur.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A gentleman's regular place is opposite the door; he sleeps with his head
    to the east and, during violent wind, rapid thunder, or great rain, rises, dresses,
    puts on his cap, and sits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The gentleman washes his hands five times daily, uses specified waters and
    combs for grooming, and follows a detailed bathing sequence with towels, mats,
    hot water, robe, shoes, and a drink.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before going to the ruler, the gentleman spends the night in vigil and fasting
    outside his usual apartment, washes and bathes, receives an ivory tablet from
    his secretary, practises deportment, listens to the girdle gems, bows in his private
    court, and mounts his carriage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Son of Heaven, feudal lords, and Great officers each have distinct tablets
    whose forms are explicitly said to show correct relations or readiness to give
    place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A minister in attendance on his ruler occupies a mat somewhat behind and to
    one side, and further rules govern how one approaches, occupies, and uses a mat
    while reading or eating.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When food is given and the ruler treats the recipient as a guest, the visitor
    presents an offering, eats and drinks in a prescribed order, and waits in relation
    to the ruler's eating.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When ordered to partake of delicacies, the visitor takes from the nearest
    items first, waits for specified cues from the ruler before adding liquid to rice,
    repeats a rice-eating process three times after the ruler finishes, and gives
    remaining rice and sauces to attendants.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that one should not eat largely when pressed by a host
    and should not eat to satiety at another's; water and sauces are not set down
    as offerings because they are treated as trivial.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: When the ruler gives a cup to an officer, the officer crosses from his mat,
    bows twice, lays his head to the ground, receives the cup, pours out a portion
    as an offering, drinks, waits, and returns the empty cup after the ruler has finished.
  category: sequence
  evidence_refs:
  - ev:12
