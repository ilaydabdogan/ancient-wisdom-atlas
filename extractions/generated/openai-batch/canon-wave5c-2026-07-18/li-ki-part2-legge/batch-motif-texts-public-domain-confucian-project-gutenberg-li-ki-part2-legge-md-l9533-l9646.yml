canonical_text:
  quote: ''
  summary: The passage describes sacrificial dances led by rulers and feudal princes
    before the personator of the dead; identifies libation, hall singing, and pantomimic
    representation of king Wd's army as especially important sacrificial elements;
    explains the ranked eating and removal of sacrificial leavings; and interprets
    sacrifice as a model for government, favors descending through ranks, honoring
    rulers and elders, and filial duty.
  language: English translation
