canonical_text:
  quote: ''
  summary: The passage gives ritual prescriptions concerning tortoise-shell divination
    for burial and the sacrifice of Repose, the use of staffs, preparation of the
    corpse, grave-clothes and offerings, forms of mourning conduct, receipt and sending
    of gifts, duration and conclusion of mourning periods, condolence visits, and
    assistance at burial according to rank, age, kinship, and social closeness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Consulting the tortoise-shell for burial and the sacrifice of Repose used
    different petition styles according to the petitioner’s kin relationship to the
    deceased.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that anciently both noble and mean carried staffs, and that
    a later rule restricted staff-carrying to men of rank after Shû-sun Wû-shû saw
    a wheelwright use a staff to turn a wheel by its nave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The custom of making a hole in the napkin over the dead person’s face for
    introducing what was put into the mouth is attributed to Kung-yang Kiâ.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Grave-clothes are described as meant to cover the body, with enshrouding preceding
    the grave-clothes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zang-3ze explains wrapping up remains of offerings to the dead by comparison
    with sending leftover food from a great feast to guests’ lodgings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that treating parents as honoured guests in this way is
    an expression of grief for their loss.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: During three years’ mourning, wine or flesh sent to the mourner is received
    after three refusals; if sent by the ruler with a message, it is not refused and
    is presented in the ancestral temple.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person in three years’ mourning does not send gifts, while a person mourning
    for a shorter period may send gifts after the wailing is concluded.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hsien-3ze compares the pain of three years’ mourning to beheading and the
    pain of one year’s mourning to a stab from a sharp weapon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In one year’s mourning, lien silk is put on in the eleventh month; the hsiang
    and than sacrifices occur in the thirteenth month and conclude the mourning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Condolence conduct varies by mourning duration, burial status, and relationship
    to the mourner, including whether a visitor retires after wailing, waits for further
