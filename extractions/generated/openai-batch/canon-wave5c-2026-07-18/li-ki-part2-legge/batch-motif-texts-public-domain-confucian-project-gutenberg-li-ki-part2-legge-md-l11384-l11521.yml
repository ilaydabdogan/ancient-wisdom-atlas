canonical_text:
  quote: ''
  summary: The Master explains how court respect for the old, ancestral sacrifices,
    sacrificial hospitality, fasting and vigil, the personator of the dead, graded
    liquors and cups, kindred assemblies, and detailed funeral and mourning rites
    teach filial duty, reverence, moderation, hierarchy, harmony, ritual distance,
    and social restraint. He notes that these rites are meant to guard the people,
    though people may still forget parents, seek profit, neglect burials, or violate
    filial order.
  language: English
  quote_policy: summarized
