canonical_text:
  quote: ''
  summary: 'The passage describes mourning and condolence protocols after coffining:
    how a ruler, the ruler’s wife, and a Great officer visit mourners; how offerings,
    bows, leaping gestures, escorts, and seating positions are arranged; and how coffins,
    bier coverings, bodily remnants, and food offerings differ by social rank.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the ruler visits after coffining, he sends notice beforehand; the chief
    mourner prepares offerings and waits outside the gate until the horses’ heads
    are visible, then leads the way in by the right side of the gate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the gate, the exorcist remains outside while the blesser precedes the ruler;
    the ruler places vegetable offerings inside the gate for the spirit of the gate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The blesser precedes the ruler up the eastern steps; the ruler stands at the
    top with spear-bearing attendants before and behind him, while the chief mourner
    bows with forehead to the ground, the ruler speaks and leaps, and the chief mourner
    also leaps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the visit is to a Great officer, the offerings may be put down by the coffin
    at that point; if to a common officer, the procedure includes waiting outside
    the gate, being requested to return, setting down the offerings, and later escorting
    the ruler out with a forehead-to-ground bow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ruler inquires three times when a Great officer is ill and visits three
    times after coffining; for a common officer he inquires once and visits once.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the ruler’s wife comes to condole, the chief mourner meets her outside
    the gate and precedes her in; she enters and takes her place in the hall, while
    the wife presiding descends by the western steps and bows with her head to the
    ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ruler’s wife looks toward her eldest son and leaps; her offerings follow
    the rules used for the ruler’s visit, and she is escorted out by the wife presiding
    and the chief mourner according to different stopping points and bows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a Great officer attends the mourning rites of one of his own officers,
    the officer does not meet him outside the gate; the Great officer takes a place
    below the hall, the chief mourner faces north, and the wife takes her place in
    the room.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: If messages or visitors from higher or neighboring authorities arrive during
    this rite, the Great officer-ruler performs ceremonial bows to each visitor with
    the chief mourner behind him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a ruler on a condolence visit sees the bier for the corpse, he leaps;
    if he came without prior notice and offerings were not prepared, the offerings
    are put down after he withdraws.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coffin thickness, silk lining color, nail material, varnishing, wedges, and
    bands are specified differently for rulers, Great officers of different grades,
    and common officers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The accumulated hair and nails of a ruler and Great officer are placed in
    bags at the four corners of the coffin, while those of an officer are buried without
    being put in the coffin.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ruler’s coffin is set on a bier surrounded by high stakes and plastered
    to resemble a house; Great officer and common officer coffins are covered or plastered
    differently, and all are screened.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Scorched grain offerings by the coffin differ by rank in number of baskets
    and kinds of grain; dried fish and flesh are also included.
  category: object
  evidence_refs:
  - ev:10
