candidate_motifs:
- id: motif:1
  label: Formal condolence visit by ruler
  taxonomy_refs: []
  basis: The passage gives a structured sequence for a ruler’s mourning visit, including
    announcement, gate reception, ritual officers, placement of offerings, speech,
    leaping, and escorted departure.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: This is a ritual-procedural motif rather than a narrative mythic episode.
- id: motif:2
  label: Funerary and threshold offerings
  taxonomy_refs:
  - sacred_exchange
  basis: Offerings are prepared for the dead, vegetable offerings are placed for the
    spirit of the gate, and grain, fish, and flesh are set by the coffin according
    to rank.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes ritual placement
    of offerings but does not state an explicit reciprocal exchange.
- id: motif:3
  label: Rank-differentiated mourning rites
  taxonomy_refs: []
  basis: Numbers of illness inquiries and condolence visits, coffin construction,
    bodily-remnant placement, and food offerings vary by ruler, Great officer, and
    common officer status.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage presents normative rank distinctions, not a story about rank
    acquisition.
- id: motif:4
  label: Ritual leap in mourning
  taxonomy_refs: []
  basis: Leaping is performed by the ruler, chief mourner, and ruler’s wife, and the
    ruler leaps when seeing the bier for the corpse.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not explain the emotional or symbolic meaning of the
    leap.
- id: motif:5
  label: Coffin enclosure resembling a house
  taxonomy_refs: []
  basis: The ruler’s coffin on a bier is surrounded with stakes and plastered until
    it has the appearance of a house.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Only the ruler’s coffin is explicitly said to have the appearance of a
    house; no afterlife dwelling interpretation is stated.
- id: motif:6
  label: Disposition of bodily remnants with or apart from coffin
  taxonomy_refs: []
  basis: Hair and nails of rulers and Great officers are placed in bags at the four
    corners of the coffin, while those of an officer are buried without being put
    in the coffin.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the placement rule but no stated rationale.
- id: motif:7
  label: Household and gendered condolence protocol
  taxonomy_refs: []
  basis: The ruler’s wife follows a parallel but distinct condolence sequence involving
    the wife presiding, the eldest son, prescribed bows, offerings, and escort limits.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage is prescriptive and does not generalize beyond the described
    roles.
