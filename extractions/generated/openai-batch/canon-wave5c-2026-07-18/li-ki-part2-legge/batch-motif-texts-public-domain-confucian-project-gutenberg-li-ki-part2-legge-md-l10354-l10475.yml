canonical_text:
  quote: ''
  summary: A duke questions whether the bridegroom personally meeting the bride makes
    the marriage ceremony too great. Confucius answers that marriage unites two surnames,
    continues posterity, supplies those who preside over sacrifices, and is grounded
    in the united action of heaven and earth. He further teaches that marriage rites
    regulate ancestral, court, and governmental order; that rulers should respect
    wife, son, and self; and that proper conduct by those above models speech and
    action for the people.
  language: English
  quote_policy: summarized
