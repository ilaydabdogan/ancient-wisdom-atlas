  quote: ''
  summary: 'The passage catalogs ritual and ceremonial precedents associated with
    the dukes of Lu and with older dynastic traditions: temples maintained like royal
    temples, schools, royal articles and weapons, musical instruments and stands,
    sacrificial vessels and offerings, ritual liquids, official numbers, and funeral
    ornaments. It also contains editorial notes about uncertain identifications of
    ancient instruments and mythic attributions.'
