canonical_text:
  quote: ''
  summary: 'The passage gives detailed prescriptions for mourning rites: the slighter
    and greater dressings of the corpse, the handling and ranking of garments and
    body cases, the personnel and spatial positions during dressing, gestures of wailing,
    leaning, leaping, and laying-on of the hand, and differences between rites for
    a ruler, a Great officer, and a common officer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the slighter dressing, a ruler, Great officer, and common officer use wadded
    upper robes and sheets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the greater dressing, the number of sacrificial and other robes is not
    fixed; the ruler's upper robes and sheets have only a thin lining, while those
    for Great officers and common officers remain as at the slighter dressing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Clothes are taken from chests, contributed clothes are placed in similar chests,
    and movement up and down the hall uses the west steps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clothes are displayed without rumpling and incorrect items or garments of
    specified coarse or fine fibres are not admitted.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those dressing the corpse bare their arms; those moving it into the coffin
    cover their breasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The personnel responsible for dressing the corpse differ by rank: the Great
    officer of prayer performs or supervises in higher-rank rites, while other officers
    perform the dressing for a common officer.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At both dressings, sacrificial robes are not placed below the others, lapels
    are arranged to lie on the left side, and bands are tied firmly rather than in
    a bow-knot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dressers wail after completing their work, and in all cases there are
    six dressers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Body cases before dressing vary by rank in color, decoration, and number
    of side strings: seven for a ruler, five for a Great officer, and three for a
    common officer.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the greater dressing of a ruler, the son, ministers, Great officers, male
    relatives, wives, female relations, inferior officers, officers of prayer, and
    other officers occupy prescribed places and perform prescribed tasks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the ruler's rite, the corpse is lifted and moved to the place for dressing;
    after completion, the superintendent announces it, and the son and his wife lean
    toward the body and leap.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the greater dressing of a Great officer, the ruler arrives, is met by the
    principal mourner, puts down vegetables as an offering to the spirit of the gate,
    and enters after a blesser while the exorcist stops outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the Great officer's dressing is completed, the ruler lays a soothing
    hand on the presiding mourner, directs him to go up and lean on the body, and
    requests the presiding wife to lean on it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the mourning rites for a common officer, the ruler is not present; otherwise
    the observances follow those for a Great officer.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: 'Leaping occurs at multiple ritual stages: spreading ties and strings, spreading
    the sheet and clothes, moving the corpse, putting on clothes and coverlet, and
    adjusting ties and bands.'
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A ruler lays his hand on the body of a Great officer and certain honourable
