canonical_text:
  quote: ''
  summary: The passage first describes how bold, strong men can support political
    order when their abilities are directed toward propriety, righteousness, and military
    victory, but become sources of disorder when directed toward contention. It then
    presents 3ze-kung asking Confucius why the superior man values jade above soapstone.
    Confucius answers that jade is esteemed not for rarity but because its qualities
    resemble virtues and cosmic or social excellences, and he cites an ode comparing
    a lord to rich jade.
  language: English
