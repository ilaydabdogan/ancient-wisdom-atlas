literal_observations:
- id: obs:1
  text: The king or ruler walks quickly to one musical piece and more quickly back
    to another; his turns are prescribed as a complete circle or a right angle, and
    his posture and movement make the jade pieces tinkle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of rank hears the harmonious sounds of carriage bells while riding and
    pendant jade-stones while walking, and the passage states that evil and depraved
    thoughts thereby find no entrance into his mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the ruler is present, the ruler’s son and heir does not wear the jade-stone
    pendant freely, but ties it on the left of his girdle and leaves the useful pendant
    on the right free; seated at ease he wears the jade pendant, but in court he ties
    it up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In fasting and vigil, the pendant is worn with the strings turned round and
    fastened at the girdle, and purple knee-covers are worn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: All wear the jade-stone pendant at the girdle except during mourning rites;
    it includes a tooth-like piece that collides with the others, and a man of rank
    is not without it except for sufficient reason.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pieces of jade are explicitly said to be emblematic of the virtues that
    a man of rank should cultivate.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Different ranks have pendants made of different jade or jade-like beads on
    different colored strings, while Confucius is described as wearing ivory balls
    on gray strings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A lad’s dress is prescribed as black linen with embroidered red edging and
    strings; he also has restrictions on furs, silk, shoe ornaments, mourning, receiving
    orders, standing in mourning rites, and visiting a teacher.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At meals with someone older or of higher rank, one is last to put down the
    offering and first to taste the food; host and guest exchange apologies or actions
    concerning offerings, viands, pickle, and dish removal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When eating certain fruits, stones are not cast on the ground; the first slice
    of a melon is put down as an offering; fruits and cooked viands are eaten in different
    order relative to a man of rank.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At meetings of rejoicing, people do not congratulate one another unless there
    is a gift from the ruler; the passage notes that the corresponding statement about
    sorrow is incomplete.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When Confucius eats with the head of the Ai family, he does not decline anything
    and finishes the rice and liquid added to it without eating any flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a ruler gives an officer a carriage and horses, the officer uses them
    to go and give thanks; when the ruler gives clothes, the officer wears them for
    that occasion; a commissioner from the king does not use such gifts until ordered
    by his own ruler.
  category: sequence
  evidence_refs:
  - ev:8
