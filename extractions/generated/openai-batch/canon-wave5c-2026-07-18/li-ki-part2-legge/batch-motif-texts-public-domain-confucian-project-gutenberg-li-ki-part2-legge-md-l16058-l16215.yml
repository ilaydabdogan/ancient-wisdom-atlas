canonical_text:
  quote: Things have their root and their branches; affairs have their end and their
    beginning.
  summary: The passage presents the Great Learning as instruction in illustrious virtue,
    care for the people, and resting in highest excellence. It gives a sequence from
    investigation of things and extension of knowledge to sincere thoughts, rectified
    hearts, cultivated persons, regulated families, governed states, and a tranquil
    kingdom. It also teaches solitary self-watchfulness, quotes 3ang-3ze on many eyes
    and hands, and cites the Book of Poetry for images of refined virtue and remembered
    former kings.
  language: English
  quote_policy: quoted
