literal_observations:
- id: obs:1
  text: The superior man is described as doing what is proper to his current position,
    whether high or low, wealthy or poor, among foreign tribes, or in sorrow and difficulty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The superior man rectifies himself, does not seek from others, does not murmur
    against Heaven, does not fault men, and waits quietly for Heaven's appointments;
    the mean man takes risks while looking for luck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An archer who misses the centre of the target turns back and seeks the cause
    of failure in himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The way of the superior man is compared to travelling far by first crossing
    what is near and to ascending a height by beginning from lower ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited poem praises love between children and wife, accord among brothers,
    and ordering the home; the Master then comments on parents' complacency in such
    a state.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spiritual Beings are described as powerful, unseen, unheard, entering all
    things, and present in relation to sacrifices.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: People under Heaven fast, purify themselves, and dress richly to attend sacrifices;
    the Spirits are compared to overflowing water above and around the worshippers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shun is described as greatly filial, sage-like in virtue, possessing the dignity
    of the son of Heaven, having riches within the four seas, receiving ancestral
    temple offerings, and having descendants preserve offerings to him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Heaven is said to produce things and to be bountiful according to their qualities,
    nourishing the flourishing tree and overthrowing the tree ready to fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person of great virtue is said to be sure to receive the appointment of
    Heaven.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: King Wan is described as without cause for grief because his father laid foundations
    for his dignity and his son transmitted it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says that king Wd continued the line and enterprise of earlier
    kings, buckled on armour, obtained all under Heaven, kept an illustrious name,
    and received ancestral temple offerings preserved by descendants.
  category: sequence
  evidence_refs:
  - ev:6
