canonical_text:
  quote: ''
  summary: 'The Master teaches that love of virtue should resemble love of beauty,
    warns rulers against seeking beauty among subordinate families, and presents ritual
    restraints on male-female contact as safeguards against licentiousness and kinship
    disorder. He also describes marriage procedure: the son-in-law personally meets
    the bride, her parents present her to him, and this procedure is likened to raising
    a dyke for the people, though some brides or wives still do not go as expected.'
  language: English translation
  quote_policy: summarized
