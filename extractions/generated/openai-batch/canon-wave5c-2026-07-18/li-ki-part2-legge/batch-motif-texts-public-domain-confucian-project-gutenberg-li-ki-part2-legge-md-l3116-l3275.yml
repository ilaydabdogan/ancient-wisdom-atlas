literal_observations:
- id: obs:1
  text: A woman seated as personatrix of her husband’s deceased grandmother made a
    curtsy rather than bowing with her head to her hands; when presiding at mourning
    rites, she did not make the lowered-to-ground bow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sacrifice of repose, her head-band was of dolychos cloth and her
    girdle was hempen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An empty vessel was carried as carefully as a full one, and an empty apartment
    was entered reverently as if people were inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sacrifices in the apartment or hall, feet were not bare; at a feast, bare
    feet were permitted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A new crop was not eaten until a portion had been offered in the temple.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In chariot etiquette, the charioteer handed the strap when the gentleman mounted
    or descended, bowed toward the cross-bar when first mounting, and returned to
    stand by the carriage when the gentleman walked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Attendant carriage riders bowed forward to the bar on trips to court or temple,
    but not on trips to battle or hunt; the number of attendant carriages differed
    by rank.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When presenting spirits, dried meat, a dog, flesh, or birds, the messenger
    carried only specified representative items in hand while announcing the complete
    gift.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A dog was held by a rope, an ox by a tether, and a horse by a bridle; animals
    were kept on the right of the leader, while a prisoner or captive being presented
    was kept on the left.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When presenting a carriage, coat of mail, vessel, bow, or sword, the messenger
    handled straps, covers, helmet, cases, and cloth in prescribed ways.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Many formal objects were borne with the left hand upward; sharp weapons were
    presented by ring or handle, with points turned away when handed to others.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When leaving the city in a war-chariot the weapon point was carried in front;
    when returning and entering the city again, the end was forward. The left side
    was assigned to the general and officers, and the right to soldiers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Different settings required different dispositions: humility for visitors
    and guests, reverence at sacrifices, sorrow at mourning rites, active interest
    at meetings, and attention to danger in war.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: At a feast with a superior, the guest first tasted the dishes, stopped when
    service was declined, avoided bolting food or swilling liquor, and took small
    frequent mouthfuls.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Cups, fish, condiments, receivers of presents, and transmitters of words were
    placed according to left-right rules.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The driver of a personator of the dead received a cup in the carriage and
    offered a little in sacrifice at the axle and cross-bar.
  category: action
  evidence_refs:
  - ev:11
