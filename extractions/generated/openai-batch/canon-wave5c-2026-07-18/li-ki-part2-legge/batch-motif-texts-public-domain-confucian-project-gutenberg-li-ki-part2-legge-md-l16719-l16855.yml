canonical_text:
  quote: ''
  summary: 'Book XLI explains the meaning of the marriage ceremony: its purpose as
    a bond between families, its introductory exchanges in the ancestral temple, the
    bridegroom’s reception of the bride with a wild goose, shared food and paired
    melon cups, and the young wife’s later presentation and offerings to her husband’s
    parents.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that marriage was intended as a bond of love between two
    families of different surnames, securing ancestral temple service and continuation
    of the family line.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Introductory marriage procedures include a proposal with gift, inquiries about
    the lady’s name, notice of approving divination, receipt of special offerings,
    and request to fix the day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The principal party on the lady’s side receives these instructions in the
    ancestral temple, meets the messenger outside the gate, yields precedence, and
    ascends to the hall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom’s father gives a special cup to his son and orders him to go
    meet the bride.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bride’s father receives the son-in-law, and the bridegroom enters carrying
    a wild goose, bows twice, puts down the goose, and receives the bride from her
    parents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bridegroom assists the bride in mounting her carriage, drives for three
    revolutions of the wheels, goes before her, waits outside his gate, and bows as
    she enters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The couple eats from the same animal and sips from cups made from the same
    melon; the passage says this shows they form one body, are of equal rank, and
    pledge mutual affection.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that marriage ritual establishes the distinction between
    man and woman, righteousness between husband and wife, and is the root of other
    ceremonial observances.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The morning after marriage, the young wife washes and bathes, then waits to
    be presented to her husband’s parents by the directrix at bright day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The young wife appears with a basket containing dates, chestnuts, and dried
    spiced meat; the directrix sets out sweet liquor, and the wife offers dried meat
    and liquor in sacrifice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The father and mother-in-law enter their apartment, where the young wife sets
    before them a single dressed pig.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the next day, the parents entertain the young wife; after mutual pledging
    in a single cup, they descend by the west steps and she by the east steps.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage lists capping, marriage, mourning and sacrifice, court audiences,
    feudal visits, country festivals, and archery celebrations as major ceremonial
    occasions.
  category: sequence
  evidence_refs:
  - ev:11
