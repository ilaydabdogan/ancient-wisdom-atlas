canonical_text:
  quote: ''
  summary: The passage explains music as arising from the movement of the mind, with
    notes and ornaments regulated by the superior man. It describes a ritual dance
    sequence with drum signals and ranked movements, then explains music and ceremonies
    as expressions of feelings, virtue, reciprocity, and social order. It lists royal
    gifts from the son of Heaven to feudal lords, including a Grand carriage, banners,
    and herds. It presents music and ceremonies as corresponding to Heaven and Earth,
    affecting spirits above and below, regulating family and political duties, and,
    when used by the Great man, producing cosmic harmony and natural fertility. It
    concludes by distinguishing music and ceremony themselves from their accessories
    and ritual personnel.
  language: English
  quote_policy: summarized
