- id: obs:1
  text: Music is described as springing from the movement of the mind; notes manifest
    music, and colours and parts ornament the notes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The superior man is said to set the fundamental cause in motion, make the
    manifesting notes into music, and regulate the ornaments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ritual performance begins with a drum warning, includes three steps by
    pantomimes, repeats the action, moves forward, completes evolutions, then returns
    and dresses the ranks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Music is said to display joyful affections, establish righteousness, pay honour
    to virtue, nourish superior men’s love of good, and let small men hear correction
    of their errors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Music is described as an outcome and bestowal of what its framers felt, while
    ceremonies are described as a return that carries the mind back to what originated
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Grand carriage, dragon flag with nine-scolloped border, tortoise banner,
    and herds of oxen and sheep are described as gifts of the son of Heaven bestowed
    on feudal lords.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Music is said to express unchanging feelings and what all equally share, while
    ceremony expresses unalterable principles and distinguishes differences among
    people.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ceremonies and music are said to resemble Heaven and Earth, affect spiritual
    Intelligences, bring spirits down from above, raise those below, and regulate
    duties between father and son and between ruler and subject.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the Great man uses ceremonies and music, Heaven and Earth are said to
    respond, natural energies proceed harmoniously, plants grow, animals breed, insects
    revive, and eggs are not broken or addled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Musical pipes, stringed instruments, singing, shields, and axes are called
