  summary: The passage explains how named ancient music expresses virtue, how proper
    seasonal forces are analogized to proper governance, and how ancient kings and
    sages used music, ceremony, drinking rules, education, and musical structure to
    regulate emotion, moral conduct, social order, and balanced Yin-Yang energies.
