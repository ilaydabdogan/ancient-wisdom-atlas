  quote: ''
  summary: The passage discusses reverent performance of sacrifice, the use of inscriptions
    on sacrificial tripods to praise ancestors and instruct later generations, the
    example of Khung Khwei of Wei receiving an inscribed tripod and committing a charge
    to ritual vessels, and royal grants to Lu of high sacrificial and musical rites
    in honor of the duke of Kau.
  language: English
