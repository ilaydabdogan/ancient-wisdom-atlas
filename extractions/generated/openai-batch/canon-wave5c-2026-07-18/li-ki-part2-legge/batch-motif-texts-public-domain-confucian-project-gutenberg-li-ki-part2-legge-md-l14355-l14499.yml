canonical_text:
  quote: ''
  summary: The passage gives ritual rules for a person who hears that mourning rites
    for a relative are underway and hurries to attend. It prescribes wailing, travel
    timing, mourning dress, entry routes, bodily gestures, spatial positions around
    the coffin or grave, interactions with visitors, and variations for parents, lesser
    kin, a wife, and late arrival after the coffin has left the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the mourner first hears from a messenger that mourning rites for a relative
    are going on, he wails in response, asks for particulars, wails again, and immediately
    arranges to go.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ordinary travel rule is one hundred li per day without night travel; for
    a father or mother, travel extends from seeing the stars before dawn until seeing
    them again after sunset.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: If immediate departure is impossible, the mourner assumes mourning dress before
    going as soon as he can.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the frontier of the state, the mourner stops and wails, avoids wailing
    in the market-place or near the court, and looks toward the frontier of his own
    state.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the house, the mourner enters by the left side of the gate, ascends by
    the west steps, kneels east of the coffin facing west, and wails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After wailing by the coffin, the mourner ties his hair, bares his arms, moves
    to his eastern station, wails westward, performs leaping, covers his arms, and
    puts on a sackcloth sash.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mourner bows to visitors, leaps with them, escorts them to the gate, and
    repeats the procedure for later visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Principal mourners and cousins go out to the gate and wail there; after the
    gate is closed, the director tells them to go to the mourning shed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the following two days, further wailings repeat hair-tying, arm-baring,
    leaping, completion of mourning dress, bowing to visitors, and escorting them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the person who hurried to the rites is not the presiding mourner, the presiding
    mourner bows to and escorts visitors instead.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: For rites requiring sackcloth but less than those for a father or mother,
    the mourner stands in the courtyard facing north, puts on head-cincture and sackcloth
    girdle, bares his arms, wails with the presiding mourner, and performs leaping.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: For mourning rites for a mother, the mourner wails facing west, ties his hair,
    bares his arms, moves to the eastern station, leaps, puts on cincture and sash,
    and bows to and escorts visitors as in rites for a father; on the next day he
    does not tie up his hair.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a wife hurries to the rites, she ascends by the east side steps, kneels
    east of the coffin facing west, wails, puts on the lower cincture, and leaps alternately
    with the presiding mourner.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the mourner arrives after the coffin has left the house, he first goes
    to the grave, kneels facing north, wails, performs leaping with the principal
    mourners stationed by the grave, and later resumes rites in sackcloth headband
    and sash.
  category: sequence
  evidence_refs:
  - ev:9
