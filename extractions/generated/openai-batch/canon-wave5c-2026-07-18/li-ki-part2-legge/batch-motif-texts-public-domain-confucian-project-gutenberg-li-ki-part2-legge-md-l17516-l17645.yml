canonical_text:
  quote: ''
  summary: The passage presents ritual archery as a courtly and moral practice linked
    with ceremony, music, selection of participants, proof of rank, access to sacrifice,
    territorial reward or penalty, and a birth rite placing a bow and six arrows by
    a newborn son to signify future duties across heaven, earth, and the four directions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rulers and their officers are described as devoting themselves together to
    archery, ceremonies, and music, resulting in happiness and renown.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son of Heaven instituted the archery custom; feudal lords attended to
    it, and it served to cherish princes without weapons of war and to train them
    in rectitude.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius conducted an archery meeting in a vegetable garden at Jiohsiang,
    where spectators surrounded the meeting place like a wall.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An appointed person was told to take bow and arrows and announce that certain
    persons, including the general of a defeated army and the great officer of a ruler-less
    state, would not be allowed to enter; after this, half went away and half entered.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kung-wang Khiti raised a horn of liquor and asked whether the young and strong
    observed filial and fraternal duties and whether the old loved propriety and maintained
    their characters; after this, half of those who had entered went away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hsii Tien raised a horn and asked whether those present loved learning, loved
    rules of propriety, and whether the very old expounded the way without confusion
    or error; hardly any remained afterward.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage explains shooting as drawing out to the end or lodging in the
    exact point, with an even-balanced mind, correctly poised body, and firm handling
    of bow and arrow.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father, son, ruler, and subject are each said to shoot at the corresponding
    mark; the archer shoots at the mark of his ideal self.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hitting the mark is described as allowing a prince to retain his rank, while
    failure means he is not permitted to retain it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before sacrifice, the son of Heaven was to celebrate archery at the pool and
    then in the archery hall; those who hit the mark could take part in the sacrifice,
    while those who failed could not.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ruler of those not permitted to take part in the sacrifice was reprimanded
    and lost territory, while the ruler of those permitted was congratulated and gained
    territory.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a son was born, a bow of mulberry wood and six arrows of wild raspberry
    plant were placed on the left of the door for shooting at heaven, earth, and the
    four cardinal points.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Heaven, earth, and the four points are said to denote the spheres of a man's
    business; the young man must first give his mind to his business before receiving
    emolument.
  category: attribute
  evidence_refs:
  - ev:8
