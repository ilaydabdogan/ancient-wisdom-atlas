  summary: The passage describes ritual and social rules by which juniors, officials,
    rulers, and the Son of Heaven show deference to elders, ancestors, Heaven, and
    ranked authorities. It gives examples from roads, villages, hunts, armies, schools,
    court visits, ancestral-temple transactions, sacrifices, feasts for the aged,
    royal ploughing, and divination by the Yi with a tortoise-shell.
