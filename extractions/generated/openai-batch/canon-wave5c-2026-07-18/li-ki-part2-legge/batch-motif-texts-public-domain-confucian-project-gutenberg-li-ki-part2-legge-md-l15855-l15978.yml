canonical_text:
  quote: ''
  summary: 'The passage lists qualities of the scholar: independence from constraint
    and disgrace, modest living, moral steadfastness under oppression, willingness
    to accept office without flattery, study of antiquity, perseverance amid danger,
    extensive learning, generosity toward others, promotion of the worthy, loyalty
    to friends, and careful admonition of a superior while maintaining an independent
    course.'
  language: English translation
  quote_policy: summarized
