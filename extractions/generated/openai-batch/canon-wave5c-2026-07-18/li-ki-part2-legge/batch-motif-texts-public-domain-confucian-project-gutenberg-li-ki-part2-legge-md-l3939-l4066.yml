canonical_text:
  quote: ''
  summary: The passage explains that ancient kings used ceremonies and music to restrain
    sensory desire, regulate likes and dislikes, and return people to humanity and
    inner Heavenly principle. It contrasts unregulated desire, which produces social
    disorder, with an ideal order in which mourning, marriage, archery, feasting,
    music, law, and punishment harmonize society under kingly rule and the Son of
    Heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In great sacrifices, dark-coloured liquor is said to take precedence, uncooked
    fish are placed on stands, and the grand soup has no condiments, leaving flavour
    undeveloped.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancient kings are said not to have aimed at fully satisfying appetite,
    ears, and eyes, but at regulating likes and dislikes and bringing people back
    to the normal course of humanity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Man is described as still at birth as from Heaven; external things act on
    him, producing activity, desires, increasing knowledge, and likes and dislikes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When likes and dislikes are not internally regulated, the passage says the
    Heavenly principle within is stifled or extinguished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists social disorder as the strong pressing the weak, the many
    being cruel to the few, the knowing imposing on the dull, the bold troubling the
    timid, and vulnerable persons being neglected.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ancient kings are said to define mourning through sackcloth, wailings,
    and weepings; to introduce harmony through bells, drums, shields, and axes; and
    to regulate relations through marriage, capping, hair-pin assumption, archery
    gatherings, and feasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ceremonies express the people’s affections, music harmonizes their voices,
    laws promote performance, and punishments guard against violation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Music is described as aiming at similarity and union, while ceremony aims
    at difference and distinction; union produces affection and difference produces
    respect.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Music is described as coming from within and producing stillness, while ceremonies
    come from without and produce elegance of manner.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: When music and ceremony achieve their full results, the passage says there
    are no dissatisfactions, quarrels, oppression, war weapons, five punishments,
    common distress, or anger from the Son of Heaven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Son of Heaven is said to secure affection between father and son, order
    between old and young, and mutual respect within the four seas.
  category: action
  evidence_refs:
  - ev:10
