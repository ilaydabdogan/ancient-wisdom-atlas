canonical_text:
  quote: ''
  summary: The passage describes norms for sage rulership, ritual and administrative
    change, kinship naming, mourning gradations, marriage prohibitions within a shared
    surname, and the relation between affection, right, father, and ancestor. It also
    states that a ruler assembles and feasts his kindred.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sage sovereign is described as standing with his face to the south while
    affairs of the kingdom come before him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Five first cares of the sage ruler are listed: regulating duties to kindred,
    rewarding merit, promoting worth, employing ability, and maintaining loving vigilance.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the five cares are fully realized, the people have their necessities
    satisfied; if one is defective, the people cannot complete their lives in comfort.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Changes can be imposed in measures, ceremonial elegancies, calendar commencement,
    dress color, flags and blazonry, vessels and weapons, and distinctions in dress.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Changes cannot be imposed in affection for kin, honor paid to the honorable,
    respect due to the aged, or the different positions and functions of male and
    female.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Members of the same surname are united under heads of branches, while those
    of different surname have relations regulated chiefly by assigned names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wives are placed in relational categories according to the generational class
    of their husbands, and the passage stresses care in declaring names or appellations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Mourning is reduced with generational distance: four generations removed
    wear mourning for three months, five generations use bared shoulders and cincture,
    and after the sixth generation the kinship bond is held ended for that purpose.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A shared original surname and a common feast maintain connection and prevent
    intermarriage even after a hundred generations.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: 'Six considerations regulate mourning: nearness of kinship, honor, names,
    marital position of women, age, and affinity or external relationship.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Affection is said to begin from the father and diminish upward to the high
    ancestor; right is said to begin from the ancestor and increase downward to the
    father.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The ruler is said to assemble and feast all members of his kindred.
  category: action
  evidence_refs:
  - ev:10
