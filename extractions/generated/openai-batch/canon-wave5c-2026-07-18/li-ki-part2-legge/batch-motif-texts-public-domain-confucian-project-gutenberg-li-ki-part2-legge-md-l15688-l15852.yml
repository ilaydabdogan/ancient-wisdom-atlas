canonical_text:
  quote: ''
  summary: 'The passage first assigns ritual/game personnel to guest and host parties
    and describes diagrammatic marks for drums and semis in games such as pitch-pot
    and archery. It then opens ''The Conduct of the Scholar'': Duke Ai asks Confucius
    about the scholar''s dress and conduct. Confucius denies knowing any special scholar''s
    dress and gives an extended account of the scholar as prepared, sincere, modest,
    righteous, difficult to win or retain for unrighteous purposes, indifferent to
    material wealth, and steadfast before temptation, force, death, and danger.'
  language: English translation
  quote_policy: summarized
