  summary: The passage describes efficacious music, ceremony, and mourning without
    outward sensory or material forms; presents 3ze-hsia asking Confucius about the
    virtue of dynasty-founding kings; defines the Three Impartialities through Heaven,
    Earth, Sun, and Moon; cites Poetry examples about Thang, the southern hills and
    a descending Spirit, forefathers' fame, and king Thai; and ends with 3ze-hsia
    reverently receiving the instruction.
  language: English
  quote_policy: summarized
