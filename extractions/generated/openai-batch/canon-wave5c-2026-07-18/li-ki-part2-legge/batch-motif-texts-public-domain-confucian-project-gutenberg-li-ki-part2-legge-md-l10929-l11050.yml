  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius answers that those kings reverently displayed the Three Impartialities
    while comforting all beneath the sky under imposed toils.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Heaven overspreads all, Earth sustains and contains all, and the Sun and Moon
