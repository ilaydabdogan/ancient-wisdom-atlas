  quote: ''
  summary: The passage describes the ordered placement of the Son of Heaven, dukes,
    feudal princes, and outer peoples in the Hall of Distinction; explains that the
    hall displayed rank; recounts the duke of Kau’s regency, reforms, resignation,
    investiture, and later ritual honors in Lu, including sacrifices conducted with
    ceremonies proper to the Son of Heaven.
  language: English
  quote_policy: summarized
