canonical_text:
  quote: ''
  summary: The passage presents instruction on sacrificial demeanour, preparation,
    and filial reverence. It describes royal or ruler sacrifices with a personator,
    food offerings, music, victims on stands, ceremonies, and officers. It then explains
    how a filial son, with household and officers prepared, performs sacrifice with
    reverence, careful posture, and a desire for communion with the dead in their
    spiritual state. The passage closes with a teaching that ancient kings secured
    stable government by honoring or caring for ranked social groups because of their
    likeness to key moral and kinship positions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master distinguishes between dignity of demeanour, absorbed demeanour,
    and communion with the spirits, and says that sayings have their appropriate applications.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacrifices of the king and rulers are described as including the personator's
    return to his apartment, a food offering to him, music, stands with victims, ordered
    ceremonies, and officers for services.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A filial son who is about to sacrifice should ensure that preparations are
    complete before the time of sacrifice and should perform with a mind free from
    preoccupation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The temple and apartments are repaired, walls and roofs are put in order,
    assisting officers are provided, and husband and wife bathe their heads and persons
    after vigil and footing and dress fully.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those carrying ritual items enter gravely, still, and absorbed, as if unable
    to sustain the weight or in danger of letting the items fall.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The filial son sets forth stands with victims, arranges ceremonies and music,
    provides officers, declares his mind and wish, and seeks communion with the dead
    in their spiritual state in the hope that they will enjoy his offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The filial son is said to observe every rule without transgression, and his
    advancing and retiring are compared to hearing or receiving direction from his
    parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage prescribes reverent bodily attitudes and facial expressions while
    waiting, carrying the service forward, presenting offerings, retiring, and standing
    after the offerings are removed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that missing or improper expressions during the sacrifice
    would show insensibility, indifference, lack of love, pride, or forgetfulness
    of the parent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Deep love for parents is linked to a bland air, a look of pleasure, and mild
    compliant demeanour; the filial son is compared to one carrying a jade symbol
    or a full vessel.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ancient kings are said to have maintained the stability of the kingdom through
    honor to the virtuous, noble, and old, reverence to the aged, and kindness to
    the young.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The groups honored or cared for by ancient kings are explained through approximations
    to duty, the ruler, parents, elder brothers, and sons.
  category: relationship
  evidence_refs:
  - ev:10
