canonical_text:
  quote: ''
  summary: The passage lists ritual rules for mourning, wailing, clothing, tablets,
    sacrifices, ranks of mourners, funerary gifts, and offerings for the dead. It
    distinguishes duties by kinship, office, household status, rank, mourning duration,
    and ritual occasion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For mourning a parent after a year, the sackcloth associated with nine months'
    mourning is preferred, but a different cap and mourning outfit is worn when placing
    the tablet of a prematurely deceased brother in its shrine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prematurely deceased youth is called 'The Bright Lad,' and the mourner avoids
    naming him directly, treating him with reference to his spirit-state.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When brothers live in different houses, one who first hears of another brother's
    death may reply to the messenger only by wailing, then put on sackcloth and a
    girdle with dishevelled edges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A master presiding at mourning rites for a concubine conducts the placing
    of her tablet and uses her son to preside at later first-year and second-year
    sacrifices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A ruler does not stroke the corpse of a servant or concubine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Concubines mourn for a deceased ruler's wife as relatives, but a concubine
    who takes her place as acting mistress does not wear mourning for those relatives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A mourner who hears of rites for a cousin for whom nine months or more of
    mourning is owed wails while facing the direction of the rites.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At mourning occasions, if a condolence visitor arrives before the mourning
    robes are complete, the president takes the proper place, wails, bows, and leaps.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Great officer wailing for another Great officer wears a conical cap with
    a sackcloth band, including during coffining.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: For an eldest son, a staff is carried, but not for that son's son; an eldest
    son whose parents are alive does not carry a staff or perform full prostration
    when wailing for his wife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mourning caps, seams, tassels, girdle ends, court-robe cloth, and coarse mourning
    cloth are differentiated by mourning duration and occasion.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
  - ev:15
- id: obs:12
  text: Princes send second-class carriages with caps and robes as presents for the
    use of the dead, but not first-class carriages or robes received from the king.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Small carriages sent to the grave correspond in number to parcels of flesh,
    each has a coarse-cloth pall, and the parcels are placed at the four corners of
    the coffin.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Rice is mentioned as sometimes sent, but Yi-3ze says such an offering is contrary
    to rule; the food placed by the dead is dried meat and pickled items.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: At sacrifices after the sacrifice of Repose, the mourner uses filial titles;
    at previous rites, grieving titles are used.
  category: speech
  evidence_refs:
  - ev:15
