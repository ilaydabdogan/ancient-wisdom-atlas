  quote: ''
  summary: The passage uses food and learning analogies to state that teaching and
    learning assist one another. It describes ancient educational institutions, staged
    examinations in the Great College, ritual actions at the start of instruction,
    seasonal and home study, and the self-cultivation of a talented and virtuous student
    who remains faithful to the learned course.
  language: English
  quote_policy: summarized
