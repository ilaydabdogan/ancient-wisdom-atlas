  text: The passage compares uneaten fine viands and an unlearned perfect course to
    knowledge that is unavailable without direct eating or learning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Learning is said to reveal one's own deficiencies, while teaching is said
    to reveal the difficulties of learning; teaching and learning are described as
    helping each other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Ancient teaching is organized by scale: village school for families of a
    hamlet, hsiang for a neighbourhood, hsii for larger districts, and college in
    the capitals.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Students enter the college yearly, with comparative examinations every second
    year that evaluate reading, attentiveness, companions, study extension, teachers,
