  text: The Master says the ruler above must not be careless in punishing or lightly
    confer rank.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master says unrest among common people can follow from insufficient loyalty
    and respect between ruler and great ministers, excessive riches and rank, and
    factional behavior by nearer ministers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
