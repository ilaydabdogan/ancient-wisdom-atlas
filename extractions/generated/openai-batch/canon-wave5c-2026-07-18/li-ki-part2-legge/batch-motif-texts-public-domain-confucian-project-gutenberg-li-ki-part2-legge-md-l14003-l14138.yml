  quote: "“A small man is drowned in the water; a superior man is drowned or ruined
    by his mouth; the great man suffers his ruin from the people.”"
  summary: The Master gives political and moral admonitions about clear rulership,
    exemplary ministers, careful use of rank and punishment, proper treatment of great
    ministers, attachment to worthy people, and the dangers of water, speech, and
    contempt for the people. The passage supports these admonitions with citations
    from the Book of Poetry and Shu-related texts.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master says that when the highest person has doubts and perplexities,
    common people go astray, and when lower ministers are hard to understand, the
    ruler’s toil is prolonged.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says a ruler should clearly show what he loves and dislikes so
    that people can see the manners to aim at and avoid excesses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says ministers should be exemplary in conduct, avoid valuing fine
    speeches, and not press the ruler toward unattainable or unknowable matters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Master attributes ineffective government to rank and emoluments that do
    not stimulate good, and punishments and penalties that do not make people ashamed
    of evil.
  category: speech
  evidence_refs:
  - ev:2
