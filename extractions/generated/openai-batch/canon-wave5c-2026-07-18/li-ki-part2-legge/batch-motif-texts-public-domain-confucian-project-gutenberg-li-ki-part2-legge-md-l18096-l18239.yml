canonical_text:
  quote: ''
  summary: Book XLVI explains the four principles underlying mourning dress. Ceremonial
    usages are said to embody heaven and earth, follow the four seasons, imitate natural
    contraction and development, and conform to human feelings. The passage applies
    these principles to mourning garments, mourning duration, relations to father,
    ruler, and mother, use of the mourning staff, bodily circumstances, and the fixed
    three-year limit of mourning rites.
  language: English
  quote_policy: summarized
