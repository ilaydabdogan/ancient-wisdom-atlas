- id: motif:1
  label: Ritualized mourning gestures with counted leaps
  taxonomy_refs: []
  basis: The passage repeatedly prescribes wailing, bowing, and leaping, including
    three responsive leaps between messenger and mourner and leaping by the son and
    wife at the coffin.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: This is a ritual prescription rather than a narrative myth episode.
- id: motif:2
  label: Corpse preparation by designated household and ritual personnel
  taxonomy_refs: []
  basis: The passage assigns female relatives, servants, an officer of prayer, officers,
    and the major-domo specific actions before and after dressing the corpse.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No mythic figure is introduced; the motif is procedural and mortuary.
- id: motif:3
  label: High-status funerary procession with fire, human drawing, and cleared road
  taxonomy_refs: []
  basis: The passage states that an officer’s rites include all-night torches, men
    drawing the carriage, and a road cleared of travellers, matching rites for the
    son of Heaven.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage lists only three shared practices and does not explain their
    symbolic meaning.
- id: motif:4
  label: Ritual precedence among overlapping mourning obligations
  taxonomy_refs: []
  basis: Rules specify which mourning clothing or actions take precedence when deaths
    of mother, father, uncles, cousins, son, grandfather, grandson, or distant relatives
    overlap.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a legal-ritual pattern, not a mythic narrative sequence.
- id: motif:5
  label: Sacrifice duty coordinated with bereavement
  taxonomy_refs:
  - sacrifice
  basis: The passage describes when an officer still attends a ruler’s sacrifice despite
