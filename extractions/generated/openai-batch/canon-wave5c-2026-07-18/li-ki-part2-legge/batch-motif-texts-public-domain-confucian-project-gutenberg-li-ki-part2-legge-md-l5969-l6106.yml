canonical_text:
  quote: ''
  summary: The passage gives ritual prescriptions for mourning, corpse preparation,
    overlapping mourning obligations, participation in a ruler’s sacrifices during
    bereavement, and the public protocol owed to the personator of the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger stands west of the gate with attendants on his left, while an
    orphaned mourner descends by the eastern steps, bows, ascends with the messenger,
    and joins in wailing and three responsive leaps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the messenger leaves, the mourner escorts him outside the gate and bows
    with his forehead to the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a ruler of a state is holding mourning rites for a parent, an officer
    who is also mourning a parent does not receive condolence visits from another
    state.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: During corpse preparation, female relatives remain in their apartments, servants
    spread mats, an officer of prayer using Shang forms lays out clothing items, officers
    wash their hands by a vessel, and the corpse is moved to be dressed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the dressing is finished, the major-domo reports it; the son leans on
    the coffin and leaps, and the wife kneels facing east, leans on the coffin, rises,
    and leaps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Three rites for an officer are said to agree with rites for the death of
    the son of Heaven: all-night torches, men drawing the carriage, and keeping the
    road free of travellers.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a mother dies before a man has completed mourning for his father, he changes
    to mourning for the mother but puts on the father-related dress when sacrificial
    services require it, then returns to mourning for the mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If mourning for uncles or cousins arises during mourning for a parent, the
    parent mourning is generally not laid aside except when sacrificial services require
    a change, after which parent mourning resumes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: If another three years’ mourning for an eldest son occurs during three years’
    mourning for a parent, certain anniversary sacrifices for the parent may proceed
    after the coarser girdle has been assumed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a grandfather has died and his grandson dies before the first- or second-year
    sacrifices, the grandson’s spirit-tablet is still placed next to the grandfather’s.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A mourner who hears of the death of another distant relative while a coffin
    is in the house wails in another apartment, later enters where the coffin is,
    sets down offerings, changes clothes, and repeats the previous ceremony.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If an officer is about to participate in a ruler’s sacrifice and a parent
    dies after the vessel-washing inspection, he still attends the sacrifice in a
    different apartment, then removes sacrificial dress outside the palace gate, wails,
    and returns home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: If the parent dies before the vessel-washing inspection, the officer sends
    a messenger to tell the ruler and then proceeds to wail for the parent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: If an uncle, aunt, or cousin dies after the officer has received notice to
    fast for a ruler’s sacrifice, he attends the sacrifice, then removes sacrificial
    dress at the ruler’s gate and returns home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Confucius says that a high minister or Great officer assigned to personate
    the dead at a ruler’s sacrifice should leave his own house and lodge in the ruler’s
    palace if a family occasion for hemmed sackcloth occurs, remaining until the ruler’s
    service is accomplished.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Confucius says that when the personator of the dead comes forth in a specified
    cap, ministers and officers should descend from their carriages; the personator
    bows forward, and people go ahead to notify others of his approach.
  category: speech
  evidence_refs:
  - ev:11
