canonical_text:
  quote: ''
  summary: 'The passage describes the entirely perfect person: cultivating goodness
    into moral perfection, manifesting and transforming, foreknowing omens of fortune
    and ruin, completing self and other beings, and becoming comparable in scope to
    heaven and earth. It also describes heaven and earth as inexhaustibly productive
    and characterized by largeness, substance, height, brilliance, distance, and duration.'
  language: English translation
  quote_policy: summarized
