- id: obs:2
  text: The passage says an offer to share a state would be to the scholar no more
    than small balance weights.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The scholar has companions who share his aims, objects, course, and methods;
    he rejoices in those on the same level, does not tire of those below him, rejects
    harmful rumors about long-unseen companions, and either proceeds with or withdraws
    from others according to their direction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The scholar's actions are described as rooted in correctness and his standing
