canonical_text:
  quote: ''
  summary: 'The passage describes the conduct of the ideal scholar: refusing office
    or wealth when appropriate, cultivating learning and accomplishments, choosing
    friends by shared correctness, embodying qualities of humanity while declining
    to claim perfect humanity, and remaining unmoved by poverty, riches, or social
    pressure. A closing frame says Duke Ai heard the words, became more sincere and
    righteous, and vowed not to jest about the name of scholar; an editorial note
    questions attribution to Confucius.'
  language: English
  quote_policy: summarized
literal_observations:
