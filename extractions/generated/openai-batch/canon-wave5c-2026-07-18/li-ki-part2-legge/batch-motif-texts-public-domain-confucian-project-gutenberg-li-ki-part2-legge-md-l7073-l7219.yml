canonical_text:
  quote: ''
  summary: 'The passage prescribes funeral and mourning etiquette: how the presiding
    mourner and presiding wife receive visitors, how ranked visitors and wives are
    bowed to, how the slighter dressing is followed by sackcloth and hair changes,
    how the curtain and hall arrangements are handled, how offerings are placed by
    the body, how officials provide materials for continuous wailing, how lights are
    arranged by rank, and how substitute presiders act when the successor is absent
    or a child.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the presiding mourner goes out to meet visitors, he is barefoot, has
    his skirt tucked under his girdle, holds his hands across his chest over his heart,
    descends by the west steps, and bows to certain ranked visitors or messengers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Female figures receive visits or messages according to rank: a ruler''s wife,
    a confirmed wife of a Great officer, and an officer''s wife each have specified
    occasions for going out to receive another woman or a message.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the slighter dressing, the presiding mourner and presiding wife take prescribed
    positions; after the dressing they act as if leaning on the body, leap, and put
    on or arrange mourning hair and sackcloth items.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the curtain screening the body is removed, men and women carry it and
    place it in the hall while the eldest son descends the steps and bows to visitors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Bows are assigned by status: the young ruler bows to refugee lords and ministers,
    officers receive side-bows by grade, and the ruler''s wife bows to women in the
    hall according to their official position.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: After bowing to visitors, the mourner returns to his place, adjusts his robe,
    girdle, and head-band, and leaps; in mourning for his mother he ties up his hair
    and places offerings by the body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Visitors who have come to condole adjust their own robes, caps, girdles, and
    head-bands, and leap in correspondence with the mourner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a ruler's funeral, several offices supply materials such as wood, horns,
    water vases, boilers, and hanging arrangements so that wailers can succeed one
    another; some department members may join the wailing if needed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The number and placement of lights in the hall differ by rank: a ruler''s
    hall has two above and two below, a Great officer''s has one above and two below,
    and an ordinary officer''s has one above and one below.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the corpse is wailed above in the hall, the principal mourner is placed
    at the east, visitors from outside at the west, and women face south.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The presiding wife, son, daughter, child son, bearer, or substitute may each
    perform reception or bowing actions depending on who is present and able to preside.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The funeral rites may proceed without the deceased's successor, but not without
    someone to preside over them; if the successor is within the state, the rites
    wait for him.
  category: sequence
  evidence_refs:
  - ev:12
