  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Heads of the people are described as maintaining proper dress and easy manners;
    the cited poem mentions plain yellow fox-furs in the old capital.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A ruler who can be known by being looked at, and ministers whose deeds can
