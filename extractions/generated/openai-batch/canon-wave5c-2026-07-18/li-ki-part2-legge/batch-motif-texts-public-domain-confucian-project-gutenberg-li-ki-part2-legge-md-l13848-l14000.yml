  text: The Master contrasts teaching the people through virtue and ceremony with
    teaching them through laws and punishments.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ruler who loves the people as sons, binds them by good faith, and presides
    with courtesy is described as receiving parental feeling, non-abandonment, and
    docility from them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage cites the people of Mido as using punishments as oppressive laws,
    after which their people became bad and their rulers were cut off from the land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inferiors are said to follow what superiors do rather than merely what they
    command.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yi, Grand-Master Yin, and King Wt are cited as figures associated with humanity,
