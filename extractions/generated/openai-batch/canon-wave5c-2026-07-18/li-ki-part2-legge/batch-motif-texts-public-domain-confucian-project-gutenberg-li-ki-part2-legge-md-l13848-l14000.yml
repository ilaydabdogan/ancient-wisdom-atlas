canonical_text:
  quote: ''
  summary: A sequence of sayings attributed to the Master teaches that rulers should
    guide people through virtue, ceremony, good faith, humanity, careful speech, consistent
    conduct, proper manners, visible integrity, and honoring the righteous, rather
    than through punitive oppression. The passage supports these maxims with brief
    citations from poetry and earlier documents about Wan, Yi, Yin, King Wt, Thang,
    and the people of Mido.
  language: English translation
  quote_policy: summarized
literal_observations:
