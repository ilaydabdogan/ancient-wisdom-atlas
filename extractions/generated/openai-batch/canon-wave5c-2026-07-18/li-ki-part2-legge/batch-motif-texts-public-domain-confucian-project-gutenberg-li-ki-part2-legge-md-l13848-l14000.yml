  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When superiors display humanity, inferiors are said to strive to practice
    it; rulers are again told to love the people as sons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king's words are compared to threads of silk that become cords or ropes
    when issued publicly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The superior man is told to lead by words, restrain by conduct, reflect on
