canonical_text:
  quote: "“the archery served to show the completeness of (the archer’s) virtue.”"
  summary: The passage explains ritual archery as a ranked ceremony governed by rules,
    music, bodily carriage, and moral intention. It links a threefold ceremonial order
    to lunar and seasonal timing, describes archery as revealing character and establishing
    virtue, and presents royal testing in the archery hall as affecting sacrifice
    participation, princely commendation or reprimand, and territorial reward or loss.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The moon is said to complete the period of its dark disk after three days,
    and three months are said to complete a season; the passage then connects this
    with precedence being yielded three times, three high ministers in a state, and
    three divisions of guests each with a head or leader.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Feudal lords were to celebrate the ceremony of the Banquet before practising
    archery, while Great officers and ordinary officers were to celebrate the ceremony
    of Drinking in the country districts before shooting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Banquet ceremony is said to illustrate the relation between ruler and
    subject, and the District-drinking ceremony is said to illustrate the distinction
    between seniors and juniors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Archers were required to observe rules in advancing, retiring, and all movements;
    they were to have correct minds, straight bodily carriage, and firm, skilful handling
    of bows and arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that, when archers acted in this regulated way, they could
    be expected to hit the mark and their characters could be seen.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The discharge of arrows was regulated by different named musical pieces for
    the son of Heaven, feudal lords, Great officers, and officers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The named musical pieces are each connected with a form of joy or dutiful
    attention appropriate to a rank: offices rightly filled, court audiences, observing
    learned laws, and avoiding failures in duty.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that understanding the regulating measures and avoiding failure
    led to successful undertakings, established character and conduct, absence of
    oppression and disorder, and tranquil, happy states.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anciently, the son of Heaven chose feudal lords, Great officers, and officers
    from their skill in archery; archery is described as specially the business of
    males and as embellished by ceremonies and music.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Under the royal institutes, feudal princes annually presented tribute officers
    to the son of Heaven, who tested them in the archery hall.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Officers whose bodily carriage conformed to the rules, whose shooting agreed
    with the music, and who hit the mark most frequently were allowed to take part
    at sacrifices.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A ruler was congratulated if his officers often received the privilege of
    sacrifice participation and reprimanded if they often failed; frequent congratulations
    could increase his territory, while frequent reprimands could reduce it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A cited lost ode describes a long-descended lord presenting cups of grace,
    with chiefs, noble men, small officers, and great officers appearing before their
    prince in full array.
  category: speech
  evidence_refs:
  - ev:10
