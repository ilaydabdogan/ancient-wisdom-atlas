canonical_text:
  quote: ''
  summary: Ritual prescriptions describe sacrificial headgear and implements, funerary
    grave provisions, corpse dressing, mourning gestures, soul-calling, ruler condolence,
    gifts for the dead, and formal condolence messages, with repeated distinctions
    by rank and setting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caps worn by Great officers and ordinary officers vary according to rank and
    whether the sacrifice is for the ruler or at the officer’s own shrine.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A skin cap is also permitted for an officer at his own shrines because it
    is worn when he personally goes to meet his bride.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The implements for making sacrificial spirits include a cypress-wood mortar,
    a dryandria pestle, and mulberry-wood ladle and scoop.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shroud girdle for a prince or Great officer has five colours, while that
    for another officer has two.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Must made from rice malt, jars, baskets, boxes, and a tray for mats are placed
    in relation to the coffin covering.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The spirit-tablet set up over the coffin is buried after the sacrifice of
    Repose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mourning rites for wives follow the rank of their husbands.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Visitors arriving during stages of corpse dressing or opening of the coffin
    enclosure are saluted and bowed to after those operations are completed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At morning and evening wailing the coffin is not screened, and after the bier
    is removed the curtain is no longer suspended.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the ruler comes to condole, the presiding mourner bows, moves to the
    right of the gate, leaps, waits outside for the ruler’s departure, and then places
    the ruler’s gifts by the bier.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The corpse of 3ze-k4o is described as dressed in multiple layers of garments
    associated with different caps, and 3ang-;ze comments that such dressing should
    contain nothing of women’s dress.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If an officer dies while on a ruler’s commission, his soul is called back
    if the death occurs in a public hotel, but not if it occurs in a private hotel.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Leaping for a deceased ruler lasts seven days, for a Great officer five days,
    and for an ordinary officer three days; women participate at intervals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The corpse of a ruler is dressed in a specified order of robes, garments,
    caps, and girdles.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: At the slight dressing of the corpse, the son or presiding mourner wears a
    sackcloth band about his head, and this applies across rulers, Great officers,
    and ordinary officers.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the ruler comes to see the great dressing of the corpse, the Shang priest
    spreads the mat afresh and the dressing proceeds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The people of Li contribute dark-coloured and light-red silk rolls as gifts
    for the dead to be placed in the grave.
  category: object
  evidence_refs:
  - ev:11
- id: obs:18
  text: A condolence envoy from another ruler stands outside the gate, while formal
    messages are exchanged through attending officers and the orphan mourner.
  category: speech
  evidence_refs:
  - ev:12
