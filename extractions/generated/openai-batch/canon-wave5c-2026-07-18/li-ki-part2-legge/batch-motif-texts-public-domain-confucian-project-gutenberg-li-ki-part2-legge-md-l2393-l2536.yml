literal_observations:
- id: obs:1
  text: A note states that mourning for a wife could incapacitate a man from presiding
    at sacrifices in his own ancestral temple, and that there were seven justifiable
    causes for divorcing a wife without infidelity or criminal guilt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note states that when no brother was available to preside at rites, a relative
    of the same surname could be called in, while the daughter carried the staff as
    if she had been a son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For three-month and five-month mourning, mourners wore the mourning cincture
    at the sacrifice of repose and the ending of wailing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After interment, if the sacrifice of repose was not performed immediately,
    the mourners wore caps; when they came to the sacrifice, they assumed the cincture.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When mourners returned from a distant burial, they wore caps while returning,
    put on the cincture at the suburbs, and came back to wail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a ruler came to condole, the president of the rites and relatives assumed
    the cincture, even if it was not otherwise the time for wearing it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When mourning was put off for one who died prematurely, the accompanying sacrifice
    used dark-coloured dress; for one fully grown, court robes and a white plain silk
    cap were worn.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A son who hurried from a distance to his father’s mourning rites bound up
    his hair, bared his chest, descended to the court, performed leaping, then covered
    his chest and put on his sash.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For his mother’s rites, the son did not bind up his hair, but still bared
    his chest, descended, performed leaping, covered his chest, and put on the cincture.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In three days the son wailed five times and bared his chest three times for
    leaping.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If an eldest son and his wife could not later take the place of his parents,
    the mother-in-law wore five months’ mourning for the wife’s death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Only the king offered the united sacrifice to all ancestors; princes, great
    officers, and other officers had more limited ancestral sacrifices according to
    status and approved services.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the victory at Mti-yeh, king Wd reared a burning pile to God, prayed
