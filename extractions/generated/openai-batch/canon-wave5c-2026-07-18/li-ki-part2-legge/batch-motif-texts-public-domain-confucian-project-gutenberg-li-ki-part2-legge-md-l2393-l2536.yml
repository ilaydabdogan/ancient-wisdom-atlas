  summary: The passage contains translator notes and ritual rules on mourning dress,
    cinctures, caps, wailing, leaping, ruler condolence visits, and five-month mourning.
    It then begins the Great Treatise with rules on ancestral sacrifices by rank,
    and describes king Wd after the victory at Mti-yeh offering rites to God, the
    earth altar, and ancestors, followed by an ordering of kinship places and services.
