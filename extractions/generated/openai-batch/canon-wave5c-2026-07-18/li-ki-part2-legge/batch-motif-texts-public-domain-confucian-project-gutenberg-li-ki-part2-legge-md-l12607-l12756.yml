canonical_text:
  quote: ''
  summary: The passage uses images of heaven, earth, mountain, and water to illustrate
    apparent smallness and inexhaustible scope. It praises Heaven, king Wan, the sage’s
    course, and the superior man’s cultivated conduct. It states that ceremonial usages,
    measures, and written characters belong to the son of Heaven, emphasizes uniformity
    of wheels, writing, and conduct, and requires both virtue and throne for making
    ceremonies or music. It discusses attestation by people, dynastic founders, heaven
    and earth, Spiritual Beings, and a future sage, and concludes that the superior
    man’s movements, actions, and words become enduring models.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heaven is described as appearing like a bright shining spot, yet in its inexhaustible
    extent the sun, moon, stars, and zodiacal constellations are suspended in it and
    all things are overspread by it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth is described as appearing like a handful of soil, yet in breadth and
    thickness it sustains mountains and contains rivers and seas without leakage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mountain is described as appearing like a stone, yet in its altitude it
    produces grass and trees, houses birds and beasts, and contains treasured precious
    things.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Water is described as appearing like a ladleful, yet in its depths it produces
    large tortoises, iguanas, iguanodons, dragons, fishes, and turtles, and contains
    sources of value and wealth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Book of Poetry is cited to describe the ordinances of Heaven as profound
    and unceasing and to praise king Wan’s single virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The course of the sage is compared to an overflowing flood that sends forth
    and nourishes all things and rises to the height of heaven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The course of the sage is said to embrace hundreds of ceremonial usages and
    thousands of modes of demeanour, awaiting the right man to tread it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The superior man honors virtuous nature, pursues inquiry and study, cherishes
    old knowledge to acquire new knowledge, and practices propriety.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When high in position the superior man is not proud, and when low in position
    he is not insubordinate; in a well-governed state his words promote prosperity,
    and in an ill-governed state his silence secures forbearance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Master warns that calamity will come to the ignorant person fond of using
    his own judgment, the low-positioned person fond of directing power, and the person
    who in the present age goes back to the ways of antiquity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says only the son of Heaven may discuss ceremonial usages, fix
    measures, and determine the names of written characters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Throughout the kingdom, carriages have wheels with the same breadth of rim,
    writing uses the same characters, and conduct follows the same rules.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that one who has the throne without proper virtue, or virtue
    without the throne, should not presume to make ceremonies or music.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Master says he might speak of the ceremonies of Hsia, learned the ceremonies
    of Yin preserved in Sung, learned the ceremonies of Adu now used, and follows
    Kau.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Regulations or proposals that cannot be attested, honored, or credited will
    not be followed by the people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The superior man’s course is rooted in his own character and conduct, attested
    by the multitudes, compared with the founders of the three dynasties, set before
    heaven and earth, presented before Spiritual Beings, and prepared to await a sage
    a hundred ages later.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The superior man’s movements, actions, and words are said to become the path,
    law, and pattern for all under heaven across ages.
  category: attribute
  evidence_refs:
  - ev:10
