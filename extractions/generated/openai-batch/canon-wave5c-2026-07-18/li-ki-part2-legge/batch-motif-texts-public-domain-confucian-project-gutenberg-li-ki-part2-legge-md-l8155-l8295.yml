canonical_text:
  quote: ''
  summary: 'The passage sets out graded ritual arrangements for rulers, nobles, officers,
    and common people: ancestral temples, altars, sacrificial areas, ground altars,
    sacrifices to local or household spirits, discontented ghosts without posterity,
    and classes of the prematurely dead. Sacrificial privileges and obligations vary
    by social rank and by the nearness or remoteness of kinship.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sovereigns who possessed the kingdom divided land, established feudal principalities,
    assigned cities and towns, made ancestral temples, arranged spirit-tablets, raised
    altars, cleared sacrificial areas, and apportioned sacrifices and lands according
    to kinship and rank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is described as having seven ancestral temples with raised altars
    and surrounding areas; monthly sacrifices are assigned to nearer ancestral temples,
    seasonal sacrifices to more remote tablet receptacles, prayer-based sacrifice
    to a still more remote tablet, and no service for one still more remote, who is
    left in a ghostly state.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A feudal prince is described as having five ancestral temples, with monthly
    sacrifices for nearer ancestors, seasonal sacrifices for the great-great-grandfather
    and high ancestor, prayer-based sacrifice for one beyond the high ancestor, and
    no service for one still more remote.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Great officer has three ancestral temples and two altars; sacrifices to
    the named ancestors are seasonal, while more remote named ancestors receive altars
    and sacrifices only on occasions of prayer, and still more remote ancestors are
    left in a ghostly state.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: An officer of the highest grade has two ancestral temples and one altar; an
    officer in charge of one department has one ancestral temple for his father, and
    ordinary officers and common people have no ancestral temple.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Where no ancestral temple is provided, the dead or more remote ancestors are
    described as being left in their ghostly state, with offerings for ordinary people’s
    dead occurring in the back apartment as occasion requires.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The king, feudal prince, and Great officers or lower ranks establish different
    named altars to the spirit of the ground: the Grand altar, Royal altar, altar
    of the state, altar of the prince, and Appointed altar.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king appoints seven sacrifices for all the people and seven corresponding
    sacrifices for himself, including sacrifices linked to the lot, central court,
    city gates, roads, discontented ghosts of kings without posterity, the door, and
    the furnace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Feudal princes, Great officers, first-grade officers, other officers, and
    common people appoint decreasing numbers of sacrifices, with recurring locations
    at gates and roads and some household guardians such as the door or furnace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king sacrifices to five classes of those who died prematurely, while lower
    ranks sacrifice to fewer such classes.
  category: action
  evidence_refs:
  - ev:9
