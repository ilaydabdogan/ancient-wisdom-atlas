  quote: all (after the pattern of) the sacrifices of the son of Heaven.
  summary: The passage describes a great ancestral-temple sacrifice in the sixth month,
    using a white bull, specialized vessels, jade objects, offerings, music, and dance.
    It assigns ritual duties to the ruler, his wife, ministers, Great officers, and
    their wives; describes a seasonal sacrificial calendar; and states correspondences
    between the local temple, gates, court practice, ornaments, and the rites or temple
    of the son of Heaven. It also lists carriages, banners, horses, victims, vessels,
    ladles, and instruments associated with named earlier dynastic traditions.
  language: English translation
  quote_policy: quoted
