canonical_text:
  quote: ''
  summary: The passage explains ceremonies and music as modeled on heaven and earth,
    describes reciprocal natural influences and seasonal processes, and recounts Shun's
    five-stringed lute, Khwei's music for feudal lords, and the Son of Heaven's use
    of music to reward virtuous feudal lords.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Music is described as seeking harmony, following heaven, and manifesting an
    expansive influence; ceremonies are described as seeking normal distinction, following
    earth, and exhibiting a retractive influence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sages are said to have made music in response to heaven and framed ceremonies
    in correspondence with earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Relations such as ruler and minister, noble and mean, and small and great
    affairs are explained through distinctions associated with heaven, earth, heights,
    depths, movement, and repose.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The influence of earth ascends and the influence of heaven descends; their
    contact is said to make heaven and earth act on each other.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thunder, wind, rain, the four seasons, the sun, and the moon are listed as
    agents that rouse, excite, move, and warm natural processes of change and growth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Music is said to have been framed to indicate the harmonious action of heaven
    and earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Out-of-season processes are said to prevent vigorous life, and lack of distinction
