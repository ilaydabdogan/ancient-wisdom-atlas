canonical_text:
  quote: ''
  summary: The passage explains how marriage supplies assistance for sacrificial service;
    describes husband and wife performing distinct ritual duties with officials; describes
    royal ploughing and silkworm care to provide grain and silk for sacrifice; explains
    purification as ordering and restraining the mind and body; and narrates the ruler
    and wife, after separate purification, meeting in the grand temple to perform
    libations and prepare offerings before the personator of the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a son has done all he can personally for sacrifices, he seeks assistance
    from abroad through the rites of marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marriage request asks another ruler for his daughter to share the state
    and serve in the ancestral temple and at the altars of land and grain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In sacrifice, husband and wife have separate duties that they personally attend
    to, with officials belonging to exterior and interior palace departments.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sacrificial preparations include plant foods, pickles, stands for three
    victims, supplies for eight dishes, insects, fruits, and produce associated with
    heaven and earth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The son of Heaven and state princes personally guide the plough to provide
    grain for sacrificial vessels, while the queen and princes’ wives tend silkworms
    to provide silk caps and robes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says these personal labors are not due to lack of servants but
    are an exhibition of personal sincerity, doing one’s utmost, and reverence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Purification is described as making thoughts uniform, avoiding evil influences,
    suppressing desires, not listening to music, restraining vain thoughts, and keeping
    hands and feet within propriety.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The purification sequence includes seven days of looser ordering of the mind
    and three days of complete ordering, after which communion with the spiritual
    Intelligences becomes possible.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the eleventh day before the sacrifice, the governor of the palace gives
    warning notice to the ruler’s wife, who also conducts seven days of looser and
    three days of more complete ordering of her thoughts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ruler completes purification in the outer apartment and the wife in the
    inner apartment, then they meet in the grand temple.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the temple, the ruler stands in a dark-coloured square-topped cap at the
    eastern steps, while his wife stands in the eastern chamber wearing a head-dress
    and pheasant-embroidered robe.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ruler pours fragrant spirit from a mace-handled libation cup before the
    personator of the dead, and a temple minister pours a second libation for the
    wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the victim is introduced, the ruler holds it by the rope, officials follow
    with dried grass and basins, the wife presents purified liquid, the ruler prepares
    the lungs with a knife with bells, and the wife places the lungs on dishes and
    presents them.
  category: action
  evidence_refs:
  - ev:6
