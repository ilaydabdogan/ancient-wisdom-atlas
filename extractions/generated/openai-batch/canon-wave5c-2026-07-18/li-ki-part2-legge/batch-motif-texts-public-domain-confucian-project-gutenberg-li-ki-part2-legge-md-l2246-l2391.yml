canonical_text:
  quote: ''
  summary: The passage gives ritual rules for mourning, condolence visits, presiding
    mourners, changes of mourning dress while nursing the ill, placement of tablets
    for concubines and wives, grave goods, wailing at grave and house, mourning garments
    and staffs, rank-dependent offerings, and restrictions on mourning for a divorced
    mother by a son who succeeds his father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father does not preside at mourning rites for the son of a concubine; that
    son’s son may carry his staff when going to the wailing place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son of a concubine may carry a staff while mourning for his wife, even if
    his father is present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a visiting feudal prince condoles for a minister of another state before
    coffin removal, the local ruler receives him and acts as presiding mourner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The presiding mourner and visiting condoler follow rank- and timing-dependent
    rules for skin cap, starched sackcloth, full mourning dress, and mourning cincture.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person ministering to the ill does not do so in mourning clothes, and if
    the patient dies may continue to preside at the mourning rites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rules for changing mourning dress while nursing depend on whether the ill
    person is more honourable or of lower position.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A deceased concubine’s tablet may be placed by the tablet of the husband’s
    grandmother’s concubine, or by that of the grandmother if no such concubine exists,
    with a change of the sacrificial victim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: For a wife’s mourning rites, the husband or son presides at sacrifices of
    repose and at the end of wailing, while the father-in-law presides when her tablet
    is placed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An ordinary officer does not preside for a Great officer unless he is the
    direct descendant of the honoured head of their surname branch.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cousin arriving from another state before the presiding mourner removes
    mourning is received by the presiding mourner as host, but without the mourning
    cincture.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Articles displayed for burial may be partly or wholly put into the grave depending
    on whether they are many or comparatively few.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Those hurrying to mourning rites for a brother or cousin after burial first
    go to the grave and then to the house; for an acquaintance, they first wail in
    the coffin apartment and then go to the grave.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A father does not pass the night in the outside shed for mourning rites of
    sons other than his eldest son by his wife.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Brothers and cousins of a feudal prince wear unhemmed sackcloth in mourning
    for him.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: In five months’ mourning for one who died in the lowest stage of immaturity,
    the sash is made of bleached hemp with roots left on, turned back, and tucked
    in.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: When placing a wife’s tablet by that of her husband’s grandmother, the tablet
    is placed by the one who was mother of the husband’s father if there are three
    possible grandmothers.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: The sacrificial victim used when a husband’s tablet is placed by his wife’s
    depends on whether he became or ceased to be a Great officer relative to her death.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: A son who is or will be his father’s successor does not mourn for his divorced
    mother because a person engaged in mourning rites cannot offer sacrifice.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:19
  text: A wife, mother, or unmarried daughter may carry a mourning staff in specified
    family circumstances.
  category: action
  evidence_refs:
  - ev:16
