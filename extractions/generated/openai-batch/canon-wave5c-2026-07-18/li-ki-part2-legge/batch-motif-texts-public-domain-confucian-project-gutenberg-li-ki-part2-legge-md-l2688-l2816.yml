canonical_text:
  quote: ''
  summary: 'The passage explains rules of mourning, sacrifice, and lineage headship:
    non-eldest sons are restricted in ancestral sacrifice and mourning; branch lines
    have Greater and Smaller Honoured Heads; ancestral tablets are retained or removed
    according to generational rank; a ruler may appoint a family head for brothers;
    kinship determines mourning; affection for parents and honouring ancestors are
    presented as the basis for family cohesion, ancestral temples, state altars, ordered
    administration, and happiness.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment names mother's kin, husband's kin, and wife's kin, and
    gives examples of mourning performed by a minister for a ruler's kindred and by
    a concubine for the wife's kindred.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son other than the eldest does not sacrifice to his grandfather, because
    another figure is the Honoured Head who should perform that function.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A son other than the eldest cannot wear three years of mourning for his eldest
    son, because he is not the continuator of his grandfather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a non-eldest son becomes ancestor of a line, the one who succeeds him
    becomes the Honoured Head, and the next successor becomes the smaller Head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Honoured Head's tablet is not removed for a hundred generations, while
    smaller Honoured Heads' tablets are removed after five generations.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: For sons of a ruler of a state, the ruler, as proper representative of former
    rulers, appoints a full brother to be the Honoured Head for half-brothers who
    are officers or Great officers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When kinship is no longer counted, mourning is no longer worn; kinship is
    described as the bond expressed by the degree of mourning.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Affection is said to begin with the father and ascend to the ancestor, while
    consideration of what is right begins with the ancestor and descends to the deceased
    father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage gives a chain from affection for parents to honouring ancestors,
    respect for family heads, unity of kindred, dignity of the ancestral temple, importance
    of the land-and-grain altars, love of the people, ordered punishments, repose,
    sufficiency, customs, and happiness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage ends by citing an ode about glory and honour following WAn's name
    and people not tiring of his fame.
  category: speech
  evidence_refs:
  - ev:9
