canonical_text:
  quote: ''
  summary: 'The passage explains mourning rites: accompanying the coffin, returning
    as if seeking the deceased, wailing and bodily expressions of grief, offering
    a sacrifice to the disembodied parent, dwelling in a mourning shed, delaying corpse-dressing
    for three days in case life returns, and rules for caps, cinctures, infirm mourners,
    and parent-specific mourning staffs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mourners accompanying the coffin look forward eagerly as if following someone
    they cannot overtake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On returning to wail, the mourners appear disconcerted as if seeking someone
    they cannot find.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mourners enter the gate, hall, and chamber without seeing the deceased,
    who is described as gone and dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mourners wail, weep, beat their breasts, and leap before ceasing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son offers a sacrifice of repose to his parent in a disembodied state,
    hoping the shade may return and enjoy it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After completing the grave, the son does not occupy his chamber, dwells in
    the mourning shed, sleeps on rushes with a clod for a pillow, and mourns that
    the parent is outside and in the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Corpse-dressing is delayed until three days after death because the son waits
    to see whether the dead parent will return to life; the delay also allows practical
    preparations and distant kin to arrive.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A cap is not worn when the body is bared; a head cincture is worn instead.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Bald, hunchbacked, and lame mourners are excused from some ritual actions
    because infirmity prevents full performance, while sorrow remains primary.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A daughter’s wailing, weeping, breast-beating, and wounded heart, and a son’s
    wailing, weeping, sadness, and bowing to the ground, are accepted as high expressions
    of sorrow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A boy ordinarily does not wear three months’ mourning, but if he has become
    the family representative he wears the cincture and carries the staff.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: For a father the mourning staff is black bamboo; for a mother it is a square-cut
    elaeococcus branch.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The staff supports the mourner’s infirmity caused by grief, illness, and emaciation
    during mourning.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: A mourner does not use the staff while his father is alive or when walking
    in the hall; the passage presents such conduct as an expression of human feeling,
    propriety, and righteousness.
  category: action
  evidence_refs:
  - ev:11
