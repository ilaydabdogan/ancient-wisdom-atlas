canonical_text:
  quote: "“Hence the intercourse of a superior man may be compared to water, and that
    of a small man, to sweet wine.”"
  summary: The passage records sayings of the Master about sincere aid rather than
    empty speech, contrasting the superior man and the small man through the images
    of water and sweet wine. It then treats divination by tortoise-shell and stalks,
    regulated sacrifice, the sacrifices of Hau At, the ritual conduct of kings, the
    son of Heaven, princes, and men of rank, and opens “The Black Robes” with guidance
    on easy service, few punishments, loving the worthy, and hating the bad.
  language: English translation
  quote_policy: quoted
