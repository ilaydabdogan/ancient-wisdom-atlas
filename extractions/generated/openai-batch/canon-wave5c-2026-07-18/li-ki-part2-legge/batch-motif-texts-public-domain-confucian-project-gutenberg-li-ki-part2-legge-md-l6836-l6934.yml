canonical_text:
  quote: The consecration by blood of the temple building was the method taken to
    show how intercourse with the spirits was sought.
  summary: 'The passage gives ritual prescriptions and examples: completion of a blood-consecration
    at a temple; contrast between palace inauguration by feast and temple consecration
    by blood; procedures for a feudal lord sending his wife away and for a wife leaving
    her husband; an anecdote about Confucius at Shao-shih’s meal; the silk quantity
    in a marriage treaty; a wife’s first interviews with in-laws; hair-pin rules marking
    maturity; and measurements and decoration of an apron for full robes.'
  language: English
  quote_policy: quoted
