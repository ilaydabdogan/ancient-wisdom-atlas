canonical_text:
  quote: "“Music is a representation of accomplished facts.”"
  summary: The passage explains how musical instruments evoke social and military
    roles, then presents a dialogue between Confucius and Pin-mau Ai about the Wu
    performance. Confucius interprets its sounds and choreography as a ritual representation
    of king W4’s campaign against Shang/Yin, the subsequent ordering of states, homage
    to the Son of Heaven, and post-victory acts of investiture, commemoration, release,
    restoration, and relief.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bells are described as producing a clanging signal recognized by all; when
    the ruler hears them, he thinks of officers of war.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sounding-stones are described as producing a tinkling summons to discrimination,
    which may lead to death; when the ruler hears them, he thinks of officers who
    die defending the frontiers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stringed instruments are described as producing a melancholy sound associated
    with purity, fidelity, determination, and officers bent on righteousness.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bamboo instruments are described as sounding like overflowing waters and suggesting
    an assembly that gathers multitudes together.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Drums and tambours are described as producing a loud sound that excites movement
    and advances the host; the ruler thinks of leaders and commanders.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Confucius asks why the preliminary drum warning in the W4 performance lasts
    so long, and Pin-mau Ai answers that it shows the king’s anxiety for all his multitudes
    to be of one mind with him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Pin-mau Ai explains prolonged singing and strenuous pantomime movement as
    showing apprehension that some princes might not arrive in time, while violent
    arm movement and fierce stamping show that the engagement has arrived.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Pin-mau Ai says that kneeling in a particular posture and eager words about
    Shang should not be present in the W4 performance, attributing such features to
    faulty transmission by music officers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Confucius says the pantomimes’ shields held erect and firm as a hill represent
    king W4’s attitude, the violent movements represent Thai-kung’s enthusiasm, and
    kneeling at the conclusion represents peaceful government by the dukes of Aau/Adu
    and Shao.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The six movements of the performance are explained as proceeding north against
    Shang, showing Shang’s extinction, returning south, laying out the Southern states,
    assigning the dukes of Aau and Shao to left and right, and reuniting to offer
    homage to the Son of Heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the victory over Yin, king W4 proceeds to Shang, invests descendants
    of earlier rulers, appoints descendants of Yin to Sung, raises a mound over Pi-kan’s
    grave, releases the count of A%i, restores ceremonial officers, relieves the common
    people, and doubles smaller officers’ emoluments.
  category: sequence
  evidence_refs:
  - ev:5
