canonical_text:
  quote: ''
  summary: The passage explains music as necessary human pleasure that must be properly
    guided by ancient kings through named songs, words, movements, and instruments.
    It describes communal listening as producing social harmony, presents music and
    martial movement as ordering body and rank, recounts a dialogue between 3ze-kung
    and music-master Yi on songs appropriate to different moral dispositions, and
    connects correct singing and self-cultivation with responses from Heaven and Earth,
    the seasons, stars, and all things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Music is described as producing pleasure; that pleasure arises from modulated
    sounds and is embodied in bodily movements, while unsuitable conduct of the embodiment
    can lead to disorder.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancient kings appointed the tunes and words of the Ya and the Sung to
    guide music so that its notes, words, bends, swell, diminution, angles, and melody
    would give pleasure, support consideration, and stir up what was good.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the ancestral temple, rulers and ministers, high and low, listen together
    to music, and the stated result is harmony and reverence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At district and village clan meetings, old and young listen together to music
    with harmony and deference; within the family gate, kin listen together with harmony
    and affection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Music is said to discriminate and blend voices, unite instruments, combine
    parts, and unite fathers and sons, rulers and subjects, and people of the myriad
    states in harmony and love.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Listening to the Ya and Sung expands aims and thoughts, while the holding
    and brandishing of shields and axes and ordered body movements give gravity to
    carriage and correct the arrangement of ranks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Music is called the lesson of Heaven and Earth, the regulator of true harmony,
    and something human nature cannot dispense with.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ancient kings expressed joy through music and anger through armies and
    axes; when joyful, all under heaven were joyful with them, and when angry, oppressive
    and disorderly people feared them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 3ze-kung asks the music-master Yi what songs are specially appropriate to
    him, and Yi replies by repeating what he has heard rather than claiming personal
    authority.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Yi maps named song classes to moral dispositions: Sung, Ta Ya, Hsiao Ya,
    Fang, Shang, and Ki are each assigned to different types of persons, and singing
    is said to make oneself right and display virtue.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After a person has made himself right and is ready to act, Heaven and Earth
    respond, the four seasons revolve in harmony, stars and constellations observe
    their laws, and all things are nourished and thrive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Shang airs and words are said to be transmitted from the five Tis and
    remembered by the people of Shang; the Ki are said to be transmitted from the
    three dynasties and remembered by the people of Ki.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Being versed in the Shang airs is linked with decision in affairs and bravery;
    being versed in the Ki airs is linked with yielding place to others in the prospect
    of gain and righteousness.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The act of singing is described through images of high notes rising, low notes
    descending, turns resembling something broken off, and a finale resembling the
    breaking of a willow tree.
  category: attribute
  evidence_refs:
  - ev:8
