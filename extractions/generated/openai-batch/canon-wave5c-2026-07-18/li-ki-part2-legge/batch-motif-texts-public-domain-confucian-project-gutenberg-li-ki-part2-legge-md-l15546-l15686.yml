canonical_text:
  quote: ''
  summary: 'The passage gives ritual rules for the game of pitch-pot: the host and
    guest exchange formal invitations and refusals, arrows are pitched into a pot
    under the supervision of an archery official, counters and “horses” mark scores,
    cups are given to the losing side, music accompanies the game, equipment dimensions
    are specified, and young participants are admonished to maintain proper conduct.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The host carries arrows, the superintendent of archery carries the stand for
    tallies, and an attendant holds the pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host invites a guest to play using self-deprecating descriptions of the
    arrows and pot; the guest repeatedly declines and then respectfully agrees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The guest bows twice to receive the arrows, and the host and guest perform
    prescribed turning, bowing, and stationing movements.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The superintendent measures the pot’s distance from the mats, sets the tally
    stand, takes counters, and states the rule that a straight entry counts while
    an out-of-turn second throw does not.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The victor gives the vanquished a cup to drink, and the superintendent sets
    up one or more “horses” for the victor and congratulates the thrower on their
    number.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cithern-players are ordered to play “The Fox’s Head,” and the director of
    the music assents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When arrows are used up, the superintendent requests another pitch; when an
    arrow enters, he kneels and places a counter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Guest partners stand on the right and host partners on the left.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: After pitching ends, the superintendent counts counters by doubles and singles
    and announces which side has the advantage or whether left and right are equal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cups are filled and passed; those required to drink kneel and receive the
    drink, while the victors kneel and state that they refresh them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The “horses” of the victorious side are displayed, may be transferred to congratulate
    a superior score, and are then removed after the customary cup goes round.
  category: sequence
  evidence_refs:
  - ev:10
