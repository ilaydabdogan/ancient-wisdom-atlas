canonical_text:
  quote: ''
  summary: The passage prescribes ranked mourning and burial rites for rulers, Great
    officers, and common officers. It describes ornaments on catafalques, conveyance
    and lowering of coffins, coffin-shell materials, spacing between coffin and shell,
    and whether the shell is lined or accompanied by baskets of yii. The prescriptions
    differ by social rank in materials, colors, number of ropes, supports, images,
    and ceremonial restraint during lowering into the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ruler’s catafalque is described with dragon curtains, three gutter-spouts,
    pheasant ornaments, axe-head figures, the symbol of discrimination repeated three
    times, flames repeated three times, a white silk roof, a false covering with purple
    ties, five-color ornaments, shell rows, feather streamers, jade-symbols, fish
    figures at gutter ends, and purple supports and ropes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Great officer’s catafalque has painted curtains, two gutter-spouts, no fluttering
    ornaments, painted flames repeated three times, three symbols of discrimination,
    purple and deep-blue ties, three-color top ornaments, three rows of shells, feather
    streamers, fish figures, and purple/deep-blue supports and ropes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A common officer’s catafalque has plain linen curtains, a sloping roof, one
    gutter-spout, fluttering pheasants on the bands, purple and black ties, three-color
    top ornaments, one row of shells, two feather streamers from a painted frame,
    plumage-topped staffs, purple front supports, black rear supports, and purple
    sustaining ropes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Burial conveyance differs by rank: a ruler’s coffin uses a bier, four ropes,
    two pillars, and a shade with pendent feathers; a Great officer’s uses two ropes,
    two pillars, and a reed of white grass; a common officer’s uses a state carriage,
    two ropes, no post, and the shade of merit after leaving the residence.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When coffins are let down into the grave, ropes are removed from posts and
    pulled with backs to the posts; a ruler’s coffin also uses levers and is lowered
    to drum sound without crying out, while Great officer and common officer rites
    regulate or stop wailing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The outer shell of a ruler’s coffin is pine, that of a Great officer is cypress,
    and that of another officer is made of various kinds of wood.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The surface between coffin and shell is described by rank as sufficient to
    contain a music stopper for a ruler, a vase for water for a Great officer, and
    a jar of liquor for a common officer.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a ruler’s rites the shell is lined and baskets of yii are present; in a
    Great officer’s rites the shell is not lined; in a common officer’s rites there
    are no baskets of yii.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A note states that the nature of the baskets of yii is uncertain to the translator
    and cited editors.
  category: other
  evidence_refs:
  - ev:9
