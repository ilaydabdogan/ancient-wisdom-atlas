canonical_text:
  quote: ''
  summary: A ritual-code passage gives rules for mourning relations, including conditional
    mourning for a stepfather, the place and orientation for wailing for a friend,
    an exception to burial-site divination, rank-ordered placement of ancestral tablets,
    mourning obligations for kin and concubine-line relations, delayed interment,
    mourning attire and implements, and sacrifices with divination at the end of mourning
    periods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son wore mourning for a stepfather only under stated conditions of co-residence,
    absence of sons to preside at mourning rites, and the stepfather sharing resources
    and enabling sacrifices to the son’s grandfather and father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: People wailing for a friend did so outside the door of the principal apartment,
    on its left side, facing south.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When burial was made in an already occupied grave, no divination was performed
    about the site for the second burial.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ancestral tablets were assigned to shrines according to status and kinship
    rules, including distinctions among ordinary officers, Great officers, feudal
    lords, lords of states, and the son of Heaven.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A concubine’s son reared by another could act as son to that other; a nursing
    mother or concubine who was a mother did not receive maintained sacrifice for
    a second generation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the sacrifice after the first year of mourning, divining stalks were consulted
    about both the day and the personator of the deceased; officers checked cleanliness,
    dress, staffs, and hempen-string shoes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During delayed interment, the presiding mourner alone continued wearing mourning
    continuously; others completed the proper months, put off mourning, and kept it
    for the eventual interment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: An unmarried daughter mourning her father wore an arrow-bamboo hair-pin to
    the end of the three years’ mourning.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Those in three-month even-edged sackcloth and those in nine-month mourning
    shared the use of shoes made from hempen strings.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: A lineal head of a new branch completed the full period of mourning for his
    wife, and several other rules specify whether mourning was or was not worn for
    particular kin.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A son of a concubine living in the same house with his father did not observe
    the end-of-mourning sacrifice for his mother and did not carry his staff when
    going to his place for wailing.
  category: action
  evidence_refs:
  - ev:10
