canonical_text:
  quote: ''
  summary: 'The passage gives ritual rules for mourning: food, illness, bathing, clothing,
    social visits, public duties, wailing, name avoidance, capping, marriage, and
    music are regulated according to mourning duration, kinship, and ritual stage.
    Confucius and other named interlocutors are cited on the limits of self-denial
    and the expression of grief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During mourning, the mourner is required to eat enough even if the food is
    bad; both neglect through hunger and forgetfulness of sorrow through satiety are
    contrary to the rules.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rules allow wine or liquor and flesh for ill or older mourners as measures
    intended to prevent death or harmful emaciation.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:3
  text: A mourner invited to eat with another person is restricted by mourning duration,
    burial status, and whether the host belongs to the mourner's relative circle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: During nine months' mourning, permitted food and drink include vegetables,
    fruits, water, and congee, normally without salt or cream.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Confucius states that sores, head wounds, and illness should be treated by
    bathing, washing, and by drinking liquor and eating flesh when ill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mourning cap is not worn on the road except when following the bier to
    the grave and returning from it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: For mourning of five months or more, washing the head or bathing is restricted
