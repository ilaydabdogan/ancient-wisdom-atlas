canonical_text:
  quote: ''
  summary: The passage praises Kung-ni and the ideal sage or superior man as one who
    receives ancient models, conforms to heaven, seasons, water, and land, and is
    compared to heaven and earth, the seasons, sun and moon, a fountain, and an abyss.
    It describes sagely qualities fitted for rule, universal reverence for the perfected
    person, the concealment and manifestation of virtue, inner self-examination, wordless
    reverence, and non-coercive transformation of the people.
  language: English
  quote_policy: summarized
