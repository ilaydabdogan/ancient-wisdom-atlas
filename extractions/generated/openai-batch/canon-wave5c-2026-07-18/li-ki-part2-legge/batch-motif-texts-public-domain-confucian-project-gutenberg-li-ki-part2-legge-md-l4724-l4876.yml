canonical_text:
  quote: ''
  summary: The passage presents a dialogue in which the marquis Wan of Wei asks 3ze-hsia
    why ancient music makes him sleepy while newer regional music does not. 3ze-hsia
    contrasts orderly ancient music, associated with virtue, antiquity, family regulation,
    social hierarchy, and sacrifices, with disorderly new or vile airs, which he says
    corrupt and disturb the mind. He links true music to cosmic and social order,
    to the work of sages, to reverent ancestral ritual, and to the ruler's responsibility
    for shaping the conduct of ministers and inferiors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that virtue is superior to art or technical performance,
    and that ancient kings distinguished superior from inferior and first from last
    in order to frame music and ceremonies for the kingdom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marquis Wan of Wei says that ancient music makes him fear he will fall
    asleep, while the music of Kang and Wei does not make him tired, and he asks why.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: '3ze-hsia describes old music as orderly: performers advance and retire together,
    instruments wait for the drum, the music begins with the drum and ends with cymbals,
    and other instruments regulate closure and motion.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 3ze-hsia says that in old music the superior man follows the way of antiquity,
    character is cultivated, the family is regulated, and peace and order are secured
    throughout the kingdom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 3ze-hsia describes new music as lacking regular order, being corrupt, mixing
    boys and girls, and failing to maintain the distinction between father and son.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 3ze-hsia distinguishes music from sound, saying that they are akin but not
    the same.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 3ze-hsia describes an ancient period in which Heaven and Earth acted according
    to their natures, the seasons were proper, people were virtuous, cereals were
    abundant, and diseases and prodigies were absent.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: 3ze-hsia says sages established duties between father and son and between
    ruler and subject, adjusted social rules, framed musical accords and notes, and
    produced virtuous airs called Music.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A quoted poem says that king Wan's virtue was intelligent and discerning,
    that he ruled a great country, and that he received the blessing of God extended
    to his descendants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 3ze-hsia identifies the airs of Kang, Sung, Wei, and Ai as disturbing or debauching
    the mind, stimulating libidinous desire, injuring virtue, and being unfit for
    sacrifices.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A quoted poem says that instruments give forth notes in solemn unison and
    that ancestors will hearken to them; 3ze-hsia interprets this as grave reverence
    and harmony.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: 3ze-hsia says that a ruler must be careful about likes and dislikes because
    ministers practice what the ruler likes and inferiors follow superiors.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The sages made six instruments for virtuous airs, later added other instruments
    and ritual dance objects, and used them in sacrifices at the temple of the former
    kings, at pledge-cup festivals, and in arranging officers by rank.
  category: action
  evidence_refs:
  - ev:10
