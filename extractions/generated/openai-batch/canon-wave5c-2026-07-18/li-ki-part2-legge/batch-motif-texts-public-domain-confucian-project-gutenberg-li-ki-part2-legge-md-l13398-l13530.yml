canonical_text:
  quote: ''
  summary: A didactic passage contrasts affection and honour through father, mother,
    elemental and cosmic analogies; compares Hsia, Yin, and Aau dynastic methods of
    governing people and serving spirits or ancestors; praises the Ti of the line
    of Yii as an ideal ruler who treated the people as children and governed by virtue;
    and begins a statement on a minister’s pledged service to a ruler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father is said to love worthy sons and place less able sons on a lower level,
    while a mother loves the worthy and pities those who lack ability.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts the mother as acting from affection rather than honour
    and the father as acting from honour rather than affection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Water, ground, and the conferred nature are described as manifesting affection
    without giving honour; fire, Heaven, and the manes of the departed are described
    as giving honour without manifesting affection.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Under Hsia, the text says people honoured the conferred nature, served departed
    manes, respected Spiritual Beings while keeping them at a distance, brought the
    people near, and prioritized emolument and rewards over power and punishments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Under Yin, the text says people honoured Spiritual Beings, led the people
    to serve them, put service of manes before ceremonial usages, and placed punishments
    before rewards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Under Aau, the text says people honoured ceremonial usages, valued bestowing
    favours, served manes and respected Spiritual Beings while keeping them at a distance,
    brought the people near, and used distinctions of rank in rewards and punishments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says Hsia did not trouble the people with many notices or require
    everything from them, Yin did not trouble the people with ceremonies but required
    everything from them, and Aau was rigorous with the people while not troublesome
    in services to spirits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Master says the plain and simple ways of Yii and Hsia and the multiplied
    forms of Yin and Au were both extreme.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ti of the line of Yii is said to have ruled all under heaven without selfish
    thought and not to have made his son great with the inheritance when he died.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ti of the line of Yii is said to have treated the people as sons, as if
    he were their father and mother, and to have combined affection with honour, majesty
    with love, riches with propriety, and kindness with proper distribution.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A minister serving a ruler is described as first offering counsel, then bowing
    and voluntarily offering his person to make good his sincerity; the minister may
    die in support of his words.
  category: action
  evidence_refs:
  - ev:7
