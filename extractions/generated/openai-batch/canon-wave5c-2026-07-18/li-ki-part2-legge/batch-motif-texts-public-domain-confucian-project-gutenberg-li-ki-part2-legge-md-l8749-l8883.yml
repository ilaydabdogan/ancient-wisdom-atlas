canonical_text:
  quote: ''
  summary: 'A question about the names kwei and shan leads to an explanation of paired
    elements of the human constitution after death: the body and animal soul return
    to earth, while the spirit is displayed above. The passage then describes how
    sages used these names, temples, tablets, offerings, royal ploughing, sacrificial
    animal selection, and mulberry-silkworm rites to organize ancestral reverence,
    ritual service, and filial duty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wo asks what the names kwei and shan mean.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says the intelligent spirit is of the shan nature, the animal soul
    is of the kwei nature, and their union forms a high exhibition of doctrine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says all living beings die and return to the ground; bones and
    flesh moulder below and become earth of the fields.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the spirit issues forth and is displayed on high in brightness,
    while vapours and odours from decay are subtle essences and a manifestation of
    shan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sages framed the names kwei and shan as a pattern for the black-haired
    race, and the multitudes were filled with awe and submission.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sages built temples with apartments and made rules for ancestors always
    to be honoured and for tablets to be removed, distinguishing nearer and more distant
    kinship and remote and recent ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ancestral rules taught people to go back to their oldest fathers, retrace
    their beginnings, and not forget those to whom they owed their being.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A morning service burned the fat of the inwards for fragrance and mixed it
    with the blaze of dried southern-wood as a tribute to the intelligent spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Millet, rice, parts of animals, two bowls of liquor, and odoriferous spirits
    were presented as a tribute to the animal soul and were said to teach mutual love
    and good feeling between high and low.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The superior man is described as reverently performing the service with full
    feeling and strength as gratitude to his parents.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The son of Heaven and feudal princes personally ploughed ritual fields while
    wearing specified caps, supplying new wine, cream, and grain vessels for service
    to Heaven, Earth, the spirits of land and grain, and ancient fathers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The son of Heaven and feudal lords had officers for animals; after vigil,
    fasting, washing, and bathing, they personally visited the animals and selected
    spotless and perfect victims.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The ruler ordered oxen brought, inspected them, chose them by hair, divined
    whether their use would be fortunate, had them cared for if the response was favourable,
    and inspected them on the first and middle days of the month.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The ruler had mulberry trees and a silkworm house near a river; he divined
    for auspicious honourable ladies, who took silkworms into the house, washed seeds
    in the stream, gathered mulberry leaves, dried them in the wind, and fed the worms.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
