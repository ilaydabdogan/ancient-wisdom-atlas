canonical_text:
  quote: ''
  summary: Duke Ai questions Confucius about the honor given to rites, the practice
    of government, and the securing of key social relations. Confucius explains rites
    as regulating service to spirits and human relationships, contrasts ancient ritual
    austerity with contemporary extravagance, defines government as rectification,
    and presents reverent marriage as an illustration of love and respect underlying
    government.
  language: English
  quote_policy: summarized
