canonical_text:
  quote: ''
  summary: 'The passage gives rules and explanations for mourning practice: mourners
    retain mourning dress when visiting, mourning occasions are organized into five
    grades of dress, and subsidiary mourning usages regulate headbands, sackcloth,
    wailing, speech, fasting, diet, sacrifices, sleeping places, and changes in the
    mourning shed according to relationship and duration of mourning.'
  language: English
  quote_policy: summarized
