canonical_text:
  quote: ''
  summary: In BOOK XXVII, FANG or Record of the Dykes, the Masters and the Master
    describe rites, punishments, Heaven's allotments, rank distinctions, dress, carriage
    rules, seating, and deferential speech as restraining devices that conserve virtue,
    prevent disorder, maintain hierarchy, and teach humility among the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the ways laid down by superior men are compared to
    dykes, and that ceremony, punishments, and declared allotments serve as conserving
    or blocking restraints.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:2
  text: The Master says that poverty may lead the small man to stealing, while wealth
    may lead to pride and disorder, and that rules of propriety provide definite regulations
    for such conditions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives numerical limits for states, chief city walls, and wealthy
    families, and says that some lords of states rebelled against these regulations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says that ceremony displays doubtful matters, distinguishes minute
    matters, establishes grades, dress distinctions, and court places, and teaches
    people to give place to one another.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master says there are not two suns in the sky, two kings in a territory,
    two masters in a family, or two superiors of equal honour, and uses this to maintain
    the ruler-subject distinction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Master says a ruler does not ride in the same carriage with those of the
    same surname, and wears different dress when riding with those of a different
    surname, in order to avoid suspicion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Master says the superior man declines high honour and riches, prefers
    worth above emoluments, exalts others, abases himself, and takes the last place.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:8
  text: The passage discusses yielding in small ritual allotments, seating mats, and
    court places, while noting that people may try to obtain more than is due or occupy
    places due to rank.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The passage cites the Book of Poetry twice: once concerning people desiring
    disorder and poisonous ways, and once concerning disputation, refusal of conscience,
    rank, disdain, wrangling, and ruin.'
  category: speech
  evidence_refs:
  - ev:3
  - ev:8
