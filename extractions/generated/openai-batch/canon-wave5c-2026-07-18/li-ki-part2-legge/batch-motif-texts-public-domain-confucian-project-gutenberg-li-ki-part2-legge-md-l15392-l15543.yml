canonical_text:
  quote: ''
  summary: The passage explains regulated periods of mourning, especially the three-year
    mourning for a parent, by reference to kinship, grief, heaven and earth, the four
    seasons, and Confucius' statement about parental care. It then describes the ancient
    long dress, its measured construction, calendrical correspondence, moral symbolism,
    and family-status borders.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts men governed by depraved desires with proper kinship
    conduct, saying such a person would forget a kinsman by evening if the kinsman
    died in the morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The superior man is described as attending to the methods by which grief is
    expressed; for such a person, the twenty-five months of three-year mourning seem
    to pass very quickly, and continued grief would be inexhaustible.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ancient kings are said to have fixed a proper medium and definite terms
    for mourning, laying it aside once the varied feeling had been sufficiently expressed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A one-year break in mourning is explained through the completed round of heaven
    and earth, the four seasons' changes, and all things beginning anew; the mourning
    rules are said to resemble this pattern.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Three years' mourning for a parent is explained as an enlarged and more impressive
    period that doubles the time and embraces two round years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Mourning periods are ranked: three years as the highest expression of grief,
    three and five months as the lowest, and one year and nine months as intermediate.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Heaven above, earth beneath, and man between are presented as example, law,
    and pattern for human kinship harmony and unity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Confucius states that a son ceases to be carried in his parents' arms three
    years after birth, and that three years' mourning is the universal rule under
    heaven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ancient long dress is described as having definite measurements based
    on the compass, square, line, balance, and steelyard, and as being neither too
    short nor too long.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The garment used twelve strips of cloth corresponding to the twelve months;
    its sleeve was round, its neck opening square, its back seam straight, and its
    bottom edge even.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The garment's straight, square, and even features are said to admonish the
    wearer toward correct government, righteousness, calmness, and impartiality.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'The dress border changes according to family status: embroidered when parents
    and grandparents live, blue when only parents live, and white for an orphan son.'
  category: relationship
  evidence_refs:
  - ev:11
