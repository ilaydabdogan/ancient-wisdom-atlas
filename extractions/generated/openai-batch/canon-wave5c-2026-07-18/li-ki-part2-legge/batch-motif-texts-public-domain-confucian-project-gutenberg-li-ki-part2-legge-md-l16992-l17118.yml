canonical_text:
  quote: ''
  summary: 'The passage explains a country-district drinking ceremony: host and guest
    exchange bows, yield precedence, purify hands and cup, share drink, and are seated
    according to a scheme that encodes honor, humility, purity, respect, social harmony,
    cosmic correspondences, directional winds, and sage-established virtue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The president receives the coming guest outside the college gate; they enter,
    salute each other three times, yield precedence three times at the steps, and
    ascend.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host washes his hands, rinses and raises the cup, and bows occur at the
    guest’s arrival, the washing, the receiving and returning of the cup, and after
    the drinking is complete.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the ceremony carries mutual demonstrations of honour,
    humility, purity, and respect to the utmost.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says that honour, humility, purity, and respect prevent contention,
    rudeness, quarrels, disputations, violence, disorder, and calamity from other
    people; sages instituted the observances for this result.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A vessel of liquor is placed between the eastern room and the western door,
    and host and guests share it; the vessel contains dark-coloured liquor described
    as pure water and as showing simplicity.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Viands come from the eastern room, and washing takes place in the courtyard
    opposite the eastern wing, showing that the host purifies himself and prepares
    to serve the guests.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The principal guest and the host are said to represent heaven and earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The attendants of the guest and host are said to represent natural forces
    in contracting and expanding operations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The three heads of the guests represent the three luminaries; the thrice-yielded
    precedence represents the three days when the moon is invisible before reappearing;
    the four-sided seating represents the four seasons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The cold wind beginning in the south-west and strongest in the north-west
    is associated with severity and righteous justice, while the warm wind beginning
    in the north-east and strongest in the south-east is associated with abundant
    virtue and benevolence; the guest, host, and their attendants are seated according
    to these directions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says that the arrangements arise from sage intelligence, become
    ceremonial usage when carried out with respect, mark distinctions between old
    and young, and become virtue.
  category: sequence
  evidence_refs:
  - ev:6
