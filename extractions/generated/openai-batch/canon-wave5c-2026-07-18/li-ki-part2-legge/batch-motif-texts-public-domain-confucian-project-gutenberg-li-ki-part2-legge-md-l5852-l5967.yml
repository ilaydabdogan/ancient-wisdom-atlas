canonical_text:
  quote: ''
  summary: 'A ritual passage describes emissaries from a ruler visiting a mourning
    household, delivering condolences and presenting funerary items: jade for the
    mouth of the deceased, grave-clothes, carriage and horses, and a request to join
    the wailing rites. The passage emphasizes prescribed movements, orientations,
    bows, placement of gifts near the coffin, and formal exchanges of speech.'
  language: English translation
  quote_policy: summarized
