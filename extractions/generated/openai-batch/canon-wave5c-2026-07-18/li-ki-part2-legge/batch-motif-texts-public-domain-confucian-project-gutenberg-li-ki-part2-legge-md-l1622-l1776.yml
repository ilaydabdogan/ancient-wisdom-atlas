  quote: ''
  summary: The passage gives rules for mourning dress, mourning gestures, ritual presiders,
    lineage-based degrees of mourning, direct-line sacrifice, and ancestral shrine
    order, including royal ancestral sacrifice and branch-line succession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son wearing unhemmed sackcloth for a father or mother ties his hair with
    a hempen band; in the mourning for a mother, this band may be exchanged for a
    linen cincture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wife in one-year sackcloth mourning with even edges has a matching girdle
    and an inferior hazel-wood hair-pin, which she wears until the end of mourning.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ordinarily men wear caps and women hair-pins; in mourning, men wear cinctures
    and women wear a corresponding female form, maintaining a distinction between
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage names a dark-colored bamboo staff and a pared eleococca-wood staff;
    the note says the bamboo staff was for mourning a father and was supposed to symbolize
    heaven, while the other was for mourning a mother and symbolized earth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a grandfather has died and the grandson represents the family through
    the death of his father, the grandson mourns his grandmother for three years.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The eldest son, an ordinary officer receiving a Great officer, and a wife
    mourning a husband or eldest son perform a head-to-ground gesture before saluting
    a visitor in specified mourning contexts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The male presider at mourning rites is required to share the surname of the
    deceased parent, while the wife employed as presider is of a different surname.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A son who is his father's successor as head of the family does not wear mourning
    for his divorced mother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The counting of kindred expands from three close degrees to five and then
    nine; mourning decreases with ascending, descending, and collateral distance and
    then comes to an end.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the great royal sacrifice to all ancestors, precedence is given to the
    source ancestor of the founder's line, with the founder as assessor; this establishes
    four ancestral shrines, and the same procedure is used if a son by someone other
    than the queen becomes king.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When a non-eldest son becomes ancestor of a branch line, successors are named
    Honoured Head and smaller Honoured Head; after five generations there is a change
    of Honoured Head while continuity with the High Ancestor remains.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Only the eldest son sacrifices to his grandfather and wears three-year unhemmed
    sackcloth for his eldest son, because his line continues the grandfather and father.
  category: action
  evidence_refs:
  - ev:12
