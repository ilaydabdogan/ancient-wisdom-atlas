canonical_text:
  quote: ''
  summary: The passage gives rules for gift-giving, offerings to rulers, rank-based
    obeisance, indirect speech toward superiors, filial obedience, mourning responses
    to parental objects, gate and threshold etiquette, and regulated walking postures
    for rulers, officers, and a representative of the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A recipient of a gift bows with head and hands to the ground; a gift of liquor
    and flesh does not require a second expression of thanks by a visit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a gift is conferred on a man of rank, nothing is given to a small man
    on the same day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Offerings to a ruler are sent by a Great officer through his steward, while
    an ordinary officer goes with them himself; both forms involve twice doing obeisance
    with heads to the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prepared food offerings for the ruler are accompanied by ginger or other pungent
    vegetables, a peach-wood item, and a sedge-broom, with some rank-based omissions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great officer does not personally enter to make obeisance because the
    ruler might come to respond to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Recipients of gifts perform follow-up obeisance according to rank and relationship,
    including visits to the donor's house in some cases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person presenting an offering to a superior does not directly say that the
    offering is for the superior.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In exchanges of courtesies, a person whose father is alive appeals to the
    father's authority and may say he makes obeisance for his father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A son responds immediately to his father's summons, lays aside work, ejects
    food from his mouth, and runs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After his father's death, a son cannot bear to read the father's books; after
    his mother's death, he cannot bear to drink from vessels she used.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: At a ruler's gate entry, attendants dust or brush posts, Great officers stand
    in specified positions, and a mission officer avoids the middle of the gate and
    the threshold.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Walking forms are differentiated for the ruler and representative of the dead,
    Great officers, ordinary officers, and rapid or slow movement.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note in the passage associates the grand carriage and grand fur-robe with
    the solstitial sacrifice to Heaven.
  category: setting
  evidence_refs:
  - ev:5
