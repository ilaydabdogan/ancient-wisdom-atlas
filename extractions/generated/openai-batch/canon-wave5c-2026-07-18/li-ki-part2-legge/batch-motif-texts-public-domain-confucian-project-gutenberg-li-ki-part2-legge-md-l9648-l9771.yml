  quote: The first and greatest teaching is to be found in sacrifice.
  summary: The passage presents sacrifice as a ritual and moral institution that instructs
    conduct, orders ten relationships, mediates communion with spirits, distinguishes
    ruler and subject, illustrates father and son, ranks participants, orders kinship
    descent, and authorizes rank and reward in the ancestral temple.
  language: English
