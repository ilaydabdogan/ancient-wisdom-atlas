canonical_text:
  quote: ''
  summary: The passage states ritual rules for burial, sacrifice, and mourning across
    ranks; presents the Master’s praise of king Wd and the duke of Kau for filial
    piety shown through ancestral temple rites; connects border and ancestral sacrifices
    with the ability to rule; and records Duke Ai asking about government, with the
    Master answering that government depends on proper men, the ruler’s character,
    the right course, benevolence, and righteousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Burial and sacrificial ceremonies are described as varying according to the
    offices held by father and son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One year’s mourning is said to extend up to Great officers, three years’ mourning
    to the son of Heaven, and mourning for father or mother is said to be the same
    for noble and mean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master defines filial piety as skillfully carrying out the wishes and
    continuing the undertakings of forefathers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring and autumn, king Wd and the duke of Kau repair and beautify ancestral
    temple-halls, set out ancestral vessels, display dresses, and present seasonal
    offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ancestral temple ceremonies arrange ancestors by father-son order and arrange
    living participants by rank, services by talent and virtue, pledging by inferior-to-superior
    presentation, and feast places by age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the general pledging ceremony, inferiors present the cup to superiors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the ritual performers occupy the places of their forefathers,
    practice their ceremonies, perform their music, and serve the dead as they served
    them when alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Border sacrifices to Heaven and Earth are described as serving God, while
    ancestral temple ceremonies are described as sacrifices to forefathers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master says that understanding the border sacrifices and ancestral temple
    sacrifices would make ruling a state as easy as looking into one’s palm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Duke Ai asks about government, and the Master replies that the government
    of Wan and Wd is exhibited in records on tablets of wood and bamboo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Master says government flourishes with the right men and ceases without
    them, comparing its growth with vegetation and an easily growing rush in the earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Master says government depends on proper men, proper men on the ruler’s
    character, character on the right course, and the right course on benevolence;
    he also links benevolence with love of relatives and righteousness with honoring
    the worthy.
  category: speech
  evidence_refs:
  - ev:6
