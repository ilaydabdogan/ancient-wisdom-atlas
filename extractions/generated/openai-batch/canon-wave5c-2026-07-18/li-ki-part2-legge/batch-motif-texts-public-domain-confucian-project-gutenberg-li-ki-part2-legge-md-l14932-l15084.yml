canonical_text:
  quote: ''
  summary: A prescriptive ritual passage sets out questions about mourning dress.
    It lists cases where mourning obligations differ according to kinship, rank, and
    marital status; gives rules for mourning relatives of a divorced, deceased, or
    replacement mother; describes changes of sashes, headbands, caps, sackcloth, linen,
    and other garments during overlapping mourning periods; and specifies mourning
    duties for rulers, heirs, ministers, officers, and household attendants.
  language: English
  quote_policy: summarized
