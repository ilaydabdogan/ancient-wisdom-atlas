  quote: ''
  summary: The passage prescribes ritual clothing, court routines, meals, music, animal
    offerings, austerities during bad harvest or drought, restrictions on slaughter,
    and a tortoise-shell divination procedure for the Son of Heaven, princes or rulers,
    officials, and ritual functionaries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Son of Heaven, when sacrificing, wears a cap with twelve long jade-bead
    pendants hanging before and behind, and a robe embroidered with dragons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Son of Heaven wears dark-coloured square-cut robes when saluting the appearance
    of the sun outside the eastern gate and when listening to the notification of
    the first day of the month outside the southern gate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In an intercalary month, the Son of Heaven causes the left leaf of the door
    to be shut and stands in the middle of the opening that remains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At daily audience the Son of Heaven wears the skin cap, then takes the morning
    meal; his meals include music, daily sheep and pig, an additional ox on the first
    day of the month, and five beverages with water named principal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After eating, the Son of Heaven remains at ease in dark-coloured square-cut
    robes; a recorder of the Left writes down his actions, a recorder of the Right
    writes down his utterances, and a blind musician judges whether the music is too
    high or too low.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the year is not good and fruitful, the Son of Heaven wears white plain
    robes, rides in a plain unadorned carriage, and has no music at meals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Princes of states have prescribed clothing for sacrificing, royal court-audiences,
    notifications of the first day of the month, and daily audience in the inner court-yard.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ministers and officers enter as dawn becomes visible; the ruler receives them,
    then listens to proposals about government and checks whether the Great officers
    have withdrawn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ruler resumes court robes to eat; prescribed animals, dishes, grain, and
    an evening flesh offering are named, and on the first day of the moon more animals
    and dishes are provided.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The ruler's wife uses the same kitchen as the ruler.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Without cause, a ruler does not kill an ox, a Great officer does not kill
    a sheep, and a lower officer does not kill a pig or dog.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A superior man keeps shambles and kitchen at a distance from the house and
    does not tread where there is blood or tainted air.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the eighth month arrives without rain, the ruler does not have full meals
    or music; if the year is not abundant, levies, contributions, earthworks, and
    new carriages for Great officers are restricted.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: In tortoise-shell divination, the divination officer fixes the shell, the
    recorder applies ink, and the ruler determines the figures produced by fire.
  category: sequence
  evidence_refs:
  - ev:12
