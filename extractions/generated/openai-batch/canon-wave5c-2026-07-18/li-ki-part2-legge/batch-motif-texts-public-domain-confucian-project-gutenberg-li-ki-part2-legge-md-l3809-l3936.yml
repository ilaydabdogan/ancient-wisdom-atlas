canonical_text:
  quote: ''
  summary: The passage explains music and voice as expressions of mental states and
    as indicators of political order or disorder. It describes ancient kings instituting
    ceremony, music, law, and punishment to harmonize the people, maps five musical
    notes onto ruler, ministers, people, affairs, and things, and presents knowledge
    of music and ceremony as a mark of virtue. It also includes an opening note on
    pantomimic war and peace performances and a closing fragment on music, sacrifice,
    and Khing Miao lutes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pantomimic exhibition presents war scenes through performers brandishing
    shields and axes, and peace scenes through performers waving plumes and ox-tails.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six states of mind—sorrow, pleasure, joy, anger, reverence, and love—are each
    linked with a distinct quality of sound.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The six sound qualities are said not to be natural in themselves, but to indicate
    impressions produced by external things.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ancient kings are described as watchful about the things by which the mind
    is affected.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ceremonies, music, laws, and punishments are presented as instruments for
    directing aims, harmonizing voices, unifying conduct, guarding against evil tendencies,
    assimilating minds, and making good government appear.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Modulations of voice are said to spring from human minds; feelings move within,
    manifest in sounds, and combined sounds form airs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Airs of an age of good order indicate composure and enjoyment; airs of disorder
    indicate dissatisfaction and anger; airs of a state going to ruin express sorrow
    and troubled thought.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The five notes are mapped onto political and worldly categories: kung to
    the ruler, shang to ministers, io to the people, ih or kih to affairs, and yii
    to things.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Irregularities in the five notes are associated with corresponding failures
    in ruler, offices, people, affairs, resources, and the possible extinction of
    the state.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The airs of Kang, Wei, and the area near the river Po at the mulberry forest
    are described as airs of disorder or of a state going to ruin.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Beasts are said to know sound but not its modulations; common people know
    modulations but not music; only the superior man can truly know music.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The passage gives a sequence of discernment: sounds are discriminated to
    know airs, airs to know music, and music to know the character of government.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: One who apprehends both ceremonies and music may be called a possessor of
    virtue.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that the greatest achievements of music are not in perfect
    airs, and the efficacy of sacrificial offerings is not in exquisite flavors.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Khing Miao lutes are described as having red boiled-silk strings and wide-spaced
    holes; the passage fragment says that one lute began.
  category: object
  evidence_refs:
  - ev:9
