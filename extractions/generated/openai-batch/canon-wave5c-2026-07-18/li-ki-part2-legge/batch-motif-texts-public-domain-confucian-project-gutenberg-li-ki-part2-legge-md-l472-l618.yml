  quote: ''
  summary: The passage gives ritual and rank-based regulations for clothing, furs,
    outer jackets, official tablets, girdles, knee-covers, and emblems. It distinguishes
    the dress and implements of the son of Heaven, rulers, feudal lords, Great officers,
    ordinary officers, scholars, and youths; it also describes when ornaments are
    displayed or covered, especially in mourning, before the ruler, in temples, and
    in official business.
