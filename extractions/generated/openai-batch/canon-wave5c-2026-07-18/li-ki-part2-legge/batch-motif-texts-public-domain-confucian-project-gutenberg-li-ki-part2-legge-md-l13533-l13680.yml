canonical_text:
  quote: ''
  summary: 'A sequence of sayings attributed to the Master gives norms for serving
    a ruler: proper speech, remonstrance, office-holding, withdrawal, ritual advance
    and retreat, obedience bounded by order and right, and the relation between Heaven’s
    appointment of the Son of Heaven and officers’ appointments by rulers. The passage
    also includes editorial remarks questioning the section’s genuineness and noting
    that some sentiments are judged more Taoistic than Confucian.'
  language: English
  quote_policy: summarized
