canonical_text:
  quote: ''
  summary: 'The passage gives detailed ritual prescriptions for mourning: sleeping
    restrictions, graded mourning fabrics and garments, the sequence for putting off
    mourning, rules for overlapping mourning obligations, and an explanation of three-year
    mourning as an unchanging rule grounded in human feelings, social relations, and
    extreme grief. It ends by comparing human grief for kindred with birds and beasts
    that linger or cry after losing a mate.'
  language: English
  quote_policy: summarized
