  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When mourning obligations overlap, the lighter mourning may be included under
    the heavier one, bands may be worn together, and the lighter item is changed first.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The three-year mourning rules are said to be established in harmony with feelings
    and to distinguish social relations, kinship distance, and rank; they are called
    unchanging rules.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage lists sackcloth, dark color, a staff, a wall-side shed, gruel,
    sleeping on straw, and a clod of earth for a pillow as forms that set forth extreme
    grief.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The three-year mourning is said to end effectively at the close of the twenty-fifth
