canonical_text:
  quote: ''
  summary: The passage gives ethical sayings attributed chiefly to the Master about
    degrees of humanity, righteousness, virtue, proper conduct, and the superior man.
    It uses metaphors of paths, a heavy vessel, a long road, a scale, poetic images,
    and ritual dress to explain moral effort and social regulation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes a perfect path, a righteous path, and a calculated
    path, assigning them respectively to sovereignty, chieftaincy, and freedom from
    error and failure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note adduces the duke of KAu as a case of error caused by brotherly love
    when he promoted brothers who afterwards joined rebellion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says humanity has various degrees, righteousness varies in measure,
    deep compassion is evidenced in love of others, and following old examples with
    vigorous endeavour employs humanity for the occasion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master interprets cited verses as showing humanity extending to many generations
    in one case and only to the end of the speaker's life in another.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master compares humanity to a heavy vessel that cannot be sustained by
    one who lifts it and to a long road that cannot be fully completed by one who
    travels it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The superior man is described as measuring men with the scale of righteousness
    and comparing people to know who is more worthy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master says only a rare person naturally rests in humanity and that the
    path of humanity should be pursued without giving over until death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master says perfect humanity has long been difficult, that all people
    err in what they love, and that errors of those seeking humanity are easy to apologize
    for.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Master says courtesy, economy, and good faith are near to propriety, humanity,
    and truth, and that practicing them with respect and humility reduces errors and
    failure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sage is said to lay down rules for conduct using ceremony, good faith,
    demeanour, costume, and friendship to regulate, bind, distinguish, and perfect
    conduct.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The superior man's dress, demeanour, language, virtues, and conduct are described
    as mutually corresponding; mourning garb, formal dress and cap, and armor each
    have a fitting countenance.
  category: relationship
  evidence_refs:
  - ev:7
