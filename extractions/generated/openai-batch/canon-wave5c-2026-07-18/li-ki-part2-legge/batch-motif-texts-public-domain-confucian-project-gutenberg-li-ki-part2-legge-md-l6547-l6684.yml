canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive rules for mourning and funeral rites: who
    may preside at a wife''s mourning, restrictions on mourning garments and gestures,
    procedures during state prohibitions, mourning behavior for a lad, ranked funerary
    body preparation, burial and wailing periods, condolence gifts, rulerly conduct
    toward ill or deceased officers, burial-procession arrangements, Confucius'' comments
    on ritual propriety through examples of two Great officers, rules for a feudal
    lord''s wife attending parental mourning, and a prohibition on in-law corpse-touching
    rites.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife's mourning rites were to be presided over by her husband's relatives
    if possible; if none were available, a suitable neighbour or the head man of the
    neighbourhood could preside, while her own relatives were excluded from presiding.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes mourning garments and tokens: a girdle was not
    used with the sackcloth band, and the band was incompatible with carrying a jade-token
    or wearing a multicoloured dress.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: During state prohibitions connected with great sacrifices, wailing ceased,
    but coffin-side offerings and mourners' returns to their positions continued as
    usual.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lad who wailed did not sob or quaver, leap, carry a staff, wear straw sandals,
    or occupy the mourning shed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Confucius distinguishes mourning for grand-aunts, aunts, and sisters by duration
    and by whether the feet are lifted in ritual leaping.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Mouth-stuffing after death used ranked numbers of shells: nine for the son
    of Heaven, seven for a feudal lord, five for a Great officer, and three for an
    ordinary officer.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Interment, ending of wailing, and the number of sacrifices of Repose are differentiated
    by rank among officers, Great officers, and princes or feudal rulers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A feudal lord's condolence procedure involved a messenger followed by contributions
    for the mouth, grave-clothes, and carriage, all on the same day and in a stated
    order.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The ruler''s inquiries and abstentions varied by the rank of the ill or deceased
    person: more inquiries for high ministers or Great officers, and restrictions
    on flesh or music after burial, wailing, or encoffining.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Burial processions for a feudal lord and for a Great officer are differentiated
    by numbers of rope-pullers, clapper-bearers, and processional implements used
    by officials.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Confucius presents Kwan Aung as a Great officer with ornate ritual fittings
    and An Phing-chung as a Great officer with a very small sacrificial portion, then
    states that a superior man should neither encroach on those above nor burden those
    below.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The wife of a feudal lord normally did not cross state boundaries for condolence
    except at the death of her father or mother; in that case she returned to her
    original home, entered by the women's gate, used side steps, and was received
    by the ruler.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A sister-in-law did not lay the soothing hand on the corpse of her brother-in-law,
    and the reverse was also forbidden.
  category: action
  evidence_refs:
  - ev:13
