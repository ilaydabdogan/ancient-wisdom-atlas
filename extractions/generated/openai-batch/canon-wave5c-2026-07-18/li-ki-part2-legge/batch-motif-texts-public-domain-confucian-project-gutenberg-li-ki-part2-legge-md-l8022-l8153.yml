canonical_text:
  quote: ''
  summary: The passage titled “The Law of Sacrifices” lists dynastic sacrificial arrangements,
    including honoured recipients, correlates at border sacrifices, ancestors, and
    honoured predecessors. It then describes rites to Heaven, Earth, seasons, celestial
    bodies, weather powers, directions, and local natural spirits, and distinguishes
    the sacrificial scope of universal rulers and territorial princes. It closes with
    a statement about death, ghosts, and ritual continuity and change across dynasties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shun, described as sovereign of the line of Yii, gives the place of honour
    to Hwang Ti at the great associate sacrifice, makes Ai the correlate of Heaven
    at the border sacrifice, and sacrifices to Awan-hsii as ancestor and Yao as honoured
    predecessor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sovereigns of Hsia are described as honouring Hwang Ti, making Khwan the
    border-sacrifice correlate, and sacrificing to Awan-hsii as ancestor and Yii as
    honoured predecessor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Under Yin and Xu, the passage lists different honoured recipients, correlates,
    ancestors, and honoured predecessors for the same sacrificial categories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The explanatory note states that sacrifice is understood as an offering by
    which communication and communion with spiritual beings is effected.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: A blazing pile of wood on the Grand altar is used for sacrifice to Heaven,
    while burial of the victim in the Grand mound is used for sacrifice to Earth;
    in both rites a red victim is used.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sheep and pig are buried at the altar of Great brightness for sacrifice to
    the seasons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage assigns sacrifice sites or places for cold and heat, the sun,
    the moon, the stars, flood and drought, and the four quarters.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mountains, forests, streams, valleys, hills, and mounds able to produce clouds
    and cause winds and rain are said to be regarded as dominated by spirits.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The holder of all under the sky sacrifices to all spirits, while princes of
    states sacrifice only to spirits within their own territories.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says all born between heaven and earth have allotted times; the
    death of creatures is called dissolution, while a dead human is said to be in
    the ghostly state.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says the five dynasties did not change the stated points about
    death, while the seven dynasties changed assessors at major sacrifices and the
    parties sacrificed to in the ancestral temple.
  category: sequence
  evidence_refs:
  - ev:8
