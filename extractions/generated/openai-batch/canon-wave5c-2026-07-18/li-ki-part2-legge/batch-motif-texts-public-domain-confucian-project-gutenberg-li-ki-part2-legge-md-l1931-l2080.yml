canonical_text:
  quote: ''
  summary: 'The passage gives rules for mourning and ancestral rites: when mourning
    is omitted or shortened after absence or delayed news; how attendants follow a
    ruler''s mourning; how the presiding mourner changes use of the staff after the
    sacrifice of Repose and enshrining of the tablet; how mourning clothing, girdles,
    and wailing are regulated; how the dead are called back and inscribed over the
    coffin; and how kinship rank and official status affect mourning periods, assistance,
    tablets, and sacrificial victims.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person born in another state and lacking intercourse with specified paternal
    relatives did not take up mourning in the described circumstance, even when his
    father had done so after hearing of a death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If news of the death of the ruler's father, mother, wife, or eldest son arrived
    only after the ruler had ended mourning, mourning was not begun; if the applicable
    mourning was reduced to three months, it was worn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Servants and officers who had followed the ruler abroad put on mourning when
    the ruler assumed it on return, unless the proper mourning term had already passed;
    those who remained at home had worn the regular mourning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the sacrifice of Repose, the presiding mourner did not carry his staff
    to his apartment; after the deceased's tablet was placed in the grandfather's
    shrine, he did not carry the staff when going up to the hall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the son adopted as the child of a childless wife of
    the ruler did not mourn for that wife's kindred; the note reports that editors
    thought the paragraph may be mutilated and should perhaps say the opposite.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sash was shorter than the headband by one fifth, and the staff was the
    same length as the sash.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A concubine mourned for the ruler's eldest son for the same length of time
    as the son's mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When mourning attire was put off, the items considered most important were
    removed first; when mourning attire was changed, the items considered least important
    were changed first.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The door of the place where the body was kept was not opened except on the
    regular occasion, and wailing at other times occurred in the mourning shed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In calling the dead back and writing the inscription over the coffin, the
    language was the same from the Son of Heaven down to the ordinary officer; a man
    was called by name, and a wife was identified by surname or family branch-name
    and place among sisters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Different girdles of dolychos cloth and hemp were paired with specified mourning
    grades, and when the lighter girdle was assumed a man wore both girdles together.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: An early interment was followed by an early sacrifice of Repose, but wailing
    did not end until the three months were completed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When mourning rites for both parents occurred at the same time, the sacrifices
    of Repose and enshrining for the mother buried first were delayed until after
    the father's burial.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A Great officer reduced mourning for a son by a concubine, but that son's
    son did not reduce mourning for his father.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: A Great officer did not assist at mourning rites for an ordinary officer.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A man did not wear mourning for the parents of his nurse.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: When a husband became successor and representative of another man, his wife
