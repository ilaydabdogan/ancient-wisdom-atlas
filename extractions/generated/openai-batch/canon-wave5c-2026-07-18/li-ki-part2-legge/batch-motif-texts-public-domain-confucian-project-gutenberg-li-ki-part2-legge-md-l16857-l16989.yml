canonical_text:
  quote: ''
  summary: The passage explains marriage rites and pre-marriage instruction for a
    young wife, including service to parents-in-law, household production, lineage
    continuity, and an ancestral sacrifice. It then describes the queen and the son
    of Heaven as complementary regulators of feminine/internal and masculine/external
    order, linking their duties to palace halls, official departments, eclipses of
    moon and sun, ritual purification in white robes, and their parental status toward
    the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sequence of ceremonies establishes the young wife, shows her obedient service
    to her husband's parents, and presents her role in continuing the family line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deferential wife is described as obedient to parents-in-law, harmonious
    with women’s apartments, a fitting partner of her husband, able to work in silk
    and linen, and watchful over household stores.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that complete deferential obedience of the wife secures
    internal harmony and makes long continuance of the family calculable.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: For three months before marriage, a young lady is taught the virtue, speech,
    carriage, and work of a wife in an ancestral temple or public hall associated
    with her surname branch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After this instruction is completed, the young lady offers a sacrifice to
    the ancestor using fish and soups made from duckweed and pondweed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The queen of the son of Heaven divides the harem into six palace-halls whose
    occupants are instructed in domestic and private rule and the deferential obedience
    of the wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The son of Heaven establishes six official departments whose officials are
    instructed in public and external government and in lessons for men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The text contrasts lessons learned from the son of Heaven with obedience learned
    from the queen, assigning masculine energies to external administration and feminine
    receptivities to internal family regulation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When lessons for men are not cultivated, the passage links the irregularity
    of masculine phenomena to an eclipse of the sun; when obedience proper to women
    is not cultivated, it links the irregularity of feminine phenomena to an eclipse
    of the moon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: On a solar eclipse the son of Heaven wears plain white robes and repairs faults
    in the six official departments; on a lunar eclipse the queen wears plain white
    robes and repairs faults in the six palace-halls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The son of Heaven and queen are compared to the sun and moon and to masculine
    and feminine principles; the passage says they require each other and fulfill
    their functions through interdependence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The son of Heaven and queen are described as father and mother to the people,
    with distinct mourning sackcloth prescribed for each.
  category: relationship
  evidence_refs:
  - ev:7
