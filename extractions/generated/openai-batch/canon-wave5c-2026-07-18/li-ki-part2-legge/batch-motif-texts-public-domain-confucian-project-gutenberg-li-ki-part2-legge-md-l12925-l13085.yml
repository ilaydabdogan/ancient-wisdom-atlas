canonical_text:
  quote: Humanity is the right hand; pursuing the right path is the left.
  summary: The passage opens with a fragment describing transforming virtue as lacking
    sound or odour, then presents sayings of the Master on the superior man's exemplary
    conduct, reverence, ritual boundaries, sacrifice, formal exchanges, recompense,
    and the relation between humanity and righteousness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An opening fragment describes the highest transforming virtue as having neither
    sound nor odour.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says, “Let us return,” and describes the superior man as manifest
    despite obscurity, grave without airs, awe-inspiring without severity, and believed
    without words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The superior man is described as avoiding errors in steps, countenance, and
    speech; his demeanour induces awe, his countenance fear, and his words confidence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dress and outer garment do not replace one another, and this is said to
    intimate to the people that they should not trouble or interfere with one another.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sacrifice at the point of greatest reverence should not be immediately followed
    by music, and court deliberation at utmost nicety should not be immediately followed
    by idle indifference.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The superior man is careful in small things, escapes calamity, cannot keep
    his generous largeness hidden, and keeps shame at a distance through courtesy.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gravity and reverence make the superior man stronger for good each day, while
    indifference and lack of restraint lead to daily deterioration.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Vigil and fasting are required before serving spirits in sacrifice, and the
    day and month for appearing before the ruler are chosen beforehand so that people
    will not look on such things without reverence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The small man is described as familiar and insolent, able to bring death on
    himself, and yet without fear.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Formal messages are required for reception between parties, and ceremonial
    gifts are required for an interview with a superior; these rules are said to prevent
    troublesome liberties.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage quotes the Yi on instructing one who sincerely seeks divination
    the first time, but not one who applies repeatedly and becomes troublesome.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Benevolence is called the Pattern for all under Heaven, Righteousness the
    Law for all under Heaven, and ceremonial Reciprocations the Profit of all under
    Heaven.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Returning kindness for kindness is said to stimulate people, while returning
    injury for injury is said to warn them.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: A cited saying states that without the sovereign the people cannot enjoy repose,
    and without the people the sovereign would have none to rule in the four quarters.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: Returning kindness for injury is associated with regard for one's own person;
    returning injury for kindness is associated with punishment and death.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: The superior man reasons about the path to be trodden from himself and lays
    down laws from the capabilities of the people.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: Humanity is described as practised naturally by those to whom it belongs,
    for advantage by the wise, and by constraint by those who fear guilt.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:18
  text: Humanity is identified with the right hand, pursuing the right path with the
    left, and different proportions of humanity and righteousness lead to being loved,
    honoured, or not both.
  category: relationship
  evidence_refs:
  - ev:16
