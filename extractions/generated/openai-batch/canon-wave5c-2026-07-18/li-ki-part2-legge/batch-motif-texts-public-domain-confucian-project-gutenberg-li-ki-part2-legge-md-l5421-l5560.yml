  quote: ''
  summary: The passage gives ritual and rank-based rules for mourning, divination
    about burial, calling back souls with appropriate robes, placement of ancestral
    tablets in shrines, and changes of mourning attire when another death occurs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Two mourning lodgings are described: a mourning shed made from trees and
    branches against an east wall, and an unplastered apartment made of unburnt bricks.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief mourners occupy the mourning shed, while mourners whose mourning is
    less intense occupy the unplastered apartment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mourning attire and rank treatment differ according to whether the deceased
    or mourner is a Great officer, ordinary officer, son by the proper wife, son by
    another harem member, parent, cousin, or other relative.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When parents of an ordinary officer who had become a Great officer could not
    preside at his mourning rites, the deceased man's son, or another appointed person,
    was made representative of the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Divination about the grave and day of interment of a Great officer may be
    performed by tortoise-shell, with specified dress for the supervising officer
    and diviner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If stalks are used for divination, the manipulator and the reader of the result
    wear specified garments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At mourning rites for a Great officer, horses are brought out; the person
    bringing them wails, stamps, and exits before the son folds offerings and reads
    the list of gifts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At mourning rites for a Great officer, temple officials assist the presiding
    mourner and put the question to the tortoise-shell before the diviner manipulates
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In calling back the soul of a feudal lord, the robe first conferred on him,
    with cap and corresponding robes, is used according to noble rank.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In calling back the soul of a friend's wife, a black upper robe with purple
    border or an embroidered robe lined with white crape is used.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In calling back the souls of wives of nobles or officers, different upper
    robes are used according to the woman's rank or appointment.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: During the calling back, participants stand facing north and inclining west.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Rules are given for whether a yellow silk curtain with pheasants is attached
    to the pall over the coffin of a Great officer.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Tablets of deceased family members are placed in shrines according to rank,
    descent, marriage status, sex, and available ancestral positions.
  category: relationship
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
- id: obs:15
  text: The tablet of an unmarried son is used at sacrifices, while the tablet of
    an unmarried daughter is placed in the grandmother's shrine but not used at sacrifices.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: When a ruler dies, the eldest son is styled simply as son for that year, while
    other rulers treat him as the ruler.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:17
  text: A mourner who has worn one year of three-year parental mourning changes to
    nine-month mourning cloth after a relative requiring nine months of mourning dies,
    but does not change staff and shoes.
  category: sequence
  evidence_refs:
  - ev:17
