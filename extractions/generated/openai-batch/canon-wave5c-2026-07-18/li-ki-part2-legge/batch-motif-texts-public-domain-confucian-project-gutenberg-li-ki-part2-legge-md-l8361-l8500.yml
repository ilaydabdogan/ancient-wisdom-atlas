canonical_text:
  quote: ''
  summary: The passage explains proper sacrificial timing, seasonal sacrifices in
    spring and autumn, vigil and purification, remembrance of the departed until they
    seem present, filial sacrifice to parents, ordered ritual roles in sacrifice,
    King Wen's exemplary service to the dead as if living, and Xung-ni's autumnal
    sacrifice followed by a question from 3ze-kung.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifices are said to be improper when repeated too frequently or too infrequently;
    the superior man offers spring and autumn sacrifices in harmony with Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Treading on hoar-frost produces sadness, while treading on rain- and dew-wet
    ground in spring moves the sacrificer as if seeing departed friends; music is
    used in spring sacrifice but not autumn sacrifice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During vigil and purification, the mourner thinks of the departed's sitting,
    smiling, speech, aims, likings, desires, and enjoyments; on the third day he sees
    those for whom the vigil is performed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the day of sacrifice, the sacrificer enters the temple apartment and seems
    to see the deceased at the place of the spirit-tablet, and later seems to hear
    movements and sighing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Filial piety requires that the son not forget his parents' looks, voices,
    aims, likings, and wishes; through love and reverence they seem to live again
    and stand before him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The superior man nourishes parents while alive, sacrifices to them when dead,
    and refrains from ordinary work on the recurring day of their death because his
    thoughts are occupied with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that only the sage can sacrifice to God and only the filial
    son can sacrifice to his parents; sacrifice is described as directing oneself
    or one's thoughts toward the recipient.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ritual includes a personator of the departed, a ruler leading the victim
    and presenting offerings, the ruler's wife arranging bowls and dishes, and ministers,
    Great officers, and their wives assisting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: King Wen is described as serving the dead as if serving the living, being
    sad on the death-day, seeming to see his father and things his father loved, and
    experiencing blended joy and sorrow on the sacrifice day.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: At an autumnal sacrifice, Xung-ni advanced bearing offerings with simple sincerity
    and short repeated steps; afterward 3ze-kung questioned him about the absence
    of expected dignity and absorption.
  category: speech
  evidence_refs:
  - ev:8
