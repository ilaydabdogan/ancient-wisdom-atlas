canonical_text:
  quote: ''
  summary: The passage describes the presentation and processing of silkworm cocoons
    into dyed threads and robes used by the ruler in sacrifices to former rulers.
    It then gives didactic statements on ceremonies, music, moral harmony, social
    order, and several teachings attributed to 3ang-jze on filial piety, parental
    honor, and the body as a parental legacy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the silkworm year ended, honourable ladies finished their work with
    the insects, carried the cocoons to show the ruler, and presented them to the
    ruler's wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ruler's wife received the cocoons while wearing a head-dress and a robe
    with pheasants on it, and she caused a sheep and a pig to be killed and cooked
    to treat the ladies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On an auspicious day, the wife rinsed some cocoons three times in a vessel,
    began unwinding them, and distributed them to auspicious and honourable ladies
    of her three palaces to complete the unwinding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The thread was dyed red, green, azure, and yellow to make coloured figures
    on robes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the robes were finished, the ruler wore them in sacrifices to former
    kings and dukes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The superior man says ceremonies and music should not be neglected, and that
    mastery of music regulates the heart and mind, producing joy and repose.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that mastering ceremonies and regulating the person accordingly
    produces gravity and reverence, while lack of harmony, joy, gravity, or reverence
    allows negative traits to appear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Music is described as acting on the interior of a person, while ceremonies
    are described as acting on the exterior.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The passage states that when inner harmony and outward docility are present,
    the people accept and obey the superior person's rule.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: '3ang-jze states that filial piety has three degrees: honouring parents, not
    disgracing them, and supporting them.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In response to Kung-ming, 3ang-jze says that full filial piety involves anticipating
    parents' wishes, carrying out their aims, and instructing them in the path of
    duty; he says merely supporting parents is not enough.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: 3ang-jze says the body has been transmitted by parents and should not be used
    irreverently.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: 3ang-jze lists gravity at home, loyalty in serving the ruler, reverence in
    office, sincerity with friends, and bravery in battle as conduct connected with
    filial piety.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Preparing cooked fragrant flesh and grain, tasting them, and presenting them
    before parents is described as nourishing parents rather than full filial piety.
  category: speech
  evidence_refs:
  - ev:9
