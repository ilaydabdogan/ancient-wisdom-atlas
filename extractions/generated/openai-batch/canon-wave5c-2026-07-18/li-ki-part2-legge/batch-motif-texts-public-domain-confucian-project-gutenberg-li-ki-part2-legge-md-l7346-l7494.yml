canonical_text:
  quote: ''
  summary: 'The passage gives prescriptions for mourning rites: abstinence and restricted
    foods by rank, relationship, and mourning stage; exceptions for illness, age,
    and post-burial feasting; and procedures for the slighter and fuller dressing
    of a body with mats, bands, sheets, clothes, and robes according to rank.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At mourning rites for a ruler, the eldest son, Great officers, other sons,
    and court officers eat nothing for three days and are then limited to gruel or
    small portions of rice; other groups receive coarse rice and water without fixed
    meal times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At mourning rites for a Great officer, the presiding mourner, steward, and
    grandsons are confined to gruel, while inferior officers, wives, and concubines
    take coarse rice and water; the same rules apply for an ordinary officer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After burial, the presiding mourner and wife are limited to coarse rice and
    water and do not eat vegetables or fruit; later stages permit vegetables, fruit,
    and then flesh after a subsequent sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gruel is taken in bowls without hand-washing, while rice taken from a basket
    requires hand-washing; first flesh is dry flesh and first liquor is newly made
    liquor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During one-year mourning, there are three occasions of abstaining from food;
    coarse rice and water exclude vegetables and fruit, and later flesh and liquor
    may be taken under specified limits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: During five-month and three-month mourning, abstention once or twice is allowed,
    and certain mourners may eat flesh and drink liquor without enjoying them in company
    with others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mourners unable to eat gruel may take vegetable soup; ill mourners may eat
    flesh and drink liquor; at fifty one need not perform all mourning observances,
    and at seventy one wears only sackcloth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After burial, if a ruler, Great officer, or father’s friend feasts a mourner,
    the mourner partakes of viands, grain, and flesh but declines wine and new wine.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The slighter dressing is performed inside the door of the body’s apartment,
    and the fuller dressing at the top of the eastern steps; the body is laid on rank-specific
    mats.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the slighter dressing, cloth bands, a rank-specific sheet, and nineteen
    suits of clothes are arranged, with display location and orientation differing
    by rank.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the fuller dressing, cloth bands, strings, sheets, and ranked numbers of
    clothing suits are displayed with specified orientations and preferred positions.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the slighter dressing, sacrificial robes are not placed below the others;
    a ruler’s body does not use presented clothes, while Great officers and common
    officers may use robes of the principal mourner and relatives’ contributions under
    limits.
  category: object
  evidence_refs:
  - ev:11
