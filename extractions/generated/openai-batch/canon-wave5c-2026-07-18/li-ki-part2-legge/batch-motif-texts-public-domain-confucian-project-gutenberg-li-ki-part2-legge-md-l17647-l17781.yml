canonical_text:
  quote: ''
  summary: The passage presents archery as a discipline of benevolence and self-correction,
    links accurate shooting to music and superior virtue, discusses the penal cup
    in archery, describes the official training of noble sons, and explains banquet
    ceremony at feudal courts as an ordered display of rank, courtesy, cup-giving,
    reciprocal bowing, and rewards for service.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Archery is said to suggest the way of benevolence; the archer seeks correctness
    in himself before discharging the arrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the archer misses the mark, he is described as not becoming angry with
    the one who surpassed him, but as turning back to seek the cause in himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius says the student of virtue has no contentions; if contention occurs
    in archery, the archer bows to the competitor, ascends and descends the hall,
    and exacts the drinking forfeit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Confucius describes exact shooting in harmony with music and hitting the bull's-eye
    as something only an archer of superior virtue can do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited Book of Poetry stanza depicts an exchange in which one person tells
    another to shoot and show skill, and the other says he will shoot, hit the mark,
    and require the penal cup when the first misses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The liquor in the archery cup is said to be properly designed to nourish the
    aged or sick; seeking to avoid the cup is described as declining what should nourish
    those who need it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: An officer called the shu-jze is described as managing cautions and orders
    for noble eldest sons, superintending their instruction, arranging their classes,
    and ensuring correct positions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: During grand solemnities the sons of the state are placed under the heir-apparent;
    during military operations the shu-jze provides carriages, coats of mail, companies,
    and inferior officers for their training.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The sons are assembled in spring in the college and in autumn in the archery
    hall for examination, after which they are advanced or degraded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: At the feudal banquet, the ruler stands at specified steps, faces south, and
    alone ascends to a mat at the top of the eastern steps, indicating that no one
    presumes to be his equal.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the banquet ceremony, the ruler has his chief cook act for him in presenting
    the cup, because a minister may not presume to take on a usage proper to the ruler.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ruler bows to guests, sends the cup among them, receives their prostrating
    bows, responds to their courtesy, and recompenses service with rank and emoluments.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
