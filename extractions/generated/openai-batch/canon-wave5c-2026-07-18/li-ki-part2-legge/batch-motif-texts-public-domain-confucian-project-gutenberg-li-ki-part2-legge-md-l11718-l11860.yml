canonical_text:
  quote: What Heaven has conferred is called the Nature.
  summary: The passage defines Nature, the Path of Duty, and instruction; describes
    equilibrium and harmony as moral states with cosmic effects; contrasts the superior
    man with the small man; and presents Shun and Hui as exemplars of questioning,
    discernment, and steadfast adherence to the mean.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Heaven is said to confer Nature; accordance with this Nature is called the
    Path of Duty, and regulation of that path is called the System of Instruction.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The path is described as something that should not be left for an instant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The superior man is described as cautious before seeing things, apprehensive
    before hearing things, and watchful over himself when alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Equilibrium is defined as the absence of stirrings of pleasure, anger, sorrow,
    or joy; harmony is defined as those feelings being stirred in due measure and
    degree.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: If equilibrium and harmony exist in perfection, heaven and earth are said
    to have their right places and all things are said to be nourished.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kung-ni says that the superior man exhibits equilibrium and harmony, while
    the small man presents the opposite and lacks apprehensive caution.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says that few people attain equilibrium and harmony, and that the
    knowing and worthy go beyond the path while the stupid and unworthy fall short
    of it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shun is described as loving to question others, studying even shallow words,
    concealing what was bad, displaying what was good, grasping two extremes, determining
    the mean between them, and using it in government.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men are said to claim wisdom while failing to escape a net, trap, or pitfall,
    and while failing to keep equilibrium and harmony for a full month.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hui is described as choosing equilibrium and harmony, grasping any good thing
    firmly, wearing it on his breast, and not letting it go.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master says that ruling the kingdom, states, and clans, and declining
    dignities and emoluments, may be possible, while attaining equilibrium and harmony
    is not.
  category: speech
  evidence_refs:
  - ev:9
