  summary: The passage teaches that successful government depends on prior preparation,
    social confidence depends on graded relationships, and moral perfection depends
    on understanding what is good. It describes the sage or entirely perfect person
    as one who embodies the right way, cultivates the good through sustained study
    and practice, develops the nature of self, others, animals, and things, and can
    assist the transforming and nourishing operations of heaven and earth.
