canonical_text:
  quote: ''
  summary: The passage presents didactic analogies about learning, questioning, and
    teaching; uses craft, tree, bell, drum, water, and ritual examples to describe
    gradual and fundamental learning; mentions the three sovereigns sacrificing to
    waters in an order from source to result; and begins a section on music by deriving
    vocal modulations from the mind and its affections.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skilful learner makes greater attainments even when the master seems indifferent
    and later credits the master; an unskilful learner makes lesser attainments even
    when the master is diligent and later is dissatisfied with the master.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A skilful questioner is compared to a workman dealing with a hard tree by
    attacking the easy parts first and the knotty parts later; the unskilful questioner
    takes the opposite course.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A master who skilfully waits to be questioned is compared to a bell that gives
    a small or great sound according to how it is struck and gives its full sound
    when struck leisurely and properly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A person who gives only memorized learning in conversation is described as
    unfit to be a master; a master should hear pupils' questions, set subjects before
    them if they cannot question, and leave them alone if they show no knowledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Examples of the son of a good founder learning to make a fur-robe, the son
    of a good bow-maker learning to make a sieve, and a young horse yoked behind a
    carriage are given as cases from which the superior man can instruct himself in
    learning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ancients are said to have compared different things and traced analogies;
    examples include the drum's relation to musical notes, water's relation to colours,
    learning's relation to the senses, and a teacher's relation to the degrees of
    mourning.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wise saying states that great virtue, method, truth, and seasonableness
    are not confined to one office, article, oath-confirmation, or occasion; examining
    these cases teaches one to direct aims to what is fundamental.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the three sovereigns sacrificed to the waters, they sacrificed first
    to rivers and then to seas, first to the source and then to the result; this is
    called paying attention to the root.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says modulations of the voice arise from the mind, affections
    of the mind are produced by external things, sounds respond to one another, and
    music includes modulated sounds coordinated with shields, axes, plumes, and ox-tails.
  category: sequence
  evidence_refs:
  - ev:8
