canonical_text:
  quote: ''
  summary: The passage prescribes mourning-staff observances and corpse-preparation
    rites for rulers, Great officers, and ordinary officers. It specifies who assumes
    or lays aside the staff, how messages from social superiors affect staff handling,
    how the corpse is moved, covered, washed, groomed, cooled, and prepared with ritual
    furniture and jade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a ruler's mourning rites, sons and wife assume the staff on the third day,
    and daughters married to Great officers may use it on the fifth day when the corpse
    is put into the coffin; staff use varies by room and proximity to the coffin apartment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the presiding son at a ruler's rites, messages from the king, messages
    from another state's ruler, and tortoise-shell consultation about the corpse each
    require different staff handling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a Great officer's mourning rites, the body is put into the coffin on the
    morning of the third day, and the presiding son, presiding wife, and steward of
    the House assume the staff; messages from ranked persons alter staff handling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At an officer's mourning rites, the body is put into the coffin on the second
    day, and on the third day the presiding mourner and his wife assume the staff,
    with the same message observances as at Great officer rites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: All sons assume the staff, but only the eldest uses it when going to their
    places; Great officers and officers use the staff by the coffin, carry it by the
    bier, and later break and discard it secretly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Immediately after death, the corpse is transferred to a couch, covered with
    a large sheet, stripped of the death-clothes, fitted with a horn spoon to keep
    the mouth open, and supported by a stool to keep the feet from contracting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Water is drawn and handed to body attendants, who wash the corpse under an
    upheld sheet; feet nails are pared, and remaining water is thrown into a pit.
    For a female deceased, female attendants in the inner room hold the sheet and
    wash the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A head-wash is prepared from grain-water according to rank, water is heated
    with a furnace, fuel, and boiler, the head is washed and dried, fingernails are
    clipped, the beard is wiped, and the used water is thrown into the pit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Cooling vessels and couches are arranged according to rank: rulers and Great
    officers receive ice vessels of different sizes, while an ordinary officer receives
    an earthenware vessel without ice; additional couches are used for placing jade
    in the mouth and for fuller dressing before the corpse is moved to a hall couch.'
  category: object
  evidence_refs:
  - ev:8
