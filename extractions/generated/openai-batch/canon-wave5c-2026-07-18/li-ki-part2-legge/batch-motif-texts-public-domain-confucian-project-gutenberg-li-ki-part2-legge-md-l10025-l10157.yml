canonical_text:
  quote: ''
  summary: Confucius describes how the moral qualities of a state’s people reveal
    which classical texts have instructed them, and how deep understanding avoids
    each text’s possible failing. The passage then describes the Son of Heaven as
    correlated with heaven and earth, ordered by music and propriety, and able to
    rectify the realm. It defines harmony, benevolence, confidence, and rightness
    as tools of rulership, and compares the Rules of Propriety to measuring instruments
    that establish correct order in temple, court, family, and village life.
  language: English
  quote_policy: summarized
