  quote: serves his parents as he serves Heaven, and serves Heaven as he serves his
    parents.
  summary: A duke questions Confucius about personal moral completion and the way
    of Heaven. Confucius teaches that a ruler must love people, avoid transgression
    beyond himself, value Heaven's unceasing order, and understand filial service
    to parents as corresponding to service of Heaven.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that if a ruler cannot love men, he cannot preserve his
    own person, enjoy his land in quiet, rejoice in Heaven, or complete what can be
    done for his person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duke asks what is meant by doing all that can be done for one's person,
    and Confucius answers that it is avoiding transgression of what is due beyond
    oneself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The duke asks what the superior man values in the way of Heaven, and Confucius
    answers that he values its unceasingness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius describes the way of Heaven through the sequence of sun and moon
    from east and west, uninterrupted progress, completion of things without action,
    and the brilliancy of completed things.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The duke says he is stupid, unintelligent, and occupied with many things,
    and asks Confucius to help him keep the lesson in mind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Confucius looks grave, moves a little from his mat, and then replies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius says that a man of all-comprehensive virtue and a filial son do
    not transgress what is due beyond themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confucius says that a son of all-comprehensive virtue serves his parents as
