canonical_text:
  quote: ''
  summary: 'The passage gives ritual prescriptions and sayings about mourning: postponing
    sacrifices when another household death occurs, conduct at mourning sacrifices,
    cups and offerings, teachings on reverence and grief, three-year mourning discipline,
    kinship gradations of mourning, emotional signs after mourning, putting off mourning
    dress, conduct toward visitors during wailing and leaping, and ranked animal offerings
    at the Sacrifice of Repose.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a death occurs in the family of a brother or cousin when a parental mourning
    sacrifice is due, the sacrifice is postponed until after burial; this also applies
    within the same palace even for a servant or concubine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the sacrifice, the mourner ascends and descends the steps with only one
    foot on each step, and the assistants do the same, including at the Sacrifice
    of Repose and at the placing of the spirit-tablet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the first-year mourning sacrifice for a parent, the chief mourner raises
    the offered cup to his teeth while visitors, brothers, and cousins sip their cups;
    after the second-year sacrifice the chief mourner may sip and the others may drink
    off their cups.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Attendants at funeral sacrifices notify visitors to present offerings, but
    the visitors do not afterwards partake of those offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In response to 3ze-kung, the Master states that reverence is most important
    in parental mourning, grief is next, and emaciation is last; outward appearance
    and carriage should match inward feeling and dress.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When asked about mourning for a brother, the Master directs 3ze-kung to the
    written tablets; a superior man is said not to diminish either others' mourning
    or his own.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Confucius praises Shao-lien and T4a-lien for sustained mourning conduct across
    three days, three months, one year, and three years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: During three years of mourning for his father, a son may speak but not discourse,
    may reply but not ask questions, sits alone in a shed or unplastered apartment,
    and avoids entering the house except on occasion before his mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage distinguishes mourning intensity and duration by relationship,
    including wife, uncle or aunt, sisters, cousins, prematurely deceased minors,
    parents, brothers, and a ruler's mother or wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: After mourning for his father has been put off, a man may be startled by seeing
    someone resembling his father or agitated by hearing the same name.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sacrifice at the end of the second year is marked by the principal mourner
    putting off mourning dress, announcing the time the evening before, and wearing
    court robes at the sacrifice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At an officer's mourning rites, the arrival of a Great officer interrupts
    bared-breast leaping for greeting and bowing, whereas the arrival of another officer
    is greeted after the leaping is completed and dress readjusted.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the Sacrifice of Repose and related rites for Great officers, animal offerings
    vary by rank and occasion, including boar, ram, bull, or a single victim.
  category: object
  evidence_refs:
  - ev:10
