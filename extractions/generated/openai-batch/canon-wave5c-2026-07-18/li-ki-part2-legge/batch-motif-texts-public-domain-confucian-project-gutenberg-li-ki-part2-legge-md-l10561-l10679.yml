canonical_text:
  quote: ''
  summary: Kung-ni, at home with three disciples, teaches about ceremonies. He says
    propriety defines the due mean, that ritual forms express loving feeling toward
    spirits, kindred, the dead, neighbors, and guests, and that ceremonial rules order
    family life, court rank, war practice, material forms, offerings, mourning, offices,
    and government. Without such rules, regulating a state is compared to blindness
    or searching in a dark room without light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kung-ni is described as being at home at ease with 3zekang, 3ze-kung, and
    Yen YQ while the conversation turns to ceremonies.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master tells the three disciples to sit and says he will discourse on
    ceremonies so they may employ them rightly everywhere and in all circumstances.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 3ze-kung crosses a mat and asks for clarification; the Master says respect,
    courtesy, and boldness without rules of propriety become vulgarity, forwardness,
    and violence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says ceremonial rules define and determine the due mean.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yen YQ asks whether ceremonial rules control what is bad and complete what
    is good, and the Master answers that they do.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Master lists border sacrifices to Heaven and Earth, ancestral temple services,
    food set down by the deceased, archery and drinking rites, and festal entertainments
    as ceremonies expressing loving feeling toward different recipients.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master says understanding key sacrifices and services would make governing
    a state as easy as pointing to one’s palm.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master says observance of ceremonial rules produces distinctions between
    young and old, harmony among kin branches, proper court rank, military skill,
    and successful military operations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Master says ceremonial rules give proper form or measure to houses, vessels,
    food, music, carriages, offerings to spirits, mourning, discussions, offices,
    and government business.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Master defines the object of ceremonial rules as the ordering of affairs
    and compares ruling without them to a blind man without a guide or a night searcher
    in a dark room without light.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A source note reports that later editors regarded part of the paragraph mentioning
    3ze-khan as possibly introduced by an error in manipulating the tablets.
  category: other
  evidence_refs:
  - ev:4
