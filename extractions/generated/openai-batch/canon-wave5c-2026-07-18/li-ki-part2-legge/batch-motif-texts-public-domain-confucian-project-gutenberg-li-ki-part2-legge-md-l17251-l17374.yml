  category: setting
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
- id: obs:8
  text: 'The four quarters are associated with seasons and qualities: east with spring
    and life-giving intelligence, south with summer and benevolent growth, west with
    autumn and justice in gathering and guarding, and north with winter and storing
    within.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the Son of Heaven stands, the passage says he keeps intelligence on his
