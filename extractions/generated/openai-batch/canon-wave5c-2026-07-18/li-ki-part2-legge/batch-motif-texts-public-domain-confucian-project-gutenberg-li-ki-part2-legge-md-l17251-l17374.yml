canonical_text:
  quote: ''
  summary: 'The passage interprets the country-district drinking festivity as an orderly
    ritual that models social hierarchy, deference, joy without disorder, and political
    tranquillity. It assigns cosmic correspondences to ritual persons: the principal
    guest represents heaven, the host earth, attendants the sun and moon, and three
    head guests the three great luminaries. It explains eastern ritual placements
    of dogs, washings, water, and a vessel of dark liquid, and maps directions to
    seasons and moral qualities, including the posture of the Son of Heaven and the
    eastern position of the host.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The country-district festivity is described as displaying rank distinction,
    measured observances, harmony and joy without disorder, deference to elders, and
    feasting without turbulence; these are said to rectify the person and tranquillize
    the state.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The principal guest, host, attendants, and three head guests are assigned
    representational correspondences with heaven, earth, the sun and moon, and the
    three great luminaries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The instituted form of the festivity is said to represent fundamental principles
    in government and instruction.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dogs are boiled on the eastern side of the courtyard in acknowledgment that
    vivifying and expanding natural power issues from the east.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Washings take place at the eastern steps, and water is kept east of the washing-place,
