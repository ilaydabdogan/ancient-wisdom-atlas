canonical_text:
  quote: ''
  summary: 'The passage describes sacrificial and ancestral-temple rites: the ruler
    and wife maintain prescribed spatial and handling distinctions; ranked bones,
    cups, and portions are distributed according to status, age, and service role;
    low-ranked servants receive leftovers through the honored representative of the
    dead; and the four seasonal sacrifices are linked to state government, rewards,
    punishments, and reverent rule.'
  language: English translation
  quote_policy: summarized
