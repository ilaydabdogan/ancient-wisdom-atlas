canonical_text:
  quote: ''
  summary: The passage prescribes ranked clothing, girdles, pendants, robe colors,
    and pheasant designs for officers, the Son of Heaven, the queen, noble wives,
    and ladies of honour. It also gives rules for court posture, response to summons,
    bowing, forms of reference to living and dead officials, name avoidance, and the
    sounding stones of girdle-pendants.
  language: English
  quote_policy: summarized
