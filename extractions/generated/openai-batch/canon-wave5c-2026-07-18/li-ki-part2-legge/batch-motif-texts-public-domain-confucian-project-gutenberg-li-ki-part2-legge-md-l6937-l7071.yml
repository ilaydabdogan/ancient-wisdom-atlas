canonical_text:
  quote: ''
  summary: Rules from the Greater Record of Mourning Rites describe preparations during
    extreme illness, rank-specific places of death, the rite of calling back the soul
    with a garment from the roof or from a carriage, immediate mourning behaviors,
    spatial arrangements of mourners around the corpse, and reception protocols before
    the corpse is fully dressed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When illness is extreme, the establishment is swept inside and outside, certain
    instruments are removed according to rank, the sufferer is laid with the head
    to the east, ordinary clothes are replaced with new clothes, and fine floss is
    used to test whether breath has ceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a man is not permitted to die in the hands of women,
    nor a woman in the hands of men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The place of death or placement of the corpse is assigned by rank and marital
    status: rulers and wives in the Great chamber, Great officers and acknowledged
    wives in the Proper chamber, an unacknowledged wife of a high minister first in
    an inferior chamber and then moved higher, and officers'' wives in their chambers.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the soul-calling ceremony, attendants arrange access to the roof, a low-ranking
    officer performs the rite, and a status-appropriate court robe of the deceased
    is used.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The soul-calling performer ascends from the east wing to the middle of the
    roof, faces north, gives three loud calls for the deceased, rolls up the garment,
    casts it down in front, and descends by the north-west wing after the curator
    of robes receives it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the deceased was a visitor in a public lodging, the soul is called back;
    if in a private lodging, it is not; if in the open country, someone calls it back
    from the left end of the nave of the carriage.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The garment used in calling back the soul is not used to cover or dress the
    corpse, and a wife's marriage robe with purple border is not used for her soul-calling.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In calling back the soul, a man is called by his name and a woman by her designation;
    only wailing precedes the call.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Immediately after death, principal mourners sob, brothers and cousins wail,
    and female relatives wail and leap.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For a ruler after the body is placed, the son and male ministers or relatives
    occupy the east or areas below the hall, while the wife and female relatives occupy
    the west or the hall; groups face north when wailing.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: For Great officers and ordinary officers, the presiding son is placed on the
    east and the presiding wife on the west, with sitting or standing positions distinguished
    by kinship and official confirmation of status.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: When mourners wail by the corpse in the apartment, the presiding mourner holds
    up the shroud with both hands.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before the slighter dressing is completed, the principal mourner may leave
    to receive a refugee ruler, a visitor from another state, a ruler's message, or
    a Great officer, depending on the deceased's rank.
  category: sequence
  evidence_refs:
  - ev:9
