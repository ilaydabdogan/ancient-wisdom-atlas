canonical_text:
  quote: ''
  summary: The passage links filial and fraternal reverence to social and political
    order, reports the Master’s teaching on love of parents and reverence for elders,
    describes restraints at the border sacrifice to Heaven, outlines a ruler-led animal
    sacrifice, explains suburban sacrifice as gratitude to Heaven with sun and moon
    association, distinguishes sun and moon rites by site and direction, and states
    five purposes of rites under heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perfect filiality is said to approximate kingship, and perfect fraternal obedience
    to approximate presiding chieftainship; unchanged observance of ancient kings’
    lessons is said to unite the kingdom, states, and families.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master states that love of parents is the foundation of all love and teaches
    concord, while reverence for elders is the foundation of all reverence and teaches
    obedience.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the border sacrifice to Heaven, those engaged in funeral rites do not wail,
    and mourners do not enter the gate of the capital; the passage calls this the
    highest expression of reverence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the day of sacrifice, the ruler leads the victim with help from his son,
    Great officers follow, and the victim is fastened to a stone pillar after entering
    the temple gate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ministers and Great officers bare their arms, inspect the victim’s hair with
    attention to the ears, cut the victim open with a bell-adorned knife, remove inward
    fat, and later offer flesh boiled and raw.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The suburban sacrifice is described as a great expression of gratitude to
    Heaven, specially addressed to the sun, with the moon associated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage gives different ritual times for former dynasties: Hsia in darkness,
    Yin at noon, and Adu all day, especially daybreak and toward evening.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sun is sacrificed to on an altar and in the east, while the moon is sacrificed
    to in a hollow and in the west.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage contrasts gloom and brightness, high and low, forthcoming and
    withdrawing, and says darkness and light alternate in regular succession to produce
    harmony under the sky.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rites under heaven are said to promote return to the beginning, honouring
    of spiritual Beings, harmonious use of government resources, righteousness, and
    humility.
  category: attribute
  evidence_refs:
  - ev:7
