    and chariots influences the people's willingness to yield and pursue refined arts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says that when superiors heed the people's words, the people receive
    gifts or commands as if from Heaven; when superiors ignore them, opposition and
    disorder follow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master repeatedly teaches that a ruler who credits others for good and
    takes wrong upon himself reduces contention and dissatisfaction among the people.
  category: speech
  evidence_refs:
  - ev:4
