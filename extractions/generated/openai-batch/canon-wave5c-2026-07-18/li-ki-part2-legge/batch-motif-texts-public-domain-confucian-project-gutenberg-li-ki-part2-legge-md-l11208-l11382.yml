  quote: ''
  summary: A sequence of sayings attributed to the Master teaches rulers, ministers,
    sons, and superior men how to govern, assign credit and blame, honor the dead
    and ancestors, listen to the people, and practice filial piety. The sayings are
    supported by citations from the Book of Poetry, Book of History, Lun Yii, and
    other named canonical passages.
  language: English
