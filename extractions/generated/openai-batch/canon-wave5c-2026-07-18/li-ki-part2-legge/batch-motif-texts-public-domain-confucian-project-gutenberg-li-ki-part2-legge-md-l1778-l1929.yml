canonical_text:
  quote: ''
  summary: The passage gives ritual rules for ancestor sacrifice, rank-specific offerings,
    mourning obligations by kinship and affinity, divorce effects on mourning, durations
    and removal of mourning garments, delayed interment sacrifices, and rites performed
    by relatives, friends, sons, wives, concubines, heirs, and kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son who had died prematurely or without posterity had his tablet placed
    with that of his grandfather and shared in offerings made to the grandfather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other sons did not sacrifice to their own son who had died prematurely or
    left no posterity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that none of the other sons could sacrifice to their father,
    and connects this rule with the eldest son as representative of the Honoured Head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mourning distinctions are described for nearest kindred, honoured persons,
    elders, and different tributes to males and females.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mourning based only on affinity ceased when the connecting relation was dead,
    while mourning based on consanguinity continued even if that other relation was
    dead.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A concubine who followed a ruler's wife into the harem and then out after
    the wife's divorce did not wear mourning for the wife's son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Only the king offered the united sacrifice to all ancestors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The heir-son of a king or feudal lord did not reduce mourning for his wife's
    parents; for his wife he wore the mourning assigned to the eldest rightful son
    of a Great officer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a son's rank differed from his father's, the father's sacrificial rites
    could be described according to the son's rank, while the personator's dress was
    specified as that of an officer in the cases given.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A divorced wife put off mourning for her parents-in-law, while the continuation
    or non-resumption of mourning for her own parents depended on the completion of
    the first year and whether she was called back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mourning periods were counted in ritual years or seasons, and the sacrifice
    at the completed year was prescribed separately from the act of putting off mourning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: If interment was delayed until after three years, two sacrifices proper to
    the first and second years were offered, and mourning was put off between them
    rather than all at once.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A relative directing mourning rites for mourners with three-year obligations
    offered the two annual terminal sacrifices, while a friend in that role offered
    only the Repose sacrifice and the sacrifice at the placing of the tablet in the
    shrine.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: When an officer's concubine had a son, the son wore three months' mourning
    for her; if she had no son, he did not do so.
  category: action
  evidence_refs:
  - ev:12
