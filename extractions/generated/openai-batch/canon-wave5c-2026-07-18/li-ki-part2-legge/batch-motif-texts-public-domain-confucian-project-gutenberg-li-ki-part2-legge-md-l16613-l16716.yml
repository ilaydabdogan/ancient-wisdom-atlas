canonical_text:
  quote: ''
  summary: The passage explains the meaning and importance of the capping ceremony.
    It presents capping as the first indication of ceremonial usages, a rite that
    completes dress, bodily carriage, countenance, and speech, and that establishes
    correct relations among ruler and subject, father and son, and seniors and juniors.
    The ceremony is prepared by divination, performed with caps, a cup, naming, formal
    presentations, and honour to ancestors in the ancestral temple. Afterward the
    young man is treated as grown and required to fulfill adult social duties.
  language: English
  quote_policy: summarized
