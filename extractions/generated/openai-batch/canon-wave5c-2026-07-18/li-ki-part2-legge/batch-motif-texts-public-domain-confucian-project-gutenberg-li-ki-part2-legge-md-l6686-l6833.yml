candidate_motifs:
- id: motif:1
  label: Wisdom as hearing, learning, and practice
  taxonomy_refs:
  - wisdom
  basis: The superior man’s sorrow is explicitly tied to inability to hear of, learn,
    or carry out a subject, and Confucius provides interpretive instruction about
    ritual practice.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage is ethical and ritual-instructional rather than mythic narrative.
- id: motif:2
  label: Sacrifice as regulated public and temple rite
  taxonomy_refs:
  - sacrifice
  basis: 'The passage repeatedly mentions sacrifices: austerity in bad years, an agricultural
    sacrifice, seasonal border and ancestral sacrifices, and a detailed temple consecration
    with animal victims.'
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:14
  confidence: high
  cautions: The extraction identifies a ritual motif family, not a mythic episode.
- id: motif:3
  label: Seasonal cycle marked by labor and solstice rites
  taxonomy_refs:
  - seasonal_cycle
  basis: The agricultural sacrifice occurs at the end of the year after field labor,
    and Mang Hsien-3ze discusses winter- and summer-solstice sacrifices.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The seasonal pattern is ritual-calendrical; no cosmological seasonal myth
    is narrated.
- id: motif:4
  label: Ritual rank and royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links dignity to confirmation by the son of Heaven, differentiates
    conduct by officer rank, and describes jade rank symbols for noble statuses.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:12
  confidence: medium
  cautions: The evidence concerns ritual-political order and symbols of rank; the
    passage does not narrate the founding or divine origin of kingship.
- id: motif:5
  label: Sacred exchange of labor and public enjoyment
  taxonomy_refs:
  - sacred_exchange
  basis: Confucius frames the end-of-year agricultural sacrifice as one day of enjoyment
    granted after a hundred days of field labor.
  evidence_refs:
  - ev:4
  confidence: low
  cautions: The passage describes state-supported relaxation in a ritual setting,
    but does not explicitly state a reciprocal exchange with a deity or spirit.
