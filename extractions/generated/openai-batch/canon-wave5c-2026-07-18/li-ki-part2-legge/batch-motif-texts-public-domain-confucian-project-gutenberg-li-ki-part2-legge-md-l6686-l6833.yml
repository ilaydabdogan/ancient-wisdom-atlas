canonical_text:
  quote: ''
  summary: 'The passage gives short ritual, ethical, and administrative notes: the
    superior man’s sorrows and shames in learning and office; Confucius’ comments
    on austerity in bad years and on the end-of-year agricultural sacrifice; records
    of mourning rites; sacrifices at solstices and in ancestral temples; rules about
    rank, names, mourning, and royal confirmation; dimensions of jade rank symbols;
    and a temple consecration rite involving ritual officers, a sheep, fowls, blood,
    gates, roof, and pillar.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A superior man devoted to learning is said to sorrow when he cannot hear of,
    learn, or practice a subject; a superior man in government is said to feel shame
    over failures in office, territory, population, or merit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says that in bad years people used poorer horses in carriages and
    lower-class victims in sacrifices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At mourning rites for Hsii YG, duke Ai sent Zt Pi to Confucius to learn the
    proper rites for mourning an officer, and those rites were then put into writing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Sze-kung saw the agricultural sacrifice at year’s end, Confucius explained
    the people’s enjoyment as one day of relaxation after a hundred days of field
    labor, using the image of a bow alternately drawn and relaxed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mang Hsien-3ze reasoned from a winter-solstice border sacrifice to God to
    a summer-solstice ancestral temple sacrifice, and he offered sacrifice to the
    progenitors of the line of Lu in the seventh month.
  category: action
  evidence_refs:
  - ev:5
  - ev:15
- id: obs:6
  text: The passage says the practice of not obtaining confirmation from the son of
    Heaven for the dignity of the ruler of Lu’s wife began with duke A402; a note
    links this to duke Ado’s marriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mourning rules for a ruler and his wife are said to apply to ladies of his
    family married both in other states and in his own state.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When Confucius’ stables burned and district friends came to offer condolences
    for the fire, he bowed once to ordinary officers and twice to Greater officers,
    following a rule for mutual condolence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Confucius says Kwan Aung selected two men from among thieves, appointed them
    to office, and said they had been led astray by bad associates; after Kwan Aung’s
    death, duke Hwan made the two mourn for him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If an officer mistakenly used a name before his ruler that should be avoided,
    he rose to his feet; when speaking to a person sharing a name avoided with the
    ruler, he used that person’s maturity name.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Great officer is said not to take part in sedition within his state and
    not to try to avoid calamities coming from outside.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: A treatise on the Chief Internuncius specifies jade symbols of rank for dukes,
    marquises or earls, and counts or barons, with different lengths and mats of three
    colors.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Duke Ai asked 3ze-kdo when his family first entered office, and 3ze-kdo answered
    that his ancestor held a small office under duke Wan.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: When a temple was completed, the officer of prayer, cook, and butcher wore
    specified ritual clothing; the butcher cleaned a sheep, the prayer officer blessed
    it, the cook placed it by the pillar, and the butcher stabbed it on the roof so
    blood ran down in front; fowls were also used at the temple and side-apartment
    gates.
  category: sequence
  evidence_refs:
  - ev:14
