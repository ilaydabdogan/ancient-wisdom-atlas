canonical_text:
  quote: ''
  summary: 'The passage describes a king’s postwar actions: crossing the Ho, retiring
    horses, oxen, chariots, armor, shields, and spears from military use, constituting
    commanders as feudal lords, and making it known that he would no longer resort
    to weapons. It then presents archery, sacrifice, court audiences, ploughing, feasting
    of elders, ceremonies, and music as royal lessons for the kingdom. A concluding
    discourse explains music as inward regulation of the heart and ceremonies as outward
    regulation of conduct, producing harmony, reverence, social obedience, pleasure,
    and repose.'
  language: English
  quote_policy: summarized
