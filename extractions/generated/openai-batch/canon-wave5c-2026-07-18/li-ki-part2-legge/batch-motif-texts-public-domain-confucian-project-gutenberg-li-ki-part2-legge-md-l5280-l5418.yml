  evidence_refs:
  - ev:5
- id: obs:8
  text: When a Great officer or ordinary officer dies in lodging, the soul is called
    back as if the person had died in his house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For a Great officer, a cloth pall is used for the homeward journey; at the
