- id: obs:3
  text: When a feudal lord on the march dies in his lodging, his soul is called back
    in the same way as in his own state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a feudal lord dies on the road, an unnamed person climbs onto the nave
    of the left wheel of the chariot and calls the soul while waving the pennon of
    the flag.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bier carriage for a feudal lord has a pall, a black cloth fringe serving
