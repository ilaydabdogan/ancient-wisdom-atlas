  quote: ''
  summary: The passage first gives an explanation of singing and bodily expression
    in answer to 3ze-kung’s question about music. It then begins Book XVIII, Miscellaneous
    Records, with prescriptions for recalling the soul and transporting the body of
    a feudal lord or officer who dies away from home, formulae for announcing deaths
    according to rank and relation, and rules for mourning lodgings by rank.
  language: English
  quote_policy: summarized
