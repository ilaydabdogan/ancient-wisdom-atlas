canonical_text:
  quote: ''
  summary: 'The passage gives ranked mourning procedures: bodily gestures toward corpses,
    lodging and austerities for sons mourning parents, changes after burial and at
    set mourning intervals, return to public and domestic duties, residence rules
    for wives and officers, and attendance by rulers and rulers’ wives at dressing
    and coffining rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rulers and Great officers bring the breast close over the bodies of parents,
    wives, and eldest sons, while common officers also do this for other sons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a son by a concubine who has a son, the parents do not perform the described
    ceremony; when the ceremony is performed, parents act first, followed by wife
    and son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage specifies different tactile gestures for ruler, parents, son,
    wife, and husband in relation to the corpse, and says the mourner rises and leaps
    after each mark of sorrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At mourning rites for a parent, the son occupies an unplastered slanting shed,
    sleeps on straw with a clod of earth as pillow, and speaks only about the rites.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: After burial, the mourning hut is altered and plastered in a limited way;
    rulers, Great officers, and common officers all have it enclosed, while other
    sons have huts in out-of-the-way places.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After burial, a son may stand with others and speak only of higher public
    affairs appropriate to his rank, not of his own state, clan, or family affairs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a ruler is buried, royal ordinances enter the state and the new ruler
    engages in the king’s affairs after wailing is finished.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the burial of a Great or common officer, ordinances of the state enter
    his family, and after wailing he may still wear mourning bands while donning armor
    and going into the field.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At one year, two years, and twenty-seven months, the mourning state changes
    through altered residence, sacrifices, cessation of wailing, and the reappearance
    of music.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the twenty-seven-month sacrifice the son attends to all duties, and
    after the felicitous sacrifice involving ancestral tablets he returns to his usual
    chamber.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A wife does not occupy the hut or sleep on straw, and her return to her husband
    depends on whether her mourning is for a year or for nine months.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Great and common officers return to their residences at different points,
    but may return for scheduled wailing; a father does not lodge at a son’s, nor
    an elder brother at a younger brother’s.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A ruler and a ruler’s wife attend dressing or coffining rites according to
    the status of the deceased, surname relations, and whether special favor is being
    shown.
  category: action
  evidence_refs:
  - ev:8
