canonical_text:
  quote: ''
  summary: 'The passage gives rules for mourning rites: where and when mourners wail
    according to kinship and rank, how distant mourning stations are used, how mourners
    bow, bare arms, leap, wear mourning items, and who presides. It then describes
    a son''s immediate mourning after his father''s death, including bodily austerities,
    neighbors'' provision of gruel and rice-water, the third-day dressing of the corpse,
    coffin movement, and male and female gestures of grief accompanying the body and
    returning to meet its essential part.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the home was far from the selected wailing place, an absent mourner completed
    arrangements about dress before going there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The place where wailing began varied by mourning obligation: for a parent,
    on looking toward the district; for nine months'' mourning, at sight of the house
    gate; for five months'' mourning, at the door; and for three months'' mourning,
    at the mourner''s station.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Wailing locations differed by relationship: ancestral temple, back chamber,
    outside the temple gate, outside the back-chamber door, or an open-country tent.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a station away from the mourning house was selected for funeral rites,
    offerings were not put down for the departed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The number of wailing days was assigned by status: nine for the Son of Heaven,
    seven for a feudal prince, five for a high minister or Great officer, and three
    for another officer.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Great officer wailing for his ruler, and ministers in other states at selected
    wailing stations, did not presume to bow to visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a distant wailing place, the mourner bared his arms only once.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In condoling with an acquaintance's relations after burial, one wailed first
    in the house and then at the grave, leaped in alternation with the presiding mourner,
    and faced north.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The presiding mourner was determined by household and kinship rules: the
    father if alive, otherwise appropriate brothers, with priority to the eldest when
    equally related or to the nearest when not equally related.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When delayed news of a brother's or cousin's death arrived after the usual
    mourning period would have ended, the mourner still put on the mourning cincture,
    bared his arms, and performed the leaping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: For delayed news, the mourner bowed to visitors with the left hand uppermost.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A place for wailing without mourning garments was chosen only for the death
    of an elder brother's wife; for a married female family member, a hempen sash
    was assumed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After his father's death, the son removed his cap, kept his hair with its
    pin in a silk bag, went barefoot, tucked up his dress, and wailed with hands across
    his breast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: For three days after the father's death, no water or other liquid entered
    the son's mouth and no fire was kindled to cook for him; neighbors prepared gruel
    and rice-water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the third day the slighter dressing of the corpse occurred; the body on
    the couch was called the corpse, and when placed into the coffin it was called
    by another term in the translation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the moving of the corpse and lifting of the coffin, the son wailed and
    leaped repeatedly, baring his arms and leaping to obtain relief.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Women did not bare their arms; they pushed out the breast, struck their hearts,
    and moved their feet with a sliding, hopping motion while accompanying the body
    and returning to meet its essential part.
  category: action
  evidence_refs:
  - ev:9
