canonical_text:
  quote: "“To the people the ruler is as their heart; to the ruler the people are
    as his body.”"
  summary: The passage presents sayings of the Master about the mutual dependence
    of ruler and people, trustworthy speech and conduct, verification of knowledge,
    the superior man’s relation to correctness and friendship, the visible consequences
    of words and actions, the difficulty of repairing faulty speech, King Wan’s virtue
    receiving a divine decree, and a southern proverb that an inconstant person cannot
    divine with tortoise-shell or stalks.
  language: English
  quote_policy: quoted
