canonical_text:
  quote: ''
  summary: The passage presents disorder in nature, rites, music, and moral character
    as mutually related. It contrasts depraved and correct musical notes, each calling
    forth a corresponding inner spirit and producing licentious or harmonious music.
    The superior man disciplines senses and mind, excludes corrupt sounds and sights,
    and uses ordered music, ritual movement, and instruments to display virtue, harmonize
    seasonal energies, image heaven, earth, seasons, wind, and rain, regulate desire,
    instruct the people, and bring social repose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Worn soil is said to hinder the growth of grass and trees; often-troubled
    water is said to keep fish and tortoises from becoming large; decayed natural
    energy is said to impede production.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an age of disorder, ceremonies are described as forgotten and neglected,
    and music as licentious.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Melancholy or unstable joyous notes, remiss ceremonies, and violations of
    ceremony are linked with loss of proper virtue, treachery, greed, and diminished
    harmony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evil and depraved notes affect men, a corresponding evil spirit responds from
    within, and licentious music results.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Correct notes affect men, a corresponding correct spirit responds from within,
    and harmonious music results; initiating causes and results are said to correspond
    by category.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The superior man returns to good affections, compares qualities of actions,
    and keeps depraved notes, disorderly sights, licentiousness, licentious music,
    and corrupted ceremonies from affecting the senses and mind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The musical manifestation includes modulations of note and tone, lutes, movements
    with shield and battleaxe, ornaments of plumes and ox-tails, and a conclusion
    with pipes and flutes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The musical performance is said to exhibit complete virtue, stir harmonious
    action of the four seasonal energies, and display the natures and qualities of
    all things.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fine and distinct notes image heaven; ample and grand notes image earth; beginning
    and ending image the four seasons; wheeling and revolutions image wind and rain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Five notes are compared with five colours, and eight instruments with eight
    winds, forming ordered wholes without confusion or irregular deviation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: When music has full course, the passage says relations become defined, perceptions
    sharpen, blood and physical energies become harmonious and calm, bad influences
    are removed, manners change, and all under heaven is in repose.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Superior men rejoice in attaining the course they wish to pursue, while smaller
    men rejoice in obtaining desired things; regulated desire yields joy, while forgetting
    the course yields delusion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The superior man uses music to perfect instruction, after which the people
    direct themselves to the proper quarter and his virtue can be seen.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Virtue is described as the strong stem of human nature, and music as the blossoming
    of virtue; instruments are made from metal, stone, silk, and bamboo; poetry, singing,
    and pantomimic movements originate in the mind and are accompanied by instruments.
  category: attribute
  evidence_refs:
  - ev:10
