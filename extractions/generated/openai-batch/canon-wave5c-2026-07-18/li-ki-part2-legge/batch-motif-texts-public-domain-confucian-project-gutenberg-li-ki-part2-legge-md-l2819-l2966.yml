canonical_text:
  quote: ''
  summary: A set of etiquette rules describes mediated visits, mourning-service language,
    rank-coded offerings, funeral contributions, handling of ritual gifts, precedence
    and seating, polite inquiry, restraint in speech and desire, sweeping protocols,
    and limits on repeated divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-time visitor to a person of character and position asks that his name
    be reported to the officer of communication and does not go directly up the steps
    to the host.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On mourning occasions, visitors describe themselves as servants, helpers,
    or persons ready to perform required tasks; at mourning rites for a ruler or high
    minister, the visitor says he has come to be employed by the chief minister of
    the household.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a ruler is about to leave his state, a minister presenting money, jade,
    or another article phrases the gift as being for the officer responsible for the
    expenses of the ruler’s horses; an equal says a similar gift is for the recipient’s
    followers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A minister contributing a shroud to his ruler calls it a laid-aside garment
    sent to the valuers; an equal calls the gift simply a shroud; relatives such as
    brothers do not go in with presented shrouds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A minister contributing goods or value for a ruler’s mourning rites for the
    previous ruler presents them to the officers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A carriage and horses presented for a funeral enter the gate of the ancestral
    temple, while money and horses with silk, the white flag of a mourning carriage,
    and war chariots do not enter that gate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After delivering his message, the bearer of a contribution kneels and leaves
    the items on the ground; the officer of communication takes them up, and the presiding
    mourner does not receive them personally.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the receiver stands, the giver stands, and neither kneels; an exception
    is tentatively allowed for straightforward parties.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The officer of communication instructs the host to give precedence to the
    guest and later tells the parties to be seated on their mats.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Only one person may take off shoes inside the opened doorway; later arrivals
    may not do so if an honourable elderly visitor is already present.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Questions about feast dishes, courses, and accomplishments are framed as inquiries
    about whether the other person has enjoyed, practised, or become skilful in them.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A person is instructed not to give cause for doubt about himself, judge others’
    articles, desire the possessions of great families, or speak injuriously about
    things they value.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Sweeping in general and sweeping in front of a mat are distinguished by different
    terms; mats are not swept with a common broom, and the sweeper holds the dust-pan
    with its tongue toward himself.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The passage forbids divining twice about the same matter with a double mind
    and distinguishes questions about whether a matter is right from questions about
    the diviner’s own mind.
  category: action
  evidence_refs:
  - ev:13
