  quote: ''
  summary: 'The passage describes amusements and contests: a severe form of male disfigurement
    leading to ridicule; boys'' practical jokes, running, jumping, wrestling, and
    weapon practice; girls'' avoidance of boys and a stone-or-chip tossing activity
    also practiced by Eskimo/Innuit; and wrestling or strength contests conducted
    in good humor, often with Eskimo participants who are said to win.'
