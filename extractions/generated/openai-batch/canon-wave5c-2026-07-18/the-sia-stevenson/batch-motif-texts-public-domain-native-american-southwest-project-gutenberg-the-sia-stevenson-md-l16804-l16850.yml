canonical_text:
  quote: ''
  summary: An old mother wolf sends her daughter to find the otter, whom she identifies
    as the daughter's lover, because the family is hungry. The daughter finds the
    otter in a hole in the lake ice. After he refuses to live on land, snow blocks
    his breathing holes except the one guarded by the wolf, and he comes out exhausted
    and agrees to live with her. He then catches fish through the ice while she prepares
    a tent, and she hauls up and eats many of the fish.
  language: English
  quote_policy: summarized
