canonical_text:
  quote: ''
  summary: 'The passage describes a Knife Society ceremonial sequence at an altar:
    sprinkling with eagle plumes, medicine water, a crook, and suds from a cloud bowl;
    movements by two boys on either side of a meal line toward cardinal points, zenith,
    and nadir; repeated cycles of twelve; basket and rattle actions with ha''chamoni;
    and a vicar stirring medicine water with an abalone shell before drawing breath
    from a ya''ya.'
  language: English
  quote_policy: summarized
