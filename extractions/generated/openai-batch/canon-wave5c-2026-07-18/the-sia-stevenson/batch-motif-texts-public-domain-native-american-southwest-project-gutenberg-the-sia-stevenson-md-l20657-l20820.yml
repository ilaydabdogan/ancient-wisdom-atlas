canonical_text:
  quote: ''
  summary: The passage describes specific Omaha/Siuan tent and object decorations
    explained as deriving from sacred visions. It identifies visual forms for night,
    stars, moon, sun, a ghost seen in the moon, a man holding deer rattles, a rainbow,
    and an ascent associated with a Thunder-being.
  language: English with Omaha/Siuan transcriptions and interlinear glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tent decoration is described with a blackened part representing night, a
    star denoting the morning star, and additional stars on the left rear and right
    side.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that black and blue are sometimes interchangeable in Omaha
    symbolism, and gives a blue shoulder band on a coyote skin as another representation
    of night.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little Cedar is described as belonging to an Omaha gens and to an order of
    Sun and Moon shamans; a figure is said to represent a vision he had.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Little Cedar's vision decoration, the black band refers to night, the circle
    to the moon, the circumscribed figure to a ghost seen in the moon, and the dots
    above the moon to a whiteness above the rising sun or moon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another decoration of Little Cedar is described as a red circle representing
    the sun, with a man standing in it and holding deer rattles; a real feather was
    tied to the man's head, and the blue band at the bottom may represent night but
    is uncertain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ni-ku-ṣi-bça is described as a leader of the order of Thunder shamans and
    as mysterious; his tent decoration has a bottom black band for night, with the
    moon and a star above it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ni-ku-ṣi-bça named one grandchild Ha-akipa, translated as Meets the Night,
    after the vision to which his tent decoration refers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A reported account says Ni-ku-ṣi-bça had a vision of a Thunder-being, made
    a rainbow shown in the figure, painted spots near the tent smoke-hole, and said
    the Thunder-being carried him up on high to a world above this one that resembled
    this world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage repeatedly connects the decorations with a qube, glossed as a
    sacred vision or mysterious quality.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
