canonical_text:
  quote: ''
  summary: The passage describes a Knife Society ceremony in which a vicar distributes
    medicine water, the ho'naaite drinks directly from a bowl while handling the ya'ya,
    medicine water is sprayed toward directions and the whole world so cloud people
    may water the earth, altar objects are repositioned, a cigarette is smoked over
    the altar, plume offerings are divided for named recipients and deposited at shrines,
    and the society ends with a feast. The clearer later portion describes a poor
    household associated with the Quer'riinna and lists the ingredients of se'-wili
    medicine.
  language: English with Indigenous ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vicar gives medicine water to people in a stated order, including men
    at the west and east ends of the line, several boys, a man beside the ho'naaite,
    and then the ho'naaite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ho'naaite does not receive water from the shell; he drinks directly from
    the bowl while clasping the ya'ya, and then holds the bowl to the vicar's lips
    while clasping the ya'ya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vicar carries the remaining medicine water and the ya'ya into the street
    and sprays water through his teeth toward the north, west, south, east, zenith,
    nadir, and all the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated purpose of the sprayed medicine water is that the cloud people
    might gather and water the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After returning, the vicar places the bowl and ya'ya before the altar; the
    shell is placed east of the meal line and in front of the cloud bowl.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ho'naaite blows the first puffs of a cigarette over the altar and then
    finishes the cigarette without further ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ho'naaite divides plume offerings between two minor members, and the offerings
    are identified as being for Pai'alamo and Ko'pishtaia; the boys deposit them at
    the shrines of Ko'pishtaia.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy novitiate brings food, the society feasts, and the meeting adjourns
    at three o'clock in the morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A later clear section describes a small house without ventilation where an
    old man assists his invalid wife and paralytic son, while a little girl leads
    her blind sister and carries a baby on her back.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The household is described as patient, loving, hospitable, and willing to
    invite the writer to join frugal meals.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The only medicine possessed by the Quer'riinna is se'-wili, made from roots
    and blossoms of six mythical medicine plants of the sun, archaic white shell and
    black stone beads, turkis, and a yellow stone.
  category: object
  evidence_refs:
  - ev:9
