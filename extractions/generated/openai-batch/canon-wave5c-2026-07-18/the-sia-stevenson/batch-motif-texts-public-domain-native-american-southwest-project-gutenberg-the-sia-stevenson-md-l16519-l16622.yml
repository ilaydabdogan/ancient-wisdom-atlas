canonical_text:
  quote: ''
  summary: The excerpt introduces winter storytelling around the fire as instruction
    and entertainment for younger people. It then presents a tale in which a wolverene
    calls birds his brothers, gives them feathers, makes wings for himself, and flies
    with the brant. The brant warns him not to look below when hearing noise over
    a point of land; he eventually looks down, falls, is handled as a fallen brant
    or goose, and is finally found to be a dead wolverene. The passage also begins
    another wolverene story in which he invites water birds ashore for a dance after
    offering a bees' nest.
  language: English
  quote_policy: summarized
