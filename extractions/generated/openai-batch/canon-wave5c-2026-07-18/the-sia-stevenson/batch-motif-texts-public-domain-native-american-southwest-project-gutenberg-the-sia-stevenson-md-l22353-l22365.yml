  summary: The passage describes the Red Medicine Dancing Society. A small red bean-like
    object obtained in prairie regions toward the Rocky Mountains is said to grow
    on bushes but is regarded as alive and as a mysterious animal. In the dance, the
    medicine-maker crushes the beans, boils them in water, and prepares a hot drink
    for a few members. The drink produces intoxication, increased vitality, and endurance
    for prolonged dancing.
