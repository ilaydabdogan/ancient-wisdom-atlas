canonical_text:
  quote: ''
  summary: The passage describes practical hunting, fishing, food preparation, and
    storage practices. It includes coordinated deer drives through a defile, firearm
    use and rapid loading, snaring and snowbank deer capture, use of small game, fishing
    through ice or with nets, pounding dried meat, rendering marrow and fat, and eating
    eggs, embryos, and unborn reindeer.
  language: English
