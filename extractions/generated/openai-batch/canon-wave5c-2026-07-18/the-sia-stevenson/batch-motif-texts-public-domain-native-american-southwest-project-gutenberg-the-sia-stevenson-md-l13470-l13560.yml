literal_observations:
- id: obs:1
  text: Men position themselves in a narrow defile and along a ravine so a deer herd
    driven from behind is met by shooters from multiple sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deer are described as panicking, standing, walking without fleeing, and
    then being destroyed or scattered.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The firearms described are cheap muzzle-loading single-barreled shotguns loaded
    rapidly with loose powder, a dropped ball, and a cap kept between the fingers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that careless or rapid loading can lodge the ball, burst
    the gun, or allow the ball to roll out when shooting downhill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A third deer-procurement method is identified as snaring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
