  quote: ''
  summary: 'The passage reports Iowa statements about the sun and winds as wakantas
    or gods: a bear was offered to the sun; Wind/Tatce was called one of seven great
    gods; offerings were made to the beneficent South Wind; the North-east Wind was
    called maleficent. The author adds that Winnebago personal names suggest winds
    were regarded as powers by that people.'
