  quote: ''
  summary: The passage summarizes Mandan beliefs about a huge lake-dwelling serpent
    that receives offerings, a tradition in which Mandan youths are carried to a village
    of giants and one youth becomes a huge serpent after killing and eating a serpent,
    and thunder lore in which a gigantic mountain-dwelling bird creates thunder, lightning,
    and rain, while a cloud-dwelling tortoise creates isolated loud thunderclaps.
