canonical_text:
  quote: ''
  summary: 'Ethnographic account of Kansa rites associated with the Thunder-being:
    cedar smoke and prayers at the first spring thunderstorm; handling of a sacred
    bag, mystery pipe, war chart, sacred songs, gesture of invocation, sacred clam
    shell, and war pipe smoke; mention of Wakanda as first singer and intercessor;
    warpath prayers and songs to stop or cause rain.'
  language: English with Kansa terms and song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first thunderstorm in spring, the Lu or Thunder-being gens placed green
    cedar on a fire to make smoke, and the storm ceased after members of other gentes
    offered prayers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buffalo or Tcedunga gens aided the Lu gens by sending a man to open a
    sacred gray hawk-skin bag and remove the mystery pipe; these objects were kept
    by Kinuyinge, a Lu man who was not allowed to open the bag.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pahale-gaqli of the Large Hanga gens and Ali-kawahu of the Small Hanga gens
    are described as leaders in matters pertaining to war.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pahale-gaqli provided a copy of a war chart bearing symbols of mystery songs;
    fire was supposed to be represented at the center, but he said he feared to draw
    it there without fasting and other precautions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The songs connected with the war chart are described as mysterious and not
    to be sung on ordinary or profane occasions, lest the offender be killed by the
    Thunder-being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A song associated with removing the wrappings from the sacred pipe includes
    a final line identified as an invocation of the Thunder-being.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the invocation, the arms are held up toward the sky with palms outward,
    kept apart and parallel, and each arm is rubbed from wrist to shoulder by the
    opposite hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After three songs are sung, Pahale-gaqli carries the sacred clam shell on
    his back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The second figure on the chart is a venerable man or Wakanda, described as
    the first singer of all the Hanga songs; when Ali-kawahu and Pahale-gaqli sing
    them, they think this Wakanda walks behind them and prays to the Thunder-being
    for them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a Hanga man smokes the war pipe, he holds it in his right hand and blows
    smoke into the sacred clam shell in his left; the smoke is said to ascend from
    the clam shell to the Thunder-being and to be pleasant to him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Kansa formerly cried to the Thunder-being before going on the warpath;
    the captain, identified as the head of the Large Hanga gens, is quoted as asking
    Wakanda for a Skidi or Pawnee Loup person to die.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Men of the two Hanga gentes unite in singing songs to stop rain when fair
    weather is needed and songs to cause rain during drought.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote states that the song and invocation of the Thunder-being are used
    by the Ponka as well as by the Kansa, and compares a Hunkpapa Dakota thanksgiving
    sign that moves the hands in the opposite direction.
  category: relationship
  evidence_refs:
  - ev:7
