canonical_text:
  quote: ''
  summary: 'The passage gives a technical account of preparing animal skins: making
    and using a serrated bone or metal scraping tool, removing and reusing subcutaneous
    tissue, tanning with organic materials, softening and drying skins, sorting skins
    for trade or domestic use, noting insect damage and seasonal quality, and beginning
    a description of smoking skins for moisture resistance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tool for removing particles from the flesh side of a skin is made from a
    reindeer hind-leg bone, sometimes fitted with a serrated iron or steel piece,
    or replaced by a wooden handle with a metal point.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The skin is placed flesh-side up over a stake, and a kneeling person lifts
    an edge and strikes with the tool to separate subcutaneous tissue from the skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The removed subcutaneous tissue is washed, dried, and used as a covering for
    bundles of dried meat and other articles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The skin is worked to remove moisture and then receives a tanning material
    made from putrefying brain, liver, and fat; wine is sometimes used for soaking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After tanning material is worked in and excess matter is scraped away, the
    skin is scraped and rubbed until pliable; powders such as chalk, clay, calcined
    bone, or flour may be used to absorb remaining oil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Skins with hair for clothing and skins intended for buckskin are treated by
    the described process, while parchment skins are rubbed with fat and dried.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Large numbers of skins prepared for spring trade require sustained labor,
    and the passage links this labor demand with an energetic or wealthy man having
    multiple wives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Skins selected for sale are bundled and covered with parchment skins or subcutaneous
    tissue; skins used within the group are generally lower-grade skins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A gad fly infests deer by puncturing the skin and depositing eggs; larvae
    develop beneath the skin, exit in spring, and leave wounds and scars that lower
    the value of dressed skins.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The passage states that skins are in best condition from September to mid-December
    because newly deposited eggs have not yet produced damaging larvae and earlier
    wounds have healed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some skins for special purposes are smoked to reduce moisture damage, and
    tents and footwear are always smoke-tanned after the skins have been made pliable.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: For smoking, rotten dry wood of a particular spongy character is sought and
    dried; two skins of similar size and condition are sewn into a bag with the hairy
    side inward, but the supplied excerpt ends before completing the process.
  category: sequence
  evidence_refs:
  - ev:10
