canonical_text:
  quote: ''
  summary: The passage introduces dancing societies as probably connected with cults
    under discussion, then describes the Otter Dancing Society. Members shoot at one
    another with otter-skin bags, a practice compared to the Wacicka dancing society
    of the Omaha. Some accounts say the bags are waved to infuse the otter's spirit
    into a bead in the bag's mouth, causing members to be knocked down. Participants
    profess to keep a small round object in the breast, cough it up before or during
    the dance, use it to shoot a companion in the neck, and swallow their own shell
    or pebble at the end.
