canonical_text:
  quote: ''
  summary: 'OCR-corrupted English fragments from animal narratives labeled in the
    passage as Hudson Bay Eskimo. One episode concerns an otter married into a wolf
    family: a mark or pile guides the wolf relatives to the otter household, where
    hungry wolf kin arrive, frighten young otters, and eat. A later fragment mentions
    hunting deer. Another fragment concerns a rabbit encountering a frog alone in
    a tent and offering to carry the frog.'
