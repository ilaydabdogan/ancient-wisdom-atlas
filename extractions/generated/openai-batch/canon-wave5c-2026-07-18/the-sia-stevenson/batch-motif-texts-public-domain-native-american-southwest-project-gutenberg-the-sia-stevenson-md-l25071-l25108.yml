canonical_text:
  quote: ''
  summary: The passage describes the Double Woman as two very tall females, probably
    connected, with horned feathered headdresses, turtles and feathers attached to
    moccasins, blue and yellow body or garment markings, and a lodge on a high black
    cliff. They laugh, swing on a hill, dance, reflect light with a mirror, jump,
    and sing. A person who sees them vomits something like black earth and dies. Their
    origin and manner of living are said to be mysterious; later tall women are said
    to imitate them. A note reports both Teton skepticism about the story's source
    and the appearance of the character in two Santee myths.
  language: English
  quote_policy: summarized
