canonical_text:
  quote: ''
  summary: The passage describes marriage arrangements, forcible taking of a prospective
    wife after refusal, loose marital ties, polygyny, domestic conflict, a rival-suitor
    combat, gendered labor, puberty and childrearing customs, rare twins and paternity
    assignment, and a Naskopie burial at a trading station with a shallow grave, coffin,
    and tree branch placed at the grave head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man seeking marriage asks the girl's parents or nearest relatives for consent
    and may offer presents to win their favor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the girl refuses, her relatives are described as unable to change her heart,
    and she may then be forcibly taken to the man's or his father's tent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The marital tie is described as loose and dissolvable by either party on slight
    provocation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Taking multiple wives is described as not uncommon for wealthy men, with additional
    wives said to be taken mainly for labor associated with a successful hunter's
    household.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Co-wives may dwell in the same tent, quarrel because of jealousy, and fight
    among themselves; the husband may intervene violently when he thinks matters go
    too far.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman may attack her husband, and the passage states that public ridicule
    after such an incident is treated as especially painful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In one anecdote, an enraged wife strips her husband's clothing, tears the
    tent from its poles, takes property to a canoe, paddles upstream, and later resumes
    relations after he follows her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two men seeking the same woman are said to have gone by canoe to a lake and
    fought with deer spears; one was killed and the other obtained the woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women are described as performing much of the manual labor, including bringing
    home slain food, fetching wood and water, tanning skins, making clothing, erecting
    tents, and hauling sleds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Females are described as reaching puberty around ages fourteen or fifteen
    and being taken as wives at even earlier ages.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: After birth, the child is not allowed nourishment until the third day, water
    must not touch its body, and it is swaddled with skins or cloths using sphagnum
    moss next to the body.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Girls are described as neglected while boys are given advantages; twins are
    rare; if paternal origin is obscure, the woman's husband at the child's birth
    is supposed to be the father.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The described Naskopie burial at the trading station uses a shallow sandy
    grave, a rudely constructed coffin, dirt covering, and a small tree branch placed
    at the grave head; the branch's signification is reported as uncertain.
  category: sequence
  evidence_refs:
  - ev:11
