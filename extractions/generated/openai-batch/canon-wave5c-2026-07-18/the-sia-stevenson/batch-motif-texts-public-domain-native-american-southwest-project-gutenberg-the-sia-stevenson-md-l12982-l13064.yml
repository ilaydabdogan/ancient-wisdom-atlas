canonical_text:
  quote: ''
  summary: The passage gives an ethnographic comparison of Indians and Eskimo in conflict,
    co-camping, travel technologies, endurance, family conduct, illness, death, and
    remedies. It reports that illness is treated by shamanic drumming and mumbling,
    by potions from a white trader, and by other applied or swallowed substances;
    the shaman is said to claim control over a spirit causing disease and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that in earlier struggles the Indian found the Eskimo to
    be a sturdy opponent, and that after the troubles the Eskimo withdrew to present
    haunts while wandering over the land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Indian and Eskimo camps as sometimes being near each
    other, with aged Indian men and women left behind by younger winter hunting parties
    depending on nearby Eskimo hosts for supplies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Indian is described as more expert on snowshoes, while Eskimo snowshoes
    are described as obtained by barter from Indians or as an imitation of neighboring
    Indian forms.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage contrasts the Indian’s familiarity with the canoe with the Eskimo’s
    familiarity with the kaiak, which is said to withstand severe weather and rough
    water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Eskimo endurance is described as greater than Indian endurance, including
    an example of several Eskimo men carrying barrels of flour up a steep hill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Both groups are said to withstand cold, but Eskimo clothing is described as
    better adapted for cold and Eskimo fasting endurance is described as greater during
    food scarcity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children are described as obedient to parents, with little chastisement and
    no disrespect to parents reported.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that men who have been absent from one another may embrace
    and shed tears at meeting, while women are described as less demonstrative.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lung and bowel diseases are described as prevalent, with lung diseases attributed
    to exposure, foul air, resinous fuel odors, and smoke filling the dwelling interior
    when wind enters the door.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A period of dry-meat subsistence followed by sudden deer capture is described
    as leading to gorging and subsequent digestive illness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: During illness the people are described as stolid, and approaching death is
    said to have little terror for them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The remedies employed are described as drum beating and shamanic mumbling,
    with the shaman claiming control over the spirit that causes disease and death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The people are described as believing in potions compounded by a white trader,
    sometimes made from substances such as red ink, red pepper, ginger, or other pungent
    materials.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage says that powders are rubbed over the seat of pain and liniments
    are swallowed, and that people often report beneficial effects and ask for more.
  category: action
  evidence_refs:
  - ev:9
