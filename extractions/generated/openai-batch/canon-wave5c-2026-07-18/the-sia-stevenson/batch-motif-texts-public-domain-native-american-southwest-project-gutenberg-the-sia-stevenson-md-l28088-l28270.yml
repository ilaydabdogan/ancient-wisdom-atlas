- id: obs:2
  text: The passage states that it is unsafe to infer that all buffalo gentes are
    Water people merely because two Omaha buffalo gentes claim a subaquatic origin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The power of each of the four classes of elemental gods is said to extend
    beyond its special element.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Unktehi is described as ruling in the water and having servants or allies
    including a black owl in the forest, eagles in the air, and serpents in the earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Thunder-beings are described as having servants including the bear, the
    beaver, the butterfly, and the deer; the bear is placed in the ground, the beaver
