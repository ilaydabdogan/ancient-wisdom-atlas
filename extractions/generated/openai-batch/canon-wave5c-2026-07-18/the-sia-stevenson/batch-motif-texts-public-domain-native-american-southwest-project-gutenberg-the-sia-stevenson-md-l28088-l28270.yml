canonical_text:
  quote: ''
  summary: The passage cautions against assigning gentes and subgentes to elemental
    categories without evidence. It states that the powers of elemental gods extend
    beyond their own elements, gives Unktehi and the Thunder-beings as examples with
    animal servants or allies in multiple domains, and introduces a list of composite
    names that may symbolize earth, fire, air, and water, with some assignments marked
    as conjectural.
  language: English
  quote_policy: summarized
