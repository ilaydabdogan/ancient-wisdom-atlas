  summary: The passage reports that the group named in the printed text speaks of
    Tchutka/Catka/Left Hand, a former chief, only with respect. They believe his shade
    guards a sacred tree and can affect the abundance or absence of buffalo and other
    animals. When passing, they make sacrifices and present a calumet to tutelary
    spirits and the manes of Tchatka. He is described in their calendar as the greatest
    man or genius to have visited their nation.
