canonical_text:
  quote: ''
  summary: The passage describes fasting and visionary or dream experiences among
    Omaha, Kansa, and Kwapa contexts. It lists superhuman beings and animals encountered
    in visions, guardian spirits, shaman societies organized around Thunder, Buffalo,
    and other animals, powers of rain-making, healing, divination, and death-foresight,
    and reports connections between the Omaha Ghost Dance and Ponka practice. It also
    describes Kansa shield painting of vision objects and a vision of a flying serpent.
  language: English with Omaha, Kansa, and Kwapa terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fasting for several days is described as probably tending to produce the mental
    and bodily condition for supposed superhuman communications.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people thought they saw or heard ghosts, animals, mysterious voices,
    or had interviews with named superhuman beings and animal ancients.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A being or animal seen in a dream or vision was regarded as the special guardian
    spirit of the person who claimed the interview.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Those who had interviews with the Thunder-being did not dance at their society
    meetings; they feasted, remained seated, sang songs referring to the Thunder-being,
    and ended the ceremony after eating and singing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Thunder shaman order claimed power to make rain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some informants said shamans could make circles of seven colors around the
    sun and moon, while another explanation identified the moon circle as a cloud-related
    halo resembling a rainbow.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Buffalo society included surgery, sweet medicine, and buffalo songs claimed
    as powerful curing charms when used by the order's surgeons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage lists Omaha societies of Horse shamans, Big Wolf shamans, and
    Grizzly Bear shamans in addition to Thunder and Buffalo-related orders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Francis La Flesche describes three degrees of visionary power: an animal
    vision grants aid in danger and success; a cloud or winged human form with a voice
    adds foretelling events; a voice without visible form adds foreseeing death.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person endowed with the third degree of visionary power could join the Ghost
    Society or practice individually.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Joseph La Flesche reported that the Ghost Dance formerly belonged to the Ponka
    and was taken by the Omaha, and the author links the Ghost Society and Ghost Dance
    by their names.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the Kansa, a person who had a vision or dream of an animal painted the
    mystery object on his shield.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Kansa old woman had visionary experience of a flying serpent, and the passage
    says remains of such enormous serpents are found in the Black Hills and that one
    who finds such a reptile must die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Kwapa, shamans and doctors are called mysterious men, and listed
    societies involve superhuman communications or interviews with Buffalo, Grizzly
    Bear, Panther, and Beaver.
  category: relationship
  evidence_refs:
  - ev:8
