canonical_text:
  quote: ''
  summary: 'The passage describes several material and social practices: an irregular
    rolling ball; an Inuit/Northerner game using marked ivory pieces matched by design;
    high-stakes gambling reports; girls'' doll and snow-house play; a locally made
    violin modeled on instruments seen among whites; and comments on ornamentation
    and artistic skill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ball may be formed from two irregular hemispheres joined into a sphere that
    rolls only in a certain direction and causes confusion through an erratic course.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Inuit called “Northerners” from the western end of Hudson Strait have
    a game using sets of irregularly shaped ivory pieces marked on one face with spotted
    patterns.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A set of the ivory game pieces varies from 60 to 148 pieces and is named Amazn'alit
    in the passage's transcription.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The game is played by two or more persons who sit down, pile the pieces, mix
    them in view, take shares, and match pieces with similar designs until one player
    has used all pieces taken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The game pieces are designed in pairs with names including sled, canoe, navel,
    many, and numerals, and the rules require matching like kinds, with a special
    condition for a barred Amazut piece.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The game is known in the Ungava district only among those who learned it from
    the Northerners.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The northern Eskimo are described as staking even the last article they possess
    on the game, and wives are described as temporarily disposed of or sometimes relinquished
    to the victor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator reports hearing that wives so disposed of sometimes sit down
    to play and win themselves back to their former owners.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Little girls play with dolls, build small snow huts, keep playthings there,
    and play at keeping house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The collection includes eleven dolls, most elaborately and accurately dressed,
    and doll clothing.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The only musical instrument the narrator observed was a locally made violin,
    modeled on violins seen among whites, made of birch or spruce with two loosely
    twisted sinew strings, a whalebone bow, spruce-gum resin, and played across the
    lap.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: An old woman from whom the narrator procured the instrument could play several
    airs or songs on the handmade violin.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator states that weapons and other implements are not adorned with
    animal carvings, natural objects, or conventional patterns, while garments and
    dolls show artistic skill.
  category: attribute
  evidence_refs:
  - ev:10
