canonical_text:
  quote: ''
  summary: The passage describes a Snake society rain ceremonial in a ceremonial chamber,
    including participant placement around an altar, ritual dress and implements,
    song and rattle actions, invocation of cloud people to water the earth, use of
    plumes, yaya objects, and water. It also describes degree restrictions for ritual
    access and snake-handling, the giving of a yaya fetich to new medicine-order members,
    two cult-society healing methods, and compensation of the theurgist with a sacred
    shell mixture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Snake society was joined in the ceremonial chamber by the Kaplna, and
    the passage states that the h6naaite of one organization may invite other societies
    to take part in his ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants formed a seated line behind the altar, with the h6naaite positioned
    behind a central slat figure associated with the h6naaite of the cloud people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants were seated near corresponding symbolic figures of cloud and
    lightning people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: An eight-year-old boy was awakened to take his place in the line, while a
    four-year-old boy was led from the room because he had not entered the degree
    allowing him to hear the songs or see the making of medicine water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The men and boy held gourd rattles in their right hands and two eagle plumes
    in their left hands.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The women held two turkey-plume wands in the right hand and wore coral, kohaqna
    beads, and turkis attached to necklaces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ceremonial opened with rattling and song, and women accompanied the men
    in the song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The vicar stood before the altar, shook his rattle, and waved it in a circle
    over the altar six times for the cardinal points.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage explains that the circle indicated an invocation of all cloud
    people of the world to water the earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the third stanza the h6naaite took a yaya in each hand, while men swayed
    rhythmically and women waved their wands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the close of the stanza the h6naaite called for the cloud people to gather,
    participants drew a breath from their plumes, and a woman placed a vase of water
    and gourd before the altar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that a person must pass through three degrees before being
    permitted to handle snakes, and that minors cannot enter the third degree until
    judged amenable to the rules by the h6naaite.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A new medicine-order member receives the ya'ya fetich from the theurgist,
    who must practice continency for four days before preparing it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cult societies are described as curing disease by sucking when witches have
    cast worms, stones, yarn, or similar things into the body, and by brushing with
    straws and eagle plumes when angry ants or other insects are involved.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The only compensation described for the theurgist is the sacred shell mixture,
    and the passage contrasts this with compensation practices among other Indians
    known to the writer and with some pueblos.
  category: relationship
  evidence_refs:
  - ev:11
