canonical_text:
  quote: ''
  summary: The passage describes several Innuit groups and their travel routes, physical
    descriptions, language differences, customs around death and old age, gender relations,
    gambling practices, games using walrus ivory pieces, strength contests, feasts
    in snow-block structures, clothing and boot construction, annual trade journeys,
    and the Itivimyut name and location.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some travelers make the homeward journey along the coast because snow remains
    there longer, and warm weather can delay the journey until summer or the next
    winter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Innuit accompanying these parties have not seen white men before arriving
    at Fort Chimo, and women are often included in the party.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described people are said to be tall and physically well built, with men
    larger than the average white man and women comparable in stature to medium-height
    women elsewhere.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tahagmyut are described as having distinct customs and a dialect marked
    by deeper gutturals and more prolonged vowels.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tahagmyut are said to retain old games that the Sûkhl'nmyut have forgotten
    or no longer play.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The dead are treated with no ceremony: limbs are lashed to the body and the
    corpse is exposed to the elements away from immediate sight of the camp.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Old and infirm people dependent on others for food are said to be strangled
    or left behind when the camp moves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women are described as held in little respect, while husbands or lovers are
    said to punish wives' incontinence and may kill persistent male offenders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gambling is described as common among both sexes, with lives, wives, garments,
    and other possessions sometimes staked on games.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A usual game uses flattened walrus-ivory pieces marked with dotted designs
    that must be matched; the narrator compares it to dominoes and reports uncertainty
    about its origin.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Other amusements include strength tests such as wrestling and leaping.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Feasts are held at stated times in large structures made of snow blocks, though
    their exact meaning was not learned.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Dress is made of seal and reindeer skins, with sealskins worn during rainy
    weather and by people in canoes or kayaks.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Garment skirts are ornamented with many pear-shaped ivory pieces that rattle
    as the wearer walks.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: Boot soles are made with short loops of sealskin thong on a false sole, helping
    prevent slipping on smooth ice.
  category: object
  evidence_refs:
  - ev:14
- id: obs:16
  text: The third subdivision described consists of Innuit living on the eastern shore
    of Hudson Bay between latitudes 53° and 58°.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:17
  text: A small party travels each year to Fort Chimo to barter furs and other valuables.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: These eastern Hudson Bay Innuit are described as differing greatly in speech
    from the Koksoak Innuit, with rapid, harsher speech and words that may differ
    in form or meaning.
  category: attribute
  evidence_refs:
  - ev:17
- id: obs:19
  text: Missionary teaching is said to have influenced some of these people, especially
    those nearer the trading station.
  category: relationship
  evidence_refs:
  - ev:18
- id: obs:20
  text: These people are called Itivimyut, explained as meaning people of the other
    side.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:21
  text: The northern Itivimyut are described by the narrator as probably the most
    superstitious Innuit in the region under consideration.
  category: attribute
  evidence_refs:
  - ev:20
