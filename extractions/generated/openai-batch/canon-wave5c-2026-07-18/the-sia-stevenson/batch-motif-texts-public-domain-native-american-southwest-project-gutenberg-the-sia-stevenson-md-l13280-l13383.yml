canonical_text:
  quote: ''
  summary: 'The passage describes preserved bear-lip mementos decorated with pigment,
    beads, and a fish-shaped pendant, then gives an account of seasonal occupations:
    spring travel to Fort Chino for trade, summer wood rafting and dispersal, winter
    fur hunting, and autumn reindeer procurement along the Koksoak river.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bear under-lip is preserved as a memento; the skin is cut off, spread flat
    to dry, and painted on the flesh side with powdered hematite mixed with water
    or oil.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear-lip memento is ornamented with a single row of multicolored beads
    along the outer edges or lips.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cloth fish-shaped pendant, about 3 or 4 inches long and encircled by beads
    around the body, is attached at the apex or middle of the lip.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: These mementos are obtained from hunters who risk their lives in struggles
    to capture barren-ground bears.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In spring, Indians of both sexes come to Fort Chino to trade the winter hunt
    of fur-bearing animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old men, women, and children approach the post slowly by stages and try to
    arrive near the time when earlier parties come in to trade.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the post, separated parties meet after months apart, rest, trade furs and
    other articles, and acquire goods such as guns, ammunition, tobacco, cloth, flour,
    biscuit, peas, beans, rice, sugar, molasses, needles, beads, and calico.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After receiving an advance allowance for the next winter hunt, the parties
    are relied on to raft wood cut by white men for the next winter fuel supply.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men choose summer and fall localities, announce intended locations, and parties
    gradually leave the post for their destinations.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The winter is described as the period for getting furs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The various parties disperse in different directions so that the district
    may provide products for their benefit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The people are described as knowing animal habits well enough to go to particular
    localities to find the game they seek.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Reindeer provide most of the food and their skins provide clothing.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Although other foods include ptarmigan, fish, and other game, deer are the
    main reliance; without deer, they consider themselves starving even if other food
    is abundant.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Deer are procured in several ways, chiefly by lance or spear.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: In September and October deer collect from various directions near the Koksoak
    river area, while smaller herds swim back and forth between banks.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Female reindeer go to treeless hills and mountains of the Cape Chidley region
    to give birth in late May or early June, later leading their young to localities
    where males also return.
  category: sequence
  evidence_refs:
  - ev:12
