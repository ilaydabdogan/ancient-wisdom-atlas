canonical_text:
  quote: ''
  summary: The passage describes Iowa, Oto, and Winnebago references to the Thunder-being
    as a Wakanta, a large bird, and a sacred figure honored with a spring feast. It
    notes Winnebago Thunder-being gens names, conflict between Thunder-beings and
    Submarine Wakantas, a story of a man aiding the Thunder-being against a subaquatic
    power with mixed consequences, and a warrior return custom involving plaited grass
    associated with Thunder-being worship.
  language: ''
  quote_policy: summarized
literal_observations:
