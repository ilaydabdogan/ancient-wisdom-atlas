- id: obs:4
  text: The Winnebago have a Thunder-being sub-gens within the Bird gens.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Thunder-beings are described as enemies of the Waktceqi, or Submarine
    Wakantas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Winnebago personal name, Five-horned Male, is said probably to refer to
