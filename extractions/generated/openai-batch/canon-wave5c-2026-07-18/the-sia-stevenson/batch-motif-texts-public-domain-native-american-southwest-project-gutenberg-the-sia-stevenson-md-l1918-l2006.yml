canonical_text:
  quote: ''
  summary: Two brothers use beautiful red lightning arrows, alarming their mother
    and grandmother; cloud people later return the arrows with rain. The mother warns
    the brothers not to go west because of a dangerous antelope that will eat them.
    Ma'asewe persuades his younger brother to go anyway. A mole helper makes an underground
    road and spy-hole beneath the antelope, enabling Ma'asewe to shoot the antelope
    in the heart. The wounded antelope searches in all directions, tears up the earth
    along the tunnel with his horn, and dies. The mole verifies the death and covers
    himself with the antelope's heart-blood as proof.
  language: English
  quote_policy: summarized
