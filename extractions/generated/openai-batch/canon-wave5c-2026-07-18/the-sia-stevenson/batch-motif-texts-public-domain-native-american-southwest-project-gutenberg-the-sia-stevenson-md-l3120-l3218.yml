canonical_text:
  quote: ''
  summary: 'Ethnographic description of preparations and altar arrangement for a Sia
    Snake Society rain ceremonial: ha''chamoni and plume offerings are prepared, sand
    paintings are made before a slat altar, ya''ya fetiches and other sacred objects
    are arranged, beings are invoked through images, and the officiants sit near a
    low fire after prayer. Footnotes describe willow-twig collection for ha''chamoni
    and compare Sia sand-painting technique with neighboring traditions.'
  language: English with Sia ritual terms as printed
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite and his vicar spend the morning preparing ha'chamoni and plume
    offerings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ha'chamoni are described as symbolic of the beings to whom they are offered,
    with messages or prayers conveyed through notches on the sticks.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Snake Society deposits ha'chamoni with plume offerings when rain is desired.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At about 4 p.m. the ho'naaite, his younger brother, and a third society member
    make two sand paintings in relation to the slat altar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Six ya'ya are removed from long buckskin sacks; four belong to the ho'naaite,
    while the others belong to the vice ho'naaite and the third member.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ya'ya are carefully preserved for sacred value and material value, including
    costly parrot plumes obtained through trade or journeys involving Mexico and border
    Indians.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ya'ya are wrapped in cloth, buckskin, another cloth, splints, and a buckskin
    string.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The altar arrangement includes ya'ya on a meal parallelogram, an image over
    the north post, a sacred honey gourd, a meal basket, corn pollen in a shell, medicine
    bags, an arrow point, pottery bowl, feather wands, offerings in a Tusayan basket,
    five stone knives, a white stone bear, and a parrot attached to the central slat
    figure.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Women later carry feather wands while forming lines on the north and south
    sides of the room during the night ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the altar is completed, the ho'naaite and his associates supplicate
    the presence of the pai'atamo and Ko'pishtaia, represented by images that become
    abiding places of the invoked beings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After prayer, the ho'naaite and his vicar sit near a fireplace where a low
    fire burns and smoke cigarettes made with tobacco and corn husks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'A footnote describes collection of willow twigs for ha''chamoni: plumes are
    attached to a willow with a spoken payment formula, the marked tree is not cut,
    and a nearby tree is cut with an ancient stone knife.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A footnote states that Sia sand-painting preparation does not differ from
    Zuñi, Tusayan, and Navaho practice, with powdered pigment sprinkled between index
    finger and thumb.
  category: relationship
  evidence_refs:
  - ev:6
