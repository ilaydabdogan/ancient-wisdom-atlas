canonical_text:
  quote: ''
  summary: 'The passage describes household utensils and materials: wooden water vessels,
    bark berry baskets, buckskin-topped storage baskets, deer-leg-skin bags, stone
    and metal pestles, antler and wooden spoons and pothooks, tobacco use and exchange,
    tobacco-molasses drink, and stone pipes with spruce stems. It also states that
    some wooden vessels match Yukon River Indian vessels in shape and function.'
  language: English
  quote_policy: summarized
