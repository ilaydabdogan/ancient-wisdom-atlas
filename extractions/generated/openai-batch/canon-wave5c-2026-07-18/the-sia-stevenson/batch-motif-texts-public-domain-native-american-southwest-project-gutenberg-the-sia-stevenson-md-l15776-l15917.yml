canonical_text:
  quote: ''
  summary: The passage describes bows, arrows, spears, harpoon-like whale spears,
    snares, and hunting practices involving birds, deer or reindeer, white whales,
    and beaver in the Ungava district. It emphasizes weapon construction, hunting
    sequences, child use of bows and crossbows, and the scarcity of beaver.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bow and arrow are described as effective for striking ptarmigan or hare
    at about 25 yards, with great force on birds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In former years arrows were used against deer in water or deep snow after
    hunters on snowshoes drove the deer into such places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indian boys shoot small birds with bows, and children also use small crossbows
    said to have been copied from ones brought by a white man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A spear for killing swimming reindeer is described as having a six-foot wooden
    shaft, an eleven-inch steel point, and sinew fastening.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reindeer spear is held with an awkward grasp that allows the user to let
    go if a thrust is misdirected.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Models of deer spears are sometimes also used as arrows for larger game when
    a hunter is out after ptarmigan, hare, and rabbits.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Little Whale river Indians use a spear for white whales that is modeled
    after an Eskimo harpoon, but with fore shaft and loose shaft in one piece and
    a wooden disk replacing the bladder float.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The snare is made from reindeer-skin parchment strands plaited into a line,
    with a loop and noose formed at the end.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: For deer snaring, people set nooses in a narrow defile, surround the herd,
    shout, create din, and drive the animals toward the snares while concealed hunters
    add confusion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Snared deer are held until their throats are cut or until they are choked
    by the cord; two deer may be caught in a single snare by their antlers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Although guns reduced the importance of snaring, the passage says the Indian
    still uses snares when possible; some snares are ornamented with beads or colored
    red with vermilion and hematite earths.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Beaver are described as scarce in the Ungava district, with scarcity attributed
    to limited food supply north of latitude 55.
  category: setting
  evidence_refs:
  - ev:10
