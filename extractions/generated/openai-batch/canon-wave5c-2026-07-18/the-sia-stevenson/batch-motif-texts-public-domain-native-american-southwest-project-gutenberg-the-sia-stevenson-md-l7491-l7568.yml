canonical_text:
  quote: ''
  summary: The passage recounts a Coyote and Rattlesnake tale in which each visits
    the other's house, refuses unfamiliar food, and uses corn pollen as food. Coyote
    imitates the rattlesnake's rattle and manner of moving but cannot eat pollen from
    the top of his head, and he leaves hungry while the snake laughs. The passage
    then begins a separate skátona account describing a mountain-dwelling plumed serpent
    that draws people to itself with its breath and devours them.
