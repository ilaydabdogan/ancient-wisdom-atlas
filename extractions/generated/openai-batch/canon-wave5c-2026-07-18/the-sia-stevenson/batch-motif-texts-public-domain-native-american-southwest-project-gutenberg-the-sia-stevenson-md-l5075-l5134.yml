canonical_text:
  quote: ''
  summary: A ceremonial altar sequence describes participants singing, preparing medicine
    water with water, pollen, meal, se'wili, plumes, feathers, wands, rattles, and
    directional gestures, while repeatedly petitioning the cloud people to gather
    and water the earth. The rite closes near midnight with administration of the
    medicine water and deposition of offerings by the ho'naaite.
  language: English, with Indigenous ceremonial terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All participants stand while a song continues without cessation for an hour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman brings a vase of water and a gourd from the southwest corner and places
    them before the altar on the line of meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ho'naaite takes four medicine bags from the west side of the altar, gives
    two to the man and two to the boy, and gives a shell containing pollen to the
    woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman stands east of the meal line, sways with a wand and shell, pours
    water into the medicine bowl, and invokes Quer'ranna and the cloud people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite, boy, and vicar add se'wili, pollen, or meal to the medicine
    bowl while petitions to the cloud people are repeated.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Successive gourdfuls of water are waved toward the north, west, south, and
    east before being poured into the medicine bowl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the woman officiates in making the medicine water
    because the vicar is paralytic and unable to perform that duty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ho'naaite dips plumes into the medicine bowl, sprinkles the altar, chants,
    moves his body violently from the knees, and calls for the cloud people to gather.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Participants dip feathers or wands into the medicine water, strike them with
    a rattle, invoke the cloud people, and repeat the sprinkling alternately six times
    while cardinal points are indicated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At midnight the ho'naaite places feather ends in his mouth and draws a breath,
    the woman lays her wand to the east side of the meal painting, medicine water
    is administered with a shell, and the ho'naaite deposits offerings.
  category: sequence
  evidence_refs:
  - ev:6
