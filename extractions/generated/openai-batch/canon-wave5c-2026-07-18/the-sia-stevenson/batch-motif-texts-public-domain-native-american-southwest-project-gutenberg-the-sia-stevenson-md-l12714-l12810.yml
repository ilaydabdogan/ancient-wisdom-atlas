  text: A raven eludes an attempt to be painted and refuses to come near.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People in a boat ask a woman with her children to cross over land near a violent
    stretch of water and a high cliff, promising to wait for her on the other side.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman becomes confused when the boat voices grow indistinct, suspects
    desertion, remains by the cliff crying the last words she heard, and changes into
    a gull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman teased for the shortness of her neck often sits on high places, changes
    into a hawk, and cries out about who called her short-necked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small children described as extraordinarily wise play at building toy houses
    on a high cliff and are named Zulugagnak, like a raven said to know past and future.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wise children change into small birds that continue building mud houses
    on cliff rocks near camps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hare is described as an abused child with long ears who went to live alone,
    lays its ears down when seeing people, and has no tail because it formerly had
    none.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wolf is described as a poor woman with many hungry children; they become
    gaunt, change into wolves, and roam seeking food while the mother cries to console
    them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lice are said to drop from a huge spirit in the upper regions who is punished
    by being tormented by them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mosquitoes arise from dirt particles flung from a poorly cleaned skin garment
    after a husband reproaches a negligent wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A solitary hunter repeatedly returns to find his house ordered, clothing and
    boots scraped and dried, and hot food prepared, though no tracks are visible.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hunter watches, sees a fox enter, then enters and finds a beautiful woman
    in skin clothing with a fox skin hanging inside the house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The woman says she is the hunter's wife and that performing the household
    labor is her duty.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the husband notices a musky odor, the fox wife says she emits it and
