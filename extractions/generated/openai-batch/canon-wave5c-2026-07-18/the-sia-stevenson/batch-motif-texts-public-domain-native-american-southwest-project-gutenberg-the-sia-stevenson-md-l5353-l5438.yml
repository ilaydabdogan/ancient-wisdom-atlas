canonical_text:
  quote: "“as payment to the cloud people for watering the earth”"
  summary: 'The passage describes Sia post-hunt rites: a cougar-society ho''naaite
    visits returned hunters, prays with a cougar fetish over antelope game, and thanks
    the cougar. The game is later divided among cult societies, prepared with ha''chamoni,
    songs, altars, and offerings deposited at directional cougar shrines, to the sun
    father, and in fields so the cloud people will water the earth and crops may grow.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The ho'naaite of the cougar society visits the houses of returned hunters
    and first enters the house of his vicar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first house, the young man is embraced, and the ho'naaite repeats a
    prayer of thanksgiving for hunt success and safe return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Antelope meat and bones are emptied onto a sheepskin, and a small cougar fetish
    is touched repeatedly to the meat while the ho'naaite prays.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prayer is addressed to the cougar, thanking him for sending his children
    over the land so the Sia might secure them as payment to the cloud people for
    watering the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: In another house, antelope meat is laid on a bear skin; the skin, skull, and
    antlers are arranged, beads and a white embroidered blanket are placed over the
    skull and carcass, and sacred meal is set before the head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ho'naaite clasps his hands four times over the antelope skull, draws a
    breath, and blows the first cigarette whiff over the antelope while extending
    the cigarette toward it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The war chief visits the houses and sprinkles antelope with corn pollen, draws
    a sacred breath from the game, and offers the first cigarette whiff toward it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When game is shot, the hunter dips his fetish into the blood and tells it
    to drink; blood scraped from fetishes may be drunk in water to increase hunting
    success.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The game remains in hunters' houses until the following morning, then is taken
    to the ceremonial house, divided by the ti'amoni, and carried by ho'naaites to
    ceremonial chambers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cult society members prepare ha'chamoni and cook the game; toward evening
    slat altars are erected, and the night is spent in songs and supplications to
    the cloud people to gather and water the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before sunrise, ha'chamoni and game are deposited at four shrines to the cougar
    of the north, west, south, and east so they will intercede for the cloud people
    to gather and water the earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ha'chamoni are also deposited to the sun father and in the fields as payment
    to the cloud people for requested services connected with watering the earth and
    crop growth.
  category: sequence
  evidence_refs:
  - ev:8
