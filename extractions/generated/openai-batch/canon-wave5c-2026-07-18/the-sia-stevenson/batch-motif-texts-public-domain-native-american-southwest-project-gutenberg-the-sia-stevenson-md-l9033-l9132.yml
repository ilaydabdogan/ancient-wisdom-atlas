canonical_text:
  quote: ''
  summary: The passage describes diseases among the people around Fort Chimo, relating
    illness to crowded, sealed, poorly ventilated huts; describes relief by a shaman
    or conjurer; outlines social responses to murder, revenge, taboo on Akpatok after
    a killing, ghosts of victims requiring offerings, treatment of aged people without
    relatives, suicide, and scarcity episodes involving hidden food, starvation, cannibalism,
    and expulsion from camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulmonary troubles are described as the principal diseases, attributed to
    crowded, poorly ventilated huts and decomposing animal food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Openings in huts are closed quickly to conserve heat, and a snow hut deserted
    for one night is avoided if its doorway was not tightly closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that about half of the Eskimo die of pulmonary troubles
    and that other diseases include blood-devitalizing illnesses such as scurvy, with
    sores and rapid death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relief for illness is usually attempted by a shaman or conjurer working on
    the imagination of the sick person, with will power and faith emphasized.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The magnitude of disease is said to be generally measured by the amount of
    the patient's worldly wealth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person whose character is no longer tolerated by the community is forbidden
    to enter huts, eat food, or have intercourse with the rest of the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A murderer may be surprised and put to death, usually by stoning, by several
    men whose action is publicly supported.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For premeditated murder, the next of kin is described as having a duty to
    avenge the deed, even after years.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Akpatok is described as tabooed after the murder of part of a wrecked vessel's
    crew, and people avoid it lest the ghosts of the victims appear and request relief
    requiring proper offerings.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aged people without relatives for support are often quietly put to death or
    neglected until they cannot keep up with a moving camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A corpse of a helpless person is described as having stones piled around it
    and being bound with thongs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A one-eyed old woman at Fort Chimo was proposed to be strangled to relieve
    her misery, but the proposed action was postponed when the eye improved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Suicide is described as not rare, with pitching from a cliff, strangulation,
    and use of a gun named as methods, and remorse or disappointed love named as causes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: During scarcity, a husband discovered his wife secretly eating stored fish,
    blocked the snow-hut entrance, and she remained inside until she died of starvation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: In great scarcity, some families are reported to have resorted to cannibalism
    after eating dogs, clothing, and other skin articles; unlucky or disliked women
    may be driven from camp.
  category: sequence
  evidence_refs:
  - ev:11
