canonical_text:
  quote: ''
  summary: 'The passage recounts several ghost-encounter episodes: a man frightens
    away an old-style woman with a rusty knife and later sees a burial scaffold; another
    man feeds and smokes with a skeletal male ghost, wrestles him, and wins when the
    fire blazes; a traveler shoots at unseen ghosts and later finds a disturbed grave
    with a wounded skull. A cited report states that belief in ghosts is widespread,
    that ghosts are heard near burial places, and that they speak in whistling tones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman described as being from the olden days approaches a man who lies still;
    she lifts his foot repeatedly and then draws a rusty knife as if to gash it before
    he springs up and shoots at her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman wears a skin dress with long fringe, a buffalo robe at the waist
    and over her head, a large-bead necklace, and decorated leggings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the encounter with the woman, the man sees a human burial scaffold with
    ragged dangling blankets and wonders whether it was the ghost that came to him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In another nighttime forest stay, a man makes a fire and hears a singer; the
    singer, identified in the passage as a male ghost, asks for food and receives
    wasna and tobacco in a pipe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The male ghost's hand is described as bones without flesh, his ribs are visible,
    and smoke pours out through his ribs as he smokes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The male ghost proposes wrestling; he says that if the man throws him, the
    man will kill a foe without hindrance and steal horses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the wrestling, the ghost becomes weak near the fire and strong when
    he pulls the man toward the darkness; after a firebrand makes the fire blaze again,
    the ghost falls as if coming apart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage states that the ghost''s prophecy was fulfilled: the man later
    killed a foe and stole horses.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A separate traveler kills rabbits, makes a fire after sunset in the forest,
    cooks a rabbit, and hears many voices without seeing anyone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The traveler concludes that he has encountered ghosts, lies beneath a fallen
    tree, and loads his gun with powder only.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ghosts whistle around the hidden man, surround him like rabbit hunters, and
    one ghost climbs onto the fallen tree and kicks him in the back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man shoots at the ghost; the ghost cries out, later says he was shot through
    the head and has come apart, and the other ghosts wail on the hillside.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At daybreak the man goes to the wailing place and finds graves, including
    one dug into by a wolf, with visible bones and a wound in the skull.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The cited report says belief in ghosts is profound and common, that people
    say they have met, seen, and conversed with ghosts, and that ghosts may be heard
    near places where the dead are interred.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The cited report says ghosts speak in a kind of whistling tone and may contract
    the face of a human being they meet.
  category: attribute
  evidence_refs:
  - ev:10
