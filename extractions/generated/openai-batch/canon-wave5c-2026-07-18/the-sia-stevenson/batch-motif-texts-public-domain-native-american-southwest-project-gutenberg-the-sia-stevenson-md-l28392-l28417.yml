canonical_text:
  quote: ''
  summary: The passage reports a belief that spirits of deceased members of two Omaha
    buffalo gentes return to buffaloes, then asks whether the abode of a disembodied
    spirit varies with the nature of an eponymic ancestor, using the Elk people as
    a questioned example. It then describes a division of religious duties among gentes
    and subgentes, with Omaha examples involving war regulation, peace duties, buffalo-hunt
    and cultivation regulation, pipe custody, pipe lighting, and a crier role.
  language: English
  quote_policy: summarized
