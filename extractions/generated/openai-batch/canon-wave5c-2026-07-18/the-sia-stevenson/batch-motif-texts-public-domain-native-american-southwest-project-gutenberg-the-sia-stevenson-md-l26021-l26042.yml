canonical_text:
  quote: ''
  summary: 'The passage describes Teton and Assinniboine modes of swearing or ordeal.
    Teton speakers invoke higher powers, the Thunderers, a horse, or the Earth as
    hearers, with death or family affliction expected if the speaker lies. A knife
    may be placed in the mouth, with death by knife expected after a lie. Assinniboine
    swearing is described through objects placed before the swearer: a gun, rattlesnake
    skin, bear''s claw, and wah-kon, each linked to a conditional punishment if the
    declaration proves false. In important affairs, Thunder is called to witness formal
    promises.'
  language: English with Indigenous-language terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Teton have no oaths or curses as described by
    the author, but can invoke higher powers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Teton speaker may say that the Thunderers hear him; if he lies, the Thunderers
    or one of them are expected to kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man may put a knife in his mouth; if he lies, he is expected to be stuck
    by a knife thereafter and die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A speaker may say that the horse heard him; falsehood is expected to bring
    death from a horse throwing him and breaking his neck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A speaker may say that the Earth hears him; if he lies, he is expected to
    die miserably soon and his family is expected to be afflicted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The objects by which an Assinniboine swears are listed as a gun, the skin
    of a rattlesnake, a bear's claw, and the wah-kon that the Indian interrogates.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Assinniboine swearing objects are placed before the swearer, who states
    conditional penalties if his declaration proves false.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stated Assinniboine penalties include the gun firing and killing him,
    the serpent biting him, bears tearing and devouring his flesh, and the wah-kon
    overwhelming him with misery.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In extraordinary and very important affairs requiring formal promises, the
    Assinniboine call upon Thunder to witness the accepted resolution.
  category: speech
  evidence_refs:
  - ev:6
