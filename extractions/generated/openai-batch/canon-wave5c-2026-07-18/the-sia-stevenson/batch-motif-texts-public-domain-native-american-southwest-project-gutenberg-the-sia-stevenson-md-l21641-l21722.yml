canonical_text:
  quote: ''
  summary: The passage describes petitions made while laying down sticks, Kansa tribal
    fetiches including a war pipe and sacred clam shell, Omaha personal fetiches and
    mystery bags, a war club made powerful for use against the Pawnee, red medicine
    beans believed to confer luck and return to their owners, and guarded sacred rites
    of dancing societies requiring costly initiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker lays down sticks while addressing “grandfather” and petitions for
    success in stealing horses, fortunate children, the raising of a domestic animal
    understood as a son, and the people’s continued safety from injury.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lieutenants, heralds, and warriors make similar petitions, with first petitions
    tied to war actions such as stunning a foe, striking next, or aiding in overcoming
    the enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Kansa, the two Hanga gentes possess the war pipe and the war clam
    shell as tribal fetiches.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kansa war pipe is described as having an eye on each side so it may see
    the enemy; it is of catlinite, has no separate pipestem, has two holes, remains
    wrapped, and is brought out only when men of the two Hanga gentes assemble at
    the chief’s lodge.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The sacred clam shell is wrapped in five coverings: buffalo bull bladder,
    spotted fawn fur, braided rushes, broad deerskin, and braided hair from a buffalo
    bull’s head.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some Omaha regard animal skins and bird skins or feathers used in mystery
    bags as waciube; named animals and birds include eagle, hawks, duck, owl, swallow,
    otter, flying squirrel, mink, and other named animals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some Omaha travelers carry personal medicines or fetiches and say the medicines
    are wise, can talk like men, and can tell how many horses they will receive from
    the people they visit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: An Omaha captain named Gi'a"habi makes a war club waqube and brandishes it
    four times toward the Pawnees when near the enemy camp; the use of a sacred bag
    follows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Several medicines and Red Medicine rites are described as probable fetiches
    that confer wonderful powers on users.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Scarlet Rocky Mountain beans called Red Medicine are said to confer good luck,
    not to be lost if they like their owners, and to return to their owners if accidentally
    dropped.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dancing societies, including those to which doctors belong, have sacred or
    mystery rites; initiation is expensive, and the passage treats these rites as
    guarded knowledge.
  category: relationship
  evidence_refs:
  - ev:6
