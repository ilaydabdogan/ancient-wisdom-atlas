canonical_text:
  quote: ''
  summary: The passage describes seasonal outdoor life and work around Fort Cliimo,
    including deliberation before journeys, women’s duties, hunters’ returns, preparation
    and repair of seal-skin boots, tools and materials used in skin work, and a spring
    prohibition against sewing unsewn deerskin while making sealskin clothing because
    seals might take offense and leave the hunting locality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames the material as describing the year in the life of Eskimo
    people in the immediate vicinity of Fort Cliimo and notes variation among Koksoagmyut
    occupations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before undertaking journeys or choosing localities, people deliberate, consult
    each other, consider game and illness, and then persist unless serious obstacles
    intervene.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Women are described as having allotted duties: bringing wood, water, and
    nearby food, fashioning skins into clothing and other articles, and cooking.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After a hunt lasting several days, a husband’s return is watched for by the
    family; the load is removed and the events of the chase are recited to listeners.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In early spring women make boots for summer wear from seal skins prepared
    the previous fall and stored until needed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Seal-skin tanning is described as involving fermented liquid, removal of hair
    and flesh, dressing with a chisel-shaped implement, rubbing, chewing resistant
    parts, soaking, drying, and final softening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Boot measurements are taken using the hand and fingers; the skin is doubled,
    then cut with a round knife.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The round knife, called 61o in the passage, is pushed by the user; modern
    blades are metal, while former blades could be slate, flint, or ivory.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Family boots require care after absorbing moisture: they are turned inside
    out, dried, chewed, scraped, stitched, and patched, using sinew thread from reindeer
    or seal.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some women specialize in making boots, while other women prepare other garments
    in return.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: When spring sealskin clothes are being made, women must not sew any previously
    unsewn deerskin; the stated reason is that seals might take offense and desert
    the chosen seal-hunt locality.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the same spring season, killing a deer and using its flesh is said to be
    harmless, but the skin must be cast away.
  category: action
  evidence_refs:
  - ev:7
