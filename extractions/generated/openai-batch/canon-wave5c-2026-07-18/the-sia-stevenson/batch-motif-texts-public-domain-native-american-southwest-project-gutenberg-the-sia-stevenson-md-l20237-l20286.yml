canonical_text:
  quote: ''
  summary: Section 41 describes fasting as an ancient custom connected with visions,
    Wakanda, superhuman communication, and the acquisition or transfer of superhuman
    power. Elders instructed male kin approaching manhood to fast, put clay on their
    faces, go to remote places, cry and pray to Wakanda, and abstain from food and
    water for three or four days. The passage also describes severe bodily effects
    after fasting and gives war-related examples among Ponka and Kansa captains and
    war parties.
  language: English with transliterated Indigenous-language terms
  quote_policy: summarized
