canonical_text:
  quote: ''
  summary: 'The passage describes preparation and use of hunting accessories attributed
    to the Hudson Bat Eskimo: an inflated animal-skin float with an ivory mouthpiece
    and wooden stopper, its attachment to tracking and harpoon lines, methods for
    removing hair to improve waterproofing, sealskin oil and fat bags and their reuse,
    and a small thick sealskin pouch for carrying gun caps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An animal skin is scraped, inflated with air, hung to dry, turned with the
    hairy side out, inflated again, and sewn shut at the mouth and other openings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large ivory button-like mouthpiece with a bored hole is placed at the mouth
    of the skin and fastened with sealskin thongs; the hole is stopped with a wooden
    plug.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Short sticks are placed inside the hind flippers and tail and bound to stop
    openings and provide a handle for dragging or holding the float.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When used, the inflated skin float may be attached to a tracking line or to
    the harpoon line used for large marine mammals, including white whale and larger
    seals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The float prevents a tracking line from becoming fouled among rocks and stones
    on the beach while towing a boat or umiak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On a harpoon line, the float retards a speared animal and marks where it sinks;
    the passage states that seals sink as soon as they die in certain seasons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hair may be removed from the skin by pouring boiling water on small patches
    and pulling the hair out; careful removal prevents black scurf from detaching
    and helps keep the skin waterproof.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Oil and fat bags are made similarly, but the hair is left on the skin and
    turned inward; large sealskins may hold up to 300 pounds of fat or oil.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A sold oil bag is usually returned to the seller, who refills it or converts
    the skin into bootlegs or soles; oil-impregnated leather is described as moisture-resistant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A small pouch made of thick sealskin, shaped somewhat like a leg of mutton,
    is used for carrying gun caps; its neck allows only one cap to fall out at a time.
  category: object
  evidence_refs:
  - ev:6
