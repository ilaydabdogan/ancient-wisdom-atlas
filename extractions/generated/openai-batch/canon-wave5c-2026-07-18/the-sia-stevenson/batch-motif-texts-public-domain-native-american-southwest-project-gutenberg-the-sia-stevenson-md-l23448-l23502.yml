  summary: The passage describes setting up a tent of preparation within a camping
    circle for sun dance candidates. Borrowed tent skins form coverings and curtains.
    Buffalo skulls, new tools, tent equipment, plants, medicines, fire, smoke, robes,
    pipes, songs, singers, and drums are used in a sequence of preparation, fumigation,
    assembly, and rehearsal.
