canonical_text:
  quote: ''
  summary: A four-night ceremonial segment describes ritual singing, breath-taking
    from eagle plumes and straws, invocation of the cougar of the north against ants
    believed to afflict a sick boy, use of medicine water, altar and fetich actions,
    brushing the boy with plumes and rattles to remove ants represented by small pebbles,
    handling of a blanket and meal, and the guarding of fetiches and medicine by the
    ho'naaite and members.
  language: English
  quote_policy: summarized
