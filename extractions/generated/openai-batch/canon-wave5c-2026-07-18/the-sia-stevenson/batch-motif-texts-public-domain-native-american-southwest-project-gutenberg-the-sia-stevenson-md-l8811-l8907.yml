  summary: The passage gives an ethnographic description of people around Port Chimo,
    including physical appearance, effects of infant carrying, cleanliness, aging,
    social sanctions for murder, vengeance by kin, avoidance of Akpatok because of
    murdered victims' ghosts, and reported killing or abandonment of aged people without
    relatives.
