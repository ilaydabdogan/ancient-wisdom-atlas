canonical_text:
  quote: ''
  summary: The passage describes pre-ceremonial continence, emetics, bathing, and
    yucca washing; rain ceremonials after grain planting; invocations to cloud rulers
    of the cardinal points; offerings of meal or corn pollen; preparation of medicine
    water using pebble fetishes, bowls, stone knives, plumes, and a rattle; and a
    smoking action directed toward the altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Continence is observed for four days before a ceremonial, an emetic is taken
    each morning, and on the fourth day married members bathe and have their heads
    washed in yucca suds for physical purification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described ceremonials occurred after the planting of grain, and their
    songs are described as supplications for rain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cry repeated four times invokes cloud rulers of the cardinal points to water
    the earth, and meal is sprinkled into the medicine bowl with each cry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Members have small buckskin bags of meal or corn pollen, previously taken
    from a bear-leg skin and laid beside the altar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Members of the Snake Division sprinkle corn pollen rather than meal, because
    the pollen is said to be especially acceptable to the Snake ho'naaite, to whom
    many prayers are addressed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The preparation of medicine water begins with the opening of the seventh stanza.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ya'ni^siwittanui dances before the altar, south of the line of meal, holding
    six pebble fetishes in each hand from sacks drawn from bear-leg skins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ya'ni^siwittanui touches two front ya'ya and drops fetishes into the medicine
    bowl and cloud bowl while crying to Snake ho'naaites to invoke cloud rulers to
    send their people to water the earth.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The dropping of fetishes into the bowls is repeated four times with petitions
    to Snake ho'naaites of the north, west, south, and east.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ya'ni^siwittanui takes two large stone knives from before the altar, strikes
    them together, crosses the line of meal, dips them in medicine water, sprinkles
    the altar, and throws water eastward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ho'naaite dips plumes into the medicine bowl and sprinkles the altar four
    times by striking the plumes with a rattle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the song closes, the men make cigarettes and smoke; a boy ignites a
    fire-stick for lighting them, and each man blows the first smoke toward the altar
    while circling and extending the cigarette toward it.
  category: action
  evidence_refs:
  - ev:10
