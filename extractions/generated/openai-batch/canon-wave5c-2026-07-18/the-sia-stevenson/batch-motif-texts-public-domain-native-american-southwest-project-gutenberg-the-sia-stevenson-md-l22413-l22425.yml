canonical_text:
  quote: ''
  summary: 'The passage reports that the xoiwere believed in a ghost or spirit after
    death. This belief is evidenced by mortuary practices: placing provisions, water,
    and cooking utensils on the grave for the spirit; dressing or ornamenting the
    corpse and placing needed items beside it; placing a child''s playthings with
    the child; and keeping weeds and grass down around the grave for a period after
    burial.'
