  summary: A distorted table fragment and accompanying notes discuss symbolic colors
    assigned to the four quarters or directions in several cited Indigenous North
    American contexts. The clearer prose notes mention green for the north among San
    Carlos Apache, a similar Hopi/Moki color order with the west green or blue, Chiricahua
    Apache use of “black” for the eastern sun and for a tornado or gust of wind, Navajo
    directional and gender color associations, and Omaha sacred stones and tent colors
    arranged by direction.
