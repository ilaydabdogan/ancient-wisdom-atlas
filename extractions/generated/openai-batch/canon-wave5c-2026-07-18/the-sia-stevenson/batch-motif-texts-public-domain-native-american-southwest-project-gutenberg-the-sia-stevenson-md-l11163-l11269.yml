canonical_text:
  quote: ''
  summary: The passage describes household drying and lamp supports, soapstone kettles,
    oil dishes, seal-skin and wooden vessels, and their replacement by manufactured
    utensils. It then describes animal, plant, trade, and water consumption practices
    among the people discussed, including raw, frozen, cooked, fermented, and heated
    foods and drinks.
  language: English with OCR errors and Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A drying or lamp-support structure is described as resting on pointed pegs
    set into snow at the side of a hut, with variant forms including a square-cornered
    staple shape, a wide V-shape, and a hollowed wooden block for supporting a lamp
    bottom.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Soapstone kettles were formerly used for cooking over lamps and for cooking
    with heated stones placed in water; the passage says these kettles had been largely
    superseded by manufactured utensils.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described soapstone kettles could have whalebone-strip handles and were
    made in different capacities, from about a pint to a full gallon; one small example
    was made as a child's toy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Oblong shallow dishes for holding oil or food were carved from larch knots.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Buckets and cups for water and other liquids were made of tanned seal skin
    sewn with sinew; some had seal-skin bails or wooden handles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wooden baskets were made from bent spruce strips with separate bottoms fastened
    by small wooden pegs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Small native vessels were used especially to ladle water into cooking kettles
    and were being displaced by tin cups and small kettles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage says food was eaten raw under certain conditions but cooked when
    convenient, and that frozen food was consumed in large quantities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Examples of raw or recently killed animal foods include deer flesh and fat,
    warm bird entrails, and incubated eggs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Frozen deer meat was cut into large chunks and eaten; sometimes frozen meat
    pieces were warmed or thawed before the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Deer blood could be mixed with the animal's stomach contents and eaten raw,
    boiled, or left to ferment and then frozen before eating.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Seal fat and seal blood were heated together in a kettle; seal oil was used
    with food, including as a dip for lean flesh, but the passage denies that people
    drank pure oil as ordinary food except as a laxative.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Vegetable food was said to be little used except near trading stations, though
    people familiar with flour, bread, peas, beans, rice, tea, coffee, sugar, and
    molasses liked them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: During berry season people ate many berries, especially the akpik or locally
    named bake apple, and children sought out half-ripened fruit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Women on trips sometimes gathered green herbs and boiled them in water as
    an infusion in place of tea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage says the people drank large quantities of water and, in very cold
    weather, often drank heated water, saying hot water weakened them less than cold
    water.
  category: action
  evidence_refs:
  - ev:7
