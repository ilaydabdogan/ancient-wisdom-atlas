canonical_text:
  quote: ''
  summary: On the night before a party leaves Sia, the vicar of the Snake Society
    repeatedly visits the camp but waits until other guests have gone. He returns
    late, instructs the tent to be fastened and someone to listen for footsteps, removes
    a vase from a sack, prevents close examination, urges that it be packed, places
    a plume offering in it, sprinkles meal on it, prays tearfully, and the vase is
    later taken to Washington and deposited in the National Museum.
