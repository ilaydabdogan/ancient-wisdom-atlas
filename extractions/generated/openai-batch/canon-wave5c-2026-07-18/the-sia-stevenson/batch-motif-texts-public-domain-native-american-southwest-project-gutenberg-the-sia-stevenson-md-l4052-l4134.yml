canonical_text:
  quote: ''
  summary: A ceremonial sequence around an altar uses ya'ya, water, meal, corn pollen,
    eagle plumes, a rattle, medicine bags, and pebble fetiches. Participants repeatedly
    appeal to cloud people, directly and through named directional animals, to water
    the earth and make it fruitful.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite stands at the altar, holds two ya'ya, sways, waves them outward
    and inward, and appeals for Ct's^ to instruct the cloud people to water the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the first petition, the choir sits and smokes native tobacco cigarettes
    wrapped in corn husks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman sprinkles the altar with meal, lifts a vase of water, and moves it
    along a line of meal in five placements toward the basket of offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the vase is placed for the last time, the woman waves the wand in her
    right hand twice over the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ya'ni^siwittanni dances before the altar with eagle plumes and a rattle,
    lifts gourdfuls of water from the vase, waves them, and empties them into the
    medicine bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The water-pouring sequence names the cougar of the north, bear of the west,
    badger of the south, wolf of the east, eagle of heaven, and shrew of earth as
    beings asked to invoke or implore the cloud people to water the earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Members take corn pollen from medicine bags and throw it upon the altar and
    into the medicine bowl while crying out invocations for the cloud people to water
    the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The group throws meal into the medicine bowl six times with invocations to
    the cloud people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ti'Jimoni takes six small pebble fetiches from a bear leg skin and hands
    them to men, who pass them to the ya'ni^siwittanni.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ya'ni^siwittanni drops six fetiches into the medicine water, alternating
    hands, and gives an animal-like growl each time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The growls are described as calls upon prey animals of the cardinal points
    to exhort the cloud people to water the earth so that she might be fruitful.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ya'ni^siwittanni stirs the medicine water with eagle plumes and sprinkles
    the offerings by striking the plumes with a rattle; the sprinkling is repeated
    four times.
  category: action
  evidence_refs:
  - ev:6
