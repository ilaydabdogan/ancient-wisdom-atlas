canonical_text:
  quote: ''
  summary: In a Snake Society rite, a snake is placed around the novitiate's throat,
    head, and body. The vice ho'naaite addresses the snake as a hearing agent, asking
    it to give the boy wisdom and strength and to intercede with cloud rulers for
    rain and agricultural abundance. The snake is also invoked with the sun-father
    in autumn and winter for warmth and necessities. The text states that the rattlesnake
    is regarded as peaceful and friendly, not angry. Snakes are placed in empty vases
    and taken to a grotto; members form a line outside. The passage also describes
    ritual clothing and body painting, including rattlesnake images, red lines under
    the eyes like those of snakes, eagle and hawk feathers, and kaolin zigzags said
    to symbolize lightning.
  language: English, with Sia terms and OCR-corrupted material
  quote_policy: summarized
