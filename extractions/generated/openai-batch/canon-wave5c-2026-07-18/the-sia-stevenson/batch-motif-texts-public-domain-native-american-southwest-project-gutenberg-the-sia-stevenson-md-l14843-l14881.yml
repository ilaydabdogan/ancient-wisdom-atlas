canonical_text:
  quote: ''
  summary: The passage describes Nenenot steam baths in a dome-shaped sweat house
    made from bent poles and tent skins, using heated stones and water to create intense
    heat. It notes frequent use, a journey delayed by a household head’s desire for
    a bath, an incident at Fort Chimo in which a reindeer drove rushed toward an occupied
    sweat house, and the common remains of old sudatories along traveled paths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nenenot are described as habitually taking steam baths in a suda-ory or
    sweat house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sweat house is made from small flexible poles, usually willow or alder,
    bent into a hemispherical or dome-shaped structure and covered with tent skins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sandy or snow-free locality is selected, a fierce fire is built, and stones
    are heated in the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After heating, the fire is removed, the structure is erected over the hot
    stones, and someone outside fastens down the tenting edges with stones to hold
    in heat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water from a kettle is poured over the hot stones, producing intense heat
    and perspiration; water is not used for bathing except sometimes a small amount
    on the head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bather remains inside the hut until nearly exhausted by the heat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: These baths are frequently taken, and a head of family may delay a journey
    in order to bathe before continuing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Fort Chimo in spring 1882, reindeer were numerous while crossing northeastward
    to drop fawns.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Panic-stricken reindeer herds rushed among Indian tents and station houses,
    pursued by yelping dogs and screaming women and children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An old man and wife were inside a sweat house when a large drove of deer headed
    toward it; they were warned and exited as the animals reached the spot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man tore up the tenting of the bath house and whirled it in the air, while
    the old woman behaved in an astonishingly animated way; the population witnessed
    and increased the tumult.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Signs of former sudatories are common along paths traveled by the Indians
    for many years.
  category: setting
  evidence_refs:
  - ev:7
