canonical_text:
  quote: ''
  summary: Ethnographic passage describing social customs, limited collection of beliefs,
    hunting trophies and implements, the Naskopie/Ne n6 not group in the Ungava district,
    distinctive speech and gestural style, coordinated imitation of Canada goose calls
    for hunting, linguistic classification as Cree-related, and contact without intermarriage
    between Indians and Innuit near Fort Chimo and the Koksoak river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls are described as sometimes being taken as wives before puberty; usual
    family size is described as two to four children, with preference for a male first
    child and contempt sometimes applied to mothers with only daughters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that the beliefs and traditions of the people were not
    learned because other work occupied the narrator's time at Fort Chimo.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black bears are said to be procured in great numbers, and the dressed under
    lip ornamented with beads and cloth strips is preserved as a trophy of prowess.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A harpoon used for striking white whales in rivers is described as peculiar
    to these people and as closely resembling that of the Innuit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The third division of Indians is said to dwell mostly in the Ungava district,
    number about 350, call themselves Ne n6 not meaning true or ideal men, and be
    known by the epithet Naskopie applied by Mountaineers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Their speech is described as rapid, with unusual voice inflections and abrupt
    changes of tone, more common among males than females.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The people are described as demonstrative, using strong gestures and loud
    voices, and parties were observed conversing across the Koksoak river at Fort
    Chimo, where it is nearly a mile and a half wide.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a trading-store scene, groups of women are described as shouting loudly,
    leading the clerk to expel them and admit only one or two at a time while others
    shout at the windows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: During spring migration, Indians are described as imitating Canada geese notes
    in coordinated fashion, with different party members making different notes, which
    often lures the geese to the spot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator states that the few collected words are enough to classify the
    region's non-Innuit, non-white people as belonging to the Cree branch, with Mountaineers
    and Little Whale river Indians of the same stock.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Indians and Innuit in the region are said to be in direct contact, especially
    at Fort Chimo, but not to intermarry; one Naskopie briefly stayed with Innuit
    near the mouth of the Koksoak before returning to his own people.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
