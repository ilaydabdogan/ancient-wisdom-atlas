  quote: ''
  summary: The passage describes Nenenot steam baths in a domed sweat house made from
    bent poles and tent skins, using fire-heated stones and water to produce intense
    heat. It notes that such baths are frequent and may delay journeys, recounts an
    incident at Fort Chimo in which deer rushed toward an occupied sweat house, and
    observes that remains of former sweat houses are common along travel paths.
  language: English
