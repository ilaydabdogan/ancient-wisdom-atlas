canonical_text:
  quote: ''
  summary: The passage surveys sacred or mystic trees and plants among Omaha, Ponka,
    Osage, Kansa, Dakota, Hidatsa, Athapascan, and related traditions, especially
    ash, cedar, and cottonwood, noting their ritual uses, group names, and symbolic
    associations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha are said to have two sacred trees, ash and cedar; ash is associated
    with beneficent natural powers, while cedar is linked with destructive agencies
    such as thunder, lightning, and wars.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Omaha and Ponka sacred pole is described as partly ash and partly cottonwood,
    and the stems of the sacred pipes of friendship are described as made of ash.
  category: object
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: In an Omaha tribal-circle pipe episode, the bad Maⁿinka-gaxe people wore plumes
    and cedar branches around their heads and were passed by, while another Maⁿinka-gaxe
    group, described as good, received the pipe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Osage traditions, cedar is said to symbolize the tree of life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: During initiation of a woman into an Osage secret society, an officiating
    man gives four sips of water, interprets them as the river flowing by the tree
    of life, rubs her with cedar needles twelve times, and pronounces a sacred name
    of Wakanja with each pass.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports cedar-related group names among Osage and Kansa people,
    including Red Cedar people and wearers of cedar branches on the head.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Cedar is reported as used by the Santee Dakota in a ceremony of the four winds,
    and the Teton Dakota are said to believe cedar smell or smoke scares away ghosts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In an Athapascan creation myth from Oregon, cedar smoke takes the place of
    food for two gods who made the world; red cedar and ash are held sacred because
    they were the first trees discovered by the gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Hidatsa name for red cedar is glossed as mysterious or sacred tree, and
    the passage notes Hidatsa reverence for cottonwood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cottonwood is described as a mystic tree for the Omaha and Ponka; a cottonwood
    tree is sought, felled, carried to the center of the tribal circle, and planted
    for the Hede watci dance preparation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Personal and gens names among Omaha, Ponka, Iowa, Oto, Missouri, Kansa, Osage,
    and possibly Winnebago are reported as containing references to trees or plants,
    including white oak, cedar, corn, pumpkin, elm, black hawthorn, red oak, sycamore,
    and a tea plant.
  category: attribute
  evidence_refs:
  - ev:7
