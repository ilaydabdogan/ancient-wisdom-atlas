  summary: 'The passage describes hunting equipment: a bow case with attached quiver
    and model arrows, a short-head spear with toggle head for seals and white whales,
    and seal-skin or seal-intestine floats including a large sealskin float called
    a va tuk. It also includes a cautious authorial comparison with Hudson Strait
    Eskimo bow-and-arrow equipment.'
