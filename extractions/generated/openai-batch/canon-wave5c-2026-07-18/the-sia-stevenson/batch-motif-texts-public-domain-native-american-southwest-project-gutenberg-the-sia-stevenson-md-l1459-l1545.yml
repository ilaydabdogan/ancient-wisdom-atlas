canonical_text:
  quote: ''
  summary: The passage describes the Sia suffering attacks by Sk6yo and animals, the
    Sun father deciding to relieve them by fathering twin boys, Ko'chinako's pregnancy
    and birth of male twins, the twins' search for their father, Spider Woman's aid
    with bows, arrows, and a web bridge, the twins' arrival at the Sun's house, the
    Sun's wife's hostile reception, the Sun's recognition and testing of the boys
    in a heated sweat-house and houses of animals, and the Sun's gifts and warning
    about rabbit sticks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sia suffer repeated losses when children or people leave their homes or
    villages and are captured and eaten by Sk6yo and animals, but some parents' vigilance
    preserves the race and the people increase.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun father decides to relieve the people of their trouble by becoming
    the father of twin boys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ko'chinako, described as a virgin and as the yellow woman of the north, is
    embraced by the Sun during a journey and becomes pregnant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ko'chinako gives birth to male twins after a rapidly developing pregnancy;
    her mother, the Spider Woman, is angry about the unknown father, leaves, and returns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The twin boys walk four days after birth, receive individual names from Ko'chinako,
    become intelligent quickly, and remain small in stature.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The twins repeatedly ask their mother where their father is; she says he lives
    far away to the east and that they would have to reach the center of a great river.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Spider Woman makes each twin a bow and arrows before their journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the river, Spider Woman spins and tests a web bridge, after which the twins
    cross it, descend to the center of the river, and find their father's house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sun's wife questions the boys, rejects their statement that the Sun is
    their father, and gives them leftover scraps of food.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Sun returns, answers his wife's complaint by acknowledging the boys as
    his children, and has them given proper food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sun has a sweat-house prepared with a large fire, turquoise lining, and
    hot turquoise rocks; water is poured on the rocks, and the twins cool the house
    by spitting tiny shells from their mouths.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Sun finds the twins alive after the sweat-house test.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Sun places the twins in a house filled with elk, deer, antelope, and buffalo,
