  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Sun places the twins in a house filled with bear, cougar, and rattlesnakes,
    and sees them riding bear and cougar without fear.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: After the animal tests, the Sun says the boys are surely his children, releases
