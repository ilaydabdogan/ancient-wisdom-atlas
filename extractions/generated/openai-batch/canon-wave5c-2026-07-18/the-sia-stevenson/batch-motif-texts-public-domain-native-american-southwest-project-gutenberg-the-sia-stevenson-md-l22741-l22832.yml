  summary: The passage describes Teton accounts of Missouri River and lake water monsters,
    including lethal effects of seeing them; it then describes the Wakinyan or Thunder-beings,
    their forms, lightning, dwelling, sentinels, weapons, plant creation, and conflict
    with giant rattlesnakes and water monsters.
