canonical_text:
  quote: ''
  summary: The Sia wish to travel to the center of the earth, but the earth is too
    moist. Ut'set seeks help from animals and from Sus'sistinnako, then summons members
    of the Ka'pina spider society. After a rejected cotton road and a ritual using
    a serpent fetish and Na'pakatsa, the earth becomes firm. Ut'set appoints a man
    of the corn clan as her representative and ruler, gives him wisdom, a crooked
    staff, precious things, and instructions. A footnote describes the P'arriko or
    ya'ya corn idol.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After remaining at a village for a year, the Sia wish to pass on to the center
    of the earth, but the earth is very moist and must be hardened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ut'set asks the cougar whether he has medicine to harden the road; the cougar
    tries, sinks to his shoulders in wet earth, returns afraid, and says he can go
    no farther.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear, badger, shrew, and wolf also attempt to harden the earth and fail.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ut'set returns to the lower world and asks Sus'sistinnako how to harden the
    earth for travel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sus'sistinnako asks whether Ut'set has tried the named animals and then tells
    her to have a woman of the Ka'pina spider society use her medicine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A female Ka'pina member denies knowledge three times; on the fourth question
    she says she guesses she knows, agrees to try, and calls together the society
    members.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The female Ka'pina member makes a road of fine cotton from her body, suspended
    a few feet above the earth, but the people fear it is too fragile to use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ut'set asks for a man rather than a woman of the Ka'pina to work for her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A male Ka'pina member throws out a serpent fetish that can expand and contract;
    when extended it reaches to the middle of the earth and is thrown south, east,
    and west.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Na'pakatsa fetish is thrown on the ground, stamped upon, and placed south,
    east, west, and north; because the people are in the far north it is deposited
    close behind them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Once the earth is firm enough for travel, Ut'set selects a man of the corn
    clan to take her place with the people and lead them to the center of the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ut'set says she will leave the people, remain in her house below, hear what
    is said to her, and give the new representative her wisdom, thoughts, heart, and
    mind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ut'set gives the representative a crooked staff as insignia of office; the
    people clasp the staff and draw a breath from it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ut'set gives the representative precious things she brought in a sacred blanket,
    tells him to follow the one straight road, names him Ti'jimoni, and instructs
    him to listen to and work for good things and turn from bad things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The P'arriko or ya'ya is described in a footnote as a perfect ear of corn
    ornamented with eagle and parrot plumes, splints, native cotton cord, shells,
    beads, and cotton; it is made by theurgists and described as the Sia's supreme
    idol.
  category: object
  evidence_refs:
  - ev:7
