  quote: ''
  summary: The passage describes a Sun Dance sequence in which selected experienced
    and brave men seek the dan-wakan or Mystery Tree for the sun-pole. They prepare
    with horses, battle-like dress, races, accounts of brave deeds, and pantomime.
    On the fourth day they search for the tree, return, expose virgin earth within
    the camp circle, place sweet-smelling grass and wild sage on it, and lay a buffalo
    skull there.
