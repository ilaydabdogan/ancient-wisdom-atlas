canonical_text:
  quote: ''
  summary: The passage narrates a coyote attempting to catch a hare. The hare delays
    him, escapes to a hard stone house, and later uses boiling piñon gum and fire
    to burn the coyote's face and escape again. The coyote then travels over a mountain,
    finds a sleeping lynx, gathers fat from him with a stick, reshapes his mouth,
    ears, tail, limbs, and body, and calls until the lynx opens his eyes silently.
