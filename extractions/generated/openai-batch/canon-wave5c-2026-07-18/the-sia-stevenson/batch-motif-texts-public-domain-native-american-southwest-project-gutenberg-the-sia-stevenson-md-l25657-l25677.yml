canonical_text:
  quote: ''
  summary: The passage reports Dakota prayers to deceased relatives, describes an
    Assinniboine custom of gathering at raised graves to call the dead by name, offer
    prepared meat, mourn, light and offer the calumet, and ask the dead not to harm
    the living. It also states that before consulting tutelary spirits or addressing
    the dead, a sacred fire must be kindled from flint, lightning, or another mysterious
    source rather than from common fire.
  language: English
  quote_policy: summarized
