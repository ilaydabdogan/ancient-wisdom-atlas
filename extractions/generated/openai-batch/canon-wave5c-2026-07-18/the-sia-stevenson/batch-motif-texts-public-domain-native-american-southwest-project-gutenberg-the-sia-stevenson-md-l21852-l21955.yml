canonical_text:
  quote: ''
  summary: The passage reports Omaha and Ponka beliefs about spirits after death,
    including moral association with good or bad ghosts, a journey or hovering period
    after burial, grave fires and offerings, a forked road in the spirit land, special
    conditions for suicides, murderers, wounded persons, and lightning victims, and
    a buffalo-gens death address involving animals, ancestors, and possibly four living
    ones or winds.
  language: English with Omaha/Dhegiha terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each person is said to have a wanaxe or spirit that does not perish at death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One reported teaching says good persons go to good ghosts and bad persons
    go to bad ghosts; the passage says nothing was said about dwelling with Wakanda
    or demons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rev. William Hamilton is reported as finding a belief that retribution occurs
    in this life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tradition related by old men says that a man came back to life and told
    about the spirit land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In that account, the ghost travels a very dark road for four nights after
    death and finds plenty of light after reaching the Milky Way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same account gives grave fires kept burning for four nights as aid to
    deceased friends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After traveling along the Milky Way, the ghost comes to a forked road where
    an aged man in a buffalo robe sits and silently points to the requested road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: One road is short and leads to the dwelling place of good ghosts; the other
    is endless and ghosts go along it crying.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: One statement says spirits of suicides cannot travel either road and hover
    over their graves; another statement says a suicide ceases to exist and has no
    hereafter.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:10
  text: 'Later reported beliefs vary: some say the soul at once begins its journey
    to the spirit land, while others say it hovers near the grave as if reluctant
    to depart.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Food and water are placed at the head of the grave for several days after
    burial, and the spirit is supposed to partake of the food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: No Indian would touch food exposed for the ghost; the ghost is said to punish
    a thief by seizing the food, paralyzing or twisting the mouth, pursuing the offender,
    removing the taste of food, or causing enduring hunger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Spirits of persons who died from wounds or their results are said to float
    to a Missouri River cliff, cut pictures showing their manner of death and the
    wound or disease location, and then fly to the hereafter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A person struck by lightning is described as buried where he fell, with no
    mound; another Omaha statement says he should be buried face down with the soles
    of the feet slit.
  category: action
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:15
  text: Some Ponka beliefs about a murderer say ghosts surround him and whistle constantly,
    he cannot satisfy hunger, and he must not roam at large lest high winds arise.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the Omaha lightning-burial account, the prescribed burial sends the spirit
    at once to the spirit land; when it was not done, the ghost was said to walk until
    another lightning victim was laid beside him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A dying member of a buffalo gens is addressed as going to the animals or buffalos,
    ancestors, and the four living ones or possibly four winds, and is told to be
    strong; informants disagree about whether a person has more than one spirit.
  category: speech
  evidence_refs:
  - ev:11
