candidate_motifs:
- id: motif:1
  label: Afterlife journey on a mapped road
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage describes a postmortem route with a four-night dark road, the
    Milky Way, a forked road, and different destinations.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: Joseph La Fleche and Two Crows reject the Milky Way identification and
    regard the endless road as probably a modern addition.
- id: motif:2
  label: Forked road to divergent postmortem outcomes
  taxonomy_refs:
  - afterlife_journey_map
  basis: At a fork in the road, one route quickly reaches good ghosts while the other
    is endless and associated with crying ghosts.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage notes disagreement about some details of the wider journey
    account.
- id: motif:3
  label: Living aid the dead with grave fires
  taxonomy_refs: []
  basis: The passage says people should aid deceased friends by lighting fires at
    graves and keeping them burning for four nights.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The practice is attributed within the reported tradition of the returned
    man.
- id: motif:4
  label: Grave offerings for a hovering spirit and ghostly punishment for theft
  taxonomy_refs: []
  basis: Food and water are placed at the head of the grave, the spirit is supposed
