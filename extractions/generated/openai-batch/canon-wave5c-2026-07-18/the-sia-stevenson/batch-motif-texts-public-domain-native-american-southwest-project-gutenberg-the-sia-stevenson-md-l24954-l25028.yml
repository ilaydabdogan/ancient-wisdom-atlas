canonical_text:
  quote: ''
  summary: 'The passage describes wolf-related beliefs and stories: Assiniboin reverence
    for wolves and wolf omens; a Dakota/Teton Wolf Society; and three stories in which
    wolves guide, rescue, ask mercy for cubs, teach weather-making through song and
    howl, and assist a man in a horse raid.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that among the Assiniboin the wolf is honored to some
    degree, receives presents and supplications, and is connected with concerns about
    disease and game.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The “little medicine wolf” is said to be greatly venerated; listeners count
    its barks, note voice strength and compass direction, and treat these details
    as omens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If undertakings succeed after hearing the little wolf, the animal is honored
    by a grand feast when the party returns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Dakota Wolf Society, also called by white people the Dog Society, is described
    as having songs, young male membership, and ownership of wolf stories.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In one story, a wolf pities a man fleeing ghost men, shows him the way to
    a camp, and the man later leaves a portion of killed game outside camp as an offering
    to the wolf.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In another story, a father-in-law traps a young Teton son-in-law in a covered
    pit inside a lodge, with two daughters helping cover the pit and move the tent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wolf finds the trapped man, says he will be saved because he did not kill
    the wolf earlier, summons other wolves, and uses a lariat with them to pull the
    man out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After rescue, the young man promises never to harm a wolf and is reunited
    with his wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a wolf-den story, wolf parents ask a man to pity their cubs; the father
    wolf sings and howls, causing fog to appear and disappear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man tears a red blanket into pieces for necklaces, paints the cubs with
    Indian red, and restores them to the den.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The grateful father wolf promises future aid in war, later sings and howls
    near an enemy village, raises wind and mist, and enables the man to take horses.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
