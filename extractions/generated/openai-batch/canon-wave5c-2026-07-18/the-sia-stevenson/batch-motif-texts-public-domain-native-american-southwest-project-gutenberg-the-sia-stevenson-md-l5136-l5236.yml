canonical_text:
  quote: ''
  summary: The passage describes the Kok'ko mythologic society and Sia accounts and
    ceremonies involving the Ka'suna. It explains youth initiation for later admittance
    to a spirit dance house, recounts the origin and western home of the Ka'suna,
    describes rain or snow dances, masked personation, attendants, ritual preparation,
    child initiation, secrecy, purification with meal, and deposition of plume offerings
    at a concealed shrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youths are expected to become members of the mythologic society to secure
    admittance into a dance house located in the lake of departed spirits; the passage
    also says initiation is first involuntary and later voluntary, and that females
    sometimes join.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sia Ka'suna are described as anthropomorphic beings created by Ct'sCt
    in one night in the lower world, who accompanied the Sia to this world and were
    directed to make their home in the west.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ka'suna are asked to influence the cloud people, and their dances are
    usually held for rain or snow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ti'amoni controls the appearance of the Ka'suna, while the ho'naaite of
    the Quer'ranna selects men and women to dance and holds rehearsals for songs and
    dances.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Personators are selected for grace, endurance, and memory for songs, and both
    sexes must have been initiated into the mysteries of the Ka'suna.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before initiation, the personators are believed by the Sia to be the actual
    Ka'suna.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Instruction lasts four to eight days; during it continency is observed, and
    married participants drink an emetic each morning for purification from conjugal
    relations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the Ka'suna appear, they are accompanied by Ko'shairi and Quer'ranna
    attendants, who adjust their apparel and entertain spectators with wit and buffoonery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage reports that the Sia possess many masks, described as apparently
    very old, and that the priest of the Quer'ranna has charge of them and claims
    great antiquity for them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A parent asks that a child become acquainted with the Ka'suna; after the ho'naaite
    and ti'amoni approve, the parent tells the child it is time to know the Ka'suna,
    and the child agrees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: For the initiation occasion, the ho'naaite prepares a meal painting and covers
    it with a blanket; the child may carry a ya'ya fetish pressed to the breast when
    entering the ceremonial chamber.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the chamber, the ho'naaite, child, parent, ti'amoni, ho'naaite of warriors,
    and others take specified positions near or within the room.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Two Sa'iahlia stamp in the middle of the room; the ho'naaite leads the child
    before the covered meal painting and announces that the youth or maiden has come
    to know the Ka'suna.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Ka'suna carry bunches of Spanish bayonet, and the child receives two strokes
    across the back from each Ka'suna unless already an official member of a cult
    society.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the ho'naaite's request, the masks are raised; one Sa'iahlia places his
    mask over the child's head while the other lays his by the meal painting after
    the blanket has been removed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The personators tell the child that now the child knows the Ka'suna, should
    have good thoughts and a good heart, may someday become one of them, and must
    not speak of these things to the uninitiated.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: After the mask is removed, the child promises not to speak of the things to
    anyone, and the Ka'suna rubs meal from the painting upon the child.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Those present gather around the meal painting and rub meal upon their bodies
    for mental and physical purification.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: The child deposits a ha'chamoni made of eagle and turkey plumes at the Quer'ranna
    shrine west of the village and says that he now knows the Ka'suna and pays the
    ha'chamoni.
  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: The ho'naaite deposits a ha'chamoni for each society member at the shrine,
    which is in a rock fissure; after the deposits, the opening is covered with a
    rock so no shrine evidence remains.
  category: action
  evidence_refs:
  - ev:13
