canonical_text:
  quote: ''
  summary: A ceremonial sequence at the Knife Society shrine describes preparation
    of native tobacco cigarettes, the viceho'naaite or vicar seated before the cloud
    bowl, sprinkling with eagle plumes and ashes, attachment of an eagle feather,
    production of froth in the cloud bowl with root, reed, pollen, and water, distribution
    of the froth to the altar, directions, bear, and parrot, choral exhortation to
    cloud peoples, directional smoking, and closing distribution of cigarettes to
    members.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Native tobacco is returned to an old cloth on the wall after boys finish preparing
    cigarettes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The viceho'naaite, also called the vicar in the passage, sits on a wadded
    blanket in front of the cloud bowl and west of the line of meal.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man at the east end of the line dips eagle plumes into ashes, strikes one
    plume against the other, and sprinkles the vicar's head while the vicar offers
    silent prayer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A song begins with rattle accompaniment during the sprinkling of the vicar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite removes a white fluffy eagle feather from a ya'ya and ties it
    to the vicar's forelock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The vicar puts powdered root into the cloud bowl, uses a reed with corn pollen,
    sprinkles the altar, touches the four cardinal points of the bowl with pollen,
    and blows through the reed to make bubbles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The vicar stirs the water from right to left without raising the lower end
    of the reed, producing egg-like snowy froth that covers the bowl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The vicar stands the reed in the center of the froth, holds eagle plumes,
    dances before the altar, and gesticulates.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The vicar throws suds or froth toward the altar and to the north, west, south,
    east, zenith, and nadir.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The vicar places suds on the head of the white bear and over the parrot, and
    repeats this after further blowing and beating of the suds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that this froth is referred to by the Sia as clouds, and
    the choir sings an exhortation to the cloud peoples.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The vicar smokes a native tobacco cigarette, directing smoke and extending
    the cigarette to the north, west, south, and east, then lays the remaining piece
    in front of the cloud bowl east of the meal line.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the song closes, the vicar returns the eagle plume to the ya'ya and
    sits near the fireplace.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Two boys light native tobacco cigarettes with a long firestick and hand one
    to each member.
  category: action
  evidence_refs:
  - ev:9
