canonical_text:
  quote: ''
  summary: The passage describes the organization of Sia cult societies, including
    the Warriors/Ope Society, mountain watchmen, animal societies teaching medicine
    songs and entering stone fetishes, the origin of the fire society through Coyote’s
    theft of fire from the world below, and the assignment of several animals to cosmic
    directions or regions.
  language: English with Sia terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ho'naaites of each society receive medicine from the two warriors; the medicine
    consists of portions of hearts of destroyed enemies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ma'asewe organizes the Ope Society, designates himself as ho'naaite, and appoints
    his brother as vicar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Six men are appointed as members of the society to live permanently in six
    high mountains of the world and watch from six cardinal points for bad people
    and approaching enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The six mountain men, together with Ma'asewe and U'yuuyewfi, guide the arrows
    of the Sia in conflict with enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage recalls that Ma'asewe and U'yuuyewfi went to live inside Sandia
    mountain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Animal societies assemble at the white house and teach medicine songs to the
    ho'naaites after the societies are formed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The animal societies instruct the Sia to make stone images of the animals
    so that the animal beings can pass over a road or line of meal and enter the fetishes
    during ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The secret of fire has not been brought to this world, and the people are
    tired of feeding on grass like deer and other animals.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ti'amoni decides that Coyote is the best person to steal fire from the
    world below and sends for him; Coyote agrees to go.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'At night Coyote reaches the house of S^s''slstinnako and slips past sleeping
    guards at successive entrances: a snake, a cougar, a bear, and the ho''naaite
    of the fire.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Coyote finds S^s'slstinnako asleep, lights the cedar brand attached to his
    tail, and hurries out; S^s'slstinnako wakes too late to stop him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: A footnote states that the ho'naaite of the Warriors Society is not strictly
    a theurgist and that the warrior priest-doctor practices surgery such as extracting
    balls and arrows.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the cult societies are organized, the ti'amoni, influenced by Ct's^t,
    commands the cougar to live in the north, the bear in the west, the badger in
    the south, the wolf in the east, the eagle in the heavens, and the shrew in the
    earth.
  category: action
  evidence_refs:
  - ev:8
