canonical_text:
  quote: ''
  summary: 'The passage reports Iowa and Winnebago accounts of subterranean and subaquatic
    powers: a horned subterranean power blamed for a man''s madness, water gods connected
    with drownings and taking victims as servants, conflict between Thunder-beings
    and water gods, and Winnebago descriptions of waktceqi dwelling under ground,
    bluffs, and subterranean water while upholding parts of the world.'
