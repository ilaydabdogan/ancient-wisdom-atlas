canonical_text:
  quote: ''
  summary: Coyote tricks lynx into eating fat removed from lynx's own stomach, causing
    lynx to vomit and become angry. Lynx later follows coyote, repeats the trick against
    him while he sleeps, alters coyote's body, and makes him eat his own fat. After
    they separate, coyote travels in heat and repeatedly asks the cloud people to
    cool his road with shade, rain, wetness, and rising water; each request is answered
    through the end of the passage.
