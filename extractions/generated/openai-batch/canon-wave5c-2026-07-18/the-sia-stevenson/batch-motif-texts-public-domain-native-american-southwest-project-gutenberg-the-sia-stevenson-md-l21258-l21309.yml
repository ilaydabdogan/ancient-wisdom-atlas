canonical_text:
  quote: ''
  summary: The passage describes Omaha nikie tent and robe decorations involving feathered
    pipes and an eagle image. It explains that pipe-dance pipes resemble peace pipes,
    that sacred pipes were considered highly important and could stop fighting when
    carried between opposing forces, and that Waqaga’s robe decoration and Pipe subgens
    birth names are associated with the eagle. It also discusses the sacredness of
    nikie names and compares them cautiously with Osage and Kansa name traditions
    associated with a secret society.
