canonical_text:
  quote: ''
  summary: 'In a section headed “Snake Lore,” the passage reports that some Dakota
    avoid killing snakes by hitting them. A person who violates this law is said to
    have terrible dreams about snakes, and sometimes such a person''s horse is bitten
    by a snake. The passage names the SiijteUla tayka, or Ancient of Eattlesnakes,
    as an enemy of the Thunder-beings. It also says snake dreams are unlucky: snakes
    in dreams seek to enter a man''s ears, nose, or mouth, and successful entry is
    treated as a sign of death.'
