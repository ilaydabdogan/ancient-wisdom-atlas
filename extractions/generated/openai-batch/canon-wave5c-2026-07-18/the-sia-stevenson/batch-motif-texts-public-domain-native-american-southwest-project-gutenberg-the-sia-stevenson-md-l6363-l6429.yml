canonical_text:
  quote: ''
  summary: A prose account describes a Snake Society vice-theurgist asking a good-hearted
    woman to pray for his ill infant, giving her a small shell-mixture bundle in corn
    husk. He says her prayers travel quickly to the sun and Ko'plshtaia, then recites
    a prayer explained as uniting hearts, making her mother-like to the child, asking
    for the child's good heart and proper growth into old age. A final note says that
    someone ill from the sun's heat sprinkles corn pollen or meal to the sun, addressing
    the sun as Father and offering the meal as food in return for removal of illness.
  language: English with Sia terms
  quote_policy: summarized
