canonical_text:
  quote: ''
  summary: A named female figure instructs the people to plant hii'chamoni so messages
    can reach their mother in the world below, then appoints six Sia women to live
    at the six directions and intercede with cloud rulers. The Sia follow a straight
    road while other pueblos travel by other routes toward the earth's center, build
    a white stone village, and suffer child killing under the tiamoni. A quarrel between
    Sia men and women leads to separation across a wide river. The men hunt and thrive
    while the women lack animal food, become thin, and ask for the men to return.
    Children born during the separation are unlike the Sia, are rejected, quickly
    become skoyo giant cannibals, and attack the Sia with the help of hostile animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker tells the people to make and plant hii'chamoni when they want something,
    saying these objects will carry messages to their mother in the world below.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving this world, Ct'set selects six Sia women and sends one each
    to the north, west, south, east, zenith, and nadir to live there permanently.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The six women are placed near the cloud rulers of the cardinal points so they
    may intercede for the people of Ila'arts in times of need.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sia alone follow the command and take the straight road, while other pueblos
    take various routes to the center of the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the named figure's departure, the Sia travel, build a village of beautiful
    white stone, and remain there for a long duration described as four years or time
    periods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the white house, parents suffer because the tiamoni objects to population
    increase and for a time causes all children to be put to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A serious dispute arises between men and women after women grinding meal accuse
    the men of not working and argue over how long men and women could remain apart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After three days of quarrel, on the fourth day the women and men separate
    to opposite sides of the pueblo and enter separate chi-ta.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tiamoni presides over the men's council and says that men and women living
    apart may each be contented.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The next morning the tiamoni has all men and male children not being nourished
    by their mothers cross the wide river, while the women remain in the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The women are compelled to send male infants across the river as soon as they
    cease nursing them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the separation, the men hunt and have much game, while the women have
    no animal food; over time the men grow stout and the women and female children
    become thin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the fourth year is half gone, the women ask the tiamoni for the men to
    return; the men recross the river, and within four days the women recover their
    flesh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Children born during the separation are unlike the Sia, are driven from home
    by their mothers, mature quickly, and become skoyo or giant cannibals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The skoyo catch Sia children and parents, roast them alive in large fires
    between rocks, and eat them; hostile animals also join the skoyo in attacking
    the Sia.
  category: action
  evidence_refs:
  - ev:10
