canonical_text:
  quote: ''
  summary: The passage discusses reported and inferred classifications of Siouan tribal
    groups, gentes, and divine powers into earth, wind-maker, fire, and water categories.
    It describes a council seating circle around a sacred fireplace, maps four subgentes
    to elemental classes, and notes relationships among elemental powers, including
    fire-water hostility, fire/wind association with suffering, and earth/water association
    with life, peace, and healing. It also notes apparent inconsistencies involving
    Unktehi, ghosts, clam shells, and war pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Foster is reported as stating that the Winnebago tribe was divided into four
    groups named after earth, air, fire, and water, with associated groups named after
    land animals, birds and winds, thunder-beings, and water monsters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1890 the author obtained from three principal Ponka chiefs a classification
    of Ponka gentes by phratries and the mystic songs peculiar to each phratry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author infers that Dakota, Omaha, Ponka, Winnebago, and other related
    tribes divided their gods into earth, wind-maker, fire, and water classes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among Omaha, Iowa, and cognate tribes, a gens assembled for council sat around
    a fire in a diagrammed order.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The diagram’s legend lists Black Bear, Small Bird, Eagle, and Turtle subgentes,
    along with a fireplace and an entrance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Places in the circle were assigned according to kinship; the Black Bear and
    Small Bird people sat on the same side of the fireplace and are described as full
    kin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fireplace is described as sacred, with traces of a hearth cult.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Black Bear people are associated with ground or earth, Small Bird people
    with Thunder-beings or Fire people, Eagle people with Wind-makers, and Turtle
    people with Water people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Fire powers are hostile to Water powers, that Fire
    powers and Wind-makers are connected with suffering including war, disease, and
    death, and that no hostility exists between Fire powers and Wind-makers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Earth and Water powers are interested in preserving life
    and may be considered patrons of peace; it also notes that words for water and
    life are identical or similar in some Siouan languages.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Francis La Flesche is cited as saying that water has an important place in
    a medicine society, including songs about water being sent into wounds and references
    to a pool in a buffalo wallow.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'The passage reports apparent inconsistencies: Unktehi created the earth and
    human race but are believed to feed on ghosts, ghosts are reckoned as Unktehi
    servants, and war gentes may have both a sacred clam shell and a war pipe despite
    Fire-Water enmity.'
  category: relationship
  evidence_refs:
  - ev:10
