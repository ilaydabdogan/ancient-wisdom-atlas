canonical_text:
  quote: ''
  summary: 'The passage presents three origin accounts: children on a sea cliff become
    guillemots after a cliff collapse; a man repeatedly saying the word for a deerskin
    blanket becomes a raven whose call preserves the sound; and the loon''s white
    breast, square back spots, and hiding behavior are explained through painting,
    laughter, and shame.'
  language: English
  quote_policy: summarized
