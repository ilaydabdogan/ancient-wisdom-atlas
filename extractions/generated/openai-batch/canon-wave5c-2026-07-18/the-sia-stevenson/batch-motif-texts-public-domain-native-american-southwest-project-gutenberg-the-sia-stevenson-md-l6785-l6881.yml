canonical_text:
  quote: ''
  summary: 'The passage describes Sia postpartum and newborn rites: cleansing and
    dietary practices for the mother, a cedar-twig tea regimen and continence rule,
    domestic care and nursing arrangements, fourth-morning purification with ashes
    and charcoal, handling of stone fetishes, sacred meal, paired ears of corn, presentation
    of the infant toward the east and rising sun, prayers to the sun father and Ko''pishtaia,
    and an indoor naming or baptismal prayer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the birth, the woman was not attended by the doctress for two hours;
    her gown and the sheepskin on the bed were changed on a regular schedule.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandmother prepared tea from fresh cedar twigs steeped in water, and
    the woman drank it; during the tea period no water was drunk, and the duration
    differed by clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Continence was observed for the two-, three-, or four-month tea period; the
    passage states that breaking continence would cause an animal to enter the woman's
    abdomen and she would die, according to the first mother of her clan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the first drink of tea, the woman ate tortillas, jerked meat, and corn-meal
    gruel, and female relatives and friends visited her and the baby.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The infant was nourished from birth and was nursed by another woman until
    the third morning, when the mother took charge.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The room door could not be left open until the child had gone out on the fourth
    morning to see its sun father.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman's father stayed near her during the four days, her mother cared
    for the mother and infant, and the woman's husband worked in the fields by day
    but returned to sit by his wife and admire the baby.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the fourth morning, the woman dressed and waited for the doctress, who
    gave her ashes from the fireplace; the woman rubbed her legs and breast with the
    ashes for purification and then put on moccasins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The grandmother took the infant from the cradle, wrapped it in its blanket,
    and gave it to the doctress; the woman's father gave the doctress two stone fetishes
    that had been under the woman's pillow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The doctress put a bit of charcoal from the fireplace into the woman's mouth
    so that cold winds would not enter, congeal her blood, and prevent its flow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The woman's father gave sacred meal to his daughter, the doctress, the writer,
    and himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The doctress led the way carrying the infant and pressing an ear of corn to
    its breast; the woman followed carrying a companion ear of corn, and the writer
    followed after her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that everything associated with life must have its dual,
    that corn is life, and that the two ears of corn would later be wrapped together
    and kept under the child's cradle until planting time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: At the eastern gateway the grandfather, mother, and doctress performed prayers
    and meal sprinkling toward the east; the doctress bared the child's head toward
    the rising sun and said she brought the child to see its sun father and Ko'pishtaia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After returning indoors, the mother received the infant with its head to the
    east; the doctress laid the ear of corn on the child's breast, the grandfather
