canonical_text:
  quote: ''
  summary: A human Heyoka man foreknows that he and his horse will die at the first
    thunder of the next spring. He marks himself and the horse with zigzag clay lines,
    walks near camp singing with a pipe pointed skyward, and repeats these actions
    when the first thundercloud appears. A storm comes with wind, rain, lightning,
    and thunder; after it passes, the people find that the man and horse have been
    killed and burned by the Thunder-beings, especially at the marked places. The
    passage closes by linking former foreknowledge with the rule not to reveal a personal
    wakan mystery.
  language: English with transcribed song terms
  quote_policy: summarized
