  quote: ''
  summary: The passage describes a shaman mediating with a deer guardian spirit during
    food scarcity, rules for handling the first deer killed, prohibitions involving
    dogs, general practices around amulets, and examples of charms including a wooden
    kayak model and a four-headed healing charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shaman is described as mediating between a spirit and the people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit is told that the people have not offended him and that dogs did
    not devour the unborn young deer when female deer returned to him to give birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After incantation, the shaman announces that the spirit will supply the people
    with deer spirits in material form and that abundance will come if the people
    obey the stated restriction concerning dogs and unborn deer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Certain parts of the first deer killed must be eaten raw, certain parts discarded,
    and certain parts eaten cooked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dogs must not taste deer flesh, and if a dog gets at the meat, part of its
    tail is cut off or its ear is cropped to allow blood to flow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that ceremonies of some kind attend the capture of the
    first slain animal among the more important kinds of animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Amulets are described as universally used, with some charms worn to ward off
    evil-disposed spirits.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some charms are worn as remembrances of deceased relatives and take the form
    of a headless doll attached to the upper garment.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Because many personal names derive from natural objects, a person may wear
    a small image or portion of the object for which they are named, such as a bird
    wing or animal skin, to gratify that object's spirit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Strange or curious objects not seen before are sometimes considered to bring
    success to the finder.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Two amulet examples are given: a little wooden model of a kayak and a small
    wooden block carved into four human heads.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four carved heads represent four famous conjurers known for driving away
    diseases, and a woman with rheumatism wore the charm when she felt pain.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
