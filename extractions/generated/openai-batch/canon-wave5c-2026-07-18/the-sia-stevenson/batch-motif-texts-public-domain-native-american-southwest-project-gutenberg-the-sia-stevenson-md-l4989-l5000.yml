canonical_text:
  quote: ''
  summary: The passage describes ceremonial preparation and use of a medicine associated
    with the Knife Society. Women in sacred white embroidered Tusayan blankets grind
    the medicine. The ho'naaite administers it privately to a woman seeking pregnancy
    by mixing powder in cold water and dipping a fetich of Quer'riinna four times
    into the water. The medicine is also administered to society members for racial
    perpetuation, and the ho'naaite expels it toward the cardinal points so cloud
    people may gather, send rain, and make the earth fruitful.
