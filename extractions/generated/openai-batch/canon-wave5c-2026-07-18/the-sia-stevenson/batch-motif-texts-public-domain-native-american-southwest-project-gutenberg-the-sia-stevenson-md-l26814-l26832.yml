canonical_text:
  quote: ''
  summary: 'The passage, attributed to Cathn in the text, lists repeated fourfold
    features of the Mandan Okipa: four days, four lodge preparers from the cardinal
    directions, four water sacks in tortoise form, fourfold skull and dancer groupings,
    dance repetitions counted in multiples of four, four cloth sacrifices, visits
    of the Evil Spirit to four buffalo, and four splints or skewers used in torture.'
  language: English
  quote_policy: summarized
