canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and rites concerning the buffalo among Siouan
    groups: the buffalo is treated as a grandfather, appears in traditions, group
    names, and the sun dance; prayers and offerings are directed to the buffalo; a
    Santee dream ritual prepares and decorates a buffalo head for presentation of
    pipe and feast; and an explanation states that buffalo and earth may be regarded
    as one, with danger for ridiculing the buffalo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In several Siouan tribes the buffalo is considered a grandfather; it is present
    in Osage traditions, in names of gentes and subgentes, and in the sun dance image.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer used during the White Buffalo Festival of the Hunkpapa Dakota remembers
    the powers of earth, wind, sun, water, and buffalo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Ghost Lodge ceremony, red cloth is lifted and offered to the buffalo
    with a prayer for good to be granted to the father of a dead child during lodge-keeping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Santees, a man who dreams of buffalo must announce it by preparing
    the skin of a buffalo head from a killed buffalo, discarding the skull and flesh,
    restoring the skin to shape, and curing it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A few square feet of earth at the back of the lodge are set apart, stripped
    of sod, finely prepared, called U-ma-ne, and covered with a new blanket or robe
    that must not belong to a woman.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The buffalo head is placed at the center of the blanket, painted blue on one
    side and red on the other, and decorated with swan down or feathers on the blue
    side and red-colored down on the red side.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pipe is filled and presented to the buffalo head, a feast kettle is hung
    over the fire, and the man addresses the head as grandfather and venerable man,
    saying that its children have made the feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The address asks that the food taken cause the children to live and bring
    them good fortune.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: An explanation states that in some religious festivals the buffalo and the
    earth are spoken of and regarded as one.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The explanation says that if anyone reviles or ridicules the buffalo, even
    softly, the earth would hear, tell the buffalo, and the buffalo would kill the
    person.
  category: sequence
  evidence_refs:
  - ev:7
