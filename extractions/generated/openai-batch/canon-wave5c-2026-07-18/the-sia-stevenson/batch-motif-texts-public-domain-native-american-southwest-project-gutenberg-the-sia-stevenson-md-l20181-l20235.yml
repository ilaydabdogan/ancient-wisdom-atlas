canonical_text:
  quote: ''
  summary: The passage gives notes and a translation of Omaha invocations connected
    with beaver medicine and trapping. Tobacco is offered to a supernatural maker
    and teacher of the medicine, to beavers, to the medicine, to the trap, pack-strap,
    tent entrance, tent pole, and fireplace, with requests that animals be caught,
    carried home, and cooked. The editor also compares these invocations with Habakkuk's
    account of Chaldeans making offerings and incense to nets.
  language: English with Omaha lexical notes
  quote_policy: summarized
