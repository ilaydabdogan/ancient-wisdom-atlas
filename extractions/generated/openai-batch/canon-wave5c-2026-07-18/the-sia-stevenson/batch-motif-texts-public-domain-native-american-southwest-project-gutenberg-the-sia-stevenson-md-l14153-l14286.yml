canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Nenenot clothing, including
    women’s winter gowns, leggings, moccasins, mantles, children’s and infants’ garments,
    tobacco bags, headbands or portage straps, and the preparation of deer skins for
    buckskin, parchment, and clothing by scraping with a bone tool.
  language: English with OCR errors
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are described as wearing a winter sleeveless gown reaching a little
    below the knees and up to the chin, with separate sleeves usually made of red
    or black cloth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gown may be decorated with red ocher, painted designs, a beaded deerskin
    border, hanging bead strings, and colored thread tassels.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women’s leggings are described as higher than men’s leggings, covering the
    tops of moccasins, and having free crescent-shaped or wing-like flaps decorated
    with contrasting cloth and rows of beads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Moccasins are stated to be alike for both sexes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Soft young-deer-skin mantles and trader-purchased blankets are used as additional
    protection from cold.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children are clothed like adults, while infants often wear a combination-form
    garment with a close-fitting cap that is not removed until head growth bursts
    the material.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When traveling, men and women smoke or snuff, and tobacco with other necessary
    articles is carried in an ornamented cloth bag trimmed with beads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that some clothing patterns are rude copies of designs
    found on cheap handkerchiefs, scarves, and other printed fabrics.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Headbands or portage straps are made for men by wives and sweethearts; one
    example is made of sealskin procured from the Eskimo and supports the weight of
    a load carried on the back.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A piece of birch bark may be placed under the headband where it touches the
    forehead to prevent wetness from exertion from burning the skin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Deer skins intended for buckskin and parchment are laid aside in a heap until
    decomposition loosens the hair.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: A woman scrapes a pelt over a round wooden stick using a tool made from the
    radius bone of a deer; the tool removes loosened hair without cutting the skin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The flesh side of the pelt is worked to remove flesh, blood, and moisture;
    rapid work is needed to prevent excessive decomposition and putrefaction.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Where deer hunting is very successful, many skins may be wasted if no one
    is available to process them.
  category: sequence
  evidence_refs:
  - ev:8
