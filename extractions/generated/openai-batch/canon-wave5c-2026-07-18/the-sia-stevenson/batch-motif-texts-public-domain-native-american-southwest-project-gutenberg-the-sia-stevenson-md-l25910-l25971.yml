canonical_text:
  quote: ''
  summary: The passage describes Dakota and wider Siouan religious or secret societies
    connected with mysterious communications, visions, or revelations from animals,
    spirits, and ghosts. Animal visions during fasting determine society membership;
    some members imitate visionary animals or receive special abilities. Examples
    include ghost-revelation persons, buffalo-revelation adornments, goat-revelation
    cliff travel, and elk-vision societies.
  language: English with Dakota/Siouan terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dakota terms are said to describe mysterious communications received from
    animals and spirits, compared with Omaha and Ponka usage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Siouan peoples, some religious societies are distinguished by the name
    of an animal and have rituals of chants and songs for ceremonies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The musical rituals are often claimed to have been received in a mysterious
    or supernatural way and are regarded as having religious power.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Membership in these societies depends on supernatural indications, and the
    animal appearing to a man in a vision during religious fasting determines the
    society to which he must belong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Persons having visions or revelations from ghosts are called Wanagi ihaqblapi
    kin and are said to be able to draw pictures of ghosts with impunity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: It is said that the only persons whose faces are drawn awry by ghosts are
    members of the ghost-revelation order.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Bushotter's step-father belongs to the Society of those who have Revelations
    from the Buffalo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In one vision, Bushotter's step-father saw a buffalo with cocklebur down in
    its hair and later put such down in his own hair in imitation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In another vision, he saw a bison going south with a hoop on its head; he
    then painted a small hoop red and wore it on his own head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some Dakota belong to a Society of those who have Revelations from Goats;
    goats are described as mysterious because they walk on cliffs and high places.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Those who dream of goats or have revelations from them imitate their actions
    and are said to find their way up and down cliffs as rocks soften underfoot and
    close behind, leaving no trail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Those who have visions of the elk are identified as an elk-vision group, and
    the passage also lists other recorded societies while noting uncertainty about
    whether they are composed of animal-vision persons.
  category: relationship
  evidence_refs:
  - ev:7
