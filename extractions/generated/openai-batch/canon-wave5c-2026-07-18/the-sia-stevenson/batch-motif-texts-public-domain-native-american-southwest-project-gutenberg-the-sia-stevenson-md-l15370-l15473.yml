canonical_text:
  quote: ''
  summary: 'The passage describes birch-bark canoe use and construction in a Koksoak/Fort
    Chimo context: canoes carry people, families, and household property during camp
    movement; makers prepare wood slats, bark, spruce-root sewing, rails, ribs, thwarts,
    sealing gum, and paddles; canoes are tested on water, repaired, sometimes built
    by specialists, and carried during portage. It also notes trade in birch bark
    and comparison with neighboring East Main canoe forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each canoe differs according to the maker's personal taste or need, but must
    be able to carry the owner, family, and household property when camps are changed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some canoes are small, some large, and some are possessed in common by two
    or more individuals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Canoe construction begins with selecting trees that yield straight-grained
    slats, shaving and seasoning the slats, placing longitudinal strips edge to edge,
    and setting ribs at right angles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bark is cleaned of outer scaling layers and soaked in fresh water for several
    days to soften it and prevent cracking when dry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The softened bark is laid over an earth or clay form and sewn along the strip
    edges with prepared spruce roots that have also been soaked for flexibility.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rails, bow and stern pieces, longitudinal strips, ribs, and thwarts are installed,
    while the maker checks by eye that both sides match and that the keel is balanced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During drying, the bark shrinks; the maker may wet the canoe to prevent rapid
    splitting, and then smears seams with hot gum or resin mixed with seal oil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the gum has seasoned, the canoe is put on the water to test speed and
    seaworthiness, and leaks or needed repairs are addressed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: People without canoe-building skill employ experienced builders known for
    making excellent boats.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two canoe kinds are described as differing only in stern and prow shape; the
    older form is nearly flat along the rails with little upward turn at bow and stern.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Later contact with neighbors is said to have led to an intermediate canoe
    shape between the local form and the more upturned East Main Indian canoe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Because suitable birch is not found near Fort Chimo, bark is obtained from
    traders who import it from St. Lawrence river and gulf stations; one bundle can
    be purchased with a black fox skin.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: In spring, men prepare strips and bark for the canoe that will carry them
    upriver after the ice breaks and navigation opens.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The paddle has a single blade and a handle shorter than half the paddle length;
    it is used with both hands with strokes on alternate sides.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: For portage, the voyager carries the canoe on the shoulders with a center
    thwart resting on the back of the neck and hands thrown backward to hold up the
    canoe end.
  category: action
  evidence_refs:
  - ev:10
