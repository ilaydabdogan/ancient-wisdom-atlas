canonical_text:
  quote: ''
  summary: The passage describes a Sun Dance tent of preparation set up within the
    camping circle. Managers borrow tent skins, use curtains to conceal candidates
    during decoration and painting, place buffalo skulls and new smoked tools in the
    tent, use sage and other plants for couches, wiping tears, and fumigation, employ
    medicine against hunger, thirst, and weariness, fumigate new tent equipment over
    a medicated fire, and assemble candidates in buffalo robes around a leader, with
    pipes, song rehearsal, singers, and drummers.
  language: English
  quote_policy: summarized
