canonical_text:
  quote: ''
  summary: The passage collates accounts of the Sun Dance, especially its timing,
    then quotes Lynd's description of Dakota wiwanyag wacipi as worship of the sun.
    Lynd describes individual participation, assistance by relatives and friends,
    fasting and purification, a three-day dance facing the sun with whistle and drum,
    the goal of receiving a vision or revelation from the sun divinity, and recourse
    to self-sacrifice if the desired revelation is not received. A following section
    introduces a Dakota-authored Teton-language account.
  language: English
  quote_policy: summarized
