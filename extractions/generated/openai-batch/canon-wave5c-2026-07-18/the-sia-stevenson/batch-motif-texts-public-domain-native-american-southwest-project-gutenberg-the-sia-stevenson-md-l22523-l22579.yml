canonical_text:
  quote: ''
  summary: The passage describes several bodily ordeal and fasting practices undertaken
    to seek divine assistance, vision, dream, revelation, or favor. It then cites
    reports about Mandan, Hidatsa, Arikara, Assiniboin, and Dakota practices involving
    bodily mutilation, offerings to the Great Spirit, and painted images representing
    a spiritual essence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who is sacrificing himself keeps his mind fixed on the desired object
    and waits for a vision from above; an assistant checks him daily and releases
    him if he signals that a vision or revelation has occurred.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some practitioners attach a buffalo hair rope to a freshly severed buffalo
    head, fasten a hook through the muscles of the lower back, and drag the head around
    the camp while beseeching the deity for assistance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A third class passes knives through parts of the body and waits silently for
    a dream or revelation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some plant a pole on the steep bank of a stream, attach ropes to the arm and
    breast muscles, stand rather than hang, gaze into space, and go without food or
    drink for days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another class practices haijmdepi without severe self-sacrifice, fixing the
    mind on a desired object for weeks or months, crying around camp, eating little,
    fasting mostly, and seeking revelation from a god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says similar testimony is given for the Mandan, Hidatsa, and Arikara;
    Smet reports finger cutting and deep incisions before war to obtain divine favors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the Assiniboin, Smet reports burning tobacco and casting choice buffalo
    meat into fire for the Great Spirit, and also making incisions or cutting off
    finger joints as sacrifice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lynd reports that devout Dakota make bark or stone images, paint them, put
    sacred down on them, fall down before them, and pray that danger may be averted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Lynd states that the Dakota worship is directed not to the image itself but
    to the spiritual essence represented by the image and supposed to be near it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator comments that this image-versus-spiritual-essence distinction
    has been made in different nations and periods but calls its value doubtful.
  category: speech
  evidence_refs:
  - ev:8
