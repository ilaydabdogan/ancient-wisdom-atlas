canonical_text:
  quote: ''
  summary: 'The passage reports descriptions of Dakota wakan men and women: persons
    said to possess unusual divine power, perform cures or wonders, remember former
    states, foresee events, converse with deities, undergo pre-human instruction by
    gods, incarnate and reincarnate, obey voices or a speaking tree, follow taboos,
    and demonstrate claimed invulnerability through paint, medicine, flute-playing,
    and weapon ordeals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain men are described as professing an unusual amount of a wakan or divine
    principle and claiming miracles, laying on of hands, and curing the sick.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some persons are said to claim recollection of former states of existence,
    power over nature, sight into futurity, conversation with deities, or future entry
    into particular animal bodies after death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pond's account says wakan men and women first become conscious in the form
    of winged seeds and are carried by the four winds to the abode of a Taku Wakan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the divine abode, these beings learn chants, feasts, dances, and rites,
    receive the gods' powers, and learn to inflict and heal diseases, discover concealed
    causes, make war implements, and use protective paints.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After divine preparation, the being rides on the wind, enters a woman about
    to become a mother, is born among humans, returns to the god after death, receives
    a new inspiration, and repeats incarnation four times before returning to nothingness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bushotter lists several kinds of persons who regard themselves as wakan, including
    medicine practitioners, Heyoka, grizzly-bear-feast participants, mystery-dance
    participants, diviners, finders of wrong-doers or stolen objects, and persons
    doing cunning acts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man may hear a human voice in the daytime or converse with a tree at night
    and then do what the voice or tree directs, including keeping a law or custom
    for life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage lists ritual prohibitions or customs involving pipe circulation
    direction, cutting a firebrand with a knife, killing a swallow, and passing a
    knife above a kettle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wakan men are described as claiming invulnerability and demonstrating it after
    painting themselves, wearing flutes over their chests, marching in single file,
    and being shot at with arrows or guns.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the invulnerability performance, arrows are said to bend, bullets to fall
    flattened, no wound to appear, blood to pour from the mouth, and vulnerability
    to return after the body paint is washed off.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The passage reports a supposition that medicine rubbed on bodies, bullets,
    or arrows, and perhaps flute-playing, helps produce the claimed invulnerability.
  category: other
  evidence_refs:
  - ev:9
