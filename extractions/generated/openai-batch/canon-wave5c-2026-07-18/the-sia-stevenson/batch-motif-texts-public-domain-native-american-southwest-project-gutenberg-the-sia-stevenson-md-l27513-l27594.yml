canonical_text:
  quote: ''
  summary: 'The passage reports color-symbol associations among Dakota and related
    groups: black with Wind-makers, winds, night spirits, war paint, raven, and stone;
    yellow with water, west, setting sun, a water-spirit legend, and tent decoration;
    white with albino or white animals and feathers in ceremonial contexts; and green,
    blue, and black as partly related or interchangeable symbolic colors. It also
    records authorial doubts and Miss Fletcher''s explanatory letter about symbolic
    color classifications.'
  language: English
  quote_policy: summarized
