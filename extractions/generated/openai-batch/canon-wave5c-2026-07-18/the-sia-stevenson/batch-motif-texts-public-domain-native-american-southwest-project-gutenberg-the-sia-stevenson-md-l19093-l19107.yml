  quote: You are a person and a Wakanda. I, too, am a person. I desire to pass through
    you and reach the other side.
  summary: The passage reports that Warmth was called a good Wakanda, and that a flowing
    stream could be addressed as a person and Wakanda by someone wishing to ford it.
