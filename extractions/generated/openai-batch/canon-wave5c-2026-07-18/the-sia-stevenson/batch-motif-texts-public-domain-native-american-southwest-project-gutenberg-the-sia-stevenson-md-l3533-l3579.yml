canonical_text:
  quote: ''
  summary: The passage describes a ceremonial sequence involving dance, altar sprinkling,
    invocation of cloud people, use of plume offerings and medicine water, administration
    of medicine water from an abalone shell, drawing of sacred breath from ritual
    objects, sprinkling of cardinal points, and a later basket-and-litany action involving
    bear-claw necklaces, bear-leg skins, and a snake fetish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dancers face east and west, sprinkle the altar when reversing direction, and
    invoke the cloud people to gather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women attempt to bring a man at the north end into the dance; the successful
    attempt amuses the women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ho'naaite sprinkles the young man, and the young man sprinkles the ho'naaite
    in return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An aged woman joins the dancers, pulls the young man about, and tells him
    to dance well and with animation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The vicar places a basket of plume offerings on a meal line and deposits suds
    from the base of the cloud bowl into the basket of plumes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Members dip plumes into medicine water and sprinkle the altar; the man and
    boy sprinkle toward directions and the sprinkling of cardinal points is repeated
    four times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ya'ni*siwittanui administers medicine water from an abalone shell to women
    first, including an infant in its mother's arms, then to the boy and men; the
    ho'naaite is served last and then serves the ya'ni*siwittanui in return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After each draft, hi'shami and wands are touched to the ya'ya and sacred breath
    is drawn from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ya'ni*siwittanui leaves the chamber carrying the ya'ya and the bowl of
    medicine water, then sprinkles the six cardinal points outside by taking water
    into the mouth and throwing it out between the teeth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ho'naaite lifts the basket of plume offerings while the ti'amoni and the
    younger member of the snake division stoop south of the meal line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bear-claw necklaces are removed; all except the ho'naaite's are laid on bear-leg
    skins, while the ho'naaite deposits his necklace on the snake fetish at the north
    side of the altar.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ho'naaite and two young men hold the basket while the ho'naaite repeats
    a long litany and the two young men respond.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Women laugh and talk while paying little attention to the litany action.
  category: action
  evidence_refs:
  - ev:5
