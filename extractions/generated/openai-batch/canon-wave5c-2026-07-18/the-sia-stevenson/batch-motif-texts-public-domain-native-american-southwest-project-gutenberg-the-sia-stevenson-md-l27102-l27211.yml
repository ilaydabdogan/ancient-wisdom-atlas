canonical_text:
  quote: ''
  summary: 'The passage quotes Peet''s broad claims about Native North American religious
    doctrines and classifications, then gives the author''s reply concerning Siouan
    tribes: denial of clear monotheism, qualification of immortality as continued
    existence as shades or ghosts, distinction between religious-law violations and
    biblical sin, non-atoning forms of sacrifice, and a denial that shamans were worshiped
    as gods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Peet is quoted as saying that missionaries agreed on four doctrines: existence
    of God, immortality of the soul, sinfulness of man, and necessity of sacrifice,
    which he says were held in modified forms by North American tribes.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Peet classifies native religions of America by geographical districts into
    shamanism, animism, animal worship, sun worship, elemental worship, and anthropomorphism.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author says the Siouan tribes considered were not monotheists and had
    cults of many powers; everything animate and inanimate was regarded as having
    a shade.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author says he finds no traces of belief in immortality of human beings,
    but that 'continuous existence as shades or ghosts' describes a belief held respecting
    mankind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The author says Dakota gods were regarded as mortal: they could be killed
    by one another, were male and female, married and died, and were succeeded by
    their children.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author reports that making a false report to the keeper of the sacred
    tent of war or to buffalo-hunt directors, or breaking taboo or ancient custom,
    was considered dangerous and associated with disasters such as lightning strike,
    snake bite, enemy killing, horse accident, or other misfortune.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author says he has not found sacrifice as atonement for sin among these
    Siouan tribes; fasting, self-torture, or property offerings were made to win a
    god's favor, obtain temporal advantage, or avert demons' anger during famine or
    epidemic.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author says shamans and orders of shamans existed among these tribes,
    but he has found no trace of worship of shamans as gods; one Ponka shaman, Cramped
    Hand, exclaimed that he was a wakanda.
  category: speech
  evidence_refs:
  - ev:7
