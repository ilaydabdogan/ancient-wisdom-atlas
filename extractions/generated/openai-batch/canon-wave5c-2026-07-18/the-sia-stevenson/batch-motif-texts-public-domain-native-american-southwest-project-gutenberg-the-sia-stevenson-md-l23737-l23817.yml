canonical_text:
  quote: ''
  summary: The passage describes a sun-dance-related rite in which chosen men recount
    exploits, strike a mystery tree once each, and enact horse gifts through a stick
    and a crier's announcement. Women then recount generosity and strike the tree
    until it falls. The felled tree is pruned, painted at branch wounds, fitted with
    ritual attachments, transported to camp under taboos, and prepared as a sun pole
    to be raised.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each chosen man tells his exploits, brandishes the ax three times without
    striking, then strikes the tree once and leaves the ax in the gash for the next
    man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leaving the ax in the tree after the blow is treated as making a present of
    a horse to someone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A father or near kinsman hands the striker a stick, which the striker returns
    while naming the intended recipient.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crier goes to the recipient, announces that a horse is brought because
    of the blow to the mystery tree, and then circles the camp singing the donor's
    praises and naming the recipient.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the men have completed their turns, the women select a man to speak
    about generous acts, and larger women take one blow apiece at the tree until it
    falls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the tree falls, those present shout and sing; many presents are made,
    and some people wail loudly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Selected men cut off all limbs of the fallen tree except the highest one and
    leave the tree top undisturbed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wherever a branch is cut off, red paint is rubbed on the wound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bundle of wood imitating the wood for which the people prayed is hung crosswise
    from the fork of the tree.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A scarlet blanket, buffalo robe, or weasel skin is suspended above the bundle,
    and two dried buffalo-hide pieces shaped as a buffalo and a man are fastened below
    it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author reports that both hide figures had marked male genital features,
    with the human figure described as unusually large in that feature.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: No one in the company dares touch the sun pole while it is being taken to
    camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before wagons were used, a horse carried much of the pole's weight while selected
    wakai men walked on both sides to support the pole ends; the passage says a wagon
    is used at the described present day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: No person dares go in advance of the pole on the way to camp, because violation
    is said to place the person in danger of being thrown from a horse and breaking
    his neck.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Married men and youths carry leaf shields, riders race horses, and party members
    may take small branches cut from the mystery tree.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When the party reaches the camp circle, those carrying branches and leaves
