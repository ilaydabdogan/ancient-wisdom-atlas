canonical_text:
  quote: ''
  summary: 'The passage describes the umiak: its oar fittings, crew arrangement, sail,
    seal-skin covering, repair and storage, and use in family journeys with possessions,
    shore tracking lines, and sometimes dogs. It then begins a technical description
    of the kaiak used by the Eskimo of Hudson Strait, classing it with the Greenland
    type and contrasting it with Alaskan boats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The umiak has lashed wooden rowlocks with notches and thong loops to hold
    heavy oars that may lie alongside in the water when not in use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women generally run the umiak, with assistance from younger men; two or more
    females may sit side by side, and a third person may face them to help.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A steersman sits aft and attends to the helm and nearly square sail; the flat-bottomed
    umiak is said to use only a fair wind to advantage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The umiak covering is made from large seal skins that are cleaned, stretched,
    cut, sewn with overlapping seams, fitted to the frame, lashed over the rails while
    wet, and dried keel-up.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When in use the skin boat must be kept from rocks; holes are patched with
    skin, and in winter the umiak is placed on staging to protect it from mice and
    other animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Families undertake long journeys in umiaks by easy stages, carrying portable
    possessions; overloaded boats may require older people to walk, and shore parties
    or harnessed dogs may pull by a tracking line.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kaiak of the Eskimo of Hudson Strait is described as belonging to the
    Greenland type, differing from Alaskan forms, and having sharp ends, a flat bottom,
    and a framed structure of keel, side timbers, ribs, rails, and crosspieces.
  category: object
  evidence_refs:
  - ev:5
