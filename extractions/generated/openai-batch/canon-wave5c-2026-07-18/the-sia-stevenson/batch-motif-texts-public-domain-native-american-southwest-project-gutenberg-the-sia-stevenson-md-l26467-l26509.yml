canonical_text:
  quote: ''
  summary: The passage describes corn feasts centered on the Old Woman Who Never Dies.
    Women make offerings of dried meat and valuables on scaffolds, elderly women act
    as her representatives, younger women receive consecrated corn, and grains are
    mixed with seed corn for crop abundance. An autumn version seeks buffalo and winter
    meat. The passage also describes birds, animals, corn patches, the Old Woman's
    seasonal movements, and a story in which she feeds twelve Hidatsa from a small
    kettle that refills.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dried meat and other valuable articles are hung before the village on long
    pole scaffolds as an offering to the Old Woman Who Never Dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elderly women of the village assemble as representatives of the Old Woman,
    each carrying a stick with an ear of corn fastened to one end.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elderly women sit in a circle, plant their corn-bearing sticks before
    them, and dance around the scaffolds while old men beat drums and shake gourd
    rattles.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The passage states that the corn is not wetted or sprinkled and that doing
    so is considered injurious.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Younger women put dry pulverized meat into the mouths of the elderly women
    and receive a grain of consecrated corn, which they eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several grains of consecrated corn are mixed with seed corn so that the seed
    may yield an abundant crop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dried meat on the scaffolds belongs to the aged females as representatives
    of the Old Woman, but members of the Dog Society may take some without opposition.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A similar corn feast is held in autumn to attract buffalo herds and obtain
    a large supply of meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the autumn feast, each woman carries a whole cornstalk with ears attached
    and roots pulled up.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The women call the corn and the birds by the name of the Old Woman and address
    them as Mother, asking for mercy, delayed severe cold, and game that does not
    depart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When birds migrate south in autumn, the Indians are said to believe that the
    birds return to the Old Woman, take the dried meat from the scaffolds with them,
    and that the Old Woman partakes of it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Old Woman has large corn patches guarded by the great stag, the white-tailed
    stag, and blackbirds.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mice, moles, and stags are described as laborers for the Old Woman's corn
