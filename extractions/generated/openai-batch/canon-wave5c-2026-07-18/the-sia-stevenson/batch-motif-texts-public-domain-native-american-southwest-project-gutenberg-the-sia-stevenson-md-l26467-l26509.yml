  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Birds flying from the seashore in spring represent the Old Woman as she travels
    north to visit the Old Man Who Never Dies and then returns south after three or
    four days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In former times the Old Woman's hut was said to be near the Little Missouri
