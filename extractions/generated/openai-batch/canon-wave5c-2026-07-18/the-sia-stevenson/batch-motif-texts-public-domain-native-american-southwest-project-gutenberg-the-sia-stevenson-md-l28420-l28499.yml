canonical_text:
  quote: ''
  summary: The passage lists ritual, military, hunting, mourning, peace-making, and
    pipe-related functions assigned to particular gentes and subgentes among several
    Siouan groups. It describes duties connected with sacred pipes, Thunder-being
    worship, consecration of fireplaces and corn, buffalo hunting, warpath preparation,
    return from war, and a brief authorial note on the so-called “Messiah craze” and
    the provisional character of the study.
  language: English with Indigenous terms in transliteration and OCR variation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening section assigns pipe-related duties to named persons or gentes,
    including filling and emptying pipes, keeping a tobacco pouch and buffalo skull
    associated with a sacred pipe, and carrying two pipes around a circle of chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black bear people are said to have aided Elk people in spring worship of the
    Thunder-being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Ponka division of labor, named gentes lead Thunder-being worship, war,
    and buffalo-hunt regulation, while Reptile people, formerly with Owl people, are
    described as servants of subaquatic powers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Kansa section, Earth Lodge and Elk gentes consecrate mystic fireplaces
    for a new village; Earth Lodge people consecrate corn and regulate hunting and
    farming; other gentes have duties in buffalo attack, death announcements, war,
    mourning, peace-making, crier service, war-rite restriction, and blizzard ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Osage warpath preparation is described as a multi-day sequence involving
    willows, fire, prayers, a struggle for charcoal, sacred bags for mourners on war
    and peace sides, buffalo-hide strips for the first step on the warpath, and an
    unrecorded ceremony performed ahead of the warriors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the return of an Osage war party, an old Ka'se or Wind gens man meets the
    warriors outside the village, walks around them from north to east, tells them
    whether they may enter, and receives their clothing with his attendant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Osage Ka'se gens is called Idats'e because a member of that gens fills
    the peace pipes, and a corresponding Kansa gens is given a related name in the
    passage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author mentions the so-called “Messiah craze” among Dakota and other tribes,
    states that he is not competent to describe it, suspects some missionary influence
    or distortion, and emphasizes that the chapter’s inferences are provisional.
  category: speech
  evidence_refs:
  - ev:7
