  quote: ''
  summary: The passage reports Hidatsa ritual offerings made by a shaman in a sweat
    bath to the Lord of Life, fire, the four winds, and other superhuman powers; occasional
    offerings to a great serpent dwelling in the Missouri River; and a belief in female
    evil genii called Mahopamiid or Mahopa-miis who dwell on earth, especially in
    woods, and can harm people in life but not after death.
