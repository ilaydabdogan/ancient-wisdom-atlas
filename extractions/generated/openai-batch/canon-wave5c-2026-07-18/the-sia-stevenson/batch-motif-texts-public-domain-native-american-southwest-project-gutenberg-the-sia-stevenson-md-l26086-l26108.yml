  quote: ''
  summary: 'The passage lists bird omens: whip-poor-wills singing at night can foretell
    death or long life depending on whether they stop after a human reply; a gray
    screech owl foretells cold weather; the Ski-bi-bi-la bird is associated with spring''s
    approach and a prescribed reply; and the first spring cry of the night hawk signals
    that buffalo are fat again and hunting may be discussed.'
