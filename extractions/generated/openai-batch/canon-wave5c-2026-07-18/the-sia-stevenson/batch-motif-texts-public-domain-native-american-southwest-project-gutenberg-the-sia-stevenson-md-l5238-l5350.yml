canonical_text:
  quote: ''
  summary: Ethnographic description of the Sia Society of the Cougar, its officers,
    pre-hunt rites, offerings and prayers to the cougar and sun, preparation for hunts,
    departure of hunters, and reception of a returning hunting party with thanksgiving
    rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Society of the Cougar is described as nearly extinct, with membership
    consisting of the ho'naaite and his vicar.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a hunt, the society holds a two-day ceremonial; on the third morning
    ha'chamoni and plume offerings are deposited by the vice ho'naaite.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cougar is addressed as the great father and master of all game and is
    said to draw or send game by mental control rather than spoken words.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sun is said to give the Sia power to capture the game sent by the cougar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite decides when the hunt will occur, and offerings are placed for
    cougars of multiple directions and for the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a rabbit hunt, a rabbit stick and arrow point are deposited as offerings
    to the sun; for larger game, an arrow point only is deposited to the sun.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ho'naaite tells the war chief, who announces the hunt to the people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the announcement, a fire is made at night on the east side of the village,
    and selected huntsmen gather in a circle around it for planning, songs, and storytelling.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hunt is set for four days after the night gathering, and continency is
    observed until after the hunt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the fifth morning for a rabbit hunt, men and women prepare by having their
    heads bathed in yucca suds and putting on their best apparel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Rabbits are hunted on horseback with rabbit sticks, while larger game is hunted
    by men on foot, with the rifle preferred over the arrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A deer and antelope hunting party left in the afternoon, led by the vice war
    chief; the ti'amoni was included, which the account calls unusual.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Before the hunters departed, the ho'naaite visited each participating man's
    house, embraced him, and repeated a short prayer for success addressed to the
    cougar and then to the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Wives and relatives prepared food for the hunting party, and a wife or father
    handed the hunter his gun after mounting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: After thirteen days away, the returning hunters sent a courier ahead to notify
    the war chief.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the river, the vice ho'naaite of the Society of Warriors and the war chief
    offered prayers and sprinkled meal in thanksgiving for the hunters' success and
    safe return.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The returning hunters ascended to the village in single file; family members
    and village women received or helped with burdens at homes and after dismounting.
  category: sequence
  evidence_refs:
  - ev:9
