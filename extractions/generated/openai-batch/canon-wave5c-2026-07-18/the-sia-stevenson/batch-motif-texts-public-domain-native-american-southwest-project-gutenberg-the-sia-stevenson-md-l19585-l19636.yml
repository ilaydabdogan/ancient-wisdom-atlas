literal_observations:
- id: obs:1
  text: The source author presents the Osage chief's statement as referring to invocation
    of the four winds and as associated with fire or hearth worship.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a permanent village of earth lodges was established among the Osage and
    Kansa, certain fireplaces were consecrated before ordinary fireplaces could be
    made by common people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The consecrated fireplaces were arranged in two parallel rows from west to
    east; the Kansa arrangement is given as seven on one side and six on the other,
    while the Osage arrangement is said to have been seven on each side.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Osage, the Tsiou Wacta^e and Pa°qka gentes are described as the
    road-makers who consecrated the two rows of fireplaces.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old Tsiou man made a speech about parts of a lodge and placed four sticks
    in the fireplace in directional order; the placements are associated with winds
    and buffalo names.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An aged Pa"qka man performed a similar ceremony for gentes on the right side
    of the tribal circle, placing directional sticks while mentioning winds and deer
    names.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In time of war, prayers were made about the fire, and a warrior painted his
    face red with fire paint; this is described as a custom of the left or Tsiou side
    of the tribe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Those on the right or Haii^a side used the young buffalo bull decoration;
    the source says they probably prayed in connection with it to be filled with the
    spirit of their little grandfather, the young buffalo bull.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The warrior's quoted words refer to the little grandfather as dangerous when
    attempting action and state readiness to attack.
  category: speech
  evidence_refs:
  - ev:7
