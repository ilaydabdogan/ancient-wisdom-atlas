canonical_text:
  quote: ''
  summary: 'The passage lists Omaha nikie customs and a Kansa weather custom: crop-protection
    by the Blackbird people, fog removal by drawing and provisioning a turtle figure,
    breeze-making by Wind people, a fifth-morning child-naming form, Hanga sacred-pole
    buffalo feast restrictions, first haircut and moccasin rites with prayers to Wakanda,
    and a Kansa blizzard-stopping rite involving a red-painted child rolling in snow.'
  language: English with Omaha and Kansa terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During harvest, birds were said to devour corn, and men of the Blackbird people
    chewed grains of corn and spat them around the field to prevent this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During fog, named men in the passage drew a turtle figure on the ground with
    its head to the south and placed red breechcloth pieces and tobacco on specified
    parts of the figure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The turtle-ground rite was said to be imagined as making the fog disappear
    soon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A gens described as Wind people flapped blankets to start a breeze when mosquitoes
    were abundant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Omaha gens was said to have a form for naming a child on the fifth morning
    after birth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hanga men belonging to the sub-gens keeping the sacred pole ate buffalo tongues,
    while the buffalo was called their grandfather and eponym, and they could not
    eat buffalo sides.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other Hanga men could not eat the tongues but could eat consecrated buffalo
    sides after ceremonies connected with thanksgiving and anointing of the sacred
    pole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An Omaha child's hair was not cut until the child was taken to an old Ictasanda
    man, who cut the first locks, put on the first moccasins, and said prayers over
    the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prayer forms ask Wakanda to pity the child and ask that the child's feet
    rest or tread on the ground for a long time, with one form adding that the child
    may go ahead or live hereafter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: During a blizzard, other Kansa asked members of the Tcihaci or Kaze gens,
    described as Wind people, to interpose for good weather and to cause one of their
    children to be decorated.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A youngest son of a Kaze man was chosen, painted with red paint, and rolled
    repeatedly in the snow, reddening it around him; this was supposed to stop the
    storm.
  category: action
  evidence_refs:
  - ev:8
