canonical_text:
  quote: ''
  summary: The passage describes a rain ceremonial of the Giant Society in a ceremonial
    chamber. The ho'naaite prepares a sand painting and slat altar, arranges ya'ya
    fetiches and other ritual objects, supervises the coloring of ha'chamoni and the
    preparation of plume and yucca-ring offerings, sprinkles the altar and offerings
    with medicine water, and later prays to named animal powers to intercede with
    cloud people so that water may fall and crops may grow. Food is placed before
    the altar and then cast outside to animal Ko'pishtaia of the cardinal points.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite leaves his fireside seat in the ceremonial chamber, makes a
    sand painting at the east end of the room, and erects a slat altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The vicar assists during the morning by cutting willows and preparing ha'chamoni,
    and remains at that work while the sand painting is being prepared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman and a little girl arrive as female members, and the ho'naaite distributes
    sacks containing ya'ya, reserving two for himself and setting aside four for other
    members.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: One ya'ya is described as captured from the Navajo by a former ho'naaite and
    as precious because it represents tTt's6t, called the mother of all Indians.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Five ya'ya are placed in a line before the altar and on the sand painting;
    miniature bows and arrows are laid before four of them, while the captive one
    has none.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bear-leg skins with claws, bear-claw necklaces, reed whistles, eagle plumes,
    a medicine bowl, stone fetiches, and a cloud bowl are arranged around or before
    the altar and sand painting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman grinds black pigment, yellow ocher, and impure malachite, mixes
    the powders with water, and the woman and girl paint the ha'chamoni.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The ho'naaite lays out turkey plumes, eagle feathers, and plumes from birds
    of the cardinal points; he and the vicar tie the plume piles while a low chant
    is sung, and the ho'naaite waves each completed group in a left-to-right circle
    before his face.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The woman makes four yucca rings, the child dips them in yellow paint, and
    the ho'naaite adds a hummingbird wing plume to each; the rings are described as
    offerings to the cloud children and as emblematic of wheels on which they ride
    over ti'nia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ten ha'chamoni are designated to bear messages to cloud rulers of the cardinal
    points, Ho'channi, Sûs'sistinnako, t^t'sCt, and the sun.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The ho'naaite places the ha'chamoni and rings in a flat basket before the
    altar and cloud bowl, posts a stuffed parrot on the central slat, pours water
    into the medicine bowl, adds corn pollen, and sprinkles the altar and offerings
    with dipped eagle plumes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bread and meat remaining from the meal are placed before the altar and later
    sprinkled with medicine water.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: In the night ceremony, the ho'naaite prays to Cougar of the North, Bear of
    the West, Badger of the South, Wolf of the East, Eagle of the Heaven, and Shrew
    of the Earth, asking them to intercede with cloud people to water the earth so
    crops may grow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The vicar gives the ho'naaite bits of bread and meat; the ho'naaite leaves
    with the food and eagle plumes and casts the food to the animal Ko'pishtaia of
    the cardinal points, begging them to intercede with the cloud people to come and
    water the earth.
  category: action
  evidence_refs:
  - ev:7
