canonical_text:
  quote: ''
  summary: 'The passage describes Hidatsa divinities and rites: the Man who Never
    Dies or First Made as creator and instructor in ceremonies; the Grandmother as
    a secondary creator and giver of two sacred kettles associated with remembering
    great waters, birds, flood commemoration, and rain rites; and the sun, moon, and
    morning star as powerful celestial beings with sacrifice and kinship associations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hidatsa believe in the Man who Never Dies, also called Lord of Life and
    literally the first man, who dwells in the Rocky Mountains and made all things.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grandmother is venerated, roams over the earth, had an inferior share
    in creation, and created the toad and the sand-rat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Grandmother gave the Hidatsa two kettles, which are preserved as a sacred
    treasure and used as charms or fetiches on certain occasions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Grandmother directed the ancestors to preserve the kettles and remember
    the great waters from which animals came dancing, including the red-shouldered
    oriole and other riverbank birds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hidatsa regard the birds that came from the water as medicine for corn
    patches and attend to their songs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When those birds sing, the Hidatsa fill the two kettles with water, dance,
    and bathe to commemorate the great flood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When fields are threatened by drought, the Hidatsa hold a medicine feast with
    the two kettles and beg for rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During drought rites, shamans are paid to sing for four days in huts while
    the kettles remain full of water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sun, called the sun of the day, and the moon, called the sun of the night,
    are considered great powers and receive sacrifices before enterprises.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The morning star, Venus, is regarded as the child of the moon, a great power,
    originally a Hidatsa, and the grandson of the Old Woman who Never Dies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The First Made or First in Existence is said to have made the stars, sun,
    earth, and first representatives of each animal and plant species, while no one
    made him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The First Made instructed the tribal forefathers in the ceremonies and mysteries
    known to them.
  category: action
  evidence_refs:
  - ev:9
