canonical_text:
  quote: ''
  summary: 'A technical ethnographic description of clothing items, especially moccasins,
    mittens, breeches, and leggings: their deerskin materials, cutting and sewing
    methods, fastening, ornamentation, use variants, and expected wear.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Different portions of deerskin are described as better or worse for parts
    of moccasins: neck skin is too stiff for toe creases but useful for tongues, sides
    are used for bottoms, and flanks or scarred back portions are used for tops and
    strings.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moccasins for young children may avoid toe creasing by using a seam parallel
    with the toes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moccasins used in a tent or dry camp area are described as having no tops
    and being held to the foot with a drawstring.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The moccasin tongue is said to bear much of the walking strain and is often
    ornamented with colored cloth or, less often, beadwork.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that one deerskin can make five to seven adult pairs of
    moccasins and that fifteen to twenty-five pairs may be needed for each adult because
    they last only two or three weeks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hands are protected with mittens made from smoked deerskin, folded, cut, and
    sewn along the edges.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mitten thumb is made by cutting a tongue-shaped piece from the palm and
    sewing in another fitted piece.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Breeches are described as usually not ornamented with paint because they are
    generally not exposed to view.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Leggings extend from the upper thigh to the ankles, are made like narrow open-ended
    bags, attach to the breeches by a front string, have an outer seam with a fringed
    deerskin strip, and are painted similarly to the coat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: For careful moccasin construction, especially for a person of importance,
    the foot may be measured before cutting the sole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The moccasin sole is cut as a parallelogram, with edges turned up and creases
    made around the toe area.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Toe creases are held by sinew thread; the passage identifies this stitching
    as a key measure of the maker's skill.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The moccasin tongue, optional welt, ankle top strip, and deerskin thong are
    assembled so the thong passes around the heel below the ankles and wraps the top
    ends over the tongue.
  category: sequence
  evidence_refs:
  - ev:8
