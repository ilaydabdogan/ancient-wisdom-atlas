  summary: The excerpt reports Fletcher's statement that a tent set apart for consecrating
    ceremonies after sunset on the first day was pitched within the line of tents
    on a former sacred-tent site. It adds that the author learned from a Ponka chief
    in 1873 about a medicine described as a bulbous root growing near the place where
    the sun pole is planted. The fragment also mentions trailing grass and wild sage
    on which a buffalo skull is laid.
