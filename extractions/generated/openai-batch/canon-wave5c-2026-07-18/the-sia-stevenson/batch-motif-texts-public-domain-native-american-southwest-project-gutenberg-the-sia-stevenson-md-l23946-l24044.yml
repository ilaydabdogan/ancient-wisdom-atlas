canonical_text:
  quote: ''
  summary: 'The passage describes Sun Dance ceremonies at a dancing lodge: candidates
    circle and enter the lodge, gesture toward the four quarters, sing, paint themselves,
    fast, cry, dance, and undergo scarification or fastening to posts or the sun pole.
    It also describes a female relative who may substitute for a poor male kinsman,
    a decorated horse tied near the sun pole, buffalo skulls placed on cleared earth,
    and dancers bearing or being attached by thongs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The candidates circle the exterior of the dancing lodge four times from left
    toward right before entering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the lodge, the candidates stretch their hands toward the four quarters
    of the heavens and later repeat this action while walking around the interior.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Soil is cut out between the candidates and the pole in the shape of a half-moon
    down to virgin earth, and buffalo skulls are placed on the bare spot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The candidates repaint themselves with red paint and are lifted to their feet
    by attendants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Sun Dance song is begun by one candidate, and the others join until all
    are singing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Selected men redden their whole hands and dance without touching the withes
    connected with the sun pole or the buffalo skulls, extending their hands toward
    the sun with palms turned away from themselves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The candidates are placed in a row at the back of the lodge and begin to cry;
    a woman substituting for her elder brother joins them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A female relation may take the place of a poor male kinsman in the Sun Dance
    if she pities him; she suffers as male candidates do except that her flesh is
    not scarified.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The substitute woman wears a buckskin skirt, lets her hair hang loosely down
    her back, and carries the pipe of the brother or kinsman in whose place she dances.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: As drums beat, candidates dance and blow flutes; the substitute woman dances
    slowly with head bent downward, shoulders erect, and repeated knee-bending without
    lifting her feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: All candidates fast from the time the sun pole is cut and cry and dance at
    intervals; the substitute woman also abstains from food and drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A horse owner may tie his decorated horse to a thong fastened to the sun pole
    and then join the dance after approaching and holding the horse by the lower jaw
    while crying.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The participating horse is painted red, has its tail bundled and tied, and
    wears feathers in the tail and forelock.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: One scarification form places a dancer between four posts arranged as a square;
    thongs are run through scarified places on his back and chest and fastened to
    the posts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage reports that ornamental skewers had been run through devotees'
    wounds to be stained with blood and kept as souvenirs of dancers' bravery, and
    that regular skewers held thongs secured to the sun pole.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Another dancer has his back scarified and a thong inserted from which a buffalo
    skull is suspended; he dances so that the weight may tear the thong through the
    flesh, and blood runs down his back.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Another dancer is fastened to the sun pole by two leather thongs run through
    holes made in his flesh; such dancers are required to look upward.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: If the candidate fastened to the sun pole is short, attendants push him up
    so the thongs can be inserted and tied, leaving his weight to stretch the skin
    for a long time.
  category: action
  evidence_refs:
  - ev:11
