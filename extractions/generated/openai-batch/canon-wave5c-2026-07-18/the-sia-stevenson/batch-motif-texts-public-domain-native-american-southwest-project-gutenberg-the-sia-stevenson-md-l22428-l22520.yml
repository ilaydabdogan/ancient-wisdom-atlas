canonical_text:
  quote: ''
  summary: The passage surveys Dakota and related religious beliefs and practices
    as reported by earlier writers and the author. It discusses disputed claims about
    a single Great Spirit, reports of Wahconda appearing in animal forms, sacrificial
    offerings after sickness and in hunting, and god-seeking through purification,
    fasting, seclusion, and bodily ordeal to obtain a dream or revelation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that assertions that Dakota tribes believed in one Great
    Spirit before white contact cannot be proved, and notes that some writers who
    made such claims also described many evil spirits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Say is reported as describing Wahconda as a protean being appearing to different
    people in different forms, including grizzly bear, bison, beaver, owl, and other
    birds or animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that Say mistook the generic term Wahconda for a specific
    one.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Shea is quoted as saying that Dakota people recognized a Supreme Being but
    directed fear and appeasement toward demons or nature spirits rather than adoring
    that being.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lynd describes Dakota religious life as involving many objects of devotion,
    gods, demons, spirits, beliefs, prayers, sacrifices, and mixed attitudes toward
    ritual performances.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sacrifice is described as entering Dakota religious thought at all times,
    including at death, and offerings after recovery from sickness are usually modest
    objects such as cloth, skins, pans, or kettles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In hunting, particular portions of killed animals are held sacred to the god
    of the chase or other deities; examples include deer head or heart and bird wing,
    heart, or head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The custom called wohduze is described as constant for each individual, with
    the same part of an animal always sacrificed by that person.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hatjmdepi or god-seeking is described as a practice of seeking a dream or
    revelation, not as ordinary dreaming in sleep, and is associated with named Dakota
    divisions and neighboring groups.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Dakota seeking success in an important undertaking first purifies himself
    by the Inipi steam bath, fasts for three days, avoids women and society, and secludes
    himself to be pure enough for revelation from the invoked deity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After fasting, some practitioners make a sacrifice by piercing the breast
    and arms with a knife, attaching thongs to the wounds, fastening them to a tall
    pole, and hanging suspended for two to four days.
  category: action
  evidence_refs:
  - ev:8
