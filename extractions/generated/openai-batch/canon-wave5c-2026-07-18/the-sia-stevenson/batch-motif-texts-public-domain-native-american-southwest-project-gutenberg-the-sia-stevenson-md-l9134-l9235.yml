canonical_text:
  quote: ''
  summary: The passage describes diseases attributed to crowded, poorly ventilated
    snow huts; shamanic treatment through influence on the sick; social responses
    to murder, vengeance, taboo, ghosts, elder abandonment, suicide, famine punishment,
    cannibalism, and banishment among the Koksoagmyut and related Innuit groups as
    reported by the narrator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulmonary troubles are attributed to crowded, poorly ventilated huts whose
    openings are quickly closed to preserve heat.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A deserted snow hut with an unclosed doorway is avoided in favor of building
    a new snow hut because the chilled house is difficult to warm again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shaman or conjurer is described as treating sickness by working on the
    imagination, will power, and faith of the sick person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that the magnitude of disease is generally measured by
    the patient's worldly wealth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Koksoagmyut are described as usually peaceful, but jealousy may lead to
    murder.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person whose character is no longer tolerated may be forbidden to enter
    huts, share food, or have intercourse with others; a murderer may be killed by
    several men, usually by stoning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For premeditated murder, the next of kin is described as having a duty to
    avenge the deed, sometimes after years of waiting for an opportunity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Akpatok island is described as tabooed after the murder of people from a wrecked
    vessel, because ghosts of the victims might appear and ask for relief, and the
    natives lack the proper offerings to appease them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Aged people without relatives may be neglected, left behind during a move,
    or found dead with stones piled around the corpse and thongs binding it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old one-eyed woman at Fort Chimo was proposed for strangling to relieve
    her misery, but the act was postponed when the eye improved.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Suicide is described as occurring by throwing oneself from a cliff, strangulation,
    or use of a gun, with remorse and disappointed love given as causes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: During food scarcity, a husband discovered his wife eating fish she had hidden,
    blocked the snow-hut entrance, and she remained inside until she died of starvation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In severe scarcity, some families are reported to have eaten dogs, skin clothing,
    and other skin articles before being driven to cannibalism.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Unlucky or disliked women are described as being driven from camp and forced
    to travel until they find relief or perish.
  category: action
  evidence_refs:
  - ev:10
