canonical_text:
  quote: ''
  summary: The passage summarizes Dakota accounts of Ikto/Iktomi/Unktomi as a cunning
    mythical figure associated with the spider, naming, speech, animal forms, hunter
    frustration, deception by Rabbit, and a dangerous water crossing. It also describes
    related woods, lodge, or threshold spirits, and introduces Anog-ite/Anung-ite,
    a two-faced being associated with danger to pregnant women and with stories of
    twins and a stolen infant.
  language: English with Dakota and other Indigenous names/terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ikto, Iktomi, or Unktomi are described as names now given to the spider by
    the Dakota, but formerly belonging to a mythical character.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Teton speakers describe Ikto as the first being to attain maturity in this
    world, more cunning than humans, the namer of all people and animals, and the
    first user of human speech.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ikto is also called the Mocker; peculiar animals are attributed to Iktomi’s
    making, and animals are said to be his kindred who must follow his original commands.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Unktomi is said to torment hungry Indians by bringing buffalo near camp and
    then driving them away by means of a black wolf and a white crow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rabbit caught by Ikto gains release by teaching him to make snow with rabbit
    fur; Ikto later fails when he tries to use his own hair.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ikto reaches a stream he cannot ford; a long swimming object offers to carry
    him across with instructions about not lifting his head and warning of a cloud.
  category: sequence
  evidence_refs:
  - ev:4
