canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of Hudson Strait Eskimo
    winter snow houses: the terminology of iglu, required snow conditions, cutting
    and arranging snow blocks with a snow knife into a spiraling dome, constructing
    doors and passageways, arranging interior beds and coverings, adding ice windows
    and protective walls, observing frost effects by lamplight, noting roof-collapse
    risks, and building connected storage structures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that winter dwellings of the Hudson Strait Eskimo consist
    of snow houses and explains that the term iglu is generic for house, while the
    snow dwelling is identified with a more specific term rendered as iglu geak.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Snow for building must have sufficient depth and firmness, and a sword-shaped
    snow knife is used to cut blocks.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The builder cuts blocks, arranges them in a curved line, adds upper blocks
    in a spiral form, draws the wall inward into a dome, and fits a key block at the
    top with assistance from another person.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Joints in the snow-block structure are sealed with small snow pieces or crushed
    snow pressed into crevices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The floor is the original snow bed, the door is cut below the foundation row,
    and a trench with an arched snow covering forms a sheltered passageway.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some entrances have shoulder-high snow-block walls, may be tortuous, and can
    become unpleasant or dangerous when used as refuge by dogs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The interior includes a raised snow bed used for sitting and sleeping, covered
    with boughs, grass or twigs, and reindeer or bear skins.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A window may be made from thick clear lake ice set into the sunward wall of
    the snow dome to admit light.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A low exterior wall of snow blocks may protect the dwelling from drifting
    snow, and a single night's storm can destroy a house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In severe weather, breath and other moisture condense and crystallize as frost
    on the interior dome, reflecting lamplight with a gem-like brilliance.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: If the roof is poorly shaped, interior heat may soften the snow and cause
    the roof or entire structure to fall.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A similar snow structure may be built beside the dwelling, connected by a
    passageway, and used to protect possessions such as oil bags and skin bundles
    from dogs and weather.
  category: object
  evidence_refs:
  - ev:11
