canonical_text:
  quote: ''
  summary: A wolverene stays with wolves who make fire by jumping over brush. The
    wolves test him with fat, feed him, and later provide a huge sledload of meat
    for his hungry family. When the wolverene asks for fire, the wolf leader jumps
    over his body three times and warns him not to look back at the sled. On the journey
    home the wolverene can make fire by copying the jumping action, but after discarding
    his flint and steel he fails to make fire, retrieves the tools, looks at the sled,
    finds he cannot move it, and takes only a smaller load of meat and fat.
  language: English
  quote_policy: summarized
