canonical_text:
  quote: ''
  summary: The passage describes bodily endurance practices involving piercing, cords,
    fasting, fainting, encouragement by witnesses, vow fulfillment, and a Hidatsa
    Okippe/Akupehri ceremony with a forked pole, medicine lodge, pits, buffalo hide
    or skull, and candidates seeking the rank of brave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A devotee has two arrows passed through the muscles of his breast, with cords
    attached to the arrows and to a post planted in the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The devotee throws himself backward so that much of his weight depends on
    the cords, chants, keeps time to music, faints, revives after encouragement, and
    resumes the same self-torture before being loosened and carried away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another Minnetaree, acting in compliance with a vow, has holes made through
    the muscles of each shoulder and cords passed through them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shoulder cords are attached as a bridle to a horse that has been kept
    without food or water for several days.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Minnetaree leads the horse to a river and prevents it from drinking by
    straining with his shoulder muscles without using his hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Hidatsa are said to celebrate the Okippe, called Akupehri, with deviations
    including a high forked pole in the center of an open circle instead of a so-called
    ark.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Preparations for war captains intending an enterprise in May or June are combined
    with the Okippe of young men who wish to obtain the rank of brave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A large medicine lodge is erected open above, and candidates take places in
    a middle division.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two pits are usually dug for partisans, who lie in them four days and nights
    with only leather around the waist; the first partisan chooses the second.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Young people submit their bodies to torture to display courage and fast four
    days and nights, leaving them faint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A buffalo hide with the head hanging down and a strap is fastened to the forked
    pole, and an old man is chosen to oversee the torturing of candidates.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sufferers often faint, are lifted by the hands and encouraged, then begin
    again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After dragging a buffalo skull long enough, the candidates are made to run
    in a large circle until they fall exhausted and are taken to the medicine lodge.
  category: sequence
  evidence_refs:
  - ev:5
