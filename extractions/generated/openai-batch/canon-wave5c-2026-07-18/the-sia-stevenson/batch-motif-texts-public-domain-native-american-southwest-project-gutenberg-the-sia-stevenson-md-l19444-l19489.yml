canonical_text:
  quote: ''
  summary: 'The passage states that no Omaha or Ponka moon invocations have yet been
    found, while robe and tent decorations indicate the moon is considered qube. It
    notes an Osage tradition addressing the moon as grandfather and Wakanda of night.
    It then describes Omaha beliefs about mi°-qu-ga, persons considered sacred or
    mysterious because affected by the Moon Being: in a puberty fast vision, the Moon
    Being presents bow and arrows and a women''s pack strap, and seizing the pack
    strap fixes the youth''s later social role as acting, dressing, speaking, and
    working as women did. The passage adds reports about such persons taking men as
    husbands, a Ponka child''s explanation, a Kansa parallel reported by Say, and
    Fletcher''s account of a man who resisted the role and died by suicide.'
  language: English
  quote_policy: summarized
