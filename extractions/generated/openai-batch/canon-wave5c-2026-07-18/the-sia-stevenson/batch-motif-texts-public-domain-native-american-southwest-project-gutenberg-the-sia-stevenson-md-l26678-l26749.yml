canonical_text:
  quote: ''
  summary: The passage describes Mandan and Hidatsa fetiches, including white buffalo
    cow skins, pole-hung ritual objects, and a painted buffalo dress. It then reports
    several folk-lore items involving childbirth and pregnancy taboos, hunting efficacy,
    women and smoking omens, pipe-related bodily effects, fire, worms, the number
    seven, and smoking used to extract disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A complete skin of a young white buffalo cow, with horns, nose, hoofs, and
    tail, is described as an eminent fetich among the Mandan and Hidatsa and is worn
    only on rare occasions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An owner who sacrifices such a skin rolls it up with artemisia or an ear of
    corn and suspends it on a jyole until it decays.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other skin, grass, and twig figures hung on tall poles near Mandan and Hidatsa
    villages are said to seem to represent the sun, moon, and perhaps named beings;
    people petitioned them and sometimes howled for days or weeks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cbarata-Numak8hi, called the Chief of Wolves, owned a painted buffalo dress
    as his fetich and valued it as a souvenir of his brother, who had been shot by
    the enemy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a child is born, the father must not bridle a horse by fastening a lariat
    to its lower jaw; violation is said to cause infant death in convulsions, and
    during pregnancy to bring ill luck, often failed hunting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a buffalo is wounded but not quickly killed, the hunter tries to bring
    home the buffalo heart and have his wife shoot an arrow through it, after which
    he again trusts his weapons to kill quickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A pregnant woman is said to be lucky at a billiards-like game; a woman passing
    or reclining among Mandan men who are smoking is treated as ominous or requires
    a piece of wood laid across her as communication between the men.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: A strong Mandan man must hold his pipe by the head; if bleeding occurs, he
    empties the pipe into the fire, where the contents explode, and the bleeding stops.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Mandan man says that when someone offers him a pipe, his mouth becomes full
    of worms, which he throws into the fire by handfuls.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Among the Hidatsa, when a certain man smoked slowly, people in the lodge were
    forbidden to speak or move, women, children, and dogs were excluded, and a guard
    was placed at the entrance; if exactly seven smokers were present these precautions
    were omitted.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Hidatsa smoker put his pipe on painful or diseased places and smoked,
    claiming that he could extract disease; he pretended to seize it in his hand and
    throw it into the fire.
  category: action
  evidence_refs:
  - ev:11
