canonical_text:
  quote: ''
  summary: The passage describes Dakota Sun Dance vows, purposes, household and devotee
    rules, treatment of a consecrated earth space, preparatory hunting and offerings,
    restrictions on the devotee, gift-giving connected with ear-piercing, and the
    invitation of neighboring tribes who gather under conditions of peace and alliance.
  language: English with Dakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Dakota name of the Sun Dance is explained as meaning that they dance while
    looking at the sun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:2
  text: Reasons given for celebrating the dance include famine, epidemic, desire to
    kill an enemy, desire for horses, and desire for abundant fruits and vegetables
    in the coming summer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People who make vows pray mentally to the sun and state that they will pray
    to Wakantanka early in the summer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vow-makers take frequent sweat-lodge baths during the winter and hold feasts
    where herb teas are drunk before the vow is announced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Household members of devotees must abstain from loud talking and bad acts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A piece of soil is cut away in the lodge until virgin earth is reached, vermilion
    is scattered on it, pipe ashes are emptied there by the prospective participant,
    and others do not step on or reach toward it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The U-ma-ne is described as a mellowed earth space and as a symbol of the
    earth or land with the four winds or four quarters represented by lines or a cross.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a devotee kills a deer or buffalo, he treats the body in a wakan manner,
    leaves the horns attached to the skull, reddens the skin, lays the skull on a
    bed of wild sage, and erects a post with a tobacco pouch and robe to be offered
    as a sacrifice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The devotee's food and implements must be clean or new, and household members
    make new decorated smoking-related objects for him.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The devotee may enter the sweat lodge but must not swim; he rubs his body
    with wild sage, avoids unclean persons, refrains from fighting, proceeds slowly,
    and has regular periods for crying and praying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Female kindred make moccasins and gather money and goods to give presents
    to poor people, and this gift-giving is linked to gaining the right to have a
    child's ears pierced.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Neighboring tribes are invited; during the Sun Dance even hereditary enemies
    visit one another, shake hands, and form alliances.
  category: relationship
  evidence_refs:
  - ev:10
