canonical_text:
  quote: ''
  summary: The passage describes mortuary practices, mourning, daily consultation,
    dream divination, and spirit propitiation among a group called “Indians” in the
    text. It notes suspension of the dead from trees when the ground is frozen, burial
    in ground thawed by a tent fire for distinguished persons, earlier scaffold and
    tree-suspension burial, missionary introduction of subterranean burial, mourning
    practices, dream interpretation with drum and trance, and beliefs in numerous
    patron spirits requiring offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the ground is frozen too hard to dig, the dead are suspended from tree
    branches, with an attempt to return in summer and inter the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person distinguished among the people may be buried where a tent fire has
    long continued and thawed the ground enough to cover the body; afterward the tent
    is moved.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the described Indians do not have the same dread of a corpse
    that the author attributes to the Eskimo.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The described Indians are said to have stripped clothing from recently deceased
    Eskimo and to have appropriated a gun or other implement placed beside a dead
    Innuit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author reports evidence that scaffold burial and suspension from trees
    were formerly practiced, and that subterranean burials were introduced by missionaries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead are mourned according to their position in life, and a favorite child
    may cause intense grief in the mother for many days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The body is taken to the place of final rest by friends, while relations seldom
    accompany it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people’s life is described as a constant struggle to obtain food and clothing,
    and actions are undertaken with deliberation and consultation with friends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people are said to be guided by dreams, imagining that at night they are
    in indirect communication with spirits watching over daily occupations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Certain persons are renowned for divining dreams and are consulted with confidence.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A drum is used while the dream-divining person enters a stupor or trance and
    then reveals the meaning of another person’s dream.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Things not understood are attributed to the working of numerous spirits.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Every object is said to have a patron spirit that must be propitiated with
    pleasing offerings so that it may perform services for the people’s welfare.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Each person is said to have a patron spirit that must be placated to prevent
    misfortune.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The spirits are said to assume an infinite variety of forms.
  category: attribute
  evidence_refs:
  - ev:7
