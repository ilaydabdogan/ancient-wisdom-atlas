  quote: ''
  summary: An animal tale describes Rabbit and Frog, addressed as brothers, encountering
    smoke that leads first to beavers and later to deer. Rabbit carries Frog and helps
    prepare hunting arrangements, while Frog directs the action, survives being shoved
    under ice, kills beavers and deer, returns with game, and later gives Rabbit frozen
    deer lungs represented as fat, after which Rabbit becomes sick.
