canonical_text:
  quote: ''
  summary: The passage describes the equipment and use of the kaiak in hunting seals,
    whales, and birds, including detachable spears, lines, floats, tridents, hand
    boards, paddles, drip guards, and a hook staff. It then describes a young man's
    progression from gun ownership to kaiak, umiak, tent, and household leadership,
    contrasting this with men who fail to acquire these items. It closes with a note
    on a full-sized kaiak and models in a collection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The whale or seal spear has detachable parts connected by thongs, and a long
    coiled line gives the animal room to struggle until exhausted.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the sea is rough or the hunter cannot cope with the quarry, a float may
    be thrown over while the hunter follows and stabs when possible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A divergent three-pronged barbed iron implement is used to kill small seals,
    white-coated young seals, and sometimes birds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hand board or thrower supports and releases certain spears; after a successful
    throw, the hand board is placed under thongs on the kaiak and the paddle remains
    ready.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The paddle is heavy, of variable length, and has long narrow blades dipped
    alternately into the water.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A piece of plaited rope or skin is placed near the paddle blade to divert
    dripping outside the kaiak and keep clothing dry.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hook staff with an iron hook, line, and weight is used to retrieve sunken
    seals or whales and to aid movement through narrow ice channels.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A young man begins with a gun and ammunition; if successful, he can make a
    kaiak, obtain skins for an umiak and tent, and become head of a gens or family.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Brothers may live together and jointly own the tent and umiak, while other
    household affairs are treated as individual property requiring permission for
    use.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men who do not prepare skins when able may fail to own a kaiak, umiak, or
    tent and may live with others or alone in a poor social condition.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The collection includes a full-sized kaiak with fittings and models, including
    a toy kaiak cut from walrus tusk with a double-bladed paddle of the same material.
  category: object
  evidence_refs:
  - ev:8
