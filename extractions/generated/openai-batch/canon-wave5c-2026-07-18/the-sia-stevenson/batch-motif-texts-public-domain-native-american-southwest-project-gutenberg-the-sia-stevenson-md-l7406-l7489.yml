canonical_text:
  quote: ''
  summary: Coyote seeks to become a ho'naaite under Cougar. During the required preparation
    and offerings he secretly eats food meant for Ko'pishtaia, later fails to catch
    a deer, is contrasted with Cougar's successful companion, and is stripped of the
    office. The passage ends by explaining why coyote continually hunts game without
    success.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning, Coyote is described as industrious and constantly traveling,
    but as having thoughts that were not good and lying about belonging to the Corn
    people and the Knife people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote asks Cougar to become a ho'naaite, and Cougar says this is possible
    when Coyote's thoughts are good.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cougar instructs Coyote to return in four days, and they work for eight days
    preparing ha'chamoni while abstaining from food, drink, smoking, and sexual activity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each night Cougar gives Coyote food to offer to Ko'pishtaia or Ko'plshtaia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the first night, Coyote becomes hungry, eats the food meant for Ko'pishtaia
    or Ko'plshtaia, returns pretending he made the offering, and continues doing this
    secretly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cougar's body changes during the fast, while Coyote does not change; by the
    sixth night Cougar suspects Coyote is not making the offerings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Cougar teaches Coyote the song of the Coyote Society, Coyote is ordained
    a ho'naaite.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cougar sends Coyote to kill a deer without arrows, but Coyote follows the
    deer all day and returns without catching it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cougar tells Coyote that eating the food intended for Ko'pishtaia or Ko'plshtaia
    is the reason he failed to catch the deer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At dawn, one of Cougar's people catches a deer quickly and brings the meat
    back to Cougar's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cougar says Ko'pishtaia or Ko'plshtaia will be paid with plumes; Cougar and
    the others eat the deer meat, but Coyote is not given any because his thoughts
    are not good.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Cougar tells Coyote he is no longer a ho'naaite and says Coyote will keep
    traveling and hunting but will not understand how to kill deer, antelope, or other
