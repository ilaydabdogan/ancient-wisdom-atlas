canonical_text:
  quote: ''
  summary: The passage describes an early dark condition in which people of Ha'arts
    cannot see and make dwellings by digging holes. Two northern mothers deliberate
    in a chita, decide to make light, and, inspired by Sussistinnako, create the sun
    from shells and stones. They carry the sun east, ascend a high mountain, and release
    it so that it rises and lights the world. They later create the moon and star
    people to light the night, make four directional houses or villages, and a later
    episode shows the elder sister concealing a picture under a blanket while the
    younger sister guesses what it is.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Clouds are described as ascending at night and serving as a protection for
    the people of Ti'uia from the view of the inhabitants of Ha'arts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of Ha'arts made houses for themselves by digging holes in rocks
    and the earth because they could not see and could not build houses as they later
    did.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two mothers resided in the north, entered the chita or estufa, talked together,
    and decided to make light so their people could see.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder mother is described as elder and larger, while the other mother
    is described as having the better mind and heart.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two mothers, inspired by Sussistinnako, created the sun from white shell,
    turkis, red stone, and abalone shell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After making the sun, the two mothers carried him to the east, made a camp,
    ascended a high mountain the next morning, dropped the sun behind it, and the
    sun began to ascend.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the people saw the light, their hearts rejoiced; the sun's face is described
    as blue when far off and brighter as he came nearer, while a large mask covered
    his body.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the two women returned to the village, they told the people that they
    were the mothers of all.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The two mothers created the moon from stones and turkis so that the world
    might be lighted at night and so the moon might be a companion and brother to
    the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Because the moon traveled slowly and did not always furnish light, the two
    mothers created the star people and made their eyes from sparkling white crystal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The star people are said to have been grouped beautifully in the lower world
    and not scattered as they are in the upper world.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The two women entered the chita again and decided to make four houses, meaning
    pueblos or villages, in the north, west, south, and east.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The younger sister traveled over the world, visiting the houses of the west,
    south, and east, and returned to her home in the north.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The elder sister had a picture hidden under a blanket, asked the younger sister
