canonical_text:
  quote: ''
  summary: Po'shaiyanne obtains a ti'amoni's people through an exchange involving
    a beautiful bracelet and a repeated four-stick game, then visits the Sia. The
    Sia lack success in capturing game until Po'shaiyanne sees abundant animals from
    a high western mountain and performs a hunt ritual with fasting, continency, fire,
    meal, a flute, and the four directions, causing deer to enter a meal circle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ti'amoni sees Po'shaiyanne's pink bracelet with large stones and desires
    it more than his remaining possessions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ti'amoni asks his people what they would think if he gave them to the
    youth for the bracelet, and the people answer that he is their father and ruler
    and knows best.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ti'amoni offers all his people in exchange for the bracelet, and Po'shaiyanne
    agrees to give the bracelet for the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Po'shaiyanne and the ti'amoni repeat the game of four hollow-ended sticks,
    and Po'shaiyanne is successful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The ti'amoni tells Po'shaiyanne to take all his people and be a good father
    to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: Po'shaiyanne refuses to take all the ti'amoni's things, saying that doing
    so would cause him to lose his power over game.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:7
  text: Po'shaiyanne later determines to visit all the pueblos and then go into Mexico.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Sia recognize Po'shaiyanne when he arrives because they had known of him,
    sung of him, and looked for him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Before Po'shaiyanne's visit, the Sia did not possess the power to capture
    game, despite seeing animals and tracks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Po'shaiyanne visits a high mountain in the west and from its summit can see
    all over the earth.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: From the mountain, Po'shaiyanne sees a white deer to the north, a yellow antelope
    to the west, a sheep to the south, and a buffalo to the east, each associated
    with a high mountain or peak.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Po'shaiyanne also sees rabbits, rats, many small animals, and birds over the
    earth and in the air.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Sia ti'amoni doubts Po'shaiyanne's report and says he will believe when
