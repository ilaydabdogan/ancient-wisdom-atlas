canonical_text:
  quote: ''
  summary: 'The passage describes several methods used to capture beavers: blocking
    underwater holes and opening the lodge, draining water from a pond or lake to
    expose a lodge, shooting beavers on moonlit water, and using a deerskin purse-net
    over an exit. It notes the danger of beaver bites, the value of beaver flesh as
    food, and begins a description of the Nenenot crooked knife as an important tool.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When beaver dams and structures are found, the people devise ways to capture
    the animal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One method closes underwater holes leading to the beaver structure, opens
    the top of the hut, pulls the animal out by the hind legs or tail, and kills it
    with a blow to the head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The captured beaver seldom defends itself at first, but a pause before killing
    it is described as likely to result in a severe bite from sharp, powerful teeth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Where possible, water is drained or dammed off from a pond or lake so the
    beaver house is left dry; the occupant then emerges and is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Beavers are sometimes shot while moving or playing on the water during moonlit
    nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A beaver-catching net is made from fine deerskin thongs, shaped as a nearly
    two-foot circle, with small meshes, a stout thong, and a small spruce-root ring
    strengthened with sinew.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The net can be spread over a lodge exit to form a purse; when the beaver thrusts
