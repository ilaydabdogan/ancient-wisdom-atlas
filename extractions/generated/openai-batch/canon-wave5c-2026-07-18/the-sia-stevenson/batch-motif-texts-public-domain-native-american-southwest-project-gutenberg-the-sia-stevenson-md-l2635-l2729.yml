canonical_text:
  quote: ''
  summary: Po'shaiyanne enters Chihuahua, marries a chief's daughter, is killed by
    jealous men, returns alive, is cast into a lake with metal weights, and rises
    with an eagle feather; the Sia revere him as a culture hero and expect his return.
    The passage then describes relocation and founding of the present pueblo of Sia
    around a stone square called the village heart, the burial rites of an aged ti'amoni
    including provisions for a northward road after death, stone animal carvings at
    a ruined village, and ethnographic comments on Sia religious practice and comparisons
    with Zuni beliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Po'shaiyanne enters the plaza in Chihuahua, meets the great chief, is invited
    to the chief's home, and becomes acquainted with the chief's daughter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Po'shaiyanne asks to marry the chief's daughter; the chief asks the daughter,
    she agrees, and a public marriage feast is arranged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men who are pleased with the chief's daughter envy Po'shaiyanne, discuss killing
    him, carry him to their camp, and pierce his heart with a spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The day after Po'shaiyanne's death, he returns alive to his wife's home, alarming
    and angering those who tried to destroy him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Po'shaiyanne is captured again; gold and silver are bound to his feet before
    he is cast into a lake so that his body will not rise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A white fluffy eagle feather falls to Po'shaiyanne; when he touches it, the
    feather rises and Po'shaiyanne rises with it, lives again, and is said still to
    live and to come to the Sia someday.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Sia hold Po'shaiyanne's name in great reverence, regard him as their culture
    hero, appeal to him in daily prayers, and do not doubt his return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Po'shaiyanne's departure from Sia, the ti'amoni decides to leave the
    existing village and the people build the present pueblo of Sia.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A square of stone is laid first in the new village and is described as emblematic
    of the heart of the village, with the statement that a heart must exist before
    a thing can exist.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the aged ti'amoni's death, he is buried reclining in the ground with cotton,
    an eagle plume, corn pollen, cotton at the soles of the feet and over the heart,
    and a bowl of food in the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Many ha'hamoni are planted over the road to the north, described as the road
    traveled after death, and another bowl of food is placed on the road.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: People sing and pray all night in the house of the departed ti'amoni, and
    in the morning the singers are bathed in cold-water yucca suds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two rudely carved stone animals at the ruined village are spoken of by the
    Sia as cougar, but they say they are really lynx because the cougar remained at
    the white-house in the north.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage describes Sia religion as supplication for favors and payment
    for them, and says children are taught to speak with one tongue as straight as
    the line of prayer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage states that the Sia do not derive clan names from animal ancestors
    and do not believe their people evolved from animals other than the Sia themselves.
  category: other
  evidence_refs:
  - ev:10
