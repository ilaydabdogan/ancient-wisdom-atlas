comparison_claims:
- id: claim:1
  claim: The passage itself contrasts Sia bathing of a surviving spouse with a similar
    bathing of the remaining husband or wife in ZuQi as printed; it states that the
    reason in ZuQi is very different, but does not provide that reason.
  claim_level: same_motif
  target: ZuQi spouse-bathing after death mentioned in the passage
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: low
  limitations: The comparison is limited to the shared ritual action and mortuary
    context. The passage explicitly says the reason differs and gives no details for
    the ZuQi practice.
