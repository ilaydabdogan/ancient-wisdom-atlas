canonical_text:
  quote: ''
  summary: The passage describes Sia mortuary treatment of the corpse, mourning baths
    for surviving relatives, fourth-day rites for the departing spirit, the northward
    road to the lower world, credential inspection by lower-world guards, reception
    by a mother figure and dead relatives, punishments for wicked or improperly motivated
    ritual officers, the lower-world fate of animal spirits, and the immortality of
    cloud people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The corpse is wrapped and tied, two men carry and bury it without further
    ceremony, and wailing continues in the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a spouse dies, the surviving husband or wife is bathed by a female member
    of the survivor's clan so that much sorrow may be cleansed away; when a child
    dies, both paternal and maternal parents are bathed, but children are not bathed
    when a parent dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fourth day after death, after the spirit has hovered around the pueblo,
    the spirit starts its journey to the lower world and a ceremony is held by the
    deceased person's society or by a selected ho'naaite.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A ha'chamoni made on the third day by the theurgist is deposited on the north
    road for the spirit to carry to its future home.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A vase of food is deposited to feed the spirit on its journey, and additional
    clothing is cut and thrown over the north road rather than deposited whole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explains that whole clothing is not deposited because the spirit
    of the clothing could not leave the body if the clothing remained in perfect condition.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The road to the lower world is to the north, is described as crowded, and
    is traveled by dead spirits returning to their first home and by unborn spirits
    going toward villages where they will later be born.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the entrance to the lower world, two guards ask the spirit for credentials,
    and the spirit must show the ha'chamoni in order to enter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A spirit without a ha'chamoni cannot enter the lower world and must roam somewhere
    in the north.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the credential is accepted, the spirit may enter Shipapo and go to the
    mother in the lower world; another lower-world figure examines the ha'chamoni
    and hands it to SAs'slstinnako, who directs the spirit to join its dead relatives.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: A very wicked spirit is denied entry even if it has a ha'chamoni; the guards
    can read hearts and minds and put such spirits into a great fire below the earth,
    where the spirit is entirely destroyed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ti'amonis and ho'naaites who performed their duties with unwilling hearts
    are known to the mother in the lower world and are made to live apart, alone and
    without nourishment, for a period of purification before entering peace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The spirits of all animals go to the lower world; domestic animals serve their
    masters there, and prey animals receive a ha'chamoni, dance, and ceremonial when
    killed and carry the ha'chamoni as a credential like a human spirit.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cloud people are said never to die.
  category: attribute
  evidence_refs:
  - ev:9
