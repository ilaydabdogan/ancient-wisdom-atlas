canonical_text:
  quote: Please pity me! Bring to pass all the things which I desire!
  summary: At sunrise the dance ends. The devotees leave the dancing lodge, circle
    the dancing lodge and the lodge of preparation four times, receive minimal water
    and food after their fast, later enter the sweat lodge and rub themselves with
    wild sage. Gifts and sacrificial objects left at the lodges and sun pole are taken
    by boys or spectators. The camp disperses, and the passage closes by noting the
    need to follow ritual rules and the candidates' silent prayer to the sun.
  language: English
  quote_policy: quoted
