canonical_text:
  quote: ''
  summary: The passage describes a dance ceremony centered on a sacred tree. Young
    men are scarified, attached to the tree with ropes fastened to skewers under the
    flesh, made to dance while sounding eagle-bone flutes and looking toward the sun,
    and are not allowed to drink. Medicine men, attendants, criers, water-carriers,
    women singers, and donors all have ritual roles. Gifts are thrown onto a rope
    to help release a participant and are then taken by the poor. Pretty Enemy dances
    and is scarified but is not tied to the tree. Rocky Bear declines the ordeal,
    gives presents, and is expected to complete the dance later. The ceremony includes
    singing, drumming, and a feast.
  language: English
  quote_policy: summarized
