canonical_text:
  quote: ''
  summary: The passage describes building a dancing lodge around a sun pole, smoking
    a pipe in relation to the Great Mysterious One, senior men dancing and shooting
    at suspended objects, a mounted rite called the uugita, a paired young men’s and
    women’s singing circuit, and the re-erection of a preparation tent where candidates
    dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dancing lodge is built after prior preparations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Forked posts are set in two concentric circles, with the inner circle higher
    than the outer circle to create a slant for the roof.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The space from the inner circle of posts to the sun pole is left unroofed
    so dancers near the pole can see the sun and moon.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Horizontal tent poles, saplings or poles, leaf shields, leaves, and poles
    or branches are used in the lodge construction, with wall openings through which
    spectators can look in.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A very wide entrance is made so that a horse and offerings for the poor can
    be brought through it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Participants smoke a pipe because they think this can induce the Great Mysterious
    One to smoke.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aged men and chief men remove leggings and moccasins, and those with pistols
    take them to the dancing lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The aged men and chief men dance around the lodge interior, shoot at objects
    suspended from the sun pole, then dance around the interior of the camping circle
    toward their tents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the uugita, men tie their horses’ tails, dress in their best attire, ride
    two abreast around the camping circle, shoot into the ground, and fill the area
    with smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the uugita, riders thrown from horses are not attended to; other riders
    step over them and keep regard for the center of the camping circle.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Near sunset, young men and young women mount horses in pairs and sing responsively
    while moving slowly around the circle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At night, the tent of preparation is erected again; candidates dance there,
    and people look toward it because it is rumored the candidates will come out from
    it.
  category: sequence
  evidence_refs:
  - ev:8
