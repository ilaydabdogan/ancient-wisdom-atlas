canonical_text:
  quote: ''
  summary: In this Coyote myth excerpt, ka'wate tells the hares that a coyote lies
    dead by the river. After several inspections, the hares gather, strike the apparently
    dead Coyote, and dance over him. Ka'wate has them look upward, throws her mephitic
    fluid into their eyes, and Coyote rises; the two kill the blinded hares with clubs
    and cook them. In a later episode, Deer tells Coyote that sparks from a cedar
    fire at a cave made her children beautiful; Coyote imitates this with his own
    children, who burn to death, and he realizes he has been fooled.
  language: English
  quote_policy: summarized
