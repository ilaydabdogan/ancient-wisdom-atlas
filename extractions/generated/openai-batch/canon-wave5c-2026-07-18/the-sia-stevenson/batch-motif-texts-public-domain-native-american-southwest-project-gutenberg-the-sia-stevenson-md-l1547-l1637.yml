canonical_text:
  quote: ''
  summary: Two brothers, Ma'asewe and U'yuuyewe, return home but soon leave despite
    their mother's warnings. They go to an eastern lake associated with Sko'yo and
    animal companions, encounter and kill a great wolf protected by a stone shirt,
    remove its heart, and return home. Later, after another warning about a dangerous
    man by a northern canyon, they seek arrow-shaft wood and push the cougar-like
    ambusher into the canyon, killing him.
  language: English
  quote_policy: summarized
