- id: obs:1
  text: The mother and grandmother are delighted to see the boys again, but Ma'asewe
    is soon anxious to travel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother warns the boys not to go near an eastern lake where many Sko'yo
    and their animal companions go for water when the sun is over the middle of the
    world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ma'asewe first says he will not go toward the lake, but after leaving home
    he persuades his younger brother to go there; U'yuuyewe initially objects because
    of the mother's warning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the lake the boys see a great wolf drinking; they see what appears to be
    the wolf at the bottom of the lake, but later discover the wolf on a low mesa
    and understand the lake image as a reflection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf throws a large stick at the boys, and the boys avoid it by bowing
    their heads or jumping high.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wolf wears a shirt of stone that can be penetrated only at certain points.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: U'yuuyewe's thrown sticks first destroy the wolf's stone shirt for a moment
    and then kill the wolf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ma'asewe cuts open the dead wolf with a stone knife, takes out its heart,
    and preserves it before returning home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother questions the boys when they return from the lake, scolds them
    for going there, and then embraces them after Ma'asewe insists they killed the
    wolf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother tells the boys that good wood for arrow shafts is in a northern
    canyon, but warns that a bad man sits by a narrow path and kicks passers into
    the canyon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ma'asewe again says he will not go but then persuades U'yuuyewe to accompany
    him to the canyon.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the canyon, the cougar urges the boys to pass in front of him, but they
