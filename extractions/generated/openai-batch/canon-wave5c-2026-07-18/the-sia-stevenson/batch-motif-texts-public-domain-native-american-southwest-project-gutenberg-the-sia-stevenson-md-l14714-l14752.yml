canonical_text:
  quote: ''
  summary: 'The passage describes Nenenot steam baths in a suda-ory or sweat house:
    a dome-shaped frame covered with tent skins is set over heated stones, water is
    poured on the stones to produce intense heat and perspiration, and bathers remain
    until nearly exhausted. It notes that such baths are frequent and can delay travel.
    It also recounts an incident at Fort Chimo in 1882 in which an old man and woman
    left a sweat house just as a drove of reindeer rushed toward it, creating commotion
    among the camp population.'
  language: English
  quote_policy: summarized
