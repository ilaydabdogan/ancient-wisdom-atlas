- id: obs:7
  text: Ma'asewe and U'yuuyewfi go toward an Oraibi feast with their mother's consent,
    find the bee's home, and see a large honeycomb full of honey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers smear their bodies with honey so that the Oraibi will not recognize
    them and will take them for poor, dirty boys.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the Oraibi feast, the brothers see feasting in the houses, but only one
    house invites them in to eat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After eating, Ma'asewe thanks the woman, her husband, and family and tells
    them to go to a separate round house away from the village.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman and children drink from the bowl used by the boys, find the water
    sweet, and the family goes to the round house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Oraibi dancers, feasters, and mothers with infants are transformed into
    stone; the beings leave the bodies, ascend, and become the pinonero, identified
    in the passage as the Canada jay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Back at home, the mother questions why the boys are hungry, repeatedly fears
