canonical_text:
  quote: ''
  summary: Ma'asewe and U'yuuyewfi kill a people-eating antelope, order its future
    diet, and assign its flesh as food for people and its intestines as food for the
    mole. After the brothers have destroyed the giant enemies of the world, people
    rejoice and travel safely. The brothers then attend an Oraibi feast disguised
    with honey; only one household feeds them. They warn that household to move to
    a solitary round house. The other Oraibi villagers are transformed into stone,
    while their beings ascend and become Canada jays. Ma'asewe later confesses the
    destruction to his mother, who approves after hearing the reason.
  language: English
  quote_policy: summarized
