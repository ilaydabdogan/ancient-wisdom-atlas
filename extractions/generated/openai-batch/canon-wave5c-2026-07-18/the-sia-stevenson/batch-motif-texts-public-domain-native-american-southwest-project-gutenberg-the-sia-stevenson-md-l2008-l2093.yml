    only one house fed them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After Ma'asewe explains the reason for destroying the village, his mother
    says she is glad the people were destroyed because they were mean and bad.
  category: speech
  evidence_refs:
