canonical_text:
  quote: ''
  summary: 'The passage describes Kenenot sweat houses used for steam baths: a temporary
    dome of flexible poles and tent skins is erected over heated stones, water is
    poured on the stones to create intense heat and perspiration, and baths may interrupt
    journeys. An anecdote from Fort Chimo recounts an old man and wife escaping a
    sweat house just before a large drove of reindeer reached it, after which the
    man waved the tenting and the woman acted excitedly amid general tumult. Former
    sweat-house traces are said to be common along old travel paths.'
  language: English
  quote_policy: summarized
