  summary: The passage describes Joiwere origin traditions as sacred and restricted.
    It says these traditions resemble those of Osage, Kansa, and Ponka groups; tell
    of ancestors dwelling in an upper world and in the ground or world beneath; are
    recounted only under ritual conditions involving a feast, gathered people, and
    a sacred pipe; are preserved by secret societies; and explain origins of social
    divisions and cultural items. It also notes a probable Winnebago parallel involving
    a Wolf gens tradition with four kinds of wolves dwelling underground.
