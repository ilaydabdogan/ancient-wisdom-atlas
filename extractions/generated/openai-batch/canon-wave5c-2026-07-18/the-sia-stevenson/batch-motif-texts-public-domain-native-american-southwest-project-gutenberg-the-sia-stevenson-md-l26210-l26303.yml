canonical_text:
  quote: ''
  summary: 'The passage describes several forms of sacrifice and ritual ordeal among
    Mandan, Hidatsa, and Minnetaree groups: abandonment of horses to a personal medicine,
    offerings on poles near burial scaffolds, the Mandan Okipa as self-sacrifice,
    and the Hidatsa Dahpike/Nahpike or Minnetaree medicine dance involving a cottonwood
    log, a willow medicine lodge, fasting in sight of food, and bodily tortures such
    as skin cutting, piercing, and dragging bison skulls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Mandan man stated that he had owned seventeen horses, offered them all to
    his medicine, and become poor; he turned the horses loose on the plain and abandoned
    them forever.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Around Mandan burial scaffolds stood high poles with skins and other things
    hanging on them as offerings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The offerings on poles are said to be to Omahank-Numakshi, described as lord
    of life, or to Numank-Machana, described as the first man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Mandan Okipa is identified as a form of self-sacrifice and is said to
    differ in some respects from the Dakota and Ponka sun dance and from the Hidatsa
    Dahpike or Nahpike.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the Hidatsa Dahpike, men dressed and mounted as for a war-party go to
    the woods, select a tall forked cottonwood, fell it, trim it, bark it, tie lariats
    to it, and drag it to the village with horses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the procession dragging the log, the man most distinguished in battle leads
    on the horse associated with his bravest deeds, and others follow according to
    military distinction.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: As the log is dragged along, participants fire guns at it, strike it with
    sticks, shout, and sing victory songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The log is said to be symbolical of a conquered enemy whose body is being
    brought into camp in triumph.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the log is set up, green willows are gathered and a temporary medicine
    lodge is built around the log.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Participants fast four days with food in sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the fourth day, participants submit to tortures that vary according to
    the sufferer’s whim or the advice of shamans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Described tortures include strips of skin separated but not completely detached,
    pieces of skin entirely removed, incisions with raw-hide strings inserted, buffalo
    skulls attached to strings, and skewers inserted in the breasts and tied to the
    central pole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A cited account of the Minnetaree medicine dance says devotees dance and sing
    for three or four days in view of food without tasting it, while still inviting
    a stranger to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the cited Minnetaree account, penitents ask an operator or magi to cut
    skin from their bodies in various forms, including bands, full-moon shapes, crescents,
    concentric arcs, and small pieces from indicated body parts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: One described penitent has cords passed through holes in the shoulder skin,
    attaches the cords to a bison skull at a burial ground, and drags the skull to
    and around the lodge without assistance or touching the cords or skull with the
    hands.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Some penitents have arrows thrust through muscular parts of the arms, legs,
    breast, and back.
  category: action
  evidence_refs:
  - ev:9
