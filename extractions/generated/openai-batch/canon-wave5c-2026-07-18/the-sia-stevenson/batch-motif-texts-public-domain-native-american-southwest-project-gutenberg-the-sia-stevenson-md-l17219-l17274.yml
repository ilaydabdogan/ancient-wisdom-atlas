canonical_text:
  quote: ''
  summary: 'A fragment closes a marten story: a man overhears a marten speaking with
    his wife, scalds it with hot water, and the marten retreats to dense forests.
    The next tale tells of an Indian hunter who follows a speaking beaver into the
    water after she asks him to take her as wife. He leaves his clothing on the bank,
    reaches her house without feeling the water, and eats food he does not recognize
    as willow bark. His brother later finds the abandoned clothing, dreams that the
    missing man is living with a beaver, prepares new clothing and snowshoes, searches
    alone, and begins damming the stream to lower the water around the beaver house.
    By then the beaver wife has borne two children, and their father warns them that
    their uncle is coming and will kill them.'
  language: English
  quote_policy: summarized
