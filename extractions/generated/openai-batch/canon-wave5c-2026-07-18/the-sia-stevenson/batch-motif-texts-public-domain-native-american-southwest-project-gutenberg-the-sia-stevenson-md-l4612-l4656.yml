canonical_text:
  quote: ''
  summary: A Knife Society ceremonial passage describes food offerings and prayers
    to directional ko'plshtaia beings, requests for health, crops, prosperity, and
    rain, prayers for protection, a feast, the war chief receiving medicine water
    and the society staff, patrol of the ceremonial chamber, and renewal of a meal
    line so songs may pass out of the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer addresses Ko'plshtaia and named animal beings assigned to North,
    West, South, East, Heavens, and Earth, offering food to each.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer states that after eating, the beings will be contented and pass
    over the straight road or line of meal to enter images of themselves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks the beings to bring food, good health, prosperity, animal
    health, large crops, and to ask the cloud people to water the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Upon returning to the ceremonial chamber, the ho'naaite stands before the
    altar and prays to Ma'asewe, CyuuyewC, and six warriors of the mountains of the
    cardinal points for protection from enemies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ho'naaite offers a prayer of thanksgiving at the end of the food line
    while holding eagle plumes in his left hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ho'naaite rolls his blanket into a cushion, sits west of the meal line,
    and smokes a cigarette.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food is brought in by wives of members, and all present gather for a feast,
    including minor members joining their elders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The war chief enters wrapped in a Navajo blanket and carrying bow and arrows,
    stands before the altar on the west side of the meal line, and prays.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The vice-ho'naaite gives the war chief a draft of medicine water and hands
    him the official staff, which he holds with his bow and arrows until the close
    of the ceremonial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The war chief leaves to patrol the town and prevent unprivileged persons from
    entering or approaching the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the meal, three boys remove bowls, and one boy sweeps the middle of
    the floor, destroying most of the meal line except two feet in front of the altar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The vice-ho'naaite renews the meal line while carrying two eagle feathers
    and the meal bowl in his left hand and sprinkling meal with his right hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The renewed line is described as serving for songs to pass straight over and
    out of the house, not for the beings of pai'atiimo and ko'plshtaia to pass to
    their images, since they had already come.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The men smoke, and the writer states that Sia boys were not observed smoking
    in these ceremonials or at any other time.
  category: action
  evidence_refs:
  - ev:9
