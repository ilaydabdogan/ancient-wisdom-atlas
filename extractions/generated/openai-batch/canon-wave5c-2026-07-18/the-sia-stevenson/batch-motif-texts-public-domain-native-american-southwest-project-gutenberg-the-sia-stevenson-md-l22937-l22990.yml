canonical_text:
  quote: ''
  summary: The passage describes a Dakota war prophet or wakan man who ritually enrolls
    young male soldiers, supplies consecrated weapons, armor, and paints, and requires
    purification, fasting, service, prayers, vigils, vows, and taboos. A variant account
    describes a youth obtaining consecrated armor after three days of fasting and
    steam baths and receiving an animal taboo attached to the armor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The war prophet, described as a wakan man, is said to be necessary because
    every male Dakota aged sixteen and upward is a soldier and is formally and mysteriously
    enlisted into his service.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war prophet supplies implements of war and paints; the implements are
    described as modeled from the gods' armory, painted by divine prescription, and
    charged with the divinities' virtue or power.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The applicant must serve and abase himself while undergoing vapor baths, fasting,
    chants, prayers, and nightly vigils to gain favorable notice from the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a spear and tomahawk are prepared and consecrated, the recipient approaches
    the wakan man, presents a pipe, and asks for pity and the ability to perform manly
    deeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prophet gives the weapons and tells the recipient not to forget his vows
    to the gods when he returns in triumph as a man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The weapons are preserved carefully, wrapped in cloth with sacred pigments,
    and placed outside the lodge in fair weather.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The weapons and sacred pigments must not be touched by an adult female.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Lynd's account, a youth purifies himself for three days by fasting and
    the inipi or steam bath, then goes tearfully to a wakan man to ask for consecrated
    armor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the same account, the youth must continue fasting and purification until
    the armor is presented.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The account says only the spear of the armor is used in battle, though the
    armor is always carried with the owner on a war party.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the armor is presented, the old man tells the youth the animal to which
    it is dedicated and commands him to hold that animal wakan and never harm or kill
    it, even under threat of starvation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The animal taboo is said to remain until gradually removed by slaying numerous
    enemies, though some retain it for life.
  category: sequence
  evidence_refs:
  - ev:7
