canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions surrounding a Sia childbirth:
    sand, sheepskins, water vessels, a prepared bed, the expectant woman’s silent
    suffering, ritual and physical assistance by a doctress, father, mother, and sister-in-law,
    a prayer blown through an ear of corn to hasten birth, and notes on customary
    attendance and maternal concentration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cloth containing sand was emptied on the floor, and the sand was flattened
    by hand into a circular mound about 20 inches in diameter and about 5 inches deep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small black sheepskin was laid on the sand circle, and additional bedding
    was arranged at the south end of the room with a wool mattress, blanket, black
    sheepskin, pillow, and folded Navajo blanket.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Water-related items were placed around the room: a bowl of water on coals,
    a vase of water with a gourd beside the fireplace, a urinal beyond the room center,
    and a vase of fresh water beyond it.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The expectant woman alternated between sitting and walking while in visible
    pain, but no complaint was heard from her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The event was described as solemn and as a sacred hour in which S^s'slstinnako
    was to bestow new life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: At about 11 o'clock, the laboring woman stood before the fireplace while the
    doctress stood behind her and manipulated her abdomen with her hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father, identified as the ho'naaite who was no longer acting professionally,
    sat near the sand bed while the woman knelt on it with her back to the fireplace.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman clasped her father around the neck while the doctress sat behind
    her, supported her, and pressed on her abdomen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The father held a stone cougar fetish in the palm of his right hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sister-in-law placed an ear of corn on the top of the laboring woman's
    head and blew on it during pains in order to hasten the birth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prayer blown into the woman's head was said to pass directly through the
    passageway of life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After each paroxysm, the woman rose and moved about calmly, sometimes sitting,
    warming her bare feet at the fire, or walking outside.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A note says the ho'naaite usually leaves after the religious services, and
    that his remaining on this occasion showed unusual devotion.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note says the expectant mother must keep her thoughts on the coming event,
    or the child would not care to be born and would lie still and die.
  category: other
  evidence_refs:
  - ev:6
- id: obs:15
  text: The pains continued frequently for about three hours; the woman produced only
