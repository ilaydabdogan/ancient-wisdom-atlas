canonical_text:
  quote: ''
  summary: An ethnographic note describes prayer to Wakanda as reserved for important
    undertakings such as war or travel. A traveler goes alone to a bluff to ask Wakanda
    for protection and success. A Ponka man prays on a hill during food shortage.
    Omaha prayer places are identified as rocks, high bluffs, and mountains; these
    places may be called Grandfather, though an informant says the visible object
    is not itself the object of prayer. Practitioners smoke toward the invoked object
    and place gifts on it. The passage compares a Dakota custom of invoking a prairie
    boulder as Grandfather. It also reports that, at a first warpath and name change,
    an old man tells the news to various Wakandas, including natural features and
    beings.
  language: English
  quote_policy: summarized
