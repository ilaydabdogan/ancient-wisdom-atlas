canonical_text:
  quote: ''
  summary: 'The passage describes post-childbirth rites and care: an infant is named,
    washed with yucca suds and water, rubbed with ashes, given drops of warm water,
    strapped to a cradle, and nursed. A basket of meal is blessed through blowing
    and prayer and given to the doctress as compensation. The passage also describes
    infant bathing schedules, ash use, umbilical-cord treatment with pigment and possible
    breast milk, postpartum restrictions for the mother, and family support.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An infant is placed in the writer's arms with a statement that the child is
    named; after being returned, the infant's head is washed in yucca suds, its body
    is bathed with water sprayed from the mouth, it is rubbed with ashes, given warm
    water drops, strapped to a cradle, placed on the mother's lap, and nourished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandfather brings an Apache basket containing a pyramid of meal, holds
    it to the infant's face and then to the mother's; the mother and grandmother blow
    upon the meal, and the grandfather and doctress hold the basket while prayers
    are offered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The doctress leaves with the basket of meal, described as a gift from the
    infant and her only compensation for her services.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note states that the doctress names all infants; one name usually serves
    a female through life, while a male may receive multiple names after a long journey
    or valorous deed, with head washing in yucca suds accompanying the new name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The infant is bathed on the first four mornings by the doctress, then by the
    grandmother until the tenth morning, when the mother bathes the child; ashes are
    applied after each bath.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the sixth day the umbilical-cord remnant is removed by lifting raw cotton;
    bluish-gray powdered pigment is rubbed on the umbilicus and covered with cotton
    cloth; if suppuration appears, the mother applies breast milk and fresh pigment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pigment is analyzed as containing water-soluble sulphates and mainly a
    mixture including hydrous carbonate of copper, presumably malachite, with ferruginous
    sand.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother is considered an invalid and exempt from household duties until
    the tenth morning, though after the fourth morning she goes in and out of the
    house and sews.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The woman's father, mother, and husband show attention to her and the infant;
    the two men perform menial services and frequently wait upon the infant.
  category: relationship
  evidence_refs:
  - ev:9
