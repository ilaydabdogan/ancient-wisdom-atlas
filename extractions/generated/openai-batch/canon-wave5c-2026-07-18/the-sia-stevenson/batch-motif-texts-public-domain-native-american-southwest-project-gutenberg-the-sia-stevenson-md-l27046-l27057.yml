canonical_text:
  quote: ''
  summary: 'The passage describes Hidatsa treatment of the dead: ordinary good dead
    are placed on scaffolds so the Lord of Life may see them, while those who quarrel
    and kill are buried in the earth with a buffalo head on the grave to prevent buffalo
    herds from avoiding the area. It also states that the Crows do not fear death
    but dread beings buried in the ground.'
