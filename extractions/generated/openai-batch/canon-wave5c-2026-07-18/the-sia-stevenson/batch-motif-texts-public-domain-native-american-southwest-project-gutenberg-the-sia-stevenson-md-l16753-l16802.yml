canonical_text:
  quote: ''
  summary: An opening note mentions the jay's fondness for fat. The main passage tells
    of a young man invited by a doe to live with deer at their hill home. He leaves
    some hunting gear behind, enters the deer community, is fed by the doe's father,
    and later escapes human snares by staying among the deer. Some deer are caught
    and killed for the human community, while the young man's father finally lets
    him remain with the deer.
  language: English
  quote_policy: summarized
