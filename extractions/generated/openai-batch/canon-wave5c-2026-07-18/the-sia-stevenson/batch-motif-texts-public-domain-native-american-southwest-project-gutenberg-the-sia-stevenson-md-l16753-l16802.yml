- id: obs:1
  text: An opening note states that the jay is especially fond of fat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man says he lives on deer and cannot live without a tent, fire,
    or water; the doe replies that the deer have fire, water, and meat, and says he
    will live forever and his father will receive enough deer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man consents to go with the doe; she points to a large hill as the
    deer home and tells him to leave his deerskin mantle, snowshoes, and arrows on
    the ground while keeping his bow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The doe identifies a large valley as the deer path; near the steep hillside
    the ground is covered with deer, some of whom are frightened by the young man.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The doe's father speaks to the frightened deer about pitying Indians who must
    hunt for their living.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The doe's father feeds the young man meat and fat and says deer will be given
    to the young man's father the next day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man's father finds his discarded mantle, snowshoes, and arrows,
    as well as tracks leading through the valley to the deer home under the hill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young man's father tells the other Indians that his son has gone to live
    with the deer, and proposes making snares to capture him because he cannot run
    as fast as deer.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The Indians set snare nooses among bushes on the deer path in the valley.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old buck sees the preparations in the valley, says the deer should give
    the old man some deer, and tells the young man to come with the herd.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man worries he will be left behind when the deer run, but the old
    buck tells him to remain among the deer so he will not be left behind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some deer are caught in the nooses and killed by the Indians, while the rest
    of the deer and the young man pass beyond the snares.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Indians do not capture the young man; they find his footprint and the
    mark of his bow among the tracks of the escaped deer.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The young man's father says to let him go if he thinks he can live with the
    deer, and the people return to their tents.
  category: speech
  evidence_refs:
  - ev:10
