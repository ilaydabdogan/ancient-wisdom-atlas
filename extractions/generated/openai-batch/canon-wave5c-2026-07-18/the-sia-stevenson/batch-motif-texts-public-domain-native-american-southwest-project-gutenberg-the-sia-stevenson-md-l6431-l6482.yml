canonical_text:
  quote: One of the most sacred and exclusive rites of the Sia is associated with
    childbirth.
  summary: 'The passage gives an ethnographic account of a Sia childbirth rite: the
    family waits and prepares objects for the child, the birth room contains specific
    items, and the woman selects an officiating ho''naaite, in this case her father,
    using shell mixture or sacred meal in a fourfold breath rite and as compensation.'
  language: English
  quote_policy: quoted
