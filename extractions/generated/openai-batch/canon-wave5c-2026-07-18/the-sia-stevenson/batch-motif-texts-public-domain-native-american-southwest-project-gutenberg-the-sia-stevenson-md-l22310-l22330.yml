  text: The heart of a slain enemy was sometimes dried, placed in a medicine bag,
    pulverized, and mixed with other medicines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before an Iowa war party started, the man assigned to carry the sacred bag
    hid it while others prepared sacred articles, described parenthetically as probably
    personal fetiches.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hunters often brought in deer; after eating deer, the warriors painted themselves
    as if expecting to see an enemy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One member measured a set number of steps in front, and each man took his
