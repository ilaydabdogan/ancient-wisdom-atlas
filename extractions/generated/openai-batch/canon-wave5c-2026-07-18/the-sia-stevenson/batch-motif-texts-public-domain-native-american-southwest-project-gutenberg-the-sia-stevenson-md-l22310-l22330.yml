  summary: The passage describes medicines and personal sacred objects as mysterious
    or sacred. It reports that a dried enemy heart could be kept in a medicine bag
    and mixed with other medicines, and describes an Iowa pre-war ritual involving
    a sacred bag, deer, painting, kneeling, uncovering grass and sticks, placing sacred
    objects, singing, asking for good luck, and avoiding vulgar speech.
  language: English
