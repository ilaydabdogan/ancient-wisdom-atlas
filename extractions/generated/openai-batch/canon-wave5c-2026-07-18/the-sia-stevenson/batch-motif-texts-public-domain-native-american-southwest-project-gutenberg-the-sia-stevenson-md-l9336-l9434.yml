canonical_text:
  quote: ''
  summary: The passage describes illness, housing conditions, shamanic treatment,
    and marriage customs among the people under discussion. It presents pulmonary
    disease and scurvy-like illness as prevalent; describes shamanic healing through
    imagination, will, and faith; and then describes marriage by force, family sanction
    or gifts, bride abduction after refusal, confinement or restraint, child betrothal,
    marital instability, and care of children born outside marriage by aged women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulmonary troubles are described as the principal diseases, attributed to
    crowded, poorly ventilated huts and decomposing animal food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Openings in the snow dwelling are said to be closed quickly to preserve heat,
    and a new snow hut is preferred over a deserted one if its doorway was not tightly
    closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that about half of the people die of pulmonary troubles
    and that other diseases include blood-devitalizing conditions such as scurvy,
    with sores on joints and extremities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relief for sickness is usually sought through a shaman or conjurer, who works
    on the imagination of the sick person; the will power of both patient and shaman
    is described as highly engaged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The magnitude of a disease is said to be generally measured by the patient’s
    worldly wealth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman is said to be married after puberty when a male with sufficient physical
    strength forces her to become his wife; some females are taken before puberty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Parental sanction for marriage may be obtained by favor or by gifts of skins,
    furs, and other valuables to the father and mother; the girl is sometimes asked
    for consent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When family obstacles are removed but the girl refuses, she may disappear
    for two or three nights with a sympathetic female friend before being abducted
    by her lover and kept away until subjected to his will.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: One reported girl was tied in a snow house for two weeks, later submitted,
    returned, and then left the husband within a few weeks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The same woman was later tied to a sled to make her accompany the man she
    chose as husband; old women pushed or persuaded her, while younger women obstructed
    the action.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Children may be mated at an early age, and two friends may arrange that their
    unborn children will be mated to cement their fellowship.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Monogamy is described as the general rule, but marital separation is frequent;
    rare pairs remain together for life.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Girls may bear children before being taken as wives, and such children are
    often cared for by an aged woman.
  category: relationship
  evidence_refs:
  - ev:12
