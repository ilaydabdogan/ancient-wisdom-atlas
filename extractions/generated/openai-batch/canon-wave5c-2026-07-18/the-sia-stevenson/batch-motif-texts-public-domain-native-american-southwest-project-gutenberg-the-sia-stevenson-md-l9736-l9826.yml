canonical_text:
  quote: ''
  summary: The passage recounts a legend of Tung ak, a father transformed into a destructive
    spirit after the deaths of his children, and describes how fasting, isolation,
    and an encounter with Tung ak are said to initiate a shaman or angekok. It then
    describes shamanic healing, payment, explanations for failure, penance and animal-blood
    appeasement, and reputations for weather and hunting knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father had a son and daughter whom he loved; both children became ill and
    died despite his care.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the children's deaths, the father became a vicious spirit who roamed
    the world intending to destroy people because his children had died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tung ak is said to visit people, obstruct their desires, provoke them into
    illness and death, and cause them to go live with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tung ak no longer recognizes his own children and imagines all persons he
    meets to be his children; famine, disease, and death are sent out to search for
    the lost children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: People discover that fasting and abstaining from contact with others can give
    a person supernatural powers and knowledge of Tung ak's secrets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The would-be shaman goes to a lonely place and abstains from food and water
    until he believes himself empowered to heal the sick and control destinies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the ordeal, Tung ak is believed to stand near; the initiate, fearing
    seizure if he fails, asks for life and power, and Tung ak gives the secret of
    preserving life or expelling death-causing evil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The newly initiated angekok returns to the people, recounts his ordeal, and
    is then considered ready for his mission.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shaman demands compensation for services and states that greater payment
    brings greater benefit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In healing, the shaman is blindfolded or covered, the patient lies on the
    ground, and the shaman enters frenzy, prostrates himself over the patient, and
    attempts to chase evil from its seat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The disease or evil is described as fleeing to different parts of the patient's
    body while the shaman pursues it and eventually declares control over it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If the patient recovers, the shaman's reputation grows; if the patient dies,
    the failure is attributed to interference beyond the shaman's control.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Interference may be attributed to an aurora, snow, a dog knocking something
    down, or a spirit using the dog as an instrument.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: A person may be punished or required to do penance; examples include wearing
    a dog harness to relieve a spell and cutting a living dog's tail so fresh blood
    can be cast on the ground to appease the harmful spirit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Conjurers are consulted for many undertakings to manage spirits and ensure
    success.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:16
  text: Some shamans gain reputations for weather knowledge, hunting charms, attracting
    deer or other game, and predicting deer movements from animal habits and weather.
  category: attribute
  evidence_refs:
  - ev:10
