canonical_text:
  quote: ''
  summary: 'The passage describes social and religious authority attributed to shamans
    and old women: shamans influence marital decisions and accuse wives or widows
    of causing illness through charms or through the jealousy of a dead husband’s
    spirit. It also describes a dream-interpretation case in which a woman hears unexplained
    knocking, is told it is her dead brother seeking food, and is instructed to provide
    tea and bread through a nurse who receives the dead brother’s name. The passage
    then states that everything has an attendant spirit, that animal spirits survive
    killing, and that a great spirit in the form of a huge white bear dwells in a
    cavern near Cape Chidley and controls the spirits and future supply of reindeer.'
  language: English
  quote_policy: summarized
