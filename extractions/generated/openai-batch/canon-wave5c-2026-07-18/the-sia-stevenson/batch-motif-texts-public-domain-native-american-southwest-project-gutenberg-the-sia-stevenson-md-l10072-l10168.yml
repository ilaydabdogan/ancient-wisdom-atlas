canonical_text:
  quote: ''
  summary: The passage describes an annual outdoor-life routine organized around spring
    ice breakup, family movement downriver and alongshore, seal and egg gathering,
    company whale driving, salmon-net attendance, reindeer hunting, winter quarters,
    trapping, trade, and dog-team labor connected to the river's seasonal opening.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The annual routine is introduced with the spring breaking of ice on the Koksoak
    River; the timing varies and is affected by Ungava Bay ice, winds, and upstream
    weather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eskimo are described as perceiving signs in the sky and predicting effects
    of preceding weather.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the season advances, each family gathers belongings and moves them downriver
    on sleds to the edge of the ice, storing tents, dogs, umiak, kaiak, and other
    property on shore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men hunt reindeer, ptarmigan, hares, other land game, waterfowl, and early
    seals near the beach and water edge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After river and bay ice clear enough, hunters put the umiak in the water and
    travel alongshore by stages; parties may divide and travel in different directions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men hunt seals in kaiaks while women and children search islets and coves
    for edible things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the nesting season, women and children examine places for bird nests
    and remove the contents of accessible nests; after the egg supply is exhausted,
    return is considered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Eskimo assist the company in driving white whales when whales have appeared
    far enough upriver; they are summoned, brought to the whaling station, and encamp
    while nets are set.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Natives spear white whales in the pound, drag them ashore, skin them, and
    help take oil and skins to the post.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same natives attend salmon nets during the salmon run, occupy a locality
    with relatives, and afterward go upriver to spear reindeer crossing the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Reindeer hunting lasts until the deer rut and the males lose back fat; as
    shore ice forms, hunters are urged to descend the river before floating ice damages
    the umiak.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The head of the family decides where winter will be spent and moves the party
    there; winter activities include rest, sled construction, snow-house construction,
    and setting traps.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ptarmigan are hunted for flesh and feathers, consumed as food or sold to the
    company; after brought deer meat is consumed, ptarmigan flesh supports the camp
    until sleds can transport fall meat.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Traps are visited and furs are exchanged with the company for flour, tea,
    sugar, molasses, biscuit, clothing, and ammunition; hunting excursions are also
    made for stray deer bands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Company employees cut wood for the next year's fuel, and Eskimo with dog teams
    are hired to haul it to the bank for rafting when the river opens.
  category: relationship
  evidence_refs:
  - ev:10
