canonical_text:
  quote: ''
  summary: The passage reports beliefs about auroras as spirit-held torches guiding
    newly dead souls across an abyss to a land of abundance, and as a means for communicating
    with the dead. It describes the sky as a hard dome over the earth, with world
    edges, frost crystals, cloud-bags of water governed by two old women, thunder
    as their voice, and lightning as their torch. It also describes wind as the breath
    of immense spirits dwelling at the corners of the earth. The latter part gives
    ethnographic and historical notes on the Nenenot or Naskopie, including naming,
    neighboring groups, migration traditions, conflict with Eskimo, and later relations
    after the arrival of white traders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auroras are believed to be torches held by spirits who wake the souls of those
    who have just died and lead them over an abyss at the edge of the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A narrow pathway crosses the abyss to a land described as bright, plentiful,
    free from disease and pain, and supplied with abundant food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Only the dead and the raven are said to be able to go to that place.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the spirits wish to communicate with people on earth, they whistle, and
    the earth people answer in whispers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Eskimo are said to call the aurora, converse with it, and send messages
    to the dead through these spirits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sky is supposed to be an immense hard dome over the earth, longer east
    to west than north to south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The edges of land and sea are bounded by high, precipitous sides that prevent
