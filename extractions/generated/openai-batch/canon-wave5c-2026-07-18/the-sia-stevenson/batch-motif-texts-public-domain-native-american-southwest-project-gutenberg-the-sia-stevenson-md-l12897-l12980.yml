    and heat is located.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sky dome is described as very cold and at times covered with frost crystals
    that fall to earth as snow or frost films.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Clouds are supposed to be large bags of water controlled by two old women;
    when water escapes from the seams, it falls as rain.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thunder is described as the voice of the two old women, and lightning as their
    torch.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: If a spark from the lightning torch falls on someone, that person dies and
    goes to the region above.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At each corner of the earth dwells an immense, invincible spirit whose breath
    produces wind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Some wind spirits breathe violent storms, while others breathe gentle zephyrs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Male wind spirits are placed at the north, northeast, northwest, and west,
    while female wind spirits dwell at the remaining points; each principal spirit
    has many less powerful attendants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Nenenot are described as locally called Naskopie, while their own name
    is said to mean true or ideal red men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage reports a tradition that the Nenenot came from a western country,
    fled warfare, reached the Height of Land, later conflicted with Eskimo, and eventually
    came into more peaceful relations after white traders arrived.
  category: sequence
  evidence_refs:
  - ev:8
