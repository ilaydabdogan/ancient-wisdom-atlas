canonical_text:
  quote: ''
  summary: 'The passage describes Hudson Bay Eskimo ivory carvings and evening storytelling,
    then summarizes several legends: the origin of the Innuit from a created man and
    a woman, the coming of Indians and white people through puppies set adrift by
    a great Tungak, the origin of animals and plants from wood chips or seaweed after
    waters recede, and the origin of sea mammals and the white bear from the severed
    fingers of an abandoned woman.'
  language: English, with OCR noise
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small ivory carvings are described as representations of waterfowl, a polar
    bear, tattooed women, and bags of oil; the passage says they are made as tests
    of skill and as toys for children, not as observed game pieces.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Koksoagmyut storytelling is described as occurring in huts during evening
    work, with old men and old women narrating and younger members listening until
    they fall asleep.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one origin story, a man is created from nothing, journeys in summer, finds
    a woman in another land, marries her, and all the people dwelling there descend
    from the pair.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the story of the coming of white people, the Eskimo are near starvation,
    and the greatest Tungaksoak prophesies the arrival of light-haired, white-skinned
    people in an immense umiak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tungaksoak places one puppy on a chip and another on an old sealskin boot
    and sets them adrift on the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The puppy on the chip returns with Indians; later, the other puppy, now a
    man, announces the arrival of people with many curious things in a vessel and
    then becomes a dog.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one account of the origin of living things, chips from a tree being cut
    continue moving as they fall; chips falling into water become water beings, and
    chips falling on land become land animals and food for humankind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In another account, water once covered the earth, then went away; seaweeds
    became trees, shrubs, bushes, and grass, with grass later placed in various locations
    by a walrus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A widowed woman living among strangers is thrown overboard from an umiak;
    when she grasps the boat, the others cut off her fingers, which fall into the
    water and become seals, walrus, whales, and white bears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The story assigns specific animals to fingers: the thumb becomes a walrus,
    the first finger a seal, and the middle finger a white bear; the walrus and seal
    flee humans, while the white bear is said to seek revenge on humans.'
  category: relationship
  evidence_refs:
  - ev:9
