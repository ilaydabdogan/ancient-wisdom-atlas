  summary: 'The passage reports several four-color traditions and name sets: an Osage
    Tsiou wactaije account of colored rocks and colored corn and pumpkins from four
    buffalo bulls; Winnebago Wolf people traditions of ancestral wolf colors; Winnebago
    Thunder-being subgens personal color names; and a later Winnebago informant''s
    color associations with directions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A tradition of the Tsiou wactaije gens of the Osage describes the finding
    of four kinds of rocks: black, blue or green, red, and white.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Osage account, four ears of corn and four pumpkins dropped to the ground
    from the left hind legs of four buffalo bulls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The corn and pumpkins are assigned colors by buffalo sequence: first red,
    second spotted, third cade or dark/distant-black, and fourth white.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Wolf people of the Winnebago are said to have traditional ancestral wolf
    colors of green, black, white, and gray, with blue proposed as a substitute for
    green in one related name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Personal names in the Thunder-being subgens of the Winnebago include Green
    Thunder-being, Black Thunder-being, White Thunder-being, and Yellow Thunder-being.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: James Alexander, identified as a member of the Wolf gens, said that the four
