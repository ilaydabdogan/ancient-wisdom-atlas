canonical_text:
  quote: ''
  summary: The passage introduces winter fireside storytelling for instruction and
    entertainment, notes that the stories were collected directly and rendered into
    English, then gives a wolverene-and-birds story in which a wolverene is feathered,
    flies with birds, disobeys a brant's warning not to look down, falls, is mistaken
    for a brant or goose, and is finally found to be a dead wolverene. A second wolverene
    story begins with the animal inviting water birds ashore with the promise of a
    bees' nest and a dance during which they must keep their eyes shut. A footnote
    describes Indians using loud clamor to frighten brant into falling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During long winter nights or cold, inclement weather, Indians sit around the
    fire and tell stories for the instruction and entertainment of younger people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older men are said to have a large stock of stories, and many women are noted
    for entertaining children who listen in the arms of parents or elders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the following stories came directly to the narrator
    and were rendered into English as nearly as language differences allowed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first story, a wolverene calls all the birds together, calls them brothers,
    and offers to dress them in feathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After dressing the birds, the wolverene makes wings for himself and proposes
    that they fly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brant tells the wolverene not to look below while flying over a point
    of land when he hears noise below, and tells him to turn when the birds turn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wolverene does not look below on the first turn, but on the second turn
    he looks below after hearing shouting Indians and falls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Indians run up and say that a brant has fallen; an old Indian woman plucks
    the feathers and begins to disembowel the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old woman smells a bad stench, declares the goose rotten and unfit to
    eat, and gives the carcass to a child to throw away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Another old woman questions how a recently killed brant goose could be rotten
    and later finds only the dead wolverene.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the second story, a wolverene running along the seashore sees geese, brant,
    ducks, and loons sitting in the water and invites them ashore by saying he has
    found a pretty bees' nest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The birds go on land; the wolverene proposes a dance, says he will sing, and
    tells them to keep their eyes shut until the dancing is finished.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote states that Indians make a loud clamor when they perceive a flock
    of brant, frightening the birds so much that they lose their senses, fall to the
    ground, and are killed.
  category: other
  evidence_refs:
  - ev:10
