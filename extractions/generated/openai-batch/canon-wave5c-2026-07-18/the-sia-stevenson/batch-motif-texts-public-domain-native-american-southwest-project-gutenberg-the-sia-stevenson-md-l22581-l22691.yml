canonical_text:
  quote: ''
  summary: The passage describes paint colors used in worship; the Unktehi as powerful
    aquatic and subterranean deities with ox-like form, enormous horns and tails,
    dwellings in deep waters, waterfalls, earth, and a burial hill; accounts of offerings,
    sacrifices, creation of earth and humans, a child-abduction-and-recovery story
    involving white dog offerings and food eaten in the deity's realm, and the Unktehi's
    relation to mystery sacks, dances, feasts, pigments, and subordinate beings.
  language: English with Dakota and other Indigenous terms
  quote_policy: summarized
