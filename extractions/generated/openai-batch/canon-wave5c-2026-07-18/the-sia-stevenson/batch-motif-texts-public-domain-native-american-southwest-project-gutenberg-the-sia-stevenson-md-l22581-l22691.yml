comparison_claims:
- id: claim:1
  claim: The passage itself compares Dakota Unktehi/Teton terms with Winnebago water-monster
    gens terminology and the Omaha and Ponka Wakandagi, suggesting a nearby-corpus
    similarity in water-monster or water-deity categories.
  claim_level: same_function
  target: Winnebago water-monster gens and Omaha/Ponka Wakandagi
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief parenthetical comparison and does not
    establish historical contact, common inheritance, or exact equivalence.
- id: claim:2
  claim: The Iowa and Oto names translated as Water Person and Water Person Female
    are presented as possibly connected with water monsters or deities if not referring
    to beaver.
  claim_level: linguistic_similarity
  target: Iowa and Oto Water Person / Water Person Female names
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: uncertain
  limitations: The passage explicitly marks the connection as conditional and uncertain.
- id: claim:3
  claim: The passage cautiously associates Assiniboin offerings to water and land
    with offerings to the Unktehi, implying a similar recipient-function for water/land
    powers.
  claim_level: same_function
  target: Assiniboin offerings to water and land
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The passage says it is probable, not certain, and provides no detailed
    Assiniboin ritual narrative.
- id: claim:4
  claim: The passage compares Dakota cosmogony to a wider pattern in which earth begins
    from water and mud is brought up from a great depth to build dry land.
  claim_level: same_motif
  target: earth-from-water creation by mud raised from deep water
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made in generalized terms and without a detailed
    parallel text in the passage.
