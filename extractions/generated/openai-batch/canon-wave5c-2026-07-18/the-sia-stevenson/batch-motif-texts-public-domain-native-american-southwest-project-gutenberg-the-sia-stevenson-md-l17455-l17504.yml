canonical_text:
  quote: ''
  summary: Two Indian men on a winter hunting trip lack food and decide to seek their
    friends' camp. After one dreams of porcupines, porcupines appear at their tent
    and are killed for food. The men later accidentally discover and kill a bear,
    leave most of it behind, taste its fat at camp, return for the carcass, and find
    that wolves and foxes have eaten it. The passage ends as they become thirsty and
    stop at a creek to drink.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two Indian men living by themselves for the fall and winter hunt are unsuccessful
    in getting furs and food, and in intense winter cold resolve to seek their friends'
    camp with only bows and arrows.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: They travel all day without seeing a living thing, make camp, lament having
    no food, and prepare to sleep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: One man says he will dream of porcupines; in the morning he reports seeing
    many porcupines around the tent in his dream, and the men decide to stay there
    for the day and following night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the night porcupines gnaw the bark from the tent poles; one or more
    are killed, and the men cook and eat porcupine meat before continuing their journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: While traveling, the men shoot arrows in sport; an arrow appears to strike
    something moving in the snow, and digging reveals a bear den with black hair visible.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The men drive the bear out, kill it, and skin it; one man says it is too big
    and ugly to eat, while another cuts off a large piece of fat and places it on
    the sled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the next camp, the men make a large fire, hang the bear fat over it, smell
    the dripping oil, taste the fat, and decide that the bear flesh had been good
    to eat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The men return in darkness and cold for the bear carcass, but find that wolves
    and foxes have eaten all the meat and left only bones; they are angry and blame
    each other.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After resolving to proceed toward the place where they had camped the third
    time, the men become thirsty and stop at a creek to drink; the supplied passage
    ends mid-action.
  category: sequence
  evidence_refs:
  - ev:9
