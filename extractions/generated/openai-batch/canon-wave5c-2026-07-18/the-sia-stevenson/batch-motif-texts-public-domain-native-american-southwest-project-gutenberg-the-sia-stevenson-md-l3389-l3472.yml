canonical_text:
  quote: ''
  summary: A ritual sequence before an altar includes meal and pollen offerings, medicine-water
    sprinkling, ash purification, prayer, production of sudsy froth in a cloud bowl
    as symbolic clouds, distribution of suds toward directions, persons, altar objects,
    and the zenith while calling cloud people to gather, followed by smoking and a
    succeeding altar-sprinkling dance by two women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants gathered before the altar, took meal from a meal bowl, sprinkled
    the altar, and returned to their seats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ya'ni-siwittanni lifted a shell of pollen, waved a rattle along a line
    of meal and out the door, and cast pollen from his fingers as an offering to the
    Snake ho'naaite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ho'naaite dipped plumes into medicine water and sprinkled the altar by
    striking the plumes with a rattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cloud-maker, identified as a member of the Spider Society, crossed the
    meal line, lifted a reed from the cloud bowl, held it with eagle plumes, and prayed
    while the vice ho'naaite sprinkled him with ashes for purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cloud-maker placed a root used for suds into the cloud bowl, sprinkled
    corn pollen on the water, and stirred the water with a reed until white froth
    rose above the bowl and fell to the floor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the root-produced suds were symbolic of clouds and
    that a meal circle beneath the bowl was symbolic of the heart or life of the water.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The cloud-maker danced and repeatedly threw suds toward named directions,
    the fireplace, the earth, the zenith, the altar, women, ritual officers, and other
    recipients while invoking the cloud people to gather.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Other participants dipped plumes or a wand into medicine water and sprinkled
    the altar or members while petitioning or crying for the cloud people to gather.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The cloud-maker placed suds on the heads of the white bear and parrot, then
    stirred the suds briskly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ti'amoni lit a cigarette at the fireplace and handed it to the cloud-maker,
    who blew the first whiffs over the suds, smoked briefly, and laid part of the
    cigarette beside the cloud bowl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At the next song, two women at the east end of the south line danced before
    the altar and sprinkled it with wands; one was often kept from participating by
    care for her infant.
  category: sequence
  evidence_refs:
  - ev:9
