candidate_motifs:
- id: motif:1
  label: Ritual legitimation of rulership through ancestral staff
  taxonomy_refs:
  - royal_legitimacy
  basis: The ti'amoni receives an office staff said to derive from Mother C'tset and
    the first ruler, and the ceremony prays for C'tset's thoughts and heart to pass
    from the staff to the new ruler.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is ethnographic description rather than a full mythic narrative;
    the staff's identity is reported as supposed.
- id: motif:2
  label: Initiation into sacred office by communal ritual actions
  taxonomy_refs:
  - initiation
  basis: The incoming ti'amoni passes through an installation involving assembled
    officials, formal declaration, staff presentation, embrace, meal-sprinkling, and
    sacred-breath drawing by multiple groups.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes installation into office, not a life-cycle initiation.
- id: motif:3
  label: Transfer of ancestral thoughts and heart through a sacred object
  taxonomy_refs:
  - wisdom
  basis: The war priest prays that C'tset's thoughts and heart be conveyed from the
    staff to the newly chosen ruler, and the text states that C'tset gave her thoughts
    and heart with the cane to the first ti'amoni.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the passage does not explain the
    content of the thoughts or heart.
- id: motif:4
  label: Reciprocal support between sacred ruler and community
  taxonomy_refs:
  - sacred_exchange
  basis: The ruler is told he will not work and that the theurgists and children will
    labor for him; the community later collects wood, while custom expects the ti'amoni
    to be absorbed in religion and the people's interests.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text states duties and support but does not formulate a formal exchange
    doctrine.
- id: motif:5
  label: Restricted sight of sacred anthropomorphic beings
  taxonomy_refs: []
  basis: During the Ka'-ss-na dance, guards surround the village and the passage says
    a Mexican especially must not look upon one of the anthropomorphic beings.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: No consequences for forbidden viewing are described in this passage.
- id: motif:6
  label: Witchcraft punishment and social aftermath for a child
  taxonomy_refs: []
  basis: The war priest tries and punishes witches; a couple is said to have died
    for witchcraft, and their child is later described as pauperized and socially
    marginalized while belonging to a cult society.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is primarily an ethnographic social account; mythic or symbolic framing
    is not elaborated in the passage.
- id: motif:7
  label: Plant and animal clan naming
  taxonomy_refs: []
  basis: Existing clans are listed with plant and animal names including Corn, Tobacco,
    Coyote, Squash, Bear, and Eagle.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage lists clan names but does not explain clan origin myths or
    symbolic functions.
