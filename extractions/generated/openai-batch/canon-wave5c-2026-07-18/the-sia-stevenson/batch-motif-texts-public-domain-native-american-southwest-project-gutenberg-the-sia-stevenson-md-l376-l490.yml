canonical_text:
  quote: ''
  summary: 'The passage describes Sia offices and ritual authority: installation of
    a ti''amoni with a crooked staff/cane attributed to Mother C''tset and the first
    ruler; communal actions of embracing, meal-sprinkling, sacred breath-drawing,
    and wood collection; expectations and criticism of the present young ti''amoni;
    selection and duties of civil and military officers; restriction around Ka''-ss-na
    dances; punishment of witches; the condition of a pauper child; and a list of
    existing clans.'
  language: English, with OCR artifacts in the supplied text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The present ti'amoni entered office after his predecessor and the previous
    vicar, both aged, died around the same time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a new vicar or younger brother is selected, the vicar to the war priest
    calls on the incoming ruler and accompanies him to the appointee's house and then
    to the ancestral official chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The war priest, theurgists of several cult societies, and their vicars assemble
    in the ti'amoni's ancestral official chamber for the installation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The war priest declares the incoming man to be priest and to be father and
    mother to the people, and says he is no longer to work in fields or bring wood
    because the theurgists and other children will labor for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war priest gives the ti'amoni a slender staff or cane, crooked at the
    end, as the ensign of office; the passage says it is supposed to be the same staff
    presented by Mother C'tset to the first ruler and says the crook is symbolic of
    longevity.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ti'amoni draws sacred breath from the crook or cane; the war priest embraces
    him, sprinkles the cane with meal, prays that C'tset's thoughts and heart be conveyed
    from the staff to the new ruler, and also draws sacred breath from it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The theurgists, then civil authorities, then the populace including women
    and children embrace the ti'amoni, sprinkle meal on the staff, and draw sacred
    breath from it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the following day, all members of the pueblo, including children, collect
    wood for the ti'amoni and place it beside his dwelling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the Sia are chagrined that the present young ti'amoni hunts,
    works in fields, and joins pleasure rides, and it states that this conduct is
    not tribal custom.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The stated custom is that the ti'amoni may supervise herds and fields but
    should be absorbed in religion and the people's interests, and should not leave
    the village except for pilgrimages to shrines or other sacred destinations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Theurgists hold office for life; each vicar succeeds to the function of his
    theurgist, and the theurgist appoints a new vicar with the ti'amoni's approval.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: For annual civil and subordinate military appointments, the ti'amoni, his
    vicar, the war priest, and the war priest's vicar meet in December, decide names,
    and inform the theurgists, whose concurrence is requested and ordinarily given.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The war chief patrols the town during cult society meetings and surrounds
    the village with mounted guardsmen during a Ka'-ss-na dance; the passage says
    a Mexican especially must not look upon one of these anthropomorphic beings.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The governor sees that civil laws are executed and announces duties for the
    coming day by crying commands in the plaza at sunset; the magistrate handles minor
    cases.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Wizards and witches are tried and punished by the war priest; the passage
    says a man and his wife had recently suffered death for practicing this craft.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The executed couple's child is described as a boy of about twelve who begs
    or is taken into families, is held in contempt by elders, is favored by children,
    is seldom allowed childish play, and belongs to the knife cult society.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: The clans listed as then existing among the people include Corn, Tobacco,
    Coyote, Squash, Bear, and Eagle.
  category: relationship
  evidence_refs:
  - ev:12
