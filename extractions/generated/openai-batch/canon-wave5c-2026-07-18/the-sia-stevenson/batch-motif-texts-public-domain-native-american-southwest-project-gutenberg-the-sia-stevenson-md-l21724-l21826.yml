  evidence_refs:
  - ev:5
  confidence: high
  cautions: The author identifies the event as a trick or juggling performance.
- id: motif:7
  label: Stone enters mouth and becomes smaller stones
  taxonomy_refs: []
  basis: A large stone appears to hit Bent Horn in the mouth and later several small
