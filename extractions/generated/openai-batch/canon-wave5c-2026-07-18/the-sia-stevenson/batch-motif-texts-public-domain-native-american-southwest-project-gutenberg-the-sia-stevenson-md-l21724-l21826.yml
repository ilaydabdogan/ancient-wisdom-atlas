candidate_motifs:
- id: motif:1
  label: Love potion producing involuntary courtship
  taxonomy_refs: []
  basis: The passage describes a compound love potion that makes a man court a woman
    despite knowing he does not love her.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents an ethnographic claim, not a narrated mythic episode.
- id: motif:2
  label: Sorcerer feared as death-causer
  taxonomy_refs: []
  basis: Sorcerers are said to be thought capable of causing the death of those who
    incurred their displeasure.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The mechanism of causing death is not described.
- id: motif:3
  label: Extraction of disease-causing objects
  taxonomy_refs: []
  basis: Doctors are said to pretend to draw sticks or worms from bodies or teeth
    as causes of disease and pain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The author frames the act as pretense or sleight of hand.
- id: motif:4
  label: Manipulation of celestial body and lunar being
  taxonomy_refs: []
  basis: Whip is reported to make the sun blue and produce bloody hair from the man
    in the moon.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The episode is reported as a performance account; no wider cosmological
    explanation is supplied.
- id: motif:5
  label: Magic obtaining food in scarcity
  taxonomy_refs: []
  basis: Buffalo Bull uses an earth mound and four arrows, after which a large deer
    is slain and the people have food.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explain the causal sequence beyond the reported magic
    act.
- id: motif:6
  label: Apparent wounding followed by object expulsion
  taxonomy_refs: []
  basis: Cramped Hand appears shot and later coughs up a bullet into a basin before
