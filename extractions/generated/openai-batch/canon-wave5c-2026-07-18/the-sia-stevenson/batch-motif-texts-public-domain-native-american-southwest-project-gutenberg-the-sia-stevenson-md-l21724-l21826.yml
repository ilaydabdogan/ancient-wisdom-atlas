canonical_text:
  quote: ''
  summary: The passage reports sorcery, love potions, sleight-of-hand, and shamanic
    or magical performances among Omaha, Ponka, and Kansa individuals. It describes
    love-potion ingredients, apparent extraction of disease objects, celestial and
    hunting magic claims, public bullet and stone performances, mouth-projected pebbles,
    swallowed objects, animal and medicine fetishes, water-spurting healing, and a
    bear-skin bag used to draw out a projectile pebble.
  language: English
  quote_policy: summarized
