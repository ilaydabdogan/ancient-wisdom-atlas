    provided.
- id: claim:2
  claim: The author explicitly interprets the Ponka bullet and stone performances
    as adopting tricks associated with white performers.
  claim_level: same_function
  target: Tricks of the 'white brother' as named by the author
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is the author's statement; the passage does not describe
    the external repertoire in detail.
