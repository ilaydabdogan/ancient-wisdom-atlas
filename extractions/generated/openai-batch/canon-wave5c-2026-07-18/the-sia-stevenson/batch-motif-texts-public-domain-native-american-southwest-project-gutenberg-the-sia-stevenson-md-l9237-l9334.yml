canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of disease, shamanic treatment,
    social exclusion, murder vengeance, tabooed haunted locality, abandonment of aged
    persons, suicide, death by confinement in a snow hut, famine cannibalism, and
    expulsion of disliked women among groups named in the passage as Eskimo, Innuit,
    and Koksoagmyut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulmonary troubles and scurvy-like diseases are described as prevalent, with
    pulmonary illness attributed to crowded, poorly ventilated huts and decomposing
    animal food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Relief for sickness is usually sought through a shaman or conjurer who works
    on the imagination, will, and faith of the sick person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The magnitude of disease is said to be measured by the amount of the patient's
    worldly wealth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person considered intolerably bad may be excluded from huts, food, and intercourse
    with others; a murderer may be surprised and put to death, usually by stoning,
    with community approval.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a premeditated murder, the next of kin is said to have a duty to avenge
    the deed, sometimes after years of waiting for an opportunity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Akpatok is described as tabooed after the murder of part of a wrecked vessel's
    crew, and people avoid it lest the victims' ghosts appear and ask relief requiring
    proper offerings.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aged people without relatives may be neglected or left behind during camp
    movement; the corpse may later be found with stones piled around it and bound
    with thongs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Fort Chimo, people proposed to strangle an old woman with one sore eye,
    but postponed when the eye improved.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Suicide is described as occurring by cliff-jumping, strangulation, or gun,
    with remorse and disappointed love named as causes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: During scarcity, a husband found his wife secretly eating stored fish, blocked
    the snow-hut entrance, and she remained inside until she died of starvation, fearing
    death if she exited.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In great scarcity, some families are reported to have resorted to cannibalism
    after eating dogs, clothing, and other skin-made articles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Unlucky or disliked women may be driven from camp and must travel until they
    find relief or perish.
  category: action
  evidence_refs:
  - ev:10
