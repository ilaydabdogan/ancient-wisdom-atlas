canonical_text:
  quote: ''
  summary: The passage describes Assinniboin death and burial practices centered on
    a ghost lodge, a ghost pack or sack containing hair of the deceased, a specially
    marked ghost horse, gift and food distributions, gendered mourning assemblies,
    memorial display of a warrior's deeds, offerings to ghosts, prayers for benefit,
    and punishments by ghosts when offerings are not set aside first.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred objects connected with the deceased are packed and carried on a horse
    reserved for that purpose and called the ghost's horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ghost's horse has its mane, tail, and body hair cut short, is rubbed with
    yellow clay and paint, receives a feather at the tail, and bears ornamented saddle
    gear.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The horse must keep its hair short while the ghost remains unburied, and its
    hair may grow again after the hair is removed from the pack and buried.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When camp is made, the ghost lodge is set up before the other lodges; articles
    remain there for an allotted period until a ghost feast, when the ghost pack is
    opened and the ghost or hair is buried.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the ghost feast, people assemble near the ghost lodge, kindred weep and
    bring boiled food, and goods such as moccasins, blankets, robes, bags, quills,
    turnips, and fruits are displayed and distributed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the deceased was a male member of an order of young men, members of the
    order are invited to a feast where they sing; the dead youth's parents enter weeping
    and place both hands on each guest's head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the deceased was female, women assemble, except for some men who lead the
    singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the bag is opened and the hair or ghost is taken out and buried, the
    parting from the parents is considered absolute.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Until the hair is buried, the deceased is thought to be really present with
    the household; at the burial the deceased is said to die a second time.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In another account of the ghost feast, the sack containing the hair is reddened,
    and a war bonnet, war spear, and shield are displayed near three poles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Marks on a warrior's shield record expeditions, wounded enemies, killed foes,
    a night shout, hand-to-hand struggle, stolen horses, and sometimes the warrior's
    name.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Only kindred enter the lodge when the hair is taken from the sack; they scream
    briefly when they see it, and gifts and food are distributed at that time.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A woman responsible for collecting offerings turns to each of the four scaffold
    posts and speaks prayers asking that ghosts eat the offering and that she receive
    long life, horses, or presents.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The best portion of the food is placed in a bowl or dish under the scaffold
    near the head of the corpse.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Anyone who eats before food is set aside for the ghost is said to anger all
    the ghosts, who punish him by making food drop, water spill, or causing him to
    cut himself with a knife.
  category: sequence
  evidence_refs:
  - ev:10
