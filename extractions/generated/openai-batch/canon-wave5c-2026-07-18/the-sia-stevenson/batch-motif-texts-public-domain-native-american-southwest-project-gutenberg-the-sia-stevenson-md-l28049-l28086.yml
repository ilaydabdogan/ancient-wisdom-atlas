  quote: ''
  summary: A section on Water Powers compares named beings among Dakota, Omaha/Ponka,
    and Winnebago traditions; describes attributes such as seven heads, a Loon servant,
    stream and underground habitats, support of hills, and relation to bogs and invoked
    streams; recounts buffalo-origin traditions including a buffalo ghost rising from
    a spring; and lists water-associated gentes or social groups among several Siouan
    peoples.
  language: English
