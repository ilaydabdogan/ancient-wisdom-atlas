canonical_text:
  quote: ''
  summary: The passage describes Omaha, Ponka, and Kansa beliefs about subterranean,
    aquatic, and forest-dwelling supernatural beings, including Wakandagi, Mialucka,
    Indafiuga, Two Faces, and Ictinike, and notes several comparisons among these
    beings and nearby Dakota figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha and Ponka are said to believe in Wakandagi, monsters dwelling beneath
    bluffs and in the Missouri River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wakandagi are described as having very long bodies and horns on their
    heads.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: One myth relates that an orphan killed a Wakandagi with seven heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An Omaha tradition says a Wakandagi was seen in the lake into which Blackbird
    Creek empties near the Omaha agency.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kansa Mialucka are described as dreadful beings with large heads and long
    hair; some dwelt underground or in the water near a stream bank.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Mialucka were supposed to entice an unwary Indian traveling alone to remote
    places, after which the victim became crazy and lived as a miquga or catamite.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ancient Mialucka took wet clay and made a buffalo calf and three buffalo
    bulls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ancient Mialucka taught the Indians how to make and use bows and arrows,
    and ordered them to shoot the buffalo he had made.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Indafiuga is described as a superhuman being dwelling in forests, hooting
    like an owl, and powerful enough to uproot a tree or overturn a lodge.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ponka mothers used the Indafiuga in warnings to children, saying that it would
    catch them if they did not behave.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Joseph La Fleche had heard the Indafiuga described as a monster in human shape
    covered with thick hair; the passage also connects the term with wearing a mask
    or acting the Indafiuga.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Omaha mothers used the names Icibaji and j^ext^ja, described as heroes of
    particular gentes, to scare children with threats of being caught.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Inde-na°ba, or Two Faces, is described as a fearful being whose sight killed
    a woman who was enceinte.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ictinike is described as the deceiver and as a worker of evil, and the passage
    compares or relates him to Dakota figures including Ikto, Iktomi, Uijktomi, and
    Antlggite or Two Faces.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
