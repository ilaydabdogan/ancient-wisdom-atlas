  quote: ''
  summary: The passage describes Omaha mystery decorations on tents and a blanket,
    including designs said to derive from visions. It reports vision-linked rights
    to use designs, inheritance or imitation by sons, specific painted motifs such
    as cedar tree, sun, rainbow, horse-tails, and cornstalks, and a corn-related fear
    involving small birds.
  language: English with Omaha terms
