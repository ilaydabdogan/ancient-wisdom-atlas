canonical_text:
  quote: ''
  summary: The passage describes Tunkan/Inyan as an oracle stone with a reported miraculous
    movement, then gives a Teton/Lakota account of mysterious small stones or pebbles
    regarded as helpers, messengers, and revealers of theft. The stones are described
    in two types, one white and ice- or glass-like and one ordinary-looking. People
    appeal to the stones through a mystery feast when property is missing; the stones
    help, bring messages, reveal horse thieves, and are decorated, wrapped, and kept
    with medicine. The passage also notes a comparison to Omaha translucent pebbles
    and a speculative statement about Assiniboin worship.
  language: English
  quote_policy: summarized
