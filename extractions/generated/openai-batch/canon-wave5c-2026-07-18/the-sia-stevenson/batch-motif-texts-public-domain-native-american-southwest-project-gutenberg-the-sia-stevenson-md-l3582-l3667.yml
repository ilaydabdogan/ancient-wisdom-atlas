canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Sia Snake Society ceremonial: distribution
    and deposition of offerings, prayers for rain and abundance, altar actions involving
    ya''ya, a sand-painted cougar, pollen, sacred breath, and purification, use of
    remaining sand for children, directional sunrise offerings for Sus''sistinnako/the
    Cremator, and an account of initiation into the third degree after dreams of many
    snakes. It states that snake ceremonials are for initiation into the third degree
    and are observed after the ripening of corn.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite gives bundles of ha'chamoni and plume offerings to the ti'amoni
    and a companion, who receive them in a blanket over the left arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men take pinches of shell mixture out of the chamber to deposit
    at shrines, with prayers to Snake ho'naaites requesting that cloud-rulers send
    their people to water the earth and bring abundance of food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the offering bearers leave, the ho'naaite plays a musical flute; on their
    return he receives them before the altar, followed by prayers from the ho'naaite
    and ti'amoni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A boy makes two cigarettes and gives them to the ti'amoni and the companion
    before a feast of bread, stewed meat, and coffee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ho'naaite takes a ya'ya from the tail of the sand-painted cougar, presses
    his hand to the sand cougar, draws breath from it and from the ya'ya, clasps the
    ya'ya to his breast, and substitutes it for the center of three ya'ya behind the
    altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ho'naaite moves two large cougar fetiches to the back of the altar; the
    vicar prays, touches the four cardinal points of the sand painting with pollen,
    draws sacred breath from the sand-painted cougar, and rubs his body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Members press their hands to the sand painting, draw breath, and rub their
    bodies; the passage explicitly describes this as mental and physical purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ti'amoni sits behind the altar holding eagle plumes with both hands before
    his face and silently praying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman brushes remaining sand together from four points with an eagle plume,
    lifts it into her left hand, carries it home, and rubs it over the bodies of her
    male children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ya'ya are collected by their owners, who blow meal from the feathers and
    enclose them in three wrappings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Four turkey-plume wands in clay holders conceal ha'chamoni for Sus'sistinnako/the
    Cremator; they are deposited at sunrise by designated Spider Society members to
    the north, west, south, and east of the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that ha'chamoni convey messages to those to whom they are
    offered.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the initiation account, the narrator says he was ill with smallpox caused
    by angry ants, dreamed of many snakes, and believed he would die unless he asked
    the Snake Society ho'naaite to receive him as a member.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The would-be initiate brings shell mixture as an offering, reports the snake
    dream, and asks to become a member of the Snake Society.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The narrator reports spending two years learning songs, passing through first
    and second degrees, and then going with the ho'naaite and society members to the
    house of the snakes, where he is made a member of the third degree.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that ceremonials introducing snakes are exclusively for
    initiation into the third degree of the Snake division and must be observed after
    the ripening of corn.
  category: sequence
  evidence_refs:
  - ev:10
