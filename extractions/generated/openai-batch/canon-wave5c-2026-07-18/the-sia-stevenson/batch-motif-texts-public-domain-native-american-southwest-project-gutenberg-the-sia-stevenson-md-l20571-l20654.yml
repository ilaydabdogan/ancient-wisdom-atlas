canonical_text:
  quote: ''
  summary: The passage describes Omaha rules and examples for personal mystery decorations
    on robes, blankets, and tents. Vision-derived designs authorize use; unauthorized
    use or failure to hold a required feast may bring anger, misfortune, or danger
    from lightning. Named examples include tent and robe decorations derived from
    visions or personal mysteries, including bear-cave and lightning imagery, aurora
    borealis stripes, stars and the new moon, and generic blackened tent markings
    associated with visions of night, the Thunder-being, or other superterrestrial
    objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man made eligible by his vision for membership in the order of Thunder shamans
    had to invite order members to a feast before wearing the decorated robe, or he
    incurred their anger and expected misfortune.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who wore a decorated robe without having had a vision of the relevant
    mystery object was said to be in danger of being killed by lightning if the object
    was connected with the Thunder-being.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that every Omaha feared decorating a robe, tent, or blanket
    with an object seen by another person in a dream or vision.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: George Miller is given as an example of someone who would not put bear claws
    or horse hoofs on his robe because neither he nor his father had seen a bear or
    horse mysteriously.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dried Buffalo Skull supplied a sketch of a decorated tent; the tent decoration
    was described as the personal mystery of Hupefa Sr., and after Hupefa Sr.'s death
    the decoration became the property of his kinsman Agaha-wocuce.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The described tent decoration included a top circle representing a bear's
    cave, four zigzag lines representing lightnings of different colors, bears' paw
    prints, and a lower part blackened with ashes or charcoal; red among the zigzags
    was said to symbolize the east.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wanukige had a vision of the aurora borealis and depicted it on his robes
    and tent as seven stripes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: George Miller's father could wear the personal mystery decoration of ^aqnbe,
    but could not transmit the right to anyone else.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: jahe-iapti had a vision of two stars and the new moon, decorated his buffalo
    robe accordingly, and joined the order of Thunder shamans.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: For generic decorations, a person who had a vision of the night, the Thunder-being,
    or another superterrestrial object blackened the upper part of his tent and a
    small portion on each side of the entrance.
  category: action
  evidence_refs:
  - ev:7
