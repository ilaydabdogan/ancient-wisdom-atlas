canonical_text:
  quote: ''
  summary: A being named tyt'set sends a small animal ahead with a sack of stars during
    emergence into a new world. The animal opens the sack, releasing most of the stars,
    is punished with blindness, and tyt'set arranges the remaining stars. Cloud, lightning,
    thunder, and rainbow peoples follow the Sia into the upper world and perform weather-related
    labor from springs, mountains, and trees, receiving offerings from people of Ha'arts.
    The Sia emerge through Shi-pa-po in the far north, settle, and tyt'set creates
    corn by planting pieces of her heart in fields at the four directions, declaring
    corn to be her heart and like milk from her breasts.
  language: English
  quote_policy: summarized
