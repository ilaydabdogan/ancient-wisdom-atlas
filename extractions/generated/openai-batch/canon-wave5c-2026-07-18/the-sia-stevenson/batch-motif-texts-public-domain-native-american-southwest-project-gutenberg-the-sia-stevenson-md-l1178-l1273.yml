candidate_motifs:
- id: motif:1
  label: Emergence into this world through an opening
  taxonomy_refs:
  - ascent
  basis: The Sia enter this world in the far north through an opening called Shi-pa-po
    after earlier movement into the upper world.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage calls the place an opening, not a cave; no additional geographic
    identification is supplied.
- id: motif:2
  label: Disobedient carrier releases stars
  taxonomy_refs: []
  basis: A small animal entrusted with a sack of stars opens it, causing stars to
    fly out into the heavens, after which remaining stars are arranged.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents disobedience but does not state that the animal intended
    theft or trickery.
- id: motif:3
  label: Animal trait explained by mythic punishment
  taxonomy_refs: []
  basis: The small animal is declared blind, and the passage states that this explains
    why the scarabaeus has no eyes.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The animal identification is affected by OCR and parenthetical naming
    in the passage.
- id: motif:4
  label: Sealed passage restraining waters below
  taxonomy_refs:
  - flood_and_renewal
  basis: After emergence, the door is closed with a great rock so the waters below
    cannot follow.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage mentions waters held back but does not narrate an actual flood
    event in this excerpt.
- id: motif:5
  label: Directional weather peoples inhabiting springs and mountains
  taxonomy_refs:
  - cosmic_mountain
  basis: Weather peoples live in springs at the cardinal points, zenith, and nadir,
    located in the hearts of mountains with trees on their summits.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The mountains are multiple directional homes rather than a single explicitly
    named cosmic mountain.
- id: motif:6
  label: Tree as route between water source, mountain, and sky realm
  taxonomy_refs:
  - sacred_tree_axis
  basis: Water carriers ascend from springs to the base of a tree, pass through the
    trunk to its top, and reach Tinia.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes a functional ascent route, not a formal doctrinal
    axis mundi label.
- id: motif:7
  label: Personified weather labor
  taxonomy_refs:
  - seasonal_cycle
  basis: Cloud people water the earth, lightning people intensify rain with arrows,
    thunder people make noise, and rainbow people make bows.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
