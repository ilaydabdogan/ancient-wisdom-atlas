literal_observations:
- id: obs:1
  text: A newborn is not washed until six or eight hours have elapsed, is then placed
    to the breast, and rarely drinks water until old enough to help itself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A child may be named before birth; names are not distinguished by sex, multiple
    names may be acquired from trivial circumstances, and names may be discarded,
    substituted, or used only by certain people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Parents are described as deeply loving their offspring and as not using corporal
    punishment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children are described as learning to obey because they perceive their parents
    as protectors and sources of assistance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Orphan girls are taken as nurses for small children and are said to have little
    trouble controlling them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Young children at play are described as harmonious and sympathetic toward
    an injured child, offering the injured child a larger share of the game.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Children play football and build toy houses in newly fallen snow; inside the
    toy hut, a doll made of ivory, wood, or rags acts as a hostess whom they pretend
    to visit and converse with.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Boys and girls about ten or twelve show cheerful rivalry in proving their
    ability to secure food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Children who procure enough to buy ammunition to kill ptarmigan gain credit
    and may provide a desired luxury for their parents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Parents aid and encourage children to become successful hunters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Girls in the huts sew fragments of cloth into garments for dolls or try to
    patch their torn clothes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Older boys show contempt for younger children’s occupations, torment younger
    children until a parent stops them, play pranks, and display cunning in annoyances.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Older boys are able to accompany elders on hunting trips and run ahead of
    a dog team attached to a sled.
  category: action
  evidence_refs:
  - ev:10
