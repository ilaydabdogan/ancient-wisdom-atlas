canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic account of tools and practices associated
    with the people labeled in the passage as the Hudson Bat Eskimo and related Indians:
    crooked knives, awls, snow shovels, ice-hole tools, ice-picks, combs, women''s
    hair boards, swimming boards, fish-hooks, and a social episode in which boys harass
    women and women sometimes retaliate.'
  language: English
  quote_policy: summarized
