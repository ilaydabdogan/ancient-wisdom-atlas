canonical_text:
  quote: ''
  summary: 'The passage introduces winter storytelling around a fire for the instruction
    and entertainment of younger people and states that the stories were received
    directly by the collector. It then gives several animal stories: a wolverene dresses
    birds in feathers, makes wings for himself, ignores a brant’s instruction not
    to look below during flight, falls, and is later found to be a dead wolverene
    rather than an edible brant. In another story, a wolverene lures water birds ashore
    with a promised bees'' nest and a dance, kills ducks while their eyes are shut,
    but a loon escapes; a whisky-jack informs hungry Indians, who eat the cooked ducks
    and leave only bones. A reindeer names the animals; the squirrel asks for the
    black bear’s name, is refused as too small, and cries until its lower eyelids
    become white. In the final story fragment, a young man dreams that deer invite
    him to live with them; his father interprets this as a good hunting sign, and
    later a young doe stops him from shooting and invites him to live with the deer
    forever.'
  language: English
  quote_policy: summarized
