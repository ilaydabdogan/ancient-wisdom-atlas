candidate_motifs:
- id: motif:1
  label: animal trickster deceives birds through kinship claims and gifts
  taxonomy_refs:
  - trickster_boundary
  basis: The wolverene calls birds brothers, dresses or lures them, and in the second
    story kills birds during a dance after gaining their trust.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not use the abstract term 'trickster'; the label is based
    on repeated deceptive action by the wolverene.
- id: motif:2
  label: ignored do-not-look instruction causes a fall
  taxonomy_refs: []
  basis: The brant tells the wolverene not to look below during flight, but the wolverene
    looks down on the second turn and falls.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents the instruction and violation plainly but does not
    state a broader religious or initiatory meaning.
- id: motif:3
  label: concealed killing exposed by informer and punished by food loss
  taxonomy_refs:
  - trickster_boundary
  basis: After the wolverene kills and cooks ducks, the whisky-jack tells hungry Indians,
    who eat the meat and leave only bones; the wolverene loses the food he expected
    to eat.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly frame the loss as moral punishment, only
    as the outcome of the jay's report and the Indians' eating.
- id: motif:4
  label: origin of an animal feature through a naming episode
  taxonomy_refs: []
  basis: The squirrel requests the black bear's name, is refused, cries for a long
    time, and its lower eyelids become white.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage implies an explanatory animal-feature tale but gives no explicit
    interpretive label.
- id: motif:5
  label: animal naming hierarchy and denied status claim
  taxonomy_refs: []
  basis: A reindeer gives names to mammals and birds; the squirrel's request to share
    the black bear's name is denied because it is too small.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No taxonomy family supplied in the request directly matches animal naming
    hierarchy.
- id: motif:6
  label: dream invitation from deer society to a human hunter
  taxonomy_refs:
  - departure
  basis: The young man dreams that a deer asks him to live with them; later a doe
    stops him from shooting and invites him to live with the deer forever.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage fragment ends with the invitation; it does not show whether
    the young man accepts or departs to live with the deer.
