- id: obs:3
  text: In the first story, a wolverene calls birds together, addresses them as brothers,
    dresses them in feathers, makes wings for himself, and proposes that they fly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brant instructs the wolverene not to look below when they hear noise while
    flying over a point of land, and to turn when the birds turn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolverene does not look down on the first turn, but on the second turn
    he looks below at the shouting Indians and falls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Humans identify the fallen figure as a brant, but an old woman plucks and
    disembowels it, smells a stench, and the remains are later found to be a dead
    wolverene.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the second wolverene story, the wolverene sees geese, brant, ducks, and
    loons in the water, promises them a bees' nest if they come ashore, and asks them
    to dance with eyes shut.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: While singing during the dance, the wolverene cuts off birds' heads; a loon
    opens one eye, sees headless ducks, runs to the water, dives, and escapes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wolverene plucks, cleans, boils the ducks in a large kettle, and throws
    a firebrand at a whisky-jack because he fears the bird will tell on him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The whisky-jack tells hungry Indians about the cooked ducks; the Indians eat
    the meat, put the bones back into the kettle, and leave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the wolverene wakes and finds only bones and broth, he supposes the meat
    has boiled away; the jay says it told the Indians.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A reindeer gathers mammals and birds to give them names; the squirrel asks
    for the black bear's name, is told it is too small, and cries until its lower
    eyelids become white.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A young man tells his old father that he dreamed a deer asked him to live
    with them; the father says this is a good sign and that he will kill many deer.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: While hunting, the young man sees a herd of deer; a young doe approaches,
    tells him not to fire, asks him to put up his arrows, and says her father sent
    her to invite him to live with the deer forever.
  category: sequence
  evidence_refs:
  - ev:12
