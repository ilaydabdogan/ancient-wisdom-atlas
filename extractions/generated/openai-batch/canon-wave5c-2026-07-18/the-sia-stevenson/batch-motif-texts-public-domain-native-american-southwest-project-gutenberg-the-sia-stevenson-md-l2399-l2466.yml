canonical_text:
  quote: ''
  summary: In an assembly, Po'shaiyanne repeatedly appears with rare bracelets. The
    ti'amoni desires each bracelet and offers houses in exchange. Each exchange is
    accompanied by a game involving concealed stones, Wash'kasi, or blocks in a bowl;
    Po'shaiyanne wins each time and gains the houses of the south, east, zenith, and
    nadir, adding to houses already held. The people are saddened but remain silent,
    and the ti'amoni finally says Po'shaiyanne is equal with him and has all his houses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Po'shaiyanne takes his usual place in the morning assembly; the ti'amoni invites
    him to sit among them because he already has two houses, but Po'shaiyanne refuses
    and proceeds to light the cigarettes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A red bracelet, described as beautiful and not coral, is noticed on Po'shaiyanne's
    wrist.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ti'amoni offers his house in the south for the red bracelet, and a game
    with four hollow-ended sticks, a blanket, and a pebble is played; Po'shaiyanne
    succeeds and the ti'amoni fails, so the southern house goes to Po'shaiyanne.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the next day a bracelet of rare black stone beads is noticed; the ti'amoni
    envies it, offers his eastern house, and plays a game with four sand mounds and
    a hidden stone; Po'shaiyanne succeeds each time while the ti'amoni fails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people are sad when the eastern house is lost, but they say nothing because
    they believe the ti'amoni knows best.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: On another morning Po'shaiyanne wears a turquoise bracelet of marvelous beauty;
    the ti'amoni desires it, offers the house of the zenith, and plays Wash'kasi;
    Po'shaiyanne wins the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the following day Po'shaiyanne wears a bracelet of large white translucent
    beads; the ti'amoni offers the house of the nadir and again plays a game, this
    time with six blocks in a large bowl; Po'shaiyanne wins and becomes owner of the
    sixth house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the repeated losses, the ti'amoni tells Po'shaiyanne to sit with them
    and says he is equal with him and has all his houses.
  category: speech
  evidence_refs:
  - ev:6
