canonical_text:
  quote: ''
  summary: The passage describes Osage, Kansa, and Omaha practices and statements
    concerning the sun as Wakanda or a Wakanda. It includes a Kansa war prayer to
    the rising sun, a ritual attack on a stick representing a foe, directional prayer
    toward rising and setting sun, east-west orientation customs, and an Omaha sun-prayer
    fast said to gain superhuman power.
  language: English with transcribed Siouan-language ritual phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the passage, Osage traditions invoke the “mysterious one of day” as “grandfather,”
    and this being is associated with Wakanda language.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Kansa war captain addresses the rising sun before a war action and asks
    to kill or stun a Pawnee, bring back horses, pull down an enemy, and return safely.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kansa prayer promises material offerings, including a calico shirt, robe,
    and blanket, to Wakanda if the warrior is allowed to return safely after killing
    a Pawnee.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the “waqpele gaxe,” described as an attack on a stick representing
    the foe, members of the Lu or Thunder gens could not participate.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the same war-related rite, the warrior turns east and promises a blanket
    to Wakanda, then turns west and promises a feast to Wakanda.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the “waqpele gaxe,” a sacred bag is carried, bundles of sticks are laid
    in the road, warriors draw a circle around the bundles, set up one stick, and
    attack it as if it were a Pawnee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that this ceremony often caused the death of real enemies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Osage and Kansa, prayer is described as being made toward the rising
    sun in the morning and toward the setting sun in the afternoon and evening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that among the Omaha and Kansa the head of a corpse is laid
    toward the east, that Omaha avoid reclining with the head east, and that Kansa
    and Omaha lodges were oriented.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author states that east appears to symbolize life or its source, while
    west refers to death, and links the Osage war-party course with a mythic or symbolic
    west.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gahige reports that Omaha prayed to the sun with hands raised and palms toward
    the sun, saying words translated as “O Wakanda, pity me.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Those Omaha prayer participants abstained from eating, drinking, and ordinary
    smoking from sunrise to sunset, with restrictions removed after sunset.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: For four nights the men who prayed did not sleep at home; after the period
    ended, they were said to have made or gained superhuman power.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says this form of prayer could be performed from the appearance
    of grass in spring until the ground became frozen.
  category: setting
  evidence_refs:
  - ev:8
