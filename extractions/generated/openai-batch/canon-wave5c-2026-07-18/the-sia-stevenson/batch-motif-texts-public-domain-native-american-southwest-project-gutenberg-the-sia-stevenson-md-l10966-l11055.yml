literal_observations:
- id: obs:1
  text: Snow-houses are described as uncomfortable but protective; with the doorway
    open they become cold, and when closed with several people inside the heat becomes
    excessive.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Family work is performed inside the snow-house, including dressing and tanning
    animal skins, and refuse, offal, and hair from skins accumulate there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In spring, snow-houses begin to melt and may fall down after a few warm days;
    openings may be patched with deerskin when weather is still too severe for a skin
    tent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the snow structure falls, occupants must erect temporary shelters of
    deerskin or cloth on bare rocky ridges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People may remain in temporary camps until shore ice breaks from coves and
    bays, allowing hunters to procure seals from the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Poor wanderers search for food during the day and camp at night under rock
    shelter, often with wet clothing or covering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some weak and emaciated people starve before reaching the sea and are left
    to perish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the weather becomes warm enough, people described as industrious and
    provident move into sealskin tents for the season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A skin tent is usually made from large square flipper seal skins; about ten
    to fifteen skins may form a tent large enough for a good-sized family.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tent frame uses joined pairs of poles, a ridgepole, braces, and shorter
    support poles; a long tent is said to require eleven poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: During continued rains, skins are arranged to nearly meet over the ridge;
    when the tent is taken down, its skin widths are folded and rolled for carrying
    to the umiak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The skin tent is described as the usual shelter from the first rain until
    enough early winter snow has fallen to build an iglu gheak; its interior has bedding
    for the owner, wives, children, and other occupants.
  category: setting
  evidence_refs:
  - ev:6
