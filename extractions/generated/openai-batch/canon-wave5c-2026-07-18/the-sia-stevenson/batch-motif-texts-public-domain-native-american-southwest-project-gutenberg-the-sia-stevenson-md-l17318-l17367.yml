canonical_text:
  quote: ''
  summary: A hungry hare living with his poor grandmother catches many fish after
    setting a net. Because the grandmother has no fire to cook them, the hare goes
    across a dangerous river toward the Indians' tent to get fire. He commands whales
    to form a crossing, lies on the opposite bank, is carried by Indian children to
    an iron tent or kettle where a fire burns, causes a spark to fall on his net,
    and escapes through a hole in the top while the Indians realize they have been
    outwitted.
  language: English
  quote_policy: summarized
