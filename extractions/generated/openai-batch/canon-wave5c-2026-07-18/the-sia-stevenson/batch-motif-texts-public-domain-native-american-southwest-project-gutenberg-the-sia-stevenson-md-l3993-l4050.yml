canonical_text:
  quote: ''
  summary: 'A Sia rain ceremonial sequence is described: a vicar prays at the altar
    to the Ko''pishtaia and asks that cloud people water the earth; society members
    smoke and eat; ritual positions are arranged along a meal line; participants wear
    specified garments and hold eagle plumes, rattles, or turkey wands; meal and ashes
    are sprinkled at the altar and toward directions including zenith and nadir; a
    dancer calls on cloud people while others sing and rattle; a woman, child, and
    sick infant are present.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vicar stooped before the altar on the south side of the meal line, prayed
    to the Ko'pishtaia, offered them food, and asked them to exhort the cloud people
    to water the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male members of the society smoked cigarettes; afterward stew and bread were
    placed in the center of the room and the group ate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vicar drew a fresh line of meal from the altar to a south-side door near
    the west end, and members formed in line behind the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman sat on the north side of the room near the altar, and the little
    girl sat opposite her on the south side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite, the ti'amoni, the vicar, and the other men wore described cotton
    breechcloths, and each man held two eagle plumes and a gourd rattle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman and little girl wore ordinary dresses without high-neck calico gowns
    and each held turkey wands tipped with fluffy lemon-colored eagle plumes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The vicar gave meal to the ho'naaite, who sprinkled the altar without rising
    from his seat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A song began with rattle accompaniment; each stanza closed with a short, rapid
    shake of the rattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The writer notes the absence of the pottery drum in Sia cult society ceremonials,
    contrasting it with Zuni and Tusayan practice.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: Men moved to the fireplace, lifted ashes with their plumes, and deposited
    or sprinkled ashes before the altar and north and south of the meal line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ash sprinkling was directed to the west, north, south, zenith, and nadir,
    and the sprinkling of the cardinal points was repeated four times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: One man danced while others sang with rattle accompaniment, and the dancer
    called on the cloud people to come and water the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The woman and child waved their wands to the rhythm of the song; the vicar
    awakened the woman by passing eagle plumes over her face when she fell asleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A sick infant held by the woman was at times laid on a sheepskin and seemed
    unconscious of the rattle and song.
  category: action
  evidence_refs:
  - ev:7
