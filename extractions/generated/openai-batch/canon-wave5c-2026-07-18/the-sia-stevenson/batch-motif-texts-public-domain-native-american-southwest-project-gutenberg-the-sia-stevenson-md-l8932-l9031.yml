canonical_text:
  quote: ''
  summary: The passage describes diseases, shamanic treatment, social sanctions for
    murder and antisocial behavior, fear of ghosts at a tabooed island, treatment
    of vulnerable elders, suicide, scarcity-related violence, cannibalism, and expulsion
    among people identified in the passage as Eskimo, Inimit, and Koksoagmyut around
    Port Chimo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulmonary illness is attributed to crowded, poorly ventilated huts where odors
    and decomposing animal food accumulate.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Openings in snow huts are closed quickly to conserve heat, and a deserted
    hut may be avoided if its doorway was not tightly closed with snow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other diseases include conditions described as devitalizing the blood, such
    as scurvy, with sores and rapid decline.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman or conjurer attempts relief by influencing the sick person's imagination
    and will, with faith described as contributing to cure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The amount of a patient's worldly wealth is said to measure the magnitude
    of disease.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Koksoagmyut are described as generally peaceful, but jealousy may lead
    to murder.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A person deemed intolerably bad may be excluded from huts, food, and intercourse,
    while a murderer may be surprised and put to death, usually by stoning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In premeditated murder, the next of kin is said to have a duty to avenge the
    deed, even after years.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Akpatok Island is described as tabooed after murders there, because ghosts
    of victims might appear and ask for relief requiring proper offerings.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aged people without relatives may be neglected, abandoned during a move, and
    later found dead with stones around the corpse and thongs binding it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: An old woman with a sore eye was proposed for strangling to relieve misery,
    but the plan was postponed when the eye improved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Suicide is reported by cliff fall, strangulation, or gun, with remorse and
    disappointed love named as causes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: During food scarcity, a man found that his wife had hidden fish and eaten
    them secretly; he blocked the snow-hut entrance and she starved inside.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In severe scarcity, some families are reported to have eaten dogs, skin goods,
    and eventually resorted to cannibalism; unlucky or disliked women may be driven
    from camp.
  category: sequence
  evidence_refs:
  - ev:11
