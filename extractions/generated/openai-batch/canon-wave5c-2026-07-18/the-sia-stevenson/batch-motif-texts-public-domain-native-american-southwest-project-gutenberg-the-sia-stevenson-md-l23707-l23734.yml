canonical_text:
  quote: "“the tree that is to serve as the sun pole”"
  summary: On the fifth morning, a mounted party prepares to go after a mystery tree
    intended to become a sun pole. Chosen persons rush at the tree as if attacking
    an enemy, withdraw, return, tie leaves into a marked bundle, and assault it in
    turn. At the tree, the chosen persons whisper together, bring forward a person
    with a child, spread robes and goods on the ground, and seat the child on the
    pile.
