canonical_text:
  quote: ''
  summary: The passage describes Omaha and Ponka personal mystery decorations used
    on garments, robes, blankets, and tents; the limited right to wear or reproduce
    such designs; examples involving Little Soldier, George Miller, and Two Crows;
    and procedures by which a person becomes associated with the order of Thunder
    shamans through dreams or visions, war-party conduct, ritual songs, feast display,
    and restricted inheritance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha and Ponka are said to have personal mystery decorations that may
    be worn on garments or appear on tents, and the makers and wearers must belong
    to shamanic orders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Little Soldier wore a buffalo robe with a personal mystery decoration that
    others, including members of his gens, feared to imitate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Little Soldier intended to paint the decoration on four white blankets for
    his son George Miller, but died before painting the fourth.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: George Miller received and wore out three such blankets and retains the right
    to decorate and wear a fourth according to his father's intention.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: George Miller could not transmit the right to his children unless he later
    saw the relevant objects in a dream or vision.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The right to use these designs is said to originate with a person who has
    had a dream or vision in which mystery objects are manifested.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The class of designs described is associated with members of the order of
    Thunder shamans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The order of Thunder shamans is described as including those who have dreamed
    or had visions of the Thunder-being, the Sun, the Moon, or other superterrestrial
    objects or phenomena.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person who saw the Thunder-being or another mystery object kept the matter
    secret for a time, joined the first war party, and disclosed the dream or vision
    when the party reached enemy land or trouble.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A dreamer or seer who killed or grasped a foe, or who brought back an enemy
    horse, had the right to make a Thunder song.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: After returning, the seer painted the mystery objects on a robe or blanket,
    prepared a feast, invited members of the order, displayed the robe, and was then
    recognized as a member who could wear the robe safely.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A father could give his son the right to wear such a robe, but a son without
    a similar vision could not transmit the right to the next generation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Two Crows wore a robe painted by Little Soldier and could make another like
    it, but could not transmit the right to his son.
  category: relationship
  evidence_refs:
  - ev:8
