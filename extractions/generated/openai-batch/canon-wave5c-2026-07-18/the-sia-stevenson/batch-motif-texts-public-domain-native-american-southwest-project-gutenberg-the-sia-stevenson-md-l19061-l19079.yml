canonical_text:
  quote: ''
  summary: The passage reports Omaha and Ponka ancestral belief in Wakanda as a Supreme
    Being whose location and mode of existence were not known and who was not worshiped
    in public assembly. It also notes varied address of Wakanda through the sun or
    Thunder-being, and cites a Kansa report that Wakanda is unseen, heard in thunder,
    and represented by a worn shell that is not considered a likeness.
