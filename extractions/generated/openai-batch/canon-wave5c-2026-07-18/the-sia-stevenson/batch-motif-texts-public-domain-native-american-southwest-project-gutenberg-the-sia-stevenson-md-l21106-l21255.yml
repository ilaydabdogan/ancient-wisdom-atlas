  quote: ''
  summary: The passage describes Omaha nikie decorations, especially decorations associated
    with the Inke-sabe gens and its sub-groups. It records spiral forms, a buffalo-head
    tent painting, a beaded blanket with spirals and a star, and pipe-themed tent
    decorations with sacred-pipe details. A final, partially garbled description suggests
    that a sacred pipe may function as a sign causing fighting or shooting to stop.
  language: English with Omaha terms and interlinear Omaha-language material
