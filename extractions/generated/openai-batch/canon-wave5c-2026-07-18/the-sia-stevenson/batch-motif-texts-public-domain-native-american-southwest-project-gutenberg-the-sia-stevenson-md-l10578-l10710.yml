  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A group called the “Northerners” use special ice shoes when traveling on slippery
    ice; narrow sealskin strips are looped and stitched onto a leather undersole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ice shoes are worn over ordinary waterproof boots.
