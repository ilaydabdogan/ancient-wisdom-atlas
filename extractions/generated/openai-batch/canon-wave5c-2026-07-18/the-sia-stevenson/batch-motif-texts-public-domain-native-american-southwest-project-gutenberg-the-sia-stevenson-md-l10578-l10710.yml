literal_observations:
- id: obs:1
  text: Some seal skins are used for shoe leather; leather retaining the black epidermis
    is described as comparatively waterproof, while creamy-white fermented leather
    is described as not resisting water.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buckskin soles are used for walking with snowshoes because they reduce slipping
    and clogging with snow and allow moisture from the feet to escape more readily
