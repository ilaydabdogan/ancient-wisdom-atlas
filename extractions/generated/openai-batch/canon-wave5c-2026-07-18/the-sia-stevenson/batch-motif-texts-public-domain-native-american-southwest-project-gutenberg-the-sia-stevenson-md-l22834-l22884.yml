canonical_text:
  quote: ''
  summary: 'The passage describes Dakota and Assiniboin beliefs and rituals concerning
    the Thunderers or Wakinyan: their warfare with the Unktehi, their association
    with war implements and protective pigments, dream combat, circle-dance imagery,
    sacrifices and songs, Heyoka connections, and thunder explained as the action
    of great and young thunder birds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thunderers are described as cruel, destructive, and continually on the
    war path.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thunderers or Wakinyan are in mortal hatred with the family of the Unktehi,
    and each side is vulnerable to the other's strike.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A reported story says that a Wakinyan with a 25-to-30-yard wingspan was killed
    and fell on the bank of the Blue Earth River in Minnesota.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Dakota are said to have received the spear, tomahawk, and protective pigments
    from the Wakinyan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dreaming of the Thunderers is said to mean that the dreamer and the Thunderers
    must fight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the circle dance, an image of the great bird is cut from bark, suspended
    at the top of the central pole, and shot to pieces at the close of the dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sacrifices are made to the Wakinyan, and songs are sung to both the Wakinyan
    and the Unktehi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that the connection between the Heyoka gods and the Wakinyan
    is unclear, but says a Heyoka god uses a small Wakinyan god as his drumstick and
    that Wakinyan songs are sung by the Heyoka dancing order.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Dakota account reported by Smet explains thunder as an enormous bird; the
    great bird gives the first sound, and young thunder birds repeat it, causing reverberations.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The young thunderers are described as mischievous, while the old thunderer
    or big bird is described as wise, excellent, and non-injuring.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Assiniboin are said to regard Thunder as a great deity next to the Sun,
    to offer sacrifices at the first spring thunder, and to ascribe thunder to an
    enormous bird.
  category: relationship
  evidence_refs:
  - ev:11
