canonical_text:
  quote: All desire to go to the lower region and afterwards enjoy the pleasure of
    communicating with the living
  summary: 'The passage describes beliefs and customs concerning death: preferred
    afterlife destinations, a four-year grave probation for spirits of those who die
    naturally, grave offerings and goods for the departed, burial or exposure locations,
    disapproval of disturbing bones, grave rifling for goods, and a brief comparison
    with Alaskan Eskimo dead festivals.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A lower region is described as a desired postmortem destination because it
    permits communication with the living; those who go above are denied that privilege.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When death results from natural causes, the spirit is supposed to rest in
    the grave for four years as a probation before dwelling on earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the grave-rest period, the grave may be visited, food may be offered,
    songs may be sung, and offerings of oil, flesh, and tobacco are consumed by the
    living at the grave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clothing may be deposited near the grave so that the spirit can clothe itself
    after the garments disappear through decay.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Objects considered immediately useful to the departed soul are placed in the
    grave at interment, including ammunition, a gun, a kaiak and appurtenances, clothing
    items, a knife, and a cup.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead person's spirit is said to appropriate the spirits of deposited articles
    after the articles decay.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some dead are exposed on a flat high point extending into water, some are
    placed along the shore under rocks, and others are placed on smooth rocky ridges
    near a large glacial boulder with stones piled around and upon the body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people described have little fear of a dead man's bones but disapprove
    of the bones being disturbed by others.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Indians are known to rifle Eskimo graves to obtain
    guns, clothing, and similar goods placed there by relatives of the deceased.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that the people of Hudson strait do not have dead-festival
    ceremonies as elaborate as those among the Eskimo of Alaska.
  category: relationship
  evidence_refs:
  - ev:6
