  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The load is placed so that its weight rests on the part of the sled chiefly
    bearing on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On journeys, younger women and men drag the sled; when men return to the trading
