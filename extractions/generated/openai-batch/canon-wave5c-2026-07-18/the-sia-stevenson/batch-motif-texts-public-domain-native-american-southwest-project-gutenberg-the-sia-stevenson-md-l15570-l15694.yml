  summary: 'The passage gives a technical ethnographic description of a Nenenot sled
    and snowshoes: the sled’s two-board construction, thongs, dimensions, load placement,
    and use in moving camp or trading; and the snowshoes’ four styles, wooden frames,
    deerskin netting, needle, toe opening, foot fastening, and single-bar variants.'
