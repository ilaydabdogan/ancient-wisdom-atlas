  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Four snowshoe styles are named: swallow-tail, beaver-tail, round end, and
    single-bar.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The snowshoe frame is wooden, often made in two pieces joined by lap splices
