canonical_text:
  quote: ''
  summary: 'The passage describes Mandan practice concerning guardian spirits: guardian
    spirits are invoked before undertakings, appear in dreams, and may be chosen through
    fasting, solitude, penance, lamentation, prayer, and sometimes finger-joint sacrifice
    until a dream reveals the first animal or object as the guardian spirit. It also
    notes a hill and nearby cave used in fasting and lamenting, and says Ochkih-Hadda
    taught the choice and adoration of guardian spirits, tattooing, and medicine feasts.'
  language: ''
