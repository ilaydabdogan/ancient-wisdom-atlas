canonical_text:
  quote: ''
  summary: The passage describes Heyoka women, including a female Heyoka killed by
    lightning, dream-promises made to Thunder-beings, worship of those beings as wakan,
    women’s songs and dress, and a separate account of Iya/E-ya, a god of gluttony
    who distorts faces and is invoked to quiet crying children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bushotter reported seeing a female Heyoka after she had been killed by lightning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lightning-killed woman belonged to the Heyoka Society.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the woman walked, she carried a pipe with the mouthpiece pointing upward
    because she thought Thunder-beings would put the mouthpiece into their mouths,
    an act said to cause her death immediately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women were said to dream about the Thunder-beings just as men did, and in
    those dreams Heyoka men or women made promises to the Thunder-beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If dreamers kept their promises, the Thunder-beings were thought to help them
    obtain desired things; if they broke promises, they were expected to be killed
    by the Thunder-beings during a storm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Heyoka members worshiped and honored the Thunder-beings, speaking of them
    as wakan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Some Heyoka women sing and some do not; all are described as letting their
    hair hang loosely down their backs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Heyoka women’s dresses are described as cloth or a robe sewed down the middle
    of the back, sometimes blue, sometimes half red and half blue, and sometimes decorated
    with beadwork.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Heyoka women wear a long red cloth trailing on the ground before and behind
    them, in imitation of young dandies of the tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Lynd is cited as speaking of the vindictive Iya as driving hunters back from
    the hunt to the desolation of their lodges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Riggs is cited as describing E-ya as a god of gluttony, extremely ugly, able
    to twist and distort the human face, and invoked by women to quiet crying children.
  category: attribute
  evidence_refs:
  - ev:5
