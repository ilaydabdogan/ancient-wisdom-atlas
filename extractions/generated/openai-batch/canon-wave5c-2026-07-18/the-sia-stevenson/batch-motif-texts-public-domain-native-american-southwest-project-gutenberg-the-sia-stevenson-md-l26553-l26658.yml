canonical_text:
  quote: The stars are deceased men.
  summary: The passage records astronomical beliefs about stars, the rainbow, and
    northern lights, then describes Mandan and Hidatsa medicine stones and medicine
    establishments used for smoking, offerings, petitions, divination, and omens.
    It ends with a note that a Mandan owner of a medicine pipe may adopt a medicine
    son chosen through a dream.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Stars are described as deceased men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a child is born, a star descends and appears on earth in human form;
    after death it reascends and appears again as a star.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rainbow is described as a spirit accompanying the sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many people are said to explain the northern lights as an assembly of northern
    medicine men and distinguished warriors boiling prisoners and slain enemies in
    huge cauldrons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mandan and Hidatsa medicine stone is described as a thick, porous stone
    with a smooth surface, visited by a deputation at certain seasons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Visitors to the Mandan medicine stone smoke to it and later read national
    destinies in white marks on the stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Hidatsa medicine stone is described as a large isolated rock in a prairie,
    shaped like a steep house roof, about two days' journey southwest of the village.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Hidatsa individual may bring presents, fast and lament for several days,
    smoke to the rock, wash part of its face, and pray for success in war, hunting,
    and taking prisoners, horses, and scalps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the prayer period, the presents are no longer at the rock and white-clay
    hieroglyphics appear on the washed portion; the petitioner copies them onto a
    skin and reads them as future fortune.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A bear image facing toward the village is read as an approaching war party
    or evil; a bear tail toward the village is read as good fortune.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: One reported chart image of a strange building near the village was later
    associated with the construction of a stockade trading house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A later notice says the holy stone or medicine rock was some two or three
    days' journey away and that the Hidatsa then seldom referred to or visited it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: One Mandan medicine establishment near a village consists of four poles, earth
    and green turf, four buffalo skulls, twenty-six human skulls, knives, twigs, and
    a red-painted comb or rake.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: People go to the medicine establishments to make offerings or petitions, with
    howling, lamentation, and loud entreaties to the Omahank-Namakshi.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Another medicine establishment consists of two skin human figures fixed on
    poles, said to represent the sun and moon, though Maximilian thought they probably
    represented Omahank-Namakshi and the Old Woman that Never Dies.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: A Mandan who possesses a medicine pipe may choose a medicine son; the young
    man appears to him in a dream and must be of good family or have performed an
    exploit.
  category: sequence
  evidence_refs:
  - ev:11
