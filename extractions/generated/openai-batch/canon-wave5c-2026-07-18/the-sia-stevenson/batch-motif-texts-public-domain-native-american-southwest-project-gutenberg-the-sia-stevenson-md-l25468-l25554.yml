- id: obs:4
  text: Some Dakota people are said to believe that certain persons can call up and
    converse with spirits of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described spirit-calling procedure includes assembling at night in a lodge,
    smoking, putting out the fire, covering heads with blankets, and singing until
    a spirit gives a picture.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A young Lakota died before marrying a girl he loved, and the girl mourned
    by cutting her hair and gashing her limbs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead man's ghost returned and took the mourning girl as his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ghost's wife camped away from the others and behind the main camp movement;
    the people could neither see nor hear the ghost, but heard the wife address him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ghost husband instructed his wife, brought game, sent warnings about high
    wind or heavy rain, read his wife's thoughts, and obtained things she desired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A solitary traveler in a thunderstorm saw a light in the woods and found a
    sweat lodge with two speaking persons identified as ghosts; when he fled, they
    pursued him though he could not see them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The traveler later wished for company after hearing a woman's cry, and a ghost
    woman appeared beside him saying she had come because he wished for her company.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ghost woman's legs could not be seen, and she disappeared like the wind
    after the man thought she might choke him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: During a buffalo hunt, a strange winter-robed man appeared on a hill; arrows
    shot at him passed by, and the people fled because he was a ghost.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the beginning of another story, a young man on the warpath hears voices,
    encounters an owl, and at midnight hears a woman wailing while he tends a fire
    and keeps a gun ready.
  category: sequence
  evidence_refs:
  - ev:9
