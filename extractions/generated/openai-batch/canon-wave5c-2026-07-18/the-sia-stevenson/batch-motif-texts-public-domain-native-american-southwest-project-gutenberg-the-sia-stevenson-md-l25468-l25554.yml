canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and stories about ghosts: some are helpful
    but most harmful; ghosts know thoughts, may cause sickness, can be called through
    ritual, and appear in several Teton/Lakota ghost narratives involving a ghost
    husband, night pursuit, a thought-responsive ghost woman, an unshootable apparition,
    and an interrupted warpath story with uncanny voices.'
  language: English
  quote_policy: summarized
