- id: obs:1
  text: Some ghosts are described as beneficent, while most are described as maleficent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ghosts are said to know all things, including the thoughts of living people.
  category: attribute
  evidence_refs:
