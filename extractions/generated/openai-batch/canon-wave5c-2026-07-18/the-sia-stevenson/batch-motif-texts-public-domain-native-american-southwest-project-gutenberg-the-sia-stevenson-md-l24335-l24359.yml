  quote: ''
  summary: The passage compares accounts by Miss Fletcher, Capt. Bourke, and Bushotter
    concerning a ceremonial sequence involving a camp circle, tent of preparation,
    selection of people to seek and fell a tree, raising of a sun pole, piercing of
    children’s ears, mellowing of the earth, scarification of devotees, and dancing
    while attached by thongs to a pole, posts, and skewers under the flesh. The accounts
    disagree on some details but are described as substantially agreeing overall.
  language: ''
