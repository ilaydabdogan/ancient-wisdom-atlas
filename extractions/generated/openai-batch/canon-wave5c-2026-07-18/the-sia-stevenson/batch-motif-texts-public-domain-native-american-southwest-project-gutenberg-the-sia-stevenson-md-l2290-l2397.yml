canonical_text:
  quote: ''
  summary: The passage recounts how Po'shaiyanne, after reaching manhood, appears
    in the chita with valuable bracelets on successive days. The ti'amoni seeks each
    bracelet, offers houses in exchange, and plays games with Po'shaiyanne. Po'shaiyanne
    wins the described games and thereby receives the houses.
  language: English with transcribed Sia terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After reaching manhood, Po'shaiyanne sits in the chita, passes the light to
    those present, and returns to a seat near the entrance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A string of rare turkis is seen encircling Po'shaiyanne's right wrist, and
    the ti'amoni sends a man to examine it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Po'shaiyanne says he cannot tell how the turkis bracelet came upon his wrist
    and initially does not wish to sell it; he later accepts the ti'amoni's north
    house and its contents in exchange for the bracelet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The game Wash'kasi is described as using forty pebbles arranged in a square,
    a flat stone in the center, and four flat sticks with one painted and one unpainted
    side.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the Wash'kasi play, the ti'amoni throws mixed results while Po'shaiyanne
    repeatedly throws all painted sides and wins the game.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The following morning in the chita, Po'shaiyanne has a second bracelet, made
    of ko-ha-qua beads, on his wrist; the ti'amoni seeks it and offers his west house
    and its contents in exchange.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A second game uses a bowl and six polished cubes painted on one side; Po'shaiyanne
    insists that the ti'amoni play first, then repeatedly throws all painted sides
    and wins the second house.
  category: sequence
  evidence_refs:
  - ev:5
