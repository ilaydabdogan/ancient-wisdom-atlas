  quote: ''
  summary: 'The passage describes ritual actions by candidates or devotees: emerging
    from a sleeping or preparation tent, circling it four times, suspending blanket
    offerings on four posts, proceeding toward a dancing lodge along a straight line
    of sticks bearing blankets and tobacco pouches, and restrictions on spectators
    crossing that line. It also describes a decorated wand used by a herald or crier
    in the sun dance to clear an open space.'
