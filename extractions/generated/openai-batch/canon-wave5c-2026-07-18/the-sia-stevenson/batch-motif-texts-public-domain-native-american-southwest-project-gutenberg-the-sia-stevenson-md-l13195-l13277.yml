  quote: ''
  summary: The passage describes beliefs about spirits, shamans, animal souls, bird
    and mouse omens, an owl-related avoidance practice, a dark shamanic tent ceremony,
    and the keeping of hunting mementos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain men are consulted because they are supposed to be in direct contact
    with spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A spirit is said to appear only in the darkness of the conjuring house and
    to be appeased by an atonement made by the afflicted, made known through the shaman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Minor spirits are described as being under the control of a single great spirit
    dwelling in the sky.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each animal is said to have a protective spirit inferior to those of humans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Animal souls are described as indestructible and able to reappear repeatedly
    after the material form is destroyed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spirits of beasts, birds, fishes, insects, and plants are said to have homes
    to which they return after death and from which the shaman may recall them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Canada jay is said to inform animals of approaching Indians, and Indians
    are said rarely to fail to kill the jay when found.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A species of mouse is said to dread humans so much that it dies when it wanders
    near a person's track, and is believed unable to cross the path.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The presence of short-eared owls and hawk owls near camp at dusk causes alarm
    among the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: People suspend an unworn garment so the bird may know they are not too poor
    in possessions for the spirit Wiq'-ti-qu to annoy them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The shaman is believed able to control different spirits and foretell the
    future, but must be concealed during the performance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A special high, narrow tent is erected and sealed against light for the shaman's
    performance.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Inside the tent, the shaman groans, raises his voice to a screech, and the
    drum adds sound to the ceremony.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The shaman announces the appearance of a spirit, asks it to grant a request,
    and then tells the people he has secured the spirit's services.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The spirit is said to promise fulfillment; the conjurer throws over the tent
    and reports the interview result.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: If the request is not granted, the passage says blame may be assigned to someone
    who displeased the spirit, and that person may be made to do penance.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:17
  text: When an Indian kills a large fierce wild beast, it is customary to keep part
    of the skin or another body part as a memento.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Such mementos are kept to show the hunter's prowess and as tokens of wealth
    from bartering the pelt.
  category: object
  evidence_refs:
  - ev:13
