canonical_text:
  quote: ''
  summary: After returning home from the eagle house, the two boys soon travel again
    despite their mother's warning. A sko'yo woman carrying a pack invites them to
    her house, transports them, is tricked when they escape into a tree, recaptures
    them, and later tries to cook them in a heated conical house. The boys protect
    themselves with shells from their mouths, hide, and trick the woman into eating
    their excrement before revealing the deception; she vomits.
  language: English
  quote_policy: summarized
