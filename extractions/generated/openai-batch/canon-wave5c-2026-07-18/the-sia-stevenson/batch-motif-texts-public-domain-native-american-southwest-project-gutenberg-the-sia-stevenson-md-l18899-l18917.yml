canonical_text:
  quote: ''
  summary: 'The passage cites Fletcher on the religious significance of personal names:
    a name implies relationship, protection, affiliation, and the protective presence
    of a deity. In the cited ceremony, a superhuman being overshadows and encloses
    a child, addresses the wakan man as father, and is in turn addressed by the wakan
    man as child while protection is invoked for the boy and offerings are presented.
    The passage notes that this reverses the usual seniority and juniority implied
    by kinship terms.'
