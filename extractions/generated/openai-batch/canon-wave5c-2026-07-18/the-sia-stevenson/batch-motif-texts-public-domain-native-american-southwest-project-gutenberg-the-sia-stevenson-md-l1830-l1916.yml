canonical_text:
  quote: ''
  summary: Ma'asewe and his younger brother U'yuuyew are sent for wood, lure a Sko'yo
    woman into looking closely at a fire, and push her into the coals. They then enter
    her large house, pass through a circular door in the floor, and tumble into a
    lower world. There they identify the world as connected with the nightly return
    of their father, the sun, reach a village during a feast, enter an empty chi'ta,
    steal bows and arrows, flee from pursuers, and are carried back up through the
    doorway by a whirlwind before returning toward their mother.
  language: English
  quote_policy: summarized
