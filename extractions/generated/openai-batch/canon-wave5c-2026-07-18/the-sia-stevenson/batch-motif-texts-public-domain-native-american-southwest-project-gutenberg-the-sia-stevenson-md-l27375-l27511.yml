  quote: ''
  summary: 'The passage describes four-quarter ritual orders among Kansa, Dakota,
    Osage, and Omaha-related ceremonies: invocation of winds, actions in a White Buffalo
    festival, consecration of hearths or fireplaces, custody of four colored stones,
    encircling returning warriors, scalp-cutting gestures, and red or black ritual
    objects associated with war, direction, or status.'
  language: English with Indigenous names and terms
  quote_policy: summarized
