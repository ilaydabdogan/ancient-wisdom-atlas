canonical_text:
  quote: ''
  summary: 'A named source reports seven great Wakandas: Darkness, the Upper World,
    the Ground, the Thunder-being, the Sun, the Moon, and the Morning Star. The principal
    Wakanda is said to be in the upper world above everything, though two named sources
    deny this. The author reports a shift from thinking these powers belonged to one
    gens or subgens to viewing some or all of them as having many believers among
    the Omaha and cognate tribes.'
