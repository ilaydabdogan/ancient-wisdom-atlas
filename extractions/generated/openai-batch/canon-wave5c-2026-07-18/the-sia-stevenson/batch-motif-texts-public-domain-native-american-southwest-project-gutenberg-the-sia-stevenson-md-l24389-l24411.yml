  quote: ''
  summary: A Bushotter Teton text explains why Indians sing that day and night are
    mysterious or wakai. Day enables human activity and sight, yet people do not know
    what causes light and identify the sun as a powerful non-human cause worthy of
    prayer and respect. Night is also called wakai because it is associated with ghosts
    and fearful objects, and people pray to it.
