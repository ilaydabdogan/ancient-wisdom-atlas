canonical_text:
  quote: ''
  summary: The passage describes an Ictasanda custom in which people fearful during
    a shower offer a tobacco-filled pipe to Thunder-beings, address them with sacred
    names, or, without tobacco, raise their arms and cry toward the clouds. It also
    describes restrictions on other Omaha gentes and the actions of Thunder shamans,
    including songs and pipe offerings toward the clouds.
  language: English translation with Omaha text and interlinear glosses also present
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Ictasanda people become fearful during a shower, they fill a pipe with
    tobacco and offer it to the Thunder-beings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the offering, the speakers address the Thunder-being or beings as grandfather,
    state their poverty, request that a place be abandoned by those who would injure
    them, and invoke four named addresses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When they do not offer tobacco, they stand with arms elevated and hands stretched
    out, palms down, while crying toward the clouds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Thunder-beings know about the Ictasanda people
    as their worshippers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other Omaha gentes fear mentioning the Ictasanda nikie names, bestowing them
    on their own members, or invoking the Thunder-being or beings unless they belong
    to the order of Thunder shamans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thunder shamans of other Omaha gentes can act as the Ictasanda people do,
    make songs about the Thunder-beings, sing their own songs, fill a pipe with tobacco,
    and hold the pipe mouth-piece toward the clouds while gazing at them.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Sometimes the shamans do not fill the pipe and instead stand singing Thunder
    songs without offering anything to the Thunder-beings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note says the four Ictasanda or Thunder gens nikie names may refer to four
    Thunder beings, one at each compass point or in the direction of each of the four
    winds.
  category: other
  evidence_refs:
  - ev:7
