literal_observations:
- id: obs:1
  text: The passage says the Sia generally do not believe dead spirits return after
    entering Shipapo, but it reports one exception.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Departed spirits once came to the village for a feast with bodies like those
    they had before death, and living relatives recognized them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spirits arrived mostly after dark and remained until near dawn for one
    night only.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says husbands and wives among the living and dead did not sleep
    together because doing so would have caused the living to die.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At separation, both living and dead wept, and the living wanted to go with
    the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead said the living could not pass through the entrance to the other
    world until they died or grew old and became little children again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The described spirit home has vast fields, beautiful pastures, high mountains,
    clear lakes and rivers, and flourishing wheat and cornfields.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The departed spirits sleep during the day and work or move about at night
    in the world below.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The moon is described as father to the dead, and the sun as father to the
    living.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The home of departed spirits is identified as the world first inhabited by
    the Sia.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes an aim of growing back toward infancy and then sleeping
