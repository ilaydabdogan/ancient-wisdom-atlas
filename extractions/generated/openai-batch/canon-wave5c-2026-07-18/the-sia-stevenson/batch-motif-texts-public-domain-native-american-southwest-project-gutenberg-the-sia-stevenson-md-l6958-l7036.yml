  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A ho'naaite is said to hold a corresponding position in the spirit world.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: If death occurs before sundown, the body is prepared and buried as soon as
