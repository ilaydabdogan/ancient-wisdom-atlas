canonical_text:
  quote: ''
  summary: 'The passage reports traditions and descriptions of Omaha and Kansa sacred
    or mystery decorations: corn and buffalo are linked in kinship terms and bestowal
    traditions; Omaha robes and tents depict visions of buffalo, horses, chickens,
    deer, and grizzly bears; Kansa tents mark eagle communication and pipe-dance accomplishments
    with pipes, feathers, animals, stars, shields, buffalo tails, and cornstalks.'
  language: English with OCR noise and Siouan terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that corn is regarded as a mother and buffalo as a grandfather
    among the Omaha and other tribes; it also reports an Osage tradition in which
    corn was bestowed by four buffalo bulls or grandfathers and notes a similar Arikara
    belief about an ear of corn.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nifactage's robe decoration is described with a red band at the top, black
    spots representing buffalo wallows, and buffalo hoofs in blue.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duba-ma's father is said to have had a vision of horses and to have wanted
    horse tails and tracks depicted on his tent, but he died before completing it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father of Ma''tcu-na''ba had a vision of horses and bequeathed to his
    son the right to decorate a tent in that style; yellow was connected with the
    vision, and a horse-tail was displayed on a long pole above the lodge or tent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wacka°hi, as a young child, fell asleep while playing and said he was awakened
    by the sounds of many chickens crowing and cackling; his tent was later painted
    in remembrance of that occurrence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: An unnamed Omaha person is said to have had a vision of deer and to have decorated
    his tent accordingly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: An Omaha Grizzly Bear shaman named jebi'a, or Frog, had a tent with its top
    painted yellow; the passage says this yellow was evidently connected with a grizzly
    bear vision.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The father of Two Crows belonged to Thunder, Buffalo, and Grizzly Bear shamanic
    orders; his tent decoration showed a grizzly bear emerging from its den or the
    ground, with blue representing the ground and a yellow band on the tent.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Kansa man fasted and held mysterious communication with an eagle that gave
    him feathers; he had danced the pipe dance once, and his tent showed peace pipes
    near the entrance, with a black bear and a large turtle at the back.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A second Kansa tent belonged to a man who had danced the pipe dance three
    times; it bore buffalo tails, feathered shields, and stars.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: A third Kansa tent belonged to a man who had danced the pipe dance four times;
    the passage says that, judging from the stars on the tents, the owners of the
    second and third Kansa tents probably had visions.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage reports that Kansa say a man who has danced the pipe dance twice
    may decorate his tent with cornstalks, and it states that Omaha and Ponka regard
    the pipes used in the calumet or pipe dance as Wakanda-related, with an inferred
    similar belief among Kansa and Osage.
  category: speech
  evidence_refs:
  - ev:12
