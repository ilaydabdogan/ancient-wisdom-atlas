  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Offerings including a ha'chamoni notched stick with plumes, gaming blocks,
    cigarettes, down, and beads are described as compensation for the service of the
    powerful beings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eagles are kept caged and turkeys are kept for obtaining plumes for ritual
