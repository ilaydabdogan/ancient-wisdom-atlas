  text: The passage contrasts thirteen Zuni secret cult societies with eight Sia societies
    and notes that both Sia and Zuni cult societies have altars and sand paintings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zuni altars are described as guarded during ceremonials by members of the
