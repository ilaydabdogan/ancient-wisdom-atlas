canonical_text:
  quote: ''
  summary: The passage describes Sia and Zuni secret cult societies, their altars,
    sand paintings, warrior-related functions, rain rites, offerings, membership and
    initiation procedures, snake-handling restrictions, and theurgistic curing practices.
    Disease is explained as caused by witches, wizards, or angry animals and insects,
    and cures involve fetich medicine, sucking, brushing with straws or eagle plumes,
    and shell-mixture compensation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that disease is thought to be produced chiefly by occult
    powers of wizards and witches or by the anger of certain animals, often insects.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plant medicines are said to be known, but medicinal treatment by a theurgist
    is described as needing fetich medicine and magical craft.
  category: action
  evidence_refs:
  - ev:1
