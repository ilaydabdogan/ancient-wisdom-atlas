  summary: The passage describes waterproof hand coverings and rain garments used
    by men in wet or cold conditions, including black sealskin mittens or gauntlets
    for seal hunting and a hooded frock made from seal intestines. It also describes
    preparation of the seal intestines by washing, scraping, inflating, drying, flattening,
    rolling, splitting, trimming, and sewing into garment parts.
