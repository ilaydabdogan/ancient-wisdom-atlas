canonical_text:
  quote: ''
  summary: The passage describes deer hunting at water or shore, the dispatching of
    wounded animals, butchering and use of body parts, removal and drying of sinew,
    valuation of the tongue as food, caching meat with stones for later winter use,
    movement to new hunting stations, and use of spoiled early-season meat as dog
    food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters attempt to spear deer in a vital spot so the animal can reach shallow
    water or shore but not wander away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wounded deer are described as dreading the water and striving to regain land;
    the narrator reports not seeing spear-wounded deer swim back in the direction
    from which they came.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hunters try to dispatch as many deer as possible and prevent deer from returning
    to the starting shore because returning animals are thought to alarm other arrivals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Killed deer lying in the water are dragged onto land, skinned, opened, and
    have their viscera removed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Intestines, stomach, collected blood, heart, liver, and other flesh are retained
    or consumed as food.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A sinew along the lumbar region is loosened, pulled free, cleaned, washed,
    spread out, and dried.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The head is discarded unless horn is needed for a tool handle or other purpose;
    a young deer's head may be boiled for food.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tongue is always removed whole and is described as the greatest delicacy
    in frozen, raw, cooked, dried, or smoked condition.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hindquarters may be placed within the thoracic cavity and either cached near
    the slaughter scene or carried in a kayak to another storage spot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Meat caches are made with stones or boulders and covered by a rude stone wall
    to hide the meat from ravens, gulls, foxes, wolves, and wolverine.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When deer stop crossing at a locality, the hunter moves to another station;
    early-season deer ruined by warm weather, flies, and decomposition are reserved
    for dog food.
  category: sequence
  evidence_refs:
  - ev:6
