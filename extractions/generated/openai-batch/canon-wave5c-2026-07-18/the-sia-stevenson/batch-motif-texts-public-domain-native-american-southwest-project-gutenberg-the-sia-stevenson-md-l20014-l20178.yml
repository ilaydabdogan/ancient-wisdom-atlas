canonical_text:
  quote: ''
  summary: 'The passage describes several Kansa Wakandas represented or referenced
    on a war chart, including an aged man who grants hunting success, a night-song
    maker, shade-related Wakandas, and a sleep-making Wakanda. It then gives Omaha
    invocations connected with trapping: an invisible first maker and teacher of medicine,
    the beaver, medicine, trap, pack-strap, trap entrance, buffalo-tail attachment,
    fireplace, and firebrands are addressed with tobacco and petitions for successful
    capture of quadrupeds.'
  language: English with Kansa/Omaha-language transcriptions and interlinear glosses
  quote_policy: summarized
