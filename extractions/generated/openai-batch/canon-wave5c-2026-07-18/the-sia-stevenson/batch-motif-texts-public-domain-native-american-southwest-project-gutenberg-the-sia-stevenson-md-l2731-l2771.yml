  quote: ''
  summary: 'The passage summarizes Sia cosmogonic and ritual beliefs: a spider creator
    creates first man and other serving beings; supplication occurs through a mediator
    and ritual images; spirits travel to and from Shipapo, the lower-world entrance;
    masked Zuni kokko and Sia Ka''suna are contrasted; witchcraft involves shapeshifting,
    intrusive illness objects, hair magic, and cures by secret-society theurgists.'
  language: English with Indigenous terms and OCR irregularities
  quote_policy: summarized
