  quote: ''
  summary: Coyote asks the cloud people for a river and floats from the mountains
    to the hare land. There he pretends to be dead, recruits a woman ka'wate as a
    companion and accomplice, hides clubs beneath himself, disguises his body with
    black seeds so he will appear worm-eaten, and instructs her to summon the hares
    and throw her poison like rain into their faces while they dance.
