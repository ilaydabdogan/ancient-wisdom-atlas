  quote: ''
  summary: The passage describes appointment of policemen, proclamation of a camp
    location, enforcement of orders by overseers or masters of ceremonies, punishment
    for disobedience, prescribed tent types, formation of a tribal camp circle with
    a northern opening, and preparation of the interior ground to protect horses from
    stumbling.
