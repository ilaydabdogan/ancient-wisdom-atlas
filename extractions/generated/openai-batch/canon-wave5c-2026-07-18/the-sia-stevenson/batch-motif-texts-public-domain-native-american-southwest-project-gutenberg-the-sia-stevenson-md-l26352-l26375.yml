canonical_text:
  quote: ''
  summary: The passage describes a ceremony involving a medicine man, a knife, a medicine
    lodge, spectators, partisans, and candidates. Candidates fast, are covered with
    white clay, dance, and may undergo severe bodily tortures that leave prominent
    weals. Matthews comments on Maximilian's comparison of Mandan and Hidatsa ceremonies,
    saying their resemblance is limited to fasts and tortures while their allegory
    differs.
  language: English
  quote_policy: summarized
