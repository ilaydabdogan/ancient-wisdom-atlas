  summary: The passage summarizes Mandan beliefs about several superior beings, their
    hierarchy, attributes, celestial residences, and the cult of the Old Woman who
    Never Dies, including a corn dance in which spring waterfowl symbolize cultivated
    grains and serve as crop omens.
