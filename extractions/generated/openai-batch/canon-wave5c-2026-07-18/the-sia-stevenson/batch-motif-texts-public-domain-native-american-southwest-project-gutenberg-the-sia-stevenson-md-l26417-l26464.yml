literal_observations:
- id: obs:1
  text: The passage says the Mandan believe in several superior beings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord of Life is described as the most powerful being, creator of earth,
    man, and every existing object; he is also described as having a tail and appearing
    as either an aged man or a young man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Numank-Machana, the First Man, is ranked second, was created by the Lord of
    Life, and is also described as divine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ohmahank-Chika, the Lord of Evil, is described as a malignant spirit with
    influence over men but less power than the Lord of Life and the First Man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rohanka-Tauihanka is said to dwell in Venus and protect mankind on earth;
    another unnamed power is said to move over the earth in human form and is called
    the Lying Prairie Wolt.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ochkih-Hadda is said to be difficult to classify; dreaming of him is said
    to predict imminent death, and he is said to have once come to the villages and
    taught many things.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Mandan are said to fear Ochkih-Hadda, offer him sacrifice, and keep a
    hideous image representing him in their villages.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sun is described as the residence of the Lord of Life, and the moon as
    the dwelling of the Old Woman who Never Dies.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Old Woman who Never Dies has six children, three sons and three daughters,
    who inhabit certain stars or celestial bodies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The cult of the Old Woman who Never Dies is associated with a corn dance described
    as the consecration of grain to be sown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Old Woman who Never Dies is said to send spring waterfowl, swans, geese,
    and ducks as symbols of cultivated grains and to cause those plants to grow.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The passage gives bird-grain correspondences: wild goose signifies corn,
    geese signify gourd, and duck signifies beans; eleven wild geese together in spring
    are said to be a sign of an especially fine corn crop.'
  category: relationship
  evidence_refs:
  - ev:9
