canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Knife Society ceremonial sequence involving
    a cloud bowl, directional invocation, animal objects or animals placed at an altar,
    pollen, smoke, plumes, and prayers. It then explains an Ant Society sand painting
    used for healing an invalid: an Ant chief addresses the illness, prey animals
    draw ants from the body, an eagle eats them, the painting is disposed north of
    the village, and meal from the erased painting is rubbed on participants for purification.
    The passage ends with an evening food offering made toward the cardinal points
    to an animal Ko''pTshtaia, with prayer to the cloud people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meal was placed in a circle with a yucca cincture pad, and the cloud bowl
    was held above the officiant's head while cloud people of the directions and the
    whole world were invoked to water the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cloud bowl was set on the pad, and a reed eight inches long was laid across
    it from northeast to southwest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vice ho'naaite reduced a root intended to produce suds to powder and placed
    it in a heap before the cloud bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite brought a parrot and a twelve-inch white stone bear; the bear
    was wrapped in white buckskin and the parrot was under the ho'naaite's blanket
    before they were deposited before the altar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bear and parrot had eagle plumes attached to their necks with cotton cord
    and were treated with prayer, meal or pollen, smoke, and sprinkling from a medicine
    bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes two Knife Society slat altars and says the second was made
    in case of failure of the first.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ant Society sand painting includes a meal painting emblematic of clouds,
    bear-leg skins, an Ant chief in fringed buckskin, ant houses, and an eagle.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:8
  text: In the sand painting description, the Ant chief carries lightning in his left
    hand and his words are shown as passing in a line from his mouth to the invalid.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The invalid stands on a sacred Tusayan blanket while society members perform
    incantations asking prey animals to draw ants to the surface of the body; the
    ants are brushed off and an eagle is addressed to eat them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the healing sequence, the images of the Ant chief, eagle, and ant houses
    are gathered into the blanket and deposited north of the village; the remaining
    meal painting is erased from the cardinal points toward the center.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Meal from the erased painting is rubbed on the invalid and then on the society
