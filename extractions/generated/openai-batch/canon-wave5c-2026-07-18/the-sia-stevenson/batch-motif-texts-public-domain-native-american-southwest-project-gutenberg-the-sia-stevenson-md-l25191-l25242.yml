canonical_text:
  quote: ''
  summary: 'The passage explains Dakota ideas of wanagi or spirits: a living person
    may have multiple spirits, with different postmortem destinations or attachments,
    including the grave, the place of the departed, a picture, a hair lock, the body,
    the south or west, enemy country, or possibly a new animal or child body. It also
    states that the “happy hunting grounds” idea is not part of Dakota creed, though
    individual Dakota may have learned similar ideas from white people.'
  language: English with Dakota terms
  quote_policy: summarized
