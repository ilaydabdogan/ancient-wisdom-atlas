canonical_text:
  quote: ''
  summary: The section describes Thunder-beings and the Sun as Fire powers, contrasts
    usually maleficent Thunder-beings with the beneficent Sun, and surveys red color,
    fire paint, war color, fire symbols, directional associations, and fourfold color
    or sentinel arrangements among Omaha, Osage, Dakota, Kansa, and related named
    groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thunder-beings and the Sun are identified as Fire powers; Thunder-beings are
    usually described as maleficent, while the Sun is described as a beneficent Fire
    power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thunder-beings were sometimes addressed as grandfathers and could be induced
    to grant success in war to suppliants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The East is described as probably considered a source of light and life in
    reference to the Sun, while the West is associated with taking life in hunting
    or war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Red is identified among the Omaha as the color symbol of the East and is also
    described as symbolic of war.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Osage Tsiou gentes use red fire paint when fire prayers are said.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red is stated to be a war color among the Dakota, Omaha, Kansa, and Osage.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Tsiou crier received a knife in his left hand with the handle painted red,
    and a Hafii[a crier received a hatchet in his right hand with the handle reddened.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a comrade's death, surviving Osage removed bark from a post oak, painted
    the blazed tree red, broke four arrows, and left the arrows and paint by the tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Paha°le-gaqli, a Kansa war chief, is described with his face painted red,
    and his war chart contained a fire symbol that he feared to copy for the author.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The fire symbol in Paha°le-gaqli's war chart is described by the author as
    probably consisting of four firebrands placed at right angles and meeting at a
    common center.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Omaha and Osage traditions included such a fire symbol,
    and that successful Omaha warriors could redden their weapons when joining in
    the dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dakota sentinels for the Wakinyan are listed as deer at the north, butterfly
    at the east, beaver at the south, and bear at the west; an alternative arrangement
    is discussed if conformed to another figure.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Dakota wakan men say the Wakinyan are of four colors: black, yellow, scarlet,
    and blue.'
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'In an Omaha legend, four Thunder men have different hair colors: white, red,
    yellow, and green.'
  category: attribute
  evidence_refs:
  - ev:10
