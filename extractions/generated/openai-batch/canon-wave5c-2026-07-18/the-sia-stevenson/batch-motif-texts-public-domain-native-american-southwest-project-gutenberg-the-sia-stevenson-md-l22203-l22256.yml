canonical_text:
  quote: ''
  summary: The passage describes public or tribal sacred objects, including pipes,
    sacred bags, medicine bags, stones, and a hidden iron or stone oath object. It
    reports rules for handling and viewing them, their use in war, healing, dance,
    truth-testing, and named custodians of sacred pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred pipes are used only on solemn occasions and are kept wrapped in skin
    coverings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacred bags called waruxawe are made from animal skins, treated as mysterious
    and deeply reverenced, and women are reported as barred from touching them in
    one described context.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Iowa are reported as having had seven waruxawe, described as related to
    one another as brothers and sisters and used by war parties; after return from
    war they were opened for the scalp dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Iowa waruxawe are said to contain animal and bird skins with medicine,
    wild tobacco, war medicine, and war clubs; one principal bag had lost its war
    club and pipes or whistles by the time referenced.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seven Waci waruxawe are described as bad-medicine bags used with whistles
    to deprive enemies of power so they could neither shoot nor run.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tee or buffalo medicine bags are described as non-war bags used to heal the
    wounded, containing medicine, deer-hoof shaking sticks, buffalo tail, and possibly
    elk throat skin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ta or deer medicine bags are said to contain sacred otter skins used in the
    Otter dance.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some sacred bags contain round stones that warriors rub over themselves before
    war to prevent being killed or wounded.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The waruxawe is always carried with the same end foremost, with animal or
    bird heads kept in the same direction; a leader once broke up a war party by turning
    the bag around.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Iowa are reported to have a mysterious iron or stone used to test men
    or make them swear to speak truth; it had not been seen in living memory in 1848,
    was wrapped in seven skins, was not to be seen by women even in its outer covering,
    and was said to be deadly for Mr. Hamilton to view.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cka^oinye reported four Tuna^p'i men as keepers of sacred pipes, and the passage
    also reports two sacred-pipe keepers in the Aruqwa or Buffalo gens of the Oto.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
