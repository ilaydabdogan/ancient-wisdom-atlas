canonical_text:
  quote: ''
  summary: The passage concludes a wolverene tale in which the wolverene returns with
    meat and fat, later loses most of his stored meat after looking back at a loaded
    sled despite an injunction, and says his wolf brothers have ruined him. A second
    tale describes starving Indians who lack stored food, an old man with abundant
    meat and fat, a hungry boy sent to him, a bargain in which the old man offers
    food if the boy's father gives him his daughter, a feast with arranged clothing
    and seating, and the setting of thirty deer snares that each catch a deer as abundance
    returns.
  language: English
  quote_policy: summarized
