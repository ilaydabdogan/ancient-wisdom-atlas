canonical_text:
  quote: ''
  summary: 'The passage describes household utensils and practices: wooden vessels
    used for water and drinking, spruce-bark baskets for berries and small objects,
    deer-leg-skin bags for larger objects, and informal eating directly from a pot
    or kettle. It also states that the wooden vessels are identical in shape and function
    to those made by Yukon River Indians of Alaska.'
  language: English
  quote_policy: summarized
