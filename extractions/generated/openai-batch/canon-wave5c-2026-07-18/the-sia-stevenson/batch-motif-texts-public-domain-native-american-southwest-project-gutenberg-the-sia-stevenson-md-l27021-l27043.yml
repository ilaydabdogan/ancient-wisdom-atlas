  quote: ''
  summary: The passage reports that the Hidatsa have strong faith in dreams and usually
    consider only dreams following prayer, sacrifice, and fasting to be oracular.
    It then describes men called “berdaches” by French Canadians and “iniati” by the
    Hidatsa, who wear women’s clothing and perform women’s camp duties; the passage
    notes that most whites incorrectly suppose them to be hermaphrodites and gives
    a partial Hidatsa etymology.
