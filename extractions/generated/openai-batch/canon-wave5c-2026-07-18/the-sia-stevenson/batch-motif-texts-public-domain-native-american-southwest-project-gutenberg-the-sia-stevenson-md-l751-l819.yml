canonical_text:
  quote: ''
  summary: The passage introduces Sia cosmogony. In the lower world, a spider creator
    is alone, marks crossed meal lines, places two mysterious parcels, and sings.
    The parcels shake like rattles and produce two women, followed by people, animals,
    birds, and other animate beings in a dark, crowded world. The two women are named
    as mothers of Indians and other nations, and the creator assigns clans. He then
    creates cloud, lightning, thunder, and rainbow peoples for rain, divides them
    among the cardinal directions plus zenith and nadir, and gives each a mountain-spring
    home with a summit tree and use of the middle world plain. The excerpt ends as
    he commands the Sia to smoke so the second creation will not be seen.
  language: English with Sia names
  quote_policy: summarized
