  quote: ''
  summary: The passage states that the Mandan and Hidatsa are described as believing
    in many beings associated with heavenly bodies rather than in one Great Spirit,
    and as performing sacrifice, invocation, lamentation, fasting, and penance to
    propitiate them, with great stress placed on dreams. It then states that the Crow
    or Absaroka, closely related to the Hidatsa, regard the sun, moon, and tobacco
    as especially sacred, and that children wear a small wrapped portion of tobacco
    around the neck as an amulet.
