canonical_text:
  quote: ''
  summary: The passage reports that, after the production of earth and humans, the
    Unktehi gave the Indians a mystery sack and instituted the Wakan wa^ipi or mystery
    dance. It describes the ordained animal-skin materials and four wakan medicines
    preserved in the sack, whose combined influence is said to be irresistible to
    unassisted humans. It then states that members who violate obligations will be
    punished by beings or agents in forest, earth, air, and water. The passage also
    records comparative ethnographic comments about Dakota, Winnebago, and Omaha medicine
    or mystery-dance practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Immediately after the production of the earth and humans, the Unktehi gave
    the Indians the mystery sack and instituted the Wakan wa^ipi, or mystery dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mystery sack was ordained to consist of the skins of otter, raccoon, weasel,
    squirrel, loon, one variety of fish, and serpents.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sack was also ordained to contain four wakan medicines representing fowls,
    medicinal herbs, medicinal trees, and quadrupeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The representative medicines are female swan down, grass roots, bark from
    tree roots, and hair from the back or head of a buffalo.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The combined contents of the sack are said to produce a wakan influence that
    no unassisted human being can resist.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members who violated obligations of the Mystery dance were said to be certain
