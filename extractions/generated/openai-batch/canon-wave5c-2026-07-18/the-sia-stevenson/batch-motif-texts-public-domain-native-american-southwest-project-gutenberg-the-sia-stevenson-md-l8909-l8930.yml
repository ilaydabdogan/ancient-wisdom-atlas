canonical_text:
  quote: ''
  summary: 'The passage reports suicide methods and causes in a northern locality,
    then describes scarcity-related violence and survival crises: a husband blocks
    his wife inside a snow hut after discovering her hidden fish, where she dies of
    starvation; other families are reported to resort to cannibalism after consuming
    dogs and skin-made goods; and unlucky or disliked women may be expelled from camp
    and left to seek relief or die.'
