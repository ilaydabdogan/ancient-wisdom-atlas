canonical_text:
  quote: ''
  summary: The passage describes the origin and succession of Sia cult societies in
    the lower world and upper world. Ct'sft, directed by Sussistinnako, establishes
    lower-world animal societies and transmits medicine secrets. Serpent societies
    are assigned to directions and cosmic zones. Ko'shairi and Quer'ninna receive
    rain and fertility medicines and become models for ceremonial attendants of Ka'suna
    personators. After destroying enemies, Ma'asewe organizes similar upper-world
    societies, beginning with the Knife society associated with sun-given lightning
    arrows.
  language: English with Indigenous terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ct'sft is described as being directed by Sussistinnako and as originating
    cult societies of the lower world, including societies that received secrets for
    healing the sick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The societies are listed in a line of succession, and many are named for the
    animals of which they are composed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first society is the Ka'plna, composed only of spider people; Sussistinnako
    is named as its theurgist, and the members know his medicine secrets.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Societies of the bear, cougar, badger, wolf, and shrew follow the spider society.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lower-world Knife society is composed of cougar and bear societies consolidated
    together, with cougar placed first and bear second.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Six snake societies are organized for north, west, south, east, heavens, and
    earth, each with a named serpent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The north and south serpents have cloud emblems; the west and east serpents
    have relations with sun and moon and are painted with crescents; the serpent of
    the heavens has a brilliant crystal-like body; the serpent of the earth is spotted
    like the earth and enters a house in the earth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Seven ant societies follow the snake societies, and several animal, snake,
    ant, and eagle societies are said to receive medicine secrets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ko'shairi receives valuable rain medicine directly from the sun, and his songs
    are chiefly invocations for rain to fructify the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Quer'ninna has an office similar to Ko'shairi's, is associated with the house
    of the moon, and receives a medicine secret connected with making the earth and
    women pregnant.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the Sia, animals, and Ka'suna enter this world, the Ka'suna are directed
    west, masks are made to represent them, and Ko'shairi and Quer'ninna are sent
    eastward to live near the sun's house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ko'shairi acts as courier between the sun and Ka'suna and as mediator between
    the Sia and the sun.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Orders named for Ko'shairi and Quer'ninna are organized to attend Ka'suna
    personators, and their representatives are described with distinctive body painting
    and hair arrangements.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When the Ka'suna appear, Ko'shairi and Quer'ninna attendants adjust their
    apparel and perform buffoonery that amuses spectators.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After destroying bad people, Ma'asewe tells the Sia leader to organize societies
    similar to those of the lower world and to learn medicine secrets from animals.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The first upper-world society originated by Ma'asewe is the Knife society,
    because the enemies were destroyed through knives or arrows given by the sun father;
    in this case Knife means a lightning knife or arrow.
  category: relationship
  evidence_refs:
  - ev:12
