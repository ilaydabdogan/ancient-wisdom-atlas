candidate_motifs:
- id: motif:1
  label: Divinely directed origin of cult societies
  taxonomy_refs:
  - wisdom
  basis: The passage states that Ct'sft, directed by Sussistinnako, originates lower-world
    cult societies and transmits secrets for healing.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage describes society origins and secret knowledge, but does not
    describe an initiation ritual in detail.
- id: motif:2
  label: Animal societies as holders and teachers of medicine secrets
  taxonomy_refs:
  - wisdom
  basis: Animal-named societies are listed as receiving medicine secrets, and Ma'asewe
    later tells the Sia to learn medicine secrets from animals.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:11
  confidence: high
  cautions: The exact ritual content of the medicine secrets is not described.
- id: motif:3
  label: Directional and cosmic serpents
  taxonomy_refs:
  - serpent
  basis: Six snake societies are assigned to north, west, south, east, heavens, and
    earth, with attributes linking them to clouds, sun, moon, crystal brilliance,
    and earth.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a classification of serpents rather than a narrative
    episode centered on a serpent.
- id: motif:4
  label: Celestial rain and fertility medicine
  taxonomy_refs:
  - seasonal_cycle
  basis: Ko'shairi receives rain medicine from the sun, and Quer'ninna receives medicine
    connected with making earth and women pregnant.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage links rain, earth fertility, and human pregnancy, but it does
    not narrate a full seasonal-cycle myth.
- id: motif:5
  label: Masked personation with ceremonial fool attendants
  taxonomy_refs:
  - trickster_boundary
  basis: Masks represent the Ka'suna, while Ko'shairi and Quer'ninna orders attend
    the personators and perform buffoonery for spectators.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The attendants' buffoonery is explicit, but the passage does not call
    them tricksters or explain a boundary-crossing function.
- id: motif:6
  label: Lightning weapons from the sun enable destruction of enemies and society
    foundation
  taxonomy_refs:
  - culture_hero
  - divine_parent_child
  basis: The upper-world Knife society is founded first because enemies were destroyed
    through knives or arrows given by the sun father; the implement is identified
    as a lightning knife or arrow.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The destruction of enemies is summarized briefly and appears to refer
    to a prior episode not fully narrated in this passage.
- id: motif:7
  label: Upper-world replication of lower-world ritual societies
  taxonomy_refs: []
  basis: Ma'asewe explicitly says upper-world societies should be similar to those
    instituted by Ct'sft in the lower world.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage provides a parallel sequence but only begins the upper-world
    list before the excerpt ends.
