  summary: The passage is an ethnographic discussion distinguishing Omaha and Ponka
    myths and stories from sacred or superhuman matters associated with Wakanda, visions,
    secret societies, and ritual observances. It also discusses variation in myth
    transmission, seasonal rules for telling myths, Zuni and Cherokee parallels for
    differentiating folklore and cult lore, and a possible link between myths, personal
    names, Four Peaks, sweat-bath stones, and two superior Wakanda powers above and
    in the ground.
