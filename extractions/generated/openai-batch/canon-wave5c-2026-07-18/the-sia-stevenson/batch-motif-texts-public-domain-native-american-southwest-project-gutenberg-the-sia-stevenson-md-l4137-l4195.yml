canonical_text:
  quote: ''
  summary: The passage describes a Sia Giant Society ceremonial sequence in which
    participants sprinkle an altar with medicine water using plumes, invoke cloud
    people and animals of the cardinal points, chant, distribute medicine water, prepare
    and deposit offerings at a Ko'pishtaia shrine, return for prayer, and close with
    food arranged by the woman and girl.
  language: English with Sia terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite dipped plumes into medicine water and sprinkled the altar while
    calling for the cloud people to gather and water the earth so it would be fruitful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each member repeated the sprinkling with a similar prayer, and the little
    girl participated enthusiastically in calling to the cloud people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men struck plumes held in their left hands with rattles held in their right
    hands, while the woman and child struck a wand held in the left hand with one
    held in the right.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each person repeated the altar sprinkling six times with appeals to animals
    of the cardinal points, then returned to place in the line.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a stanza was sung, the altar was again sprinkled six times by each member
    while the choir was grouped before the altar and the ho'naaite sat behind it in
    song.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ti'amoni and the ya'ni^siwittanni advanced from opposite ends of the line
    and sprinkled toward the cardinal points along the line of meal, repeating the
    sprinkling twice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bowl of medicine water was placed before the fetiches and on the line
    of meal.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ya'ni^siwittanni administered medicine water to those present; the girl
    received the first draught from an abalone shell, the woman and infant were served
    next, and the ho'naaite received the last draught.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After handling the ya'ya, the ya'ni^siwittanni left the house and expelled
    medicine water through his teeth toward the cardinal points before returning the
    bowl and ya'ya before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ho'naaite gathered the ha'chamoni, took meal, prayed silently before the
    altar, sprinkled the altar and ha'chamoni, and divided the offerings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The ti'amoni and a companion clasped the ho'naaite's hands, held eagle plumes,
    responded to his low litany, and received plumes placed on blankets over their
    left arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ti'amoni and companion left the ceremonial chamber in darkness to deposit
    offerings at a shrine of the Ko'pishtaia, then returned and prayed before the
    altar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: All members gathered before the altar to ask that their prayers be answered,
    after which the woman and girl arranged food bowls and a feast closed the ceremonial
    at 2 a.m.
  category: sequence
  evidence_refs:
  - ev:8
