canonical_text:
  quote: ''
  summary: The passage describes Hidatsa tribal and personal fetiches, including animal
    skins and bones, tree and stone fetich places, a village pole figure associated
    with Grandmother, animal personal medicines and charms, and two reported child/fertility
    oracles connected with a cavern or hills near Knife River/Knife Creek.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hidatsa fetiches include skins of foxes and wolves; when going to war, warriors
    wear a strip from a wolf skin with the tail down the shoulders and the wolf-head
    skin hanging on the breast.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buffalo heads and neck bones are described as fetiches; the bones are preserved
    and sometimes fumigated with smoke from sweet-smelling grass on live coals, with
    the stated purpose of preventing buffalo herds from moving too far away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain trees and stones are fetiches, and red cloth, red paint, and other
    articles are offered at those places to superhuman powers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the principal Hidatsa village there was a long pole with a figure of a
    woman, described as probably representing the Grandmother who first gave them
    kettles; the figure included brushwood, a leather dress and leggings, an Artemisia
    head, and a feather cap.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Every Hidatsa man is said to have a personal medicine, usually an animal,
    and to carry the head, claws, stuffed skin, or another representative of it on
    war parties, hunts, and other excursions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A small piece of deer or antelope bone is tied to a young colt’s neck to make
    it fleet, and beaver teeth are worn by little girls to make them industrious.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Makadistati, or house of infants, is described as a cavern near Knife
    River, thought to extend far into the earth and having an entrance only a span
    wide; it was visited by a childless husband or barren wife.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some Hidatsa are reported to imagine that their children come from the Makadistati;
    marks of contusion on an infant are attributed to kicks from former comrades when
    the infant was ejected from its subterranean home.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: James reports two conical hills near Knife Creek, one of which was believed
    to impart prolific virtue to women who resorted to it because of barrenness.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: James reports that two very small children were seen on a hill and eluded
    pursuers, including a mounted pursuer; later the children were no longer seen
    and the hill lost its reported prolific property.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Matthews says James’s hill account seems to refer to the Makadistati, but,
    if so, he believes it is incorrect in some respects.
  category: speech
  evidence_refs:
  - ev:8
