canonical_text:
  quote: ''
  summary: The passage reports Mandan beliefs about multiple spirits within a person,
    postmortem destinations, southern afterlife villages, an alternative view of spirits
    dwelling in the sun or stars, and a future-life tradition linked to an underground
    origin village near a subterranean lake. It also reports an ascent from underground
    by grape-vine, the breaking of that vine, and a return of the dead to ancestral
    seats, with a source caveat about possible white influence on the clause concerning
    the wicked.
  language: English
  quote_policy: summarized
