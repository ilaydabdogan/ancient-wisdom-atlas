canonical_text:
  quote: ''
  summary: The passage lists beliefs and practices reported as absent or limited among
    the Omaha, Ponka, Kansa, and Osage. It says ancestors were not worshiped, the
    Satan/devil concept was learned from white people, hero and demigod worship were
    absent though named heroes were used to frighten children, phallic worship was
    denied by informants with a note about Ponka borrowing the sun-dance from Dakota
    neighbors, and totems, shamans, altars, incense, human sacrifice, and cannibalism
    were not worshiped or practiced except for limited ritual-smoke or cedar-frond
    cases.
  language: English
  quote_policy: summarized
