canonical_text:
  quote: ''
  summary: 'An ethnographic description of a curing ceremonial for a sick boy: a sand-painting
    altar is prepared with fetiches, water, meal, bear objects, and a sacred blanket;
    male ritual officers perform offerings, make meal lines linked in the passage
    to the four winds, don ritual ornaments and face paint, and bring the sick child
    to the altar where he throws meal toward it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ritual began the night after a rain ceremonial and was described as continuing
    for four consecutive nights for curing the sick by the brushing process.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sand-painting was made at the east end of the room, with ya'ya, stone fetiches,
    a medicine bowl, bear-leg skins, and a folded white embroidered sacred Tusayan
    blanket placed around it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Female members served refreshments to the five male members of the medicine
    division before the ritual actions described in the room.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five men sat in a line behind the fetiches, with the ho'naaite identified
    as the central figure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ti'amoni brought a vase of water and a gourd, and the ho'naaite dipped
    six gourdfuls of water into the medicine bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ho'naaite held two eagle plumes, repeated a low prayer, scattered bread
    and stew before the fetiches, and threw additional food outside as an offering
    to animals of the cardinal points.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The vicar spread the Tusayan blanket and meal lines were sprinkled from the
    blanket toward the bear fetich, toward the entrance, and toward the south and
    north edges and walls; the passage states that four of these lines were symbolic
    of the four winds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fresh meal ground by a woman in an adjoining room was received by the ti'amoni
    and mixed with remaining meal from the pottery bowl, which the passage says lent
    a sacred character to the fresh meal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ho'naaite put on a bear-claw necklace with a reed whistle and white eagle
    plumes after waving it around the white bear fetich; other members put on similar
    necklaces, and some added arm amulets.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ti'amoni applied red pigment to his face, and other members applied galena
    to parts of the face; the passage says the paint was put on to insure correct
    singing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Corn husks were handed to a member and handled under his blanket; the narrator
    cautiously states that they were thought to be made into funnels holding tiny
    pebbles from ant hills.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The ho'naaite divided a bunch of straws into five portions, reserving one
    for the absent vice-ho'naaite.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The vice-ho'naaite returned carrying the sick child, walked on the line of
    meal, set the child on a low stool on the blanket, and instructed the child to
    throw a pinch of meal toward the altar.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote states that female members were never present at the brushing ceremonial,
    and that certain ya'ya associated with a woman, a child, and one captured from
    the Navajo were not present on this occasion.
  category: other
  evidence_refs:
  - ev:10
