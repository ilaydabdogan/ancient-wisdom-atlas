canonical_text:
  quote: ''
  summary: 'An ethnographic observer describes a feast celebrating hunting success:
    a specially constructed tent with displayed animal skins, drumming and songs,
    distribution of pemmican, a prohibition on removing food remnants because deer
    would leave, later admission of women to eat remnants, and a concluding dance.
    The passage then describes men playing checkers during hunting waits and winter
    evenings, with a brief note on dreams being recounted and expounded.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Feasts are described as being given at intervals to celebrate hunting success
    and similar achievements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described feast took place in a nearly oval tent on top of a high wall
    of rock; the entrance faced southeast.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Animal skins, including wolves, wolverine, beaver, otter, foxes, muskrat,
    and reindeer, were displayed on a pole connected with the tent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A drum sounded inside the structure before the observer entered, and an old
    man later prepared and played the drum to accompany songs.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: The floor inside the structure was covered with carefully arranged spruce
    boughs, and piles of deerskins and cloth-covered heaps were present.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Guests were served pemmican, described as a compound including rancid tallow,
    marrow, and pounded dried reindeer meat.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: When the observer attempted to take away a remnant of pemmican, he was told
    this was forbidden because it would cause deer to desert the area and the people
    to starve.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women were excluded during the earlier part of the feast and were later to
    be invited to eat remnants left by the men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After two days the feast ended with a dance in which men sang and kicked up
    their heels while women swayed their bodies and gave plaudits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The host is described as unusually successful in capturing fur-bearing animals
    and as displaying wealth before giving the feast.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Men are described as playing draughts or checkers in tents or on hillsides
    while awaiting deer, and as using small portable boards during winter trips.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: During winter evenings by a flickering fire, a tired companion might wake
    from sleep, relate a wondrous dream, and have it expounded by listeners.
  category: sequence
  evidence_refs:
  - ev:9
