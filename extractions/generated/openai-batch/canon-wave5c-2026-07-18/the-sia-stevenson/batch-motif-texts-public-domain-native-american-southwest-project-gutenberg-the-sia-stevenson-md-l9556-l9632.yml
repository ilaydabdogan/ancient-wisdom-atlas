canonical_text:
  quote: ''
  summary: 'The passage describes mortuary customs: binding and wrapping the body,
    removing a dying person outdoors to avoid the spirit returning through the house,
    exposing or placing the body near rocks, shore, or hilltop with stones around
    it, grief practices, social hardship for survivors, and beliefs that death separates
    soul and body, with spirits going either upward to the sky or downward into the
    earth according to conduct and manner of death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body of a dead person is bound with cords, with knees drawn up, heels
    placed against the body, arms tied down, and a deerskin or sealskin covering wrapped
    and fastened around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nearest relatives remove a dying invalid outside the house; if death occurs
    inside, the body must pass through a hole cut in the side wall rather than through
    the door, and the hole is then closed to prevent the spirit from returning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The body is exposed in open air by a large rock or taken to the shore or a
    hilltop, where stones are piled around it to keep birds and animals away.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: It is considered a serious offense if a dog is seen eating flesh from a body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A beloved dead child may sometimes be carried with its people if they leave
    for another place before decomposition has gone too far.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dying person is described as resigning himself to fate calmly, with little
    complaint during illness and little visible reaction even during severe pain.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Friends often display much grief, though extended weeping is said to be exceptional;
    a husband’s death can leave the wife and small children in hardship.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people are said to believe in a future state and to regard death as the
    separation of the soul from the material body.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The spirits of the soul are said to go either upward to the sky or downward
    into the earth, and the two classes of spirits can communicate with each other.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The soul’s destination is said to depend on the person’s conduct on earth
    and especially on the manner of death; those who die by violence or starvation
    and women who die in childbirth are said to go to the region above.
  category: sequence
  evidence_refs:
  - ev:8
