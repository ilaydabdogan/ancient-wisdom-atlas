canonical_text:
  quote: ''
  summary: The passage describes tattooing and clothing practices among the Koksoagmyut/Hudson
    Bay Eskimo, including former and reduced tattooing customs, a puberty tattooing
    procedure performed by an older woman in seclusion over four days, clothing and
    contact restrictions for menstruating women, animal-skin garments, children’s
    and infants’ dress, footwear practices and exchange, and hooded coats and caps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women in former years were tattooed with curved lines and rows of dots on
    the face, neck, arms, and legs up to mid-thigh.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The former tattooing custom declined after some dhanuin declared that prevailing
    misfortune resulted from tattooing; present tattooing is described as only a few
    single dots on the body and face.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At puberty, a girl is taken to a secluded place by an old woman skilled in
    tattooing, stripped, and tattooed with a needle and a mixture of half-charred
    moss lamp wick and lamp oil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tattooing mixture mixes with blood and leaves a dark-bluish spot after
    a day or two; the operation continues for four days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the girl returns to the tent, it is known that she has begun to menstruate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A menstruating woman must wear modified lower garments, turn up and stitch
    the hind flap of her coat, leave parts of the right hand uncovered in a half-glove
    arrangement, leave the left hand uncovered, and avoid touching certain skins and
    foods in use at that season.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Koksoagmyut are described as clothed almost entirely in animal skins,
    with reindeer skin favored and seal skins also used.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Common garments include hooded frocks, breeches, boots, mittens, and seal-entrail
    rain frocks worn over furs in stormy weather.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aged people and orphans may have to use cast-off apparel, and worn clothing
    is patched when skin and hair are damaged.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Young boys and girls are dressed alike, and females do not wear adult garments
    until puberty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Infants small enough to be carried in the mother’s hood may be dressed in
    reindeer-fawn skins, with a joined trouser-and-body garment, cap, and skin stockings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Cold-weather foot protection includes short stockings called duffles, worn
    under smoked deerskin moccasins.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Eskimo women sometimes employ Indian women to make moccasins and give sealskin
    boots in return.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The hood of the frock is normally the head covering, but the passage describes
    a cap obtained from a Northerner trader that was apparently copied from a white
    man’s cap and made with bird skins and a sealskin neckpiece.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The coat worn by men and boys, and by girls until womanhood, is a loose hooded
    shirt-like garment, often made of reindeer skin, with some regional variation
    in front opening and occasional use of harp seal skin.
  category: object
  evidence_refs:
  - ev:9
