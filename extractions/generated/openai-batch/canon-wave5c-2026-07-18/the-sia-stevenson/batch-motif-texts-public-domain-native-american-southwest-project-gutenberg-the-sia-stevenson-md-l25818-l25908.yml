canonical_text:
  quote: ''
  summary: The passage describes Dakota/Teton doctors who claim spirit instruction
    and indwelling animal or mysterious helpers; healing acts involving sucking, extracting,
    fumigating, and ritual use of a catfish; disease causes attributed to ghosts,
    gophers, foods, and conduct; and bodily signs associated with stealing, lying,
    cramps, sores, and boils.
  language: English with Dakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names a Grizzly Bear doctor and a root-prescribing doctor, and
    says medicine practitioners claim interviews with spirits whose messages they
    do not reveal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some sickness cases the doctor sucks the patient's flesh, pretends to remove
    something, spits material from the mouth, and tells the patient's mother the cause
    and likely outcome.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Doctors are said to claim that a small red hawk, common woodpecker, buffalo,
    rattlesnake, or grizzly bear is inside them; when a doctor kicks the ground, something
    within is heard singing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When sucking does not remove anything, the doctor asks a favor of a mysterious
    being dwelling within himself; the being cries out and the doctor succeeds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old doctor is described as vomiting into a bowl of water, after which a
    water-snake appears; when he opens his mouth again, the snake glides into it and
    disappears down his throat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A doctor says a boy has been made crazy by a ghost, fumigates him, sucks at
    his chest, draws blood, and declares that a flat serpent-like object is in the
    boy's side.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A catfish is caught at the doctor's direction, prayed over, marked on the
    head with a knife, cooked, and eaten by the sick boy, who recovers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Scrofulous neck sores are attributed to gophers that magically shoot grass
    at persons; the few doctors who can cure this pretend to extract pieces of grass
    from the neck.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: People are described as afraid of gophers and gopher hills, while a mysterious
    person with remedies can approach or touch a gopher hill without harm.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Eating specific animal parts is said to cause boils, facial sores, cramps,
    leg pain, or lameness.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Warts are said to betray a person given to stealing, and peeling skin on the
    hard palate is said to indicate untruthfulness.
  category: attribute
  evidence_refs:
  - ev:10
