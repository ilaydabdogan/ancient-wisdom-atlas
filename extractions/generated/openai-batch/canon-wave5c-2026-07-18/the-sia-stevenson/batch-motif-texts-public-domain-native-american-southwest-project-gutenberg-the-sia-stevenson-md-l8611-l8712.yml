canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Indian inhabitants of
    the region. It describes the Mountaineers' range, subsistence, clothing, trade,
    missionary contact, and relations with Innuit and Naskopies. It then describes
    Indians southwest of Ungava and Little Whale River Indians in appearance, dress,
    hunting and fishing, whale capture, canoe use, and a polygamy incident involving
    missionary U. J. Peck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Indian inhabitants of the region may be divided
    into three groups that differ slightly in speech and even less in habits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mountaineers range south of Hamilton Inlet toward the Gulf of St. Lawrence
    and trade at accessible coast stations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mountaineers' stated foods include reindeer, porcupine, geese, ducks,
    ptarmigan, grouse, hare, and other birds; reindeer scarcity makes the food supply
    precarious.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Mountaineers use tanned deer skin for clothing when available and cut
    parchment-condition reindeer skins into fine lines for snowshoe netting and other
    purposes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mountaineers procure and barter furs including marten, mink, beaver, muskrat,
    lynx, wolverine, wolf, fox, and black bear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage reports former bloody warfare between the Mountaineers and the
    Innuit and explains 'Naskopie' as a reproach connected with a failed promise to
    assist against the Innuit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Indians southwest of Ungava are described as differing from the Naskopies
    in speech, average height, complexion, hair, and bodily appearance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The women of the southwestern group are described as wearing trader-procured
    cloth and imitating the dress of white women at Moose Factory; some are said to
    make fancy articles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men of the southwestern group hunt and fish; recent reindeer scarcity around
    Fort George led many to move east near or with the Naskopies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The southwestern Indians are said to assist in capturing white whales and
    to eat whale flesh and blubber, while the Naskopies refuse it as too fat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Little Whale River birch-bark canoes are described as turned up at each end,
    adapted to swift currents, and sometimes used with sails or lashed together as
    double canoes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that some men in the Ungava district took two wives; after
    U. J. Peck rebuked them, they sent second wives away until he left and then took
    them back.
  category: sequence
  evidence_refs:
  - ev:10
