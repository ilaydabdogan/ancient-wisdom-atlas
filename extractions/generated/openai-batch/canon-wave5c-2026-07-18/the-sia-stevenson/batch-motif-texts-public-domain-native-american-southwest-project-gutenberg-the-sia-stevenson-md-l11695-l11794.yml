literal_observations:
- id: obs:1
  text: The passage says sleds shod with bone are uncommon in the observed context,
    while bone shoeing is described as customary among Eskimo groups farther north
    and especially farther west.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An observed western Hudson Strait example had part of the runner curve and
    runner shod with bone and reindeer horn pieces fastened by pegs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mud used on runners can loosen after a few hours of warmth, and rough ice
    or sand-drifted snow can roughen the sled's running surface.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: To repair runner damage, the native traveler stops for water, applies it to
    the runner, and rubs it evenly until an ice coating forms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dog harnessing is described as two nooses joined by short straps, with a long
    thong trace attached to each dog.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Variable trace lengths attach to a heavier bridle with a toggle, placing the
    dogs so they can move freely among rough ice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rear end of the bridle has a yoke made of two stout thongs looped over
    toggles on the inner sides of the runners.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Loads are placed so they do not project far over the sled sides and are distributed
    to avoid excessive weight at the front or rear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Very rough ice may require multiple people: two to attend the sled, one to
    free traces, and a fourth to lead or drive the dogs.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The driver is described as always armed with a whip, and individual whips
    vary in form.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The whip handle has a wrist loop, and the lash is made of plaited thongs that
    taper along its length.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Some native users are described as highly dexterous with the whip, and children
    practice with it as soon as they can manage it.
  category: action
  evidence_refs:
  - ev:8
