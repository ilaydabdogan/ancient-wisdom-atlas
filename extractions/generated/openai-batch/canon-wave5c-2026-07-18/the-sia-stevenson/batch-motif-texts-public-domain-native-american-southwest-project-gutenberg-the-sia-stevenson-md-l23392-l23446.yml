  quote: ''
  summary: The passage describes the setting up of a tent of preparation within a
    sun dance camping circle, the use of borrowed skins and curtains, placement and
    smoking or fumigation of ritual objects, use of sage and medicines, assembly of
    candidates in buffalo robes, and rehearsal of sun dance songs with singers and
    drummers.
