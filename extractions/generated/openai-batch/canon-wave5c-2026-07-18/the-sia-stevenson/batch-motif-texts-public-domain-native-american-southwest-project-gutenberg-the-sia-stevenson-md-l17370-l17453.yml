  text: In the second tale, a little boy appears near the fire and says his grandfather
    brought him; the old man outside rebukes the parents for leaving the child to
    perish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old man spirit refuses an initial invitation, enters only when the boy
    conducts him, and seats himself across the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people prepare to snare deer, the boy accompanies them, and the old man
