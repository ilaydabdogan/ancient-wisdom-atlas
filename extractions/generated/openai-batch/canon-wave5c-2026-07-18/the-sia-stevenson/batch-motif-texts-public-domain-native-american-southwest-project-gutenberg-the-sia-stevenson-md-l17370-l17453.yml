canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a man’s wife and children
    are killed by a brother/uncle figure, the wife asks that her right hand and arm
    skin be kept, and the husband later eats beaver flesh before a river issues from
    his side and he swims beside his beaver-wife. It then begins another tale in which
    an abandoned boy is brought back to his parents by an old grandfather spirit,
    follows the spirit toward a frozen lake, and is later tied to a tree so that he
    forgets the benefactor.
  language: English
  quote_policy: summarized
