canonical_text:
  quote: ''
  summary: The excerpt recounts an otter and wolf household with mixed young, a deer
    hunt, the wolf wife's nocturnal retrieval of deer, the processing of meat and
    skins, and the otter's departure under lake ice after mockery. It then tells of
    a bear mother who deceives her two cubs about the arrival of summer and is killed
    by A-qan' after the older cub wishes punishment. The excerpt ends with the beginning
    of a wolverene stratagem against a bear, using a false kinship address.
  language: English
  quote_policy: summarized
