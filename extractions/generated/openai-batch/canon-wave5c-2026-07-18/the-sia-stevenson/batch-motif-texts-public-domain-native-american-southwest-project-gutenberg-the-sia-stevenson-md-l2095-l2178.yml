canonical_text:
  quote: ''
  summary: Ma'asewe and U'yuuyew6 go to a distant village to see a Ka'suna dance.
    After most villagers fail to invite them to eat, one household feeds them and
    is warned to leave. The village is then converted into stone. The brothers ascend
    on a rainbow to their father, the sun, who approves their actions and directs
    them to live in Sandia mountain. Ma'asewe organizes the cult societies of the
    upper world, and selected ritual authorities are said to see the boys' footprints
    and provisions at the mountain house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two boys know there will be a great Ka'suna dance at a village north of
    Sia and ask their mother and spider-woman grandmother for permission to go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother and grandmother object because the boys have been disobedient and
    had previously converted the people at Oraibi into stone, but they consent after
    the boys promise to behave.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys carry bows and arrows given by their father, the sun; the sun tells
    each boy to get on an arrow and shoots both arrows near the dance village.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: At the village, the boys pass from house to house and see people eating, but
    no one invites them in to eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man, woman, and children in a house set apart from the village greet the
    boys and invite them to eat; the boys are disguised with honey spread over their
    bodies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After eating, Ma'asewe thanks the household and tells the family to leave
    the village and go a little way off.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the family obeys, the people of the village are converted into stone
    in the positions they occupied; the passage says the fate of the beings of the
    Ka'suna was never known.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ma'asewe says he may not return to the house of his mother and grandmother
    because they have converted the people of two villages into stone, and he proposes
    going to see their father.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A great rainbow has its feet on earth and its head touching the heavens; the
    boys step on it and quickly reach their father, the sun, in midheavens.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sun recognizes the boys as his children, says he has watched over them,
    and states that they have destroyed the giants who ate his people and that the
    conversion of the two villages into stone was well done.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sun tells the boys to make their home high above the earth at Sandia mountain
    and not return to the people of the earth; Ma'asewe accepts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before leaving their people, Ma'asewe organizes the cult societies of the
    upper world, and the two tiny heroes make their home in Sandia mountain while
    continuing to travel on the rainbow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Diminutive footprints at the entrance of the boys' mountain house are visible
    only to the good of heart, identified as the ti'amoni and certain theurgists,
    who also report seeing melons, corn, and other freshly gathered things inside.
  category: attribute
  evidence_refs:
  - ev:7
