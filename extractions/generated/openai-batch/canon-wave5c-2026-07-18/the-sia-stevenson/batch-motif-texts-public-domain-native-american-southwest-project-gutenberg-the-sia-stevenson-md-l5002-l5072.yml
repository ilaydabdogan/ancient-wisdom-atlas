canonical_text:
  quote: ''
  summary: 'An ethnographic description of the Quer''ranna Society rain ceremonial:
    the ho''naaite prepares offerings and a cloud-symbolic altar with fetishes and
    feathered objects; participants sit at the altar; a meal line is made for the
    being of Quer''ranna; prayer, pollen sprinkling, song, wand motions to directions,
    and child participation follow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ha'chamoni and plume offerings are prepared during the day, and the ho'naaite
    arranges an altar and a meal painting described as symbolic of clouds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six fetishes of Quer'ranna are arranged in line; a medicine bowl, antlers,
    baskets of cereals, corn on the cob, medicine bags, and offerings are placed around
    the meal painting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The altar decoration includes carved birds, eagle plumes, and suspended feathers
    of female sparrow hawk and long-crested jay.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men and child have forelocks tied with corn husk ribbons; the men wear
    hawk and jay feathers, white cotton breechcloths, and coral and kohaqua necklaces,
    while the woman wears ordinary dress and coral necklaces.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ho'naaite sprinkles a line of meal from the painting to the chamber entrance
    for the being of Quer'ranna to pass over.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ho'naaite, vicar, and woman sit behind the altar with the ho'naaite on
    the west side, the vicar to his right, and the woman on the east side; a child
    is sleeping near the altar.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ho'naaite fills an abalone shell with corn pollen, prays to Quer'ranna
    to invoke the cloud people to water the earth, and sprinkles the altar with pollen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman receives the shell of pollen, sprinkles the altar, keeps time with
    a wand, and motions the wand to the cardinal points, zenith, and nadir; the directional
    waving is repeated four times.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The child wakes, sits between the ho'naaite and the vicar, receives a wand
    and rattle from the vicar, and joins the song.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The vicar is described as afflicted with paralysis but making efforts to sing
    and sway; the scene is described with flickering fire-light around the group.
  category: attribute
  evidence_refs:
  - ev:9
