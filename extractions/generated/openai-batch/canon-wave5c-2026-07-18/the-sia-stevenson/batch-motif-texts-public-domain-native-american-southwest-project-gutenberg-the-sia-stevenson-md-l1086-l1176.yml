canonical_text:
  quote: ''
  summary: Rising waters drive people and animals to a mesa while ritual offerings
    fail to stop the flood. The creator directs the sun to test routes across the
    upper world and establishes the sun's daily east-to-west course. The sun and moon
    are described as masked. A huge reed is placed on the mesa so people and animals
    may ascend to the world above; Utsét leads with star people, and locust and badger
    open a passage through the earth, which several animals test.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waters come in as rivers between mesas from all sides, and people and animals
    flee to a mesa as the waters rise nearly to the mesa top.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Siis'slstinnako looks toward the four directions and sees that waters are
    everywhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theurgists sing for four days and nights before their altars and make
    offerings, but the waters continue rising.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Siis'slstinnako commands the sun to ascend and test routes over the world;
    after rejecting other routes, the sun is content with the straight road from east
    to west.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sun is assigned to ascend each day and pass over the world from east to
    west, stopping at three points for meals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sun wears dressed deerskin garments, a snake-painted kilt, bow and arrows
    with a cougar-skin quiver, and a mask with plumes, red hair like fire, and a yellow
    rain-indicating line.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The moon came to the upper world with the sun and also wears a mask.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each night the sun passes the house of Siis'slstinnako, answers questions
    about children above and the day's deaths and births, and then goes to his house
    in the east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A huge reed is placed on the mesa top as the means for the people to pass
    upward to the world above.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Utsét leads the upward procession carrying a sack containing many star people;
    theurgists carry sacred articles, followed by laity, animals, snakes, and birds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The turkey is far behind, and foam from the waters reaches the tips of his
    feathers, leaving a mark still borne by turkeys.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the top of the reed, solid earth prevents exit; Utsét calls the locust
    to make a door, and the locust works through the earth and reports that the world
    above is good.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Utsét calls the badger to make or enlarge the doorway; the badger passes through,
    returns, and says the way is open and the world above is good.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Utsét sends deer, elk, and buffalo to test the passage; each returns saying
    that the door or way is good and that passage was successful.
  category: sequence
  evidence_refs:
  - ev:9
