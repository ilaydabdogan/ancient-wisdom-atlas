canonical_text:
  quote: ''
  summary: In a tale episode, an animal party including wolves and a wolverene prepares
    camp, food, and travel. Snow is brought for water, a brush fire is kindled, deer
    meat is provided and cooked, and the wolverene is given more than he can eat.
    After being warned not to place leftover meat near a pole because it would become
    bark, he hides it there; while he sleeps, wolves replace the meat with bark. The
    next day the wolves cook again, break camp in a way the wolverene cannot observe,
    follow tracks and signs, cross a river, encounter bones from a freshly killed
    deer, and reach a marked tent site.
  language: English
  quote_policy: summarized
