canonical_text:
  quote: ''
  summary: 'The passage describes Teton/Lakota death and burial lore: ghosts may be
    heard, seen, or materialized; smoke, cedar, odors, and gunfire may repel them;
    burial includes possessions and sometimes a killed horse for the ghost; ground
    burial was avoided after a story of an animal dragging corpses underground; tattoo
    marks allow safe travel on a ghost road to the Many Lodges; unmarked ghosts are
    rejected by an old woman and become wandering spirits; ghosts can be dangerous
    or omens of death; and a deceased son''s hair may be kept in a white deerskin
    pack called his ghost or shade and ritually fed in a ghost lodge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghosts of the departed are described as not always visible to the living;
    they may be heard but not seen in a lodge with a mortal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some ghosts are described as becoming materialized, taking living spouses,
    and eating, drinking, and smoking like ordinary human beings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ghosts are said to visit the sick at night, and people use cedar smoke, cedar
    placed near the lodge, bad odor, or gunfire to drive them away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before death, ghosts of deceased kindred are said to surround the lodge and
    be visible to the dying person.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dead man's possessions are buried with him, his body is dressed in good
    clothing, and his favorite horse may be decorated, saddled, killed, and associated
    with articles for the ghost's use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A story explains that the Teton stopped ground burial after people found underground
    tunnels where a strange animal, the Wahaijksica, had dragged corpses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage gives practical reasons for avoiding ground burial: graves might
    be walked over, the dead might lie in mud and water, and wolves might dig up and
    devour bodies.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tattoo marks on the forehead, wrists, or chin are said to allow a Lakota ghost
    to travel safely on the ghost road toward the Many Lodges.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old woman on the road examines ghosts for tattoo marks; unmarked ghosts
    are pushed from a cloud or cliff, fall to this world, and wander whistling without
    a fixed abode.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The passage distinguishes ghosts by danger: a quiet person''s ghost may become
    restless, a bad person who dies naturally is not feared, and a murdered person''s
    ghost is always dangerous.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: If a ghost calls to a loved one and the person answers, that person is expected
    to die soon; weeping outside a lodge is also treated as a sign of impending death
    in the lodge.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A deceased sister is said to desire returning to carry off a beloved brother,
    and families respond to death by firing a gun or making smoke with medicine thrown
    on a fire.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A person alone who has dreamed of a ghost is said to risk injury from a ghost,
    including distortion of the mouth and eyes, followed by fainting and slow revival.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a son dies, parents cut hair from the top front of his head, place it
    in a white deerskin pack, suspend it from three poles, and call the hair the ghost
    or shade of the dead person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Food and water are placed beneath the suspended hair pack three times a day,
    and articles are handled carefully and exposed to smoke from sweet-smelling herbs.
  category: action
  evidence_refs:
  - ev:8
