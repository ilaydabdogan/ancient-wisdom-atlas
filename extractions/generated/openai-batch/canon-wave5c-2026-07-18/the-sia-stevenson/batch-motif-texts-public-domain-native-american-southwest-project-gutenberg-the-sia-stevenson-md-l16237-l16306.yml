canonical_text:
  quote: Nothing is done, nothing contemplated without sounding the drum.
  summary: The passage describes a cup-and-ball-like game using animal bones, a tail,
    a thong, and a peg. It then describes drum construction, drum snares and beater,
    preparation of the drum with water, frequent drumming in many life circumstances,
    drumming after death to prevent a spirit from returning to torment the living,
    singing with the drumbeat, and construction differences between Little Whale river
    and Ungava drums.
  language: English
  quote_policy: quoted
