canonical_text:
  quote: ''
  summary: The passage describes a Winnebago Buffalo dance held in a long narrow sacred-dance
    tent, with women carrying fine earth to form two truncated conical mounds near
    the eastern entrance and fire. The mounds receive male dancers' headgear, claws,
    tails, and other objects. Male dancers imitate buffalo, women move in a single-file
    line, water is taken, and the dance is described as a prayer for increase and
    plenty of buffalo. The passage then compares or juxtaposes these earth formations
    with a conical ash mound made in a mystery lodge initiation and with a sacred
    circular depression and cedar tree on Missouri bluffs where visions and spirits
    are said to tarry.
  language: English
  quote_policy: summarized
