canonical_text:
  quote: ''
  summary: The passage states that the Omaka and Ponka invoked the winds. It describes
    pipe-dance objects marked in green with a cross indicating the four quarters of
    the heavens or four winds. It also reports Kansa practices of sacrificing hearts
    of slain foes in fire to the four winds, making offerings to Wakandas, addressing
    the winds in directional order, and formerly offering pieces of their own flesh
    to the Wakandas.
  language: English
