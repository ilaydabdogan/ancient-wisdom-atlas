canonical_text:
  quote: ''
  summary: The passage describes the Green Corn Dance as a night dance said not to
    have originated with the Iowa; the Sac are said to have obtained it from the Shawnee.
    Men and women dance together, and participants may leave consorts and mate anew
    without reproach. It also describes the Iowa Buffalo Dancing Society, suggesting
    probable restriction to those who had visions of the buffalo and a connection
    among the dance, buffalo doctors, and a buffalo-hide medicine or mystery bag.
    The Iowa buffalo doctors are said to be the only surgeons, as among the Omaha.
