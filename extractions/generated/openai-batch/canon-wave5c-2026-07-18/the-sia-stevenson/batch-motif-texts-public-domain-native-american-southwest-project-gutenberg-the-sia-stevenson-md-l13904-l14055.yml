canonical_text:
  quote: ''
  summary: The passage describes construction, materials, ornamentation, and seasonal
    uses of mittens, head coverings, bead headbands, caps, visors, and winter coats.
    It also notes comparisons with white men’s fit requirements, Eskimo cold-weather
    clothing, and traded or cast-off garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mittens are described as made from smoked deerskin by folding the skin, cutting
    a mitten shape along the fold, and sewing the cut edges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mitten thumb is made by cutting a tongue-shaped piece from the palm, leaving
    its base as the inner thumb covering, then fitting and sewing in another piece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Indian thumb is generally shorter than the white man’s
    thumb, making native-made mittens uncomfortable until the thumb portion is recut
    and sewn.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mitten wrists may be ornamented with red or black cloth strips, painted line
    and lattice designs, bead rows, zigzags, pendant bead strands, and woolen tassels.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Severe-weather mittens may be lined with thin fetal reindeer skin; perspiration
    can wet the hair lining, which may freeze when the mitten is removed and endanger
    the fingers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men’s summer head covering may be a large cotton handkerchief wrapped turban-fashion,
    or a simple deerskin thong if no handkerchief is worn.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Girls and newly married wives make beaded bands for lovers or husbands; the
    bands are worn over the forehead and tied behind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A deerskin cap is used mostly in wet weather, and a stiff deerskin visor may
    be worn in spring to protect the eyes from snow glare.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some men have a high conical red cloth cap ornamented with bead patterns;
    the bead weight may cause it to fall to one side.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The male winter coat is described as made of skins with the hair inside, using
    separate front and back skins joined by seams and shaped with a neck opening,
    slit, and optional inserts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A square piece at the back of the winter coat’s neck may serve as a collar
    or as added shoulder protection against piercing winds.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some winter coats have a hood sewn to the back of the neck, serving as both
    cap and protection when drawn over the head.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The collar and hood are made from skins from the sides of a deer’s head; if
    several head skins are required, they are sewn into the form of a deer’s head
    and may be fringed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says Indians are usually near deer herds, enabling them to obtain
    skins in good condition for finer garments.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage compares the Indian coat with Eskimo clothing, saying the Indian
    coat is less protective and that white men in the region adopt Eskimo clothing
    in cold weather.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Indians are described as accepting cast-off white men’s garments and procuring
    traded clothing; trousers are desired, and coats are valued in wet seasons because
    moisture damages native skin garments.
  category: action
  evidence_refs:
  - ev:13
