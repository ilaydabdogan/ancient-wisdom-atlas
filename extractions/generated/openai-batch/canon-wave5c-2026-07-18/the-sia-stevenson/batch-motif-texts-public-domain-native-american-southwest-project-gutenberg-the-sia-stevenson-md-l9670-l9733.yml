canonical_text:
  quote: ''
  summary: The passage describes a society without a chief but with a recognized leader
    influenced by a conjurer or medicineman. It presents a belief system in which
    life affairs are controlled by spirits, including malignant personal guardians,
    nature and locality spirits, and a great spirit called Tung ak, identified with
    death. People propitiate spirits with offerings, carry personal spirits in material
    forms such as dolls or bundles, may punish or transfer troublesome spirits, and
    rely on shamans to deal with Tung ak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there is no chief, but there is a recognized leader
    influenced by a conjurer or medicineman, and the two determine what shall be done.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: All affairs of life are described as being under the control of spirits, each
    ruling a certain element and all directed by a greater spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each person is said to be attended by a special guardian spirit that is malignant
    and ready to harm the individual it accompanies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The personal spirit's assistance is sought by propitiation through offerings
    of food, water, and clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spirit is often carried in a material form, specifically described as
    a doll carried on the person; for hunting success it may be carried in the ammunition
    bag.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Misfortune or failure to overcome obstacles is attributed to harm caused by
    the attending spirit, whose goodwill must be invoked.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the spirit is reluctant, the person may punish it, deprive it of food,
    or strip it of garments until it becomes obedient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A troublesome spirit may be given to another person without that person's
    knowledge, after which the recipient comes under the spirit's control and the
    giver is released from its effects.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The spirit may be given in the form of a bundle of clothing or may pass to
    someone who handles the hunting bag.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The spirit is said to exert influence only when carried by something having
    life; if cast away for a time, it remains inert.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Other spirits are named as spirits of the sea, land, sky, winds, clouds, and
    everything in nature.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Every cove, point, island, and prominent rock on the seashore is described
    as having its own guardian spirit.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Locality spirits are described as malignant and propitiated by offerings from
    those wishing to visit their places.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Minor spirits are under the control of a great spirit named Tung ak, and the
    lesser spirits obey his command.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The shaman or conjurer alone is said to be able to deal with Tung ak and enlist
    his assistance.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: Tung ak is identified in the passage as death, seeking to torment people so
    that their spirits may dwell with him.
  category: attribute
  evidence_refs:
  - ev:16
