canonical_text:
  quote: ''
  summary: The passage introduces winter or bad-weather storytelling around a fire
    for the instruction and entertainment of younger people, then gives wolverene
    folklore episodes. In the first, a wolverene gathers birds, calls them brothers,
    dresses them in feathers, makes wings for himself, and flies with them. A brant
    warns him not to look down when noise is heard below; he looks down at shouting
    people, falls, is mistaken for a brant or goose, and is finally found to be a
    dead wolverene. In the second, a wolverene at the seashore sees waterfowl, offers
    them a bees' nest if they come ashore to dance, tells them to close their eyes,
    and begins singing; the excerpt ends before the outcome.
  language: English
  quote_policy: summarized
