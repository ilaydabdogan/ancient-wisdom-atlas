canonical_text:
  quote: ''
  summary: The passage describes Dakota practices concerning a young man's tutelar
    divinity associated with consecrated armor, animal-spirit guardians, restrictions
    on killing or eating certain animals or animal parts, purification before war,
    and the sacred status of weapons and mystery sacks as indwelt by god-power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When each young man reaches maturity, a tutelar divinity is assigned to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tutelar divinity is said to reside in consecrated armor given to the young
    man, consisting of a spear, an arrow, and a small bundle of paint.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tutelar divinity is described as the spirit of a bird or animal, with
    examples including wolf, beaver, loon, and eagle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man must not kill the animal associated with his tutelar spirit
    and must hold it sacred, at least until he has killed an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young man may make an image of the sacred animal and carry it, regarding
    it as influential in daily life and ultimate destiny.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that knowledge of the guardian spirit is sometimes reported
    to come through dreams during an initiatory fast, but says this is not the general
    rule among the Dakota.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that knowledge of the guardian spirit is communicated by
    the war prophet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Sisseton and Wahpeton Dakota, a warrior was forbidden by custom
    or law to eat the tongue, head, or heart of many beasts, and in some cases could
    eat heads but not tongues.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A warrior about to go on the war path could not have intercourse with women
    and had to undergo four days of purification in the inipi or sweat bath.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A married warrior could not touch his own weapons until he had completed the
    prescribed purification.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Armor god and the Spirit of the mystery sack are described as sometimes
    spoken of as separate divinities, but the passage interprets them as god-power
    placed into armor and sack by consecration.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A young man's war weapons are described as wakan and must not be touched by
    a woman.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A man prays to his armor in the day of battle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Consecration of weapons for war and hunting places a young man under taboo
