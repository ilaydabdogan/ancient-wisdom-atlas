canonical_text:
  quote: While he is the object of ridicule he is also often of great service.
  summary: The passage introduces Sia myths and animal tales, then characterizes Coyote
    as ridiculed but useful. It says Coyote stole fire from Sus'-slstinnako in the
    lower world for the Sia of the upper world, and in the new world used hair from
    his mouth and belly to cover parts of the Sia people, who had lacked body hair
    except on their heads.
