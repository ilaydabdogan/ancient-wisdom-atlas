canonical_text:
  quote: ''
  summary: Two brothers prepare arrows, repeatedly leave home despite their mother's
    warnings, kill a bear while seeking plumes, and later confront predatory eagles
    at a high rock. Deer intestines protect them when the eagles drop them on a sharp
    ledge. They kill the young eagles and both eagle parents, then obtain help from
    a ground squirrel, who plants a piñon nut that rapidly grows into a tall tree
    serving as a road down.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys return with wood for arrow shafts and say they have killed a cougar;
    their mother first scolds and disbelieves them, then embraces them after Ma'asewe
    confirms the claim.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys make arrow shafts and seek plumes; their mother says many plumes
    are at the brink of a western canyon, but warns of a very bad man and other bears
    there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ma'asewe says he will not go to the dangerous canyon, but after leaving the
    house he persuades U'yuuyew6 to accompany him there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the canyon house, a bear pursues Ma'asewe; U'yuuyew6 shoots the bear
    through the heart, and Ma'asewe cuts out and preserves pieces of the heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boys gather feathers, flay the bear, keep the lower leg skins with claws
    separate, stuff the body with grass, and drag it home with a rope; their mother
    is frightened when she sees it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother warns that large eagle parents live in a high rock to the south
    and eat the little ones they find.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boys go toward the eagle house, kill a deer, clean its intestines, and
    wrap the intestines around their necks, arms, chests, shoulders, and waists.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The eagle parents carry the boys upward and drop them on a sharp stone ledge;
    the deer intestines break, protect the boys from the rock, and make blood fall
    like rain, so the eagles think the boys are dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boys question the young eagles about when the mother and father eagle
    will return and which house each parent will visit first.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ma'asewe kills the young eagles and drops them down; when the mother and father
    eagle return separately, he shoots each through the heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the eagles are killed, Ma'asewe says the road down to the earth and
    the road up to the higher rock are both long, then asks a little ground squirrel
    for help and promises eagle plumes as payment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ground squirrel plants a piñon nut; because the squirrel knows medicine,
    a tall tree grows almost immediately and becomes a road, which the squirrel demonstrates
    and the boys follow.
  category: sequence
  evidence_refs:
  - ev:7
