canonical_text:
  quote: ''
  summary: 'The passage describes a childbirth rite: a laboring woman is seated by
    a fire, relatives and ritual specialists gather, medicine bags, eagle plumes,
    ashes, corn, plant medicine, and meal are used, and prayers ask for the child''s
    health, safe delivery, growth, knowledge of mother earth and Ko''pishtaia, purification,
    and blessings from the sun father.'
  language: English with transliterated ritual terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first stage of labor, the woman's mother made a fire, a low heavy stool
    was placed before it, and the laboring woman sat on the stool with her back to
    the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctress and the husband's sister arrived; the father and husband removed
    their moccasins, and the women had bare legs and feet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father sat in front of his daughter; the doctress sat at her left holding
    an ear of yellow and purple corn; the writer held a medicine-stone; the husband
    sat by the wall with his sons and sister.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite laid three small buckskin medicine bags on the floor and held
    the quill ends of two eagle plumes while reciting a low-toned prayer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prayer's explanation says the child is to be received upon its sand bed,
    described as symbolic of the lap of mother earth, and asks that the child have
    good thoughts, grow, be happy, and know mother earth and Ko'pishtaia.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Powdered plant medicine was given to the woman for the health of woman and
    child, and the woman's mother placed ashes from the fireplace on the floor before
    the woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The father dipped eagle plumes in ashes, struck one plume with the other,
    threw ashes toward the cardinal points, and passed the plumes down each side of
    the woman while an Ashes Man invocation was spoken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that ashes are used to discover diseased parts and that
    scattering ashes to the cardinal points casts out physical and mental impurities
    and purifies the chamber.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a repeated ash rite, the plumes were passed from the top of the woman's
    head down the center of her body with a prayer for safe delivery.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The doctress placed the tip end of the corn at the top of the woman's head,
    blew on it, passed it down the center of the body, and prayed that the child pass
    through the road of life promptly and safely; this was repeated four times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ho'naaite placed medicine in the woman's mouth, went to the end of the
    placita, and sprinkled meal to the east while praying for the sun father to bless
    the child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After these rites, the woman moved down the long room in apparent pain while
    maintaining composure.
  category: sequence
  evidence_refs:
  - ev:9
