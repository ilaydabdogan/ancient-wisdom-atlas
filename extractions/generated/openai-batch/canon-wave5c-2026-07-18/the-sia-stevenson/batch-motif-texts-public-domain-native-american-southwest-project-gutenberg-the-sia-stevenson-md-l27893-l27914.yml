canonical_text:
  quote: ''
  summary: 'The passage lists Earth and animal-named gentes or subgentes among several
    tribes. It states that the Winnebago Black bear people enforced discipline in
    war and acted as police in peace. It then reports a Winnebago Wolf gens tradition
    of four created brothers distinguished by colors: the first green and named Blue
    Sky, referring to day; the second black, with a name referring to night; the third
    white; and the fourth gray. The green, black, and white wolves remain unseen in
    subterranean abodes, while the gray wolf is ancestor of visible above-ground wolves.
    The author states that the four colors are symbolic but does not know whether
    they refer to the four quarters.'
  language: English
  quote_policy: summarized
