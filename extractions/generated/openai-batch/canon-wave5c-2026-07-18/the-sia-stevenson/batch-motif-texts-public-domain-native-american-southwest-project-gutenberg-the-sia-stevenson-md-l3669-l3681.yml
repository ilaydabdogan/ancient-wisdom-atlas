  quote: ''
  summary: 'The passage describes a Snake society rite at a snake house: ha''chamoni
    are prepared, participants search for snakes from specified directions, ha''chamoni
    are planted or deposited, the required number of snakes is tied to membership,
    and a war chief warns the people not to visit the cardinal directions during the
    rite.'
