canonical_text:
  quote: ''
  summary: The passage describes prolonged childbirth attended by a doctress, relatives,
    and a ho'naaite. Various remedies and rites are tried, including manipulation,
    corn passed down the body, heating over coals with substances, prayer, medicine
    water, blowing repeated four times, fetiches, food, and a moccasin rite to hasten
    the placenta after the child is born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The doctress attempts to hasten birth by manipulating the abdomen, placing
    an ear of corn at the woman's head, blowing on it, and passing it down the middle
    of the body four times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman stands over coals treated first with cobwebs, then with scrapings
    from an old chamber beam, and later with fat of a castrated sheep; the attempted
    remedies fail.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The Sia are said to claim that the remedies using cobwebs and beam scrapings
    are very old and were used when the world was new.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father, mother, and sister-in-law assist the exhausted woman; the father
    holds the corn, prays, passes it down the woman's body, and the woman sprinkles
    meal on it while praying to t^t's^t for safe parturition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A prominent ho'naaite is summoned and prepares water with medicine, has the
    woman drink it, blows on her head and down the front of her body four times, presses
    her abdomen, says a short prayer, and leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fetiches of Quer'ranna and of the cougar are placed under the woman's pillow,
    and a third fetich is placed in her right hand.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The father keeps vigil, and the mother quietly attends to the woman during
    the difficult labor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman eats waiavi, jerked meat, and corn-meal gruel before renewed labor;
    the child is born at half past six in the morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the birth, the writer is called to rub the father's moccasin down the
    woman's back with the toe downward, and the placenta soon follows.
  category: action
  evidence_refs:
  - ev:8
