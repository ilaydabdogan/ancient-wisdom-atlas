canonical_text:
  quote: ''
  summary: The passage describes Heyoka as an antinatural god or group of gods, not
    fully differentiated from Waziya, occurring in four varieties with small male
    or human form. Their experiences reverse ordinary seasonal expectations. They
    carry bow and arrows, rattles, and a drum charged with lightning, and the drumstick
    is called a little Wakinyan. Their abode is on high prairie mounds, and they preside
    over the land of dreams. A quoted account by Pond compares the Heyoka gods to
    Wakinyan in having four varieties and human form.
