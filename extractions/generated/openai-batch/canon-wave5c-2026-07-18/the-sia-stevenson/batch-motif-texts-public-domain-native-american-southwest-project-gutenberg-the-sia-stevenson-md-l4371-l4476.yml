canonical_text:
  quote: ''
  summary: The passage describes variations in successive nights of a ceremony involving
    a child, animal fetiches, food offerings, ashes, plumes, meal lines, directional
    animal songs, bear-leg skins, dancing, and incantations. It then describes a Knife
    Society rain ceremonial in which members prepare a slat altar, sand painting,
    ya'ya, fetiches, bowls, meal, water, stone cougars, plume offerings, pigments,
    and a consecration of water with prayer and sprinkling toward the altar and cardinal
    points.
  language: English
  quote_policy: summarized
