canonical_text:
  quote: ''
  summary: The passage describes recreational activities and implements, including
    football played by all ages, men's wrestling, stone throwing, card gambling, hidden-object
    guessing, a cup-and-ball-like dexterity game, children's snow-line play with borrowed
    German numerals, and football equipment used at Fort Chimo in winter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Football is described as attracting people of every age, from aged women to
    toddlers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men wrestle by seizing each other around the waist, locking hands behind each
    other's backs, using arm strength, and trying to throw the opponent flat on his
    back so that the head touches the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tripping with the feet is prohibited in the wrestling contest and would cause
    witnesses to stop the struggle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eskimo and Indians are described as engaging in comparative wrestling tests
    of strength, with the Eskimo said to prove stronger in these engagements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Younger men throw stones at a mark, and some acquire notable dexterity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People play card games learned from white people, teach them to each other,
    and place small stakes on the outcome.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women are described as more passionate gamblers than men and as sometimes
    wagering clothing until the loser is nude before spectators; the winner usually
    returns at least part of the clothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Young girls play a hidden-object guessing game in which one conceals an object
    in a closed hand while another asks about size, color, and other features to identify
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A cup-and-ball-like game uses an ivory cone-shaped piece with notches and
    holes, a thong, and an ivory peg; the player tries to catch the moving piece on
    the peg a set number of times.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A hare skull may be substituted for the ivory ball, with perforations made
    in the skull walls to receive the peg.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Children sometimes use a stick or sharp-pointed instrument to make straight
    lines in newly fallen snow while repeating words described by the narrator as
    gibberish.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The repeated words are identified in the passage as German numerals transmitted
    through Labrador Moravian missionaries and regional Native/Eskimo contacts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The football is called ai uk toi'ik, varies from 3 to 7 inches in diameter,
    and is made from buckskin or sealskin stuffed with dry moss or feathers.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The football may be driven by a foot or by a whip made with a wooden handle,
    wrist loop, and multiple heavy sealskin thongs.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: At Fort Chimo the football game is played on late winter afternoons in temperatures
    described as 30 or 40 degrees below zero, with a large crowd joining.
  category: setting
  evidence_refs:
  - ev:11
