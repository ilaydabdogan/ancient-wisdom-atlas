canonical_text:
  quote: ''
  summary: The passage begins with a fragment in which an unidentified group die after
    their lips freeze to the ice of a water hole. It then begins the tale of a starving
    wolverene who, having failed to store provisions before winter, leaves his wife
    and children to seek food from his wolf brothers. He meets old wolves and follows
    them toward a riverbank camp where young wolf hunters return. The wolves prepare
    a tent and fire while the wolverene wonders about their materials and methods.
  language: English
