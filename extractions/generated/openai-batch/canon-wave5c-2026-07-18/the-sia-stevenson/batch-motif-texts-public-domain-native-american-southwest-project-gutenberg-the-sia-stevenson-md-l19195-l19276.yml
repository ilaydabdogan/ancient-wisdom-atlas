canonical_text:
  quote: ''
  summary: The passage reports a Ponka belief that death was caused by feared malevolent
    spirits and that survivors gave away property to deter further visits. It also
    describes Omaha statements about Wakanda or plural Mysterious Powers causing death,
    old Omaha and Ponka pipe-prayer practices directed toward winds, ground, and upper
    world, a corresponding Shoshoni pipe-direction custom, appeals to personified
    ground and upper world powers, and Omaha buffalo-hunt smoking and horse-address
    practices.
  language: English with Omaha terms
  quote_policy: summarized
