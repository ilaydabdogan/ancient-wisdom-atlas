canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of marriage, separation,
    co-wives, conjurer-influenced spouse transfer, reputations for bad luck, and age-ranked
    family and community organization among the people described. It emphasizes polygynous
    households, simple separation or wife exchange, social pressure mediated by a
    conjurer, flight to avoid coerced separation, and the authority of the household
    head and eldest son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prosperous husband may take a second wife and sometimes three, four, or
    five wives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two or three wives living in a single snow house are said to be brought into
    close intimacy and often to quarrel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Males may seek wives from other localities, connecting distant people through
    interchange of both sexes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Separation of couples is described as simple: one partner may leave, may
    be compelled to return, and temporary unions or wife exchanges are frequent.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman may be compelled by community sentiment to leave her chosen partner
    and join a man who has bribed a conjurer to declare that her cohabitation is needed
    to relieve an afflicted person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A couple targeted by such a plot may escape separation only by fleeing to
    another locality until the afflicted person recovers or dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A designing woman may cause a man to cast off his legal wife; the cast-off
    wife may take her children to relatives and live there in a menial position.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some wives are considered unlucky, cast off, and avoided by men who fear they
    may work a charm on them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Family social rank is described as the head of the family first, the oldest
    son second, and other sons following by age; sons of a first wife take precedence
    over sons of later wives.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the father is aged or supported by adult sons, management devolves on
    the eldest son; extended kin may form a community under a leader, and depleted
    families may join such a community for protection.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
