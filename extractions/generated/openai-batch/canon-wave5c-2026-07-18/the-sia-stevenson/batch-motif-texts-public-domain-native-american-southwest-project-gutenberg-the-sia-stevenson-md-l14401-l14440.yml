  quote: ''
  summary: The passage describes a process for smoking deerskins with smoldering rotten
    wood inside a suspended deerskin bag, then folding and seasoning the skins. It
    also notes how insect scars affect smoke coloring and how scarred skins are used,
    and describes bone, horn, antler, or wooden implements used to apply paint patterns
    to buckskin garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Portions of a deerskin bag are suspended from a pole, with the head and neck
    portions left open, and cloth sewn to the edges to form an opening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rotten wood is placed in a pan or vessel and allowed to smolder without blazing;
    its pale blue pungent smoke rises into the deerskin bag, while the cloth serves
    as a smoke conduit and keeps the skin away from the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During smoking, the skins are inspected between the sewing stitches and taken
    down when sufficiently processed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After sufficient smoke exposure, the skin surface has a clear brown color,
    with shade depending on the length of exposure.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the cloth is removed, the skins are folded with the smoked side inward
    and laid away for several days to season.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the smoked skin is left exposed to the air, the coloring matter disappears
    and the skin becomes only slightly different in color from before smoking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Scars made by insect larvae do not take the smoke as well as healthy portions,
