  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Skins with many scars are used for tents, inferior grades of moccasins, and
    tops of better footwear.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Paints for decorating buckskin garments are applied with specially shaped
    bits of bone or horn; multi-tined antler tools make complicated parallel-line
    patterns, and the simple form may be made of wood.
  category: object
  evidence_refs:
