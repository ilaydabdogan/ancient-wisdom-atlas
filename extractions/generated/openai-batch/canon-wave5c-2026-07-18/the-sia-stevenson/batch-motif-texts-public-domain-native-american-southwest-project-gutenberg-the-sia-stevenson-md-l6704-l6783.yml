canonical_text:
  quote: ''
  summary: 'The passage describes rites after childbirth: cutting the umbilical cord,
    disposing of the placenta and sand in the river, bathing and cleansing the newborn,
    placing the infant in a cradle with ritual objects, prayers by the grandfather,
    use of meal, cotton cords, an obsidian spear point, and a sacred medicine given
    to the child and mother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The husband sharpened a knife and gave it to the doctress, who placed the
    child on the sand-bed, tied the umbilical cord near the umbilicus, cut it, and
    removed the child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sister-in-law placed the placenta on a sheepskin, gathered sand from the
    sand-bed onto cloth, added raw cotton to the placenta, put the folded sheepskin
    in a shallow bowl, and carried it from the house with shell mixture in her hand
    while a boy followed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sand and placenta were cast into the river, accompanied by a spoken instruction
    that other women bearing children might promptly follow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The doctress bathed the child with warm water, yucca suds, and water streamed
    from her mouth, rubbing the child by hand and then wrapping and drying it in a
    blanket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The grandparents, father, and brothers looked admiringly at the infant during
    the bathing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The remaining umbilical cord was drawn through raw cotton, wrapped closely,
    and ashes were rubbed over the child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The infant is identified as a boy and described as heavy for a newborn, with
    black silky hair and a red mark at the center of the forehead.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The grandfather brought forward the cradle, and a small Navajo blanket and
    sheet were used in preparing the child for placement.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The writer was asked to receive the child; the grandfather offered a thanksgiving
    prayer, sprinkled meal on the writer, and gave her meal, which she used to mark
    four lines on the child’s breast and sprinkle the rest eastward.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The grandfather stated that the child was given to the writer, after which
    the writer returned the child to the doctress.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The grandfather arranged the cradle with folded calico, white cotton, a sheet,
    and a blanket, strapped the nude infant into it, and placed the cradle to the
    mother’s left on a white sheepskin.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: An ear of corn that had been important before the birth was laid by the right
    side of the child.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The grandfather sat at the foot of the cradle with three medicine bags and
    eagle plumes and repeated a prayer.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Two cords of native cotton prepared by the father were put under the mother’s
    pillow and later tied around the infant’s ankles to indicate that the child was
    a child of Sus'slstinnako and might know this father.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The grandfather touched parts of the cradle and the child’s body with an obsidian
    spear point four times for strength of the child’s body, limbs, heart, and mind,
    and passed the spear over the mother’s limbs and body for the same purpose.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The grandfather gave the child first food by transferring a sacred medicine
    from his own mouth into the infant’s mouth, and also placed some in the mother’s
    mouth.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The stated purpose of the medicine was that the child might know all the medicines
    of the earth and that the mother’s milk might be good, so the child’s heart and
    mind would be good.
  category: speech
  evidence_refs:
  - ev:17
