canonical_text:
  quote: ''
  summary: The passage describes a Sia horse round-up custom. Horses are kept in pasture
    and selected households provide herders. When the herders return, usually on Sunday
    morning, women and children hurry to meet the horses and seize wood rats tied
    to the animals' necks with yucca ribbon. Men are excited but do not take part.
    In the corral, women and children continue trying to take the rats, sometimes
    using a hiriat to draw horses near. The rats are then skinned, cooked in grease,
    and eaten as a delicacy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sia are said to own about 150 horses and to keep them in pasture during
    the week, seldom or never using them as beasts of burden.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each Saturday the war chief designates selected horse-owning houses to furnish
    herders; a sufficiently large son may go in place of the house head.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The herdsmen start on Saturday morning and usually return on Sunday morning,
    depending on their success in rounding up the animals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the herdsmen and horses approach, many women and children hurry to the
    valley to join the cavalcade rather than wait for the horses to reach the corral.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women and children scramble for wood rats identified as Neotoma, which hang
    from the necks of horses and colts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men of the village are also excited, but the passage states that they
    may not participate in the frolic.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: From departure until return, the herders look for the yeoUnna or wood rats,
    and the passage says the rats appear abundant from the number gathered on these
    trips.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The rats are suspended from the animals by yucca ribbons tied around their
    necks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Excitement increases as the horses ascend the hill and reaches its highest
    point after the horses enter the corral.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women and children run among excited horses in the corral, apparently without
    fear, trying to snatch rats from the animals' necks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some women throw the hiriat, draw horses near, and pull rats from their necks;
    some fail, while a favored few leave with as many rats as they can carry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The collected rats are skinned, cooked in grease, and eaten as a delicacy.
  category: action
  evidence_refs:
  - ev:6
