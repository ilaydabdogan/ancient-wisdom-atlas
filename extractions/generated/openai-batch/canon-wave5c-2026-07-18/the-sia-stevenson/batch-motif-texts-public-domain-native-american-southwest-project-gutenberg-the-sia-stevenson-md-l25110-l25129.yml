  quote: ''
  summary: The passage describes Teton Deer women as resembling Pawnee Wolf women.
    They tempt unwary youths encountered away from camp in solitary places. If a youth
    yields, the woman resumes her natural shape after he leaves, and the youth returns
    home impaired, becomes ill, and dies. Hunters therefore avoid females seen on
    the way. Deer women are silent but otherwise resemble Indian women.
