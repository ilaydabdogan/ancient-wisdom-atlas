canonical_text:
  quote: ''
  summary: A brother or man outside attacks a mud-walled lodge, kills the children
    and the wife, and brings the husband back to their people. The wife had instructed
    the husband to keep her right hand, arm, and skin if he wished to see her again.
    The bodies are later treated as beavers. After the husband is forced to eat beaver
    flesh, a river gushes from his side, and he is seen swimming beside the wife who
    had been a beaver.
  language: English
  quote_policy: summarized
