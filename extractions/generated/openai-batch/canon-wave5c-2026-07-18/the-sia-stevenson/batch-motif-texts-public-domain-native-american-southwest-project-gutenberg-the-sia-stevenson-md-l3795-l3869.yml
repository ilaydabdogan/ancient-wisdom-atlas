canonical_text:
  quote: ''
  summary: The passage describes a Snake society ceremonial sequence in which a ho'naaite
    presents snakes to novitiates, participants pass with snakes four times, snakes
    are later released from ceremonial vases toward the four directions, and the vases
    are stored in a cave. It also describes the hidden snake house, the cave repository
    for two ancient decorated vases, water channels leading to the vases, and a refusal
    to give a vase to Mr. Stevenson because of fear that the snakes would become angry
    and harm the community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the opening of the song and dance, the ho'naaite obtains a snake at the
    grotto entrance and presents it horizontally to a novitiate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novitiate receives the snake in the same manner, clasps its throat with
    the right hand, and passes back and forth north of the line from the grotto four
    times with the ho'naaite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the passage back and forth, the novitiate sometimes allows the snake
    to wrap itself around his throat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: If there is a second novitiate, the ho'naaite asks whom he wishes for a father
    and companion, and the boy designates a member of the Snake division to accompany
    him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the novitiates finish, each member of the Snake division takes a turn
    passing back and forth four times with a snake, and the song and dance continue
    until every snake has gone through the ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two designated bearers enter the grotto, receive the vases from the man inside,
    and carry them to a cave about half a mile away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the cave, the bearers remove each snake separately, place it on the ground,
    and address it before releasing it.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The snakes are deposited in the order north, west, south, and east, and this
    directional sequence is repeated until all snakes are disposed of.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the snakes are released, the vases are placed in the cave and the cave
    entrance is covered with a large slab.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ho'naaite returns to the house, takes the ya'ya from the tail of a sand-painted
    cougar, draws a breath from the cougar with his right hand, and rubs his hand
    over his breast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Members erase the sand painting and rub their bodies with the sand for mental
    and physical purification.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The snake house is described as a hidden rectangular log structure with a
    fireplace and two niches at the base of the north wall where the two vases stand
    during the indoor ceremonial.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: During a ceremonial, the snake house roof is covered and fringed with spruce
    boughs and sunflowers, and the interior wall is whitened.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: A stone slab concealed a shallow cave containing two vases side by side.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: A small channel or flume was made so that waters from ti'nia could collect
    in the vases.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: The vases are described as ancient pottery decorated with snakes and cougars
    on a creamy ground.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The vicar states that the vases cannot be parted with because they are very
    old, were made by the people's ancestors, and the snakes would be angry if the
    Sia parted with them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: A council discusses whether to give Mr. Stevenson a vase and concludes that
    doing so might excite the anger of the snakes, who might bite women and children
    and cause them to die.
  category: speech
  evidence_refs:
  - ev:10
