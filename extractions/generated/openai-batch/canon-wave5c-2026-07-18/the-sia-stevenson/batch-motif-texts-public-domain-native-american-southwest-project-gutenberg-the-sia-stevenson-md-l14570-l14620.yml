canonical_text:
  quote: ''
  summary: 'The passage briefly describes irregular sleeping and eating habits, then
    gives an ethnographic account of Nenenot sweat houses: flexible poles covered
    with tent skins are set over heated stones, water is poured on the stones to make
    steam, and bathers remain until nearly exhausted. It also recounts an incident
    in which an old man and wife leave a sweat house as a herd of reindeer rushes
    toward it.'
  language: English
  quote_policy: summarized
