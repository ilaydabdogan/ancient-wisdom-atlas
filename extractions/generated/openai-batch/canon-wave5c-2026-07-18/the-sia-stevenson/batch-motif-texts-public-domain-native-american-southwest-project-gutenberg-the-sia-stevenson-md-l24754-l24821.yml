canonical_text:
  quote: ''
  summary: The passage describes the Anuijg-ite or Two Faces, a feared nocturnal being
    associated with bells and animal cries. A mother expels her disobedient son from
    the lodge while threatening that the being will put him in its ear; the boy disappears.
    The parents later ambush, wound, bind, and burn the monster, recover the son from
    one of its ears, and see many objects fly from the fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aiiiigg-ite or Two Faces takes a child from its parents, uses a rose brush
    on the child's face to make it cry, and speaks in a woman's soothing expression.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Anuijg-ite or Two Faces is heard passing along while kicking the ground;
    different steps are accompanied by bells, an owl hoot, buffalo snorting, a chickadee,
    and other animal cries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People fear the Anuijg-ite, do not know where it lives, do not follow it,
    and avoid going outdoors at night.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Anuijg-ite can catch a lone man and throw him into one of its very large
    ears, each of which can hold three men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A mother threatens her disobedient son that the Anuijg-ite will toss him into
    its ear, then pushes him outside the lodge and secures the entrance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy runs crying around the lodge, becomes silent, and cannot be found
    by his parents or by people in a neighboring camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother later hears a voice repeating that she told a ghost to take the
    child, along with the rattling of small bells.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother plans to hide near the wood-pile with a knife and to call her husband
    after catching the being by the leg.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The being comes at night making bird and animal cries, stands by the lodge,
    rises above the smoke-hole, and looks down into the lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother and husband seize, wound, pull down, tie, bind, and guard the monster
    until daylight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: By daylight the monster is seen as hideous and covered with thick hair except
    on its faces.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The parents split the monster's ears and find their lost son in one ear, very
    lean, unable to speak, and covered with long hair from legs to head while his
    head and face remain smooth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that the son would have become an Anuijg-ite if he had
    not been rescued, and that he did not live long afterward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After recovering the son, the parents burn the monster on a fire, and many
    objects and birds fly out of the fire like sparks.
  category: sequence
  evidence_refs:
  - ev:8
