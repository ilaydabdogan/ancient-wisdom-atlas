canonical_text:
  quote: ''
  summary: The passage contrasts lower-world water deer with smaller deer of this
    world, describes deer and rabbit hunts organized through ritual actions, recounts
    a feast where Po'shaiyanne's food and water appear and transform some eaters'
    appearance, and ends with Po'shaiyanne's departure, promise to return, and warning
    that another people will come.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says lower-world deer are called sits' ta ne, or water deer; they
    lived in water, grazed over mountains, and were larger than deer in this world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The circle is entered at the southeast; Ma'asewe leads half the people left
    around it, and Oyuuyewe leads the remainder right around it; Po'shaiyanne closes
    the opening and stands by the entrance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deer are gathered closely, shot with arrows, flayed, and taken to the
    village as flesh and skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Po'shaiyanne instructs the people to give the largest deer to the ti'amoni
    and smaller deer to household groups, then destroys the circle of meal after the
    people leave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ti'amoni tells the coyote of his wish for rabbits; in the morning a large
    fire is made and the coyote speaks to the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The coyote throws meal to the cardinal points, zenith, and nadir, and prays
    that the sun father will gather small and large rabbits nearby.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people pass rabbit sticks through the flames, form a large circle around
    the rabbits, and secure many rabbits.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The ti'amoni announces a feast; women work in two groups, one for the ti'amoni
    and one for Po'shaiyanne; after an exchange, the ti'amoni hosts the feast at his
    house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At sunrise, the ti'amoni spreads bowls of mush, bread, and meat; when he asks
    Po'shaiyanne to bring food, Po'shaiyanne's food immediately appears on tables
    in very beautiful bowls.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: All ages are invited to the feast; many prefer Po'shaiyanne's table, and those
    who drink his water and eat his food immediately become whiter in skin, while
    others remain as before.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Po'shaiyanne visits all the pueblos, passes on to Chihuahua in Mexico, says
    he will return first to this village, and tells the ti'amoni that another people
    will come and that the village should be left before they arrive.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: An editorial footnote says the reference to tables may indicate that this
    portion is later and has Christian or biblical coloring.
  category: other
  evidence_refs:
  - ev:7
