canonical_text:
  quote: ''
  summary: 'The passage recounts Sia migration events: rising waters force refuge
    on a mesa; offerings fail until a youth and maiden are cast down and the waters
    recede; the softened earth is hardened by a Ka''pina theurgist. The Sia then seek
    the earth''s center, send the swallow Si''sika to inspect the northern white-house,
    and build Koasaia after its plan, with a lynx representing the absent cougar guardian.
    The passage then introduces Po''shaiyanne, born of a virgin at Pecos after she
    ate two piñon nuts, rejected as a child, and silently present among the ti''amoni
    and theurgists in the chita.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After four years, the ti'iimoni wished to travel toward the center of the
    earth; rising waters made the earth like a vast river, and the group went up onto
    a mesa for safety.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ti'iimoni offered plumes and other precious items to the flood, then dressed
    a youth and maiden in fine blankets and beads and cast them from the mesa top,
    after which the waters receded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the earth became visible again it was soft, animals sank into it, and
    the earth is described as angry.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ti'iimoni called the Ka'pina Society and asked how to make the earth solid;
    a Ka'pina theurgist later reported that he had worked over the earth and hardened
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During their journey from the northern white-house, the Sia built many villages
    close together before deciding that they had reached about the center of the earth
    and should build a permanent home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ti'amoni wanted the new village to copy the northern white-stone house
    but could not remember its construction; he held a night council and selected
    Si'sika, the swallow, to examine it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Si'sika went to the northern white-house, flew over and around it, examined
    it, and returned after noon to report that he could describe it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A village was constructed according to Si'sika's plan and named Koasaia; the
    passage identifies it with a ruin north of the present site of Sia.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The cougar could not leave her post at the northern white-stone village, so
    the lynx was selected as her representative at the duplicated village; the doorway
    of the north wind was not duplicated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ti'amoni and the people entered the large chita for thanksgiving services,
    rejoiced at the village's completion, planted corn, and had fields.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Po'shaiyanne is introduced as a quasi messiah who visited the Sia village
    after attaining greatness and while touring pueblos before going into Mexico.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Po'shaiyanne was born of a virgin at Pecos after she became pregnant from
    eating two piñon nuts; the passage reports that the Jemez Indians have a similar
    legend.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Po'shaiyanne's mother rejected him when he was young; he obtained food, shelter,
    and clothing cast off by others.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: As a little boy, Po'shaiyanne followed the ti'amoni and theurgists into the
    chita, sat apart by the ladder, listened to their talk, and passed a brand to
    light cigarettes, while no one spoke to or thanked him.
  category: action
  evidence_refs:
  - ev:10
