candidate_motifs:
- id: motif:1
  label: Flood recedes after youth-and-maiden offering
  taxonomy_refs:
  - flood_and_renewal
  - sacrifice
  basis: The waters rise over the earth; ordinary offerings fail; a youth and maiden
    are adorned and cast from the mesa, and the waters recede immediately afterward.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state whether the pair die, only that they are cast
    from the mesa top and that the waters recede.
- id: motif:2
  label: Earth restored after flood by ritual specialist
  taxonomy_refs:
  - flood_and_renewal
  basis: After the flood the earth is too soft for animals to move across; the Ka'pina
    theurgist performs work over the earth and reports that it is hardened.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The method is not detailed in this passage and is only described as the
    same means used on a previous occasion.
- id: motif:3
  label: Journey to the center of the earth and founding a home
  taxonomy_refs:
  - world_center
  basis: The ti'iimoni desires travel toward the center of the earth, and the Sia
    later decide they have about reached it and build a permanent village.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage presents the center as a migration destination and settlement
    site, not as an abstract cosmological diagram.
- id: motif:4
  label: New settlement copied from a sacred northern prototype
  taxonomy_refs: []
  basis: The ti'amoni wishes the village to be an exact model of the northern white-house;
    Si'sika surveys that prototype, and Koasaia is built after the plan he provides.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: No supplied taxonomy reference directly names this architectural-copying
    pattern.
- id: motif:5
  label: Animal messenger obtains needed knowledge
  taxonomy_refs:
  - wisdom
  basis: The swallow Si'sika is chosen for his good head, inspects the distant white-house,
    and brings back the details needed to build the village.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage treats Si'sika as capable and knowledgeable, but does not
    frame the episode as a contest or revelation.
- id: motif:6
  label: Guardian animal represented by substitute animal
  taxonomy_refs: []
  basis: The cougar, mother of the north village, cannot leave her post, so the lynx
    is chosen as her representative at the duplicated village.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives the substitution but does not explain the ritual function
    of the representative.
- id: motif:7
  label: Virgin conception through eating two piñon nuts
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Po'shaiyanne is said to be born of a virgin who became pregnant from eating
    two piñon nuts.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not identify a divine father or additional mechanics
    of conception.
- id: motif:8
  label: Rejected miraculous child later associated with messianic status
  taxonomy_refs:
  - miraculous_child
  - culture_hero
  basis: Po'shaiyanne is introduced as a quasi messiah after attaining greatness,
    but his birth is followed by maternal rejection, poverty, and exclusion from normal
    youth instruction.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not narrate the process by which he attains greatness.
- id: motif:9
  label: Unacknowledged child listens to wise men from the threshold
  taxonomy_refs:
  - wisdom
  basis: Po'shaiyanne repeatedly enters the chita, sits apart by the ladder, listens
    to the wise talk of the ti'amoni and theurgists, and serves them without recognition.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly state that this listening grants him wisdom,
    though the setting and action suggest a wisdom-related pattern.
comparison_claims:
- id: claim:1
  claim: The passage itself reports that the Jemez Indians have a similar legend to
    the Pecos account of Po'shaiyanne's unusual birth.
  claim_level: same_motif
  target: Jemez Indian legend compared with the Pecos Po'shaiyanne birth account
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The Jemez version is not narrated in the passage, so the precise shared
    elements cannot be verified here; the statement is reported by the writer through
    another informant.
