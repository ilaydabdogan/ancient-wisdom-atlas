canonical_text:
  quote: ''
  summary: The passage describes the Society of Warriors and the Knife Society as
    allied ritual societies connected with Ma'asewe and U'yuuyewC, twin children of
    the sun, and with arrows given by the sun father. It then details the required
    trophies and ceremonial sequence by which a returning victor is met, prayed over,
    led into the village, purified, costumed, made to dance silently with the scalp
    trophy, and finally declared a member of the Society of Warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Society of Warriors and the Knife Society share a ceremonial chamber and
    are described as closely allied.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ma'asewe and U'yuuyewC are identified as twin children of the sun and as the
    original presiding officers of the Society of Warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Knife Society is said to derive its name from arrows given by the sun
    father to invulnerable twins, who used them to destroy the enemies of the earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Both the Society of Warriors and the Knife Society have a role in the initiation
    of a victor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Killing an enemy alone does not admit a man into the Society of Warriors;
    he must return with trophies such as a scalp and buckskin apparel.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The victor carries the scalp first on an arrow and later on a pole, and if
    arriving after midday he waits outside the village until morning while the war
    chief brings food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Knife Society, Warriors, and male populace meet the victor; a prayer is
    offered, and the spirit of the enemy is addressed as no longer an enemy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At sundown the ho'naaite of the Warriors, his vicar, and the victor lead the
    party to the village with the pole and scalp, encircle the village from right
    to left, and enter the ceremonial chamber.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The scalp is deposited before a meal painting prepared by the ho'naaite of
    the Knife Society, with fetiches arranged around it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two large stone images of Ma'asewe and U'yuuyewC are brought out only for
    the initiation of a victor into the Society of Warriors and are not viewed by
    women.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: At sunrise the scalp is washed in yucca suds and cold water by each member
    of the Knife Society; afterward the victor's hands are washed for the first time
    since the scalping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The victor paints his body with red on the face and lower legs, black on the
    rest, and galena over much of the face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Knife Society wears white embroidered cotton kilts and moccasins, while
    the Warriors and victor wear buckskin garments; the victor carries bow, arrows,
    and the pole with the scalp.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: An arrow point is placed in the victor's mouth before the plaza dance, during
    which he dances silently between the society lines and raises the scalp on the
    pole.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Men of the village join with war clubs and firearms, and women also join in
    the dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After returning to the ceremonial chamber, the final epic ritual declares
    the victor a member of the Society of Warriors, and the arrow point is removed
    from his mouth.
  category: speech
  evidence_refs:
  - ev:9
