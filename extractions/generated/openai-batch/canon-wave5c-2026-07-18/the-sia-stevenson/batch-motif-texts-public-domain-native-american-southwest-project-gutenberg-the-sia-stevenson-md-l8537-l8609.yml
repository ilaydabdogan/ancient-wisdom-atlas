canonical_text:
  quote: ''
  summary: The passage describes missionary efforts and nominal conversion, continued
    reliance on shamans, an 1883 episode involving a renowned shaman named S4pa during
    illness among Koksoak people, alleged social manipulation, theft, and belief in
    shamanic power over reindeer spirits. It also records an anecdote of a son taking
    his mother as wife, regional notes on Innuit distribution and island people, and
    general characterizations of Innuit conduct toward honesty, insult, jealousy,
    courage, and work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Missionaries worked to convert the people, but the passage says many professions
    of Christianity were nominal and that converts returned to the shaman for guidance
    when away from the teacher's influence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In spring 1883 a visiting party came to Fort Ohimo, while many Koksoak people
    were ill about 30 miles above the station.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The visiting party included a shaman renowned throughout the land, who, with
    the connivance of two or three hosts, began intrigues said to be aimed at dispelling
    an evil spirit afflicting the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several men were parted from their wives, some women were compelled to dwell
    with men described as conspirators, and other couples fled to avoid being divorced
    at least temporarily.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the visitors descended to Fort Chimo, the shaman announced his conversion
    to Christianity during bartering and vowed not to return to shamanism.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: On their return, the harried fugitives passed the Koksoak river camp, stole
    reindeer meat and other property, attempted to take a kaiak, were overtaken, and
    were compelled to give up the stolen property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same group was later said to fear returning among the Koksoak people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The shaman is named S4pa and is characterized by the narrator as a plausible
    scamp.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says S4pa's power over spirits controlling the reindeer was widely
    believed and invoked by other shamans who felt unable to turn the heads of the
    deer themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage reports that among these people the narrator had heard of a son
    who took his mother as a wife and was compelled by community sentiment to discard
    her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the son discarded his mother, he took two other women, who were persecuted
    by the mother and believed themselves to be wholly under her influence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The two later wives became ill and died after believing themselves under the
    mother's influence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says the Innuit formerly extended around the shore of Hudson Bay,
    while at the time described there was a wide gap between the vicinity of Fort
    George and Fort Churchill.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Itivimyut identified island-dwelling Innuit as Ki'glktag'myut, or island
    people, and described their customs as different from mainland people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The island people were described as wearing chiefly seal and dog skins, rarely
    reindeer skins, trading with the shore for unavailable articles, using spear,
    kaiak, bow, and arrow, having little knowledge of firearms, facing extreme food
    scarcity, and speaking a language said to differ considerably from neighbors.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage characterizes the Innuit generally as peaceful and mild-tempered
    except when aroused by jealousy, quick to resent insult or avenge injury, attached
    to honest white men, suspicious after deception, courageous, able, and willing
    to perform arduous tasks with encouragement.
  category: attribute
  evidence_refs:
  - ev:8
