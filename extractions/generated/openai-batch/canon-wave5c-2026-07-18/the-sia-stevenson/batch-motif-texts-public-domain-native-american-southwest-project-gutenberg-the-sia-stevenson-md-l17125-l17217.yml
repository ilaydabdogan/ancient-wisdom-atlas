canonical_text:
  quote: ''
  summary: 'The passage contains several narrative episodes: a wolverene taunts a
    speaking rock and is trapped when the rock rolls onto him; wolves, foxes, and
    lightning are called to help, and lightning breaks the rock while tearing the
    wolverene''s coat or skin; frog and mouse sisters sew the torn coat, with different
    consequences; wolverene marries a female muskrat and their children become named
    progenitors of several peoples; a subsequent marten episode begins with the marten
    trying to entice a man''s wife and the husband preparing a trap involving boiling
    water.'
  language: English
  quote_policy: summarized
