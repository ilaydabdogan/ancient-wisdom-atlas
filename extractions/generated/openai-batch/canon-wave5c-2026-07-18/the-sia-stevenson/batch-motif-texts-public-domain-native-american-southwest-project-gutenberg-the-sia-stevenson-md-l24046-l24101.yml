canonical_text:
  quote: ''
  summary: 'The passage describes ritual actions at a dancing lodge: release of a
    pierced dancer by breaking thongs, redistribution of horses and gifts, decoration
    of pierced candidates, flesh offerings at a sun pole, songs and smoking, ear-piercing
    of children, an ordeal involving a horse owner fastened to the sun pole, and a
    night dance with crying at posts and eastward orientation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Friends of a short dancer gave a horse to another man and directed him to
    release the dancer by pulling at the thongs until they broke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The releasing man grasped the short dancer, threw himself violently to the
    ground, broke the thong, and brought the short dancer to the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The short dancer's kindred brought gifts including calico, moccasins, a horse,
    and other property; old women scrambled for the gifts, and a thrown stick determined
    who won the horse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a young man's flesh was pierced, female relations furnished porcupine-quill-decorated
    objects and suspended them from the pierced places as a mark of respect.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that women sometimes deprived themselves of all their property
    through these acts of giving decorated objects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men who did not intend to dance sat near the sun pole, had small shoulder-flesh
    pieces cut out with a new knife, held up the pieces to show them to the pole,
    and covered the pole's base with earth; women could also offer pieces of flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People outside the dancing lodge sang in praise of devotees, while old women
    walked and danced with clothing and hair in disorder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Attendants held pipes for candidates to smoke, decorated the candidates again,
    and the dancing resumed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Girls and boys whose ears were to be pierced were gathered, presents were
    given to poor people, and after the ear-piercing the candidates resumed dancing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The owner of a horse was tied to the horse's tail, pierced in the chest in
    two places, fastened by thongs to the sun pole, and released when attendants whipped
    the horse so that it darted away and broke the thongs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The devotees danced through the night, rested near midnight, and each stopped
    and cried at each post while making a circuit of the dancing lodge.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At midnight the attendants made the devotees turn and stand facing east, as
    they had earlier been made to face west in the afternoon.
  category: action
  evidence_refs:
  - ev:9
