  summary: The passage describes spirits of the mystery sacks as personal guardian
    powers conferred at initiation, then describes the Moving Deity as a feared wakan
    power invoked by ritual specialists and war prophets, associated with four winds,
    night spirits, war implements, animal agents, stone symbolism, the Four Winds
    ceremony, and war-related rites.
  language: English
