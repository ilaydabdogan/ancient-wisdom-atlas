candidate_motifs:
- id: motif:1
  label: Rival sibling pair in a sunrise precedence contest
  taxonomy_refs:
  - sibling_pair
  - duality
  basis: Two sisters lead divided groups; the elder declares that the sister first
    seen by the sun will claim her people and destroy the other side, and the younger
    sister wins through Shuah-kai's manipulation of the light.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The sisters are not described as twins; the contest is decided through
    bird intervention rather than an unmanipulated judgment.
- id: motif:2
  label: Creation of celestial couriers and mediators
  taxonomy_refs: []
  basis: Ko'shairi and Quer'ranna are created as messengers between the Ka'suna and
    the sun or moon, with Ko'shairi also mediating between earth people and the sun.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives functions but does not provide a broader origin narrative
    for the Ka'suna within this excerpt.
- id: motif:3
  label: Bird helper redirects the first sunlight
  taxonomy_refs: []
  basis: Shuah-kai removes a wing plume and blocks the sun so light passes through
    the gap and falls on the younger sister first.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The bird is a helper in this passage; labeling it as a trickster would
    exceed the evidence.
- id: motif:4
  label: Defeated sister's heart becomes rats
  taxonomy_refs: []
  basis: After killing the elder sister, the younger sister cuts out and dismembers
    the heart; rats appear from the pieces, and cactus inside the heart explains the
    rats' later habitat.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is an etiological transformation, not a resurrection of the dead
    figure.
- id: motif:5
  label: Origin of fighting attributed to the defeated elder sister
  taxonomy_refs: []
  basis: The younger sister tells the men and youths that the elder sister compelled
    them to fight and taught them to fight.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The claim is reported as the younger sister's speech after victory, not
    as an independent narrator statement.
- id: motif:6
  label: Institution of cult societies and restricted ritual knowledge
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Sus'slstinnako organizes cult societies, teaches all of them rain songs,
    and gives only certain societies secret methods for extracting disease.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives a brief institutional notice; the details and scope
    of the societies are not elaborated here.
- id: motif:7
  label: World-filling water after prosperous years
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage states that after eight happy and flourishing periods, the ninth
    period is bad and the whole earth is filled with water.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: Only the inundation is present in this excerpt; renewal or survival details
    are not included before the passage breaks off.
