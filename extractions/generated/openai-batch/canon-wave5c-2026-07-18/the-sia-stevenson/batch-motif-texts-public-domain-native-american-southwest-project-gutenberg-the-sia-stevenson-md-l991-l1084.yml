canonical_text:
  quote: ''
  summary: The passage recounts a conflict between an elder and younger sister around
    greeting the rising sun, the creation of two male couriers or mediators for the
    sun and moon, the bird Shuah-kai's intervention in directing sunlight toward the
    younger sister, the ensuing battle and death of the elder sister, the origin of
    rats from her heart, the organization of cult societies and ritual knowledge by
    Sus'slstinnako, and a later period when the earth is filled with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger and elder sisters plan to go together before sunrise with eagle-feather
    wands or plumes placed vertically on their heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger sister says the elder should go first because the elder is taller
    and older, while the narration states that the younger knows herself to be the
    greater and more important woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sus'slstinnako tells the younger sister to create one male messenger between
    the sun and the Ka'suna and another between the moon and the Ka'suna.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ko'shairi is created first and is described as courier, companion, jester,
    flute musician, mediator, chief for the sun in some duties, and servant of the
    sun during daily travels.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Quer'ranna is created second with duties like Ko'shairi's, but with the moon
    as his particular chief; both are subordinate to the sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The younger sister instructs Shuah-kai, a small black bird with white wings,
    to remove a plume from his left wing and spread his wings in front of the sun
    as the sun leaves his house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people divide between the two sisters, and the elder sister declares that
    whichever sister the sun looks upon first will claim her side as her people and
    destroy the other side.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Shuah-kai obscures the sunlight except through the opening made by the missing
    feather, so that the light covers the younger sister's wand and face and only
    barely touches the elder sister's plumes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The younger sister's people destroy the elder sister's people, and the sisters
    later wrestle while men stand in a circle around them.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: After the younger sister tires, her people throw the elder sister down and
    bind her hands; the younger sister then beats and kills her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The younger sister cuts open the elder sister's breast with a stone knife,
    removes the heart, cuts it into pieces, and rats appear after the pieces are thrown
    on the ground.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The center of the heart is said to be full of cactus, and the younger sister
    states that rats will live with cacti thereafter.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Sus'slstinnako organizes cult societies, teaches songs for rain to all of
    them, and gives only certain societies secrets for extracting disease by sucking
    and brushing processes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: After eight prosperous periods, the ninth period is described as bad, with
    the whole earth filled with water.
  category: sequence
  evidence_refs:
  - ev:12
