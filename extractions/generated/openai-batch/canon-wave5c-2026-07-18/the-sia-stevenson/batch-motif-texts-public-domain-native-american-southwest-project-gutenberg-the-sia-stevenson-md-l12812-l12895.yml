canonical_text:
  quote: ''
  summary: 'The passage gives three narrative units: a jealous man pursues two fleeing
    women and injures them near a whale carcass; an abused orphan boy is secretly
    helped by a girl, empowered by a man from the moon, and takes revenge on his persecutors;
    and an origin story explains the sun, moon, stars, and eclipses through a brother
    fleeing to the sky and a sister pursuing him with a burning brand.'
  language: English
  quote_policy: summarized
