canonical_text:
  quote: ''
  summary: The passage describes dog-drawn sleds as the usual means of land transportation,
    outlines sled-team sizes, explains the construction and lashing of wooden sled
    runners, and describes iron or frozen-mud runner shoes used and maintained in
    cold-weather travel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Land transportation is described as being carried out by sleds drawn by dogs;
    teams may range from one to twenty dogs, with seven or nine common for general
    use.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sled construction varies slightly by region according to available materials
    and the need for lighter or heavier sleds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A suitable tree, generally larch because of its strength, is selected for
    sled material.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each runner is made from a single piece of timber and should be as free as
    possible from knots and crossgrain because such defects make the wood brittle
    in cold weather.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Runners are roughly hewn where cut, then brought to a temporary camping place
    and shaped with plane and saw.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The forward curve of the runner is long and gradual so the sled can pass more
    easily over obstructions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Crossbars or slats are fastened to the runners with heavy sealskin line threaded
    through holes and notches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sealskin line is soaked before use so it becomes flexible and then shrinks
    tight while drying.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Metal is avoided in the lashing because it would break in cold weather, while
    thong binding allows the sled to flex over uneven surfaces.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The bottom of a runner may be shod with wide iron brought by traders and fastened
    with screws.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: For very cold travel, a runner shoe can be made from prepared humus or mud
    that is heated, cleaned of coarse materials, applied by hand to a wetted runner,
    and frozen solid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After freezing, the mud shoe is planed smooth, sprayed with water from the
    mouth, and rubbed with a reindeer-skin mitten until it has a black glass-like
    appearance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Damaged mud shoes can be repaired by freezing a fallen piece back on with
    water or by attaching a shaped piece of ice with freezing water.
  category: action
  evidence_refs:
  - ev:6
