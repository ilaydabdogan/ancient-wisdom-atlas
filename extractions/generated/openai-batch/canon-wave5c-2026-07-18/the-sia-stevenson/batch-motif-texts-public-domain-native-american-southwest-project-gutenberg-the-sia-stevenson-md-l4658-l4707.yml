canonical_text:
  quote: ''
  summary: 'The passage describes a Knife Society ceremonial sequence: cigarettes
    are lighted, special cotton garments are put on, smoke is offered over an altar
    to named recipients, medicine water is administered from a bowl containing stone
    fetiches, and members with eagle plumes and gourd rattles perform repeated ash
    sprinklings toward directions, zenith, and nadir for purification. A vice-ho''naaite
    then invokes the cloud people with repeated rattle motions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cigarettes were lighted from a long stick, and the ho'naaite and his younger
    brother put on white cotton embroidered Tusayan kilts as breechcloths while other
    members wore plain white cotton.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ho'naaite sat behind the altar, lighted a second cigarette, blew smoke
    over the altar, and addressed Pai'at&mo and Ko'pXshtaia with a smoke offering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ho'naaite administered medicine water to all present with a shell, and
    the vice-ho'naaite drank the last draft directly from the bowl without leaving
    a drop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the medicine water was consumed, the ho'naaite removed six stone fetiches
    from the bowl and returned them to a buckskin bag.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Members and novitiates formed a line behind the altar; official members held
    two eagle plumes in the left hand and a gourd rattle in the right hand.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A boy placed ashes from the fireplace near the altar on both the east and
    west sides of the meal line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy and an adult member used eagle plumes to dip ashes and sprinkle them
    toward north, west, east, south, and again north while changing sides of the meal
    line and dancing before the altar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ashes were thrown twice toward the zenith and then toward the nadir, and the
    directional sprinkling sequence was repeated fifteen times.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The text states that the repeated sprinkling was to carry off impurities of
    the mind so that songs would be pure and pass straight over the road of meal,
    called the one road.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The vice-ho'naaite stood before the altar, shook and waved a rattle, invoked
    the cloud people to come, waved the rattle in several directions, raised it above
    his head, and formed a circle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The rattle-waving sequence was repeated sixteen times; before each motion
    the vice-ho'naaite held the rattle still, resting it on eagle plumes in his left
    hand.
  category: sequence
  evidence_refs:
  - ev:10
