canonical_text:
  quote: ''
  summary: The BOGS subsection describes bogs as mysterious places containing hair-covered
    eyeless beings or objects that devour things and continually emit water. When
    such a being moves underground, water ceases at its former place and a new spring
    appears at its new resting place; people pray to the water before drinking to
    avoid illness from irreverence. A past attempt to remove one being from a bog
    and house it in a special tent caused water to flow around it and drown almost
    all the people. The supplied passage also includes an apparent inserted note about
    maturity rites, public ceremonies, religious training, youth responsibilities,
    and warrior fasts.
