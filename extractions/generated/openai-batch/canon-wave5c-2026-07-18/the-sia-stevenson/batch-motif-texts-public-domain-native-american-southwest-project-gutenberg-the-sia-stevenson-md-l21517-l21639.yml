  summary: The passage defines fetichism, distinguishes tribal or gens fetiches from
    individual amulets and charms, and describes Omaha and Osage sacred objects and
    rites involving a sacred pole, white buffalo hide, sacred tent, stone arrows,
    and sacred bags used in war, divination, and warrior testing.
  language: English, with Omaha and Osage terms and names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage cites a definition of fetichism as spirits embodied in, attached
    to, or conveying influence through material objects.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fetiches are divided into those pertaining to a tribe or gens and those belonging
    to individuals; some are called amulets and others charms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Omaha sacred pole and white buffalo hide were kept by the Hañga gens and
    were regarded as wakanda ega, described as like Wakandas or partaking of the nature
    of deities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: During public thanksgiving after the buffalo hunt, prayer was made toward
    the sacred pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sacred tent was not painted; its entrance faced sunrise in permanent villages
    and the direction of travel during migration.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sacred pole was protected from dew, rain, and snow, was not laid down,
    and in good weather could be displayed tied near the entrance or resting on a
    forked post.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people feared the pole and avoided treading on the sacred tent or its
    tent-poles; the passage reports a belief that horses treading on a tent-pole of
    the tent would later have broken legs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sacred stone arrows are reported as having been used for divination, with
    an associated Hañga personal name translated as Bad Arrow or Good Arrow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mysterious bags were called waqube, were addressed on certain occasions
    as grandfathers, and formerly numbered five among the Omaha, with three said to
    remain.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: War-portable sacred bags were made of skins and feathers of the pigeon hawk,
    fork-tailed hawk, and swallow.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Big Elk described a rite in which a principal captain untied a sacred bag
    four times and caused medicine odor to be wafted toward enemy lodges, making Pawnees
    forget their warlike temper and weapons; the passage notes that this account was
    denied by Joseph La Flèche and Two Crows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a related Omaha account, principal captains opened sacred bags in a circle,
    had a central ujeʇi or hole made, and held the bird mouth of the bag toward the
    foe or during horse-stealing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: During the Omaha wastegistu ordeal, successful warriors addressed a sacred
    bag as an old or venerable man, dropped a small stick on it, and the stick resting
    on the bag was taken to show truthfulness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'The Osage custom is described as corresponding: old men assembled at the
    war tent, sacred bags were brought to test warriors, and warriors laid four sticks
    in succession on a sacred bag in an ordered sequence of ranks and war achievements.'
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
