canonical_text:
  quote: ''
  summary: 'The passage describes Hidatsa animistic belief: individualized natural
    beings are said to possess a spirit or shade; some shades merit greater respect
    than others. The cottonwood is especially important, its shade may assist if properly
    approached, and its spirit is said to cry when a river freshet pulls it into the
    water. Cutting large cottonwoods was formerly considered wrong, and some old men
    attribute misfortunes to disregard for the living cottonwood. The sun is highly
    venerated and receives valuable sacrifices.'
  language: English
