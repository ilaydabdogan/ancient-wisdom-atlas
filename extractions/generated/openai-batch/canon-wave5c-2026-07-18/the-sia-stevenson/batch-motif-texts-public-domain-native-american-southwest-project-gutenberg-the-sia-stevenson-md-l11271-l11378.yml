literal_observations:
- id: obs:1
  text: After a seal is killed and brought to camp, the hunter signals success from
    a distance, and people in camp raise a joyful shout.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seal is drawn ashore and skinned; its flesh may be eaten raw during skinning
    or divided among different persons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The animal's blood is collected and mixed with hot liquid from boiled meat
    to make a dish eaten by adults and young people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The feast continues until the flesh is consumed and people are very full;
    stories are told and good humor prevails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Different species of fish from shallow bay waters are also used as food.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Adults use tobacco for smoking, chewing, and as snuff, though not every person
    uses all three forms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Plug tobacco for smoking and chewing is carried in a small sealskin pouch
    attached to the belt; watches may also be carried in the same pouch.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snuff is prepared from leaf tobacco when available, or from plug tobacco,
    by shredding, drying, and pounding it in a fold of sealskin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Snuff is kept in a purse-shaped bag with a thong closure and an attached ivory
    spoon; the spoon is used at the nostril while the other nostril is closed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old women are described as more addicted to snuff than men, and the strong
    snuff is said to show its effect quickly in the face.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The umiak is described as the principal water conveyance of the Eskimo of
    Hudson Strait.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that the umiak is often called a woman's boat, but argues
    that family boat is a more applicable label; women use it alone only rarely, while
    men are nearly always in it for long journeys.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Hudson Strait umiak is said to differ greatly in form from that of the
    Eskimo of Bering Sea.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The umiak's size varies according to the builder's means and the size of the
