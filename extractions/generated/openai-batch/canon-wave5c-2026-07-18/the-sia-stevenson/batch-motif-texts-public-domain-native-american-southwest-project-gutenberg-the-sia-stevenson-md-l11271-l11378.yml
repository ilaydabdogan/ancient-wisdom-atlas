  quote: ''
  summary: The passage describes a seal hunt return and communal eating, tobacco and
    snuff use with associated bags and implements, and the umiak as a principal Hudson
    Strait Eskimo water conveyance, including its social use, comparison with Bering
    Sea forms, and construction details.
  language: English
