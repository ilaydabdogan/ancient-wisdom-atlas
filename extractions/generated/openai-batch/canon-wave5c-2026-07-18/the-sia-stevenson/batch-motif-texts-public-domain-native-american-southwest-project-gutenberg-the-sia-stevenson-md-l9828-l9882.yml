canonical_text:
  quote: ''
  summary: 'The passage describes a hunting talisman: a shaman sets an image of a
    famous hunter-conjurer on a pole to draw deer toward a desired place. The image
    bears clothing, a polar-bear-skin belt, beads, amulets, bullets, a small doll,
    and a semicircular object called a hastener, which is said to help a hunter move
    with extraordinary speed. The whole object is called a materialization of a Tung
    ak.'
