canonical_text:
  quote: ''
  summary: A Knife Society ceremonial passage describes prolonged singing, appeals
    to cloud people for rain, altar movements with rattles, plumes, ya'ya, water,
    corn pollen, corn meal, medicine and cloud bowls, pebble fetiches, repeated sprinklings,
    and boys preparing cigarettes near the fireplace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song is described as an appeal to cloud people of the north, west, south,
    east, and the world to gather and send rain to water the earth so people may have
    fruits of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a sixteenth repetition, a rattle is waved over the altar; the ho'naaite
    handles two central ya'ya in time with the song while attendants move rattles
    and feathers in harmony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young novitiate holds neither rattle nor plumes, while a boy who has passed
    through two degrees holds a rattle and a miniature crook.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boys at the east end of the line fall asleep, and a man beside them tries
    to keep them awake by brushing their faces with eagle plumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The singing continues in long intervals with short rests, running from about
    half past eleven until midnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A vase of water and a gourd are placed near the altar, and the ya'ni siwittanni
    pours gourdfuls of water into medicine and cloud bowls, dances before the altar,
    gives bird-like trills calling cloud people to gather, and drinks twice from the
    medicine bowl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Members receive two small medicine bags, one with corn pollen and one with
    meal from six varieties of corn, and later sprinkle pollen and meal into the medicine
    bowl while calls are given for cloud people to gather.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pollen sprinkling is repeated four times, and the novitiates do not take
    part in that feature although they have bags of pollen and meal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ya'ni siwittanni drops pebble fetiches alternately into the medicine and
    cloud bowls until each contains six, then stirs and sprinkles water from the bowls
    over the altar; this sprinkling is repeated six times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ho'naaite, another man, and each member sprinkle the altar, with repeated
    exhortations to the cloud people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the song closes, two boys prepare cigarettes before the fireplace using
    corn husks, saliva, and either native or commercial tobacco.
  category: action
  evidence_refs:
  - ev:8
