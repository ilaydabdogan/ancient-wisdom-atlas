canonical_text:
  quote: ''
  summary: The younger and elder sisters test each other through questions about tracks,
    covered figures, an altar, a concealed object, and a room of Ka'suna beings. The
    younger sister repeatedly succeeds with the prompting or direction of Spider Woman.
    A closing classificatory note lists three divisions of Spider Woman's creation
    and identifies Spider Woman as parent of all, first parent, and both father and
    mother.
  language: English with transcribed Sia names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger sister sends the Chas'ka, identified as a chaparral cock, from
    the house of the sun in the east to the sun's home in the west.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger sister shows the elder sister bird footprints in soft ground,
    arranged in a straight line between the sun's eastern house and western house,
    with feet that appear to point both ways.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger sister asks the elder sister four times which direction the bird
    went; the elder cannot tell with certainty and guesses east, while the younger
    calls the bird from the west.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elder sister says the younger sister is greater that day because the younger
    knew where the bird was and called it successfully.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder sister presents a blanket-covered figure with crossed feet and asks
    the younger sister four times to identify it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Prompted by Spider Woman, the younger sister says the covered figure is not
    one of the beings created by Spider Woman but something made by the elder sister;
    the elder sister confirms this and uncovers a human figure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The younger sister prepares an altar under Spider Woman's direction, covers
    it with a blanket, and asks the elder sister four times what it is; the elder
    sister cannot tell, and the altar is uncovered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder sister prepares a covered object; the younger sister, accompanied
    invisibly by Spider Woman near her ear, says it contains all things necessary
    for all time to come, and the elder sister confirms this answer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder sister tells the younger that although the elder may be larger and
