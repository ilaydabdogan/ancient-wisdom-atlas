canonical_text:
  quote: ''
  summary: 'The passage reports Hidatsa beliefs about existence after death: shades
    travel to an ancestral underground or dead village, must cross a dangerous river
    by a narrow footway, retain social distinctions, may linger four nights near the
    former home, and may be kept away by scorched moccasins. It also describes hunting,
    animal shades, inverse seasons, suicide ghosts, and attitudes toward ghosts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After death, people are said to be restored to underground mansions of their
    ancestors, but a large and rapid watercourse lies between.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead are obliged to cross the river on a very narrow footway.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those described as useful to the nation, including brave warriors or good
    hunters, cross easily and arrive safely at A-pah-he; those described as worthless
    slip into the stream and are carried into oblivion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Hidatsa shade lingers four nights around the camp or village where the person
    died before going to the lodge of departed kindred in the Village of the Dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Village of the Dead, valor, self-denial, and ambition are rewarded
    by the same kind of regard as on earth; the brave are honored and the coward is
    despised.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some say ghosts of those who commit suicide occupy a separate part of the
    village, but their condition does not otherwise differ from that of others.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the next world, human shades hunt and live on the shades of buffalo and
    other animals that have died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next world has four seasons, but their order is inverse to the terrestrial
    seasons.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the four nights of lingering, people who disliked or feared the deceased
    scorch a pair of moccasins with red coals and leave them at the lodge door; the
    smell of burning leather is said to keep the ghost out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The true friends of the dead man take no such precautions against the shade.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says people believe in human and other ghosts; children may be
    frightened after nightfall by the shout “nohidahi,” but the aged are not scared
    by it.
  category: speech
  evidence_refs:
  - ev:7
