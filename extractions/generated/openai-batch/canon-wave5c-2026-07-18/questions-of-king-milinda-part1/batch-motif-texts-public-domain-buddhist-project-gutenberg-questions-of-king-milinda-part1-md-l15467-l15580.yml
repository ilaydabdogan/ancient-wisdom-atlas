canonical_text:
  quote: ''
  summary: 'The passage closes a dilemma concerning a woman who refused wrongdoing
    because she found no wooer comparable to Mahosadha, who is described as wise and
    endowed with twenty-eight virtues. King Milinda accepts Nagasena''s answer. A
    new dilemma begins concerning the fearlessness of arahats: Milinda cites the teaching
    that arahats have laid aside fear, then asks why five hundred arahats fled when
    the man-slaying elephant Dhana-palaka bore down on the Blessed One at Rajagaha,
    while Ananda alone remained. A note compares this version with Vinaya accounts
    in which the elephant is called Nalagiri and details about five hundred arahats,
    flight, and Ananda are absent.'
  language: English
  quote_policy: summarized
