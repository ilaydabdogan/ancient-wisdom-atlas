canonical_text:
  quote: ''
  summary: 'A dialogue argues against the claim that an act done to one who does not
    accept it is empty. It uses analogies of fans producing wind to cool fever, a
    drum producing sound after an earlier sound has vanished, and earth supporting
    seeds without consent. These analogies are applied to the Tathagata after his
    passing away: reverence to his relics, wisdom, doctrine, discipline, and teaching
    can still produce goodness, attainments, and release from the threefold fire.
    The passage ends by beginning another analogy about worms born inside animals
    or men without their consent.'
  language: English
  quote_policy: summarized
