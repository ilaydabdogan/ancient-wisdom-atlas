  summary: Assagutta describes King Milinda of Sagala as a formidable disputant who
    troubles the Order with speculative questions. Sakka identifies the god Mahasena
    of the Ketumati mansion as able to converse with Milinda and resolve his doubts,
    and the Order asks Mahasena to be reborn among humans. Mahasena initially expresses
    reluctance toward the human world, which he calls burdened with Karma.
