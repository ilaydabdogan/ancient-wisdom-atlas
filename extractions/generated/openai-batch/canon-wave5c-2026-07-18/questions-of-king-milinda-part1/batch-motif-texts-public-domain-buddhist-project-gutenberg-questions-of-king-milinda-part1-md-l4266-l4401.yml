canonical_text:
  quote: ''
  summary: The passage narrates Nagasena preaching and studying the Abhidhamma and
    the three baskets of the Buddha's word, receiving a donor's gift, being admonished
    that textual mastery is not yet attainment, attaining Arahatship with celestial
    and earthly signs, being summoned to a Himalayan assembly of Arahats, and being
    commissioned to answer King Milinda's difficult questions. It then shows Milinda
    seeking a learned religious interlocutor and being directed to Ayupala.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nagasena preaches from the Abhidhamma, and insight into the arising and passing
    away of conditioned things arises in his heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A merchant from Pataliputta gives Nagasena a rare woollen cloth measuring
    sixteen cubits by eight, salutes him, keeps him on his right hand while passing
    around him, and departs pleased.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena goes to Dhamma-rakkhita at the Asoka Park and learns the whole of
    the three baskets of the Buddha's word by heart in three months, then masters
    their deeper meaning in three more months.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dhamma-rakkhita compares Nagasena to a herdsman who tends cows while others
    enjoy the produce, saying Nagasena carries the three baskets in his head but has
    not yet partaken of the fruit of Samaṇaship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: On that night Nagasena attains Arahatship together with the fourfold power
    of wisdom possessed by Arahats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Nagasena's penetration of the truth, gods shout approval, the earth thunders,
    Brahma gods clap their hands, and a heavenly shower of sandal dust and Mandarava
    flowers falls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An innumerable company of Arahats at the Guarded Slope in the Himalaya mountains
    sends for Nagasena; he vanishes from the Asoka Park and appears before them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Arahats say King Milinda harasses the brethren with knotty questions and
    arguments, and they ask Nagasena to go and master him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena declares that even if all the kings of India ask questions, he will
    break up and solve their puzzles, and he tells the elders they may go fearlessly
    to Sagala.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Elders go to Sagala, described as lighting it up with their yellow robes
    like lamps and bringing breezes from the heights where sages dwell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: On a beautiful pleasant night, King Milinda asks which wandering teacher or
    Brahman he can visit for questioning, and the five hundred Yonakas recommend the
    elder Ayupala at the Sankheyya hermitage.
  category: speech
  evidence_refs:
  - ev:9
