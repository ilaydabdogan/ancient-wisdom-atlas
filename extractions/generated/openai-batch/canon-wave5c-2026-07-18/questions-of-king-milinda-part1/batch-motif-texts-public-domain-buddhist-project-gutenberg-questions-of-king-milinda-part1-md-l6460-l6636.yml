canonical_text:
  quote: ''
  summary: King Milinda asks Nagasena about the root and ultimate point of past, present,
    and future time. Nagasena explains a causal chain beginning with ignorance and
    uses seed-fruit, hen-egg, and circular diagrams of sense-contact sequences to
    illustrate that the ultimate beginning of past time is not apparent, while individual
    arising and dissolution can be traced within the chain.
  language: English
  quote_policy: summarized
