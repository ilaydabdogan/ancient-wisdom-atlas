  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nagasena gives an illustration in which a hen lays an egg, an egg produces
    a hen, and the series has no end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena draws a circle on the ground and asks whether it has an end; the
