canonical_text:
  quote: ''
  summary: 'Dialogue passage distinguishing classes of minds: self-dependent Paćceka-Buddhas,
    complete Buddhas, and omniscient Buddhas. It explains their powers of thought
    through similes of a brook and ocean, a burnished dart from a crossbow, rapid
    bodily actions, a wealthy man''s stored provisions, and a fruit-laden tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sixth class is described as Paćceka-Buddhas who depend on themselves,
    want no teacher, dwell alone like the solitary horn of the rhinoceros, and have
    thinking powers that act easily within their own province but slowly in the province
    of a perfect Buddha.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is said to cross a shallow brook on his own property without fear, but
    to hesitate before a mighty ocean that is deep, wide, ever-moving, and without
    a visible further shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seventh class is described as complete Buddhas with all knowledge, tenfold
    power, four modes of self-confidence, eighteen characteristics of a Buddha, unlimited
    mastery, and nothing hidden from their grasp.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A burnished, rust-free, smooth, fine-edged, straight dart on a powerful crossbow
    is described as moving without clumsiness or delay through fine linen, cotton,
    or delicate woolwork.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The thinking powers of omniscient Buddhas are said to outclass the other six
    classes, and the Blessed One is said to display the double miracle because his
    mind is clear and active.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One's all-embracing knowledge is described as dependent on reflection,
    yet reflection is said to operate more rapidly and easily than passing an object
    from one hand to another, speaking with the mouth open, swallowing food already
    in the mouth, opening or shutting the eyes, or stretching or bending the arm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king asks how reflection can be needed if reflection seeks what is not
    yet clear; Nāgasena answers with the case of a wealthy man whose prepared food
    is temporarily unavailable though he has many provisions stored away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A tree full of fruit with branches bent by the weight of bunches is said not
    to be barren merely because no fruit has yet fallen from it.
  category: object
  evidence_refs:
  - ev:5
