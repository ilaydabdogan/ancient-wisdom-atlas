    cleaving to it for the sake of righteous life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A battle wound is described as being anointed with salve, smeared with oil,
    and bound with a bandage, though the wound itself is not dear to the wounded person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One is said to have declared the body to be like a wound or sore,
    with the cited verse describing it as skin-covered, impure, nine-apertured, and
    oozing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nagasena affirms that the Blessed One was omniscient and foresaw all things,
    while also saying that rules for the Order were laid down only when need arose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A physician who knows medicinal drugs is used as an analogy: he gives decoctions
    to a patient after illness has arisen, not before.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Buddha is described as having the thirty-two bodily marks of a great man,
