canonical_text:
  quote: ''
  summary: The king questions Nagasena about recluses' treatment of the body, the
    Buddha's omniscience and rule-making, the Buddha's extraordinary bodily marks,
    pure conduct and Brahma, ordination, and two kinds of weeping. Nagasena answers
    with analogies of a treated wound, a physician, a lotus growing from mud and water,
    an elephant's cry, and the Buddha's enlightenment at the Tree of Knowledge.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
