    length, while his parents are said not to have been like that.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A hundred-petalled lotus is described as produced in mud and perfected in
    water, while not resembling the mud or the water in color, smell, or taste.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king asks whether the Buddha's pure conduct makes him a follower of Brahma;
