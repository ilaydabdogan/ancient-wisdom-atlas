canonical_text:
  quote: '"For it is the Dhamma, O Vasettha, which is ''the best in the world''"'
  summary: 'A dialogue asks how the Dhamma can be best if a spiritually advanced layman
    must honor even an unconverted novice monk. The reply affirms both the statement
    and the rule: the monastic''s qualities, outward signs, association with Arahats,
    and progress toward Arahatship make him worthy of respect.'
  language: English
  quote_policy: quoted
