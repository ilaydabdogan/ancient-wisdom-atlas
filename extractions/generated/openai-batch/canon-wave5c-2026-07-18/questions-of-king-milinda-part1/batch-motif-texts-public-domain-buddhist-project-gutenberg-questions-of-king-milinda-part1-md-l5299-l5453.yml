canonical_text:
  quote: ''
  summary: Nagasena explains to the king that virtue or good conduct is the basis
    for spiritual qualities and liberation, illustrating this with earth, bodily occupations,
    city-building, and an acrobat's prepared ground. He then describes faith as marked
    by tranquillisation and aspiration, using a simile of muddy water cleared by a
    water-clearing gem and explaining aspiration toward stages of the Excellent Way
    and Arahatship.
  language: English
  quote_policy: summarized
