canonical_text:
  quote: ''
  summary: The king questions Nagasena about distance to the Brahma world, swift travel
    by a Bhikkhu with Iddhi, simultaneous rebirth in distant realms, kinds of wisdom,
    the increase of merit over demerit, inadvertent wrongdoing, and bodily travel
    through the sky by mastery of mind. Nagasena answers through analogies involving
    memory of distant places, birds and shadows, a sword in a sheath, a lotus offering
    to the Blessed One, fiery metal, and a body made light by mental determination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Elder refers back to practical means by which people ward against future
    hunger, and the king is pleased with the solution.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena describes the Brahma world as very far away, using the example of
    a large rock falling for four months while descending forty-eight thousand leagues
    each day and night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king reports a saying that a Bhikkhu with Iddhi and mastery over mind
    can vanish from Jambudipa and appear in the Brahma world as quickly as a strong
    man moves his arm, and he says he cannot believe it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena asks the king about his birthplace, Alasanda, and uses the king’s
    recollection of a place about two hundred leagues away as an illustration of swift
    mental movement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When asked whether rebirth in the Brahma world or in Kashmir would occur first,
    Nagasena says both would occur together and compares this to thinking of Kalasi
    and Kashmir in the same amount of time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena gives an analogy of two birds landing at the same moment, one on
    a tall tree and one on a small shrub, whose shadows fall together.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nagasena says there are seven kinds of wisdom, but that one becomes wise by
    the wisdom called investigation of the Truth; he compares inactive wisdom to a
    sword lying in its sheath.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nagasena says merit is greater than demerit because wrongdoing is followed
    by remorse and acknowledgement, while doing well leads through gladness, joy,
    peace, bliss, rest of heart, and knowing things as they really are.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Nagasena states that even a man whose hands and feet are cut off, if he gave
    merely a handful of lotuses to the Blessed One, would not enter purgatory for
    ninety-one kalpas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nagasena says inadvertent sin has greater demerit and illustrates this with
    two people seizing a fiery mass of metal, where the one who does not know what
    he is doing is more burnt.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Nagasena says some people can go bodily to Uttara-kuru, the Brahma world,
    or other continents; he explains that a Bhikkhu with Iddhi and mastery over mind
    can travel through the sky by means of mind.
  category: action
  evidence_refs:
  - ev:11
