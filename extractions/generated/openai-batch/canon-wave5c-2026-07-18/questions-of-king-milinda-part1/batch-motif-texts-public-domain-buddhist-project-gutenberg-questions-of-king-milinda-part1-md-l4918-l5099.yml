canonical_text:
  quote: ''
  summary: Nagasena questions King Milinda about whether a chariot is identical with
    any one of its parts, with all its parts, or with something outside them. Milinda
    answers that 'chariot' is a common designation dependent on its parts. Nagasena
    applies the same reasoning to the name 'Nagasena,' the body, and the constituent
    elements of being, citing Sister Vajira's saying before the Blessed One. Nagasena
    then uses the king's shadow and reflection in water to explain how the number
    seven can be associated with him without being identical to him. The king agrees
    to debate as a scholar rather than as a king and postpones further discussion
    until the next day.
  language: English
  quote_policy: summarized
