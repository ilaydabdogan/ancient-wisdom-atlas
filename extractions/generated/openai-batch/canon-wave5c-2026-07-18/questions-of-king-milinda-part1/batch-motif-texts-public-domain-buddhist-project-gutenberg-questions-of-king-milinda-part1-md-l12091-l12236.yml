canonical_text:
  quote: ''
  summary: A king asks Nagasena to reconcile a verse saying there is no place to escape
    death with the existence of Pirit protective recitations. Nagasena answers that
    Pirit helps those whose lifespan is not exhausted but cannot prolong life after
    the allotted span has ended. He supports this with analogies of a dead log, watered
    grain, medicine, snakebite treatments, a catalogue of dangers averted by Pirit,
    and a story of a peacock protected until it omitted Pirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A verse attributed to the Blessed One says that no place in the sky, ocean,
    mountain cleft, or world allows one to escape the snare of death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The king lists Pirit services and frames a dilemma: if no escape from death
    is possible, Pirit is useless; if Pirit provides escape, the verse is false.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena states that the Blessed One both spoke the verse and sanctioned Pirit,
    but that Pirit is meant for those who still have life remaining and restrain themselves
    from evil Karma.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena states that no ceremony, artificial means, medicine, or Pirit can
    prolong the life of one whose allotted period has ended.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dry, dead log does not become fresh or sprout leaves even if thousands of
    pots of water are poured over it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A husbandman withholds water from ripe, dead grain ready for harvest but gives
    water to young, living grain so it will grow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nagasena says disease can be turned back by medicine and says repetition of
    Pirit allays diseases and calamities.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage mentions snakebite poison being addressed by a spell, an antidote,
    or a lotion.
  category: action
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:9
  text: 'After Pirit is said over a man, the listed dangers cease: a snake closes
    its jaws, robbers drop their clubs, an elephant stops, fire dies out, poison becomes
    food, assassins serve him, and a trap does not hold him.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A hunter failed for seven hundred years to net a peacock that had taken Pirit,
    but snared it on the day the peacock omitted Pirit.
  category: sequence
  evidence_refs:
  - ev:7
