  quote: ''
  summary: The passage first discusses whether the Buddha's severe words to Sudinna
    were truthful, just, and beneficial, using legal and medical similes. It then
    presents a dilemma about a tree being called unconscious while another passage
    says an Aspen tree spoke to Bharadvaja; Nagasena resolves this by saying that
    “tree” is a conventional designation for the dryad dwelling in the tree and that
    the Tathagata expounds Dhamma using common speech.
