canonical_text:
  quote: ''
  summary: A dialogue between the king and Nagasena closes the Devadatta dilemma by
    describing the Tathagata's mercy toward Devadatta. The next dilemma concerns the
    Blessed One's teaching of eight causes for earthquakes and the report that the
    earth shook seven times when Vessantara gave his great largesse. Nagasena explains
    the Vessantara earthquake as an isolated, extraordinary event outside the usual
    eight causes, using analogies of out-of-season rain, catalogued rivers, and principal
    officers. The dialogue also lists examples of devotional deeds bearing fruit in
    this life and of persons who ascended bodily to the abode of the Thirty-three.
  language: English
  quote_policy: summarized
