  summary: The passage explains the identification of Milinda with Menander, discusses
    Pali adaptations of Greek names, surveys ancient Greek and Roman evidence for
    Menander, recounts Plutarch's anecdote that cities contested his ashes and divided
    relics for monuments, notes an analogy to the Buddha's posthumous relic division
    while warning against conclusions, and summarizes coin evidence and portraits
    of Menander.
