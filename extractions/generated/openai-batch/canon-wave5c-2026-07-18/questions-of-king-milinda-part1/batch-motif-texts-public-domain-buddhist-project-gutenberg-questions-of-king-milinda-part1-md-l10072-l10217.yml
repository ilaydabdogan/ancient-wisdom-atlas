canonical_text:
  quote: ''
  summary: Nagasena explains to the king that the Tathagata's knowledge depends on
    reflection and follows reflection immediately, comparing this to fruit becoming
    available after falling and to a Cakkavatti's wheel appearing when called to mind.
    The passage then turns to why the Buddha admitted Devadatta to the Order despite
    knowing Devadatta would create a schism and suffer karmic torment. Nagasena answers
    that the Buddha acted from mercy and wisdom, because admission to the Order would
    limit Devadatta's otherwise greater karmic suffering; he supports this with analogies
    of parental discipline, mitigation of a penalty by an influential person, and
    a physician making sickness light by medicine.
  language: English
  quote_policy: summarized
