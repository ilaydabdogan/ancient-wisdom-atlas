canonical_text:
  quote: ''
  summary: Nagasena argues to the king that the Blessed One did no wrong in admitting
    Devadatta to the Order, because the act mitigated Devadatta's suffering. He supports
    this with analogies of an influential officer saving a robber from execution though
    a limb is cut off, a surgeon using painful treatments to heal a wound, and a person
    cutting around a thorn to extract it. The passage also says Devadatta took refuge
    in the Blessed One at death, would suffer in purgatory for part of a kalpa, and
    would later become a Pacceka-Buddha.
  language: English translation with Pali/Sanskrit terms in notes
  quote_policy: summarized
