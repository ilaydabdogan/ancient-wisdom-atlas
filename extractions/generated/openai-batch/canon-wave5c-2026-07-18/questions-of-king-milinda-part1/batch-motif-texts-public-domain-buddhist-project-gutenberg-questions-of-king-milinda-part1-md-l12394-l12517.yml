  text: A hypothetical man brings honey, honeycomb, or a similar complimentary present
    to a king of kings, but the doorkeeper says it is the wrong time and sends him
    away in haste.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king answers that the doorkeeper's turning back the giver would not make
    the king of kings less powerful or unable to receive another present.
