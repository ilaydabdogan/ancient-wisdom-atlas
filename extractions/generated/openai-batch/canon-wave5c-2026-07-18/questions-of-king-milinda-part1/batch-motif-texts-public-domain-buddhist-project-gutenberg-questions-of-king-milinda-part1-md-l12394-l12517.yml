canonical_text:
  quote: ''
  summary: A dialogue explains that Mara's obstruction of alms near the Five Sala
    trees did not harm gifts intended for the Buddha. Nagasena uses analogies of a
    doorkeeper turning back a gift, hidden robbers, and clandestine adultery, then
    distinguishes four kinds of obstacles to gifts and states four things connected
    with Tathagatas that cannot be harmed.
  language: English
  quote_policy: summarized
