canonical_text:
  quote: ''
  summary: 'The introduction describes the textual history and reception of the Questions
    of Milinda: its presumed North Indian origin, loss in its place of origin, preservation
    and authority in Ceylon and Ceylon-derived Buddhist countries, Sinhalese translation
    and publication history, a traditional account of the Milinda-Nagasena discussion,
    and an added Sinhalese prophecy attributed to the Buddha on his death-bed.'
