canonical_text:
  quote: ''
  summary: Book IV opens by describing King Milinda as a skilled questioner who repeatedly
    tests Nagasena, studies the Scriptures, identifies difficult dilemmas, and resolves
    to ask Nagasena to solve them for the benefit of future doubters. Milinda then
    undertakes a seven-day eightfold vow, adopts a hermit-like appearance, practices
    restraint and goodwill, and on the eighth day respectfully approaches Nagasena.
    He asks for a private secluded consultation and explains what places and kinds
    of persons spoil serious discussion or reveal secrets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Milinda repeatedly questioned Nagasena to test his skill, and the passage
    says Milinda’s own skill was proved foolishness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Milinda became a student of the Holy Writ and spent the night privately pondering
    the ninefold Scriptures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Milinda thinks that the Buddha’s utterances are diverse and subtle, that ignorance
    of their occasions may cause future strife and doubt, and that Nagasena’s solutions
    could guide others along the path of Truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At sunrise Milinda bathed, raised clasped hands to his forehead, called to
    mind the Buddhas of past, present, and future, and undertook an eightfold vow
    for seven days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Milinda laid aside his usual dress and ornaments, put on yellow robes, wore
    a recluse’s turban, and appeared like a hermit.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Milinda’s vow included deciding no legal cases, harboring no lustful, ill-willed,
    or delusive thoughts, showing meekness to dependents, guarding bodily action and
    the six sense organs, and filling his heart with love toward all beings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Milinda kept the vow for seven days without going forth; on the eighth day
    he ate early and went to Nagasena with downcast eyes, measured words, gentle manner,
    collected thought, and a joyful heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Milinda bowed at Nagasena’s feet, stood respectfully to one side, and asked
    to speak with him alone in a deserted, secluded forest place with no third person
    present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Milinda says that, just as treasure is rightly entrusted to the broad earth,
    secret matters in deep consultation may rightly be entrusted to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Milinda lists eight places to avoid for consultation: uneven ground, unsafe
    places, windy places, hiding spots, sacred places, high roads, light bamboo bridges,
    and public bathing places; he gives practical reasons why each harms discussion.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Milinda lists eight kinds of people who spoil discussion: the lustful, ill-willed,
    deluded, proud, greedy, slothful, narrow-minded, and foolish.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Milinda begins another list concerning nine kinds of people who reveal secrets
    rather than keeping them in their hearts.
  category: sequence
  evidence_refs:
  - ev:7
