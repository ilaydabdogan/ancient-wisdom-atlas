canonical_text:
  quote: ''
  summary: In a dialogue with the king, Nagasena explains that intelligence ends delusion
    and that reasoning wisdom ceases after accomplishing its work while knowledge
    remains. He illustrates this with a lamp in darkness, a letter written by lamplight
    after the lamp is extinguished, five water pots used to put out fire, medicine
    that cures sickness, and javelins used to defeat an enemy. He then explains that
    one who will not be reborn may feel bodily pain but not mental pain, and that
    the Arahat neither seeks death nor life but waits for the proper time. The passage
    ends with an analogy in which both a red-hot iron ball and icy snow cause pain.
  language: English translation
  quote_policy: summarized
