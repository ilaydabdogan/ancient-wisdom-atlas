canonical_text:
  quote: ''
  summary: The passage includes an editorial note on Devadatta's recurring identification
    with cruel figures in Jataka stories, followed by a dialogue in which King Milinda
    presents a dilemma about a saying that women will go wrong if opportunity, secrecy,
    and a suitable wooer are present. He contrasts this with the story of Amara, wife
    of Mahosadha, who refused wrongdoing despite privacy and a monetary temptation.
    Nagasena replies that Amara did not regard the conditions as truly present, because
    she feared worldly blame, purgatorial suffering, karmic consequence, loss of her
    husband, and moral dishonor, and because wrongdoing could not be hidden from witnesses,
    supernatural beings, herself, or the law of result.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says Buddhist editors of earlier folklore identified Devadatta
    with cruel persons in stories, and that Devadatta appears in many Jataka stories,
    often as someone superior or equal in birth to the character identified with the
    Bodisat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Milinda quotes a saying attributed in the dialogue to the Blessed One
    that women will go wrong when opportunity, secrecy, and a suitable wooer are present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Milinda contrasts the saying with the story that Amara, wife of Mahosadha,
    remained alone and private while her husband was away and refused wrongdoing despite
    being tempted with a thousand pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena answers that the issue depends on whether Amara really had opportunity,
    certainty of secrecy, and a suitable wooer; he states that she was not certain
    of these conditions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Nagasena lists reasons Amara did not see the opportunity as fitting: fear
    of censure, fear of purgatorial suffering, knowledge of the bitter fruit of wrongdoing,
    love for her husband, esteem for him, honoring goodness, despising ignoble life,
    and not wanting to break her customary mode of life.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena says Amara could not be sure of secrecy because wrongdoing could
    not be hidden from men, spirits, recluses with knowledge of others' thoughts,
