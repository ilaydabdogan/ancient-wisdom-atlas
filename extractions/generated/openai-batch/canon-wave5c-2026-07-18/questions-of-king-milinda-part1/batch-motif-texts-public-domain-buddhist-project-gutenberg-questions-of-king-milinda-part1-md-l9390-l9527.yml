canonical_text:
  quote: ''
  summary: King Milinda asks Nagasena to answer a sectarian dilemma about whether
    offerings to the Buddha are vain if the Buddha is entirely passed away and accepts
    no gifts. Nagasena replies that the Buddha is fully set free and accepts no gifts,
    but acts of homage to his relics and wisdom still bear fruit for the worshippers.
    He supports this with analogies of an extinguished fire and, at the end of the
    passage, a wind that has died away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Milinda approaches the teacher reverently by falling at his feet and raising
    clasped hands to his forehead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Milinda reports a dilemma attributed to leaders of other sects: if the Buddha
    accepts gifts, he has not entirely passed away; if he has entirely passed away
    and accepts no gifts, then honours to him are said to be empty and vain.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Milinda asks Nagasena to tear apart the 'net of heresy' and provide future
    followers of the Conqueror with insight into the riddle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nagasena states that the Blessed One is entirely set free and accepts no gift,
    and says that accepting gifts was abandoned at the foot of the Tree of Wisdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nagasena cites Sariputta as saying that Buddhas, though worshipped by gods
    and men, neither heed, accept, nor refuse gifts and worship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Milinda challenges the appeal to Sariputta by comparing it to a father praising
    a son or a son praising a father, and asks for fuller explanation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nagasena says that gods or men may build a structure to contain the jewel
    treasure of a Tathagata's relics, and that by such homage they themselves attain
    one of three glorious states.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the fire analogy, a great fire dies out and cannot accept fuel, but fire
    is not absent from the world because people can produce fire from dry wood by
    twirling a fire-stick.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: 'Nagasena maps the extinguished fire analogy onto the Buddha: the Buddha shone
    in Buddhahood, passed away with no root remaining, no longer accepts gifts, yet
    acts directed to the Tathagata still have value and bear fruit.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A second analogy begins with a great wind that arises and dies away; Milinda
    says a dead wind has no thought of being reproduced because the wind element is
    unconscious.
  category: sequence
  evidence_refs:
  - ev:7
