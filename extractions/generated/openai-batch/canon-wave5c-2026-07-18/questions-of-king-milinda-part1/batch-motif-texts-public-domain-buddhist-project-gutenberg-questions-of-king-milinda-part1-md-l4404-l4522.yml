canonical_text:
  quote: ''
  summary: King Milinda visits the venerable Ayupala at the Sankheyya hermitage with
    five hundred Yonakas. Milinda asks the purpose of renunciation; Ayupala says it
    is for righteous living and spiritual calm, and cites lay gods who attained comprehension
    of truth during the Blessed One's teachings. Milinda argues that ascetic restraints
    are consequences of bad karma from former births rather than virtues. Ayupala
    is silenced; Milinda declares India empty of anyone able to dispel his doubts,
    then notices the Yonakas' confidence and asks whether another learned brother
    can debate him.
  language: English
  quote_policy: summarized
