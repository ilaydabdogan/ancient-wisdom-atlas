canonical_text:
  quote: ''
  summary: Nagasena explains to the king that King Sivi’s divine eyes arose through
    the power of Truth, not through ordinary physical causes. The dialogue gives examples
    of Acts of Truth or charms causing rain, turning back fire, neutralizing poison,
    making the ocean withdraw before a Chinese king’s lion-drawn chariot, and making
    the Ganges flow upstream when the courtesan Bindumati performs an Act of Truth
    before Asoka and the assembled people.
  language: English translation with Pali/Sanskrit terms in notes
  quote_policy: summarized
