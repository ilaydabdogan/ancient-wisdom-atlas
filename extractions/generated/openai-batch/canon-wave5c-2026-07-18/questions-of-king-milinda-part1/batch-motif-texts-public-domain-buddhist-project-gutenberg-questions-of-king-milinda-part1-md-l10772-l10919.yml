  text: Nagasena states that the power of Truth itself served as the cause for Sivi’s
    divine eyes when no other cause was present.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: True believers are described as able to perform Acts of Truth that make rain
    fall, extinguish fire, ward off poison, and accomplish other desired acts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hypothetical Siddhas are described as intoning charms that cause heavy rain,
    make a blazing mass of fire retreat, and turn malignant poison into a healing
