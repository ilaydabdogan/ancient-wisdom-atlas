canonical_text:
  quote: ''
  summary: The passage closes a dilemma about Mara’s interference with alms, then
    presents and resolves dilemmas about unconscious wrongdoing and about the Buddha’s
    relation to his followers. Nagasena distinguishes offences involving mental co-operation
    from those not involving it, and explains that the Tathagata does not seek followers
    or regard them as his own. He illustrates the Tathagata as a support like the
    earth and as a nourisher like a rain cloud, while remaining free from possessive
    attachment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mara is said to have acted like robbers, lain in ambush, and possessed Brahmans
    and householders of the Five Sala trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hypothetical statement says that if Mara had interfered with alms intended
    or made ready for the Blessed One, or with the Blessed One’s partaking of them,
    Mara’s head or body would have been violently destroyed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king presents a dilemma between a statement that unknowingly depriving
    a living being of life brings serious demerit and a Vinaya statement that there
    is no offence for one who acts in ignorance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena replies that both quoted passages were spoken by the Blessed One
    and distinguishes between offences committed without the co-operation of the mind
    and offences that have that co-operation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king presents a dilemma between a statement that the Tathagata does not
    think he should lead the brotherhood or that the Order depends on him, and a statement
    that Metteyya will lead a brotherhood as the present Buddha leads one.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena replies that the Tathagata does not seek a following; rather, followers
    seek after him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nagasena says that ideas such as “This is I” and “This is mine” are commonly
    received opinion and not transcendental truth, and that the Tathagata has put
    away attachment, clinging, and self-regard.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Tathagata is compared to the broad earth, which supports beings and serves
    as an asylum for them without longing for them as its own.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Tathagata is compared to a mighty rain cloud, which pours rain and nourishes
    grass, trees, cattle, and men without regarding them as its own.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The king praises Nagasena’s solution, saying the problem has been solved by
    examples and that insight has been awakened.
  category: speech
  evidence_refs:
  - ev:10
