canonical_text:
  quote: ''
  summary: 'The passage opens Book I by introducing King Milinda at Sagala and Nagasena
    as the sage who answers subtle questions. It describes Sagala as a prosperous,
    fortified, well-watered trade city. The narrator then outlines the work’s divisions
    and begins the previous-birth history: during Kassapa Buddha’s dispensation, members
    of the Order near the Ganges sweep the courtyard while meditating on the Buddha’s
    virtues. A brother orders a novice to remove dust; after the novice ignores repeated
    calls, the brother strikes him with a broom stick. The novice removes the rubbish
    crying and makes an aspiration that the merit of the act will make him powerful
    and glorious in future births until Nirvana.'
  language: English
  quote_policy: summarized
