canonical_text:
  quote: ''
  summary: King Milinda visits the venerable Nagasena, asks his name, and challenges
    Nagasena's statement that the name is only a common designation and involves no
    permanent individuality or soul. Milinda questions the implications for moral
    responsibility, monastic life, karma, and murder, then asks whether Nagasena is
    identifiable with body parts, the five Skandhas, their combination, or anything
    outside them; Nagasena denies each. Nagasena begins a counter-question using Milinda's
    carriage or chariot as an analogy.
  language: English
  quote_policy: summarized
