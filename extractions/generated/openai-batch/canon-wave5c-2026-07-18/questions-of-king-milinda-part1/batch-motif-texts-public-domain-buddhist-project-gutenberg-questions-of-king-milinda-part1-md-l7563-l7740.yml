canonical_text:
  quote: ''
  summary: King Milinda questions Nagasena about beings burning in purgatory without
    being destroyed, the world resting on water, water on air, and air on space, and
    whether cessation is Nirvana. Nagasena answers with analogies involving embryos
    not destroyed while hard foods are digested, a demonstration using water in a
    regulation water-pot, and an explanation that non-cleaving to sense objects leads
    to the cessation of craving, grasping, becoming, birth, and suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king states disbelief that beings can burn for hundreds of thousands of
    years in purgatory and yet not be destroyed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena asks whether female sharks, crocodiles, tortoises, peacocks, and
    pigeons eat hard bits of stone and gravel, and the king agrees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the first analogy, hard things inside the stomach are said to be destroyed,
    while an embryo inside the same animal is not destroyed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king says the embryo escapes destruction through the influence of Karma.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nagasena applies the embryo analogy to beings in purgatory, saying they are
    not destroyed through the influence of Karma and do not die until evil Karma is
    exhausted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second analogy concerns females of lions, tigers, panthers, and dogs eating
    hard bits of bone and flesh while embryos inside them are not destroyed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A third analogy concerns women eating hard cakes and meat while children in
    their womb are not destroyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king asks about the saying that the world rests on water, the water on
    air, and the air on space.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena brings water in a regulation water-pot and says that, as this water
    is supported by the atmosphere, that water is supported by air.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king asks whether cessation is Nirvana, and Nagasena answers yes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Nagasena says foolish individuals take pleasure in sense objects, cleave to
    them, are carried down by a flood of passions, and are not freed from birth, old
    age, death, grief, lamentation, pain, sorrow, despair, and suffering.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nagasena says the wise disciple does not cleave to sense objects; craving
    ceases, then grasping, becoming, birth, and the aggregate of pain cease, and this
