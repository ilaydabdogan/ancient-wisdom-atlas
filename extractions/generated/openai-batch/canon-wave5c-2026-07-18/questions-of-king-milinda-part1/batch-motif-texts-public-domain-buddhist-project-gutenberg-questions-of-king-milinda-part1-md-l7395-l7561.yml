canonical_text:
  quote: ''
  summary: A dialogic passage in which the king asks Nagasena whether the five Ayatanas
    and human differences arise from one action or many. Nagasena answers through
    seed and vegetable analogies and cites the Blessed One on beings as inheritors
    of karma. The king then asks about renunciation and present effort; Nagasena explains
    timely effort through images of preparing water, crops, defenses, and skills before
    need arises, followed by a verse on wise action and regret at death. The passage
    ends with the king beginning an objection about the intensity of purgatory fire
    compared with ordinary fire.
  language: English
  quote_policy: summarized
