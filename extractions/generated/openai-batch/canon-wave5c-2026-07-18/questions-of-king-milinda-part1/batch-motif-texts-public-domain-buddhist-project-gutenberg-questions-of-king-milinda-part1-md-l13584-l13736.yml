canonical_text:
  quote: ''
  summary: The passage contains two question-and-answer dilemmas. In the first, the
    king asks how a splinter from a rock pushed by Devadatta could strike the Buddha's
    foot if a larger rock was intercepted; Nagasena explains the fragment's accidental
    path with analogies of liquids, grains, and leaves escaping or being carried by
    force. In the second, the king asks how two statements about what makes a Samaṇa
    can both be true; Nagasena distinguishes a general definition by destruction of
    the Asavas from characteristic dispositions, using flower and grain analogies.
  language: English
  quote_policy: summarized
