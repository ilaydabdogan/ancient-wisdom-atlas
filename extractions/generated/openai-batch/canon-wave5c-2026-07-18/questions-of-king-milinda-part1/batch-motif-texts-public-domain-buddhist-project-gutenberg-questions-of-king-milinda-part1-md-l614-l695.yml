  summary: The passage is a scholarly introduction discussing the possible dating
    and historical status of the Questions of Milinda. It argues that the work was
    written after Menander's death and before Buddhaghosa, lists persons and places
    associated with Nagasena that are not otherwise known from Buddhist texts, rejects
    proposed identifications of Nagasena with Nagarjuna or Patanjali, and notes possible
    but uncertain references to other figures named Nagasena.
