canonical_text:
  quote: ''
  summary: 'The passage closes a discussion of the power of love, then turns to a
    dialogue in which the king asks Nagasena whether good and evil actions have the
    same consequence. Nagasena says they differ: good works lead to a happy result
    and Sagga, while evil works lead to an unhappy result and Niraya. The king then
    raises the problem of Devadatta and the Bodisat across successive existences,
    noting that although Devadatta is described as wicked and the Bodisat as pure,
    Devadatta was sometimes equal or superior in rank, reputation, or species-status.
    Several examples are given: Devadatta as royal chaplain while the Bodisat is an
    outcast spell-knower who produces out-of-season mangoes; Devadatta as king while
    the Bodisat is an ornamented elephant threatened with a sky-walking test; Devadatta
    as a man living by winnowing grain while the Bodisat is a monkey; and Devadatta
    as the hunter Soṇuttara while the Bodisat is the six-tusked king of elephants
    whom he kills.'
  language: English
  quote_policy: summarized
