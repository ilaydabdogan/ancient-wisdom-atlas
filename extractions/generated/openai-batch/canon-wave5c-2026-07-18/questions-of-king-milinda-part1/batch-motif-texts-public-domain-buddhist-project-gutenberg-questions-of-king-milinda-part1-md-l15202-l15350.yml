canonical_text:
  quote: ''
  summary: 'A dialogue reviews several births in which Devadatta and the Bodisat meet
    in unequal roles, including episodes of violence by Devadatta''s prior forms.
    In the present life the Bodisat becomes the Buddha and Devadatta joins the Order
    but seeks Buddhahood for himself. Nagasena explains that good and evil do not
    bear equal fruit: Devadatta''s hostility yields harmful results, while his generosity
    in other lives yields prosperity. The passage describes repeated meetings across
    transmigration, compares beings to water carried in a stream, and contrasts Devadatta''s
    purgatory and earth-swallowing with the Bodisat''s heavenly bliss, Buddhahood,
    and liberation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In several named prior births, Devadatta is described as a commander-in-chief,
    brahman, or king, while the Bodisat is described as a king or prince; some episodes
    involve Devadatta's prior form harming the Bodisat's prior form.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the present life, both are in the Sakya clan; the Bodisat becomes a Buddha,
    and Devadatta leaves the world to join the Order, attains Iddhi powers, and desires
    to become Buddha himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena says the king's list of prior-life examples is accurate, but rejects
    the inference that good and evil have the same result.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena states that Devadatta was opposed by everybody, that no one was hostile
    to the Bodisat, and that Devadatta's hostility toward the Bodisat bore fruit in
    successive births.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena states that Devadatta, when established in worldly lordship, protected
    the poor, built bridges, courts of justice, and rest-houses, and gave gifts to
    religious persons, the poor, the needy, and wayfarers; these acts resulted in
    prosperity from existence to existence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nagasena says Devadatta and the Bodisat met frequently through an immeasurable
    period of time, and that Sariputta the Elder also had many kinship and friendship
    relations with the Bodisat over thousands of births.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage compares all beings in transmigration to water whirled along in
    a stream meeting pure and impure, beautiful and ugly substances.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Devadatta, as an unrighteous god who led others into unrighteousness, is said
    to have been burned in purgatory for an immeasurable period, while the Bodisat,
    as a righteous god who led others into righteousness, lived in heavenly bliss
    for a like period.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the present life, Devadatta is said to have plotted injury against the
    Buddha, caused a schism in the Order, and been swallowed by the earth; the Tathagata
    is said to have attained Buddhahood insight and complete freedom from re-existence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king accepts Nagasena's explanation.
  category: speech
  evidence_refs:
  - ev:6
