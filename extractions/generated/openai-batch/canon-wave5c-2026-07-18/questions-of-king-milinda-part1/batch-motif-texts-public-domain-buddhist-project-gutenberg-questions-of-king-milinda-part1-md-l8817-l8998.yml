canonical_text:
  quote: ''
  summary: In a sequence of questions, the king challenges Nagasena on large bones,
    suppression of breath, the naming and salt taste of the ocean, the divisibility
    of minute things, distinctions among perception, reason, and soul, and the difficulty
    of distinguishing mental conditions connected with sense-organs. Nagasena answers
    through analogies involving large sea fish, snoring, the sea and salt water, sensory
    organs, and water taken from the sea, concluding that there is no soul inside
    the body and that the Blessed One accomplished the difficult analysis of mental
    conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king asks how bones can be a hundred leagues long when no tree is one
    hundred leagues in length.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena replies by asking whether the king has heard of fishes in the sea
    five hundred leagues long, and the king accepts that such fishes could have bones
    a hundred leagues long.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king asks whether inhaling and exhaling can be suppressed; Nagasena answers
    by analogy with a snoring sound that stops when the body is bent, and then with
    a trained contemplative who has reached the fourth stage of ecstatic contemplation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nagasena explains the word ocean by saying there is as much salt as water
    and as much water as salt.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena says the ocean has one taste, the taste of salt, because its water
    has stood so long.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nagasena says that truth is the most minute and subtle, that whatever can
    be divided can be divided by wisdom, and that no other quality can divide wisdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena distinguishes perception by recognition and reason by discrimination,
    and states that there is no soul in beings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the king asks what sees, hears, smells, tastes, feels, and perceives
    if there is no soul, Nagasena argues that removing sense organs would not improve
    perception, and the king concludes that there can be no soul inside the body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Nagasena says the Blessed One performed a hard task by fixing and distinguishing
    mental conditions dependent on a sense organ, such as contact, sensation, idea,
    intention, and thought.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Nagasena illustrates the difficulty by asking whether a person tasting sea
    water in his palm could distinguish whether it came from several named rivers;
    the king says this is impossible.
  category: speech
  evidence_refs:
  - ev:9
