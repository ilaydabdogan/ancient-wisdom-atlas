canonical_text:
  quote: ''
  summary: King Milinda questions rival teachers about cosmology, afterlife, and moral
    causation, and silences them with puzzles. Finding no learned person in Sagala
    able to resolve his doubts, he seeks a worthy interlocutor. In the Himalayas,
    Assagutta convenes an assembly of Arahats, identifies the god Mahasena in the
    heaven of the Thirty-three as capable of answering Milinda, and the Arahats appear
    there, where Sakka receives them reverently.
  language: English
  quote_policy: summarized
