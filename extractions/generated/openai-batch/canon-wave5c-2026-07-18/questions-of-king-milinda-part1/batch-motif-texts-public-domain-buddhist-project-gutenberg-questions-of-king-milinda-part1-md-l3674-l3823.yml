canonical_text:
  quote: ''
  summary: In the world of the gods, Sakka and Assagutta petition Mahasena to be reborn
    among humans to refute King Milinda's views and aid the religion of the Buddha;
    Mahasena consents. The brethren return to the Himalaya, summon Rohana from meditation,
    and assign him an atonement involving alms-going at the house of the Brahman So;^uttara
    until the future son Nagasena can be drawn into the Order. Mahasena is reborn
    in the womb of So;^uttara's wife, accompanied by three strange wonders. Rohana
    endures years of rejection at the household, but a small courtesy eventually leads
    the Brahman to give alms, invite him for regular meals, and hear passages from
    the Buddha's words.
  language: English
  quote_policy: summarized
