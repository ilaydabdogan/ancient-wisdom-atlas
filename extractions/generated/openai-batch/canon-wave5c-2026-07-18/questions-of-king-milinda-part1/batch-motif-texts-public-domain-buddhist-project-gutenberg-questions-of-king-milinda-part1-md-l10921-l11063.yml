canonical_text:
  quote: ''
  summary: A courtesan is said to have made the Ganges flow backwards by an Act of
    Truth; when questioned by a king, she explains that her truth consists in treating
    all paying clients alike regardless of status. Nagasena uses this to resolve a
    dilemma about King Sivi giving away his eyes and receiving heavenly eyes. A following
    section introduces another dilemma about the duration of the faith, contrasting
    a statement that the good law will last five hundred years with a statement that
    the world will not lack Arahats if the perfect life is lived; Nagasena begins
    resolving it by distinguishing the duration of doctrine from religious practice.
  language: English
  quote_policy: summarized
