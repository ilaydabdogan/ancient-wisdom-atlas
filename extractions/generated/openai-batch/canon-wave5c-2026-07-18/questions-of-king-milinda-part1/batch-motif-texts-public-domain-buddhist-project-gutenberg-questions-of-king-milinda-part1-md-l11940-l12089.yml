canonical_text:
  quote: They long to be released from it. It is the power of death of which they
    are afraid.
  summary: Nagasena explains methods for determining meaning, then answers the king’s
    challenge about why beings suffering in purgatory would still fear death. He says
    death is feared by those who have not seen the truth, and supports the point with
    analogies of a sick patient fearing painful treatment, a prisoner fearing an interview
    with the king, and a snake-bitten man fearing a snake that is being brought back
    to cure him.
  language: English
  quote_policy: quoted
