canonical_text:
  quote: It is by reason, O king, of the eye and of forms that sight arises...
  summary: In a dialogue with King Milinda, the Elder challenges the idea of a living
    principle or soul within the body by arguing that the sense powers do not operate
    interchangeably. He uses examples of doors, windows, a gateway, tasting, honey,
    and rainwater following a slope, then explains sight and thought as conditionally
    arising without an inner commanding agent.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Elder asks whether a living principle that sees through the eye could
    also see, hear, taste, smell, touch, or discern through any of the other sense
    organs; the king answers that it could not.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Elder repeatedly states that the powers of the senses are not united indiscriminately
    with one another.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
- id: obs:3
  text: The Elder compares open palace windows and daylight with the proposed sense
    doors of the living principle, asking whether one open sense door could perform
    all sense functions; the king answers no.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Dinna is used as an example: if he went outside to the gateway or returned
    and stood before the king, the king would know it.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A flavor placed on the tongue can be known as sour, salty, acidic, pungent,
    astringent, or sweet, but once it has passed into the stomach it is no longer
    discerned in that way.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a honey example, a man with his mouth closed and tied, cast into a trough
    full of honey, would not know whether it was sweet because the honey could not
    enter his mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The Elder gives an Abhidhamma explanation: sight arises by reason of the
    eye and forms, with associated conditions arising in succession; the same applies
    to the other five sense organs.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Elder concludes in this explanation that there is no such thing as soul,
    named in the passage as Vedagu.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king asks whether thought-perception arises wherever sight arises; the
    Elder says yes, and says sight arises first and thought after it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Elder denies that sight commands thought or thought commands sight, saying
    there is no intercourse between them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Elder illustrates thought arising where sight arises by comparing it to
    rainwater following the slope of the ground, with later water going the same way
    as earlier water without communication between them.
  category: action
  evidence_refs:
  - ev:8
