canonical_text:
  quote: ''
  summary: Nagasena explains to the king that the Tathagata's statement about being
    able to remain alive for a kalpa or part of a kalpa was meant to exalt the power
    of Iddhi, not to express desire for future life. He compares this unshown power
    to a horse whose speed is real though not tested before the court. The passage
    also describes the Blessed One as having mastered the four powers of saintship
    while rejecting even the smallest degree of future life. The king accepts Nagasena's
    explanation.
  language: English
  quote_policy: summarized
