canonical_text:
  quote: ''
  summary: A king asks Nagasena how the Tathagata can be called all-wise if he was
    gained over by intercessors using parables after dismissing members of the Order.
    Nagasena replies that the Tathagata was all-wise, that the parables used were
    his own prior teachings, and that being pleased by them is like approving what
    is done with one’s own possessions or provisions. The king accepts the answer.
  language: English
  quote_policy: summarized
