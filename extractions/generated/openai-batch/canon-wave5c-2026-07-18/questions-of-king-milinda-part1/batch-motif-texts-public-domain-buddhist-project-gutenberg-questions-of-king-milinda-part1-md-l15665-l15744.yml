- id: obs:2
  text: The question reports that the Blessed One dismissed a company of members of
    the Order presided over by Sariputta and Moggallana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sakyas of Katuma and Brahma Sabanipati are said to have used the parables
    of the seed and the calf to gain the Buddha over, obtain forgiveness, and make
    him see the matter in the desired light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The king presents a dilemma: if the parables were unknown to the Tathagata
    he was not all-wise, but if he knew them already then his dismissal of the brethren
    would appear unkind.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena states that the Tathagata was all-wise and lord of the Scriptures.
