canonical_text:
  quote: ''
  summary: Nagasena travels from Rohana to Assagutta, undergoes a period of silent
    testing and service, and is allowed to remain for the rainy season. A long-serving
    laywoman invites Assagutta and Nagasena to a meal; after the meal Nagasena gives
    a deeper thanksgiving discourse, through which both she and Nagasena attain insight.
    Assagutta recognizes their attainment, praises Nagasena, and gods approve. Assagutta
    then sends Nagasena to Pataliputta to study the words of the Buddha under Dhammarakkhita.
    On the road, a merchant with five hundred wagons invites and feeds Nagasena.
  language: English
  quote_policy: summarized
