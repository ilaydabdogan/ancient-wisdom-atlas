canonical_text:
  quote: ''
  summary: Nagasena argues to the king that deeds bear fruit even when the affected
    person does not consent, using worms, diseases, former-birth karma, and earth-swallowing
    punishments as examples. He says acts done to the passed-away Tathagata are effective
    through the power of relics and wisdom. The king then asks about the Buddha's
    omniscience; Nagasena answers that the Buddha is omniscient, but knowledge becomes
    consciously present through reflection, and begins an analogy about different
    classes of minds.
  language: English
  quote_policy: summarized
