- id: obs:2
  text: Nagasena says that acts done to the Tathagata, though he has passed away and
    acquiesces in nothing, have value and bear fruit through the power of his relics
    and wisdom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ninety-eight diseases are said to arise in bodies without consent because
    of evil deeds done in former births.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nandaka the ogre is reported to have laid hands on the Elder Sariputta and
    then to have been swallowed by the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sariputta is described as unable to consent to pain being inflicted on a fellow
