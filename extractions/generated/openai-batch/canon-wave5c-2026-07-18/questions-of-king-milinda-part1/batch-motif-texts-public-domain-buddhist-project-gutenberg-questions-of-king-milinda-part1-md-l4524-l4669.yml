canonical_text:
  quote: ''
  summary: Nagasena arrives at Sagala after an alms-tour and is praised as a learned,
    eloquent, and difficult-to-refute elder. He dwells at the Sankheyya hermitage
    with many brethren. Devamantiya tells King Milinda that Nagasena can answer his
    questions and dispel his doubts. Milinda is frightened by the name, sends word
    that he is coming, and proceeds with a large retinue to the hermitage, where he
    sees Nagasena's assembly.
  language: English
  quote_policy: summarized
