canonical_text:
  quote: A brother is not, O Bhikkhus, to commit suicide.
  summary: 'Nagasena answers the king by describing the upright good man as beneficial
    to others through a series of similes: medicine, water, treasure, boat, caravan
    owner, rain cloud, teacher, and guide. He says the Blessed One prohibited self-slaughter
    to preserve such beneficial persons. The passage then cites Elder Kumara Kassapa
    and begins a catalogue of painful conditions, fears, punishments, and tortures
    in response to a question about putting an end to life.'
  language: English
  quote_policy: quoted
