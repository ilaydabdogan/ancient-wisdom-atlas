canonical_text:
  quote: ''
  summary: The passage closes an explanation of the pain of rebirth by listing tortures
    and comparing beings in repeated birth to water coursing from the Himalaya along
    the Ganges through obstacles. It says the Blessed One urged realization of the
    end of the succession of rebirths, and the king accepts Nagasena's answer. A new
    question quotes the Blessed One's teaching on eleven advantages of cultivating
    a loving disposition or loving emancipation of heart, including peaceful sleep,
    favor among human and nonhuman beings, divine protection, immunity from fire,
    poison, and sword, calmness at death, and rebirth in the Brahma world if Arahatship
    is not attained.
  language: English
  quote_policy: summarized
