canonical_text:
  quote: ''
  summary: In a dialogue, the king asks Nagasena about rebirth, name-and-form, and
    time. Nagasena explains karmic continuity with a milk-to-curds legal illustration,
    says rebirth depends on dying with craving, defines form as gross and name as
    subtle or mental, compares their co-arising to egg components, and describes time
    as applying to conditions that still produce effects or lead to reindividualisation,
    but not to beings no longer subject to rebirth or fully set free.
  language: English
  quote_policy: summarized
