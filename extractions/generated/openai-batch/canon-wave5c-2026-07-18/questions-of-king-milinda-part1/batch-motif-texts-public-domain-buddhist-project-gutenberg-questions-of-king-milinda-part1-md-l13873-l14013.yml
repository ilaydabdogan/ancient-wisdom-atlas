canonical_text:
  quote: ''
  summary: Milinda and Nagasena discuss whether punishment or dismissal can be blamed
    on the Tathagata. Nagasena argues that a thief suffers through his own act, not
    through the Tathagata's teaching, and that the elders and disciples were dismissed
    because of what they themselves had done, not because of anger. He supports the
    answer with analogies of a careless person falling on the earth and a corpse being
    cast up by the ocean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nagasena states that a person put to death does not suffer execution because
    of the Tathagatas' opinion, but because of what that person has done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Milinda agrees that a person who had done nothing wrong and was walking innocently
    would not be seized and put to death by a wise person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nagasena concludes that fault cannot rightly be found with the Teacher on
    account of the thief's death, and Milinda accepts the teaching as righteous.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Milinda cites the Blessed One as saying that he harbours no anger or sulkiness,
    and contrasts this with the dismissal of the Elders Sariputta and Moggallana and
    their disciples.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note reports that the Buddha was at the Amalaki garden, that Sariputta and
    Moggallana came with 500 attendant disciples, that a hubbub arose when resident
    bhikkhus received them, and that the Buddha discoursed on quiet and sent the visitors
    away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nagasena states that the dismissal of the Elders and their disciples was not
    done in anger.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nagasena compares the case to a man who stumbles over roots, stakes, stones,
    potsherds, or uneven ground; Milinda says the broad earth has neither anger nor
    delight and that the fall occurs through the man's own carelessness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nagasena says the Tathagatas experience neither anger nor pride toward any
    person and that the disciples were sent away because of what they themselves had
    done.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nagasena compares the dismissal to the great ocean, which does not keep a
    corpse but casts a dead body up onto the shore; Milinda says the ocean is without
    anger, delight, desire to please, or desire to harm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nagasena applies the analogies by saying that one who stumbles in the teaching
    of the Conqueror is made to go away, as a corpse in the ocean is cast up, and
    that the dismissal was for the disciples' good.
  category: relationship
  evidence_refs:
  - ev:6
