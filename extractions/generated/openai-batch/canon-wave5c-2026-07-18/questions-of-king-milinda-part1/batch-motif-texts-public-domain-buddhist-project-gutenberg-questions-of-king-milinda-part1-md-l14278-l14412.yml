canonical_text:
  quote: ''
  summary: 'The passage concludes a discussion of why the Patimokkha recitation is
    restricted to Bhikkhus, using an analogy between royal appanages and the priceless
    training and discipline of the Order. It then opens a new problem: the king asks
    why a deliberate lie can be described both as a grave offense involving exclusion
    and as a minor confessional offense. Nagasena answers that the gravity of an offense
    depends on its subject matter and circumstances, illustrating this with different
    punishments for striking an ordinary person versus striking the king.'
  language: English, with Pali terms
  quote_policy: summarized
