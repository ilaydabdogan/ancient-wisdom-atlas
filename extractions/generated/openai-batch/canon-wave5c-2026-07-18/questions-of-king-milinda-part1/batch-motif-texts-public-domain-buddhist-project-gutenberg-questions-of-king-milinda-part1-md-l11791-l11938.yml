canonical_text:
  quote: "“All men tremble at punishment, all are afraid of death.”"
  summary: The passage first explains that certain speculative questions should be
    set aside because answering them has no useful reason or object. It then presents
    and resolves a dilemma about the statement that all fear punishment and death
    versus the statement that the Arahat has passed beyond fear. Nagasena answers
    that Arahats are an exception because the causes of fear, rebirth, and future
    existence have been cut off, and he illustrates this with analogies of ministers
    exempt from a general tax order and heads of houses counted as “all” villagers
    in a summons.
  language: English
  quote_policy: quoted
