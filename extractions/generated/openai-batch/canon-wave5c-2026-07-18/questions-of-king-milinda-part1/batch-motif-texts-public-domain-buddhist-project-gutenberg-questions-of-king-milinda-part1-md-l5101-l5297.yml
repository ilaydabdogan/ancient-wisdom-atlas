canonical_text:
  quote: ''
  summary: The passage narrates preparations for Nagasena's visit to the king, Nagasena's
    journey to Sagala with the brethren, and several dialogues. Anantakaya asks whether
    Nagasena is the soul or inner breath; Nagasena rejects identifying breath with
    soul and teaches from the Abhidhamma, after which Anantakaya supports the Order.
    The king feeds Nagasena and the monks, gives garments and robes, and questions
    Nagasena about truth, renunciation, the end of sorrow, reindividualisation after
    death, reasoning, wisdom, and other good qualities. Nagasena distinguishes reasoning
    from wisdom and illustrates wisdom as cutting off failings by comparing it to
    reapers cutting barley with a sickle.
  language: English
  quote_policy: summarized
