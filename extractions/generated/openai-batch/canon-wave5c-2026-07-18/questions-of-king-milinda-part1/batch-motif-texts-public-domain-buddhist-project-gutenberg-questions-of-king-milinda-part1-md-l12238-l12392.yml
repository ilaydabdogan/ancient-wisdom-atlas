canonical_text:
  quote: ''
  summary: 'Nagasena argues with the king that Pirit has protective power, citing
    tales of Vidyadharas escaping capture and explaining that Pirit protects some
    beings but can fail through karma, sin, unbelief, or the protected being''s own
    fault. A new dilemma follows: the king contrasts the Tathagata''s usual receipt
    of monastic requisites with an occasion when he received nothing at the village
    of the Five Sala trees; Nagasena attributes that failure to Mara, and the king
    questions how Mara could overcome the Buddha''s accumulated merit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Danava is said to have put his wife into a box, swallowed it, and carried
    her in his stomach; a Vidyadhara entered his mouth, interacted with the wife,
    and escaped when the Danava vomited up and opened the box.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king confirms that he has heard the Danava and Vidyadhara story, and Nagasena
    states that the Vidyadhara escaped capture by the power of Pirit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena cites another Vidyadhara who entered the harem of the king of Benares,
    committed adultery with the chief queen, was caught, became invisible, and escaped;
    the king agrees this escape was also by Pirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When asked whether Pirit protects everybody, Nagasena says it protects some
    and not others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Nagasena uses food as an analogy: food keeps some alive but can destroy life
    through over-indulgence, weak digestion, or an evil spell making life-giving food
    poisonous.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Nagasena gives three reasons for Pirit''s failure: obstruction by karma,
    by sin, and by unbelief.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena compares Pirit to a mother who nourishes and protects her son but
    punishes him when he is at fault.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Nagasena concludes that Pirit, though protective, can turn against beings
    through their own fault.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king praises Nagasena for solving the problem and making clear what had
    been obscure.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The king introduces a new dilemma: the Tathagata is said to have been in
    constant receipt of robes, food, lodging, and requisites for the sick, yet at
    the Brahman village called the Five Sala trees he is said to have received nothing
    and returned with his bowl as clean as before.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nagasena replies that both statements about the Tathagata are true and that
    the day of receiving nothing was the work of Mara, the evil one.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king asks how Mara could overcome the Buddha's merit accumulated through
    countless aeons and frames the issue as a problem about demerit versus merit or
    Mara's power versus the Buddha's power.
  category: speech
  evidence_refs:
  - ev:9
