canonical_text:
  quote: ''
  summary: 'The passage explains dependent arising and cessation of pain, then presents
    a dialogue in which the king asks whether any conditioned qualities arise without
    gradual becoming. Nagasena answers no and gives examples: a house made from forest
    beams and earth-clay through human labor; trees and plants growing from the ground
    to maturity; pots formed by a potter from dug clay; music requiring parts of a
    mandolin and human effort; fire requiring fire-making apparatus, tinder, and effort;
    fire requiring a burning glass, sunlight, and tinder; and a reflected image requiring
    a mirror, light, and a face. The king then asks about a soul or living principle
    that senses through the faculties, introducing a further reply.'
  language: English
  quote_policy: summarized
