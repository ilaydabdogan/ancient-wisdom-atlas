canonical_text:
  quote: ''
  summary: The passage explains why Tathagatas continue meditation despite completed
    Buddhahood, lists meditation's virtues and reasons, then presents a dilemma about
    the Buddha's power to remain alive for a Kalpa versus his announced death after
    three months. Nagasena resolves the dilemma by interpreting Kalpa as the duration
    of a human life and by using a swift-horse simile.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that all Tathagatas attained Buddhahood in contemplation
    and continued to practice it while recollecting its good qualities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: 'Two illustrative comparisons are given: a man who received high office remains
    in attendance on a king because of its advantages, and a recovered patient repeatedly
    uses the same medicine because of its virtue.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Meditation is said to preserve the meditator, give long life and power, cleanse
    faults, improve reputation, produce contentment and confidence, remove sloth,
    lust, ill-will, dullness, pride, and doubt, pacify and soften the heart, produce
    gladness, joy, delight, and reverence, reveal the transitory nature of compounded
    things, end rebirth, and obtain the benefits of renunciation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tathagatas devote themselves to meditation because they long for the bliss
    of attainment and the joy of the tranquil state of Nirvana, with their minds fixed
    on their aim.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Four reasons are given for the Tathagatas'' meditation: dwelling at ease,
    the abundance of advantages without drawback, meditation as the road to all noble
    things, and its praise by all Buddhas.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the Tathagatas meditate not because anything remains to be
    done or added to their accomplishment, but because they perceive meditation's
    advantages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king accepts Nagasena's explanation concerning meditation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king presents a dilemma by quoting the Blessed One as saying to Ananda
    that the Tathagata had mastered the four paths to saintship and could remain alive
    for a Kalpa or the remaining portion of a Kalpa if he desired, while also saying
    that the Tathagata would die at the end of three months.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena replies that both statements were made by the Blessed One and explains
    that Kalpa in this connection means the duration of a man's life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nagasena says the statement about remaining alive did not exalt the Buddha's
    own power but the power of saintship.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nagasena uses a simile of a king who praises a swift horse by saying it could
    cross the earth to its ocean boundary and return in a moment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: An editorial note reports that other cited traditions describe shorter meditation
    periods and different terminology, rather than a three-month period.
  category: other
  evidence_refs:
  - ev:1
- id: obs:13
  text: A later editorial note connects the swift royal horse image with the Horse-treasure
    of the Great King of Glory in the Mahasudassana Sutta.
  category: other
  evidence_refs:
  - ev:8
