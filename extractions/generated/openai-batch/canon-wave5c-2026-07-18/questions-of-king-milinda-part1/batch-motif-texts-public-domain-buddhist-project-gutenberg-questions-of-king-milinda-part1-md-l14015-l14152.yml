canonical_text:
  quote: ''
  summary: The passage closes a prior problem by stating that certain acts were for
    gain, happiness, purification, and deliverance from birth, old age, disease, and
    death. It then presents King Milinda's question to Nagasena about the apparent
    contradiction between Moggallana being foremost among disciples in the power of
    Iddhi and his reported death by clubbing. Nagasena answers that Moggallana was
    indeed foremost in Iddhi, but at that time the stronger effect of Karma prevailed,
    using analogies of political authority, legal punishment, and an overpowering
    jungle fire.
  language: English
  quote_policy: summarized
