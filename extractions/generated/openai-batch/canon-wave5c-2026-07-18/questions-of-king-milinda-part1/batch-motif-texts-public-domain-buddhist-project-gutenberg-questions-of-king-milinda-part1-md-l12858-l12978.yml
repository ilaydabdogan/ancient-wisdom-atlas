canonical_text:
  quote: ''
  summary: 'The passage explains why a converted layman reveres an unconverted Bhikkhu:
    the Bhikkhu belongs to the Order, carries its precepts and outward signs, and
    trains others. A royal-prince-and-Brahman-teacher simile supports this hierarchy.
    The text then states that a lay disciple who attains Arahatship must either die
    that day or become a Bhikkhu. A new problem follows: the king challenges Nagasena
    about whether the Tathagata averts harm if a burning-fire discourse caused about
    sixty Bhikkhus to eject hot blood. Nagasena says the harm arose from their wrong
    reception. The king counters with a serpent-in-an-anthill analogy to argue indirect
    causation.'
  language: English
  quote_policy: summarized
