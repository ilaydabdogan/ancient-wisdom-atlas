  summary: In a dialogue, the king asks Nagasena about the marks of mindfulness, meditation,
    wisdom, and the common result of distinct good qualities. Nagasena answers with
    didactic comparisons involving royal administration, a roof apex, mountain slopes,
    a battle king and army, and a lamp brought into a dark house.
  language: English
  quote_policy: summarized
