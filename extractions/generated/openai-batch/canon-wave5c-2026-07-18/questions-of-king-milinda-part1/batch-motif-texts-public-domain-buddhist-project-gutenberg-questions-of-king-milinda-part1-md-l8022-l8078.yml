canonical_text:
  quote: "“When there is a great body of fire blazing, is it possible to point out
    any one flame that has gone out, that it is here or there?”"
  summary: In a dialogue, the king asks Nagasena whether the Buddha exists and whether
    he can be pointed out as being here or there. Nagasena says the Blessed One has
    passed away in a way that leaves no basis for another individual formation, so
    he cannot be localized. He illustrates this with a flame from a great fire that
    has gone out and cannot be pointed to as here or there. Nagasena adds that the
    Blessed One can be pointed out in the body of his doctrine, because the doctrine
    was preached by him.
  language: English
