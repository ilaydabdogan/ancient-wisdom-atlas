canonical_text:
  quote: ''
  summary: 'Nagasena explains to the king that the Tathagata preached without flattery
    or malice: those who received the teaching properly became wise, while those who
    received it wrongly fell through their own actions. The explanation uses analogies
    of fruit falling from trees, ploughing, sugarcane crushing, carpentry, self-destructive
    plants, punishment of robbers, ambrosia, food, and illness. A later dilemma concerns
    whether the Tathagata’s harsh address to Sudinna conflicts with his perfect courtesy
    of speech; Nagasena answers that the statement was not rudeness but an accurate,
    harmless indication of the nature of Sudinna’s conduct.'
  language: English
  quote_policy: summarized
