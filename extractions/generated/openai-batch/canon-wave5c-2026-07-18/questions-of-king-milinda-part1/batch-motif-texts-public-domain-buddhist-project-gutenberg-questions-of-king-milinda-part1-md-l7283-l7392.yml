canonical_text:
  quote: ''
  summary: A dialogue between King Milinda and Nagasena examines whether combined
    mental conditions can be separated and identified individually. Nagasena uses
    illustrations of mixed flavors in a sauce and of salt as known by tongue, not
    by sight or weight, to explain inseparable but distinguishable characteristics.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king asks whether conditions that have run together can be separated so
    that contact, sensation, idea, intention, perception, reflection, and investigation
    can each be identified distinctly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena answers that this separation cannot be done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nagasena gives an illustration of a royal cook making syrup or sauce with
    curds, salt, ginger, cumin seed, pepper, and other ingredients.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the sauce illustration, the individual flavors cannot be picked out once
    they have run together, though each flavor remains present by its characteristic
    sign.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Nagasena applies the sauce illustration to the previously discussed conditions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nagasena questions the king about whether salt is recognized by the eye or
    perceived by the tongue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dialogue states that every kind of salt is distinguished by the tongue.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king asks why bullocks bring whole cart-loads of salt if salt itself is
    only distinguished by tongue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nagasena says salt cannot be brought by itself because conditions have run
    together into the distinctive thing called salt.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nagasena distinguishes weighing salt from weighing its weight, saying it is
    not salt that is weighed but weight.
  category: speech
  evidence_refs:
  - ev:5
