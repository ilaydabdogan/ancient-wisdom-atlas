canonical_text:
  quote: ''
  summary: In a dialogue, the king asks Nagasena for illustrations of how thought
    and sense perception relate. Nagasena uses analogies of a one-gateway frontier
    city, carts following the same way by habit, and skills becoming expert through
    practice. He then defines mental factors that arise with thought and illustrates
    contact, sensation, idea, and the beginning of conceived purpose through examples
    of rams, cymbals, royal reward, heavenly rebirth after good deeds, and a treasurer
    recognizing colored objects.
  language: English
  quote_policy: summarized
