canonical_text:
  quote: ''
  summary: 'The passage distinguishes several classes of minds according to Buddhist
    attainments. Converted persons, Sakadagamis, Anagamins, and Arahats are each described
    as having thinking powers that act easily within the stages already clarified
    or purified, but with difficulty in higher domains not yet fully mastered. Repeated
    similes compare these minds to a giant bamboo: smooth up to a certain knot but
    entangled above it, or fully pruned and therefore easy to drag along.'
  language: English
  quote_policy: summarized
