canonical_text:
  quote: ''
  summary: 'The king asks Nagasena to resolve an apparent contradiction between statements
    that the Bodisat''s parents and other conditions are already destined and that,
    while in Tusita heaven, the Bodisat performs eight investigations before human
    rebirth. Nagasena replies that both are true: the Bodisat''s parents were settled,
    yet he investigated whether birth in a noble or Brahman family was appropriate,
    just as several agents test or investigate before acting. The king accepts the
    answer. A new problem begins concerning the prohibition of suicide and teaching
    about overcoming birth, old age, disease, and death.'
  language: English
  quote_policy: summarized
