canonical_text:
  quote: ''
  summary: 'The passage concludes a discussion of Vessantara''s extraordinary giving
    by comparing its effects to a heated cauldron and to a chief royal gem: his generosity
    is said to disturb winds, waters, and earth, making the earth shake seven times.
    The king praises Nagasena for resolving the dilemma and exalting the Buddha''s
    doctrine. A new dilemma is then raised about King Sivi, who is said to have given
    his eyes to a beggar, become blind, and received new eyes from heaven, apparently
    conflicting with a cited teaching that the divine eye cannot arise when its cause
    or basis has been destroyed.'
  language: English
  quote_policy: summarized
