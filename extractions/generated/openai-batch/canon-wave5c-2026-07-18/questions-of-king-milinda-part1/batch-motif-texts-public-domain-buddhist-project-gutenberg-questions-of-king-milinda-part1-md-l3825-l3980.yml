canonical_text:
  quote: "“Empty forsooth are these Vedas, and as chaff.”"
  summary: Nagasena is born and named, studies the three Vedas as a child, masters
    them rapidly, rejects them as lacking essential truth, meets the venerable recluse
    Rohana, asks about his shaved head and yellow robes, and seeks the real knowledge
    or best hymn. Rohana says he can teach it only after Nagasena becomes free from
    impediments by taking the hermit's dress with parental consent.
  language: English translation
  quote_policy: quoted
