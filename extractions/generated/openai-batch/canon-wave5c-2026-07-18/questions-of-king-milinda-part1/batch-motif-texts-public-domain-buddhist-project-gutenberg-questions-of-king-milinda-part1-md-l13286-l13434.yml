canonical_text:
  quote: ''
  summary: King Milinda asks Nagasena to reconcile the Buddha's severe illness after
    eating Cunda's alms with the claim that two offerings of food were exceptionally
    fruitful. Nagasena replies that the two almsgivings are those before perfect Buddhahood
    and before final passing away, that the gods rejoiced and gave divine nourishment
    to the last meal, and that the illness arose from bodily weakness and the exhaustion
    of the Buddha's life span rather than from the food. He explains the special merit
    of the gifts through the exalted states attained in connection with them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king cites the Elders' recitation that after eating Cunda the coppersmith's
    alms the Buddha experienced dire sickness and sharp pain unto death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king cites the Buddha's statement to Ananda that two food offerings are
    equal in fruit and result and greater than any others, then asks how Cunda's alms
    could be meritorious if it seemed to cause sickness or death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena identifies the two exceptional almsgivings as the one after which
    a Tathagata attains supreme perfect Buddhahood and the one after which he passes
    away by utter passing away with nothing remaining behind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nagasena says the gods rejoiced because the meal was the Tathagata's last
    and communicated divine nourishment to the tender pork.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nagasena describes the tender pork as in good condition, light, pleasant,
    full of flavor, and good for digestion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nagasena states that the Buddha's sickness did not arise from the food but
    from the extreme weakness of his body and the exhaustion of his remaining period
    of life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagasena supports his explanation with similes of a fire burning more when
    given fuel, a stream swelling into a great river when heavy rain falls, and a
    body becoming broader when more food is eaten.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nagasena says the two gifts are specially meritorious because exalted conditions
    resulted from them, namely nine successive states passed through first in one
    order and then in reverse order.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king responds with wonder that no other great gifts bestowed on the Blessed
    One can be compared with these two almsgivings.
  category: speech
  evidence_refs:
  - ev:7
