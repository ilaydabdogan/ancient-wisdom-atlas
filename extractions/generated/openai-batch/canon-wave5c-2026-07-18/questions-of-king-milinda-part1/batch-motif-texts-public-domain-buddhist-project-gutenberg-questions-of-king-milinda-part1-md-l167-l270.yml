    about the reason for those differences. It argues that Buddhaghosa, writing around
    430 A.D., knew a book of conversations between King Milinda and Nagasena and treated
    Nagasena's statement as highly authoritative. It then surveys manuscript and translation
    evidence for the work in Ceylon, Burma, Siam, and European libraries.
