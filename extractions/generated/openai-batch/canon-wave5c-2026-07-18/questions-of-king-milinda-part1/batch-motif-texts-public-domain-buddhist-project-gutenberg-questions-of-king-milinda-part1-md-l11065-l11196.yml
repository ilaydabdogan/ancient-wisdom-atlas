canonical_text:
  quote: ''
  summary: Nagasena explains to the king that the Buddha's statement limiting the
    endurance of the good law to five hundred years is not a blame or contradiction,
    but a statement of remaining duration. He then uses analogies of a reservoir replenished
    by rain, a furnace fed with fuel, and a mirror polished clean to explain that
    continued practice, virtue, morality, and purity of life keep the teaching established
    and prevent the world from being bereft of Arahats. The passage ends with a question
    about what the disappearance of the good law means.
  language: English
  quote_policy: summarized
