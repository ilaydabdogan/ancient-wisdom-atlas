canonical_text:
  quote: "“By faith he crosses over the stream. / By earnestness the sea of life;
    / By steadfastness all grief he stills, / By wisdom is he purified.”"
  summary: Nagasena answers the king through similes. Faith is compared to a person
    crossing a dangerous stream and thereby encouraging others. Perseverance is described
    as support, illustrated by a prop holding up a falling house and by a small army
    reinforced by allies. Mindfulness is described as repetition and keeping up, by
    which a recluse reviews moral categories and doctrinal lists.
  language: English
  quote_policy: quoted
