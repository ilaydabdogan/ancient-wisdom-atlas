canonical_text:
  quote: "“Both statements, O king, are correct. But the latter is owing to the power
    of the breach maker.”"
  summary: 'The king presents a dilemma between the claim that the Tathagata''s following
    cannot be broken up and the report that Devadatta seduced five hundred brethren.
    Nagasena answers that both statements are correct: schism can occur through the
    force of a breach-maker, but not through any fault or action of the Tathagata
    himself. The king accepts the answer.'
  language: English
  quote_policy: quoted
