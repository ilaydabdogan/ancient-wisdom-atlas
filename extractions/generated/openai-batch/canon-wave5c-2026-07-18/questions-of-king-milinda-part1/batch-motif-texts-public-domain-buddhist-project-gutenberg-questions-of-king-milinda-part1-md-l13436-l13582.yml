canonical_text:
  quote: ''
  summary: 'The passage closes a prior discussion in which gifts connected with the
    Buddha are said to yield greater fruit. It then presents a dilemma about two sayings
    attributed to the Tathagata: one tells Ananda not to be hindered by honoring the
    Tathagata''s remains, while another commends honoring a worthy relic as leading
    to heaven. Nagasena resolves the apparent contradiction by saying the first instruction
    was directed to the sons of the Conqueror, whose proper task is spiritual practice
    rather than reverential service, while reverence may be left to others. He supports
    this by analogies of social roles among princes, Brahmins, Vessas, and Suddas.
    The passage then begins a new dilemma: if the earth makes uneven places level
    when the Blessed One walks alone, why did a splinter of rock graze his foot?'
  language: English, with transliterated Pali terms in notes
  quote_policy: summarized
