canonical_text:
  quote: ''
  summary: Young Nagasena receives parental consent to enter the Order in order to
    learn a teaching from Rohana. Rohana admits him as a novice among Arahats, teaches
    him the Abhidhamma first, and Nagasena masters it after one hearing. Nagasena
    recites the Abhidhamma over seven months, accompanied by earthly and divine signs,
    and is admitted to full membership. After Rohana perceives and rebukes Nagasena's
    critical thought, he assigns Nagasena to overcome King Milinda's puzzles and sends
    him to Assagutta for the rainy-season retreat.
  language: English
  quote_policy: summarized
