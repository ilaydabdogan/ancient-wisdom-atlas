canonical_text:
  quote: ''
  summary: Nagasena explains to the king that the Buddha's injured foot and bodily
    illnesses were not results of his own karma but arose from external or physical
    causes. Devadatta, acting from hatred, pushed a rock toward the Tathagata; other
    rocks blocked it, and a splinter wounded the Buddha's foot. Nagasena uses analogies
    of seed and soil, food and stomach, clod and earth, and ploughed earth to distinguish
    karmic causes from present conditions. He cites a teaching addressed to Sivaka
    that rejects the view that every sensation is due to previous acts. The king accepts
    the explanation. A new dilemma begins concerning whether the Buddha, after accomplishing
    everything at the foot of the Tree of Wisdom, still needed three months of ecstatic
    contemplation.
  language: English
  quote_policy: summarized
