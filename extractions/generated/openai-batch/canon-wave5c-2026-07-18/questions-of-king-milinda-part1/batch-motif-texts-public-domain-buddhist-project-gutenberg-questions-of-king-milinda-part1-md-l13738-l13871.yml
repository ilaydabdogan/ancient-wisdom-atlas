canonical_text:
  quote: ''
  summary: 'The king presents Nagasena with two apparent contradictions in sayings
    attributed to the Blessed One: first, between rejecting exultation at praise and
    declaring himself the supreme king of righteousness to Sela; second, between non-injury
    and a saying about punishing and favoring. Nagasena resolves the first by distinguishing
    selfless compassionate teaching from delight in praise, and resolves the second
    by interpreting punishment and favor as subduing harmful states and cultivating
    wholesome ones. The passage ends during a further challenge about robbers and
    execution.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king quotes an instruction that monks should not become joyful, delighted,
    or exultant when someone praises the Blessed One, the Dhamma, or the Order.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king also quotes a stanza in which the Blessed One addresses Sela and
    describes himself as the supreme king of righteousness who sets an irreversible
    royal chariot wheel rolling in righteousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king frames the two quotations about praise and royal self-description
    as a double-edged problem requiring resolution.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nagasena says both quotations are correct and explains that the second was
    spoken not for gain, fame, party spirit, or winning followers, but from mercy,
    love, and concern for the welfare of others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nagasena states that the royal self-description was intended so that three
    hundred young Brahmans would attain knowledge of the truth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king quotes a command to do no injury and live full of love and kindness
    in the world, and contrasts it with a saying about punishing the deserving and
    favoring the worthy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king interprets punishment as bodily and social penalties such as cutting
    off hands or feet, flogging, bonds, torture, execution, and degradation in rank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nagasena says the non-injury verse is a doctrine approved by all Buddhas and
    accords with the Dhamma because the Dhamma works no ill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nagasena interprets the command about punishment and favor as meaning that
    what should be subdued should be subdued, and what is worthy of effort, cultivation,
    and approval should be cultivated.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Nagasena lists pairs to be subdued or cultivated: proud and lowly heart,
    wicked and good heart, careless and exact thought, wrong and right views, non-noble
    and noble person, robber and honest brother.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the king presses the case of the robber, Nagasena says rebuke, fine,
    banishment, or death may be applied if deserved, but then says execution of robbers
    is certainly not part of the doctrine laid down by the Tathagatas.
  category: speech
  evidence_refs:
  - ev:6
