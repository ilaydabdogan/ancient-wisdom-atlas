canonical_text:
  quote: ''
  summary: An opening note explains the Maṇḍala-māla as a roofed, pillared hall or
    arbour attached to hermitages. In the narrative, King Milinda feels intense fear
    before Nagasena, expressed through many animal, captivity, and supernatural similes.
    Wanting to avoid public humiliation, he says he will identify Nagasena without
    help. Devamantiya agrees. Milinda surveys the assembly, identifies Nagasena seated
    in the middle by his composed and fearless mien, and Devamantiya confirms the
    recognition. A verse states that Milinda has met many disputants but now feels
    unprecedented fear and foresees his own defeat and Nagasena's victory. Notes compare
    the episode to a corresponding passage in the Samanna Phala tradition.
  language: English
  quote_policy: summarized
