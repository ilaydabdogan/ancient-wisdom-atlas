canonical_text:
  quote: ''
  summary: A dialogue in which the king questions Nagasena about knowing an unseen
    Buddha, the Buddha's pre-eminence, the Truth, rebirth without transmigration,
    the absence of a soul, karmic continuity, and foreknowledge of rebirth. Nagasena
    answers through examples involving an unseen river, the ocean, writing, lamps,
    memorized verses, mangoes, a shadow, future fruit, and a farmer's crop.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king asks whether Nagasena or Nagasena's teachers have seen the Buddha;
    Nagasena answers no, and the king challenges the Buddha's existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena asks whether the king or the king's father has seen the river Uha
    in the Himalaya mountains; the king says no but still accepts that the river exists,
    and Nagasena applies the same reasoning to the Buddha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king asks whether the Buddha is pre-eminent and how Nagasena can know
    this without having seen him; Nagasena answers by referring to the ocean and to
    the Buddha's departed disciples.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ocean is described as deep, immeasurable, and unfathomable, receiving
    five great rivers without appearing more empty or more full.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tissa the Elder, a long-dead master of writing, is said to be known by his
    writing; Nagasena compares this with knowing the Blessed One through the Truth
    preached by him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nagasena states that disciples conduct themselves throughout life as if under
    the Buddha's eye and command.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nagasena states that rebirth can occur without transmigration and illustrates
    this with one lamp being lit from another lamp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Nagasena uses a learned verse as a second illustration: a verse learned from
    a teacher does not transmigrate from the teacher.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When asked whether there is a soul, Nagasena answers that in the highest sense
    there is no such thing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nagasena says that no being transmigrates from one body to another, but that
    rebirth prevents release from the consequences of evil deeds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A mango thief is said to deserve punishment because the mangoes stolen are
    the result of mangoes that were planted by another.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nagasena says that one name-and-form commits pure or impure deeds and that,
    by Karma, another name-and-form is reborn.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Deeds are said to follow like a shadow that never leaves, but they cannot
    be pointed out before fruition, like future fruits not yet produced by a tree.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Nagasena says one about to be reborn knows it and illustrates this with a
    farmer who sows seed, receives rain, and knows a crop will be produced.
  category: speech
  evidence_refs:
  - ev:9
