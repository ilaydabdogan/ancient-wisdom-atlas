canonical_text:
  quote: shine forth when displayed and not when kept secret
  summary: 'The king asks Nagasena to resolve an apparent contradiction: the Blessed
    One says the Dhamma and Vinaya shine when displayed, yet the Patimokkha recitation
    and Vinaya are kept secret. Nagasena answers that the secrecy is limited and justified
    by the custom of previous Tathagatas, reverence for the Dhamma, and respect for
    monastic standing. He compares restricted recitation to noble secret formulas
    and sect secrets, and says revered Dhamma should not be exposed to those who would
    despise it.'
  language: English
  quote_policy: quoted
