canonical_text:
  quote: ''
  summary: 'The passage explains that King Vessantara’s extraordinary generosity was
    so morally weighty that the earth could not bear it and quaked. His mind is described
    as fixed on generosity, purity, truthfulness, restraint, and the welfare of all
    beings, not on worldly reward. He gives away his son, daughter, and wife for the
    sake of Buddhahood and supreme wisdom. The passage then describes a cosmic disturbance:
    winds, waters, ocean beings, mountains, Sineru, animals, and supernatural beings
    are shaken or frightened.'
  language: English
  quote_policy: summarized
