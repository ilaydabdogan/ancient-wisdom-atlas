canonical_text:
  quote: Neither the same nor another.
  summary: In a dialogue, the king asks Nagasena about personal continuity, rebirth,
    non-rebirth, and the relation of intelligence to wisdom. Nagasena replies with
    analogies of life stages, a lamp and flame, milk becoming other dairy products,
    and a farmer whose granary is no longer being filled because the causes of filling
    have ceased.
  language: English translation
  quote_policy: quoted
