canonical_text:
  quote: ''
  summary: Nagasena says that one who walks righteously, properly admits, perceives,
    abandons, practices, and realizes the relevant conditions receives Nirvana. The
    king asks whether one who has not received Nirvana can know its happiness. Nagasena
    answers yes, comparing this to people knowing the sadness of amputated hands and
    feet by hearing the lamentation of those afflicted. Likewise, those who have not
    received Nirvana know its happiness by hearing the glad words of those who have
    seen it. A note compares a cited phrase with passages in Anguttara II, 4, 6 and
    Theri Gatha 794.
  language: English
  quote_policy: summarized
