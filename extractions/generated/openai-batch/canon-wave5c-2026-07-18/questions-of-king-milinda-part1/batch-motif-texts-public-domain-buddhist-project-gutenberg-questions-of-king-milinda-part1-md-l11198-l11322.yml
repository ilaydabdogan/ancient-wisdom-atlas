canonical_text:
  quote: ''
  summary: Nagasena explains three modes by which a doctrine disappears, then answers
    the king's dilemma about the Buddha's sinlessness and bodily suffering. He says
    the Buddha had destroyed all evil, but bodily pain can arise from causes other
    than Karma, listing eight causes of suffering and arguing that Karma-produced
    pain is only one part of suffering.
  language: English
  quote_policy: summarized
