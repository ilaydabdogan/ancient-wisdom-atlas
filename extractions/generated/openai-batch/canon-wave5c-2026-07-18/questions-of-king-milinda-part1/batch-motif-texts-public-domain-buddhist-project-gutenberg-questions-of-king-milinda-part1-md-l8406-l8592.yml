canonical_text:
  quote: Well, good deeds are like the boat
  summary: In dialogue, the king asks Nagasena how memory arises, and Nagasena lists
    many causes of recollection. The king then questions teachings about rebirth among
    gods or in purgatory, and Nagasena answers with a boat-and-stones analogy for
    good deeds. The king finally asks what recluses strive to remove if not past,
    present, or future sorrow; Nagasena explains that they strive so sorrow ceases
    and no further sorrow arises, using analogies of preparing defenses and water
    supplies before future danger or thirst.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The king asks how many ways memory springs up, and Nagasena answers that it
    springs up in sixteen ways.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena's list includes recollection by personal experience, outward aid,
    important occasion, joy, sorrow, similarity and difference, speech, signs, deliberate
    effort, calculation, arithmetic, learning by heart, meditation, reference to a
    book, a pledge, and association.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ananda and the devoted woman Khu^^uttara are cited as examples of persons
    who called to mind previous births.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king says he does not believe claims that a person who lived an evil life
    may be reborn among gods if thoughts of the Buddha enter the mind at death, or
    that one case of destruction of life may lead to rebirth in purgatory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nagasena asks whether a tiny stone would float on water without a boat and
    whether a hundred cart-loads of stones would float if loaded in a boat; the king
    answers that the first would not and the second would.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nagasena states that good deeds are like the boat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When asked whether recluses strive to remove past, future, or present sorrow,
    Nagasena denies each option and says they strive so that sorrow should cease and
    no other sorrow should arise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nagasena compares this striving to preparing moats, ramparts, watch towers,
    strongholds, food stores, and military training beforehand in order to ward off
    future danger from rival kings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nagasena also compares it to digging wells, ponds, and reservoirs beforehand
    in order to prevent future thirst.
  category: action
  evidence_refs:
  - ev:6
