canonical_text:
  quote: ''
  summary: 'King Milinda raises two dilemmas for Nagasena: whether the Buddha’s permission
    to abolish lesser and minor precepts conflicts with teaching by insight, and whether
    the Buddha’s refusal to answer Malunkyaputta conflicts with the claim that the
    Tathagata has no hidden teaching. Nagasena answers that the first permission was
    a test of the monks’ adherence to discipline, and that the second case belongs
    to a fourfold classification of questions, including questions that may be set
    aside.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Milinda presents a dilemma between the Buddha’s statement that he preaches
    the law by insight and the statement allowing the Order, after his death, to abolish
    lesser and minor precepts if it wished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nagasena affirms both cited statements and says the permission to abolish
    lesser and minor regulations was spoken to test the Bhikkhus after the Buddha’s
    death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nagasena uses an analogy of a king of kings telling his sons to abandon outlying
    border districts after his death; Milinda replies that princes would not give
    up territory already in their possession.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nagasena says the sons of the Buddha, seeking the law and emancipation from
    sorrow, might keep two hundred and fifty regulations and would not give up one
    laid down in ordinary course.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nagasena defines the lesser precepts as lesser errors in conduct and the minor
    precepts as lesser errors in speech, and says earlier leading elders were not
    unanimous on the point at the Council.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Milinda says that a dark saying of the Conquerors has now been uncovered and
    made clear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Milinda presents a second dilemma between the statement that the Tathagata
    has no closed fist of a teacher who keeps something back and the Buddha’s silence
    in response to Malunkyaputta’s question.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Nagasena says the Buddha’s silence was neither from ignorance nor from concealment,
    and describes four ways of explaining problems: direct and final answer, answer
    by details, answer by asking another question, and setting the problem aside.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nagasena gives examples involving questions about the impermanence of form,
    sensation, idea, confections, and consciousness, and an example of answering by
    another question about whether the eye can perceive all things.
  category: speech
  evidence_refs:
  - ev:7
