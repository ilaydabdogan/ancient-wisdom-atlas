canonical_text:
  quote: ''
  summary: At the Ganges, a novice makes an aspiration for instantaneous right speech
    through future births until Nirvana. A brother overhears and makes a matching
    aspiration to solve every problem the novice may pose. The two pass through many
    existences among gods and men; the Buddha foretells that five hundred years after
    his passing they will reappear and explain his doctrine through questions and
    metaphors. The novice becomes King Milinda of Sagala, renowned for learning, eloquence,
    strength, wealth, and disputation. Milinda reviews his army, asks for a learned
    person able to debate and resolve doubts, is directed by five hundred Yonakas
    to six famous teachers, and goes to visit Puraṇa Kassapa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After finishing his work, the novice goes to the riverside to bathe, sees
    the seething and surging billows of the Ganges, and makes an aspiration for the
    power to say the right thing instantly in every future condition until attaining
    Nirvana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The novice compares the desired force of his speech to the mighty surge of
    the Ganges, saying it should carry all before him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A brother puts away the broom, goes toward the riverside to bathe, overhears
    the novice, reflects that the act of merit had been instigated by him, and makes
    his own aspiration.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother wishes, in each future condition until Nirvana, to be ready with
    the right thing to say and especially to unravel and solve every problem and puzzling
    question the young man may put.
  category: speech
  evidence_refs:
  - ev:2
