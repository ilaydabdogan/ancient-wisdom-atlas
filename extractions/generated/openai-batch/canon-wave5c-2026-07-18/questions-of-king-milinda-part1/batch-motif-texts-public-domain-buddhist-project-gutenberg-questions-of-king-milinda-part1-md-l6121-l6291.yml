canonical_text:
  quote: ''
  summary: The passage opens with an editorial note comparing verses to the Theri
    Gatha and Manu. In the dialogue, Nagasena enumerates kinds of sensation, then
    answers King Milinda that name-and-form is reborn, not as the same entity but
    as another conditioned by deeds. Nagasena argues that rebirth does not release
    one from karma, using legal analogies involving stolen mangoes, rice or sugar,
    fires that spread from earlier fires, a lamp-caused village fire, and a girl who
    grows from childhood to adulthood.
  language: English
  quote_policy: summarized
