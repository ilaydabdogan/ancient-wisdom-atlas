canonical_text:
  quote: "“that moment neither fire, nor poison, nor sword can do him harm”"
  summary: The king raises a problem about Prince Sama, who was cultivating love toward
    all beings yet was struck by King Piliyakkha’s poisoned arrow. Nagasena answers
    that the protective virtue belongs not permanently to the person, but to the actual
    felt presence of love; Sama was vulnerable because he lapsed from that state while
    upsetting a water-pot. Nagasena explains by analogies of a supernatural Vanishing
    Root that makes its holder unseen and a cave that shelters a man from rain. A
    note compares this doctrine with Buddhist examples of love affecting an elephant,
    disciples, Roja the Mallian, and snake-bite protection.
  language: English
  quote_policy: quoted
