canonical_text:
  quote: ''
  summary: A king presents a dilemma about whether Arahats are free from fear, since
    a story says five hundred Arahats withdrew when the elephant Dhana-palaka charged
    toward the Tathagata in Rajagaha. Nagasena replies that they did withdraw, except
    Ananda, but not from fear; fear has no cause in Arahats, just as earth and mountain
    peaks have no cause for fear. He says the Arahats withdrew so that Ananda's goodness
    would be shown and people would gain emancipation. The king accepts the explanation.
  language: English
  quote_policy: summarized
