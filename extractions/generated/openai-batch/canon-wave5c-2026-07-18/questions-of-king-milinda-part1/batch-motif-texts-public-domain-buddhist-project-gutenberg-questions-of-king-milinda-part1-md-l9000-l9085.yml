canonical_text:
  quote: ''
  summary: After the night debate, attendants report that the middle watch has begun,
    torches are lit, banners are to be raised, and gifts are to be issued. The Yonakas
    and King Milinda praise Nagasena's ability. Milinda offers Nagasena an embroidered
    cloak, daily meals for eight hundred days, and lawful palace goods; Nagasena says
    he has enough, but the king argues that accepting protects both of them from public
    criticism. Milinda compares his worldly life to a lion in a golden cage longing
    for the outside, saying he longs for the higher life of recluses but is constrained
    by many foes. Nagasena departs to the hermitage. Both men independently reflect
    that the questions were well put and the answers rightly given, then meet the
    next morning and congratulate one another on what was spoken well.
  language: English
  quote_policy: summarized
