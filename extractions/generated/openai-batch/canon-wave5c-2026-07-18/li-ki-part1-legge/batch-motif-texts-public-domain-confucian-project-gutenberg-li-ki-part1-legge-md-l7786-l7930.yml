canonical_text:
  quote: ''
  summary: A sequence of ritual and ethical anecdotes concerns a returning ruler counseled
    not to reward only his exile-companions; a duke leaving a sacrifice to mourn a
    state minister and placing a hereditary land grant in the coffin; a son refusing
    to bury living concubines with his dead father; ritual propriety around sacrifice
    after a high minister’s death; rejection of a mechanical method for lowering a
    coffin; death and burial status in battle; instructions for conduct at ancestral
    graves and places of sacrifice; restrained killing in warfare; and the beginning
    of an account of noble funerary rites involving jade and enshrouding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A returned ruler considered granting towns and lands to those who had accompanied
    him in exile, but Lit wang argued that both the followers and those who guarded
    the altars had served, so the allotment did not occur.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duke instructed that he be informed if the grand historiographer of Wei
    died, even if the duke was engaged in sacrifice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the minister died, the duke bowed, asked permission from the personator
    of the dead to go, went without removing his sacrificial robes, contributed the
    robes to the mourning rites, and placed a written hereditary land assignment in
    the coffin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: X/an Kan-hsi ordered his son to make a large coffin and put two concubines
    alive in it with him after death; the son refused because burying the living with
    the dead was said to be contrary to propriety.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Kung Sui died, a sacrifice was repeated, the pantomimes put away their
    flutes, and Kung-ni judged the repetition contrary to rule when a high minister
    had died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A proposed mechanical contrivance for lowering a coffin was rejected in favor
    of earlier Lu practices using arrangements like stone pillars or wooden columns.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the fight at Lang, Kung-shu Zii-zin and the youth Wang I went forward and
    died; Wang I was allowed burial as one not prematurely dead because he had borne
    shield and spear in defense of the altars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Instructions are given that one leaving a state wails at ancestral graves
    before departure, one returning looks at the graves before entering, one bows
    when passing a grave, and one dismounts when passing a place of sacrifice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Shang Yang, urged to shoot during pursuit of Wu, killed three men, covered
    his eyes after killing, stopped after three, and was praised by Confucius as observing
    propriety amid killing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When duke Hwan of 3hdo died during an invasion meeting, others asked to see
    the plugging of his teeth with jade and were made to enshroud the corpse.
  category: action
  evidence_refs:
  - ev:9
