candidate_motifs:
- id: motif:1
  label: return from exile checked by impartial service to the altars
  taxonomy_refs:
  - return
  basis: The returned ruler’s plan to reward exile-companions is stopped by the argument
    that both followers and altar-guardians served the state.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage frames this as political and ritual ethics rather than as
    a mythic return narrative.
- id: motif:2
  label: sacrifice interrupted by death-duty to a state minister
  taxonomy_refs:
  - sacrifice
  basis: The duke leaves sacrifice, after asking ritual permission, because the deceased
    is a minister of the altars of the state.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The focus is ritual propriety, not a myth of divine sacrifice.
- id: motif:3
  label: funerary endowment placed with the corpse
  taxonomy_refs:
  - sacred_exchange
  basis: The duke places a written assignment of towns in the coffin for the minister’s
    descendants to hold generation after generation.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exchange is legal-ritual and funerary; the sacred-exchange taxonomy
    fit is tentative.
- id: motif:4
  label: refusal of living burial with the dead
  taxonomy_refs:
  - sacrifice
  basis: A dying man orders concubines buried with him, but the son refuses to kill
    them because burying the living with the dead is contrary to propriety.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage rejects the act; it does not present a completed human sacrifice.
- id: motif:5
  label: death suspends or alters sacrificial performance
  taxonomy_refs:
  - sacrifice
  basis: After a high minister dies, a repeated sacrifice is criticized as contrary
    to rule, and performers put away their flutes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a ritual rule motif rather than a narrative of divine-human exchange.
- id: motif:6
  label: ritual precedent over technical innovation in burial
  taxonomy_refs: []
  basis: The proposed mechanical lowering of a coffin is refused in favor of earlier
    Lu funerary methods.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No supplied taxonomy family directly matches this ritual-conservatism
    pattern.
- id: motif:7
  label: martial death transforms burial status
  taxonomy_refs: []
  basis: Wang I, though a youth, may be buried as not prematurely dead because he
    bore arms in defense of the altars.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage concerns ritual classification of death rather than heroic
    apotheosis.
- id: motif:8
  label: departure and return mediated by ancestral graves
  taxonomy_refs:
  - departure
  - return
  basis: Leaving a state requires wailing at graves; returning requires looking at
    graves before entering.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The actions are ritual etiquette, not a full departure-return myth cycle.
- id: motif:9
  label: respectful conduct at graves and places of sacrifice
  taxonomy_refs:
  - sacrifice
  basis: One should bow when passing a grave and dismount when passing a place of
    sacrifice.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an etiquette pattern rather than a narrative episode.
- id: motif:10
  label: propriety restraining violence in battle
