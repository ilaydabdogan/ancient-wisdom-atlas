canonical_text:
  quote: ''
  summary: The passage describes late-spring regulations for artisans, music, breeding
    animals, pestilence rites, and consequences of performing rites out of season.
    It then sets out the first month of summer through astronomical, ritual, sensory,
    numerical, divine, animal, vegetal, royal, and musical correspondences, including
    the inauguration of summer by the son of Heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Officials inspect materials for artisan work, including animal products, wood,
    grease, glue, cinnabar, and varnish, and workmen are ordered not to make anything
    contrary to the time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the end of the month, a fortunate day is chosen for a grand concert of
    music attended in person by the son of Heaven and court officials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Large bulls and fiery stallions are sent to females in pasture grounds, and
    animals fit for victims are listed together with foals and calves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ceremonies against pestilence are ordered throughout the city, and animals
    are torn in pieces at the nine gates in deprecation of danger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that observing winter, summer, or autumn governmental proceedings
    in the last month of spring would bring harmful results such as cold airs, decay
    of plants and trees, disease, failed rains, excessive rains, terrors, or warfare.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The first month of summer is correlated with specified constellations, cyclical
