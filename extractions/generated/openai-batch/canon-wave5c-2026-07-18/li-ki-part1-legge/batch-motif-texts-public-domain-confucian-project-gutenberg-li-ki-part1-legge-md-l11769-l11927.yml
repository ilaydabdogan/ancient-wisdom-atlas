    a pitch-tube, the number seven, acrid taste, and the smell of burning things.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: The sacrifice of the first month of summer is at the furnace, and the lungs
    of the victim are given the foremost place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Seasonal signs listed for the first month of summer include frogs croaking,
    earth-worms coming forth, royal melons growing, and sow-thistle being in seed.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:9
  text: The son of Heaven occupies the left apartment of the Ming Thang, rides in
    a vermilion carriage with red horses, bears a red flag, wears red robes and carnation
    jade, eats beans and fowls, and uses tall vessels.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: Before the inauguration of summer, the Grand recorder informs the son of Heaven
    of the appointed day and says the season’s energies are most fully seen in fire.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: For the inauguration of summer, the son of Heaven purifies himself, goes with
