canonical_text:
  quote: ''
  summary: The passage gives regulations and ritual prescriptions for the second and
    third months of winter. It links the shortest day, natural seasonal signs, official
    closures and repairs, royal comportment, sacrifices, anti-pestilence rites, and
    fishery offerings with winter’s cosmic and governmental order. It also lists harmful
    consequences if governmental proceedings proper to other seasons are followed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People able to gather edible fruits from hills, forests, marshes, and meres,
    or capture game by hunting, are to receive information and guidance from wardens
    and foresters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who encroach on or rob others in this context are to be punished without
    fail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the month described, the shortest day arrives; the principle of darkness
    and decay struggles with the principle of brightness and growth, and the elements
    of life begin to move.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Superior men practice self-adjustment and fasting, remain retired, put away
    music and beautiful sights, repress desires, and seek bodily and mental repose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rice begins to grow, broom-sedge rises vigorously, worms curl, moose-deer
    shed their horns, and springs of water are in movement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the shortest day arrives, trees are felled and bamboos, especially small
    species suitable for arrows, are carried away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Offices with no business may be closed, and vessels with no use may be removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pillars, gateways, courtyards, doors, and prisons are repaired or rebuilt
    to cooperate with nature’s seasonal tendency to shut up and secure influences.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If summer governmental proceedings are observed in this winter month, droughts,
    gloomy vapours and fogs, and thunder are predicted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If autumn governmental proceedings are observed in this winter month, rainy
    slushy weather, incomplete growth of melons and gourds, and great wars are predicted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If spring governmental proceedings are observed in this winter month, locust
    harm, dry springs, and many cases of leprosy and foul ulcers are predicted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the third month of winter, the passage assigns the sun, dusk and dawn
    constellations, cyclical days, divine ruler, attendant spirit, creatures, musical
    note, pitch-tube, number, taste, smell, sacrifice, and foremost victim-part.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Wild geese go northwards, the magpie begins to build, the cock pheasant crows,
    hens hatch, and birds of prey fly high and rapidly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The son of Heaven occupies the right apartment of the Hsüan Thang, uses dark-colored
    carriage, horses, flag, robes, and jade gems, eats millet and sucking-pig, and
    uses large, rather deep vessels.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The son of Heaven orders proper officers to institute ceremonies against pestilence,
    have animals torn in pieces on all sides, and send forth the ox of earth to escort
    away injurious airs of cold.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Sacrifices are offered all round to spirits of hills and rivers, great ministers
    of ancient deified sovereigns, and spirits of heaven and earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The master of the Fishermen is ordered to commence the fishers’ work; the
    son of Heaven personally observes, eats some of the fish, and first presents some
    in the apartment at the back of the ancestral temple.
  category: action
  evidence_refs:
  - ev:11
