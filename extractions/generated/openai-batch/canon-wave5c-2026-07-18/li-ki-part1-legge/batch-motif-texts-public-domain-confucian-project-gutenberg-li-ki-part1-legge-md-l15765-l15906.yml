canonical_text:
  quote: ''
  summary: The passage opens with a fragment describing a son’s care for his sick
    father. It then introduces Confucius after the K4 sacrifice, sighing over the
    condition of Lu. In dialogue with Yen Yen, Confucius contrasts the Grand Course
    or Grand Union, marked by public spirit, social provision, sincerity, harmony,
    and lack of crime, with a later condition called Small Tranquillity, marked by
    family inheritance, private advantage, fortified cities, and reliance on ritual
    propriety to regulate social relations. He states that ancient kings used the
    rules of propriety to represent the ways of Heaven and regulate human feelings.
  language: English translation
  quote_policy: summarized
