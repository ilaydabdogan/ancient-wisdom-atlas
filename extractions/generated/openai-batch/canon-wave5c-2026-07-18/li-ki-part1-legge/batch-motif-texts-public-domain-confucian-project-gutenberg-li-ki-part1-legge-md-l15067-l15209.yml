canonical_text:
  quote: ''
  summary: 'The passage describes a system of royal and district education: students
    learn music, ceremonies, and History in designated schools and seasons; instructors
    teach ritual offerings, conversations, and martial or musical performance; pupils
    observe formal etiquette before instructors; schools make offerings to earlier
    teachers and sages, feast the aged, examine and advance students by merit, and
    conduct simplified rites at the first establishment of a school. A note describes
    a group of ancient schools arranged around the Pi Yung and a graduated system
    of advancement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Students are described as learning guitar from the grand master in the Hall
    of the Blind, ceremonies in autumn from masters of ceremonies, and the book of
    History in winter from its guardians; ceremonies and the book are assigned to
    different school spaces.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note describes four proximate schools under the Xau dynasty, with the Pi
    Yung at the centre and other schools on the north, east, and west, each associated
    with different instruction or functions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same note describes promising scholars moving through a graduated sequence
    of family schools and district schools to a great school or college in the suburbs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lower directors of Music teach rules for offerings, the practice of asking
    the old to speak their counsels, and conversation at general reunions in the eastern
    school.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Grand director of Music teaches how to brandish the shield and axe and
    gives rules concerning conversations and requests for the old to speak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pupil sitting with the Grand completer of Instruction must keep the width
    of three mats between them, ask questions in order, sit back after finishing,
    and not ask about another point before the instructor has finished the first.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Schools set forth offerings to the first teachers in spring, autumn, and winter;
    at the first establishment of a school, offerings are made to earlier sages and
    earlier teachers using pieces of silk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Offerings are normally accompanied by dancing and singing, but these are omitted
    during engrossing state events; when music is performed on a great scale, the
    aged are feasted immediately afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Suburban school examinations select the best and most talented; pupils may
    be advanced for virtue, accomplishments, or eloquence, while students of minor
    arts are encouraged toward a second examination.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the first establishment of schools, after instruments are completed, silk
    and vegetable offerings are made; there is no dancing or distribution of spears,
    visitors are received in the eastern school, one cup is passed round, and the
    rites are described as part of the education of young princes.
  category: sequence
  evidence_refs:
  - ev:7
