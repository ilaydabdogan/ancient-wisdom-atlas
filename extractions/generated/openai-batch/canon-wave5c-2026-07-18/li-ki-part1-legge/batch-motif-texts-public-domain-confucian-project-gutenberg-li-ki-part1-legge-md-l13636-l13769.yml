canonical_text:
  quote: ''
  summary: Zang-3ze asks Confucius what ritual course should be followed when a ruler
    dies and a son and heir is born either immediately after the death or after the
    burial. Confucius prescribes announcements before the deceased ruler’s coffin
    or spirit tablet, mourning gestures, offerings, presentation of the child, and
    later publication of the child’s name at household, ancestral, territorial, and
    natural-spirit altars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zang-3ze asks what should be done if a ruler dies and a son and heir is born
    immediately after.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says officials should assemble south of the western steps, facing
    north, under the temporary charge of the chief minister.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Grand officer of prayer, wearing court robes and cap and carrying rolls
    of silk, orders the wailing to stop, clears his voice three times, and announces
    the child’s birth to the deceased ruler’s spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rolls of silk are placed on a stool east of the body in the coffin, after
    which the officer wails and descends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Relatives, nobles, officers, and women in the apartments wail without leaping;
    mourning offerings are set forth, and a minor minister removes the silk bundle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the third day, officials in court robes and caps take position, and the
    child’s master carries the child on a mat of sackcloth into the apartment where
    the coffin is located.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The child is held before the coffin facing north while the prayer officer
    stands at the southeast corner and announces the child and his servants before
    the deceased.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The child is made to bow with his forehead to the ground and to wail; participants
    wail and leap, bare the left arm and shoulder, and the child and women are also
    made to leap.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Grand minister charges the officer of prayer and recorder to announce
    the child’s name at the five household altars and at the altars of the hills and
    streams.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the son and heir is born after the ruler’s burial, the birth is announced
    before the deceased ruler’s spirit tablet, and three months later the name is
    announced there and at courts, altars of land and grain, the ancestral temple,
    and altars of hills and streams.
  category: sequence
  evidence_refs:
  - ev:6
