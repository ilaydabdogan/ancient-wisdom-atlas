canonical_text:
  quote: ''
  summary: The passage gives prescriptive rites for the birth, reception, nursing,
    shaving, naming, and recording of sons, especially an heir-son of a ruler. It
    describes divination by tortoise-shell, animal provisions scaled by rank, directional
    archery with bow and arrows, appointment of nurses and female caretakers, formal
    presentation to the father, naming speeches, written registration, restrictions
    on names, and procedure for a concubine who bears a son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a son and heir to a ruler is born, the ruler arranges a reception feast
    with the three animals, and the cook prepares for it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the third day, the tortoise-shell is consulted to choose a good man to
    carry the child; the chosen man keeps vigil overnight and receives the child in
    court robes outside the chamber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The master of the archers uses a bow of mulberry wood and six arrows of wild
    rubus to shoot toward heaven, earth, and the four cardinal points.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the archery act, the nurse receives the child, the cook gives sweet
    wine and silks to the man who carried the child, and divination is used again
    to select a nurse.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The animals killed or provided for receiving a son vary by social rank and
    are reduced by one degree when the son is not the eldest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A special apartment is prepared for the child, and three women are selected
    to serve as teacher, indulgent mother, and guardian mother; they live in the apartment
    with restricted access by others.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the end of the third month, a day is chosen for shaving the child's hair
    except for specified retained portions; the parents wash, bathe, dress formally,
    and take prescribed positions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The governess presents the child on behalf of the mother; the father tells
    her to teach him to follow the right way, takes the son's right hand, and names
    him; the wife affirms the words.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child's name is communicated to relatives and male kin, recorded with
    birth date information, copied by officials, and deposited in village and circuit
    offices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For an heir-son, the ruler and wife wash and put on court robes; a lady of
    quality carries the child up the western steps, and the ruler names the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A second son or another son by the proper wife is presented in the outer chamber;
    the ruler lays his hand on the child's head and names him gently, with other observances
    as before but without words.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A son's name must not be the name of a day, month, state, or hidden ailment,
    and sons of officers must not share the name of the ruler's heir-son.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a concubine is near childbirth, the husband sends daily inquiries; after
    a son is born and three months pass, she appears in the proper wife's inner chamber,
    is received ceremonially, receives a special portion of food, and enters duties
    of attendance.
  category: sequence
  evidence_refs:
  - ev:9
