canonical_text:
  quote: ''
  summary: The passage describes rites and regulations for the second month of spring.
    The king occupies the central spring apartment, natural growth and young life
    are protected, sacrifices and offerings are made to field spirits, the first match-maker,
    the ruler of cold, and the inventor of music, and officials regulate prisons,
    measures, agricultural work, fishing, hunting, ice storage, and music practice.
    The equinox, thunder, lightning, the swallow, and emerging insects are presented
    as seasonal signs. The passage warns that applying governmental procedures of
    other seasons in this spring month would bring floods, cold, plundering, unripe
    crops, strife, drought, early heat, and insect damage.
  language: English
  quote_policy: summarized
