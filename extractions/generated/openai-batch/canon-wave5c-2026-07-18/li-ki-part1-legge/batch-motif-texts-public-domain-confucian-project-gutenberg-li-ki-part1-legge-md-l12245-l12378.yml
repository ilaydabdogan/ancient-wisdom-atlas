canonical_text:
  quote: ''
  summary: A monthly ordinance passage describes the Son of Heaven's seasonal placement,
    red regalia, food, and vessels; orders to officials concerning aquatic animals,
    rushes, sacrificial fodder, dyeing, forest protection, and agricultural work;
    restrictions against major construction, assemblies, and military action during
    the growing season; wet-field cultivation practices; and calamities expected if
    proceedings proper to other seasons are carried out in the last month of summer.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Son of Heaven occupies the right apartment of the Ming Thang, rides in
    a vermilion carriage with red horses and a red flag, wears red robes and carnation
    gems, eats beans and fowls, and uses tall vessels said to resemble large growth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Orders are issued to the master of the Fishermen to attack or take several
    aquatic animals, including the alligator, gavial, tortoise, and great turtle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Orders are issued to the superintendent of the Meres to collect and send rushes
    available for use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four inspectors are ordered to collect fodder throughout the districts for
    sacrificial victims, so that offerings and prayers may be made to Heaven, various
    spirits, ancestral temple intelligences, and the spirits of land and grain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Officers of women's work supervise dyeing so that prescribed color combinations
    and genuine colors are produced for sacrificial robes, flags, ornaments, and rank
    markings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Foresters are ordered to inspect trees among the hills and prevent people
    from cutting them down or lopping their branches while the trees are luxuriant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Work in earth, assemblies of state princes, military movements, and great
    affairs are prohibited because they would disturb nourishing growth and interfere
    with husbandry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that floods are great, roads overflow, and the curse of
    Heaven will come upon great undertakings at this time.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ground is steaming and wet under heat and continual rain; cut grass is
    burned and then watered so that it kills roots and manures fields of grain and
    hemp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If seasonal proceedings proper to spring, autumn, or winter are observed in
    this summer month, the passage predicts failures of grain, illness, migration,
    flooding, miscarriages, untimely cold, premature predation by hawks and falcons,
    and border populations entering shelter.
  category: sequence
  evidence_refs:
  - ev:9
