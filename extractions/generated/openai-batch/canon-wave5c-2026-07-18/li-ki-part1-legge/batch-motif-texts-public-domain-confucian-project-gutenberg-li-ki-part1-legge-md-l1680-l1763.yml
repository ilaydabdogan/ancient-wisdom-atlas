canonical_text:
  quote: ''
  summary: Translator's introductory notes describe Ki Fa as a treatise on sacrifices,
    especially non-expiatory sacrifices of gratitude to departed worthies, Heaven,
    the sun, moon, and natural powers. The following book is summarized as treating
    the meaning of sacrifices, including ancestral temple rites, reverent preparation,
    a conversation on the Kwei and Shan souls, and ritual production of sacrificial
    grain and robes.
  language: English
  quote_policy: summarized
