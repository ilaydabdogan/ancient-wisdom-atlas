candidate_motifs:
- id: motif:1
  label: Ritual separation of the dead from the living
  taxonomy_refs: []
  basis: The ruler’s death-rite attendance differs from a visit in life, and imaginary
    vessels are used because living vessels for the dead might lead to burying living
    persons with the dead.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: This is a ritual pattern rather than a mythic narrative motif.
- id: motif:2
  label: Substitute objects and figures for the dead
  taxonomy_refs: []
  basis: The passage groups imaginary vessels, clay carriages, straw figures, and
    wooden automata as funerary substitutes while distinguishing acceptable substitutes
    from dangerous lifelike ones.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives ethical ritual evaluation, not a story of animated figures.
- id: motif:3
  label: Dead treated as spiritual intelligences
  taxonomy_refs: []
  basis: The dead are explicitly said to be treated as spiritual intelligences through
    the use of vessels in imagination and related grave objects.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not describe the dead acting or speaking; it only states
    ritual treatment.
- id: motif:4
  label: Filial transition from chamber to ancestral temple
  taxonomy_refs: []
  basis: The corpse is brought to the ancestral temple because the deceased is supposed
    to grieve at leaving his chamber, and the coffin then continues on its way.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes ritual movement, not a detailed afterlife journey.
- id: motif:5
  label: Sincerity of mourning versus outward display
  taxonomy_refs: []
  basis: Ai Kao-zze chooses ordinary rice rather than emaciating himself by gruel
    because political disharmony would make such grief appear doubtful.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an ethical-social pattern within mourning practice.
- id: motif:6
  label: Ritual propriety adjusted to political conditions
  taxonomy_refs:
  - wisdom
  basis: Zze-sze and Zang-zze both connect mourning practice or ceremonial fullness
    to the quality of political conduct and governance.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The taxonomy link to wisdom is broad and rests on didactic judgment rather
    than mythic narrative.
comparison_claims:
- id: claim:1
  claim: The passage compares Yin and Adu mourning practices by the timing of tablet
    placement and by the sequence of coffin presentation and interment, with Confucius
    approving the Yin tablet practice.
  claim_level: same_function
  target: Yin and Adu mourning practices within the passage
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal ritual comparison; it does not establish historical
    development beyond what the passage states.
- id: claim:2
  claim: Imaginary vessels, clay carriages, straw figures, and the wooden automaton
    are presented as related funerary substitutes, but the wooden automaton is evaluated
    more negatively because of its perceived proximity to using living men.
  claim_level: same_function
  target: funerary substitute objects within the passage
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supplies ethical evaluation but not detailed manufacture
    or use-context for each object.
- id: claim:3
  claim: Ancient princes and present princes are contrasted as different models of
    ruler-minister relations, which changes whether continued mourning for an old
    ruler is expected.
  claim_level: same_function
  target: ancient versus contemporary service obligations as described by Zze-sze
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is rhetorical and normative within the dialogue, not
    independently documented here.
- id: claim:4
  claim: An-zze’s minimal burial display is compared with rank-based expectations
    for rulers and Great officers; Zang-zze interprets the smaller display as an ethical
    response to extravagant administration.
  claim_level: same_function
  target: economical and full ceremonial display in mourning rites
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports competing evaluations but does not give a full
    rulebook for all ranks.
