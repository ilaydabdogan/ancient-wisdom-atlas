canonical_text:
  quote: ''
  summary: 'The passage records rules, judgments, and anecdotes about mourning rites:
    timing of the ancestral tablet, a ruler’s attendants at a minister’s funeral,
    presentation of the coffined corpse in the ancestral temple, use of imaginary
    vessels and funerary figures, obligations toward former rulers, mourning diet,
    timing of mourning dress, economical or complete observance of rites, and arrangement
    of men and women at the grave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Under Yin, the tablet was placed when mourning changed after twelve months;
    under Adu, it was placed when continuous wailing was over; Confucius approved
    the Yin practice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a ruler attended mourning rites for a minister, he brought a sorcerer
    with a peach-wand, an officer of prayer with a reed-brush, and a lance-bearer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ruler’s mourning attendance was said to show dislike of death and to make
    the visit differ from an affair of life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The coffined corpse appeared in the court of the ancestral temple because
    the deceased was supposed to be grieved at leaving his chamber; after this, the
    coffin continued on its way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Confucius said that vessels made only in imagination were complete in appearance
    but unusable, and he warned that using vessels of the living for the dead could
    lead to burying the living with the dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dead were treated as spiritual intelligences through imaginary vessels,
    clay carriages, and straw figures.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Confucius approved the making of straw figures but called the making of a
    wooden automaton not benevolent because it risked leading to the use of living
    men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Zze-sze answered Duke Mu that ancient princes advanced and dismissed men according
    to propriety, but present princes treated men with extreme favor and then cast
    them off; therefore continued mourning for an old ruler could not be expected
    in the same way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the mourning rites for Duke Tao, gruel was stated as the general rule,
    but Ai Kao-zze chose to eat rice as usual to avoid appearing insincere after known
    disharmony with the ducal house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Zze-yi delayed putting on mourning bands until after the chief mourner had
    completed the slight dressing and changed dress, citing a rule heard from the
    Master.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Zang-zze interpreted An-zze’s reduced burial display and long use of one
    fox-fur robe as propriety shaped by political conditions: economy answers extravagance,
    while full observance answers economy.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kwo Kao-ze rejected a precedent in which men and women faced opposite directions
    at the grave, and instead ordered women behind men with all facing west while
    he alone acted as host.
  category: action
  evidence_refs:
  - ev:10
