canonical_text:
  quote: ''
  summary: 'The passage lists funeral practices identified as Yin dynasty customs
    and followed by learners in Confucius'' school, then presents anecdotes and maxims
    about mourning conduct: refusing improper means for burial expenses, distributing
    surplus funeral contributions, duties tied to counsel in war or state affairs,
    restraint around a desired burial site, regulated expressions of grief, corpse-handling
    procedures, disputed mourning between certain relatives, urgency and limits in
    mourning affairs, preparation of mourning supplies, graded mourning obligations
    among kin, and restrained eating beside someone conducting mourning rites. The
    final anecdote about 3ang-3ze and a hurried companion is incomplete in this range.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names sackcloth head-bands and girdles, washing a corpse over
    a hole in the apartment, placing furnace tiles at the corpse's feet, and breaking
    part of an ancestral-temple wall for the funeral exit as practices of the Yin
    dynasty followed by learners in Confucius' school.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the mother of 3ze-lid died, 3ze-shih asked how to obtain means for the
    mourning rites and proposed selling the concubines who were mothers of their half-brothers;
    3ze-lid rejected this.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the burial, 3ze-shih wanted to use remaining contributed money and goods
    for sacrificial vessels; 3ze-lid rejected this and directed that the surplus be
    distributed among poor brethren.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A superior man states that one who counsels another about an army should die
    with it when defeated, and one who counsels about a country or capital should
    perish with it when it is endangered.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kung-shi Wan-3ze ascends the mound of Hsia, says it is pleasant, and expresses
    a wish to be buried there; Ati Po-yii asks to be allowed to go home before Wan-3ze
    says more.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man of Pien weeps like a child after his mother's death; Confucius calls
    it grief but says ritual rules require fixed regulations for wailing and leaping.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the corpse of Shu-sun Wa-shti's mother had been carried out, Shu-sun
    Wa-shti bared his arms, threw down his cap, and bound his hair with sackcloth;
    3ze-yQ derided him as knowing the rules.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a ruler is ill, the high chamberlain supports him on the right and the
    assigner of positions supports him on the left; when he dies, those two officers
    lift the corpse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says no superior man has stated that a husband of a maternal cousin
    and a wife of a maternal uncle should mourn for each other, but reports a view
    that three months' mourning applies if they have eaten together from the same
    fireplace.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mourning affairs should be handled urgently but not beyond prescribed rules,
    while festive affairs may be leisurely but not negligent.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A superior man is said to be ashamed to prepare beforehand everything needed
    for mourning rites, and does not prepare beforehand what can be made in one or
    two days.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage distinguishes mourning obligations for a brother's son, an elder
    brother's wife and younger brother, and married aunts or sisters.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: When the Master eats beside someone who has mourning rites in hand, he never
    eats to fullness.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: 3ang-3ze stands with another visitor by the door of their lodging when the
    other visitor's companion hurries out; the anecdote is not completed in this passage
    range.
  category: sequence
  evidence_refs:
  - ev:14
