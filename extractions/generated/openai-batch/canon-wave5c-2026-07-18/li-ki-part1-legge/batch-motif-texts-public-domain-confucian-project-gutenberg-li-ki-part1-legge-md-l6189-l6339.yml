candidate_motifs:
- id: motif:1
  label: Regulated mourning gestures and garments
  taxonomy_refs: []
  basis: The passage repeatedly treats grief as embodied through prescribed actions
    such as sackcloth, wailing, leaping, hair-binding, and graded mourning obligations.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  - ev:12
  confidence: high
  cautions: This is a ritual pattern in the passage, not a mythic narrative motif.
- id: motif:2
  label: Funeral ethics against improper gain
  taxonomy_refs: []
  basis: 3ze-lid refuses to sell the mothers of other men for funeral expenses and
    refuses to enrich the family or buy sacrificial vessels from surplus mourning
    contributions.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents ethical ritual conduct, not a supernatural or mythic
    episode.
- id: motif:3
  label: Counsel binds the adviser to the fate advised
  taxonomy_refs:
  - wisdom
  basis: A superior man states that those who advise an army, country, or capital
    should die or perish with it if it is defeated or imperiled.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is broad; the passage gives a maxim rather than
    a narrative demonstration.
- id: motif:4
  label: Ritual timing balanced between urgency and restraint
  taxonomy_refs:
  - wisdom
  basis: The passage says mourning affairs require urgency without exceeding prescribed
    rules, festive affairs allow leisure without negligence, and a superior man avoids
    premature mourning preparations.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: Classified as wisdom because it is aphoristic normative instruction; the
    fit is general.
- id: motif:5
  label: Shared hearth as possible basis for mourning obligation
  taxonomy_refs: []
  basis: The passage reports a view that certain relatives should wear three months'
    mourning if they have eaten together from the same fireplace.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage explicitly notes that no superior man has affirmed this rule,
    so the motif is presented as disputed.
- id: motif:6
  label: Burial-place desire met by distancing response
  taxonomy_refs: []
  basis: Wan-3ze expresses desire to be buried on a pleasant mound, and Po-yii responds
    by asking to go home before more is said.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage itself does not fully explain Po-yii's motive; any interpretation
    as rebuke or land-claim impropriety would need external support.
