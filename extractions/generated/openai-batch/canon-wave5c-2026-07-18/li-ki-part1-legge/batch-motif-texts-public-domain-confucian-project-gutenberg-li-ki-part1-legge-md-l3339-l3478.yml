canonical_text:
  quote: ''
  summary: The passage gives rules of ritual conduct for learners, youths, visitors,
    and attendants before elders or superiors; regulates posture, speech, seating,
    torches, food, shoes, and bodily decorum; prescribes separation of men and women
    in domestic and marriage contexts; and describes marriage-related announcements,
    purification, feasting, surname avoidance, and tortoise-shell consultation when
    a concubine's surname is unknown.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learner should listen respectfully, avoid introducing subjects not raised
    by the elder, and use proofs from antiquity and the ancient kings when needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A learner should rise when requesting instruction or further information,
    and a youth should rise and go when called by his father or teacher.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person attending someone honored should rise when torches, viands, or a
    visitor of superior rank arrives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Torches are mentioned as objects brought in during attendance on an honored
    person; the note says they were borne by boys and often changed so visitors would
    not perceive the passing time.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: When a superior yawns, stretches, handles his staff or shoes, or looks toward
    the sun to judge the time, the attendant should ask permission to leave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage forbids improper listening, loud sharp answering, dissolute looking,
    slouching, haughty walking, standing with one foot raised, sitting with knees
    wide apart, and sleeping face-down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A visitor attending an elder should not go up to the hall with shoes on and
    should handle shoes by kneeling, moving aside, and putting them on while stooping
    when leaving.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Two people sitting or standing together should not be joined by a third, and
    another person should not pass between two people standing together.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Male and female are not to sit together in the same apartment, share clothes-rack,
    towel, or comb, or let their hands touch in giving and receiving.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Outside affairs should not be discussed inside the women's threshold, nor
    women's affairs outside it.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A young woman promised in marriage wears strings hanging down to her neck,
    and a note identifies the strings as symbolic of union with and subjection to
    her future husband.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:12
  text: A man and woman do not know each other's name without a matchmaker, and without
    received marriage presents there should be no communication or affection between
    them.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:13
  text: The marriage day and month should be announced to the ruler and to ancestral
    spirits with purification and fasting, followed by a feast for local friends and
    fellow officers.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: One should not marry a wife of the same surname; if a concubine's surname
    is unknown, the tortoise-shell should be consulted.
  category: action
  evidence_refs:
  - ev:15
