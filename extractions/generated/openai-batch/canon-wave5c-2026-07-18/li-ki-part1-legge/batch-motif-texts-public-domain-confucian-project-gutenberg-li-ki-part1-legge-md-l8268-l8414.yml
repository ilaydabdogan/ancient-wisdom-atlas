canonical_text:
  quote: ''
  summary: A sequence of ritual and moral anecdotes describes famine relief refused
    after a humiliating address, punishment for parricide, a house-warming exchange
    framed by death and burial, instructions for burying a dog, condolence conduct
    shaped by proper dress, and a minister's mourning for a gate soldier interpreted
    as evidence of civic loyalty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a great dearth in K/i, Khien Ao prepares food on the roads for hungry
    people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A famished man approaches with his face covered by his sleeve and with dragging
    feet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Khien Ao offers rice and drink with a pitying address; the famished man refuses
    the food because of that address, refuses again after an apology, and dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 3ang-jze comments that after the apology the man might have taken the food.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Duke Ting's time, a man kills his father, and the duke describes the matter
    as his own unworthiness before stating the penalty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stated penalty for a son killing his father includes killing the man,
    destroying his house, turning the place into a water-covered swamp, and the ruler
    abstaining from a cup for a month.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Wan-3ze's completed residence, Kang Lao praises the house as elegant, lofty,
    and splendid, and names future songs, wailings, and assemblies there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wan-3ze replies by linking the house's future songs, wailings, and assemblies
    to his hope of preserving his body and following former Great officers of his
    family to the Nine Plains.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A superior man says that one speaker was skillful in praise and the other
    in prayer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: When Aung-ni's dog dies, he instructs 3ze-kung to bury it using his mat and
    not to let the dog's head be buried in the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Aung-ni states that worn-out curtains and umbrellas may be reused in burying
    horses and dogs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the mother of Ai-sun dies, Duke Ai visits in condolence, and 3ang-jze
    and 3ze-kung later arrive for the same purpose.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: When initially not admitted because the ruler is present, 3ang-jze and 3ze-kung
    go to the stable, adjust their dress more fully, enter, and receive deference
    from officials and the duke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A superior man comments that when the toilet is complete, its influence extends
    far.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: 3ze-han bitterly wails for a dead man-at-arms at the Yang gate of Sung.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Spies from 3in report that the people were pleased by 3ze-han's mourning and
    conclude that Sung cannot be attacked successfully.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: A translator's note says the concluding sentence in the dog-burial anecdote
    is also found in the 'Narratives of the School.'
  category: other
  evidence_refs:
  - ev:7
