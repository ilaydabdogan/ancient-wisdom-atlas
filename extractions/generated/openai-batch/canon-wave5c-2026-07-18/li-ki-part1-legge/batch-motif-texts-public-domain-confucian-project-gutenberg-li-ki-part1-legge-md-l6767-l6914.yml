canonical_text:
  quote: ''
  summary: The passage gives ritual rules for mourning, condolence, coffining, funeral
    objects, rank-based mourning conduct, eulogy, and responses to political loss.
    It describes obligations after a parent's coffining, elaborate coffins and funeral
    enclosure for the son of Heaven, mourning attire and abstention from music, wailing
    arrangements by rank and surname, Duke Ai's eulogy for Confucius, mourning for
    lost territory, restrictions on family property, transition out of mourning, palls,
    sacrificial grave carriages for underage sons, staffs for officers, and a ruler's
    condolence at a Great officer's burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a parent's corpse has been coffined, a son must go to condole for a
    distant cousin whose mourning rank would require three months, but he does not
    go for a non-relative neighbour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At mourning for an acquaintance, the mourner must visit all his brethren with
    condolence even if they did not live with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The coffin of the son of Heaven is described as fourfold, including overlapping
    water-buffalo and rhinoceros hides, wooden coffins, bands, wedges, and a cypress
    shell.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the son of Heaven wails for a feudal prince, he wears specified mourning
    attire and has no music at meals; an alternative saying states that he employs
    an officer to wail for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the son of Heaven is coffined, the coffin is surrounded by plastered
    boards, rests on a hearse with dragon-painted shafts, and is covered with a pall
    figured with axe-heads.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Only at mourning rites for the son of Heaven are feudal princes arranged for
    wailing according to their different surnames.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Duke Ai of Lu eulogised Khung Khâu, identified in the note as Confucius, with
    words of lament over the loss of assistance and rule.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a state lost a large territory with cities, ministers and officers wailed
    in the grand ancestral temple for three days in mourning caps, and the ruler's
    meals and music were restricted; an alternate saying places the ruler's wailing
    at the altar to the spirit of the land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius disliked those who wailed in open fields.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A son who had not been in office should not give away family property unless
    acting under the order of his father or elder brother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the officers have entered, the mourners perform leaping morning and
    evening; after the twenty-fourth month service a plain white cap is assumed, mourning
    is left off, and music may resume after another month.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A ruler may confer a small curtain to serve as a pall for an officer's father's
    coffin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At funerals for a ruler's underage eldest sons, small carriages carrying flesh
    of sacrifice are used in different numbers according to the son's maternal status;
    the same single-carriage rule applies to the eldest rightful son of a Great officer
    in the stated circumstance.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: At mourning rites for a feudal lord, chief officers appointed directly by
    him carried staffs.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: When a Great officer of a state was about to be buried, the ruler went to
    condole with his son in the hall where the coffin was.
  category: action
  evidence_refs:
  - ev:12
