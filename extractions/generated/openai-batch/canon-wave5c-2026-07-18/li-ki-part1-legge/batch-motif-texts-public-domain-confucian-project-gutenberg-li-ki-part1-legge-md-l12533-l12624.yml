canonical_text:
  quote: ''
  summary: 'The passage prescribes rites and governmental actions for the first month
    of autumn: the Grand recorder announces the inauguration of autumn, the Son of
    Heaven prepares himself and leads court officials to meet autumn in the western
    suburb, rewards military officers, orders selection and discipline of soldiers,
    revises laws and prisons, inspects injuries and legal cases, tastes new grain
    with an ancestral offering, orders storage and repairs against floods, forbids
    major political appointments or territorial actions, and warns that using winter,
    spring, or summer procedures in this month would produce disorder, crop damage,
    drought, fire, illness, or war.'
  language: English
  quote_policy: summarized
