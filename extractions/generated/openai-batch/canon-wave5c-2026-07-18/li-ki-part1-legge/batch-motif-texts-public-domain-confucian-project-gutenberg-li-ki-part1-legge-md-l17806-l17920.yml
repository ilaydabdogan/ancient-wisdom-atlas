canonical_text:
  quote: Let no one lightly discuss the subject of rites!
  summary: Confucius describes increasing levels of fitness for sacrificial rites
    and warns against treating rites lightly. A following account contrasts exhausting,
    poorly ordered sacrifices in the House of Ai with 3ze-li's better-managed ceremonies,
    which Confucius praises. The next section begins a discussion of border sacrifices,
    single and triple victims, the son of Heaven's ritual feasting, and the avoidance
    of pregnant animals in eating or sacrifice to God.
  language: English translation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Confucius lists a progression from reciting the three hundred odes to competence
    in several sacrificial rites, ending with sacrifice to God, and warns that rites
    should not be discussed lightly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translator's note states that the progression of thought among the sacrificial
    services is difficult to trace and that the meaning of the great sacrifice to
    the hills is uncertain.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: When 3ze-li was steward to the House of Ai, its chief had previously begun
    sacrifices before daylight and continued them by torchlight when daylight was
    insufficient.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Participants in the earlier sacrifices became worn out and tired, and officers
    limped and leaned while performing their parts, producing a great want of reverence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Under 3ze-li's direction, parties communicated across the chamber door for
    chamber services and at the steps for hall services.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Under 3ze-li's arrangement, services began at daylight and were ready to end
    by the evening audience; Confucius said that 3ze-li understood ceremonies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the border sacrifices a single victim was used, while the altars to the
    spirits of land and grain had three victims.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the son of Heaven inspected the princes, the feast viands for him consisted
    of a single calf; when the princes visited him, he received them with rites involving
    three regular animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The single-calf feasting of the son of Heaven is said to honor sincerity.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: If an animal was pregnant, the son of Heaven did not eat it and did not use
    it as a victim in sacrifice to God.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The note says that the paucity of sacrificial articles expressed degree of
    honour and mentions border sacrifices associated with winter solstice, grain,
    seasons, rain, and thanksgiving.
  category: other
  evidence_refs:
  - ev:6
