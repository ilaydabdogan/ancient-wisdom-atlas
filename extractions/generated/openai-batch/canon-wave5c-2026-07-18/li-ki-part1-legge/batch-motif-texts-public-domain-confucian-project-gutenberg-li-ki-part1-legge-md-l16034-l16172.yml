canonical_text:
  quote: ''
  summary: 'The passage describes ancestral sacrificial ceremonies: invocations, offerings
    of water, blood, flesh, vessels, robes, cooked foods, and liquors; the ruler and
    wife alternate in presenting offerings to please departed souls and unite the
    living with the unseen. It states that ceremonies bring down ancestral spirits,
    order human relations, and secure Heaven''s blessing. It also records Confucius
    criticizing improper border sacrifices and changes in ritual practice, and condemns
    concealment of ritual words as keeping a state in darkness.'
  language: English
  quote_policy: summarized
