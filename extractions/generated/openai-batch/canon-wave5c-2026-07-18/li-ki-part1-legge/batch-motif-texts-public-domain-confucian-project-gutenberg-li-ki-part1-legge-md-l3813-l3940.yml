canonical_text:
  quote: ''
  summary: The passage gives rules of propriety for official messages and gifts, conduct
    of ministers and messengers, qualities of the superior man, ancestral personation
    at sacrifices, fasting before sacrifice, limits and duties in mourning for a father,
    and etiquette for condolence, illness inquiries, hospitality, and giving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Friendly messages may be accompanied by objects such as a sword, bow, rush
    matting, grass mats, and round or square baskets; the messenger has these items
    carried when receiving the commission.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person charged with a mission by his ruler should leave after receiving
    the ruler's orders and should not remain overnight in his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A minister receiving a ruler's message bows to the bearer and escorts him
    outside the gate; a minister sending a message to his ruler wears court robes
    and receives the ruler's commands on returning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The superior man is described as extensively informed, retentive in memory,
    modest, earnest in doing good, and not weary in doing good.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The superior man does not accept every expression of joy or devotion offered
    by another, in order to preserve friendly intercourse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A grandson may personate his deceased grandfather at sacrifices, but a son
    cannot personate his father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A great officer, other officer, or ruler who sees the personator of the dead
    on the way to the ancestral temple should dismount; the personator bows forward
    and uses a stool when mounting the carriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One fasting in preparation for a sacrifice should not listen to music or condole
    with mourners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A son mourning for his father should not reduce himself until his bones appear
    or impair his senses, and should avoid the steps and path associated with his
    father.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: During mourning, illness and bodily sores should be treated; if illness requires
    spirits and flesh, the mourner may use them and then return to abstinence when
    better.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Condolence and expressions of grief are distinguished according to whether
    one knew the living mourner, the dead person, or both.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Those unable to assist with gifts, medical aid, lodging, or giving should
    avoid intrusive questions or commands that burden the recipient.
  category: speech
  evidence_refs:
  - ev:9
