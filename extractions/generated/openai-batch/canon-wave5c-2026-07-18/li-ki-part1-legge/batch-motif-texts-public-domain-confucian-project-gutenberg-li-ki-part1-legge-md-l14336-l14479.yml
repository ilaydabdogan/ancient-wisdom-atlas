canonical_text:
  quote: ''
  summary: In a dialogue between 3ang-3ze and Confucius, rules are given for when
    court audiences and sacrifices should be discontinued, hurried, resumed, or curtailed
    because of events such as royal death, funeral or mourning rites, ancestral temple
    fire, solar eclipse, rain-damaged robes, coffining and burial stages, and mourning
    obligations of different durations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is presented mainly as questions by 3ang-3ze and answers by Confucius
    about cases in which rites cannot be completed.
  category: speech
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:7
  - ev:8
- id: obs:2
  text: 'For princes assembled to appear before the son of Heaven, four events discontinue
    the audience rites: the grand ancestral temple taking fire, an eclipse of the
    sun, funeral rites of the queen, and robes made unsightly by soaking rain.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a solar eclipse occurs while the princes are present, they follow the son
    of Heaven to save it, each dressed in the color of his quarter and carrying the
    weapon proper to it.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A footnote explains that an eclipse suggested the idea of an enemy or adverse
    influence devouring the sun’s disk.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the grand ancestral temple takes fire, the princes follow the son of Heaven
    to extinguish it, but without the eclipse robes and weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'For princes visiting one another, six events discontinue the audience rites:
    death of the son of Heaven, the grand ancestral temple taking fire, an eclipse
    of the sun, funeral rites of the queen or princess of the state, and robes made
    unsightly by soaking rain.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At sacrifices of the son of Heaven, death of the son of Heaven or mourning
    rites for the queen stop the sacrifice; an eclipse or ancestral temple fire causes
    the steps to be hurried; if the victim has arrived but has not yet been slain,
    the sacrifice is discontinued.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the son of Heaven has died and before he is coffined, sacrifices of
    the house are not offered; after coffining they resume in curtailed form; from
    coffin removal through burial return and wailing they cease again; after burial
    they are offered but stop after the officer of prayer finishes the cup.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At feudal princes’ sacrifices to the spirits of land and grain, news of royal
    or local death or mourning rites causes the sacrifice to be discontinued, following
    the example set by the son of Heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: For a Great officer’s sacrifice, nine events cause abandonment of the sacrifice,
    including royal or state deaths and funerals, the ruler’s ancestral temple taking
    fire, an eclipse of the sun, and calls to mourning of three years, one year, or
    nine months.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In curtailed sacrificial procedures, the representative of the dead may take
    only three mouthfuls and may receive a cup without making the usual reciprocal
    presentation.
  category: action
  evidence_refs:
  - ev:6
  - ev:8
