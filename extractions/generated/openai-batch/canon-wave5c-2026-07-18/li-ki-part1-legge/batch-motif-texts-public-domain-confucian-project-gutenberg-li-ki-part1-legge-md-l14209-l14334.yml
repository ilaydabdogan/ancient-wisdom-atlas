canonical_text:
  quote: ''
  summary: Confucius explains rules for carrying ancestral tablets and ritual offerings
    during royal inspections, expeditions, deaths, exile, and united sacrifices. He
    describes how a ruler seeks ancestral authorization before an expedition through
    announcements and offerings at ancestral shrines. A later exchange addresses whether
    one should mourn a foster-mother; Confucius says this was not the ancient rule,
    but recounts a duke whose modified mourning became the origin of that practice.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says the son of Heaven took a tablet on tours of inspection in the
    carriage of Reverence, and that taking the tablets of all seven temple-shrines
    on an expedition is an error.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage states that royal and princely ancestral shrines should not be
    left empty except in specified situations: death of the ruler, a ruler leaving
    the state, or a united sacrifice at the high ancestor''s shrine-temple.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: According to the statement attributed to Lao Tan, on the death of the son
    of Heaven or a prince, the officer of prayer removes tablets from the other shrines
    to the high ancestor's shrine and restores them after the wailing and placement
    of the deceased ruler's tablet are complete.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a ruler abandoned his state, the Grand minister was to take the tablets
    from the shrines and follow him; at the united sacrifice, the officer of prayer
    received tablets from four shrines, and people were required to keep out of the
    way when tablets were moved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 3ang-3ze asks what was chiefly considered when expeditions were made without
    carrying displaced tablets; Confucius answers that the instructions from the tablet
    were the chief consideration.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before going forth, the son of Heaven or prince announced the purpose at the
    shrines of grandfather and father with gifts of silk, skins, and jade-tokens,
    then carried those gifts on the march in the carriage of Reverence and placed
    food offerings by them at each stage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On returning, the ruler made announcement at the same shrines, set out offerings,
    collected the silk and jade, buried them between the steps leading to the fane
    of the high ancestor, and then left the temple.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 3ze-yii asks whether mourning for a foster-mother follows the rule for mourning
    a mother; Confucius answers that it is not the rule, explaining that the foster-mother
    and master were persons employed by the ruler to teach his son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage recounts that duke Kao of Li lost his mother when young, had a
    good foster-mother, wished to mourn her, was warned by the proper officer that
    such mourning contradicted ancient rule, and nevertheless mourned in a modified
    garment and cap.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note explains that the foster-mother was not a nurse but a lady of the harem
    entrusted with care of an orphan boy, and that Confucius' reasoning assumes mourning
    should be for consanguinity or affinity.
  category: attribute
  evidence_refs:
  - ev:8
