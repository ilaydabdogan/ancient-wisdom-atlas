literal_observations:
- id: obs:1
  text: The ruler over all under the sky is called the Son of Heaven; when receiving
    feudal princes and issuing governmental assignments, he styles himself as the
    one man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the king ascends by the eastern steps and presides at a sacrifice, different
    self-designations are used according to whether the rite is personal to his family
    or external to himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When visiting feudal princes, announcement is made to spirits of their hills
    and streams that the visitor is king by the grace of Heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the king's death, prescribed announcements say that the king by the grace
    of Heaven has fallen, call his spirit to return, and state publicly that he has
    gone far on high.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the deceased king receives his place in the ancestral temple, his spirit-tablet
    is set up and styled as the god.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The note explains the spirit-tablet as a rectangular wooden resting-place
    for the spirit during temple services and says the deceased king was treated as
    a heavenly spirit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Son of Heaven, while still in mourning, calls himself the little child,
    and this designation continues if he dies during that period.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Son of Heaven has a queen, helpmates, women of family, and ladies of honour,
    described as his wife and concubines.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Son of Heaven appoints officers of Heaven's institution, including six
    grandees who guard and superintend six departments of statutes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Administrative officers, treasuries, and manufactures are organized under
    named superintendents and workers who preside over their respective charges or
    stores.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the five officers give their contributions, the act is described as presenting
    offerings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Messages and designations for high officials vary according to their relation
