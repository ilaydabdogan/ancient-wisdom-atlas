  quote: ''
  summary: The passage describes formal designations of the Son of Heaven in rulership,
    sacrifice, royal visits, death, mourning, and ancestral-temple installation. It
    then lists royal consorts, major officers, administrative departments, manufactures,
    offerings, and official styles used in relation to the Son of Heaven and feudal
    princes.
  language: English
