  summary: The passage gives ritual and etiquette rules concerning marriage accompaniment,
    naming and self-designation, attendance before rulers and superior men, preservation
    or change of old-state customs, mourning and sacrifice practice, speech taboos,
    controlled handling of written tablets and divination objects before a ruler,
    restrictions at the ruler's gate, and a fragmentary rule beginning with building
    and the ancestral temple.
  language: English
