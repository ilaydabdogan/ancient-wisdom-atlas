- id: obs:3
  text: Sons of Great officers or other officers are forbidden to use certain self-designations
    reserved for higher or different heir-sons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An officer unable to take a place at an archery meeting when requested by
    his ruler is to decline on grounds of illness using a formula about suffering
    from carrying firewood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When attending on a superior man, answering a question without looking around
    to see whether another will answer is described as contrary to rule.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A superior man practicing ceremonies in another state should not seek to change
    his old customs, including sacrifice ceremonies, mourning dress, and positions
    in wailing and weeping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After three generations away from a state, continued recognition at court
    and continued family ties require sending word back to the representative of the
    ancestor; if those ties no longer remain, the person follows the new state's ways
    only on the day of elevation to office.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A superior man left an orphan is not to change his name, and if he suddenly
    becomes noble he is not to frame an honorary title for his father.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before a parent's interment, a mourning son studies mourning ceremonies; after
    interment, sacrifice ceremonies; after mourning ends, music.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage forbids speaking of music during mourning, inauspicious matters
    during sacrifice, and wives and daughters in the ruler's court.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dusting or adjusting written tablets before the ruler, or having divining
