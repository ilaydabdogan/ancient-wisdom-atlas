  text: When a feudal prince marries, two other states of the bride's surname each
    send a daughter of their ruling house to accompany the bride; the passage also
    states that the bride is accompanied by a niece and younger sister into the harem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An officer is instructed not to call by name the steward of his family or
    his principal concubine.
  category: speech
  evidence_refs:
