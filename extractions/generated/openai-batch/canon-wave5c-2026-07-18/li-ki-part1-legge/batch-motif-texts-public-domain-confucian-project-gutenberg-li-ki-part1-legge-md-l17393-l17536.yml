  summary: The passage discusses the scale, order, and unity of ceremonial rules;
    the superior man's reverent and sincere practice of them; variations in dynastic
    ritual usages; personators of the dead in sacrifices; offerings in ranked sacrifices;
    formal courtesies before meetings; preliminary services before major sacrifices;
    and preparatory care through keeping victims, abstinence, and vigil.
  language: English translation
