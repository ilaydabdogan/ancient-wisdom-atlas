  quote: ''
  summary: A prescriptive ritual passage discusses loyalty and audience protocol,
    ranked privileges of the son of Heaven, princes, Great officers, and ministers,
    unlawful ritual usurpations, rules for dynastic descendants and refugee rulers,
    spatial orientation between ruler and ministers, gift protocol, Confucius' conduct
    during a pestilence-expulsion rite, and a saying on archery performed to music.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A minister used his own prince's token of rank as credentials and did not
    seek a private audience in another prince's court.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a minister of a prince had no intercourse outside
    his own state and did not dare to serve two rulers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that it was contrary to propriety for a Great officer to
    receive his ruler to an entertainment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that putting to death a Great officer who had violently
    exercised power was held to be an act of righteousness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The son of Heaven did not observe visitor or guest rules, because no one could
    presume to be his host.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a ruler visited a minister, the ruler used the master's steps, and the
    minister did not presume to regard the house as his own.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Princes are said to have usurped several kingly usages, including four rows
    of drums and bells, a white bull in sacrifice, sonorous jade, dance implements
    and dress, and the grand chariot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Great officers are said to have usurped high-status usages including a towered
    gateway, screen, cup stand, and embroidered vermilion garment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage links weak royal authority and strong Great officers with ceremonial
    disorder, mutual honoring, interviews, offerings, and bribery among officers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage says it was not lawful for princes or Great officers to sacrifice
    to rulers from whom they derived ancestry, and that private family temples to
    such rulers were contrary to propriety.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The son of Heaven preserved descendants of the sovereigns of the two previous
    dynasties while honoring the worth of their founders, but this honoring did not
    extend beyond two dynasties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Princes did not employ refugee rulers as ministers, and ancient refugee rulers
    left no son continuing their title.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A ruler stood facing south, while ministers stood facing north in response.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: A Great officer presenting something to his ruler did not do so in person,
    and when receiving a gift from the ruler did not go to bow in acknowledgment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: When villagers drove away pestilential influences, Confucius stood at the
    top of his eastern steps in court robes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Confucius' stated purpose in standing at the eastern steps was to keep the
