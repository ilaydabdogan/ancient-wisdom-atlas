canonical_text:
  quote: ''
  summary: The passage introduces the Shin f, a joined upper-and-lower garment worn
    at home by all classes, discusses its names and moralized explanations, and then
    introduces Thau H4, a game of pitching darts into a jar at festal entertainments,
    described as a small form of archery that could also be read as instructive for
    virtue and character. It also notes textual and comparative issues concerning
    illustrations, vessel forms, archery-contest parallels, and later appended material.
  language: English
  quote_policy: summarized
