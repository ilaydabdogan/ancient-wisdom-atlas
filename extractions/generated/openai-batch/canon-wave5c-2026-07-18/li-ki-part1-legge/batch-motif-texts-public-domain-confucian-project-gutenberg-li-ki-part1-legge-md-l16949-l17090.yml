canonical_text:
  quote: ''
  summary: The passage first describes auspicious creatures appearing in ordered places
    as the result of ancient kings shaping ritual usages according to rightness and
    truthfulness, producing universal harmony. It then opens Book VIII, stating that
    rules of propriety form character, remove perversity, and harmonize human and
    spirit relations. It explains that rites require both inner sincerity and outward
    form; ritual materials should match season, land, spirits, and human minds; ceremonial
    expense should match state resources and harvest conditions; and rites or great
    political acts should be judged by time, natural duties, material offerings, appropriateness,
    and proportion.
  language: English
  quote_policy: summarized
