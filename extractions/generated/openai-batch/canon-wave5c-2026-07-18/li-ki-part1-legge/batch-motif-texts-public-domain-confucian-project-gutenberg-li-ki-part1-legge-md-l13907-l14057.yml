canonical_text:
  quote: ''
  summary: The passage gives answers attributed to Confucius in response to questions
    from 3ang-3ze about rites of capping, mourning, sacrifice, contributions to offerings,
    participation in sacrifices, and marriage arrangements interrupted by parental
    death. It describes a son capped after his father's death, rules for mourning
    sacrifice and cup circulation, ranked contributions to offerings for the dead,
    limits on assisting others during or after mourning, and procedures for postponing
    or releasing a marriage engagement when a parent dies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son capped after his father's death sweeps the ground, sacrifices at his
    father's shrine, presents himself before his uncles, and offers courtesies to
    the investors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the close of one year's mourning, the principal sacrifices in an inner
    garment of soft silk; the cup is set beside the guests but is not taken up or
    circulated for drinking all around.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duke Kao of Lu and duke Hao are cited as examples of actions concerning the
    cup at mourning sacrifices that were against the rule.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius says that in cases from three years' mourning downward, the principal
    may take part in contributing to offerings for the dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Contributions to offerings are arranged according to the status of the deceased
    and the mourning relationship, including wearers of sackcloth with jagged edges,
    sackcloth with even edges, associates, friends, and wider mourners if needed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Participation in mourning sacrifices is also arranged according to the status
    of the deceased and mourning garments, with additional brethren added when participants
    for another officer are insufficient.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A person wearing three months' mourning has no occasion to sacrifice in his
    own ancestral temple and is not to assist another man outside his own line.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After putting off sackcloth, taking part in offerings to another's dead is
    said to be contrary to the rule, though assisting with receiving visitors may
    be possible.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: When marriage presents have been received and a fortunate day fixed, the death
    of a parent on either side leads to condolence messages, possible release from
    the engagement through the oldest uncle, and postponement of the marriage until
    after mourning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the marriage case, the messenger names the father, mother, or, if both
    parents are dead, the oldest uncle and his wife as the sending authorities.
  category: relationship
  evidence_refs:
  - ev:8
