- id: obs:1
  text: The sovereign orders the chief minister to send lessons of virtue down to
    the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sons rise at the first crowing of the cock, wash, rinse, comb and bind their
    hair, put on formal clothing, and attach practical implements to their girdles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sons carry items including a duster, handkerchief, knife, whetstone, spikes,
    fire-making instruments, writing-instrument tube, knife-case, archer’s thimble,
    and armlet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wives serve parents-in-law as they served their own parents and perform morning
    washing, hair arrangement, dressing, and attachment of implements and sewing materials.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dressed sons and wives go to parents or parents-in-law, ask about their comfort
    and health, assist their movement, bring washing water and towels, ask what they
    want, and bring food and drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The food and drink listed for parents include gruel, spirits or must, soup
    with vegetables, beans, grains, dates, chestnuts, sugar, honey, leaves, rice-water,
    fat, and oil.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Youths not yet capped and maidens not yet wearing the hair-pin wash, dress
    their hair in a horn shape, wear necklaces and perfume bags, and at daybreak ask
    their parents what they will eat and drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the parents have already eaten, the youths and maidens retire; if not,
    they remain to assist elder siblings and inspect what has been prepared.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those charged with inner and outer household areas wash, gather bedding, sprinkle
    and sweep the apartments, hall, and courtyard, and spread mats, each doing assigned
    work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Children go to bed earlier, get up later as they please, and have no fixed
    meal time.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: After sons receive official appointment, they and their father occupy different
    parts of the residence, while the son visits at dawn and sundown and attends to
    separate duties during the day.
  category: sequence
  evidence_refs:
  - ev:8
