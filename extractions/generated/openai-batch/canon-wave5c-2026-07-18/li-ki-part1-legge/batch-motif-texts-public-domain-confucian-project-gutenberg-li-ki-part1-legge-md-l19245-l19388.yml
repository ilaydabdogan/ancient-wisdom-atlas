canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive household rules: the ruler disseminates
    lessons of virtue; sons, wives, youths, maidens, household attendants, and officially
    appointed sons perform ordered morning washing, dressing, service, food presentation,
    cleaning, and respectful visits to parents or parents-in-law.'
  language: English
  quote_policy: summarized
