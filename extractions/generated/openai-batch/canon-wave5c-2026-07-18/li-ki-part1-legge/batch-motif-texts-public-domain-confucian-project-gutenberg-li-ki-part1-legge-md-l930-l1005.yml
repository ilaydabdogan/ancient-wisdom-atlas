canonical_text:
  quote: ''
  summary: The passage introduces the Wang Xih, or Royal Regulations, as a Han-era
    compilation attributed to Great Scholars under Emperor Wan. It describes the book's
    claimed concern with ancient royal regulations, sacrifices, investiture, offices,
    and care for the aged; summarizes later editorial judgments about its textual
    sources and Han institutional framing; and notes its value for evidence of early
    schools and education in China.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lit Kih is cited as saying that the Wang Xih, or Royal Regulations, was made
    by Great Scholars in the time of Emperor Wan at the sovereign's request.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The book is said to profess to give early kings' regulations concerning classes
    of feudal nobles and officers, their emoluments, sacrifices, and care for the
    aged.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The emperor ordered the compilation after the death of Xia, described as a
    Great scholar highly esteemed by the sovereign.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The book was said to have originally contained material on royal progresses,
    altars, and ceremonies of investiture, but the passage states that no trace of
    these now remains.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Parts of the book are described as taken from Mencius, the Shi, and the Kung-yang
    and Zo commentaries on the Khun Kiu, while other parts are said to be difficult
    to reconcile with those authorities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Khien-lung editors judge that the text reflects the appearance of the
    I Li but not the Kau Li, and that many subjects are based on Mencius.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage explains the absence of discussion of the peculiar position of
    the son of Heaven by reference to the Han dynasty practice of distinguishing the
    emperor from feudal princes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that only the Grand ministers of Instruction, War, and Works
    are mentioned in reports on income and expenditure because these corresponded
    to the three ducal ministers of the Han dynasty.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The absence of altars and investitures is attributed to Emperor Wan's disregard
    of Hsin-yüan Phing's advice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The book is said to have been received into the Li Ki because it was made
    at no great distance from antiquity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator says the book is especially interesting for information about
    the existence of schools in the earliest times and about rudimentary education
    developing into the later examination system.
  category: sequence
  evidence_refs:
  - ev:9
