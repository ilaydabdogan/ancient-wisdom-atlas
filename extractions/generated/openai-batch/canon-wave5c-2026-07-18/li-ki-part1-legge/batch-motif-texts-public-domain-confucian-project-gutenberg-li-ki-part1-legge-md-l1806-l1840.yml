  summary: The passage is an editorial introduction to Book XXIII, King Xieh/King
    Kieh. It reviews proposed translations of the title, reports Hwang Khan's explanation
    that the title concerns separation or division among subjects of the Classics,
    rejects Confucian authorship of the opening paragraphs, discusses the later enumeration
    of six Classics, questions the existence of a Classic of Music, and states that
    the compiler is unknown.
