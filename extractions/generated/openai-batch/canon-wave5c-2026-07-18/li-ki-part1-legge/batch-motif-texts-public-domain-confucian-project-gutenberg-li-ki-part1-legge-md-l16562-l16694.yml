  summary: The passage explains how sages and ancient kings grounded rules, ceremonies,
    administration, timekeeping, and sacrifice in Heaven and Earth, the two forces,
    seasons, celestial bodies, spirits, elements, moral rules, human feelings, and
    four intelligent creatures. It names the Qi-lin, phoenix, tortoise, and dragon,
    describes ritual use of divination and sacrifice, and places the king at the center
    of ritual specialists and officials.
