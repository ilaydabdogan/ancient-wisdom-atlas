canonical_text:
  quote: ''
  summary: 'The passage and notes describe an idealized territorial and administrative
    order: the royal domain of the son of Heaven, the number and size of states, unassigned
    famous hills and great meres, provincial groupings beyond the royal domain, ranked
    offices, inspectors, allowances and inheritances, and a dragon distinction permitted
    to certain ducal ministers. Translator notes discuss the expression “the four
    seas,” communal access to hills and waters, parallels to other offices, and possible
    later origins of the Three Inspectors.'
