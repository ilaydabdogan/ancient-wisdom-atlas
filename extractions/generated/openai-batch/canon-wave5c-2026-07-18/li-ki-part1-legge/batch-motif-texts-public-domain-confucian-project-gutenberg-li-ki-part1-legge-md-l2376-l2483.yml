canonical_text:
  quote: ''
  summary: The passage introduces Book XXXVIII as an account of the conduct of scholars,
    framed as a discourse by Confucius to Duke Ai of Lu, and reports later doubts
    about its authenticity. It then introduces the Ta Hsio, discussing its place among
    the Four Books, its editorial transmission, its Confucian teaching on self-cultivation
    and government, and proposed authorship by Khung Ki as a companion to the Kung
    Yung.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Conduct of the Scholar is described as professing to be a discourse delivered
    to Duke Ai of Lu about the character and style of life expected of scholars.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says scholars were a recognized class in ancient China and had
    peculiarities of dress, with some alluded to in the Odes of the Shih.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duke Ai is described as not having thought highly of scholars and as asking
    Confucius whether he wore the garb of a scholar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Confucius is described as disclaiming the scholar’s garb and then speaking
    at length about the conduct of the scholar.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The scholar portrayed in the discourse is described as fearless, blameless,
    strong in principle, cultivated in intelligence, and generous, patriotic, and
    benevolent in spirit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The conclusion of the book is said to report a good and great effect on Duke
    Ai, making him a better man and making him think more highly of scholars.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage reports a general Chinese scholarly opinion that the conversation
    between Duke Ai and Confucius did not really occur.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Later commentators are described as approving the sentiments or maxims while
    questioning attribution to Confucius on stylistic or doctrinal grounds.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Ta Hsio is described as long published separately from the other books
    of the Li Ki and as the first of the Four Books.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The translation is said to follow the arrangement of the text given by the
