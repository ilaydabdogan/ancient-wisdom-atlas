canonical_text:
  quote: ''
  summary: A ritual calendar passage describes the Son of Heaven’s winter-associated
    residence, dark regalia, food, and vessels; the formal inauguration of winter;
    divination using blood-smeared tortoise-shells and stalks; winter closure and
    storage measures; regulations for mourning, graves, and crafted objects; communal
    drinking; and prayers and sacrifices for the coming year to heavenly, territorial,
    ancestral, and household recipients.
