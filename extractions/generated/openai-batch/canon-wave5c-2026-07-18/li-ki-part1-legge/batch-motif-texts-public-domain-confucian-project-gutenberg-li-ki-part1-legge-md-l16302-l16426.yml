literal_observations:
- id: obs:1
  text: A note attributed to M. Callery says Chinese philosophers draw analogies between
    social inequalities or laws and natural features such as mountains, valleys, rivers,
    forests, and temples.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Xhien-lung editors describe Heaven as everywhere and its ordinations as
    distributed everywhere.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Xhien-lung editors state that Earth receives Heaven's influences and supports
    all things.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Xhien-lung editors say ancestral temples, hills and streams, and five
    household altars are located on Earth but rooted in Heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sage forms a ternion with Heaven and Earth and stands side by side with
    spiritual beings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sage devises ordered ceremonies for the successful government of the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Heaven produces the seasons, and Earth produces sources of wealth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Man is begotten by his father and instructed by his teacher.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ruler correctly uses four agencies and thereby stands in a place where
    there is no error.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Men look to the ruler's brightness, support him, and serve him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the ruler should not seek to brighten, nourish, or serve
    men, because doing so would lead to error, incapacity, or loss of position.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Universal application of the rules of propriety fixes the lot and duty of
    different classes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The ruler uses the wisdom, courage, and benevolence of others while putting
    away cunning, passion, and covetousness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: When calamity comes on a state, the ruler's dying for its altars is described
