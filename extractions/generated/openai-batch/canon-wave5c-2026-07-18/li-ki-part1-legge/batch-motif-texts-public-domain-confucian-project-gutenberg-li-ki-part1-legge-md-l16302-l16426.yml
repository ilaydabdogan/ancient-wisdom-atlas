  summary: The passage presents ritual-political teaching about the sage or ruler
    ordering government in relation to Heaven, Earth, spiritual beings, ceremonies,
    human feelings, and proper social duties. Translator/editor notes explain cosmological
    analogies in which Heaven's ordination is distributed through Earth, ancestors,
    hills and streams, and household rites.
