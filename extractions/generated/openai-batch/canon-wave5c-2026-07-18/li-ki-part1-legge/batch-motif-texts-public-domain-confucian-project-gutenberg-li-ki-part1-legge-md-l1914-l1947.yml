  quote: ''
  summary: The passage introduces Book XXVI, explaining that its title presents Confucius
    as Khung-3ze, at home and at leisure. It summarizes a conversation in which one
    disciple is present and the Master discourses on a sovereign as parent of the
    people and on the virtue of the founders of Hsia, Shang, and Kau, with quotations
    from the Book of Poetry. It also records editorial doubts about the speeches'
    authenticity and suggests, on internal analogies, that this Book and the preceding
    one may have had the same unknown writer.
