canonical_text:
  quote: ''
  summary: An appendix introduces W. H. Medhurst’s account of Chinese mourning dress,
    kinship categories, and ritual tables. The passage explains distinctions between
    male-line kin and affinal or maternal kin, describes marriage incorporation of
    women into another stock, and outlines mourning habits and tables used to classify
    relationships and prohibited marriage degrees.
  language: English
  quote_policy: summarized
