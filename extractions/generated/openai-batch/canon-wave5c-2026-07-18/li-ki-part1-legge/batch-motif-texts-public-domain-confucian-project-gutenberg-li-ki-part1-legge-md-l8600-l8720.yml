  text: The appendix is introduced because the Than Kung contains many references
    to mourning degrees and mourning dress.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Chinese kinship ideas divide relationships into two classes
    named Néi kin and Wai yin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Néi kin is described as common-stock kindred through the male line, while
    Wai yin includes mother’s kin, wife’s kin, and daughter’s kin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states a principle that a woman leaves her own kin on marriage
    and becomes part of the stock into which she is grafted.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The indication of prohibited marriage degrees is said to depend on a genealogical
