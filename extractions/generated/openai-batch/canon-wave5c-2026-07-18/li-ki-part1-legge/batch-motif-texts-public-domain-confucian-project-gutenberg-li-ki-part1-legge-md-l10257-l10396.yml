canonical_text:
  quote: ''
  summary: The passage classifies peoples of five regions by customs, dwellings, food,
    and language, names officers for communication across languages, describes measured
    settlement and the institution of schools, and outlines the minister of Instruction's
    moral, ceremonial, disciplinary, and educational functions, including treatment
    of disobedient persons and promotion of promising scholars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the people of five regions had distinct natures that
    could not be made to alter, and it lists different bodily customs, clothing, dwellings,
    and food practices for eastern, southern, western, and northern groups.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of the Middle states, Man, Zung, and Ti are described as having
    their own dwellings, preferred flavours, suitable clothes, implements, and vessels.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The languages of the five regions are said not to be mutually intelligible,
    and officers with different names are assigned to communicate people's thoughts,
    likings, and desires.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In settling the people, ground is measured for towns and then into smaller
    allotments so that no ground is unoccupied and no people are left wandering idle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After settlement and seasonal food arrangements, the people are described
    as resting in their dwellings, doing their work joyfully, urging one another to
    labour, honouring rulers, loving superiors, and then receiving schools.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The minister of Instruction is described as setting forth ceremonial observances,
    moral lessons, governmental uniformity, shared duty and virtue, care for the aged,
    pity for orphans and solitaries, honour for talented and worthy men, and summary
    treatment of the unworthy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Disobedient persons are to be reported, examined in connection with assemblies
    at school, archery practice, and feasting; if they do not change, they are progressively
    removed to other districts and territories, and finally cast out to a remote region
    and excluded from distinction for life.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Promising youths have their names sent to the minister of Instruction, are
    called select scholars, may be promoted to the great college as eminent scholars,
    and are exempted from certain services.
  category: sequence
  evidence_refs:
  - ev:7
