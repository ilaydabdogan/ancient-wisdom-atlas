canonical_text:
  quote: ''
  summary: A ritual dialogue in which 3ang-3ze asks Confucius about funeral precedence,
    ancestral sacrifices by sons of different maternal and social status, vicarious
    sacrifice for an absent eldest son, sacrifice at a grave altar, the representative
    of the dead, and offerings of satisfaction in dark and brighter places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In an initial case whose question is partly outside the extract, Confucius
    says the person should complete the current undertaking and return home after
    the coffin has been let down, without waiting for the ruler's son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a person occupied with a parent's funeral hears of the ruler's death
    after the bier has been drawn toward the grave, Confucius says to complete the
    burial, change dress after the coffin is let down, and then go to the ruler's
    place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the eldest son by the proper wife is only an officer and a son by a secondary
    wife is a Great officer, Confucius says the latter sacrifices with victims appropriate
    to his higher rank in the eldest son's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In that sacrifice, the officer of prayer gives a formula naming the filial
    son and presenting the offering on behalf of the attendant son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the eldest son and family head is in another state under a charge of
    guilt, the son by a secondary wife may perform a vicarious service, with the prayer
    formula saying that the filial son employs the attendant son to perform the regular
    service for him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The vicarious service is described as deficient in several acts: full satisfaction
    of the deceased spirit, sending the cup round to all present, receiving the blessing,
    laying portions down as thank-offerings, and having the elder brother''s wife
    appear before the mother-in-law''s spirit-tablet.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the vicarious service, the cup is put down before the principal guests
    but not sent round, and portions of flesh are not sent to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the eldest son is in another state and a son by a secondary wife without
    rank remains at home, Confucius says the latter may sacrifice by rearing an altar
    in front of the family grave and sacrificing there at the different seasons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the oldest son dies, the event is announced at the grave, after which sacrifice
    is made in the house, while the sacrificer calls himself only by name and avoids
    the epithet 'filial.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that disciples of 3ze-yi regarded sacrifices by sons of
    inferior wives as accordant with right, while some contemporary practitioners
    are said to lack a truthful ground for their sacrifices.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: For sacrificing to a full-grown man who has received funeral rites, Confucius
    says there must be a representative of the dead, preferably a grandson; if the
    grandson is too young, someone carries him, and if there is no grandson, someone
    of the same surname is selected.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: For one who died prematurely, only satisfying offerings are made; sacrificing
    to a full-grown man without a representative would treat him as if he had died
    prematurely.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Confucius distinguishes an offering of satisfaction made in the dark chamber
    from one made in the brighter place.
  category: setting
  evidence_refs:
  - ev:6
