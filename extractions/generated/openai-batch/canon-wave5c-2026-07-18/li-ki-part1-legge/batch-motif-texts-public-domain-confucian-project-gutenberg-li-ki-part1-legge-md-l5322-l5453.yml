canonical_text:
  quote: ''
  summary: 'The passage records mourning and burial-related sayings and anecdotes:
    Confucius mourns a dead associate and discards pickle after hearing of the death;
    teachers state rules about wailing, coffining, grave goods, burial, music, and
    conduct near mourning; Confucius seeks to bury his mother with his father; successive
    dynasties are described as using different coffin forms and ritual colors; Duke
    Ma consults 3ang-3ze about mourning ceremonies; and an heir-son refuses to accuse
    or abandon his father despite danger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius wailed for 3ze-lf in his courtyard, bowed to people who came to
    condole, then had a messenger enter and asked about 3ze-lf's death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messenger said that 3ze-lf had been made into pickle, and Confucius ordered
    the pickle in the house to be thrown away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 3ang-3ze says that when the grass is old on a friend's grave, people no longer
    wail for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 3ze-sze says that on the third day of mourning, when the body is placed in
    the coffin, a son should be sincere and careful about everything placed with it;
    he says the same care should be used at interment in the third month.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 3ze-sze says that three years are the extreme limit of mourning, that a son
    does not forget parents who are out of sight, and that on the anniversary of a
    parent's death he does not listen to music.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confucius, left fatherless when young, did not know his father's grave; after
    coffining his mother's body in the street of Wa-fa, he learned the location by
    inquiry and buried her in the same grave with his father at Fang.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that when mourning rites are in the neighborhood one should
    not accompany the pestle with the voice, and when a body is shrouded and coffined
    in the village one should not sing in the lanes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that for a mourning cap, the ends of the ties should not
    hang down.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage assigns earthenware coffins or enclosures, brick enclosures, wooden
    outer and inner coffins, surrounding curtains, and feathery ornaments to different
    early rulers or dynasties, and applies different forms to children who died at
    different ages.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that Hsia preferred black, Yin preferred white, and Kau preferred
    red, and it links those colors to mourning times, war horses, and sacrificial
    victims.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Duke Ma of La asks 3ang-3ze what ceremonies to observe after his mother's
    death; 3ang-3ze answers that weeping, sackcloth forms, and mourning food extend
    from the son of Heaven to all, while coffin-covering materials differ between
    Wei and Li.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Duke Hsien of 3in intends to put his heir-son Shan-shang to death; A/ung-7
    advises Shan-shang to speak to the duke or go away, but Shan-shang refuses both
    courses and refers to the sacredness of a father being recognized in every state.
  category: sequence
  evidence_refs:
  - ev:9
