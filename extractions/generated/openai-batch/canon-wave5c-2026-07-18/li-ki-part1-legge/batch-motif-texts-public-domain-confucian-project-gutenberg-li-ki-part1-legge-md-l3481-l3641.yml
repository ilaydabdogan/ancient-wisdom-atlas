canonical_text:
  quote: ''
  summary: The passage gives prescriptive rules for congratulating a marriage, naming
    sons and daughters, capping and hair-pin rites, ordering dishes at an entertainment,
    making a food offering to the father of cookery, proper conduct while eating and
    drinking with hosts and elders, and handling gifts from elders or the ruler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person congratulating a friend on marriage sends a messenger with a present
    and a formal statement that the sender heard the recipient was having guests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Poor people are not expected to supply goods and wealth in fulfilling rules
    of propriety, and old people are not expected to display sinews and strength.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A son's name should not be the name of a state, day, month, hidden ailment,
    hill, or river, and sons and daughters should have their relative ages distinguished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A son is capped at twenty and receives an appellation; a daughter promised
    in marriage assumes the hair-pin and receives an appellation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'At an entertainment, foods and drinks are assigned specific positions: meat
    cooked on bones, sliced meat, rice, soup, minced and roasted meat, pickles, sauces,
    onions, drink, syrups, and dried spiced meat are arranged in prescribed places
    or orientations.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A lower-ranking guest takes up the rice, rises, and declines the honor; the
    host rises and refuses to let the guest withdraw, after which the guest resumes
    his seat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The host leads the guests in presenting an offering to the father of cookery,
    beginning with the dishes first brought in and proceeding through the other dishes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After eating three times, the host leads guests to take sliced meat and the
    other dishes; a guest should not rinse his mouth with spirits until the host has
    gone over all the dishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a youth attends an elder at a meal, he bows and eats if the host gives
    him food with his own hand; otherwise he eats without bowing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage forbids hasty satiety, rolling rice into a ball, bolting dishes,
    swilling soup or sauces, noisy eating, crunching bones, returning partly eaten
    fish, throwing bones to dogs, snatching food, spreading rice to cool, using chopsticks
    for millet, and other improper table behaviors.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: After eating, guests kneel and begin removing rice and sauces for attendants;
    the host rises and declines this service, and the guests resume their seats.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: When drinking with an elder, a youth rises, bows, goes to receive the cup
    at the spirit-vase, and waits to drink until the elder has emptied his cup.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: When an elder offers a gift, a youth or person of mean condition does not
    presume to decline it.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: When fruit is given by the ruler in his presence, the receiver places any
    kernel in his bosom.
  category: action
  evidence_refs:
  - ev:12
