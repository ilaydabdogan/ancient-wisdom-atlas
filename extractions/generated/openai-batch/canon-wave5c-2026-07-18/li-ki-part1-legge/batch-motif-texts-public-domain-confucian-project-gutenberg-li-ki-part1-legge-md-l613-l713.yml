canonical_text:
  quote: Always and in everything let there be reverence.
  summary: The passage is an introduction discussing how to translate the title Li
    Ki, especially the terms Li and Ki; it reviews Callery’s and Wylie’s renderings,
    explains Chinese character symbolism for Ki, evaluates the work’s value, rejects
    a caricature of Chinese ceremonialism by emphasizing reverence behind ceremony,
    and compares professed moral teaching with actual conduct in both China and elsewhere.
  language: English with embedded French and romanized Chinese terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Callery is quoted as saying he translated Li by the French word for rite as
    much as possible, while acknowledging many contextual meanings such as ceremonial,
    etiquette, politeness, social order, duties, morality, offerings, usages, and
    customs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person translator says he has made little use of the English word
    Rite or Rites and has used the title wording “Rules of Propriety or Ceremonial
    Usages.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Ki in Li Ki should have plural force because the component
    books or groups are separately complete and are many Ki.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes one Ki character as a symbol for recording things one
    by one and another related character as containing a classifying element meaning
    a packet of cocoons, with the compound denoting unwinding and arranging threads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wylie’s “Book of Rites” and Callery’s “Mémorial des Rites” are said not to
