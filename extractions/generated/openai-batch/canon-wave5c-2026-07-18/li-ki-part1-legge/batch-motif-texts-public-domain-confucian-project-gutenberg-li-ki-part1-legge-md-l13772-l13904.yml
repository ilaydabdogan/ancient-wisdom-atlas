canonical_text:
  quote: ''
  summary: Confucius gives ritual rules for princes departing to the Son of Heaven
    or visiting one another, including announcements, offerings, delegation of state
    business, and return observances. The passage then gives rules for simultaneous
    parental funerals, the role of an eldest son's wife in funeral rites, and capping
    ceremonies when mourning intervenes or when the Son of Heaven gives robes and
    cap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Princes going to the court of the Son of Heaven announce their departure before
    ancestral shrines and have announcements made to land, grain, hills, rivers, and
    road spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a prince departs, the business of the state is entrusted to five subordinate
    officers.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The departure announcements for a prince going to the Son of Heaven are to
    be completed in five days and use a victim and silks; the return has the same
    observances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Princes visiting one another announce departure at ancestral and route-related
    shrines and altars, offer to the spirits of the road, and announce their return
    before entering court.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When funerals of both parents occur together, the mother is buried first and
    the father follows, while offerings are placed in the opposite order.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the mother's coffin removal and interment, offerings and regular-place
    wailing are restricted; after return, offerings and announcements for the father's
    coffin removal are made.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sacrifice of repose is offered first to the father and afterwards to the
    mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An eldest son, even at seventy, should have a wife to preside with him at
    funeral rites; if there is no such eldest son, the rites may proceed without a
    presiding wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If capping investors have arrived and news comes of a death requiring one
    year's or nine months' mourning within the same surname circle, the capping ceremony
    is abandoned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the death is outside the same surname circle, capping proceeds without
    sweet wine; viands are removed, the place is swept, and the youth wails in his
    proper position.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If capping arrangements have been made but mourning arises before the appointed
    day, the youth is capped in mourning dress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the Son of Heaven gives robes and the proper cap in the grand ancestral
    temple, the recipient returns home, makes an offering in his own ancestral temple,
    and drinks the capping cup as if offered by his father.
  category: sequence
  evidence_refs:
  - ev:7
