canonical_text:
  quote: ''
  summary: 'The passage records rules and examples concerning mourning and funerary
    conduct: a burial custom using small carriages for offering-bundles, ritual movements
    of a bier-carriage, limits on condolence visits, mourning dress and abstinence,
    duties when a ruler sends or gives condolences, prescribed wailing locations for
    kin, and named anecdotes involving Ai Wu-zi, Kido Ki, Zang Tien, Zengzi, Duke
    Tao, and others.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At burials of men of rank or persons treated as such, small carriages were
    used to carry wrapped bundles made from portions of bodies that had supplied offerings
    placed by the coffin; the bundles were later placed in the outer shell at the
    four corners.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The number of the small carriages varied according to the rank of the deceased.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ruler ordered a bier-carriage to be drawn; it moved three paces and stopped,
    repeating this three times, and the same procedure occurred when the bier entered
    the ancestral temple and at the place of special grief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men of fifty who had no carriage did not make condolence visits beyond the
    boundaries of their states.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kido Ki entered the chamber of the ill Ai Wu-zi while wearing mourning with
    even edges, said such mourning should be removed only at a ruler's gate, and Ai
    Wu-zi approved this as attention to propriety.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ai Wu-zi's mourning rites, Zang Tien leaned against his gate and sang.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a Great officer came to condole with an ordinary officer while the latter
    was occupied with funeral business, an apology was made for not receiving him
    at the gate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: After making a condolence visit, one was not to show joy on the same day;
    a wife was not to cross state boundaries for a condolence visit; and on that day
    one was not to drink spirits or eat flesh.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person who paid a condolence visit while funeral arrangements were underway
    was to take hold of the ropes attached to the car, and those following to the
    grave were to take hold of ropes attached to the coffin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When a ruler sent a condolence message during mourning rites, someone had
    to acknowledge it by bowing to the messenger; the passage gives formulas for the
    announcement and response.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When a ruler met a bier on the way, he had to send someone to present condolences
    to the chief mourner.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At mourning rites for a Great officer, a son by an inferior wife should not
    receive condolences.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: For the death of a wife's brother who was his father's successor, the husband
    was to wail in the court of the principal chamber, appoint his own son to preside,
    wail and leap with specified mourning dress, and place someone outside the gate
    to inform arrivals; other locations are prescribed if circumstances differ.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: If a man had a parent's coffin in his hall and heard of mourning at a distance
    for a same-surname cousin, he was to wail in a side apartment or, if none existed,
    in the court on the right of the gate; if the body was in the same state, he was
    to go there to wail.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:15
  text: When Ze-zhang died, Zengzi was mourning for his mother, wore his mourning
    dress to wail for him, and distinguished this act from a condolence visit.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: At the mourning rites for You Zo, Duke Tao came to condole, and Ze-yi received
    and introduced him by the steps on the left.
  category: action
  evidence_refs:
  - ev:14
