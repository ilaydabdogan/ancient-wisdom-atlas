    It reports Kin Hsiang-tdo's summary that the book treats the sovereign's ancestral
    sacrifice, filial piety through carrying a gained title back to forefathers, family
    regulation through ordered names, and humanity as an illustration of propriety
    and righteousness. It adds that the author and date are unknown.
