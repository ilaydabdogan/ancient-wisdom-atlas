canonical_text:
  quote: ''
  summary: A question-and-answer passage in which 3ang-3ze asks Confucius about marriage
    rites interrupted by deaths, the bride's ritual incorporation into the husband's
    household and ancestral cult, burial if she dies before incorporation, reciprocal
    condolence duties before marriage completion, and the rule against duplicate ritual
    heirs or spirit-tablets, with examples from earlier rulers. The passage ends by
    introducing a question about an army carrying removed spirit-tablets on campaign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 3ang-3ze asks Confucius what should be done if a parent dies while the son-in-law
    has already met the lady and she is travelling with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the son-in-law's father or mother dies while the lady is on the way, Confucius
    says she changes dress, wears a long linen robe with a white silk hair-cincture,
    and hastens to attend the mourning rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the lady's own father or mother dies while she is on the way, Confucius
    says she returns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a death requiring a year or nine months of mourning occurs before the
    lady has arrived at the husband's house, the gentleman changes dress outside,
    the lady changes dress inside, and both go to their positions and wail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When asked whether marriage ceremonies should be resumed after the mourning
    ends, Confucius says they should not go back to what should already have taken
    place, comparing it to a sacrifice whose appointed time has passed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The family that has married a daughter away does not extinguish its candles
    for three nights because of the separation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The family that has received the new wife has no music for three days, with
    the stated thought that her bridegroom is now in the place of his parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After three months the new wife presents herself in the ancestral temple and
    is styled as the new wife that has come.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A day is chosen for the new wife to sacrifice at the shrine of her father-in-law,
    expressing that she is now the established wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: If the lady dies before presenting herself in the ancestral temple, her coffin
    is not removed to the ancestral temple and her tablet is not placed next to that
    of her mother-in-law.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: If the lady dies before this presentation, the husband does not carry the
    staff, wear straw shoes, or have a special place for wailing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: If she dies before becoming the established wife, she is taken back and buried
    among the kindred of her own family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: If the fortunate day has been fixed for taking the lady to her new home and
    she dies before then, the son-in-law comes to condole wearing one year's mourning
    until the interment; a similar reciprocal course is followed if the husband dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Confucius says that in heaven there are not two suns, in a country not two
    kings, and in sacrifices not two who occupy the highest place of honour, in response
    to a question about two orphan sons or two spirit-tablets.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Confucius says Duke Hwan of Khi made fictitious tablets, took them on expeditions,
    and deposited them in the ancestral temple on his return, and he identifies this
    as the origin of having two tablets in a temple-shrine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Confucius recounts a condolence visit in which Duke Ai acted as principal
    mourner while Khang-jze also performed mourning gestures, and he says the practice
    of two acting as the orphan son arose from the error of Ai Khang-jze.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage ends with 3ang-3ze asking whether an army anciently had first
    to carry spirit-tablets removed from their shrines when going on expedition.
  category: speech
  evidence_refs:
  - ev:8
