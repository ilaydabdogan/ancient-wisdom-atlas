  claim: 'The passage explicitly treats marriage ceremonies and sacrifices as similarly
    time-bound rites: when the proper time has passed, the rite is not retroactively
    performed.'
  claim_level: same_function
  target: time-bound ritual pattern involving missed sacrifice and missed marriage
    ceremony
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is an analogy within Confucius' ruling, not a comparison to an
    external text or tradition.
- id: claim:2
  claim: The passage compares proper ritual order to a broader pattern of singular
    highest authority by aligning no duplicate orphan son or tablet with not having
    two suns, two kings, or two highest sacrificial honours.
  claim_level: same_function
  target: pattern of singular highest office in cosmic, political, and sacrificial
    order
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the passage's own stated analogy and does not
    establish a historical relationship with other corpora.
