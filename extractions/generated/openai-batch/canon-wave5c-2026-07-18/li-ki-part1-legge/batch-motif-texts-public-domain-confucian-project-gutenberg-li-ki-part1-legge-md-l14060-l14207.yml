candidate_motifs:
- id: motif:1
  label: marriage transition interrupted by death and mourning
  taxonomy_refs: []
  basis: Several questions concern what happens when death occurs while the bride
    is being taken to the husband's house or before marriage rites are complete.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  confidence: high
  cautions: This is a ritual-legal pattern in the passage, not a narrative myth episode.
- id: motif:2
  label: bride incorporated through ancestral presentation and sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The new wife presents herself in the ancestral temple after three months
    and sacrifices at the father-in-law's shrine to express that she is the established
    wife.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The taxonomy reference is limited to the explicit sacrificial act; the
    passage does not describe a mythic sacred marriage.
- id: motif:3
  label: incomplete incorporation and return to natal kindred
  taxonomy_refs: []
  basis: If the lady's own parent dies while she is on the journey she returns, and
    if she dies before ancestral presentation she is buried among her own family,
    showing she had not become the established wife.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: This is framed as ritual status and kinship placement, not as a symbolic
    rebirth or underworld return.
- id: motif:4
  label: ritual singularity of the heir, tablet, and highest honour
  taxonomy_refs: []
  basis: Confucius rejects duplicate ritual principals or tablets by invoking one
    sun, one king, and one highest place of honour in sacrifices, and then explains
    duplicate cases as precedents or errors.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The comparison is internal to the passage; it should not be treated as
    evidence for broad historical contact with other traditions.
- id: motif:5
  label: ancestor tablet accompanying military expedition
  taxonomy_refs: []
  basis: Duke Hwan is said to have made fictitious tablets and taken them on expeditions,
    and the passage ends with a question about an army carrying removed spirit-tablets.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The final question is incomplete in the supplied passage, and the described
    tablets are ritual objects rather than a developed narrative motif.
- id: motif:6
  label: household liminality after the daughter's departure
  taxonomy_refs: []
  basis: The natal household keeps candles burning for three nights because of separation,
    while the receiving household has no music for three days after receiving the
    new wife.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives ritual explanations but does not elaborate a mythic
    symbolism for light or silence.
