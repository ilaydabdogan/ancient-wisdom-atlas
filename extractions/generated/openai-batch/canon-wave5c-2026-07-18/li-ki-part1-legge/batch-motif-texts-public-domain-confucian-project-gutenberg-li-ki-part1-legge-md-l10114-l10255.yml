  summary: 'The passage gives ritual and administrative prescriptions: the Son of
    Heaven and princes perform seasonal and ancestral sacrifices according to rank;
    different status groups offer different victims or foods; slaughter, dress, housing,
    taxation, labor, land assignment, and grave land are regulated; the Minister of
    Works surveys terrain and settlements; local customs and capacities are treated
    as shaped by environmental influences.'
