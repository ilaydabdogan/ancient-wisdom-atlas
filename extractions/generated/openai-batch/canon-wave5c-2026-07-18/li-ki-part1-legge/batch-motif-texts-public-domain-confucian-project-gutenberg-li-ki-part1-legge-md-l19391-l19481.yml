canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive household rules for sons and their wives
    serving parents: arranging mats and bedding, avoiding unauthorized use of parents''
    belongings, serving meals and eating leftovers, maintaining bodily restraint in
    the parents'' presence, preparing washing water, and observing gendered rules
    for speech and exchange inside and outside the house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When parents wish to sit or lie down, sons and their wives are instructed
    to carry mats, ask how to place them, and arrange supports for the parents' bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest and youngest among the servers have differentiated duties in preparing
    the place for lying down, and an attendant places a stool nearby.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the parents have lain down, the mats, coverlet, pillow, and fine mat
    are to be taken up, covered, hung, or rolled away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sons and their wives are told not to move or use the parents' bedding, stools,
    vessels, food, or drink without permitted leftovers, and to regard the parents'
    staffs and shoes reverently.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At regular morning and evening meals while both parents live, the eldest son
    and his wife encourage the parents to eat; after the parents finish, remaining
    food is eaten by junior family members under specified conditions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When ordered by parents, sons and their wives are to answer at once and proceed
    reverently; their movement, posture, gaze, coughing, sneezing, yawning, stretching,
    scratching, spitting, and clothing adjustments are regulated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sons and their wives are instructed to conceal or remove visible spittle or
    snivel of parents and to ask leave before washing or repairing dirty or torn garments
    and accessories.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Every five days tepid water is prepared for a bath, every three days water
    for washing the head, and additional warmed water is prepared for dirty faces
    or feet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same service rules are extended beyond parents and children to elders
    serving youngers and low-status persons serving nobles.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men are told not to speak of what belongs inside the house, and women not
    to speak of what belongs outside; except at sacrifices and funerals, vessels are
    not to be handed directly between them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a man and woman must give and receive an object, the woman receives it
    in a basket, or if there is no basket, both sit and the object is set down rather
    than handed directly.
  category: action
  evidence_refs:
  - ev:6
