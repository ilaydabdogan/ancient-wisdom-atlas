  quote: ''
  summary: The passage explains how sage kings use ceremony, righteousness, schooling,
    humanity, and music to regulate human feelings and produce harmony in persons,
    families, states, and all under heaven. It describes proper seasonal and social
    ordering, avoidance of disasters, and auspicious abundance from heaven, earth,
    hills, and the Ho River.
  language: English
  quote_policy: summarized
