  text: Sage kings are said to regulate human feelings through ceremonial rules, righteousness,
    schooling, humanity, and music, using a field-cultivation analogy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rules of ceremony are described as embodied right, and right is described
    as distinguishing things and regulating the manifestation of humanity.
  category: attribute
  evidence_refs:
