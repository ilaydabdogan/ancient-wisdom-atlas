canonical_text:
  quote: ''
  summary: The passage gives ritual anecdotes and teachings about mourning, burial
    objects, and the interpretation of Confucius's sayings. A mourner is told to wail
    for his dead father inside his apartment rather than in a lane. Confucius teaches
    that the dead should be treated neither as entirely dead nor as entirely alive,
    and explains unusable burial vessels and instruments as objects for spiritual
    intelligences. A reported saying about quick decay after death and quick poverty
    after losing office is debated and explained as context-specific. A final anecdote
    concerns whether and where to wail for a deceased Great officer, with wailing
    performed in another family's temple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man says his father is dead and that he is going to wail for him
    in the lane; 3ang-3ze tells him to return to his apartment and wail there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 3ang-3ze then makes a visit of condolence to the man, standing with his face
    to the north.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius says that treating the dead as entirely dead would show lack of
    affection, while treating them as entirely alive would show lack of wisdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The burial-related bamboo, earthenware, and wooden vessels, as well as lutes,
    pandean pipes, bells, and musical stones, are described as present but unusable,
    unfinished, untuned, or lacking stands.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage calls these burial objects vessels to the eye of fancy and says
    the dead are thus treated as spiritual intelligences.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yti-3ze challenges the report that Confucius taught an officer who loses office
    should quickly become poor and that the dead should quickly decay, saying these
    are not the words of a superior man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 3ze-yi explains that Confucius's statement about quick decay referred specifically
    to Hwan, the minister of War, who had spent three years having a stone coffin
    made without finishing it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 3ze-yi also explains that Confucius's statement about becoming poor quickly
    referred specifically to Nan-kung King-shi, who carried many treasures with him
    in his carriage when going to court.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yti-3ze cites Confucius's ordinance setting the inner coffin at four inches
    thick and the outer at five, and Confucius's sending of disciples ahead before
    going to King, as evidence against a general desire for quick decay or quick poverty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Awang-3ze of Aan dies and word is sent to Lu, Hsien-3ze says wailing
