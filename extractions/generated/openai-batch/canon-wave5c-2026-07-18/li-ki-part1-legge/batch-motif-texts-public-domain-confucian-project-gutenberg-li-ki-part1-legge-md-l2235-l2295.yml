  quote: ''
  summary: Introductory notes describe Book XXXIV, Kien Kwan, as a treatise on subsidiary
    distinctions in mourning rites, including mourners' bearing, voices, food and
    drink, places, dress texture, and changes of dress. The passage then introduces
    Book XXXV, San Nien Wan, as questions about mourning for three years, chiefly
    mourning for parents, with explanations of different mourning periods and a clarification
    that the so-called three-year mourning extends into the third year rather than
    lasting fully three years.
