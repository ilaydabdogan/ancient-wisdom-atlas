canonical_text:
  quote: ''
  summary: 'The passage explains features of the border sacrifice: the sun is read
    as the temporary residence of the spirit of Heaven; the rite uses simple ground,
    vessels, calendrical timing, divination, royal preparation, heavenly regalia,
    and sacrificial victims; it distinguishes offerings for God/Heaven from those
    for Ki and links Heaven with cosmic origin and the ancestor with human origin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents an interpretation in which the sun, for the occasion,
    is regarded as the residence or spirit-tablet of Heaven; the spirit itself is
    not visible, while the sun, moon, and stars can be beheld.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacrifice is offered on swept ground, uses earthenware and gourd vessels,
    and is located in the suburb or border.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sacrificial victim is red, associated with the colour preferred by the
    Kau dynasty, and is a calf, explained as showing simple sincerity.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For border sacrifices a hsin day is used, with the explanation connected to
    the longest day and a name beginning with hsin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During divination for the border sacrifice, the king receives the reply in
    the fane of his great ancestor, while the tortoise-shell is operated on in the
    fane of his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the divination day the king stands by the lake, listens to declarations
    and orders, and then gives warning notice to officers in specified palace or temple
    locations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the day of sacrifice the king, wearing his skin cap, waits for news that
    all is ready.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those engaged in mourning rites do not wail or wear mourning dress; the people
    water and sweep the road, turn it with the spade, and keep torches burning near
    the fields.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king wears a robe with ascending dragons as an emblem of the heavens,
    a cap with twelve jade-pearl pendants, and rides in a plain carriage.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The flag has twelve pendants and images of dragons, the sun, and the moon,
    described as imitating the heavens; the border sacrifice is called an illustration
    of the way of Heaven.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the victim intended for God is infelicitous, it is used for Ki; the victim
    for God must be kept in a clean stall for three months, while the one for Ki must
    be perfect in its parts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that this different handling of victims distinguishes the
    spirits of Heaven from the manes of a man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that all things originate from Heaven and that man originates
    from his great ancestor.
  category: relationship
  evidence_refs:
  - ev:8
