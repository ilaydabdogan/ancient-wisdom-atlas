  quote: ''
  summary: The passage introduces Book XLIV, Yen f., as a fragment on the meaning
    of the banquet at feudal courts. It describes the greatest ancient banquet as
    one following sacrifices in the ancestral temple for the ruler’s same-surname
    kindred, lists additional occasions for banquets, and states that banquet ceremony
    taught proper relations between ranks and distinctions between noble and mean.
  language: English
  quote_policy: summarized
