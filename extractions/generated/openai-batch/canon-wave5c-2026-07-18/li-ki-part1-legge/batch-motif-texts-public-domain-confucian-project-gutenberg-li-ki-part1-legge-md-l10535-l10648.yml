canonical_text:
  quote: ''
  summary: The passage gives rules for criminal judgment, including consideration
    of relationships, intent, degree of offense, consultation in doubtful cases, escalation
    of judgments through officials to the king, and final punishment after mitigating
    conditions. It also lists capital offenses involving legal distortion, corrupting
    music or objects, hypocritical or misleading conduct, false reports about spirits,
    divination, seasons, and days, and it describes prohibitions on selling ritual,
    royal, military, and irregular goods. Frontier officials examine travelers for
    strange clothing and language. The Grand recorder oversees ceremonies, records,
    avoided names, and unfavorable days, and the Son of Heaven receives his admonitions
    reverently.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A judge hearing a case involving the five punishments must consider family
    affection, ruler-minister righteousness, the seriousness of the offense, and the
    offender's capacity before deciding guilt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a criminal charge appears doubtful, the judge consults the multitude; if
    they also doubt, the defendant is pardoned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After judgment, the case is reported through officials to the king, who orders
    a further hearing by high ministers and then determines punishment with mitigating
    conditions in view.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Punishment is compared to a completed body that cannot be changed afterward.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Certain acts are punishable by death, including distorting laws by splitting
    words, confusing names, corrupting government, using licentious music, strange
    garments, unusual contrivances or implements, persistently hypocritical conduct
    or speech, and misleading the multitudes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: False reports about spirits, seasons and days, tortoise-shell consultation,
    and stalk divination that perplex the multitudes are capital offenses without
    defense being heard.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Officials responsible for prohibitions regulating the multitudes do not forgive
    transgressions of those prohibitions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Goods forbidden for market sale include rank-tokens, gilt libation cups, royal
