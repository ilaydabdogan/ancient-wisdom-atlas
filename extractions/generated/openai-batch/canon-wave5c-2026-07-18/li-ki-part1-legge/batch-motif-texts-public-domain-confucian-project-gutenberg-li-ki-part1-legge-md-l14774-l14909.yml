canonical_text:
  quote: "“When it is light again, we will proceed.”"
  summary: 'The passage presents questions and answers about ritual rules: offerings
    for those who die prematurely, funeral procedure during a solar eclipse, recalling
    the spirit of an official who dies while on mission, burial and coffining of prematurely
    deceased children, duties of a personator of the dead, and the end of three years’
    mourning.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 3ang-3ze asks how there can be two satisfying offerings, dark and bright,
    when a complete sacrifice is not made to one who has died prematurely.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says that when the oldest son who would take the father’s place
    dies prematurely, a brother by an inferior wife cannot succeed him, and the auspicious
    sacrifice to him uses a single bullock while omitting several ritual presentations
    and announcements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Confucius identifies the omitted-offering rite for the prematurely deceased
    oldest son as the dark satisfying offering.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: For others who die prematurely and leave no offspring, Confucius says the
    sacrifice is made in the house of the oldest son, in the lightest apartment, with
    vases in the chamber on the east; he identifies this as the bright satisfying
    offering.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: 3ang-3ze asks whether burial procedure changes when the bier has reached the
    path and a solar eclipse occurs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confucius recounts that Lao Tan ordered a bier stopped on the left of the
    road during a solar eclipse, with wailing and waiting until the eclipse passed
    and light returned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lao Tan explains that rulers and officers travel while they can see the sun
    and halt at sundown; he adds that a prince presents offerings to the spirit of
    the way at sundown.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lao Tan says those who travel by starlight are only criminals and those hastening
    to a parent’s funeral rites, and that ritual should not expose relatives to distress
    or evil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: 3ang-3ze asks about the rule that the spirit of an official who dies while
    on mission is recalled if he dies in a government hotel but not if he dies in
    a private one.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Confucius defines private hotels as houses of high ministers, Great officers,
    or ordinary officers, and public hotels as government hotels or lodging appointed
    by the government; he says the spirit is recalled at a public hotel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: 3ang-3ze asks about children dying prematurely between eight and eleven, normally
    buried nearby in a garden brick grave and carried on a carriage-like contrivance,
    when the grave is instead distant.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Confucius cites Lao Tan’s account that recorder Yi’s prematurely deceased
    son was shrouded and coffined in the palace for a distant grave, after approval
    associated with the dukes of Shao and Kâu; this began the practice of coffins
    and shrouding for such boys.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: When a minister or Great officer who is to personate the dead for his ruler
    faces a family mourning obligation, Confucius says he should leave home, lodge
    in a state hotel, and wait until the ruler’s business is completed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Confucius says that when one who has represented the dead comes forth wearing
    the leathern or tasseled cap, ministers, Great officers, and other officers descend
    from their carriages; he bows and has a forerunner.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: 3ze-hsia asks whether military service is no longer declined after the wailing
    in three years’ mourning has ended; the answer is not included in this passage.
  category: speech
  evidence_refs:
  - ev:9
