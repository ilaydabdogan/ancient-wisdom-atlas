canonical_text:
  quote: ''
  summary: 'The passage describes rules and explanations for ancient sacrificial service:
    the sacrificer’s self-designations, the presentation of the victim’s flesh, the
    representative of the departed who personates the spirit, the prayer officer as
    communicator, libation vessels and clarified liquors, stated purposes of sacrifice,
    and vigil/purification practices associated with attention to the dark and unseen.'
  language: English
  quote_policy: summarized
