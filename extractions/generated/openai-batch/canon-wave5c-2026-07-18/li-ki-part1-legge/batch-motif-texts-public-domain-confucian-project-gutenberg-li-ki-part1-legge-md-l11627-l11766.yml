canonical_text:
  quote: ''
  summary: 'The passage prescribes the calendrical, ritual, administrative, and household
    activities for the last month of spring: celestial and seasonal correspondences,
    sacrifices and offerings, the Son of Heaven’s spring regalia and boat rite, public
    relief and waterworks, restrictions on hunting implements, and the queen’s role
    in sericulture for ritual textiles.'
  language: English
  quote_policy: summarized
