canonical_text:
  quote: ''
  summary: The passage gives ritual and moral instruction on mourning, public duty,
    filial service, royal heirship, regency, and education. Confucius discusses resignation
    from public duties during three years’ mourning and an exception for necessary
    military service. King Wan is presented as an exemplary eldest son who visits
    and tends King Ki. King Wu follows Wan’s example during Wan’s illness and reports
    a dream in which God gives him nine ling. The Duke of Kau governs as regent for
    the young King Khang and teaches ordered relationships through his treatment of
    Po-khin. Royal heirs and selected young learners are taught martial and musical
    arts according to the seasons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says that under Hsia officials resigned public duties after coffining
    in the three years’ mourning, while under Yin they did so after interment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius cites a record saying that the ruler does not take away people’s
    affection for parents and people do not take away parents’ filial duty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 3ze-hsid asks whether declining military service during mourning should be
    condemned, and Confucius cites Lao Tan’s account of Duke Po-khin serving when
    occasion required it while questioning service sought for private advantage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Wan, as eldest son and heir, made three formal daily visits to King Ki.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the first cockcrow King Wan dressed, went outside the bedroom, and asked
    an interior servant about the king’s health; his expression and gait changed when
    the king was unwell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: King Wan examined the king’s food for proper heat and cold, asked what dishes
    had been eaten, and ordered the cook not to send up the same dishes again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: King Wu followed Wan’s example, nursed Wan during illness without taking off
    cap or girdle, ate when Wan ate, and continued these attentions for twelve days
    before intermitting them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: King Wu reports dreaming that God gave him nine ling; he interprets this as
    the nine western states, while Wan interprets ling as year or age and says he
    gives Wu three years.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Because King Khang was very young and could not perform at the eastern steps,
    the Duke of Kau acted as regent and administered the government.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Duke of Kau taught King Khang the courses of father and son, ruler and
    minister, and old and young by his treatment of Po-khin, punishing Po-khin when
    he erred.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Heir-sons and selected young learners were taught different subjects in different
    seasons: shield and spear in spring and summer, feather and flute in autumn and
    winter, all in the eastern school.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Inferior directors of Music, flute masters, assistants, subdirectors, and
    drum regulation are described as part of the instruction in shield, spear, and
    chanting of the Nan.
  category: action
  evidence_refs:
  - ev:7
