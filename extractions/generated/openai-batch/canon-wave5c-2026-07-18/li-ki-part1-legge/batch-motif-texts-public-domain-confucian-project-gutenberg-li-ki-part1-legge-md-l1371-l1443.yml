canonical_text:
  quote: ''
  summary: The passage is an introductory note on Book XII, explaining that the Ming
    Thang, translated here as the Hall of Distinction, is treated less as an architectural
    subject than as a setting for claims about the duke of Kau, the state of Lu, and
    royal privileges. It describes the Hall of Distinction as a royal structure used
    partly as a temple for sacrifices, as a place of audience, and as a place where
    governmental regulations were promulgated; it also notes smaller halls of the
    same name at four inspection points and mentions related descriptions in other
    texts.
  language: English
  quote_policy: summarized
