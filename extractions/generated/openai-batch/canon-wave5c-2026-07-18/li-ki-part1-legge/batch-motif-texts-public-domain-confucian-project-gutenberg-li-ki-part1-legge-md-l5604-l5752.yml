  quote: ''
  summary: The passage gives ritual comments and anecdotes concerning mourning duration,
    condolence, burial at ancestral places, wailing, corpse preparation, offerings,
    music during mourning, shared graves, mourning clothing, and abstention from liquids
    during parental mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Three kinds of death are named as deaths for which condolence should not
    be offered: death from cowardice, from being crushed through heedlessness, and
    from drowning.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 3ze-lti continued mourning for his eldest sister after he might have ended
    it; after Confucius questioned him and invoked the rules of the ancient kings,
    he left off mourning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thai-kung was invested with a state, but five generations of his descendants
    were taken back and buried in Kau.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A saying about a dying fox turning its head toward the mound where it was
    whelped is used in the passage as an example connected with remembrance of origins.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Po-yii continued wailing for his mother after the year; Confucius called the
    demonstration excessive, and Po-yii gave up wailing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shun was buried in the wilderness of 3hang-wa, and the passage says the three
    ladies of his harem were apparently not buried in the same grave with him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ai We-3ze says that burying husband and wife in the same grave appears to
    have originated with the duke of Kau.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the mourning rites for 34ng-3ze, his body was washed in the cook-room rather
    than in the principal chamber noted by the translator.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: During nine months' mourning, musical studies should be suspended, though
    someone says it is permissible to croon over the words of the pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When 3ze-kang was ill, he called Shan-hsiang and spoke of perhaps drawing
    near to his end as a superior man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Zang-3ze says that what remains in the cupboard may suffice as offerings set
    down by the corpse of one who has just died.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Zang-3ze says that the absence of places for wailing in five months' mourning
    arose from ways in small lanes, and gives cases where such places were made and
    stamping was led or performed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage contrasts ancient caps with seams running up and down with the
    current mourning cap whose seams go around, judging this difference not to be
    the ancient way.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Zang-3ze says that during mourning for his parents no water or other liquid
