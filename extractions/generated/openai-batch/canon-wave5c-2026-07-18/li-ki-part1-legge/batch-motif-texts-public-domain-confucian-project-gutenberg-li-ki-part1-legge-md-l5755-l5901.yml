canonical_text:
  quote: ''
  summary: 'The passage gives rules and anecdotes about mourning: delayed news of
    deaths, condolence gifts, proper places for wailing, illness during mourning,
    rebuke for excessive mourning, spatial signs of illness or condolence, severe
    filial mourning, correct mourning clothing, and Confucius''s response to grief
    at a funeral in Wei.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 3ang-jze questions whether omitting five-month mourning after delayed news
    would mean distant brethren receive no mourning at all.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before Confucius's messenger could arrive for Po-kao's rites, Zan-3ze presented
    silks and four horses as Confucius's substitute; Confucius objected that this
    made him fail in showing sincerity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius lists different places for wailing according to the mourner's relation
    to the deceased, ranging from the ancestral temple to the open country.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: For Po-kao, Confucius chooses to wail in 3hze's place and appoints 3ze-kung
    to act as presiding mourner with specific bowing instructions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jang-3ze says that when a mourner falls ill and must eat meat and drink spirits,
    strengthening flavours such as ginger and cinnamon should be added.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 3ze-hsia loses his eyesight while mourning for his son, and 3ang-3ze comes
    to condole and wail with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 3ang-3ze rebukes 3ze-hsia after he claims to have no guilt, listing three
    offenses, after which 3ze-hsia throws down his staff, bows, and admits wrong.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that staying in an inner chamber by day permits inquiry
    about illness, while staying outside by night permits condolence; a superior man
    avoids these conditions except for specified causes.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: During mourning for his parents, Kao Qze-kéo's tears flowed silently like
    blood for three years, and he did not laugh so as to show his teeth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says it is better not to wear mourning than to wear it in improper
    material or fashion, and it gives conduct rules for sackcloth with even edges.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a funeral in Wei for a former lodging host, Confucius wails bitterly, sees
    the mourner dissolved in grief, and orders 3ze-kung to present the outside horses
    of his carriage.
  category: action
  evidence_refs:
  - ev:9
