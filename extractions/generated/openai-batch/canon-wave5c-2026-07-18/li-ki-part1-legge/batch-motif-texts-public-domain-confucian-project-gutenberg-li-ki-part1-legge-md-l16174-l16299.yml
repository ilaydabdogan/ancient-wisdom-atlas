canonical_text:
  quote: ''
  summary: The passage condemns ritual improprieties by rulers, ministers, and Great
    officers; defines proper statutory arrangements among the Son of Heaven, feudal
    princes, and officers; explains the governing function of ceremonies; and links
    correct government with Heaven’s intimations as learned through altars, ancestral
    temples, sacrifices, and spirits.
  language: ''
  quote_policy: summarized
