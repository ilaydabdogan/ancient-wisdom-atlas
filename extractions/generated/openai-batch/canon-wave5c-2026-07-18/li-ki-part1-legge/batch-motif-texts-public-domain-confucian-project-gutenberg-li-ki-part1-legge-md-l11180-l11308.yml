canonical_text:
  quote: ''
  summary: The passage describes first-month spring observances in which the Son of
    Heaven uses spring-colored regalia and foods, receives calendrical notice from
    the Grand Recorder, purifies himself, meets spring in the eastern suburb with
    ministers and officers, orders virtue and government to be disseminated, has celestial
    motions recorded, prays to God for a good year, ploughs the field of God with
    his hierarchy, gives a cup after toil, and notes the harmonious ascent and descent
    of earth and heaven vapours as plants bud. Commentary also describes the Hall
    of Distinction as a nine-part directional structure used in a monthly royal circuit.
  language: English translation
  quote_policy: summarized
