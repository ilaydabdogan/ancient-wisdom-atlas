canonical_text:
  quote: ''
  summary: 'The passage gives prescribed life-stage training and social duties for
    males and females: male education in music, odes, dances, archery, chariot-driving,
    capping, ceremonies, marriage, office, administration, retirement, and left-hand
    precedence in salutations; female seclusion from age ten, instruction by a governess
    in speech, obedience, textile work, ceremonial provisioning, hair-pin assumption,
    marriage rules, and right-hand precedence in salutations.'
  language: English
  quote_policy: summarized
