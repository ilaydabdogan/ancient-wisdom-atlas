- id: obs:2
  text: At twenty, the male subject is capped, learns classes of ceremonies, may wear
    furs and silk, dances the ta hsia, attends to filial and fraternal duties, and
    is described as receiving learning rather than teaching others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At thirty, the male subject has a wife and begins men's business; at forty,
    he is first appointed to office; at fifty, he becomes a Great officer; at seventy,
    he retires from duties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In male salutations, the upper place is assigned to the left hand.
