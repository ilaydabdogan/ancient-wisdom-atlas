canonical_text:
  quote: ''
  summary: The passage gives a textual-historical account of how Li treatises were
    gathered, condensed, transmitted, augmented, commented on, and preserved. It describes
    Tai Teh and Tai Shang reducing a larger corpus into shorter collections, the acceptance
    of the Lesser Tai recension as the Li Ki, later transmission through Ma Yung and
    Kang Hsuan, stone engraving of Confucian classics under Zhai Yung, and the lesser
    circulation of the Greater Tai compilation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sui Dynasty résumé is said to report that Hsiang had 214 phien of Li treatises,
    described as a mass of tablets or written copies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hau Zhang is described as a distinguished Li scholar, and Tai Teh and Tai
    Shang are described as his disciples.
  category: relationship
  evidence_refs:
