- id: obs:3
  text: Tai Teh, called the Greater Tai, digested the phien and reduced their number
    to 85.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tai Shang, called the Lesser Tai, reduced his cousin's work to 46 treatises;
    this second condensation gained general acceptance and was styled the Li Ki.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Ma Yung added three named books to Shang's books, bringing the number to forty-nine
    in one reckoning, and the redaction then passed to Kang Hsuan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kang Hsuan worked on the Kau Li, the I Li, and the Li Ki; his commentaries
    are said to remain in the Thirteen King with additions by Khung Ying-ta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In A.D. 175 Zhai Yung supervised engraving the texts of the Confucian classics
    on stone; only fragments of that stone text are said to remain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Greater Tai compilation was handed down to Hsii Liang and transmitted
    in his family, but it fell into neglect as the shorter work of Lesser Tai circulated
    widely.
  category: sequence
  evidence_refs:
  - ev:8
