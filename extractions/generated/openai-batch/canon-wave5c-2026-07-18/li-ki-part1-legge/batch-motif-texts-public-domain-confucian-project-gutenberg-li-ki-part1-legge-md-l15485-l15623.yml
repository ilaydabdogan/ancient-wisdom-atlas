  text: The passage lists mourning gifts as articles, money, robes, and jade placed
    in the mouth of the deceased.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A member of the ruler's kindred guilty of a capital offence was hanged by
    someone from the foresters' department; corporal punishment or dismemberment was
    also assigned to that department, but castration was not used.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
