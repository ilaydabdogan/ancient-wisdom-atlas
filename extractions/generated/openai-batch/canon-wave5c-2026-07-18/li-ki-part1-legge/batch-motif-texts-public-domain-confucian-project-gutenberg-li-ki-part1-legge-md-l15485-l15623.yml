canonical_text:
  quote: ''
  summary: 'The passage gives normative explanations for ritual and legal practices
    among a ruler''s kindred: mourning regulations, funeral gifts, punishments for
    criminal relatives, the ruler''s response to executions, court and temple seating,
    ancestral service, feasting by age and descent, guarding ancestral tablets and
    shrines, announcing life events to ancestral shrines, and the political value
    of well-ordered kindred offices. It begins with a brief note on the cook''s role
    and the ruler''s dignity at banquets.'
  language: English translation
  quote_policy: summarized
