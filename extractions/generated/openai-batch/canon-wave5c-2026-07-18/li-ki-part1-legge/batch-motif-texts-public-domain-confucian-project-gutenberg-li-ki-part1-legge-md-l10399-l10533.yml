canonical_text:
  quote: ''
  summary: 'The passage describes a royal educational and administrative system: instruction
    in poems, histories, ceremonies, and music; admission of royal, noble, official,
    and selected students; discipline and examination of negligent scholars; advancement
    of completed scholars into office; permanent exclusion of incompetent officers;
    military preparation when war is contemplated; regulation of technical specialists;
    and criminal procedure governed by evidence, review, and the judgment of Heaven.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The board for the direction of Music honours four subjects of instruction
    and arranges lessons according to poems, histories, ceremonies, and music of former
    kings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The curriculum assigns ceremonies and music to spring and autumn, and poems
    and histories to winter and summer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king's sons, sons of feudal princes, sons of high ministers and officers,
    and eminent selected scholars from the states enter the schools according to age.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When students near departure from college, assistants and a director record
    those who neglected instruction and report them upward to the Grand director and
    king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king orders ministers and officers to enter the school for examination;
    if needed, the king personally inspects the school.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If correction fails, the king abstains for three days from full meals and
    music before the culprits are sent to remote western or eastern regions and excluded
    from distinction for life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Grand director of Music reports the most promising completed scholars
    to the king; they are then placed under the minister of War as scholars ready
    for employment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The minister of War assesses scholars' abilities, determines suitable offices,
    reports decisions to the king, and the scholars then receive office, rank, and
    salary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Great officer dismissed as incompetent is not employed again during life
    and is buried as an ordinary officer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a war expedition is contemplated, the Grand minister of Instruction teaches
    scholars chariot management and the wearing of mail.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Persons professing particular arts are examined for strength and for archery
    and charioteering when sent far away, and they are restricted from changing office
    or taking officer rank outside their districts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The minister of Crime clarifies laws, adapts punishments, requires three references
    before capital punishment, rejects charges based only on intent without evidence,
    and treats doubtful or pardonable cases with caution.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Applications of the five punishments are to be decided according to the judgment
    of Heaven, with inadvertent and redeemable offences determined by the circumstances
    of each case.
  category: speech
  evidence_refs:
  - ev:9
