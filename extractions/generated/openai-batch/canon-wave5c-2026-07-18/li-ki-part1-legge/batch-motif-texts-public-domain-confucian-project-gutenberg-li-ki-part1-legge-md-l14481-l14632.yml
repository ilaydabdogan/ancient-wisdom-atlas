canonical_text:
  quote: ''
  summary: The passage presents Confucius answering questions about mourning rites,
    especially conflicts between mourning for a ruler and mourning for parents, rules
    for timed sacrifices and funeral attendance, hierarchy in eulogies, and procedures
    when a ruler dies outside his state and is returned for burial.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says that after the first year of the three-year mourning period,
    a mourner should not be seen standing with others or going in a crowd, and he
    links ceremonies with proper expression of feeling rather than empty form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When mourning for a ruler is being worn, Confucius says the official does
    not venture to wear private mourning; after the ruler's mourning is put off, the
    great sacrifices for the private mourning are performed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius states that ceremonies whose appointed time has passed should not
    be performed, and that a superior man does not offer a sacrifice after its proper
    time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the ruler is lying in his coffin and a minister is called to funeral rites
    for a parent, Confucius says the minister should go home and remain there, but
    attend the ruler's great services rather than the ruler's morning and evening
    services.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If removal of the ruler's coffin has begun and the minister is called to parental
    funeral rites, Confucius says the minister should go home, wail, and return to
    accompany the ruler's funeral.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the ruler has not yet been coffined and the minister is called to parental
    funeral rites, Confucius says the minister should go home, have the deceased put
    in the coffin, and then return to the ruler; household representatives handle
    some matters, and the wife of a Great officer attends the ruler's great services
    but not the daily services.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that a lower-ranked person should not pronounce a eulogy
    for a higher-ranked one, nor a younger man for an older one; the Son of Heaven's
    eulogy is referred to Heaven, and princes of states do not eulogize one another.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a ruler crosses his state boundary, he takes an inner coffin as preparation
    for possible three-year mourning rites if he dies abroad.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a ruler dies abroad and is brought back, the son's entry route and clothing
    differ according to whether the fuller coffining preparation or only the slighter
    dressing remains to be done.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A question is posed about what one should do if, while drawing the carriage
    with the ruler's bier, he is called to the funeral rites of his father or mother;
    the supplied passage does not include Confucius's answer.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: A note explains that morning and evening offerings were placed near the coffin,
    while the first and fifteenth days of the month involved larger-scale observances
    called the great services.
  category: other
  evidence_refs:
  - ev:10
