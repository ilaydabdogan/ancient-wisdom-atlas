canonical_text:
  quote: ''
  summary: 'The passage describes court and sacrificial protocol: carriage ornaments,
    sacrificial foods and fragrances, ranked hospitality with cups and mats, seasonal
    rites with or without music, odd and even vessel numbers tied to developing and
    receding influences, musical order at receptions, symbolic tribute articles, and
    precedents for torches and the Sze Hsia music.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The horses of the Grand carriage have one ornamental breast tassel; the carriages
    preceding have three; the following carriages have five.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacrificial presentation includes blood at the border sacrifice, raw flesh
    in a great ancestral-temple offering, sodden flesh where spirits are presented
    thrice, and roast meat where they are presented once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sacrificial forms are said to express great reverence; taste is not valued,
    while the scent of the air is honored.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: When princes appear as guests, they are presented with herb-flavoured spirits;
    at a great entertainment, value is given to preliminary flesh pieces prepared
    with cinnamon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a great feast for the ruler of another state, the host ruler receives the
    cup seated on three mats; for a visit through a minister or Great officer, after
    the cup is thrice presented, he receives it on a single mat, described as descending
    from higher rank to the visitor’s lower distinction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The spring feast for the orphaned young and the vernal ancestral sacrifice
    have music; feeding the aged and the autumnal sacrifice have no music.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Drinking is said to nourish the developing influence; eating is said to nourish
    the receding influence; modulation of sound partakes of development.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The number of tripods and meat-stands is odd, while the number of tall dishes
    of wood and bamboo is even; this is linked to the numbers of developing and receding
    influences.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stands are filled with products of water and land; extraordinary flavours
    and mere multitude or variety are avoided in order to maintain intercourse with
    spiritual intelligences.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When guests enter through the Best door, the Sze Hsia music begins; at the
    end of each cup the music stops for a moment, a practice Confucius admired.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the last cup, performers ascend the hall and sing; singers are above
    and organists below, giving honour to the human voice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Music is said to come from the expanding influence, ceremonies from the contracting
    influence; when the two are in harmony, all things obtain full development.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tribute articles have no fixed rules; they vary by the products and suitability
    of territories and by distance from the royal domain.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Tortoises are placed first among offerings because the shell gives knowledge
    of the future; bells follow as a symbol of harmony and union of feeling; tiger
    and leopard skins signify fierce repression of insubordination; silk bundles with
    jade disks show relation to the king’s virtue.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The use of a hundred torches in the courtyard is attributed to duke Hwan of
    A Zi; the playing of the Sze Hsia at receptions of Great officers is attributed
    to Kao Wan-3ze.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A Great officer’s private audience when appearing at another court is stated
    to be contrary to propriety.
  category: speech
  evidence_refs:
  - ev:9
