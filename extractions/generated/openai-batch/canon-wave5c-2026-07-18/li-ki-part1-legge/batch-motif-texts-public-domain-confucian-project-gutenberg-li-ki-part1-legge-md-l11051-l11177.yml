  summary: The passage opens the Yueh Ling, a calendar of governmental proceedings
    by month. For the first month of spring it lists astronomical positions, calendrical
    stems, divine and spiritual presiders, associated creatures, music, number, taste,
    smell, sacrifice, seasonal animal phenomena, and the ritual placement and regalia
    of the Son of Heaven.
  language: English
  quote_policy: summarized
