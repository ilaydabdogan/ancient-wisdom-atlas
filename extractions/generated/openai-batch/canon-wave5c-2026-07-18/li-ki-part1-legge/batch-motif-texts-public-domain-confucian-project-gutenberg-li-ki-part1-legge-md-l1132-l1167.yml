  summary: 'The passage is an editorial overview of part of the Li Ki. It says the
    surrounding material discusses king Wan as a young heir, a similar account of
    his son who became king Wf, and the duke of Kau’s training of king K/ang. It then
    outlines three main topics: education of royal and feudal heirs and promising
    young men, duties of the Shi-3ze official in directing young noblemen’s instruction,
    and ceremonies for the king’s feasting and cherishing of the aged, with similar
    observance expected of princes.'
