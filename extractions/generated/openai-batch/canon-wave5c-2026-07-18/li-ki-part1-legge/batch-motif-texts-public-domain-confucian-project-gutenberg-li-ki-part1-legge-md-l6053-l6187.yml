    the order of funerary stages, correct mourning garments and positions, conduct
    after mourning has ended, a first-year mourning observance, and Zhou naming practices.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At the mourning rites for Confucius, the disciples wore sackcloth head-bands
    when going out; for one of their own number, they wore them in the house when
    condoling but not when going out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Keeping graves clear of grass is stated not to have been a practice of antiquity.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: 3ze-lo reports hearing the Master say that in mourning, excessive grief with
    deficient rites is better than little grief with excessive rites, and that in
    sacrifice, excessive reverence with deficient rites is better than excessive rites
    with little reverence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 3ang-3ze visited for condolence after the sacrifice of departure had been
    presented and the offerings removed; he caused the bier to be pushed back, had
    the women come down again, and then performed his ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 3ang-3ze answered that the sacrifice at starting was an unimportant matter
    and that the bier might be brought back and allowed to rest for a while.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: '3ze-yu describes a sequence of funerary acts: rice and shell placed in the
    corpse’s mouth, slighter dressing, fuller dressing, coffining, sacrifice at starting,
    and interment at the grave.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 3ze-yu says the proceedings move toward what is more remote, so that in mourning
    details there is constant advance and no receding.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 3ang-3ze criticized 3ze-yu for displaying the silk robe over the fur robe
    at condolence; after the chief mourner finished the slighter dressing, 3ze-yu
    returned wearing the fur over the silk with a sackcloth girdle, and 3ang-3ze said
    he had been wrong.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After putting off mourning, 3ze-hsia could hardly tune or play a lute and
    said he had not yet forgotten his grief, adding that the ancient kings framed
    the ceremonial rules and he dared not go beyond them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the same circumstance, 3ze-Aang tuned and played the lute readily and said
    the ancient kings framed the ceremonial rules and he did not dare not to come
    up to them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the mourning rites for Hui-3ze, 3ze-yu wore a sackcloth robe and a head-band
    made from the male plant; Wan-3ze declined the honor, and 3ze-yu insisted on being
    allowed to remain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wan-3ze supported the rightful son into a south-facing position and asked
    whether he himself should return to his proper place; 3ze-yu then moved to a place
    among the guests.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the end of the first year’s mourning for the general Wan-3ze, a man from
    Yueh came to condole, and the chief mourner wailed for him in the ancestral temple
    while wearing transitional mourning garments.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: 3ze-yu judged that the son of the general Wan was nearly a master of ceremonies
    and that his conduct was correct in a circumstance with no special rule.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage states that childhood naming, designation at capping, elder-uncle
    or younger-uncle title at fifty, and posthumous honorary title were practices
    of the Zhou dynasty.
  category: sequence
  evidence_refs:
  - ev:10
