canonical_text:
  quote: ''
  summary: Prescriptive household rules distinguish male and female movement and spaces;
    define obedience of sons and daughters-in-law to parents; prescribe parental correction,
    filial remonstrance, and endurance; regulate the treatment of concubines, wives,
    and favored dependents according to parental preference; and establish female
    household hierarchy after the father-in-law’s death, especially for sacrifices
    and guests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men and women are told not to use the same well or bathing-house, lie on the
    same mat, borrow from one another, or wear similar garments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Words spoken inside are not to go out, and words spoken outside are not to
    come in.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man entering the interior of the house should not whistle or point; if he
    moves at night, he should use a light, and without a light he should not stir.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman going out at the door must keep her face covered; at night she should
    walk only with a light, and without a light she should not stir.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: On the road, a man should take the right side and a woman the left.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: Filial and reverential sons and sons’ wives should execute parental orders
    without refusal or delay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When parents give food, drink, or clothes that the recipients do not like,
    the sons and sons’ wives should still taste the food or drink or put on the clothes
    and wait for further orders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: If parents assign work and then appoint another person to take it over, the
    son or son’s wife should hand it over and later redo it if it is not done well.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Parents should allow sons and sons’ wives to continue laborious tasks at the
    time, even if they love them, but should give them ease on other occasions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: If sons and sons’ wives are not filial and reverential, parents should first
    instruct them, then become angry if instruction is not received, and finally may
    drive out the son and send away the wife without publicly showing why.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: If a parent has a fault, the son should admonish with restrained breath, mild
    appearance, and gentle voice; if needed, he should repeat the admonition or strongly
    remonstrate to prevent an offense against others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: If the parent becomes angry and beats the son until blood flows, the son should
    not become angry or resentful but should become more reverential and filial.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the parents’ death, sons should not let their regard decay for a handmaid-born
    boy or for a son or grandson of a concubine whom the parents loved.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a son loves one concubine while his parents love another, he should not
    make his preferred concubine equal to the parent-loved concubine in dress, food,
    or duties, and should not lessen attentions after the parents’ death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: If a son approves of his wife but his parents dislike her, he should divorce
    her; if he does not approve of her but his parents say she serves them well, he
    should treat her as his wife to the end of her life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: After his parents are dead, a son should perform good actions to transmit
    their good name and avoid bad actions that would disgrace their name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: After the father-in-law’s death, the mother-in-law takes the place of the
    senior lady; the eldest son’s wife asks her directions in sacrifices and guest
    reception, while other sons’ wives ask directions from the eldest son’s wife.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: When parents-in-law employ one daughter-in-law, the others should not presume
    equality by walking side by side with her, giving orders in the same way, or sitting
    in the same position.
  category: action
  evidence_refs:
  - ev:7
