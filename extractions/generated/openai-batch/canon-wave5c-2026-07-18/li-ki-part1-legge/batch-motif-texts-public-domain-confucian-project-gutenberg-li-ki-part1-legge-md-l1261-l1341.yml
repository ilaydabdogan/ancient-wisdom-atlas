canonical_text:
  quote: ''
  summary: Editorial introduction to Book IX and Book X of the Li Ki. Book IX is described
    as treating sacrifice generally, especially reverence, sincerity, simplicity,
    paucity of things, and the Single Victim in the Border Sacrifice; it also mentions
    capping, marriage, and dynastic differences in sacrifice. Book X is described
    as the Pattern of the Family or Interior, giving rules for children, wives, parents,
    parents-in-law, care of the aged, birth, education, and household duties.
  language: English
  quote_policy: summarized
