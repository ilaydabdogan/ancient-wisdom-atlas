canonical_text:
  quote: ''
  summary: The passage gives ritual rules for selecting days by odd/even categories
    and by divination with tortoise shell or stalks. It then prescribes detailed etiquette
    for the ruler’s carriage, including the driver’s actions, rank-based handling
    of straps and seats, restrictions on guests, women, animals, and court conduct,
    and a funerary rule concerning the vacant left seat of a deceased ruler’s carriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: External undertakings are assigned to odd days, and internal undertakings
    to even days; a note explains odd days as strong/yang and even days as weak/yin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When divining about a day, days beyond the decade are called distant and days
    within the decade are called near; distant days are preferred for mourning and
    near days for festive matters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives an address to the tortoise-shell and divining stalks as
    sources of regular indications.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Divination by shell or stalks is limited to no more than three times, and
    both methods should not be used on the same subject.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shell divination is named pi and stalk divination is named shih; the passage
    says these methods were used by ancient sage kings to make the people believe
    in seasons and days, revere spiritual beings, and settle doubts.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Before the ruler’s carriage departs, the driver stands before the horses with
    whip in hand, inspects the linchpin after yoking, reports readiness, mounts from
    the right, kneels in the carriage, drives five paces, and stops.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the ruler approaches the carriage, the driver handles the reins and strap,
    attendants retire and then follow, and at the great gate the ruler signals gentler
    driving and orders the warrior for the right seat to enter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The carriage pace is to be reduced to a walk when passing through gates, villages,
    and water-channels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rules for handing the mounting strap depend on relative rank between driver
    and passenger.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A guest’s carriage does not enter the great gate, a woman does not stand up
    in her carriage, and dogs and horses are not taken up to the hall.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ruler bows to an old man of yellow hair, dismounts past places of high
    nobles, does not gallop in the capital, and bows on entering a village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A great officer or other officer summoned by the ruler’s order must meet the
    messenger in person, and an armoured man performs only a restrained obeisance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the interment of a deceased ruler, the left place in the ruler’s carriage
    is vacant; ministers riding in the ruler’s carriages on other occasions do not
    leave that seat vacant, and its occupant bends forward to the cross-board.
  category: action
  evidence_refs:
  - ev:9
