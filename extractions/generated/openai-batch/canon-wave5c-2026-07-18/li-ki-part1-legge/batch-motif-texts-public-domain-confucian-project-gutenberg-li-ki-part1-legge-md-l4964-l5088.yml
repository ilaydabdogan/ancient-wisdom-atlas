canonical_text:
  quote: ''
  summary: 'The passage summarizes Part III topics and then gives ritual and social
    rules: how to answer questions about age and wealth for ranks from the son of
    Heaven to common men; which sacrifices and oblations are proper for the son of
    Heaven, feudal princes, Great officers, and officers; prohibitions on unauthorized
    sacrifices; appropriate sacrificial animals by rank; restrictions on a son of
    an inferior harem member offering family sacrifice; and ritual names for sacrificial
    animals, foods, water, spirits, jade, and silks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory synopsis states that Part III includes rules about remonstrating,
    asking about age and wealth, sacrifices, terms for deaths and relatives, looking
    at others, executing orders, entertainments, presents, and sending daughters to
    harems.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Replies about age are prescribed differently by rank: the son of Heaven is
    described by robe length; a state ruler by ability or inability to attend ancestral
    temple services and altars of land and grain; lower-ranked sons by ability to
    drive, convey salutations or messages, or carry firewood.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Replies about wealth are also prescribed by rank: a state ruler by territory
    and productions of hills and lakes; a Great officer by allotted lands, labor support,
    and not needing to borrow sacrificial vessels or dresses; an officer by number
    of carriages; and a common man by number of animals kept.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The son of Heaven sacrifices or presents oblations to Heaven and Earth, the
    spirits of the four quarters, the spirits of hills and rivers, and offers the
    five sacrifices of the house during the year.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: 'Feudal princes, Great officers, and officers have more limited sacrifices:
    feudal princes to their own quarter, its hills and rivers, and the five sacrifices
    of the house; Great officers to the five sacrifices of the house; and officers
    to their ancestors.'
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage forbids resuming an abolished sacrifice or abolishing an established
    sacrifice without proper authority; an improper sacrifice that is nevertheless
    offered is called licentious and brings no blessing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Sacrificial victims are assigned by rank: the son of Heaven uses a pure unmixed
    ox of one color; a feudal prince a fatted ox; a Great officer an ox selected for
    the occasion; and an officer a sheep or pig.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The son of an inferior member of the harem cannot offer sacrifice to his grandfather
    or father unless, if compelled to do so, he reports it to the honoured son, the
    head of the family.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rules for ancestral temple sacrifices assign special names to victims and
    offerings, including ox, pig, sucking-pig, sheep, cock, dog, pheasant, hare, dried
    flesh, fish, water, spirits, grains, paddy, scallions, salt, jade, and silks.
  category: speech
  evidence_refs:
  - ev:9
