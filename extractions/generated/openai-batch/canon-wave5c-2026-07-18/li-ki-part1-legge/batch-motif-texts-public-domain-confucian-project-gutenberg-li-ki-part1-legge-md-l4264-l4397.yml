canonical_text:
  quote: ''
  summary: The passage gives ritual prescriptions for chariot driving, carriage behavior,
    deference to sacrificial victims and ancestral temples, use of the ruler’s carriage
    and horses, carrying objects belonging to superiors, presenting jade rank-symbols,
    bodily posture before a lord, and avoidance of certain personal names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A driver is instructed to hold his hands differently when driving a woman
    and when driving the ruler of a state; before the ruler, the driver’s head is
    bent down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ruler of a state is told not to ride in a one-wheeled carriage, and carriage
    occupants are told not to cough loudly or point irregularly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the capital, horses should be touched gently with the brush-end of the
    switch, not driven to speed, and the dust should not fly beyond the ruts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ruler of a state should bend toward the cross-board when meeting a sacrificial
    victim and should dismount when passing the ancestral temple.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A great officer or other officer should descend at the ruler’s gate and bend
    forward to the ruler’s horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note explains that the left seat in a carriage was left vacant for the ruler’s
    spirit and identifies the vehicle as a Soul Carriage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A minister riding in one of the ruler’s carriages must wear court robes, have
    the whip in the carriage without using it, avoid having the strap handed to him,
    and bow toward the cross-board from the left place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An officer walking the ruler’s horses should do so in the middle of the road
    and is punishable for trampling their forage or inspecting their teeth to calculate
    their age.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Objects carried with both hands should be held at heart level, while objects
    carried with one hand should be held at girdle level.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Objects belonging to higher-ranked persons are carried at higher body levels
    than objects belonging to lower-ranked persons.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: When holding an article belonging to his lord, a person should behave as though
    the object is difficult to sustain; silk or jade rank-symbols are to be covered
    by the left hand, and the walker should trail his heels like carriage wheels.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A minister should stand with his back curved like a sounding-stone, and his
    pendants should hang lower or more forward than those of his lord.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A jade symbol presented on a mat remains exposed, while one without a mat
    is covered with the sleeve of the outer robe.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A ruler of a state should not call his highest ministers or two noble ladies
    by their personal names; a Great officer should not call by name an officer formerly
    employed by his father.
  category: speech
  evidence_refs:
  - ev:12
