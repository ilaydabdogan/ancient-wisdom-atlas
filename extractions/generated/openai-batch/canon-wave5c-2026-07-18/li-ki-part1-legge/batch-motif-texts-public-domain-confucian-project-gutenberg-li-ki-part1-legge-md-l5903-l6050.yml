  taxonomy_refs:
  - sacrifice
  basis: The passage mentions sacrificial flesh from mourning rites for Yen Yiian
    being received and eaten by Confucius.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The sacrifice is part of mortuary ritual; the passage does not elaborate
    a mythic sacrificial narrative.
- id: motif:3
  label: Embodied mourning code
  taxonomy_refs: []
  basis: The hand position of Confucius and the disciples is governed by mourning
    status and corrected according to ritual convention.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This motif is inferred as a recurrent ritual pattern, not a taxonomy-listed
    motif family.
- id: motif:4
  label: Premonition of death through symbolic song and dream
  taxonomy_refs: []
  basis: Confucius sings images of collapse and withering, reports a dream involving
    offerings to the dead, predicts his death, then becomes ill and dies after seven
    days.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage supports a death premonition pattern but does not frame it
    as prophecy from a deity or as afterlife travel.
- id: motif:5
  label: Ancestral mortuary customs and descent identity
  taxonomy_refs: []
  basis: Confucius explains Hsia, Yin, and Kau mortuary placements, identifies himself
    as descended from Yin, and interprets his dream in relation to Yin custom.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is more a ritual-historical pattern than a mythic motif; no historical-contact
    claim is made.
- id: motif:6
  label: Teacher mourned as father without formal mourning dress
  taxonomy_refs: []
  basis: 3ze-kung proposes that the disciples mourn Confucius as if mourning a father,
    but wear no mourning dress, based on Confucius’s own precedents.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage concerns ritual analogy and teacher-disciple relationship
    rather than divine parent-child motif.
- id: motif:7
  label: Composite funerary commemoration from multiple ancient styles
  taxonomy_refs: []
  basis: The ornaments for Confucius combine features attributed to Kau, Yin, and
    Hsia.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage lists material customs; symbolic meaning beyond commemoration
