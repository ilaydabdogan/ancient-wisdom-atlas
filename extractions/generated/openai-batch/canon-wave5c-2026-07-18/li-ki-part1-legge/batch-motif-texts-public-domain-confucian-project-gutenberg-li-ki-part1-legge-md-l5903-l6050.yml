literal_observations:
- id: obs:1
  text: Confucius observes a son following his father’s coffin to the grave and praises
    the son’s management of the mourning rite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son is described as going as if full of eager affection and returning
    as if in doubt.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacrificial flesh from mourning rites for Yen Yiian is sent to Confucius;
    he receives it, plays his lute, and then eats it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Confucius stands with his hands joined across his breast with the right hand
    uppermost; the disciples imitate him, then change after he explains that his posture
    is because he is mourning an elder sister.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Confucius rises early, trails his staff, moves slowly near the door, and sings
    of a mountain crumbling, a beam breaking, and a wise man withering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 3ze-kung interprets Confucius’s song as a sign that the Master may be about
    to become ill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius describes different ancient placements for dressing and coffining
    the body among Hsia, Yin, and Kau customs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Confucius says he dreamed of sitting between two pillars with offerings to
    the dead beside him and then says he apprehends that he is about to die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After speaking of his dream and expected death, Confucius takes to his bed,
    is ill for seven days, and dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Confucius’s mourning rites, the disciples are uncertain about what dress
    to wear; 3ze-kung advises mourning him as a father but without mourning dress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kung-hst Zih makes ornaments of commemoration for Confucius using elements
    attributed to Kau, Yin, and Hsia styles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kung-ming i makes ornaments of commemoration for 3ze-kang, including a carnation-colored
    plain silk pall with ant clusters at the four corners.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Confucius instructs that a son facing the killer of his father or mother should
    live austerely, avoid office, not share the same heaven with the slayer, and fight
    immediately if meeting him in public.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'Confucius gives a different rule for the killer of a brother: one may take
