canonical_text:
  quote: ''
  summary: 'The passage gives late-autumn and first-winter calendrical prescriptions:
    orders concerning cold weather, music, sacrifices, taxation for ritual needs,
    royal hunting and martial instruction, offerings, seasonal natural changes, judicial
    and welfare actions, ritual food, consequences of performing the wrong seasonal
    procedures, and the correlative attributes of the first winter month.'
  language: English
  quote_policy: summarized
