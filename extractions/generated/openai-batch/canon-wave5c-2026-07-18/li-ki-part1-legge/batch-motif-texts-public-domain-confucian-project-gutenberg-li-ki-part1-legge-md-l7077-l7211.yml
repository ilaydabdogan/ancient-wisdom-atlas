canonical_text:
  quote: ''
  summary: 'The passage records several mourning-related cases and ritual explanations:
    duke Awang’s mourning for a king’s married daughter; duke Mu’s condolence message
    to the exiled son of duke Hsien and the son’s refusal to seek political advantage
    during mourning; explanations of gestures of grief; the origin of a coffin curtain
    custom; and ritual meanings of calling back the soul, filling the mouth of the
    dead, using an inscription banner, keeping or removing spirit tablets, and placing
    offerings in plain vessels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duke Awang of Lu wore nine months’ mourning for the king’s daughter who had
    been married to a marquis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Duke Mu of Qin sent a messenger to condole with duke Hsien’s exiled son and
    advised that the moment could be used for losing or gaining a state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fan, the exiled son’s maternal uncle, advised him to decline the political
    opening and to treat loving regard for his father as his remaining precious possession.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The exiled son replied that, with his father dead and himself in banishment,
    he should not think of any other thing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The exiled son laid his head to the ground, did not bow to the visitor, wailed,
    arose, and did not enter private conversation with the visitor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Duke Mu interpreted the exiled son’s gestures as showing that he did not claim
    succession, loved his father, and put aside gain.
