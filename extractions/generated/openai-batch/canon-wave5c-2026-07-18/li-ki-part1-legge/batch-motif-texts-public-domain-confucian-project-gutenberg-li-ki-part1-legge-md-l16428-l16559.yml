canonical_text:
  quote: ''
  summary: The passage includes a note distinguishing a ruler's entrusted care of
    the state from an officer's services, then describes right social relations, truthful
    speech, harmony, and the need for rules of propriety to regulate feelings and
    hidden desires. It then gives a cosmological account in which Man is produced
    from Heaven and Earth, dual natural forces, souls, and the five elements. Heaven
    and Earth govern light and dark forces, celestial and terrestrial forms, and cyclical
    correspondences among elements, seasons, the moon, musical notes, flavours, colours,
    and robes. Man is described as the heart and mind of Heaven and Earth and the
    visible embodiment of the five elements.
  language: English translation with embedded French and translator notes
  quote_policy: summarized
