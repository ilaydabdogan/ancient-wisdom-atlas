  summary: The passage gives commentary on the duke of Kau’s regency and the young
    king, describes instruction of the heir-son in duties between father and son,
    ruler and minister, and old and young, and then sets out ritual rules for royal
    and princely kin at court, in the ancestral temple, at funerals, at feasts, during
    military or public duties, and in announcements to ancestral shrines.
  language: English
  quote_policy: summarized
