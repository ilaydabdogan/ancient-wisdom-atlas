  summary: The passage describes the second month of autumn through celestial, ritual,
    sensory, and administrative correspondences. It lists natural signs, the Son of
    Heaven's autumnal residence, vehicles, clothing, foods, and offerings, care for
    the aged, rules for robes and punishments, inspection of sacrificial victims,
    rites against pestilence, construction and storage activities, wheat-sowing, equinox
    calibration of measures, market regulation, and the need for undertakings to conform
    to sun-defined seasonal periods.
  language: English
  quote_policy: summarized
