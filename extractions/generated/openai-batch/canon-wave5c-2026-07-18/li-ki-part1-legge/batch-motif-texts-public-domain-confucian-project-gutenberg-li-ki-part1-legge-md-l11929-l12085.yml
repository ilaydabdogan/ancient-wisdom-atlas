canonical_text:
  quote: ''
  summary: 'The passage gives month-by-month summer regulations: officials are ordered
    to advance worthy men, protect growth, encourage agricultural labor, avoid destructive
    works and major hunts, offer first-fruits, gather herbs, handle light punishments,
    collect cocoons for sacrificial robes, and hold court entertainments. It warns
    that observing proceedings of other seasons in the first month of summer would
    cause ecological and social calamities. It then lists second-month summer correspondences,
    omens, royal regalia, musical preparations, and sacrifices to spirits and to God
    for rain.'
  language: English translation
  quote_policy: summarized
