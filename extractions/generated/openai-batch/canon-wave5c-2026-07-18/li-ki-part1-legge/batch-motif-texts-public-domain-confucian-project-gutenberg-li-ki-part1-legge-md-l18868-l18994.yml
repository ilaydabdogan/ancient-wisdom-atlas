canonical_text:
  quote: ''
  summary: 'The passage explains marriage rites and their ritual meanings: the bridegroom
    personally meets and leads the bride; presents are exchanged before the couple
    sees each other; the bridegroom assists the bride at the carriage; husband and
    wife are ordered through following and leadership; the ceremony is linked with
    spiritual beings, paired natural influences, ancestors, land-and-grain altars,
    shared sacrificial food, and post-marriage service to the husband’s parents. It
    also notes the ritual absence of music and congratulation at marriage. Translator
    notes discuss variant readings and translation difficulties.'
  language: English translation with French translator notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gentleman goes in person to meet the bride, with the man taking initiative
    rather than the woman; the passage relates this to strong and weak, heaven and
    earth, and ruler and subject.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Presents are interchanged before the parties see each other, and the passage
    says this reverence illustrates a distinction between man and woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents an ordered sequence in which distinction between husband
    and wife leads to affection between father and son, then righteousness, ceremonies,
    and universal repose; absence of distinction and righteousness is called the way
    of beasts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom stands by the bride’s carriage and hands her a strap to help
    her mount, showing affection and seeking to bring her near.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In leaving the great gate of the bride’s father’s house, the bridegroom precedes
    and the bride follows; the passage says this begins the right relation of husband
    and wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that a woman follows her father and elder brother in youth,
    her husband when married, and her son after her husband dies; it also defines
    man as a supporter who should lead others by wisdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dark-coloured cap, fasting, and vigil are said to make the marriage ceremony
    like service of spiritual beings and like the meeting of bright/developing and
    receding influences in nature.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rite is said to give a lord for the altars to the spirits of land and
    grain and successors to the forefathers of the past, and therefore calls for utmost
    reverence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Husband and wife ate together from the same victim, declaring that they were
    of the same rank; the wife’s rank and seating position are tied to her husband’s
    position.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old sacrificial practice used earthenware and gourd vessels, and the kings
    of the three dynasties used those vessels when instituting partaking of the victim.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the day after marriage, the wife washed her hands, prepared and presented
    a sucking-pig to her husband’s parents, ate what remained after them, and descended
    by the east steps while they descended by the west steps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The marriage ceremony did not employ music and had no congratulation; the
    passage relates this to separation from parents and to one generation succeeding
    another.
  category: other
  evidence_refs:
  - ev:9
