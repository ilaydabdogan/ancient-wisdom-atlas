  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: For presents, women use fruits, strings of dried meat, jujube dates, and chestnuts.
  category: object
  evidence_refs:
  - ev:6
- id: obs:17
  text: When presenting a daughter to the household of the Son of Heaven, a ruler
