canonical_text:
  quote: ''
  summary: The passage prescribes rank-specific terms for death, corpse placement,
    and burial; sacrificial and posthumous names for kin; rules for gaze, speech,
    and conduct at court; restrictions for great entertainments; rank-, setting-,
    age-, and gender-specific presents of introduction; and formulae for presenting
    a daughter to the household of the Son of Heaven, a ruler, or a Great officer.
    A translator's footnote notes an alternate rendering of 'great entertainments'
    as a great sacrifice but says the adopted meaning is supported by the cited editors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage assigns different expressions for death to the Son of Heaven,
    a feudal prince, a Great officer, an ordinary officer, and a common man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A corpse on a couch has one designated name, and when placed in the coffin
    it receives another designation glossed as being in the long home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives separate terms for the death of a winged fowl, a quadruped,
    and a person killed by an enemy in battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In sacrifice, grandfather, grandmother, father, mother, and husband receive
    elevated relational titles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Living relatives are called father, mother, and wife, while after death they
    receive different names translated as the completed one, the corresponding one,
    and the honoured one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Death in old age is named as a finished course, while early death is named
    as being unsalaried.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'Rules for where to look at a person vary by rank: the Son of Heaven avoids
    looking above the collar or below the girdle, while lower ranks have different
    permitted sight lines.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Looks directed upward to the face, below the girdle, or askance are said to
    denote pride, grief, or villainy respectively.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: When official business is ordered, it should be diligently performed, and
    speech in each office or place should concern the business proper to that place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At court, the passage forbids talk about dogs and horses and criticizes looking
    about after the audience is over.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Court conversation is required to follow propriety, with questions and answers
    formed accordingly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: For great entertainments, there should be no consultation of the tortoise-shell
    and no great display of wealth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Presents of introduction differ by rank, from black millet spirits for the
    Son of Heaven through jade, lamb, goose, pheasant, and duck for lower ranks.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Lads are to bring their article and withdraw.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the open country or army, ordinary introductory presents are not used;
