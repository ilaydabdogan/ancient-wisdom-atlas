canonical_text:
  quote: ''
  summary: The passage recounts the Han-period recovery, collection, preservation,
    and textual formation of ritual and administrative writings associated with the
    Li books. It emphasizes King Hsien of Ho-kien as a royal patron who gathered old
    tablets, preserved originals, rewarded donors, and helped transmit ancient texts.
    It also describes the incomplete K4u Li/K4u Kwan, later restoration of a missing
    section by Hsin, the institutional care of the text, and the accumulation of records
    that formed the germ of the Li Ki.
  language: English
  quote_policy: summarized
