canonical_text:
  quote: ''
  summary: The passage gives rules for family hierarchy, especially a daughter-in-law's
    deference to parents-in-law and subordinate cousins' deference to the representative
    chief of the clan. It prescribes offering gifts and superior goods to senior kin,
    assisting at ancestral sacrifice after purification, and then lists ritual foods,
    beverages, condiments, seasonal flavor correspondences, and appropriate pairings
    of foods, meats, and seasons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A daughter-in-law should not withdraw to her own apartment without being told
    and should ask leave from her parents-in-law for what she is about to do.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son and his wife are instructed to have no private goods, animals, or vessels
    and not to borrow from or give anything to another person on their own authority.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the wife receives food, clothing, cloth or silk, a girdle handkerchief,
    or an iris or orchid, she should offer it to her parents-in-law before keeping
    or redirecting it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Legitimate-line eldest cousins and their brothers should reverently serve
    the representative chief of the family and his wife, even if the cousins are richer
    or of higher official rank.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cousins with many chariots and footmen should stop them outside and enter
    the chief's house in a simpler style with few followers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Younger cousins who receive vessels, robes, furs, coverlets, carriages, or
    horses should offer the best of them to the chief and use inferior items themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A wealthy cousin should prepare two sacrificial victims, present the better
    one to the chief, purify with his wife, and assist reverently at the chief's ancestral
    temple sacrifice before offering a private sacrifice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage lists grains and prepared meats, including kinds of millet, rice,
    maize, soups, roasts, pickles, sliced meats, minced fish, and game birds or animals.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage lists drinks and confections, including strained and unstrained
    must, thin beverages, clear wine, white wine, dried cakes, and rice-flour scones.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Specific relishes, stuffings, sauces, brines, and condiments are assigned
    to particular soups, meats, fish, tortoise, fruits, and preserved items.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Condiments for grain food, soup, sauces, and beverages are correlated with
    spring, summer, autumn, and winter respectively.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Sour, bitter, acrid, and salt flavors are said to predominate in spring, summer,
    autumn, and winter respectively, with due proportions of unctuous and sweet tastes.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage pairs particular grains or plants with meats or fish, and assigns
    certain animal foods and suets to particular seasons.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The final list includes dried and uncooked meats, birds, insects, lichens,
    nuts, fruits, vegetables, ginger, and cinnamon.
  category: object
  evidence_refs:
  - ev:14
