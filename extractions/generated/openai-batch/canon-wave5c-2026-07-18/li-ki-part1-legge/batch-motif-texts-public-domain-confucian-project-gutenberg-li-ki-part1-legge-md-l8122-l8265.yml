canonical_text:
  quote: Oppressive government is more terrible than tigers.
  summary: 'The passage presents several ritual and moral anecdotes: a bereaved woman
    explains that three male relatives were killed by tigers but stays because there
    is no oppressive government; Kâu Fang answers Duke Ai on how rulers gain trust
    and reverence; rules for mourning a father are stated; Ki-zze of Yen-ling buries
    his son with restrained rites and speaks of flesh returning to earth and the soul
    going everywhere; Yung Ai disputes condolence protocol involving jade placed in
    a dead ruler’s mouth; Zze-sze corrects where he wails for his remarried mother;
    and rites after the death of the Son of Heaven are described.'
  language: English
  quote_policy: quoted
