candidate_motifs:
- id: motif:1
  label: Oppressive rule as worse than natural predation
  taxonomy_refs:
  - wisdom
  basis: The Master explicitly makes a moral-political lesson from the woman’s preference
    for tiger danger over oppressive government.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a didactic political aphorism in a ritual text, not a mythic beast-slaying
    episode.
- id: motif:2
  label: Inner sincerity over outward ritual or political forms
  taxonomy_refs:
  - wisdom
  - covenant
  basis: Kâu Fang’s reply states that ruins, graves, altars, temples, proclamations,
    and covenants do not secure mourning, reverence, trust, or bonds without moral
    qualities of the heart.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage uses historical and ritual examples rhetorically; it does
    not narrate a covenant myth.
- id: motif:3
  label: Regulated mourning restrained by obligations to the dead and descendants
  taxonomy_refs: []
  basis: The mourner is told not to prioritize his own resting-place and not to endanger
    his life, because the father’s tablet and posterity remain at issue.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a ritual norm rather than a narrative motif.
- id: motif:4
  label: Body returns to earth while soul moves freely
  taxonomy_refs: []
  basis: At the grave, Ki-zze says bones and flesh return to earth and the soul in
    its energy can go everywhere.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a brief statement of post-mortem condition but no detailed
