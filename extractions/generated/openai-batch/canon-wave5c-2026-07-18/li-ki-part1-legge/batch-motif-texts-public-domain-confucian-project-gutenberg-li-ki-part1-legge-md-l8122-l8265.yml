    faith, sincerity, and guilelessness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A mourner for a father is instructed not to focus on the discomfort of his
    own resting-place and not to emaciate himself so far that his life is endangered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ki-zze of Yen-ling buries his eldest son between Ying and Po, with a grave
