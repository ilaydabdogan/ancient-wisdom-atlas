- id: obs:4
  text: Duke Ai seeks an interview with Kâu Fang by bringing an introductory present,
    but Kâu Fang refuses the interview.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kâu Fang’s reply contrasts ruins, graves, altars, ancestral temples, proclamations,
