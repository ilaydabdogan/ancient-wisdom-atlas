  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A great officer at seventy should resign charge of affairs; if resignation
    is not allowed, he is to receive a stool and staff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An aged officer travelling on service is to have the attendance of his wife
    and, when going to another state, is to ride in an easy carriage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In another state, the aged officer styles himself as the old man; in his own
    state, he calls himself by his name and may tell others of his state's old institutions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person going to take counsel with an elder must carry a stool and staff
    for the elder's use and should answer questions with an acknowledgment of incompetency.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sons are instructed to warm their parents' bed in winter, cool it in summer,
    adjust things in the evening, inquire about health in the morning, and avoid quarrelling
    with companions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A son who has received three gifts from the ruler and declines the carriage
    and horses is publicly proclaimed filial, loving, virtuous, and true by different
    social groups.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A son should not approach, withdraw from, or address an intimate friend of
    his father without being prompted or questioned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A son going abroad must inform his parents where he is going and present himself
    before them when he returns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A son's travel should be in a fixed region and his occupation should be reputable.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In ordinary conversation with his parents, a son should not use the term old
    with reference to them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A person should serve someone twice his age as a father, someone ten years
    older as an elder brother, and walk slightly behind someone five years older.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: When five people sit together, the eldest should have a separate mat.
  category: object
  evidence_refs:
  - ev:7
