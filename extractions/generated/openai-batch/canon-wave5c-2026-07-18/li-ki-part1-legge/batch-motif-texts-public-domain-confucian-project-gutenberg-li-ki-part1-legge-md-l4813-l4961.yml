canonical_text:
  quote: ''
  summary: The passage gives rules of ritual address and rank for the Son of Heaven,
    feudal princes, chiefs, officers, spouses, children, and messengers. It defines
    court audience formations, interstate meetings, friendly inquiries, solemn declarations,
    covenants using a victim, death and spirit-recall formulas, remonstrance, tasting
    medicine for a sick ruler or parent, and the rule that men should be compared
    only within the same class of circumstances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rulers and chiefs receive different titles depending on whether they enter
    the state of the Son of Heaven, whether they are inside or outside their own territories,
    and whether they share the Son of Heaven's surname.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs of the I, Ti, Zung, and Man peoples are called counts, while subordinate
    princelets entering the Son of Heaven's state are styled as named persons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the autumnal audience, the Son of Heaven stands with his back to a screen
    bearing axe-head figures, and the princes face north.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the spring audience, the Son of Heaven stands between the door and the
    screen; dukes face east and feudal princes face west.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spontaneous interview between feudal princes is called a meeting; a prearranged
    open-place interview is called an assembly; a binding to mutual faith is a solemn
    declaration, and when a victim is used it is called a covenant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A feudal prince introduced to the Son of Heaven is announced as the Son of
    Heaven's subject and speaks of himself to the people with a humility formula.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mourning and sacrifice contexts alter a prince's titles; his death is described
    as disappearance, and his spirit is called back with a return formula.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: 'Expected demeanor varies by rank: majesty for the Son of Heaven, gravity
    for princes, regulated composure for Great officers, easy alertness for inferior
    officers, and simplicity and humility for common people.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Partners and women are named according to the rank of the man, and noble women
    use prescribed self-deprecating forms of address.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children call themselves by their names to parents; officers and messengers
    use prescribed title formulas; the Son of Heaven is not spoken of as going out
    of his state, and a living feudal prince is not normally called by name.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A minister should remonstrate with his ruler three times and then leave if
    unheard; a son remonstrating with parents three times should then continue with
    loud crying and tears.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When a ruler or parent is ill and must drink medicine, the minister or son
    first tastes it; medicine from a doctor without at least three generations of
    family practice should not be taken.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that men should be compared only when their circumstances
    and conditions are of the same class.
  category: other
  evidence_refs:
  - ev:9
