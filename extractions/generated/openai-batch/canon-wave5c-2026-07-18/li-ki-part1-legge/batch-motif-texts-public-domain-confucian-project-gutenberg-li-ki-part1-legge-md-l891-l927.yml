  quote: ''
  summary: An introductory passage explains that Book II is named after Than Kung
    because his name appears at its opening, describes him as a native of Li about
    whom little else is known, and summarizes the book as chiefly concerned with mourning
    rites, views on death, and historical incidents involving Confucius and others.
    It notes that some commentators, especially the K/ien-lung editors, rejected many
    incidents as legendary or fabulous, but the passage values them for illuminating
    Confucius, his disciples, and their mourning for him. It also mentions 3ze-yi
    as an eminent member of Confucius' school and reports a suggestion that the book
    may have been compiled by his disciples.
