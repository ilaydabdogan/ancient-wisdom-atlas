canonical_text:
  quote: ''
  summary: 'The passage describes mourning and interment rites: preparation and use
    of a spirit tablet, offerings to the departed, regulated expressions of grief,
    return from the grave to ancestral spaces, burial toward the north because the
    dead go to a dark region, presentation of gifts to the dead, the sacrifice of
    repose, ending of continuous wailing, and placement of the departed''s tablet
    near that of an ancestor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An inscription with the deceased's surname, name, and rank is associated with
    a wooden tablet set by the coffin and later moved near the coffin pit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note describes the tablet as a resting-place for the spirit, with offerings
    set near it morning and evening; after interment it is burned and replaced by
    a permanent tablet used in family sacrifices.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In sacrifices after interment, the principal mourner uses full ornamentation
    but is described as acting from a pure and reverent heart rather than certain
    knowledge that the spirit enjoys the offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women beat the breast and men leap as extreme expressions of grief, but the
    number of such acts is limited by graduated rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Baring the shoulders, binding up the hair with sackcloth, and removing ornaments
    mark changes and gradations in grief.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At interment, a plain white silk cap and a dolichos-fibre headband are used
    as suitable for intercourse with the departed in spirit-state; the passage also
    notes different cap customs for Kau and Yin.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief mourner, the presiding wife, and the steward take gruel at the ruler's
    order to prevent illness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On returning from the grave to wail, the son ascends the hall of the ancestral
    temple, and the presiding wife enters the chamber.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Condolences are presented when the son returns from the grave and wails; the
    passage says his grief is intense because his father is no longer seen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Yin presented condolences at the grave, while the Kau presented them when
    the son had returned and was wailing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Burial north of the city and placing the dead with the head turned north are
    described as common practice of the three dynasties because the dead go to the
    dark region.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the coffin is lowered into the grave, the chief mourner presents the
    ruler's gifts to the dead, and an officer of prayer gives notice of the sacrifice
    of repose to the personator of the departed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After returning and wailing, the chief mourner and officer inspect the victim;
    other officers set out a stool, mat, and offerings on the left of the grave, and
    the sacrifice of repose is offered at midday.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The sacrifice of repose is offered on the day of interment because the departed
    should not be left a single day without a place to rest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the interment day, previous offerings by the coffin are exchanged for the
    sacrifice of repose, continuous wailing ends, and the business is declared finished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Mourning sacrifices are exchanged for a sacrifice of joy, and on the next
    day the departed's spirit tablet is placed next to that of his grandfather.
  category: sequence
  evidence_refs:
  - ev:8
