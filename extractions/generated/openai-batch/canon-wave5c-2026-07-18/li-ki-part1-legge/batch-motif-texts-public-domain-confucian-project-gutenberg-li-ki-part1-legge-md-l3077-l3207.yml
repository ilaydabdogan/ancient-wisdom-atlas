canonical_text:
  quote: ''
  summary: The passage gives ritual and ethical instructions for a son, boy, student,
    officer, host, and guest. It covers filial conduct toward living or absent parents,
    restrictions on danger, property, death-promises, mourning-related dress, youth
    etiquette before elders and teachers, proper behavior at roads, walls, doors,
    mats, shoes, thresholds, ruler's gates, and guest precedence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed person is told not to occupy middle positions on a mat, road,
    or doorway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instructed person is told not to regulate the quantity of rice and other
    viands at an entertainment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instructed person is told not to act as personator of the dead at sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The son should behave as if hearing his parents when there is no voice and
    seeing them when they are not present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A filial son is told not to ascend a height, approach the verge of a depth,
    do things in the dark, or attempt hazardous undertakings, because of concern about
    disgracing his parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While his parents are alive, a son will not promise a friend to die with or
    for him and will not have wealth that he calls his own.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Dress borders are restricted according to family status: a son with living
    parents should not wear a white border, and an orphan son taking his father''s
    place should not wear a variegated border.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy should not be allowed to see an instance of deceit, and a lad is given
    rules about clothing, straight posture, and attentive hearing.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When held by an elder, the youth should hold the elder's hand with both hands;
    in a described speaking posture of the elder, the youth should cover his mouth
    while answering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When following or meeting a teacher on the road, the youth should not leave
    the road to speak with another, should hasten to the teacher, stand with hands
    joined, answer if addressed, and withdraw if not addressed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After ascending a city wall, one should not point or call out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Entrance etiquette includes raising the voice before going up to a hall, listening
    for voices when shoes are outside, entering with eyes cast down, preserving the
    state of the door, avoiding shoes and mats, and answering carefully when seated.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A great officer or officer should pass through the ruler's doors on the right
    of the middle post and should not tread on the threshold.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A host entering with a guest should give place to the guest at every door.
  category: relationship
  evidence_refs:
  - ev:12
