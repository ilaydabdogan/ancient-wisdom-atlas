canonical_text:
  quote: ''
  summary: Prescriptive rules cover war and peace chariots, banners and military emblems,
    record-keeping, vengeance obligations, public defense and cultivation, sacrificial
    conduct and disposal of ritual objects, and avoidance of personal names in kinship,
    official, and household contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fighting chariot lacks a cross-board for bowing; a war chariot displays
    its banner fully, while a peace chariot keeps the banner folded around the pole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A recorder is instructed to carry writing implements in his carriage, and
    his subordinates carry recorded words of former covenants and other documents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Different signs or targets in front of the force are matched with different
    flags: water with a green bird, dust with screaming kites, chariots and horsemen
    with wild geese, troops with a tiger skin, and a beast of prey with a leopard
    skin.'
  category: relationship
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:4
  text: On the march, banners with the Red Bird, Dark Warrior, Azure Dragon, White
    Tiger, and Pointer of the Northern Bushel are assigned to front, rear, left, right,
    and center positions of the host.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:5
  text: Advance, retreat, left-side arrangements, and right-side arrangements each
    have rules and proper officers assigned to them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rules state different obligations toward enemies who have slain one's father,
    brother, or intimate friend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Many nearby ramparts are said to disgrace high ministers and great officers,
    while neglected open country is said to disgrace the responsible officers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Participants in sacrifice are told not to show indifference; worn sacrificial
    robes are burned, worn vessels, tortoise-shell, divining stalks, and a dead victim
    are buried, and participants remove their own offering stands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rules for avoiding personal names vary by mourning stage, living or deceased
    parents, family and official contexts, literary reading and writing, ancestral
    temple setting, the ruler's wife, harem boundaries, and mourning duration.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person crossing a state boundary should ask about prohibitory laws, after
    entering should ask about customs, and before entering a house should ask about
    names to be avoided there.
  category: sequence
  evidence_refs:
  - ev:9
