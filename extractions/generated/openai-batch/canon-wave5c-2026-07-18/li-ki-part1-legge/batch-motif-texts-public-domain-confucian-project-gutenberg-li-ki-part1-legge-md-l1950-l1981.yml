canonical_text:
  quote: ''
  summary: 'Introductory passage to Book XXVII explaining that the title means “The
    Dykes” and that the book treats ceremonial rules and usages under the figure of
    defensive barriers. It also gives source-critical remarks: the illustrations are
    presented as if from Confucius, but the passage denies Confucian authorship, says
    the writer is unknown, and notes similarity to passages in Han scholars.'
