canonical_text:
  quote: Right in the middle ... is earth.
  summary: The passage gives a supplementary set of correspondences for earth as the
    central element, assigning it days, a divine ruler, an attending spirit, creature
    type, musical note, number, taste, smell, sacrifice, victim part, imperial location,
    regalia, food, and vessels. Translator/editorial notes explain the place of earth
    in a five-element and seasonal-correlative scheme. The passage then begins the
    first month of autumn, assigning astronomical, calendrical, divine, animal, musical,
    numerical, sensory, sacrificial, seasonal, and imperial correspondences.
  language: English
