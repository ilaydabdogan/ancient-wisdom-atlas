canonical_text:
  quote: ''
  summary: 'Introductory note to Book XXV: Confucius, returned from court and at home,
    sits with three disciples and answers questions about ceremonial usages, music,
    and government. The note also comments on the title, the name Kung-ni, related
    textual attribution, and doubts raised by a commentator about whether many sayings
    in the treatise are genuinely Confucius''s.'
