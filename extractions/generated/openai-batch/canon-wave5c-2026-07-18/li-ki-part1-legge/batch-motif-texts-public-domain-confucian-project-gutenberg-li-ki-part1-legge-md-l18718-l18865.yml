  text: A note associates tripod and stand contents, the animal victim, with Yang,
    and dish contents, tree and vegetable products, with Yin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In sacrificing to Heaven, the earth is swept and the sacrifice is presented
    on the ground because of the simplicity of an unartificial altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Suet produced through evaporation is preferred over vinegar and pickles in
    order to honor a natural product of heaven.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A knife fitted with bells is preferred to an ordinary knife; the passage places
    harmony of sound before the cutting work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first act of the capping service uses a black cloth cap associated with
    highest antiquity; after being put on once, it may be disused.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The son by the proper wife is capped by the eastern stairs; the father hands
