canonical_text:
  quote: ''
  summary: 'Introductory note to Book IV, Yüeh Ling: the editor describes arranging
    the work by seasons and months, discusses scholarly claims about its origin as
    a compilation from Lü Pu-wei’s Khun Khid rather than a work of the duke of Kau,
    reports an anecdote about a gold reward for improving Lü’s work, and explains
    the title as recording governmental proceedings in the twelve months of the year.'
  language: English
  quote_policy: summarized
