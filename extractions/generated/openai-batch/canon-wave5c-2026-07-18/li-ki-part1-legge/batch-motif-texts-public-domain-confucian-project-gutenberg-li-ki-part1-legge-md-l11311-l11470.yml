canonical_text:
  quote: ''
  summary: 'The passage gives monthly ordinances for spring: agricultural surveying
    and instruction, dance practice, sacrifice to natural domains, prohibitions on
    harming trees and young or unborn creatures, burial of exposed remains, avoidance
    of fortification and war, maintenance of cosmic and social order, and warnings
    that wrong seasonal governance causes disasters. It then lists second-month correspondences
    involving stars, divine ruler, attending spirit, creatures, music, number, taste,
    smell, sacrifice, seasonal signs, and the Son of Heaven’s prescribed residence,
    vehicle, colors, and ornaments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king orders the business of husbandry to be advanced, and field inspectors
    are ordered to reside in eastward-facing lands, repair boundaries, mark paths
    and ditches, survey landforms, determine grain suitability, and instruct the people
    while joining in the work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the field business is ordered, the guiding line is first used so that
    husbandry proceeds without error.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In this month the chief director of Music is ordered to enter the college
    and practise dances with pupils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The canons of sacrifice are examined and set forth; sacrifices are ordered
    to hills, forests, streams, and meres, with care not to use female victims.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prohibitions are issued against cutting down trees and against destroying
    nests, unformed insects, creatures in the womb, very young creatures, birds just
    taking wing, fawns, or eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Congregating multitudes and beginning the rearing of fortifications and walls
    are not to be allowed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Skeletons are to be covered, and bones with flesh attached are to be buried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: No warlike operations are to be undertaken in this month; undertaking them
    is said to bring calamities from Heaven, though the explanation limits this to
    not commencing war on one’s own side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says not to change the ways of heaven, extinguish the principles
    of earth, or confound the bonds of men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: If governmental proceedings proper to other seasons are carried out in the
    first month of spring, the passage predicts unseasonable rain, premature plant
    decay, fear, pestilence, violent winds, torrential rain, mixed weed growth, destructive
    pools, injurious snow and frost, and failure of first-sown seeds to enter the
    ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: For the second month of spring, the passage assigns the sun’s position, dusk
    and dawn stars, days, divine ruler Thai Hao, attending spirit Kau-mang, scaly
    creatures, musical note, pitch-tube, number, taste, smell, sacrifice, and victim
    part.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The second month’s signs include the beginning of rain, the peach tree blossoming,
    the oriole singing, and hawks being transformed into doves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Son of Heaven occupies the Ming Tang Grand Fane, rides in a carriage with
    phoenix bells drawn by azure dragon-horses, bears a green flag, wears green robes
    and azure gems, and eats wheat.
  category: action
  evidence_refs:
  - ev:10
