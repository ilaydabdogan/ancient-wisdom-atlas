  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Grand recorder is ordered to list princes of the states according to assigned
    positions and to list victims required from them for offerings to God in great
    heaven and to the altars of land and grain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: States ruled by princes of the royal surname are ordered to supply fodder
