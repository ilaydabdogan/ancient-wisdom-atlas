canonical_text:
  quote: ''
  summary: 'The passage gives end-of-winter orders: collect thick ice into ice-houses;
    prepare seed, ploughing pairs, ploughs, and field instruments; close the year''s
    music with wind instruments; gather wood and torches for sacrifices; note the
    completion of solar, lunar, stellar, and yearly cycles; review statutes and seasonal
    proceedings for the coming year; list princes, lands, and required sacrificial
    victims and offerings; and warn that observing autumn, spring, or summer proceedings
    in the last month of winter would cause natural, social, and bodily disasters.'
  language: English
  quote_policy: summarized
