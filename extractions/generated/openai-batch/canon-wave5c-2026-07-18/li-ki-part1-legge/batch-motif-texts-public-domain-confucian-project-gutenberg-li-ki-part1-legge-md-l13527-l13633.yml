    rear apartment, and hills, forests, and famous streams.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: If autumn governmental proceedings are observed in the last month of winter,
    white dews descend too early, shelly creatures appear in monstrous forms, and
