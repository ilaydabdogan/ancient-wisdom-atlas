  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the sun has gone through all its mansions, the moon
    has completed its conjunctions, and the stars return to their places, with the
    year nearly complete and soon to begin again.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: An instruction says to attend to the business of the husbandmen and not employ
