    and prepare field instruments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief director of Music is ordered to institute a grand concert of wind
    instruments, closing the music of the year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The four Inspectors are ordered to collect and arrange faggots for wood and
