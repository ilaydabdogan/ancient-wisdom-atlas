canonical_text:
  quote: ''
  summary: The passage describes status-specific rules for childbirth, postpartum
    presentation, naming of sons and grandsons, nursing, and early childhood training.
    It also gives age-graded instruction for boys and girls, including separation,
    etiquette, clothing distinctions, and a boy’s later study with an outside master.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a child of an inferior member of the ruler’s harem was about to be born,
    the mother went to a side apartment and later, after three months, washed, put
    on court robes, and appeared before the ruler while a waiting woman carried the
    child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the mother had received special favor from the ruler, the ruler named the
    son; otherwise an officer was employed to name such children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among common people without side chambers, the husband left his bed-chamber
    during the month of confinement and occupied a common apartment, while the inquiries
    and presentation of the son followed the same pattern as previously described.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In all cases, even while the father was alive, a grandson was presented to
    the grandfather, who named him; the ceremonies matched presentation to the father,
    but without an exchange of words between the mother and grandfather.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The nurse of the ruler’s boy left the palace after three years, appeared before
    the ruler, and was rewarded; a Great officer’s son had a nurse, while an ordinary
    officer’s wife nourished her child herself.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The son of a commissioned officer and those of ranks up to the Great officer
    were presented to the father once every ten days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The eldest son of a ruler was presented before the ruler had eaten and was
    taken by the right hand; a second or other son by the proper wife was presented
    after the ruler had eaten, when the ruler laid his hand on the child’s head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the child could take its own food, it was taught to use the right hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When able to speak, a boy was taught to respond boldly and clearly, while
    a girl was taught to respond submissively and low; the boy received a leather
    girdle and the girl a silk girdle.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: At six years, children were taught numbers and the names of the cardinal points;
    at nine, they were taught how to number the days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At seven, boys and girls did not occupy the same mat or eat together; at eight,
    children were required to follow elders when passing through gates or doors and
    going to their mats, beginning instruction in yielding to others.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At ten, the boy went to an outside master, stayed overnight, learned classes
    of characters and calculation, avoided silk jacket or trousers, practiced youth
    behavior morning and evening, and was exercised in reading tablets and polite
    conversation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The translator’s note says the passage indicates no literary training for
    daughters, describing their instruction as household duties including forms and
    provision for sacrifice and worship, and notes early separation from brothers.
  category: other
  evidence_refs:
  - ev:7
