canonical_text:
  quote: ''
  summary: 'The passage explains the functions of the rules of propriety: ordering
    kinship, conduct, speech, education, government, disputes, ritual offerings, and
    social hierarchy. It contrasts propriety with merely animal speech, says sages
    framed propriety to distinguish humans from brutes, describes reciprocity in giving
    and repayment, and lists early male life stages at ten, twenty, and thirty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rules of propriety are said to determine observances toward near and remote
    relatives, settle suspicion and doubt, distinguish agreement from difference,
    and clarify right and wrong.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rules discourage pleasing others improperly, excessive words, going beyond
    measure, encroaching on or despising others, and presumptuous familiarities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cultivating one’s person and fulfilling one’s words is called good conduct;
    ordered conduct and words accordant with the right course are identified as the
    substance of propriety.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says a person should be chosen by others as a model, and that
    scholars come to learn rather than the master going out to teach.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that duty, virtue, benevolence, righteousness, training,
    oral lessons, dispute resolution, ranked social duties, service to masters, court
    and military order, official law, and ritual offerings cannot be properly completed
    without the rules of propriety.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The superior man is described as respectful, reverent, assiduous in duties,
    not exceeding them, retiring, and yielding.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The parrot and ape are described as able to speak but still remaining a bird
    and a beast.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man who observes no rules of propriety is rhetorically compared to one whose
    heart is that of a beast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that without propriety, father and son might have the same
    mate.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sages are said to have framed the rules of propriety to teach men and
    to make a distinction between men and brutes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In highest antiquity, people are said to have prized conferring good; in the
    next period, giving and repaying are said to have been attended to.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rules of propriety are said to value reciprocity; giving a gift without
    return and receiving without giving in return are both called contrary to propriety.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Observing propriety is associated with security, while not observing it is
    associated with danger; the rules are said not to be left unlearned.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Propriety is described as humbling oneself and giving honor to others, a behavior
    expected even among porters and pedlers and more fully among the rich and noble.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The rich and noble who love propriety are said not to become proud or dissolute;
    the poor and mean who love propriety are said not to become cowardly.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: At ten years old one is called a boy and goes out to school; at twenty one
    is called a youth and is capped; at thirty one is said to be mature and to have
    a wife.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: An editorial note explicitly compares the paragraph on highest antiquity with
    chapters 18 and 19 of the Tao Teh King.
  category: other
  evidence_refs:
  - ev:11
