canonical_text:
  quote: ''
  summary: Selected anecdotes and dialogues evaluate mourning conduct, corpse presentation,
    funeral gestures, offerings for the dead, wartime conduct toward sacrificial sites
    and the sick, modeled filial grief, and three-year royal mourning silence under
    the rules of propriety.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Kiang wailed for her husband in the daytime, and for her son in both
    daytime and night; Confucius approved this as knowledge of propriety.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At her son's mourning, King Kiang touched the couch where his body lay, did
    not wail, and stated that his minister-friends had not shed tears while members
    of his harem wailed loudly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Xiang ordered displayed under-clothes to be removed from the laid-out
    body of Ki Khang-ze's mother, citing rules about a wife's appearance before her
    husband's parents and the arrival of guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yi-3ze questioned the practice of leaping in mourning; 3ze-yu replied that
    ritual rules regulate and structure the display of feeling.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 3ze-yu described an emotional sequence from joy through singing, movement,
    dancing, excitement, distress, sighing, breast-beating, and leaping.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 3ze-yu said that after death people feel disgust or revulsion toward the corpse,
    so the dead are wrapped in shrouds and coffins are ornamented.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food items and offerings are set out before burial, at the grave, and after
    interment, although the dead are not seen to partake of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Wa incursion into Aan destroyed places of sacrifice and killed people
    suffering from pestilence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Grand-administrator of Aan contrasted the Wa campaign with ancient armies
    that did not destroy sacrificial places, kill pestilence sufferers, or capture
    the gray-haired.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yen Ting's mourning demeanor changed after death, after coffining, and after
    interment, each stage described as a different form of seeking, following, or
    waiting for his father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 3ze-kang asked about Kao 3ung's three-year silence; ung-ni replied that anciently
    the royal heir left affairs to the chief minister for three years.
  category: speech
  evidence_refs:
  - ev:7
