canonical_text:
  quote: ''
  summary: The passage gives age-graded rules for care, food, warmth, staff use, office,
    retirement, and exemptions; describes royal and filial nourishment of the aged;
    compares practices of earlier rulers and dynasties in entertaining elders; presents
    elders as models and sources of lessons; and gives recipes for named rich foods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ages fifty through ninety are associated with increasing bodily decline and
    needs for flesh, silk, warmth, and close sleeping assistance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Staff use is permitted in progressively wider social spaces as age increases,
    from the family at fifty to the court at eighty.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the Son of Heaven wanted to question a ninety-year-old officer, he went
    to the officer's house and had rich food carried after him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Older officers receive age-graded privileges: retiring before court ends
    at seventy, reporting monthly at eighty, and receiving daily delicate food at
    ninety.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At successive ages, a person is exempted from strength-demanding service,
    bearing arms, receiving guests, and mourning abstinences and rites.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Great officer who received rank at fifty did not personally attend school
    at sixty, resigned office at seventy, and used simplified mourning dress thereafter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The kings of the three dynasties sought notice of aged family members, and
    government service exemptions were extended to associates or family members of
    very old officers; the same is said of the blind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rulers of Yu, Hsia, Yin, and Kau are described as entertaining retired state
    elders and common elders in named schools or paired institutions.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage distinguishes caps and garments worn for ancestral sacrifice from
    garments worn when entertaining the aged.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: 3ang-yze says a filial son nourishes his aged by gladdening their hearts,
    respecting their wishes, securing comfort in house and bed-chambers, and supplying
    food and drink with loyal heart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: 3ang-yze says the filial son continues to love and reverence what his parents
    loved and reverenced through the end of his own life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The five Tis and the kings of the three dynasties take the aged as models;
    the kings additionally ask them to speak lessons, while faithful recorders preserve
    lessons or virtues.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Rich Fry and Similar Fry are prepared from pickled meat with rice or millet
    and enriched with melted fat.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: The Bake is prepared from a sucking-pig or young ram filled with dates, wrapped
    in straw and reeds, covered with clay, baked, cleaned, combined with rice-flour,
    fried in melted fat, and set in hot water with a tripod.
  category: sequence
  evidence_refs:
  - ev:12
