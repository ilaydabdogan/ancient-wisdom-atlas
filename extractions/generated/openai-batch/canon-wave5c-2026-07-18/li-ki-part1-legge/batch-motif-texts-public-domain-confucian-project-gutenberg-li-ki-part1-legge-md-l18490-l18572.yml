canonical_text:
  quote: ''
  summary: The passage explains border-sacrifice language, then describes a great
    year-end sacrifice of the Son of Heaven consisting of eight sacrifices. In the
    twelfth month, harvest products are gathered and offerings are made to agricultural
    sources, ancient superintendents, grain discoverers, field-related agencies, protective
    animals, and inventors of dykes and water-channels. A spoken petition asks for
    stable ground, orderly water, quiet insects, and weeds confined to fens. Participants
    wear white and reduced mourning dress to escort the closing year to its grave.
  language: English
  quote_policy: summarized
