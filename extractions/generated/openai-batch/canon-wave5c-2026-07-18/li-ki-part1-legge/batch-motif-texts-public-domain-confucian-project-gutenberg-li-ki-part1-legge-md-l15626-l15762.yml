canonical_text:
  quote: ''
  summary: 'The passage describes a ceremonial visit of the son of Heaven to the college:
    students are assembled by a dawn drum, officers perform sacrifices to former masters
    and sages, and the sovereign proceeds to a ritual nourishing of the aged. Offerings,
    seats, food, liquor, song, music, dance, and conversation are arranged to express
    filial care, virtue, and social duties. The king then charges nobles and officers
    to nourish the aged and young in their eastern schools. A following record describes
    king Wan’s son and heir inquiring after his father morning and evening, inspecting
    his food, and fasting and wearing dark-coloured dress when his father is ill.'
  language: English translation
  quote_policy: summarized
