canonical_text:
  quote: ''
  summary: The passage gives Confucian ritual remarks on archery, fasting, and errors
    in sacrifice; describes Shé land-altars, offerings to earth and heaven, communal
    participation, seasonal burning and hunting drills, and the Son of Heaven's fire
    rite and border sacrifice at the longest day honoring Heaven with the sun as chief
    object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says that an officer required to shoot, if unable, declines on grounds
    of illness, referring to the bow suspended at the left of the door at his birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says that with three days of fasting pending, a person who fasts
    the first day should still fear insufficient reverence, and he questions beating
    drums on the second day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius identifies as errors the next-day repetition of sacrifice inside
    the Kû gate, searching for spirits in the eastern quarter, and holding the morning
    market in the western quarter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the Shé, sacrifice is made to the spirits of the land; the tablet carries
    the darker and retiring influence of nature; the ruler faces south at the north
    wall; and a kid day is used.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The great Shé altar of the Son of Heaven is open to hoarfrost, dew, wind,
    rain, and the influences of heaven and earth; a perished state's Shé altar is
    roofed, and the Po altar has a north opening for dim and cold moonlight.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Shé sacrifices, the earth is dealt with as if it were a spirit; earth supports
    all things, heaven displays brilliant signs, and people are taught to honor heaven
    and return good to earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Families, villages, towns, and states provide offerings at household or Shé
    altars, including participation from each house and vessels of rice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the last month of spring, after the fire star appears, grass and brushwood
    are set on fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the burning, chariots and men are reviewed and counted, and the ruler
    addresses and drills squadrons before the Shé altar.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: During the hunt, the ruler watches that hunters do not break the rules, and
    the passage states that such discipline leads to victory in battle and blessing
    in sacrifice.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: On tours to the four quarters, the Son of Heaven first rears and fires a pile
    of wood; at the great border sacrifice he welcomes the longest day in thanksgiving
    to Heaven, with the sun as the chief object considered.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
