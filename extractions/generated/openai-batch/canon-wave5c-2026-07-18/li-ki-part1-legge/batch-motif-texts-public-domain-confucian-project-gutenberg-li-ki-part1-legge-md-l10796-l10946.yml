  - ev:6
- id: obs:8
  text: Younger men kept behind older men, friends did not pass one another when travelling
    the same way, and younger carriers bore burdens for elders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man with grey hair was not allowed to carry anything, even if he could carry
