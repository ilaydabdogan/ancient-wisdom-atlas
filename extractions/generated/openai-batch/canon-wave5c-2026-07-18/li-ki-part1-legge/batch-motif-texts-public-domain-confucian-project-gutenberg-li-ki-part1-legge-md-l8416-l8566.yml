candidate_motifs:
- id: motif:1
  label: mourning propriety expressed through dress and duration
  taxonomy_refs: []
  basis: Multiple anecdotes concern whether mourners wear specific garments, observe
    correct durations, or begin mourning at all.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a ritual-propriety motif rather than a narrative mythic motif.
- id: motif:2
  label: friendship maintained despite improper funerary behavior
  taxonomy_refs: []
  basis: Confucius helps Yuan Zang at his mother’s coffin, ignores Yuan Zang’s song
    on the coffin wood, and says old acquaintances should not forget friendship.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents an ethical anecdote, not a supernatural episode.
- id: motif:3
  label: choosing moral exemplars among the dead
  taxonomy_refs:
  - wisdom
  basis: At the Nine Plains, Wan-3ze imagines dead men arising and evaluates whom
    he would follow according to their conduct toward power, gain, ruler, self, and
    friends.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The dead arising is hypothetical speech; no resurrection event occurs
    in the story.
- id: motif:4
  label: public authority inducing mourning compliance
  taxonomy_refs: []
  basis: A man who had not mourned his elder brother begins mourning when he hears
    that 3ze-kao will become governor.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The exact social force exerted by 3ze-kao is not stated beyond the man’s
    response to his impending office.
- id: motif:5
  label: grief marked by fasting after maternal death
  taxonomy_refs: []
  basis: After his mother’s death, the bereaved son is five days without eating and
    reflects on eating according to his feelings.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports abstention from eating but does not frame it as a
    formal rite.
- id: motif:6
  label: rejected rainmaking through human exposure to the sun
  taxonomy_refs:
  - sacrifice
  basis: During drought, duke M0 proposes exposing a deformed person or witch in the
    sun to move Heaven’s pity or seek rain, and Hsien-3ze rejects both proposals.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The act is proposed, not performed; the taxonomy reference to sacrifice
    is cautious because the passage describes exposure and suffering rather than killing
    or offering.
comparison_claims:
- id: claim:1
  claim: The drought anecdote has the same ritual function as a rainmaking pattern
    in which human suffering or exposure is proposed as a means to obtain rain, though
    the passage itself rejects the proposed acts.
  claim_level: same_function
  target: rainmaking through human exposure or sacrificial suffering
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: No external parallel is supplied in the passage; the proposed rites
    are not carried out, and Hsien-3ze explicitly argues against them.
