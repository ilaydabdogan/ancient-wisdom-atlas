canonical_text:
  quote: ''
  summary: 'A sequence of ritual and moral anecdotes: Confucius comments on duty in
    Sung, mourning dress is described after an interment, Confucius tolerates Yuan
    Zang’s behavior at his mother’s coffin because of old friendship, Wan-ze evaluates
    which of the dead he would follow if they arose, disputes over mourning practice
    are reported, a son fasts after his mother’s death, and Hsien-3ze rejects proposed
    drought rituals that would expose vulnerable people to the sun to seek rain.'
  language: English translation
  quote_policy: summarized
