canonical_text:
  quote: ''
  summary: 'A sequence of ritual discussions and anecdotes about mourning and burial:
    the use of burial vessels and sacrificial vessels, mourning obligations for kin,
    limits set by means and timing, coffin preparation, curtaining and dressing the
    corpse, placement of offerings, mourning garments, wailing, condolence dress,
    simple burial in poverty, burial goods placed in a grave, and return of funeral
    money-offerings.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aung Hsien describes the Hsia, Yin, and Au dynasties as using different burial
    vessels to communicate different views about whether the dead have knowledge;
    3ang-3ze rejects his explanation and distinguishes vessels for shades from vessels
    of men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named mourners ask about mourning for half-brothers related through the same
    mother; one answer suggests nine months, and another cites a one-year practice
    in Lu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When 3ze-sze's mother dies in Wei, Lu Zo warns him that others look to him
    as a ritual example; 3ze-sze replies that a superior man does not observe rites
    when means are lacking or timing is unsuitable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hsien-ze So says the ancients mourned each person according to relationship
    without diminishing degrees of mourning, and gives examples involving Wan, Mang-hu,
    and Mang Phi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hau Mf reports hearing that mourning rites should be pondered deeply and that
    a coffin should be well completed both inside and outside.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before the corpse has ornaments put on it, the hall is curtained off; after
    the slighter dressing, the curtain is removed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: There is disagreement over whether offerings at the slighter dressing should
    be placed east or west of the corpse; the passage calls the west placement a later
    error of Lu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hsien-3ze says that a coarse dolichos mourning robe with a fine linen lower
    garment was not the ancient practice.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: At 3ze-phu's mourning rites, wailers call out his name Mieh; 3ze-kao criticizes
    the practice, and the wailers change their style.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At mourning rites for Ta khiao's mother, no one in the house assists the son
    in the ceremonies, and this is counted as a careless omission.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Master says that when death occurs, family members should at least change
    their lambskin furs and dark-colored caps; the Master does not pay condolence
    visits in those articles of dress.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Master says mourning articles should match family means; if means are
    lacking, the body may be lightly covered, promptly buried, and the coffin lowered
    simply by ropes.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Pan asks 3ze-yu about dressing his dead on a couch; 3ze-yu permits it, and
    Hsien3ze criticizes him for taking authority over the proper rule.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: At the burial of his wife, Duke Hsiang of Sung places a hundred jars of vinegar
    and pickles in the grave; 3ang-3ze comments that such vessels are called vessels
    only to the eye of fancy, yet he filled them.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: After the mourning rites for Mang Hsien-3ze, the family chief minister has
    money-offerings returned to the donors, and the Master says this is allowable.
  category: action
  evidence_refs:
  - ev:15
