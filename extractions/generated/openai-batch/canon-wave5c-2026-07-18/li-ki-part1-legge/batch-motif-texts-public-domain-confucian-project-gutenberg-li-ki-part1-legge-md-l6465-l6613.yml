candidate_motifs:
- id: motif:1
  label: Offerings and vessels for the dead
  taxonomy_refs:
  - sacrifice
  basis: 'The passage repeatedly treats vessels, offerings, and grave goods in relation
    to the departed: fancy vessels, sacrificial vessels, offerings at the slighter
    dressing, and jars placed in a grave.'
  evidence_refs:
  - ev:1
  - ev:7
  - ev:14
  confidence: high
  cautions: The taxonomy reference is limited to ritual offerings and sacrificial
    vessels; the passage is a ritual discussion, not a narrative of self-sacrifice.
- id: motif:2
  label: Uncertainty about the dead's knowledge
  taxonomy_refs: []
  basis: Aung Hsien explicitly interprets different dynastic burial-vessel practices
    as indicating no knowledge, knowledge, or doubt about the dead, though 3ang-3ze
    disputes the interpretation.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The motif is presented through a debated ritual explanation rather than
    an agreed doctrinal statement.
- id: motif:3
  label: Mourning obligations graded by kinship and precedent
  taxonomy_refs: []
  basis: Several items treat the proper period or degree of mourning as dependent
    on kin relation, precedent, and examples from antiquity.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: This is a ritual-legal pattern rather than a mythic plot motif.
- id: motif:4
  label: Ritual propriety constrained by means and timing
  taxonomy_refs: []
  basis: 3ze-sze states that rites are not observed when means are lacking or timing
    is unsuitable, and the Master permits simplified burial where a family lacks means.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The passage gives prescriptive ritual reasoning, not symbolic interpretation
    beyond the stated rule.
- id: motif:5
  label: Simplicity versus excess in funerary practice
  taxonomy_refs: []
  basis: The Master allows very simple burial in poverty, while 3ang-3ze criticizes
    filled fancy vessels placed in a grave.
  evidence_refs:
  - ev:12
  - ev:14
  confidence: medium
  cautions: The contrast is inferred across separate anecdotes in the same passage.
- id: motif:6
  label: Ritual authority and correction of improper performance
  taxonomy_refs: []
  basis: The passage marks west placement of offerings as a later error, criticizes
    wailers for calling the dead person's name, judges an omitted assistant careless,
    and criticizes unauthorized permission about couch dressing.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: The motif concerns ritual correction within transmitted norms rather than
    a mythological antagonist or transgression tale.
comparison_claims:
- id: claim:1
  claim: The passage itself contrasts Hsia, Yin, and Au burial-vessel practices as
    comparable ritual means for communicating different positions about the dead's
    knowledge.
  claim_level: same_function
  target: Dynastic burial-vessel practices named in the passage
  evidence_refs:
  - ev:1
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The comparison is internal to the passage, and 3ang-3ze explicitly
    rejects Aung Hsien's interpretation.
- id: claim:2
  claim: The passage contrasts an authoritative placement rule for offerings at the
    slighter dressing with a later Lu practice that it calls an error.
  claim_level: same_function
  target: Correct offering placement versus later Lu offering placement
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The claim applies only to this specific ritual placement detail.
