canonical_text:
  quote: ''
  summary: A dialogue passage presents Confucius explaining ritual rules, their cosmic
    grounding, and their historical development. He describes early ceremonies with
    simple food, water, and earthen instruments; funerary practices of calling back
    the dead, placing rice and flesh, and orienting body and spirit; ancient kings
    living in caves or nests before the use of fire; later sages introducing fire,
    building, cooking, textiles, and offerings; and formal sacrificial arrangements
    with vessels, victims, music, prayers, and benedictions.
  language: English
  quote_policy: summarized
