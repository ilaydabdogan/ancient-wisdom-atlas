  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: For the last month of autumn, the sun is placed in Fang, with Hsii culminating
    at dusk and Lid culminating at dawn.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:4
  text: The month is assigned days kang and hsin, divine ruler Shao HAo, attending
    spirit 34-shau, hairy creatures, the musical note Shang, the pitch-tube Wi Yi,
    the number nine, a bitter taste, and a rank smell.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The month's sacrifice is said to be at the gate, with the liver foremost among
    parts of the victim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wild geese come and abide like guests; small birds enter the great water and
