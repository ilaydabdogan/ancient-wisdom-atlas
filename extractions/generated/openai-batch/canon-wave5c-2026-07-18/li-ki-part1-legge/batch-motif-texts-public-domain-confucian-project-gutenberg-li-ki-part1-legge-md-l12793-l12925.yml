  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Son of Heaven occupies a specified apartment, rides a war chariot with
    white horses and white flags, wears white robes and white jade, eats hemp-seeds
    and dog's flesh, and uses rectangular, cornered, rather deep vessels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Orders are renewed for officers to ensure that noble and mean people all work
    at ingathering so that nothing remains in the fields.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The chief minister is ordered to register the produce of the grains and store
    produce from the acres of God in the granary of the spirits with reverence and
    correctness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In this month hoar-frost begins to fall and all labours cease for a season.
  category: sequence
  evidence_refs:
