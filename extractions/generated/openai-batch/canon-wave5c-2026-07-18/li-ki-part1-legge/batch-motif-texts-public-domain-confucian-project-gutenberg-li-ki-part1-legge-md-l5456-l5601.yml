  evidence_refs:
  - ev:6
  confidence: high
  cautions: No details are given about the mechanics, destination, or cosmology of
    the spirit recall.
- id: motif:6
  label: Etiology of mourning customs from historical conflict
  taxonomy_refs: []
  basis: Two mourning practices are explained as having arisen from named battles
