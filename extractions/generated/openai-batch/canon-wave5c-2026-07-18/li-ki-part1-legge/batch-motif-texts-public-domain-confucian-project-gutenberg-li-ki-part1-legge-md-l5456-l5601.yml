  quote: ''
  summary: The passage presents anecdotes and prescriptions concerning death, battle,
    posthumous naming, mourning duration, bodily signs of grief, ritual objects, hair-binding,
    abstinence, and the cautious resumption of music or dress after mourning rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dying person sent a message urging an old friend to leave retirement and
    advise the ruler; he bowed twice with his head to the ground and then died by
    his own hand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of Ld sang in the evening after the ceremony introducing the twenty-fifth
    month of mourning; 3ze-li laughed, and the Master criticized 3ze-li for fault-finding
    while noting that one more month would have made singing acceptable.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During Duke Awang of Li's battle with the men of Sung, the horses became frightened,
    the carriage broke, and the duke fell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The duke said he had not consulted the tortoise-shell about the movement;
    Hsien Pan-fd attributed the disaster to his own lack of courage and died in the
    fight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A groom later found a random arrow lodged in one of the horses; the duke then
    said the disaster was not Hsien Pan-fd's fault and conferred an honorary name
    on him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 3ang-3ze, gravely ill, heard a lad remark on the bright mat of a Great officer
    and ordered the mat changed because it had been a gift he had not been able to
    replace earlier.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 3ang-3ze stated that he wanted only to die in the correct way; after he was
    raised, the mat was changed, and he was laid down again, he expired.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The text prescribes different appearances for a son after a father's death,
    after coffining, after interment, after the first year of mourning, and after
    the second year of mourning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The text says the A0-lii practice of calling dead spirits back with arrows
    originated from the battle of Shang-hsing, and that the Li practice of women visiting
    in condolence with sackcloth around the hair originated from the defeat at Hd-thai.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Master instructed the wife of Nan-kung Thao on tying her hair with sackcloth,
    specifying the size, a hazel-wood hair-pin, and eight-inch hanging hair-knots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mang Hsien-jze had musical instruments hung after the service ending mourning
    rites but did not use them, and he did not enter the harem when he was permitted
    to do so.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the service closing one year's mourning, Confucius handled his lute
    after five days without producing complete sounds; after ten days he played the
    organ and sang to it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Yu3ze, after the service for the same mourning period, wore white silk shoes
    and white silk cap-string ribbons.
  category: attribute
  evidence_refs:
  - ev:10
