  evidence_refs:
  - ev:4
  confidence: high
  cautions: Interpretation should remain limited to the stated concern for correct
    ritual conduct.
- id: motif:4
  label: Hidden battlefield sign and posthumous honor
  taxonomy_refs: []
  basis: A concealed arrow in a horse reveals that the driver's blamed failure was
