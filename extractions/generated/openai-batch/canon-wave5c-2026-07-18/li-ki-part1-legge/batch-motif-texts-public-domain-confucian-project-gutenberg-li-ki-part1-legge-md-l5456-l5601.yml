  - ev:10
  confidence: high
  cautions: This is a ritual pattern rather than a mythic narrative motif.
- id: motif:3
  label: Ritual correctness at the moment of death
  taxonomy_refs: []
  basis: 3ang-3ze insists on replacing an inappropriate status-marked mat before death
