- id: motif:2
  label: Timed return from mourning to ordinary expression
  taxonomy_refs: []
  basis: Several anecdotes concern when singing, music, harem access, and clothing
    are or are not appropriate after mourning rites.
  evidence_refs:
  - ev:2
