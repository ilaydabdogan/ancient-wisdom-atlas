canonical_text:
  quote: ''
  summary: The passage gives ritual and administrative regulations concerning hereditary
    feudal territories, rank insignia, appointment to office, public punishment, missions
    to the Son of Heaven, the Son of Heaven's five-year inspection tour through the
    fiefs, sacrifices at regional mountains and to ancestors, standardization of rites
    and measures, and penalties or rewards for subordinate rulers.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Outside the royal domain the feudal states are described as hereditary, and
    descendants of those who served the country well are not to be left unprovided
    for.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ranked symbols of distinction are limited by office and state size; the passage
    states that there were nine symbols in all and assigns smaller numbers to lesser
    rulers and officers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Candidates for office are to have their abilities discussed, then be employed,
    tested in affairs, assigned rank, and given salary.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rank is conferred in the court, with existing officers associated in the act.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Punishment is inflicted in the market-place, with the multitude associated
    in casting criminals off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Punished criminals are not to be retained by rulers, clan heads, Great officers,
    or officers; they are sent to one of the four quarters and barred from affairs
    of government.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Feudal princes are required to send a minor mission yearly, a greater mission
    every three years, and to appear in person once every five years before the Son
    of Heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Son of Heaven makes an inspection tour through the fiefs every five years.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the second month the Son of Heaven visits the eastern fiefs and goes to
    the honored mountain of Tai.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Mount Tai he burns a great pile of wood, announces his arrival to Heaven,
    and sacrifices to hills and rivers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the inspection he gives audience to princes, seeks out people who are
    one hundred years old, orders poems and market lists to be presented, and uses
    these materials to examine the people’s manners, preferences, and extravagance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The superintendent of rites is ordered to examine seasons and months, fix
    days, and make standard tubes, ceremonies, music, measures, and clothing uniform;
    what is wrong is rectified.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A ruler is penalized for neglecting spirits of hills and rivers, for disorder
    in ancestral temple observances, for changing ceremonies or musical instruments,
    and for changing statutory measures or clothing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A ruler who has done good service for the people and shown virtue receives
    additional territory and rank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Son of Heaven continues the tour to the south, west, and north in specified
    months, visiting the mountain of each quarter and observing the same ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the circuit he returns to the capital, repairs to the ancestral temple,
    and offers a bull in each fane from that of his high ancestor to that of his father.
  category: action
  evidence_refs:
  - ev:7
