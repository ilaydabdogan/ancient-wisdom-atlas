canonical_text:
  quote: ''
  summary: The passage gives ritual prescriptions for host and guest entry, movement
    by east and west steps, bodily posture, handing objects to superiors, a youth’s
    sweeping and handling of an elder’s mats, honor seating by direction, spacing
    and adjustment of visitor mats, conversation protocol, and a pupil’s comportment
    and care for the master’s objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The host asks to enter first to arrange the mats, returns to receive the guest,
    and after the guest refuses precedence and the host bows, they enter together.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After entering the door, the host moves to the right toward the east steps,
    while the guest moves to the left toward the west steps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A lower-rank guest initially goes toward the host’s steps, but the host firmly
    declines this and the guest returns to the west steps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Host and guest offer each other precedence in ascending, but the host begins
    first; prescribed first-foot movements differ for east and west steps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Certain formal hasty steps are not to be used outside the curtain or screen,
    in the raised hall, or when carrying the jade symbol; footprints and elbow positions
    are also regulated.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two equals sitting side by side should not extend their elbows crosswise,
    and rules are given for whether one kneels or stands when handing something to
    a superior.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A lad carrying swept-up dirt from an elder’s presence places the brush on
    the basket, keeps his sleeve before it, and holds the basket so dust does not
    reach the elder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A youth carries an elder’s mat in his arms and asks the direction of the elder’s
    face for a sitting mat or feet for a sleeping mat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The honor seat depends on the direction the mat faces: for south or north
    facing, the west seat is honorable; for east or west facing, the south seat is
    honorable.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Except for guests present simply to eat and drink, mats should be spread with
    ten cubits between them; host and visitor exchange refusals around adjusting or
    removing mats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A visitor should not begin conversation unless the host has first asked a
    question.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A pupil approaching his mat should show composed bearing, hold up his lower
    garment, avoid loose clothing, and avoid hurried foot movements.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: If the master’s writings, tablets, lute, or cithern are in the way, the pupil
    kneels and removes them without disarranging them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The pupil sits at the back of the mat when idle and at the front when eating.
  category: action
  evidence_refs:
  - ev:7
