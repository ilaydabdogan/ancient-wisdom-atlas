canonical_text:
  quote: ''
  summary: 'The passage gives ritual and administrative rules for the Son of Heaven
    and feudal princes: sacrifices before departure and punitive expeditions, audiences
    and standardization of ceremonies, royal gifts that confer powers, establishment
    of schools, seasonal and humane rules for hunting and resource-taking, and annual
    fiscal regulation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the Son of Heaven went forth, he sacrificed to God, offered a sacrifice
    at the altar of the earth, and made an offering in the fane of his father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a feudal prince went forth, he offered sacrifice to the spirits of
    the land and in the fane of his father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Son of Heaven received feudal princes without a special affair, the
    occasion was called an audience, and ceremonies, punishments, and standards of
    virtue were examined or made uniform.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Royal presentations of music were preceded by different sound signals according
    to the rank of the recipient.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When bow and arrows were conferred on a prince, he could execute royal justice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the hatchet and battle-axe were conferred, the recipient could inflict
    death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a large libation-cup was conferred, the recipient could make the black
    millet spirits for himself; without the cup, he depended on the Son of Heaven
    for those spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When ordered by the Son of Heaven to institute instruction, a prince built
    schools for children and adults; the royal and princely colleges are described
    with surrounding water forms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before a punitive expedition, the Son of Heaven performed sacrifices to God,
    Earth, and his father, and also sacrificed to the Father of War at the state targeted
    by the expedition.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The punitive expedition is described as proceeding from an ancestral charge
    and a plan completed in the college; after seizing criminals, the ruler returned,
    set forth offerings, and announced the questioning of prisoners and cutting off
    ears of the slain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When there was no special business, the Son of Heaven and princes held three
    hunts in the year to supply sacrificial dishes, guests and visitors, and the ruler's
    kitchen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Failure to hunt when no business prevented it was deemed irreverence, while
    hunting without rules was deemed cruelty to the creatures of Heaven.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Son of Heaven did not entirely surround the hunting ground, and a feudal
    prince did not take a whole herd by surprise; flags and carriages marked the end
    of official stages of killing before common people hunted for themselves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Resource-taking was timed by signs involving the otter, wolf, dove becoming
    a hawk, falling leaves, and insects withdrawing into burrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The rules forbid taking fawns or eggs, killing pregnant or immature animals,
    throwing down nests, and firing fields before insects had withdrawn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The chief minister determined state expenditure after the grain harvest, using
    territory size, annual returns, and a thirty-year average to regulate outgoing
    by income.
  category: action
  evidence_refs:
  - ev:10
