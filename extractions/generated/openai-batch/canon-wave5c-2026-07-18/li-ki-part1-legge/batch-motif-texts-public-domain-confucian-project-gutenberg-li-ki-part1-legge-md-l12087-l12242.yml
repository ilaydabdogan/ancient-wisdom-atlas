canonical_text:
  quote: ''
  summary: A ritual-calendar passage for summer prescribes sacrifices, first-fruit
    offerings, seasonal prohibitions, leniency, horse management, ascetic restraint
    at the longest day, public quiet, observations of plants and animals, restrictions
    on fire, use of high bright dwellings, consequences of following the wrong seasonal
    government, and the celestial, divine, sensory, numerical, and sacrificial correspondences
    of the third summer month.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Music accompanies orders for sacrifices to former princes, high ministers,
    and officers who benefited the people, with prayer for a good grain harvest; a
    note discusses a sovereign prayer for rain to God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Husbandmen present first-fruits of millet, and the Son of Heaven partakes
    of it with pullets and cherries after first offering a portion behind the ancestral
    temple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People are forbidden to cut indigo for dyeing, burn wood for charcoal, or
    bleach cloth in the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: City and village gates are not to be shut, and vexatious inquiries at barrier
    gates and markets are not to be instituted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prisoners charged with even great crimes are to receive leniency and increased
    food allowance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Impregnated mares are collected separately, fiery stallions are tied up, and
    rules for rearing horses are issued.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the arrival of the longest day, the passage describes influences of darkness
    and decay and influences of brightness and growth as struggling, with tendencies
    to death and life divided.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Superior men keep vigil and fast, withdraw at home, avoid violent exercise,
    restrain music and sights, avoid their wives, simplify diet, restrain desires,
    and keep spirits unexcited.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Magistrates keep things quiet and avoid punishments or rash action so that
    darkness and decay may reach full development.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Seasonal signs include deer shedding horns, cicadas beginning to sing, the
    midsummer herb appearing, and tree hibiscus flowering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Outdoor fires should not be lit in the southern regions of the country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: People may live in high bright buildings, enjoy distant views, ascend hills
    and heights, and occupy towers and lofty pavilions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: If winter, spring, or autumn governmental proceedings are followed in the
    second month of summer, the passage predicts harms including hail, cold, impassable
    roads, war, locusts, famine, premature ripening, and pestilence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: For the third month of summer, the passage lists celestial positions, day
    stems, a divine ruler, an assisting spirit, musical note, pitch-tube, number,
    taste, smell, and furnace sacrifice with lungs foremost.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: Further third-summer signs include gentle winds, crickets in walls, young
    hawks learning the practices of their parents, and decaying grass becoming fire-flies.
  category: sequence
  evidence_refs:
  - ev:8
