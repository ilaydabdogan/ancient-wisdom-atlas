canonical_text:
  quote: ''
  summary: 'The passage discusses ritual propriety: arrangements for receiving guests
    and aiding blind musicians; preservation of old ceremonial forms; the need for
    inner discrimination and rule-governed practice; ancient kings'' use of ritual
    objects, seasons, celestial bodies, high and low places, and selected virtuous
    men; service to Heaven and Earth, offerings to God, auspicious creatures, regulated
    weather, and ordered rule; and an ancestral temple layout arranged by east-west
    positions.'
