canonical_text:
  quote: ''
  summary: The passage traces ceremonial rules to the Grand Unity, describes that
    unity becoming heaven and earth, dual force, seasons, and universal breathings,
    and then explains ritual propriety as a heaven-grounded order that nurtures human
    life, serves the dead and departed spirits, preserves states and families, and
    improves or degrades persons according to use or neglect.
  language: English
  quote_policy: summarized
