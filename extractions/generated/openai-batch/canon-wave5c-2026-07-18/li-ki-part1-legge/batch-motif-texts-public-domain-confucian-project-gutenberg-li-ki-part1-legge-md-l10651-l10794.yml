canonical_text:
  quote: ''
  summary: The passage describes year-end administrative accounting submitted to the
    Son of Heaven, followed by feasting the aged and showing royal sympathy to husbandmen.
    It then gives rules and precedents for nourishing aged persons, with age-graded
    provisions, honors, exemptions, staff privileges, mortuary preparations, and dynastic
    variations in the institutions and ceremonies used for elder care.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Completed yearly accounts are prepared, received, examined, adjudicated, and
    submitted to the Son of Heaven by accountants and high officers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the accounting process, the aged are feasted, royal sympathy is shown
    to husbandmen, the year's business is concluded, and state expenditure is determined.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Different ancient rulers or dynastic groups are said to have nourished the
    aged through different ceremonies: drinking entertainment, entertainment after
    sacrifice or offering, substantial feast, or all three.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Persons aged fifty, sixty, and seventy receive nourishment in different educational
    institutions; persons aged eighty or ninety have specified forms of acknowledging
    or receiving a ruler's message and gift.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Food provisions increase by age: different grain at fifty, stored flesh at
    sixty, a second savoury service at seventy, delicacies at eighty, and continuous
    food and drink at ninety.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Objects for mourning rites are inspected with increasing frequency after sixty,
    seventy, eighty, and ninety, while bandages, sheet, coverlets, and cases for the
    corpse are prepared after death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists age-related decline and increasing requirements for flesh,
    silk, shared warmth, and warmth beyond that support.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Staff privileges expand by age from the family to district, city, and court;
    if the Son of Heaven questions a ninety-year-old officer, he goes to the officer's
    house and has rich food carried after him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: By age, common men and officers are released from strength service, bearing
    arms, guest-reception duties, mourning abstinences, personal college attendance,
    and government service.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage assigns the aged who retired from state service and aged common
    or unranked people to different named schools under the systems of Yu, Hsia, Yin,
    and Kau.
  category: setting
  evidence_refs:
  - ev:9
