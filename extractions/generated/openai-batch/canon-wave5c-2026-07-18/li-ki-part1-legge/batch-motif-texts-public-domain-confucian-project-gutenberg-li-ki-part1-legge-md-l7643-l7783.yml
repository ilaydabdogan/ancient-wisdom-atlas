candidate_motifs:
- id: motif:1
  label: Ritual admonition by symbolic cup distribution
  taxonomy_refs: []
  basis: Khwai distributes cups to officials and himself, then explains the cups as
    responses to failures connected to music before burial and ritual prohibition.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is a ritual anecdote rather than a mythic narrative; the motif
    label describes the local pattern only.
- id: motif:2
  label: Memorial ritual object preserving a moral correction
  taxonomy_refs: []
  basis: After the duke admits fault, the cup presented by Khwai is ordered preserved
    and is later raised at feasts with a remembered attribution.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text gives an etiological explanation for a feast practice, but no
    wider comparative claim is made in the passage.
- id: motif:3
  label: Posthumous title assigned from exemplary deeds
  taxonomy_refs: []
  basis: The ruler assigns Kung-shu Wan-3ze's honorary title after recounting deeds
    of famine relief, loyal protection, and competent administration.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is an administrative-ritual naming pattern, not necessarily a mythic
    motif.
- id: motif:4
  label: Divination identifies the rightful successor
  taxonomy_refs: []
  basis: A tortoise-shell is consulted to choose among heirs, and Shih £hi4ze's refusal
    to adorn himself during mourning is treated as the indicated sign.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: Available taxonomy includes royal legitimacy, but the passage concerns
    family succession rather than explicit royal succession; no taxonomy link is assigned.
- id: motif:5
  label: Mourning propriety shown by refusal of adornment
  taxonomy_refs: []
  basis: Shih £hi4ze refuses bathing and gemmed girdle-pendants because such acts
    are improper while engaged in mourning rites for a parent.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The motif is an ethical-ritual pattern extracted from the passage; no
    broader comparison is asserted.
- id: motif:6
  label: Live burial for service or nourishment of the dead
  taxonomy_refs:
  - sacrifice
  basis: The wife and principal officer propose burying living persons with Ahan 3ze-kii
    so that he may have nourishment in the lower world; the proposal is explicitly
    rejected as improper.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage concerns a proposed and rejected act. The taxonomy reference
    to sacrifice is plausible because living persons are to be buried for the dead,
    but the text frames the practice as improper.
- id: motif:7
  label: Counter-proposal redirects harmful ritual obligation to the proposers
  taxonomy_refs: []
  basis: 3ze-khang says that if live burial cannot be avoided, the wife and steward
    would be the fit persons to accompany the dead, after which the plan is abandoned.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a rhetorical and ethical pattern rather than a formal taxonomy
    motif.
- id: motif:8
  label: Simple means fulfill filial and mourning duties
  taxonomy_refs:
  - wisdom
  basis: Confucius teaches that bean soup, water, and simple immediate burial can
    fulfill filial and mourning duties when poverty prevents more elaborate rites.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy link to wisdom is broad and should be reviewed; the passage
    is a didactic saying in a ritual text.
