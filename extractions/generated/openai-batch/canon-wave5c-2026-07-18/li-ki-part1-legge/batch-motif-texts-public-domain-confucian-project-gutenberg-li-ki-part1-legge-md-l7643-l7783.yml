canonical_text:
  quote: ''
  summary: 'The passage presents several ritual and ethical anecdotes: a cook admonishes
    Duke Phing for music and feasting before a burial by distributing cups of spirits;
    a ruler assigns an honorary title to Kung-shu Wan-3ze based on his deeds; a tortoise-shell
    divination indicates a successor through refusal to adorn himself during mourning;
    a proposal to bury living persons with a dead man for lower-world service is stopped;
    Confucius teaches that poor persons can still fulfill filial and mourning duties
    through simple means; the final lines begin an incomplete notice about Duke Hsien
    of Wei fleeing and returning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Xih Tao-3ze is described as dead and not yet buried while Duke Phing drinks
    with music-master Kwang and Li Thido as bells and music are played.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khwai hears the music, enters the apartment, ascends the steps, pours cups
    for Kwang and Thido, drinks a third cup himself while kneeling in the hall facing
    north, and leaves hurriedly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Khwai explains that Kwang received a cup because music should not have been
    played on the specified days while Kih Téo-3ze lay in his coffin, and Kwang as
    grand music-master had failed to remind the duke.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Khwai explains that Thido received a cup because, as the duke's favourite
    officer, he forgot the duke's fault during the drinking and eating.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Khwai explains that he drank a cup himself because, as cook, he had neglected
    his own work and presumed to show knowledge of what should be prohibited.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Duke Phing admits that he too was at fault, receives a rinsed cup from Khwai,
    and orders that the cup not be lost after his death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At later feasts in 3in, after cups are presented all round, the preserved
    cup is raised and identified as the one presented by Khwai.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Kung-shu Wan-3ze dies, his son Shi asks the ruler to fix an honorary
    title before burial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ruler cites the deceased man's feeding of the famishing, protection of
    the ruler, and competent administration, and grants the title “The Faithful, Kind,
    and Accomplished.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Shih Tai-kung dies without a son by his proper wife, a tortoise-shell
    is consulted to determine which of six sons by concubines should succeed him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Five sons bathe and put on gemmed girdle-pendants, but Shih £hi4ze refuses
    to bathe or wear pendants because he is engaged in mourning rites for a parent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shih £hi4ze's refusal is treated as the indication, and the people of Wei
    consider that the tortoise-shell showed true knowledge.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: After Ahan 3ze-kii dies in Wei, his wife and the principal officer of the
    family plan to bury living persons with him to provide nourishment in the lower
    world.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Aan 3ze-khang says burying living persons for the dead is improper, but if
    it must be done the wife and steward would be the fitting parties; the proposal
    is then abandoned.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: 3ze-lu laments that poor people lack means to nourish parents while alive
    and to perform mourning rites when they are dead.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Confucius replies that bean soup and water can count as filial piety if parents
