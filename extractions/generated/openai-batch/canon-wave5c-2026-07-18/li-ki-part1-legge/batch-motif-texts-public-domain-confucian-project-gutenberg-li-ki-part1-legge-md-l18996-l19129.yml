  quote: ''
  summary: The passage explains sacrificial practices and their meanings across named
    periods. It describes sacrifices emphasizing smell, sound, or pungent fragrance;
    explains that the intelligent spirit returns to heaven while body and animal soul
    return to earth; describes sacrificial search for the departed in dark and bright
    regions; details the placement of officials, a representative of the departed,
    the victim, offerings of blood and organs, bright water, grains, liquors, burned
    fat and aromatics; and interprets the ruler’s bowing, bared breast, and use of
    the knife as reverence and submission.
  language: English
