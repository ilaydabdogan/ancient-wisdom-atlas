  summary: The passage gives ritual prescriptions about prioritizing and preserving
    sacrificial vessels and robes, conduct for officers leaving or traveling beyond
    a state, bowing etiquette in formal interviews, restraint in hunting and bad years,
    and the obligations binding rulers and officers to land-and-grain altars, ancestral
    temples, graves, hosts, and official charges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Preparations for clan and household ritual give priority to the ancestral
    temple and vessels of sacrifice; a superior man is told not to sell sacrificial
    vessels, wear sacrificial robes for warmth, or cut trees on grave-mounds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Great officer or other officer leaving his state is told not to carry vessels
    of sacrifice across the boundary, but to leave them temporarily with an officer
    of corresponding rank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An officer crossing the boundary in the case described prepares an altar,
    wails toward the state, wears white clothing and plain items, leaves horses’ manes
    undressed, avoids grooming and offerings at spare meals, and after three months
    resumes usual dress.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Formal interviews are regulated by rank, host-guest reverence, withdrawal
    to avoid honor, bowing, returning bows, and exceptions for condolence and interviews
    with one’s own ruler.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In spring hunting, the ruler does not surround a marshy thicket, Great officers
    do not surprise a whole herd, and other officers do not take young animals or
    eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In bad years, the ruler and officers reduce normal signs of plenty and ceremony,
    including offerings, grain for horses, road upkeep, music, and rich foods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Officers traveling beyond the state on private business must ask leave; on
    return, a Great officer presents an offering and an inferior officer announces
    his return, with bows before replies when questioned or condoled with.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a ruler proposes leaving the state, speakers ask why he leaves the land-and-grain
    altars; for a Great officer they name the ancestral temple, and for an inferior
    officer the ancestral graves. The passage states corresponding duties to die for
    altars, host, or charge.
  category: speech
  evidence_refs:
  - ev:6
