  quote: ''
  summary: 'The passage first describes a shaman-directed fishing rite in which Devoured
    By Martens and the people obtain halibut and settle by the sea, followed by Devoured
    By Martens'' dancing-song. It then begins a story of the Cannibal dance: a prince
    named Gather On The Water is ritually taken, hidden in a tree, visited by a supernatural
    being, compelled to eat a dead child, and then begins killing and eating villagers.'
  language: English with Tsimshian song text
  quote_policy: summarized
