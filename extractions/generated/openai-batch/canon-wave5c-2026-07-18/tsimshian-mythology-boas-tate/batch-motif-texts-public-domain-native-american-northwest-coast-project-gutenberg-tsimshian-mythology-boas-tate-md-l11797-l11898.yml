canonical_text:
  quote: ''
  summary: 'The passage recounts a ceremonial display by Holdamia involving a fog-filled
    box, sea imagery, crest objects, feasting, and the establishment of a family name
    and clan association. It then narrates Dragging Along Shore''s prosperity through
    the blessing and taboo of Chief Na-gun-a''ks, the violation of a fish taboo by
    companions who mistreat a bullhead, and their death when a whirlpool swallows
    the canoe. The passage closes with the beginning of another story: four pre-Deluge
    brother chiefs endure a famine, and the eldest receives a thin traveler who says
    he has eaten only snow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Holdamia opened a carved, shell-inlaid box, and thick fog filled Dragging
    Along Shore's house; the assembled chiefs became silent and afraid.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Holdamia closed the box and the fog disappeared, the house appeared
    full of seaweeds, sea anemones, and sea kales, with a copper canoe on the first
    platform and carved rooms showing joined killer whales and green seaweeds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dragging Along Shore wore a killer-whale garment covered with many horns,
    and the guests were covered with seaweeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dragging Along Shore proclaimed that his family name would be G'it-na-gun-a'ks
    and would continue through generations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Holdamia gave a feast to chiefs, displayed objects received from Chief Xa-gun-a'ks,
    and announced Xa-gun-a'ks as one of the Eagle Clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dragging Along Shore prospered as a hunter, became widely known, and gave
    many feasts because of the blessing of Chief Na-gun-a'ks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: On a hunting trip with three other men, Dragging Along Shore warned them not
    to touch any fish; dead animals and fish floated before the canoe and were taken
    aboard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At camp, two young men laughed at a bullhead and cut open both sides of its
    mouth; another young man told Dragging Along Shore, who said they had brought
    danger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A young man watched from a hill as a great whirlpool opened and swallowed
    the canoe after it rounded a point.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The surviving young man returned home and reported that Dragging Along Shore
    and two others had perished; the passage states that Dragging Along Shore now
    lived in the house of Chief Na-gun-a'ks and that the two men perished because
    they disobeyed the command not to hurt fish.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Before the Deluge, four brother chiefs lived at Prairie Town on the upper
    course of the Skeena River, each with his own house, and their people were proud
    of them.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: During a hard winter famine, the four chiefs made fires every morning to show
    that they were still alive and had plenty to eat, while many others starved.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A thin person came down the river on the ice; the eldest chief invited him
    in, seated him by the fire, learned he had eaten only snow, ordered snow brought
    in a wooden dish, and the man left without eating it.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
