canonical_text:
  quote: ''
  summary: A trading quarrel between a Tsimshian chief's daughter-in-law and a Haida
    woman leads Chief LEg'e'°x to order an attack on the Haida. After a prolonged
    battle, many Haida are killed and buried by people from the fort. Haida chiefs
    seek peace, and customary peace gestures follow, including bird's down and carrying
    nephews on an elk skin. Suspicion then arises, canoes leave, shooting resumes,
    and more Haida are slain during pursuit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsimshian and Haida women are trading, and a chief's daughter-in-law repeatedly
    asks a Haida woman to exchange a small piece for a larger one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Haida woman becomes angry, snatches dried halibut, and throws or strikes
    it into the daughter-in-law's face.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The daughter-in-law returns home weeping to the house where her father-in-law,
    Chief LEg'e'°x, lies sick in the rear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After hearing that the daughter-in-law was struck by a Haida woman, Chief
    LEg'e'°x orders his head man to tell the Tsimshian tribes to shoot the Haida.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsimshian people shoot at the Haida camp, the Haida also shoot at the Tsimshian,
    many Haida are killed, and some Tsimshian are wounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The battle lasts two days and a half and two whole nights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the last night, the Haida dig up ground in their camp and pile the
    bodies of their dead around it as shelter after their bullets and powder are spent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the third morning the Tsimshian have surrounded the Haida camp, with canoes
    on the water and warriors on surrounding hills.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mr. Kennedy sends his wife to communicate that many Haida have been slain
    and that he wants his workmen to bury the dead before decay.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A young man carries the message to Chief LEg'e'°x, and the chief orders all
    Tsimshian tribes to stop shooting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: People from the fort dig two long ditches inside the potato fence as a graveyard
    and bury bodies of Haida men, women, and children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Only a few Haida remain after the burial of the dead.
  category: attribute
