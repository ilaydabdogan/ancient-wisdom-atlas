  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Haida blow bird's down toward Chief LEg'e'°x's village as a sign of peace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A nephew of Kluna is carried on an elk skin into Chief LEg'e'°x's house, and
