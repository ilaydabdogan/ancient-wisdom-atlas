  quote: ''
  summary: The passage includes a translated song lamenting the destruction of Dzi'gwa
    and an explanatory narrative titled "Explanation of the Beaver Hat." The narrative
    tells of war between Eagle Clan and Ganha'da villages, a jealous husband killing
    his wife, her younger brother avenging her by disguise, the defeat and canoe flight
    of the Eagle Clan, the loss of coppers and a carved eagle crest used as anchors,
    and a supernatural halibut that swallows canoes before being killed from inside
    by two brave men.
  language: Tsimshian with English translation and English explanatory prose
  quote_policy: summarized
