canonical_text:
  quote: ''
  summary: A shaman prince instructs his people to sing while he travels to the Ghosts'
    town, crosses the river and bridge by supernatural power, and seizes a dead person's
    soul from the Ghosts. During escape his feet enter the Boiling-Oil River and are
    burned, but his supernatural power tells him to run sunwise around the fire four
    times, healing him and increasing his power. He repeatedly retrieves souls from
    the Ghost town, angering the Ghosts, who plot to kill him. The Ghost chief feigns
    illness to lure him while Ghosts attack his village; the prince warns his people
    to throw a repellent mixture behind their houses. In the Ghost chief's house the
    prince receives a box containing bone and skull ritual objects and prepares himself
    by rubbing mouth-water on his body before using them.
  language: English
  quote_policy: summarized
