canonical_text:
  quote: ''
  summary: A chief builds a strong yew canoe, travels with nephews, women, and provisions,
    captures a floating child belonging to a monster woman, and survives the monster's
    overturning of an island by boarding the canoe. The child dies, and later the
    party captures the sleeping monster, escapes a whirlpool, returns to a village,
    and displays the dead monster and child. A separate episode explains the white
    marking of the male sawbill duck after a sister ties white weasel skin to her
    brother's head. The passage ends with a feast, a marriage arrangement, gifts,
    and the three nephews beginning a related marriage-seeking episode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief tries different trees and finally uses yew, described as strong
    and hard, to build a better canoe that returns safely from a stormy sea test.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young chief orders his four nephews to gather food, loads the yew canoe
