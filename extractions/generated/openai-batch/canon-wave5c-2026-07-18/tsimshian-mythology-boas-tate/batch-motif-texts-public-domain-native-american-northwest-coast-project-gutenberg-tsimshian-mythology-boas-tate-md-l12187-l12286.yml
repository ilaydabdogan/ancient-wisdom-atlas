canonical_text:
  quote: ''
  summary: Tsauda marries the chief's second daughter, who is described as lame, carries
    her upward to his supernatural father's house, where she is washed four times
    and transformed into a shining beautiful woman. Tsauda receives a magic sling
    and stones. In later episodes, Tsauda's words and water-blowing make Halus's driftwood
    smoke, while Tsauda's pitchwood burns well. During a spring migration blocked
    by wind and rock, Halus's sling-stone goes through his mother-in-law's lip-hole,
    while Tsauda's stone opens a hole through the rock for the canoes. The chief then
    points to a valuable copper on a high mountain where earlier climbers had died.
  language: English
  quote_policy: summarized
