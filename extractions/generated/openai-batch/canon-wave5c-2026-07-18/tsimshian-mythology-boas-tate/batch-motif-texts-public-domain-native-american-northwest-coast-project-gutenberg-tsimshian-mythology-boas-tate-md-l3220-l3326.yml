canonical_text:
  quote: ''
  summary: The passage concludes a story in which Chief South Wind sends four sons
    north to recover their sister from Chief North Wind. Three brothers fail when
    the north wind drives away their cloud or rain forms; the fourth reaches North
    Wind's village, after which heavy rain melts the ice. The winds then negotiate
    the division of months and seasons. The passage then begins another story set
    near the upper Skeena River, where a beautiful plume descends from the sky during
    nighttime games and pulls a growing chain of people upward.
