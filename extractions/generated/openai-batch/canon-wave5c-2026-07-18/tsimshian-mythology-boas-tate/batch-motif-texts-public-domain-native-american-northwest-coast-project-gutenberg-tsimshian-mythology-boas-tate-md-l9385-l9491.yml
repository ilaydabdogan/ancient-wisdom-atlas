canonical_text:
  quote: ''
  summary: The passage contains the end of a Waux narrative, in which Waux loses two
    children on a mountain, becomes trapped after pursuing mountain sheep, unsuccessfully
    asks his wife to offer fat to a supernatural being, and both he and his wife are
    transformed into stone-like substances. It then begins a narrative of a blind
    hunter whose son helps him aim an arrow at a grizzly bear; the hunter kills the
    bear, but his wife denies the kill in order to withhold the meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waux's two children follow him, are lost on a newly discovered mountain, slip
    down one side of it, and die in the Valley of Supernatural Beings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After mourning, Waux moves to an old hut at the foot of the high mountain,
    hunts mountain sheep daily, enlarges the hut, and stores dried meat and fat there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In late fall Waux goes up the same mountain for fresh meat with a hunting-pole,
    dog, mat blanket, small root basket, and hunting-hat, but without his spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mountain sheep enter a narrow cleft; at the end is bare glass-like slippery
    rock, and a large sheep kicks the mountain-side and leans its head against the
    rock to show that the mountain is angry with Waux.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the sheep leaps down the slippery rock, the mountain shakes; Waux strikes
    his hunting-pole through hard rock, holds it, calls his dog to his side, and shouts
    to his wife to sacrifice fat to supernatural powers or to a supernatural being.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Waux's wife repeatedly misunderstands or redirects his request as a question
    about whether she should eat fat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Waux finally tells his wife to eat all the melted fat, drink cold water, and
    lie across an old log; she does so, her body breaks apart, and she is transformed
    into flint with white stone inside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Waux, his hunting-hat, mat blanket, pole, and dog are transformed into stone;
    the passage explains this by saying he forgot his spear and that his wife misunderstood
    his request to make an offering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A blind man, formerly a hunter, camps at the mouth of a creek with his wife
    and little son while waiting for the salmon-run; the woman and son catch salmon
    with a harpoon.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The son sees a great grizzly bear coming to the stream for old dead salmon
    and tells his blind father; the father asks to be led outside and to be given
    his bow and good arrow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The blind hunter tells his son to point the arrow at the bear's shoulder so
    that it will hit the heart; the son directs the arrow, the hunter shoots, and
    the arrow goes through the bear's heart.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The blind hunter's wife mocks his claim, says he missed the bear although
    she knows he killed it, and intends to deny him bear meat while imagining that
    she might marry a better man if he dies soon.
  category: relationship
  evidence_refs:
  - ev:9
