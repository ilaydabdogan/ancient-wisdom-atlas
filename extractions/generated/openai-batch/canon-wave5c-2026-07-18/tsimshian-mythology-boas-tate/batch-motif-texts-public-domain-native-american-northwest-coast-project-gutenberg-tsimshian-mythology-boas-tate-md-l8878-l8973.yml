canonical_text:
  quote: ''
  summary: A mother directs her six children to travel by canoe toward her old home.
    They cross the sea, go up a great river, pass a canyon, and reach a large town
    of maternal relatives. Their canoe and animal provisions become lasting landforms
    and stones. In the town, the children are recognized as descendants of a chief's
    cast-out daughter and are accepted. After their departure, the mother wanders
    grieving in the woods and is brought to a town of many Mice, who identify themselves
    as her children by a Mouse lover and ask her to stay with them. They comfort her
    with dances, while her husband searches for her unsuccessfully.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eldest son agrees to follow his mother's direction and asks his father
    to make him a good-sized canoe; the father makes the canoe and is sorrowful that
    his children will leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the children depart, their mother takes them to a sandbar at Rose Point
    and points them toward a direction slightly south of sunrise, describing a route
    by sea, river, canyon, and town of relatives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children paddle for two days across a strait, pass between two large islands,
    reach an unfamiliar great river, make a pole, and travel upriver with provisions
    loaded by their father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After passing a large canyon and arriving below the large town, the children
    turn their canoe upside down; the canoe becomes a little hill and the animal provisions
    become stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children enter the village in the evening, appear as strangers, see a
    large central house, and are invited into the chief's house to sit on a mat beside
    a large fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eldest son asks whether a chief of the town had cast out his daughter
    on the river years before, and he identifies the siblings as that daughter's children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief gathers old men and wise men, the children give their names, and
    the community receives them gladly as grandchildren of the late chief.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After her children leave, the mother goes into the woods weeping, wanders
    onto a narrow trail, and meets good-looking young people who ask why she is sad.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young people tell the woman that they also are her children and bring
    her to a large town where many people assemble around her.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The assembled people say they were cast into the river by the old grandfather
    too, built a town where they now live, and want the woman to stay with them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman wants to bring her husband, but the people do not allow it; she
    agrees to stay, and the town is identified as the town of the many Mice, her children
    by a Mouse lover.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The many Mice dance daily to comfort their mother, while the woman's husband
    later searches for her in the woods without finding her.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
