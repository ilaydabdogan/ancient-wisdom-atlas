canonical_text:
  quote: ''
  summary: TxamsEm travels hungry with a raven blanket, is caught and released by
    a Crab, revives after drifting ashore, causes the bullhead's shape by cursing
    a Fish, frightens whale owners away from a village through a false interpretation
    of Raven-language speech, and repeatedly abandons and recovers his raven blanket
    after apparently fine garments turn into lichens or moss.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm has a raven blanket given by his father and uses it to fly over the
    ocean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: TxamsEm finds a large Crab on a sand-spit at low tide, repeatedly touches
    or pushes it, and asks it to play a game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Crab catches TxamsEm by the leg, carries him into the water, ignores his
    request to be released, and lets go after feeling that he is dead.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: TxamsEm floats to the surface, drifts ashore, is warmed by the sun, opens
    his eyes, rises, and notices that some feathers have come off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: TxamsEm encounters a still Fish, weeps, says it resembles his recently dead
    grandfather, and calls it ashore to talk.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Fish approaches but retreats, saying it knows TxamsEm's intentions and
    calling him Giant.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: TxamsEm speaks words that make the Fish have a thin tail and a large thick
