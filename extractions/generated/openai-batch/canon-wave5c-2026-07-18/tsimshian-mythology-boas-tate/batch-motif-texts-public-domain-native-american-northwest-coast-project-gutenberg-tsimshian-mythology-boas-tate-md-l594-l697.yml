  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: TxamsEm returns toward the mainland hungry and finds a village where a large
    dead whale lies on the beach.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wearing the raven blanket, TxamsEm flies over the whale and speaks in Raven
    language.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Unrecognized among gamblers, TxamsEm interprets the Raven-language words as
    a warning that pestilence may come to the village.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The people are troubled; the chief orders the people to move; a slave announces
    the order; and the tribe moves the next morning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: TxamsEm lives in the chief's house, carves the whale, fills four houses with
    meat and fat, and eats the whale meat and fat for a long time.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: TxamsEm takes one of the chief's dancing-garments, throws away the raven blanket,
