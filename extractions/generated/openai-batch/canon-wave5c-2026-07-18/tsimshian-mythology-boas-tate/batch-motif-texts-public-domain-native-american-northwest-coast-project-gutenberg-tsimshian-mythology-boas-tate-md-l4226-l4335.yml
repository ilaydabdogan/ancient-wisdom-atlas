canonical_text:
  quote: ''
  summary: A group of ten couples fleeing pursuers repeatedly causes avalanches that
    kill pursuing multitudes. The chief Baboudina of Mosquito Town catches up and
    kills nearly all of them with his crystal proboscis. The youngest woman escapes
    into a lake and climbs a tree over the water. Baboudina repeatedly dives at her
    reflection, becomes cold, and freezes to death. The woman cuts him open, removes
    his still-living heart, and revives her companions by swinging it over their bodies.
  language: English
  quote_policy: summarized
