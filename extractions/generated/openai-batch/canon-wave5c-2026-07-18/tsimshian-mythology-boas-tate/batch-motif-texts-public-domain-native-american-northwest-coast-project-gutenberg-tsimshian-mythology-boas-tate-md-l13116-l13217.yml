canonical_text:
  quote: ''
  summary: In ancestral times, animals sometimes had human spouses. A young prince
    and expert hunter leaves his beloved wife at home. While he is away, she meets
    a good-looking young man near a lake, takes him as a lover, and receives him nightly.
    The prince returns secretly after failed hunting, questions the maid, and learns
    of the affair. His friends kill and decapitate the lover in the prince's bed.
    The dead man's animal-covered garments, armor, and wolf-tail hat are taken as
    crests; wise men identify him as a prince of Wolves and advise building a fort
    against possible wolf attack.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens by stating that, in the time of the forefathers, animals
    sometimes had a woman or a man as wife or husband.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great prince, son of a great chief in old Metlakatla, is an expert hunter
    with three chosen young male friends and a beloved wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince's wife wears fine animal-skin garments and tells her husband about
    other princes' attempts to seduce her.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the prince leaves for a stated absence, his wife walks with her maid
    around the lake behind the village and sends the maid to pick cranberries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A good-looking young man comes to the wife by the lake; she smiles, invites
    him to sit, embraces and kisses him, and later lies with him while the maid is
    sent away again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man is described as wearing a garment with cloven feet and armor
    with ears of wild animals.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man agrees to come to the wife at night while the husband is away,
    and he visits her house for several nights; the wife orders the maid not to tell
    anyone.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The prince becomes unsuccessful in hunting and returns home secretly at night
    with his three friends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prince wakes the maid, threatens her if she conceals the truth, and the
    maid reports the wife's meetings and nightly visits with the young man.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The prince tells his three friends, and they enter the wife's bedroom and
    kill the man lying in the master's bed, cutting off his head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the morning, the slain man's garments are seen to be covered with cleft
    feet of deer and mountain sheep, his armor with ears of reindeer and red deer,
    and his hat with a wolf's tail.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The prince keeps the slain man's body and head in a box behind the house and
    takes the garments, armor, and hat as his crests.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The prince is not angry with his wife because he has received costly crests
    through her.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The old chief calls wise men, who identify the dead young man as a prince
    of the Wolves and advise building a strong fort against cruel wolves who might
    devour wives and children.
  category: speech
  evidence_refs:
