candidate_motifs:
- id: motif:1
  label: Return to the deserted provider during famine threat
  taxonomy_refs:
  - return
  basis: The chief orders the tribe to return to the old town where they deserted
    the prince because they fear starvation and believe he has abundant food.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The return is a community's return to a place and person, not necessarily
    a completed heroic return pattern.
- id: motif:2
  label: Rejected community receives pity and food distribution
  taxonomy_refs:
  - sacred_exchange
  basis: After initially forbidding landing, the prince takes pity and distributes
    whales and blubber to relatives and the people.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The exchange is social and ceremonial in the passage; the term 'sacred'
    is not used.
- id: motif:3
  label: Food gift paired with marriage alliance
  taxonomy_refs:
  - sacred_exchange
  basis: The prince gives a whale to his youngest uncle, and the uncle gives his daughter
    to the prince as wife.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage presents the transaction and marriage, but does not explicitly
    mark it as sacred.
- id: motif:4
  label: Potlatch wealth establishes chiefly greatness and names
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: The prince gains wealth, holds great feasts and potlatches, gives valuables
    to chiefs and other elites, takes new names, and becomes a great Tsimshian chief.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  - ev:17
  confidence: high
  cautions: The passage supports status-making through names and distributions; broader
    political meaning should be reviewed by a specialist.
- id: motif:5
  label: Animal benefactors provide inexhaustible abundance
  taxonomy_refs: []
  basis: Eagles give the prince whales, sea mammals, salmon, halibut, and other fish
