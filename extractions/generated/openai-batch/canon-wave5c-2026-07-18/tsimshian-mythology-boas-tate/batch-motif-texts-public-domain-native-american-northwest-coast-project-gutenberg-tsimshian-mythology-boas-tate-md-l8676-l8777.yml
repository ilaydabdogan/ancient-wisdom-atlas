canonical_text:
  quote: ''
  summary: A chief orders his people to return to the old town where they had deserted
    a prince, hoping the prince will spare them from starvation. The prince initially
    refuses them landing, waits for his youngest uncle, gives him a whale, marries
    the uncle's daughter, distributes whales and blubber, trades provisions for wealth,
    holds great potlatches, takes new names, and becomes a renowned Tsimshian chief
    while eagles continue to bring him sea animals and fish. The next tale begins
    after the Deluge, when a rebuilt town has a chief with a closely guarded daughter,
    Su-da'!. A young man begins visiting the princess at night, and she loves him.
  language: English
  quote_policy: summarized
