canonical_text:
  quote: ''
  summary: 'Opening of the Txa''msem/Raven legend: in a world covered with darkness,
    a chief and chieftainess at Kungalas have a beloved son who dies. His body is
    prepared and placed on a raised bed while the parents and tribe mourn. A bright
    youth appears where the body had been and says Heaven sent him because of their
    wailing. The youth at first refuses food, and the father later sees the original
    corpse still present. After the shining youth tastes a scab mixed into whale meat
    by slaves called Mouth At Each End, he becomes ravenously hungry and consumes
    the household and tribal provisions.'
  language: English
  quote_policy: summarized
