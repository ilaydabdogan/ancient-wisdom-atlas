canonical_text:
  quote: ''
  summary: The passage first recounts a grieving prince seeing a copper-featured beaver
    at a lake; the people later kill the beaver, remove its copper parts, and adopt
    it as the Eagle Clan crest used by the head chief in potlatch regalia. It then
    begins the story of Princess Sagapgia, who disappears from a canoe amid foam near
    Sandy Bay; wise men and shamans say she was taken and married by the son of the
    supernatural being of Sandy Bay. Her uncle sacrifices wealth goods that reach
    the undersea house. Mouse Woman explains the situation to Sagapgia, who remains
    there, bears children, and witnesses the supernatural chief rapidly grow them
    and host supernatural beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sorrowing prince leaves camp, reaches a plain with a large lake, and weeps
    there because his brothers were swallowed by a supernatural halibut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince sees a large beaver on the lake with copper eyes, ears, teeth,
    and claws; the beaver strikes the water with its tail, making a thunder-like noise.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people later hunt the beaver, break the lake dam after many days, kill
    and skin the beaver, and remove its copper claws, ears, eyes, and teeth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After killing the beaver, the people take it as a crest; the passage says
    the Eagle Clan uses it, no other clan can use it, and the head chief LEg'e'°x
    wears the beaver hat at a great potlatch.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Princess Sagapgia is described as the beautiful niece of a great chief and
    as beloved by the young women of her uncle's tribe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sagapgia travels in the center of a large canoe with young women of a Raven
    group; when the canoe passes foam over a sandbar near Sandy Bay Creek, she is
    missing and foam fills the place where she had been sitting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wise men say the supernatural being of Sandy Bay took Sagapgia; shamans later
    say the son of the great supernatural being of Sandy Bay married her.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Sagapgia's uncle sacrifices grease, berries, skins, coppers, garments, shells,
    canoes, and slaves; Sagapgia sees these things enter the house of the chief of
    Sandy Bay at the bottom of the sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mouse Woman tells Sagapgia to throw her woolen ear ornament into the fire,
    removes the burnt wool, and tells her she is in the house of a great supernatural
    chief whose son wants to marry her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sagapgia remains in the undersea house for many years, bears a son, and the
    father-in-law names the child and pulls his forehead, legs, hands, and body.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The supernatural chief asks Useless-River to send Sagapgia a baby girl; she
    conceives and gives birth, the chief makes the children grow quickly, and later
    he invites supernatural beings of the rocks and feeds them.
  category: sequence
  evidence_refs:
  - ev:10
