canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a young husband later identified
    as Spider teaches a woman and her mother how to make nets and use them to obtain
    and dry salmon. The widow distributes dried salmon and becomes wealthy but keeps
    the net hidden. In Spider's home, Mouse Woman warns the wife not to eat Spider
    food or she will become a spider. The next tale, “Prince Snail,” begins with a
    wealthy chief who keeps his daughter closely guarded while refusing many suitors.
    The daughter kicks a snail and asks if it would like to marry her; two nights
    later a smooth-skinned handsome young man visits her at midnight and leaves before
    daylight.
  language: English
  quote_policy: summarized
