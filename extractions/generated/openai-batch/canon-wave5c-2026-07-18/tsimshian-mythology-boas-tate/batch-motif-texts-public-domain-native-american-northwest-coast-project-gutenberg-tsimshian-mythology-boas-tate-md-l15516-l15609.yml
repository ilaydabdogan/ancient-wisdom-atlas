canonical_text:
  quote: ''
  summary: Haimas intimidates his brother-in-law and accompanying men by taking a
    small neck dagger, having it thrown into the fire, displaying many boxes and stores
    of weapons, and throwing daggers near the seated men. Later Haimas has his uncle
    and father-in-law Nes-y!aga-ne't brought to his village, welcomes him, and questions
    him about chiefs, memory, and feast songs during Haimas's absence. Angered by
    the reported songs, Haimas orders an attendant to kill Nes-y!aga-ne't after the
    meal. Haimas places a valuable copper beneath the dead man's head, while QtsPl
    hides Nes-y!aga-ne't's Raven headdress in an old fish basket before Haimas's men
    can find it. The Git-dzi'°s and Haimas then move up Nass River with their respective
    groups, the former carrying their chief's body.
  language: English
  quote_policy: summarized
