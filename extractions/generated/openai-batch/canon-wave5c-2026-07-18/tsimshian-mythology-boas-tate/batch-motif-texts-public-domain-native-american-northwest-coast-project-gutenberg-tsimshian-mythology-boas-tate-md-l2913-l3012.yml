canonical_text:
  quote: ''
  summary: The youngest brother, called Dirty, secretly bathes in cold water at midnight
    and sleeps in ashes, while his elder brothers mock him. After they ridicule his
    claim that he can pull out a tree branch, he goes sadly up a brook and meets a
    bright-skinned supernatural young man. The being grants his wish to become clean
    and strong, washes him four times in a pond with leaves from a supernatural tree,
    and has him repeatedly plunge into the pond and uproot increasingly large spruce
    trees. Dirty returns, easily pulls out the branch his brothers had tried to remove,
    later demonstrates his strength by carrying and breaking up an uprooted spruce
    for firewood, and his brothers are ashamed. In the public contests that follow,
    two elder brothers are defeated by visiting wrestlers.
  language: English
  quote_policy: summarized
