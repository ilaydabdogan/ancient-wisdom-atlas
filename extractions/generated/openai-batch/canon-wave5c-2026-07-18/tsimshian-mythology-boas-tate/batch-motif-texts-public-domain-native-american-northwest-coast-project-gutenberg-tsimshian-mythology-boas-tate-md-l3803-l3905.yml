canonical_text:
  quote: ''
  summary: The passage first closes an animal-remains instruction in which burned
    bones and meat help animals recover, then begins the tale called “The Giant Devilfish.”
    Human hunters witness Killer Whales gathering after their prince is killed by
    a Giant Devilfish at a precipice. The Killer Whales speak like people, have clans
    and crests, and send warriors in successive dives against the monster; many die
    while severing its arms. A Raven-clan warrior named Bird Garment dives twice,
    brings up two arms, and survives tired but unharmed.
  language: English
  quote_policy: summarized
