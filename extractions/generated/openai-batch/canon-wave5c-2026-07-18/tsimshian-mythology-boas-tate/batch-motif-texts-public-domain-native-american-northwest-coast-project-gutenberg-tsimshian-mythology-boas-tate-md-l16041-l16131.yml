canonical_text:
  quote: ''
  summary: 'The passage recounts Tsimshian-Tlingit conflict: scouts find an abandoned
    Tlingit camp; the Tsimshian claim the country after victory; a later gun battle
    includes a formal challenge and death of the Tlingit challenger; two years later
    the Tlingit request peace, and a public peace ceremony carries and seats representative
    princes from both sides, followed by mourning dances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief sends two scouts, who secretly find a camp empty while fires, garments,
    vessels, and coppers remain in the houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tlingit had fled after four men in a little canoe warned the camp to flee
    before their enemies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fleeing Tlingit cross the mountains, join other Tlingit at K-ts!Em-adi'°n
    Creek, load canoes with stored foods, and move away to Alaska.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tsimshian are said to own the whole country after gaining victory over
    the Tlingit, who repeatedly fail to regain that side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The last war with the Tlingit is placed in the generation of the narrator's
    grandparents, after white men had arrived on the coast, when guns were known.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A hunting-canoe warns the Tsimshian descending from Nass River that Tlingit
    warriors are coming to fight; Tsimshian warriors then take twenty canoes ahead
    of the other canoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At K-hp-g"anlin, a Tlingit warrior named Lax-duxat comes forward and challenges
    someone to fight him before the battle begins.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man of LEg"e'°x's tribe accepts the challenge and states that the death
    of either combatant will determine victory for that combatant's people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lax-duxat runs forward saying he will take off his opponent's head; he has
    a dagger tied to his left wrist, a gun in his right hand, a red shirt, and a helmet
    of white weasels.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lax-duxat fires his gun, but IladagEm l!i' / HadagEm l!l' shoots him in the
    forehead, and Lax-duxat falls dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After gunfire begins, the Tlingit are vanquished and flee; the Tsimshian pursue
    them, many are killed, heads are cut off, and few canoes return north.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator says grandparents remembered the war and that the narrator's
    grandmother's uncle was killed in it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Two years later the Tlingit send a message to Chief LEg'e'°x asking to make
    peace, and LEg'e'°x replies that there should be peace.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A large number of Tlingit canoes arrive on Nass River before Chief LEg'e'°x's
