canonical_text:
  quote: ''
  summary: In Chief Na-gun-a'ks's house, rushing water and carved rooms appear, including
    killer-whale and seaweed carvings and copper objects. Na-gun-a'ks blesses Dragging
    Along Shore, gives ritual instructions and gifts, and sends the men to sleep in
    their canoe. After foam, fog, thunder, and sunlight, the men find themselves near
    the cliff where they had anchored a year earlier, with the canoe, paddles, hats,
    and clothing covered in sea growths and shells. They return home in the copper
    canoe, are first mistaken for a sea monster, and then are welcomed. Dragging Along
    Shore recounts the visit to the chief at the bottom of the sea, displays gifts
    and crest regalia, and later hosts a feast where invited chiefs wear their own
    crests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The door of Chief Na-gun-a'ks's house opened, water ran in through it, the
    canoe floated above the first platform, and after the water subsided carved side
    rooms appeared inside the house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One carved side room had two killer whales with joined noses and was called
    Dash Against Each Other; the other was carved with green seaweed and contained
    copper canoe equipment and coppers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Na-gun-a'ks blessed Dragging Along Shore, promised that he would receive what
    he needed in his land, warned him not to hurt fish or anything seen in the water,
    and instructed him to offer burnt-offerings when hunting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Na-gun-a'ks told the steersman he would give him his own hat and gave him
    a large sea-apple shell with a living person in the center and a box inlaid with
    abalone shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the men slept in the canoe, the steersman saw a mountain of foam around
    it; the foam became thick fog, the men heard a thunder-like noise, the fog vanished,
    and bright sunshine appeared.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the fog vanished, the men's hats, the chief's hat in the bow, and the
    canoe were full of seaweed, sea anemones, and sea kale-like growths.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men saw that they were at the foot of the high cliff where they had dropped
    anchor a year before, and their paddles were heavy because they were made of copper.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dragging Along Shore told his men not to remove the seaweeds from the canoe,
    paddles, or clothes; when the paddle handles touched the canoe, they sounded like
    a bell, and the canoe traveled very fast to their home by midnight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dragging Along Shore's elder sister, who had been waiting for her lost brother,
    saw a large floating monster-like object with something alive on it making a bell-like
    sound and called her husband.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the husband asked who was there, the canoe party asked about the chief
    lost the previous winter and answered that they were coming home safe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The village gathered to welcome the long-lost men, though some were afraid
    because the men and canoe objects were covered with seaweeds, sea anemones, sea
    kales, and shells.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Young people could not lift the canoe because it was copper and very heavy;
    after other items were carried up, the four men themselves carried up the copper
    canoe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Dragging Along Shore summoned his tribe and told them about being in the house
    of a chief at the bottom of the sea, receiving presents, and receiving the host's
    crest.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Dragging Along Shore showed a killer-whale hat with horns, a garment of green
    seaweeds, two carved rooms, the copper canoe and paddles, a sea-apple hat, and
    a carved shell-set box-cover.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Dragging Along Shore arranged a great feast, invited chiefs, and asked each
    chief to wear his own crest, hat, and decorated garment; the invited chiefs wore
    their own crests.
  category: action
  evidence_refs:
  - ev:9
