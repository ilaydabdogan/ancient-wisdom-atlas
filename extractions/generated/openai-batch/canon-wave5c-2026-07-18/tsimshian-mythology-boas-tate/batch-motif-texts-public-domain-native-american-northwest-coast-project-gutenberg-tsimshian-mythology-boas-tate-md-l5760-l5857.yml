canonical_text:
  quote: ''
  summary: A young woman has a son, and a male visitor claiming paternity instructs
    her in restrictions and devil's-club practices for the boy. When grown, the son
    meets a man identified as his supernatural father, who teaches trapping, snares,
    taboos, fasting, washing, diving, and sexual or marriage restrictions tied to
    hunting wealth and luck. The son obeys and becomes a very successful hunter and
    wealthy. After the taboo period ends, his traps and snares fail repeatedly. He
    cannot find devil's-club, washes, sees a large tree on a hill, and is addressed
    by a supernatural being who tells him to cut down the tree because it will last
    through his lifetime.
  language: English
  quote_policy: summarized
