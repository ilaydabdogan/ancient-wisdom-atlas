canonical_text:
  quote: ''
  summary: The passage concludes a narrative in which a woman’s husband visits the
    village of her children, is spared by them, learns their all-night dances, and
    receives from Chief Mouse dance regalia and a command that humans must not mistreat
    mice. The man and his wife then teach songs and dances to human communities. The
    passage then begins a separate narrative about a chief’s nephew who marries the
    chief’s daughter, takes a second wife, and causes the first wife to withdraw in
    jealousy and grief to her father’s house and to a wooded place near a rock called
    Place Of Supernatural Beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman hears a low moan calling her name, recognizes her husband’s voice,
    meets him secretly, is embraced by him, and tells him about her children and their
    dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman warns that her children will kill her husband; four young men come
    for their mother, see the man, and say they must kill him, but she asks them to
    spare him because he is her husband and like their father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young men allow the man to stay among them for four days and then require
    him to return to his own house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The village sleeps during the day, wakes before dusk, eats, and dances all
    night until daybreak; during this stay the man learns the songs and dances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of four days, Chief Mouse sends the man home and says the woman
    will be sent back after four more days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chief Mouse commands humans not to maltreat mice, says the mice on the island
    are of noble blood, and threatens death for humans who do something bad to a mouse.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Chief Mouse gives the man a dancing-feather, a neck-band, and a skin drum,
    and tells him to teach his people how to dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The man returns home, teaches his people the song, puts on an eagle feather
    and necklace, and dances before men, women, and children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife returns after four days, teaches songs to women, and the different
    villages on Queen Charlotte Islands learn to dance because Mouse taught them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The next narrative begins in the town of G'it-cjxa'la, where a great chief
    has a beautiful daughter and a wealthy hunting nephew who is to succeed him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young chief marries his uncle’s daughter with the great chief’s agreement,
    and the couple love each other.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: After a year, the young chief wants another princess as wife; his first wife
    objects, but he marries the second princess while telling the first wife that
    he loves her more.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the fishing-ground, the young chief takes both wives in his canoe, builds
    a new house, and divides salmon brought by his slaves between the two wives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The first wife refuses her salmon because she is jealous, goes to her father’s
    people for salmon, and finally leaves her husband to live in her father’s house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The first wife often goes into the woods to gather berries and cry, while
    her mother tries to comfort her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Near the camp is a high steep rock called Place Of Supernatural Beings; the
    first wife sits at the foot of the rock and near a large old dry tree, weeping.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: Before entering her father’s house, the first wife hears a joyful voice in
    her husband’s house, becomes more sorrowful, goes to bed without eating, weeps
    all night, and returns the next morning to pick berries and cry.
  category: sequence
  evidence_refs:
  - ev:9
