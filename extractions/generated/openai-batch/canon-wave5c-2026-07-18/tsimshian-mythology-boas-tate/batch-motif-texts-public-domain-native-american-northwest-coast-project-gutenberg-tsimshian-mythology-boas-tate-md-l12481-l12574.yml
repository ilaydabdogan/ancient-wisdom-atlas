  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tsauda sprinkles the dead man's face with cold water of life from a spring,
    slaps his cheeks, commands him to return to life, and the prince sits up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tsauda tells the people that only his son-in-law and that man's descendants
