canonical_text:
  quote: ''
  summary: A young prince seeks copper upriver after his wife reports Tsauda's knowledge
    of it. A speared salmon becomes live copper, which kills the prince when he sleeps
    on it. His companions burn the live copper into soft pure copper and return with
    his body. The grieving wife, Moon, encounters Tsauda descending from a white-pine
    tree. Tsauda revives the prince with water of life, restricts the dangerous copper
    river to the prince's line, teaches the couple how to process live copper, warns
    against revealing the secret, gives protective pitch medicine, and returns to
    his supernatural home.
  language: English
  quote_policy: summarized
