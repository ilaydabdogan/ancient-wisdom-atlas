canonical_text:
  quote: ''
  summary: A great shaman catches a large Spring Salmon in his net. His supernatural
    helper identifies it as the chief of the Spring Salmon and says the lost prince
    is inside its stomach. The shaman summons helpers, ritual objects, and villagers.
    Shamans carry the salmon to the chief's house, circle the fire four times, and
    two old women shamans cut open the fish after naming it. A very small child is
    found in the stomach; as the shamans sing and rattle around him, he grows back
    to his former size. The restored prince recounts being taken to the town of the
    Spring Salmon and describes the salmon people's preparations for the season.
  language: English
  quote_policy: summarized
