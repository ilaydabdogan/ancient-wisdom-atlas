    stays among the Bears until fall.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male Bears go to brooks for salmon in the morning, female Bears go to the
    woods for berries, and they return home in the evening.
  category: action
  evidence_refs:
