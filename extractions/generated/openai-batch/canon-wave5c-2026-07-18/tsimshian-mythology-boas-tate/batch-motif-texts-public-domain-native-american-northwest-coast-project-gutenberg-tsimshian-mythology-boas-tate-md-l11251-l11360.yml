canonical_text:
  quote: ''
  summary: A woman called Part Summer lives as the wife of the Black-Bear chief's
    elder son among the Black Bear people. As winter approaches, the chief asks each
    family to name its den. Part Summer rejects many easy dens because her younger
    brother's dogs could reach them, and accepts a difficult rock-slide den. She tells
    the chief that her four brothers are expert hunters. The chief asks how many mats
    each brother has; groups of bears mourn when they hear the counts, which correspond
    to hunting-preparation periods. The chief orders the Bears to gather wild carrots
    and enter their dens when thunder rolls. Three brothers later kill sixty, forty,
    and twenty black bears. The youngest brother goes hunting with his dogs Red and
    Spots, finds nothing, cries while remembering his lost sister, and the dogs go
    up a mountain with rock-slides on both sides.
  language: English
  quote_policy: summarized
