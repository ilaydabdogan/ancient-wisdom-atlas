- id: obs:3
  text: Some male and female Bears fail to return with the rest; their absence is
    described through broken fishing-lines or torn carrying-straps, and the passage
    links such absences to a Black Bear being killed or to a delayed return from the
    woods.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Before winter, the Black-Bear chief gathers his people and asks each family
    which den they will lie down in for the winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Part Summer rejects named dens as too easy for her younger brother's dogs,
    Red and Spots, and accepts the difficult den called Both Sides Rock Slide or Both
    Sides Drum.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Part Summer says she has four brothers, all expert hunters, and says she wants
    a difficult winter den so that they will not kill her and her husband easily.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Black-Bear chief asks how many mats each of Part Summer's brothers has;
    when the answers are sixty, forty, twenty, and five, corresponding numbers of
    Black Bears hang their heads and cry or have water run down their noses.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The passage explains that the eldest brother's sixty mats mean repeated twenty-day
    periods alone with cedar-bark mats and bathing every second day; a note says the
    custom was used for success in hunting.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Black-Bear chief instructs the Bears to gather wild carrots for their
    dens and to go to their own dens when they hear thunder rolling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the following morning, the Bears go out, thunder is heard, and each Bear
    family goes to its own den.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The eldest, second, and third brothers each spend a month in the mountains
    and kill sixty, forty, and twenty black bears respectively.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The youngest brother hunts with his dogs Red and Spots, finds nothing for
    many days, cries at the foot of a mountain while thinking of his lost sister,
    and then the dogs raise their noses and go up a mountain with a rock-slide on
    each side.
  category: sequence
  evidence_refs:
  - ev:9
