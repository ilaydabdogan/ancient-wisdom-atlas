canonical_text:
  quote: ''
  summary: Before daylight, canoe-borne men open a coffin and take a prince to the
    village of the Salmon people. The prince's friend follows unseen, later becomes
    visible to the prince through a pebble token, observes Salmon people customs and
    dances, grows homesick, and receives from the prince instructions concerning return
    and the proper cutting of spring salmon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before daylight, people arrive by canoe at the beach, go to the coffin, loosen
    its rope, open it, and say the prince's father the chief sent them to take him
    down.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince rises from the coffin, descends joyfully with the men, and does
    not respond when his friend urges him not to go with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The friend jumps into the canoe, but the four men and the prince do not see
    him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the friend sits beside the prince and speaks to him, the prince does
    not notice him and instead tells the men to pull hard because something touches
    his right side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The friend presses the large red cedar-bark throat ornaments of the steersman
    and the other men; each faints and revives after he lets go.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the canoe reaches the village of the Salmon people, the whole village
    rejoices, and the prince is taken into the chief's house while the friend remains
    outside unnoticed.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The friend finds a small pebble in his own mouth, places it in the prince's
    mouth, and the prince then sees him sitting by his side.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prince embraces the friend and asks whether he came along; the friend
    answers that he came with the beloved prince.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prince tells the friend that, if hungry, he should go behind the village,
    take a child playing on the sand-hill, club it, roast it whole, eat, burn the
    remains including bones, and drink fresh water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Only the prince knows the friend is present among the Salmon people; at night
    the two lie in one bed and talk together.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prince instructs the friend to look at the dancers through a knot-hole,
    not to enter, and to put small hemlock leaves into the knot-hole.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The friend hears drum and singing, looks through the knot-hole, and sees a
    house full of eagle down where Salmon people dance wearing garments set with abalone
    shells.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After looking through the knot-hole, the friend's eye is full of herring spawn;
    the hemlock branch he inserts and withdraws is also full of herring spawn, which
    he eats.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After a long stay, the friend becomes homesick and cries for his parents,
    brothers, sisters, and village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The prince says he will take the friend up in early spring because ice covers
    the rivers and travel up the Skeena River is not possible until the ice melts.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The prince says he will take the friend to the mouth of the Skeena River,
    then return and stay while his Salmon father is alive; the friend is to tell the
    story in the prince's father's house.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The prince reports that his Salmon father instructed people of the canyon
    to cut spring salmon head and tail first with a mussel-shell knife, not to break
    the tail by hand, and not to use stone or bone blades.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The reported consequence for improper salmon cutting is thunder, lightning,
    heavy rain, and disaster for the people.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: The friend says he does not want to leave the prince and worries that the
    prince's relatives and father will complain if the prince does not return with
    him.
  category: speech
  evidence_refs:
  - ev:10
