canonical_text:
  quote: ''
  summary: A shaman prince, guided by supernatural power, defeats the chief of the
    Ghosts, gains greater power, revives a drowned princess from her skeleton with
    ashes and an eagle tail, is plotted against by other shamans, announces his own
    death and one-year return, dies in a coffin wearing regalia taken from the Ghost
    chief, and later appears from the tree-borne coffin in owl form while his kin
    are afraid to catch him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People outside report that their arrows have failed and have come back to
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman prince's supernatural power tells him to run four times around
    the chief who pretends to be sick and then kick the ground at the chief's head.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the shaman prince kicks the ground, the earth opens, swallows the chief
    of the Ghosts, and the passage calls this the chief's second death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The shaman prince's supernatural powers take the chief of the Ghosts and drop
    him into the burning river before the Ghost town, and the prince returns safely
    to his own village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The shaman prince is said to have double the power he had before; his fame
    spreads, and sick people pay him for healing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that dead men were known to be very dangerous to shamans.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: A princess has drowned in a flooded river; after a long search, her skeleton
    is found caught by a branch at the riverbank and is brought to her father's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The shaman prince arrives wearing things taken from the house of the Ghost
    chief, starts a song with his companions, and receives instructions to sprinkle
    ashes on the skeleton four times and then fan it with an eagle tail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hot ashes stick to the princess's bones, gather on the skeleton, and after
    four applications the bones are covered with flesh and skin; after fanning with
    the eagle tail, the princess comes back to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The princess's father pays the shaman prince with slaves, costly coppers,
    canoes, and other goods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other shamans secretly agree to entrap the shaman prince; after being warned
    by his supernatural power, he enters their house, eats food identified by the
    power as dried human flesh, and becomes sick at midnight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The shaman prince tells his relatives that he will die and come back to life
    after a year if someone stands under his coffin to catch him; his nephew volunteers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The shaman prince asks for his dancing-apron, crown, and rattle taken from
    the Ghost chief, runs around the fire four times following the course of the sun,
    enters a square box used as a coffin, and dies wearing those items.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The coffin is placed on a branch of a large tree; after one year it opens,
    and the shaman prince is seen in the form of an ugly owl; his relatives are afraid,
    and attempts to catch him fail in the passage.
  category: sequence
  evidence_refs:
  - ev:9
