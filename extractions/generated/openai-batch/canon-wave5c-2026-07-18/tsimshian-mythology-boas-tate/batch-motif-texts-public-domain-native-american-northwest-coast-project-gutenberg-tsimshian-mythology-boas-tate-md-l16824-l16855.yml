canonical_text:
  quote: ''
  summary: After a war, Chief LEg'e'^x keeps a Haida prince and two followers under
    peace customs, then sends the prince home with valuables. A woman blamed for striking
    a Tsimshian princess is almost killed by the Haida, but her uncle, a great chief,
    promises lifelong compensation for war losses. He later distributes coppers and
    kinship transfers, pays for the slain, gains head-chief status, and dies after
    some years. The passage closes by identifying this as the last great war between
    the Tsimshian and Haida and noting heavy Haida losses at Rose Island.
  language: English
  quote_policy: summarized
