canonical_text:
  quote: ''
  summary: A supernatural husband takes his child to his own parents and later returns
    the child in a carved living cradle at Mount K-xamin, where the human family makes
    offerings. The supernatural being promises to aid his wife and kills the woman
    who married her former husband by sending killer whales to capsize her canoe.
    The supernatural son grows rapidly, becomes an expert hunter and fisher, gains
    great wealth in marine food, and his grandfather distributes this abundance to
    famine-stricken villagers.
  language: English
  quote_policy: summarized
