  text: The supernatural being asks his wife to let his parents see the child and
    says his father will make a cradle for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supernatural being tells his wife to come after two days to the foot of
    Mount K-xamin, below the high rock, to receive the child again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young woman and her parents take elk skins, red ocher, and eagle down,
    travel by canoe upriver, and arrive at the foot of Mount K-xamin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A carved living cradle comes down on the water near the high rock while a
    supernatural lullaby is heard; the child is asleep in the cradle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a voice tells the young woman to take the child, she takes up the cradle,
    and the old chief throws elk skins, red ocher, and eagle down into the water,
    where they go down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The supernatural being tells his wife that she may go home with her father's
