canonical_text:
  quote: ''
  summary: At a house gathering with song and dance, a mountain appears and a Mountain
    Goat destroys the house, killing the people except Really Black. His friend, revealed
    as a young Goat, explains that the Mountain Goats acted in vengeance because hunted
    goat remains had been left unburned. The young Goat gives instructions and a garment
    for descending the steep mountain and reviving relatives by jumping over their
    bodies four times. Really Black follows the instructions, restores the dead, hangs
    the blanket on a tree, and later the people burn the goat bones, meat, and skins.
  language: English, with embedded song syllables/transcription
  quote_policy: summarized
