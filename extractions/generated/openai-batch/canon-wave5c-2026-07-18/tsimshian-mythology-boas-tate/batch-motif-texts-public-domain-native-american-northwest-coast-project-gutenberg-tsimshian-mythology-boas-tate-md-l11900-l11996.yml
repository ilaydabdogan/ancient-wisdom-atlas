canonical_text:
  quote: ''
  summary: During a winter famine, a thin stranger visits several chiefs. Elder chiefs
    give him snow instead of food, but the youngest chief and his household feed him
    their last salmon and other provisions. The stranger promises a costly crest.
    At dawn the chief, his wife, and his nephew cross the river to a rock-slide, where
    figures bearing regalia and carved dishes sing, give them the objects, and transform
    into three grizzly bears. The elder brothers arrive too late. The youngest chief
    becomes wealthy, feeds the people during the famine, gives away property, and
    the crest continues through generations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The second chief invites the thin man in, seats him by the fire, asks about
    his journey and food, and hears that he has eaten only snow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second chief has wet snow brought in a large wooden dish with a spoon;
    the thin man does not eat it and leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The third chief repeats a similar reception: the thin man says his distant
    village is far away and that he has eaten only snow, but he does not eat the snow
    brought to him and leaves.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people are still dying of starvation when the thin man comes again from
    the woods.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The youngest of the four chiefs sends a servant and nephew to invite the visitor,
    seats him by the fire, and says he is ashamed of the elder brothers' lack of pity
    toward a stranger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's wife finds only one large spring salmon left in the salmon-box,
    roasts one half, and sets the other half aside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The thin man eats the roasted dried salmon, soaked dried berries mixed with
    fresh red berries, and other provisions supplied by the household.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief gives the thin man the remaining half of the dried salmon to eat
    on his way home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before leaving, the thin man says he is pleased because the chief's household
    showed kindness and gave their last provisions during starvation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The thin man says the elder brothers made fun of him and gave him only snow,
    and he promises to reward the youngest chief with a costly crest the next morning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The thin man instructs the chief to go by canoe with his wife and nephew when
    they hear a noise, and to let the three brothers come afterward.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before daybreak, the chief hears something like a song across the river, crosses
    with his wife and nephew, and reaches the foot of a rock-slide.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Above the rock-slide, a man descends wearing four crests, a grizzly-bear hat,
    red leggings, and carrying a bow; another young man descends wearing a mountain-goat
    hat; a woman descends with two large dishes, one carved with live frogs and one
    with a mountain spring.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The descending figures sing a mourning-song and repeat it many times.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The man with the grizzly-bear hat gives the hat, red leggings, and sinew bow
    to the chief; the young man gives the mountain-goat hat to the chief's nephew;
    the woman gives the two dishes to the chief's wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After giving the objects, the three figures go up the rock-slide again and
    are transformed into three grizzly bears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The three elder brothers cross the river later, meet the youngest brother
    returning, and come back empty-handed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The young chief becomes the richest among his people, uses the sinew bow to
    shoot many animals, and has meat, fat, and skins during the winter famine.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: The young chief feeds all his people and his three brothers, and people bring
    him property as presents.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: Before the famine ends, the chief invites people of the river, gives property
    away, sings a mourning-song while piling up property, and the crest continues
    through generations.
  category: sequence
  evidence_refs:
