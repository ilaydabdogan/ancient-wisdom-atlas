candidate_motifs:
- id: motif:1
  label: Generosity to a stranger in famine rewarded with sacred goods
  taxonomy_refs:
  - sacred_exchange
  basis: The youngest chief's household gives the visitor its last provisions during
    starvation, after which the visitor promises a costly crest and the household
    receives regalia, dishes, and lasting wealth.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage does not identify the thin man as divine; the motif is limited
    to the observed exchange of hospitality for valued gifts.
- id: motif:2
  label: Hospitality contrast between elder brothers and youngest brother
  taxonomy_refs: []
  basis: The elder brothers give snow and are said to have made fun of the visitor,
    while the youngest chief shows pity, receives the gifts, and the elder brothers
    arrive too late.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage frames a moral contrast but does not explicitly name it as
    a test or divine judgment.
- id: motif:3
  label: Animal-human transformation of gift-givers
  taxonomy_refs:
  - shapeshifter
  basis: The three figures who bring regalia and dishes return up the rock-slide and
    are transformed into three grizzly bears.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage states the transformation but does not specify whether these
    figures are identical with the earlier thin man.
- id: motif:4
  label: Acquisition of a hereditary chiefly crest and wealth
  taxonomy_refs:
  - royal_legitimacy
  basis: The young chief receives a costly crest and regalia, becomes the richest
    among his people, distributes property, and the crest continues through generations.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is interpretive; the passage specifically emphasizes
    a crest, wealth, feeding, and generational continuity.
- id: motif:5
  label: Giving the last food leads to abundance
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The chief's household gives the visitor the last salmon during famine; afterward
    the chief gains a bow that provides abundant animals and feeds the people.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  confidence: medium
  cautions: The act is narrated as kindness and pity rather than as an explicit ritual
