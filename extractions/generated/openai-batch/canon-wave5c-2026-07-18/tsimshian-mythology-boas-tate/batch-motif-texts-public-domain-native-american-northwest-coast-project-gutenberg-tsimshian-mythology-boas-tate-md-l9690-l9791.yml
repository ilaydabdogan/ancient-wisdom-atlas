canonical_text:
  quote: ''
  summary: A starving prince and his wife leave a snow-covered old home, reach a summer
    place, recover from famine through fishing, drying food, hunting, and travel by
    canoe. Their child later becomes the wife of the eldest of four young men identified
    as offspring of a wild duck connected with South Wind and North Wind; she repeatedly
    bears four children at once, and their descendants are associated with heavy snowdrifts
    and a winter taboo against throwing stones at wild ducks. The passage then begins
    a new tale in which the GispawadwE'da defeat the Eagle people, and the Eagle chief
    Nes-wa-na'° flees with his niece Daul to Eagle relatives on the Nass River, where
    he becomes chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince and his wife leave their old home in heavy snow, travel downriver
    on snowshoes, and reach a place where it is summer while black clouds remain over
    the village behind them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince is weak from starvation, and his wife suckles him; after fish are
    caught, he tells her to eat the fish and continue suckling him until he grows
    stronger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife sees small trout in shallow river water; the prince makes a small
    red cedar fish trap, and the trap catches trout overnight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince makes larger traps, catches trout, eels, and salmon, builds a weir
    and salmon-smoking house, and the famine ends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: They dry salmon and berries, build and load a canoe, travel downriver, reach
    Ksdal, and build a house in an unknown country.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In autumn the prince hunts mountain goats while his wife stays home with her
    unborn child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The prince finds a large lake, walks on its ice, climbs a mountain, and sees
    smoke in a valley on the other side; his wife cries because she thinks she has
    lost him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Toward the end of a hard winter, the family crosses the lake with food and
    a new child, crosses a mountain and plain, reaches a brook, and is ferried to
    a house where four young men give them food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eldest of the four young men and the girl love one another; after her
    father and mother die, the girl lives with the four young men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The four young men are identified as offspring of a wild duck sent by the
    daughter of the South Wind while she was in Chief North Wind's house.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The eldest young man marries the girl, who repeatedly gives birth to four
    children at one time; the descendants become numerous and powerful, and heavy
    snowdrifts occur wherever they move.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states a rule that people should not throw stones at wild ducks
    in winter, lest a heavy snowstorm begin.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: A new tale begins with a war at G'itslEmga'lon between the GispawadwE'da and
    the Eagle Clan; the GispawadwE'da defeat the Eagle people, killing many of them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Eagle chief Nes-wa-na'° flees with his young niece Daul across the mountains
    between the Skeena and Nass Rivers, reaches Eagle relatives on the upper Nass
    River, is received gladly, and becomes their chief.
  category: sequence
  evidence_refs:
  - ev:11
