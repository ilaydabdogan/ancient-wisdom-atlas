candidate_motifs:
- id: motif:1
  label: curse-based transformation into fish with etiological explanation
  taxonomy_refs:
  - shapeshifter
  basis: Tsauda's curse changes Halus into a red cod, and the passage explains present
    red cod behavior from that event; Halus's wife also becomes a blue-side cod.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents transformation rather than voluntary shape-shifting;
    the taxonomy reference is approximate.
- id: motif:2
  label: lost woman returns through later birth
  taxonomy_refs:
  - death_rebirth
  basis: Tsauda says the daughter born to his wife is his sister-in-law come back
    again through his wife, and the mother-in-law is comforted because her daughter
    has come back.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The earlier woman is transformed or lost rather than explicitly killed;
    rebirth language is present but the mechanics are not detailed.
- id: motif:3
  label: child given to bereaved kin as replacement or restoration
  taxonomy_refs:
  - sacred_exchange
  basis: Tsauda gives one daughter and later a promised second child to his mother-in-law,
    restoring girls like those lost before.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The exchange is familial and restorative; the passage does not explicitly
    call it sacred.
- id: motif:4
  label: rapid maturation during supernatural flight
  taxonomy_refs: []
  basis: While Tsauda flies toward his father-in-law's home with his daughter, the
    child is grown into a woman and emerges from under his wings.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states the event but gives little explanation of its mechanism.
- id: motif:5
  label: quest for valuable substance guided by supernatural knowledge
  taxonomy_refs:
  - mystical_quest
  basis: The prince seeks good copper at Copper Creek based on information from Tsauda
    through the elder girl, traveling upriver with companions and encountering supernatural
    fragrance and the living tree.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The intended object is copper, but the achieved wealth comes from the
    tree of odors rather than directly from copper.
- id: motif:6
  label: dangerous living tree that embraces a human
  taxonomy_refs:
  - sacred_tree_axis
  basis: A live tree of odors embraces and squeezes the prince until its roots are
    dug out and its branches die; pieces of it then become highly valued.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The tree is supernatural and valuable, but the passage does not describe
    it as an axis, world tree, or cosmic center.
- id: motif:7
  label: acquisition of prestige wealth from supernatural material
  taxonomy_refs:
  - royal_legitimacy
  basis: The prince gains high prices from chiefs, princes, and princesses for pieces
    of the tree of odors and becomes a great chief.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage links wealth and chiefly status, but does not give a formal
    legitimacy ritual.
