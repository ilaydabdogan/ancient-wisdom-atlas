canonical_text:
  quote: ''
  summary: Tsauda curses Halus after Halus catches his bag net, causing Halus to become
    a red cod with an enduring bodily condition. Halus's wife becomes a beautiful
    blue-side cod, whom Tsauda releases after recognizing her. Tsauda's wife gives
    birth to daughters understood as returns of lost women, one named Another Dear
    Girl and another named Moon, and gives them to his mother-in-law. A later prince,
    husband of the elder girl, travels toward Copper Creek, encounters a living tree
    of odors that embraces and squeezes him, is rescued when his men dig out its roots,
    and becomes wealthy and a great chief by distributing and selling pieces of the
    tree and its soil.
  language: English
  quote_policy: summarized
