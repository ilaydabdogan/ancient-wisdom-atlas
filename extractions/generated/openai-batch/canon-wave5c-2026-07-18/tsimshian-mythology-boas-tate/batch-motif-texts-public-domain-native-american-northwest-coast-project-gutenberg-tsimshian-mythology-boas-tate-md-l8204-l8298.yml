canonical_text:
  quote: ''
  summary: A child floats between two islands. When people approach or harm the child,
    a water monster identified as Haklula'q claims the child and destroys canoes and
    people with storms, waves, foam, whirlpools, and by dragging canoes underwater.
    After repeated losses, only a young chief and a small group remain; they begin
    building and testing canoes from different trees, but the tested canoes break
    in rough seas and are destroyed.
  language: English
  quote_policy: summarized
