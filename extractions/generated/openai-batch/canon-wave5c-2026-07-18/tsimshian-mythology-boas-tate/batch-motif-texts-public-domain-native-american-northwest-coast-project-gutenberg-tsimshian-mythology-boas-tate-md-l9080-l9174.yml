canonical_text:
  quote: ''
  summary: A sad young woman, whose husband has married another princess, is visited
    by a shining supernatural man who asks her to marry him. He becomes her husband,
    provides food to her family, and fathers a bright boy. Her former husband tries
    unsuccessfully to take her back. Later, during a crabapple-picking expedition
    organized by the second wife, the supernatural husband tells the woman to join
    and bring containers. At a crabapple tree, unseen helpers shake down and sort
    the fruit; these helpers are later identified as silver-blue cod, slaves of the
    supernatural being or spirit associated with Mount K-xamin. The family cooks and
    stores the crabapples.
  language: English translation
  quote_policy: summarized
