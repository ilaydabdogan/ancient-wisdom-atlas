canonical_text:
  quote: ''
  summary: A prince secretly visits a lake at night and summons a lake woman by shouting
    four times. His friend imitates him, descends with the woman, abducts a boy from
    the lake-bottom house, and brings him to the prince. The boy, identified as the
    son of the prince and the lake woman, plucks out the eyes of the friend and the
    village people and strings the eyes on red-cedar bark. The prince and his sister
    survive with her newborn child. The prince returns the destructive child to the
    lake woman, who gives the prince gambling sticks that bring wealth and gives the
    sister a wealth garment, an ever-new belt, and a blessing connected with her crying
    child.
  language: English
  quote_policy: summarized
