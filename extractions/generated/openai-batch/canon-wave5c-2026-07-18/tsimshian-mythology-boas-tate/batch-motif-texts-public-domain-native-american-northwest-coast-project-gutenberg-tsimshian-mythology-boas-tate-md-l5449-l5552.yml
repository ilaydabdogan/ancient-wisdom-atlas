canonical_text:
  quote: ''
  summary: A young prince comes to the women's camp, where the princess remains cold
    despite added firewood. A friend calls heavy rain, the river overflows, and the
    camp is moved. The prince asks the princess to return with him; she goes in a
    canoe, reaches a strange country, and sees the canoe has become a drift-log. In
    a large house, Mouse Woman instructs her to throw her ear ornaments into the fire
    and warns her about which food to eat, explaining that the man is the Otter prince
    who has married her because she refused her cousin. After becoming pregnant, the
    woman is cast out and gives birth under a tree to a little Otter. Mouse Woman
    brings fire. The mother repeatedly throws the little Otter into the water, but
    he returns, and she takes pity on him. When grown, he brings food to his mother.
    Mouse Woman later points out the direction of the woman's father's tribe and instructs
    her how to smoke the otters out of their den and club them.
  language: English
  quote_policy: summarized
