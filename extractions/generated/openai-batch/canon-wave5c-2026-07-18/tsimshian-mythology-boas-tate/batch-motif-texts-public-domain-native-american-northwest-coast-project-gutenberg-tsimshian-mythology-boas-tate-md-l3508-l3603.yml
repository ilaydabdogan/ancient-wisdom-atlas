canonical_text:
  quote: ''
  summary: A traveling group of brothers encounters a witch who feeds a supernatural
    Frog in a lake, but her feeding attempt causes her own death. Nalq later revives
    people killed by her. The brothers then face a deadly opening-and-closing cave;
    three are crushed, and Little Feather carries them through and revives them. The
    brothers reach the city of Air, marry daughters of wind chiefs, and their later
    movements explain ice with the north wind, rain with the south wind, and whirlwinds
    with the east wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman rises secretly in the morning, goes to the beach, shouts four
    times, and a large Frog comes up from the lake water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman tells the Frog to open its mouth so she can feed it four young
    men who stayed in her house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Instead of the young men, the old woman throws a pole with wet shredded cedar
    bark into the Frog's mouth, and the Frog swallows it and returns home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage identifies the woman as a witch who had killed many travelers
    and had fed her supernatural power, the Frog, with moisture from her breath.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: While the guests eat, the woman suffers increasing stomach pain, says she
    has brought misfortune on herself, and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The brothers find a house containing many killed bodies, some reduced to bones,
