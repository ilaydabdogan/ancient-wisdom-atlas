- id: motif:2
  label: Name transmission as chiefly standing
  taxonomy_refs:
  - royal_legitimacy
  basis: The old chief gives his name to his grandson, chiefs honor the young chief,
    and Waux later proclaims the name given by his father at birth during a feast.
  evidence_refs:
  - ev:2
  - ev:10
  confidence: high
  cautions: The passage links naming with honor and fame, but it does not provide
    a formal explanation of chiefly law or succession.
- id: motif:3
  label: Supernatural father and human family
  taxonomy_refs:
  - divine_parent_child
  basis: One son is explicitly said to have a supernatural father, and the supernatural
    husband tells his wife their son will help her before disappearing; Asdi-wa'l
    is also treated by his wife as possibly supernatural when Waux is conceived.
  evidence_refs:
  - ev:3
  - ev:4
