canonical_text:
  quote: ''
  summary: 'The passage closes one narrative with intertribal trade, feasting, gift
    distribution, name transmission, and the withdrawal of a supernatural husband/father.
    It then introduces Waux, son of Asdi-wa''l: his birth and name, his hunting apprenticeship
    with his father, his sorrowful separation and search for the vanished father,
    his adult hunting prosperity, marriage, twin children, feast, name proclamation,
    and fame.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tribes from surrounding areas hear of abundant food at the old chief's camp
    and arrive by canoe with goods and people to present to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buyers from several named and multilingual groups purchase dried and fresh
