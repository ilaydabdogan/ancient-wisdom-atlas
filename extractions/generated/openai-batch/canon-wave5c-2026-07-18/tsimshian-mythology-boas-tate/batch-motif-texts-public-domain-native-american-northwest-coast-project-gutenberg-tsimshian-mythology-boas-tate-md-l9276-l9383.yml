  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old chief gives a great feast and distributes slaves, canoes, skins, and
    other goods; the mother of his grandson also gives spoons and boxes of oil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old chief gives his name to his grandson and gives a great woman's name
    to his daughter; chiefs then honor the young chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the grandfather dies, the young chief gives a feast, becomes richer
    as a hunter, and is said to have a supernatural father.
  category: sequence
  evidence_refs:
  - ev:3
