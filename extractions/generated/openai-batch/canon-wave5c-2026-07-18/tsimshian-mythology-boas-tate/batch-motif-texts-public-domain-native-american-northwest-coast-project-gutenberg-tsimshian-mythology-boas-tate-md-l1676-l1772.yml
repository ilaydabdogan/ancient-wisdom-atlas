canonical_text:
  quote: ''
  summary: TxamsEm deceives Chief Cormorant, tears out his tongue, lies about the
    injury, and is attacked by the Cormorants before escaping in a raven garment.
    The passage explains Cormorants' indistinct speech and black feathers. TxamsEm
    then wanders hungry, is hosted by Chief Wolf and the Wolves, receives meat, and
    later approaches Chief Grouse's house with three Crows pretending to be his family.
    Chief Grouse hosts them and proves a successful hunter while TxamsEm catches nothing.
  language: English
  quote_policy: summarized
