canonical_text:
  quote: ''
  summary: TxamsEm/Giant obtains a large sea egg with the help of Tomtit’s sinews,
    rewards Tomtit, forces an old woman to release and regulate the tide-line, gambles
    with Sea Gull, and deceives the olachen chief’s household so that olachen enter
    the rivers and early spring fishing begins on Nass River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm invites people from land and sea to lend sinews for reaching a large
    sea egg on a floating mass of seaweed; the whale’s sinew and other animal sinews
    fail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tomtit offers his own sinews, described as very thin, and uses them as a rope
    to catch the seaweed holding the sea egg.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: All the people pull, Tomtit’s sinews prove stronger than those of the other
    animals, and TxamsEm obtains the sea egg.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: TxamsEm eats the large sea egg, keeps the shell, and gives Tomtit power to
    be chief over all animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the tide episode, the passage begins with TxamsEm taking a raven blanket
    and firebrand over the ocean, then refers to the same acting figure as Giant.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old woman owns a house on the mainland and holds the tide-line; at that
    time the tide remains high for days and people want clams and other sea food.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Giant pushes the old woman, throws dust into her eyes and mouth, and she lets
    go of the tide-line so that the tide runs very low and shellfish are exposed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Giant requires the old woman to promise to slacken the tide-line twice daily
    before he heals her eyes; she agrees, and the passage explains that the tide now
    turns twice daily.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old woman dries up brooks and creeks; Giant cannot find water under alder
    roots and finally finds water up Skeena River.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Giant and Sea Gull gamble and quarrel over a gambling-stick; Giant throws
    Sea Gull down, steps on him, and takes an olachen that Sea Gull vomits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Giant makes an elderberry-wood canoe, rubs olachen spawn inside it, and uses
    the spawn and an olachen tail as evidence for a false claim that olachen have
    already gone upriver.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kuwask consults several named olachen chiefs; after they agree, men break
    the four corners of the chief’s house and the olachen go down into the water.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Giant orders the olachen to go up both sides of the river, fills his canoe
    with them, and the passage states that olachen fishing on Nass River begins very
    early in spring.
  category: sequence
  evidence_refs:
  - ev:11
