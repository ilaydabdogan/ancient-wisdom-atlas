canonical_text:
  quote: ''
  summary: The passage completes two connected Devilfish episodes. Bird Garment, a
    brave Killer Whale, dives against a deep-water monster, cuts off its arms, and
    helps secure a Killer Whale victory that elevates his clan. Later the grown child
    of the old Devilfish swallows two young Eagles and a salmon; Eagle Chief mourns
    and summons large birds to war. Eagles are devoured, Thunderbird kills two arms
    with lightning, and Raven enters the monster's mouth and removes its heart. The
    passage explains that Devilfish fear Ravens and that a timely raven call can kill
    a rising devilfish. The excerpt then begins the next tale, titled about a hunter's
    wife becoming a beaver, with a note on old-time hunting practices.
  language: English
  quote_policy: summarized
