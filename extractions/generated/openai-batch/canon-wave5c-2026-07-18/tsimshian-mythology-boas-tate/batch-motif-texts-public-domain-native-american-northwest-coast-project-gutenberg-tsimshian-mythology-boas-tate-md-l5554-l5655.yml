canonical_text:
  quote: ''
  summary: A young woman follows Mouse Woman's instructions, blocks exits of an otter
    den, uses smoke to force out the Otters, and clubs them in revenge for having
    cast her out before childbirth. Her Otter child learns what happened and later
    carries her across the sea toward her father's house. Gravel dropped during the
    crossing becomes sandbars and a sand bridge. The woman returns to her father's
    house, is recognized by her parents, recounts her story, and shows the people
    her child.
  language: English
  quote_policy: summarized
