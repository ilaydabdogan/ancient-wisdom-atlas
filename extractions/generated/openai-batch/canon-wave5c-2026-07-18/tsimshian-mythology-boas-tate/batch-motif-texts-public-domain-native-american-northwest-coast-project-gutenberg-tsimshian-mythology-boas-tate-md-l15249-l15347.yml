canonical_text:
  quote: ''
  summary: The passage gives chiefly genealogies and rank, then recounts the continuing
    hatred between Haimas and Nes-balas. Haimas assembles Raven Clan people and receives
    a village from his father. He remains intent on revenge and tries to surpass Nes-balas.
    During a move to Nass River, both chiefs build temporary camp houses and compete
    through the size of their house beams. Haimas envies and is shamed by Nes-balas's
    beam; his own heavy beam causes his canoe to capsize, nearly drowning his wives.
    The passage ends with Nes-balas leaving a green spruce beam at another camp, where
    Haimas's boards prove too short.
  language: English
  quote_policy: summarized
