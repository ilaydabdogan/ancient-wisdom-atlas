canonical_text:
  quote: ''
  summary: 'The passage contains the close of one narrative about mourners recovering
    the bones and possessions of lost princesses, followed by three short narratives:
    three brothers are lifted to the sky while asleep and only the youngest survives
    by obeying a supernatural instruction and praying; six hunters punish a squirrel
    and are trapped in a pit, with only the chief''s son surviving after aid from
    Mouse and Squirrel, after which a squirrel curse burns the town; and a man resists
    Land Otter people after his canoe capsizes, exposing their canoe as driftwood
    and their paddles as minks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chiefs and parents mourn after recovering the hand baskets and bare bones
    of lost daughters at the grassy rock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bare bones of the bad shaman are seen, and passers-by throw stones at
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The princess's father removes costly garments, arrows, feathers, and abalone
    shells from the house of The Man Who Bound Up His Wrinkles At The Back Of His
    Head, returns children's garments to fellow chiefs, and gives ten feathers with
    each garment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three brothers go hunting in the mountains, sleep, and wake on a flat rock
    raised so high that the stars appear within reach.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers lack food and water on the raised rock.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eldest brother proposes making ropes from mountain-goat skins and climbing
    down; the youngest advises waiting to see whether the being who lifted them will
    return them in sleep.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youngest hears the daughter of the Sun tell him to hold a round pebble
    in his mouth, and he obeys.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On waking, the youngest sees his brothers dead; in his dream he saw them leave
    him and attempt to climb down, and the passage states that they perished because
    they had not prayed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The surviving young man prays to the Sun, Moon, and Stars, anchors his arrow
    in a rock crack, ties a rope to it, climbs down, and returns safely.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Six hunters store provisions in a small fir-twig hut; a squirrel steals the
    provisions, and the men burn the squirrel's tail in the fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After sleeping, the six hunters and their six dogs wake in a deep pit and
    cannot climb out.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hungry hunters kill and roast one dog, but see the dog alive on top of
    the pit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Five men jump into the fire after seeing the dog alive; only the son of a
    chief waits patiently.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The son of a chief sees the others on the rim of the pit and asks them to
    go home and request help for him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Mouse leads the surviving hunter to a house where an old woman, identified
    as Squirrel, tells him that he would have died if he had jumped into the fire
    and warns him to take the narrow trail rather than the wide one.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The surviving hunter wakes in the forest, sees his companions' bones, takes
    the narrow path, and arrives home.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: After hearing the survivor's story, the people kill squirrels except for one
    female, who cries that the town will burn after four days; the town burns, but
    the young chief's house is spared.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: The passage states that Land Otter people catch a person who capsizes and
    that the person is transformed into a land otter.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:19
  text: A man who says he will not yield to the Land Otters capsizes while traveling
    with his sister, swims ashore, and sees a fire that seems to move away from him.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:20
  text: The man does not follow the moving fire; instead he makes his own fire where
    he came ashore.
  category: action
  evidence_refs:
  - ev:16
- id: obs:21
  text: When canoe people come ashore to his fire, the man throws all the paddles
    into the fire.
  category: action
  evidence_refs:
  - ev:17
- id: obs:22
  text: The paddles become minks, the people disappear, and the canoe's true form
    is revealed as an old driftwood log.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:23
  text: The Land Otters make another attempt to get hold of the man, but fail.
  category: action
  evidence_refs:
  - ev:19
