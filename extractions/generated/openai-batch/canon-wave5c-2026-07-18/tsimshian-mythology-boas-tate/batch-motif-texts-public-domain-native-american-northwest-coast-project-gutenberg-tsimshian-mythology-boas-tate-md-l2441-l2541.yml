canonical_text:
  quote: ''
  summary: A hunter is punished in Chief Porcupine's house through repeated name-questions,
    singing, and blows from spiny tails. Mouse Woman reveals the chief's correct name
    and the reason for the punishment. After the hunter answers correctly, Chief Porcupine
    heals him, feeds him, spares him, and gives rules for respectful porcupine hunting
    and use of porcupine remains. The hunter returns home and tells the people. The
    passage then begins a new story by describing beavers living safely in deep water
    near the Skeena River.
  language: English
  quote_policy: summarized
