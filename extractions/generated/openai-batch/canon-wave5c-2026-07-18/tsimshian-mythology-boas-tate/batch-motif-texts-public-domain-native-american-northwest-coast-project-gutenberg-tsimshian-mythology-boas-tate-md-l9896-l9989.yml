canonical_text:
  quote: ''
  summary: A great chief arranges for his son to marry a princess, who agrees on condition
    that her girls be cared for. The girls are brought from a hollow tree into the
    chief's house and adopted as his children. After the princess bears children,
    insults about her having been found on the beach lead her to send most of her
    children by canoe toward her own country, guided by a young eagle through coastal
    camps, islands, a great sea, and distant landmarks.
  language: English
  quote_policy: summarized
