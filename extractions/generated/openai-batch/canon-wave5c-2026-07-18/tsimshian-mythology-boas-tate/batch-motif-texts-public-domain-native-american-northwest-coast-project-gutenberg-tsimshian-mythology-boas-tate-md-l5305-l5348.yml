canonical_text:
  quote: ''
  summary: A young man, identified as the youngest brother, travels with companions
    while making nightly burnt offerings and praying for supernatural direction to
    his only sister. They reach an inaccessible smoky valley below bare rocks, which
    he thinks is the town where his sister was taken. He repeatedly crafts wearable
    wooden eagles from different woods to fly, but the first attempts break and are
    burned. He then plans and builds a composite eagle from light woods and mountain-goat
    horn; the passage ends before the result is given.
  language: English
  quote_policy: summarized
