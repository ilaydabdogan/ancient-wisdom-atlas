- id: obs:2
  text: The travelers pass mountains, valleys, rivers, and other difficulties, cross
    a plain toward the rising sun, and arrive at a great valley where smoke rises
    from below and bare rocks prevent descent.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youngest brother camps at the valley edge, offers a burnt offering, thinks
    the valley may contain the town to which his sister was taken, and remains awake
    considering how to descend.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before leaving camp, he orders his companions to continue sacrifices, cuts
    down a red-cedar tree, and shapes it into a flying eagle because he is a woodworker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: He puts on the red-cedar wooden eagle and tries to fly, but its wings break,
