canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes involving Giant/TxamsEm: in a dark
    world he asks fishing Frogs for part of their catch, breaks a carried object after
    they refuse, and daylight appears while the Frogs are driven by north wind and
    become stone. He then intervenes in a quarrel between Stone and Elderberry Bush
    over who should give birth first, causing Elderberry Bush to give birth first
    and explaining short human life and elderberries on graves. A following episode
    explains the origin of fire: people lack fire, TxamsEm is refused fire by the
    animal village, stages a dance with animal and bird helpers, and Deer carries
    away fire on pitchwood tied to his tail, transferring it to a fir tree and explaining
    the deer''s short black tail. The passage ends with the opening of another episode
    in which TxamsEm sees seaweed and large sea eggs offshore.'
  language: English
  quote_policy: summarized
