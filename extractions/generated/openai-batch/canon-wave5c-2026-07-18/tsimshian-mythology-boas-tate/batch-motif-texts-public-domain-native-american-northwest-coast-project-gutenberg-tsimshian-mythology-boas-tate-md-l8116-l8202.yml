canonical_text:
  quote: ''
  summary: A chief summons people to discuss a bundle of leggings, snowshoes, and
    moccasins associated with slain persons and a reported flash of lightning. An
    old man named Disbeliever mocks the report, handles and wears the items, and runs
    around the central fire; lightning then comes from the items and consumes the
    house and all inside. A woman who has left the house sits by the bodies of her
    brothers. A supernatural being instructs her to arrange them and revives each
    brother by jumping over him four times. The siblings see the destroyed village,
    return to their mountain home, and the passage then begins a new narrative about
    a sea village, two islands, and sea otters living there.
  language: English
  quote_policy: summarized
