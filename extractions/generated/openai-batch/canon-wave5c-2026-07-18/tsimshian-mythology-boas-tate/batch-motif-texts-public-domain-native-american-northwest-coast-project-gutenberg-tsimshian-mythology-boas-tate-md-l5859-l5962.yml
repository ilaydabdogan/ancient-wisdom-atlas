canonical_text:
  quote: ''
  summary: A young man harvests and uses devil's-club bark and sap for bathing and
    eating as purification, then encounters a great Wolverene who has damaged his
    traps. By repeatedly pursuing and threatening Wolverene, he obtains several claimed
    plant practices and finally the secret of rotten fern, which makes him a highly
    successful hunter. He becomes rich, feasts, marries, and has a son, but later
    drowns when a white she-bear breaks the river ice. The passage then begins a new
    tale about Mink marrying a princess whose parents do not want her to marry.
  language: English
  quote_policy: summarized
