canonical_text:
  quote: ''
  summary: The passage first describes a ceremonial presentation by Nass Gowagani
    after a dance, explains the meaning of his name in relation to spring abundance
    at Nass River, and states that Tlingit and Tsimshian wars ended. It then begins
    an account of a Haida attack on the G'i-spa-x-h'i°ts, the capture of Chief LEg'e'°x's
    sister and nephew, the chief's grief, and a pre-war oil-and-fire vow taken by
    warriors before an intended expedition to Queen Charlotte Islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief LEg^e'^x calls Nass Gowagani forward after a dance; Nass Gowagani arrives
    carrying two coppers and canes bearing representations of two canoes, each canoe
    representing ten slaves, and he speaks the Tsimshian language.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nass Gowagani places the coppers, canoe representations with twenty slaves,
    and other valuables before Gadunaha; two companions also call men with canes and
    canoes and place them before the chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The name Nass Gowagani is explained by a seasonal situation in which hungry
    people, birds, and water animals come to Nass River in spring for abundant food
    and olachen after winter hardship.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrative states that the Tlingit and Tsimshian wars ended, that they
    have not been at war since, and that they are now friendly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Tsimshian moved down from Nass River, the G'i-spa-x-h'i°ts camped
    at Lax-a'us; early the next morning at very low tide, a voice from below warned
    the sleepers that enemies were coming.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: War-canoes arrived, a battle was fought, the Haida outnumbered the G'i-spa-x-h'i°ts,
    and many G'i-spa-x-h'i°ts were killed or captured.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chief LEg'e'°x's sister Wl-nle'x and her eldest son Hats!Eks-n!e'°x were among
    the captives taken with other men, women, and children to Queen Charlotte Islands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The remaining half of the tribe moved up Skeena River to dry salmon and other
    winter provisions, stayed through the summer, and moved again in early fall.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The village mourned those taken captive, and Chief LEg'e'°x remained silent
    while crying for his sister and her son.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A great warrior urged Chief LEg'e'°x to call the tribes and make war on the
    Haida at Queen Charlotte Islands; the chief summoned warriors and stated his desire
    to go there for his sister, nephew, and other captives.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The chief ordered a box of oil placed before the fire and asked who would
    first bring back his sister and nephew, instructing the volunteer to dip his fourth
    finger in the oil, lick it off, and take a vow.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Qanas first performed the oil vow to show that he would be first to die at
    the chief's command in battle and would not break his vow.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Other warriors also took the vow until the oil box was empty; the last two
    broke the empty box, threw it into the fire, vowed to burn the empty village as
    the box burned, and the people uttered war-cries four times.
  category: sequence
  evidence_refs:
  - ev:11
