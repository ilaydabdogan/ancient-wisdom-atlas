canonical_text:
  quote: ''
  summary: 'The passage first concludes a narrative in which a prince becomes a copper-worker,
    gains wealth through coppers, distributes goods, and is proclaimed head chief
    under his great-grandfather''s name. It then begins the Story of the Wolf Clan:
    Eagle and Wolf Clan villages build a weir, quarrel over its catches, and go to
    war. The Eagle chief kills his Wolf Clan wife''s male relatives and repeatedly
    orders his newborn sons killed. A later son is hidden by the mother and maid,
    grows up, learns of the killings, kills his father in revenge, and departs with
    companions in a canoe toward the northwest to seek a supernatural arrow with a
    living reptile-head.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed prince obeys his father-in-law's commands, becomes the first copper-worker
    among the natives, and gains wealth and fame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs buy the prince's costly coppers with skins, canoes, slaves, grease,
    shells, and other goods; the prince gives away coppers, slaves, skins, and goods
    at feasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a final great feast, chiefs proclaim that the prince should take his great-grandfather's
    name, Around The Heavens, and be head chief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two villages in the Strait of Metlakahtla are associated with the Eagle Clan
    and the Wolf Clan, and the groups are initially friendly because the Eagle chief
    is married to Bidal, a Wolf Clan princess.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two groups build a weir between two islands to catch seals and fishes
    at low tide and agree that whoever wakes first may take something caught by the
    weir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Wolf Clan people usually reach the weir first, angering the Eagle chief;
    war follows, the Eagle Clan wins, and the chief kills his wife's relatives and
    takes the weir.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the war, only women and girls remain in the other village.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bidal gives birth to a girl, and the chief orders that she be kept in good
    health.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On repeated later births, the chief is told the children are boys and orders
    attendants to kill them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The daughter grows up, looks into the sun, develops sore eyes, and is named
    Ya°l by her father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bidal instructs her maid to report a newborn boy as a girl; the maid deceives
    the chief, and the boy survives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the surviving boy grows older, the father learns of the maid's deception
    and kills her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The mother stays near her son because she knows his father seeks the child's
    life, and she tells him that his father killed her relatives and sons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The mother and son flee because of the chief's hatred; the young man has companions,
    hunts birds, makes bows and arrows, and gives them to his companions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After hearing the full account of his father's killings, the young man weeps
    with his mother, hates his father, and kills him in revenge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The mother tells her son of an arrow with a living reptile-head, located far
    away in the northwest in the house of the chief Gutginsa'; many brave men have
    failed to obtain it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The young man tells his companions he intends to go after the arrow; they
    make a canoe, load food and goods, and set out toward the northwest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The passage first says the young prince called three youths as friends, and
    later says he called four companions for the journey.
  category: other
  evidence_refs:
  - ev:6
  - ev:9
