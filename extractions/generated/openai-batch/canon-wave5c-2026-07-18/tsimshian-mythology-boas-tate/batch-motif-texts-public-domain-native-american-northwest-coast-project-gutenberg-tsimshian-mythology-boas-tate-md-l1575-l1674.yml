canonical_text:
  quote: ''
  summary: TxamsEm visits successive houses belonging to Chief Kingfisher, Thrush,
    and Chief Cormorant. Kingfisher and Thrush provide food through special acts,
    and TxamsEm later attempts to imitate each act in his own house but fails and
    is ashamed. Cormorant's household feeds TxamsEm, and Cormorant catches many halibut
    while TxamsEm catches none.
  language: English
  quote_policy: summarized
