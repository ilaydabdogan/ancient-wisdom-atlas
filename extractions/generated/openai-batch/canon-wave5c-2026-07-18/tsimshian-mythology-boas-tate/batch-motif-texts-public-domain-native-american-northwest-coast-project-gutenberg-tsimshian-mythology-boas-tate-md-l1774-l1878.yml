canonical_text:
  quote: ''
  summary: TxamsEm secretly watches Chief Grouse obtain mountain goats through a procedure
    involving arrows, four shouts, and a bright young supernatural helper. TxamsEm
    imitates the procedure but answers the helper wrongly, loses his arrows, wounds
    himself, and brings home his own intestines wrapped around a staff. After the
    intestines are put on the fire, TxamsEm collapses, is thrown down the mountain
    by Chief Grouse, later revives without intestines, and the narration explains
    that raven now has no intestines. TxamsEm then seeks Chief Wolf’s village, is
    left behind by two hunters, camps under a spruce tree, and asks a tomtit to guide
    him while giving a self-exculpating account of what happened.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm’s children wanted fresh meat and fat; Chief Grouse made arrows and
    darts, left early, and TxamsEm followed him secretly to a steep cliff.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief Grouse shot arrows at cracks in the cliff, shouted four times, and a
    bright young man appeared beside him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When asked whose arrows they were, Chief Grouse said they belonged to the
    supernatural helper; after the bright young man vanished, a mountain goat fell
    from the cliff.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chief Grouse obtained four large mountain goats, brought home their fat and
    meat, and fed TxamsEm and his family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: TxamsEm went to the same cliff, shot his arrows, shouted four times, and the
    bright young man appeared and asked whose darts and arrows they were.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: TxamsEm answered that the darts and arrows were his own and Raven’s; the bright
    young man became angry, said he would break the bad arrows, threw them down the
    rock, and vanished.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After losing all his arrows, TxamsEm cut his own belly with his hunting knife,
    removed part of his intestines, wound them around his walking-staff, and returned
    home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: TxamsEm’s children sang about the intestines, unwrapped them from the staff,
    and threw them on the fire; when they were scorched, TxamsEm fell back fainting,
    and his wife and two children flew away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chief Grouse took TxamsEm’s dead body and threw it down the steep mountain;
    after lying there a while, TxamsEm came back to life without intestines, and the
    passage states that raven has no intestines now.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: TxamsEm remembered his promise to Chief Wolf and searched for the Wolves’
    village; he met two hunters who said they belonged to Chief Wolf’s people and
    agreed to take him there.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The two hunters ran ahead; TxamsEm, weakened by hunger and belly pain, was
    left behind and camped in the woods under a large spruce tree.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A little tomtit agreed to guide TxamsEm to Chief Wolf’s town; TxamsEm asked
    it not to fly zigzag and then told it a version of the events that blamed Chief
    Grouse for clubbing him, throwing him from the cliff, and cutting his belly.
  category: speech
  evidence_refs:
  - ev:12
