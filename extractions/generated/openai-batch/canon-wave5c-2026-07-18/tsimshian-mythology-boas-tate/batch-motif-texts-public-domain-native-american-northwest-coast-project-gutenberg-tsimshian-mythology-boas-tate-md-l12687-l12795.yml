canonical_text:
  quote: ''
  summary: A young prince bathes in a brook to gain success and meets a supernatural
    being who owns the bathing-place. The being gives him a sparrow skin or blanket,
    instructs him to hide the canoe at villages, obtain route information by singing
    as a sparrow, and have his companions make burnt-offerings. The prince travels
    through many villages, receives distance reports from old men, reaches a final
    chief at the edge of land and heaven, and flies with that chief in hummingbird
    garment to Chief Gutginsa's air island to seek the life arrow.
  language: English
  quote_policy: summarized
