canonical_text:
  quote: ''
  summary: A group of ten Tsimshian young men and their father build a fortified house
    with decoy sleepers and use it to ambush attacking Tlingit warriors. After killing
    many enemies, pursuing escaping canoes, displaying heads and skulls, and taking
    war spoils, they invite Tsimshian chiefs, hold a feast, distribute captured goods,
    and organize further war. The Tsimshian reclaim territory and restored seasonal
    movements, while the eldest son takes the name Wl-h6'°m and becomes a great chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people moved by canoe to K-xIen, described as one of their deserted villages,
    and built a large square house there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: They surrounded the house with a double wall made from fresh firs, made an
    upper floor, included a small stream through one corner, and hung a heavy gate
    at the doorway.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: They carved human forms from decayed wood, dressed them with garments, placed
    them in beds, and used fresh kelp from the second floor to make a sound like snoring.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: They split and scattered pitch wood throughout the house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: They made a large smudge early in the morning, and Tlingit groups saw the
    smoke and assembled to fight them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father of the young men used a wooden drum and sang to show the enemies
    that they were not afraid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A young man fetching water saw enemies around the house and reported this
    to his brothers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young men moved secretly to the upper floor and blew into the kelp after
    the fire had died down, making the wooden figures sound like snoring sleepers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Tlingit entered the house, stabbed the wooden images, and could not withdraw
    their knives or remove their hands because the knife-handles were tied to their
    wrists.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A heavy fir-wood gate slid down at the doorway, pressed people down, and prevented
    escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The ten brave men killed the enemies from the upper floor with spears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Some canoes escaped, and the Tsimshian men pursued them, killing the people
    in one canoe and leaving only one canoe to escape near Dundas Island.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The young men and their father cut off heads of slain enemies, hung many heads
    from four poles in a canoe, took scalps, threw skulls into the creek, and gathered
    enemy property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The father sent five messengers to invite the Tsimshian chiefs, who came down
    the Skeena River and viewed the bodies, skulls, and fort.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The eldest son gave a feast, distributed captured canoes and goods to each
    chief, and took the name Wl-h6'°m, glossed as Great Bountiful One.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the feast, the eldest son asked the chiefs to send warriors with him
    to Dundas Island against the Tlingit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The chiefs consented, ten canoes went to war, and women and children found
    in hiding places were taken captive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: In winter the Tsimshian tribes moved to Metlakahtla, returned to old villages,
    took back the country from the Nass to the Skeena River, and excluded Tlingit
    from that side.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: Wi-ho'°m gave many feasts, became a great chief, and had his picture carved
    on a rock at Laxkspaxl.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: The Tsimshian were again able to move between Metlakahtla, the Nass River,
    and the Skeena River for olachen fishing, salmon fishing, and berrying.
  category: sequence
  evidence_refs:
  - ev:9
