canonical_text:
  quote: ''
  summary: TxamsEm travels after eating the Grizzly Bear's provisions. He is hosted
    by Deer and Deer's wife at a salmon-smoking house, persuades Deer to help split
    hemlock wood, kills Deer with a stone hammer, cooks the meat in a pit, and loses
    most of it when an animated Stump sits over the cooking hole. TxamsEm then paints
    his face black, falsely sings that wolves killed his brother-in-law, and eats
    the provisions in Deer's house. In a second episode, Chief Seal feeds TxamsEm
    by warming his hands so oil drips from his fingers; TxamsEm later imitates this
    act, scorches himself, produces no oil, and the passage gives an origin explanation
    for why human fingers no longer have eyes and mouths.
  language: English
  quote_policy: summarized
