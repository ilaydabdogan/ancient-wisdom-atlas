canonical_text:
  quote: ''
  summary: Hunters travel up mountains to Robin's village, are received by the chief,
    and seek his daughter as wife for their chief. Mouse Woman identifies the village
    and the proposed marriage terms. Robin's chief and people consent, send the daughter
    with two small baskets of food, and she leads the hunters home. Her baskets provide
    abundant meat, fat, and berries for a wedding feast. A second group of hunters
    find Sawbill-Duck Woman on the beach; she consents to marry the same chief. The
    chief favors Robin Woman, and in winter she recalls her father's request that
    canoes be sent back for provisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mountain-traveling hunters reached a large plain with a large village
    and saw young men and young women walking in the street.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The village chief invited the strangers into his house, where mats were spread
    beside the chief's large fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mouse Woman told one hunter that the village belonged to Robin and that the
    chief had a beautiful daughter whom he would give as wife for the visitors' chief
    if she were cared for.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Robin chief ordered food prepared, and the visitors were served dried
    spring salmon, mountain-goat meat and fat, and fresh berries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The head man of the hunters asked for the Robin chief's daughter to marry
    their chief and promised that she would be honored and made the greatest chieftainess
    in their village and among the Tsimshian tribes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After consulting his people, the Robin chief consented to send his daughter
    and gave her two small root baskets, one with fresh meat and fat and one with
    fresh berries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hunters did not know the way home, and young Robin Woman led them down
    through mountains, valleys, and rivers until they arrived with her late in the
    fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young chief received Robin Woman as his wife and loved her very much.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When one small root basket was opened, its fresh meat and fat were placed
    before the chief and his new wife and filled one end of the house; berries from
    the other basket were placed in a cedar box.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief invited surrounding tribes to a wedding feast, and visiting chiefs
    returned home in canoes loaded with meat, fat, and berries.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Another group of hunters traveling by canoe saw Sawbill-Duck Woman walking
    on a sandy beach with braided hair ornamented by white shells.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The head man told Sawbill-Duck Woman that his chief wanted her to marry him;
    she consented and went home with the hunters in the canoe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The chief kept both Robin Woman and Sawbill-Duck Woman as wives, but loved
    Princess Robin most.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: When winter came and food became scarce, Robin Woman remembered her father's
    words and told her husband to send two large canoes to bring winter provisions
    from her father, saying she would go with the men.
  category: speech
  evidence_refs:
  - ev:12
