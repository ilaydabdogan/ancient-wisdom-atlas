canonical_text:
  quote: ''
  summary: A Tsimshian chief gathers allied warriors for war against the Haida, using
    an oil-box vow ceremony before departure. A secret Raven Clan guide leads the
    expedition by river and sea. The narrative then returns to Haida captors who tie
    their Tsimshian captives at Dundas Island; Wi-n!e'°x sings her brother's mourning-song,
    and Chief Sdi'lda recognizes it. After learning her identity, he pays valuables
    to obtain her and her son from Chief Wi-ha'°, intending to return them to her
    brother. Wi-ha'° later proposes atonement and return of captives to avoid war,
    while his nephew seeks marriage with Wi-n!e'°x through wedding gifts. The passage
    ends with the Tsimshian war party awaiting favorable weather and receiving instructions
    about spruce-root hats or closing the eyes during sea passage.
  language: English
  quote_policy: summarized
