canonical_text:
  quote: ''
  summary: A chief prepares to send his homesick son-in-law and daughter back to the
    son-in-law's home after a communal hunt. The chief loads two carved canoes with
    blubber and fish, repeatedly shaking them so the cargo becomes compact. He instructs
    his daughter that the canoes must be fed with seal blubber when they creak or
    stop, and that whistling will make them move. The young couple cross the sea,
    feeding the canoes during four rests, and arrive at Metlakahtla, where the returned
    prince is recognized. The princess shakes the canoes to release great stores of
    fish, seals, sea-lion blubber, and whale blubber, filling four houses. She then
    sends the canoes back to their ocean home. The passage ends with Peace Woman's
    water-drinking practice using a plume and root basket, and with tension between
    the prince and his former wife while Peace Woman loves his son.
  language: English
  quote_policy: summarized
