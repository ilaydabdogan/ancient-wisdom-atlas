canonical_text:
  quote: ''
  summary: 'A chief''s nephew is expected by custom to marry the chief''s daughter
    so that he may inherit his uncle''s position. In the story, a young prince loves
    his cousin, the princess, but she rejects him. She repeatedly draws him to a tree
    and demands bodily proofs of love: cuts on both cheeks and the cutting of his
    long hair. After he obeys, she refuses him, mocks his scars and hair, and gives
    him a humiliating nickname. Ashamed, he leaves home, wanders along a narrow trail,
    and reaches a small hut where a woman by a fireplace recognizes, receives, and
    feeds him. Of four friends who began the journey with him, one loyal friend remains.'
  language: English
  quote_policy: summarized
