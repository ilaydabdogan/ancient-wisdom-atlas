canonical_text:
  quote: ''
  summary: A prince leaves his home village while people search for him. Four men
    in a canoe take him to a sea village of Spring Salmon, where a sick chief explains
    that the prince helped release and unfold him from the prince's mother's small
    box. Mouse Woman gives the prince instructions involving woolen ear-ornaments,
    fire, eating a transformed salmon-child, burning remains, and drinking fresh water.
    The actions restore the salmon child. Later the Salmon chief sends scouts to the
    Skeena and Nass Rivers to check whether cottonwood leaves, called salmon by the
    Salmon, have appeared.
  language: English
  quote_policy: summarized
