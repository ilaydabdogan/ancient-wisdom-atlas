candidate_motifs:
- id: motif:1
  label: Retaliatory burning after a child is cast into fire
  taxonomy_refs:
  - world_destroying_fire
  basis: The chieftainess says her only child was cast into fire and that she burned
    the village; Omen later sees that the whole village was burned.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage describes a village or town destroyed by fire, not the whole
    world; the taxonomy reference is therefore a scale-limited fit.
- id: motif:2
  label: Lone survivor departs from a destroyed settlement
  taxonomy_refs:
  - departure
  basis: Omen survives in a pit, sees that nobody was saved and the village was burned,
    then leaves in sorrow.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe a formal quest commission or destination
    at the moment of departure.
- id: motif:3
  label: Mourning song that incorporates names and events
  taxonomy_refs: []
  basis: The chieftainess inserts the child’s name into her mourning song, and Omen
    adds later sights such as the glittering garment and halibut to her own mourning
    song.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No external song-comparison or fixed song genre is established within
    the passage.
- id: motif:4
  label: Supernatural lake encounter during wandering
  taxonomy_refs: []
  basis: During Omen’s journey by the lake, she encounters a glittering garment and
    a supernatural halibut shaped like a carved-front house.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents the encounters but does not state their cause or
    function beyond inclusion in the mourning song.
- id: motif:5
  label: Apparent return of a dead daughter
  taxonomy_refs:
  - resurrection
  basis: Canoe witnesses and villagers say the dead princess has come back to life
    when they see Omen at the funeral pyre, and the parents accept her after learning
    her name matches the dead daughter’s name.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage reports recognition and belief in return to life; it does
    not demonstrate that Omen is literally the resurrected dead princess.
- id: motif:6
  label: Replacement daughter adopted by grieving parents
  taxonomy_refs: []
  basis: The chief and chieftainess whose only daughter died take Omen home, feast,
    love her as their daughter, and become her new parents.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames the adoption through the villagers’ belief that the
    dead daughter returned, not as an explicitly stated adoption ritual.
