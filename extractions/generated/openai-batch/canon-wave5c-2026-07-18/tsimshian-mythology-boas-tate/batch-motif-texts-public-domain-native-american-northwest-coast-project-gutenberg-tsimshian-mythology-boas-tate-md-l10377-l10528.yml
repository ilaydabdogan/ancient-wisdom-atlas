canonical_text:
  quote: ''
  summary: Omen, hidden in a pit, sees a chieftainess carrying a cane with living
    beings and mourning a child cast into fire. The chieftainess says she burned the
    village in response. Omen emerges, finds the village destroyed, dresses in valuable
    garments, and wanders away singing mourning songs. At a lake she sees a star-like
    garment and a supernatural halibut shaped like a carved-front house. Weak from
    travel, she reaches a fire under a spruce root where a dead princess had been
    burned. People from a nearby town see her at the funeral pyre and identify her
    as the dead princess returned to life because she has the same name. The chief
    and chieftainess take her home, feast, and treat her as their daughter.
  language: English with transcribed song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl is in a pit, pushes away its cover, and sees a chieftainess coming
    along.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chieftainess holds a cane with a live frog at the lower end, a live person
    on top of the frog, and a live eagle at the upper end; she wears a large green-painted
    spruce-root hat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chieftainess tells an aged woman that Asdilda cast her only child into
    the fire and that she burned the village.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chieftainess sings a mourning song three times, cries while walking, and
    inserts the child’s name, Dzila'°gans, into the final line; the passage says this
    was the name of the frog thrown into the fire by a prince.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Omen comes out from her hiding place and sees that no one was saved and that
    the whole village was burned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before leaving, Omen puts on sea-otter and marten-skin garments and the chief’s
    woven dancing blankets, and she arranges coppers and elk skins in her hiding place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Omen leaves in sorrow while singing a mourning song whose translation mentions
    fishing, a cormorant hat, the destruction of Dzi'gwa, and a shining garment.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: At a large lake, Omen sees a beautiful glittering garment spread on the ground,
    described as shining like stars and full of the foam of living persons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Omen hears a thunder-like noise from the lake and sees a supernatural halibut
    come up from the water in the shape of a house with a carved front.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Omen continues traveling until she is weary, faint, starving, and nearly voiceless.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the other side of the lake, Omen sees a fire burning under the root of
    a spruce tree and sits by it with her back toward the fire.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fire is the funeral pyre where the body of a dead princess from a nearby
    town had been burned.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Four people in a canoe see Omen sitting by the funeral pyre and report this
    to the village; the villagers say the princess has come back to life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The chief and chieftainess come to the fire, embrace Omen, ask her name, and
    learn that her name is the same as the dead daughter’s name.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chief, his wife, and their people take Omen home, hold a feast because
    the dead daughter is believed to have returned, and Omen lives with her new parents.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: After Omen has lived with the new parents for some time, the father wants
    to marry her to one of his nephews.
  category: relationship
  evidence_refs:
  - ev:10
