- id: obs:4
  text: Inside the large house, the husband lies with his back against a large fire,
    and two very large snails are positioned on either side of the fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two large snails are described as the parents of the young man, and they
    do not attend to the new wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young woman sits in a corner of the house weeping because no one speaks
