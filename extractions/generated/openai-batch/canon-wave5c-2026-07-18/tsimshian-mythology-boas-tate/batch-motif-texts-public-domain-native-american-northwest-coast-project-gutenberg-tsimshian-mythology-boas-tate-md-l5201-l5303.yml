    the young woman gives them to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mouse Woman says the young woman once kicked a snail and asked it whether
    it wanted to marry her, and that the great chief therefore sent his son to marry
    her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the young woman's home, her mother keeps the house quiet until dusk, then
    sends a maid to check; the maid finds the bed empty and the box gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The six brothers search the village, houses, hills, and canoes, and the chief
    sends canoes to inquire among Tsimshian tribes, but no one reports seeing the
    young woman.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chief summons shamans from the Tsimshian villages; they are paid, take
    charms, and dance around the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A woman shaman says the daughter is alive in the house of Chief Snail, married
    to Chief Snail's son, disappointed, and recoverable by the six sons; she points
    toward the rising sun.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The chief rewards the woman shaman with a boy-slave and asks his six sons
    to purify themselves so they can bring back their sister.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The elder brothers isolate for purification and depart one after another into
    the hills and mountains; the first five fail, though the fifth almost reaches
    the village of the Snails.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: After his purification, the youngest brother leaves with woodworking tools,
