- id: obs:1
  text: The young man visits the young woman for four nights, and she increasingly
    loves him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fourth night, the young man asks whether he should take her from
    her father's house to his father's large house, and she agrees.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The young woman takes only a small box and goes far away with the young man
    to his village and into a large house.
  category: action
  evidence_refs:
