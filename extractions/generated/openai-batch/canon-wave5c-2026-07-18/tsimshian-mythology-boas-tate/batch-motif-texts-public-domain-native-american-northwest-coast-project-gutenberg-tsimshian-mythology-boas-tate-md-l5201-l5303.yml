canonical_text:
  quote: ''
  summary: A young woman secretly receives a young man for four nights, agrees to
    leave her father's house, and enters his father's large house, where she finds
    two enormous snails who are his parents. Mouse Woman explains that the marriage
    follows the young woman's earlier act of kicking a snail and mockingly asking
    whether it wanted to marry her. Her family discovers her absence, searches unsuccessfully,
    consults shamans, learns she is alive in Chief Snail's house, and sends her brothers
    through purification and successive searches; the youngest brother departs with
    tools, ritual materials, provisions, and two assistants.
  language: English
  quote_policy: summarized
