canonical_text:
  quote: ''
  summary: TxamsEm, repeatedly hungry, steals halibut bait from fishermen and loses
    his jaw on a hook, later recovering it by deception. He then assumes the form
    of a woman to enter a hunters' canoe and eat their captured animals, after which
    he is recognized and flees while his child departs as a crow. In another village
    he eats children's whale blubber, imitates their described tree-jumping method
    for producing blubber, falls, is seen as dead, and later revives in pain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm is hungry, comes near a large town, and finds people fishing for halibut
    in front of the town.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: TxamsEm dives underwater, removes bait from the fishermen's hooks, and eats
    it until all the bait is gone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fisherman catches TxamsEm's jaw on a hook, and the fishermen haul together
    while TxamsEm holds to rocks at the bottom of the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: TxamsEm asks the rocks for help and then tells his jaw to break off; the jaw
    breaks off and is hauled up on the hook.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The fishermen see a great jaw with a long beard on the hook; town people gather,
    look at it, and later gamblers on the beach examine it.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:6
  text: TxamsEm comes ashore in pain, covers his missing jaw with a blanket, asks
    to examine the jaw, makes the people forget it, puts it on, runs away, and his
    jaw becomes well again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the beach TxamsEm sees a hunting canoe with four men, decides to pretend
    to be a woman, and assumes the shape of a woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hunters take the woman aboard; the chief wants to marry her; the woman
    carries a crying child and says the child wants a gisox, after which seal is cooked
    and given to her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: While the men sleep, TxamsEm eats all the animals the hunters have; in the
    morning the chief sees that his new wife looks like a man, names him as TxamsEm
    the cheater, and TxamsEm runs away while his child flies into the woods as a crow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: TxamsEm reaches another village, sees children throwing pieces of whale blubber
    at one another, steps among them, and eats all the blubber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A large boy tells TxamsEm that the children climb a tree, throw themselves
    down, speak a formula about high piles of blubber, and then blubber appears.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: TxamsEm climbs the tall tree, throws himself down, speaks part of the formula,
    strikes the ground, is seen by the children as dead, and later opens his eyes
    but remains sick and in pain.
  category: sequence
  evidence_refs:
  - ev:4
