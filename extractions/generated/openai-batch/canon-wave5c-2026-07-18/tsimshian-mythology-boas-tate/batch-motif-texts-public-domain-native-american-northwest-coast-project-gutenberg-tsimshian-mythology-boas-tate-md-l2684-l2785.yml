canonical_text:
  quote: ''
  summary: A chief's three children are named. The younger son, troubled by continual
    darkness, makes a burning pitch-wood mask and runs from east to west across the
    sky, becoming the Sun's daily light. His sister Support Of Sun catches and holds
    him in the middle of the sky, explaining the Sun's pause. The elder son, Walking
    About Early, marks one side of his face with charcoal and rises in the east, after
    which the people see the Moon. An animal council then assigns the Sun its daily
    path and daylight-growing function and settles the Moon and calendar; Porcupine
    changes the proposed forty-day month to thirty days, and the animals agree to
    twelve months in a year.
  language: English
  quote_policy: summarized
