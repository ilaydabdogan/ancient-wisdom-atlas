canonical_text:
  quote: ''
  summary: A chief’s dead son is recovered from the graveyard and restored by shamans.
    The revived prince becomes a powerful shaman who travels at night from the graveyard
    across a river and narrow bridge to the village of the Ghosts, retrieves souls
    of the dead, and returns them to their bodies. After repeated restorations, the
    Ghost-town people plot to kill him by cutting the bridge, but his supernatural
    power warns him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief orders the people to light torches and go to the graveyard; they
    find the prince’s body in an open coffin and carry it to the chief’s house, placing
    it before a large fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince’s heart is still beating; his father summons shamans from other
    tribes, explains that he wants his only son restored to life, and promises a rich
    reward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shamans dance and put charms on the dead prince; after four days and four
    nights of work, the prince comes back to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After his restoration, the prince is described as a great shaman because he
    is filled with the charms of different shamans, and his four friends become attendants
    who go before him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a head man of his father’s tribe dies, the prince says he will restore
    him to life; he puts on carved bones, a grizzly-bear-claw crown, a dancing apron,
    carries a rattle and a white eagle tail, blackens his face with charcoal, strews
    eagle down on his head, and goes with four attendants to the house of the dead
    man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the house, the prince says the dead man’s soul is in the village of the
    Ghosts and that his supernatural helper says he must bring it back; he asks for
    a new cedar-bark mat and for the people to sing and beat time until he returns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wearing the cedar-bark mat, the prince goes out at night to the graveyard,
    sees a quiet river with the village of the Ghosts on the far side, crosses a narrow
    bridge, and is led by his supernatural power toward the chief of the Ghosts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Inside the chief Ghost’s house, the prince sees the dead man’s soul seated
    near the chief of the Ghosts while the Ghosts are assembled; he takes the soul
    by the shoulders and says he will take it back to its body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The prince returns to the house of the corpse, keeps his left hand closed,
    rattles with his right hand, circles the fire four times following the course
    of the sun, places the soul into the body, and the dead man sits up alive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The prince later brings back the soul of his father’s niece, called his cousin,
    and is sent for by other villages when people die; rewards are offered, and the
    passage says no one is dying in the villages because he is among the people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Ghost-town people hate the prince because no souls come to the Ghost town;
    they hold council, plan to cut the ends of the bridge when he comes again, take
    a man’s soul, and the prince is warned by his chief supernatural power about their
    council and about obeying its orders.
  category: sequence
  evidence_refs:
  - ev:10
