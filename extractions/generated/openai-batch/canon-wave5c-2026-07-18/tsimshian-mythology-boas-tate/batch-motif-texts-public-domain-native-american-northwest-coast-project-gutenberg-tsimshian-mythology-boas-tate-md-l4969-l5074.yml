canonical_text:
  quote: ''
  summary: 'The passage closes one episode with a woman of the lake taking her child
    below the lake, mourning, entering salt water, and becoming a part-fish, part-woman
    sea being called Haklula''q. It then begins “The Spider and the Widow''s Daughter”:
    during famine, a widow and her daughter cannot catch salmon; a tall young man
    identified by the title as Spider marries the daughter, teaches nettle-fiber spinning
    and net-making, and brings abundant silver salmon that are smoked and stored.'
  language: English
  quote_policy: summarized
