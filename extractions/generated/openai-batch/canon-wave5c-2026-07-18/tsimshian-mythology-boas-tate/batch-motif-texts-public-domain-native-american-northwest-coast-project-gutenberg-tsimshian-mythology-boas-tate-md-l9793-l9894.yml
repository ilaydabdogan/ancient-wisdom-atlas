canonical_text:
  quote: ''
  summary: During the olachen fishing season, children are placed under care for safety.
    Princess Daul watches the girls in a hollow log used as a play-house and dwelling.
    An unusually high tide carries the log, with children asleep inside, out to sea.
    Daul comforts the children while parents search unsuccessfully. Her tamed young
    eagle flies back to Nass River and signals that the children are alive. The log
    drifts to a Haida coast, where Daul sends the children into the woods, enters
    a chief's house through the help of a young prince, and explains her identity
    and voyage through an interpreter.
  language: English
  quote_policy: summarized
