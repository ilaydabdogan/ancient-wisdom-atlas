canonical_text:
  quote: ''
  summary: The passage describes Tlingit and G'it-dzl'°s settlements and seasonal
    homes, then narrates how Lax-ani's, a Wolf Clan head man who lost his possessions
    gambling, leaves with his son to seek beavers. He discovers signs of an unknown
    settlement, spies on a tall canoe maker using copper tools, observes a small village,
    steals copper wedges and a hammer, reports the village to G'it-dzl'°s wise men,
    guides a raid, and the G'it-dzl'°s capture women and children and kill returning
    Tlingit hunters. Four men escape in a faster canoe, and pursuers later find another
    camp of six houses.
  language: English
  quote_policy: summarized
