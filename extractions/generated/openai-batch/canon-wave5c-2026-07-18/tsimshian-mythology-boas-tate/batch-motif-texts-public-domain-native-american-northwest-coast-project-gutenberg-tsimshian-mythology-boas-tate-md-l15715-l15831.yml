candidate_motifs:
- id: motif:1
  label: Atonement before death of an old chief
  taxonomy_refs: []
  basis: The old chief Haimas makes atonement for those he killed and dies immediately
    after addressing a further claimant.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents this as the end of Haimas's life but does not explicitly
    frame it as ritual judgment or supernatural punishment.
- id: motif:2
  label: Post-Deluge repopulation and ancestral-place memory
  taxonomy_refs:
  - flood_and_renewal
  basis: The war account is set after a Deluge that covered the earth and after people
    increased; the Tsimshian remember Skeena River as ancestral land from before the
    Deluge.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The Deluge itself is only a background reference in this passage, not
    a narrated flood episode.
- id: motif:3
  label: Displacement to refuge after enemy conquest
  taxonomy_refs:
  - departure
  basis: The Tlingit subdue the Tsimshian, who flee from the seashore and mountains
    to Skeena River for safety.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: This is a historical-war narrative setting as presented, and the passage
    does not describe a completed return.
- id: motif:4
  label: Survivor pair escaping destruction and founding a family
  taxonomy_refs:
  - survivor_pair
  basis: Two young people leave Beaver Fort before the attack, are the only ones to
    escape, marry at K-t!ad lake, and have ten sons.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The pair are survivors of a fort's destruction rather than of a cosmic
    catastrophe.
- id: motif:5
  label: Parental training of sons for future revenge
  taxonomy_refs:
  - initiation
  basis: Aksk teaches his ten sons weapons, cleanliness, success, and correct conduct,
    then involves them in preparations for revenge.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage describes instruction and preparation, but no formal rite
    of initiation is named.
- id: motif:6
  label: Crafted heavy object for revenge preparation
  taxonomy_refs: []
  basis: Aksk constructs an unusually heavy fir-wood gate coated with pitch and sand
    as part of his stated plan to avenge the burning of Beaver Fort.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage ends before the gate is used, so its function beyond preparation
    remains unstated here.
