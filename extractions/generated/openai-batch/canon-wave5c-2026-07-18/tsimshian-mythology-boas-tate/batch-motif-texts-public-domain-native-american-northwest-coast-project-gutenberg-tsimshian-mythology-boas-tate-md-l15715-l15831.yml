canonical_text:
  quote: ''
  summary: 'The passage closes Haimas''s story with his escape to the Nass River people,
    later demands for atonement, and his death. It then begins an account of wars
    between Tsimshian and Tlingit after the Deluge: Tlingit victories displace Tsimshian
    groups inland to the Skeena River, an Eagle Clan chief builds Beaver Fort, two
    young people flee before its destruction, and their later family of ten sons is
    trained by their father Aksk, who prepares a heavy fir-and-pitch gate for revenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haimas escaped to the Nass River people, who saved him; he lived among them
    with three women who had escaped with him, and the women married Nass chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas's remaining people returned to the Tsimshian and were scattered among
    the Tsimshian tribes because they were not allowed to have a town of their own
    again.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many years later, a new Nes-balas and his people traveled by canoe to the
    place where Haimas lived and demanded atonement for people he had slain in his
    house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Haimas made atonement for each of the princes and warriors he had killed in
    his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A G'id-wul-ksE-ba'° man demanded atonement for his brother; Haimas answered
    by naming possible brothers, saying he was not afraid, and inviting the man to
    look into his heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After stretching out his hands, Haimas fell back and died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator states that many events in Haimas's life were not written and
    that only his enmity against Nes-balas and his people was told.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The war account begins after a Deluge that had covered the whole earth, followed
    by an increase in people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three or four generations before the arrival of white people on the coast,
    there were many wars, and the Tlingit gained many victories.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Tlingit subdued the Tsimshian, pursued them when they hid on mountains,
    and the Tsimshian went up the Skeena River for safety.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tsimshian remembered that the Skeena River had belonged to their ancestors
    before the Deluge, and several tribes settled at named rivers and places along
    or near the Skeena.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: No Tsimshian tribe remained at Metlakahtla or on the seashore, and the Tlingit
    took the country as far as the mouth of the Skeena River.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A great Eagle Clan chief married a G'ispawadwE'da princess, built a strong
    fort named Beaver Fort near the mouth of the Skeena River, and gathered Eagle
    Clan people there for defense.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A young man related to the chief's wife loved the chief's only daughter, and
    the chief told him to take the daughter and flee before the Tlingit attack.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the two young people left Beaver Fort, the fort was attacked; the Tlingit
    were victorious, and no one escaped except the two who had already left.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Tlingit took Tsimshian villages, fishing grounds, and hunting grounds
    as far as Nass River and Skeena River.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Tlingit made villages on Dundas Island and attacked mainland people by
    canoe when they saw smoke ascending there.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The Tsimshian were in distress and were too afraid of the Tlingit to go up
    to Nass River for many years.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:19
  text: The two young people reached the lake of K-t!ad, married, made a home there,
    and had ten sons.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: The father, named Aksk, taught his sons how to use weapons, be successful,
    keep themselves clean, and do things in the right way.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: When the sons were grown, Aksk moved the family to the mouth of K-t!ad Creek
    and told them he wanted revenge on those who burned Beaver Fort.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:22
  text: Aksk instructed his sons to gather fresh fir trees, pitch, and fine dry sand.
  category: action
  evidence_refs:
  - ev:12
- id: obs:23
  text: Aksk made a very heavy gate from fresh fir wood, pitch, and sand, with four
