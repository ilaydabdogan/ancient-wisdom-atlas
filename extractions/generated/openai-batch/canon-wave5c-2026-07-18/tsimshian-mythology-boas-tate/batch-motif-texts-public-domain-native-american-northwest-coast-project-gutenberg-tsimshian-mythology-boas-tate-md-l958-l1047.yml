canonical_text:
  quote: ''
  summary: TxamsEm gains abundant dried salmon through Bright-Cloud Woman, becomes
    proud and suspicious, and loses his provisions and beautiful appearance after
    insulting a salmon backbone. Bright-Cloud Woman calls the dried Salmon her tribe,
    leads them back into the water, and proves untouchable because she is a cloud.
    A following episode begins with starvation caused by the south wind; TxamsEm calls
    the Fish, and Devilfish and Halibut propose war against the Master of the South
    Wind using Killer Whale's strong canoe.
  language: English
  quote_policy: summarized
