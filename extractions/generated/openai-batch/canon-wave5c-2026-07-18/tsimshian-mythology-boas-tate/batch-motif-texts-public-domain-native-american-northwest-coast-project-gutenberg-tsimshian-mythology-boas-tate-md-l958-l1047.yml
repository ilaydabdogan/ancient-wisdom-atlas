- id: obs:3
  text: Bright-Cloud Woman repeatedly gives TxamsEm supper after his walks; after
    several days he becomes proud because of his food and speaks angrily to her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: TxamsEm accuses his wife of receiving a visitor, saying his gambling losses
    show that some man must be visiting her; Bright-Cloud Woman denies this and weeps.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bright-Cloud Woman follows TxamsEm secretly and sees him gambling with a large
