  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: As the dried Salmon fly away, TxamsEm's blond hair is scorched and returns
    to its natural color, and his rough skin returns.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bright-Cloud Woman leads the dried Salmon into the water; when TxamsEm tries
