  cautions: The passage supports the pattern as a local war practice in this narrative;
    no wider comparative claim is made here.
- id: motif:2
  label: revenge provocation through household insult
  taxonomy_refs: []
  basis: Nes-y!aga-ne't's warriors advise Di°ks to place excrement on Haimas's pillow
    and frame the act as part of avenging her father.
  evidence_refs:
  - ev:3
