canonical_text:
  quote: ''
  summary: After earlier killings by Haimas, opposing camps gather across a river.
    Haimas sends canoe-borne messengers who sing a taunt and exchange threats with
    the new chiefs' camp. Haimas's wife Di°ks, daughter of Nes-y!aga-ne't, is advised
    by her father's warriors to put excrement on Haimas's pillow as an act of provocation.
    Haimas sends his brothers Wi-ha'° and Gwina'°t to retrieve her. At the G'it-dzi'°s
    camp, an ambush kills Wi-ha'° at the doorway and then kills Gwina'°t on the ice.
    A youth tells Haimas the deaths avenge his grandfather. The following morning
    a large canoe attack develops into a major battle; the Wuts!En-a'luk are defeated,
    their village is burned, and Haimas escapes with a few followers.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four days after Haimas had arrived at the camping-ground where he had killed
    Nes-balas and his warriors, the Tsimshian and the G'i-spa-x-la'°ts went to their
    respective camping-grounds on opposite sides of the river.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas sent messengers in two large canoes, and the messengers sang about
    cutting the heads of enemies in front of a mocking child-chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The canoe messengers and the warriors at the new chiefs' camp exchanged threats
    of destruction, dead bodies, decayed fish, and a ditch for a chief's body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Di°ks, Haimas's wife and the daughter of Nes-y!aga-ne't, went to her father's
    house and was advised by Nes-y!aga-ne't's warriors to put excrement on Haimas's
    pillow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Di°ks put excrement on Haimas's pillow and then returned to her father's house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Haimas saw the excrement on his pillow, questioned his wives, and then ordered
    his brothers Wi-ha'° and Gwina'°t to bring Di°ks back, saying he would give her
    the excrement to eat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two brothers encountered Am-dzl'°sk, who was making a new canoe, and spoke
    with him before entering the G'it-dzi'°s house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nes-y!aga-ne't's warriors prepared an ambush with a spear-bearing man on the
    roof and two club-bearing men hidden beside the door.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Di°ks was seated in front of her late father's coffin when Wi-ha'° entered
    and asked where she was.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man on the roof thrust a spear into Wi-ha'°'s back, and Wi-ha'° fell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gwina'°t fled out of the house; the club-bearing men missed him, and he ran
    along the beach and onto the ice toward his own village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Am-dzl'°sk threw a tomahawk that struck Gwina'°t at the bend of the knee,
    causing him to fall on the ice, after which warriors thrust spears into his body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After killing Gwina'°t, the warriors sang as a war-song the mourning-song
    of their master who had been killed a few days earlier.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: A youth, son of Haimas, told Haimas that the G'it-dzi'°s had killed his brothers
    to avenge the youth's grandfather, whom Haimas had killed a few days before.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The following morning, many war-canoes from up the river came to attack Haimas's
    camp, and a major battle began on the beach.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Wuts!En-a'luk fought but weakened, and many of their warriors were killed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The G'i-spa-x-la'°ts and people from up the river took the Wuts!En-a'luk village
    house by house.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Before Haimas's house was taken, he escaped with a few men, three women, and
    a few children.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: The attackers burned houses, destroyed property, and their long war-cry was
    heard on the mountains near Red Bluff Gulf, ending like the hooting of an owl.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: The people up the river were glad to have gained victory over the Wuts!En-a'luk.
  category: other
  evidence_refs:
  - ev:11
