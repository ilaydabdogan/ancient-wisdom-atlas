canonical_text:
  quote: ''
  summary: 'The passage first concludes a story in which West-Wind Woman travels with
    Little Feather, explaining why west winds now blow gently and why four brothers
    help the four winds. It then begins “The Feast of the Mountain Goats”: six brothers
    from Prairie Town repeatedly hunt mountain goats wastefully; children abuse a
    captured goat kid in water and fire; a young man named ReaUy Black rescues the
    kid, calls it supernatural, and sends it toward a high mountain. Later messengers
    invite the whole village to a new settlement at a mountain foot, where the people
    encounter a large house and hosts dancing in mountain-goat headdresses and goat-skin
    blankets.'
  language: English
  quote_policy: summarized
