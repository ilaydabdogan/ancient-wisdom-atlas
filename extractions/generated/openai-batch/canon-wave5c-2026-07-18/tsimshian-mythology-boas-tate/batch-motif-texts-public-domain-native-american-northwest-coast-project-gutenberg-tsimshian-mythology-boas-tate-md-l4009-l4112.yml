canonical_text:
  quote: ''
  summary: A hunter and his wife live at a hunting lodge where he traps many raccoons.
    When the wife asks him to look at her, he says she is no better than the raccoons.
    Ashamed, she withdraws to a brook between two mountains, dams the water into a
    pool that becomes a lake, and refuses to return to her husband. She says she is
    not dead and will live in the lake by herself. Her six brothers later come to
    take her home, but she refuses. After two months, the lake covers the valley,
    and the brothers see their sister diving, three floating round objects, and three
    young beavers.
  language: English
  quote_policy: summarized
