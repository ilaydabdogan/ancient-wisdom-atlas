canonical_text:
  quote: ''
  summary: A young man enters the house of a chief associated with grizzly bears,
    remains alert against attempts to steal his weapons, sees his nine brothers' mutilated
    bodies, battles many grizzly bears, and is aided by two pups who become giant
    dogs. After the bears are killed, White-Bear Woman instructs him to remove Chief
    Grizzly Bear's heart and uses it to revive the nine brothers. The brothers retrieve
    their wives, process the bear meat and skins, return home, and recount how the
    youngest brother delivered them with the Bear Woman's help.
  language: English
  quote_policy: summarized
