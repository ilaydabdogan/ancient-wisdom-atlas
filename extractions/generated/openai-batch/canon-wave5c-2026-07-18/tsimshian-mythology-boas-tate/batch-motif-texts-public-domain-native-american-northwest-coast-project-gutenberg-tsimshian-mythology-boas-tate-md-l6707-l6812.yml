canonical_text:
  quote: ''
  summary: 'The passage begins with a marriage custom: a bride is transported by canoe,
    seated beside the bridegroom, and the couple undergoes three days of fasting,
    silence, immobility, and fire-gazing while young people try to make them break
    the restrictions. It then tells of a widow whose daughter accepts a rough-palmed
    night visitor as husband; the visitor leaves sea animals at the beach and is later
    seen as a red bear from the water who turns into a rock when observed. The final
    section begins a story set during winter famine in two Skeena River towns: a young
    prince gives part of his mother''s stored dried spring salmon to a hungry slave-boy,
    is scolded, and secretly leaves home.'
  language: English
  quote_policy: summarized
