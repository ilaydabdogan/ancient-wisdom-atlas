canonical_text:
  quote: ''
  summary: Tomtit guides TxamsEm toward Chief Wolf's village, then turns back because
    he fears the Wolves. TxamsEm arrives wounded; the Wolf people smell blood on him.
    He tells Chief Wolf that an unnamed man attacked him after a hunting episode,
    cut open his belly, removed his intestines, threw him down a cliff, and that he
    later revived. Chief Wolf believes him, pities him, and orders rich meat and fat
    for him, which restores him. Later, TxamsEm joins two young Wolves on a mountain-sheep
    hunt. The Wolves kill many sheep and throw them down the mountain to TxamsEm,
    who hides most of the carcasses under hemlock leaves. The young Wolves find the
    hidden carcasses by scent, and all the Wolves carry the game to the chief's house.
  language: English
  quote_policy: summarized
