  evidence_refs:
  - ev:2
- id: obs:7
  text: Dirty is said still to be holding the world on his chest, with his slave present;
    the wild-duck oil is nearly gone, and Dirty's death will bring the world's end.
  category: sequence
  evidence_refs:
  - ev:3
