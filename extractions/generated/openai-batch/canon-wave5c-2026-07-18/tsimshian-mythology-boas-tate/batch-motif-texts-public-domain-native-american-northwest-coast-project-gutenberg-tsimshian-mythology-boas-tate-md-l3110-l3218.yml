canonical_text:
  quote: ''
  summary: Dirty is brought to an ill chief who has borne the pole supporting the
    world on his chest since the world began. Dirty gives part of his life to his
    slave, takes the world-pole onto his own chest, and remains there until his death,
    when the world will end. The passage then describes four Wind chiefs at the corners
    of the world, their conflict over winter and greenness, their seasonal law, their
    children, and the marriage of South Wind's daughter to a son of North Wind. In
    the cold northern household, the daughter of South Wind carves a yellow-cedar
    object into a duck, sends it to her father, and the duck reports that Frozen has
    cast her out.
  language: English
  quote_policy: summarized
