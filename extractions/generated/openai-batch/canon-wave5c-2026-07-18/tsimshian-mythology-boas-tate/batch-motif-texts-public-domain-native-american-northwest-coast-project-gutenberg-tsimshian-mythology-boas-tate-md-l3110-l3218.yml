  text: The ill chief says Dirty has double strength, one strength from a supernatural
    being and one from the strong mountain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Before lying down, Dirty tells his slave that he will give part of his life
    to the slave and instructs the slave to live with him and rub his back yearly
    with wild-duck oil.
  category: speech
  evidence_refs:
  - ev:2
