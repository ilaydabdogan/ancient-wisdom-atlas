candidate_motifs:
- id: motif:1
  label: world supported by a bearer through a cosmic pole
  taxonomy_refs:
  - world_center
  basis: The world-pole rests first on the ill chief's chest and then on Dirty's chest,
    and Dirty continues to hold the world.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives a world-supporting pole but does not explicitly call
    it a center or axis.
- id: motif:2
  label: replacement of a failing cosmic burden-bearer
  taxonomy_refs: []
  basis: The sick chief sends for Dirty to take his place, transfers the world-pole
    to him, and leaves.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No broader succession ritual is described beyond the transfer.
- id: motif:3
  label: end of the world tied to the death of the world-bearer
  taxonomy_refs: []
  basis: The passage states that when Dirty dies, the world will come to an end.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The manner of the world's end is not described.
- id: motif:4
  label: personified winds establish seasonal order through conflict and law
  taxonomy_refs:
  - seasonal_cycle
  basis: South, East, and West Winds defeat North Wind and then agree on periods of
    greenness, cold, rain, spring melting, summer breezes, and peace.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the sequence as a law among Winds rather than an abstract
    seasonal allegory.
- id: motif:5
  label: marriage alliance between elemental wind families
  taxonomy_refs: []
  basis: North Wind obtains South Wind's daughter as wife for his son, and the wedding
    occurs among the Winds with strong winds and rain.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage presents the marriage plainly; it does not explicitly define
    the marriage as sacred or cosmogenic.
- id: motif:6
  label: distressed bride sends transformed animal messenger to her natal home
  taxonomy_refs:
  - shapeshifter
  basis: South Wind's daughter, distressed in the cold northern household, carves
    a duck-shaped wedge, sends it to her father's country, and it becomes a speaking
    wild duck messenger.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The transformation is object-to-animal rather than a person changing shape.
- id: motif:7
  label: twin children associated with freezing powers
  taxonomy_refs:
  - sacred_twins
  basis: North Wind's wife has twin children named Frozen and Freezer, and Frozen
    is later reported to have cast out South Wind's daughter.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: low
  cautions: The twins are named but do not act as a paired unit in this passage.
