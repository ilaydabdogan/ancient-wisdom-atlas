canonical_text:
  quote: ''
  summary: A young chief warns his people to withdraw to high ground before floods
    and foam accompany the arrival of supernatural beings. He, his mother, and sister
    remain in camp; his fire survives the flood. The people return to help host many
    supernatural chiefs, who wear crests and receive food, burned feast goods, and
    valuables. The chief and his sister take new names, the chief asks two dangerous
    chiefs to move behind Canoe Pass, and after a second flood the guests depart,
    leaving carved houses as gifts.
  language: English
  quote_policy: summarized
