canonical_text:
  quote: ''
  summary: 'A long-absent, hairy prince visits his home, is first unrecognized, then
    identified and welcomed by the new chief as a lost cousin. His two wives are brought
    in, feasted, and clothed; they provide meat, and later bear many twin children.
    Before dying, the prince instructs his children not to harm his people on the
    mountains, and the passage concludes with an explanation that wolves fear humans.
    A new story then begins: a chief’s only son on the Nass River and four friends
    play at shamanism in a woodland hut for years. As a young man, he sees an open
    coffin near a graveyard, ignores his friends’ warning, lies in it, and dies; his
    friends leave, fear ghosts, forget the event, and later remember when his parents
    ask for him.'
  language: English
  quote_policy: summarized
