canonical_text:
  quote: ''
  summary: A chief's son is first received kindly by his youngest uncle, then is left
    behind when his father orders the people to move to Nass River. With a little
    slave, limited food, fire, arrows, and grease, he builds a small house. Eagles
    repeatedly screech on the beach, leading the slave and prince to find fish, seal,
    and sea lion, which they cook or dry until houses are full of food. The passage
    states that the eagles give this food because the prince had fed them the previous
    summer. Meanwhile, the people who left him are starving at Nass River because
    no olachen have come.
  language: English
  quote_policy: summarized
