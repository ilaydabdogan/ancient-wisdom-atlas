canonical_text:
  quote: ''
  summary: A chief's second son, who has taken the name Txa-dzi'°kik, becomes angry
    because his father honors Nes-balas more highly. Despite counsel against violence,
    he gives feasts, competes for chiefly precedence, and later ambushes Nes-balas.
    Nes-balas wounds him in the eye, his warriors defeat the attackers, and the conflict
    becomes a war between brothers. After Txa-dzi'°kik dies, Gaini succeeds to his
    name, holds a feast that Tsimshian chiefs avoid because Nes-balas was not invited
    first, and later sends an invitation followed by a threat and a secret night ambush.
  language: English
  quote_policy: summarized
