canonical_text:
  quote: ''
  summary: A chief holds winter feasts with fresh spring and summer foods and the
    young men describe Chief Robin's house as having winter on one side and midsummer
    on the other. Sawbill-Duck Woman, seeing that Robin Woman had brought many provisions
    from her father, goes to her own father for food. Her father's people load two
    canoes with blubber and fish; she adds a pile of mussels from a rock. When she
    arrives, the chief's attendants see only the mussels and report them, causing
    the chief to order the canoes capsized in shame and anger. The rich marine food
    is then seen floating, but when it is to be gathered, it has become rocks and
    round boulders on the beach at Prince Rupert Town.
  language: English
  quote_policy: summarized
