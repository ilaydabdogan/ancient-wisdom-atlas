canonical_text:
  quote: ''
  summary: Companies of dancers try to subdue a cannibal being with a harmful mixture,
    cedar-bark bindings, and a grizzly-bear skin, but he escapes, kills and eats people,
    and lives in a tree. Later the villagers trap and ritually restrain him again;
    he is fed slaves, taken to a tidal rock, and survives an attempted killing with
    supernatural help, after which his violence diminishes and eventually his voice
    ceases. A following origin episode tells of a mountain-goat hunter who wounds
    a white bear that disappears into rock, enters a large mountain house with four
    companies of people including cannibals, remains there for what seems three days
    but is three years, and is sent back by a supernatural being to imitate what he
    saw.
  language: English
  quote_policy: summarized
