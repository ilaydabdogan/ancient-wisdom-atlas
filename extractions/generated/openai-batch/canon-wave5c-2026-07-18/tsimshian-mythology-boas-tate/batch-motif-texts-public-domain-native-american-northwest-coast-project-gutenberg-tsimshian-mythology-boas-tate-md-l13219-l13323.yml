canonical_text:
  quote: ''
  summary: A bereaved Wolf Mother and wolves besiege a village to recover the body
    and regalia of her slain son. The human prince refuses to return them, promising
    instead to preserve the body, hold a feast, and take the dead prince's name. The
    Wolf Mother mourns through songs, accepts him as an adopted successor, and later
    presents him to the wild animals, gives him her daughters as wives, and helps
    establish him as a powerful hunter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother wails at night through the village for her slain child and asks for
    the brother's garment associated with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The villagers gather logs, build a double-walled fort, gather stones inside
    it, make a walkway on the wall, and move into the fort.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolves surround the fort, and the Mother of Prince Wolf demands the cleft-foot
    garment, threatening that the wolves will eat the people if it is not given.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince refuses to give the garment or the body, saying he will keep the
    body and regalia and later give a feast and take the slain prince's name.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:5
  text: The wolves gnaw at the fort walls; the people throw stones down from the wall
    and kill many wolves; the outer wall falls while the inner wall remains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Mother Wolf sings mourning songs for the cleft-foot garment, the long-ear
    armor, and the wolf-tail hat, and the wolves become quiet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After mourning, the Mother Wolf accepts the prince as her son and states that
    he will take the slain prince's place and be honored by the animals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The prince gives a great feast, invites tribes from the channel of Metlakahtla,
    displays property, wears the slain prince's regalia, sings the associated songs,
    gives away property, and takes the new name Ate The Whole Deer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After taking the name, the prince becomes a successful hunter, and the Wolf
    Mother helps him when he hunts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the prince's parents die, the Wolf Mother brings him to her house, summons
    wild animals, presents him as her adopted son, tells them not to hurt him, and
    gives him her two daughters as wives.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Wolf Mother feeds the assembled animal guests with meat, tallow, and fresh
    salmon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The prince loves his two wives, they love him, and they help him hunt by catching
    animals he misses; he becomes a great hunter and often feasts the wild animals.
  category: relationship
  evidence_refs:
  - ev:10
