canonical_text:
  quote: ''
  summary: 'A stranded man receives food from a woman whose voice he later identifies
    as his drowned sister''s ghost; he remains wary of Land Otters until a real canoe
    takes him home. A deluge narrative follows: waters rise at Lake Of The Beginning
    and flood the Skeena River when a great whale surfaces. Later two brothers go
    to the lake to seek supernatural power; the elder descends beneath the water to
    a house, encounters thunder, lightning, hail, a Grizzly Bear, Thunderbird, Living
    Eyes, Mouth At Each End, and Cuttlefish, and places several beings or forms into
    a grizzly-bear box. He returns with the Grizzly Bear and receives the name Mouth
    At Each End, while his younger brother, waiting on shore, dies of starvation and
    is eaten by martens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seated man hears a woman's voice offering food and telling him not to be
    afraid, and a woman gives him fish and seaweed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man initially refuses the food and calls the woman a Land Otter; later
    he recognizes the voice as that of his drowned sister's ghost and accepts the
    food without harm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man hunts seals with a club, remains wary of Land Otters, plans to damage
    any arriving canoe to test the visitors, and is eventually taken home by a real
    canoe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hunters reach Lake Of The Beginning, where the waters rise, overflow, and
    run down the Skeena River, sweeping almost all villages on the river.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A great whale rises to the lake surface; the passage says the lake rose because
