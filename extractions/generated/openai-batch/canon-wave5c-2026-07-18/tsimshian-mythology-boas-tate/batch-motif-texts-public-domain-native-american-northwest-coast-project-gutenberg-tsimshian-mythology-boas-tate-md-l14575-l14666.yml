    large fire burning in the middle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lightning enters the underwater house four times, thunder rolls four times,
    and terrible hail follows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Grizzly Bear comes from the carved screen, asks the man to open its back,
    and becomes a carved box.
  category: action
  evidence_refs:
