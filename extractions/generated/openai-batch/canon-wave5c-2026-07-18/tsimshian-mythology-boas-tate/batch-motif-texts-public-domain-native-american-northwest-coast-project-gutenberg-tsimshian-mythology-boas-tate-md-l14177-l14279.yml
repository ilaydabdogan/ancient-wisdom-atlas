candidate_motifs:
- id: motif:1
  label: Elder concealment preserves survivors before supernatural attack
  taxonomy_refs: []
  basis: The older woman removes and hides her two grandchildren before the Ghost
    attack; they are the only young survivors named along with her.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives a practical concealment episode; no broader named motif
    family is stated in the passage.
- id: motif:2
  label: Lethal Ghost from the burial-ground
  taxonomy_refs: []
  basis: A Ghost from the old burial-ground, described as Brown Eagle's skeleton,
    appears and kills the young people by taking their breaths.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain why the Ghost asks for something or why Brown
    Eagle appears in this form.
- id: motif:3
  label: Souls of the newly dead kept in the ghost chief's house
  taxonomy_refs:
  - afterlife_journey_map
  basis: The new shaman states that the souls of the young people are living in the
    house of the chief of the Ghosts, and the shamans later find the souls there.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage gives a specific ghost-house location but not a full map of
    the afterlife.
- id: motif:4
  label: Shamanic expedition to recover souls from Ghosts
  taxonomy_refs:
  - mystical_quest
  basis: The shamans prepare, go to the burial-ground, enact a ritual at the Ghost
    chief's house, drive out the Ghosts, and seize the young people's souls.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the act as a war or fight with Ghosts; it is a ritual
    expedition rather than a conventional travel quest.
- id: motif:5
  label: Revival by returning souls to bodies
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Each shaman puts a recovered soul back into its body; the young people awaken,
    and after four days of further work life returns to them.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The young people are not fully living immediately after awakening; the
    text describes an additional removal of ghostly quality.
- id: motif:6
  label: Ritual sound drives out Ghosts
  taxonomy_refs: []
  basis: The shaking of rattles and supernatural neck-bones causes the Ghosts to run
    out of the house, allowing the shamans to recover the souls.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not name the ritual instruments beyond rattles, bones,
    and neck-rings.
- id: motif:7
  label: Social warning against youth going alone without parents
  taxonomy_refs: []
  basis: The episode ends with the people's statement that young people should not
    go about alone without their parents.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is explicitly stated as a conclusion, but the precise social setting
    of the rule is not elaborated.
- id: motif:8
  label: Old shaman artisan and arrow-seller
  taxonomy_refs: []
  basis: The next tale opens with an old wrinkled shaman who lives on a small island
