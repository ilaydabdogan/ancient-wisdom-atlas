canonical_text:
  quote: ''
  summary: A cautious older woman hides her two grandchildren under a fallen tree
    before a Ghost, the skeleton of Brown Eagle, comes from the burial-ground and
    kills the young people gathered around a large fire. The next morning the survivors
    and parents find the bodies. Wise men summon shamans, and a new shaman explains
    that the young people's souls are in the house of the chief of the Ghosts. Armed
    shamans go to the burial-ground, use rattles and supernatural bones to drive the
    Ghosts out, seize the souls, and return them to the bodies. The young people revive
    after further shamanic work over four days. The episode ends with a warning that
    young people should not go about alone without their parents. The supplied passage
    then begins a new tale about an old, wrinkled shaman who lives on a small island
    and makes valuable feathered arrows.
  language: English
  quote_policy: summarized
