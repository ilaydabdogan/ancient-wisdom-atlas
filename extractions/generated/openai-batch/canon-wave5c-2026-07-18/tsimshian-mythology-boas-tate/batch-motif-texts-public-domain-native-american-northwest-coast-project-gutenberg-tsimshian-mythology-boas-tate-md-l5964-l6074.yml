canonical_text:
  quote: ''
  summary: A princess leaves at night with a visitor who takes her by canoe to a mink's
    den. She discovers that her husband is Mink, grieves, hides his dried eels, and
    later tricks him into a lethal ear-piercing after he asks for bone ornaments like
    those worn by people of her rank. The next tale opens by saying people formerly
    married animals and birds; an unmarried chief requests women of the Robin and
    Sawbill Duck tribes, and his people send fasted hunters to search mountains and
    sea.
  language: English
  quote_policy: summarized
