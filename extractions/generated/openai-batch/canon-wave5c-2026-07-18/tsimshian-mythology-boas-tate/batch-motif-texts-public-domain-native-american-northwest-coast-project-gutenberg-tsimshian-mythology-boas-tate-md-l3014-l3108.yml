canonical_text:
  quote: ''
  summary: 'After the third brother is defeated and killed, the chief asks Dirty to
    fight the men who beat his brothers. Dirty kills them, defeats attacking tribes,
    is deserted with a slave, and then defeats successive challengers: strong animals,
    trees, birds, and finally a Mountain. The slave strengthens him with wild-duck
    oil during the mountain contest. Dirty breaks the Mountain, which becomes a sandbar
    with rocks at Sandy Shore, and gains the Mountain''s power. The passage ends with
    two men arriving by canoe to summon Dirty to a sick chief on an island across
    the sea.'
  language: English
  quote_policy: summarized
