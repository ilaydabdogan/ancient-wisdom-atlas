canonical_text:
  quote: ''
  summary: A chief sends young men in two canoes with his wife, the Robin Woman, to
    her father’s town for food during winter scarcity. On the icy Skeena River she
    sings like a robin in spring, and the ice melts before the canoes. At Chief Robin’s
    village, she shows rooms containing snow and summer abundance, and a river full
    of salmon. Chief Robin’s bird people gather salmon, berries, mountain-goat meat,
    and grizzly-bear fat. The loaded canoes return to Xlen, where the food is redistributed
    to the chief’s people and then to invited Tsimshian tribes during famine.
  language: English
  quote_policy: summarized
