canonical_text:
  quote: ''
  summary: A young prince in the town of the Spring Salmon kills a fat youth who becomes
    a small spring salmon, roasts and eats him, and throws the bones into the fire;
    when a boy later complains of a sore rib, the prince finds a missing rib, casts
    it into the fire, and the boy becomes well. The chief of the Spring Salmon sends
    slave scouts to two rivers; after signs of leaves and salmon, the Spring Salmon
    people prepare to move from their deep-sea home. They pass or communicate with
    Silver Salmon, Steelhead Salmon, Humpback Salmon, Dog Salmon, Cohoes Salmon, and
    Trout peoples, each with stated timing for travel to the rivers. The chief gives
    his adopted son a smooth round pebble from his mouth as protection. Near the Skeena
    and Nass river mouths, the chief questions canoe groups about their destinations,
    and the companies separate by route.
  language: English
  quote_policy: summarized
