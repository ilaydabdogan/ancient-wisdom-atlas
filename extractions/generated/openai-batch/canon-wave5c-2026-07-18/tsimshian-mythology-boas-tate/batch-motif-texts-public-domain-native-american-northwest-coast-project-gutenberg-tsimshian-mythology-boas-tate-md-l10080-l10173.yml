canonical_text:
  quote: ''
  summary: The passage concludes an episode in which a young chief and his brothers
    recognize an enslaved aunt through a war-song, learn of an enemy old chief, carry
    out vengeance, and establish marriages and descent lines identified as ancestors
    of the Eagle family among the Tsimshian. It then begins the story of Asdilda and
    Omen, introducing a chief's children and a spring fishing trip in which a prince's
    valuable Cormorant Hat repeatedly falls while he tries to spear trout, is torn
    and thrown into the water, retrieved by the steersman, and followed by a camp
    scene where a frog leaps onto cooked trout.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Early in the morning, four princes sang their war-song, and an enslaved woman
    recognized it as her relatives' war-song.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enslaved woman came out with her little daughter, identified herself as
    Wl-nle'x, and said she was the younger sister of Princess Daul, had been taken
    captive, and had been enslaved for many years.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman said her captors intended to kill her when they put up a totem pole
    in winter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young chief told the woman that Daul was his mother, still alive, married
    in a Haida village, and mother of six children, including the four boys present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The enslaved woman embraced each of the young chief's group after learning
    their kinship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman said only one old chief remained in the village, and he was the
    one who had destroyed the young chief's grandfathers in battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young chief said his uncle had died after charging him to take revenge
    on those who had destroyed his brother and his people, and that he had crossed
    the mountains with his companions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The young chief ordered his men to cut off the heads and take the scalps of
    those killed, and the bodies were treated and set upright on poles at the camping-ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The stated purpose of the treatment of the bodies was to signal that the relatives
    of those slain should not take revenge in the future.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: The group went to G'its lEmga'lon, entered the enemy's house, and found the
    old chief alone in the rear of the house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the young chief's command, his men clubbed the old chief with war-clubs;
    the young chief destroyed his property, pulled out his eyes, and hung the body
    inverted on the grave of his uncles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The young chief sent his warriors, his third brother, and the daughter of
    his captive aunt back toward Nass River or home, while some brothers stayed with
    him and he continued to live in his native home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The young chief married a neighboring princess, his sister married a G'itsIala'sEr
    suitor, and three girls are identified as ancestors of the Eagle family among
    the Tsimshian along the coast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The next story begins in the village of Dzi'gwu, where a chief and his wife
    had two children, a boy named Asdilda and a girl named Omen.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: A prince called three friends, and they went by canoe up the river of Dzi'gwa
    to fish for trout, as they did every spring.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The prince wore a valuable Cormorant Hat covered with costly abalone shells,
    and nobody except this prince was allowed to wear it as a crest of his family.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: When the prince tried to spear large trout, his valuable hat repeatedly fell
    and he lost sight of the trout.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: After becoming angry, the prince tore the hat to pieces and threw it into
    the water, and the steersman fished up the pieces with a long pole.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The group camped at the foot of a large spruce tree, built a fire, roasted
    trout, and used skunk-cabbage leaves as dishes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: A frog leaped onto the cooked trout and remained sitting on it.
  category: action
  evidence_refs:
  - ev:9
