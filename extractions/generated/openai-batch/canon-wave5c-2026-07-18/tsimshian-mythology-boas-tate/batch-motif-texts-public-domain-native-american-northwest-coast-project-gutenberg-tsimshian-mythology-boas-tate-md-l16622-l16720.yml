candidate_motifs:
- id: motif:1
  label: ceremonial chiefly welcome with wealth exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The passage explicitly says the reception follows old chiefly custom and
    describes a welcome dance, food, coppers, grease, canoes, paddles, slaves, and
    other valuables exchanged between chiefs and their people.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The taxonomy label is broader than the passage wording; the passage does
    not use the term sacred or potlatch.
- id: motif:2
  label: chiefly name transfer
  taxonomy_refs:
  - royal_legitimacy
  basis: Sdi'ida states that LEg'e'°x shall have one of his names, Sanaxat, during
    a formal exchange involving chiefs, coppers, and slaves.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the transfer of a name but does not explain its political
    or ritual consequences; the taxonomy reference is approximate.
- id: motif:3
  label: protected return with gifts
  taxonomy_refs:
  - return
  basis: Sdi'ida receives loaded canoes and many valuables, then travels from Nass
    River with two canoes following to protect the party until the escort returns
    near Sandbar Point.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: This is a literal travel-return sequence, not necessarily a mythic return
    motif.
- id: motif:4
  label: kinship-mediated temporary land loan for trade
  taxonomy_refs: []
  basis: Kennedy's request for a new site is made through his wife Su-da'°l to her
    father LEg'e'°x; LEg'e'°x asserts collective Tsimshian land ownership and offers
    only temporary use of his Rose Island camping-place for trade.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a historical-social pattern in the passage rather than a named
    mythological motif.
- id: motif:5
  label: rival neighbors alternate between warfare attempts and trade
  taxonomy_refs: []
  basis: The passage says the Haida of Masset repeatedly tried and failed to make
