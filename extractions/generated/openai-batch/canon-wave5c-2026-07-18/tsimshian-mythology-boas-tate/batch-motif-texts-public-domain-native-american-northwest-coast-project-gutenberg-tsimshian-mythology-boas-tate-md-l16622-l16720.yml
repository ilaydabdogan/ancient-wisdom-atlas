canonical_text:
  quote: ''
  summary: The passage describes the ceremonial reception of Chief Sdi'ida and Haida
    visitors by Chief LEg'e'°x, including the breaking of canoes and cargo, welcome
    dances, food, coppers, grease, slaves, canoes, paddles, and the transfer of a
    chiefly name. It then describes return gifts and protected departure. The latter
    section shifts to Hudson Bay Company forts, Kennedy's marriage to LEg'e'°x's daughter
    Su-da'°l, a request for a warmer trading site, LEg'e'°x's statement that Tsimshian
    land belongs collectively to the tribes, the temporary lending of Rose Island,
    and a later Haida-Tsimshian trading scene involving olachen oil and dried halibut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A drum is beaten, two men go to the beach, and they invite Sdi'ida to come
    in and warm himself; the invitation is repeated twice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two canoes come ashore; young men lift the canoes while the strangers are
    still aboard, place them outside the chief's house, and the canoes break to pieces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Haida are afraid, go inside, are placed on one side of the great fire,
    and their cargo is broken up by command of the great chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The great chief wears a dancing blanket, a headdress, and a rattle, and dances
    a welcome dance for relatives who brought back his nephew from captivity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After dancing, valuable objects are lifted or presented, including one copper,
    ten boxes of grease, two large Bellabella canoes, two bundles of carved paddles,
    and other expensive things; food is served.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Sdi'ida dances, one Haida presents two large coppers and ten slaves
    before LEg'e'°x's seat, and Sdi'ida says that LEg'e'°x shall have one of his names,
    Sanaxat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: On the following day, LEg'e'°x's people give boxes of grease to Sdi'ida, two
    large canoes are loaded with grease, additional slaves and valuables are given,
    and the total number of slaves is stated as thirty-five.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sdi'ida's party travels down from Nass River, and two canoes follow to protect
    them; after crossing the Haida Sea and seeing Sandbar Point, the escort canoes
    return to Nass River.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The Haida of Masset are said to have tried many times to make war against
    the Tsimshian but to have failed for many years.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Hudson Bay Company builds a post at Rose Island; Kennedy, an officer of
    the company, is married to LEg'e'°x's eldest daughter Su-da'°l, while many Tsimshian
    still live at Metlakahtla.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: At an earlier fort at White Point on Nass River, the site is cold, sometimes
    lacks fresh water, and some workmen freeze to death.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Su-da'°l asks her father to give Kennedy a small piece of land because she
    fears freezing, and LEg'e'°x says he has no land because the land belongs to all
    Tsimshian tribes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: LEg'e'°x says he can lend only his Rose Island camping-place, where there
    are a few houses besides his large house, to Su-da'°l's husband for some time.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Kennedy accepts the arrangement by saying he does not want to take land but
    will trade on it for a short time; the fort property is then moved down, and fort
    and garden fences are completed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: When the Tsimshian move down from Nass River for olachen fishing, they assemble
    at Rose Island Camp.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Many hundreds of Haida canoes arrive for trade with the Tsimshian and the
    Hudson Bay Company; the Haida build huts on the sand, while the Tsimshian camp
    on the other side and around Rose Island.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: A Haida woman trades with a Tsimshian woman, exchanging olachen oil for dried
    halibut at a stated rate of five pieces of dried halibut for one measure of oil.
  category: action
  evidence_refs:
  - ev:9
