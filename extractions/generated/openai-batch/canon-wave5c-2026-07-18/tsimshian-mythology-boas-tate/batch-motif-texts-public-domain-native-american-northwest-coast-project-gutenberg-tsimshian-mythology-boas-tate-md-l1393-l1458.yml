canonical_text:
  quote: ''
  summary: TxamsEm seeks food at the place where he expects Little Pitch's house but
    finds only a small spruce with pitch and later a spruce log instead of his canoe.
    Hungry, he reaches a house belonging to Chief Grizzly Bear and his two wives,
    is fed, and asks to join a halibut-fishing trip. He secretly prepares a salmon
    tail, pretends to cut his own belly for bait, and forces Grizzly Bear to cut his
    own body, leading to Grizzly Bear's death. TxamsEm then deceives the two female
    Grizzly Bears into swallowing red-hot stones under the claim that this will restore
    their husband, kills them, butchers the three bears, and remains there eating.
  language: English
  quote_policy: summarized
