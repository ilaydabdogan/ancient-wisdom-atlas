canonical_text:
  quote: ''
  summary: A prince recounts the Salmon people's journey and an obstruction by a great
    shaman's net. He instructs his mother about disposing of salmon remains so the
    salmon may return home and revive. He keeps a pebble from his Salmon father in
    his mouth and does not need food. Later he goes with four companions to an eagle
    trap, gives the pebble to his most beloved friend, takes the appearance of a small
    shining spring salmon, is seized by a hawk, and is found dead. After mourning,
    his coffin is placed on poles at the site, and his friends keep vigil beneath
    it until only the beloved friend remains.
  language: English
  quote_policy: summarized
