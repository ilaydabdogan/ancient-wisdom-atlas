canonical_text:
  quote: ''
  summary: A shaman named Mouth At Each End restores his brother from bones to life,
    makes him a shaman named Devoured By The Martens, and gives him supernatural powers.
    Mouth At Each End defeats many supernatural attackers through helpers, but two
    shamans with Blood kill him and his helpers. Devoured By Martens then uses Blood
    and Martens to kill the two shamans, inherits supernatural objects, and later
    guides his famine-stricken people by song and ritual toward fish and fishing preparations
    near the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A brother's skeleton is found at the foot of a large spruce tree after his
    flesh has been devoured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mouth At Each End rubs earth over his brother's bones, restoring flesh without
    skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mouth At Each End uses a small root for sinews, dances with supernatural powers,
    rubs moss over the flesh, and the moss becomes skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mouth At Each End makes his brother alive again, makes him a shaman, and gives
    him the name Devoured By The Martens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mouth At Each End catches the martens that ate his brother's flesh, puts the
    live martens into his brother, and gives him a vessel of blood as supernatural
    power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
