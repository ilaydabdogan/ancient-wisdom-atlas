canonical_text:
  quote: ''
  summary: A young prince, Hats!Eks-n!e'°x, publicly challenges Haimas after the death
    of Nes-balas. Haimas kills captives and competes by throwing coppers into the
    water, but the prince's side exposes Haimas's copper as wooden and floating. Haimas
    withdraws in shame. In winter, the G'i-spa-x-la'°ts gather noble children, hold
    a fourteen-day feast, give names and wealth, and Hats!Eks-n!e'°x succeeds Nes-balas.
    Years later Haimas blocks access to Nass River, and the new Nes-balas calls the
    tribes to war against the Wuts!En-a'luk.
  language: English
  quote_policy: summarized
