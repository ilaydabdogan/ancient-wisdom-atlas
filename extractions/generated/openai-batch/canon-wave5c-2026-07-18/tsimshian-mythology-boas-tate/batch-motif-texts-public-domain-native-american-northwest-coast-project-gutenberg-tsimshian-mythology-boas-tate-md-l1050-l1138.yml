canonical_text:
  quote: ''
  summary: TxamsEm leads an expedition in a Killer-Whale canoe against the Master
    Of The South Wind after the people ask for relief from bad weather. His companions
    set a trap at the Master's doorway. Cockle boasts but fails and is eaten by TxamsEm;
    Red Cod makes smoke with a fire-drill and cedar bark, driving the Master out so
    that he slips on Halibut and is held by Devilfish. Under threat, the Master negotiates
    weather terms, and TxamsEm accepts four fine days at a time. The party returns,
    and the passage explains present good-weather intervals. The excerpt then begins
    a new TxamsEm episode in which he is hungry near a large town and avoids being
    seen.
  language: English
  quote_policy: summarized
