canonical_text:
  quote: ''
  summary: The passage concludes a narrative in which a dead shaman, appearing as
    a queer-looking ugly owl, becomes chief in the Ghost town, punishes hostile shamans,
    empowers four companions as shamans, and imposes a four-day limit on restoring
    souls to bodies. The four shamans later violate this order while trying to recover
    a dead prince's soul and are kept in the Ghost town. A new narrative begins by
    describing powerful shamans and three men who seek shamanic power from a supernatural
    being in a deep pit within the Cave of Fear; two men lowered by rope are attacked
    by swarming insects.
  language: English
  quote_policy: summarized
