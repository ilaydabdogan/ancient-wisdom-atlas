canonical_text:
  quote: ''
  summary: 'The passage contains three adjacent narrative units: Ayagansk, a Raven
    Clan chief, obtains a living abalone bow at sea and establishes it as a Raven
    Clan chiefly crest; an unnamed hunter sees a large sea raven with people under
    its wings and paints it on a house front; and the beginning of the story of G''it-na-gux-a''ks,
    in which Chief Dragging Along Shore and companions, hunting after the Deluge,
    anchor above an underwater supernatural chief''s house, injure a codfish slave,
    and are taken down into the underwater house while asleep.'
  language: English
  quote_policy: summarized
