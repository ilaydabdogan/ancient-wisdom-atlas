canonical_text:
  quote: ''
  summary: The passage concludes an episode in which attendants watch a chieftainess's
    coffin in a tree, discover the chief's nephew visiting it, throw down the coffin,
    and find a living baby boy among the mother's intestines. The child, named Sucking
    Intestines, grows up in the chief's house, repeatedly visits the island and spruce
    tree connected with his mother's coffin, and is later taken and burned by a tongue-like
    flame while gum is being burned. The passage then begins another tale, in which
    a chief's first wife is jealous of a favored young woman and attempts to involve
    the young woman's eldest brother in a private exchange involving red ocher.
  language: English
  quote_policy: summarized
