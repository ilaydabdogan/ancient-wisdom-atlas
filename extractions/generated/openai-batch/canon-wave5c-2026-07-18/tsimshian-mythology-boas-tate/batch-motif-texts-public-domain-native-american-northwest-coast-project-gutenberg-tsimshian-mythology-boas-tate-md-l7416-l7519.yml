canonical_text:
  quote: ''
  summary: 'The passage concludes a story in which a prince associated with the Salmon
    people returns toward human territory, sends his friend ashore, and is reported
    to live with the Spring Salmon. The friend brings instructions about correct treatment
    of spring salmon and warnings of thunder, lightning, rain, floods, and salmon
    scarcity if taboos are violated. The passage then begins the story of the Town
    of Chief Peace: a noble couple have a beloved son late in life; he marries a princess,
    gambles away his property and family, returns home in distress, and his wife throws
    prepared salmon into the fire after he refuses to eat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince says he will go back with his friend, die when he arrives home,
    and stay with his grandfather and his people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In winter the prince tells his friend to club a child behind the town whenever
    he is hungry, and the friend does this through the winter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In spring the prince asks the Salmon father to let him scout for salmon in
    the Skeena River.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Salmon people take the prince and his friend in a new canoe toward the
    mouth of the Skeena River, where floating ice prevents further travel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the mouth of Gits!Emgalon River, the prince sends his friend ashore; the
    two cry and separate, expecting not to meet again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The friend returns to his town and tells the people that the Spring Salmon
    took the prince's body and that the prince is living with them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The friend says he restored a small pebble to the prince's mouth, after which
    the prince recognized him, while the Salmon people did not see the friend.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The friend reports instructions to cut spring salmon carefully at the head
    and tail and not to break the backbone there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The friend warns that breaking the salmon backbone at the head or tail would
    bring thunder and lightning that burn the mountains and village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The friend says stone or bone knives should not be used, because they would
    make heavy rains and overflowing rivers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The friend says people should not keep salmon in boxes when it is dry, lest
    there be no salmon the following summer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The friend reports that Herrings dance every day, Salmon have beautiful carved
    houses, Spring Salmon are chiefs of all Salmon, their town is far out at sea,
    and all Salmon tribes are people.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the next story, a great chief at Metlakahtla and his noble wife have a
    son when the wife is old, after many childless years.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The son marries a princess, and relatives exchange valuable property and food.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The young husband gambles frequently and eventually loses his own property,
    his father's property, and his father, mother, wife, and little boy.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: After the gambling loss, the prince sits silently staring into the fire while
    his wife prepares dried salmon for him.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The wife scolds him for not eating, refers to the salmon as belonging to the
    daughter of Chief Peace, and throws the dish with the salmon into the fire.
  category: action
  evidence_refs:
  - ev:14
