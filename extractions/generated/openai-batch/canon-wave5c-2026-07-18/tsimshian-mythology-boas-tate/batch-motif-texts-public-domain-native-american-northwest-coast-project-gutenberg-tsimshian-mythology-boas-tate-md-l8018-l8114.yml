canonical_text:
  quote: ''
  summary: A first wife accuses four brothers after putting red paint on her own face,
    and the chief orders the brothers killed. Their sister, the chief's younger wife,
    mourns daily over their bodies, fasts, and is mocked by the chief, first wife,
    and young men who trip her with a cedar-bark rope. After she wishes to die, a
    lightning flash accompanies the appearance of a handsome Supernatural One, who
    says his father the Sun sent him. He gives her a bundle of leggings, snowshoes,
    and moccasins and instructs her to present it before the chief. When she does
    so, lightning flashes, frightening the chief, who summons the whole village.
  language: English
  quote_policy: summarized
