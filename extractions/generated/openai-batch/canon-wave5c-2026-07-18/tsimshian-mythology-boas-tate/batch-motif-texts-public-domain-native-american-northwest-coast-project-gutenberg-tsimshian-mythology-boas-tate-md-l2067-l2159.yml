canonical_text:
  quote: ''
  summary: A chief’s men keep watch for a mysterious great man who enters a carved
    house and shoot him, but the bullets have no effect; the people fear they have
    shot a supernatural being. Years later, an impoverished young man who has lost
    his family’s goods through gambling wanders into the mountains, follows a narrow
    trail to a valley hut, and meets the giant TxamsEm. TxamsEm identifies himself
    by the wound in his chest from the earlier shooting, feeds the young man, shows
    him a valley and surrounding mountains full of animals provided for him, and reveals
    two pups that become hauhau cubs and obtain mountain sheep. TxamsEm prepares meat
    and fat by wrapping and squeezing it around his hunting-staff, gives it to the
    young man, and directs him home on a trail while warning him not to look back
    until he is above his village.
  language: English
  quote_policy: summarized
