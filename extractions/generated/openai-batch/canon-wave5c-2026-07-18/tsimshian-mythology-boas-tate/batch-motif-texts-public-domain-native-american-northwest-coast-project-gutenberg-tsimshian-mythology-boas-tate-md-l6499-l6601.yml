canonical_text:
  quote: ''
  summary: A prince follows an old woman's instructions to visit the house of Chief
    Pestilence, avoids maimed callers, and is transformed through boiling, bone reassembly,
    a reviving leap by the chief's daughter, and combing. After time passes differently
    in the house, he finds his companion reduced to bones and has him restored by
    the same powers. Both return home beautiful, and the princess who once refused
    the prince tries to attract him, but he ignores her.
  language: English
  quote_policy: summarized
