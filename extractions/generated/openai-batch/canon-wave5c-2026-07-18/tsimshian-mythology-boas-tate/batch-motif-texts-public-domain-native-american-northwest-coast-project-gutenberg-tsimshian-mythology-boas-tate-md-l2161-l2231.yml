- id: obs:3
  text: As the young man runs, he hears noises compared to thunder and mountain-slides,
    the earth quakes, and he keeps his eyes on the narrow trail until he arrives above
    his village before sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When he looks back, high mountains cover the country behind him; the passage
    says TxamsEm had smoothed the mountains for him and that they rose again after
    he passed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man leaves the staff and rifle near a tree stump, looks secretly into
