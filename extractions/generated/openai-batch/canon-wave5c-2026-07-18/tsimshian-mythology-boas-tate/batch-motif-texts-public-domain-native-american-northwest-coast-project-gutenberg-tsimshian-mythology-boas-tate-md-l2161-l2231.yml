canonical_text:
  quote: ''
  summary: A young man, directed by TxamsEm and carrying TxamsEm's staff, hurries
    along a narrow trail while terrible noises and quaking occur behind him. After
    he reaches the area above his village, mountains stand again where the trail and
    plain had been. He returns to his father's house, reunites with his family, gathers
    the tribe, and distributes mountain sheep meat and fat taken from the staff. He
    then recounts his earlier journey across mountains, rivers, lakes, a great plain,
    and a narrow trail to a smoky valley hut where a large man by the fire identified
    himself as TxamsEm.
  language: English
  quote_policy: summarized
