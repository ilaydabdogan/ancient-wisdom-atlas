canonical_text:
  quote: ''
  summary: In Chief Na-gun-a'ks's house, Mouse Woman warns Dragging Along Shore about
    the danger of the place and advises him. Na-gun-a'ks feeds the human guests whole
    boiled seals, which the Killer Whale crest guests can swallow, while the Eagle
    crest steersman cannot. After a year, Dragging Along Shore gives Na-gun-a'ks valuables
    and provisions. Na-gun-a'ks opens his house to water, reveals assembled supernatural
    chiefs and monsters of the rocks, redistributes the gifts, grants special crest
    objects and a copper canoe, and asks the supernatural chiefs to help Dragging
    Along Shore in hunting.
  language: English
  quote_policy: summarized
