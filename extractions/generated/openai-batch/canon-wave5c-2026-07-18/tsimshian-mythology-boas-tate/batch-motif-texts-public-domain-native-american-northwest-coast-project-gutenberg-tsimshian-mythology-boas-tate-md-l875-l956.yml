canonical_text:
  quote: ''
  summary: After recovering from sickness, TxamsEm builds a small house, canoe, and
    spear, and meets a bright woman in his canoe who identifies herself as Salmon
    and becomes his wife. At his house she causes spring and silver salmon to fill
    the creek, changes his hair and skin, and later restores an eye that ravens take
    along with salmon while he is gathering wood for smoking fish.
  language: English
  quote_policy: summarized
