canonical_text:
  quote: ''
  summary: 'Tsauda repeatedly outdoes Halus: he frustrates Halus in a sling episode,
    strikes a large copper on a high mountain so that it divides and explains regional
    copper sources, and later fills canoes with fish while Halus catches only rubbish.
    After Tsauda refuses Halus''s request for fish, Halus jumps from his canoe and
    drowns, and Halus''s wife jumps after him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Halus stands in a canoe with a sling and stone; after Tsauda blows water from
    his mouth and speaks about the stone, Halus's stone passes through the bow of
    his father-in-law's canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people clap, shout, and mock Halus; Halus is ashamed, his wife cries,
    his mother-in-law is ashamed, and Halus throws away his magic sling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsauda puts a stone in his sling, stands on a box, throws it, and hits a large
    copper on the top of a high mountain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men and women blow water from their mouths against the sliding copper and
    speak directional commands; the copper divides, with one part flying northwest
    and another toward the head of Copper River.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator states that this explains good copper in Alaska and at a headwater
    of the Skeena River, and says the people call it living copper.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A parenthetical note says spring salmon went up the river and became copper
    in deep upper water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the fishing-place, the fish are late; when they arrive, the river is full
    and people go out to fish with spouses in the fishing season.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief tells his elder daughter that her husband should fill canoes for
    him and for her three uncles, and says Tsauda should do the same.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tsauda blows water from his mouth and speaks so that Halus's bag net should
    fill with mud, chips, and leaves but not fish; Halus's net repeatedly comes up
    with river mud and rubbish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tsauda repeatedly fills large canoes with fish, and slaves carry the fish
    to his father-in-law and to his wife's uncles.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tsauda mocks Halus for catching fallen leaves; Halus is distressed and cries,
    and his wife and mother-in-law are sad.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Halus asks Tsauda for fish; Tsauda tells him to wait until the season is over;
    Halus jumps from the canoe and drowns after saying he will become Tsauda's snag,
    and Halus's wife jumps after saying she will become Tsauda's codfish.
  category: sequence
  evidence_refs:
  - ev:9
