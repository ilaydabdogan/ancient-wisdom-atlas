candidate_motifs:
- id: motif:1
  label: Reciprocal peace-making ceremony through washing, feeding, and dancing
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: The passage frames the repeated dances, washing, food service, and reciprocal
    acts as customs of making peace between Tlingit and Tsimshian.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage explicitly calls the acts peace-making customs, but the taxonomy
    term sacred_exchange is broader than the passage's wording.
- id: motif:2
  label: Elite representatives exchanged between formerly hostile groups
  taxonomy_refs:
  - covenant
  - royal_legitimacy
  basis: Each side keeps or takes a great prince, and the passage says the two princes
    represent the two tribes that made lasting peace.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage describes representation and residence with opposing chiefs,
    but it does not use terms such as hostage or fosterage.
- id: motif:3
  label: Ceremonial renaming by chiefs and wise councils
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  basis: Both princes ask for Gowagani names; wise men propose names, chiefs give
    final names, and the princes accept them in the context of the peace dance.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy links to wisdom and royal legitimacy are interpretive; the
    passage itself emphasizes naming within a peace dance.
- id: motif:4
  label: Marriage and wealth compensation as war settlement
  taxonomy_refs:
  - sacred_exchange
  - sacred_marriage
  basis: A princess is given as wife and valuable things are given to atone for those
    slain in earlier war.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents a marriage transfer and compensation, but does not
    explicitly call the marriage sacred.
- id: motif:5
  label: Ceremonial anointing and scattering of down
  taxonomy_refs: []
  basis: Down is blown and scattered over participants, and fat with red ocher is
    rubbed on the faces of Tlingit leaders and people during the concluding reciprocal
    dances.
  evidence_refs:
  - ev:8
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage clearly describes the actions, but their symbolic meaning
    is not fully explained beyond association with happiness and peace ceremonies.
- id: motif:6
  label: Seasonal happiness name as social ideal
  taxonomy_refs:
  - seasonal_cycle
  basis: The name Summer Gowagani is explained as a time when no one should be in
    sorrow, birds sing, berries ripen, weather is fine, and people are happy.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The available taxonomy term seasonal_cycle is only partly supported; the
    passage explains one seasonal name rather than a full cycle.
