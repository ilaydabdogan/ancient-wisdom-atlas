canonical_text:
  quote: ''
  summary: 'The passage describes reciprocal Tlingit and Tsimshian peace-making ceremonies:
    ritual washing and feeding of princes, repeated dances, exchange of elite representatives,
    ceremonial naming as Nass Gowagani and Summer Gowagani, return visits, dances
    with down, rattles, coppers, marriage transfer, wealth compensation for war deaths,
    and anointing with fat and red ocher.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before food was served, young girls washed the right and left hands and the
    face of the great Tlingit prince with water, and wiped him with soft shredded
    cedar bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A princess wearing abalone ornaments, brass bracelets, and a dancing blanket
    gave food to the great Tlingit prince, and reciprocal service was done for LEg'e'ox's
    nephew.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tlingit and Tsimshian danced again, stayed four days in the chief's house,
    danced three times a day, and the narrative says these peace-making customs continued
    afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tlingit carried LEg'e'ox's nephew on an elk skin to their canoe, placed
    him on a carved box, and took him away with his crests, his uncle's dancing blanket,
    a headdress, and two friends.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: LEg'e'ox kept the Tlingit prince and two men who followed him in his house;
    the prince continued to dance three times a day, receive food from the princess,
    and be washed by the girls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the two great princes represented the two great tribes
    that had made peace permanently.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Tlingit prince asked LEg'e'ox for a Gowagani name; Tsimshian wise men
    proposed strong-animal names, but he accepted LEg'e'ox's name Nass Gowagani.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: LEg'e'ox's nephew asked Gadunaha for a Gowagani name; Tlingit wise men proposed
    favorable names such as Fine Weather, Sun, Moon, and Stars of Heaven, but he accepted
    Gadunaha's name Summer Gowagani.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the fall, the Tlingit returned to Metlakahtla, LEg'e'ox invited the Tsimshian
    tribes, and Summer Gowagani served as head dancer of the Tlingit in dances of
    happiness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the happiness dances, dancers and old women held down, rattles, and
    canes, and dancers blew down from their palms so that it flew about the house
    and covered the heads of the Tsimshian.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gadunaha called Summer Gowagani forward; Summer Gowagani came with a copper
    in each hand, spoke Tlingit, and placed the coppers before his uncle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A young princess who had fed the great prince was given to the chief as his
    wife, and many valuable things were given to atone for people slain in earlier
    war.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The name Summer Gowagani is explained as a condition of no sorrow in summer,
    with birds singing, berries ripe, fine weather, and happy people.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the following dance, Nass Gowagani was head dancer of the Tsimshian; the
    Tsimshian held white eagle tails and red ocher bags, and young women held down
    and mountain-sheep tallow.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage explains how fat and tallow were purified and says they were used
    for anointing the faces of girls and young men.
  category: other
  evidence_refs:
  - ev:12
- id: obs:16
  text: Tsimshian young women scattered down over the Tlingit, and the princess who
    had fed Nass Gowagani rubbed fat and red ocher on Gadunaha's face; other young
    women did the same to Tlingit faces.
  category: action
  evidence_refs:
  - ev:13
