canonical_text:
  quote: ''
  summary: A supernatural chief hosts supernatural beings and asks them to stop harming
    his grandchildren's people; the beings and the winds agree. The passage explains
    that water beings had previously capsized canoes to get dried berries. The grandchildren
    and their mother return to Raven town, where they are welcomed and named. The
    young man becomes wealthy, gives feasts, takes a supernatural name, and later
    organizes a major invitation feast for supernatural beings, commissioning Tsimshian
    tribes to prepare goods and foods over two years. After moving to Nass River and
    sending messengers, no supernatural guests arrive because one supernatural chief
    was not invited; the supernatural grandfather identifies the omission and leads
    the grandchildren to that chief's place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A supernatural chief addresses chiefs of supernatural beings from all parts
    of the world and asks them to let his grandchildren's people live and not harm
    them because many have been drowned in the river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monsters agree to do what the supernatural chief says, and the North,
    South, West, and East Winds each say they will not blow so often.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains that before the invitation, many canoes were capsized
    on Skeena River and along the coast by water supernatural beings who wanted dried
    berries carried in the canoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After agreeing not to do more harm, the supernatural beings leave for their
    own homes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The great chief tells his son to let his grandchildren and their mother return
    home, and they arrive at Raven town, where the uncle's tribe rejoices that the
    young princess is alive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The uncle invites all Tsimshian tribes, chiefs, and people to see the two
    grandchildren and gives out their names.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The young man and his sister obtain animals of the woods and water; the young
    man becomes rich, gives feasts, and after his uncle dies takes the name given
    by his supernatural grandfather: Down The Useless River.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young chief tells his mother he will invite the supernatural beings who
    were guests in his supernatural grandfather's house, and his mother tells him
    to do so, saying his supernatural father and grandfather will help him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young chief sends orders to named Tsimshian groups to make carved dishes,
    spoons, boxes, deep dishes, horn spoons, dried meat, tallow, berries, crabapples,
    hemlock-sap cakes, salmon, and cedar-bark mats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After two years, the Tsimshian groups bring boxes, bundles, foods, implements,
    and other prepared goods; additional groups bring cedar bark, eagle down, tobacco,
    yellow-cedar bark blankets, cloaks, and burnt clamshells, and the chief's own
    tribe loads canoes with the goods.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The young chief moves from old Metlakahtla to Nass River, builds two large
    houses above the rock of Algusauxs and another house for his mother, then sends
    his sister and young men in a canoe as messengers to invite supernatural beings
    of rocks and water from all over the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: No guests arrive; the young chief and his sister ask their supernatural grandfather,
