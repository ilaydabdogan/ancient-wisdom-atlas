canonical_text:
  quote: ''
  summary: A canoe steersman is lowered by a cedar-bark line into a dark pit, enters
    a supernatural house, and receives shamanic power through ritual actions by shamans
    and a chief. After returning, signs of power appear among the canoe party, and
    the delayed recipient later becomes the shaman named Only One, who heals and revives
    the dead. Rival shamans try to destroy him, and a later summons involving a falsely
    sick chief's son and polluted water is exposed by his supernatural power; the
    supplied passage ends before the episode concludes.
  language: English
  quote_policy: summarized
