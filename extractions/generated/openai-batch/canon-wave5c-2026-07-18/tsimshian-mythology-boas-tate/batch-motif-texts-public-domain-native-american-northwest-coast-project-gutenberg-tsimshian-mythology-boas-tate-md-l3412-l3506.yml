canonical_text:
  quote: ''
  summary: 'Four brothers leave home after being scolded about a beautiful plume and
    travel through a sequence of encounters: a blind man with a people-catching net
    at a mountain, a raccoon killed by Little Feather and restored after its grandmother
    traps the brothers in a heated hut, and a lake-side old woman who hospitably receives
    them but later tries to collect their breath with cedar-bark poles while they
    sleep. Nalq keeps watch and reverses the breath-taking act.'
  language: English
  quote_policy: summarized
