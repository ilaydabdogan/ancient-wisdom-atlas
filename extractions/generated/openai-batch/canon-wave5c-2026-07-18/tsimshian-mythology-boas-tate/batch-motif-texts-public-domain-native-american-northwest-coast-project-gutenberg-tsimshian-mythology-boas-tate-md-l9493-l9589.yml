canonical_text:
  quote: ''
  summary: A woman and her son secretly recover and eat the meat and fat of a grizzly
    bear killed by the woman's blind husband, while she tells the boy not to reveal
    the kill. The son tells his father and offers him hidden meat. The father refuses,
    asks to be led to a lake, and remains there weeping. After repeated loon cries,
    a supernatural being appears and restores his eyesight by removing rubbish and
    bad blood from his eyes and throwing it into the water. The man hides afterward;
    his son thinks he has been devoured, and the mother welcomes the supposed death.
  language: English
  quote_policy: summarized
