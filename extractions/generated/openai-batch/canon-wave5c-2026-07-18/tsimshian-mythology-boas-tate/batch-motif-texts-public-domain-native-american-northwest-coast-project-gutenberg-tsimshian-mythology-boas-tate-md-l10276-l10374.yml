canonical_text:
  quote: ''
  summary: A steersman recounts a canoe journey in which a mourning-marked young woman
    repeatedly vanishes and a frog appears; she predicts several deaths, including
    the steersman's. After the deaths, an old woman reports a dream and instructs
    the chief to hide his daughter in an earth-covered pit filled with valuables.
    Fire then falls from heaven onto a mountain, flows down, burns the village and
    the water before it, and kills the villagers. Princess Omen and the old woman
    survive hidden underground; Omen hears the old woman's mourning song above her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The steersman speaks in his house to people gathered around him and recounts
    that the canoe party was paddling away from camp when they heard someone shout
    behind them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young woman stands on the beach of the camp with her face blackened with
    charcoal as a sign of mourning and asks to be taken in the canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince orders the canoe to turn back, goes to the woman, and tries to
    embrace her because he is pleased by her appearance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the prince tries to embrace the woman, she vanishes from sight and the
    prince sees only a frog leaping away; this occurs three times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the canoe party stops listening to her, the woman calls repeatedly and
    then predicts deaths for the prince, other canoe occupants, and the steersman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After finishing his account, the steersman falls back and dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The village people move away, take the bodies of the dead, and bury them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old woman goes to the house of the chief, who is the father of the dead
    prince, summons the village people, reports a bad dream, and tells the chief to
    dig a deep hole in the middle of his house and put his only daughter into it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief has the ground dug out; costly coppers, painted garments, skins,
    blankets, and other property are placed in the pit before the girl enters it and
    is covered with blankets and earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Princess Omen has been covered with earth, the old woman says that in
    her dream fire fell from heaven, consumed the village, and fell on the mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A firebrand falls on the mountain and streams down quickly like water; the
    fire goes around the village, and the water in front of the village burns like
    oil.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The people of the village cannot escape and are burned up; only Princess Omen,
    hidden in the hole, and the old woman, hidden in the ground, are saved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: While seated in the pit, Princess Omen hears the fire passing above her; later
    she hears the old woman crying and singing a mourning song about gathering the
    bones of her dear ones.
  category: sequence
  evidence_refs:
  - ev:9
