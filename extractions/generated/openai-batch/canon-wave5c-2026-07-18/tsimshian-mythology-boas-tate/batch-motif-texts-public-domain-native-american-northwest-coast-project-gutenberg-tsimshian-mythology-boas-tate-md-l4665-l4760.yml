canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a young man married to
    White-Bear Woman visits a shaman or supernatural woman who kills hunters at her
    den; his wife commands two dogs to grow large, and they kill the woman, though
    afterward the dogs and the young man die. The passage then begins ''The Hunter
    and his Wooden Wife'': a hunter''s wife dies while weaving a dancing-garment in
    a mountain camp; the hunter carves a red cedar image of her, arranges it to appear
    to weave and speak, and two runaway sisters later discover that the apparent woman
    is made of wood.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man who had married White-Bear Woman hears of a shaman woman killing
    hunters who pass her den and sets out with his wife to visit her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supernatural woman invites the couple into her cave or den, seats them
    on one side of her fire, and dead people are seen hanging on poles in the corners
    of the house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The supernatural woman says she will eat the young man's wife and then him;
    the young man answers that he will put her head on a long pole and feed her flesh
    to his two dogs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: White-Bear Woman commands the dogs Red and Spots to grow; the dogs become
    large, attack the supernatural woman, bite her neck, sever her head, and eat her
    flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The supernatural woman's head remains alive after decapitation; the young
    man places it on a pole at the mouth of her den.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: White-Bear Woman pets the dogs and they become small again; after the couple
    returns home, the pups are dead and the young man also dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: White-Bear Woman carries her husband's body and the two dead dogs to her own
    home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hunter marries a young woman whom he loves because she knows how to make
    dancing-blankets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hunter and his wife go to a mountain camping-ground with tools, traps,
    and snares; he hunts mountain sheep for wool, and she washes, spins, dyes, and
    weaves it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hunter's wife becomes ill while he is away and, before dying, asks him
    to keep loving her, not go home too soon, and watch over her grave.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hunter keeps his wife's dead body many days until it decays, then buries
    it and carves an image of her out of red cedar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The hunter leaves his wife's unfinished dancing-garment where it was, seats
    the wooden image before it, makes the image's fingers move as if weaving, makes
    it turn when the door opens, and pretends it can speak.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When returning from hunting, the hunter throws bear meat and fat outside,
    calls to the wife-image, answers as if it were speaking, embraces it, and praises
    its appearance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Passing hunters look into the house and see what appears to be a woman weaving;
    someone says the hunter's wife is made of wood and tells the village.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Two sisters flee after their mother becomes angry, cross mountains, valleys,
    and rivers, and arrive at the camp of the wooden wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The two sisters look through a knot-hole, see a woman seated by a dancing-garment
    as if weaving, enter to ask for food, and discover by touch that she is wood rather
    than a living being.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: After discovering the wooden wife, the sisters laugh, remember what they had
    heard about her, and hide in a corner among dried meat and fat.
  category: sequence
  evidence_refs:
  - ev:9
