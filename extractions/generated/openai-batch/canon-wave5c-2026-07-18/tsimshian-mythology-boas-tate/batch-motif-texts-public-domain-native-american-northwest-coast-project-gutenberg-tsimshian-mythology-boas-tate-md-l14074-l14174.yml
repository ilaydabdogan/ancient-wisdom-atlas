canonical_text:
  quote: ''
  summary: 'The passage closes a narrative in which Only One cures Prince Bagus by
    removing an arrow, learns of failed shamans, receives a child as supernatural
    power, returns by canoe, and is later said never to have died but to have been
    taken to a deep pit by supernatural powers. It then begins the Story of the Ghost:
    Brown Eagle, the beloved only son of a chief and chieftainess, dies; his parents
    make salmon-dip offerings at his grave, the village moves, and later young people
    near the burial-place cook fern roots and mockingly call the dead prince to eat
    his favorite food despite a woman''s warning. A note describes mortuary preparation
    of the prince''s body.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only One saw a broken arrow between the sick prince's ribs, pulled it out,
    rubbed the wounded side, and the prince was cured and arose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief Bagus asked Only One to cure his sick son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old shaman told Only One that he had been invited by Chief Bagus when young,
    had grown old there, and that part of his body had become stone so he could not
    return home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old shaman said many shamans had tried and failed to heal the prince,
    and that the chief had thrown them into a lake of blood where they still remained.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the evening the Prince of Bagus caught a child playing outside, gave it
    to Only One as his supernatural power, and Only One placed it in his long hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Only One boarded the same new canoe with the same three men, and when the
    canoe reached shore at sunrise, the canoe and the three men were transformed into
    a log of driftwood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Only One lived many years afterward and was said never to have died, but to
    have been taken by supernatural powers to their home in the deep pit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Story of the Ghost, a village on G'its lEmga'lon River had people whose
    shouting made geese fall down and die when geese flew over.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Brown Eagle was the beloved only son of a chief and chieftainess, and he was
    known for eating only salmon-dip, which villagers sent to him in summer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Brown Eagle became sick, died, was mourned, placed in a coffin on the burial-place
    after four days, and his parents burned salmon-dips on his grave every morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After two or three months Brown Eagle was buried, and the chief ordered his
    people to move away from the old village site and build a new village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two years later, young women with a middle-aged woman went to the old village
    to dig fern roots and camped near the burial-place, while young men followed and
    helped them dig.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young men dug an earth oven, heated stones, arranged wet moss and fern
    roots, covered the pit, and built a large fire on top before supper was served
    with dried salmon and salmon-dips.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Young men joked about finding Brown Eagle's favorite salmon-dip and called
    Brown Eagle to come down and eat it; the young women were afraid, and the middle-aged
    woman repeatedly warned them not to mock the dead prince.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note says that in olden times the bodies of princes, rich people, chieftainesses,
    princesses, or dear persons could be emptied of organs, filled with shredded red-cedar
    bark, kept for a long while, and that the organs were burned immediately; the
    note says this was done with the prince.
  category: action
  evidence_refs:
  - ev:11
