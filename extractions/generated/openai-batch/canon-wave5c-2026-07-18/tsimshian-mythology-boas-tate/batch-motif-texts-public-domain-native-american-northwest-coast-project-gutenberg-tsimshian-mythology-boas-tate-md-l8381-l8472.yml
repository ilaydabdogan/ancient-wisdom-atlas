canonical_text:
  quote: ''
  summary: 'The passage first closes a preceding tale: a young chief gives wealth
    to his wife''s relatives, marriages repopulate an empty village, he takes a monster
    woman as a crest, kills two monsters, and frees an island for sea-otter hunting.
    It then begins ''The Prince Who Was Deserted'': a chief''s only son feeds summer
    salmon to eagles to obtain feathers for swift arrows. In winter scarcity his father
    orders the prince''s uncles not to feed him, and the first three uncles each prepare
    salmon before taking it away, leaving the prince ashamed and crying.'
  language: English
  quote_policy: summarized
