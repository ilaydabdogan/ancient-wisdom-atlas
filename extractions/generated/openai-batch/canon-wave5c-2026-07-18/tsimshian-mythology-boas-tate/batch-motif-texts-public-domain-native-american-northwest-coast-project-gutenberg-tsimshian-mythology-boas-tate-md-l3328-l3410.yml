canonical_text:
  quote: ''
  summary: A princess survives after a heavenly plume carries away and kills the people.
    She creates five children from mucus and objects. The children later ignore her
    warning, encounter the descending plume, and are nearly carried upward. Knife
    Hand cuts the air above the plume and revives her brothers with it. The siblings
    assemble the bones of the dead incorrectly, and Naki waves the plume four times,
    calling the four winds to restore breath and life to the bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only one princess, the daughter of a great chief and newly delivered of a
    child, remains after the people are taken up by a plume, fall, and die in a pile
    of bodies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While weeping over the bodies, the young woman throws mucus from her nose
    onto the ground, where it becomes a baby boy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A piece of grindstone, a crabapple branch, a feather, and a shell are placed
    in the woman's bosom and later become children.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children are named Mucus or Nalq, Little Grindstone, Little Crabapple
    Tree, Little Feather, and Knife Hand.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children find piles of bones, and their mother tells them that the former
    people were taken into the sky by a beautiful plume after the chief in heaven
    became displeased at their noisy play.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother warns the children not to play constantly in the open lest the
    Lord of Heaven waft them upward too.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The children ignore the warning, play noisily in the open, and the plume descends
    again from heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Little Feather takes hold of the plume and is lifted; Mucus, Little Grindstone,
    and Little Crabapple Tree each take hold in turn, with Little Grindstone becoming
    a large rock and Little Crabapple Tree becoming a rooted tree before being pulled
    upward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Knife Hand sharpens her hand, climbs over her brothers, cuts the air above
    the plume, and the brothers drop down like dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Knife Hand swings the plume over her brothers' bodies, and they come back
    to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The siblings assemble the bones of the dead, mixing heads, bodies, and legs
    from different persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'Naki waves the plume four times over the bones: the bones shake together,
    flesh and sinews appear, skin covers them, and the four winds restore breath so
    that a great multitude stands alive.'
  category: sequence
  evidence_refs:
  - ev:7
