canonical_text:
  quote: ''
  summary: A young prince leaves his father's house in anger and shame, carrying fat,
    tobacco, and coppers. His father and tribe search for him, but he reaches a point
    of land, where two men in a canoe take him to Chief Peace's village. In Chief
    Peace's house, Mouse Woman instructs him how to present his small possessions
    as gifts; the fat, tobacco, and copper miraculously become large offerings before
    Chief Peace, the chieftainess, and three uncles. Chief Peace gives his daughter
    to the prince in marriage. Later the prince becomes homesick, and his wife comforts
    him. A note describes Chief Peace's distant ocean island and earlier princes who
    failed to reach or return from it.
  language: English
  quote_policy: summarized
