canonical_text:
  quote: ''
  summary: A young princess tries to attract a beautiful prince, but he ignores her.
    Through her maid she asks him to visit; he refuses because she once rejected him
    and demands that she cut her cheeks and shave her hair before he will come. She
    obeys, but he mocks her. Ashamed, she and her maid journey to the house of Chief
    Pestilence to be made beautiful. Maimed people there injure both women and throw
    them outside. The maid helps the princess home, where the princess dies. The passage
    then presents an origin explanation for arranged-marriage rules, gift giving,
    ritual fighting between the parties, scar marks as marriage pledges, and placing
    the woman on an expensive garment.
  language: English
  quote_policy: summarized
