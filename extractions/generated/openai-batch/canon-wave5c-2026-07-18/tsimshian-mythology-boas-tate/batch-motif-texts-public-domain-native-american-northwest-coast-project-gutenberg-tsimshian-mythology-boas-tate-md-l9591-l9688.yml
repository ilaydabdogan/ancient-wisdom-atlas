canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a woman is shut out by
    her surviving husband and son, transforms into a hooting owl, and later causes
    the husband's death in the mountains. It then begins 'Local Winter in Git-q!a'°da','
    where a famine and snowstorm follow the sharing of a spring salmon and G'augun's
    complaint to Heaven; the tribe dies except for a newly married prince and his
    wife, whose child dies, and a blue jay brings elderberries that the wife interprets
    as a supernatural sign of summer.
  language: English
