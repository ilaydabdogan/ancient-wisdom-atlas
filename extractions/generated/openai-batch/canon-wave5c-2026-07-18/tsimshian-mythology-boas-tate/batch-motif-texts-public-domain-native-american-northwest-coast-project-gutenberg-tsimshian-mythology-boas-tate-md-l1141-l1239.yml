canonical_text:
  quote: ''
  summary: TxamsEm disguises himself with a deer skin to enter a large town by means
    of a canoe carrying young women and a princess. After being taken aboard as a
    stag, he wounds the princess and escapes. The chief gathers wise men and shamans,
    but they fail to cure her. TxamsEm then arrives pretending to be a shaman, aided
    by his Crow grandchildren, stages a hail-like sign with white stones, and cures
    the wound he caused. The grateful chief promises him a reward, and TxamsEm asks
    that the people move away and leave their provisions. The people leave their food
    behind; later TxamsEm finds that his Crow grandchildren have eaten many boxes
    of crabapples mixed with grease.
  language: English
  quote_policy: summarized
