candidate_motifs:
- id: motif:1
  label: liberated captive warns fellow captives before raid
  taxonomy_refs: []
  basis: The beaten slave Sa-g'iba'yuk, after being rescued, is instructed to warn
    the captives not to sleep because the village will be burned; he whispers the
    warning, and captives flee during the attack.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a local narrative pattern in the passage; no supplied motif-family
    identifier directly names it.
- id: motif:2
  label: enemy-village recovery of a princess-wife
  taxonomy_refs:
  - stolen_beloved
  basis: Wi-n!e'°x is located in the Haida village as the wife of a Haida chief's
    nephew, hears the warning, is ready to leave, and is found by her people after
    the attack.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: low
  cautions: The passage calls her a princess and places her in the enemy village,
    but it does not explicitly say she was stolen or that the episode is a romantic
    beloved-rescue.
- id: motif:3
  label: special weapon material reveals distant attackers
  taxonomy_refs:
  - wisdom
  basis: The g'am-wood arrows cannot be broken, and Wi-n!e'°x recognizes the wood
    as coming only from far up the Skeena River among mountain people, then advises
    the Haida to flee.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The recognition is practical knowledge in the passage; no supernatural
    wisdom is stated.
- id: motif:4
  label: chiefly valuables used for protection and transfer
  taxonomy_refs:
  - sacred_exchange
  basis: The young chief places four coppers around Wi-n!e'°x to defend her; she later
    tells her people to give them to her brother, and other coppers are given or broken
    during the return.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: low
  cautions: The coppers are clearly valuable and socially charged, but the passage
    does not explicitly call the exchange sacred.
- id: motif:5
  label: victory return with trophies, war-songs, and public challenge
  taxonomy_refs: []
  basis: The returning war party carries heads in canoes, puts heads on poles, sings
    war-songs, is challenged by another village, and responds in a copper-breaking
    exchange.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied motif-family identifier directly names this war-return pattern.
