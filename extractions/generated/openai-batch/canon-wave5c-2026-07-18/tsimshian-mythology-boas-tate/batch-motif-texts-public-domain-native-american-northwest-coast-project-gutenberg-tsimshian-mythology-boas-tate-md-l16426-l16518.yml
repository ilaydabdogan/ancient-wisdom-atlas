canonical_text:
  quote: ''
  summary: A G'i-spa-x-la'°ts war party reaches a sandbar, builds a fort, scouts a
    Haida village, kills a Haida master who is beating a slave, and uses the freed
    slave to warn captives before a night attack. The captives flee during battle.
    G'am-wood arrows and Qanas's strength are emphasized. Wi-n!e'°x identifies the
    arrow-wood as coming from far up the Skeena River; her Haida husband protects
    her with a dancing blanket and four coppers before fleeing. The attackers destroy
    and burn the village, take captives and trophies, distribute spoils, return by
    canoe through wind, sing war-songs, display heads on poles, and engage in copper-breaking
    gestures near another village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party reached the south side of a sandbar near a point, built a fort,
    kept the old men inside, and sent young warriors to search for the Haida village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lone warrior went ahead after the young warriors heard a stone-ax noise
    and later concealed himself near the Haida village.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The lone warrior saw a tall Haida man striking his slave until the slave was
    nearly dead, then shot the Haida man with an arrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wounded slave identified the dead man as his master and was told to warn
    the captives that the village would be burned before daybreak.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Wi-n!e'°x was said to be in the village, married to the nephew of the great
    chief Wl-ha'°; Hats!Eks-n!e'°x was said to be kept as a free boy by Chief Sdi'lda
    of the Eagle Clan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sa-g'iba'yuk whispered the warning to the captives, and Wi-n!e'°x heard it
    and was ready to leave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At midnight the G'i-spa-x-la'°ts warriors attacked, many Haida were killed,
    some Haida fought back, and the captives ran away to their own people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Warriors from the fort joined the fight with arrows made of g'am wood, described
    as unbreakable; Qanas is described as a strong warrior whose arrow passed through
    two men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wi-n!e'°x identified the arrow-wood as a tree growing only far up the Skeena
    River among mountain people who could run very fast, and she advised the Haida
    chief to tell his people to flee.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before escaping, the young chief put his dancing-blanket on Wi-n!e'°x and
    placed four coppers around her to defend her against enemy weapons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The attackers found Wi-n!e'°x sitting between four valuable coppers with two
    men-slaves beside her, and she told her people to take the coppers to her brother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The attackers destroyed property, made Haida women and children captive, captured
    the old chief Wi-suqans, took heads in their canoes, broke Haida canoes, burned
    the village, and distributed slaves, coppers, and elk skins.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During the return by canoe, the guide warned the canoes to stay close because
    of a strong wind; a southerly gale came, and the party later reached the Skeena
    River singing war-songs and putting heads on poles.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: As the returning party passed the G'id-wul-ga'dz village, the villagers challenged
    them about what village they had destroyed, and Chief Las broke a copper and threw
    it onto the beach.
  category: sequence
  evidence_refs:
  - ev:10
