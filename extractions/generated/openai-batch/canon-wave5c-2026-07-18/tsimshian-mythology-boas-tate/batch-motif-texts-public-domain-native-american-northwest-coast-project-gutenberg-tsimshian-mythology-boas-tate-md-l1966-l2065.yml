canonical_text:
  quote: ''
  summary: TxamsEm is involved in a hunting episode with Chief Wolf and the Wolves,
    secretly moves mountain-sheep carcasses, is accused, escapes by putting on a raven
    garment and reaching a floating log, and the passage gives etiological comments
    about Cape Fox and the Mouth of Nass River. In a later episode, after a long absence,
    TxamsEm returns in the raven garment, builds a carved house on an outer island,
    holds a potlatch for monsters, commands them to become rocks, and himself becomes
    a raven-shaped stone while the devilfish escapes to the sea bottom. In the following
    episode, Chief T!Em-nunx builds a famed carved house; people, chiefs, animals,
    and finally a giant come to see its carvings.
  language: English
  quote_policy: summarized
