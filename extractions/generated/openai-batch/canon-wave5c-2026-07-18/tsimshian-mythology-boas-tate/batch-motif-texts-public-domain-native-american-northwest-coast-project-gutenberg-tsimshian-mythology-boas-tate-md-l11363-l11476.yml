canonical_text:
  quote: ''
  summary: A young man follows his barking dogs up a slippery snowy mountain to a
    Bear's den, aided by a pressed snowball from his sister. He finds his sister,
    the princess, with the Black Bear, receives her two newborn children, kills the
    Bear by smoke rather than weapons at her instruction, and follows ritual instructions
    for the Bear's body. The sister, children, and brother return home, where the
    children are named and later identify hill-clouds as the smoke of their Bear grandfather.
    After being insulted by their grandmother, the children decide to leave for their
    father's Bear people.
  language: English
  quote_policy: summarized
