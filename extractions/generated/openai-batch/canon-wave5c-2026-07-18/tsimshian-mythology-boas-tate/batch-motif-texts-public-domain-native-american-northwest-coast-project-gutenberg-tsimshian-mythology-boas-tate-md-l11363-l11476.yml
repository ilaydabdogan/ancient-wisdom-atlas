- id: obs:1
  text: The young man hears his two dogs barking above him and attempts to climb a
    slippery snowy mountain using snowshoes, mountain-goat horn points, and a staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the young man cannot climb farther, his sister rolls down a pressed snowball
    bearing four finger impressions; after seeing it, he tries again and reaches the
    dogs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the opening of a den, the princess recognizes the dogs Red and Spots, and
    the dogs also know her while barking at the Black Bear seated with her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The princess tells her brother to wait until she gives birth, then gives him
    two children to place inside his hunter's garment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The princess tells her brother not to kill his brother-in-law with knife,
    spear, or arrow, but to make a smudge in front of the den.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The young man makes a fire at the den mouth; smoke fills the den, the Bear
    groans, the groans cease, and the young man concludes the Bear is dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bear had instructed the princess to sing songs at his death and cutting,
    to sing another song when his heart was roasted, to dry his skin by a fire, to
    mark the dried skin with red ocher, and to add fuel if the skin made a creaking
    noise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After cutting up the Bear, the young man rolls the body down the mountain,
    and he, his sister, and the two cubs slide down the snow and return home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At home, the people assemble joyfully, the princess's father gives a feast,
    and he names his grandchildren.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two children grow into boys and, when they see small clouds rising in
    the hills, call them the smoke of their Bear grandfather; hunters then go and
    kill bears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After one child knocks over his grandmother, she revives and calls the children
    little slaves of unknown origin; the children and their mother are ashamed and
    weep.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The children ask their mother to leave the village because they want to go
    to their father's people; their mother tells them to stay with the Bear people,
    bring her food, and give animals to their younger uncle.
  category: speech
  evidence_refs:
  - ev:8
