canonical_text:
  quote: ''
  summary: 'The passage ends a White Bear episode in which a hunter is returned, kills
    and eats people, is overpowered and cured, then teaches dances he saw in a mountain.
    It then gives an origin account for the Wolf Clan: after a Tahltan war and the
    killing of two chiefs, related Wolf Clan brothers flee in separate groups, pass
    through dangerous terrain, are received by Stikine and Nass chiefs, and their
    name Gus-xg''ain is taken in feasts. Later wars disperse some to Tongass and the
    Tsimshian. The passage also begins a supplemental war tale about two warrior tribes,
    chiefly marriages to princesses, named wives and children, succession, and chiefly
    wealth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The White Bear returns the hunter to his home and places him on the top of
    a tree, where people see him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter slides down the tree on his back, attacks people, tears some to
    pieces, devours them, and kills many people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tribe overpowers the hunter and cures him by means of medicine; afterward
    he recovers his senses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After recovery, the hunter teaches dances of four companies that he had seen
    in the mountain, and the people thereafter have the Cannibal dance and the Dog
    Eaters' dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Wolf Clan is said to have originated in Alaska; after a Tahltan war in
    which Gus-xg'ain and Lagunus are killed, their nephews and six Wolf Clan brothers
    flee from enemies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The fleeing brothers split: two cross the mountains to Nass River, while
    four go down Stikine River by canoe.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The four brothers encounter a glacier obstructing the valley and enter an
    ice cave where the river runs under the ice, expecting to be drowned, but pass
    through safely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the river mouth, the four brothers see village smoke, wait for night out
    of fear, and are noticed by watchmen; warriors come in canoes, but the brothers
    speak kindly and are invited into the chief's house.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: When the four brothers explain that they are fleeing enemies and belong to
    the Wolf Clan, naming their uncles, the Stikine chief gives a feast and takes
    the name Gus-xg'ain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Later wars among the Stikine people cause some Tahltan brothers to flee to
    Tongass, and later one flees to the Tsimshian, explaining why there are not many
    Wolf Clan people among the Tsimshian.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two brothers who cross the mountains to Nass River are taken into the
    Nass chief's house, state that their uncles were slain and that they belong to
    the Wolf Clan, and are claimed as relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Nass chief makes a great feast, takes the name Gus-xg'ain, and takes the
    two young men as nephews.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The supplemental war tale opens by naming two tribes, the Gi-spa-x-la'ots
