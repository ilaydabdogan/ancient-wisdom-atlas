candidate_motifs:
- id: motif:1
  label: Cured cannibal returns with ritual dance knowledge
  taxonomy_refs:
  - initiation
  basis: The hunter attacks and eats people, is overpowered and cured by medicine,
    then teaches dances he saw in the mountain, leading to named dances among the
    people.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is the end of a preceding story; the full context of the hunter's
    mountain experience is not included in this excerpt.
- id: motif:2
  label: Mountain vision as source of dances
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: The hunter teaches dances of four companies that he had seen in the mountain.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The excerpt does not describe how the hunter entered the mountain or encountered
    the four companies.
- id: motif:3
  label: Clan origin through flight after war
  taxonomy_refs:
  - departure
  basis: The Wolf Clan origin story attributes clan movement and settlement to a Tahltan
    war, the killing of chiefs, and the flight of related brothers to Stikine, Nass,
    Tongass, and Tsimshian areas.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage explains distribution and affiliation but does not give a
    creation origin for the clan name itself.
- id: motif:4
  label: Perilous passage through under-ice cave
  taxonomy_refs:
  - initiation
  basis: Four brothers enter an ice cave under a glacier where a river runs beneath
    the ice, expecting drowning, yet pass through safely.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage presents the event as a dangerous travel episode; reading
    it as initiation is a motif-level inference requiring review.
- id: motif:5
  label: Name-taking feast creates chiefly affiliation
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: Both the Stikine and Nass chiefs give great feasts and take the name Gus-xg'ain
    after receiving Wolf Clan fugitives and hearing their kinship identity.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The social and ritual mechanics of name transfer are not explained beyond
    the feasts and name-taking.
- id: motif:6
  label: Fleeing sibling pair received as nephews
  taxonomy_refs:
  - sibling_pair
  - survivor_pair
  basis: Two brothers flee across the mountains to Nass River, are received by the
    Nass chief, claimed as relatives, and taken as nephews.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage also describes larger brother groups, so the paired-brother
    motif applies only to the Nass River subgroup.
- id: motif:7
  label: Princess marriage alliance and chiefly succession
  taxonomy_refs:
  - royal_legitimacy
  basis: The war tale describes a custom of a great chief taking princesses from tribes
    as wives; Dzeba'sa's named wives and children are listed, and the eldest son of
    the first wife succeeds his grandfather and is honored.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only the opening of the tale is present in this passage; later consequences
    of the marriage and succession are not included.
