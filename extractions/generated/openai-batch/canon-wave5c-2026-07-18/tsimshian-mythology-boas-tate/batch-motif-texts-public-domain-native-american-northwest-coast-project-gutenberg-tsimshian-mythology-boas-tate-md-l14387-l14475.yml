canonical_text:
  quote: ''
  summary: A princess escapes from an old shaman by cutting the line of his canoe
    and pushing away from the rock where he has stranded her. She refuses his pleas,
    accuses him of killing other princesses, shouts four times as he had done, and
    birds descend and devour him. She returns alive to her father's town, tells her
    parents and assembled chiefs how the shaman transformed himself into a handsome
    young man to deceive her, brought her to his island home, stranded her on a rock
    to be eaten by birds, and had killed other lost daughters whose bones she found
    there.
  language: English
  quote_policy: summarized
