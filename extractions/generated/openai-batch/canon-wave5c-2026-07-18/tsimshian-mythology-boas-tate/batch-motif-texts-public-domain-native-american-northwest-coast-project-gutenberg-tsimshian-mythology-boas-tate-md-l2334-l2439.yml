canonical_text:
  quote: ''
  summary: In an animal council, Porcupine argues against the large animals' wish
    for the severest winter cold, explaining that excessive cold would destroy plants
    and starve many animals. After initially rejecting him, the large animals accept
    his wisdom, make him first among the small animals, and agree on the present seasonal
    order of winter and summer. Porcupine also explains winter denning, loses his
    thumb, and later kills animals that slighted him with his quills. A new story
    begins about a wealthy porcupine-hunter who overhunts porcupines, follows a large
    brown porcupine near a spruce tree, and enters a large house with a fire, a chief,
    women, dancing, and a song.
  language: English
  quote_policy: summarized
