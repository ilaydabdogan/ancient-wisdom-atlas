  text: The small animals are asked to speak in the council; Porcupine rises as their
    speaker after a silence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Porcupine says the large animals have warm fur, but small insects lack fur
    and would struggle for provisions under the greatest cold.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Grizzly Bear says the large animals will not heed Porcupine and asks the large
    animals to confirm their agreement on the severest cold.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Porcupine warns that very severe cold would freeze or wither berry roots and
    prairie plants and leave the large animals without food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Porcupine says his own group can live on bark, gum from trees, and food found
    in the earth.
  category: speech
  evidence_refs:
