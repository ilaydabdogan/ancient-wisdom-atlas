  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Porcupine says animals large and small, including creeping animals, will go
    into dens and hide for six months.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage explains that wild animals take to dens in winter, while Porcupine
