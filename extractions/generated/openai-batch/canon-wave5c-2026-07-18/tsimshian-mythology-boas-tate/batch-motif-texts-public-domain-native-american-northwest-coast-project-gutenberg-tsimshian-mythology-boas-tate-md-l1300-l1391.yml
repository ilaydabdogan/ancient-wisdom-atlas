canonical_text:
  quote: ''
  summary: TxamsEm, hungry and seeking food, comes to the house of Chief Echo, where
    unseen voices welcome him and self-moving objects serve food. His thoughts about
    stealing hanging fat are announced by laughing women; when he snatches meat and
    fat, a stone hammer injures him and he is cast out. He later enters the house
    of Little Pitch and his wife, who feed him and heal his ankle with pitch. Despite
    their kindness, TxamsEm plans to kill Little Pitch, keeps him fishing after sunrise
    though sunlight is dangerous to him, and finds that Little Pitch has melted into
    pitch over the halibut. The passage closes by explaining that this is why halibut
    is black on one side.
  language: English
  quote_policy: summarized
