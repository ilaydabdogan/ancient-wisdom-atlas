canonical_text:
  quote: ''
  summary: The passage describes the village of G'itslEmga'lon, its three-row layout
    by a river and near a large lake, and the social position of a chief and chieftainess.
    The chief's daughter Part Summer joins women picking berries. After she slips
    on black bear dung and speaks angrily about it, her basket strap repeatedly breaks,
    scattering her berries. She refuses to abandon them, is left alone, and two young
    men carry her basket to an unknown village. In a large house, Mouse Woman tells
    her that Black Bear brought her there because of her anger and warns her not to
    eat the first foods offered, which are identified as human remains. Part Summer
    refuses the first salmon and first berries with crabapples and eats the subsequent
    real foods.
  language: English
  quote_policy: summarized
