canonical_text:
  quote: ''
  summary: The passage first concludes a narrative in which a hunter with a wooden
    wife discovers two young women hidden in his camp, feeds them, marries the younger
    sister after promising to destroy the wooden wife and keep certain events secret,
    and later prospers and becomes a head chief. It then begins “Plucking Out Eyes,”
    introducing a lakeside town, a kind chief’s son who refuses an arranged marriage,
    his close male friend, and the prince’s encounter and secret marriage with a beautiful
    girl who requires exclusive marriage, secrecy, and a fourfold summons; the friend
    notices the prince returning before dawn cold and wet.
  language: English
  quote_policy: summarized
