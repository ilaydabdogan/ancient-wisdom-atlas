canonical_text:
  quote: ''
  summary: A young princess discovers that her nightly visitor changes into a mouse
    and exits through a knot-hole. When she is pregnant and does not name him, her
    father has a gum-calked box made, fills it with wealth, places her inside, and
    casts it into the river. The box drifts to the sea and reaches a sandbar on Queen
    Charlotte Islands, where a mourning chiefly couple finds it. When opened, many
    mice run out and the young woman is found alive; the couple treats her as their
    dead daughter returned and gives her the dead daughter's name. The narrator says
    the mice were her children by the mouse-lover. She later marries her cousin, has
    children, and after a grandmother insults the children's unknown origin, she reveals
    her distant noble family at the head of a great river and asks her eldest son
    to return there with his siblings.
  language: English
  quote_policy: summarized
