canonical_text:
  quote: ''
  summary: 'The passage closes a story in which a man encounters TxamsEm as a giant
    in a deep valley, receives food, animal-provided meat, a staff, and instructions
    for returning home without looking back during terrifying noises. He returns to
    his village with the staff, which is kept as evidence that TxamsEm is still alive
    and hidden in the mountains. The next story begins with hunted animals holding
    a council: Grizzly Bear proposes asking their maker for colder winters to protect
    them from hunters, Wolf urges inclusion of small animals and insects, and a broad
    animal assembly agrees.'
  language: English
  quote_policy: summarized
