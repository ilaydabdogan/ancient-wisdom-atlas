canonical_text:
  quote: ''
  summary: The prince and his slave accumulate whales and stored provisions after
    eagles bring a whale ashore. The prince borrows a gull's skin, flies to Nass River
    with a piece of seal meat, drops it to a slave-woman, and thereby causes his father’s
    household to learn that he is alive and rich in food; he then excludes the relatives
    who mocked or deserted him, favors his youngest uncle, and directs that tribes
    buy his provisions.
  language: English
  quote_policy: summarized
