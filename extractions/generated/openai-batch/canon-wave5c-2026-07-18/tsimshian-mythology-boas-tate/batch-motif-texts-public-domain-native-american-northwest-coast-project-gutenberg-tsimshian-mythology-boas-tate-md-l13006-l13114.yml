canonical_text:
  quote: ''
  summary: Asagulyaan repeatedly fights attacking tribes by emerging from his house
    through the smoke hole, descending a ladder, leaping over a rock, and releasing
    a living arrow that kills many people. Wiludal warns his relatives not to fight
    him, but they ignore him and are killed. Guided by his grandson, Wiludal shoots
    Asagulyaan through the eye and kills him. Asagulyaan's sister then puts on his
    paraphernalia and tries to continue the fight, but the crowd recognizes her as
    a woman and attacks. The passage ends with the tribe scattered, the live arrow
    flying away toward the sunset, Wiludal honored, and the story attributed to the
    Wolf Clan.
  language: English
  quote_policy: summarized
