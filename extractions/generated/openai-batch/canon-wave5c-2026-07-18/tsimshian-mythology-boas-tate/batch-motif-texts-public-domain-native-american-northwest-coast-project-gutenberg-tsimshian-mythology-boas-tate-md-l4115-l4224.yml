  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:14
  text: Before daybreak the strangers secretly leave the village, climb back up the
    mountain, and are pursued by a multitude from the village.
  category: sequence
  evidence_refs:
  - ev:12
