canonical_text:
  quote: ''
  summary: 'The passage closes a beaver-origin tale in which a transformed woman can
    no longer speak or return with her brothers; after they break her dam, beavers
    scatter and she dies on dry ground. The passage then begins a tale of winter hunters:
    ten brothers and their wives enter a mountain village of strange beings, where
    an old woman kills a baby by putting her mouth to its ear; the visitors avoid
    sleep, escape before dawn, and are pursued.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The transformed sister cannot speak, dives away from her brothers, has a leather
    apron changed into a beaver tail, and has a body covered with dark-brown fur.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers return the following spring and find a large lake full of beavers;
    a large Beaver approaches with a green cottonwood tree in her mouth, and her face
    is not yet covered with hair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the eldest brother asks the Beaver to come home, she cannot speak and
    dives, apparently indicating that she cannot go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers decide to break the dam of the lake their sister built; water
    bursts out, and many beavers escape and scatter over the land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers find their sister at the bottom of the emptied lake; her body
    is furred, her face remains the same, her nails are like claws, her apron is a
    beaver tail, and she dies on dry ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrative states that beavers are said to be female because the woman
    was their ancestor, and brown because her hair was brown.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ten brothers and their wives go hunting in winter, travel through mountains,
    valleys, and rivers, and see smoke at the foot of a mountain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The travelers slide down on snowshoes to a village, where local families invite
    the strangers into their houses; the chief hosts the youngest brother, his young
    wife, and their child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A middle-aged or old woman takes the crying child, puts her mouth to the baby's
    ear, sings into the ear, and the child stops crying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mother finds the child dead, wrapped in a marten blanket, with blood oozing
    from the ear where the old woman had put her mouth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The young mother tells her husband that the village inhabitants are not real
    people but strange beings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The youngest brother warns his brothers not to sleep and proposes escaping
    while the villagers are asleep.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The chief and then other hosts creep toward the guests at night, but the guests
