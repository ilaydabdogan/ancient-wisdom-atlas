canonical_text:
  quote: ''
  summary: A returning war party led by Chief LEg'e'°x concludes a chiefly prestige
    contest at Las's village through copper breaking and mocking songs, receives invitations
    and gifts from several villages, stops at a nephew's house, returns home as the
    captive Wi-suqans dies and is buried through clan obligation, and then the narrative
    turns to Sdi'kla returning Prince Hats!Eks-n!e'°x by canoe. At Katsan, Sdi'kla
    asks the prince to protect him from having his head given to another clan, while
    LEg'e'°x's household practices a song to remove captivity's stain from his sister
    before Haida-speaking canoes arrive.
  language: English
  quote_policy: summarized
