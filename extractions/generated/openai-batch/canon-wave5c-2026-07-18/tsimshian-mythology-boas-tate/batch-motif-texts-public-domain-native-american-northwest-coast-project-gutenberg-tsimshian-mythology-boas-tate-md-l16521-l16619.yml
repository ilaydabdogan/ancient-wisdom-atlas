  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:7
  text: At Gul-qa'q's house, after a welcome dance, two men lift a copper, call it
    feathers, and lay it down before LEg'e'°x.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The warriors receive their first good meal since leaving home and drink as
    much water as they can after a period of restricted food and water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The captive chief Wi-suqans travels with Chief LEg'e'°x, is placed on one
    side of Gul-qa'q's house, and is present when people eat from one dish.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the home arrival, Wi-suqans dies of battle wounds, and KsEm-g'a'mk pays
    those who bury him because he belongs to her clan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sdi'kla travels by canoe with nephews, gives a large canoe and ten male slaves
    to Prince Hats!Eks-n!e'°x, and the two canoes come across the sea from Queen Charlotte
    Islands.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the foot of high mountain Katsan, Sdi'kla repeatedly asks Prince Hats!Eks-n!e'°x
    not to let the prince's uncle cut off Sdi'kla's head and give it to another clan;
    the prince promises not to allow it.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: In LEg'e'°x's house, men and women practice a new song because LEg'e'°x plans
    to invite tribes and chiefs to remove the stain of captivity from his sister.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The singing is interrupted by a report that two large canoes full of Haida-speaking
    people are outside; Wi-n!e'°x tells LEg'e'°x that Sdi'kla has come to bring her
    son.
  category: sequence
  evidence_refs:
  - ev:13
