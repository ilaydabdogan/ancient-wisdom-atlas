- id: obs:1
  text: People ashore and warriors in canoes exchange shouts while chiefs break and
    throw down coppers and other objects near the beach or water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Las's side produces a canoe stern-board, and the speaker says he will buy
    the copper next summer for the Haida.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the great chief breaks another copper, the village becomes silent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nes-dzakagul's canoe and the war-canoes paddle away while singing mocking
    songs addressed to Las and to chiefs unable to throw away coppers like the high
    chief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Along the return route, drums or ch'ums are heard at several villages, and
    men come to the shore to invite Chief LEg'e'°x to chiefs' houses.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
- id: obs:6
  text: Chief LEg'e'°x thanks inviting chiefs, promises later visits, and gives presents,
