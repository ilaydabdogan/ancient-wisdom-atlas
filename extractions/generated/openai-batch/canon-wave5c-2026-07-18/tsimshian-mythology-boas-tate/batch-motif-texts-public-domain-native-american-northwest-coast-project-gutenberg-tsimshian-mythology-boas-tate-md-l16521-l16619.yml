- id: motif:1
  label: Competitive destruction and display of chiefly coppers
  taxonomy_refs:
  - sacred_exchange
  basis: The passage centers on chiefs breaking or throwing down coppers, an opponent
    substituting a stern-board, and subsequent mocking songs about inability to throw
    away coppers like the high chief.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents prestige exchange and rivalry, but it does not explicitly
    call the exchange sacred.
- id: motif:2
  label: Return from war marked by hospitality, invitations, gifts, songs, and dance
  taxonomy_refs:
  - return
  - sacred_exchange
  basis: On the return journey, LEg'e'°x is repeatedly invited by chiefs, thanks them,
    promises later visits, gives gifts, receives a welcome dance and meal, and returns
    home with war-songs.
  evidence_refs:
