canonical_text:
  quote: ''
  summary: A princess warns a young man to return because her looking back will cause
    him to perish. He refuses, she looks back, and he sinks into the ocean and dies.
    Her father, Chief Peace, retrieves the body parts with a net-pole from a hole,
    reassembles them, leaps over the body four times, and the prince rises. A following
    tale begins with a chieftainess and her husband's nephew as secret lovers; she
    pretends to die, is placed in a tree coffin with valuables and tools, makes spoon
    scrapings look like grubs, and secretly receives the nephew in the coffin at night,
    where another couple witness them.
  language: English
  quote_policy: summarized
