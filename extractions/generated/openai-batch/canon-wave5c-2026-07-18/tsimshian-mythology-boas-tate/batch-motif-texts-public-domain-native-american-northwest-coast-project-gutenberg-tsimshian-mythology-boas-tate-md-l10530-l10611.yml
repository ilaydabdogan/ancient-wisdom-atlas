canonical_text:
  quote: ''
  summary: A young princess is left alone in a canoe while other young women pick
    strawberries. A southwest gale drives her far out to sea, where she sees a great
    eagle-like object with ten little eagles. She lands near Metlakahtla, is taken
    in and married by a G'idwul-g'a'dz chief, bears children, and later her sons gain
    names, wealth, crests, and feast honors. After telling her children about her
    original people, her burned village, and her displacement, she sends two children
    by canoe toward her grandfather's village, giving detailed directions across the
    sea.
  language: English
  quote_policy: summarized
