candidate_motifs:
- id: motif:1
  label: blood feud through assassination and revenge
  taxonomy_refs: []
  basis: The passage links attempted killing, execution, war, mockery, ambush, beheading,
    and renewed battle between the associated chiefly groups.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:11
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: This is a passage-level pattern label, not a supplied taxonomy family.
- id: motif:2
  label: chiefly succession through inherited name
  taxonomy_refs:
  - royal_legitimacy
  basis: Several offices or statuses pass by succession, and Xbi-ye'lk takes the name
    Nes-balas while Nes-balas's sister takes her mother's name at a public feast.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage reports succession and name-taking but does not explicitly
    theorize legitimacy beyond the actions described.
- id: motif:3
  label: feast as diplomacy and delayed violence
  taxonomy_refs: []
  basis: Feasts announce name-taking, gather chiefs, invite rivals, and also cause
    Nes-balas's advisers to postpone killing Txa-dzr°kik until after the feast.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage does not identify the feast as sacred exchange; the motif
    is limited to its narrative function here.
- id: motif:4
  label: song of weather after storm as promise of peace
  taxonomy_refs: []
  basis: The dancer's song states that good weather follows frost, rains, and storms;
    the passage explains this as meaning fighting between brothers would stop.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:18
  confidence: high
  cautions: The weather image is explicitly interpreted in the passage, but broader
    symbolic significance should not be assumed.
- id: motif:5
  label: mockery provoking fatal retaliation
  taxonomy_refs: []
  basis: Txa-dzi'°kik and his people mock Nes-balas and call him a coward chief before
    Nes-balas's warriors arrange the ambush in which Txa-dzi'°kik is killed.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage narratively connects insult and retaliation but does not state
    a general rule about insult.
- id: motif:6
  label: enemy head kept in rival chief's house
  taxonomy_refs: []
  basis: Heads of enemies are brought into Nes-balas's house or hung in the smoke
    hole; later Txa-dzi'°kik's people attack because their master's head is in Nes-balas's
    house.
  evidence_refs:
  - ev:2
  - ev:17
  - ev:18
  confidence: high
  cautions: No ritual meaning is specified in the passage.
- id: motif:7
  label: bereaved mother dies after loss of all sons
  taxonomy_refs: []
  basis: The old mother mourns that three sons have been slain and her last son's
    head is in Nes-balas's house, then dies of a broken heart.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: This is a narrative motif description, not tied to an available taxonomy
    ref.
- id: motif:8
  label: conflict between brothers or brother-linked groups
  taxonomy_refs:
