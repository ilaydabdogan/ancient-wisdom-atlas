canonical_text:
  quote: ''
  summary: A cycle of chiefly rivalry, attempted assassination, retaliatory killing,
    succession, feast diplomacy, mockery, ambush, battle, trophy-taking, and maternal
    grief among named Tsimshian chiefs and tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters catch a young chief and companions who were waiting near the ladder
    of Nes-balas's house with intent to kill him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nes-balas orders the captured men killed; their heads are brought in, their
    bodies put on poles, and their heads hung in the smoke hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the killing, war breaks out between the groups, and three brothers named
    Gagayam n !e'°x, Gaina', and Gauga'"! are killed; only one boy, 'Wi-gwina'°t,
    remains alive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Chiefly succession and name-taking occur after deaths: Dzeba''sa''s nephew
    succeeds him, Nes-balas''s sister takes her mother''s name, and the youngest brother
    of the slain princes succeeds Txa-dzl''°kik.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nes-balas holds a feast and announces that his sister will take her mother's
    name.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nes-balas's sister sings a new song whose words describe good weather following
    hard frost, heavy rains, and storms.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage explains the song as meaning that there would be no more fighting
    between the brothers, and the mother of the slain brothers takes comfort because
    she believes her last son will not be killed.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: A young chief named Txa-dzi'°kik still intends to kill Nes-balas, but does
    not because Nes-balas has many friends guarding him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Nes-balas becomes sick and dies; the Tsimshian tribes lament, while Txa-dzl'°kik's
    tribe rejoices and mocks him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Xbi-ye'lk, the younger brother of Nes-balas, succeeds him, takes the name
    Nes-balas, and gives a feast for chiefs of every tribe.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Wise men of the new Nes-balas consider killing Txa-dzr°kik during the feast,
    but decide to wait until after the feast to avoid uproar.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Txa-dzi'°kik mocks the new chief when the new Nes-balas comes to a feast.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Near Ghost Island, Txa-dzi'°kik's men call Nes-balas a coward chief, and Nes-balas's
    men do not answer.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Nes-balas's warriors take six canoes at night to lie in wait near Ghost Island.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: When Txa-dzi'°kik's canoe passes by at nearly midnight under moonlight, with
    singers repeating words including coward chief, one of Nes-balas's warriors shoots
    Txa-dzi'°kik through the temple.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Txa-dzi'°kik falls into the water; Nes-balas's men pursue the canoe, cut off
    his head, and hang his body on a tree.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Txa-dzi'°kik's tribe comes in many canoes to make war because their master's
    head is in Nes-balas's house; they are defeated with great slaughter.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: Txa-dzl'°kik's mother weeps, recalls the song about good weather following
    storm-clouds, and dies of a broken heart after the deaths of her sons and the
    display of her last son's head.
  category: sequence
  evidence_refs:
  - ev:18
