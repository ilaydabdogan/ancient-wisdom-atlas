canonical_text:
  quote: ''
  summary: Only One, a powerful shaman, transports a spring, cures a sick shaman by
    removing a supernatural cause from a corpse bone, survives a cannibal feast trap
    by expelling corpse meat and feeding it back to the deceivers, and later journeys
    by canoe to Chief Bagus after being warned to protect himself with urine from
    his chamber-vessel against dangerous animal messengers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man is described as ashamed and dying on the spot, after which a shaman
    returns home by canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only One says he will take a spring of water to his own house; he carries
    it in his grizzly-bear garment, the original spring dries up, and he places the
    new spring before reaching town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men from G'it-qxa'la summon Only One to a sick shaman and try unsuccessfully
    to kill him because his supernatural power has foretold their plan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Only One sees that the sick shaman is very thin and determines that one of
    the sick man's supernatural powers has been placed in the bone of a corpse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Only One removes the cause from the corpse bone; the sick man's supernatural
    power recovers, the sick shaman revives, and Only One is paid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A cannibal dancer invites Only One and his attendants to eat seal, while three
    cannibals tend a cooking box that contains meat of dead people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hosts intend that eating the dead people's flesh will kill Only One and
    make his supernatural power leave him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Only One's supernatural power warns him about the corpse flesh and tells him
    to eat it, remove it from his left side, and give a piece to each of the men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Three men present pieces of meat on long pointed staffs; Only One swallows
    the pieces, opens his left side, extracts the corpse meat, and gives the pieces
    back to the three men, who die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Only One's fame spreads over the villages, and he continues wandering and
    doing his work for many years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A supernatural power foretells that three messengers will come from Chief
    Bagus, whose son has been sick for a long time and cannot be cured by other shamans.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Only One is instructed not to leave his chamber-vessel behind and to blow
    urine into the air above his head whenever he feels nearly unconscious.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: At midnight the messengers arrive; Only One boards a new canoe wearing a grizzly-bear-claw
    crown and apron, holding a live rattle in one hand and a root-basket chamber-vessel
    in the other.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The messengers tell Only One to lie down, but he refuses because his supernatural
    power has told him to keep awake lest he die, since the messengers are dangerous
    animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: During the canoe journey Only One feels he is losing consciousness, blows
    urine into the air, and becomes strong again; the messengers cannot endure the
    smell and fear him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Only One arrives at Chief Bagus's house, where Bagus's sick prince lies with
    an old shaman seated by his feet holding a rattle.
  category: setting
  evidence_refs:
  - ev:10
