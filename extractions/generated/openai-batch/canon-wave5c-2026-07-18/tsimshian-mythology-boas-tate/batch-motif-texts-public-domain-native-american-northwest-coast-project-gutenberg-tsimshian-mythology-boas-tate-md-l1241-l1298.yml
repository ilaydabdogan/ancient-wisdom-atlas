canonical_text:
  quote: ''
  summary: TxamsEm is hosted by a widow and her daughter, marries the daughter, and
    promises to build a canoe for his mother-in-law. While he consumes the household
    provisions, he makes sounds as if working. The wife secretly observes him beating
    an old rotten cedar tree with a stone ax to imitate work. The widow and daughter
    leave with the remaining provisions, and TxamsEm returns to find the hut empty
    except for boxes and a small fire, becoming hungry again.
  language: English
