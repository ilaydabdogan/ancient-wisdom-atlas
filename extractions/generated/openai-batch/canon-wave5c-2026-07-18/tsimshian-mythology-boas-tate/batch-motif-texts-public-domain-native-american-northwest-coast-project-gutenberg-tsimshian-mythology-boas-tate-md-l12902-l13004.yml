- id: motif:2
  label: Father-son chiefly rivalry ending in parricide
  taxonomy_refs:
  - royal_legitimacy
  basis: The father is the reigning head chief and repeatedly intends to kill his
    son after the son's public claim; Asagulyaan then sends the live arrow to kill
    his father.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage supports kin rivalry and succession conflict, but does not
    by itself establish the broader narrative outcome beyond this episode.
