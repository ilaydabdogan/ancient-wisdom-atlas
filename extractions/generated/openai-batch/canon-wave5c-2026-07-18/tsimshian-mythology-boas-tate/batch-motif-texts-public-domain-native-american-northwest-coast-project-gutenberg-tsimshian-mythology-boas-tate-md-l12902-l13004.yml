canonical_text:
  quote: ''
  summary: Asagulyaan, a young prince, publicly claims his grandfather's greatness,
    gives names and gifts, and provokes his father, the reigning head chief. After
    the father plots to kill him, Asagulyaan secretly sends a living arrow to kill
    his father. The arrow is later seen as reptile-like, named guldana, and returns
    to its master. The dead chief's people mourn and distribute goods; Asagulyaan
    rejects a small elk-skin gift and is accused by the successor. The next morning
    he emerges in chiefly regalia and sends the living arrow through the assembled
    people, leaving the beach full of dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief tries to entrap his own son with the intention of killing him, while
    the son knows his father's thoughts because a supernatural being tells him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young prince invites people from all the tribes to his house and announces
    that he is taking his grandfather's greatness and will be the greatest head chief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young prince says he will make his sister great among the chieftainesses,
    gives her the name Ya°l, and says his old mother will keep her own name, Bidah.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young prince distributes costly gifts to his guests, including coppers,
    slaves, canoes, elk skins, boxes of grease, boxes of dried berries, horn spoons,
    raccoon skins, and other goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father becomes angrier after the feast and says he will kill his son;
    the passage states that the father was then the head chief among the Tsimshian.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At midwinter, Asagulyaan secretly goes at night to his father's village with
    his live arrow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the smoke hole of his father's house, Asagulyaan commands the live arrow
    to go through the heart of the chief who killed his relatives and return the next
    day; the arrow enters the chief's heart and the chief dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead chief is discovered with the end of an arrow over his heart; when
    examined, the arrow has a head like a reptile, twinkling eyes, and teeth like
    dogs' teeth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: After being examined, the arrow flies from the people's hands through the
    smoke hole and says “Guldana,” after which the people call the living arrow guldana.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dead chief's people visit every village to ask who shot the chief, and
    the villages answer that they had nothing against him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dead chief's tribe singes their hair with fire and blackens their faces
    with charcoal, described as the custom when a great chief dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before the burial, all chiefs of the tribes are invited, arrive by canoe,
    and receive goods from the dead chief's nephew, who has succeeded to his uncle's
    place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a small elk skin is lifted for Asagulyaan under the name “Son of Bidal,”
    he throws the elk skin into the water and paddles away with his companions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The dead chief's nephew tells his people that the slave had killed his own
    father.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: On the following morning, a multitude gathers on the beach before Asagulyaan's
    house; the setting includes a large rock on the sandy beach and ladders reaching
    the roof from outside and inside the house.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: Before going out to fight, people in Asagulyaan's house shout, eagle down
    flies upward through the smoke hole, and Asagulyaan comes out through the smoke
    hole wearing chiefly and dancing regalia while holding a bow and rattle.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Asagulyaan runs down the ladder, jumps over the rock, releases the live arrow,
    and the arrow passes through the hearts of the people, returns when weary, is
    wiped and placed in a box, and has its stomach filled with men's blood.
  category: action
  evidence_refs:
  - ev:11
