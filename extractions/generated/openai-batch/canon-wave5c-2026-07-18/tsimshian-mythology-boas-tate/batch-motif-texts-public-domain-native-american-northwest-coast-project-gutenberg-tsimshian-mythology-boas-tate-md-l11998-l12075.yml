canonical_text:
  quote: ''
  summary: A chief holds feasts displaying grizzly-bear gifts, including regalia,
    songs, carved dishes, crests, a name, and later a mountain-pole. He restricts
    these ritual privileges to his clan, transfers property and powers to his nephew
    at a final feast, sings a mourning-song, dies, and is mourned. An explicitly marked
    alternate version begins with Chief Dzeba'sa and Prince Black Bear in a famine
    setting on the upper Skeena River, where a poor stranger visits chiefs and is
    given snow in a wooden dish after saying he ate snow on the way.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief made a feast, invited different tribes, wore a grizzly-bear hat
    and red leggings, carried a smew bow, and sang two mourning-songs received from
    grizzly bears as a reward for kindness to Chief Bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's wife showed guests two carved dishes that she had also received
    from the grizzly bears in return for kindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The guests were delighted by the new crests and songs, and the chief declared
    that only his clan after him should use the crests and mourning-songs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief took the new chief's name Nes-nawa, which the grizzly bear had given
    him as a reward for kindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief's three brothers were jealous of him, while people of all tribes
    loved and honored him and his own tribe was proud of him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the chief was old and at his hunting-ground, he invited a visiting man
    to eat; during the meal the man offered him a mountain-pole and referred to earlier
    gifts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old chief recognized the visiting man, and a song was associated with
    the mountain-pole; a small live man was seated at one end of the pole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: At his last feast, the old chief displayed the pole as a new crest, sang the
    pole song, gave away his property, and announced that he would leave property,
    crests, mourning-songs, power, honor, hunting-ground, and house to his only nephew.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After blessing his nephew, the chief took a wooden drum, sang his mourning-song
    with his relatives, lay down at the end of the song, and died; guests mourned
    him for two days and nights, and his nephew succeeded him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The alternate version begins with Chief Dzeba'sa using Prince Black Bear in
    a winter dance, then describes a famine in Prairie Town on the upper Skeena River,
    where six chiefs had houses and many tribespeople died of starvation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: In winter, while the river was icy and snow covered the ground, a poor-looking
    stranger came on the ice to the oldest chief's house and was seated by the fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the stranger said he had eaten only snow while traveling, the oldest
    chief had a wooden dish of snow placed before him; the stranger went out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the following morning, the same stranger visited the second chief's house,
    gave the same answer about eating snow, was given a wooden dish filled with snow,
    and left without touching it.
  category: sequence
  evidence_refs:
  - ev:8
