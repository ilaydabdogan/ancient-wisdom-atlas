canonical_text:
  quote: ''
  summary: TxamsEm learns from his own excrements how to steam salmon in a pit. White
    crows bring him shells instead of dishes, steal his salmon while he is away, and
    are cursed to become black. TxamsEm then meets Lagobola, who displays supernatural
    power over water and fog. The two hunt, travel, and enter a shooting-match in
    which rivers are staked; the outcome is linked to olachen coming to Nass River
    and salmon in Skeena River being fat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm does not know how to prepare food, asks his excrements what to do,
    and receives the answer to steam it in a hole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: TxamsEm gathers firewood, heats stones, puts them in a hole, covers cut salmon
    with skunk-cabbage leaves, pours water on it, and cooks it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: White crows gather; TxamsEm asks them as grandchildren to borrow dishes, and
    they bring mussel shells, clam shells, and other shells that he rejects as not
    real dishes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When TxamsEm goes to get dishes himself, the crows eat his salmon and place
    a large hemlock tree over the hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: TxamsEm returns, finds the hole empty and the ground covered with crow excrements,
    sees many crows in a tree, and curses the flying crows to be black; the passage
    says this is why all crows are black.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: TxamsEm meets Lagobola at the mouth of the river, and Lagobola says he came
    from the south after hearing of TxamsEm's fame and supernatural power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: TxamsEm and Lagobola agree to hunt sea otters near Dundas Island; TxamsEm
    kills three seals and two sea otters and camps there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lagobola dries up the brook waters; TxamsEm recognizes this, places one foot
    on Dundas Island and the other on the mainland at the mouth of Skeena River, fills
    his bucket, and brings water to Lagobola.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During a hunt around Dundas Island, Lagobola removes his hunting cap and creates
    fog; TxamsEm loses his way, becomes afraid, and calls to Lagobola.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lagobola gathers the fog from the water into his cap, puts the cap on, and
    the fog clears; TxamsEm says he was not crying but singing in his canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the Skeena River current, TxamsEm proposes gambling, chooses a shooting-match,
    prepares a split rock as target, and stakes Skeena River against Nass River.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before the simultaneous shot, TxamsEm squirts water from his mouth and speaks
    a desired outcome; afterward Lagobola sees his own arrow strike the rock and TxamsEm's
    fall aside, but TxamsEm repeatedly claims to have hit it, and Lagobola concedes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the conceded victory, Lagobola says olachen will come to Nass River
    twice every summer, and TxamsEm says salmon of Skeena River will always be fat.
  category: speech
  evidence_refs:
  - ev:7
