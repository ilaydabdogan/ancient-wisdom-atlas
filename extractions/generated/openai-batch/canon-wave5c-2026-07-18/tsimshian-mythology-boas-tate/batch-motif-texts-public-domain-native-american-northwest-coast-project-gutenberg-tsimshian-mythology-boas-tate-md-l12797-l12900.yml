canonical_text:
  quote: ''
  summary: Chief Hummingbird borrows a live destroying arrow from Chief Gutginsa'
    for the young prince, gives detailed instructions about hiding and using it, and
    directs the return journey by sparrow garment. The prince returns home, sees his
    people oppressed by his father, invites elders until he finds the old warrior
    Wiludal, learns weapon use from him, gives gifts to chiefs, and takes the name
    of his mother's eldest uncle, Asagulyaan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief Hummingbird asks Chief Gutginsa' to lend a live destroying arrow until
    the prince's brother has taken revenge; Chief Gutginsa' gives the arrow to Chief
    Hummingbird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief Hummingbird says the arrow must be kept in good order, hidden from sight,
    named toward a desired human or animal target, stored in a box placed on a tree,
    and accompanied by abstaining from going in to a woman while it is kept.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chief Hummingbird tells the prince to invite old men from every tribe, ask
    about their lifelong employment rather than directly asking how to use the arrow,
    and continue until he finds a warrior who will instruct him in using the arrow
    called guldani.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chief Hummingbird instructs the travelers to keep the canoe bow toward the
    rising sun, not to travel by canoe alone, and to have the prince wear a sparrow
    garment, fly ahead, and rest on the canoe bow when tired.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sparrow flies ahead of the canoe, rests on the bow when weary, and the
    party reaches home in four days; their relatives are glad to see them return safely.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prince's father keeps the young man's tribe as slaves, treats them badly,
    and sometimes kills people of that tribe; the young man is displeased.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The prince invites old men, seats them on grizzly-bear skins, feeds them,
    asks about their employment since youth, rejects answers centered on women or
    marriage, and sends the men away with the skins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wiludal, a very old blind man of the tribe of G'it-la'n, asks for a bow and
    arrow, for his loins to be girded, for two large empty boxes to be set out, and
    for his arrow to be aimed at a knot-hole.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the people shout, Wiludal leaps, shoots through the knot-hole, runs
    forward, leaps backward over the boxes to his starting place, and declares that
    he shoots through the eye.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The prince rewards Wiludal, calls him in day after day, and learns how to
    hold his weapons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young prince becomes rich, invites chiefs of the tribes, gives away much
    property, and takes his mother's eldest uncle's name, Asagulyaan.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chief who had killed the young man's relatives is ashamed because his
    son loves his own relatives better than him.
  category: relationship
  evidence_refs:
  - ev:7
