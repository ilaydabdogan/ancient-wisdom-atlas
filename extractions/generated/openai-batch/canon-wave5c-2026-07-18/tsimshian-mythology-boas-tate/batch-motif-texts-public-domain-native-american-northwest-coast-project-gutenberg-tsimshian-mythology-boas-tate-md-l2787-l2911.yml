canonical_text:
  quote: ''
  summary: The passage concludes an origin account in which animals establish the
    calendar, explain Dog's hostility toward Porcupine and Dog's thumb, describe stars,
    moonlight, weather signs, and the origin of fog, and assign duties to wise children.
    A new tale then begins about a chief who trains his nephews through cold-sea bathing,
    whipping with twigs, and a spruce-branch strength test, while the youngest nephew
    refuses to bathe and is nicknamed Dirty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The animals agree that the Dogs should be driven away, and the passage explains
    Dog's continuing hatred of Porcupine and other animals of the woods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Porcupine knocks down Dog's thumb with his spiny tail; the passage says Dog
    had six fingers, and that Dog's thumb now stands opposite the other fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage connects the event with there being only twelve months.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Porcupine makes the days thirty to each month, and the passage says people
    enjoy light in heaven after a previous condition in which the world was always
    dark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The animals name the months and divide the year into spring, summer, autumn,
    and winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When The One Who Walks All Over The Sky sleeps, sparks fly from his mouth;
    the passage identifies these sparks as stars.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night the moon receives light from the shining face of the Sun, who is
    asleep when tired, with light coming through the smoke hole.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the Sun is glad, he paints his face with his sister's red ocher; red
    sky in evening and morning is given as a sign of the following weather.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl goes westward, wrings out her garments, strikes the water with them,
    returns, warms herself near her father's great fire, and shakes water from her
    garments onto the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Fog comes out of the house, the tribe enjoys it, the people are refreshed
    by cool fog, and the passage says fog comes from the west nowadays.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The father-chief gives his eldest son the duty of watching so people may know
    the year, gives The One Who Walks All Over The Sky the duty of making good things
    and plenty appear on earth, and blesses his daughter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A new story begins with a great chief on a sandy beach who has four nephews
    and sends them every winter morning to get fuel.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: In severe cold, the uncle tells the nephews to build a large fire, bathe in
    the sea, and be whipped with a bundle of twigs so they will become very strong.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The three elder brothers enter the ice-cold water, but the youngest refuses,
    lies in the corner, is said never to have bathed, and receives the nickname Dirty.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The uncle whips the three bathers in the water; they are equally strong, while
    the youngest lies on the ground with only a ragged deer-skin blanket, and steam
    rises from the place where he has lain.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The three bathing brothers become stronger than other people, and the uncle
