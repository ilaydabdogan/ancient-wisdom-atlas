candidate_motifs:
- id: motif:1
  label: Public insult to a chief's female relative provokes revenge
  taxonomy_refs: []
  basis: The illness of Haimas's sister is publicly mocked, Haimas is ashamed, and
    he targets Nes-balas's people after they are blamed for starting the mockery.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage reports blame placed on Nes-balas's people, but it does not
    independently verify that they originated the mockery.
- id: motif:2
  label: Killing of a close kin member as a model for destroying enemies
  taxonomy_refs: []
  basis: Haimas burns his sister alive and explicitly says that as he destroyed her,
    he will destroy Nes-balas, his warriors, and his brothers.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Although the act is formal and fiery, the passage does not state that
    it is an offering to a deity or a sacred sacrifice.
- id: motif:3
  label: Feast or invited visit as a concealed massacre
  taxonomy_refs: []
  basis: Haimas sends for Nes-balas and his party, prepares a ditch and doorway arrangement,
    and has the guests clubbed and thrown into the ditch as they enter.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The term feast appears in Gik's report of Haimas's feasting-house; the
    broader invitation context is present, but detailed feast procedures are not described.
- id: motif:4
  label: Threshold ambush with concealed weapons and coverings
  taxonomy_refs: []
  basis: Two grizzly-bear skins hang at the door while armed men outside and inside
    coordinate the killing of entrants at the threshold.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No symbolic meaning for the skins or threshold is stated in the passage.
- id: motif:5
  label: Sole survivor escapes massacre and carries news
  taxonomy_refs: []
  basis: Gik hears groans, runs away, reaches survivors, and says he alone escaped
    from the destruction of the chiefs, princes, and warriors.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage identifies Gik as the only escapee from the ambush sequence,
    not necessarily from the later battle.
- id: motif:6
  label: Community defeat after loss of chiefs and warriors
  taxonomy_refs: []
  basis: The assembled tribes flee and suffer heavy losses because no warrior is left
    among them and they have no chief to command them.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives a causal explanation, but military details beyond this
    are limited.
- id: motif:7
  label: Victory taunt and claim of domination over defeated tribes
  taxonomy_refs: []
  basis: Haimas returns singing after victory, mocks Nes-balas's camp, and his man
    declares that tribes who fought him are his slaves and in his power.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage records the claim of domination but does not describe subsequent
    enslavement practices.
