canonical_text:
  quote: ''
  summary: Haimas plans revenge against Nes-balas after men mock the illness of Haimas's
    sister. He burns his sister alive, vows to destroy Nes-balas, prepares a ditch
    inside his doorway, and ambushes Nes-balas and his princes and warriors during
    an invited visit. One man escapes and reports the killings. Allied tribes attack
    Wuts!En-a'luk but are defeated, and Haimas later returns to mock the defeated
    people and claim power over them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haimas thinks of killing Nes-balas during the fishing season, when people
    have come to Nass River and are catching fish with fish rakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas's sister Dzagam-txa-n!e'°x is described as very ill and beautiful;
    she had been married to a Tlingit chief but left him because he had many wives
    who had bewitched her.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four men in a canoe secretly look through a knot-hole, see Dzagam-txa-n!e'°x's
    disturbed bowels, laugh, and spread the mockery among people raking fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Haimas is ashamed and is told that Nes-balas's people began the mockery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Haimas invites his whole tribe, makes a large fire, has his sister dressed
    in a blanket and abalone-shell headdress, seats her on a board, and has her burned
    alive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After his sister is consumed, Haimas forbids weeping, spits into the fire,
    and states that he will destroy Nes-balas, his warriors, and his brothers as he
    destroyed his sister.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Haimas's people dig a long, wide, deep ditch across the inside of his house
    door and send a messenger to Nes-balas, his warriors, and the princes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nes-balas arrives with his people, brothers, and princes; people of Wuts!En-a'luk
    dance on the seashore while each warrior holds a war-knife in his right hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The brother-in-law of Nes-wa-ma'k calls Nes-wa-ma'k to his own house in order
    to protect him from harm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Inside the chief's house there is singing, drumming, whistling, and uproar;
    two grizzly-bear skins hang at the door, with armed men stationed outside and
    inside.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: When Nes-balas enters first, the outer skin is dropped behind him, the inner
    skin is lifted, and men inside club him, kill him, and throw his body into the
    prepared ditch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The same killing and disposal into the ditch is done to Nes-balas's princes
    and warriors until the ditch is full of bodies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The last man, Gik, hears groans through the uproar, runs away, reaches remaining
    people of Gul-qa'q, and reports that he is the only one who escaped.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: Several tribes assemble and attack Wuts!En-a'luk, but the upriver people flee
    because no warrior and no chief remain among them; many of them are slain or wounded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The G'i-spa-x-la'°ts mourn because they have no chief except Nes-wa-ma'k,
    and they avoid him because he did not rescue any of Nes-balas's family.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: Three days after the battle, Haimas comes in four large canoes loaded with
    warriors, singing and happy over victory, and his man declares that opposing tribes
    are Haimas's slaves and in his power.
  category: speech
  evidence_refs:
  - ev:7
