- id: obs:1
  text: The third brother sets out to search for his elder brother and takes all his
    weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the way, the third brother kills a porcupine, hangs it on a tree, shoots
    a white she-bear, and then climbs to the top of a mountain overlooking a large
    village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The third brother reaches the first house, looks through a knot-hole, sees
    a beautiful young woman alone, and is invited in.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief summons the visitor to be fed; young men meet him, take his weapons,
    seat him on a grizzly-bear skin, and later bring weapons back to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next morning a grizzly bear comes down the river, and the chief orders
    hunters to kill it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The third brother attacks the grizzly bear, but his arrow, bow, and spear
    break; the grizzly bear kills him, and the chief cuts him in two and hangs him
    with two other brothers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The remaining brothers go one at a time, meet the same dangers, and leave
    their widows in camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Only the youngest brother remains; he mourns nine lost brothers and insists
    on going despite the widows' objections.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The youngest brother tells his sisters-in-law that he will come back and take
    them home when he returns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The youngest brother takes strong weapons, hunting clothing, and food, but
    avoids the porcupine because he thinks his brothers may have met it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The youngest brother shoots a white she-bear, notices and touches the white
    fur on her belly, and asks why her belly is large.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The white she-bear suddenly becomes a beautiful young woman and says the brothers
    were slain because they did not do what the youngest has done.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The woman says the youngest may go to the grizzly-bear town, promises to tell
