canonical_text:
  quote: ''
  summary: A sequence of brothers seek their lost kin by crossing a mountain to a
    grizzly-bear village, where hospitality conceals danger. One brother is disarmed,
    his weapons fail against a grizzly bear, and he is killed and hung with other
    brothers. The youngest brother mourns the nine lost brothers, promises the widows
    he will return, avoids repeating one part of the route, encounters a white she-bear
    who transforms into a woman, and receives instructions and two helper pups for
    facing the chief, the grizzly bear, and the village.
  language: English with brief original-language footnotes in the passage
  quote_policy: summarized
