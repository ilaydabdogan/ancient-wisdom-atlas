canonical_text:
  quote: ''
  summary: TxamsEm creates a slave named Lgum from rotten spruce wood, equips himself
    with clamshell ornaments imitating chiefly abalone ornaments, and has Lgum announce
    him as a great chief. At one village he feigns death from codfish oil so the people
    move away and leave dried codfish behind; Lgum eats first while TxamsEm is trapped
    in the grave-box, then releases him, and they consume the remaining codfish. At
    a second village Lgum falsely tells the host that TxamsEm will not eat crabapples,
    eats them himself, and angers TxamsEm. TxamsEm then leads Lgum over a fragile
    skunk-cabbage-stem bridge across a canyon; Lgum falls, his belly bursts, and TxamsEm
    eats the food from his stomach.
  language: English
  quote_policy: summarized
