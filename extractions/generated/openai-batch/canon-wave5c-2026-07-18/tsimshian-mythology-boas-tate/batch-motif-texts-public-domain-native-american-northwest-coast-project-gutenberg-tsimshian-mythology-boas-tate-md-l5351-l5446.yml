canonical_text:
  quote: ''
  summary: 'At the end of one tale, a young man uses a made eagle form to descend
    into a valley, finds his sister among sleeping large animals identified in the
    pursuit as Snails, carries her away, warns his chief father, and the people kill
    the pursuing animals at Beaver-Tail Island. Their fat becomes hard-backed shellfish
    and coastal snails. A new tale then begins with a post-Deluge frame: a chief''s
    daughter refuses to marry her cousin, travels with young women to gather fern
    roots, remains cold beside a fire at camp, and is told that her cousin wants to
    take her home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man tests a made eagle form by flying up and down while his companions
    continue offering sacrifices; he then orders his two friends to go home and remains
    alone at the brink of a deep valley.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three days after his companions leave, the young man puts on the eagle form
    and flies down into the valley, where he sees no one in the village streets and
    approaches a large house in the middle of the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Without looking through the door, the young man sees his sister sitting in
    a corner of the large house and sees large animals sleeping around the fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sister sees her brother at the door; he beckons, she comes to him, and
    he carries her on his back while flying up from the valley; they then travel home
    as fast as they can.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After reaching home, the young man tells his father the chief to order the
    people to cut young hemlock and spruce trees, sharpen one end, and be ready for
    pursuers the next day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief's people cut and bring many sharpened young trees, load their canoes,
    and send wives and children across to Beaver-Tail Island.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Snails pursue their daughter-in-law by the scent of the young people's
    footprints; they descend from Xlen Mountain into the water and swim onward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The chief's people fight the pursuing large animals on the water, spearing
    them with sharpened hemlock and spruce trees; the three large animals are killed
