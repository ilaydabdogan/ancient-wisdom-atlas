canonical_text:
  quote: ''
  summary: After a prince disappears, his parents consult shamans. A named great shaman
    performs with regalia, songs, rattle, attendants, and fire, and declares that
    the boy lives with the Salmon people. He says the Spring Salmon took the boy after
    a dispute over dried salmon, and that eating stored dried salmon will heal the
    Spring Salmon chief and enable the boy’s return. The parents and two tribes prepare
    ritually and practically for the spring salmon run. Through visions the shaman
    tracks the Salmon people moving upriver. At the canyon, people fish with nets
    and poles; the prince’s father catches many salmon, and the Spring Salmon chief
    instructs the prince how his flesh and bones should be treated.
  language: English
  quote_policy: summarized
