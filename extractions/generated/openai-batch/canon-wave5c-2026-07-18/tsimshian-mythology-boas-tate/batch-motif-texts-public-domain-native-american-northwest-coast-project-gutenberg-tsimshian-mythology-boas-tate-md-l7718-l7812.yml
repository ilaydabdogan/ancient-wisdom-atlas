canonical_text:
  quote: ''
  summary: After returning, a prince becomes rich by selling food, then gives feasts
    and exhausts his goods. His wife, the princess Peace Woman, requires six strong
    ash digging-sticks and uses them at the low-water line to bring up whales and
    other sea animals. The food is sold, feasted, and distributed among relatives
    and tribes. Later, when the prince fetches water for her, his former wife intercepts
    and embraces him until he speaks to her. Peace Woman tests the water with a plume,
    finds slime, accuses him of still loving his former wife, leaves for the beach,
    and walks out on the water while he follows.
  language: English
  quote_policy: summarized
