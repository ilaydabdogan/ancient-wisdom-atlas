canonical_text:
  quote: At that time there was always darkness. There was no daylight then.
  summary: A chief sends his son away with travel aids and food-stocking materials.
    The son, named Giant, travels east, creates a resting rock from a stone, scatters
    fish roe and fruit over the mainland, ascends through a hole in the sky to obtain
    daylight, enters the household of the chief of heaven by transforming into a cedar
    leaf, is born as a boy, obtains the daylight box named md, and flees back down
    to the world with it.
  language: English
  quote_policy: quoted
