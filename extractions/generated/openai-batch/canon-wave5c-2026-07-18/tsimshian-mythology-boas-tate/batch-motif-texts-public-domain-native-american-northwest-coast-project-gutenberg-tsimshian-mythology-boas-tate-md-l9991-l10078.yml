canonical_text:
  quote: ''
  summary: A girl and her siblings are guided by a young eagle to Nass River and to
    their maternal grandfather's village. They are recognized as children of Princess
    Daul, questioned and named by an old blind chief, and accepted by the village.
    The old chief gives his place to the eldest boy and charges him to avenge slain
    relatives; after the chief dies, the eldest succeeds, maintains peace with Haida
    kin, and later leads a night attack on relatives of the earlier murderers, sparing
    a related slave-woman and her daughter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl asks the young eagle about its mother's native land, and the eagle
    flies ahead while the party travels and camps at named places near the mouth of
    three rivers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eagle is away for two days, returns, and then guides the princess's party
    up Nass River, after which they understand that they are near home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before arriving at the village, the sister puts on a white sea-otter-skin
    dress, the four brothers put on black sea-otter-skin garments, red paint, and
    eagle down, and the young eagle sits on the bow of the canoe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the village beach, people see the canoe and the young eagle and ask where
    the travelers come from and who they are.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl identifies the travelers as children of Princess Daul, who had been
    among children carried away by high tide in a hollow tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The villagers cry and shout for joy, then take the visitors into their grandfather's
    house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief is very old and blind; the visitors are seated near a large fire
    and are described as looking like supernatural beings.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old chief asks about the visitors' mother, father, number, and names;
    the girl names the four boys and herself and says her grandfather gave them their
    names.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The girl says a young eagle brought them, and says her mother's companions
    all married there, none were lost, and some had children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old chief tells the eldest boy that he shall have the chief's place and
    should return to Gits!Emga'l6n to destroy those who killed his grandfathers; after
    speaking, the old chief dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The eldest son of Princess Daul succeeds to the old chief's place, and later
    Nass River people visit the Haida peacefully and take back some grandchildren.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The new chief gathers his tribe, crosses mountains to the lake of Gits!Eniga'l6n,
    follows smoke to a camp, and waits at night until the people in the house are
    asleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At midnight the chief orders his men to slay the murderers; the men kill the
    sleepers, while one slave-woman and her little daughter, relatives of the young
    chief, are saved and the woman escapes in the morning.
  category: action
  evidence_refs:
  - ev:7
