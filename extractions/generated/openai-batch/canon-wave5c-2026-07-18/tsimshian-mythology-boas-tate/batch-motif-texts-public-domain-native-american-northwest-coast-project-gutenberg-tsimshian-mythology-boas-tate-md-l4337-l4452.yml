canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which the dead Baboudina is
    burned; people blow the ashes into the air, and the ashes become mosquitoes that
    remain on earth. A new tale then begins: ten princes go hunting with their wives,
    except the youngest brother has no wife. The eldest brother, and later the second
    brother searching for him, each follows a similar path: encountering a porcupine,
    killing a white she-bear, climbing a mountain, seeing a village, being invited
    by a young woman and hosted by a chief, having weapons taken and returned, receiving
    food and blankets, and then being sent against grizzly bears. In both cases the
    hunter’s weapons break, the grizzly kills him, and the chief cuts the body in
    two and hangs it in his house.'
  language: English
  quote_policy: summarized
literal_observations:
