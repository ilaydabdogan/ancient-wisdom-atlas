  text: A group finds Baboudina dead, examines the body, sees that the proboscis is
    pure crystal, and burns the body and heart until only ashes remain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people blow into the fire and scatter the ashes; the ashes fly upward
    and become small mosquitoes, which are said to remain on earth now.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ten princes go out hunting, build a hut at their camping place, and are accompanied
    by their wives; only the youngest brother has no wife.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eldest brother goes hunting alone, clubs a fat porcupine and hangs it
    on a tree, shoots a white she-bear, climbs higher on the mountain, sees smoke
    from a village below, and slides down the ice on snowshoes to the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A young woman in the first house smiles at the eldest brother and invites
    him in; the chief then invites him to the chief’s house, where young men take
    and examine his weapons, seat him by the large fire, feed him rich food, return
    the weapons, and provide blankets for the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The next morning the chief orders hunters to kill grizzly bears; the eldest
    brother’s quartz arrow, bow, and spear fail or break, and a great grizzly bear
    kills him. The chief cuts him in two and hangs him in a front corner of the house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The second brother sets out to search for the lost elder brother, carrying
    weapons, and repeats the same route: meeting and hanging a fat porcupine, shooting
    a white she-bear, climbing the mountain, and seeing smoke from a village below.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The second brother is also invited by the young woman and then by the chief;
    young people take his weapons, he is seated by the chief’s fire on a grizzly-bear
    skin, fed rich food, has his weapons brought in, receives a blanket, and sleeps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The next morning the second brother is sent toward the grizzly bears; his
    quartz arrow, bow, and spear fail or break, and the grizzly bear kills him. The
    chief takes him inside, cuts him in two, and hangs him with his elder brother.
  category: sequence
  evidence_refs:
  - ev:9
