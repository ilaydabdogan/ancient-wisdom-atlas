canonical_text:
  quote: ''
  summary: A series of Tsimshian princesses have disappeared. The last princess is
    lured into the woods by a handsome young man who later appears as an ugly old
    arrow-seller and bad shaman. He takes her by canoe, coerces her, then strands
    her on a bare rock under the pretext of gathering feathers. After he shouts four
    times to heaven and leaves, heavenly birds descend. The princess hides in a cave
    near the water, gathers their feathers, sees bones and baskets, and realizes the
    old man killed the missing princesses. Four days later he returns by canoe while
    she hides with seaweed on her head.
  language: English
  quote_policy: summarized
