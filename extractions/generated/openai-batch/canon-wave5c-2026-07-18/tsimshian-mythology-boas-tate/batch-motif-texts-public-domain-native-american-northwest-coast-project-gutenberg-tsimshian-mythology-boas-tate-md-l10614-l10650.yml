  summary: A j'ouug prince asks whether the visitors lost a princess years earlier.
    Villagers receive the visitors, recount the mother's loss by the southwest wind
    and her Tsimshian connections, and announce the safe arrival of the old man's
    grandchildren. A boy visits his mother's old desolate village-site of Dzl'g^va
    and finds hidden costly coppers and property. The passage closes by introducing
    Omen's mourning-songs after she left a village destroyed by fire.
