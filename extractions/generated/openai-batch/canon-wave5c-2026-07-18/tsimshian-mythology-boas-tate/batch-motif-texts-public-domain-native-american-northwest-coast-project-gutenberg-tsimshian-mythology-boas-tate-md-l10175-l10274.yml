canonical_text:
  quote: ''
  summary: A prince named Asdilda kills a frog in a camp fire after it leaps onto
    roasted fish. On the return journey by canoe, a beautiful woman repeatedly calls
    from the beach to be taken along; when the prince tries to embrace her, she vanishes
    and a frog leaps away. After the travelers refuse her final request, she foretells
    a sequence of deaths. The prince and two companions die as predicted before the
    steersman reaches the village and begins recounting the events.
  language: English
  quote_policy: summarized
