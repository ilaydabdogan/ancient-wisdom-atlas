canonical_text:
  quote: ''
  summary: 'Vinaya passage regulating practical details of robe sewing and the Kaṭhina:
    sewing aids are allowed, the Kaṭhina is protected from soiling, thimbles and storage
    aids are regulated, a Kaṭhina hall is authorized and modified for weather, water,
    structural safety, and robe-hanging needs, and folded storage is permitted after
    pest damage to robes.'
  language: English translation with Pali technical terms
  quote_policy: summarized
