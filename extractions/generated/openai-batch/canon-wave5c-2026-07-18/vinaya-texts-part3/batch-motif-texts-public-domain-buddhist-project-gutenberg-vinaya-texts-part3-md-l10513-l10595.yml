canonical_text:
  quote: ''
  summary: 'A Vinaya passage reports administrative deficiencies in the Saṅgha: lack
    of distributors, receivers, overseers, and superintendents caused goods to spoil
    or work and duties to be neglected. The Blessed One allows the Bhikkhus to appoint
    qualified monks to these offices. A storehouse accumulation of trifling articles
    is addressed by appointing a disposer of trifles, who is to distribute small items
    and give consumables such as ghee, oil, honey, and molasses for personal consumption
    when needed.'
  language: English
  quote_policy: summarized
