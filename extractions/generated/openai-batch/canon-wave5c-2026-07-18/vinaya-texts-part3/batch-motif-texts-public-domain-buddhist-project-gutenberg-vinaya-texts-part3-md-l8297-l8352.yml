canonical_text:
  quote: ''
  summary: 'A Vinaya passage describes practical problems in monastic dwellings and
    facilities: verandahs are too public for sleeping; open-air meals expose Bhikkhus
    to cold and heat; robes laid on the ground become dirty; water becomes warm and
    lacks vessels; and Viharas lack fencing. In response, the Blessed One allows curtains
    or movable screens, a Service Hall, robe-hanging bamboos and strings, a water-room
    and watershed, water vessels, and an enclosure allowance whose full wording is
    interrupted in the excerpt.'
  language: English
  quote_policy: summarized
