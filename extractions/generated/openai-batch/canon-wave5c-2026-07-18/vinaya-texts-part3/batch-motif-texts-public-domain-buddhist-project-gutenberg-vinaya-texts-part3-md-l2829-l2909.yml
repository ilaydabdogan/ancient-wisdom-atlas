canonical_text:
  quote: ''
  summary: In a Vinaya passage on the daily life of bhikkhus, the Chabbaggiya Bhikkhus
    are criticized for bathing practices that resemble worldly body-rubbing or shampooing.
    After laypeople complain and other monks report the matter, the Blessed One convenes
    the Bhikkhu-saṃgha, confirms the conduct, rebukes it, gives a religious discourse,
    and lays down prohibitions with a dukkaṭa penalty. Similar prohibitions are noted
    for rubbing against a pillar or wall, bathing on a shampooing stand, using bathing
    instruments, and rubbing bodies against one another underwater.
  language: English
  quote_policy: summarized
