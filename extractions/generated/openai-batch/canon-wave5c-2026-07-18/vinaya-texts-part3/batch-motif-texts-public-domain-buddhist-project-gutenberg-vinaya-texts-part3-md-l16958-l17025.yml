canonical_text:
  quote: ''
  summary: 'A Vinaya passage gives several rulings about Bhikkhunis: a Bhikkhuni under
    Manatta penance may receive a deputed companion; a Bhikkhuni who abandoned the
    precepts and threw off the robes is declared incapable of being a Bhikkhuni; a
    Bhikkhuni who joined the Titthiyas while still wearing the orange-coloured robe
    is not to be received again; Bhikkhunis, fearing offense, refuse to let men salute
    them or attend to hair, nails, or wounds.'
  language: English
  quote_policy: summarized
