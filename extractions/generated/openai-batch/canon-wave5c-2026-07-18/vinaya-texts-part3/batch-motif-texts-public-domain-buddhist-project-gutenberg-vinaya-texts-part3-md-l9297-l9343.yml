canonical_text:
  quote: ''
  summary: A Vinaya passage gives rules about lay-arranged seating. After a brief
    rule about not reserving the Samgha for exclusive use according to seniority,
    lay people arrange lofty, large, or stuffed couches and chairs in eating rooms
    or courtyards. The Bhikkhus avoid sitting on them from fear of offense and report
    the matter to the Blessed One, who permits sitting on lay-arranged seats or stuffed
    furniture under restrictions and forbids lying down on them. The passage then
    notes the Blessed One traveling to Savatthi.
