canonical_text:
  quote: "“The Dhamma is not, O Bhikkhus, to be sung [in that manner].”"
  summary: A group of Bhikkhus sing the Dhamma in a song-like manner with abrupt transitions.
    People object. The Blessed One lists dangers of that practice, forbids singing
    the Dhamma in that manner on penalty of dukkata, and later permits intoning when
    Bhikkhus become afraid to intone at all.
