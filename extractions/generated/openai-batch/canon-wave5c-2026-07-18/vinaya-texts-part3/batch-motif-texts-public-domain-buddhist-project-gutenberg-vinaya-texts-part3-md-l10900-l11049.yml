canonical_text:
  quote: ''
  summary: The passage first explains Bhaddiya's repeated cry of happiness in forest
    solitude as joy in fearlessness after former royal anxiety. It then narrates Devadatta's
    plan to win Prince Ajatasattu, his shape-change into a snake-girdled child, Ajatasattu's
    patronage after seeing this marvel, and Devadatta's loss of Iddhi after conceiving
    ambition to lead the Bhikkhu-saṅgha.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhaddiya retires into the forest, to the foot of a tree, into solitude, and
    repeatedly utters an ecstatic exclamation of happiness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A number of Bhikkhus report Bhaddiya's behavior to the Blessed One and suggest
    that he may be recalling the happiness of his former sovereignty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One sends a Bhikkhu to summon Bhaddiya in the Teacher's name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhaddiya explains that when he was formerly a king, even with guards within
    and without his apartments, town, and country, he was fearful, anxious, distrustful,
    and alarmed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhaddiya says that now, even in forest solitude at the foot of a tree, he
    is without fear or anxiety, trustful, not alarmed, and at ease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One responds with a song describing a person without harsh thoughts,
    free from grief or care, whose joy even the gods do not behold.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After staying at Anupiyā, the Blessed One journeys to Kosambi and stays at
    the Ghosita Ārāma.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Devadatta, in solitude and meditation, considers whom he can win over so that
    gain and honour may result, and decides on the young Prince Ajatasattu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Devadatta travels to Rājagaha, lays aside his own form, takes the form of
    a child clad in a girdle of snakes, and appears on Prince Ajatasattu's lap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Prince Ajatasattu is terrified and asks who the apparition is; Devadatta identifies
    himself, and the prince asks him to appear in his own shape.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Devadatta lays aside the child form and appears in his own shape with inner
    and outer robes and a bowl in his hand.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Prince Ajatasattu is pleased by the marvel of Iddhi and thereafter attends
    Devadatta morning and evening with five hundred chariots, while food is brought
    in five hundred dishes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Devadatta, possessed and vanquished by gain, hospitality, and fame, thinks
