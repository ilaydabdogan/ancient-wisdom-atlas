canonical_text:
  quote: ''
  summary: After completing business at Ragagaha, Anatha Pindika travels toward Savatthi
    and orders preparations along the road for the invited Buddha. At Savatthi he
    looks for a suitable retired place for the Blessed One and identifies the garden
    of Geta the Kumara. Geta initially refuses to sell it except under a statement
    about covering it with money; legal arbiters decide that this constitutes a fixed
    price. Anatha Pindika covers the garden with gold pieces, and when a small space
    near the gateway remains, Geta offers that space as his own gift. Anatha Pindika
    accepts the value of Geta’s adherence and gives up the space.
  language: English
  quote_policy: summarized
