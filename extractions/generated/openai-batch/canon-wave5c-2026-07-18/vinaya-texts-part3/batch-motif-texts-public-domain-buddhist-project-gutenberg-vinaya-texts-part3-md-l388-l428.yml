canonical_text:
  quote: ''
  summary: After returning from alms and eating, monks compare the food they received.
    Some elder monks report receiving desirable foods, while followers of Mettiya
    and Bhummayaka report receiving only ordinary scraps and sour gruel. A prosperous
    householder regularly provides a meal for four monks, serving food with his wife
    and children. The next day’s meal for Mettiya and Bhummayaka’s followers is scheduled
    at this householder’s home. The householder visits the Arama, salutes Dabba the
    Mallian, sits to one side, and receives religious discourse from him. The passage
    breaks off during this exchange.
  language: English
