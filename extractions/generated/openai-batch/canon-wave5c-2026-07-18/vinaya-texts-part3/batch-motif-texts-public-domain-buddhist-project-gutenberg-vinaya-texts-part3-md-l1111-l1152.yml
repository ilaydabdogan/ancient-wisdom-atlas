canonical_text:
  quote: ''
  summary: 'A Vinaya passage gives a formal procedure for appointing a Bhikkhu to
    take voting tickets: approval is shown by silence and objection by speaking. It
    then states that vote-taking has ten invalid and ten valid cases and begins listing
    invalid cases, including trivial disputes, incomplete preliminaries, failure formally
    to remember or call to remember an offence, and the ticket-taker''s knowledge
    that opinions not in accordance with the law will be in the majority.'
  language: English translation with Pali terms
  quote_policy: summarized
