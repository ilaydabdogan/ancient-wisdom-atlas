canonical_text:
  quote: ''
  summary: 'The passage sets out qualifications for appointing a Bhikkhu to a jury
    in a dispute: mastery of transmitted material, expertise in Vinaya, ability to
    instruct and pacify both friends and foes, and understanding of legal questions
    and the origin and settlement of disputes. It then prescribes an appointment procedure
    in which the candidate is first asked for consent and a discreet, able Bhikkhu
    addresses the Sa^gha about the unclear and confused state of the case.'
  language: English
  quote_policy: summarized
