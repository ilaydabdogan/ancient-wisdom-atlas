  text: A Bhikkhu considered for jury appointment must have received the relevant
    teachings fully, and must have divided, established, and investigated them by
    sutta and in detail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prospective appointee must be an expert in the Vinaya and described as
