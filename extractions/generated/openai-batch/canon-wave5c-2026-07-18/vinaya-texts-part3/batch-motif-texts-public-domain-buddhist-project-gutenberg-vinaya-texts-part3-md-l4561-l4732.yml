canonical_text:
  quote: ''
  summary: 'The passage records several practical Vinaya rulings: a traveling Bhikkhu
    must lend a strainer and travel with one, alternative straining methods and improved
    filters are allowed, mosquito curtains are allowed, and later the use and construction
    of cloisters and bath-rooms are authorized after illness and construction problems
    at Vesali.'
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu acknowledges that he would not lend his strainer when asked, and
    moderate Bhikkhus object and report the matter to the Blessed One.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One states that a Bhikkhu on a journey must not refuse to lend
    his strainer when asked and assigns an offense for refusal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One states that a Bhikkhu without a strainer must not undertake
    a journey; if no strainer or regulation water-pot is available, the corner of
    the upper robe may be adopted for straining before drinking.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Blessed One journeys to Vesali and lodges in the Mahavana, in the Kutagara
    Hall.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: While Bhikkhus are engaged in building, the existing strainer does not suffice,
    and the Blessed One allows a double strainer and then a filter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bhikkhus are troubled by mosquitoes, and the Blessed One allows mosquito
    curtains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Vesali a regular turn-taking lay service of sweet food has been established,
    and the Bhikkhus become very sick after eating the sweet food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Jivaka Komarabhacca goes to Vesali, sees the sick Bhikkhus, approaches the
    Blessed One, and recommends prescribing the use of the cloister and bath-room
    so the Bhikkhus may become convalescent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Blessed One gives religious discourse to Jivaka, convenes an assembly
    of the Bhikkhusaṅgha, and prescribes the use of the cloister and bath-room.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Bhikkhus walk on a cloister on uneven ground, their feet are hurt, and
    the Blessed One allows the ground to be made level.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The cloister basement is too low and inundated with water, and the Blessed
    One allows a high basement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: When the basement facing falls in, the Blessed One allows brick, stone, and
    wooden facing; when Bhikkhus have difficulty getting up, he allows brick, stone,
    and wooden stairs, after which they fall off while going up.
  category: sequence
  evidence_refs:
  - ev:4
