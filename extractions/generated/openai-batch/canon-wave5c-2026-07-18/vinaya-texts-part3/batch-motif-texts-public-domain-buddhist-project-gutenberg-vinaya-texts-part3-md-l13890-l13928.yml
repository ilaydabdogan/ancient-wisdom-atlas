canonical_text:
  quote: ''
  summary: 'The passage gives rules for conduct in relation to water use and the hot
    bath-room: one leaving the water must make way for one entering, and the last
    person to leave the hot bath-room must clean and order the room, extinguish the
    fire, close the doorway, and depart. It then notes chapters on privies and sanitary
    arrangements, repeats of earlier material, and the close of the Eighth Khandhaka
    on Rules for Conduct.'
