canonical_text:
  quote: ''
  summary: Devadatta speaks of Sariputta and Moggallana as coming to join him. Kokalika
    warns Devadatta not to trust them, but Devadatta chooses to welcome them. Devadatta
    invites Sariputta to share his own seat; Sariputta instead sits on another seat.
    Devadatta addresses the Bhikkhus far into the night, then asks Sariputta to continue
    the religious discourse because the assembly is still awake and Devadatta is tired.
    Sariputta agrees. Devadatta lies down on a folded waist-cloth and falls asleep.
    Sariputta then teaches and exhorts the Bhikkhus on the marvels of preaching.
  language: English translation with Pali/Sanskrit names and terms
  quote_policy: summarized
