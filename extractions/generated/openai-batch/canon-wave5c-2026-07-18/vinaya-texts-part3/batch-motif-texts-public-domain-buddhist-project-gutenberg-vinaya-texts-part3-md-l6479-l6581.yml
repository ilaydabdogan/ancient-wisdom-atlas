canonical_text:
  quote: ''
  summary: 'A Vinaya passage records practical disciplinary rulings for Bhikkhus:
    permission to use pincers and an ear-wax instrument, prohibition on having white
    hairs pulled out, restriction on storing much brass and copper ware, permission
    to use small grooming and handle implements, prohibition on lolling against waist-cloths,
    and mention of a sick Bhikkhu ill at ease without handicraft.'
  language: English
  quote_policy: summarized
