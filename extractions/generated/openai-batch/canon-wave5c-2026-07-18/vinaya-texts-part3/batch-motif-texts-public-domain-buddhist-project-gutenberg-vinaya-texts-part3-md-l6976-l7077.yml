canonical_text:
  quote: ''
  summary: A Vinaya disciplinary passage reports bhikkhus described as Brahmans by
    birth asking the Blessed One to put the word of the Buddhas into Sanskrit verse
    because monks from diverse backgrounds repeat it in their own dialects. The Blessed
    One rebukes the request, forbids putting the word into verse under a dukka/a offence,
    and permits learning it each in one's own dialect. A following case says the AT/abbaggiya
    Bhikkhus learned the Lokayata system; public criticism is reported, and the Blessed
    One questions whether valuing Lokayata is compatible with full growth in the doctrine
    and discipline.
  language: English translation with Pali/Sanskrit technical terms
  quote_policy: summarized
