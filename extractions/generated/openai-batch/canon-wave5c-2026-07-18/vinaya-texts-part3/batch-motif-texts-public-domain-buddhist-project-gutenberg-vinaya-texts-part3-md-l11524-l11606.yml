canonical_text:
  quote: ''
  summary: Successive men who approach the Blessed One are converted by his discourse
    and sent away. One man returns to Devadatta and says he cannot kill the Blessed
    One because of his power and might. Devadatta then attempts to kill the Blessed
    One by hurling a rock from Vulture's Peak; two mountain peaks stop the rock, but
    a splinter wounds the Blessed One's foot. The Blessed One declares that Devadatta
    has produced grave demerit and immediate-effect karma by causing the Tathagata's
    blood to flow. Bhikkhus respond to the threat by walking around the Vihara and
    reciting loudly for the Blessed One's protection.
  language: English translation
  quote_policy: summarized
