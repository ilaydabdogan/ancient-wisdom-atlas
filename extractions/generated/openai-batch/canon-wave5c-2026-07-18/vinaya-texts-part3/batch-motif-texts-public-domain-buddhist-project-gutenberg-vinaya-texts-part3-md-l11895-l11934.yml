canonical_text:
  quote: ''
  summary: Devadatta and his friends plan to use stricter ascetic demands to create
    division in the Saṅgha and win public support. Devadatta presents the demands
    to the Blessed One, who refuses to make them mandatory and instead allows optional
    dwelling in woods or villages, begging or accepting invitations, wearing rags
    or accepting robes, limited sleeping under trees, and eating fish under specified
    conditions. Devadatta is pleased by the refusal and uses it to promote his position
    among the people of Rājagaha.
  language: English
  quote_policy: summarized
