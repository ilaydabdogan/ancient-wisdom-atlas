canonical_text:
  quote: ''
  summary: 'The passage describes a Vinaya procedure for settling a legal question:
    a voting-ticket taker collects votes, the case is decided according to the larger
    number of Dhamma-guided Bhikkhus, the settlement is defined as occurring by proceeding
    in presence and by majority vote, and reopening or complaining after consent is
    treated as a Pācittiya offense. It then notes that a legal question had arisen
    at Savatthi.'
