canonical_text:
  quote: ''
  summary: A formal Saṅgha resolution appoints five hundred Bhikkhus to spend the
    rainy season at Rājagaha/Rafagaha in order to chant the Dhamma and Vinaya together,
    excluding other Bhikkhus from coming there for that rainy season. The elder Bhikkhus
    first repair dilapidations. Ānanda, not wishing to enter the assembly while still
    only on the way to Arahatship, remains alert through the night and becomes free
    from attachment and emancipated from the Āsavas before lying fully down. Mahā
    Kassapa then formally questions Upāli about the Vinaya, including the four Pārājika
    rules, and questions Ānanda about the Dhamma, including the Brahmajāla and its
    setting.
  language: English translation
  quote_policy: summarized
