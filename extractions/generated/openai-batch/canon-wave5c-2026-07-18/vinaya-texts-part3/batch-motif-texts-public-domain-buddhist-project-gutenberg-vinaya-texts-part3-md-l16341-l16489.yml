canonical_text:
  quote: ''
  summary: A Vinaya passage prescribes procedures for appointing a Bhikkhuni instructor,
    instructing and questioning a candidate for upasampada, presenting the candidate
    before the Bhikkhuni-sangha and then the Bhikkhu-sangha, conferring initiation
    by formal motions and silence, giving post-initiation information, and ordering
    seats among Bhikkhunis by seniority and arrival.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Only a Bhikkhuni appointed to the office is prescribed to instruct candidates;
    one acting without appointment is said to incur a dukkaṭa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A learned and competent Bhikkhuni may appoint herself or be appointed by another
    through a formal motion or resolution before the Sangha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The appointed instructor tells the candidate to speak truthfully and to answer
    disqualification questions with affirmative or negative answers as appropriate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After instruction, the instructor is to return first to the assembly and request
    that the candidate be brought forward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The candidate is told to arrange her upper robe over one shoulder, bow before
    the Bhikkhunis, sit on her heels, stretch forth joined palms, and request upasampada
    three times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A learned and competent Bhikkhuni formally asks to question the candidate
    about the Disqualifications.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Bhikkhuni-sangha confers upasampada by formal motion and repeated proclamation;
    agreement is indicated by silence, and dissent by speech.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After receiving upasampada on the Bhikkhuni side, the candidate is taken before
    the Bhikkhu-sangha and repeats a corresponding request and procedure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Bhikkhus are then instructed to measure the shadow, tell the newly received
    Bhikkhuni the season, date, part of the day, and formula, and direct the Bhikkhunis
    to teach permitted and interdicted matters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A later rule addresses Bhikkhunis wasting time in the dining-hall over seating;
    the senior eight sit by seniority, and the rest sit as they arrive.
  category: sequence
  evidence_refs:
  - ev:9
