canonical_text:
  quote: ''
  summary: A group of Bhikkhus claims a Vihara already occupied by the Sattarasa-vaggiyas,
    argues over its status as common property of the Saw/gha, ejects the occupants
    by force, and is rebuked by the Blessed One, who states that a Bhikkhu should
    not be cast out of a communal Vihara in anger and vexation.
