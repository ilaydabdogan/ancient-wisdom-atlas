canonical_text:
  quote: ''
  summary: 'After Moggallana reports that an offending man has been made to leave
    and that the assembly is undefiled, the Blessed One addresses the Bhikkhus. He
    lists eight marvellous qualities of the great ocean and then explicitly compares
    several of them to qualities of the doctrine and discipline: gradual training,
    stability within precepts, rejection of an impure person by the Saṅgha, renunciation
    of former caste names and lineage, and the community not appearing diminished
    or increased by the passing away of many Bhikkhus.'
  language: English
  quote_policy: summarized
