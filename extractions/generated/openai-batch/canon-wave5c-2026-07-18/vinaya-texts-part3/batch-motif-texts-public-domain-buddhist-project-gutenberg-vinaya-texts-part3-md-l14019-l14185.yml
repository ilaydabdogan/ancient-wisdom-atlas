    the assembly is now undefiled, and asks the Blessed One to recite the Patimokkha
    to the Bhikkhus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One says it is astonishing that the foolish fellow waited until
    he had to be taken by the arm.
  category: speech
  evidence_refs:
  - ev:2
