canonical_text:
  quote: "“The great Sage has tamed this elephant without a weapon or a stick.”"
  summary: The passage reports that Ndlagiri became tame again, and the people praise
    the great Sage for taming the elephant without weapons. The people condemn Devadatta
    for attempting to slay Samara Gotama, after which Devadatta’s honour declines
    and the Blessed One’s increases. Devadatta then goes with Bhikkhus to people’s
    houses asking for alms, provoking public criticism, and the Blessed One lays down
    a rule for the Bhikkhus.
