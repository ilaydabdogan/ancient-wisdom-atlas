canonical_text:
  quote: ''
  summary: A set of named figures ask the Setthi of Ragagaha for a bowl and receive
    the same reply. The venerable Maha Moggallana and the venerable Bharadvaga, both
    spoken of as Arahats possessing Iddhi, discuss fetching the bowl. Bharadvaga rises
    into the air, takes the bowl, circles Ragagaha three times, descends at the Setthi's
    dwelling, and receives costly food in the bowl. People follow him with loud shouts.
    The Blessed One questions Ananda, convenes the Bhikkhu-Sangha, confirms the act,
    rebukes Bharadvaga for displaying miraculous Iddhi before the laity for a wooden
    pot, and lays down rules forbidding such display and the use of wooden bowls.
    A later section begins with Chabbaggiya Bhikkhus using gold and silver bowls and
    the people murmuring.
  language: English translation
  quote_policy: summarized
