canonical_text:
  quote: ''
  summary: A slave-girl seats Bhikkhus who are followers of Mettiya and Bhumma^aka
    in an entrance hall and serves them scraps of food with sour gruel, explaining
    that a householder had ordered this treatment for those coming for the next day's
    meal. The Bhikkhus infer that Dabba the Mallian has turned the householder against
    them, eat uneasily, and return to the Arama, where they put aside their bowls
    and robes and sit outside the porch.
  language: English translation
