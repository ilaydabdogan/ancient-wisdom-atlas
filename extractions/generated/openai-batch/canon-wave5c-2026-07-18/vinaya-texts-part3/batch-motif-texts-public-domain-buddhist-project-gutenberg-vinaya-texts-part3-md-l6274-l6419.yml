canonical_text:
  quote: ''
  summary: 'The passage reports several disciplinary incidents and rulings: fallen
    rice during food offerings may be picked up and eaten because it has been given;
    a monk with long nails is threatened with a false accusation by a woman who scratches
    herself; long nails, nail injury from improper trimming, polished nails, long
    hair, and specified beard or body-hair grooming practices lead to permissions
    or prohibitions issued by the Blessed One.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the supply of food to the Saṅgha in a dining hall, fragments of rice
    were allowed to fall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lay people complained that the monks handled food carelessly and emphasized
    the labor involved in each ball of rice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One allowed monks to pick up and eat things that fall while being
    given to them, stating that such things had been presented by the givers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A monk went on an alms round with long fingernails, and a woman invited him
    to have sexual connection with her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the monk refused, the woman threatened to scratch her own limbs and
    accuse him of ill-treatment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman scratched herself; people seized the monk, then released him after
    seeing skin and blood on the woman’s nails and concluding the injury was self-inflicted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the incident was reported, the Blessed One prohibited monks from wearing
    long nails and assigned a dukka/a offence for doing so.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Monks injured their fingers by tearing, biting, or rubbing down their nails;
    the Blessed One allowed nail-cutters and instructed that nails be cut according
    to the length of the flesh.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Chabbaggiya Bhikkhus had all twenty nails polished; lay people objected
    that this resembled people living in worldly pleasures, and the Blessed One prohibited
    polishing while allowing dirt removal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When monks’ hair grew long, the Blessed One confirmed that monks could remove
    one another’s hair and allowed razors, a hone, anti-rust powder, a sheath, and
    barber apparatus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Blessed One prohibited several grooming practices involving beards, chest
