canonical_text:
  quote: ''
  summary: 'Upali asks under what conditions a Bhikkhu should take charge of the conduct
    of a matter. The reply gives five considerations: whether the time is right, whether
    the action is just, whether it tends to advantage or profit, whether supporting
    associates will act in accordance with the Dhamma and Vinaya, and whether the
    Sangha will avoid strife, dispute, split, disunion, or divergent positions and
    actions. If adverse outcomes are foreseen, the Bhikkhu should not take charge;
    if the five conditions are satisfied, taking charge will not cause later remorse.
    The passage then begins a new question about what qualities a Bhikkhu should consider
    in himself before warning another.'
  language: English
  quote_policy: summarized
