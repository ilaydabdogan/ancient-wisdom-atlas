canonical_text:
  quote: ''
  summary: 'The passage first gives rules for a Bhikkhu who warns another: he should
    speak at the right time, truthfully, gently, profitably, and kindly, and repentance
    is prescribed for wrongful warning. It then lists further qualities for one who
    warns and one who is warned. The next section begins the duties of Bhikkhunis:
    Mahapajapati Gotami approaches the Blessed Buddha at Kapilavatthu, asks that women
    be allowed to renounce home and enter the homeless state, is refused three times,
    and departs sorrowfully; the Blessed One later sets out toward Vesali.'
  language: English
  quote_policy: summarized
