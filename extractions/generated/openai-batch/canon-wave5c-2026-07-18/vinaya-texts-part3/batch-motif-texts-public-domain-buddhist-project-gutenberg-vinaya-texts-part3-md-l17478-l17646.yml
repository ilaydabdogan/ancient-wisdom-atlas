canonical_text:
  quote: ''
  summary: 'At the Council of Ragagaha, Maha Kassapa questions Ananda about discourses
    and their occasions. Ananda reports that the Blessed One had allowed the Sangha
    to revoke lesser and minor precepts after his passing, but admits he did not ask
    which precepts these were. The elders disagree over which rules might count as
    minor. Maha Kassapa proposes that the Sangha neither add nor revoke rules and
    instead maintain the precepts as laid down; the assembly accepts by silence. The
    elder monks then require Ananda to confess several alleged faults: failing to
    ask about the minor precepts, stepping on the Blessed One''s rainy-season garment
    while sewing it, letting women salute the body first so that tears defiled it,
    failing to ask the Blessed One to remain for a kalpa, and working for women''s
    admission into the Dhamma and Vinaya. Ananda gives reasons for each action and
    confesses out of faith in the elders while saying he sees no fault.'
  language: English with transliterated Indic terms
  quote_policy: summarized
