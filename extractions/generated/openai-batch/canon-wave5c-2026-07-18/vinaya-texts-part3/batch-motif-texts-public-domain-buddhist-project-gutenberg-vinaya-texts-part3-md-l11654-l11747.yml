canonical_text:
  quote: ''
  summary: Devadatta's elephant-keepers release the fierce elephant Nalagiri onto
    the road as the Blessed One enters Rajagaha for alms with Bhikkhus. The Bhikkhus
    warn him, spectators gather and comment, and the Blessed One pacifies the charging
    elephant by pervading it with love, touching its forehead, and admonishing it
    in verse. Nalagiri reverently takes dust from the Blessed One's feet, sprinkles
    it on its head, withdraws while bowing, and returns to its stable.
  language: English translation with Pali names and terms
  quote_policy: summarized
