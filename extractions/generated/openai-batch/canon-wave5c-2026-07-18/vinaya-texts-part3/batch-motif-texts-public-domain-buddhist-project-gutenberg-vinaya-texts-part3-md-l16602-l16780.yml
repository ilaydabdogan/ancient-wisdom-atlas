canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya procedures and rulings concerning Bhikkhunis:
    a deputed Bhikkhuni invites the Bhikkhu-saṅgha to point out faults; Bhikkhunis
    are forbidden to perform certain official acts toward Bhikkhus; rules are made
    about Bhikkhunis using vehicles, with exceptions for sickness and alternate conveyances;
    and the courtesan Addhakāsi, prevented by danger on the road from coming to the
    Saṅgha for full initiation, may receive upasampadā through a competent Bhikkhuni
    messenger.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deputed Bhikkhuni, accompanied by the Bhikkhuni-saṅgha, is instructed to
    approach the Bhikkhu-saṅgha, arrange her robe over one shoulder, bow, sit on her
    heels, stretch forth joined palms, and recite an invitation for correction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The invitation asks the Bhikkhu-saṅgha to speak to the Bhikkhuni-saṅgha about
    faults heard, seen, or suspected, so that offenses perceived may be confessed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The invitation formula is to be repeated a second and third time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bhikkhunis are described as inhibiting Bhikkhus from Uposatha, Pavarana, Exhortation,
    issuing commands to them, asking leave to rebuke them, warning them of supposed
    offenses, or calling on them to remember offenses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One rules that a Bhikkhuni is not to perform those official acts
    toward a Bhikkhu; such an act is invalid and entails a dukkaṭa offense.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bhikkhus perform the same listed acts toward Bhikkhunis, and the passage states
    that the contrary decision is given.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Chabbaggiya Bhikkhunis have themselves carried in vehicles yoked with
    cows and a bull between them, or bulls and a cow between them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: People complain that such vehicle use is what is done at the feast of the
    Ganga and the Mahi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Blessed One prohibits a Bhikkhuni from being carried in a vehicle, with
    disciplinary consequences stated for violation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a certain Bhikkhuni is sick and unable to go on foot, the Blessed One
    allows the use of a carriage for a sick Bhikkhuni.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Blessed One allows carts yoked with cows or bulls, or drawn by hand, and
    later allows a litter or sedan chair because a Bhikkhuni is distressed by cart
    jolting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A courtesan named Addhakāsi has adopted religious life under the Bhikkhunis
    and wants to go to Sāvatthi to receive upasampadā from the Blessed One himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Men described as of abandoned life hear of Addhakāsi’s intended journey and
    beset the road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After learning that the road is beset, Addhakāsi sends a messenger to the
    Blessed One asking what course of action she should adopt in order to receive
    upasampadā.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Blessed One allows upasampadā initiation for Bhikkhunis even by a messenger.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage rejects a Bhikkhu, female student, male novice, female novice,
    or ignorant and incompetent Bhikkhuni as messenger, and permits a learned, competent
    Bhikkhuni as messenger.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The authorized Bhikkhuni messenger is instructed to go before the Saṅgha,
    perform respectful bodily gestures, and request initiation for the absent candidate
    because she is prevented by danger from coming before the Saṅgha.
  category: action
  evidence_refs:
  - ev:10
