canonical_text:
  quote: ''
  summary: Moggallana teaches the Bhikkhus, who obtain the Eye of Truth. Sariputta
    and Moggallana bring five hundred Bhikkhus back to the Blessed One. Kokilika wakes
    Devadatta and reports that the Bhikkhus have been led away, after which hot blood
    comes from Devadatta's mouth. Sariputta asks the Blessed One about receiving schismatic
    Bhikkhus, and the Blessed One prescribes confession rather than reordination.
    The Blessed One then tells a parable of great elephants who clean lotus stalks
    before eating them and young calves who imitate them badly by eating mud, applying
    the simile to Devadatta. He also lists eight qualifications of an emissary and
    says Sariputta possesses them.
  language: English
  quote_policy: summarized
