canonical_text:
  quote: ''
  summary: The passage gives disciplinary rules for Bhikkhunis. It prohibits certain
    girdles, fringed materials, body-scrubbing and slapping treatments, cosmetics,
    facial and bodily marks, public display, entertainments and trades, colored or
    decorated robes, jackets, and certain fiber dresses. It also adjudicates a dispute
    over a dying Bhikkhuni’s set of necessaries, assigning such property to the Bhikkhuni-sangha
    rather than the Bhikkhu-sangha, with a reciprocal rule for Bhikkhus and male novices.
  language: English translation with Pali terms
  quote_policy: summarized
