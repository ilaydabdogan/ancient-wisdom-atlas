  summary: The Blessed One and the Order of Bhikkhus are served a meal by Anathapindika.
    After the meal, Anathapindika asks the Blessed One to spend the rainy season at
    Savatthi. The Blessed One answers that Tathagatas take pleasure in solitude, and
    Anathapindika says he understands. The Blessed One gives religious discourse,
    departs, and the passage notes Anathapindika's broad social influence. Footnotes
    explain formulaic and lexical details and compare related expressions in other
    texts.
