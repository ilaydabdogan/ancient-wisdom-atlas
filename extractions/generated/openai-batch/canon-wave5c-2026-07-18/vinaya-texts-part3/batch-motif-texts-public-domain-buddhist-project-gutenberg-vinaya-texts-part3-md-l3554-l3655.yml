canonical_text:
  quote: ''
  summary: The passage regulates materials and fittings for Bhikkhus’ bowls. It forbids
    bowls made of precious or decorative materials and allows iron and clay bowls.
    It then addresses worn or ill-fitting bowl-bottom supports, permitting certain
    plain metal supports, shaping them, and using split crocodiles’ teeth to secure
    them. It also reports that a subgroup of Bhikkhus used gold or silver supports
    and decorated painted bowl-bottom linings, provoking public murmuring and further
    prohibitions.
  language: English
  quote_policy: summarized
