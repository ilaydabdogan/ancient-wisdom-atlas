canonical_text:
  quote: A Bhikkhuni is not, O Bhikkhus, to wear a hipstring for constant use.
  summary: The passage gives a sequence of monastic clothing rulings for Bhikkhunis.
    A thigh-cloth is allowed, then a fastening thread is allowed after the cloth slips,
    then a loin-cloth and hip-string are allowed after the thread breaks. The Chabbaggiya
    Bhikkhunis are then said to wear the hip-string constantly, prompting public criticism.
    The final rule prohibits constant use of the hip-string by a Bhikkhuni, while
    allowing it for one who is in her courses. Footnotes explain the garments and
    note related prohibitions for Bhikkhus.
  language: English
  quote_policy: quoted
