canonical_text:
  quote: ''
  summary: Pupils of the Chabbaggiya Bhikkhus reserve rooms and sleeping places for
    themselves and their superiors ahead of the monastic community led by the Buddha,
    leaving Sariputta without a sleeping place so that he sits at the foot of a tree.
    The Buddha convenes the community, rebukes the conduct, asks who deserves the
    best seat, water, and food, and then begins a story of three animal friends near
    a banyan tree on the lower slopes of the Himalayas who decide to determine which
    of them is eldest and honor that one.
  language: English
  quote_policy: summarized
