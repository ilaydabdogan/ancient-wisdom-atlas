canonical_text:
  quote: ''
  summary: The passage gives the formal procedure for appointing Dabba the Mallian
    as regulator of lodging-places and apportioner of rations. After his appointment
    by communal resolution and silence, Dabba assigns lodgings to Bhikkhus by division
    and practice group. For late-arriving Bhikkhus he uses firelight to point out
    lodgings; some Bhikkhus intentionally arrive late to see his Iddhi and request
    distant lodging sites.
