canonical_text:
  quote: ''
  summary: The passage gives permissions for Bhikkhus to use a strainer fixed to a
    ladle and a regulation water-pot after a small cloth proves insufficient. It then
    narrates that two Bhikkhus were traveling in Kosala; one was admonished for a
    transgression, bore a grudge, later refused to lend his strainer when the other
    was thirsty, and the other died of thirst. The grudge-bearing Bhikkhu reported
    the matter at the Arama. Notes identify related Vinaya and Jataka parallels and
    a variant without the death.
