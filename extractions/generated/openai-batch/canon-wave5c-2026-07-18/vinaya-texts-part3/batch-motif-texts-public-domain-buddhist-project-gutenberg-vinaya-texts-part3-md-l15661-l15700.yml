canonical_text:
  quote: ''
  summary: A Vinaya passage describes the Bhikkhuni community going together to Exhortation,
    public complaint about this, and the Blessed One's resulting rule limiting how
    many Bhikkhunis may go together. It prescribes a formal posture and speech for
    requesting Exhortation from the Bhikkhu community and gives the Patimokkha reciter
    a procedure for identifying an appointed Bhikkhu to exhort the Bhikkhunis.
  language: English
  quote_policy: summarized
