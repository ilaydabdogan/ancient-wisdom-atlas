canonical_text:
  quote: ''
  summary: 'The passage describes practical allowances for monks: a cloister hall
    is permitted when monks suffer from heat and cold while walking in the open air;
    coverings, plastering, coloring, decorative work, hooks, cupboards, and robe-hanging
    fixtures are allowed; the same provisions are repeated for a hot-bath house; and
    a door with structural fittings is allowed for a bath house that lacked one.'
