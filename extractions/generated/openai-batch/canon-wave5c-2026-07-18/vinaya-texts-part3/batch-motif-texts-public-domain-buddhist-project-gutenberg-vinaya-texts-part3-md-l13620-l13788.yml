canonical_text:
  quote: ''
  summary: The passage gives rules of conduct for Bhikkhus concerning putting away
    empty water vessels or utensils, conduct for monks dwelling in the woods, preparedness
    with water, fire, walking staves, and knowledge of constellations and directions,
    and lodging-place conduct concerning cleaning a Vihara and beating bedding only
    where dust will not affect monks, buildings, or water.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk who sees an empty drinking-water pot, washing-water pot, or chamber
    utensil should put it in its proper place, and if unable to do so alone should
    call someone else so they can put it away together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group of Bhikkhus dwelling in the woods had not provided drinking-water,
    washing-water, fire, drill sticks, or tinder, and did not know the constellation
    stations or directions of the sky.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thieves came to the forest-dwelling Bhikkhus and asked whether they had water,
    fire, fire-making materials, knowledge of the moon's constellation, and knowledge
    of direction.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the Bhikkhus answered negatively or said they did not know, the thieves
    said that these men were thieves and not Bhikkhus, beat them, and went away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bhikkhus reported the incident to other Bhikkhus, who reported it to the
    Blessed One; the Blessed One delivered a discourse and established a rule of conduct
    for Bhikkhus dwelling in the woods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A forest-dwelling Bhikkhu is instructed to rise early, pack his bowl, arrange
    his robe, put on sandals, order wooden and earthenware utensils, close the doorway
    and lattice, and leave his lodging-place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When about to enter a village, the forest-dwelling Bhikkhu is instructed to
    remove, clean, and bag his sandals and arrange his dress for entering the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After leaving a village, the forest-dwelling Bhikkhu is instructed to bag
    his bowl, carry his robes on his head, put on sandals, and go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Bhikkhu living in the woods should keep drinking-water, washing-water, fire,
    drill sticks, tinder, and walking staves ready, and should learn the moon's constellation
    stations and the directions of the sky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: While some Bhikkhus were making robes in the open air, the Wabbaggiya Bhikkhus
    beat bedding to windward of them and covered the robe-makers with dust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The moderate Bhikkhus complained, and the Blessed One established a rule of
    conduct for lodging-places.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If a Vihara is dirty, the monk staying there should clean it, first moving
