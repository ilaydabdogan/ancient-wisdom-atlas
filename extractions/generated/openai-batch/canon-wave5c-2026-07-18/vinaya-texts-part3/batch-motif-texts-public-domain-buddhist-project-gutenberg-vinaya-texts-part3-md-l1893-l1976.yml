  summary: The passage defines relations among offences, legal questions, and official
    duties in Vinaya dispute settlement. It distinguishes cases with or without offence,
    describes official business involving the Saṅgha and formal procedures, lists
    teacher/preceptor duties that are business but not legal questions, and states
    that disputes may be settled by presence and by majority of the Saṅgha.
  language: English with Pali technical terms
