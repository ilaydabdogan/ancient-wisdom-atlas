canonical_text:
  quote: ''
  summary: A disciplinary passage recounts bhikkhus transferring Sangha sleeping accommodation
    to one member, the complaint that follows, and the Blessed One's ruling that several
    classes of communal property are untransferable. A later scene describes the Blessed
    One traveling from Savatthi to Kiṭa Hill with many bhikkhus; followers of Assaji
    and Punabbasu divide communal sleeping accommodation and refuse places for Sariputta
    and Moggallana, after which the Blessed One sends bhikkhus to request prepared
    sleeping places.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of bhikkhus decides to hand over all sleeping accommodation that is
    Sangha property to one of themselves and to use it as if it belonged to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Incoming bhikkhus ask for sleeping accommodation and are told that there are
    no beds belonging to the Sangha because all have been given to one member.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The incoming bhikkhus ask whether Sangha property has been made away with,
    and the transferors answer that it has.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Moderate bhikkhus murmur about the matter and report it to the Blessed One.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Blessed One asks whether bhikkhus have made away with Sangha property,
    receives confirmation, and rebukes them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Blessed One states that five classes of things are untransferable and
    may not be disposed of by the Sangha, a smaller company, or an individual; a disposal
    is void and the disposer is guilty of a thullaccaya offense.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The listed untransferable classes include park or park-site, vihara or vihara-site,
    bedding furniture, brass vessels and tools, and plant materials, clay, wooden
    things, and crockery.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: After dwelling at Savatthi, the Blessed One travels toward Kiṭa Hill with
    about five hundred bhikkhus, besides Sariputta and Moggallana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Followers of Assaji and Punabbasu hear of the journey, decide to divide all
    Sangha sleeping accommodation, call Sariputta and Moggallana men of sinful desires,
    and say they will not provide sleeping places for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After arriving at Kiṭa Hill, the Blessed One instructs bhikkhus to tell the
    followers of Assaji and Punabbasu to prepare sleeping places for himself, the
    Bhikkhu-Sangha, Sariputta, and Moggallana.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A translator's note connects the first episode with the 82nd Pācittiya rule
    against diverting property dedicated to the Sangha to individual use.
  category: other
  evidence_refs:
  - ev:6
