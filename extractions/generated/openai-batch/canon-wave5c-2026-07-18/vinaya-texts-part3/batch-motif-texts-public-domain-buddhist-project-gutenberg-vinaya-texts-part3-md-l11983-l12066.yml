canonical_text:
  quote: ''
  summary: Devadatta is warned that division in the Sangha is grievous. He tells Ananda
    that he intends to perform Uposatha and formal acts of the Order apart from the
    Blessed One and the Bhikkhu-sangha. Ananda reports this to the Blessed One, who
    utters a moral verse. On Uposatha day Devadatta distributes voting tickets for
    the Five Points; five hundred recently ordained Vesaliyan Vaggian bhikkhus, unaware
    of his intentions, take the tickets. Devadatta thereby creates a division and
    goes to Gaya-sisa hill with them. Sariputta and Moggallana then approach the Blessed
    One.
  language: English translation with Pali terms
  quote_policy: summarized
