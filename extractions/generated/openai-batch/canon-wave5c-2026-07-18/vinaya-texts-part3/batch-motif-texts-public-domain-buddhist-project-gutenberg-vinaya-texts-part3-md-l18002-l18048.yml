canonical_text:
  quote: I do not allow any money to be given to me
  summary: Yasa refuses money. The Va^fian/Vaggian Bhikkhus of Vesali accuse him of
    alienating faithful followers and carry out the Act of Reconciliation against
    him. Yasa invokes a rule attributed to the Blessed One requiring a companion messenger,
    receives such a companion, enters Vesali, and addresses the believing laymen.
    He says he is accused because he distinguishes Dhamma and Vinaya from what is
    against Dhamma and Vinaya. He then begins to cite an occasion when the Blessed
    One stayed at Savatthi in Jetavana and exhorted the Bhikkhus.
  language: English
  quote_policy: quoted
