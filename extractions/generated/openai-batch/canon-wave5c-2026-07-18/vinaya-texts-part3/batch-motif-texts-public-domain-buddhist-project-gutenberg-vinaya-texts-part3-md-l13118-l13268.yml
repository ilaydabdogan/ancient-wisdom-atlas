canonical_text:
  quote: ''
  summary: The passage gives conduct rules for incoming, resident, and departing Bhikkhus.
    It covers cleaning rooms and providing water, resident duties toward incoming
    Bhikkhus according to seniority, instructions about lodging and local rules, and
    procedures for securing communal property and bedding before departure, especially
    if a Vihara leaks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If monastery spaces such as cells, store-rooms, refectories, fire rooms, or
    privies are dusty, they should be swept; missing drinking, washing, or rinsing-pot
    water should be provided.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Resident Bhikkhus failed to prepare seats, foot-washing items, water, help
    with bowls and robes, salutations for seniors, and beds for incoming Bhikkhus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moderate Bhikkhus complained and reported the matter to the Blessed One, after
    which a rule of conduct for resident Bhikkhus was established.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For an incoming senior Bhikkhu, a resident Bhikkhu should prepare a seat and
    foot-washing items, meet him, take his robe and bowl, ask about drinking water,
    and wipe his sandals with dry and wet cloths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An incoming Bhikkhu should be saluted, given a bed, and informed about room
    occupancy, lawful and unlawful resorts, families in want, retiring places, water,
    staves, the Saṃgha conference place, and entry and departure times.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the incoming Bhikkhu is junior, the resident Bhikkhu keeps his seat and
    instructs him where to place bowl and robe, where to sit, where to find water
    and sandal-cleaning cloths, and where his bed is.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bhikkhus about to leave departed without arranging wooden articles and crockery,
    closing doors and lattices, or assigning sleeping-places to anyone; the objects
    were spoiled and the sleeping-places unprotected.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A departing Bhikkhu should arrange wooden and earthenware articles, close
    doors and lattices, and assign sleeping-places to a remaining Bhikkhu, Samawera,
    or Aramika; if none remain, he should stack furniture and bedding before leaving.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a Vihara leaks, the departing Bhikkhu should repair or have it roofed if
    possible, or move and stack bedding and furniture in a dry place, village, or
    open air and cover them with grass or leaves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Editorial notes in the passage identify or compare some paragraphs and expressions
    with other Vinaya passages.
  category: other
  evidence_refs:
  - ev:9
