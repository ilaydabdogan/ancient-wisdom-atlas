canonical_text:
  quote: ''
  summary: Thera Bhikkhus go to Vesali to settle a matter. Revata arranges for Sambhuta
    Sanavasi to question the very senior elder Sabbakami about ten points. Revata
    stays in Sabbakami's vihara; each monk remains awake out of regard for the other.
    Late in the night Sabbakami asks Revata about his long-standing way of life, and
    Revata says he has continued in the sense of love.
  language: ''
