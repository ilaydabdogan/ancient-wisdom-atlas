canonical_text:
  quote: ''
  summary: A king sends men to obtain a mango, but the park-keepers report that the
    Bhikkhus have plucked and eaten even the young mangoes. The king comments that
    the fruit was well used but that the Blessed One has exalted moderation; the public
    criticizes the monks. The Blessed One forbids Bhikkhus to eat mangoes, then clarifies
    that mango peel and certain altered or seedless fruit may be eaten. A later section
    states that a Bhikkhu died from a snakebite and the matter was reported to the
    Blessed One; accompanying notes connect the legend with the Khandha-vatta Jataka
    and serpent names from ancient mythology.
  language: English
  quote_policy: summarized
