  summary: Procedural Vinaya instructions describe how lodging furnishings should
    be aired, cleaned, beaten free of dust, and returned to their proper places; how
    an incoming Bhikkhu should store his bowl and robe; and how window-spaces and
    lattices should be managed against dusty winds and cold weather. Translator notes
    identify parallels with passages in the Mahavagga.
