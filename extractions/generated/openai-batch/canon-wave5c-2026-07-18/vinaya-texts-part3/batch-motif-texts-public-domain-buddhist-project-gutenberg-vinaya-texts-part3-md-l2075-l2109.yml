canonical_text:
  quote: ''
  summary: The passage gives procedural instructions for resident Bhikkhus receiving
    incoming Bhikkhus with a legal question. The residents address the incoming group
    according to relative seniority, take counsel, decide whether they can settle
    the question according to the Dhamma, Vinaya, and the teaching of the Master,
    and accept the matter only if the incoming Bhikkhus disclose its origin and course
    and agree to the proposed mode of settlement.
  language: English
