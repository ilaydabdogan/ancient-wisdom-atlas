  quote: ''
  summary: 'The passage classifies sources of legal questions: censure may arise from
    bodily traits or speech qualities that lead people to find fault; offences arise
    from six combinations of deed, word, and thought; legal questions of business
    arise from the Saṅgha. Footnotes give commentary on a term for dwarf and compare
    voice epithets with another Vinaya passage.'
