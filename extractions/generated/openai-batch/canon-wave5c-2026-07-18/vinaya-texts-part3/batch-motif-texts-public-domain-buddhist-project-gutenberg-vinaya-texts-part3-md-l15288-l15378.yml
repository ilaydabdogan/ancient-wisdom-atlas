canonical_text:
  quote: ''
  summary: The passage gives Gotami criteria for recognizing Dhamma, Vinaya, and the
    Master's teaching by their conducing to peace, veneration, wanting little, seclusion,
    zeal, and contentment. It then records rulings about reciting the Patimokkha to
    Bhikkhunis, who may recite it, instruction in its recitation, confession of faults
    by Bhikkhunis, and public complaints about Bhikkhus and Bhikkhunis interacting
    in residential or public settings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gotami is told to regard doctrines that conduce to peace, veneration, wanting
    little, seclusion, zeal, and content as Dhamma, Vinaya, and the teaching of the
    Master.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Patimokkha was not being recited to the Bhikkhunis, and the Blessed One
    allowed it to be recited to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Bhikkhunis asked by whom the Patimokkha should be recited, the Blessed
    One allowed Bhikkhus to recite it to Bhikkhunis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhikkhus went to the residence of the Bhikkhunis and recited the Patimokkha
    there; people murmured and expressed suspicion about them taking pleasure together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One prohibited Bhikkhus from reciting the Patimokkha to Bhikkhunis
    at the Bhikkhunis' residence, attached a dukkata offense, and allowed Bhikkhunis
    to recite it to Bhikkhunis.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Bhikkhunis did not know how to recite the Patimokkha, the Blessed One
    allowed Bhikkhus to tell them how to recite it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bhikkhunis did not confess faults they had committed, and the Blessed One
    ruled that a Bhikkhuni must not leave a fault unconfessed, with a dukkata offense
    for doing so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Bhikkhunis did not know how to confess faults, the Blessed One allowed
    Bhikkhus to instruct them, and also allowed Bhikkhus to receive a confession of
    a fault from Bhikkhunis.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: On seeing a Bhikkhu in public places, Bhikkhunis placed their bowl on the
    ground, arranged their robes over one shoulder, crouched on their heels, stretched
    forth joined hands, and confessed a fault.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: People murmured and complained in response to the Bhikkhunis' public confessions
    before Bhikkhus.
  category: speech
  evidence_refs:
  - ev:8
