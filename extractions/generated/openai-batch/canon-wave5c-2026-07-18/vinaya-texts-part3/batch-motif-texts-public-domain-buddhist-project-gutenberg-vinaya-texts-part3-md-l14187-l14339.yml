canonical_text:
  quote: ''
  summary: The passage gives ocean similes for the doctrine and discipline, an ecstatic
    utterance about rain falling on what is covered rather than revealed, and rules
    about Uposatha, Patimokkha recitation, guilt, purity, and lawful or unlawful interdiction
    from hearing the Patimokkha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One says the great ocean has one taste, salt, and that the doctrine
    and discipline have one flavour, emancipation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great ocean is described as full of various gems; the doctrine and discipline
    are described as full of meditations, struggles, roads to Iddhi, moral powers,
    moral senses, wisdom, and the noble eightfold Path.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The great ocean is described as the dwelling-place of named mighty beings
    and very large creatures; the doctrine and discipline are described as the resort
    of people who have entered or realized the fruits of the Paths, including Arahatship.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bhikkhus take delight in the doctrine and discipline by constant perception
    of the eight marvellous and wonderful qualities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Blessed One gives an ecstatic utterance saying that rain falls heavily
    on what is covered and not on what is revealed, and instructs that what has been
    concealed should be revealed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One says he will no longer hold Uposatha or recite the Patimokkha,
    and instructs the Bhikkhus to do these themselves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One states that it is impossible and inexpedient for the Tathagata
    to hold Uposatha and recite the Patimokkha before an assembly that is not pure.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: One who has committed an offence is not to listen to the Patimokkha; a guilty
    listener incurs a dukkaṭa, and the Bhikkhus are allowed to interdict the Patimokkha
    for such a person.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A procedural formula is prescribed for proposing interdiction of the Patimokkha
    in the midst of the Saṅgha when the accused individual is present.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bhikkhus named in the passage as AT^abbaggiya or AAabbaggiya listen to
    the Patimokkha while guilty, thinking that no one knows they are guilty.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Thera Bhikkhus who understand the thoughts of other people tell the Bhikkhus
    that specific AT^abbaggiya or AAabbaggiya Bhikkhus are listening while guilty.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The AT^abbaggiya or AAabbaggiya Bhikkhus preemptively interdict the Patimokkha
    to pure and innocent Bhikkhus without ground and without cause.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Moderate Bhikkhus complain about the matter, and the matter is told to the
    Blessed One, who rebukes the AT^abbaggiya or AAabbaggiya Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The Blessed One states that the Patimokkha is not to be interdicted to pure
    and innocent Bhikkhus without ground and cause, and that doing so incurs a dukkaṭa.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'The passage distinguishes legal and illegal inhibition of the Patimokkha:
    inhibition for breach of morality without ground is illegal, while inhibition
    for breach of morality with good ground is legal.'
  category: relationship
  evidence_refs:
  - ev:11
