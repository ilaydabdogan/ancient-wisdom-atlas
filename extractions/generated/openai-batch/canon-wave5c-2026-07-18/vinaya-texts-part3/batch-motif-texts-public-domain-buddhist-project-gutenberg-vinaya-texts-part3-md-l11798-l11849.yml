canonical_text:
  quote: ''
  summary: The passage gives a rule limiting alms-taking at lay houses to groups of
    no more than three, with reasons connected to restraint, communal stability, and
    compassion for laity. It then narrates Devadatta approaching several named associates
    to propose making a division in Gotama's Sangha; Kokalika objects that Gotama
    is mighty and powerful, and Devadatta proposes presenting five demands.
  language: English
