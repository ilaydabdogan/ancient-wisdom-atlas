  quote: "“And which are the ten kinds of inhibition of the Patimokkha which are illegal?”"
  summary: The passage enumerates nine and ten kinds of inhibition of the Patimokkha,
    especially cases in which inhibition is illegal. It lists conditions involving
    a Bhikkhu’s absence from the assembly, ongoing or absent discussion of offences,
    abandonment of precepts, acceptance of a legally prescribed concord, withdrawal
    of such acceptance, and whether a charged Bhikkhu has been suspected, seen, or
    heard to have committed offences.
