canonical_text:
  quote: ''
  summary: 'The passage gives monastic rules about lodging-place allotments: monks
    may not reserve allotted lodgings permanently, may retain them for the three months
    of the rainy season, and must observe three named allotment times. It then recounts
    Upananda the Sakyan taking lodging allotments in both Savatthi and a country-place,
    being questioned by local monks, and being rebuked by the Blessed One after admitting
    he took possession of two places.'
  language: English
  quote_policy: summarized
