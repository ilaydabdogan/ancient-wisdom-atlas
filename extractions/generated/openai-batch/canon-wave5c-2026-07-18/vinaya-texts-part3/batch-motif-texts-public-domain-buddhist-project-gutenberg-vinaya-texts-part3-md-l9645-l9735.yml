- id: obs:2
  text: The Blessed One forbids retaining allotted lodging-places permanently and
    allows retention for the three months of the rainy season, but not for the dry
    season.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The Blessed One identifies three allotments of lodging-places: earlier, later,
    and intermediate.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The earlier allotment is dated to the day after the full moon of Asaḷha, the
    later a month after that full moon, and the intermediate the day after the Pavāraṇā
    ceremony with reference to the following rainy season.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Upananda the Sakyan had a lodging allotted to him in Savatthi and then also
    had a lodging allotted in a country-place where a Saṅgha community resided.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bhikkhus at the country-place describe Upananda as strife-making, quarrelsome,
