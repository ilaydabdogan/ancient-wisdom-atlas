canonical_text:
  quote: ''
  summary: The passage gives a formal Saṅgha procedure for confessing and settling
    offences between divided parties, using the image of offences being covered over
    as with grass and approval by silence. It then reports Bhikkhu A7zanna intervening
    on behalf of Bhikkhunis in a dispute with Bhikkhus, followed by the Blessed One’s
    classification of four kinds of legal questions and a definition of dispute-based
    legal questions through paired claims about Dhamma, Vinaya, the Tathagata, and
    offences.
  language: English
  quote_policy: summarized
