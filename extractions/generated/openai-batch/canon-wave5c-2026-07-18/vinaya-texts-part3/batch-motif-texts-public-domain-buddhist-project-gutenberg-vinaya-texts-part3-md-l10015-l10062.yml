canonical_text:
  quote: ''
  summary: Some Bhikkhus say that sleeping accommodation belonging to the Saṅgha has
    all been divided, welcome the Blessed One to any Vihara, but refuse sleeping-places
    to S&riputta and Moggallana. The Blessed One asks whether Saṅgha property has
    been divided, receives confirmation, and declares that five things are unapportionable
    and not to be divided. The passage then shifts to the Blessed One traveling from
    Ki/a Hill to A/avi and staying at the Agga/ava Shrine, followed by an incomplete
    notice about the Bhikkhus of A/avi.
  language: English translation with transliterated Pali names and OCR/transliteration
    artifacts
