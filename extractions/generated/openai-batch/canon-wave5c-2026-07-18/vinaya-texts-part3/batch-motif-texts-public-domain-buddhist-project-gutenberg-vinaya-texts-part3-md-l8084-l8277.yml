canonical_text:
  quote: ''
  summary: 'A Vinaya passage gives rules and allowances concerning monastic dwellings
    and furniture: wall-finishing materials, prohibited and permitted wall images,
    privacy screens and inner chambers, structural protections against decay, rain,
    and a falling snake, storage devices against pests and torn robes, and verandahs
    or eaves for dwellings.'
  language: English
  quote_policy: summarized
