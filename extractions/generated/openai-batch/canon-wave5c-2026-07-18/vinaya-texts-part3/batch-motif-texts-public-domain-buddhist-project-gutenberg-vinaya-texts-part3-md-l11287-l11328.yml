canonical_text:
  quote: ''
  summary: The Blessed One instructs Sariputta to proclaim Devadatta throughout Rajagaha.
    Sariputta objects that he formerly praised Devadatta there, and the Blessed One
    tells him that, just as the former praise was true, he should now proclaim Devadatta
    while speaking truth. The Sangha is to appoint Sariputta formally to this office.
    Sariputta enters Rajagaha with Bhikkhus and makes the proclamation. Some people
    respond by accusing the Sakyaputtiya Samanas of jealousy over Devadatta's gains
    and hospitality, while another believing group is introduced before the excerpt
    breaks off.
  language: English
  quote_policy: summarized
