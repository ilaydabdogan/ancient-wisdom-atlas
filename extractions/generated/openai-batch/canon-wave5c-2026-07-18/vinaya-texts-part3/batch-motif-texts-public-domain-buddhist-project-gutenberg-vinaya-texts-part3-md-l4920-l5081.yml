canonical_text:
  quote: ''
  summary: A Vinaya passage lists practical problems in the bath-room, antechamber,
    and cell, followed by allowances for scenting clay, pouring and managing water,
    roofing, flooring, drainage, stools, and enclosure. It then reports bhikkhus performing
    salutations, services, exchanges, and eating or drinking while naked; the Blessed
    One prohibits these acts while naked and assigns a dukkaṭa penalty. The passage
    ends by noting that robes placed on the bath-room ground became dirty.
  language: English
