canonical_text:
  quote: ''
  summary: A householder is told that it is rare even to hear news of a Buddha and
    that he should visit the Blessed One the next morning. Anatha Pindika is so intent
    on visiting the Buddha that he repeatedly wakes in the night thinking dawn has
    come. He goes to the gate leading to Sitavana; celestial beings open it. After
    he leaves the city, darkness arises and he becomes afraid and wants to turn back.
    The invisible Yakkha Sivaka makes a sound and begins an encouraging speech listing
    rich gifts.
  language: English
