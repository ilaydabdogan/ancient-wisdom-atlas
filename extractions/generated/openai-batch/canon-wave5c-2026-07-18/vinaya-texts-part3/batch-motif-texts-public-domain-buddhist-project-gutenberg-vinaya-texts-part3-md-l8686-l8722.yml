canonical_text:
  quote: ''
  summary: A householder attains the pure and spotless Eye of the Truth, understands
    that whatever begins must dissolve, overcomes doubt, praises the Blessed One’s
    teaching through images of restoration, disclosure, road-guidance, and light,
    takes refuge in the Blessed One, the Truth, and the Order, asks to be accepted
    as a disciple, offers the next day’s meal to the Blessed One and the Order of
    Bhikkhus, receives silent consent, bows, passes with the Blessed One on his right,
    and departs. The excerpt ends with an incomplete sentence about the S&tthi of
    Ragagaha hearing something.
  language: English
  quote_policy: summarized
