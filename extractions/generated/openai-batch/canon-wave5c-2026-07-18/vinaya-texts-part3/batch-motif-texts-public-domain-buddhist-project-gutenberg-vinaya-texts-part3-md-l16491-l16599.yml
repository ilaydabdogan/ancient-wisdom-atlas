canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya regulations concerning Bhikkhunis: limiting seniority
    rights to seats in the dining hall, requiring Bhikkhunis to hold Pavāraṇa, coordinating
    Bhikkhuni Pavāraṇa with the Bhikkhu-saṅgha, adjusting the timing over two days,
    and deputing one learned Bhikkhuni to make the Pavāraṇa invitation before the
    Bhikkhu-saṅgha. Editorial notes also compare some rules with corresponding Bhikkhu
    rules and other Bhikkhuni disciplinary categories.'
  language: English with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says the three nissayas correspond to the first, second,
    and fourth of the four Resources for Bhikkhus, while the third is forbidden to
    Bhikkhunis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Exclusive possession of the first eight seats and seat rights by seniority
    are prescribed only for the dining hall; elsewhere seniority gives no exclusive
    right to seats.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhikkhunis are not to omit holding Pavāraṇa; omission is to be dealt with
    according to law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhikkhunis are not to hold Pavāraṇa only by themselves and apart from the
    Bhikkhu-saṅgha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhikkhunis holding Pavāraṇa only with the Bhikkhus, and not separately by
    themselves, disturbed the Bhikkhu-saṅgha meeting and are not to do so.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Bhikkhunis spent the time before noon holding Pavāraṇa and had no time
    for the early meal, the Blessed One prescribed that they hold Pavāraṇa in the
    afternoon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When afternoon observance left insufficient time to complete their own ceremony
    and participate in that of the Bhikkhus, the Blessed One allowed Bhikkhunis to
    hold their own Pavāraṇa one day and the Pavāraṇa with the Bhikkhus the next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When every member of the Bhikkhuni-saṅgha declared her Pavāraṇa before the
    Bhikkhu-saṅgha and disturbed proceedings, the Blessed One prescribed that one
    learned and competent Bhikkhuni be deputed to make the invitation on behalf of
    the Bhikkhuni-saṅgha.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The deputation procedure requires asking the Bhikkhuni whether she is willing,
    then having a learned and discreet Bhikkhuni lay a formal motion before the Saṅgha
    to depute N. N.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: An editorial footnote identifies the rule about not omitting Pavāraṇa with
