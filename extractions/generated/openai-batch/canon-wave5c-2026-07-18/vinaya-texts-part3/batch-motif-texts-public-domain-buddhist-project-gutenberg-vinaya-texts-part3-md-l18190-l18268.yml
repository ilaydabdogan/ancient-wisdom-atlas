canonical_text:
  quote: "“yet have I never said in any way whatever that gold or silver may be sought
    after or accepted.”"
  summary: The passage presents a Vinaya dispute over whether monks may seek or accept
    gold and silver. Yasa defends the prohibition by appealing to the Blessed One’s
    rule, gains lay support, and is then targeted by Vajjian Bhikkhus for suspension.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The quoted teaching says that allowing gold and silver entails allowing the
    five kinds of sensual pleasure, and that one who allows these pleasures does not
    follow the rule of the Samaṇas or the sons of Sakya.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quoted teaching permits seeking grass, wood, a conveyance, or a servant
    when needed, but denies that gold or silver may be sought or accepted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he has been accused of upbraiding, reviling, and dissatisfying
    faithful followers because he identifies what is against the Dhamma or Vinaya
    as against them and what is Dhamma or Vinaya as such.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blessed One is said to have laid down, at Rajagaha in connection with
    Upananda the Sakyan, a precept forbidding gold and silver.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
