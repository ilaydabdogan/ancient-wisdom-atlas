canonical_text:
  quote: ''
  summary: A verse condemns ignorance, intoxicants, sensual acts, taking silver and
    gold, and low arts as stains leading to darkness, death, and rebirth. A narrative
    then recounts how the village headman Maniculaka corrected palace attendants who
    claimed that Sakyaputtiya Samanas may accept silver and gold; he later asks the
    Blessed One whether he spoke rightly, and the Blessed One confirms the prohibition.
  language: English
