canonical_text:
  quote: ''
  summary: The passage introduces the Eighth Khandhaka’s regulations for duties among
    Bhikkhus. At Savatthi in Anatha Pindika’s Arama, incoming Bhikkhus behave improperly
    on arrival, including entering with sandals and other coverings, washing feet
    in drinking-water, and failing to salute senior resident Bhikkhus or ask where
    to sleep. One incoming Bhikkhu forces open an unoccupied room and is frightened
    when a snake falls on his back from the lintel. After complaints, the Blessed
    One establishes a rule of conduct for incoming Bhikkhus, beginning with instructions
    about removing and cleaning sandals before entering an Arama.
  language: English
  quote_policy: summarized
