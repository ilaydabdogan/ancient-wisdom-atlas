canonical_text:
  quote: ''
  summary: The passage classifies legal questions concerning offences as wrong or
    undetermined depending on whether a transgression was committed knowingly, consciously,
    and deliberately. It then classifies legal questions of business according to
    the state of mind of the Bhikkhus performing the business. It also distinguishes
    disputes, legal questions arising from disputes, disputes that are not legal questions,
    legal questions that are not disputes, and matters that are both; quarrels among
    Bhikkhus over matters such as Dhamma or grave offences require formal settlement.
