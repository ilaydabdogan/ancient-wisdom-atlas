canonical_text:
  quote: ''
  summary: The passage first lists conditions under which a Tassa-papiyyasika-kamma
    is valid or invalid, including lawful action by the Saṅgha, proper assembly, hearing
    the accused, and confession. It then says the Saṅgha carried out this Kamma against
    Uvi/a the Bhikkhu. A following section addresses Bhikkhus who, after quarrels
    and disputes, fear that prosecuting one another will cause harshness, ill-feeling,
    and divisions. The Blessed One prescribes settlement by Tiwavattharaka, “the Covering
    over as with grass,” with an assembly procedure, exceptions for serious offences
    and lay-involved matters, and representative confession by an able and discreet
    Bhikkhu.
  language: English translation with Pali technical terms
  quote_policy: summarized
