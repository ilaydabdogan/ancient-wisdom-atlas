canonical_text:
  quote: ''
  summary: 'A Vinaya passage gives rules about ownership and privileges after certain
    admissions, then records cases involving communal or monastery-specific bedding
    and furniture: objects appurtenant to one Vihara are not to be used elsewhere;
    temporary removal is permitted; removal to save goods from a ruined Vihara is
    permitted; and valuable rug or cloth belonging to the Saṅgha may be bartered to
    increase the stock of legally permissible furniture.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a person holding an office admits certain conditions such as madness, bodily
    pain, or suspension for refusal to acknowledge, atone for, or renounce an offence
    or doctrine, the office and privileges remain his.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If that person admits disqualifying statuses or acts including being a eunuch,
    secretly attaching himself to the Saṅgha, going over to the Titthiyas, being an
    animal, committing grave offences, causing schism, shedding a Buddha’s blood,
    or being a hermaphrodite, the Saṅgha becomes the owner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhikkhus used beds elsewhere that were appurtenances of a lay-disciple’s Vihara.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lay-disciple complained, and the matter was reported to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Blessed One states that things appurtenant to one place are not to be
    used in another, with a dukkata offence for doing so.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because the Bhikkhus feared offending, they sat on the ground even in the
    Uposatha Hall or meeting-place, and their legs and robes became soiled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Blessed One allows things to be taken away for a certain time only.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a large Vihara belonging to the Saṅgha went to ruin, the Bhikkhus did
    not remove its bedding because they feared offending.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Blessed One allows things to be removed in order to save them from destruction.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A very valuable rug and a very valuable piece of cloth were among the bedding
