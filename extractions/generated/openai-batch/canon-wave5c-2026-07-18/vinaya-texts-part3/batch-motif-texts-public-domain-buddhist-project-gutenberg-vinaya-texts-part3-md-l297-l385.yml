canonical_text:
  quote: ''
  summary: Bhikkhus ask the venerable Dabba the Mallian to appoint lodging-places
    in several named sites, including caves, groves, a ghat, and a deer-park. Dabba
    lights the way by bursting into flame with his finger burning, leads them, assigns
    lodging equipment, water, a staff, and entry/departure times, and then returns
    to the Bamboo Grove. The passage then describes followers of Mettiya and Bhumma/aka
    as recently received into the Sa7?zgha, lacking merit, and receiving inferior
    lodging, rations, and ordinary food, while Thera Bhikkhus receive special wishing-gifts
    from people of Ra^agaha.
  language: English
  quote_policy: summarized
