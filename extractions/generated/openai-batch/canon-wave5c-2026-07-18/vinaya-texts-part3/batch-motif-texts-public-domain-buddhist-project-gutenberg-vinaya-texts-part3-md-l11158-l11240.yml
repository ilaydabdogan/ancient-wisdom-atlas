canonical_text:
  quote: ''
  summary: Bhikkhus report that Prince Ajatasattu gives lavish morning and evening
    attendance and food to Devadatta. The Blessed One warns them not to envy Devadatta's
    gain, hospitality, and fame, saying these will bring Devadatta decline, hurt,
    and destruction, and illustrating this with animal and plant similes. In a later
    public setting, Devadatta asks the Blessed One to hand over leadership of the
    Bhikkhu-sangha to him; the Blessed One refuses repeatedly.
  language: English translation with Indic transliterations
  quote_policy: summarized
