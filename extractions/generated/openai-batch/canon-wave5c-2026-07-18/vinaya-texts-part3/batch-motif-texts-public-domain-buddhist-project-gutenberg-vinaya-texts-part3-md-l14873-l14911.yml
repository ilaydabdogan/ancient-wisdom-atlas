canonical_text:
  quote: ''
  summary: At Vesali, the Blessed One stays in the Mahavana at the Kutagara Hall.
    Mahapajapati the Gotami cuts off her hair, puts on orange robes, travels with
    Sakya women to Vesali, and stands outside the entrance porch in distress because
    women are not permitted to leave home for the homeless state under the Buddha's
    doctrine and discipline. Ananda sees her, asks why she is there, then goes to
    the Blessed One and requests that women be granted permission to do as she desires.
  language: English
  quote_policy: summarized
