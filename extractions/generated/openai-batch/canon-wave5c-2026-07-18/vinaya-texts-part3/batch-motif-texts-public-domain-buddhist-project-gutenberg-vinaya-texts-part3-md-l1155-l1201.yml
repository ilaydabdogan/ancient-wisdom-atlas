canonical_text:
  quote: ''
  summary: The passage states that voting is invalid in ten cases, including cases
    involving possible or doubtful schism in the Saṅgha, irregular votes, unequal
    voting, and votes not matching the voters' real views. It then says that valid
    voting consists of the reverse of those ten cases. The next section begins with
    Bhikkhu Uva/a, also footnoted as Upavala in Burmese manuscripts, being examined
    before the Saṅgha concerning an offence, alternately denying and confessing it.
  language: English translation with Pali/Sanskritized monastic terms
  quote_policy: summarized
