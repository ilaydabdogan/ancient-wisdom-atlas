canonical_text:
  quote: ''
  summary: 'The excerpt preserves several Vinaya allowances: after an unspecified
    matter is reported, the Blessed One permits lying down in a place after spreading
    something over it; later, after traveling to Ra^agaha and staying at the Ve/uvana
    in the Kalandaka Nivapa, he responds to food scarcity by permitting regulated
    ways of obtaining food. When the Chabbaggiya Bhikkhus keep good food and pass
    worse food to others, he permits the appointment of qualified ration-apportioners
    and a method of distributing food in small heaps with tickets or marks.'
  language: English
  quote_policy: summarized
