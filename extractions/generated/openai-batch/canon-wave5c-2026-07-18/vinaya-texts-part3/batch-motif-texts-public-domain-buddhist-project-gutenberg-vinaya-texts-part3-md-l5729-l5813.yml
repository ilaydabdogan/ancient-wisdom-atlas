canonical_text:
  quote: ''
  summary: A person against whom the Saṅgha has turned down the bowl petitions with
    joined palms for the bowl to be turned up again, repeating the request three times.
    An able Bhikkhu presents a formal motion to the Saṅgha, and silent consent restores
    the person to dealings with the Saṅgha. The passage then shifts to the Blessed
    One traveling from Vesali to Bhagga and residing at Dragon's Hill in Bhesakaḷa
    Wood. Bodhi the king's son has a newly finished mansion called Kokanada, not yet
    used, and commands a young Brahman.
  language: English
  quote_policy: summarized
