canonical_text:
  quote: ''
  summary: Mahanama the Sakyan reflects that many distinguished Sakya youths have
    renounced household life in imitation of the Blessed One, while no one from his
    own family has done so. He asks Anuruddha whether one of them should go forth.
    Anuruddha first says he is too delicate, but after Mahanama describes the repeated
    and endless labor of household agricultural duties, Anuruddha decides to go forth
    and asks his mother for permission.
  language: English
