canonical_text:
  quote: ''
  summary: 'A Vinaya passage records rules concerning Bhikkhus and Bhikkhunis: misconduct
    by Bhikkhus toward Bhikkhunis leads to prohibitions and the penalty of not being
    saluted by the Bhikkhuni community; parallel misconduct by Bhikkhunis leads to
    restrictions; further rules regulate inhibition from Exhortation, Uposatha participation,
    competent grounds for discipline, and the duty of Bhikkhunis to attend Exhortation.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One leaves Vesali, journeys to Savatthi, and remains at Getavana,
    Anatha Piṇḍika’s Park.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The AAabbaggiya Bhikkhus throw dirty water over Bhikkhunis with the stated
    thought that the Bhikkhunis might fall in love with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the matter is reported, the Blessed One forbids a Bhikkhu to throw dirty
    water at a Bhikkhuni, declares the offense a dukkaṭa, and allows a penalty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The specified penalty is that the offending Bhikkhu is to be declared not
    to be saluted by the Bhikkhuni-saṅgha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The AV^abbaggiya Bhikkhus uncover their bodies, thighs, or private parts,
    show them to Bhikkhunis, address Bhikkhunis with wicked words, or associate with
    Bhikkhunis with the stated thought that the Bhikkhunis might fall in love with
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Blessed One forbids these acts by Bhikkhus, assigns a dukkaṭa offense,
    and the same no-salutation penalty is imposed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A repeated section concerns W/zabbaggiya Bhikkhunis; the resulting disciplinary
    measures include prohibiting a Bhikkhuni from entering a Vihara and, if the prohibition
    is not accepted, inhibiting them from the Exhortation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Blessed One states that Uposatha is not to be held with a Bhikkhuni inhibited
    from the Exhortation until her case has been settled.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The venerable Udayi inhibits the Exhortation and then goes on a journey; after
    complaint, the Blessed One forbids going on a journey after inhibiting the Exhortation
    and assigns a dukkaṭa offense.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Foolish, incompetent, groundless, or causeless inhibition of the Exhortation
    is forbidden.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bhikkhus who have inhibited the Exhortation are not to abstain from giving
    a decision on the matter that caused the inhibition.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Bhikkhunis are not to omit going to the Exhortation; one who does so is to
    be dealt with according to the rule.
  category: speech
  evidence_refs:
  - ev:12
