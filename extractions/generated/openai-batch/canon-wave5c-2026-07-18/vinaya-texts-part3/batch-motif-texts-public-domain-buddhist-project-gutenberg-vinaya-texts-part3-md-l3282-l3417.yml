canonical_text:
  quote: ''
  summary: The Blessed One explains that a monk died from a snake bite because he
    had not extended love toward four royal serpent breeds, and he permits monks to
    use a spoken safeguard of loving-kindness toward serpents and other creatures.
    A brief permission to let blood follows. Another monk castrates himself while
    tormented by distaste, and the Blessed One prohibits self-castration as an offence.
    A Rajagaha householder makes a precious sandalwood bowl, raises it on bamboos,
    and offers it to any ascetic or brahman who is an arahat with supernatural power
    and can take it down.
  language: English translation with Pali terms
  quote_policy: summarized
