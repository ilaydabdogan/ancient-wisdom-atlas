canonical_text:
  quote: ''
  summary: 'A questioner asks whether several named licenses or justifications are
    allowable in monastic practice. The respondent rejects allowances concerning late
    timing, eating before a village trip, separate Uposathas within the same boundary,
    and later-sanctioned official acts by an improperly constituted Saṅgha. The respondent
    gives a qualified answer on precedent-based practice: allowable in some cases
    and not in others.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proposed allowance beyond the right time, conditioned on the shadow not
    yet having turned two inches, is answered as not allowable.
  category: speech
