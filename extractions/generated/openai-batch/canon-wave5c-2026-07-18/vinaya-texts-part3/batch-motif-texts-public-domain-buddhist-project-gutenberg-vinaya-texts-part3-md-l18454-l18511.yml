  - ev:1
- id: obs:2
  text: The “village-trip-license” is defined as eating food not left over after one
    has finished a meal and refused more, on the ground that one is about to proceed
    into the village; it is answered as not allowable.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The “circuit-license” is defined as Bhikkhus dwelling within the same circuit
    and boundary holding separate Uposathas; it is answered as not allowable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The “indemnity-license” is defined as an improperly constituted Saṅgha performing
    an official act on the ground that sanction will later be obtained from arriving
    Bhikkhus; it is answered as not allowable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The “precedent-license” is defined as doing a thing because a preceptor or
    teacher has practiced it; the answer is that this is allowable in some cases and
    not in others.
  category: speech
  evidence_refs:
  - ev:5
