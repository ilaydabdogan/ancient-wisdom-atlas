  quote: ''
  summary: 'The passage gives two disciplinary incidents from the daily life of the
    Bhikkhus: some Bhikkhus wear woollen cloth with long fleece and are forbidden
    by the Blessed One to do so; later, after King Seniya Bimbisara permits the monks
    to take mangoes from his park, some Bhikkhus pluck and eat even the young fruits.'
