canonical_text:
  quote: ''
  summary: A Vinaya regulatory passage describes practices concerning giving Viharas
    or unfinished building work into a Bhikkhu's charge, complaints by moderate Bhikkhus,
    and rulings by the Blessed One. The rulings limit when the office of building
    overseer may be conferred, set periods for different building types, forbid several
    forms of exclusive or improper possession, allow only one good sleeping-place
    during the rains, and prescribe reassignment before completion to avoid loss to
    the Sangha when an overseer leaves or becomes incompetent.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some gave a Vihara to a Bhikkhu for life or for a period described as lasting
    until smoke rose from the funeral pyre on which his body would be burnt.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Moderate Bhikkhus objected to the described practice, and the Blessed One
    addressed the Bhikkhus with a ruling.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One prohibited conferring the office of building overseer when
    the work merely involved putting clay aside in heaps, and allowed an unbegun or
    unfinished Vihara to be given in charge as a new building.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stated building-work periods are five or six years for a small Vihara,
    seven or eight years for an Addhayoga, and ten or twelve years for a large Vihara
    or Pasada.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Bhikkhus are described as giving the whole of a Vihara, or two Viharas, to
    one Bhikkhu as navakamma; as having another Bhikkhu live there and take charge;
    as keeping exclusive possession; as giving work to one outside the boundary; or
    as keeping possession for all time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blessed One prohibited those practices, declared a dukkaṭa offence for
    doing them, and allowed the Bhikkhu in charge to take one good sleeping-place
    into exclusive possession for the three months of the rainy season but not during
    the dry season.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bhikkhus who had taken charge of building operations sometimes left the place
    or otherwise became incompetent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If such a case occurred after taking charge but before completion, the office
    was to be given to another to prevent loss to the Sangha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the building had been completed and the overseer then left the place, the
    office and its privileges were still said to be his; the passage then begins listing
    other conditions such as returning to the world, death, novice status, abandonment
    of precepts, or an extreme offence.
  category: sequence
  evidence_refs:
  - ev:5
