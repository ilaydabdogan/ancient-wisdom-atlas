canonical_text:
  quote: ''
  summary: 'Section VI.1.5-6 recounts rules about sleeping furniture: the AAabbaggiya
    Bhikkhus sleep on lofty beds and are criticized; the Blessed One forbids lofty
    beds; after a certain Bhikkhu sleeping on a low couch is bitten by a snake, bedstead
    supports are allowed; the AAabbaggiya Bhikkhus then use lofty supports and rock
    themselves, so a height limit is imposed; string received by the Sa7;zgha is permitted
    for weaving across a bedstead.'
  language: English translation
  quote_policy: summarized
