canonical_text:
  quote: ''
  summary: 'The passage records case-based rules for Bhikkhus concerning body hair
    and medical treatment: hair may be removed from private parts when disease prevents
    ointment from adhering; cutting hair with a knife is prohibited but allowed for
    a head sore when a razor cannot be used; long nostril hair is prohibited after
    public criticism; and pulling nostril hair with potsherd or beeswax causes injury.'
  language: English
  quote_policy: summarized
