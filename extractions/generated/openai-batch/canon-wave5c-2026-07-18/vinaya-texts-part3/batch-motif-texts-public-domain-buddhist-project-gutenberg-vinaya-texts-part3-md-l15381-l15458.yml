canonical_text:
  quote: ''
  summary: 'A Vinaya passage records rulings concerning Bhikkhunis: confessions of
    faults are to be received by Bhikkhunis rather than Bhikkhus, Bhikkhus may instruct
    Bhikkhunis in procedure, disciplinary proceedings against Bhikkhunis are reassigned
    to Bhikkhunis after public impropriety, and Bhikkhus may settle points at issue
    for Bhikkhunis when quarrels cannot be resolved.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
