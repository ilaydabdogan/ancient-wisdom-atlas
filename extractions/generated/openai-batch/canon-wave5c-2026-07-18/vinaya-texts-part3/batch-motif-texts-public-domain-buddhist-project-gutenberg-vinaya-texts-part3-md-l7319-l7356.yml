canonical_text:
  quote: ''
  summary: The passage opens a section on dwellings and furniture. The Blessed Buddha
    is staying at Rct^agaha in the Ve/uvana, Kalandaka Nivapa. Since permission for
    dwellings has not yet been given to the Bhikkhus, they live in various outdoor
    or marginal places such as woods, tree-roots, hillsides, grottoes, mountain caves,
    cemeteries, open plains, and heaps of straw. In the early morning they come in
    from these places with restrained and dignified deportment. A S&ttki of Ra^agaha
    goes early in the morning to his garden. Editorial notes compare one formula with
    other Buddhist texts.
