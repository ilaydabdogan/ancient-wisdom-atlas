canonical_text:
  quote: ''
  summary: A disciplinary passage describes sick men being made to stand and falling
    down, after which the Blessed One prohibits making a sick man get up. It then
    describes monks claiming or feigning sickness to take preferred or exclusive sleeping-places,
    followed by rulings about suitable sleeping-places for sick Bhikkhus and misconduct
    in taking places. The passage ends with the beginning of an episode in which the
    Sattarasa-vaggiya Bhikkhus prepare a large Vihara for dwelling and the AAabbaggiya
    Bhikkhus see them doing so.
