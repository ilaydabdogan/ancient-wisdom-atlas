canonical_text:
  quote: ''
  summary: Vaddka is urged by his friends and blood relatives not to lament, and they
    promise to reconcile him with the Blessed One and the Order of Bhikkhus. Vaddka
    goes with his wife, children, companions, and relatives to the Blessed One in
    a visibly distressed state, prostrates with his head at the Blessed One's feet,
    confesses that he groundlessly accused Dabba the Mallian of a breach of morality,
    asks that his confession be accepted so he may restrain himself in the future,
    and receives acceptance of the confession from the Blessed One because he recognizes
    the wrongdoing and makes amends.
  language: English
  quote_policy: summarized
