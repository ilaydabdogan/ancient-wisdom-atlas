  summary: Devadatta reacts to the Blessed One’s rejection before the king and retinue,
    departs in anger after bowing, and is said for the first time to bear malice against
    the Blessed One. The Blessed One instructs the Bhikkhus that the Sa;;zgha should
    perform an Act of Proclamation in Ra^agaha, publicly dissociating the Buddha,
    Dhamma, and Sa;;zgha from Devadatta’s bodily and verbal acts.
