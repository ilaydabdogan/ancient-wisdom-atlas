canonical_text:
  quote: ''
  summary: A disciplinary passage describes accusations against the Bhikkhu Uva/a
    for inconsistent denial and confession, counter-charges, and knowingly false speech.
    The Blessed One rebukes him and instructs that the Sangha carry out the Tassa-papiyyasika-kamma
    after prior warning, recollection, and trial. The formal motion is to be put before
    the Sangha and repeated three times; approval is shown by silence and disapproval
    by speaking.
  language: English translation with transliterated technical terms
  quote_policy: summarized
literal_observations:
