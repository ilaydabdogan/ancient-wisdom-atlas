  text: The Bhikkhu Uva/a is said to have made counter-charges and spoken lies he
    knew to be lies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moderate Bhikkhus were annoyed, murmured, became indignant, questioned how
    Uva/a could act so, and told the matter to the Blessed One.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Blessed One asked whether the report was true, the answer given was,
    “It is true, Lord.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One rebuked Uva/a, delivered a religious discourse, and instructed
