canonical_text:
  quote: May the Blessed One admit him to the Order before us
  summary: A group of Sakyas tell the Blessed One that they are proud and ask that
    Upali the barber, formerly their attendant, be admitted to the Order before them
    so that they must honor him as senior. The Blessed One admits Upali first and
    then the Sakya young men. The passage then lists spiritual attainments associated
    with Bhaddiya, Anuruddha, Ananda, and Devadatta before the rainy season ends,
    with notes glossing several doctrinal terms.
  language: English with Pali names and terms
