canonical_text:
  quote: ''
  summary: In a council setting, the Saṅgha considers a legal question involving the
    Bhikkhus of the East and West. Because discussion is unclear, Revata proposes
    settlement by a delegated group of four monks from each side. The delegates meet
    at Valika Arama. Revata questions Sabbakami on Vinaya points, and Sabbakami rejects
    the horn-salt license and the two-inch license by reference to prior Vinaya rulings.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two interlocutors state that, after considering the Dhamma and Vinaya, the
    Bhikkhus of the East hold an opinion not in accord with the Dhamma, while the
    Bhikkhus of the West are in accord with the Dhamma; both say they will not make
    their opinion manifest until appointed over the question.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saṅgha meets to inquire into the legal question, but the discussion produces
    much pointless speaking and no clear sense in a single speech.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Revata proposes that the legal question be settled by referring it to a delegated
    group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Revata selects four Bhikkhus of the East and four Bhikkhus of the West to
    settle the question by reference.
  category: action
