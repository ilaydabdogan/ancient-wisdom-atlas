canonical_text:
  quote: ''
  summary: A poor tailor attempts to build a new structure but repeatedly fails because
    the wall is out of line and collapses. He complains that monks assist and instruct
    those who provide requisites but not him because he is poor. The Bhikkhus report
    this to the Blessed One, who permits new buildings under construction for the
    Order to be put in charge of a Bhikkhu overseer. The overseer is to hasten completion
    and arrange repairs. A formal procedure is given for the Saṅgha to assign this
    responsibility by motion and silent consent. The passage ends with the Blessed
    One leaving Vesali for Savatthi.
  language: English
  quote_policy: summarized
