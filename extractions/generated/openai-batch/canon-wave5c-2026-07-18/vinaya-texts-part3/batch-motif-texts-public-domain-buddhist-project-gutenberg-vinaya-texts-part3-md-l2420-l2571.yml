canonical_text:
  quote: ''
  summary: 'The passage states that a settled case remains settled, then gives three
    methods for taking votes among Bhikkhus: secret, whispering, and open. It also
    describes legal settlements for questions arising from censure, including proceedings
    in presence, for the consciously innocent, for those no longer out of their mind,
    and for the obstinate, with an example of a groundless moral charge against a
    Bhikkhu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Bhikkhus were contented or discontented with decisions made by groups
    of Theras and went to the Blessed One to report the matter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One declares that a case once settled is settled for good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Three ways of taking votes are enjoined: the secret method, the whispering
    method, and the open method.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the secret voting method, the vote-teller makes voting tickets of different
    colours and tells each Bhikkhu which ticket corresponds to which opinion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the secret voting method, the voter is told not to show the chosen ticket
    to anyone.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the whispering voting method, the vote-teller whispers in each Bhikkhu’s
    ear which ticket corresponds to which opinion and tells him not to tell anyone
    how he voted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A vote is to be rejected as wrongly taken if opinions against the Dhamma are
    in the majority, and reported as well taken if opinions in accordance with the
    Dhamma are in the majority.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: In the open method, the vote is taken undisguisedly and openly if it is known
    beforehand that those in accordance with the Dhamma are in the majority.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A legal question arising out of censure can be settled by four kinds of settlement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The four named settlements are the Proceeding in Presence, the Proceeding
    for those consciously innocent, the Proceeding for those no longer out of their
    mind, and the Proceeding for those obstinate.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A groundless charge against a Bhikkhu concerning a breach of morality is given
    as a case where the Proceeding for the consciously innocent is to be accorded
    to a Bhikkhu whose memory of the matter is clear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Proceeding in Presence includes the presence of the Samgha, Dhamma, Vinaya,
    and the particular person.
  category: relationship
  evidence_refs:
  - ev:9
