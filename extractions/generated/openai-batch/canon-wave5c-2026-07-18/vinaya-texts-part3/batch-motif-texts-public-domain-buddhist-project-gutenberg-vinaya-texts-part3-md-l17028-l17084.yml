  summary: A Vinaya passage reports several matters about Bhikkhunis to the Blessed
    One. He permits certain unspecified things, prohibits Bhikkhunis from sitting
    on a divan after inappropriate contact occurs, allows a sick Bhikkhuni to use
    a half-divan, and prohibits the use of chunam at baths while allowing clay and
    red powder of rice husks.
