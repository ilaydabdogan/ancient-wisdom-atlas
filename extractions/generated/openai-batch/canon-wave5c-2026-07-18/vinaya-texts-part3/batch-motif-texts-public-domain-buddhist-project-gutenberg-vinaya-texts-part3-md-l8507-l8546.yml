canonical_text:
  quote: ''
  summary: Anitha/Anatha Piṇḍika the householder notices that the householder of Rājagaha
    is unusually excited and giving orders to workers. After greeting him, the householder
    explains that he is not arranging a marriage and has not invited King Bimbisāra;
    rather, he has prepared a great sacrifice because the Saṅgha, with the Buddha
    at its head, has been invited to a meal at his house the next day. Anatha asks
    whether he said “the Buddha,” and the host confirms it.
