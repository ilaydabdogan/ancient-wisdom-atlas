canonical_text:
  quote: "“for the Tathagatas require no protection.”"
  summary: The Blessed One tells the Bhikkhus that a Tathagata cannot be killed by
    violence and dies only in due natural course, so no protection is needed. The
    passage then describes Devadatta going to the elephant stables at Rajagaha and
    instructing elephant-keepers to release the fierce elephant Nalagiri when Samana
    Gotama reaches a carriage-road.
