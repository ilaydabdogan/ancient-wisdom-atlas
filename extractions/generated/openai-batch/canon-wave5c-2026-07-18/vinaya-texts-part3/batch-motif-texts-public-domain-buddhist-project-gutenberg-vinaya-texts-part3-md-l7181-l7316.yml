canonical_text:
  quote: ''
  summary: 'The passage records several Vinaya-style disciplinary rulings: onions
    are prohibited because they can keep a monk away from hearing Dhamma, but are
    allowed for illness; sanitation problems in the Arama lead to rules about urination
    and privies; a group of Bhikkhus is forbidden to follow manifold evil practices;
    and after Kassapa of Uruve/a goes forth, permitted and prohibited kinds of brass,
    wooden, and earthenware property are classified for the Saṅgha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One asks whether anything should be eaten if it causes the eater
    to keep away from a preaching of the Dhamma; the Bhikkhus answer no; he prohibits
    eating onions and assigns a dukkaṭa offense for doing so.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The venerable S&riputta/Sariputta has wind in his stomach; Maha Moggallana
    asks how he formerly got relief; Sariputta answers that he ate onions; after the
    matter is reported, the Blessed One allows onions on account of disease.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bhikkhus make water here and there in the Arama, and the Arama is defiled;
    after the matter is reported, the Blessed One allows making water at one side
    of the Arama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An editorial summary states that the rest of the chapter records sanitary
    difficulties from communal living, each reported to the Blessed One, resulting
    in the enjoining of privies and fittings such as seats, doors, steps, and plastering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The A7zabbaggiya Bhikkhus are said to follow evil practices; after the matter
    is reported, the Blessed One forbids following manifold evil practices and says
    offenders shall be dealt with according to the law.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the venerable Kassapa of Uruve/a goes forth from the world, much property
    in brass, wood, and earthenware comes into the possession of the Saṅgha as printed
    in the passage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Blessed One allows all kinds of brass ware except weapons, all kinds of
    wooden things except divans, long-armed chairs, bowls, and shoes, and all kinds
    of earthenware except katakas and large earthen vessels used as huts to live in.
  category: object
  evidence_refs:
  - ev:6
