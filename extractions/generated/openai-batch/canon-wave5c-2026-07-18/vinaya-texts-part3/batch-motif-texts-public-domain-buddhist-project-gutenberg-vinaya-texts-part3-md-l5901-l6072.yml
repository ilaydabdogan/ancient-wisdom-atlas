canonical_text:
  quote: ''
  summary: The passage describes episodes in which the Blessed One declines to walk
    on ceremonial cloth, receives hospitality and offerings, establishes rules about
    cloths, foot-wiping mats, jars, brooms, foot-scrubbers, fans, flower-stands, and
    mosquito-fans, and grants exceptions or allowances in response to specific situations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ananda tells Bodhi the king's son to gather up the ceremonial cloths because
    the Blessed One will not walk on such cloth and has mercy even on the meanest
    thing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bodhi has the cloths gathered up, spreads a seat on the top of Kokanada, and
    the Blessed One ascends and sits there with the Samgha of Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bodhi feeds the Bhikkhu-samgha with the Buddha at their head, waiting on them
    with his own hand, and then receives religious discourse before departing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Blessed One convenes an assembly of Bhikkhus and states that Bhikkhus
    are not to walk upon cloth laid down for ceremonial purposes; doing so is declared
    a dukkaṭa offense.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman who had had a miscarriage invites Bhikkhus, spreads cloths in their
    honour, and asks them to step over the cloth for good luck; the Bhikkhus refuse
    because they fear offending.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the woman complains, the Blessed One allows Bhikkhus to step over ceremonial
    cloth when asked to do so for the good luck of laypeople.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Blessed One allows Bhikkhus to step on a mat used for wiping the feet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One travels from Bhagga toward Savatthi and stays at the Jetavana
    in Anatha-pindika's Arama.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Visakha, the mother of Migara, brings small jars, earthenware foot-scrubbers,
    and brooms, and asks the Blessed One to accept them so that it may be a blessing
    and joy for her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Blessed One accepts the small jars and brooms but does not accept the
    earthenware foot-scrubbers; he later allows sandstone, gravel, and sea-foam as
    materials for rubbing the feet.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The Blessed One allows the use of fans, flower-stands, and mosquito-fans.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: A translator's note describes the ceremonial cloths as lengths of cloth used
