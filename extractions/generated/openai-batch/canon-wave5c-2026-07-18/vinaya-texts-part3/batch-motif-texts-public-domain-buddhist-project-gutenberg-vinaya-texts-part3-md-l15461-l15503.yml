  summary: A Vinaya passage states that Bhikkhus may initiate official disciplinary
    acts for Bhikkhunis and assign Bhikkhunis to carry them out. It then recounts
    an unnamed Bhikkhuni pupil who followed the Blessed One for seven years learning
    the Vinaya but repeatedly forgot it; after the matter is reported, the Blessed
    One allows Bhikkhus to teach the Vinaya to Bhikkhunis.
