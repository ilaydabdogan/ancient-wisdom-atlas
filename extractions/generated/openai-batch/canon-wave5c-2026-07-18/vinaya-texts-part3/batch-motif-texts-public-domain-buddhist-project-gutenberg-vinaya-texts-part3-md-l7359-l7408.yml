  quote: "“I allow you, O Bhikkhus, abodes of five kinds”"
  summary: A householder of Ragagaha sees Bhikkhus arriving from various places and
    offers to have dwellings built for them. The Bhikkhus say dwellings have not yet
    been allowed and consult the Blessed One. The Blessed One allows five kinds of
    abodes, after which the householder has sixty dwelling-places put up in one day.
