  summary: In a dialogue among elder monks, one says he has long lived in love and
    attained Arahatship, while another says he has long lived in the sense of the
    emptiness of worldly things and also attained Arahatship. Sambhuta Siwavasi arrives,
    salutes Sabbakami, sits beside him, reports that the Vajjian Bhikkhus of Vesali
    have put forth ten points, and notes Sabbakami's learning in Dhamma and Vinaya.
