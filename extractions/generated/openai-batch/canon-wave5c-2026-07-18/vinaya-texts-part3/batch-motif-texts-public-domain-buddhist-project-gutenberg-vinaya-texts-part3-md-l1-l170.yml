  quote: ''
  summary: 'A Vinaya passage on the settlement of disputes among the fraternity: the
    Buddha prohibits carrying out specified formal disciplinary acts against absent
    Bhikkhus, discusses wrong and right parties in dispute settlement, and begins
    a narrative about the venerable Dabba the Mallian, who attained Arahatship at
    seven and reflects in solitude.'
