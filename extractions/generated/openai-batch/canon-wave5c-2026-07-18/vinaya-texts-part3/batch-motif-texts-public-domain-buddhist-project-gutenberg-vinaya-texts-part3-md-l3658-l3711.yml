  summary: 'The passage gives monastic disciplinary instructions: only ordinary linings
    are allowed; bowls are not to be stored with water in them, dried in sunshine
    while still containing water, or kept in a warm place. The prescribed procedure
    is to empty the water and dry or warm the bowls briefly before storage.'
