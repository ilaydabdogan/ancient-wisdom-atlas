  quote: ''
  summary: A Vinaya passage reports a complaint about bowls being used for refuse,
    after which the Blessed One forbids carrying odd bits, bones, and dirty water
    in bowls and allows a waste-tub. A second case describes Bhikkhus tearing cloth
    by hand before sewing robes, causing jagged robes; the Blessed One allows a blade
    and felt sheath. A further notice says a hafted blade came into the Sangha’s possession
    and was reported. Footnotes explain and compare several technical terms.
