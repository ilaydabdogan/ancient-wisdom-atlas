canonical_text:
  quote: ''
  summary: At Savatthi in the Cetavana, Anatha Pindika asks the Blessed One what he
    should do with the Jetavana; the Blessed One instructs him to dedicate it to the
    Sangha of the four directions, present and future, and later gives thanks in verses.
    A later meal episode describes Upananda the Sakyan making a junior monk leave
    his seat, causing confusion and criticism from a court official who is hosting
    the Sangha. The Blessed One rebukes the conduct and gives rules about not displacing
    a monk before a meal is finished, handling seniority, fetching water, and offenses.
    The passage then begins another case in which the Chabbaggiya Bhikkhus make sick
    monks get up despite their protest.
  language: English
  quote_policy: summarized
