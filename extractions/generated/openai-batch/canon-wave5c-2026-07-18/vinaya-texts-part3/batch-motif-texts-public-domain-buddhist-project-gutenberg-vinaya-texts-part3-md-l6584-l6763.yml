  summary: A Vinaya passage gives rules and allowances concerning monastic implements
    and clothing. After reported incidents involving a fallen waist-cloth, decorative
    girdles, wind-blown garments, robe weights, and lay or ornate styles of undergarment,
    the Blessed One permits certain practical items and forbids specified forms, with
    penalties for violations.
