canonical_text:
  quote: ''
  summary: A Vinaya passage gives rules about monks' use of fly-whisks, sun-shades,
    staffs, strings for bowls, and conduct around chewing/rumination. The Blessed
    One disallows certain uses after incidents of public criticism or mistaken appearance,
    while allowing exceptions for sickness or specified materials and places.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chāmara had come into the possession of the Saṅgha, and the Blessed One
    prohibited its use while allowing three specified kinds of fly-whisks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sun-shades were allowed, but the Chabbaggiya Bhikkhus went about with sun-shades
    held over them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Followers of the Ājīvakas saw the Chabbaggiya Bhikkhus with sun-shades and
    compared them to lords of the treasury.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Upāsaka denied at first that the approaching men were Bhikkhus and later
    became annoyed when he recognized them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One rebuked the monks and prohibited having sun-shades held over
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A sick Bhikkhu was ill at ease without a sun-shade, leading to an allowance
    for the sick and then an allowance for both sick and not sick within the Arāma
    or its precincts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Bhikkhu tied his bowl with a string, suspended it on a staff, and left a
    village gate after noon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: People mistook the staff and string arrangement for a glistening sword and
    seized the Bhikkhu as a thief before recognizing and releasing him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Blessed One prohibited carrying a staff with a string attached.
  category: speech
  evidence_refs:
  - ev:6
