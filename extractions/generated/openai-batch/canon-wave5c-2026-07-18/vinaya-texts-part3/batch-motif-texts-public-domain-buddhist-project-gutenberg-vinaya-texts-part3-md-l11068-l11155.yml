canonical_text:
  quote: ''
  summary: A celestial being named Kakudha reports to the venerable Moggallana about
    a thought that has arisen in Devadatta’s mind and its result. Moggallana reports
    the matter to the Blessed One, who asks whether Moggallana has discerned Kakudha’s
    mind and then instructs him to keep the saying secret, adding that the foolish
    man will make himself known. The Blessed One then describes five kinds of teachers
    whose defects are concealed by disciples, contrasts this with his own purity,
    and later travels from Kosambi to Rajagaha, staying at Veluvana in the Kalandaka
    Nivapa.
  language: English
  quote_policy: summarized
