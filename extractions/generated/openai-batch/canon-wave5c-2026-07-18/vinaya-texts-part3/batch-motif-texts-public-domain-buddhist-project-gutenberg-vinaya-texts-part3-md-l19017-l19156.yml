canonical_text:
  quote: ''
  summary: A council passage presents a sequence of disputed monastic allowances.
    For each item, a question defines the proposed allowance, the answer usually rejects
    it as not allowable, a prior rejection or canonical location is cited, an offence
    category may be named, and the Saṅgha declares the point false Dhamma and false
    Vinaya before a numbered vote is cast. The passage covers the second through sixth
    points and begins the question about a seventh, the churn-license.
  language: English with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The second point is identified with eating at the wrong time and is declared
    by the Saṅgha to be false Dhamma, false Vinaya, and not contained in the Master's
    teaching; a second vote is cast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The village-trip-license is defined as eating food not left over after one
    has finished a meal and refused more, on the ground of being about to go into
    the village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The village-trip-license is answered as not allowable, associated with rejection
    at Sāvatthi in the Sutta Vibhaṅga, and classified as a Pācittiya offence in eating
    food not left over; the third point is then declared false and a third vote is
    cast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The circuit-license concerns Bhikkhus dwelling within the same circuit and
    boundary holding separate Uposathas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The circuit-license is answered as not allowable, associated with rejection
    at Rājagaha in the Uposatha Saṃyutta, and classified as a Dukkaṭa offence in neglecting
    the Vinaya; the fourth point is then declared false and a fourth vote is cast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The indemnity-license concerns a Saṅgha that is not legally constituted performing
    an official act on the ground that sanction will later be obtained from arriving
