canonical_text:
  quote: ''
  summary: A householder learns from Dabba the Mallian that a meal at his house has
    been appointed for Bhikkhus who follow Mettiya and Bhumma^aka/Bhummafaka. Displeased,
    he orders a slave-girl to seat them in the entrance hall and serve scraps and
    sour gruel. The Bhikkhus expect lavish service and desirable foods, sleep uneasily
    from joy, and in the morning go to the house dressed with bowls and robes, where
    the slave-girl sees them.
  language: English translation with Indic/Pali terms
  quote_policy: summarized
