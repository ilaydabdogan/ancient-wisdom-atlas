canonical_text:
  quote: ''
  summary: 'The passage first lists disciplinary statuses involving probation, penance,
    and rehabilitation. It then states three classes that ought to be saluted: a previously
    admitted monk by a later-admitted monk, a senior in another community when speaking
    according to the Dhamma, and the Arahat Sammasambuddha by beings throughout the
    worlds. A following case narrates that people provided arbours, couches, and room
    for the use of the Samgha; pupils of the Chabbaggiya Bhikkhus used an interpretation
    about temporary communal property to go ahead of the Samgha and reserve these
    spaces for superiors, teachers, and themselves. The Blessed One rebuked them and
    began to state a rule about temporary-use property.'
  language: English translation with Indic Buddhist terms
  quote_policy: summarized
