  summary: A kingdom is handed over to prince Ajatasattu. Devadatta asks Ajatasattu
    to order his men to obey him so that he may kill Samana Gotama. Ajatasattu gives
    that order. Devadatta then sends one armed man to kill Gotama and arranges additional
    men along return paths to kill any lone man they see. The armed man goes toward
    the place where the Blessed One is staying.
