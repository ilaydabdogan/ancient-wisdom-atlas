canonical_text:
  quote: ''
  summary: The passage explains how monastic legal questions, especially those arising
    from offences, are settled by prescribed proceedings. It describes settlement
    in presence, settlement through confession of guilt, settlement by covering over
    as with grass, penalties for reopening settled questions, a minor-offence confession
    before another monk, and escalation to a group of monks or the SaMgha if absolution
    is not received.
  language: English translation with transliterated Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A legal question already settled by the Proceeding in Presence and by the
    Proceeding for those who are obstinate is not to be reopened; reopening by a disputant
    or complaint by one who had consented is described as a Pa^ittiya or PaAttiya
    offence in the supplied text.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A legal question arising out of offence is said to be settled by three modes:
    the Proceeding in Presence, the Proceeding on confession of guilt, and the Proceeding
    by covering over as with grass.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that an offence-related legal question may be settled without
    the mode called covering over as with grass, using the Proceeding in Presence
    and the Proceeding on confession of guilt.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a minor offence, the guilty Bhikkhu is instructed to go to another Bhikkhu,
    arrange the upper robe over one shoulder, squat on his heels, stretch out joined
    palms, and confess the offence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The receiving Bhikkhu asks whether the offender acknowledges the offence,
    and after acknowledgment says that the offender should restrain himself in future.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage defines the presence involved in this settlement as including
    the Dhamma, the Vinaya, the teaching of the Master, and the presence of both the
    one confessing and the one to whom he confesses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Proceeding on confession of guilt is described as involving the carrying
    out, accomplishment, performance, acceptance, and pacification of the official
    act, called the Kamma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If absolution is not received from a single Bhikkhu, the offender is instructed
    to approach a number of Bhikkhus, bow before the elder Bhikkhus, assume the same
    bodily posture, and confess.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A discreet and able Bhikkhu is instructed to lay the matter before the assembled
    Bhikkhus, state that the named Bhikkhu is conscious of an offence and confesses
    it, and propose absolution if the time seems suitable.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: If absolution is still not received, the offender is instructed to go before
    the Sawgha; the supplied passage then breaks off after a cross-reference and a
