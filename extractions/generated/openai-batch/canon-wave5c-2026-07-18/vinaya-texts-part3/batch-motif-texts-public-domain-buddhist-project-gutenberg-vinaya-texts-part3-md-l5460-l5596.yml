canonical_text:
  quote: ''
  summary: Vaddha the Licchavi is prompted by monks who follow Mettiya and Bhummagaka
    to accuse Dabba the Mallian before the Blessed One. Dabba denies sexual activity,
    and the Blessed One directs the Saṅgha to impose the 'turned-down bowl' sanction
    on Vaddha, followed by a list of grounds and procedure for applying this sanction
    to an upāsaka.
  language: English translation
  quote_policy: summarized
