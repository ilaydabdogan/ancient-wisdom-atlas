canonical_text:
  quote: ''
  summary: 'The passage sets out procedures for settling legal questions among Bhikkhus:
    both parties to a dispute must be present; reopening a settled question or complaining
    after giving consent incurs a Pācittiya offence; unresolved questions may be taken
    to a residence with more Bhikkhus, and if still unresolved, the resident Bhikkhus
    are asked to settle the matter according to the Dhamma, Vinaya, and the Master''s
    teaching.'
  language: English
  quote_policy: summarized
