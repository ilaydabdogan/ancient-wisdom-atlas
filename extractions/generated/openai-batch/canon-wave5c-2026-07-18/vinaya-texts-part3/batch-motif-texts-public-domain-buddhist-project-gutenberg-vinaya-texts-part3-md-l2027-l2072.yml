- id: obs:3
  text: If a person who has conveyed consent later complains of the decision, the
    complaint is treated as a Pācittiya offence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If Bhikkhus cannot settle a legal question within their own residence, they
    should go to another residence where there are more Bhikkhus.
  category: sequence
  evidence_refs:
  - ev:3
