canonical_text:
  quote: ''
  summary: A householder of Rājagaha completes sixty dwelling-places and asks the
    Blessed One how to dispose of them. The Blessed One instructs him to dedicate
    them to the Saṅgha of the four directions, present and future. The Blessed One
    then praises the gift of viharas as protective, peaceful dwellings for meditation
    and as a gift that supports the preaching of Truth. Later, people build viharas
    after hearing they are allowed; practical problems with doorless dwellings and
    door hardware lead to successive permissions for doors, posts, lintels, strings,
    bolts, and related fittings.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Seṭṭhi of Rājagaha completed sixty dwelling-places, invited the Blessed
    One and the Bhikkhu Saṅgha for a meal, and asked what should be done with the
    dwellings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One instructed the householder to dedicate the sixty dwelling-places
    to the Saṅgha of the four directions, whether present or to arrive later, and
    the householder did so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One gave thanks to the householder in verses after the dedication.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The verses describe viharas as warding off cold, heat, beasts of prey, creeping
    things, gnats, rains, and heated winds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The verses call giving viharas to the Saṅgha the best of gifts because they
    provide safety, peace, and a place for meditation and thought.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The verses instruct an able person to build pleasant monasteries, lodge learned
    men, and give food, drink, raiment, and dwelling-places to the upright in heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The verses state that the recipients will preach the Truth, described as dispelling
    every grief; one who perceives that Truth sins no more and dies away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After people heard that viharas had been allowed, they built them zealously.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The first viharas described in this section had no doors, so snakes, scorpions,
    and centipedes entered them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In response to reported problems, the Blessed One successively allowed a door,
    door-posts and lintel, hinge-like features, a pull-string and hole for it, rings,
    bolt-blocks, a securing pin, and a bolt.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After these permissions, the Bhikkhus were still not able to open the door
    and reported the matter to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:8
