canonical_text:
  quote: ''
  summary: A dialogue with Upali describes the karmic consequences of dividing or
    reconciling the Samgha. Breaking a concordant Samgha may lead to a fault lasting
    a Kalpa, boiling in Niraya, states of suffering and woe, and loss of access to
    Arahatship; reconciling a divided Samgha produces highest merit and happiness
    in heaven for a Kalpa. The passage distinguishes cases in which a schism-maker
    is irretrievably doomed from cases in which he is not, and gives an example of
    a Bhikkhu who knowingly presents non-Dhamma as Dhamma, publishes the view, distributes
    voting-tickets, and thereby divides the Samgha.
  language: English translation with Pali terms
  quote_policy: summarized
