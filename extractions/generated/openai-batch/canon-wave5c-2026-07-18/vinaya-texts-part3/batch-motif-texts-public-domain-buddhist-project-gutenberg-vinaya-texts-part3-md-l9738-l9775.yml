canonical_text:
  quote: ''
  summary: The passage first records a rule that one person is not to take two lodging-places.
    It then says the Blessed One repeatedly praised the Vinaya, learning the Vinaya,
    and the venerable Upali. Many Bhikkhus of different standings went to learn Vinaya
    from Upali. Upali taught standing out of reverence for senior Bhikkhus, while
    senior Bhikkhus listened standing out of reverence for the law; both became weary.
    After this was reported, the Blessed One allowed a junior Bhikkhu giving instruction
    to sit on an equal or higher seat out of reverence for the law, and the following
    clause about senior recipients is truncated in the supplied text.
  language: English
  quote_policy: summarized
