  summary: The passage asks whether a legal question arising from an offence may be
    settled without the Proceeding on confession of guilt and answers that it may
    be settled by the Proceeding in Presence and by the Proceeding by covering over
    as with grass. It defines presence as both the confessor and the recipient of
    confession being present, and defines the grass-covering proceeding as the carrying
    out, acceptance, and pacification of the official act, the Kamma.
  language: English translation with Pali technical terms
  quote_policy: summarized
