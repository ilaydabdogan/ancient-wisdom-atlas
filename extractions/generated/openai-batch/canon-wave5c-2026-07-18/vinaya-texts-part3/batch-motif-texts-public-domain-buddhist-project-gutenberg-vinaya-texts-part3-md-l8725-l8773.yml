canonical_text:
  quote: ''
  summary: Anatha Pindika has invited the Order of Bhikkhus, with the Buddha at its
    head, for the next day’s meal. The Setthi of Rajagaha offers to supply the means
    for the meal because Anatha Pindika is a stranger there, but Anatha Pindika says
    he has enough resources. A townsman of Rajagaha and King Seniya Bimbisara make
    the same offer and receive the same reply. Late at night Anatha Pindika prepares
    sweet food in the Setthi’s house, announces to the Blessed One that the meal is
    ready, and the Blessed One dresses early in the morning and goes with his bowl.
  language: English
  quote_policy: summarized
