canonical_text:
  quote: ''
  summary: 'Bhikkhus ask what kinds of roofing the Blessed One has allowed. The Blessed
    One permits five kinds of roofing: brick, stone, cement, straw, and leaves. The
    passage then introduces the householder Anatha Pindika, related by marriage to
    the Setthi of Rajagaha, and describes the Setthi preparing a meal for the Sangha
    with the Buddha at its head.'
