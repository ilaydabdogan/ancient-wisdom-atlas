canonical_text:
  quote: ''
  summary: A rule of conduct is established for Bhikkhus using the hot bath-room.
    The passage prescribes removing ashes, sweeping dirty bath-room areas, preparing
    chunam, clay, and water, covering the body when entering or leaving, observing
    seniority in seating and bathing, carrying away the chair after use, and offering
    shampooing to senior Bhikkhus when possible.
  language: English
  quote_policy: summarized
