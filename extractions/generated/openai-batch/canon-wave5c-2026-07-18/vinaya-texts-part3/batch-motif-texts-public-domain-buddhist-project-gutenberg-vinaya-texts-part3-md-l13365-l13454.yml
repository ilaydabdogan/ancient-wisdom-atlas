canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya instructions for Bhikkhus'' conduct at a meal:
    after a complaint about seating between houses and use of robes as mats, the Blessed
    One establishes a meal-conduct rule covering dress, procession, seating, washing
    and handling the bowl, disposal of water, receiving rice and curry, and equal
    distribution of ghee, oil, or delicacies.'
  language: English
  quote_policy: summarized
