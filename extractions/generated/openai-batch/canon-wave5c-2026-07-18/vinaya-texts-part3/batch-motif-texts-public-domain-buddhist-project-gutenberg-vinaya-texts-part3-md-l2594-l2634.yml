canonical_text:
  quote: ''
  summary: A Bhikkhu is questioned about whether he is conscious of having committed
    a grievous offence. He first denies remembering the grievous offence while admitting
    a trifling offence, is pressed by another speaker, and finally acknowledges the
    grievous offence, saying his denial was made in sport or fun. The passage then
    instructs that the Proceeding for those who are obstinate should be carried out
    against that Bhikkhu.
