canonical_text:
  quote: ''
  summary: 'The passage gives disciplinary rulings: monks are not to learn or teach
    the Lokayata system or other low arts; a sneeze during a Dhamma discourse prompts
    a shouted long-life formula that interrupts the teaching, leading to a prohibition
    on such calls; monks are later allowed to answer laypeople''s long-life greetings
    after sneezing; a monk who has eaten onions sits apart to avoid annoying others.'
  language: English translation with transliterated Pali terms
  quote_policy: summarized
