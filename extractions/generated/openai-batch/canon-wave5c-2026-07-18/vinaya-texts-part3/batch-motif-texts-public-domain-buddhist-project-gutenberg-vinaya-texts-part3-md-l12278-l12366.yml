canonical_text:
  quote: ''
  summary: A verse describes the qualities of a Bhikkhu worthy to go on a mission.
    The passage then states that Devadatta is overcome by evil conditions and is doomed
    for a Kalpa to states of suffering and woe. It instructs Bhikkhus to maintain
    complete ascendancy over gain or loss, fame or lack of fame, honour or dishonour,
    wicked desires, and wicked friends, and it lists three decisive conditions in
    Devadatta's downfall.
  language: English translation with Pali terms in notes
  quote_policy: summarized
