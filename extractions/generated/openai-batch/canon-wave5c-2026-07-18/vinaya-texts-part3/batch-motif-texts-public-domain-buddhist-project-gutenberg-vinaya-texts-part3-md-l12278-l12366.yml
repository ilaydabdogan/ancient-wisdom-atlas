- id: obs:4
  text: Bhikkhus are instructed to continue in complete ascendancy over gain or loss,
    fame or its reverse, honour or dishonour, evil longing, and evil friendship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The reason given for this training is that bad influences full of vexation
