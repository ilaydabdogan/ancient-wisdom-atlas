  quote: ''
  summary: The passage describes the venerable Channa attaining Arahatship, identified
    in a note as Nirvana, and knowing rebirth to be ended. Afterward Channa asks the
    venerable Ananda to remove the higher penalty, and Ananda replies that it was
    removed from the moment of Channa's realization. The passage then states that
    five hundred Bhikkhus took part in the rehearsal of the Vinaya, so that the rehearsal
    is called that of the five hundred.
