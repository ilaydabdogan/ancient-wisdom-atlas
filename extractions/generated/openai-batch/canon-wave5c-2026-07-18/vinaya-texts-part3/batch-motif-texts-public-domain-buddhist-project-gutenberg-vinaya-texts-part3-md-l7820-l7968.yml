  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The AVzabbaggiya Bhikkhus use pillows half the size of a man's body, and visitors
    to the Viharas criticize this as resembling worldly pleasure.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One prohibits pillows half the size of a man's body and allows
    pillows the size of a man's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a festival on a high place at Ra^agaha, people provide bolsters for high
    officials; after the festival, covers are torn open and materials are left at
    the site.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Blessed One allows five kinds of bolsters stuffed with wool, cotton cloth,
    bark, grass, or talipot leaves.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A bed coverlet that has come into the possession of the Sawgha is allowed
    for covering a bolster.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When bed bolsters are folded onto chairs and chair bolsters onto bedsteads,
    the bolsters come to pieces; covered chairs and bedsteads with fitting cushions
    are then allowed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When bedsteads and chairs are covered without an undercloth, stuffing comes
    out from below; spreading a cloth beneath before upholstering is allowed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Coverings are torn off and taken away; successive allowances are made for
    dye-bespattered coverings, patch-coloured coverings, and coverings with patches
    only the size of a man's hand.
  category: sequence
  evidence_refs:
  - ev:7
