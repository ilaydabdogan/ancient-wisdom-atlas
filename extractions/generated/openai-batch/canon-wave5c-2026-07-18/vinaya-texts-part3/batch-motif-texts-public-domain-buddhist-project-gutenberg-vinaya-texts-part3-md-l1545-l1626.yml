  summary: 'The passage classifies four kinds of monastic legal questions: those arising
    from dispute, censure, offence, and business. It then begins listing causes of
    dispute, emphasizing an angry Bhikkhu who bears enmity, lacks reverence for the
    Teacher, Dhamma, and Samgha, neglects disciple duties, and causes disputes in
    the Samgha.'
