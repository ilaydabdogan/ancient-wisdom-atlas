canonical_text:
  quote: I allow you, O Bhikkhus, the use of a blade with a haft to it.
  summary: 'The passage records rules and allowances concerning monks'' practical
    implements: blade handles, needles and needle-cases, sewing materials, robes,
    and the KaMina/Kaṭhina framework used for robe-making. Repeated problems or complaints
    are reported to the Blessed One, who permits certain practical aids and prohibits
    certain uses, sometimes assigning a dukka/a offense.'
  language: English translation with transliterated Pali terms
  quote_policy: quoted
