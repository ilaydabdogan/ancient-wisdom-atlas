  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One forbids various kinds of blade handles, assigns a dukka/a
    for using them, and permits handles made of specified materials including bone,
    ivory, horn, reed, bamboo, hard wood, lac, fruit shells, bronze, and the centre
    of the chank-shell.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhikkhus sew robes with quills or bits of bamboo rind, and the robes are badly
