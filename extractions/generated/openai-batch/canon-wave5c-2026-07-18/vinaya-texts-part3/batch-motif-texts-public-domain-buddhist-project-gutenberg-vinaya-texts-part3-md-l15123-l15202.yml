canonical_text:
  quote: ''
  summary: The passage records the Blessed One saying that any doctrine and discipline
    allowing women to go forth from household life into homelessness will not last
    long, using crop-disease similes and a reservoir-embankment simile for the Eight
    Chief Rules. It then narrates Maha-pajapati the Gotami asking about the Sakya
    women, receiving teaching, the authorization for Bhikkhunis to receive upasampada
    from Bhikkhus, a challenge about initiation status, and the declaration that Maha-pajapati's
    acceptance of the Eight Chief Rules counted as her upasampada.
  language: English
  quote_policy: summarized
