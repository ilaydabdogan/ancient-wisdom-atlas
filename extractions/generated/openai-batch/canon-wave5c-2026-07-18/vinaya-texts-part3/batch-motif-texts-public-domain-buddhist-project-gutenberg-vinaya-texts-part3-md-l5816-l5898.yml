canonical_text:
  quote: ''
  summary: Bodhi the king’s son sends the young Brahman Saṅkha-putta to invite the
    Blessed One and the Saṅgha of Bhikkhus to a meal. The Blessed One gives consent
    by silence. Bodhi prepares sweet food and has the Kokanada mansion covered with
    white cloths. When the Blessed One arrives, Bodhi greets him and asks him to walk
    over the cloths so that it may bring Bodhi long-term welfare and joy. The Blessed
    One remains silent.
  language: English translation with Indic names and terms
  quote_policy: summarized
