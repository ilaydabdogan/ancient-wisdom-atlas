canonical_text:
  quote: ''
  summary: 'In a discourse addressed to Bhikkhus, the Blessed One compares four obstructions
    that affect the sun and moon—clouds, fog, dusty smoke, and Rahu/eclipse—to four
    stains affecting Samanas and Brahmans: intoxicants, sexual intercourse, accepting
    silver and gold, and livelihood by low arts. The passage then introduces a verse
    beginning with Samanas and Brahmans stained by lust and malice.'
  language: English
