canonical_text:
  quote: ''
  summary: Ananda repeatedly asks the Blessed One to allow women to go forth from
    household life into the homeless state, and is refused. He then asks whether women
    are capable of realizing successive spiritual fruits up to Arahatship, and the
    Blessed One answers that they are capable. Ananda cites Maha-pagmpati/Maha-pa^apati
    the Gotami's service as aunt and nurse, including giving milk and suckling the
    Blessed One after his mother's death, as a reason for allowing women to go forth.
    The Blessed One replies that if she accepts the Eight Chief Rules, that will count
    as her initiation. The supplied passage then begins, but does not complete, the
    list of rules and includes footnotes.
  language: English
