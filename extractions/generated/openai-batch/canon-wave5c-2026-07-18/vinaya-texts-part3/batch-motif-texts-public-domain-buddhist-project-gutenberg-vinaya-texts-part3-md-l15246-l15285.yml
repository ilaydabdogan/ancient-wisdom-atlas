canonical_text:
  quote: ''
  summary: In a section on the duties of Bhikkhunis, Gotami asks the Blessed One how
    Bhikkhunis should train in precepts shared with Bhikkhus and in precepts not applicable
    to Bhikkhus. The Blessed One instructs her to train as Bhikkhus do in the shared
    precepts and according to the substance of the distinct Bhikkhuni precepts. Maha-pagapati
    Gotami then requests an abstract teaching of the Dhamma so that she may live alone,
    earnest, zealous, and resolved. The Blessed One answers by giving criteria for
    recognizing doctrines that lead toward passion, pride, acquisitiveness, social
    attachment, sloth, and discontent rather than their opposites.
  language: English translation
  quote_policy: summarized
