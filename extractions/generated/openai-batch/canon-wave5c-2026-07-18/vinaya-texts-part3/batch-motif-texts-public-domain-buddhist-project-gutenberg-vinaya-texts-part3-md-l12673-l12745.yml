canonical_text:
  quote: ''
  summary: The passage classifies cases involving a doctrine judged or suspected to
    be against the Dhamma and a resulting schism. Upali asks the Lord who may break
    up the Saawgha without being doomed to suffering or woe for a Kalpa. The answer
    describes a Bhikkhu who gives out what is not Dhamma as Dhamma without directing
    his intention toward it and while believing that both the doctrine and resulting
    schism accord with the Dhamma. An editorial note explains that grave schism requires
    deliberate or knowing action against the Dhamma.
  language: English
  quote_policy: summarized
