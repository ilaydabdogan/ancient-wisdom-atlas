canonical_text:
  quote: ''
  summary: The passage reports Devadatta at Gaya-sisa with many Bhikkhus. The Blessed
    One sends Sariputta and Moggallana to recover the young Bhikkhus before they come
    to ruin. After they depart respectfully, a Bhikkhu weeps because he thinks the
    chief disciples have gone over to Devadatta; the Blessed One says this is impossible
    and explains their mission. Devadatta, while preaching among adherents, sees them
    approaching and presents their arrival as proof of his doctrine.
  language: English
  quote_policy: summarized
