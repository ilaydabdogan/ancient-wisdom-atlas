canonical_text:
  quote: ''
  summary: Maha-pajapati the Gotami asks Ananda to seek the Blessed One's permission
    for Bhikkhus and Bhikkhunis to exchange salutations, rising, reverence, and proper
    duties according to seniority. Ananda relays the request. The Blessed One refuses,
    says such an order is impossible and unallowable, and tells the Bhikkhus not to
    perform these gestures or duties toward women, with a dukkata penalty for doing
    so. In the following section, Maha-pajapati approaches the Blessed One directly,
    bows, stands respectfully, and begins another question about precepts, but the
    passage ends mid-question.
  language: English
  quote_policy: summarized
