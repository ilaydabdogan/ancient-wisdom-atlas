canonical_text:
  quote: ''
  summary: The passage gives procedural instructions for handling a legal question
    among Bhikkhus. Incoming Bhikkhus are to explain the origin and progress of the
    case to the resident Bhikkhus and entrust it to them if they can settle it within
    a set time according to the Dhamma, the Vinaya, and the Master's teaching; otherwise
    the incoming Bhikkhus retain custody. If unclear or pointless speech arises during
    inquiry, the case is to be settled by referral to a jury or commission.
  language: English translation with Pali terms in notes
