  quote: ''
  summary: The passage gives disciplinary rules about appointing and performing Exhortation
    for Bhikkhunis, including qualifications, exceptions, duties to attend, penalties
    for refusal or neglect, and a complaint about Bhikkhunis wearing long fringed
    girdles resembling worldly women.
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu who is able and has eight qualifications is to be appointed to hold
    Exhortation to the Bhikkhunis, and the Bhikkhuni-saṅgha is to come to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If no Bhikkhu is appointed to hold Exhortation, the reciter of the Pātimokkha
    is to announce this and wish that the Bhikkhuni-saṅgha obtain its desire in peace.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Bhikkhus declined the office of Exhortation, the Blessed One ruled that
    it was not to be declined and that refusal incurred a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A certain Bhikkhu described himself as stupid and asked how he could accept
    Exhortation; the Blessed One then allowed all except the stupid to accept it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same type of case is said to be repeated for a sick Bhikkhu, a Bhikkhu
    on a journey, and a Bhikkhu living in the jungle; the jungle Bhikkhu is allowed
    to accept Exhortation and appoint a time and place for the meeting.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When Bhikkhus accepted Exhortation but did not perform it, the Blessed One
    ruled that it was not to be neglected and that neglect incurred a dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Bhikkhunis did not attend at the appointed place, the Blessed One ruled
    that a Bhikkhuni was not to omit attending there and that omission incurred a
    dukkaṭa offence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bhikkhunis wore long girdles and arranged fringes from them; people murmured
    and complained that this resembled women still enjoying worldly pleasures.
  category: action
  evidence_refs:
  - ev:7
