canonical_text:
  quote: ''
  summary: Anuruddha seeks permission from his mother to leave household life for
    the houseless state. She resists, then permits him only if his friend Bhaddiya,
    ruler of the Sakyas, also renounces. Anuruddha presses Bhaddiya, who delays but
    eventually agrees to leave after seven days to hand over the kingdom. A group
    of Sakya youths and Upali the barber depart, send back their retinue, discard
    fine possessions, and proceed toward the Blessed One. Upali fears returning alone,
    hangs the bundle of valuables on a tree as a gift, returns to the group, and is
    taken with them to the Blessed One, before whom they bow.
  language: English
  quote_policy: summarized
