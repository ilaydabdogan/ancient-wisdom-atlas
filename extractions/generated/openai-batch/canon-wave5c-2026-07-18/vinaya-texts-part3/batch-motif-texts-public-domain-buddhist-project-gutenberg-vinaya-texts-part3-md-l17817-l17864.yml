canonical_text:
  quote: ''
  summary: 'King Udena questions Ananda about the use of old dusters; Ananda says
    they are broken down for clay flooring. The king praises the Sakyaputtiya Samaras
    for conscientious communal use and gives Ananda more cloth. Later at the Ghosita
    Arama, Ananda informs the venerable AYzanna/Af/lanna that the Sawgha has imposed
    the higher penalty: Bhikkhus may not speak to, exhort, or admonish him. AYzanna
    compares this condition to being slain, faints, and afterward remains alone, remorseful,
    earnest, zealous, and resolved, soon attaining “that supreme” as the excerpt ends.'
  language: English translation with transliterated Indic terms
  quote_policy: summarized
