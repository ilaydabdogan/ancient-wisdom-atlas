canonical_text:
  quote: ''
  summary: 'The passage gives procedural rules for an incoming Bhikkhu entering an
    Arama or unoccupied Vihara: arranging his dress and belongings, locating resident
    monks, asking about water, cleaning sandals, observing seniority in salutations,
    inquiring about lodging and permitted resorts, asking about facilities and Saṅgha
    meeting arrangements, and inspecting a lodging before entering.'
  language: English translation with Pali terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before entering the Arama, the incomer is instructed to put down his sunshade,
    uncover his head, arrange his upper robe on his back, and enter carefully and
    slowly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After entering, the incomer is instructed to find where the resident Bhikkhus
    have gone, whether to the service hall, portico, or foot of a tree, and go there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The incomer is instructed to lay his bowl and robe to one side, take a suitable
    seat, and sit down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The incomer is instructed to ask which water is for drinking and which is
    for washing, and to fetch and use each as needed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: When washing his feet, the incomer is instructed to pour water with one hand
    and wash with the other, not to use one hand for both acts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The incomer is instructed to ask for sandal-cleaning cloths, clean the sandals
    first with a dry cloth and then with a wet cloth, wash the cloths, and set them
    aside.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If a resident Bhikkhu is senior, he is to be saluted; if junior, he is to
    be made to salute the incomer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The incomer is instructed to ask about his assigned lodging place and whether
    it is occupied or unoccupied.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The incomer is instructed to ask about lawful and unlawful resorts and about
    families officially declared to be in want.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The incomer is instructed to ask about retiring places, drinking-water, washing-water,
    walking staves, the Saṅgha conference place, and the times for entering and leaving
    it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the Vihara is unoccupied, the incomer is instructed to knock, wait, undo
    the bolt, open the door, and look inside while still standing outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage describes a possible condition of the Vihara as dusty, with beds
    or chairs piled together and bedding heaped on top.
  category: setting
  evidence_refs:
  - ev:6
