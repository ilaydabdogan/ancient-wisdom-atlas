canonical_text:
  quote: ''
  summary: 'A Vinaya passage describes decorated sleeping-rooms of the Titthiyas attracting
    public attention, after which the Blessed One permits Bhikkhus to use whitewash,
    black colouring, and red colouring in their Viharas. The passage then gives successive
    permissions for materials and methods to make whitewash adhere to rough walls:
    grain husk balls, soft clay, and finally tree slime or paste.'
  language: English translation
