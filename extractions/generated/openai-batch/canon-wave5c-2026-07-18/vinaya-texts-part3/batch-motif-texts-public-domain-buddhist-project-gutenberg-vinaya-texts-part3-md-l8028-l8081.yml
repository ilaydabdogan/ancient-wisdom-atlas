  quote: ''
  summary: In a Vinaya section on dwellings and furniture, red colouring matter fails
    to adhere to rough walls. The matter is reported to the Blessed One, who permits
    successive preparations and materials for smoothing and coating the walls. When
    the coating becomes too thick, he permits wiping it with a cloth. The excerpt
    then begins a similar case involving black colouring matter on rough ground.
