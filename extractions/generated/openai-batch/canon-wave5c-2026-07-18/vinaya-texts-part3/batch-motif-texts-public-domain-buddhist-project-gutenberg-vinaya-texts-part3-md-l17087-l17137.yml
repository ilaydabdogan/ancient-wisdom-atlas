canonical_text:
  quote: ''
  summary: 'Vinaya passage on bhikkhunis'' bathing conduct: scented clay is prohibited
    while common clay is allowed; steam-baths, bathing against the stream, and bathing
    in a place that is not a common bathing-place are each prohibited with a dukka/a
    penalty. A further episode reports public complaint when bhikkhunis bathe at a
    bathing-place also used by men.'
