canonical_text:
  quote: ''
  summary: The passage records rules on monks' bowls and related implements. After
    practical problems such as ant damage, breakage, wear, unsafe storage, or public
    criticism are reported to the Blessed One, he allows some supports and carrying
    devices and forbids other practices. It also forbids carrying water vessels on
    alms rounds, using skull bowls, and taking a vow to use only things from dust-heaps
    or cemeteries.
  language: English
  quote_policy: summarized
