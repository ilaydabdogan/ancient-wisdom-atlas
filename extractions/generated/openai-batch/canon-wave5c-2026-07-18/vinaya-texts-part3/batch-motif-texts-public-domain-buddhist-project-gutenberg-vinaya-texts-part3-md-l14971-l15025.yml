canonical_text:
  quote: ''
  summary: 'The passage states several lifelong rules for Bhikkhunis: a Bhikkhuni,
    even one of long standing, must honor and perform duties toward a newly initiated
    Bhikkhu; she must not spend the rainy season in a district without a Bhikkhu;
    every half month she must await from the Bhikkhu-saṅgha the Uposatha date and
    the time for exhortation; after the rainy season she must hold Pavāraṇā before
    both the Bhikkhu and Bhikkhuni Saṅghas concerning what has been seen, heard, and
    suspected. Notes identify parallels in other Vinaya sections and explain technical
    terms.'
  language: English translation with Indic technical terms
  quote_policy: summarized
