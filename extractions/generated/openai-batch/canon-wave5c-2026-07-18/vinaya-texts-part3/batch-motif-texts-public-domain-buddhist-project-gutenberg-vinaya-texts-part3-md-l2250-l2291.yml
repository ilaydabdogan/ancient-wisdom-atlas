canonical_text:
  quote: ''
  summary: The passage gives a formal procedure by which the Saṅgha appoints named
    Bhikkhus to a committee to settle a case. Approval is indicated by silence and
    dissent by speaking. If the appointed Bhikkhus settle the case, it is settled
    by the Proceeding in Presence, with the Dhamma, Vinaya, and the particular person
    represented. Reopening such a settled dispute is classified as a Pācittiya offence.
  language: English translation with Pali terms
  quote_policy: summarized
