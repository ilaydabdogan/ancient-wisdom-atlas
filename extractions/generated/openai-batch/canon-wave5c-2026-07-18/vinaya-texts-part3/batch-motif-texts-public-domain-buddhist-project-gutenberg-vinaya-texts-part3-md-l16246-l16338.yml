canonical_text:
  quote: ''
  summary: A Vinaya passage describes difficulties when women seeking upasampada are
    questioned about disqualifications. The Blessed One prescribes that Bhikkhunis
    receive one-sided initiation and clearance in the Bhikkhuni-saṅgha before initiation
    in the Bhikkhu-saṅgha, that candidates be instructed before being questioned,
    that instruction occur aside before public questioning, and that qualified Bhikkhunis
    serve as instructors. The passage also notes problems caused by ignorant, incompetent,
    or unappointed Bhikkhunis instructing candidates.
  language: English translation with Pali terms
  quote_policy: summarized
