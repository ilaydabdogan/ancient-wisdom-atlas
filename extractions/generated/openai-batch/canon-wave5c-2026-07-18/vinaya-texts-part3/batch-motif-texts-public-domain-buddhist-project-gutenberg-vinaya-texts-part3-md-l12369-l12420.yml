canonical_text:
  quote: ''
  summary: An admonitory passage warns against wicked desire by presenting Devadatta
    as formerly reputed wise and trained, then given to vanity and attack on the Tathagata,
    and finally fallen into Aviki hell. It states that sin pervades the injurer of
    the good or wrongless person, and uses an analogy of an ocean that cannot be befouled
    by one pot of poison when speaking of attempted verbal injury against the Tathagata.
    Notes gloss the fourfold guarding of hell and point to a comparison with the Kokaliya
    Sutta.
