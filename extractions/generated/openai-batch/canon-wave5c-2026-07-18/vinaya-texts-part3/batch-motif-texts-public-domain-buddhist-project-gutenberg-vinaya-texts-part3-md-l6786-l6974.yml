canonical_text:
  quote: ''
  summary: 'The passage gives several Vinaya rules for Bhikkhus: prohibitions on dressing
    or carrying burdens in ways likened to laymen or royal porters; rules allowing
    and limiting tooth-sticks; prohibitions on setting woods on fire and climbing
    trees, with exceptions for protection or misfortune; and the introduction of two
    brother Bhikkhus named Yame/u and Tekula.'
  language: English translation with Pali terms and editorial notes
  quote_policy: summarized
