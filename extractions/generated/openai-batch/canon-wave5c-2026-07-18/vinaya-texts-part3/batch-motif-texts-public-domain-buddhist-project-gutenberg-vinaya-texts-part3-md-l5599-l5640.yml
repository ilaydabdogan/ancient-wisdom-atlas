  summary: A formal motion before the Saṅgha states that Vaddha the Licchavi has made
    a groundless accusation of a breach of morality against Dabba the Mallian. The
    Saṅgha resolves to turn down the bowl with respect to Vaddha and to treat him
    as one having no dealings with the Saṅgha. Ananda later goes to Vaddha and informs
    him of the decision, after which Vaddha faints and falls.
