canonical_text:
  quote: ''
  summary: The passage gives several of the Eight Chief Rules for Bhikkhunis, states
    that Maha-pajapati the Gotami's acceptance of them will count as her initiation,
    and narrates Ananda relaying this between the Blessed One and Maha-pajapati. Maha-pajapati
    accepts the rules for life using a garland-adornment simile. Ananda reports her
    acceptance, and the Blessed One says that the permission for women to enter homelessness
    will shorten the duration of the good law, adding a house-and-burglars analogy
    that is incomplete in the supplied range.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists rules requiring a Bhikkhuni guilty of a serious offence
    to undergo Manatta discipline toward both Sanghas, requiring a trained novice
    to seek upasampada from both Sanghas, forbidding a Bhikkhuni to revile or abuse
    a Bhikkhu, and forbidding official admonition of Bhikkhus by Bhikkhunis while
    allowing admonition of Bhikkhunis by Bhikkhus.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One tells Ananda that if Maha-pajapati the Gotami takes upon herself
    the Eight Chief Rules, that is to be reckoned as her initiation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ananda learns the Eight Chief Rules from the Blessed One, goes to Maha-pajapati
    the Gotami, and tells her what the Blessed One said.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maha-pajapati says she takes the Eight Chief Rules upon herself for life,
    comparing this acceptance to a young person receiving a flower garland after bathing
    and placing it on the head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ananda returns to the Blessed One, bows, sits to one side, and reports that
    Maha-pajapati has accepted the Eight Chief Rules and received upasampada initiation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Blessed One states that if women had not received permission to leave
    household life and enter the homeless state under the Tathagata's doctrine and
    discipline, the good law would have stood for a thousand years, but with that
    permission it will stand for five hundred years.
  category: speech
  evidence_refs:
  - ev:5
