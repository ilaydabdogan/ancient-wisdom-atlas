canonical_text:
  quote: ''
  summary: 'A Bhikkhu who is about to warn another is instructed to examine whether
    he possesses five qualities: purity in bodily conduct, purity in speech, a kindly
    mind without anger toward companions in the religious life, mastery of the tradition
    and truths of the higher life, and complete knowledge of both Patimokkhas. If
    he lacks these qualities, others may tell him to continue training or learning.
    Upali then asks the Lord how many qualities such a Bhikkhu should establish within
    himself before warning another.'
  language: English
  quote_policy: summarized
