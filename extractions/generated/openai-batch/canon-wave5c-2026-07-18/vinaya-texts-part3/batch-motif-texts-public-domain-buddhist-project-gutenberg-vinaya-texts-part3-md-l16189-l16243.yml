canonical_text:
  quote: ''
  summary: A Vinaya passage on duties of Bhikkhunis reports that some Bhikkhunis were
    found with deformities. The matter is brought to the Blessed One, who prescribes
    that a woman receiving upasampadd initiation be questioned about twenty-four disqualifications,
    including bodily deformities, diseases, human and female status, freedom, debts,
    royal service, parental consent, age, and possession of robes and an alms-bowl.
    Editorial notes compare parts of the list with corresponding rules for Bhikkhus
    in the Mahavagga.
  language: English
  quote_policy: summarized
