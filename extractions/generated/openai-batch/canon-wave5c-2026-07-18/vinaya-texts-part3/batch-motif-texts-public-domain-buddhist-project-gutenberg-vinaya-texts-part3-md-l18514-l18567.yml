canonical_text:
  quote: ''
  summary: 'In a section headed as concerning the Council of Vesali, an unnamed speaker
    asks the Lord whether several disputed allowances are permissible: drinking milk
    in an intermediate state after a meal, drinking toddy or spirits not yet intoxicating,
    using an oversized unfringed rug or mat, and accepting gold and silver. The Lord
    says each is not allowable. The speaker then identifies these as theses put forth
    by the Vaggian Bhikkhus of Vesali and urges taking up the legal question before
    non-Dhamma and non-Vinaya spread.'
  language: English
  quote_policy: summarized
