canonical_text:
  quote: "“Go on, go on, O householder! Advance, and not retreat, shall profit thee.”"
  summary: A householder is urged to advance rather than retreat; darkness gives way
    to light and his fear is calmed. He reaches the Sitavana, meets the Blessed One
    at dawn, is greeted by name, bows at the Blessed One’s feet, and asks whether
    he has slept in peace. The Blessed One replies in verses describing the peaceful
    sleep of the liberated Arahat. He then teaches the householder progressively about
    giving, righteousness, heaven, the dangers of lusts, renunciation, and finally
    suffering, its origin, its cessation, and the path. A clean-cloth dyeing simile
    describes the householder’s readiness to receive the doctrine.
  language: English translation with Pali terms and names
  quote_policy: quoted
