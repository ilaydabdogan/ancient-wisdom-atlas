canonical_text:
  quote: ''
  summary: 'An unnamed speaker addresses the Lord, saying that the Blessed One has
    praised the advantages of one who wants little, is easily satisfied, has purified
    the mind of evil, quelled passions, and has faith, reverence, and zeal. The speaker
    proposes five lifelong disciplines for Bhikkhus, each paired with an offence for
    nonobservance: living in the woods, begging for alms, wearing cast-off rags, dwelling
    under trees, and abstaining from fish. Notes compare these proposals with other
    Vinaya and Mahavagga rules and passages.'
  language: English
  quote_policy: summarized
