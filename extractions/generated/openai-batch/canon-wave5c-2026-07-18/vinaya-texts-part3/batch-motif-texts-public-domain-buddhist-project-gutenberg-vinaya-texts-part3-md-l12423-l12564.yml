canonical_text:
  quote: ''
  summary: A brief verse counsels a wise Bhikkhu to rely on one whose way ends grief.
    Upali then asks the Blessed One how disunion, schism, and concord in the Samgha
    are constituted. The Blessed One defines numerical thresholds for disunion and
    schism, identifies which persons can count toward a schism, lists eighteen doctrinal
    and disciplinary reversals that constitute schismatic conduct when paired with
    independent communal acts, and states concord as the correct handling of those
    distinctions.
  language: English
  quote_policy: summarized
