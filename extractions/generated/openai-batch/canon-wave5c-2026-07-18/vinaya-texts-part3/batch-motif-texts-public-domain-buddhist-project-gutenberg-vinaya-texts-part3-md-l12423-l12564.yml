    way leads to the end of griefs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The venerable Upali approaches the Blessed One, bows, sits to one side, and
    asks about the meanings of disunion and schism in the Samgha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Blessed One says that smaller divided groups using a formal proposition
    and voting-tickets can make disunion in the Samgha without making schism.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blessed One says that four on one side and four on the other with a ninth
    participant, or a separation of nine or more, constitutes both disunion and schism
    in the Samgha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Bhikkhuni, female novice, male or female Samanera, layman, or laywoman cannot
