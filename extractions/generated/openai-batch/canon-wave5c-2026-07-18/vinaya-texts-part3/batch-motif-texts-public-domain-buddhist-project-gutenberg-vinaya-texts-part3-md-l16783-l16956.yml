canonical_text:
  quote: ''
  summary: The passage gives Vinaya procedures and rulings concerning upasampadā initiation
    for a Bhikkhuni, post-initiation instruction, restrictions on Bhikkhunis living
    in the forest, approved residences for Bhikkhunis, and rules for an unknowingly
    pregnant woman received among the Bhikkhunis, including child care and the appointment
    of a companion Bhikkhuni.
  language: English translation with Pali technical terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A learned and competent Bhikkhu is instructed to lay a motion before the Saṅgha
    to confer upasampadā initiation on N.N., with M.M. as proposer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ordination formula directs approving members to remain silent and dissenting
    members to speak; the motion is repeated three times, and silence is treated as
    approval.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the initiation, Bhikkhus are told to measure the shadow, state the season,
    date, and part of the day, tell the whole formula, and instruct Bhikkhunis to
    teach the new Bhikkhuni three allowed things and eight interdicted things.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhikkhunis were living in the forest, and men described as of abandoned life
    violated them; the Blessed One ruled that a Bhikkhuni must not adopt forest life,
    with a dukkaṭa penalty for doing so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A lay disciple gave a servant’s lodge to the Bhikkhuni-saṅgha, and subsequent
    rulings allowed a stable, a separate residence, building operations, and assigned
    places for Bhikkhunis.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman who was already pregnant but did not know it was received among the
    Bhikkhunis; after her womb moved, she asked how to conduct herself toward the
    child, and the Blessed One allowed her to raise it until it reached years of discretion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Because the pregnant Bhikkhuni could not live alone and another Bhikkhuni
    could not live with a male child, the Blessed One allowed the Bhikkhunis to depute
    one Bhikkhuni as her companion by formal motion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The companion Bhikkhuni is instructed to conduct herself toward the child
    as toward other men, except in the matter of sleeping under the same roof.
  category: relationship
  evidence_refs:
  - ev:7
