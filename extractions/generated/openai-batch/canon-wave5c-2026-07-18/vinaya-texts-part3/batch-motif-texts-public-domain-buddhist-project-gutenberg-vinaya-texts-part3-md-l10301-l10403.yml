canonical_text:
  quote: ''
  summary: The passage gives a sequence of monastic disciplinary rulings. Certain
    skins, rugs, and cloths are allowed as foot-wiping mats. Bhikkhus are forbidden
    to soil sleeping mats by walking on them with unwashed or wet feet or sandals.
    Spitting on newly prepared floors is forbidden and a spittoon is allowed. Floor-cloth
    is allowed to prevent scratches from bedsteads and chairs. Leaning against newly
    prepared walls is forbidden; a leaning board is allowed, then cloth coverings
    for the board are allowed after it damages floor and wall surfaces. The passage
    also notes monks hesitating to lie down in places where walking with washed feet
    was permitted.
  language: English
  quote_policy: summarized
