canonical_text:
  quote: ''
  summary: The Vajjian Bhikkhus of Vesali offer monastic requisites first to Revata
    and then to Uttara. Revata refuses, and Uttara initially refuses, but after being
    pressed with a precedent involving offerings to the Blessed One and Ananda, Uttara
    accepts one robe and agrees to convey their request. The Vajjian Bhikkhus ask
    Uttara to urge Revata to declare in the Saṅgha that Buddhas are born in the East
    and that Eastern Bhikkhus, unlike Western Bhikkhus, hold views in accord with
    the Dhamma. Revata rebukes Uttara for urging what is against the Dhamma and dismisses
    him. The Vajjian Bhikkhus then take dependence under Uttara, and the Saṅgha meets
    to decide the legal question; Revata proposes that it be settled where it arose.
  language: English
  quote_policy: summarized
