canonical_text:
  quote: ''
  summary: 'The passage gives Vinaya regulations for allotting communal lodging-places:
    appointing an impartial Bhikkhu as apportioner, counting Bhikkhus and sleeping-places,
    using apartments or buildings as allocation units when some remain unallotted,
    allowing supplementary shares, and addressing a late arrival and a monk outside
    the district boundary.'
  language: English
  quote_policy: summarized
