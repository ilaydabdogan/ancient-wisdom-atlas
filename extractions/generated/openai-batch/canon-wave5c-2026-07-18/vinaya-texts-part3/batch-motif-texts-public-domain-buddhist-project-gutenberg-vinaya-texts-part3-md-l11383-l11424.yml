canonical_text:
  quote: ''
  summary: Ministers take the prince to the ruler of Magadha, Seniya Bimbisara, and
    report what happened. The king asks what advice the ministers gave, states that
    the Buddha, Dhamma, and Sazzzgha are not responsible for Devadatta’s acts, assigns
    different offices or penalties to ministers according to their advice, and asks
    prince A^atasattu why he wanted to kill him.
