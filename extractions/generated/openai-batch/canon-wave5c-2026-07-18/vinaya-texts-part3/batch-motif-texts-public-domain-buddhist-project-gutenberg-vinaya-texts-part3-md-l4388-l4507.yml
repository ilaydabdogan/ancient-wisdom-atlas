canonical_text:
  quote: ''
  summary: 'The passage records practical Vinaya allowances given by the Blessed One
    for Bhikkhus: protecting and hanging the KaMina/Kaṭhina item, using bags and straps
    for drugs and sandals during travel, and using strainers so water can be drunk
    without breaking rules. It also includes brief editorial notes on readings and
    terms.'
  language: English translation with transliterated Indic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One permits the Bhikkhus to fold the KaMina/Kaṭhina item in a
    cow-hide, then permits strings to tie it, and later permits hanging it on a wall
    stake or hook after it falls and breaks when leaned against a wall or pillar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One stays at Rājagaha as long as he thinks fit and then sets out
    toward Vesālī.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While going along, the Bhikkhus carry needles, scissors, and drugs in their
    bowls; the Blessed One permits a bag for carrying drugs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the bags lack shoulder-straps, the Blessed One permits a shoulder-strap
    or a string to tie the bags on with.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Bhikkhu ties his sandals to his girdle and enters a village for alms; an
    Upāsaka saluting him knocks his head against the sandals, the Bhikkhu is annoyed,
    and the matter is reported.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the sandal incident, the Blessed One permits a bag for carrying sandals,
    and again permits a shoulder-strap or tying string for bags.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: During travel, water cannot be drunk without breaking rules because the Bhikkhus
    have no strainers; the Blessed One permits a strainer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A translator's note explains the relevant rule as the rule against destroying
    the life of living things.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: A small cloth used as a strainer is not sufficient to filter enough water
    for the whole party.
  category: object
  evidence_refs:
  - ev:6
