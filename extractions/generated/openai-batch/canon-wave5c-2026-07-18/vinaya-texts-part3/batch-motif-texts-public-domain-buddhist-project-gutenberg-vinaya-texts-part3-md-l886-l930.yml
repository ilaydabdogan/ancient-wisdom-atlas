canonical_text:
  quote: ''
  summary: The passage sets out cases concerning a monastic dispensation for those
    who are no longer insane. A sane monk who has committed an offence and deceptively
    acts like an insane person when warned is not validly granted the dispensation.
    A monk who was insane and out of his mind, committed improper acts or speech while
    in that state, and genuinely does not remember the offences may validly receive
    the dispensation.
  language: English translation with Indic monastic terms
