  summary: 'The passage gives monastic rules for Bhikkhus: facial and bodily cosmetic
    practices are prohibited, with an exception for disease; attendance at dancing,
    singing, and music is prohibited after some Bhikkhus attend a mountain-top festival
    at Rajagaha and the public criticizes them as worldly.'
