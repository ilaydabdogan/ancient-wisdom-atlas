canonical_text:
  quote: "“rejecting the sense for the shadow of the letter”"
  summary: The passage gives a procedure for a dispute in which a Bhikkhu who preaches
    the Dhamma lacks the relevant transmitted texts or interprets without regard to
    the point of the case. A discreet and able Bhikkhu is to propose that this Bhikkhu
    be sent away so the rest may settle the case. If a committee cannot settle it,
    the case is handed to the Sawgha and settled by majority vote.
