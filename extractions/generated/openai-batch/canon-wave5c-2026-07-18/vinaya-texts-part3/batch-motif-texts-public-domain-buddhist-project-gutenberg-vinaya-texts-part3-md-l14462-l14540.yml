canonical_text:
  quote: ''
  summary: The passage describes legally valid inhibition of the Patimokkha when a
    Bhikkhu guilty of a Paragika offence, or one who has abandoned the precepts, is
    present in the assembly. It specifies grounds for action by sight, report, or
    confession; gives the resolution to interdict the Patimokkha on Uposatha day;
    and explains how an unfinished matter may be resumed if the assembly disperses
    because of one of the Ten Dangers.
  language: English
  quote_policy: summarized
