  summary: A Vinaya passage describes several cases in which monks' bowls are damaged
    because they are left unsupported in the open air, placed on edges, or set upside
    down on the ground. Each incident is reported to the Blessed One, who permits
    supports for bowls and prohibits unsafe placements, assigning a dukkaṭa offence
    for violations.
