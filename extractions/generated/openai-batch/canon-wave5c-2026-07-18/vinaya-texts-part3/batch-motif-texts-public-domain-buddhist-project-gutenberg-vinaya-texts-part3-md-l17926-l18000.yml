canonical_text:
  quote: ''
  summary: The passage opens the Twelfth Khandhaka on the Council of Vesali. A century
    after the death of the Blessed One, Vaggian Bhikkhus of Vesali promulgate ten
    permissive theses. Yasa, son of Kakandaka, arrives at Vesali. On Uposatha day
    the Vaggian Bhikkhus place a water-filled copper pot in the midst of the Sangha
    and ask lay disciples for coins for Sangha utensils. Yasa tells the lay disciples
    not to give, saying gold and silver are not allowed to the Sakyaputtiya Samanas.
    The lay disciples give money anyway; the Vaggian Bhikkhus divide it and offer
    Yasa his portion.
  language: English translation with Indic proper names and technical terms
  quote_policy: summarized
