canonical_text:
  quote: ''
  summary: After the Thera Bhikkhus complete a collective chanting of the Dhamma and
    Vinaya, the venerable Purina visits them and states that he will preserve the
    teaching as he heard it from the Blessed One. Ananda reports the Blessed One's
    deathbed instruction to impose a higher penalty on Khanna, then travels with five
    hundred Bhikkhus by boat to Kosambi. Near king Udena's park, palace ladies visit
    Ananda, hear religious discourse, and give him five hundred robes. King Udena
    questions the large gift, and Ananda explains a chain of distribution and reuse
    of robes and worn cloth.
  language: English translation
  quote_policy: summarized
