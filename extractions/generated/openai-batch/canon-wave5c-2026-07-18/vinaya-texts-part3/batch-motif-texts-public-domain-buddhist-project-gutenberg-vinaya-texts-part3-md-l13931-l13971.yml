canonical_text:
  quote: ''
  summary: In the Ninth Khandhaka, on exclusion from the Patimokkha ceremony, the
    Blessed One sits among the Bhikkhu-saṅgha at Savatthi on Uposatha Day. Ananda
    repeatedly requests, as the night passes through its watches toward dawn, that
    the Blessed One recite the Patimokkha to the Bhikkhus. The Blessed One remains
    silent until he states that the assembly is not pure.
