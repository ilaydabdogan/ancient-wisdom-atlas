canonical_text:
  quote: ''
  summary: The passage gives rules for Bhikkhus' conduct at communal meals and on
    alms rounds. It recounts an incident in which a Bhikkhu accidentally entered an
    inner chamber where a woman slept naked, was accused and beaten by her husband,
    and was freed after the woman denied misconduct. The Blessed One then establishes
    further alms-round duties, including proper dress, careful entry and exit, receiving
    food in the bowl, and return and cleanup duties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu is not to begin eating until boiled rice has been served out to
    all.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alms are to be eaten with alert attention to the bowl, equal curry, properly
    formed mouthfuls, and without listed improper gestures such as talking with the
    mouth full, licking fingers, or smacking lips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The senior Bhikkhu is not to accept rinsing water until all Bhikkhus have
    finished eating; on returning, junior Bhikkhus go first and senior Bhikkhus after
    them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhikkhus going for alms are described as improperly dressed, not decently
    attired, entering and leaving dwellings without deliberation or roughly, and standing
    at unsuitable distances or times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A certain Bhikkhu, while on alms round, mistook a doorway for a house-door,
    entered an inner chamber, saw a woman sleeping naked on her back, and went out
    again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman's husband thought she had been defiled by the Bhikkhu, seized and
    beat him; the woman denied this and said the Bhikkhu had done nothing, after which
    he was set free.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the matter was reported, the Blessed One announced that he was establishing
    a rule of conduct for Bhikkhus going on alms rounds.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The alms-round rule requires proper dress, deliberate noticing of the way
    in and out of a dwelling, non-rough entry and exit, and proper distance and duration
    when standing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Bhikkhu is to notice signs that the person in the house seems willing to
    give food or curry, receive food into his bowl with both hands, and not look into
    the face of the woman giving food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first Bhikkhu back from the village should prepare seats, water, footstools,
    towels, and the waste-tub; the last back may eat leftovers or dispose of them
    in specified places and then put away or clean the items.
  category: action
  evidence_refs:
  - ev:6
