  summary: The passage states conditions under which a Sa^gha dispensation for a formerly
    insane monk is valid, narrates improper official acts by a group of Bhikkhus against
    monks who had not confessed guilt, reports the Blessed One's rebuke and rule against
    such acts, and gives an example of invalid procedure when an offence is handled
    under the wrong offence category.
