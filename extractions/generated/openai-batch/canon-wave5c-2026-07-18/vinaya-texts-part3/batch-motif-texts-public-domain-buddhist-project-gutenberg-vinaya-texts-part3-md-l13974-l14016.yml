canonical_text:
  quote: "“The assembly, Ananda, is not pure.”"
  summary: The venerable Maha Moggallana reflects on the Blessed One’s statement that
    the assembly is not pure, examines the minds of the Bhikkhu-saṅgha, identifies
    an impure individual seated among them, orders him to arise and leave, and finally
    removes him beyond the porch and bolts the door.
