canonical_text:
  quote: ''
  summary: 'A Vinaya passage records rules for behavior at a meal: the Blessed One
    permits the giving of thanks, assigns the senior monk to give thanks, later permits
    several senior or near-senior monks to wait when Sariputta is left alone, allows
    departure in cases of necessity after informing the next monk, and describes misconduct
    by the Oabbaggiya Bhikkhus involving improper dress, pushing ahead of seniors,
    and taking seats improperly.'
  language: English
  quote_policy: summarized
