  quote: ''
  summary: The passage describes elder monks organizing around a difficult Vinaya
    dispute, gathering ascetic Arahats at Ahoganga Hill, seeking the support of the
    learned Revata, and Yasa beginning to question Revata on disputed disciplinary
    theses such as carrying salt in a horn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yasa Kakandaka-putta urges Sambhuta Sanavasi to take charge of the question
    before what is not Dhamma or Vinaya spreads and before opponents of Dhamma and
    Vinaya become powerful.
  category: speech
  evidence_refs:
  - ev:1
