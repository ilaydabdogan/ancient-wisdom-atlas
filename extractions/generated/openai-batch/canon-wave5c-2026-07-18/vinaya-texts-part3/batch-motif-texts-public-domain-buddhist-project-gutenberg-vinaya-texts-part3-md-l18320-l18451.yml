- id: obs:3
  text: About sixty Bhikkhus from the Western country assemble at Ahoganga Hill; they
    are described as hermits, alms-livers, wearers of cast-off clothes, keepers of
    only three robes, and Arahats.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: About eighty-eight Bhikkhus from Avanti and the Southern country meet the
