canonical_text:
  quote: ''
  summary: The passage gives monastic legal procedures for granting acquittal to Dabba
    the Mallian, who is said to be harassed by a groundless accusation while conscious
    of innocence. It then sets out conditions for a lawful acquittal, narrates the
    case of Gagga, who committed acts while insane and does not remember them, and
    has the Blessed One instruct the Saṅgha to grant Gagga a dispensation for those
    who are no longer insane. The passage closes by beginning rules on when such dispensations
    are invalid or valid.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dabba the Mallian is to extend joined palms and state that followers of Mettiya
    and Bhummayaka are harassing him with a groundless charge of breach of morality.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dabba says he has a clear conscience and asks the Saṅgha for the acquittal
    accorded to those conscious of innocence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An able and discreet Bhikkhu is instructed to lay a formal resolution before
    the Saṅgha concerning Dabba’s requested acquittal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The formal decision procedure asks supporters to remain silent and opponents
    to speak, repeats the matter a second and third time, and concludes that silence
    signifies approval.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Five conditions are stated for a lawful grant of acquittal to one conscious
    of innocence: the monk is innocent, others censured him, he asks the Saṅgha, the
    Saṅgha grants it, and the Saṅgha is duly held and constituted.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gagga is described as insane and out of his mind, and many unworthy things
    are said to have been committed by him in speech and act while in that state.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: When asked whether he recalls a fault, Gagga answers that he was insane, does
    not recollect it, and that it was done by reason of his insanity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some Bhikkhus continue warning Gagga after his answer, while moderate Bhikkhus
    become annoyed and report the matter to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Blessed One rebukes the Bhikkhus who persisted and instructs that the
    Saṅgha grant Gagga, now sane, the dispensation for those no longer insane.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage begins rules on grants of dispensation for those no longer insane,
