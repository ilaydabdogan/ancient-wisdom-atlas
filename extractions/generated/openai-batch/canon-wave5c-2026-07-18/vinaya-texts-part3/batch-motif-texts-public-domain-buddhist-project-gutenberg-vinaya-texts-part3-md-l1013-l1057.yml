canonical_text:
  quote: ''
  summary: 'The passage states a monastic legal rule: an official act is invalid if
    a monk, when warned for one offence, confesses a different offence; it is valid
    when the charge, confession, and communal action concern the same offence. It
    then introduces an occasion when assembled Bhikkhus became violent, quarrelsome,
    and disputatious, wounding one another with sharp words. A note glosses the expression
    literally as “mouth-javelins.”'
  language: English translation with Pali terms and OCR/transliteration irregularities
  quote_policy: summarized
