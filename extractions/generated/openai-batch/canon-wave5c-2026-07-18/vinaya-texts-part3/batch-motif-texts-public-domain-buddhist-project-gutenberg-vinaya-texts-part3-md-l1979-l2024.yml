canonical_text:
  quote: ''
  summary: 'The passage defines settlement of monastic disputes by a Proceeding in
    presence. It lists the required presences: the Sawgha/Sa^zgha, the Dhamma, the
    Vinaya, and the particular person. It then explains the conditions for the presence
    of the assembly and for the presence of the Dhamma and Vinaya.'
  language: English translation with Pali terms
  quote_policy: summarized
