canonical_text:
  quote: ''
  summary: In a passage on the Council of Vesali, a group travels upstream by boat,
    disembarks, and eats at the foot of a tree. The venerable SaZ 4 a/Sa/Z^a, while
    secluded in meditation, considers whether Eastern or Western Bhikkhus hold the
    view more in accord with the Dhamma. After reviewing the Dhamma and Vinaya in
    his mind, he concludes that the Western Bhikkhus are in accord. A deity from the
    Pure Abode appears before him, confirms this conclusion, and urges him to stand
    by the Dhamma. SaZ 4 a replies that he does so, but will not make his opinion
    public until appointed judge by the Saṅgha. The passage then notes that Vaggian
    Bhikkhus of Vesali take property and go to a place, with the sentence continuing
    beyond the excerpt.
  language: English
  quote_policy: summarized
