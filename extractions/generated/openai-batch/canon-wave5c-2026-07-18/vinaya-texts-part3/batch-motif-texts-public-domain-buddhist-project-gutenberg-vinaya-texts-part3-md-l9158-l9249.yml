canonical_text:
  quote: ''
  summary: A partridge, monkey, and elephant determine seniority by memories connected
    to a banyan tree. The partridge is acknowledged as oldest because it caused the
    tree to grow from a seed it voided after eating a fruit. The others honor the
    partridge and follow its counsel; all three observe the Five Precepts, live in
    mutual reverence, and are reborn in heaven. The speaker applies this animal example
    to the Bhikkhus, enjoining reverence, salutation, and allocation of best seat,
    water, and food according to seniority, while limiting exclusive appropriation
    of communal property and beginning a list of persons not to be saluted.
  language: English
  quote_policy: summarized
