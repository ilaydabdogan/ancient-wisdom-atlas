canonical_text:
  quote: "“Impermanent are all component things.”"
  summary: The passage first states a rule that Bhikkhunis may not bathe at bathing-places
    used by men and may bathe at those used by women. It then begins the Eleventh
    Khandhaka on the Council of Ragagaha, where Maha Kassapa recounts traveling with
    about five hundred Bhikkhus, encountering a naked ascetic carrying a Mandarava
    flower, and learning from him that Samara Gotama has been dead for a week. Some
    monks grieve intensely; Arahats remain composed and reflect on impermanence. Maha
    Kassapa urges the monks not to lament, citing the necessity of separation and
    dissolution. Subhadda then says the community is well rid of the great Samara
    and can now do as it likes.
  language: English translation
  quote_policy: quoted
