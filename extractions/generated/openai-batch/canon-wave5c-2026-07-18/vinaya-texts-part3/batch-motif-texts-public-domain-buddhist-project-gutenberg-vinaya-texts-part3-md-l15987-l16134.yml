canonical_text:
  quote: ''
  summary: A Vinaya passage gives disciplinary rules concerning Bhikkhunis yielding
    way to Bhikkhus, a Bhikkhuni carrying a foetus in her bowl, rules for showing
    a bowl to a Bhikkhu, transfer and redistribution of food gifts, stored food, bedding
    loans between Bhikkhus and Bhikkhunis, and restrictions related to blood-soiled
    stuffed furniture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rule prescribes that a Bhikkhuni who sees a Bhikkhu should get out of the
    way while still at a distance and make room for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman whose husband was on a journey became pregnant by a paramour and had
    a premature delivery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman asked a confederate Bhikkhuni to carry away the foetus in the Bhikkhuni's
    bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bhikkhuni placed the foetus in her bowl, covered it with her upper robe,
    and went away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Bhikkhu on alms-pilgrimage had vowed not to eat the first food given to
    him until he had given some of it to a Bhikkhu or Bhikkhuni.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bhikkhu repeatedly invited the Bhikkhuni to take food, and she repeatedly
    refused.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When pressed by the Bhikkhu, the Bhikkhuni pulled out her bowl and showed
    him its contents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bhikkhu became indignant, remonstrated, reported the matter to other Bhikkhus,
    and the matter was told to the Blessed One.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A rule states that a Bhikkhuni is not to carry away a foetus in her bowl,
    and that she may pull out her bowl and show it to a Bhikkhu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Lay people gave food to Bhikkhus, the Bhikkhus gave it to Bhikkhunis, and
    the lay people complained that what was given for the Bhikkhus had been given
    away to others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A rule states that a Bhikkhu is not to give away to others what was given
    for the Bhikkhus themselves to have.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When Bhikkhus came into possession of meat or food, they were allowed to give
    it to the Sangha; when too much came into their possession, a further rule addressed
    what had been given to special individuals and what belonged to the Sangha as
    a whole.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Food stored up for Bhikkhus could be enjoyed by Bhikkhunis after being given
    over to them by Bhikkhus, and the passage notes a reciprocal repetition with Bhikkhuni
    and Bhikkhu reversed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bhikkhus had bedding while Bhikkhunis had none; the Bhikkhunis sent a messenger
    requesting bedding on loan, and the loan was allowed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Bhikkhunis in their courses sat or lay on stuffed bedsteads and chairs, and
    the stuffing was soiled with blood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A rule states that a Bhikkhuni is not to sit or lie on a stuffed bedstead
    or chair, and allows use of an indoor's robe; the robe then became soiled.
  category: action
  evidence_refs:
  - ev:9
