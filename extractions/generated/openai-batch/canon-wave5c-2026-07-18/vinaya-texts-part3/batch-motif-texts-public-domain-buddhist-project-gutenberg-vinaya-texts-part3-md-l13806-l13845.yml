canonical_text:
  quote: ''
  summary: The passage gives rules for handling floor coverings, conduct in lodging
    with an older Bhikkhu, and behavior when walking on the same path as a senior.
    It then reports that a group of Bhikkhus, angered after being hindered by senior
    Bhikkhus in the hot bath-room, made a fire, blocked the doorway, and caused other
    Bhikkhus to faint from heat before the matter was reported to the Blessed One.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Floor coverings are to be dried in the sun, with instructions linked to an
    earlier passage and a specified phrase substitution about returning them to the
    place where they stood or lay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikkhu dwelling in the same Vihara with an older Bhikkhu is not to conduct
    recitation, examination, exhortation, or Dhamma speech to a pupil without asking
    the senior's leave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the same lodging situation, a lamp is not to be lighted or extinguished,
    and lattices are not to be opened or closed, without the older Bhikkhu's leave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When walking on the same Vankama with an older Bhikkhu, the other Bhikkhu
    is to turn back where the senior turns back and avoid touching the senior even
    with the corner of his robe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that this is a rule of conduct laid down for Bhikkhus in
    respect of lodging-places.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After being hindered by senior Bhikkhus in use of the hot bath-room, the fV/^abbaggiya
    Bhikkhus piled sticks in the fireplace, set fire to them, closed the doorway,
    and sat in the doorway.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bhikkhus were scorched by heat, were not allowed a way out, and fell down
    in a faint.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sober Bhikkhus murmured and told the Blessed One about the incident.
