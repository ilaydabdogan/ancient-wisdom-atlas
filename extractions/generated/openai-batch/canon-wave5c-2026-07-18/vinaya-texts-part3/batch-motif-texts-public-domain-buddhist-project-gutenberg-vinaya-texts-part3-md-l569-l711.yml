canonical_text:
  quote: Methinks the very water has taken fire.
  summary: A group of Bhikkhus persuade Bhikkhuni Mettiya to accuse the venerable
    Dabba the Mallian before the Blessed One. The Blessed One convenes the Sangha
    and questions Dabba, who denies any sexual misconduct. The Bhikkhuni is expelled,
    the instigating Bhikkhus confess that they set her on out of anger to cause Dabba's
    fall, and the Blessed One directs that Dabba be granted the formal Proceeding
    for the consciously innocent. The passage then begins instructions for the ritual
    manner in which Dabba should approach the Sangha.
  language: English
  quote_policy: quoted
