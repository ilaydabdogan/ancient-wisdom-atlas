canonical_text:
  quote: ''
  summary: People criticize Devadatta for attempting to stir division in the Saṅgha.
    The Bhikkhus report this to the Blessed One, who questions Devadatta. Devadatta
    admits it. The Blessed One warns him that breaking a peaceful Saṅgha brings a
    fault lasting for a kalpa and boiling in niraya, while making peace in a divided
    Saṅgha brings highest merit and happiness in heaven for a kalpa.
  language: ''
  quote_policy: summarized
