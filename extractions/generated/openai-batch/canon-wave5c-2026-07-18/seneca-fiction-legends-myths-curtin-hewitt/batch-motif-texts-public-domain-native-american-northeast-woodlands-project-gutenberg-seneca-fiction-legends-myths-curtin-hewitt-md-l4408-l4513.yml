canonical_text:
  quote: ''
  summary: A great Blacksnake brings the young man safely upward. The elder brother
    disguises himself in the old man's shabby clothes while the old thief, wearing
    the stolen panther-skin robe, reaches the chief's village, crosses the river with
    the eldest daughter, and marries her. The next evening the disguised elder brother
    and Turkey Brother arrive; the youngest daughter questions him about the sorcerer's
    spring and the old man by the tree, recognizes him as the expected man, and marries
    him. The old thief is bitten by the fisher in the pouch. The true husband produces
    black and later white wampum in the chief's bowl, while the thief's imitation
    produces foul decayed creatures and is rejected.
  language: English
  quote_policy: summarized
