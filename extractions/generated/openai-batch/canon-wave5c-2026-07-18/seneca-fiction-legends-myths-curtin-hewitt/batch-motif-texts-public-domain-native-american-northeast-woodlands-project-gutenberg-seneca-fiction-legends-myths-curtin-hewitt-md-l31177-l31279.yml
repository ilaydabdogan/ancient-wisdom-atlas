canonical_text:
  quote: ''
  summary: Two opposing peoples meet at a river to end mutual violence. Their chiefs
    agree to bury weapons deep in the ground, prepare a symbolic field of peace, cross
    the river, take one another by the arm, dance through the night, give thanks at
    dawn to the maker of their lives, and return home with peace lasting thereafter.
    The passage then begins a new story about white pigeons as chiefs among wild pigeons
    and a white pigeon entering Wild Cat's forest lodge.
  language: English
  quote_policy: summarized
