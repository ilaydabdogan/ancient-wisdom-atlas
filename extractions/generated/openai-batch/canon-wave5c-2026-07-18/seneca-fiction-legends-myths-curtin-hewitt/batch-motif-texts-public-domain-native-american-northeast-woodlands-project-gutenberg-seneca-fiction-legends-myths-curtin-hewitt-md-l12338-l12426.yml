canonical_text:
  quote: ''
  summary: A man and his dogs are separated from two children, who are found crying
    near a village by a young woman and her grandmother. The women adopt the boys,
    who grow and hunt. The father is directed to the lodge by an invisible brother,
    and the boys later find his dogs and return home with them, reuniting the family.
    The passage then begins a new account introducing Doonongaes, a being with orenda
    who claims Long Lake and its waters.
