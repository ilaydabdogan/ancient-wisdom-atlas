canonical_text:
  quote: ''
  summary: A young man travels with twenty warriors. After a dream warning is rejected
    by the headman, the party encounters tracks of the deadly magical bear Ganiagwaihegowa.
    The young man separates from the party, confronts the bear, exhausts it by repeated
    stream crossings, wounds it with arrows, and kills it. He takes hairs and a tooth
    from the bear, rejoins the party, and proves the kill. The warriors burn the carcass
    and take ashes and bone fragments as medicine after stating desired powers. The
    young man keeps his chosen bear parts secret and gains respect as a person of
    great magical power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twenty warriors set out, and the young man went with them; at night the other
    men shared fires while the boy made a fire for himself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man appeared to the young man in a dream and warned that the party would
    perish at noon the next day unless they changed course.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The headman scolded the young man after hearing the dream and led the party
    onward northward without heeding the warning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The party found tracks said to belong to Ganiagwaihegowa, a being whose magic
    lets it know when anyone looks at its tracks and then return to destroy that person.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man insisted on seeing the bear, while the others turned in a different
    direction and told him not to follow them if he met it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man broke a small tree, hung his bundle in its crotch, and continued
    along the trail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: He saw a great bear sitting on the trail; it was described as having no hair
    on its body except a little at the end of its tail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young man struck the bear with an arrow, and the bear chased him closely
    enough for him to feel its breath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At a deep-looking stream, the young man repeatedly jumped back and forth across
    the water, while the bear followed; the young man grew stronger and the bear weakened.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bear followed the young man's tracks by scent rather than by sight.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the bear was failing, the young man shot an arrow into one of its forefeet;
    the bear staggered, fell, rose, struggled, and finally died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The young man took three hairs from the bear's whiskers and one tooth from
    its mouth before returning to the warriors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The warriors saw the bear's enormous body, burned it through the night, and
    planned to take ashes and bone fragments as medicine for magical power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Before taking a bone fragment, each man was told to say what gift or power
    he wanted; most requested hunting skill, bravery, or speed, while one requested
    admiration by women.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The young man did not reveal that he had taken bear parts said to be good
    for every purpose, and the warriors then respected him as a person of great magical
    powers.
  category: relationship
  evidence_refs:
