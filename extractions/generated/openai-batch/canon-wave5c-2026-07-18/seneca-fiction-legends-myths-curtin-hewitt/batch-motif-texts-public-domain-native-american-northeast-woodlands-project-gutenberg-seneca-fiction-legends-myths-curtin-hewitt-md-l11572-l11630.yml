canonical_text:
  quote: ''
  summary: A youth learns songs, thanksgiving, and dance from birds and is described
    as becoming wise. He warns his elder brother that songs can be dangerous if sung
    carelessly. While hunting, a large bird sings from a large tree, and the elder
    brother concludes that a higher magic power directs birds to teach powerful songs.
    The elder brother shares another song about daybreak and sunbeams. Later, the
    youth insists on wearing a turkey-skin garment, imitates turkeys, loses his former
    voice, and the garment becomes impossible to remove because it has grown to his
    body.
  language: English
  quote_policy: summarized
