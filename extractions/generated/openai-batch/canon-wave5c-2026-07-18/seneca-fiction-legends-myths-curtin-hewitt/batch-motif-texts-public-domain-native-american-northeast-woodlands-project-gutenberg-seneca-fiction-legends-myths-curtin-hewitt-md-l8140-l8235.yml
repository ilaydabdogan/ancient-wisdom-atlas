canonical_text:
  quote: ''
  summary: 'Hodadenon kills three man-eating women, reports his victories to his sister,
    and then sets out to obtain chestnuts. On the way he passes several guarded places
    by feeding or paying the guardians: rattlesnakes, very tall beings, herons, and
    a walking woman''s skin on a platform. Using wampum made from bark and travel
    inside a mole, he takes half a chestnut, evades pursuing women by disappearing
    underground, and returns unharmed. Later he hears his brother calling from the
    east; his sister says the brother is tied to a stake and burned so that his tears
    become wampum. She also says tobacco was stolen and taken to the other side of
    the world by the wizard Deagahgweoses. Hodadenon prepares to travel again.'
  language: English
  quote_policy: summarized
