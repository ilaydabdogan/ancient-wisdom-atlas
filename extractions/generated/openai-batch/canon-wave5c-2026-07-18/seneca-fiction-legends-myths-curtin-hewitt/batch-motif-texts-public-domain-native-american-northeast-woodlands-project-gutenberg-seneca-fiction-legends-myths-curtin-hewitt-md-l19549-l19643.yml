canonical_text:
  quote: If you find me, I lose my head ; if I find you, I take yours.
  summary: Two boys return to their father, recount prior adventures, and insist on
    going farther despite warnings about dangerous uncles with orenda. They travel
    by stages called “looks” to an uncle’s lodge. The uncle proposes a hide-and-seek
    game in which the loser’s head is taken. In the first round the younger boy hides
    in a log and the elder behind the sun, and the uncle cannot find them. In the
    second round the uncle hides in a small bag hanging from the rafters, and the
    younger boy strikes the bag with a club.
  language: English
  quote_policy: quoted
