canonical_text:
  quote: ''
  summary: A youth fleeing a powerful nonhuman pursuer runs toward his kinsfolk, finds
    that they have fled, and encounters an ill woman left behind. He positions the
    woman so that the approaching animal will encounter her menstrual blood, then
    hides behind a large tree. The large tailless animal arrives, smells and sees
    the blood, trembles, vomits blood, and dies. The youth gathers the people back;
    the elders identify the creature as Ya'gwai'he, declare the wagered foot race
    fulfilled, and burn the carcass in a great fire.
  language: English with some Latin passages
  quote_policy: summarized
