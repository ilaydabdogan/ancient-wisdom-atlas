canonical_text:
  quote: ''
  summary: After a night near the sisters, one of the men has been robbed of his leggings
    and moccasins. The sisters travel away in canoes through the air, leaving a visible
    trail. Okteondon replaces the stolen garments, leads the men after the trail,
    hunts after the women have driven game away, and later retaliates by placing the
    women’s clothing canoe in an icy treetop. The eldest sister fails to climb the
    tree with bear-like claws grown after rubbing saliva into her hands and feet.
    Okteondon returns the canoe after the women promise to stop their actions. The
    journey continues to an ice-covered lake, where the sisters camp in the middle
    to test the men’s orenda; Okteondon creates a fire, lodge, and beds from small
    gathered materials by speech.
  language: English
  quote_policy: summarized
