canonical_text:
  quote: ''
  summary: A man overhears snakes planning a battle because Djisdaah has challenged
    them. The village prepares fire and stakes, but the snakes break through, kill
    Djisdaah, and force the chief to surrender. A huge snake chief emerges and makes
    an agreement that humans will not name anyone Djisdaah or maltreat snakes. The
    passage then begins a separate tale in which two hunting brothers divide a lodge;
    the elder declares he will hunt and eat humans, kills women who come to the younger
    brother's side, and the younger brother and a woman prepare for a coming struggle
    by marking the younger brother so he can be distinguished from his elder brother's
    expected imitation.
  language: English
  quote_policy: summarized
