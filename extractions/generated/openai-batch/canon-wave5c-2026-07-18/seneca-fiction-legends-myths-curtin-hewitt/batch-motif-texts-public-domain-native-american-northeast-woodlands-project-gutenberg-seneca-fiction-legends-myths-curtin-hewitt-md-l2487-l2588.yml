canonical_text:
  quote: '"I am a brave man, and here is where I live."'
  summary: Turtle recruits and tests companions for a warpath against the Seven Sisters.
    The warriors take ambush positions at domestic resource points, but the Seven
    Sisters and their mother defeat most attackers. Turtle seizes one sister at the
    spring, tricks the household into throwing him into water, then escapes. The passage
    then begins another tale about a grandfather and grandson who are the only surviving
    members of their tribe after sorcerers have killed the others; the grandson grows
    into a hunter.
  language: English
  quote_policy: quoted
