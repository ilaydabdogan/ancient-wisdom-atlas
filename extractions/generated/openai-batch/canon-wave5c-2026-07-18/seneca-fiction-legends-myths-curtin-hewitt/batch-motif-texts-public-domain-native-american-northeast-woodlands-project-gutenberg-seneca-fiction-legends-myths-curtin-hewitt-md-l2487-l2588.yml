  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A daughter goes to draw water at the spring; Turtle seizes her by the toe
    and is dragged back to the lodge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mother orders Turtle thrown into the fire; Turtle says this would please
    him because he came from fire. The mother then decides to drown him, and Turtle
    cries out as if afraid of dying in water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The mother and six living sisters cast Turtle into the creek; he sinks, rises
    in midstream, holds out his claws as if showing scalps, says he is a brave man
    and that this is where he lives, and sinks out of sight.
  category: sequence
  evidence_refs:
  - ev:9
