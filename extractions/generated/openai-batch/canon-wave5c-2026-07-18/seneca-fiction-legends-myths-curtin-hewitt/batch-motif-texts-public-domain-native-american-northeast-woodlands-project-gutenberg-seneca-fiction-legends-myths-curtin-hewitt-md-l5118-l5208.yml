canonical_text:
  quote: ''
  summary: An Ohohwa man follows a woman north to a lodge occupied by two old men.
    The old men try to seize him as game; he fights them off with a mallet but cannot
    kill them. After following misleading tracks in a circuit, he returns to the lodge
    and is captured in their bark canoe. At night an unseen helper tells him that
    the old men's hearts hang from a string at the canoe's end, teaches him the canoe's
    song, and instructs him to crush the hearts. The man frees himself, destroys the
    hearts, and next morning uses the song to make the canoe fly north. When the canoe
    rises and accelerates dangerously, the helper boards from behind, explains that
    repeating the same song caused this, tells him to change the words to guide it,
    and disappears into the air.
  language: English with a Seneca-language song phrase
  quote_policy: summarized
