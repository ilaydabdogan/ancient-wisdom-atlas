canonical_text:
  quote: ''
  summary: In this passage a youth lives with an old uncle who sends him hunting and
    tests whether he remembers the names of killed animals. The youth consults another
    uncle whose skull protrudes from the ground. After failing to remember the name
    of a raccoon, he is instructed to remember the name of a turkey, succeeds, cooks
    the turkey, and then imitates his uncle's earlier harmful food-giving behavior
    by pulling the old man into the fire while offering him food. The next morning
    the old man is silent and apparently angry, and the youth returns toward the place
    of the protruding skull.
  language: English
