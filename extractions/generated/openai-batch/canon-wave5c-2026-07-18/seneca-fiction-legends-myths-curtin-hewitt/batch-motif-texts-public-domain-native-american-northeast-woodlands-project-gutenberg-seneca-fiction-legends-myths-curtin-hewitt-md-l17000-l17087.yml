canonical_text:
  quote: ''
  summary: The women return to their lake-shore home and name Okteondon as the husband
    with the greatest orenda. Okteondon warns his companions not to look up at the
    people on shore; after a song about raining bones, one companion is lost and the
    crowd disappears, leaving the witch mother-in-law Kahenchitahonk. At her ice lodge,
    Okteondon makes a small bundle of sticks become a hot fire, warns the other men
    not to eat her food, and eats dangerous food while draining it through a reed
    into the ground. His wife warns him that her mother will try to kill him by testing
    his orenda. Kahenchitahonk stages a dream-demand that Okteondon kill S'hadahgeah
    and return before the door-flap stops swinging. Okteondon uses hairs from his
    wife's head to make a cord so she can keep the flap moving while he hunts; he
    sees S'hadahgeah perched on a cloud and shoots it with an arrow.
  language: English
  quote_policy: summarized
