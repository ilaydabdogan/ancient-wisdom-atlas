  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At rocks that open and close, the elder brother begs an old woman to stop
    them; she refuses, and when he jumps, half his body is crushed and he cures it
    with spittle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a river, the elder brother shouts to a man in a canoe, is ignored, and
    swims across.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the far side of the river is an immense forest of withered, bark-stripped
