canonical_text:
  quote: ''
  summary: A female figure is adorned and equipped with a basket or pouch and forehead
    band. An old woman encourages her to go, overcome a male figure named in the gloss
    as Two Feathers Together, and bring him back. The woman travels to a dwelling
    area, hides, follows the male figure when he goes hunting, and later persuades
    him to rest with his head positioned for her to search it. After he falls into
    sound sleep, she empties a bread-holding pouch or basket, encloses him in it,
    attaches it to her forehead band, and carries the heavy burden toward a far sharp
    rock.
  language: Seneca with English interlinear glosses
