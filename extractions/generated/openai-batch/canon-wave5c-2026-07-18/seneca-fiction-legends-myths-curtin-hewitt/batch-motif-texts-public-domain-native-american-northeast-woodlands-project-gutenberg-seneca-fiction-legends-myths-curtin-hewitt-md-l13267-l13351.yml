canonical_text:
  quote: ''
  summary: Doonongaes visits a feather-headdress village, joins a war party, flees
    while serving as night guard, and survives while the sleeping warriors are killed
    and scalped by western Dagwanoenyents. He returns and tries to marry the widows,
    but an unwilling woman, Diagoisiowanens, challenges him to overpower her, so he
    flees south. During his travels he shelters in a hollow tree, changes into a snake
    during an encounter with Hononeowanen, and uses a false boast about magical power
    to avoid conflict. He later finds an empty village with smoke, fire, and food
    but no people, suspects sorcery, and then meets Hostoyowanen, who says Niagwaihe
    has eaten the eastern village and may come to destroy his village.
  language: English
  quote_policy: summarized
literal_observations:
