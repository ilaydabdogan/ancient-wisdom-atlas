  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Hononeowanen said that the western man had more orenda than he did, and that
    if Doonongaes had more orenda than that man, he would not meddle with him; then
    Hononeowanen went away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Doonongaes considered returning to his wives but decided not to because Diagoisiowanens
    might kill him, and he went southward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Doonongaes walked two nights and days without sleep until he reached a plain
