  text: Doonongaes arrived after ten days at a large village whose people wore feather
    headdresses, and the chief Gasaisdowanen arranged lodging for him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: News and a challenge came that western people would make war; Gasaisdowanen
    asked for volunteers, and 500, including Doonongaes, went out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women accompanied the war party until the first night and returned home the
    next morning while the warriors continued toward signs of danger and war whoops.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Doonongaes volunteered for night guard duty, kept the fires burning, heard
    a war whoop about midnight, said he did not want to die, and ran away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The western people, identified as Dagwanoenyents, came to the sleeping warriors
    and killed and scalped all of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After sleeping at a safe distance, Doonongaes returned, found his friends
    dead and scalped, and thought he would take their wives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Doonongaes told the women their husbands were killed and that he would marry
    all of them; after discussion, all but one accepted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Doonongaes threatened the unwilling woman with beheading if she would not
    marry him; she answered that he would first have to overpower her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The unwilling woman is named Diagoisiowanens and is described as a great woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Doonongaes claimed to be magically the most powerful man in the world, referring
    to his orenda; Diagoisiowanens told him to try her, and he left saying he would
    return in the afternoon but never returned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Doonongaes traveled southward, spent a night in a hollow tree, continued for
    eight days, and on the ninth night said he was too far away for Diagoisiowanens
    to overpower him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At night a visitor asked what Doonongaes would do if Hononeowanen came, and
    soon Hononeowanen approached amid the sound of falling trees and earth being torn
    up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When Hononeowanen told him to come out, Doonongaes turned himself into a snake
    and came out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Doonongaes told Hononeowanen that he was the chief of their people and the
    most powerful person on earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Doonongaes said he had overpowered a western man of their kind; the passage
