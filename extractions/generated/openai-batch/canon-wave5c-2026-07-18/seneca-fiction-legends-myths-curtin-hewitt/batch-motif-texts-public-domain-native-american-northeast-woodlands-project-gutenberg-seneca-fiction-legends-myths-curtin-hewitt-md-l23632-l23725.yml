canonical_text:
  quote: ''
  summary: An old man in a lodge sends a young man and young woman to sleep, sings
    a tale-song, kills the sleeping young male guest, and cooks his body. The narrative
    notes his eating of human flesh and his captive granddaughter's deception. A brother
    of Honenhineh then goes north to seek two missing brothers, follows their tracks,
    hears a distant singer near a valley, encounters a speaking flicker on a tree,
    shoots it with an arrow, and approaches a smoking lodge where the brothers' tracks
    lead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man tells the young man and young woman to sleep, then begins a tale-song
    about males who have a lodge, are eight in number, and are lost or devoted to
    destruction; the young man falls asleep and snores.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man readjusts his robe, says a game animal has come into his lodge,
    takes down a war club, and kills the sleeping guest by blows to the head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man puts water in a clay pot over a fire, quarters the victim's body,
    and cooks it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man says that game animals come to his lodge and that he has no trouble
    living; the narrator states that he eats human flesh and kills people from neighboring
    settlements.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The granddaughter is said to be a prisoner taken in a raid and to be hypnotized
    so that she thinks leeches and putrid things are proper food.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers of Honenhineh suspect harm when the next younger brother does
    not return; one remaining brother leaves after the morning meal and follows the
    tracks northward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the Great Valley, the searcher hears blows of a club on a dead tree and
    a male voice singing that a human being is going along on the opposite side of
    the valley.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the trail down into the valley, falling bark causes the searcher to stop
    and look up, where he sees a small flicker or yellowhammer clinging to and moving
    about a tree trunk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The flicker smiles, mocks the young man's ability with bow and arrows, and
    claims that no living person on earth can kill it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The young man shoots the flicker; the text says his aim and orenda cause the
    arrow to hit, and he then sees the two shocks of arrows belonging to his brothers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man carries the flicker with the arrow still through its body, refuses
    to free it, and says he wants to show it to his two brothers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The young man reaches a clearing, sees a lodge with smoke rising from it,
    and observes that his two brothers' tracks lead to that lodge.
  category: setting
  evidence_refs:
  - ev:8
