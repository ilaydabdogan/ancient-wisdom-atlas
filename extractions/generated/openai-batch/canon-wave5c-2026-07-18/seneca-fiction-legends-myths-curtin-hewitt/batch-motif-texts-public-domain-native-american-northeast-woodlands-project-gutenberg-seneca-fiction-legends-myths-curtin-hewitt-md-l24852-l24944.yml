canonical_text:
  quote: ''
  summary: A young man who has refused marriage is visited at night by a young woman
    who says she loves him, embraces him, and is gone by morning after he loses consciousness.
    Frightened, he leaves for home. On the return journey a very large woman appears
    at his campfire, asks for meat, eats a quarter of meat with blood dripping, and
    tells him to return in autumn when the season changes. The youth interprets these
    events as the punishment his mother had warned him about for refusing marriage.
    At home his mother reports that three maidens have proposed marriage to him; he
    consents and chooses one.
  language: English
