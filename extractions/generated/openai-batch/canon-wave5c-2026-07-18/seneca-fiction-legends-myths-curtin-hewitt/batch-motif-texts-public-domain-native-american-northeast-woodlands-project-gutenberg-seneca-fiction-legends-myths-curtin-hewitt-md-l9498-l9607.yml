canonical_text:
  quote: ''
  summary: The passage concludes a story in which a dog-man wins a ball game against
    an old chief, kills him, returns to dog form, and brings power and chieftainship
    to the human household; a narrator then comments on dogs' orenda. It then begins
    the story of Ganyadjigowa, who steals meat from Twentgowa's lodge, travels around
    a lake, befriends Hongak, burdens him with a stone, abandons him, and later becomes
    trapped by narrowing rocks, falls into the water, and shelters in a hollow tree.
  language: English
