canonical_text:
  quote: ''
  summary: The passage describes the recovery of stolen enchanted garments by the
    husband of the chief's youngest daughter, his display of powerful orenda, the
    exposure and disappearance of the old thief who had worn the garments, and the
    later return of the two brothers to their eastern home, followed by the chief
    and his people.
