  text: The Fox sees the Turkey Brother on his couch over the bed and asks the Wildcat
    whether it can get him for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wildcat descends through the smoke-hole toward the Turkey Brother, who
