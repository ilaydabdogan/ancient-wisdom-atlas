  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the failed attack, the Wildcat tells the Fox that the figure is not
    a turkey but a wizard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The youngest daughter asks her husband why he does not take back his enchanted
    articles of dress from the old thief; he says he will do so at the proper time
    and asks her to request her father's bow and arrows.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief grants permission for his bow and arrows to be used, and his daughter
    carries them to her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The husband of the youngest daughter kills an unusually large number of deer,
