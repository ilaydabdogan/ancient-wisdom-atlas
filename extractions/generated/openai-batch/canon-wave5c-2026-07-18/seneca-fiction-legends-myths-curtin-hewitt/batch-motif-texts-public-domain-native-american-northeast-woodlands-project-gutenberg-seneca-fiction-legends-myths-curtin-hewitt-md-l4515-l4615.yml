    moccasins, leggings, and fisher-skin pouch and dons them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the stolen enchanted garments are removed from the eldest daughter's
    husband, he appears old, shrunken, and owl-faced; his wife rejects him and pushes
    him out of the lodge, after which he disappears.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wearing his recovered articles, the husband of the youngest daughter appears
    strong, young, and vigorous; the robe, feathers, pipe, bullfrog, and blacksnake
