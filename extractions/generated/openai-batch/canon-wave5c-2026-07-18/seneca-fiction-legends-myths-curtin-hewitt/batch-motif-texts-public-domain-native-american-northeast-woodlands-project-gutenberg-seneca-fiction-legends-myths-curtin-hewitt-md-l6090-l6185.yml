canonical_text:
  quote: ''
  summary: 'The passage concludes a story in which a little boy aids Old Hinon and
    the Hinon by killing or disabling three enemies: a tree-dwelling porcupine, a
    river sunfish, and a sickness-bringing butterfly. The Hinon later dance in a council
    lodge, producing lightning, and take the boy with them; the Seneca say his voice
    is heard after thunder and that tobacco is burned to him in thanks for rain. The
    range then begins a new story in which the old woman Yegondji sends two daughters
    with marriage bread and travel prohibitions to marry Tagonsowes, a hunter and
    son of Doendjowens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little boy travels down into the ground until he is under the tree where
    the porcupine lives, then puts his head and arms out and shoots arrows at the
    porcupine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The porcupine raises and shoots its quills in every direction; the boy avoids
    them by hiding under the ground, and the porcupine falls from the tree dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hinon and the old man cut open the porcupine, remove its entrails, save
    its quills, eat its flesh, and wonder at the boy's orenda.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Old Hinon says the next enemy is a great sunfish in the river that prevents
    access to water, devours everything, and catches birds flying over the river.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The little boy says he can kill the sunfish without trouble because it is
    in the water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy shoots the sunfish under a fallen tree trunk in the river; the Hinon
    pull it to land, take it to Old Hinon's lodge, and feast on it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Hinon says the last enemy is an enormous butterfly that flies past every
    other day, brings sickness, and causes many deaths.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy shoots the butterfly; the hind part of its body drops, but it flies
    slowly back in the direction from which it came, and Hinon says the last enemy
    is destroyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Hinon tell the old man and the boy that they will go to the old man's
    place for a dance and carry them along in the clouds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the council lodge, when the Hinon dance and shake their heads, lightning
    plays around the lodge and the people become afraid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the dance, the Hinon leave the old man but take the boy with them, and
    the passage says the boy now goes with them everywhere.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Seneca say they hear the boy's voice after great peals of thunder, burn
    tobacco to him, and thank him and the Hinon for the rain they bring.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Yegondji, an old woman of the Awaeh people, has three grown daughters and
    asks two of them to go marry Tagonsowes so that she may have meat to eat.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tagonsowes is described as the son of the rich woman Doendjowens of the Donyonda
    people, a good young man, and a great hunter.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The girls pound corn for marriage bread, and Yegondji bakes 22 cakes in the
    ashes and wraps them in corn husks.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Yegondji dresses the girls' hair, paints their faces with red stripes, tells
    the elder to carry the basket, and orders them not to stop, inquire of anyone,
    or speak to any man before reaching Doendjowens's lodge.
  category: sequence
  evidence_refs:
  - ev:10
