canonical_text:
  quote: ''
  summary: A young nephew brings killed game to his uncle but cannot remember or give
    the animal names. The uncle cooks the game and uses the food offering to pull
    the youth into or over the fire. While hunting again, the youth meets a speaking
    skull, identified as the uncle's brother, who warns him that he must remember
    the names of killed animals to avoid being outmatched in orenda. The skull directs
    him to kill a raccoon and repeat its name, but after stumbling at the lodge doorway
    the youth forgets again, and the uncle begins a repeated cooking-and-fire episode.
    The supplied passage ends mid-action.
