canonical_text:
  quote: ''
  summary: Shagowenotha strands Hodadenon on an island and orders lake creatures to
    eat him if he swims. Hodadenon finds a speaking pile of bones, identified as his
    uncle, who asks for tobacco smoke and then gives instructions for making red-willow
    manikins with bows and arrows and hiding in the water by an overhanging cliff.
    Ongwe Ias, a cannibal pursuer, arrives with three dogs and repeatedly mistakes
    the manikins for Hodadenon; some manikins kill dogs, and Ongwe Ias attacks the
    bones for deceiving him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shagowenotha tells Hodadenon that they should go to opposite ends of the island
    and meet in the middle to compare game.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Hodadenon starts toward the lower end, Shagowenotha returns toward the
    mainland by canoe and does not answer Hodadenon's call.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shagowenotha calls to creatures in the lake and tells them to eat Hodadenon
    if he tries to swim; voices from the water answer that they will.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hodadenon hears a nearby voice calling him nephew and finds only a moss-covered
    pile of bones at the source of the voice.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bones say a maneater or cannibal is coming that night to kill Hodadenon
    and ask him to bring a pouch and let the bones smoke in exchange for an explanation
    of how to save himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hodadenon fills and lights a pipe for the bones; smoke comes from the skull's
    eye sockets, nostrils, ear openings, and sutures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bones instruct Hodadenon to cut red willows, make manikins and bows and
    arrows, place the manikins high in tree crotches far apart, and command each to
    shoot the dog when it comes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bones instruct Hodadenon to go into the water and walk to an overhanging
    cliff opposite the landing place, where the pursuers cannot find him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hodadenon follows the bones' advice, completes and places the manikins, and
    hides at the overhanging bank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At evening Ongwe Ias arrives by canoe with three dogs and urges them to find
    Hodadenon as game.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ongwe Ias follows his dogs while singing that there are no dogs like his.
  category: speech
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: Ongwe Ias repeatedly mistakes manikins in trees for a boy or body and shoots
