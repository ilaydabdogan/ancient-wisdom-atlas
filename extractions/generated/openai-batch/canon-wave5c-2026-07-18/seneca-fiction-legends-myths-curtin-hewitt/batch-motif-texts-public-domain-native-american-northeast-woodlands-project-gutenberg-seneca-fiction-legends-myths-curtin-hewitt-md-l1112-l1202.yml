canonical_text:
  quote: ''
  summary: An editorial introduction discusses classification of Iroquoian narratives
    as fiction, myth, or legend, then explains Stone Coats or Stone Giants as legendary/fictitious
    beings whose stone association is attributed to false etymology from an ice-clad
    personification of Winter in the Iroquoian Genesis myth. The passage describes
    a movement from Winter as an ice- or flint-clad man-being to later Stone Giant
    legends, including northern location, a twin-brother defeat of the Winter God
    by the Life God, and later tales of Stone Coat people made from pitch-covered,
    sand-rolled perverse humans or confused with cannibal sorcerers and hermits.
  language: English
  quote_policy: summarized
