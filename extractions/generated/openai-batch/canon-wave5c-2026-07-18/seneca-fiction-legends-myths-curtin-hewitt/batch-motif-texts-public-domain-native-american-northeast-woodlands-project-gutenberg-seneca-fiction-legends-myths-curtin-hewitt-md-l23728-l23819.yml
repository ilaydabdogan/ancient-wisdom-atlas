  text: A voice from inside addresses the youth as grandson and invites him into the
    lodge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the lodge the youth sees a young maiden seated on a couch weaving a
    forehead pack strap from prepared slippery-elm bark fibers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man says he has long expected the youth, calls him a great hunter,
    and says his granddaughter is to marry him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old man notices the body the youth is carrying and asks for it; the youth
    refuses to give it up until he sees his two brothers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man says the two brothers passed there and may return soon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old man instructs the young woman to prepare food using dried green sweet
    corn, dried venison, water, maple sugar, dried huckleberries, and bear's grease.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young woman prepares the soup; the old man brings bear's grease from an
    adjoining room; the youth eats and thanks his host.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At night the old man asks for the bird's body, says he will keep it for the
    youth, and the youth refuses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old man threatens the youth, says nothing curbs his orenda, and says he
    is bound to recover his own bird at any cost.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old man takes down a war club, renews his demand, and kills the youth
    by striking him on the head after another refusal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After killing the youth, the old man recovers the bird's body and gives it
    back its life; the passage identifies the bird's life as that of a female relation
    of the old man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The old man rejoices, boasts that no one can treat him lightly, quarters the
    youth's body, and places it in a clay pot with water over the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The youth's flesh does not cook thoroughly; the old man removes the pot from
