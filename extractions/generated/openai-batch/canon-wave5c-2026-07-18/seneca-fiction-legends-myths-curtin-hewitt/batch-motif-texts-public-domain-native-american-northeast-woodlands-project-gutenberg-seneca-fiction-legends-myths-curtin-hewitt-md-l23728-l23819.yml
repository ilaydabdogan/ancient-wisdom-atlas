canonical_text:
  quote: ''
  summary: A youth enters an old man's lodge and sees a young woman weaving. The old
    man calls the youth his grandson, offers the young woman as his bride, orders
    food prepared for him, and repeatedly demands the body of a bird the youth carries.
    When the youth refuses, the old man kills him with a war club, restores life to
    the bird, and attempts to cook and eat the youth's body. In the brothers' lodge,
    Little Burnt Belly remains silently by the fire, then later shoots two arrows
    out through the smoke-hole.
  language: English
  quote_policy: summarized
