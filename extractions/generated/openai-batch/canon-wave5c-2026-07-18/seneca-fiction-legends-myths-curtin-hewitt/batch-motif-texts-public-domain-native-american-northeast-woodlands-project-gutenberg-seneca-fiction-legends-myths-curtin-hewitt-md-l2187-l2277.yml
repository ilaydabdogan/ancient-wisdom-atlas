canonical_text:
  quote: ''
  summary: A young woman marries a handsome stranger and follows him to his lodge.
    He is revealed as a serpent-like sorcerer whose life is bound to a hidden bunch
    of seven hearts. An old grandfather instructs the woman to take the hearts and
    flee; with storm powers and arrows he destroys the hearts and kills the serpent.
    Other men cut up the serpent, display its head, and carry meat home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young woman tells her mother about the man's proposal; the mother leaves
    the decision to her, and the woman decides to become his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man gives the young woman a beautiful wampum sash for her mother as a
    sign that they are married.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband leads his wife toward his own lodge, located at one end of a large
    clearing, and the people inside seem delighted to see her.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the husband leaves to hunt, the young woman hears a strange noise; later
    a tremendous serpent with a darting tongue enters the lodge and places its head
    in her lap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The serpent asks the young woman to search its head for vermin; she removes
    and kills bloodsuckers, angleworms, and other insects.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Soon after the serpent leaves, the husband appears again in handsome human
    form and asks whether she was afraid of him when he came in earlier.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: While gathering fuel and water, the young woman sees huge serpents sunning
    themselves on rocks and becomes homesick and disheartened.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A very old man tells the woman that her seeming husband is evil and wicked,
    one of seven sorcerer brothers, and that their hearts are not in their bodies
    but hidden together under the eldest one's couch.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman finds the seven hearts tied in a bunch under the couch, hides the
    bunch under her robe, and flees from the lodge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A pursuing voice orders her to stop and says she cannot escape; her strength
    leaves her until the grandfather helps her and pulls her out of the water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A black cloud appears; Lightning flashes, Thunder shoots arrows, and Wind
