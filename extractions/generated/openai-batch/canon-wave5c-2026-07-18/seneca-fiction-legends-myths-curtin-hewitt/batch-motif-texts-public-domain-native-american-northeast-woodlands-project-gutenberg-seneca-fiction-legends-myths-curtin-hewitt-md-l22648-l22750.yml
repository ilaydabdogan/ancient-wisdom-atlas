canonical_text:
  quote: ''
  summary: An old uncle warns a young man about a difficult and dangerous journey
    and gives instructions involving pipe smoke, buckskin, and wampum beads if the
    young man becomes a son-in-law. The young man asks the uncle to put forth orenda
    for a safe return, starts out, returns after reaching a nearby camping sign, is
    said to be immune to sorcery, and receives the name Ongwe Hangesha. He then passes
    ten marked camping places, follows eastward travelers, meets a very old small
    tattered man identified as S'hodieoko, agrees to travel in a pair, hears of Hawks
    on a woman's tree that foretell for her, shoots a fisher for the old man, and
    camps while the old man prepares the skin.
  language: English
  quote_policy: summarized
