canonical_text:
  quote: ''
  summary: A young man shoots an arrow into the great swollen body of S'hagowenot'ha
    on the shore, causing waters to burst out. He reaches S'hagowenot'ha's racing
    place with his sister, frees the wild geese from servitude, and tells them that
    the Creator did not intend bondage among beings. He establishes their custom of
    traveling across the earth in wedge formation. The brother and sister then return
    home safely, discuss their uncle Okteondon and the suspected killer with the great
    mouth, and settle into hunting and camp life.
