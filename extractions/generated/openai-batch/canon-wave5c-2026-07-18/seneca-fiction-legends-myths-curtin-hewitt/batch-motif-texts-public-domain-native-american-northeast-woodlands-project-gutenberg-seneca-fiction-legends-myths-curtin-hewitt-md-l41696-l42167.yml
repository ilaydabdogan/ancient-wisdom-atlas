canonical_text:
  quote: ''
  summary: An elder or uncle sends his nephew, a youth, to a valley-cliff place to
    sit and listen. The nephew hears a woman or human being singing, returns to the
    lodge, and reports this to the elder. After preparing and smoking his pipe, the
    elder asks the youth to relate what he heard; the youth repeats a song with vocables
    and words about seeking someone. The elder comments on the song and sends the
    nephew back to listen again. On the second visit, the song is heard nearby, and
    the female singer halts near the listening place.
  language: Seneca with English interlinear gloss in OCR/transcribed form
