canonical_text:
  quote: ''
  summary: 'Bean-Woman asks for a husband and rejects Panther-Man, Deer-Man, Bear-Man,
    and Wolf-Man because their offered foods do not suit her. She accepts Corn-Man
    when he offers sweet corn, embraces him, and states that their condition was established
    by the creator from the new-earth time; the passage explains this as the reason
    bean vines entwine around cornstalks. A following Corn legend introduces an ancient
    Tuscarora event declared by Corn-Woman: a solitary sick man without food or fire
    hears unseen women discuss helping him because he formerly cared for their lost
    sisters along the trail.'
  language: English
  quote_policy: summarized
