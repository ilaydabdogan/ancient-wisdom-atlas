canonical_text:
  quote: ''
  summary: 'The passage first completes an episode in which Hodadenon and his sister
    flee by canoe across a lake from Ongwe Ias; a hook and line pull them back, Hodadenon
    breaks the hook, then creates ice over the lake so that Ongwe Ias strikes it and
    dies. Hodadenon melts the ice and returns home with his sister. A new tale begins:
    an uncle and nephew live alone in a bark lodge. The nephew secretly discovers
    a hidden young man whom he thinks is his brother. After the boy persuades him
    to come out in daytime, the young man warns that western women will hear and carry
    him off; the women arrive in a canoe through the air, question the boy, and threaten
    him when he denies anyone else is present.'
  language: English
  quote_policy: summarized
