canonical_text:
  quote: ''
  summary: A young man and his sister flee from the roaring Ganiagwaihegowa. Dream-given
    and carried objects become world-spanning barriers that delay the pursuer, and
    several kin helpers attempt to aid the siblings through flint chips, traps, and
    directions onward, while the monster continues to follow and kills two old men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man overtakes his sister; they hear the roaring Ganiagwaihegowa,
    the girl becomes fearful and weak, and her brother encourages her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman appears to the young man in a dream, says he and his sister will not
    die, and gives instructions for using a stone as a defense.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the morning the young man finds the dreamed stone near the brush lodge,
    carries it, and throws it behind him at noon to create a ridge of rocks across
    the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ganiagwaihegowa cannot find an end or opening in the rock wall; by morning
    the obstruction has become a small stone, which she grinds to powder in her mouth
    before continuing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man throws a pigeon feather from his pouch behind him with a spoken
    command, producing a high rampart of pigeon droppings across the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pursuer cannot climb or pass through the pigeon-droppings rampart, nearly
    smothers in it, and in the morning finds only a feather, which she bites and chews
    to pieces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The siblings enter a lodge in a dried, leafless forest where an old uncle
    says another uncle can help them better; this old man has killed the forest by
    flinging flint chips at the trees.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The flint-working uncle strikes at the arriving Ganiagwaihegowa with flint
    chips, but she reaches the door, questions him, kills him by crushing his head,
    finds the tracks, and resumes pursuit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another uncle makes three traps on the trail; the Ganiagwaihegowa struggles
    in each and breaks through, then kills the old man after questioning him and finding
    the tracks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A third uncle is making a net with closed, matter-filled eyes and long upper
    eyelids; after being struck to get his attention, he tells the siblings to run
    to their grandfather, who can do more than he can.
  category: sequence
  evidence_refs:
  - ev:8
