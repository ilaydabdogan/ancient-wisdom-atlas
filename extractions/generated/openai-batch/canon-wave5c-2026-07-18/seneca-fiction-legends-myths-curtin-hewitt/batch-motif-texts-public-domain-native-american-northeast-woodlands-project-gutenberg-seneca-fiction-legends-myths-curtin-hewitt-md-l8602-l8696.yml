canonical_text:
  quote: ''
  summary: Hodadenon uses magic, moles, and wampum to pass a platform watchwoman and
    seize the external hearts of four witches, whose deaths follow when the hearts
    are bruised. He burns their remains, restores dead persons and his sister from
    bones and skin beneath a hickory tree, sends chestnuts to another sister, gives
    a protected chestnut to two men, and then travels west toward a lake where an
    old man expected him and small ducks paddle their canoe toward an island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon changes course and comes to a hill ridge near a woman who keeps
    watch by walking back and forth on a raised platform.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before revealing himself to the woman, Hodadenon gets slippery-elm bark and
    turns it into wampum.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hodadenon asks a mole to take him unseen beneath the ground to the woman on
    the platform; after reducing his size by magic, he enters the mole's body and
    is carried under the surface.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hodadenon gives the watchwoman wampum as a reward for not giving the usual
    alarm, and she accepts it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Hodadenon calls on moles to enter the lodge of four women to discover their
    hearts, finds the hearts fastened to a string under the couch where the elder
    woman sleeps, seizes them, and flees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman on watch gives the alarm, and the mother of the witches tells her
    daughters to hurry after Hodadenon and kill him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: As each pursuing daughter and then the old mother approaches Hodadenon, he
    bruises a heart on the string and that pursuer falls dead; afterward he grinds
    the hearts to powder and burns the lodge, bodies, and powdered hearts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The watchwoman is identified as Hodadenon's own sister and is described as
    a pouch of human skin lacking bones and flesh.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hodadenon carries a heap of bones of dead persons to the foot of a large hickory
    tree, places his sister's skin on the pile, pushes against the tree, warns that
    it is about to fall, and the dead persons leap up alive, including his sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Hodadenon takes a chestnut and throws it to his other sister in the west,
    named Yenyentwus; the rest of the nuts follow and are collected and stored by
    her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Hodadenon goes home with his parents, sister, and friends; one place remains
    vacant, and the next morning the lodge is surrounded by chestnut trees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Two men request chestnuts for a person in danger of death; Hodadenon gives
    one chestnut, hides it in an arrow, and warns them about a man they will meet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The man encountered by the two men calls them nephews, tries to come toward
    them, rushes to grasp their arrows when they propose a shooting contest, and becomes
    angry when he fails.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Hodadenon says that one more labor remains because one empty seat is still
    in the lodge, and he travels west to a forest clearing with a large lake and a
    smoky lodge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Inside the lodge, an old man mending moccasins tells Hodadenon that he has
    expected him, that he comes from the same place, and that he is ready to go home;
    they eat corn, beans, and bear meat.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: The old man and Hodadenon board a canoe to go hunting on a little island;
    small white ducks with black heads come and paddle the canoe while the old man
    sings.
  category: sequence
  evidence_refs:
  - ev:7
