canonical_text:
  quote: ''
  summary: Two sisters find a beautiful boy inside a fish, care for him, and call
    him their son. The boy becomes a great hunter, despite warnings not to go toward
    the setting sun. He goes that way and, in successive clearings, defeats two old
    men in games where heads are wagered, beheading them and burning their cabins.
    In the first contest, plum pits fly out as birds and return; in the second, a
    ball game includes a horn that wounds and is used back against the old man. The
    passage ends as the youth reaches a third clearing with an ice-covered pond and
    another cabin, where a third old man greets him.
  language: English
  quote_policy: summarized
