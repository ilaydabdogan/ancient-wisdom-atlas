canonical_text:
  quote: ''
  summary: While the lodge family is away, the young bride uncovers the sleeping recluse
    youth and repeatedly tries to draw him to her couch; he refuses. She then invents
    accusations against him, injures herself to support a false charge, and repeats
    the accusation to her husband. The passage explains that her mother, identified
    as a great witch, sent her to entrap and destroy the youth because recluses have
    potent orenda at puberty. The youth foresees the plot and resists the bride to
    avoid being bewitched.
  language: English
  quote_policy: summarized
