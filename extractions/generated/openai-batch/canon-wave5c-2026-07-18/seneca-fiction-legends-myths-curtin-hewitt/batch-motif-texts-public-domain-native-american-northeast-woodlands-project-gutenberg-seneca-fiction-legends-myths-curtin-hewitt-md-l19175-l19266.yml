canonical_text:
  quote: ''
  summary: In the first episode, a Stone Coat Woman helps hunters take beavers, eats
    the bodies raw, warns that her angry husband will come, and instructs the hunters
    to kill him with a fire-hardened basswood spear. After the husband is killed,
    she warns that his brothers will come, and the people escape by canoe from a man
    who says he intended to eat them. In the story titled “Genonsgwa,” a Stone Coat
    offers Seneca hunters good hunting fortune, skins, and meat, then shrinks their
    packs for the journey home. The next winter, another Stone Coat brings one hunter
    to an old Stone Coat, who gives him his daughter in marriage, protects him, empowers
    him by rubbing his body with objects or substances, and helps him win a deadly
    footrace against a rival Stone Coat suitor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Stone Coat Woman accompanies hunters to a pond, cuts a small circular hole
    in the ice, calls beavers out, catches and kills them until the hunters have as
    many as they want.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunters skin the beavers and keep the furs, while the Stone Coat Woman
    eats the beaver bodies raw.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Stone Coat Woman warns the hunters that her angry husband is coming and
    tells them to prepare a sharpened basswood stick hardened in fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the husband arrives, he refuses the woman’s request not to make trouble,
    becomes jealous of the two men, fights, knocks his wife down, and is killed from
    behind by the men with the basswood spear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the husband is killed, the Stone Coat Woman says his two brothers know
    he is dead and will come to kill them, and she tells the people to escape by river
    in canoes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: As the people leave by canoe, a man on shore calls them back; when they refuse,
    he says it is lucky they did not return because he came to eat them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Stone Coat asks to stay with Seneca hunters and says they will get good
    luck, skins, and enough meat, while he will take the rest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hunters agree to the Stone Coat’s request and have great luck in hunting
    the next morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the end of the season, the Stone Coat packs each man’s load of dried meat,
    buckskins, and furs, shakes each bundle until it becomes small, and says the bundles
    will become large again when thrown on the ground at home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The next winter another Stone Coat says his father sent him to bring one hunter
    home as a son-in-law, and one hunter volunteers to go.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old Stone Coat says he wants the Seneca man to marry his daughter and
    promises to make his people understand that they must not touch or harm him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Seneca man marries the old Stone Coat’s daughter.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The old Stone Coat rubs the son-in-law’s hands, feet, and body with an object
    like a bone, after which the young man feels very strong.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A young Stone Coat who loves the old Stone Coat’s daughter challenges the
    Seneca man to a footrace with beheading as the penalty for losing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Before the race, the father-in-law rubs the Seneca man’s body with a substance
    from a stone box.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: During the race, the rival Stone Coat holds on as their locked arms bend over
    a hemlock tree; when he lets go, the tree springs back and throws the Seneca man
    backward, but the Seneca man still outruns him and cuts off his head.
  category: sequence
  evidence_refs:
  - ev:8
