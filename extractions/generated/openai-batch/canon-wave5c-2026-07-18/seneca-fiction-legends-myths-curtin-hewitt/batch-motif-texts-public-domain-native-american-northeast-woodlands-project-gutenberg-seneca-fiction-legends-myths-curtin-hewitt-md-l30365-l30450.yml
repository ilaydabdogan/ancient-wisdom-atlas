canonical_text:
  quote: ''
  summary: A young man fleeing an old woman in the form of a great bear creates a
    world-spanning rock cliff as an obstacle. A singing male helper delays the bear
    with pikes. The young man rejoins his exhausted younger sister, magically shrinks
    a dog, and reaches an open cavern where their mother shelters them. The mother
    kills the pursuing bear with boiling bear fat, and the children dwell with her
    again. The passage then begins another episode in which a prostrate groaning man
    with his feet in water asks to be carried to dry ground, and the young man agrees.
  language: English translation with brief embedded Seneca-language transcription
