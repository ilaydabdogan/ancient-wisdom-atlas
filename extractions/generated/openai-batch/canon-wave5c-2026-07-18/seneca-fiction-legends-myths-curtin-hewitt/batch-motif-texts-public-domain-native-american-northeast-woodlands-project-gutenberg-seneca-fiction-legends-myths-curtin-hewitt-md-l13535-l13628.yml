canonical_text:
  quote: ''
  summary: Doonongaes arranges for the chief's daughter to marry the Shabby Man, stays
    with an old woman, then journeys toward the southern end of the earth. At a great
    opening he sees a Djainosgowa family and flees. He reaches Tsodiqgwadon's lodge,
    where Tsodiqgwadon hides him from a Djainosgowa pursuer. Tsodiqgwadon then sends
    Doonongaes north to find Deanohdjes at the edge of the earth and summon him to
    a world council at Broken Land. Doonongaes wanders unsuccessfully because Tsodiqgwadon
    magically misdirects him, returns, is mocked, and sets out again. On the second
    attempt he crosses a named long opening and comes to a lodge where an old Osigweon
    man senses his presence and invites him in.
  language: English
  quote_policy: summarized
