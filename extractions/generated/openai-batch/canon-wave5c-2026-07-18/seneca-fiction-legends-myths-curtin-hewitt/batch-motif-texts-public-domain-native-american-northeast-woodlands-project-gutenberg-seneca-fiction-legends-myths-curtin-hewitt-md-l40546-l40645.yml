- id: obs:2
  text: The young woman has him sit with his head in her lap while she searches his
    head for vermin; he then falls into a very sound sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young woman wraps the sleeping man in her bag and carries the pack on
    her back by a forehead strap.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the shore of a lake he wakes after a long time and recognizes the place
    where he and his uncle fish; the head-searching and sleep sequence is repeated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young woman reaches the lodge of her mother and sisters, throws down the
    pack, and says Doadanegen is inside it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother addresses Doadanegen as son-in-law, and at night he shares the
    bed of the young woman who brought him.
  category: relationship
  evidence_refs:
