  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the settlement of the mother and three daughters, the younger wife hears
    her husband weeping and sees him inside the lodge being tortured with fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother draws brands from the fire and touches the victim around the ears;
    his tears are wampum beads caught on buckskin and gathered into a basket.
  category: sequence
  evidence_refs:
  - ev:7
