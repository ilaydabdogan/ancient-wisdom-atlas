canonical_text:
  quote: ''
  summary: A young woman repeatedly makes Doadanegen sleep, wraps him in a bag, and
    carries him to the lodge of her mother and sisters. His younger wife pursues him,
    finds him being tortured with fire so that his tears become wampum beads, rescues
    him, calls her hummingbird guardian beings, and has the captors' lodge sealed
    and burned.
  language: English with transcribed Seneca song phrases
  quote_policy: summarized
