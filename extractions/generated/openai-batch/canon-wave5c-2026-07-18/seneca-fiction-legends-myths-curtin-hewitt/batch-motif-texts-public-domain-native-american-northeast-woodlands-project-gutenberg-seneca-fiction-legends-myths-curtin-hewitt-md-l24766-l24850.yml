canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which boys recover their uncle''s
    stolen eyes in cloudland, return other eyes to their owners, kill a female child
    whose death also destroys a great witch, descend to earth in flea form using dandelion
    seed heads, and restore the uncle''s eyes. A new legend then begins: a successful
    hunter living with his mother repeatedly refuses marriage proposals brought by
    young women with marriage bread, despite his mother''s warnings that such conduct
    will bring calamity; he continues hunting and trading meat, skins, and furs.'
  language: English
  quote_policy: summarized
