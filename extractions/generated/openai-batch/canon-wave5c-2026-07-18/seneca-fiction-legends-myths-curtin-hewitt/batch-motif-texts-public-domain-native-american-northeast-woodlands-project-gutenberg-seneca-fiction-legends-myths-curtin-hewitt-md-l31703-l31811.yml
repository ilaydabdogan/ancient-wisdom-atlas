  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief questions the thieves, who say they live far away in the forest
    and belong to a large nation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Corn, bean, and squash thieves are bound and daily struck with staffs by chiefs
