canonical_text:
  quote: ''
  summary: A chief and council establish proper methods for planting and caring for
    corn, beans, and squashes after the Matron's account of crop failure. The people
    follow the instructions, but animal-like nations steal the crops. Watchmen capture
    the thieves; the corn thieves are punished, later guide warriors to their village,
    and are identified as raccoons whose markings come from the beatings. Squash thieves
    are identified as rabbits or hares whose split lips come from punishment. A traditional
    explanation states that plants and crops have human lives and kinship relations
    and can depart if offended. The next tale begins with an uncle immobilized by
    tree roots instructing his nephew to plant beans, corn, and squashes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief calls a council after the Matron's statement, and the council resolves
    that future planting must include sufficient earth covering, hilling, loosening
    the soil, and destroying weeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the next spring, the people agree to follow the council's advice about
    planting corn, beans, and squashes because of the Matron's statement about the
    cause of withered crops.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people plant the seeds deeply enough, and the old chief supervises; later
    the people are called to hill the crops and destroy weeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crops grow strongly, but near harvest a nation of people carries away
    corn and beans and leaves only some squash shells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The following spring, theft begins again when the green corn is fit to eat,
    and the people suspect who has taken the corn, beans, and squashes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief calls another council, and stout, alert warriors are set to watch
    the planted fields at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Toward dawn, the watchmen capture persons tearing off corn ears and bean pods
