  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: In the west the boys find a very tall pine tree with a skin bed in its top,
    where two little naked children, a boy and a girl, are frightened.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The younger boy pinches the Thunder children to make them call their parents,
    then strikes the father Thunder and mother Thunder on the head with his club so
    that they fall dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boy says a Thunder boy would make a good tobacco pouch for his father;
    the father says the Thunders bring rain and do good, fears revenge, but takes
    the skin for a pouch.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The father warns the younger boy not to go north to the country of the Stone
    Coats; the elder brother refuses, and the younger boy goes alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The younger boy hears Stone Coat's dog, described as as tall as a deer, and
    hides in the heart of a chestnut tree; Stone Coat's dog barks at the tree until
    Stone Coat splits it open with a club.
  category: action
  evidence_refs:
  - ev:4
