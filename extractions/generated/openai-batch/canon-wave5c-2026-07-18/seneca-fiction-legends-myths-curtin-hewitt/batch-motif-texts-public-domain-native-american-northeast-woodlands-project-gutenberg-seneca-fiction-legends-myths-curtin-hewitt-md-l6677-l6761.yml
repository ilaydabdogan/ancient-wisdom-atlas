canonical_text:
  quote: ''
  summary: A little boy is taken home after a stump becomes a man, receives a club
    that crushes or kills what it strikes, and repeatedly disobeys his father's directional
    warnings. He kills frog-like northern beings, kills a family of Thunders in a
    treetop bed and takes a Thunder child as a pouch, then goes alone toward the Stone
    Coats, where he hides in a chestnut tree, is found by a giant Stone Coat and his
    dog, enters the giant's lodge, tricks him in a bear-eating challenge, and is taken
    toward a slippery hillside ending in a cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy calls a little fellow out from a hollow tree to play catching mice,
    and the little fellow runs around a stump catching many mice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stump suddenly becomes a man, catches the boy in his arms, and runs home
    with him while the boy screams and struggles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father gives the boy a small club; when the boy strikes a hickory tree
    it falls, and the passage states that everything he strikes is crushed or killed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father warns the boys not to go north because dangerous people live there,
    but after he leaves hunting the younger boy urges going north.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In wooded marshy ground, callers cry out for their father; the younger boy
    says they want to hurt his father and kills them with red-hot stones. They are
    identified as frogs singing noTiqwa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the father angrily warns against going west, the younger boy again urges
