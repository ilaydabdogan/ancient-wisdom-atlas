  label: Old-appearing spouse revealed as powerful provider
  taxonomy_refs:
  - shapeshifter
  basis: The man first appears old and is mocked, but after the garment exchange he
    becomes fine-looking and demonstrates power by producing wampum and game.
  evidence_refs:
