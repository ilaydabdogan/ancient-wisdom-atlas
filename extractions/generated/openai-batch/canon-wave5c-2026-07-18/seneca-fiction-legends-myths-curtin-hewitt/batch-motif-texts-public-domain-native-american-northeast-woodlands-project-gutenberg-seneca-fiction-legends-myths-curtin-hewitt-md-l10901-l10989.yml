- id: motif:5
  label: Prohibition against witnessing magical action
  taxonomy_refs:
  - forbidden_knowledge
  basis: Before summoning and killing the animals, the young man tells his wife to
    cover her head and not look, warning that evil would befall him if she looked.
  evidence_refs:
