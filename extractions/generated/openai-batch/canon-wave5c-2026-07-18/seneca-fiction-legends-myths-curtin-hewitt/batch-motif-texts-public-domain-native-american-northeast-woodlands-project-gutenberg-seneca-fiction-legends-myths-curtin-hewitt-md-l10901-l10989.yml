  - ev:8
  confidence: medium
  cautions: The warning concerns looking rather than explicit pursuit of knowledge;
    the outcome of disobedience is not shown in this passage.
- id: motif:6
  label: Magical summoning and effortless killing of game
  taxonomy_refs: []
  basis: The young man sings for wild beasts to come, bear, elk, and deer arrive,
    and he kills animals simply by pointing a magical finger.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage presents the act as hunting and provisioning, not as a general
    creation or culture-founding event.
- id: motif:7
  label: Sibling rivalry over a powerful spouse
  taxonomy_refs:
