canonical_text:
  quote: ''
  summary: A chief's younger daughter finds an apparently old man whose spittle becomes
    wampum and brings him home. Her elder sister and the elder sister's husband mock
    his appearance and withhold food. The old-appearing man exchanges garments and
    names with the other husband, becomes fine-looking, smokes before the assembled
    people, animates a duck and pouch, uses a manikin to fetch fire, and spits wampum.
    He later takes his wife to the forest, forbids her to look during his action,
    summons wild animals by song, kills game by pointing a magical finger, and gives
    the meat to the village. The younger sister says the elder sister's husband had
    stolen the magical garments, and the elder sister drives her husband out.
  language: English
  quote_policy: summarized
