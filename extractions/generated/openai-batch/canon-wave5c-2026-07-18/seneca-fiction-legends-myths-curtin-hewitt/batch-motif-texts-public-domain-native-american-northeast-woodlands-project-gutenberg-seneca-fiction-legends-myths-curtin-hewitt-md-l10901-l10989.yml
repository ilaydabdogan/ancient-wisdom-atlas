- id: motif:2
  label: Stolen and recovered magical garments
  taxonomy_refs:
  - sacred_theft
  - sacred_exchange
  basis: A garment and name exchange is made, the young man later keeps the garments,
    and the younger sister states that the elder sister's husband had stolen them
    and that they have been recovered.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:10
  confidence: high
  cautions: The original theft is reported in dialogue within this passage rather
    than narrated directly here.
- id: motif:3
  label: Body substance transformed into wealth
  taxonomy_refs: []
  basis: The man's spittle becomes wampum when it falls at the discovery scene and
