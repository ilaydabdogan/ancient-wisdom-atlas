canonical_text:
  quote: ''
  summary: An uncle tells his nephew that he can hunt game animals despite their evil
    orenda. The nephew, later named Doadanegeii/Doadanegen, hunts raccoons from claw-marked
    trees, carries the bodies home with a forehead strap, and the uncle skins them,
    thanks him, and makes or intends robes from the skins while the nephew's wives
    cook the meat. In a later section, a mother tells her daughters to seek Doadanegen
    as a husband; the daughters make twenty cakes of marriage bread, and the mother
    prepares the eldest daughter's hair, places the bread basket on her back with
    a forehead strap, and sends her toward Doadanegen across a lake. A middle portion
    is heavily corrupted by OCR and is summarized only where legible.
  language: English
  quote_policy: summarized
