canonical_text:
  quote: ''
  summary: A group led by Dehaenhyowens journeys with hosts who explain their charge
    from Hawenniyo to maintain rain, fresh waters, and plant life. The travelers see
    a lower earth, thunder, lightning, rain, and a huge horned serpent that the hosts
    pursue and kill. The hosts explain that malign beings formed by the Evil-minded
    One are confined beneath the earth until a future end-time, when the hosts' duties
    will cease and waters and living things will decay. The party returns to the lodge,
    reports completion of the work, and is told to rest before resuming duties.
  language: English
  quote_policy: summarized
