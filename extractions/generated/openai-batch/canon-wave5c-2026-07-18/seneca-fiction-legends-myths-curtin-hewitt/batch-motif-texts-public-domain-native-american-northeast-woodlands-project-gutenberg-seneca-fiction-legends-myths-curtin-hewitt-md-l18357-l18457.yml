canonical_text:
  quote: ''
  summary: The passage recounts a worm that devours boys, grows huge, surrounds a
    hill village, swallows many people through its mouth, and is destroyed by the
    Thunder god after survivors burn tobacco and call for help; the worm’s pieces
    form a lake. It then tells of Bear boasting that she can stop the sunrise, being
    disproved and mocked by Chipmunk, then scratching him as he escapes, leaving marks
    on chipmunks. A following tale begins with a grandfather and grandson living alone
    after their tribe is carried away by sorcery; the grandfather guides the boy through
    early hunting kills of chickadee and Dju'a'ka' and identifies Ohsoon as the third
    game animal.
  language: English
  quote_policy: summarized
