canonical_text:
  quote: ''
  summary: A nephew with magic power plans to escape his uncle with his wife. He prepares
    circular trails around the lodge, sends his wife east inside an arrow to a distant
    lodge where his invisible brother lives, and later travels through the air along
    the arrow's rainbow-like trail. The invisible brother receives the wife, warns
    of the uncle's wrath, and hears the uncle's distant threats. The uncle discovers
    the escape, vows to pursue and eat the daughter-in-law's flesh, but his tracking
    repeatedly loops back toward his own lodge.
  language: English
  quote_policy: summarized
