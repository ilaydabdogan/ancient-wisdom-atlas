canonical_text:
  quote: ''
  summary: An elder or ancient uncle has a basket of corn and beans and sends a great
    child or youth to plant the contents in a prepared clearing. The youth accepts,
    gathers implements and provisions, goes to the clearing, weeds and stirs the earth,
    but plants only a small amount. After an episode in which the uncle is distressed
    and is given water to drink, the uncle sends the youth back to plant or gather
    all the corn. As the youth gathers it again and goes along the path, the corn
    spills out.
  language: Seneca with English gloss/translation in OCR form
