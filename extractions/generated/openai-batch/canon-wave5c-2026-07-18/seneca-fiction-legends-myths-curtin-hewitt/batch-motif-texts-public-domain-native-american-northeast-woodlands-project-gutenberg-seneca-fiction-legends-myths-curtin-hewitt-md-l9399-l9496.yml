canonical_text:
  quote: ''
  summary: A hunter guided by dogs stays with a poor old couple, provides them with
    game, and is adopted as their son. A powerful chief challenges him first to a
    foot race and then to a ball game. Dog helpers put on the hunter's garments and
    appear like him, competing in his place while the hunter hunts. In the foot race
    the dog-man overcomes the chief after both are wounded by a thrown horn; the old
    man says the chief will continue proposing dangerous contests.
  language: English
  quote_policy: summarized
