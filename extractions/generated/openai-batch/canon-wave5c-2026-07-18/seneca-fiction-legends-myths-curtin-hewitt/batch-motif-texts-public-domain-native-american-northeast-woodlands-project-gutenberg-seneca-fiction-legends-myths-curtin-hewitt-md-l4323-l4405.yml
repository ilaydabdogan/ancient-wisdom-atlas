canonical_text:
  quote: ''
  summary: 'Two brothers travel rapidly to a dangerous spring despite an uncle''s
    warning. The elder brother drinks, overcomes two manlike water creatures, and
    burns them with his brother''s help. Later a poor-looking old man uses a raccoon
    illusion to lure the elder brother into removing his clothing and climbing a hollow
    tree, then pushes him into the trunk, steals his clothing and equipment, and grows
    younger. The Turkey Brother mourns. Trapped among bones in the hollow tree, the
    elder brother invokes dream-promised helpers: a great Spider, whose web ladder
    breaks, and then an enormous Blacksnake, which lowers its tail into the hollow.'
  language: English
  quote_policy: summarized
