canonical_text:
  quote: ''
  summary: The passage recounts several episodes in which S'hodieonskon deceives people
    through false reports, false medicine, an animal trap, a hemlock-bough disguise,
    and a false burial-and-return claim. The passage then begins another tale, introducing
    an uncle and nephew living in a partitioned forest lodge and revealing that the
    uncle is a man-eater.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: S'hodieonskon tells people at a third village that young men elsewhere are
    killing old men and that the old men can be saved if women give themselves to
    the young men; the women do so and nothing happens to the old men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At another place, S'hodieonskon says there is another sickness and that he
    has medicine for it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The medicine he sells is called bear's oil, is carried in a bark bowl, and
    is parenthetically identified as his urine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The villagers drink the substance with their food despite knowing it is not
    oil, and S'hodieonskon ridicules them as he leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: S'hodieonskon meets a man on the trail and offers him a cake corresponding
    to the oil he had sold; the man refuses it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: S'hodieonskon summons two bears and instructs them to carry him, then to let
    another man mount them so that the man's feet become fastened to their backs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the man mounts the bears, the bears run in different directions and
    badly injure him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: S'hodieonskon tells a party of young women that on their road they will meet
    a man dressed in hemlock boughs and should not be afraid but should do everything
    he wants.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The women encounter a figure covered with hemlock boughs, go to him one by
    one, and the passage states that the hemlock-bough man and S'hodieonskon are one.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a settlement of bark lodges, S'hodieonskon says a man is coming to destroy
    the people with a long spear thrust through smoke-holes, and he tells them to
    cover the smoke-holes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: S'hodieonskon does not tell the chief the story about the spear-wielding man;
    the other lodges become full of smoke after their smoke-holes are covered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: S'hodieonskon runs over the roofs, frightens the people, spears the chief
    to death, and takes the chief's wives and property.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the chief's funeral, S'hodieonskon appears among the mourners, says he
    is sorry for the chief, and asks to be buried with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After boys hear a voice from the graveyard, the people dig S'hodieonskon up
    from beside the chief.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: S'hodieonskon says he came back because the chief's two wives mourn and that
    he was sent back to marry the widows; the people consent and he marries them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The next tale begins with an uncle and nephew living together by hunting in
    a forest lodge divided by a partition, with each using a separate door and never
    entering the other's side.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: The nephew discovers that his uncle is a man-eater, identified as an Ongwe
    Ias.
  category: attribute
  evidence_refs:
  - ev:8
