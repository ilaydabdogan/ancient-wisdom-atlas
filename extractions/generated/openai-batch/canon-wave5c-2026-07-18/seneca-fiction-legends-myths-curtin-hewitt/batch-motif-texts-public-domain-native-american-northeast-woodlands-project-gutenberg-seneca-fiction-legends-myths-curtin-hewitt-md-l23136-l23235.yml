canonical_text:
  quote: ''
  summary: A youth asks his old grandfather for the way to the lair of a great animal
    and is warned of a shrinking path, a distant spring, and flesh-eating female beings.
    He travels to the spring, loses both legs to water beings, catches the beings
    with bait made from his own flesh, compels them to restore his legs, and burns
    them, after which owls emerge from their heads. He continues through fighting
    animals to a long lodge with owls on its roof, sees an old man resembling his
    grandfather, a kettle of corn mush, and a white deer entering the old man's bosom.
    When the youth leaves, lodge objects leave too; the old man wakes, pursues him
    with a club, strikes him unconscious, returns home, and restores disturbed things
    including the great beast's body.
  language: English
  quote_policy: summarized
