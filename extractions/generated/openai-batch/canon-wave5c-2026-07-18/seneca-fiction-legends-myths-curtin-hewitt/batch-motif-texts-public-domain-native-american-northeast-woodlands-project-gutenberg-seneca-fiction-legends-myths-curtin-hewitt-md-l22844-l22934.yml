canonical_text:
  quote: ''
  summary: Ongwe' Hanges'ha' hunts deer with his brothers-in-law, brings venison and
    pelts to his mother-in-law, and prompts a marriage-associated eat-all-up feast.
    The next day he has neighbors summoned to witness him smoke and announce that
    he will disgorge black and white wampum beads, with a buckskin determining which
    beads belong to the mother-in-law and which become prizes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young bridegroom invites his brothers-in-law to hunt, then tells them
    to remain while he pursues a small herd of deer alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He shoots one deer and then follows and kills the remaining deer one by one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers-in-law help dress the deer, pack pelts and venison into bundles,
    and carry the bundles home with forehead straps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the lodge, the mother receives the venison and pelts, weeps for joy, thanks
    her son-in-law, and promises to provide the feast of eat-all-up the next day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At early dawn, kettles are put over the fire, the daughters prepare food,
    and the old woman goes through the village announcing the feast at her lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Corn-meal mush and pieces of cooked venison are placed in bark trays and bowls.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mother tells the assembly that invited guests must eat first, the host
    family will eat afterward, and guests must eat all apportioned food because this
    is the custom for this feast when one marries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The neighbors eat throughout the day and consume all prepared food, which
    is described as a good omen for the newly married couple.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the next day, Ongwe' Hanges'ha' says he craves a smoke and instructs his
    mother-in-law to invite neighbors because he will smoke and disgorge wampum beads.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother-in-law issues invitations represented by small sticks and tells
    neighbors that her son-in-law is going to smoke and disgorge wampum beads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the people assemble, the mother-in-law places a bench or block of wood
    in the center of the room and calls Ongwe' Hanges'ha'.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ongwe' Hanges'ha' comes from the place where the 'noble' or 'down-fended'
    maiden lived.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: He sits on the block and throws over his knee the entire skin of a woman,
    still with the head attached; its eyes wink and move from side to side.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: He fills his pipe with a mixture of native tobacco, hemlock gum, spicebush
    bark, and red willow bark, and the mixture emits a pleasant odor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: He instructs his mother-in-law to spread a tanned buckskin in front of him
    between his feet.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: He says wampum falling on the buckskin will belong to his mother-in-law, while
    wampum falling away from it will be prizes for the assembly.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: He says that the first time he draws in smoke he will disgorge black wampum
    beads and the second time he will disgorge white wampum beads.
  category: speech
  evidence_refs:
  - ev:8
