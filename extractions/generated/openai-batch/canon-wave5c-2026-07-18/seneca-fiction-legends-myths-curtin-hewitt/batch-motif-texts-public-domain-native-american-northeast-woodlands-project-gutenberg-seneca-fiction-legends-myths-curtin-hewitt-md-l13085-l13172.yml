canonical_text:
  quote: ''
  summary: Doonongaes says he has returned to life, but Skahnowa doubts his identity
    and tests him. After a failed test involving bear meat, Doonongaes reclaims his
    lodge and fights Skahnowa for a month with equal magical strength. A dream messenger
    warns Doonongaes that people of magic power are coming and tells him to go to
    Tsodiqgwadon. Two threatening visitors seek Doonongaes there, but Tsodiqgwadon
    denies seeing him and drives them away.
  language: English
  quote_policy: summarized
