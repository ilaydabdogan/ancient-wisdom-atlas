canonical_text:
  quote: ''
  summary: The passage first recounts how Ohohwa deceives girls carrying marriage
    bread, steals or diverts the bread, and falsely presents his own lodge and identity.
    The younger girl retrieves the basket, uses elm logs as bed substitutes, and the
    sisters reach Doendjowens's council lodge, where Ohohwa is exposed. The daughters
    live with Tagonsowes, and their mother is later brought meat and given a fire
    in Doendjowens's lodge. A following section begins a creation account in which
    God creates the sun and moon, becomes lonely, forms a human being from earth among
    the roots of an uprooted hemlock, breathes on him, and is displeased with the
    result.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man of the Ohohwa people claims to have lost an arrow while shooting at
    a fisher on a tree; while the girls search, he takes the basket of marriage bread
    home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger sister recalls the mother's warning and later says she thinks
    the man stole the bread; the mother scolds the girls and orders more marriage
    bread to be made.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the next journey the girls carry 22 loaves of marriage bread and are directed
    by Ohohwa to his own lodge, where they find his wife and a little boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girls place the marriage bread near Ohohwa's wife because they think she
    is Doendjowens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ohohwa tells his wife to sit on the other side of the fire and pretend he
