  text: The party enters a lodge where the young woman sees an old man with white
    hair, kind manner, and kind voice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leader says the woman of the human family helped them kill the great serpent
    and its progeny.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man thanks the young woman, calls her granddaughter, rubs her body
    with hands fortified by orenda, and several young serpents crawl from her and
    are killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: While she stays in the lodge, younger people bring her corn because she cannot
    eat their food, much of which is serpent flesh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man proposes that his sons take the young woman hunting so she may
    secure more orenda.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sons report that a terrible bloodsucker deep in the great waters has caught
    one of their number on a rock, and that they cannot save him or kill it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the waters, the men go high into the clouds and shoot arrows down at the
    bloodsucker but fail to hit it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young woman shoots arrows into the water; after her second shot, the bloodsucker
    dies and the captive brother is freed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After about a year, the old man sends the young woman home to her mother and
    tells her not to pound, chop, or do any work for ten days.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The escorts leave the young woman near her mother's lodge, where she finds
    herself standing in water after a heavy rain.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the tenth day, under pressure from women of her family, she strikes one
    blow with a corn-pounder; the mortar splits and the corn falls to the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The text explains that the mortar splits because the orenda of the Thunders
    has not entirely left her.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: A new tale begins with a young orphan man who has no relatives or home and
