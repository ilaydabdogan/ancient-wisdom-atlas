canonical_text:
  quote: ''
  summary: 'A young woman is hosted by an old man and his sons after helping them
    kill a great serpent and its offspring. The old man heals her by drawing young
    serpents from her body through orenda. She later helps kill a bloodsucker monster
    in deep water, freeing one of the men. After about a year she returns home under
    a ten-day work prohibition, but on the tenth day she strikes a corn-pounder and
    splits the mortar because Thunder orenda remains in her. A new tale begins: an
    orphan hunter, abandoned by other hunters, lodges alone in the forest; at midnight
    a woman who says she has passed out of this world comes to help him.'
  language: English
  quote_policy: summarized
literal_observations:
