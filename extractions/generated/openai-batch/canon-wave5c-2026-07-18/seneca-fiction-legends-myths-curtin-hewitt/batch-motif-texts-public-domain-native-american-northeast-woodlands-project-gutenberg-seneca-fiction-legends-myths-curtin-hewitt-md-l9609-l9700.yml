canonical_text:
  quote: ''
  summary: 'Ganyadjigowa is confronted and fought by Hongak, flees into a swift river,
    survives on and escapes from a stone, while Hongak is carried to the same place
    and dies in the water. After returning home, Ganyadjigowa dreams twice of westward
    travel and two great creatures: first they threaten him and he falls into a hole,
    then he controls them as animals and rides them to the end of the earth. In the
    dream journey he visits lodges, meets Djothowandon and Dagwanoenyent, learns that
    Djothowandon is Dagwanoenyent''s servant, and is warned to leave because something
    will chase him at midday.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa hears footsteps in the leaves outside; the sound stops at the
    tree, and a voice asks him to come out and talk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hongak is identified as the man Ganyadjigowa had left behind, and he says
    Ganyadjigowa did something to make him stop; feathers are missing from Hongak's
    back where a stone had been secured.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hongak begins fighting with Ganyadjigowa; Ganyadjigowa runs away because he
    does not want to fight, but Hongak overtakes him and the fighting continues until
    dark the next day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Hongak leaves during a rest, Ganyadjigowa runs away, tries to swim a
    swift river, is carried downstream into rough water, and is driven against a stone
    where he thinks he will die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hongak tracks Ganyadjigowa to the water, enters the river to catch him, and
    is carried by the fast water down to the same stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ganyadjigowa frees himself after struggling and reaches shore; Hongak becomes
    filled with water, dies, and his body floats to shore.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Hongak's death, Ganyadjigowa calls him his friend, asks whether he thought
    he could kill him, says he has more orenda than Hongak had, and travels home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In a dream, Ganyadjigowa is on the way west, reaches a large opening, sees
    a Ganiagwaihe approaching from the southeast, and thinks the bear will eat him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the same dream, a Djainosgowa comes from the northwest; the two animals
    meet and fight while Ganyadjigowa watches and backs away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ganyadjigowa falls into a hole in the ground with the two animals on him,
    calls for help, wakes alone wrapped in skin blankets, and finds he has rolled
    from his couch to the floor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In a second dream, Ganyadjigowa sees the same creatures in the woods, thinks
    they belong to him, makes them stand near each other, lays a stick across them,
