canonical_text:
  quote: ''
  summary: Ganyadjigowa accepts an old man's deadly canoe-racing game, chooses a poor-looking
    but powerful canoe, detects and overcomes the old man's cheating, travels by canoe
    through the air to the place where the sun goes down, wins the return race, and
    beheads the old man. He then travels northwest, encounters several beings, and
    gives names to Gaga, Hihi, and Genonsgwa, while a hungry old man discusses Hanisheonon
    and the earth resting on the Turtle's back.
  language: English
  quote_policy: summarized
