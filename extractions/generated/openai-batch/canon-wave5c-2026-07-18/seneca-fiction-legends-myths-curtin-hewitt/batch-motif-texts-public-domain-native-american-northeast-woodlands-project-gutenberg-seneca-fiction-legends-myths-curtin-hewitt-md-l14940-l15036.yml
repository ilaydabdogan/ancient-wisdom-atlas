canonical_text:
  quote: ''
  summary: A young man visits successive uncles in lodges. The second uncle requires
    a race with heads wagered; the youth wins after a deer-horn injury is turned against
    the old man, then decapitates and burns him, after which an owl flies from the
    head. The grandmother says a third uncle remains. The youth visits the third uncle,
    who proposes a head-wager hiding game by midday. The youth changes into a woodtick
    on the uncle's neck and repeatedly finds him; the old man tries to evade the rule
    and pushes the sun east with a pole. At midday the youth wins, decapitates and
    burns him, an owl flies from the head, and heaps of victims' bones are seen. The
    grandmother warns of a fourth uncle more evil and more potent in orenda; the grandson
    says he will not go.
  language: English
  quote_policy: summarized
