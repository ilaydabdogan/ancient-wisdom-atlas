canonical_text:
  quote: ''
  summary: After Honenhineh fails to return to the brothers' lodge, the next-oldest
    brother follows his trail toward the Great Valley. He hears a distant blow and
    a male singing voice, then encounters a speaking flicker or yellowhammer in a
    tree. The bird mocks his marksmanship; he shoots all his arrows, misses, and finds
    his brother's arrows and broken bow already there. Continuing toward a smoky lodge,
    he is welcomed by an old man, sees the old man's granddaughter weaving, is told
    she and he are to become husband and wife, learns his elder brother passed toward
    another nearby lodge, eats soup prepared by the granddaughter, and is told to
    rest as night falls.
  language: English
  quote_policy: summarized
