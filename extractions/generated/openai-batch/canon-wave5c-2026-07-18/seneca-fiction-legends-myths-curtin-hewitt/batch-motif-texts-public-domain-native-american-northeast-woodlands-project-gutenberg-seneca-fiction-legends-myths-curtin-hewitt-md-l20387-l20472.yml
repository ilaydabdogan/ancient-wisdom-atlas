canonical_text:
  quote: ''
  summary: Two sisters first take the wrong path, see False Faces dancing, flee from
    S'hagodiyoweqgowa, and escape by dropping bread and clothing. On a second attempt
    they reach the correct lodge and marry two brothers by offering bread. The brothers
    warn them to remain indoors for ten days because S'hagodiyoweqgowa may carry them
    away. After the sisters go outside, he captures them and later releases them;
    after another capture, Hot'hoh, Cold Weather, protects them and defeats S'hagodiyoweqgowa.
    The passage then begins a new tale in which a wife burns her hand while baking,
    develops a taste for her own blood and flesh, and warns the husband's faithful
    dog to tell him to escape before she eats them both.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two girls keep to the straight path at a fork, come to a lodge, look through
    cracks, see a number of False Faces dancing, become frightened, and run away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: S'hagodiyoweqgowa pursues the girls; one girl throws down a basket of bread,
    the second throws down her basket, and then they cast off pieces of clothing,
    which delay the pursuer when he eats or examines them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girls reach their mother's lodge naked, and the mother says they did not
    do as instructed and must try again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the second journey the sisters reach the right lodge; each places a basket
    of bread before a man, says she has come to marry him, and the men eat the bread
    and thank them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two brothers live in a partitioned lodge and have a repeated morning call-and-response
    about getting up, eating breakfast, and going hunting.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before hunting, each brother tells his wife to stay in the lodge for ten days
    and warns that their brother S'hagodiyoweqgowa may carry them away if they do
    not.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After nine days indoors, the younger sister suggests sitting outside; S'hagodiyoweqgowa
    comes, is not recognized in his real character, invites the sisters to eat with
    him, and they go.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the brothers return, they miss their wives and know S'hagodiyoweqgowa
    has captured them; the elder brother asks him to give the wives back, and he eventually
    releases them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hot'hoh, identified as Cold Weather, is described as a brother of the men
    who lives nearby, goes naked, and carries a tomahawk in a slit or hole in the
    skin of his hip.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hot'hoh is said to make trees crack loudly in winter by striking them with
    his mallet or tomahawk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two men ask Hot'hoh to protect their wives from S'hagodiyoweqgowa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: S'hagodiyoweqgowa again invites the sisters to eat with him, takes them to
    his lodge in the woods, and shuts them up there; the youngest sister escapes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hot'hoh meets S'hagodiyoweqgowa; S'hagodiyoweqgowa fights with his rattle,
    Hot'hoh fights with his mallet, trees are uprooted for miles as they move east,
    and S'hagodiyoweqgowa is conquered.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the start of the next tale, a husband and wife live alone in the woods;
    the husband hunts while the wife raises corn and beans and bakes a cake in ashes
    near the hearth.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: A spark from the fire burns the wife's hand; after tasting her own blood,
    she craves more, cuts out and eats burned flesh, burns herself again with coal,
    and continues until she has eaten the flesh from her legs and arms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The husband's dog is described as wise and faithful; it watches the woman,
    is told by her to warn its master to escape or she will eat them both, and runs
    to find the husband.
  category: action
  evidence_refs:
  - ev:9
