  summary: The passage describes an uncle-nephew pair at night. A fire and a customary
    resting or sitting place are mentioned. After a period of quiet, an owl makes
    repeated sounds and is described as speaking. A youth hears it, treats it as potentially
    meaningful for his uncle, runs back, and is questioned by an elder named Boosdanegen.
    Hotkwisdadegen agrees to tell what was heard, but the elder first lights tobacco
    in his pipe and smokes. The two retire for the night, lie down, and rise at daybreak.
