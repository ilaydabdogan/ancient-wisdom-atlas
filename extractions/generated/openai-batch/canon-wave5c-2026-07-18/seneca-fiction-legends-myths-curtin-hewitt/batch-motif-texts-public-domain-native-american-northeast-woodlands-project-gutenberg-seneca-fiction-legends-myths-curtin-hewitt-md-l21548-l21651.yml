canonical_text:
  quote: ''
  summary: 'A young man lures or flees before the Great Head, whose rolling motion
    fells trees. With his elder brother he pounds the Great Head in the lodge, after
    which it becomes a helper: it heals a brother, leads the brothers to missing kin,
    destroys two women on a rock, and instructs the young man to reassemble bones
    so that skeletons rise again. The passage ends with the opening of a separate
    tale about an Ongwe Ias old man, his three nephews, and his person-eating hunting
    practices.'
  language: English
  quote_policy: summarized
