canonical_text:
  quote: ''
  summary: 'The passage includes three linked narrative units: God makes human beings
    from earth pulled up by uprooted trees and approves the third as the Indian; a
    party kills a Ganiagwaihegowa from a cave by discovering its vulnerable forefeet;
    and one of two cousin warriors eats a strange trout from a hollow tree, becomes
    a fish in a spring that grows into a pond, later becomes a Ganiagwaihe, and kills
    people who come to fish.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God finds an uprooted walnut tree whose roots have pulled up black earth and
    makes a human being from that earth, but is not satisfied because the being is
    described as having too much color.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: God later finds an uprooted sugar maple with earth of a fine deep color and
    makes a third human being whose body is smooth, firm, and richly tinted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: God says the third human being will do and looks like him; the passage identifies
    this being as an Indian and as the native human being.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a Seneca warrior disappears, skilled men follow great tracks from the
    village to a cave in the woods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men make a large fire, throw burning brands into the cave, and a Ganiagwaihegowa
    comes out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arrows do not injure the Ganiagwaihegowa until it raises its forefeet; arrows
