  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two cousin warriors on a hunting expedition hear a peculiar noise from a hollow
    tree and find a spotted trout leaping in water inside the hollow cavity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: One cousin warns that the fish should not be touched because it may bring
    harm, but the other takes it to camp, cleans, cooks, and eats it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After eating the fish, the man becomes extremely thirsty and repeatedly asks
