canonical_text:
  quote: ''
  summary: 'A son restores his father from bones gathered beneath a hickory tree.
    Old Eagle later restores old man Wild Cat from scattered bones beneath an elm
    tree and returns him home. A new tale begins: an Iroquois village suffers crop
    failure; an old woman who is Matron and Chief hears Corn, Bean, and Squash people
    weeping in the field because humans have neglected their cultivation duties. The
    Matron reports this to the people after communal mourning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bitter strife between the village people and the Pai^ther tribe leaves many
    brave persons dead, and the grandson's bones lie bleaching on a forest path.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the dead man's sons recognizes his father's bones, gathers and orders
    them under a large hickory tree, pushes against the tree, and calls for his father
    to arise lest the tree topple on him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father arises in the form he had when he left home; the son is frightened
    and flees, while the revived man returns to his village and recounts his adventures.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Eagle remembers old man Wild Cat, whom he had left among the Wolf tribe,
    and travels toward the Wolf country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Eagle finds Wild Cat's scattered bones, gathers and orders them under
    a great elm tree, calls for his friend to arise lest the tree fall, and Wild Cat
    returns in his original human form and mind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old Eagle leads Wild Cat home to his own people; Wild Cat finds his grandson,
    relates his adventures, and says the Pigeon tribe should be highly esteemed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Iroquois village in a fertile country raises corn, beans, and squashes
    for years, but later the crops fail and the people go hungry because field food
    and game are scarce.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: An old woman who is Matron and Chief of her clan walks near her planted field,
    hears bitter weeping, enters the field, and finds Corn, Beans, and Squashes weeping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Corn tells the Matron that the people plant the crop people but neglect further
    duties: covering them with enough earth, hilling soil around their feet, loosening
    earth to give water, and preventing enemies from strangling them.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bean people and Squash people tell the Matron the same painful story of
    neglect by her people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Matron returns to her lodge weeping; her people hear her, are moved by
    sympathy, and gather to mourn with her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The clan chief asks why the Matron is grieving; she reports that the Corn,
    Bean, and Squash people complained of insufficient care and enemies growing around
