canonical_text:
  quote: ''
  summary: A woman leaves cubs, reaches a Crow village, presents herself as a young
    unmarried woman, and marries a chief's son. Her first husband and then her two
    sons come after her; she denies them, and the chief orders violence against them.
    The father is killed, while the Crow family hides and raises the boys, who later
    bring prosperity in the woods. When the chief's party seeks that prosperity, snow
    and cold destroy or repel most of them; the woman, her new husband, and child
    reach the Crow lodge, where the elder son rejects her until the Crow elders allow
    mercy. A new tale begins in which a winter traveler is chased by a self-declared
    man-eater; he sends his moccasins ahead, becomes a dead rabbit carcass, and deceives
    the pursuer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman arrives at a village, stops at a lodge where a family of Crows lives,
    and says she seeks a place to live and a husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman is described with her hair pulled back tightly and her breasts cut
    off, so that she looks like a young woman; one of the chief's sons marries her.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman's first husband comes to the Crow lodge looking for the wife who
    left him; the woman denies having been married before.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief accepts the woman's denial, orders warriors to kill the husband,
    and the warriors kill him and throw away his body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Feathers in a bowl become bloody, and the elder boy understands this as meaning
    that his father is dead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder boy carries his little brother westward, finds two cubs lying on
    the ground, and the little brother recognizes breasts on a tree as belonging to
    their mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys arrive at the Crow lodge and ask about their father; they are told
    the chief killed him and that their mother is now the wife of one of the chief's
    sons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When asked whether she has children, the woman denies it; the chief orders
    the boys killed, but the Crow family hides them and tells the warriors they have
    gone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Crow family cares for the boys, moves far into the woods, plants corn
    and beans, and prospers as the boys grow, hunt, and obtain much game.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After several years the village chief sends runners to locate the Crow family
    and, after hearing that they live in happiness and plenty, decides that all should
    go there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: As the chief's party travels, heavy snow and cold begin; most of the group
    is frozen, buried, or forced back, while the young chief, his wife, and her child
    reach the Crow lodge nearly frozen.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The elder son pushes his mother back with a forked stick and throws her baby
    into the snow; an old Crow woman says he should not be wicked because his mother
    is wicked, and the old Crow lets them live there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the following tale, one winter traveler sees another man approaching who
    declares himself Ongwe Ias, glossed as a man-eater, and the first man runs away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The pursued man tells his moccasins to run ahead, lies down, and becomes a
    dirty, black, half-rotten dead rabbit; the pursuer follows the moccasins and realizes
    he has been fooled.
  category: action
  evidence_refs:
  - ev:8
