canonical_text:
  quote: ''
  summary: A brother and sister maintain the appearance of being husband and wife
    while expecting and then visiting an old woman. A fire repeatedly speaks an accusation
    that a friend has killed it, which the young man explains away as noise from arrow
    scrapings. At the old woman's lodge, a screech owl and a homed owl utter warnings
    about the pair's identities, and the young man feeds them meat to stop the warnings.
    The old woman grows suspicious, secretly inspects the pair while they pretend
    to sleep, and later accepts the young man's explanation of the fire.
  language: English
  quote_policy: summarized
