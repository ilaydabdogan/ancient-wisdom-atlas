canonical_text:
  quote: ''
  summary: A nephew carries his sister in a bark case to an uncle whose skull protrudes
    from the ground and receives instructions for overcoming another old uncle. The
    skull uncle tells him to guard his sister, build a great fire, feign a dream-command
    at midnight, scatter firebrands, and require the old uncle to be dragged naked
    in a bark sledge ten times around the lodge. The nephew carries out the plan,
    binds the old man to the sledge, drags him rapidly while singing, and nearby wizards
    say the youth has overmatched the old uncle's orenda, or magic power.
  language: English
  quote_policy: summarized
