canonical_text:
  quote: ''
  summary: An old woman in a lodge proposes that one visiting man remain with the
    lodge people because the visitors killed the squirrel/Otkon that the lodge men
    had failed to kill. The visitor is given the name Daga'e'da', the Thaw or Warm
    Spring Weather, is described as transformed, and becomes a leader in bringing
    spring conditions to the earth. The old woman then reveals herself as the Moon,
    commissioned by Deaunhyawagon/Hawenniyo, identifies the lodge people as Thunderers,
    and explains their ordered movements, duties, and an eastward-coming omen of the
    earth being taken apart.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman tells the men of her lodge that the visitors accomplished a
    task for them and proposes that one visitor remain in the lodge as a coworker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men of the lodge assent and say the one foremost among them should give
    the required consent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman asks Dehodyadgeowen to confirm the plan, giving as the reason
    that the visitor killed the squirrel called the Otkon after the lodge men had
    long failed to do so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dehodyadgeowen confirms the proposal on the conditions that the man is freely
    willing and volunteers to have his life pounded in a mortar so that he can help
    continually.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman offers the remaining visitor a new name, Daga'e'da', glossed
    as the Thaw or Warm Spring Weather.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage calls the man transformed; when he sings, Dehaenhyowens and one
    remaining friend hear a sound like approaching thunder and identify it as Daga'e'da'
    approaching.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old woman tells the lodge men, including the newly transformed person,
    to start a journey and make growing things on the earth below mellow and moist
    again, with Daga'e'da' taking the lead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman says people on earth will first name Daga'e'da' in spring, saying
    that the warm or hot spring wind has come, and that he will change future days
    and nights at the boundary between snowtime and summertime.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old woman says she is the Nocturnal Light Orb, the Moon, commissioned
    by Deaunhyawagon or Hawenniyo to make the dark earth somewhat light and warm and
    to protect growing things while the earth endures.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman says the inhabitants of the place are those called Thunderers
    and that the world-establishing being decreed they come to the lower world from
    the west and move toward the east.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old woman says that if the men of Thunder come from the east, people on
    the lower earth should understand it as a sign that Hawenniyo will take the earth
    to pieces.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old woman says the Sun and Moon each appear from fixed directions and
    will continue to do so until Hawenniyo transforms what he established.
  category: speech
  evidence_refs:
