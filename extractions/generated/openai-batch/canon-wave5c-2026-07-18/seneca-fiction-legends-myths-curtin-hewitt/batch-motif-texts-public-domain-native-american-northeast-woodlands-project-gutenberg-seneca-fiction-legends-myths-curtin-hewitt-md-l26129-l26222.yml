canonical_text:
  quote: ''
  summary: Hodadenon and a companion cross a frozen lake, enter a shore lodge, accept
    a wagered snowshoe race, and defeat the lake-dwellers through magical snowshoes.
    The wicked people are beheaded. Hodadenon and his companion arrange bones, cause
    the dead to rise, correct mismatched limbs, lead the restored people home, and
    arrange men and women to live together in a long lodge. The passage then begins
    a new legend about an uncle and nephew living in a long lodge on opposite sides
    of a fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon and his companion unstring their bows, travel over the frozen lake
    surface, and use the bows as walking sticks on the ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People from the shore come onto the ice to meet the visitors, and one person
    identifies Hodadenon as a great wizard who has crossed the lake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shore-lodge occupants state that their custom with visitors is to amuse
    themselves by betting beads and running a race around the lake on the ice with
    snowshoes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hodadenon makes very small, fine snowshoes, agrees to race, and runs alone
    while the lake-dwellers set four men against him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the race Hodadenon is behind, removes his snowshoes, places them side
    by side, gets on them, commands them to pass the other runners, and reaches the
    starting place first.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After winning, Hodadenon tells his friend that they have won and should behead
