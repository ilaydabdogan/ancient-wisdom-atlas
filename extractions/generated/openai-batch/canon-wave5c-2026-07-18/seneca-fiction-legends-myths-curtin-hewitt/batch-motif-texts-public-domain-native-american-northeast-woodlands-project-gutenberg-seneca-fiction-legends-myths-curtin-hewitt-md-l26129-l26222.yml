- id: obs:8
  text: After Hodadenon shouts that a great elm is falling on those sleeping there,
    men and women arise mingled together, some with mismatched limbs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hodadenon amends the arms and legs of people who received wrong limbs in their
    resurrection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The restored people say they do not know where they came from, so Hodadenon
    says they must accompany him home to the long lodge where his brother and sister
    live.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After many nights of travel, Hodadenon brings the large group home and assigns
    places in the lodge.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Before assigning places, Hodadenon declares that a man and a woman should
