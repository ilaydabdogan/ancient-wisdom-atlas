canonical_text:
  quote: ''
  summary: A midnight visitor advises a young man about the return of his wife, the
    return of his father-in-law's hungry people, and the selection of a bearskin-wrapped
    fetish that is actually the visitor's lost claw or finger. The young man returns
    the claw to the strange man, whose lodge vanishes and is replaced by water; afterward
    his success is attributed to friendship with the otter. A new tale begins about
    seven sorcerous sisters living on a high mountain, gathering huckleberries, excluding
    men and married women, and being secretly observed by a young man who falls in
    love with the youngest sister.
  language: English
  quote_policy: summarized
