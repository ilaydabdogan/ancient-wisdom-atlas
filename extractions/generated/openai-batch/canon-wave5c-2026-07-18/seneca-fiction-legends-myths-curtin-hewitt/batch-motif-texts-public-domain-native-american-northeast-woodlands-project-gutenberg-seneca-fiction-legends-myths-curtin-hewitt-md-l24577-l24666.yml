canonical_text:
  quote: ''
  summary: A strange husband visits his wife at night, then leads her toward his mother's
    lodge. At a divided path his body splits into two forms and later reunites. His
    wife gives birth to male twins. Their witch-grandmother casts the infants under
    separate beds, where they play ball with small lacrosse clubs. The twins follow
    their ball to their blind maternal uncle's lodge; he says he summoned them by
    sorcery and that their grandmother took his eyes. The twins try to restore his
    sight by borrowing eyes from owls.
  language: English
  quote_policy: summarized
