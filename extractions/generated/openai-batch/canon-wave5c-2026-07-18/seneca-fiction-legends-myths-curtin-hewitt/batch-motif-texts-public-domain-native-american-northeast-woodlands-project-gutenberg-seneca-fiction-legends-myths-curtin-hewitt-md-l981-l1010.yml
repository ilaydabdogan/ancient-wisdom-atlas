  summary: The passage defines and contrasts mythos, logos, and epos as terms for
    stages or forms of human thought and expression. Mythos is described as a naive,
    prehistoric, creative utterance with religious and cosmogonic authority for its
    speakers. Logos is described as a later Greek philosophical expression of exact
    thought, reason, and exegesis. Epos is described as the poetic dramatization of
    mythic concepts in story, saga, legend, and epic. The passage also states that
    modern critical and sympathetic research makes the study of myths more scientific.
