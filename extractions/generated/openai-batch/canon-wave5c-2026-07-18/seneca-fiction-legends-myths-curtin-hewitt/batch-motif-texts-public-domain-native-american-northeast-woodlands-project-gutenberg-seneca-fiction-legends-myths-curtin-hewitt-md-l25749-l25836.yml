  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy later returns suddenly, says he has killed a very large game animal
    of uncertain name, and tells his elder sister to bring a burden cradle or frame
    because the body is too large to carry otherwise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the kill site, the boy says he held out his arrow, told the animal to stop,
