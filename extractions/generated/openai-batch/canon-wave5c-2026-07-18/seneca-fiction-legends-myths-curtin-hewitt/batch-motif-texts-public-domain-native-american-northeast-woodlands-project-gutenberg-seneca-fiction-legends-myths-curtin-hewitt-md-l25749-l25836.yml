    the boy's back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: While returning home with burdens, the siblings rest on logs; the boy asks
    the animal's name and whether it tastes good, and the sister answers that its
    name is Neogen and that it tastes good if cooked properly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the lodge the sister hangs meat around the interior, stretches the hide
