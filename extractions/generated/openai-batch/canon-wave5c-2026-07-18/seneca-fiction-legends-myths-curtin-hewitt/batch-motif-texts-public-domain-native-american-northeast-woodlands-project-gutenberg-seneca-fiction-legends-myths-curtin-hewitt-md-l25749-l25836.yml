canonical_text:
  quote: ''
  summary: A boy leaves the lodge to hunt, disappears, and returns saying he has killed
    a very large animal. He and his elder sister go to the carcass, where he recounts
    stopping and shooting it. The sister recognizes it as a deer or Neogen, skins
    and quarters it, loads the meat, and brings it home with him. At the lodge she
    hangs the meat, stretches the hide on a frame while instructing him, cooks meat
    over the fire, and the siblings eat it.
  language: English
  quote_policy: summarized
