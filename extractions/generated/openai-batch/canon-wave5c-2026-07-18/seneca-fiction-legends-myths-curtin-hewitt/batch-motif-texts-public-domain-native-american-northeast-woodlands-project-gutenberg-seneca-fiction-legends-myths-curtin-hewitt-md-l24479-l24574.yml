canonical_text:
  quote: ''
  summary: After escaping by removing logs, a sister carries her blind brother southward
    toward their old home. During the journey, the brother kills wild turkeys after
    the sister positions him, but he repeatedly refuses to eat while she cooks, eats,
    and makes shelters. They reach their former lodge, marked by a tall chestnut tree.
    Later, while gathering fuel in the forest, the sister meets a handsome young man
    who proposes marriage. Her brother advises acceptance because the man is a noted
    wizard, son of the witch Gaho°*dji'da'*ho"k, an enemy of their family, and refusal
    would mean death for both siblings. The sister tells the young man she has consent,
    and he says he will come to the lodge at night.
  language: English
  quote_policy: summarized
