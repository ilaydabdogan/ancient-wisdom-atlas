canonical_text:
  quote: ''
  summary: A man watches a destructive monster attack a village from under a rock,
    shoots through an underground passage until the monster dies, takes part of its
    scalp with long hair as an aid, builds a hut, and prepares meat. At night he meets
    Gaasyendiet'ha by a fallen tree and receives a tooth that grants shapeshifting
    power and a counsel relationship. After a year he transforms and flies to another
    village, devours its residents, finds a woman, transforms her into a gnat, carries
    her home as a hen hawk, restores her form, and tells her to care for the lodge
    and meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man sits on a large, level rock; on the tenth day he hears a great noise
    from the south and sees smoke-like appearance, uprooted trees, and trees falling
    toward a village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the noise nears the village, the man goes under the rock and positions
    himself opposite an underground passage through which the village appears close.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Monster hurls huts into the air, tears them apart, eats the people, misses
    one person, and says the world is not large enough for him to hide in.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man strings his bow and shoots through the underground passage rapidly
    as the noise approaches; his last arrow kills the great Black Monster and the
    noise stops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man finds that every arrow he shot is in the Monster's head, takes part
    of the scalp from the crown with long hair attached, ties it around his body,
    and asks it to help him and prevent his being overpowered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man climbs the hill quickly, builds a brush hut, kills deer, bear, and
    other game, skins the animals, and dries the meat on hurdles in brush arbors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When it grows dark on the day he killed Dagwanoenyent, the man starts north
    as his dream had said and encounters Gaasyendiet'ha near a fallen tree with roots
    turned up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gaasyendiet'ha has a great open mouth and seems angry, but when the man is
    not frightened it laughs, changes into a human being, and speaks to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gaasyendiet'ha instructs the man to remove one of its back double teeth, says
    the tooth will let him change into any form, grants him full magical power, establishes
    mutual counsel, resumes its natural form, and flies away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After living in the hut for one year, the man becomes lonely, turns himself
    into a Gadjidas, and flies southwest looking for people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man decides to eat the people of a village unless he finds a good-looking
    woman, then changes into a Ganiagwaihegowa and eats the villagers, including an
    old man, a woman, and children in a small hut.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man meets a handsome woman, learns she is connected with the last hut,
    returns with her to the hut where she finds only blood and cries.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man touches the woman's head, makes her senseless, shakes her into a small
    gnat, changes himself into a hen hawk, carries her under his wing to his home,
    restores her to natural form and size, and tells her to stay and care for the
    meat and lodge.
  category: action
  evidence_refs:
  - ev:8
