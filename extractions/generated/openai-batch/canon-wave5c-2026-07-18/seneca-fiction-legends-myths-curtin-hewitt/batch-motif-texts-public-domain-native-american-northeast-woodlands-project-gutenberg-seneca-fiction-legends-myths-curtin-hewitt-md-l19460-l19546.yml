canonical_text:
  quote: ''
  summary: Two boys disobey a warning not to go far from the lodge and play on a moving
    stream of land that carries animals and game into a doorway. The doorway proves
    to be an inescapable game snare at a lodge inhabited by two Genonsgwa, who kill,
    roast, and eat the boys. The Genonsgwa become sick and die while giving birth
    to the boys, who are born again. The younger boy declares that man-eating will
    cease and that humans will eat only game; he throws red paint around the lodge,
    stops the moving land stream, and the lodge burns while the Genonsgwa burst.
  language: English
  quote_policy: summarized
