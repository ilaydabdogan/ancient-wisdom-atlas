canonical_text:
  quote: ''
  summary: A hunter is confronted and pursued by two Genonsgwa women, one elder and
    one younger carrying a baby. He demonstrates destructive power, hides in water
    and then in a tree, steals an animate finger used by the elder woman to locate
    him, and uses it as a guide to return to his hunting party. The party leaves by
    canoe while the elder woman asks for the return of the stolen object and promises
    success and good luck.
  language: English
  quote_policy: summarized
