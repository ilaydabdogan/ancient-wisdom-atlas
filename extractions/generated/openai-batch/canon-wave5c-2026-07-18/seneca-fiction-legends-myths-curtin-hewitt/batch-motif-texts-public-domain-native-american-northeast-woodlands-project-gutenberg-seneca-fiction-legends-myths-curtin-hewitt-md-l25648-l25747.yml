canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which a woman returns through passageways
    guarded by panthers, reaches home after three days and nights, prepares her dead
    husband''s body, and pours his life from a gourd bottle into his mouth so that
    he lives again. It then begins the legend of Hodadenox/Hodadenon and his elder
    sister: the siblings live alone in a long lodge after sorcerers have caused their
    relations to die; the boy, said to have orenda, receives a bow and arrow from
    his sister, kills a large winged animal called O''soont, brings it home to be
    cooked and eaten, and later spends the night hunting fleas.'
  language: English
  quote_policy: summarized
