canonical_text:
  quote: ''
  summary: Doonongaes and Tsodiqgwadon continue traveling and encounter a provisioned
    but empty village said to have been made by a Great Power in the Blue Sky for
    world travelers. Doonongaes is threatened by Stone Coats, receives advice about
    basswood weapons, kills them, then repeatedly boasts, disguises himself, or changes
    form while provoking Hinon and a lodge of old men. Tsodiqgwadon warns him about
    fooling others, and a large man named Nanisheonon later induces the companions
    to strike and scold each other and tells them to pursue peoples they meet.
  language: English translation with Seneca terms
  quote_policy: summarized
