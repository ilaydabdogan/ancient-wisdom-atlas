canonical_text:
  quote: ''
  summary: 'A female speaker describes a dangerous route to a wizards'' lodge, marked
    by chestnuts at the eastern end of the world, tobacco, a river crossed by trees,
    paired rattlesnakes, a steep mountain with one pass, tall beings, alarm-giving
    men, and a singing woman who alerts the wizards. The narrative then follows Yenyent''hwus
    and her brother Hodadenon: she plants and prepares him while he begins hunting
    birds or game with arrows. His first game is cooked and eaten only by his sister
    because he is told he must not eat his first kill. Over successive mornings he
    is belted, warned not to go north or far away, and hunts farther from the lodge,
    killing named birds later identified as chickadee, Owenhdaen nisedosyoden, pigeon,
    and partridge. The passage ends as he encounters a creature called Shanoonsdehon.'
  language: English
  quote_policy: summarized
