canonical_text:
  quote: ''
  summary: The passage contains the close of one tale and the beginning of tale 101.
    In the first, Morning Star denies having promised help to a little old woman;
    water rises over an island to the top of a pine tree, and lake inhabitants eat
    her, while a man and his young wife live happily. In tale 101, a young woman marries
    a stranger, goes to his cabin, sees his brothers cook and eat human remains, receives
    warning and aid from a spring-side stranger, leaves a moccasin to answer in her
    voice while her husband is underground, and escapes by repeated arrow flights
    while her husband and his dog pursue her by scent, including across a lake. The
    helper finally reveals himself as a Djondjongwen.
  language: English
  quote_policy: summarized
