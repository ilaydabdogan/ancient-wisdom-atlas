canonical_text:
  quote: These are the essential songs which mankind shall sing.
  summary: The passage describes Mother Bean sending beans to another land, a singing
    maiden rejecting animal suitors because of their foods, accepting a man associated
    with corn, and instructing mankind in planting, harvest gratitude, and the Corn
    dance songs. It then begins a separate tradition in which people near a river
    hear the Bean-Woman singing downstream.
  language: English with Seneca terms and names
  quote_policy: quoted
