canonical_text:
  quote: ''
  summary: Doonongaes encounters knife-bearing boys, throws them over a precipice,
    then pursues an elusive laughing man who appears and disappears near cliffs and
    trees. After Doonongaes falls asleep under a tree, the man cuts his throat with
    a flint knife and Doonongaes dies. His blood runs down the precipice, alerting
    people below, who climb up, identify him as their great chief, and organize efforts
    to make him alive again by building a fire and sending parties for a white pebble,
    a fisher-skin pouch, distant advisers, and the killer. A later party sent toward
    Doonongaes's lodge stops at a lake, eats raw fish, and is challenged by Skahnowa
    over the lake's ownership.
  language: English
  quote_policy: summarized
