canonical_text:
  quote: ''
  summary: A younger sister in a lodge accuses her brother of abusing her, but he
    says that his identical-looking friend has visited her because he wants to marry
    her. The friend repeatedly enters after the brother leaves and struggles with
    the sister. The brother arranges tests involving scratches and a skin robe, then
    hides near the lodge and catches his friend attacking her. He kills the friend
    with an arrow. The brother and the sister hide the body in a grave under the fireplace,
    rekindle the fire over it, and plan to appear as husband and wife to mislead a
    woman expected to arrive.
  language: English
  quote_policy: summarized
