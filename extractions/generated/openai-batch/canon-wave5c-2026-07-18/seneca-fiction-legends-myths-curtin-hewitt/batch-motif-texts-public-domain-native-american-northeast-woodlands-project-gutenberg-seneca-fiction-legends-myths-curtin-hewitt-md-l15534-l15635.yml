canonical_text:
  quote: ''
  summary: A hunter returns to his mother with meat while concealing his wife and
    child in the woods. His wife gives moccasins, directs him in using a stretching
    boat, and warns that if he marries another woman he will lose her and his hunting
    orenda. After resisting once, he later marries a beautiful stranger. His meat
    disappears, hunting fails, and the new wife starves. He returns to the woodland
    cabin, finds it empty with worn moccasins and ash signs, and follows signs left
    by his children until he reaches another cabin where his first wife recognizes
    him.
  language: English
  quote_policy: summarized
