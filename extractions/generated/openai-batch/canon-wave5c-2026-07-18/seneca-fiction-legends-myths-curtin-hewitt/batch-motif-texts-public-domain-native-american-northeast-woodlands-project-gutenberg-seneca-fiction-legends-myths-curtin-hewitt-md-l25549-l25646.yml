canonical_text:
  quote: ''
  summary: A living widow continues along her husband's death trail. She passes panther
    guardians by giving them pheasants, receives gourds and instructions from a passageway
    warder, and meets the Mother of Ghosts in a strawberry field. In the Mother of
    Ghosts' lodge, ghosts dance while the widow hides. The Mother of Ghosts captures
    the husband's ghost in a gourd and sends the widow back with instructions for
    restoring his life to his body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman follows the trail of her husband while carrying two pheasants and
    remembering the instructions of two men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Couchant panthers guard the way of death and the dead; the woman throws a
    pheasant to each and passes them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the third passageway, a male warder questions why the woman is there when
    she is not dead, and she explains that she is following her husband's trail.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The third passageway warder gives the woman a closed gourd for bringing back
    her husband's soul and a small gourd bottle containing fat or oil of man.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The warder tells her to rub oil on her palms at a large strawberry field and
    hold her palms toward an elderly berry picker, the hostess of that country.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman reaches the strawberry field, anoints her palms, hails the elderly
    woman, and gives the two gourds to the Mother of Ghosts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Mother of Ghosts says she will put the woman's husband into the empty
    gourd bottle and leads the widow to her lodge near the strawberry field.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the lodge, the Mother of Ghosts conceals the living woman under bark and
    warns her that the ghosts who come nightly to dance would flee if they discovered
    her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ghosts gather in the lodge; the hostess sings and beats the drum used in the
    Great Feather dance, and the husband's ghost eventually enters and joins the dancing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dancing ghosts smell a human being, but the hostess explains away the
    smell and keeps them from leaving.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After one failed attempt, the hostess seizes the husband's ghost, compresses
    him into the gourd, closes it with its tendon stopper, and gives the gourd and
    oil bottle to the living woman.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: At the first passageway, a warder instructs the woman to seal the openings
    of her husband's body with fine clay, rub oil over the body, and uncork the gourd
    containing his life into his mouth so that it reenters and reanimates him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The first passageway warder gives the woman two roasted pheasants as sops
    for the couchant panthers and sends her on her homeward journey.
  category: action
  evidence_refs:
  - ev:10
