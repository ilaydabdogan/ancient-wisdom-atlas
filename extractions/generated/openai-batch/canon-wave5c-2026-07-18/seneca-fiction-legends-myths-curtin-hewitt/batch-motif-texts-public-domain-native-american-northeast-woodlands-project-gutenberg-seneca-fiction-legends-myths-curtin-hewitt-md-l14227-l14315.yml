canonical_text:
  quote: ''
  summary: Haiwanenqgwi travels among several peoples to invite their chiefs or leaders
    to a great council at Broken Land. He changes form, encounters ground-dwelling
    people, a man standing in the air, and the Djisdaah chief. Tsodiqgwadon then sends
    him westward inside a living arrow to Gaasyendiet'ha, who lives beneath a red-hot
    flint rock at the edge of the Blue Sky where it meets the waters. After Gaasyendiet'ha
    accepts the invitation and returns him by arrow, Tsodiqgwadon names additional
    distant island peoples still to be notified.
  language: English
  quote_policy: summarized
