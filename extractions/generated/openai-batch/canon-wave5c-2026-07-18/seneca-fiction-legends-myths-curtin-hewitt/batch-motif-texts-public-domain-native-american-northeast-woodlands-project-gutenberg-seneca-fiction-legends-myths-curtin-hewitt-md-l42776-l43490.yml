  summary: A man is told that a sitting place is filthy. An older man prepares a fine
    sitting place for his nephew, wiping away rubbish and spreading out skins, including
    deer and bear skins. The nephew is named Hat'hon'das. Two women or maidens are
    present. A marriage-related exchange is mentioned in unclear glosses. Later, a
    container or gourd with oil or fat is used; the man pours it onto his head and
    hands and anoints or soaks his hair repeatedly. The two maidens look on and wonder.
    His head or hair becomes very fine in appearance, and two feathers, described
    with red and blue coloring in the glosses, are noted at his forehead or head.
