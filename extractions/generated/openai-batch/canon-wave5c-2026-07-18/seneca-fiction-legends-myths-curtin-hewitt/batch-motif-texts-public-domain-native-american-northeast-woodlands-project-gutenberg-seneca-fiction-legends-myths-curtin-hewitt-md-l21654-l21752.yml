canonical_text:
  quote: Rise! lest the tree fall on you.
  summary: A found man is adopted by three brothers and their man-eating uncle under
    a promise of protection and is named The-Found-One. During hunting, the three
    brothers disappear after encounters with a gray-haired old woman in a clearing
    who turns them into bones. The-Found-One follows instructions to summon Dagwanoenyent,
    the Great Head, by arrows and a stone platform. Dagwanoenyent pursues and kills
    the old woman, then directs The-Found-One to assemble the bones and push against
    a hickory tree while calling for the dead to rise. The brothers and the man-eater
    come back to life, and the man-eater vows never to eat humans again. The selected
    range also begins a separate medical-note section after the myth.
  language: English
  quote_policy: quoted
