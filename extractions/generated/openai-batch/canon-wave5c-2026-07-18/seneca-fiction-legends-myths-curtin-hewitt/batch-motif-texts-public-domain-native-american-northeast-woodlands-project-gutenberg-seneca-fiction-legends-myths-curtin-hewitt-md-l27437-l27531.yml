canonical_text:
  quote: ''
  summary: A rough ball player is punished by being thrown into a tree trunk and later
    released with an admonition. The same chief-like resident greets Dehaenhyowens'
    traveling party, explains that repeated prayer to the Master of Life enabled their
    safe arrival in the elder country, and offers to restore or refit their lives.
    One traveler volunteers; the host strips bark from a tree, lays him on it, takes
    apart and cleans his flesh and bones, rejoins them, removes what is unfit for
    the country, and tells him to arise. The renewed traveler feels better and proves
    his new life by catching a deer. The remaining three travelers undergo the same
    renewal, and the party is led toward a large lodge presided over by an old woman.
  language: English
  quote_policy: summarized
