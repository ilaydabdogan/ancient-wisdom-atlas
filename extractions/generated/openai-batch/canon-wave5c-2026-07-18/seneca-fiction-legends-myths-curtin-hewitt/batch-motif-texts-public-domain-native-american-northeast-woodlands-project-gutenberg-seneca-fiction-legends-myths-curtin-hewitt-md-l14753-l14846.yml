canonical_text:
  quote: ''
  summary: 'A slain chief’s dismembered body is placed in a circle during an enemy
    victory rite; when a man strikes the body pieces, they rejoin, the chief rises,
    kills five enemies, and falls apart again. The enemy then avoids striking the
    dead and beheads him. Survivors of the chief’s side return home and decide to
    fight only defensively. A new tale begins: an aged grandmother and her grandson
    live alone in a forest lodge. She gives him his dead uncle’s bow and arrows, teaches
    him to hunt, repeatedly forbids him to go north, feeds him parched corn, and explains
    that they are the only family left after sorcery. The boy hunts birds and then
    larger game called Ohsoon to the south, but eventually wonders about the northern
    prohibition and turns northward.'
  language: English
  quote_policy: summarized
