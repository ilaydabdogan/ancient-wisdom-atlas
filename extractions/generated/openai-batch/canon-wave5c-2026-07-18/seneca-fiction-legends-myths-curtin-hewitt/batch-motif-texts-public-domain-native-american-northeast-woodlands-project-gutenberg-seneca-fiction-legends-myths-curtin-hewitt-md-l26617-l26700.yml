canonical_text:
  quote: ''
  summary: 'An old uncle says a dream has commanded him to barter with his nephew
    before midday or suffer calamity. In the morning, after the nephew kindles a fire,
    the old man sings and comes to exchange; the nephew delays and finally offers
    a fat bear liver, completing the exchange. The youth then visits the skull of
    another uncle, who instructs him to reverse the ordeal: make a great fire, imitate
    the old man’s dream behavior, and require the old uncle to divine the dream’s
    desired object by midday. The object is a small round squash growing beneath the
    old uncle’s bed, prized because the old man believes his life depends on it. That
    night the youth builds a large fire, groans at midnight, throws himself on the
    fire, scatters firebrands, is struck on the head with a war club, and then announces
    the dream-commanded test to the old uncle.'
  language: English
  quote_policy: summarized
