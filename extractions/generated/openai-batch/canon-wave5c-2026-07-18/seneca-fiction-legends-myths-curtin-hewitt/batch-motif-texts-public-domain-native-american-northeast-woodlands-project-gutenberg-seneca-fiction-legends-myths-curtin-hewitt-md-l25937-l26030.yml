canonical_text:
  quote: ''
  summary: A boy, later addressed as Hodadenon, leaves his elder sister and travels
    south along a dangerous path. At successive camping places he finds old fire remains
    and forked rods bearing food left by earlier travelers, sets up his own bread
    offering, and survives the night. He encounters and shoots an enormous cuckoo
    at a hollow tree marked by many arrows. At another camp he is pursued at night
    by a small dog with a rattle and a woman’s voice directing it; he climbs a slanting
    tree over water and shoots the dog. In the morning he removes the dog’s rattle,
    casts the body into the stream, and continues until he meets a man who greets
    him peacefully.
  language: English
  quote_policy: summarized
