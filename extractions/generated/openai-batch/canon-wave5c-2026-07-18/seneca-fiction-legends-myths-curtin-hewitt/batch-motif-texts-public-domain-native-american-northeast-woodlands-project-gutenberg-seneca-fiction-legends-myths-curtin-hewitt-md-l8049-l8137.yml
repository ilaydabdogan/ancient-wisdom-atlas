canonical_text:
  quote: ''
  summary: Hodadenon survives attacks and moves through a series of encounters. Sticks
    from his sister's woodpile become people and kill Odjineowa men, whom he burns
    in their lodge. A wizard uncle on a broken tree stump sends a rain of spears,
    which Hodadenon counters by making his lodge stone; later Hodadenon approaches
    through a mole's body and burns the uncle's stump and woods, after which an owl
    emerges from the uncle's head. Hodadenon then wins a head-wager dice game against
    another old-man uncle using bird-eye dice and beheads him. He next meets Dagwanoenyent,
    who proposes hide-and-seek; Hodadenon becomes a flea and hides in Dagwanoenyent's
    hair while Dagwanoenyent searches, flies above the clouds and to an island in
    the sea, and fails to see him before the passage breaks off.
  language: English
  quote_policy: summarized
