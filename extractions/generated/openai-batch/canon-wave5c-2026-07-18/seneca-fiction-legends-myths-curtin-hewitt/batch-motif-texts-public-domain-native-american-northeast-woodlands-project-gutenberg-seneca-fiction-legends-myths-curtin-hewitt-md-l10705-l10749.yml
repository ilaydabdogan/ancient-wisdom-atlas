canonical_text:
  quote: ''
  summary: A frightened settlement faces the approaching Stone Coats. Two friends
    hide on the leeward side of a riverbank and meet a smiling stranger who says Hawenniyo
    sent him to save the people. The stranger fights the Stone Coat army alone amid
    terrible noise and rising steam, then returns to say all the Stone Coats are dead.
    He identifies himself as Lightning, or Hinon, Thunder, appointed by Hawenniyo
    to open ways for people on earth and to act against sorcery. After he leaves,
    the two men find only piles of stone, which the passage explains as the source
    of stones found over the earth. The passage credits two transformed young men
    with saving the forefathers and preserving teaching from the upper world. A new
    tale begins with men preparing for a hunting expedition and refusing to take a
    young man considered foolish and unlucky.
  language: English
  quote_policy: summarized
