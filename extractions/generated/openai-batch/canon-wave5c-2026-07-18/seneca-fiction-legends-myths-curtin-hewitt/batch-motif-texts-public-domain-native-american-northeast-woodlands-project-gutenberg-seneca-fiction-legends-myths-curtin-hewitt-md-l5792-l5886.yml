canonical_text:
  quote: ''
  summary: A youth receives instructions for using a size-changing dog and for restoring
    his severed mother with oil from a live wild turkey gobbler. He retrieves the
    lower part of his mother's body from a public lodge with help from the Chief of
    the Crows, returns with the body part and turkey, and restores his mother. The
    next tale begins with hunters leaving an orphaned infant in a hunting lodge; a
    chief sends a man who turns into a bear to check on the child, while the child
    survives by keeping fire and cooking meat until supplies are nearly gone.
  language: English
  quote_policy: summarized
