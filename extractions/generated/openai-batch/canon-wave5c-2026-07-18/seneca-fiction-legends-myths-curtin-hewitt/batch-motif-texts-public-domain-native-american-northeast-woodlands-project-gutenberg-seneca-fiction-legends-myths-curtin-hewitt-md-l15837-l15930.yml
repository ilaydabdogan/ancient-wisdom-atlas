canonical_text:
  quote: ''
  summary: The passage opens with the end of a separate episode in which a hunter
    rescues a lost, speechless child from a tree and returns him to his father. The
    main titled tale, “Genonsowa,” tells of an old grandmother, Dagwanoenyentgowa,
    whose granddaughter is swallowed by a female Genonsgwa and whose grandson is carried
    away on the Genonsgwa’s back. The boy clings where the Genonsgwa cannot reach
    him. The grandmother tracks them, pursues in the form of a Whirlwind, exposes
    the Genonsgwa’s hiding place, frees the boy, breaks the Genonsgwa’s stone clothing
    with rocks, and kills her. She tells the boy that he too has Dagwanoenyentgowa
    power. The Genonsgwa’s people learn of the death and prepare revenge, while the
    grandmother returns to recover the swallowed sister by burning tobacco on a small
    fire and fanning smoke toward the dead Genonsgwa.
  language: English
  quote_policy: summarized
