canonical_text:
  quote: ''
  summary: The passage describes seasonal hunting movements from pigeon grounds to
    deer grounds, winter food and clothing preparation, and nature signs used to forecast
    weather and direction, attributed to the Porcupine clan of the Wan'dat tribe.
    It then begins a Seneca shaman's legend on the origin of Bear songs and dances,
    in which a small boy is taken from a hunting camp by a strange man to a lodge
    with two boys, where he observes their foods and play.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After summer pigeon hunting, a leader urges the people to move in early autumn
    to lands where deer can be found fat and fit for food and skins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people make temporary deer-hunting camps, and skilled hunters lead small
    parties that kill deer with bows, arrows, and traps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Venison is dried for winter food, and deerskins are tanned into buckskin for
    leggings, moccasins, and other garments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people judge the severity of approaching winter by the thickness of muskrat
    winter-home lining.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people also judge winter severity by deerskin and hair condition and by
    bears making leaf winter quarters early in autumn.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Much hail in autumn and winter is taken as a sign that the next season will
    bring much fruit and many nuts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A traveler lost in the forest uses moss on the side of a tall straight tree
    trunk, assumed to be the north side, to get bearings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A damp rock is used to forecast rain the next day, and active ducks and geese
    in water are used to anticipate three days of showers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Porcupine clan taught these signs and omens to neighbors and was noted
    for wisdom and foresight.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Seneca shaman introduces a legend about the origin of Bear songs and dances
    and their manifestation in relation to human beings seeking happiness.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the legend, a woman at a temporary hunting camp is left to keep the fire
    and cook while hunters are away, and her nearly two-year-old boy plays outside
    the lodge.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: While the woman sleeps, a strange man comes to the boy, says he has come for
    him, and takes him to his lodge so that his own children may play with him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At the strange man's lodge, two small boys are instructed to love and be kind
    to the visiting child and not to hurt, annoy, or vex him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The visiting boy plays with the two boys and observes that the household eats
    nuts, honey, berries, corn, and especially values chestnuts and honey.
  category: action
  evidence_refs:
  - ev:13
