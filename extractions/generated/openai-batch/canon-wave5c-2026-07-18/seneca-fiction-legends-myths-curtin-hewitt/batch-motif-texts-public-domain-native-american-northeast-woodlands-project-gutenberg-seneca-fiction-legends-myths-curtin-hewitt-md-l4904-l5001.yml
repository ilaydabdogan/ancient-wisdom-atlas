canonical_text:
  quote: ''
  summary: Hat'hondas refuses several invitations to stop, then stays overnight with
    a stranger who steals his magical outfit, wounds him with hickory bark, and goes
    to claim credit at an eagle-shooting contest. Hat'hondas is found by his niece,
    helped by his sister, and healed after the bark is removed. He shoots the eagle
    from afar, but the stranger snatches it and claims the promised youngest daughter.
    The daughter resists the false husband, while the stolen magical items and attendants
    appear weak and the impostor fails a test of thaumaturgy. At home, Hat'hondas's
    uncle reads a red sky as a sign of his nephew's danger and later partial relief.
  language: English
  quote_policy: summarized
