canonical_text:
  quote: ''
  summary: A party traveling above the sky and clouds observes the Thunder men's loud
    movement accompanied by heavy rain and overflowing waterways. The Thunder men
    return the human beings safely to earth and tell them that former inhabitants
    have moved to another settlement. Before separating, the Thunder men instruct
    the humans to remember them and others charged with duties by making native tobacco
    offerings with thanksgiving. The Thunder men return to their cloudland lodge.
    Dehaenhyowens and his companion find the old home overgrown, travel east toward
    a village, and ask residents about a remembered expedition of thirty warriors
    who followed the path of the Sun and never returned.
  language: English
  quote_policy: summarized
