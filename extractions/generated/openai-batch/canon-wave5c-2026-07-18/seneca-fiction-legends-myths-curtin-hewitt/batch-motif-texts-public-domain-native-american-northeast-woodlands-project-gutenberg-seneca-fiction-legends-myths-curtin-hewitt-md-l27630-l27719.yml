canonical_text:
  quote: ''
  summary: The band of Dehaenhyowens stays in an old woman's lodge. A bow thrust into
    a deep spring pool carries a scent that alerts the men of the lodge to an uncanny
    creature. The men go to the pool, provoke thunder and lightning while attacking
    it, and later identify the slain Otkon as the Great Blue Lizard. The next morning
    the old woman initiates preparations for a customary seasonal task of making growing
    things on earth mellow and moist, consulting an unnamed principal person and setting
    corn husks on fire around a lake shore.
  language: English
  quote_policy: summarized
