canonical_text:
  quote: ''
  summary: A man flees from his wife after she has become a powerful Flying Head.
    Dogs, an uncle, aunts, mothers, their children, and an invisible brother help
    delay or fight the pursuer. The Head kills and devours some defenders, but is
    finally killed when boiling bear fat or oil is thrown on it. The Head is then
    used as a ball in a game played by wild beasts. Afterward the dog reports that
    the wife is dead, and the invisible brother directs the man westward toward his
    children before disappearing.
  language: English
  quote_policy: summarized
