canonical_text:
  quote: ''
  summary: 'After a huge animal is burned, an elder instructs an assembly to take
    portions of its charred bones and make fetishes for hunting or other named purposes.
    An ill woman is carried home safely. A new tale begins: an uncle, Ongwe Hangesha,
    lives with his nephew Gajihsondis. The uncle repeatedly secures the boy in the
    lodge and instructs him to shoot at a bear''s foot and call out a name only when
    he hits it. Wondering how his uncle eats, the boy secretly watches at night and
    sees the uncle enlarge or prepare a small kettle, cook mush from scrapings of
    an unknown object, eat, then shrink and hide the kettle and contents again.'
  language: English
  quote_policy: summarized
