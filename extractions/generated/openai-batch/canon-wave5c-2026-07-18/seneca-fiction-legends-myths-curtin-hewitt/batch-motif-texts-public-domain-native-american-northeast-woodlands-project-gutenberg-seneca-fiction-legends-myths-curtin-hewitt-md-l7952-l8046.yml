- id: obs:1
  text: Hodadenon shoots an animal identified by his sister as Osoont, a turkey; he
    tells the animal not to break his best arrow, and his sister carries, dresses,
    and cooks it.
  category: sequence
  evidence_refs:
  - ev:1
