- id: obs:3
  text: Hodadenon finds tracks that fit his feet, follows the trail, shoots a game
    animal, and Yenyent^hwus identifies it as Djoeaga, a raccoon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yenyent^hwus makes corn bread to eat with raccoon meat, skims oil from the
    cooking meat, and rubs the oil into her hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On later days Hodadenon goes farther than before and kills animals identified
    by Yenyent^hwus as Onogengowa, a deer, and Ghiniagwaihe, a bear; she carries and
    processes the meat while giving him feet to carry.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
