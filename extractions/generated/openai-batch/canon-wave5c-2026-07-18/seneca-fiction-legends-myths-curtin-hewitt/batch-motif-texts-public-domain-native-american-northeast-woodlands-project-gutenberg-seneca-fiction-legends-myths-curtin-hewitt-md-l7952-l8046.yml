canonical_text:
  quote: ''
  summary: Hodadenon repeatedly hunts animals farther from home while his sister Yenyent^hwus
    plants, warns him not to go north or far from the lodge, identifies the animals,
    carries and prepares the meat, and uses animal oil. After killing turkey, raccoon,
    deer, and bear, Hodadenon goes toward a pleasant northern clearing, spies naked
    Odjineowa men dancing in a lodge, flees when they threaten him, and plants many
    sticks at the clearing edge, asking them to fight the men with clubs.
  language: English translation with Seneca terms and names
  quote_policy: summarized
