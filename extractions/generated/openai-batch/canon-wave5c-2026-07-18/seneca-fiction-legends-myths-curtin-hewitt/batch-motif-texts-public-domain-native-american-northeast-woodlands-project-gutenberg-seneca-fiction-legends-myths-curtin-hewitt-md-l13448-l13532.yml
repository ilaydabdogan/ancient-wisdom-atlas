canonical_text:
  quote: ''
  summary: Doonongaes refuses attempts to make him marry the chief's daughter. The
    daughter comes to the widow's hut, cries, and the crying spreads to Doonongaes,
    the widow, the granddaughter, and the chief. By morning Doonongaes's tears have
    become wampum, which he says can be strung and given to a sad person to restore
    well-being. The chief offers him the chiefship, but Doonongaes refuses, citing
    his rank in magic power. He later seeks a poor 'Shabby Man' as a substitute husband
    for the chief's daughter.
  language: English
  quote_policy: summarized
