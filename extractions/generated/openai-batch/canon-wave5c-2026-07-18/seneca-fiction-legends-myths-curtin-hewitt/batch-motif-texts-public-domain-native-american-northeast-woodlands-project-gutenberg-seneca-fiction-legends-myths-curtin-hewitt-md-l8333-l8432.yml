canonical_text:
  quote: ''
  summary: Hodadenon enters a Long Lodge where Hotgoendaqsais is tied to a post and
    burned with firebrands, producing wampum from his eyes. Hodadenon identifies the
    captive as his brother, warns allies to stay away, magically puts the wizards
    to sleep, rescues his brother, seals the lodge, and makes it become flint and
    red-hot so the wizards die. Animals emerge from the heads of the slain wizards.
    Hodadenon reunites Hotgoendaqsais with the old woman, destroys remaining maneaters
    and their lodges, then gathers bones of prior victims near a hickory tree and
    brings them back to life, correcting mismatched limbs.
  language: English
  quote_policy: summarized
