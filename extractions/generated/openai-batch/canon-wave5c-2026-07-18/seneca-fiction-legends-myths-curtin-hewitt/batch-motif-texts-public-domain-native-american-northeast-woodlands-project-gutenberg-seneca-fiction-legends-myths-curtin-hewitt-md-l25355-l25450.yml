canonical_text:
  quote: ''
  summary: A boy with an enchanted arrow provides game for himself, his sister, and
    their adopted grandmother. After he grows into a young man, he enters a hunting
    contest without knowing that the chief's daughter is the prize; his arrow helps
    him and his friend kill far more deer than the other hunters. Envious young men
    lure him to a remote island and abandon him. He survives the night by climbing
    a pine tree, diverting pursuing dogs with two partridges, and avoiding a flesh-hunting
    Son of the Winter God/Ood. In the morning he produces a tiny canoe from his body
    and enlarges it with enchanted arrows.
  language: English
  quote_policy: summarized
