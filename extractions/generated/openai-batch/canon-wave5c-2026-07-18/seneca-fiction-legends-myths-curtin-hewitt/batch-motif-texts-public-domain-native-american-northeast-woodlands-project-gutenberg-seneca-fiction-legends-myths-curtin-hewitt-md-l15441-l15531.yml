canonical_text:
  quote: ''
  summary: The passage opens with an editorial note about unidentified figures and
    Whirlwinds, then begins the story titled “The Moose Wife.” A young hunter leaves
    his mother to hunt in the forest for a year. In his cabin, an unseen helper repeatedly
    prepares food and domestic tasks. He watches and discovers a beautiful young woman,
    who says she came because he lacked a woman’s aid and asks to be his wife. They
    marry, have a son, and prepare for his promised visit to his mother. Before he
    leaves, she warns him to remain faithful. She then brings him to a river, produces
    a tiny canoe from her bosom, makes it expand into a large canoe, and they load
    it with meat.
  language: English
  quote_policy: summarized
