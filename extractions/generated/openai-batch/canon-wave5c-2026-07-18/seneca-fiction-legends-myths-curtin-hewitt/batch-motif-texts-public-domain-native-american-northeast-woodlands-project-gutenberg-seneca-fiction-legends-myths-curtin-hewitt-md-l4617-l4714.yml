canonical_text:
  quote: ''
  summary: 'An impoverished grandmother and small grandson live in a forest lodge.
    The boy disobeys a prohibition by entering a hidden room of clothing, weapons,
    lacrosse equipment, and a drum. He learns that a far-eastern devourer, Deadoendjadases,
    has carried off and eaten their kin. The boy sets out eastward, reaches a strawberry
    clearing with a long lodge and a skin-man sentinel, borrows a mole skin to approach
    underground, and gains secret information from the sentinel Hadjoqda: Deadoendjadases
    and his three witch sisters keep their hearts outside their bodies, under the
    wing of a loon in a lake beneath a bed. The boy devises a deception with false
    wampum, disguise, and an elk distraction to take the hearts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman and her very small grandson live together in a lodge in a large
    forest; both are described as feeble and poor.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman gathers firewood daily, felling and cutting trees by burning,
    and weeps as she goes to and from the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the grandson asks why she cries, the old woman says she had many brothers
    and relatives but they are now dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman opens a door and leads the boy into a room he has never seen
    before, containing clothing, weapons, ball clubs, balls painted with head-symbols,
    and a drum.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman tells the boy not to remain in the room and not to touch anything
    there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: While the old woman is away for wood, the boy enters the forbidden room, beats
    the drum, takes a ball and lacrosse club, and plays outside; the ball flies east
    to a large clearing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy repeats visits to the mysterious room for several days, but one day
    beats the drum loudly enough that the old woman hears him from the forest and
    scolds him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The grandmother says a man far away in the east, named Deadoendjadases, carries
    off and devours people and has eaten their friends and relations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy asks for four pairs of moccasins and says he will fetch the relatives
    back; the grandmother refuses while weeping but prepares him for the journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy travels east for many days and nights to a broad forest clearing with
    a large strawberry patch, a long lodge oriented north-south, and a person like
    an inflated human skin guarding the field.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy calls a mole, asks to borrow its skin, removes his garments, reduces
    his size, enters the mole skin, and travels underground toward the skin-man sentinel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the boy promises to liberate the skin-man Hadjoqda and restore his flesh
    body, Hadjoqda tells him the secrets of the clearing and its inhabitants.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Hadjoqda says Deadoendjadases goes around the world seizing and killing people
    to bring home as food, and that three witch sisters live with him, preparing human
    flesh and pounded green corn.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hadjoqda says Deadoendjadases and the three sisters do not have hearts in
    their bodies; their lives are elsewhere.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The hidden lives are described as four hearts under the right wing of a loon
    swimming in a lake beneath a bed in the corner of the lodge; squeezing the hearts
    makes the owners faint, while crushing them kills the owners.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The boy gives Hadjoqda false wampum made from reed and strawberry juice, instructs
    him to use it as an excuse, and plans to disguise himself as Deadoendjadases,
    feign illness and blood-spitting, drive elks into the strawberry patch, and take
    the hearts while the sisters respond to the alarm.
  category: sequence
  evidence_refs:
  - ev:10
