canonical_text:
  quote: ''
  summary: A young man traveling east is enticed down from a raccoon tree by a young
    woman despite remembering his grandfather's warning. She tells him stories until
    he sleeps, carries him in a bag through the air, deceives or tests him at a familiar
    fishing place, then carries him to a narrow cliff beneath a mountain where other
    men lie trapped and partly eaten. He invokes a Great Spider remembered from a
    dream; the spider weaves a rope, enabling him to climb up and rescue the living
    captives. He later finds the woman living with her mother, proposes marriage,
    learns that the mother ordered the abduction, and begins life in their lodge,
    where the mother-in-law feigns pain and the daughter instructs him to strike her
    with a corn pestle.
  language: English
  quote_policy: summarized
