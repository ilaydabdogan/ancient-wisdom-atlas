canonical_text:
  quote: ''
  summary: After returning from an expedition, a chief summons the people to the Long
    lodge and recounts how his war party encountered numerous Genonsgwa with stone
    garments. After a challenge to fight in a valley, the chief offers native tobacco
    on a fire and prays for guidance. At midnight a voice gives instructions involving
    a bear as a signal. When the Genonsgwa enter the valley, cliffs and forests collapse
    on them. The chief identifies the helper as the Master of Life, who commands them
    to make peace with all peoples and bury their weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The returning warriors arrive home, and the chief summons all the people,
    including children and women, to assemble in the Long lodge for a council.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief tells the assembly that the expedition had gone to distant regions
    intending to kill any people they might find.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The war party sees numerous people whose garments are of stone, with the garments
    set against nearby trees while the people sleep.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: One sleeper challenges the chief and appoints a fight at midday in the bottom
    of a deep valley, with each side entering from opposite sides.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief casts native tobacco on a fire in a sacrificial prayer, asking the
    being who completed the structure of their lives for aid, vision, dream, or advice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At midnight a speaker says he has come to aid them and instructs the chief
    and his men to lie above the valley, watch the opposite side, shout when a bear
    runs along the opposite cliff, flee a short distance, and look back.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Genonsgwa advance noisily, and their chief sings a war song saying that
    no one has the power to overcome him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The cliffs on both sides of the valley, with forests growing on them, are
    upheaved and fall into the valley on the advancing Genonsgwa; after the breaking
    of trees and limbs, all becomes silent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief identifies the helper as the Master of Life, who told them to return
    home, avoid such enterprises, make peace with all tribes, and bury war weapons
    deep in the ground.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief asks the assembled chiefs to consider the matter because the party
    does not know what the chiefs will decide.
  category: speech
  evidence_refs:
  - ev:7
