canonical_text:
  quote: ''
  summary: The passage recounts Ot'hegwenhda hiding from and following a giant Djieien
    Spider to a sunken lodge, receiving instructions from an animate fetish, killing
    the Spider by splitting its hidden heart with an animated tree limb, finding and
    restoring his father, burning the lodge and seeing a sandpiper emerge, then setting
    a medicine-plant trap at a crossroads where the skeleton of Djainosgowa eats a
    blossom and falls apart.
  language: English
  quote_policy: summarized
