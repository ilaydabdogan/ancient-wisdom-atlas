candidate_motifs:
- id: motif:1
  label: tears transformed into wampum
  taxonomy_refs: []
  basis: The captive’s tears become wampum beads during torture and are gathered by
    the people.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain why the tears become wampum or assign a broader
    ritual function.
- id: motif:2
  label: transferred pain during foot-in-fire action
  taxonomy_refs: []
  basis: When the friend and then the little nephew put a foot into the fire, one
    sister and then the other scream in extreme pain.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The text gives the sequence but does not explicitly state the mechanism
    connecting the feet in the fire to the sisters’ pain.
- id: motif:3
  label: magical sleep followed by fiery destruction of enemies
  taxonomy_refs: []
  basis: The boy and grandmother command sleep; after the captive is freed, the boy
    commands the lodge to become red-hot flint and those inside are burned.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The fire affects a single lodge, so broader fire-destruction taxonomy
    should not be assumed.
- id: motif:4
  label: deceptive fox visitors torment an elder
  taxonomy_refs:
  - trickster_boundary
  basis: Foxes knock at the uncle’s door using kinship address, and one fox enters
    to throw ashes in the old man’s face before being caught.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage shows animal deception and boundary-crossing at a doorway,
    but it does not explicitly label the foxes as tricksters.
- id: motif:5
  label: warning not to sleep followed by serpent intrusion
  taxonomy_refs:
  - serpent
  basis: The husband warns the woman not to sleep in the daytime; when she sleeps,
    a rattlesnake disappears into her body.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: This is a warning-violation pattern, but the warning is not framed as
    forbidden knowledge.
- id: motif:6
  label: internal serpent causing lethal marriages and expelled by healer
  taxonomy_refs:
  - serpent
  basis: After the rattlesnake enters the woman, later husbands die after marriage;
    Hinon’s treatment causes a dead snake to drop from her body.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The text implies but does not fully explain the causal relation between
    the snake and the later husbands’ deaths.
- id: motif:7
  label: waterfall descent and rescue by an under-Falls dweller
  taxonomy_refs:
  - death_rebirth
  basis: The woman disappears over Niagara Falls, is taken from the water by Hinon
    who dwells under the Falls, is healed, and later returns to her mother alive.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The woman is not explicitly said to die, so the death-rebirth taxonomy
    is only a cautious fit.
- id: motif:8
  label: pregnant return from Hinon’s dwelling
  taxonomy_refs: []
  basis: After living with Hinon, the woman is far advanced in pregnancy, is returned
    to her mother’s field, and gives birth to a boy.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage does not explicitly state the child’s father or characterize
    the child as miraculous.
