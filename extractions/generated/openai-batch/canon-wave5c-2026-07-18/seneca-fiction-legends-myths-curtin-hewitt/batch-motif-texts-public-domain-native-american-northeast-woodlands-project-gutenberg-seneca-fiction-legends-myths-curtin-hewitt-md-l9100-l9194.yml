canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which a captive is tortured,
    his tears become wampum, his younger brother rescues him, and enemies in a lodge
    are burned after a magical command; it then begins the tale titled “Hinon Saves
    a Woman from Suicide,” in which a rattlesnake enters a sleeping woman’s body,
    her later husbands die, she attempts to go over Niagara Falls, Hinon rescues and
    heals her under the Falls, and she later returns pregnant and gives birth to a
    boy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man tied to a post smiles when he sees his brother, then is burned
    with firebrands and cries; his tears turn into wampum beads that people gather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a second torture attempt, the little brother gives one moccasin to
    his friend and keeps the other; when feet are put into the fire, two sisters scream
    in pain at different moments.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy and grandmother speak a command that everyone should sleep soundly;
    while all are asleep, the boy cuts down his brother and takes him outside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy walks around the lodge and commands it to become flint and red-hot;
    the lodge becomes so, and those inside are burned up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the uncle’s lodge, foxes have tormented the uncle by knocking at the door
    and saying that they have come as nephews or kin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fox enters the uncle’s lodge, runs toward the fire to get ashes to throw
    in the old man’s face, and is caught and hung up by the boy with a bark rope.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second tale, a married couple travel to hunt, build a brush lodge,
    and the husband repeatedly warns his wife not to sleep during the day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband returns early, finds his wife asleep, sees a rattlesnake among
    the skins on which she lies, and sees it disappear into her body through her pudendum
    when he tries to pull it away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After returning to the village, the first husband separates from the woman;
    two later husbands are found dead on the mornings after their marriages to her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The first husband later explains to the woman’s people that the rattlesnake
    disappeared into her body after she ignored his warning not to sleep in the daytime.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ashamed and troubled after hearing the explanation, the woman goes in a canoe
    above Niagara Falls, moves into the river, covers her face, and disappears over
    the brink.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hinon, who dwells under the Falls, takes the woman from the water, carries
    her home, gives her medicine, raises and lowers her by the shoulders, and a dead
    snake drops from her body.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Hinon roasts the dead snake on hot coals and eats it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The woman lives with Hinon for some time; because she cannot eat his food,
    he brings corn from her mother’s field and roasted squash from her mother’s fireside.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: When the woman is far advanced in pregnancy, Hinon orders companions to take
    her only to her mother’s field; she is reunited with her mother and later gives
    birth to a boy.
  category: sequence
  evidence_refs:
  - ev:12
