    run up trees until his nails become long and sharp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the mother bear sees the boy high in a distant tree, she scolds the cubs,
    restores the boy's nails to their original state, and later the boy sleeps between
    the cubs and their mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In winter, the bear takes the boy and cubs into a tall hollow tree where they
    remain; she sleeps much of the time but warns them to keep still when a hunter
    is near.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: From an opening in the hollow tree, the mother bear draws out a two-pronged
    object from her pocket and moves it through the hole while a hunter approaches
