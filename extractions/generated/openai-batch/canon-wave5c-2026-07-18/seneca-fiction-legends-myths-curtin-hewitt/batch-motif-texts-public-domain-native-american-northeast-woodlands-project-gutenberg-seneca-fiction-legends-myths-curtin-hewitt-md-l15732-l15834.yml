canonical_text:
  quote: ''
  summary: An opened blocked place reveals Porcupine and her human grandson. Porcupine
    asks the gathered animals to take the boy because her food is gone, tests possible
    caretakers by their food and danger responses, and chooses the old mother bear.
    The bear raises the boy with her cubs, who teach him bear-like climbing skills
    and alter his nails. In winter they live in a hollow tree, where the mother bear
    warns against hunters and uses a two-pronged object or bough to protect them.
    Toward spring the protection fails; she says the bears must separate from the
    human child, and the cubs leave the tree one by one while the boy hears arrows
    and sees burdens fall as the cubs continue onward.
  language: English
  quote_policy: summarized
