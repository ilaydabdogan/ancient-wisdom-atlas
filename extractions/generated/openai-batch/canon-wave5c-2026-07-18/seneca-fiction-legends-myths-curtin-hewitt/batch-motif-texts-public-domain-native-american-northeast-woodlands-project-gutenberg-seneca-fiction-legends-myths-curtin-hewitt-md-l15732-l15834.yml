- id: obs:3
  text: The assembled animals, including birds, announce willingness to care for the
    child; Porcupine thanks the birds but dismisses them because she does not think
    the boy can live on what they provide.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf and the deer present food but, when asked about danger, each shows
