canonical_text:
  quote: ''
  summary: A band led by Dehaenhyowens hides packs of scalps before attempting to
    pass beneath a sky that rises and falls. Four members cross safely, but the fifth
    is crushed. The surviving four proceed into a brilliantly lit, abundant new country,
    where flowers provide light and plants and animals are unusually fine. They encounter
    a human settlement gathered for a lacrosse game, reaffirm their compact to follow
    the path of the sun, and watch the game, including an admonition against a player's
    violent conduct.
  language: English
  quote_policy: summarized
