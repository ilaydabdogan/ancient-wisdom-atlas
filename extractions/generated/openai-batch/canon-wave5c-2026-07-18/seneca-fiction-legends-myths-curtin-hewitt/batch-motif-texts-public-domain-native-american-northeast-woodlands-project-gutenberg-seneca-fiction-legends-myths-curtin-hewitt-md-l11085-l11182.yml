canonical_text:
  quote: ''
  summary: A woman follows a husband into a rock opening that seems to be a lodge.
    After he leaves, she explores and is warned by an old man that her husband is
    a great horned snake. From a high place she watches rising water and the horned
    snake approach the rocks; thunder and lightning destroy the rocks, and the old
    man says the husband is killed. The old man and two companions purify her by giving
    her substances to drink and rub on her body, after which snakes and foul creeping
    things leave her body. The old man identifies himself as Hinon, instructs her
    about marriage and testimony, returns her home, and later gives directions about
    tobacco offerings. The passage then begins another tale in which a younger brother
    discovers that a woman is taking game from his elder brother.
  language: English
  quote_policy: summarized
