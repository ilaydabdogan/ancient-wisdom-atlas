  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old man says the woman's husband is killed, says there are three of them,
    and says she must be purified before she goes home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old man gives the woman something from a small vessel to drink and rubs
    the rest on her back near the loins; three large snakes then pass from her reproductive
    organs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man says she has been saved from evil orenda, and gives her another
    beverage that causes her to vomit worms, ants, maggots, and other foul creeping
    things.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The three men say she is thoroughly purified and free from the evil power
    of her husband and his people, and they tell her that her home is seven days'
    journey away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old man identifies himself as Hinon, tells her to marry one of her own
    people older than herself, and tells her to report her experiences to her friends.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The three men take her home, and while traveling it seems to her that they
    are flying through the air.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Her people find her lying in the lodge the next morning, rejoice at her return,
    and hear her account of becoming the wife of a great horned snake and being rescued
    by Hinon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Hinon gives her a basket, tells her to fill it with native Indian tobacco,
