  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman is frightened when she sees the horned snake and knows it is her
    husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the snake's head is inside the rocks, a thunderclap is heard, lightning
