canonical_text:
  quote: ''
  summary: Hodadenon leaves a rested camp, visits Deagahgweoses, an old tobacco-maker,
    and obtains tobacco after a violent confrontation in which he kills him. Hodadenon
    sends the tobacco westward to his sister Yenyent^hwus, burns Deagahgweoses's lodge,
    returns to revived companions, and leads them home. He tells his sister that he
    has brought relatives back to life and saved their brother from wizards, then
    creates lodges by marking spaces and wishing them into being. He notes that his
    father, mother, and sister, killed at the chestnut trees, are still absent and
    secretly intends to seek them. About a year later, he again hears a recurring
    sound and decides to check whether Yeqsinye Honwande is keeping an agreement concerning
    eating human flesh.
  language: English
  quote_policy: summarized
