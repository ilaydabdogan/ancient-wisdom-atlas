canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a bride returns to her own
    clan, reports her husband''s connection with a mysterious woman and child, is
    advised to separate from him, and the hunter is shunned. It then begins the tale
    of the seventh son: an old man in a forest lodge has seven sons and a daughter;
    after six sons and then the father vanish by going toward a forbidden hunting
    region, the youngest son and his sister depart in winter, the boy''s tiny dog
    becomes large and is dismissed, and the siblings find successive lodges with embers
    and broiled venison.'
  language: English
  quote_policy: summarized
