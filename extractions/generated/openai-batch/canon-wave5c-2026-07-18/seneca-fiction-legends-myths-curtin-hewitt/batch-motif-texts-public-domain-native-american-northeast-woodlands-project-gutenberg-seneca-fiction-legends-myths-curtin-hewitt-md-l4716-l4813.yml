  confidence: high
  cautions: The passage describes a temporary assumed form but does not explain the
    mechanism or origin of the ability.
- id: motif:2
  label: Life or power held in external hearts
  taxonomy_refs: []
  basis: The hearts are hidden with a loon; squeezing them makes their owners faint,
