- id: motif:1
  label: Assumption of another being's form to enter a hostile lodge
  taxonomy_refs:
  - shapeshifter
  basis: The lad assumes the exact form and manner of Deadoendjadases and enters the
    lodge without being recognized by most sisters.
  evidence_refs:
