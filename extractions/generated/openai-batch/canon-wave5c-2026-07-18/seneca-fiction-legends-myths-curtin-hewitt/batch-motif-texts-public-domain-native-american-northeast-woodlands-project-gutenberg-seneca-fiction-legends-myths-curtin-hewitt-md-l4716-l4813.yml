canonical_text:
  quote: ''
  summary: A youth uses disguise to enter the lodge of Deadoendjadases and his sisters,
    takes their hearts from a loon hidden in a lake under a bed, and kills the sisters
    and the man-eater by striking the hearts against a rock. He gathers human bones
    near the rock, causes many people to rise, restores Hadjoqda, and establishes
    settlements around the strawberry patch. The passage then begins a new tale about
    an uncle and nephew living in the forest.
  language: English
  quote_policy: summarized
