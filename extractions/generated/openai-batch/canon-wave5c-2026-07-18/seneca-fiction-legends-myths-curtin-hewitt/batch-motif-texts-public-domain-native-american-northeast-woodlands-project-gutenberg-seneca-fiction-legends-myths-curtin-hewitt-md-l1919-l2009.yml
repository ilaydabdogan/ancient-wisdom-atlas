canonical_text:
  quote: ''
  summary: A child left alone in a forest lodge hears a man asking for tobacco. The
    child later finds an emaciated man in the lodge loft, who explains that tobacco
    is held by Seven Sisters and their old mother beyond a dangerous path guarded
    by lethal trees, rattlesnakes, rock guardians, Blue Herons, and a singing human
    skin. The boy decides to go for the tobacco, passes a transformed tree unharmed,
    and placates successive guardians with chipmunks, lichens presented as tobacco,
    and fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child is left alone in a lodge in a forest and hears a voice asking whether
    there is tobacco and saying that it would like to smoke again.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child initially forgets to search for the speaker, then resolves to search
    the lodge to understand the talking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy finds a loft in the lodge and discovers a man lying there who is described
    as so lean that he looks like dried bones covered with skin.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The emaciated man says that the only thing he desires is tobacco because he
    wants to smoke again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man says tobacco is found in a frightful and difficult place where Seven
    Sisters and an old woman, their mother and tutor, dwell; he says they are immune
    to normal orenda or magic power and have the tobacco.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The route to the tobacco is described as a sequence of deadly obstructions:
    a lethal Pine Tree, two Rattlesnakes, two S''hagodiyoweqgowa at a rock opening,
    two alarm-giving Blue Herons beyond a river, and a tree bearing a dried human
    skin that sings a warning.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy states that the dangers will not prevent him from going after the
    tobacco, and he starts the next morning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the first obstacle, the Pine Tree with magic power has been transformed
    into a hickory tree; the boy rushes past it and finds that nothing has touched
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the Rattlesnakes, the boy kills two chipmunks, gives one to each snake,
    and asks them not to enchant him in exchange for the gift.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the rock opening, the boy cuts up lichens, presents them to the two S'hagodiyoweqgowa
    as tobacco, asks not to be enchanted, and passes them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At the river, the boy catches two fish, gives one to each Blue Heron, asks
    them not to give the alarm, and passes on.
  category: action
  evidence_refs:
  - ev:9
