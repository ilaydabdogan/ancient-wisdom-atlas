canonical_text:
  quote: ''
  summary: Two brothers living together in a village lodge go to a distant forest
    to hunt deer. The fleet-footed younger brother repeatedly overtakes and kills
    deer, despite an elder brother's warning not to boast about his speed. On the
    second return to camp, the youth encounters a figure he takes to be a man standing
    in a roadway-like opening in the forest. The figure challenges him to a two-day
    race with their lives wagered and detailed rules for camping, marking the stopping
    place, and resuming. The youth accepts and is told to inform his elder brother
    and return at midday.
  language: English
