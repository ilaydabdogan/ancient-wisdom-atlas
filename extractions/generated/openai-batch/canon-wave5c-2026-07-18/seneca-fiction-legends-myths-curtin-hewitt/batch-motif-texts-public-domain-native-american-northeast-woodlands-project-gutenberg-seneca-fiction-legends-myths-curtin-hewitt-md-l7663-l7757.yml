canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which two girls return to Big Earth, a
    man discovers rotten logs and ants in his bed, and the girls later live happily
    with Big Earth''s son and their mother. It then begins the tale of Hinon and Seneca
    warriors: a hungry Seneca war party follows a bear into a den, where an old man
    receives tobacco, renews several warriors through dismemberment and restoration,
    and sends them to test their orenda before confronting an enchanted rock containing
    a horned man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two girls entered the lodge, put down a basket before the old woman Big Earth,
    and Big Earth was pleased; after the dancing, the people went home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dancing man went home, thought he saw two girls in his bed, smoked or prepared
    to smoke, chewed deer tallow, and spat so that it simmered on the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the man undressed and got into bed, he found two rotten logs and a bed
    full of ants; he became angry, scolded his wife, and threw the logs outdoors.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girls lived happily with Big Earth's son, carried packages of bear meat
    and deer meat to visit their mother, and later all lived together at Big Earth's
    son's home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Seneca war party on the warpath against the Cherokee became hungry, saw
    a bear, chased it into its den, and one warrior followed it inside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the den, the warrior no longer saw the bear but instead saw a brisk
    fire and three men sitting around it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eldest man in the den said the bear was one of his men sent to entice
    the warrior, and he asked that tobacco be brought from the Seneca camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next day, the warrior returned with five companions, each carrying a pouch
    of native tobacco, and the old man thanked them for the tobacco present.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After warriors lay down in the den, the old man rubbed one warrior from feet
    to head, dismembered him joint by joint, pounded his bones to jelly, poured the
    result into a bowl, and carried the bowl and another vessel away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old man later called to the warrior, who came out light, fresh, and lithe;
    other warriors then underwent the same process and were renewed.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: When another warrior asked to be transformed, the old man refused and explained
    that there was a world-spanning opening, a great rock, and inside the rock a man
    with enormous horns.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The old man wanted two warriors to crush the rock and kill the horned man,
    but first told them to test their strength in orenda; they shot at a rock and
    an enormous tree, destroying both.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The old man said the remaining companions could stay in the den because they
    would not die there; he also said that he helps his grandchildren, covers trails
    when concealment is needed, and causes rain.
  category: speech
  evidence_refs:
  - ev:11
