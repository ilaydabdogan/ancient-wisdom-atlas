canonical_text:
  quote: ''
  summary: A young warrior, now made chief and called Stone Coat, leads war expeditions.
    Dreams warn him of enemy encounters. In a northern battle he orders a dawn attack,
    fights a large enemy champion, and defeats him by preventing severed flesh fragments
    from rejoining. Later he undertakes a southern expedition, receives another dream
    warning and an owl omen, and is overmatched in a duel with a stronger enemy as
    the passage breaks off.
  language: English
  quote_policy: summarized
