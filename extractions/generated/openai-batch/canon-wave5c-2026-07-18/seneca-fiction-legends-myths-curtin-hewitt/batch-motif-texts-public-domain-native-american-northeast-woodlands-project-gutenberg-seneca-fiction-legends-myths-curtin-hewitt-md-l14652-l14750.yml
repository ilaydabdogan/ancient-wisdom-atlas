  text: After an earlier victory, the young man gains the warriors' and people's respect
    and is made a chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people think of the young man as a Genonsgwa or Stone Coat, although the
    passage says he does not look like one.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a new northern expedition, only thirty volunteers are taken, and women
    prepare provisions for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief dreams that the enemy will be camped nearby the next night and that
    his party should attack at dawn before the enemy attacks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the two camps discover each other, the chief orders his men to form a
    circle around the enemy camp and attack at his war whoop.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large enemy warrior carries a shield to ward off arrows; the chief notices
    that it is about the same size as his own shield.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief and the large enemy warrior fight first with peculiar clubs and
    then grapple.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When either fighter's arm is pulled off and thrown away, it flies back into
    place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief kills the large enemy warrior by tearing off his head and flesh
    and keeping the returning pieces away until they cool and lose their strength.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the northern battle, fifteen of the chief's thirty men remain alive;
    the survivors pile up bodies, cover them with earth, and return home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Later, in the prime of life, the chief asks for one more expedition and forty
    people are made ready to go south.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A dream warns the chief that a very powerful man will be among the enemy and
