  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Near noon an owl comes along the trail, alights on a tree, and says that the
    enemy is near and has come to fight.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Before the southern fight, the chief tells his men to hang up their bundles
