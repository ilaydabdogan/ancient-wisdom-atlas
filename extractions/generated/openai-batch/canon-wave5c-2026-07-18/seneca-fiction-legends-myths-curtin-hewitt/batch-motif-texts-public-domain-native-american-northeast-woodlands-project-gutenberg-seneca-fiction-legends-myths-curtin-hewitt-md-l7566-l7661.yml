    the arrow, the basket was gone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the first pair returned home, the mother sent the youngest and the second
    sister with more marriage-bread and repeated the instruction not to speak to or
    answer any man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same old fellow spoke pleasantly, answered that Big Earth lived in the
    first lodge, then ran ahead and told his wife to move to the other side of the
    fire with her child because he wanted the bread the girls carried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old fellow threw ashes over his wife to make her look old, and the girls,
