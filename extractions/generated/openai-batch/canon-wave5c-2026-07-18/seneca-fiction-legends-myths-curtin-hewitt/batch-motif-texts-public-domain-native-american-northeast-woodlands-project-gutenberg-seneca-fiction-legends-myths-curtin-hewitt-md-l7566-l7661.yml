canonical_text:
  quote: ''
  summary: 'The passage first closes a preceding episode in which villagers with torches
    see an unknown animal, shoot at it, find dogs torn apart, and recover remaining
    meat. It then begins the story of three young women, daughters of Awaeh Yegendji
    or Mother Swan: their mother sends daughters with marriage-bread to Big Earth
    and her hunter son, warning them not to speak to anyone or stop at a lodge. A
    pleasant old fellow on the path first causes a basket to disappear, then misdirects
    another pair of sisters to his own lodge, disguises his wife, denies being called
    Gesagwe, and tries to keep the girls there. The younger sister suspects deception;
    the sisters leave sticks in the bed, escape with the basket, and find the Long
    Lodge where Gesagwe is being sung to and fed corn, and where an attractive woman
    and son sit by the fire.'
  language: English
  quote_policy: summarized
