- id: obs:1
  text: People holding torches saw a terrible animal whose forelegs seemed longer
    than its hind legs; when they shot at it, it disappeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unknown animal had made in one night a journey that took the man two days,
    and the people later found two dogs torn to pieces and most of the meat at the
    camp eaten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman, identified by the story title as connected with Awaeh Yegendji
    or Mother Swan, had three young, good-looking, clever daughters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother wanted venison and bear meat and said the eldest was old enough
    to marry a man who could get meat; she identified Big Earth and Big Earth's handsome,
    successful-hunter son as the destination.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The family made marriage-bread and twenty-four cakes, placed them in a basket,
    adorned the elder girl, and the mother instructed her not to notice or talk to
    anyone and not to stop at any lodge overnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the first journey, a pleasant man with bow and arrows asked the girls to
