canonical_text:
  quote: I have come after you to bring you to our lodge and fire.
  summary: A young man's mother brings a maiden to marry her son and counsels him
    not to mistreat her. After a year the wife gives birth to a strong daughter. In
    autumn the husband, wife, and child travel to his hunting grounds with provisions.
    They establish shelters and fires along the route and at the hunting lodge. The
    husband hunts successfully, brings back deer and other game, and the couple cures
    meat and keeps furs and skins in the lodge.
  language: English
  quote_policy: quoted
