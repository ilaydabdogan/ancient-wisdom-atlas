canonical_text:
  quote: ''
  summary: 'The excerpt closes a Ganyadjigowa and Gaasyendiet''ha episode: Ganyadjigowa,
    believing he killed Gaasyendiet''ha, finds the old man alive, burns his lodge,
    denies responsibility, and is killed by him. It then begins the tale of Hadent''heni
    and Hamigongendat''ha: two shunned young male friends leave their village, endure
    hunger and difficult travel, discover an aerial trail from a hemlock tree, ascend
    to a higher world, meet Kaahkwa the Sun in a lodge, and then enter a second lodge
    where an old woman feeds them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa goes home proud, says he killed the old man who was called magically
    powerful, and plans to see him the next day.
