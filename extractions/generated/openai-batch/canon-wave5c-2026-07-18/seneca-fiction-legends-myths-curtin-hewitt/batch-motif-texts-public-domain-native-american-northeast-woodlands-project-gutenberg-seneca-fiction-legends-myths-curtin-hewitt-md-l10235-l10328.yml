- id: obs:4
  text: Gaasyendiet'ha notices the lodge burning, springs through the fire, questions
    Ganyadjigowa, disbelieves his denial, pounds him to death, and proclaims his powerful
    orenda.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Two young men are described as great friends; because people dislike and shun
    them, they leave their village and go south.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: During travel the young men sleep where dry leaves have fallen, eat evergreens
    and lichens, make bows and arrows, kill small birds, pass out of thick woods,
    and continue through marshy ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a large hemlock tree, one young man climbs and sees a beautiful trail leading
    from the tree through the air; both agree to try it, and the trail feels solid
    as earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young men travel upward without knowing it and reach another pleasant
    world; they continue along the trail instead of stopping for game.
  category: sequence
  evidence_refs:
  - ev:4
