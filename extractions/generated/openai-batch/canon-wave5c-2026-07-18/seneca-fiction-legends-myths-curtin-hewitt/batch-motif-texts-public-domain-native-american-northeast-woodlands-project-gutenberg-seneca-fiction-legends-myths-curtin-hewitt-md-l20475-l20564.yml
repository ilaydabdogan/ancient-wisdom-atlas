canonical_text:
  quote: ''
  summary: A hunter flees from his wife after she becomes an Ongwe Ias cannibal. He
    hides or transforms his dog in a hollow tree, receives food-based aid and a river
    crossing from an old man, and is directed to three aunts. The cannibal wife consumes
    her own body and the lodge stores, pursues him, refuses ordinary food, and is
    destroyed after falling from the old man's neck bridge into a dangerous river;
    her life-containing stomach is chopped by the three aunts. The hunter continues
    onward and meets a young woman gathering fuel.
  language: English
  quote_policy: summarized
