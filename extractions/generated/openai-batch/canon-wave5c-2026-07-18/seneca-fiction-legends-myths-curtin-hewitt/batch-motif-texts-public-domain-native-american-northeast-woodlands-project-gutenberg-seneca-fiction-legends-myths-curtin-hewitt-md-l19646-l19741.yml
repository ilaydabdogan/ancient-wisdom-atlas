canonical_text:
  quote: ''
  summary: Two brothers continue a dangerous journey after defeating an uncle in a
    head wager. The younger beheads the uncle, and the elder uses the head to explain
    tree knots. The brothers encounter a lodge of witches who intend to kill the younger
    brother, but he turns their mallet against them while the elder reaches him underground
    with help from a mole fetish. The brothers burn the lodge, then go to a red river
    for purification; the elder disobeys instructions, sinks, and is rescued and washed
    clean. They then reach a ball-playing village where heads are wagered. The younger
    challenges the chief, commands a spider to weave a web across the ball ground,
    and the elder scores the first point before the passage breaks off.
  language: English
  quote_policy: summarized
