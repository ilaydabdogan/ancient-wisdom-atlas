canonical_text:
  quote: ''
  summary: A strange woman staying in a hunter's lodge displays great strength by
    bringing a whole dead tree for fuel. She warns the hunter's wife that her powerful
    husband is pursuing her, instructs the wife to prepare three burning sharpened
    basswood poles, and fights the husband at the lodge doorway. When the husband
    overpowers her, the hunter's wife uses the poles as instructed, allowing the strange
    woman to strangle him. The strange woman removes the body, thanks the hunter's
    wife, and departs with her child to distant forest kinsfolk. Later the hunter
    returns, and he and his wife leave the hunting camp and travel home to his mother's
    lodge.
  language: English
  quote_policy: summarized
