  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief's daughter tries to keep her husband from touching the pouch, but
    he touches it and declares that he will kill two otters before daylight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At midnight the son-in-law waits by a loop in a stream, kills two otters,
    removes their hearts, roasts them, and eats them before daylight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eating the otter hearts destroys or spoils the orenda of the pouch, and the
    other people return without game; the chief's wife cannot make geese fall dead
    despite calling for them to do so.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The chief says the son-in-law has nullified the pouch's orenda by eating a
