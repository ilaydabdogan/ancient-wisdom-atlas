canonical_text:
  quote: ''
  summary: The passage concludes a chestnut-stealing tale in which a youth uses a
    mole's body to spy on sisters, returns with chestnuts to his hungry uncle, and
    is later aided by the mole as guardian spirit. A note gives a variant involving
    geese, bodily entry into the youngest sister, pregnancy, birth, and mastery of
    chestnuts. The passage then begins a tale of a chief's hunting party, a pouch
    fetish, declared kills, a son-in-law who kills two otters and eats their hearts,
    the spoiling of the pouch's orenda, his abandonment, and aid from a stranger that
    leads him to a bear in a hollow tree.
  language: English
  quote_policy: summarized
