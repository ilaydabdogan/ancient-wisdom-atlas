canonical_text:
  quote: ''
  summary: 'A series of editorial notes explains terms and narrative details: reptile
    hibernation as long fasting; a partridge appellation; a feast pole reaching the
    clouds used by wizards to test visitors’ orenda, including suitors for Partridge’s
    daughter; an eagle-shot incident on such a pole; a woman neutralizing an arrow
    affected by alien wizards; Iroquoian female-kin marriage supervision and possible
    father-right modification; sorcery by reed; names for islands, sky/cloud regions,
    robes, worms, Wind/Whirlwind, Cloud Man, star, and sun/moon orb; and variant numbers
    for the Thunder People.'
  language: English commentary with Seneca/Iroquoian terms
  quote_policy: summarized
