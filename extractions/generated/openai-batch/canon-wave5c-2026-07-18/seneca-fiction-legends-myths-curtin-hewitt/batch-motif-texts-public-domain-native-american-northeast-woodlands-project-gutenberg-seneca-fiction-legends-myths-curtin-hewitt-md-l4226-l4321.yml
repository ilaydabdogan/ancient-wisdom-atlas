canonical_text:
  quote: ''
  summary: 'The passage first concludes a scene in which Haiendonnis uses spittle,
    hand-rubbing, and opposing orenda to lengthen his wife Yenongaa''s hair and neutralize
    her orenda. A new tale begins: an uncle lives in a forest lodge with two nephews.
    The elder nephew has a turkey-skin robe made for the younger, who fits it, looks
    like a turkey, flies into trees, and is called Turkey Brother. When the elder
    nephew reaches marriageable age, the uncle sends him west to seek a wife from
    a chief with three daughters. Turkey Brother insists on accompanying him. The
    uncle outfits the elder nephew with animal-skin robes, finally choosing a panther-skin
    robe with an animate crying hood and singing loon feathers, plus other magical
    equipment and weapons. He warns him about a six-year westward journey, a dangerous
    spring whose water must not be touched, and an old sorcerer-robber whom he must
    ignore.'
  language: English
  quote_policy: summarized
