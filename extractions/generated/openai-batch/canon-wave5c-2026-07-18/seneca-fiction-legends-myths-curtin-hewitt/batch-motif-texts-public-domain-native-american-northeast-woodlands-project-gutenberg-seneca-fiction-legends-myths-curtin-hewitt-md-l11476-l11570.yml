canonical_text:
  quote: ''
  summary: At the first autumn frost, marks on oak leaves are described as the bear's
    blood and oil, prompting a saying that the lazy man has killed the bear. The next
    tale begins with two devoted brothers living alone in the forest. The younger
    brother plans and commands; the elder brother hunts and obeys. The younger brother
    has the elder kill turkeys for feathers and later a skin pouch or robe. He wears
    feathered headgear, sings and dances privately, says he learns songs from birds,
    and eventually instructs the elder to learn his songs because these practices
    will belong to their future people. He establishes feather-wearing as tribal insignia
    and sings a war song.
  language: English
  quote_policy: summarized
