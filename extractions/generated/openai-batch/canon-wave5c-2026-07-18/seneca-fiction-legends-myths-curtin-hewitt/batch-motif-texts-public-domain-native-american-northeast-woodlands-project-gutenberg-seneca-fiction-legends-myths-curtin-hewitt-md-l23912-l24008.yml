canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which Little Burnt Belly confronts
    a cannibal whose life is contained in a bird, kills him, frees a drugged prisoner,
    restores his devoured brothers, and returns to Honenhineb's lodge. It then gives
    the legend of Godasiyo, a woman chief in a primordial time when people spoke one
    language and lived peacefully. A dispute over her white dog divides the people
    on opposite sides of a large river. To avoid violence, Godasiyo leads her adherents
    upstream in birch-bark canoes. At a fork in the river the groups disagree and
    choose different channels; the two canoes supporting the chief's platform separate,
    she falls into the water, and is seen transformed into a great fish. The separated
    people can no longer understand one another, explaining the origin of many languages.
    The final lines introduce a legend about subterranean caverns in ancient Oneida
    country inhabited by tribes of men.
  language: English
  quote_policy: summarized
