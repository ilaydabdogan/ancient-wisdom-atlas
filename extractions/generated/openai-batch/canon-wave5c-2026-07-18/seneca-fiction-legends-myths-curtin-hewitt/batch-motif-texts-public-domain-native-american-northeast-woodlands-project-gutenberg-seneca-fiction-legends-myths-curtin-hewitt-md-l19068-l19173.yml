canonical_text:
  quote: ''
  summary: 'The passage closes a story in which Hatcinondon cooks, paints three scalps,
    finds his Seneca companions, and returns home. It then gives several traditions
    about S''hagodiyoweqgowa: Godiont arranges their healing help for her people through
    prepared food offerings; a man who falsely summons them is punished and the beings
    instruct that masks be made so they may work through them; another S''hagodiyoweqgowa
    accepts tobacco offerings from villagers in exchange for not troubling them; Onondaga
    people locate these beings in a cave and associate them with False Faces. The
    final partial tradition introduces Genonsgwa, a Stone Coat Woman, who frightens
    a hunting family by biting and restoring a child, then says she has come to help
    their hunting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hatcinondon makes a fire near a stream, dresses in garments from slain men,
    cooks and eats a meal, and prepares and paints three scalps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hatcinondon travels until he finds the path and fresh tracks, hears Seneca
    speech near smoke, displays the three scalps on a stick, reunites with his friends,
    and returns home with them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Godiont is described as the principal woman in the village at Dedioitgeon
    and agrees to the S'hagodiyoweqgowa settling there for the benefit of her people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When someone is sick, Godiont calls the S'hagodiyoweqgowa, prepares a pot
    of corn soup or pudding, and the beings treat the patient with ashes and blowing
    before eating the food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man falsely summons the S'hagodiyoweqgowa to a place where no patient or
    prepared food is present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After declaring that they have been trifled with, the S'hagodiyoweqgowa say
    the offender must die, announce their departure, and instruct Godiont to make
    masks like their faces so men can wear them and the beings can work through the
    masks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man who falsely summoned them arrives in a crazed condition, falls down,
    vomits blood, and dies; afterward the people know it is wrong to make fun of the
    S'hagodiyoweqgowa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An enormous S'hagodiyoweqgowa approaches a village, says arrows cannot kill
    him, asks for voluntary tobacco contributions, receives tobacco, and promises
    not to trouble the people if they set aside tobacco for him at harvest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Onondaga people are said to report that S'hagodiyoweqgowa live in a cave among
    rocks and are represented by the Iroquois False Faces or maskers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Genonsgwa story, three men are hunting; one has his wife and small
    cradleboard-swaddled child with him, and the woman and child remain in the lodge
    while the men are in the forest.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The mother returns from a nearby stream with water, hears talking, and sees
    a woman dressed in stone rocking the baby and singing about good eating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Stone Coat Woman bites the child's cheek, restores it by spitting on her
    hand and rubbing the cheek, reassures the mother and hunters, says she came to
    help with hunting, and the hunters thereafter have good luck.
  category: sequence
  evidence_refs:
  - ev:8
