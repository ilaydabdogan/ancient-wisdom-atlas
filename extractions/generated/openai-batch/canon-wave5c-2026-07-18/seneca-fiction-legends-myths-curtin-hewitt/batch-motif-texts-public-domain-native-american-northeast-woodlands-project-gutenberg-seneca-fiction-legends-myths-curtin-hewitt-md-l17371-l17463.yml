canonical_text:
  quote: ''
  summary: The passage ends one tale with Haient'hwus hearing Okteondon's song, an
    elm tree falling, and Okteondon standing grown. It then begins the tale of an
    uncle and nephew who live alone after their people have died. The uncle trains
    the nephew to hunt, warns him not to go north, and gives him a flute that foretells
    the next day's game. The nephew disobeys, goes north, pursues elk in a circular
    path, is stopped by a woman, falls asleep with his head in her lap, and is carried
    away in her basket through the air. His tied hair prevents the first removal,
    but after she unties it she carries him to a river, then an island, and finally
    lays the basket at the edge of a deep ravine as the excerpt ends.
  language: English
  quote_policy: summarized
