canonical_text:
  quote: ''
  summary: A vowed band continues killing villagers and collecting scalps while traveling
    toward the place where the sun sinks. Burdened by scalp packs, they encounter
    a very tall stranger whom they try and fail to kill. The stranger admonishes them
    to cease killing innocent people and warns that they will die if they continue.
    The band reaffirms its vow, crosses a large lake by walking over its surface behind
    a quiet member, and reaches a country at the apparent end of the earth where the
    sky rises and falls and pigeons pass through from the other side.
  language: English
  quote_policy: summarized
