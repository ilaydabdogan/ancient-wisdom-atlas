canonical_text:
  quote: ''
  summary: 'The supplied range first concludes a tale in which a disguised old man
    uses mice to tunnel into a lodge and retrieve a skull, then resumes young form,
    curses a wicked woman''s village with fire, and warns his brother to keep the
    skull unseen. It then begins “The Orphan”: a Seneca orphan living by charity is
    unexpectedly accepted as husband by a rich chief''s daughter, is washed and clothed
    for marriage, joins her brothers on a deer hunt, swings on grape vines instead
    of hunting, is abandoned with his wife, and later shoots a great horned owl while
    his wife grows hungry.'
  language: English
  quote_policy: summarized
