  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Seneca orphan boy lives from lodge to lodge on charity, sometimes sleeping
    by a brush fire and eating what people give him.
  category: setting
  evidence_refs:
  - ev:3
