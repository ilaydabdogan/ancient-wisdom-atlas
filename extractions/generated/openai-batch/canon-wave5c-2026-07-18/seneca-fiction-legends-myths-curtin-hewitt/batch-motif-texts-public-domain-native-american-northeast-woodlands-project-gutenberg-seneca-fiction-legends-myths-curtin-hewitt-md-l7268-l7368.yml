canonical_text:
  quote: ''
  summary: A nephew protected by a mole guardian repeatedly hides underground from
    a furious woman or witch who comes as tempest and whirlwind. The witch kills him
    more than once by lifting the earth, but the mole revives him with breath. The
    nephew travels north, rescues his uncle from beneath a great elm tree, learns
    the witch's path and weakness, kills and burns her, and finally prevents her return
    by burning her body, powdering her bones, and separating the powder in three bags.
    The nephew, uncle, and cousin then live prosperously at the Long Lodge.
  language: English
  quote_policy: summarized
