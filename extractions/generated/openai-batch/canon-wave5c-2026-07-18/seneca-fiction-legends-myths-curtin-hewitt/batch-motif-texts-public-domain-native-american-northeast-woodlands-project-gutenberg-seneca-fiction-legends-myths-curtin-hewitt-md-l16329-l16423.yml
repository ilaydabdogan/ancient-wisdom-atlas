canonical_text:
  quote: ''
  summary: Ot^hegwenhda asks his mother for her orenda to kill old men after learning
    his brothers are dead. She gives him a small slate fetish and says it will let
    him change form. He follows trails, kills a Spider in a dust cloud, reaches a
    lodge containing four old Hadiiades or Blacksnakes, consults the speaking fetish,
    and follows its instructions by using sharp flints from a high rock to burn the
    lodge and behead the old men. After the fire, a Dagwanoenyent flies from an explosion,
    strikes the sky, descends, and is killed by Ot^hegwenhda with white flint. He
    then searches the coals and follows a northwestern trail as the passage breaks
    off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ot^hegwenhda says he wants to see his brothers; his mother replies that they
    are dead, and he asks whether he can kill the old men.
  category: speech
  evidence_refs:
  - ev:1
