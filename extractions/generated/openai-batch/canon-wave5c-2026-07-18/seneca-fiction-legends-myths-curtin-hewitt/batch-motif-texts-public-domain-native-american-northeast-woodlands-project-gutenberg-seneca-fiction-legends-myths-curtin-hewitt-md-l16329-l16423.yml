  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Ot^hegwenhda throws sharp flint fragments at the lodge while saying he wants
    them to be red hot and burn the old men and their lodge; the lodge and surrounding
    forest catch fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: Ot^hegwenhda throws another handful of flints while saying he wants them to
