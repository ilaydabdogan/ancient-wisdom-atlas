  text: The mother says he may be able to kill the old men if he takes her orenda,
    described parenthetically as magic power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hongak woman goes westward to a rough, rocky place and returns with a
    small slate-rock figurine about half the length of her little finger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother tells Ot^hegwenhda to gird on a belt and place the fetish between
    the belt and his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ot^hegwenhda arms himself with a hickory bow and red-willow arrows tipped
    with wasp stings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: The mother says that with the fetish he can do what he likes and change himself
    into whatever form he pleases.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:7
  text: Going northward, Ot^hegwenhda finds a fresh trail and later a cross-trail
    running east and west.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: In an eastern opening in the forest, a cloud of dust moves toward Ot^hegwenhda,
    touches him, and makes him fall from weakness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Ot^hegwenhda sees a long-legged person rushing toward him, climbs a tree,
    and kills the stranger with wasp-sting-pointed arrows; the stranger is identified
    as a Djieien or Spider.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: Another cloud of dust rushes against Ot^hegwenhda, but he gets outside it
    and returns to the trail crossing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: At a lodge, four old brothers named Hadiiades or Blacksnakes sit smoking in
    the four corners.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:12
  text: Ot^hegwenhda places the fetish on his head and asks it what to do in order
    to kill the old men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The fetish answers that he must get on a high rock, call out his name, take
    sharp flint stones, throw them toward the lodge, and say that he wants it to be
    hot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The old men discuss whether Ot^hegwenhda is nearby and whether any of his
    family remain alive besides the old woman Hongak.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: Ot^hegwenhda sits on the lodge with his feet through the smoke-hole while
    one old man looks for him but cannot see him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Ot^hegwenhda shoots arrows down through the smoke-hole into the four old men;
    the arrows pierce them deeply, but the old men are not hurt and do not know they
    were hit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Ot^hegwenhda leaps away, goes into the rock, and calls out his name; afterward
