  quote: he was convinced that the youth had really turned into a turkey
  summary: A wise younger brother associated with a turkey-skin robe warns his elder
    brother that a dangerous woman is coming. The younger brother appears as a turkey
    and deceives the woman, who asks the elder brother to accompany her home. The
    younger brother identifies her as a powerful sorceress and warns against going,
    but the elder brother leaves westward with her. The Turkey Brother later follows
    to a western lodge, observes that the women intend to kill his brother, and promises
    to return and take him away.
  language: English
