- id: obs:8
  text: The hanging skin sang that someone had closed its mouth with a belt of wampum
    and that the pack of chestnuts was going along the edge of the clearing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old woman and her daughters ran back to the skin; the mother snatched
    the object away, declared it was bark rather than wampum, threw it away, and struck
    the skin with her war club.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman saw the chestnut pack disappearing into the forest and called
    for pursuit, saying Gajihsondis seemed to have more orenda than his uncle Ongwe*
    Hanges'*ha' or Human Skin.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Gajihsondis heard the women pursuing him, set down his pack, sat beside it,
    struck the chestnut case with his arrow, and told the women he would sing so they
    would dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Gajihsondis sang of the upper side of the sky and of not being robbed of his
