canonical_text:
  quote: ''
  summary: A boy later named as Gajihsondis deceives a hanging woman's skin that guards
    chestnut trees by giving it a bark object represented as a valuable wampum belt.
    He carries off a bark case of chestnuts. The skin sings an alarm, and the old
    woman with her three daughters pursue him. Gajihsondis sings a song whose orenda
    makes the women dance upward; when he stops singing and departs, their bodies
    fall headfirst to the earth. He returns to his uncle's lodge with the chestnuts.
  language: English
  quote_policy: summarized
