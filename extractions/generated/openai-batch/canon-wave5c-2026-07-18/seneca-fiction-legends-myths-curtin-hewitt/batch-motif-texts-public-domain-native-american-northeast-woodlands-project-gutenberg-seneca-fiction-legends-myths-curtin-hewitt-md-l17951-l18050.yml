canonical_text:
  quote: ''
  summary: An elder brother creates animals and humans from earth and breath, while
    a younger brother repeatedly fails to make humans and produces dangerous beings.
    The elder brother creates a female companion, gives humans blood and pain, institutes
    procreation, hunting, mortality, and a sky afterlife. The younger brother’s monsters
    are mostly confined underground, except S'hagodiyoweqgowa, who remains on earth
    as a helper and healer. The passage ends with good dead going to the elder brother
    in the sky and evil dead going to the younger brother for torment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother forms a deer, wild animals, and a human being out of earth
    and brings life by blowing upon what he has made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother attempts to make a human being, but produces a strange
    ugly creature and directs it to eat the elder brother's human being.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder brother sends a cherry bird carrying a grasshopper leg that appears
    human-like and bloody in order to frighten the younger brother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder brother makes a female companion for the lone human in the form
    of his grandmother, breathes into her, and gives her to the man as a companion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first human pair cut off one arm each; the elder brother restores the
    arms and gives them blood and pain from himself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The elder brother tells the human pair that they will have children, may hunt
    animals for food, will die, and their spirits will go up to him where he will
    live in the sky.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The younger brother creates a man-sized green frog and declares that his creations
    should become eaters of humans, animals, and whatever the elder brother has made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The elder brother sees the younger brother's animals trying to eat the humans
    and animals he made, places those monsters underground, and orders them to remain
    there while the earth remains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The younger brother creates S'hagodiyoweqgowa, a horrid-looking creature,
    and tells him to eat everything the elder brother made.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: S'hagodiyoweqgowa speaks before being placed underground and asks to remain
