canonical_text:
  quote: ''
  summary: Hat'hondas repeatedly reports bird calls to his uncle after waiting for
    pipe smoke. He then hears two airborne women singing that they are going to marry
    Dooehdanegen. The old uncle prepares the lodge and hides Hat'hondas near the ashes,
    but the women bring marriage bread and lie beside Hat'hondas instead. At daybreak
    Hat'hondas has become a vigorous adult man. The uncle instructs him to follow
    the women to a lodge where a sorcerous mother seeks a husband for her daughter
    through an eagle-shooting contest at a large hickory tree. The uncle equips Hat'hondas
    with magical animal-skin garments, a pouch, pipe, sprites, pigeons, wampum-producing
    spittle, and unerring arrows, then sends him eastward. Hat'hondas finds the trail
    quickly and meets a man making a roadside fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hat'hondas repeatedly went to the ravine, heard bird calls, and reported them
    to his uncle only after the uncle lit his pipe and smoke rose from it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After several trips, Hat'hondas heard two women singing that they were going
    to marry Dooehdanegen while they moved through the air toward the uncle's lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The uncle prepared the lodge, smoothed his couch, moved Hat'hondas's bed to
    the corner near the ashes, told him to face away and stay quiet, and dressed himself
    in his best garments with two feathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two women entered carrying marriage bread, looked toward Hat'hondas, and
    at night lay down beside him near the ashes instead of on the uncle's couch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The women smoothed Hat'hondas's hair, fondled him, and spoke pleasant words
    to and about him while the old man remained angry and sleepless.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the women left at daybreak, Hat'hondas awoke as a full-grown, strong,
    fine-looking man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The uncle told Hat'hondas to follow the women and described a mother with
    a noted sorcery name who was seeking a husband for her daughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The uncle described a large hickory tree with an eagle sitting on it as a
    target; whoever brought down the eagle would get the daughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The uncle brought out an outfit of otter, panther, wildcat, owl, and fawn
    skins, described as beautiful and endowed with rare orenda.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the uncle removed the garments, the otter-skin cap became a live otter,
    the panther-skin coat became a live panther, the wildcat leggings became two live
    wildcats, and the owl-skin moccasins became two live owls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Hat'hondas opened the pouch and prepared the pipe, two girl sprites and
    two trick pigeons came out; the sprites brought fire, and the pigeons perched
    on the pipe stem, rustled their wings, and cooed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the uncle's command, Hat'hondas spat, and the spittle fell as a shower
    of wampum beads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The uncle said Hat'hondas would always spit wampum from the pipe and that
    the outfit would always do what it had done.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The uncle gave Hat'hondas a bow and arrows that he said would never miss,
    directed him eastward to a trail and the hickory tree, and warned him not to keep
    company with any man on the road.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Hat'hondas set out, found the eastward trail sooner than expected, returned
    to ask about it, and was told by the uncle to follow it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Near evening Hat'hondas saw a man making a fire by the wayside, and told him
    he was going to shoot at the eagle on the hickory tree.
  category: action
  evidence_refs:
  - ev:7
