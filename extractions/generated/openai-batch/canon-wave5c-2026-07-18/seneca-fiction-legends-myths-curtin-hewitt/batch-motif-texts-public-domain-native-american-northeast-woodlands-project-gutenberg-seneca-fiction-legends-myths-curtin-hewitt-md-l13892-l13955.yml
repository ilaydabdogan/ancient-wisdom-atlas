canonical_text:
  quote: ''
  summary: Doonongaes and Tsodiqgwadon travel east. Doonongaes encounters trackers
    pursuing the Laughing Man, states that he returned to life after death, threatens
    and then leaves an old woman in her lodge, changes appearance with Tsodiqgwadon
    while traveling, and is cured when Tsodiqgwadon extracts a flint knife from his
    neck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two companions leave their victim, travel east, and at midday meet two men
    who had been sent to track the Laughing Man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two trackers say the Laughing Man killed their chief, Doonongaes, and
    that they were sent to track and kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Doonongaes says that when S'hodieonskon dies he comes to life again shortly,
    and says that two days after he died he came to life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Doonongaes tells the trackers that pursuing the Laughing Man is useless, that
    they will not catch him, and that they should go home; the trackers thank him
    for their freedom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Doonongaes asks about his pouch, and Hatkwisdowanen says the chief Hagondowanen
    has it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hatkwisdowanen and his companion start for home, while Doonongaes and Tsodiqgwadon
    continue east and reach a lodge at nightfall.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: At the lodge they hear an old woman singing; Doonongaes proposes running through
    the hut, and Tsodiqgwadon questions the value of chasing people all the time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Doonongaes says people become angry when they see him and try to kill him,
    so he intends to kill all the people he can.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old woman, named Gonyahsgweont and said to belong to the No&-ngwais people
    as printed in the passage, recognizes Doonongaes as S'hodieonskon and says she
    has never chased or harmed him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Doonongaes goes behind the old woman, holds her by the shoulders, catches
    her by the feet, and pulls her out of the lodge while she pleads not to be troubled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: After Tsodiqgwadon advises him to leave the old woman alone, Doonongaes leaves
    her and the two continue on.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:12
  text: When Doonongaes and Tsodiqgwadon meet people, they change themselves to resemble
    those people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The pair are described as magically the most powerful living persons, with
    Tsodiqgwadon superior to Doonongaes and possessing the greatest orenda in this
    world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:14
  text: Doonongaes says his neck has been sore for a long time and connects the soreness
    with having lifted and carried away the lodge of two old sisters named Qwidogwido.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: Tsodiqgwadon says Doonongaes must have been bewitched by the lodge, sees the
    end of a flint knife in his neck, tries to pull it out all night, and draws it
    out at sunrise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: After extracting the knife, Tsodiqgwadon says wizards bewitched Doonongaes
    and that he has cured him for life.
  category: speech
  evidence_refs:
  - ev:5
