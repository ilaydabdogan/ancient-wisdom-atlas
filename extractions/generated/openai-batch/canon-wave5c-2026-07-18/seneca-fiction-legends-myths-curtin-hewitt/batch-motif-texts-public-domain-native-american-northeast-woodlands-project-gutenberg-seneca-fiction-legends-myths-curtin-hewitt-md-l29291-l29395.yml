canonical_text:
  quote: ''
  summary: The supplied passage contains the end of an origin account for White Corn
    and the beginning of an origin account for the Porcupine People or Clan. In the
    first account, a singing woman on a mountain summons a respected old man, instructs
    him that a corn plant will grow where she has lain, disappears after an embrace,
    and the old man later cultivates and distributes the resulting white corn among
    the people. In the second account, neighboring families divide hunting territories
    by solemn compact; a hunter violates the boundary, causing war and near extermination,
    and one survivor flees into a deep cavern where he finds a lit space, a lodge,
    and a woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman apparently on a mountain top continues singing daily, causing anxiety
    among the people and leading chiefs to ask a respected old man to learn the meaning
    of the singing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man first objects that the mountain is steep and he is aged, but after
    deliberation he agrees to go at the chiefs' request.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After a difficult climb, the old man reaches the summit and sees a young woman
    standing near the brink of a cliff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young woman beckons the old man, invites him to share her mat, and says
    she can give him power enabling him to comply with her desire.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The young woman says a plant will sprout where she has lain, that it will
    be a boon and chief food source for the people, that it will be called White Corn,
    that the old man must return in five days to care for it, and that she will die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man draws near and embraces the woman, swoons, and upon recovery finds
    that she has vanished; he believes he has embraced a vision.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After five days, the old man returns to the summit and finds a growing corn
    plant at the place where the woman had lain; he weeds it, adds fine earth around
    its roots, and waters it from a nearby spring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The corn plant matures with three ripened ears of white corn; the old man
    husks them, takes them home, later divides the corn equally among the community,
    and teaches the method of planting and caring for it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The account states that this is how white corn originated among the Tuscarora,
    who shared the seed with neighboring tribes and kindred.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the following account, a numerous people divide hunting grounds and game
    animals by family or clan, establish boundary marks, forbid hunting across boundaries,
    and set penalties for trespass unless recompense is accepted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A hunter deliberately crosses a boundary, kills game in neighboring territory,
    and the act leads to a long bloody war and the virtual extermination of the offender's
    clan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: One man escapes the vengeance, flees into a deep cavern in a rocky cliff,
    passes into a well-lighted open space with a field and lodge, and sees a woman
    emerge from and reenter the lodge.
  category: sequence
  evidence_refs:
  - ev:9
