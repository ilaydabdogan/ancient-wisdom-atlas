canonical_text:
  quote: ''
  summary: A youth revives after an apparent killing, returns secretly to an old man's
    lodge, takes the old man's fighting club and other possessions, receives a small
    white deer into his bosom, is pursued, and kills the old man. He returns to his
    living grandfather, who grieves because the slain old wizard was his brother,
    then shoots the sleeping youth with three arrows. The youth leaves with the animated
    possessions, reaches a village, befriends a similar young man, and accompanies
    him to the place of the great beast, where controlled animals are released to
    roam, increase, and multiply over the earth. The passage then begins a new legend
    about Honenhineh and his younger brothers in a long bark lodge with three fires.
  language: English translation with Seneca terms/interjections
  quote_policy: summarized
