canonical_text:
  quote: ''
  summary: Hagowanen recovers his canoe through Handjoias, who had secretly taken
    it and asks for meat as payment; Hagowanen later does not pay. A Hongak woman
    brings marriage bread from her mother, Hagowanen accepts, and they become husband
    and wife, eventually having ten named sons. Hagowanen later leaves across the
    Big Lake. His sons begin searching for him. The eldest and then Hononhwaes reach
    a lodge with four old men in the corners and are killed. The passage ends with
    the youngest, Othegwenhda, asking to follow while his mother warns him about four
    magical old brothers called Hadiiades, or Blacksnakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Handjoias tells Hagowanen that a man living on an island, one of the Ganyaqden
    people, took Hagowanen's canoe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Handjoias asks for Hagowanen's meat in exchange for recovering the canoe,
    then tells him to roast the meat, keep half, and put the other half outside the
    lodge door for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Handjoias himself had taken the canoe to the island,
    and that he brings it back while claiming the island man almost killed him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hagowanen returns home in the canoe, the bundle of meat regains its natural
    size, and Hagowanen never pays Handjoias for bringing back the canoe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Hongak woman brings a basket of marriage bread and says her mother sent
    her to ask Hagowanen to take her as his wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hagowanen accepts the nuptial corn bread, eats some of it, and the two become
    husband and wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hongak woman bears Hagowanen ten sons, named in order from eldest to youngest.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hagowanen decides that he has many children and must go home again, then leaves
    by canoe across Ganyodaeowanen, the Big Lake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eldest son travels north to look for his father, follows what he identifies
    as a trail like his father's, reaches a cross-trail, and enters a lodge.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Inside the lodge, the eldest son sees four old men sitting and smoking in
    the four corners of the room.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: One old man calls the eldest son his grandson, says he will show him his father,
    takes him by the hair, cuts off his head over a bark bowl, calls him a young game
    animal, and begins quartering the body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hononhwaes, the second son, follows his elder brother despite his mother's
    warning, wearing buckskin hunting clothes and carrying bow and arrows.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the lodge, the old man in the northwest corner invites Hononhwaes to see
    his father; Hononhwaes sees the faces of his father and brother in a bark bowl
    half full of water, and the old man cuts off his head.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Nine of the Hongak brothers go one after another in search of their father
    and brothers, and all are killed by the four old men in the same lodge.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The youngest son, Othegwenhda, asks to follow his brothers, and his mother
    warns that four old brothers on the road are called Hadiiades, or Blacksnakes,
