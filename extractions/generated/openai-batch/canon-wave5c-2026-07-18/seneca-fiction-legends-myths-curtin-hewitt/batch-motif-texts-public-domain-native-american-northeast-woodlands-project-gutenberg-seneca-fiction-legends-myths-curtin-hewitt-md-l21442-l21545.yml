canonical_text:
  quote: ''
  summary: The passage begins with a fragment about debris damming a river into a
    lake beside a mountain. Section 105 then tells of twelve magical hunter brothers.
    A shapeshifting woodpecker-woman decoys the eldest to a rock where another woman
    turns him into bones. Other brothers disappear; one is buried alive until mold
    grows on him. When only the second and youngest remain, the youngest resolves
    to seek their dangerous all-knowing uncle Dagwanoenyent. He prepares hickory bark,
    makes six tree-arrows, finds a living man underground, and begins a northward
    journey by asking a mole to carry him beneath the ground.
  language: English
  quote_policy: summarized
