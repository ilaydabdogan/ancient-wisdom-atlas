canonical_text:
  quote: ''
  summary: The nephew receives instruction and demonstrations involving a manikin,
    pipe, wampum, and an animated duck headdress. He is told how to hunt with one
    of two young women under a prohibition against her looking. While traveling to
    the chief’s lodge, he camps by a fire, where a stranger calling himself uncle
    tricks him, steals his garments and pouch, and goes ahead as an impostor. At the
    chief’s lodge the sisters react differently to the impostor, and his attempted
    public display with the stolen objects fails.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A manikin runs to the fire, brings an ember, and puts it into the pipe; the
    nephew smokes and expectorates wampum on both sides.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feather headdress has a duck on top that droops when unworn, raises its
    head and becomes alive when worn, and calls out when the nephew commands it to
    speak.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The uncle says two young women think of the nephew and will prosper if he
    marries and lives with them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The uncle instructs the nephew to take one young woman hunting; she must lie
    down with her head covered and must not look, while the nephew sings and wild
    animals come to listen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The nephew travels toward the chief’s lodge wearing his uncle’s garments and
    feather headdress, and he camps for the night in the forest near a fallen tree
    and a fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man arrives at the camp fire, calls the young man nephew, says he is traveling
    to the nearby village, and proposes to remain by the fire telling stories.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the young man grows sleepy, the stranger stirs the fire, blows sparks
    toward him, and says that sparks are falling on his clothes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man removes his garments, hides them under hemlock boughs, and uses
    the stranger’s worn robe as a covering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stranger removes his own clothing, puts on the young man’s garments, and
    leaves his own soiled things in their place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narration states that the stranger knew the young man’s destination and
    knew the orenda of the garments and pouch, and had determined to secure them for
    his own use.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the morning the young man finds himself alone, with his garments and pouch
    gone, and decides to wear the stranger’s shabby garments and continue to the chief’s
    lodge.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the old man approaches in the young man’s garments and headdress, the
    sisters at first identify him as the expected man, but the younger sister becomes
    suspicious and moves to the other side of the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The chief summons the people to the public assembly lodge to meet his new
    son-in-law and see him smoke.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The man in stolen garments attempts to demonstrate great orenda, but the duck
    on the headdress hangs limp, the manikin does not move, he lights the pipe himself,
    and he spits no wampum.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
