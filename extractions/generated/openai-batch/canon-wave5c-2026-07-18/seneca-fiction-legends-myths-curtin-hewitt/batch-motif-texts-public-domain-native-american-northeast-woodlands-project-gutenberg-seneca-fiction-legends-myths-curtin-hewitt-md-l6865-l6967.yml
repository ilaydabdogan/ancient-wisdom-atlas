canonical_text:
  quote: ''
  summary: A father watches his wife abuse their son and discovers that she summons
    a bird who becomes her human lover at a dry black ash tree. When discovered, the
    wife beats the husband, burns the lodge, creates a deep snowstorm from ashes,
    leaves the children with a dog, and departs. The father rescues the children,
    instructs the boy to care for his sister and dog and never put the sister down,
    then leaves in pursuit of the mother. Food appears ready for the children and
    dog. During an outing the boy briefly unstraps his sister to pursue turkeys, and
    a bear carries her away. After losing both bear and dog, the boy attempts to die
    by leaping into a great lake, where he is swallowed by a great fish that is later
    caught by two sisters at a fish dam.
  language: English
  quote_policy: summarized
