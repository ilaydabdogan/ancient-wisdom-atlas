canonical_text:
  quote: ''
  summary: Two young men receive warning from the Moon about a dangerous path, ignore
    speaking fruit and other distractions, reach a lodge where an uncle transforms
    and purifies them by separating, cleaning, and reassembling their bones, pass
    a deer-catching test, and then meet a guide sent to conduct them toward a great
    assembly in the upper world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who identifies herself as the Moon is in a lodge sewing skins and
    says Hawenniyo ordered her to make light for people on earth at night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Moon warns the young men that the path ahead is dangerous and tells them
    to be brave, stay on the path, and not heed anything they see or hear outside
    it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: As the young men travel, they see fruit and game; fruit calls out to them
    to stop and eat, but they ignore it because of the old woman's warning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first fruit-place is described as full of witchcraft or enchantment, while
    plums and huckleberries at a second place refresh the young men; animals along
    the path do not harm them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At another lodge, a man who calls himself their uncle says they are going
    to a large assembly and cannot join it unless he transforms them for the upper
    world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The uncle lays out a long strip of bark, has the first young man lie on it,
    blows through his hand on the young man's head, separates bones and flesh into
    heaps, cleans the bones, reassembles them, and blows the skeleton into a man again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second young man is reluctant, undergoes the same treatment, requires
    more cleaning, has more uncleanness removed, and becomes a beautiful young man
    after the skeleton is blown away and restored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Outside the lodge, the uncle tests each transformed young man by telling him
    to catch a deer while warning the deer; each catches the deer and is declared
    ready.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man approaches, calls the young men brothers, says their mission will be
    accomplished, states that their Elder Brother wanted them to come, and offers
    to conduct them to the great assembly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The approaching man says the one in charge of the assembly is the same person
    who made the lower world from which the young men came.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The guide and the young men travel at what seems to the young men incredible
    speed and soon hear a noise like many voices.
  category: sequence
  evidence_refs:
  - ev:7
