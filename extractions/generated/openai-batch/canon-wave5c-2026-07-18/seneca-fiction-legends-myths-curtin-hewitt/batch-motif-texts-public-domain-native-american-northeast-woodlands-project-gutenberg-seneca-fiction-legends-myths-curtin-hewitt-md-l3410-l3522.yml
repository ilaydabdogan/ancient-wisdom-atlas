    into a snake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband arrives at the stream in time to see his wife’s lower parts become
    those of a snake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wife says she must go to the lake into which the stream flows, where she
    must fight a serpent; she says her husband may watch and should burn tobacco for
    her success.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the lake, two serpents fight fiercely, raising their heads above the water;
