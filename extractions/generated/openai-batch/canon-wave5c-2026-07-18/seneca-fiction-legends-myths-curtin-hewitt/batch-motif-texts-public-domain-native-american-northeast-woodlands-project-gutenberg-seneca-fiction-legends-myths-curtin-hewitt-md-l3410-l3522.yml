canonical_text:
  quote: ''
  summary: The passage closes a tale in which a young hunter keeps an animate finger
    taken from a Genonsgwa and later uses it as a hunting guide. It then gives a tale
    explaining chipmunk stripes through a pursuit by an animate skin that is identified
    as a bear. A following tale tells of a wife who eats fish, becomes a snake, goes
    to a lake to fight a serpent, and is later replaced briefly by a dream-instructed
    basswood woman. The passage ends with the beginning of a Crow/Gaqga tale in which
    the traveler steals meat from four hunters.
  language: English
  quote_policy: summarized
