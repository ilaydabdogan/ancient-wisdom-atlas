canonical_text:
  quote: ''
  summary: During a repeated flight-and-pursuit sequence, Turtle helps his sister
    evade S'hagodiyoweqgowa by being dropped near fallen trees, biting the pursuer's
    foot, growing when beaten, swallowing him, and excreting him after two days; the
    pursuer regains consciousness after ten days and resumes the hunt. The young woman
    reaches a lake, sits on a stone, and is caught up with by S'hagodiyoweqgowa, who
    calls her his wife and burns tobacco offerings to stones. A strange man emerges
    from the lake and leads her into the water to a lodge at the bottom of the lake.
    There, Turtle is fed in a basket, emerges after two days as a full-grown man,
    and marriages are formed between Turtle and the strange man's sister, and between
    the young woman and the strange lake-man.
  language: English
  quote_policy: summarized
