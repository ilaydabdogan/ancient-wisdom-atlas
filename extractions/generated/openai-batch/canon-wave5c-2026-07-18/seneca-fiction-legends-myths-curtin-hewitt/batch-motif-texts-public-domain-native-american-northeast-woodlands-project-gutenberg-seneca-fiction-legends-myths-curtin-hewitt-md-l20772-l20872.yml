canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a woman fleeing a man
    and dog is aided by successive lodge dwellers using flint, a net, and a fire barrier;
    the pursuers are finally killed, their hearts burned, and the woman returns home
    with guidance and food. It then begins the tale titled “Gaqga and Sgagedi,” where
    a guarded sister is abducted from a spring, her brother’s dog turns to stone after
    failing to save her, and Gaqga keeps her on a lake island until an unnamed man
    warns her how to escape an attempted killing and meets her with a canoe.
  language: English
  quote_policy: summarized
