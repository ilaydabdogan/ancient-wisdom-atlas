canonical_text:
  quote: ''
  summary: A youth and his uncle begin the custom of seeking the youth's dream word.
    The uncle asks many questions about possible desired objects and foods, but the
    youth refuses to give a clue and rejects each guess while watching the sun approach
    midday. Near the time limit, the youth sings an exchange formula; flames rise
    around the uncle and pursue him until he names the desired fruiting native squashes.
    The youth accepts this as fulfillment, and the two then discuss the rule that
    the dreamed-for thing must be given once correctly divined, while the uncle tries
    to avoid direct surrender by proposing an identical substitute.
  language: English with Seneca terms
  quote_policy: summarized
