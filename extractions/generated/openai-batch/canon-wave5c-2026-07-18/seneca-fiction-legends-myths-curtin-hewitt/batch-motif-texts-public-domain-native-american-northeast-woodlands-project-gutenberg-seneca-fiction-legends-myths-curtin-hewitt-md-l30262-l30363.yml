canonical_text:
  quote: ''
  summary: A young man reaches the old woman's home before her and explains away the
    absence of her daughter-in-law, while owl pets speak accusations about his identity
    and his younger sister. He then flees, following his sister by the dog's track.
    The old woman later discovers, through the speech of the fire, that her son lies
    dead beneath the fireplace with an arrow in his breast. She fortifies herself
    with hickory-nut meat, tests her strength on a tree, becomes a huge bear, and
    pursues the fugitives by their tracks. The young man casts a pigeon feather behind
    him and invokes a vast pigeon roost whose droppings form a world-spanning rampart;
    the bear is blocked, but resumes pursuit when the barrier disappears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman returns home and finds the young man already sitting there;
    he says the daughter-in-law has gone home because food was exhausted and she longed
    for her mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The screech owl says that it is another one, and the horned owl says the young
    man has taken his younger sister as wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman notices that the pets have not behaved this way before; the
    young man tells her to give them meat to quiet them and then leaves for his own
    lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At his lodge the young man prepares to leave, follows his sister along the
    track made by the dog, and becomes very weak after fleeing some distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After two days the old woman finds the young people's lodge empty, and the
    fire says three times that its friend has killed it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman digs up the fireplace and finds her son lying face upward with
    an arrow through the middle of his breast; she laments and vows to kill them before
    returning for his rites.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At her lodge the old woman eats hickory-nut meat from a bark receptacle and
    says she will fortify her body with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman tests her strength on a neighboring tree, first tearing off
    a large part and then, after eating more, tearing the tree into shreds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old woman becomes a bear of enormous size and power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the place where the fugitives' tracks show their direction, the bear says
    they cannot escape even if they reach the end of the earth, and she begins pursuit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the bear places her paws on the young man's track, he reels and staggers
    because of the evil orenda of her body; although two days apart, she rapidly gains
    on the fugitives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man hears the bear threaten that he will die, draws a wild-pigeon
    feather from his fawn-skin pouch, and casts it behind him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The young man invokes an immediate pigeon roost with so many pigeons that
    their droppings form a rampart across the world, half the height of the tallest
    tree; many wild pigeons then alight.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The narrator states that no one could have more orenda than the young man;
    the bear cannot force through the pigeon-dropping rampart and becomes covered
    with filth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The bear runs along the edge of the rampart, rests by the tracks for the night,
    finds the rampart gone in the morning, calls the young man a great wizard, and
    resumes pursuit by pawing his track.
  category: sequence
  evidence_refs:
  - ev:7
