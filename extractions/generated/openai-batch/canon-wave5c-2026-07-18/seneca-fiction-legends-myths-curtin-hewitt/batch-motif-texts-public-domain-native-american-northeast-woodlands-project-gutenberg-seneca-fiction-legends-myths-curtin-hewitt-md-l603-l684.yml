canonical_text:
  quote: ''
  summary: 'The passage quotes and summarizes Curtin on myth-tales: literary masterpieces
    may be shaped by earlier myth; myth-tale heroes were originally not human but
    personified forces of nature; North American Indian tales collectively form a
    creation-myth system for the New World. These tales explain how the present order
    arose through exploits and conflicts among extra-human beings called the first
    people, including elements, animals, birds, reptiles, insects, plants, rocks,
    and other objects, before they became their present forms. The first people initially
    lived in harmony, then gradually changed, came into conflict, and used extraordinary
    powers of perception, thought, wish, and word. Victorious beings could become
    heroes of causes beneficial to future mankind. The passage also states that these
    first people correspond to the earliest gods of other peoples.'
  language: English
  quote_policy: summarized
