canonical_text:
  quote: ''
  summary: Parents of a lost child prepare commemorative food and later return to
    the place of the child’s disappearance for an anniversary meal, setting aside
    a portion for him. On the return journey by canoe, the mother sees the lost child
    on a mountain by the river. The parents recover him; he is frightened, unable
    to answer, and partly covered with fine fur like a bear. At home he gradually
    regains speech and reports that a strange man carried him away to strange people,
    later identified as Bear people, who taught him a message, a ceremony, and songs
    to bring back to his people.
  language: English
  quote_policy: summarized
