canonical_text:
  quote: ''
  summary: Djainosgowa enters Tsodiqgwadon's lodge and carries off Doonongaes. Tsodiqgwadon
    follows, becomes invisible, retrieves Doonongaes, and later drives Djainosgowa
    away by superior orenda. Doonongaes explains that he fought Skahnowa, who had
    taken his lodge, for one month. Tsodiqgwadon and Doonongaes visit Skahnowa, and
    Tsodiqgwadon explains that people with potent orenda die and become alive again.
    Skahnowa yields the lodge. Later Tsodiqgwadon assigns Doonongaes two women to
    live with; Doonongaes feels badly treated and travels south for ten days and nights.
  language: English
  quote_policy: summarized
