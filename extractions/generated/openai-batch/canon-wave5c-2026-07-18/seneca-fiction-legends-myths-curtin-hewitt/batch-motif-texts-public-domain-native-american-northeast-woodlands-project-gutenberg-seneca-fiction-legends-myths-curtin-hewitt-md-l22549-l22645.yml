canonical_text:
  quote: ''
  summary: A young man named Gajihsondis returns with chestnuts, prepares chestnut
    mush, and feeds his starving old uncle, who recovers. The uncle says he had watched
    a branch as an index of the nephew's condition, and the nephew reports that he
    destroyed powerful, evil women. They go to the women's lodge, open bark cases
    of guarded chestnuts, declare the food available to all humans, and scatter it.
    They take down the swinging skin of a woman and the old man restores her to human
    form with orenda. After returning home, the old man says the nephew has reached
    manhood and must undertake a ten-day eastward marriage journey, facing dangers
    and a path-haunting trickster. He anoints the nephew, gives him a human-skin pouch
    containing tools and ritual items, and describes a valley where a woman has a
    tall tree with three mysterious hawks, her daughters; the man who hits one may
    marry her youngest daughter.
  language: English
  quote_policy: summarized
