canonical_text:
  quote: ''
  summary: A young hunter pursues a raccoon through snowy country to a cavern in a
    river bank, passes through a downward passage into a different land, follows the
    raccoon's tracks to an inhabited lodge, and is welcomed by an aged couple. The
    aged man, a noted chief, invites him to a council lodge but warns him to leave
    when dancing begins and to sleep in an elevated hut with the ladder drawn up,
    refusing anyone who asks him to lower it.
  language: English
  quote_policy: summarized
