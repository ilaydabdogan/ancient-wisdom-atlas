  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The eldest daughter, carrying corn bread, sees the fierce-looking Gaasyendiet'ha
    figure, turns back, flees, and loses all the bread from her basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The second daughter passes Gaasyendiet'ha and Panther but screams and flees
