canonical_text:
  quote: ''
  summary: Haiendonnis kills three beings or animals by pointing at them, skins them,
    makes three pouches, and later animates the pouches by command. A reputed witch
    mother sends each of her three daughters with baskets of corn bread to ask whether
    Haiendonnis will marry them. Haiendonnis stations the animated pouches as frightening
    figures. The first two daughters flee and lose the bread; the youngest strikes
    the figures and reveals them as animated skins or pouches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haiendonnis kills Gaasyendiet'ha, a panther, and a fox by pointing his finger
    at them, then skins them and makes three pouches that he hangs in his cabin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haiendonnis commands the pouch made from Gaasyendiet'ha to stand upright,
    and it appears alive before him; he does the same with the other two pouches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A rumor says Haiendonnis has potent orenda or mighty magic power, works good
    for friends and evil for enemies, and is a sorcerer through this potency.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman and her three daughters live near Haiendonnis; the mother is reputed
    to be a great witch and to have moved there because others did not want to live
    near her.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mother and daughters make corn bread, and the mother sends daughters with
