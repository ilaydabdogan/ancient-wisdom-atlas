canonical_text:
  quote: ''
  summary: S'hodie'o'sko' and Ongwe' Hanges'ha' camp by a fire; the older companion
    blows sparks onto Ongwe' Hanges'ha' and denies responsibility. They later arrive
    at a gathering where many people are shooting at a bird or hawk on an old woman's
    tree. The old woman promises her youngest daughter to whoever hits the mark. Ongwe'
    Hanges'ha', described as immune from hostile orenda or enchantment, shoots the
    bird, proves the arrow is his by drawing it out when others cannot, and is led
    to the old woman's lodge as son-in-law. The daughter is described as born with
    a caul and therefore regarded as noble. Ongwe' Hanges'ha' stays with his wife's
    family and later announces a hunt to his brothers-in-law.
  language: English
  quote_policy: summarized
