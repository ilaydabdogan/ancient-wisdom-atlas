canonical_text:
  quote: ''
  summary: A bride sent from the south by her mother supplies a destitute village
    with corn. After the bridegroom's younger brother abuses her and throws her corn
    bread into the fire, she returns to her mother and says that all she brought will
    go back with her. The village corn disappears. The husband then follows his wife's
    trail over surrounding waters toward her home, while the mother-in-law knows he
    is coming, and he eventually reaches a cornfield.
  language: English
  quote_policy: summarized
