canonical_text:
  quote: ''
  summary: A cloven-bodied being named Dehodyadgaowen or Owisondyon is described as
    partly humanlike and partly crystal ice, and his showing of different sides is
    said to bring cold or warm breezes and seasonal change. The lodge members, identified
    with Thunder, take Dehaenhyowens and his party to see a powerful Otkon inhabiting
    trees. The Thunder beings attack the Otkon, which appears as a squirrel, with
    thunder, lightning, and hurricane but fail to kill it. Dehaenhyowens then kills
    it with a knob-headed arrow, prepares its skin, and gives the precious skin to
    the old woman of the lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The figure seen at the doorway has one half of the body like a human being
    and the other half made of crystal ice; a chilling breeze comes from the doorway.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aged matron names the figure Dehodyadgaowen, the Cloven-bodied Man, and
    Owisondyon, Cast or Falling Hail, and says he is principal among those charged
    with duties in the economy of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The matron says the figure's shown side will cause cold wintry days and nights,
    and that at dawn another side of his body will bring a hot breeze.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lodge members say they have paused from labor to rest, that they will
    return the guests to their place of departure, and that the time is what human
    beings call springtime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At morning Dehodyadgaowen calls the sleepers awake; they stretch, yawn, and
    make sounds compared to the voice of Thunder, and a warm breeze arises.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The men of the lodge invite Dehaenhyowens to accompany them to see an Otkon
    inhabiting certain trees; they say it has very powerful orenda and that they have
    long tried to kill it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the tree lair, one host strikes a tree with his club; the being comes partly
    out, and the guests conclude that it is what they call a squirrel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The men of Thunder hurl shots at the being amid thunder, lightning, tumult,
    and hurricane, but fail to hit it; the squirrel moves between trees and returns
    to its lair.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Dehaenhyowens says that it is now his turn to attempt to kill the Otkon, while
    the men of Thunder warn that the being is dangerous.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the tree is tapped, Dehaenhyowens shoots the squirrel in the head with
    a knob-headed arrow and causes it to fall to the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The body is brought back to the lodge; the old woman asks for the Otkon skin
    as a couch robe, and Dehaenhyowens skins, dries, and presents it to her.
  category: action
  evidence_refs:
  - ev:7
