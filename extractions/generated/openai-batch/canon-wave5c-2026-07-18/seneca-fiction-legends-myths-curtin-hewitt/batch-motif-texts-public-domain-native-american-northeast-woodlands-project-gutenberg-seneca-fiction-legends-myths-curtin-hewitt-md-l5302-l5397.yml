canonical_text:
  quote: ''
  summary: A youth uses a wand to make a kettle and its mush grow, revealing that
    he has used up his uncle's rare chestnut food. The uncle explains that only one
    tree bears such chestnuts, owned by seven sorcerer sisters and guarded by an eagle.
    The youth travels toward the sunrise, summons a mole helper, enters the mole after
    magically reducing his size, distracts the eagle with venison, steals chestnuts,
    and escapes underground while the sisters punish the eagle.
  language: English
