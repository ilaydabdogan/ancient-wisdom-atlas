canonical_text:
  quote: ''
  summary: The closing portion of the Hat'hondas tale describes the recovery of Hat'hondas's
    outfit, the exposure of the designated husband as a deceiver, Hat'hondas's marriage,
    animal transformations of his garments, magical production of wampum and food,
    and his return to his uncle after animal impostors had troubled the uncle. The
    passage then begins the story of the Ohohwa people, in which a quarrelsome husband
    and wife receive a visitor, the jealous husband abuses his wife, claims a dream-command
    to hunt a bear, instead spends the day at another woman's lodge, and then pursues
    a Djohkwehyanih woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hat'hondas's niece visits the great witch woman, hears news about the marriage
    situation, and reports it to her mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hat'hondas's sister goes to the great witch woman's lodge early, takes the
    panther-skin coat and other garments, thrusts hickory bark into the sleeping husband's
    back, and returns home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hat'hondas puts on his recovered garments, takes his bow and arrows, goes
    to the great witch woman's lodge, and is joyfully recognized by the daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The designated husband does not appear by noon and is found doubled up on
    a couch, old, miserable, and coughing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: An arrow in an eagle is unlike the designated husband's arrows and like the
    arrows in Hat'hondas's quiver; the people conclude that the old man is a deceiver
    and throw him out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hat'hondas marries the young woman, and in the evening his moccasins, panther-skin
    coat, leggings, and cap become animals when put on or touching the crossbeam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Hat'hondas opens his pouch, two girls and two pigeons emerge; the girls
    bring coals for the pipe, the pigeons perch on the pipe, and his spittle falls
    on a deerskin as wampum beads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hat'hondas hunts and kills many deer, bear, and elk, enough for all the people,
    and sends a supply to his sister.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hat'hondas's sister prepares journey provisions by shrinking deer flesh into
    a small pouch; small portions resume natural size when struck.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: While Hat'hondas is absent, animals come to the old uncle's door and imitate
    a returning nephew's voice; the uncle opens the door and finds foxes, rabbits,
    or other creatures.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The uncle tests the visitor by requiring a hand through a hole in the door-flap,
    tying it with bark string, and preparing to strike; when he recognizes Hat'hondas,
    he lets him and his wife in, and the enlarged venison requires a new storage lodge.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A husband and wife of the Ohohwa people live in a forest lodge, quarrel all
    night, and are pleasant again in the morning.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: A visitor comes at night; the husband leaves as the visitor arrives, and the
    visitor leaves after remarking that he will come another time.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: After returning, the jealous husband scolds and quarrels with his wife, beats
    her, fights with her, says he will get another wife, and later returns with her
    to the lodge after becoming sorry.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: In the morning the husband says his dream spirit told him to kill a large
    bear and return before the dew leaves the grass, but after leaving sight of the
    lodge he spends the day at another Ohohwa woman's lodge.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: On his way home, the husband meets a fine-looking Djohkwehyanih woman, asks
    to go home with her, and pursues her after she says he may do so if he can overtake
    her.
  category: sequence
  evidence_refs:
  - ev:16
