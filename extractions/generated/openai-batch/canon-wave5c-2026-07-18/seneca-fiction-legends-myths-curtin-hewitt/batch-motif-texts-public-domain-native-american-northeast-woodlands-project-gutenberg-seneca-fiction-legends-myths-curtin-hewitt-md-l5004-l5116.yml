candidate_motifs:
- id: motif:1
  label: Recovered magical outfit restores rightful marital identity
  taxonomy_refs: []
  basis: Hat'hondas's garments are recovered, he appears in them, the young woman
    recognizes him, and evidence from distinctive arrows exposes the old designated
    husband as a deceiver.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives the closing resolution but not the earlier full setup
    for how the outfit and false husband came to be involved.
- id: motif:2
  label: Garments transform into animals
  taxonomy_refs:
  - shapeshifter
  basis: Hat'hondas's moccasins, panther-skin coat, leggings, and cap become owls,
    a panther, wildcats, and an otter.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage describes object-to-animal
    transformation rather than a person or animal changing bodily form.
- id: motif:3
  label: Magical production and multiplication of wealth and food
  taxonomy_refs: []
  basis: Hat'hondas's spittle becomes wampum, his hunt feeds the people, compressed
    venison can regain full size, and enlarged venison overfills the uncle's lodge.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: No supplied taxonomy family directly names this abundance pattern.
- id: motif:4
  label: Return to kin after deceptive animal impostors
  taxonomy_refs:
  - return
  - trickster_boundary
  basis: Hat'hondas returns to his old uncle, who has previously been deceived by
    animal callers at the door and therefore tests the returning nephew before admitting
    him.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The return component is explicit; the trickster-boundary taxonomy is approximate
    because the animal callers are not identified as a named trickster figure.
- id: motif:5
  label: False dream instruction as pretext for misconduct
  taxonomy_refs: []
  basis: The Ohohwa husband reports that his dream spirit ordered a bear hunt, but
    the narrative says he instead goes to another woman's lodge and stays all day.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The passage reports the husband's claim and contradictory action but does
    not yet show consequences.
- id: motif:6
  label: Pursuit of a swift other-people woman
  taxonomy_refs: []
  basis: The husband meets a fine-looking Djohkwehyanih woman, asks to go with her,
