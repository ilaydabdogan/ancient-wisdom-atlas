canonical_text:
  quote: ''
  summary: A boy is aided by an unseen friend later identified as Gaha, receives food
    and tactical instructions, kills a bear-form visitor, is taken in by a chief as
    grandson, becomes a swift hunter, ignores a warning not to boast of his speed,
    and is challenged by a great bear to a race. When he falls behind, he thinks of
    Gaha, who carries him ahead in a whirlwind; the boy kills the bear, offers burned
    tobacco to Gaha, and is returned home. The passage then begins a new tale in which
    an old man and a small boy live together affectionately, and the old man prepares
    for a long journey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A night visitor tells the boy that he will not die, promises to be his friend,
    and says that the boy can summon him by thinking of him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy wakes to find wood at his door and meat hanging from a nearby tree,
    then builds a fire and cooks some meat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The visitor warns that a man will come in the form of a great bear and instructs
    the boy to find a knife, go to a spring by a tall hemlock, climb, descend on the
    other side, and stab the bear in the forefoot.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy follows the instructions and kills the bear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The visitor identifies himself as Gaha, says the boy will not be able to see
    him, repeats that he will help if the boy thinks of him, and instructs the boy
    what to say about the bear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Four men bring food to the lodge, find the boy with wood and meat but without
