  summary: In a repeated episode, an uncle requires his pipe to be lit before his
    nephew reports what he has heard. The nephew first reports the hooting of an owl,
    and later reports whispered cries attributed to Tcoktcoii'khwen. Each time, the
    uncle rejects the answer and pours hot coals and ashes on the nephew's head with
    a bark paddle. The nephew laments his condition and says that his uncle has overmatched
    his orenda. The passage begins and ends mid-sequence and includes garbled interlinear
    material before the English narrative portion.
