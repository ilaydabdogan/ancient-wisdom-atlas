canonical_text:
  quote: ''
  summary: A poor hunter, recently married to a young woman who takes pity on him,
    encounters a crying woman with two boys. She says one boy stole and damaged a
    feather and asks the hunter to kill a hawk on a tree and present it to the feather’s
    owner. A terrifying head-like being arrives; the hunter throws the hawk to him
    as instructed, and he is satisfied. The woman is then identified as a panther
    and the boys as cubs; she explains that Dagwanoenyent, her neighbor among the
    rocks, had pursued them over the spoiled feathers. In gratitude, she promises
    hunting aid, and the hunter thereafter kills abundant game. The passage then begins
    a new tale in which a shaman tells his grown nephew to go to the chief’s lodge,
    marry the chief’s two daughters, wear orenda-endowed objects from the shaman’s
    youth, and test his ability with them.
  language: English
  quote_policy: summarized
